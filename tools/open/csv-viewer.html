/* ================= parsing (RFC 4180 state machine; runs in a Blob Worker) ================= */

/* ================= persistence ================= */
function savePrefs() { LS.set("prefs", { fs: prefs.fs, enc: prefs.enc, header: prefs.header }); }
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open("csv-viewer", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function saveLast() {
  try {
    const size = src.bytes ? src.bytes.byteLength : src.text.length * 2;
    if (size > 20 * 1048576) return;
    const db = await idb(); const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put({ name: src.name, text: src.bytes ? null : src.text, bytes: src.bytes || null, t: Date.now() }, "lastFile");
    tx.oncomplete = () => db.close();
  } catch {}
}

  } catch { return null; }
}
