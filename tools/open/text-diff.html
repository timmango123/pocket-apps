"use strict";
/* ================= diff core (also runs inside a Web Worker) ================= */
function CORE() {
  const SEG = (typeof Intl !== "undefined" && Intl.Segmenter) ? new Intl.Segmenter("zh-Hant", { granularity: "grapheme" }) : null;

}
const narrow = matchMedia("(max-width: 759px)");

/* stacked panes: keep the same row index at the top of both panes */
function syncPanes() {
  const A = $("paneA"), B = $("paneB"); let lock = null;
  const topRow = p => { const items = p.querySelectorAll("[data-i]"); const st = p.scrollTop + 26; let lo = 0, hi = items.length - 1, best = items[0];
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (items[mid].offsetTop <= st) { best = items[mid]; lo = mid + 1; } else hi = mid - 1; } return best; };
  const follow = (src, dst) => () => {
    if (lock === dst) return; lock = src;
    const r = topRow(src); if (r) { const t = dst.querySelector(`[data-i="${r.dataset.i}"]`); if (t) { const frac = (src.scrollTop + 26 - r.offsetTop) / Math.max(1, r.offsetHeight); dst.scrollTop = t.offsetTop - 26 + frac * t.offsetHeight; } }
    cancelAnimationFrame(syncPanes.f); syncPanes.f = requestAnimationFrame(() => lock = null);
  };
  A.addEventListener("scroll", follow(A, B), { passive: true }); B.addEventListener("scroll", follow(B, A), { passive: true });
}

function highlight(h, scroll) {

  const els = document.querySelectorAll(`.r[data-h="${h}"]`); for (const el of els) el.classList.add("hl");

/* ---- exports ---- */
function unified() {
  const aL = R.left === "" ? [] : R.left.split("\n"), bL = R.right === "" ? [] : R.right.split("\n");
  const ent = [];
  for (const b of R.blocks) {
    if (b.t === "eq") for (let x = 0; x < b.n; x++) ent.push({ t: " ", s: bL[b.bi + x], a: b.ai + x, b: b.bi + x });
    else { for (let x = 0; x < b.na; x++) ent.push({ t: "-", s: aL[b.ai + x], a: b.ai + x, b: b.bi }); for (let x = 0; x < b.nb; x++) ent.push({ t: "+", s: bL[b.bi + x], a: b.ai + b.na, b: b.bi + x }); }
  }
  // 結尾換行：split 出的最後一個空字串不是真的行；沒有結尾換行的最後一行要標「\ No newline at end of file」
  const aNL = R.left.endsWith("\n"), bNL = R.right.endsWith("\n");
  const phA = x => aNL && x === aL.length - 1, phB = x => bNL && x === bL.length - 1;
  const noA = x => !aNL && x === aL.length - 1, noB = x => !bNL && x === bL.length - 1;
  const fixed = [];
  for (const x of ent) {
    if (x.t === "-") { if (!phA(x.a)) fixed.push({ ...x, nl: noA(x.a) }); continue; }
    if (x.t === "+") { if (!phB(x.b)) fixed.push({ ...x, nl: noB(x.b) }); continue; }
    const pa = phA(x.a), pb = phB(x.b);
    if (pa && pb) continue;
    if (pb) fixed.push({ ...x, t: "-", s: aL[x.a], nl: noA(x.a) });
    else if (pa) fixed.push({ ...x, t: "+", nl: noB(x.b) });
    else if (noA(x.a) !== noB(x.b)) { fixed.push({ ...x, t: "-", s: aL[x.a], nl: noA(x.a) }); fixed.push({ ...x, t: "+", a: x.a + 1, nl: noB(x.b) }); }
    else fixed.push({ ...x, nl: noA(x.a) });
  }
  ent.length = 0; ent.push(...fixed);
  const CTX = 3, out = ["--- 原文", "+++ 修改後"]; let i = 0;
  while (i < ent.length) {
    while (i < ent.length && ent[i].t === " ") i++; if (i >= ent.length) break;
    let s = Math.max(0, i - CTX), e = i;
    while (true) { while (e < ent.length && ent[e].t !== " ") e++; let g = e; while (g < ent.length && ent[g].t === " ") g++; if (g < ent.length && g - e <= CTX * 2) { e = g; continue; } e = Math.min(ent.length, e + CTX); break; }
    const hs = ent.slice(s, e); let ac = 0, bc = 0; for (const x of hs) { if (x.t !== "+") ac++; if (x.t !== "-") bc++; }
    const a0 = hs.find(x => x.t !== "+"), b0 = hs.find(x => x.t !== "-");
    const as = ac ? a0.a + 1 : hs[0].a, bs = bc ? b0.b + 1 : hs[0].b;
    out.push(`@@ -${as},${ac} +${bs},${bc} @@`); for (const x of hs) { out.push(x.t + x.s); if (x.nl) out.push("\\ No newline at end of file"); } i = e;
  }
  return out.join("\n") + "\n";
}
