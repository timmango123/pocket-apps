}

const $ = (s) => document.querySelector(s);

const LOCAL_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } })();

// ---------- time zone math (Intl only) ----------
const dtfCache = new Map();
function dtf(tz) {
  if (dtfCache.has(tz)) return dtfCache.get(tz);
  let f = null;
  try {
    f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
  } catch (e) { f = null; }
  dtfCache.set(tz, f);
  return f;
}
function supported(tz) { return !!dtf(tz); }
// wall-clock parts of instant t in tz
function partsAt(tz, t) {
  const f = dtf(tz); if (!f) return null;
  const o = {};
  for (const p of f.formatToParts(new Date(t))) if (p.type !== 'literal') o[p.type] = +p.value;
  const h = o.hour % 24;
  const wall = Date.UTC(o.year, o.month - 1, o.day, h, o.minute, o.second);
  return { y: o.year, mo: o.month, d: o.day, h, mi: o.minute, s: o.second, wd: new Date(Date.UTC(o.year, o.month - 1, o.day)).getUTCDay(),
    offset: Math.round((wall - Math.floor(t / 1000) * 1000) / 60000), dayNum: Math.floor(wall / 86400000) };
}
function offsetMin(tz, t) { const p = partsAt(tz, t); return p ? p.offset : null; }

// ---------- formatting ----------
const pad = (n) => String(n).padStart(2, '0');
function fmtHM(h, mi, withAp = true) {
  if (settings.fmt === 12) {
    const ap = h < 12 ? '上午' : '下午'; const hh = h % 12 === 0 ? 12 : h % 12;
    return withAp ? `<span class="ap">${ap}</span>${hh}:${pad(mi)}` : `${ap} ${hh}:${pad(mi)}`;
  }
  return `${pad(h)}:${pad(mi)}`;
}
function fmtPlainHM(h, mi) { return fmtHM(h, mi, false); }
function fmtDiff(min) {
  if (min === 0) return '同時區';
  const sign = min > 0 ? '+' : '−'; const a = Math.abs(min); const h = Math.floor(a / 60), m = a % 60;
  return `${sign}${h ? h + ' 小時' : ''}${h && m ? ' ' : ''}${m ? m + ' 分' : ''}`;
}
function fmtUtc(min) { const sign = min >= 0 ? '+' : '−'; const a = Math.abs(min); return `UTC${sign}${Math.floor(a / 60)}${a % 60 ? ':' + pad(a % 60) : ''}`; }
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function workRange(c) { return [c && c.ws != null ? c.ws : settings.ws, c && c.we != null ? c.we : settings.we]; }
// classify minute-of-day for a city
function kind(c, p) {
  const m = p.h * 60 + p.mi;
  const [ws, we] = workRange(c);
  const weekend = p.wd === 0 || p.wd === 6;
  if (m < 7 * 60) return 's';
  if (!weekend && m >= ws && m < we) return 'w';
  if (m >= 22 * 60) return 'g';
  return weekend ? 'x' : 'g';
}
function isSleep(p) { return p.h < 7 || p.h >= 23; }

const ICON_SUN = '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="白天"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-label="夜晚"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

// ---------- render: header + list ----------
function displayInstant() { return scrubSlot == null ? Date.now() : slotTime(scrubSlot); }
function dayStart() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + dayOffset).getTime(); }
// start of 15-min slot i by local wall clock (DST-safe: a 23h/25h day still maps slot i to i*15 min after local midnight)
function slotTime(i) { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + dayOffset, 0, i * 15).getTime(); }

function renderHeader(t) {
  const p = partsAt(LOCAL_TZ, t) || partsAt('UTC', t);
  const live = scrubSlot == null;
  $('#hereTime').innerHTML = fmtHM(p.h, p.mi) + (live ? `<span class="sec">${pad(p.s)}</span>` : '');
  $('#hereDate').textContent = `${p.y} 年 ${p.mo} 月 ${p.d} 日 星期${WD[p.wd]}`;
  $('#hereTz').textContent = `${LOCAL_TZ.replace(/_/g, ' ')} ${fmtUtc(p.offset)}`;
}
function renderList() {
  const t = displayInstant();
  const lp = partsAt(LOCAL_TZ, t) || partsAt('UTC', t);
  const ul = $('#list');
  ul.innerHTML = cities.map((c, i) => {
    const disp = esc(c.label || c.name);
    if (!supported(c.tz)) {
      return `<li class="row unsupported"><button class="main" data-edit="${i}"><span class="name">${disp}</span><span class="meta">${esc(c.tz)}</span></button><div class="clock"><div class="t">此裝置不支援</div></div></li>`;
    }
    const p = partsAt(c.tz, t);
    const diff = p.offset - lp.offset;
    const dd = p.dayNum - lp.dayNum;
    const day = p.h >= 6 && p.h < 18;
    const dtxt = dd === 0 ? '今天' : dd < 0 ? '昨天' : '明天';
    const sub = c.label ? `${esc(c.name)} · ` : '';
    return `<li class="row"><button class="main" data-edit="${i}" aria-label="${disp}，編輯">
      <span class="name">${day ? ICON_SUN : ICON_MOON}${disp}</span>

      <div class="clock"><div class="t num">${fmtHM(p.h, p.mi)}</div><div class="d ${dd ? 'shift' : ''}">${dtxt} ${p.mo}/${p.d} 週${WD[p.wd]}</div></div></li>`;
  }).join('') || '<li class="row"><span class="meta">還沒有城市，按右上「＋ 城市」新增。</span></li>';
  $('#sampleTag').hidden = !isSample;
}

// ---------- timeline ----------
let slotCache = null; // [{c, parts[96]}]
function computeSlots() {
  const start = dayStart();
  const rows = [{ c: null, tz: LOCAL_TZ, name: '本地' }].concat(cities.map(c => ({ c, tz: c.tz, name: c.label || c.name })));
  slotCache = rows.map(r => {
    if (!supported(r.tz)) return { ...r, bad: true };
    const parts = []; for (let i = 0; i < 96; i++) parts.push(partsAt(r.tz, slotTime(i)));
    return { ...r, parts, kinds: parts.map(p => kind(r.c, p)) };
  });
  return start;
}
let tlStart = 0;
function renderTimeline() {
  tlStart = computeSlots();
  const tl = $('#tl');
  let html = '';
  for (const r of slotCache) {
    html += `<div class="tl-row"><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span>`;
    if (r.bad) { html += `<div class="band bad">此裝置不支援</div></div>`; continue; }
    html += '<div class="band">' + r.kinds.map((k, i) => `<i class="${k}${r.parts[i].mi === 0 && i ? ' h' : ''}"></i>`).join('') + '</div></div>';
  }
  html += `<div class="axis"><span></span><div class="ticks">${[0, 6, 12, 18, 24].map(h => `<span style="left:${h / 24 * 100}%;${h === 24 ? 'transform:translateX(-100%)' : ''}">${h === 24 ? '24' : pad(h)}</span>`).join('')}</div></div>`;
  html += '<div class="cursor" id="cursor"><span class="bubble" id="bubble"></span></div>';
  tl.innerHTML = html;
  const d = new Date(dayStart());
  $('#dayLbl').textContent = (dayOffset === 0 ? '今天' : dayOffset === -1 ? '昨天' : dayOffset === 1 ? '明天' : '') + ` ${d.getMonth() + 1}/${d.getDate()} 週${WD[d.getDay()]}`;
  renderSuggestions();
  placeCursor();
}
function placeCursor() {
  const cur = $('#cursor'); if (!cur) return;
  const band = document.querySelector('#tl .band');
  const tl = $('#tl');
  let frac;
  if (scrubSlot == null) {
    if (dayOffset !== 0) { cur.hidden = true; return; }
    const n = new Date(); frac = (n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60) / 1440;
  } else frac = scrubSlot / 96;
  cur.hidden = false;
  frac = Math.max(0, Math.min(1, frac));
  const tlr = tl.getBoundingClientRect(), br = band.getBoundingClientRect();
  const x = br.left - tlr.left + frac * br.width;
  cur.style.left = x + 'px';
  const lp = partsAt(LOCAL_TZ, displayInstant());
  $('#bubble').textContent = lp ? fmtPlainHM(lp.h, lp.mi) : '';
  cur.classList.toggle('flip', frac > .7);
  if (scrubSlot == null) $('#scrub').value = Math.min(95, Math.floor(frac * 96));
}

function slotLabel(i) { const p = slotCache[0].parts[i]; return fmtPlainHM(p.h, p.mi); }
function endLabel(i) { // label for end of slot i-1 (=start of i)
  if (i < 96) return slotLabel(i);
  const p = partsAt(LOCAL_TZ, slotTime(96)); return p ? fmtPlainHM(p.h, p.mi) + (settings.fmt === 24 && p.h === 0 && p.mi === 0 ? '' : '') : '';
}
function runsWhere(pred) {
  const out = []; let s = -1;
  for (let i = 0; i <= 96; i++) {
    const ok = i < 96 && pred(i);
    if (ok && s < 0) s = i;
    if (!ok && s >= 0) { out.push([s, i]); s = -1; }
  }
  return out;
}
function cityRangeText(r, a, b) {
  const p1 = r.parts[a], p2 = partsAt(r.tz, slotTime(b));
  return `${esc(r.name)} ${fmtPlainHM(p1.h, p1.mi)}–${fmtPlainHM(p2.h, p2.mi)}`;
}
function durText(n) { const m = n * 15; const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' 小時' : '') + (mm ? (h ? ' ' : '') + mm + ' 分' : ''); }
function suggestions() {
  const rows = slotCache.filter(r => !r.bad);
  const cityRows = rows.slice(1).length ? rows : rows; // include local
  const all = runsWhere(i => cityRows.every(r => r.kinds[i] === 'w')).filter(([a, b]) => b - a >= 2);
  if (all.length) return { type: 'overlap', runs: all.sort((x, y) => (y[1] - y[0]) - (x[1] - x[0])).slice(0, 3).sort((x, y) => x[0] - y[0]), rows: cityRows };
  // fallback: fewest people asleep, then most people at work
  let best = Infinity;
  const score = (i) => { const sl = cityRows.filter(r => isSleep(r.parts[i])).length; const wk = cityRows.filter(r => r.kinds[i] === 'w').length; return sl * 100 - wk; };
  for (let i = 0; i < 96; i++) best = Math.min(best, score(i));
  const runs = runsWhere(i => score(i) === best).filter(([a, b]) => b - a >= 2);
  const use = (runs.length ? runs : runsWhere(i => score(i) === best)).sort((x, y) => (y[1] - y[0]) - (x[1] - x[0])).slice(0, 3).sort((x, y) => x[0] - y[0]);
  return { type: 'fallback', runs: use, rows: cityRows };
}
function renderSuggestions() {
  const box = $('#sugg');
  if (slotCache.filter(r => !r.bad).length < 2) { box.innerHTML = '<h2><span>開會建議</span></h2><p class="note">新增至少一個城市即可計算共同上班時段。</p>'; return; }
  const s = suggestions();
  let html = '<h2><span>開會建議（本地時間）</span></h2>';
  if (s.type === 'overlap') html += '<p class="note">以下時段所有城市都在上班時間內：</p>';
  else {
    html += '<p class="note">沒有所有人都在上班的時段，以下是最少人需要在睡眠時間（23:00–07:00）參加的時段：</p>';
  }
  html += '<ol>' + s.runs.map(([a, b]) => {
    const per = s.rows.slice(1).map(r => {
      const asleep = isSleep(r.parts[a]);
      return cityRangeText(r, a, b) + (s.type === 'fallback' ? (r.kinds[a] === 'w' ? '（上班）' : asleep ? '（睡眠時間）' : '（非上班）') : '');
    }).join('、');
    return `<li class="${s.type === 'fallback' ? 'alt' : ''}"><button class="go" data-slot="${a}"><span class="rng num">${slotLabel(a)} – ${endLabel(b)}</span><span class="dur">${durText(b - a)}</span><div class="per">${per}</div></button></li>`;
  }).join('') + '</ol>';
  box.innerHTML = html;
}

// ---------- scrub ----------
function setScrub(i) {
  scrubSlot = Math.max(0, Math.min(95, i));
  $('#scrub').value = scrubSlot;
  $('#btnNow').hidden = false;
  const lp = partsAt(LOCAL_TZ, displayInstant());
  $('#scrubInfo').innerHTML = `檢視時刻：<b>${fmtPlainHM(lp.h, lp.mi)}</b>（本地）`;
  renderHeader(displayInstant()); renderList(); placeCursor();
}
function goLive() {
  scrubSlot = null; $('#btnNow').hidden = true; $('#scrubInfo').textContent = '即時';
  if (dayOffset !== 0) { dayOffset = 0; renderTimeline(); }
  lastMinute = -1; tick();
}
$('#scrub').addEventListener('input', (e) => setScrub(+e.target.value));
(function dragBands() {
  const tl = $('#tl');
  let dragging = false, startX = 0, startY = 0, decided = false;
  const toSlot = (x) => { const b = tl.querySelector('.band').getBoundingClientRect(); return Math.round((x - b.left) / b.width * 96 - .5); };
  tl.addEventListener('pointerdown', (e) => {
    if (!tl.querySelector('.band:not(.bad)')) return;
    dragging = true; decided = e.pointerType === 'mouse'; startX = e.clientX; startY = e.clientY;
    if (decided) { tl.setPointerCapture(e.pointerId); setScrub(toSlot(e.clientX)); }
  });
  tl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    if (!decided) {
      const dx = Math.abs(e.clientX - startX), dy = Math.abs(e.clientY - startY);
      if (dy > 8 && dy > dx) { dragging = false; return; }
      if (dx > 6) { decided = true; try { tl.setPointerCapture(e.pointerId); } catch (_) {} }
      else return;
    }
    setScrub(toSlot(e.clientX));
  });
  const end = (e) => { if (dragging && !decided && e.type === 'pointerup') setScrub(toSlot(e.clientX)); dragging = false; };
  tl.addEventListener('pointerup', end); tl.addEventListener('pointercancel', () => { dragging = false; });
})();
$('#btnNow').addEventListener('click', goLive);
$('#dayPrev').addEventListener('click', () => { dayOffset = Math.max(-7, dayOffset - 1); renderTimeline(); if (scrubSlot != null) setScrub(scrubSlot); else { renderList(); } });
$('#dayNext').addEventListener('click', () => { dayOffset = Math.min(7, dayOffset + 1); renderTimeline(); if (scrubSlot != null) setScrub(scrubSlot); else { renderList(); } });
$('#sugg').addEventListener('click', (e) => { const b = e.target.closest('[data-slot]'); if (b) setScrub(+b.dataset.slot); });

// ---------- live tick ----------
let tickTimer = 0, lastMinute = -1;
function tick() {
  clearTimeout(tickTimer);
  if (scrubSlot == null) {
    const now = Date.now();
    renderHeader(now);
    const m = Math.floor(now / 60000);
    if (m !== lastMinute) {
      lastMinute = m;
      const n = new Date(); const ds = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
      if (!slotCache || (dayOffset === 0 && slotCache[0].parts && ds !== tlStart)) { renderTimeline(); }
      renderList(); placeCursor();
    }
  }
  if (!document.hidden) tickTimer = setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastMinute = -1; tick(); } });
window.addEventListener('resize', placeCursor);

// ---------- dialogs ----------
let lastFocus = null;
function openDlg(id) { lastFocus = document.activeElement; const d = $(id); d.hidden = false; const f = d.querySelector('input, button:not([data-close])'); if (f) setTimeout(() => f.focus(), 30); }
function closeDlg(d) { d.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.querySelectorAll('.scrim').forEach(d => {
  d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) closeDlg(d); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.scrim:not([hidden])').forEach(closeDlg); });
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

// add
function norm(s) { return s.toLowerCase().replace(/[\s.'’-]/g, ''); }
function renderResults() {
  const q = norm($('#search').value.trim());
  const now = Date.now();
  const lo = offsetMin(LOCAL_TZ, now) || 0;
  const list = CITIES.filter(c => !q || norm(c.name + c.en + c.country + c.tz).includes(q)).slice(0, 60);
  $('#results').innerHTML = list.map(c => {
    const o = supported(c.tz) ? fmtDiff(offsetMin(c.tz, now) - lo) : '不支援';
    return `<li><button data-city="${c.id}"><span><b>${esc(c.name)}</b> <span class="c">${esc(c.en.split(' ')[0] === c.en ? c.en : c.en)} · ${esc(c.country)}</span></span><span class="o">${o}</span></button></li>`;
  }).join('') || '<li style="padding:12px 4px;color:var(--muted)">找不到符合的城市</li>';
}
$('#btnAdd').addEventListener('click', () => { $('#search').value = ''; renderResults(); openDlg('#dlgAdd'); });
$('#search').addEventListener('input', renderResults);
$('#results').addEventListener('click', (e) => {
  const b = e.target.closest('[data-city]'); if (!b) return;
  const c = CITIES[+b.dataset.city];
  if (cities.some(x => x.tz === c.tz && x.name === c.name)) { toast(`${c.name} 已在清單中`); return; }
  if (cities.length >= 12) { toast('最多 12 個城市，請先刪除一個'); return; }
  cities.push({ tz: c.tz, name: c.name, label: '', ws: null, we: null });
  saveCities(); closeDlg($('#dlgAdd')); renderTimeline(); renderList(); toast(`已加入 ${c.name}`);
});

// edit
let editIdx = -1;
const toTime = (m) => m == null ? '' : pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const fromTime = (s) => { if (!s) return null; const [h, m] = s.split(':').map(Number); return Number.isFinite(h) ? h * 60 + (m || 0) : null; };
$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-edit]'); if (!b) return;
  editIdx = +b.dataset.edit; const c = cities[editIdx];
  $('#editTitle').textContent = `${c.name} · ${c.tz.replace(/_/g, ' ')}`;
  $('#editLabel').value = c.label || ''; $('#editLabel').placeholder = c.name;
  $('#editWs').value = toTime(c.ws); $('#editWe').value = toTime(c.we);
  $('#delConfirm').hidden = true;
  openDlg('#dlgEdit');
});
function moveCity(d) {
  const j = editIdx + d; if (j < 0 || j >= cities.length) return;
  [cities[editIdx], cities[j]] = [cities[j], cities[editIdx]]; editIdx = j;
  saveCities(); renderTimeline(); renderList();
}
$('#editUp').addEventListener('click', () => moveCity(-1));
$('#editDown').addEventListener('click', () => moveCity(1));
$('#editSave').addEventListener('click', () => {
  const c = cities[editIdx]; if (!c) return;
  c.label = $('#editLabel').value.trim().slice(0, 20);
  const ws = fromTime($('#editWs').value), we = fromTime($('#editWe').value);
  if (ws != null && we != null && we <= ws) { toast('結束時間要晚於開始時間'); return; }
  c.ws = ws; c.we = we;
  saveCities(); closeDlg($('#dlgEdit')); renderTimeline(); renderList();
});
$('#editDel').addEventListener('click', () => { $('#delConfirm').hidden = false; $('#delYes').focus(); });
$('#delNo').addEventListener('click', () => { $('#delConfirm').hidden = true; });
$('#delYes').addEventListener('click', () => {
  const c = cities.splice(editIdx, 1)[0]; saveCities(); closeDlg($('#dlgEdit')); renderTimeline(); renderList(); toast(`已移除 ${c.label || c.name}`);
});

// settings
function syncSettingsUI() {
  document.querySelectorAll('#segFmt button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === settings.fmt)));
  document.querySelectorAll('#segTheme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === settings.theme)));
  $('#setWs').value = toTime(settings.ws); $('#setWe').value = toTime(settings.we);
}
$('#btnSettings').addEventListener('click', () => { syncSettingsUI(); openDlg('#dlgSet'); });
$('#segFmt').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; settings.fmt = +b.dataset.v; saveSettings(); syncSettingsUI(); lastMinute = -1; renderTimeline(); renderList(); renderHeader(displayInstant()); });
$('#segTheme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; settings.theme = b.dataset.v; saveSettings(); applyTheme(); syncSettingsUI(); });
function onWork() {
  const ws = fromTime($('#setWs').value), we = fromTime($('#setWe').value);
  if (ws == null || we == null || we <= ws) return;
  settings.ws = ws; settings.we = we; saveSettings(); renderTimeline();
}
$('#setWs').addEventListener('change', onWork); $('#setWe').addEventListener('change', onWork);

// test hook
window.__worldClock = { partsAt, offsetMin, fmtDiff, suggestions: () => { computeSlots(); return suggestions(); }, setCities(list) { cities = list.map(c => ({ tz: c.tz, name: c.name, label: '', ws: null, we: null })); renderTimeline(); renderList(); }, setScrub, goLive, get cities() { return cities; }, CITIES };

renderTimeline();
tick();
})();
</script>
