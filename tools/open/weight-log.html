<script>
(() => {
'use strict';
const KEY = 'weight-log:v1:data', TKEY = 'weight-log:v1:theme', LB = 2.20462;
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]); } for (const c of kids) if (c != null) n.append(c); return n; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const dn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDn = n => new Date(n * 864e5).toISOString().slice(0, 10);
const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fromDn(dn(s)) === s;

/* ---------- data ---------- */
const DEF = () => ({ unit: 'kg', heightCm: 172, goal10: 720, maMode: 'sma', gainMode: false });
function sample() {
  const t = dn(todayStr()), entries = [];
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 85; i >= 0; i--) {
    if (rnd() < .18 && i > 0) continue;
    const base = 78.9 - (85 - i) * 0.055 + Math.sin(i / 6) * .25 + (rnd() - .5) * .7;
    entries.push({ date: fromDn(t - i), w10: Math.round(base * 10) });
  }
  return { sample: true, entries, settings: DEF() };
}
function valid(d) {
  if (!d || !Array.isArray(d.entries) || !d.settings) return false;
  return d.entries.every(e => e && validDate(e.date) && Number.isInteger(e.w10) && e.w10 >= 200 && e.w10 <= 3000);
}
let data = lsGet(KEY, null);
if (!valid(data)) data = sample();
data.settings = Object.assign(DEF(), data.settings);
data.entries.sort((a, b) => a.date < b.date ? -1 : 1);
const save = () => lsSet(KEY, data);
let theme = lsGet(TKEY, 'auto');
const applyTheme = () => theme === 'auto' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', theme);
applyTheme();
const S = () => data.settings;

/* ---------- units ---------- */
const kgToDisp = kg => S().unit === 'lb' ? kg * LB : kg;
const fmtW = (kg, unit = true) => kgToDisp(kg).toFixed(1) + (unit ? ' ' + S().unit : '');
function parseInput(str, unit = S().unit) { // -> {w10, err}
  const s = String(str).trim().replace(',', '.');
  if (!s) return { err: '請輸入體重。' };
  if (!/^\d+(\.\d+)?$/.test(s)) return { err: '請輸入數字。' };
  const v = Number(s);
  if (unit === 'kg') { if (v < 20 || v > 300) return { err: '體重需介於 20.0～300.0 kg。' }; return { w10: Math.round(v * 10) }; }
  if (v < 44 || v > 660) return { err: '體重需介於 44～660 lb。' };
  return { w10: Math.round(v / LB * 10) };
}

/* ---------- analytics ---------- */
function insertEntry(list, e) { // binary search, overwrite same day
  let lo = 0, hi = list.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (list[mid].date < e.date) lo = mid + 1; else hi = mid; }
  if (list[lo] && list[lo].date === e.date) { const old = list[lo]; list[lo] = e; return { index: lo, replaced: old }; }
  list.splice(lo, 0, e); return { index: lo, replaced: null };
}
function movingAvg(list, mode) { // returns array of kg|null aligned with list
  if (mode === 'ema') {
    let ema = null, prev = null;
    return list.map(e => { const w = e.w10 / 10; const n = dn(e.date); if (ema == null || (prev != null && n - prev > 14)) ema = w; else ema = ema + 0.1 * (w - ema); prev = n; return ema; });
  }
  const out = []; let j = 0, sum = 0;
  for (let i = 0; i < list.length; i++) {
    const n = dn(list[i].date); sum += list[i].w10;
    while (dn(list[j].date) < n - 6) { sum -= list[j].w10; j++; }
    const cnt = i - j + 1; out.push(cnt >= 3 ? sum / cnt / 10 : null);
  }

  save(); $('#setDlg').close(); prefill(); renderAll();
};
const csvStr = () => 'date,weight_kg\n' + data.entries.map(e => `${e.date},${(e.w10 / 10).toFixed(1)}`).join('\n') + '\n';
$('#dlCsv').onclick = async () => { try { await dl.save({ filename: `weight-log-${todayStr()}.csv`, data: csvStr() }); } catch (e) { if (!/declin/i.test(String(e && (e.message || e)))) $('#setErr').textContent = '下載失敗，請改用複製。'; } };
$('#cpCsv').onclick = () => {
  const s = csvStr(); const fb = () => { const t = $('#expText'); t.hidden = false; t.value = s; t.focus(); t.select(); $('#setErr').textContent = '無法自動複製，已選取下方文字，請手動複製。'; };
  try { navigator.clipboard.writeText(s).then(() => toast('已複製 CSV'), fb); } catch (e) { fb(); }
};
function parseCsv(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { rows: [], bad: 0 };
  const cand = ['\t', ';', ','], probe = lines.slice(0, 5).join('\n');
  const delim = cand.find(c => probe.split('\n').every(l => l.includes(c))) || ',';
  const rows = []; let bad = 0;
  for (const line of lines) {
    const cols = line.split(delim).map(c => c.trim().replace(/^"|"$/g, ''));
    if (cols.length < 2) { bad++; continue; }
    const dm = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(cols[0]);
    if (!dm) { if (line !== lines[0]) bad++; continue; } // first non-date line = header
    const date = `${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}`;
    const w = Number(cols[1].replace(',', '.'));
    if (!validDate(date) || !(w >= 20 && w <= 300)) { bad++; continue; }
    rows.push({ date, w10: Math.round(w * 10) });
  }
  return { rows, bad, delim };
}
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async () => {
  const f = $('#impFile').files[0]; $('#impFile').value = ''; if (!f) return;
  try {
    const { rows, bad } = parseCsv(await f.text());
    if (!rows.length) { $('#setErr').textContent = '找不到可匯入的資料，現有資料未變更。'; return; }
    if (data.sample) data = { entries: [], settings: data.settings };
    for (const r of rows) insertEntry(data.entries, r);
    save(); $('#setDlg').close(); prefill(); renderAll(); toast(`已匯入 ${rows.length} 筆` + (bad ? `，略過 ${bad} 行` : ''));
  } catch (e) { $('#setErr').textContent = '讀取檔案失敗，現有資料未變更。'; }
};

window.__wt = { insertEntry, movingAvg, regression, predict, bmiOf, bmiClass, parseInput, parseCsv, niceStep, draw, get data() { return data; }, set data(v) { data = v; renderAll(); } };
document.querySelectorAll('.ranges button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === range)));
prefill(); renderAll();
})();
