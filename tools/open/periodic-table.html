<title>周期表</title>
<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --c0:#6e3a2e;--c1:#6a5428;--c2:#2e4a6c;--c3:#424d40;--c4:#4f4066;--c5:#2b5c3e;--c6:#235a5b;--c7:#5f3a5a;--c8:#5b5429;--c9:#673744;--cink:#eef2ef;
  --q0:#1f2732;--q1:#25405f;--q2:#2f5a8e;--q3:#4f80c2;--q4:#8db5ee;--qi0:#e6ebe7;--qi1:#e6ebe7;--qi2:#fff;--qi3:#fff;--qi4:#0d1f2b;--qn:#262c29;--qni:#86908a;
  --ps:#3e4a5e;--pl:#2b5f80;--pg:#6d5a22;--pu:#262c29;

:root[data-theme="dark"]{
  --bg:#111513;--surface:#191e1b;--surface2:#232a26;--line:#343d38;--ink:#e6ebe7;--ink2:#a9b3ad;--ink3:#86908a;--accent:#8cc4e8;--accent-ink:#0d1f2b;--focus:#ff8a9a;
  --c0:#6e3a2e;--c1:#6a5428;--c2:#2e4a6c;--c3:#424d40;--c4:#4f4066;--c5:#2b5c3e;--c6:#235a5b;--c7:#5f3a5a;--c8:#5b5429;--c9:#673744;--cink:#eef2ef;
  --q0:#1f2732;--q1:#25405f;--q2:#2f5a8e;--q3:#4f80c2;--q4:#8db5ee;--qi0:#e6ebe7;--qi1:#e6ebe7;--qi2:#fff;--qi3:#fff;--qi4:#0d1f2b;--qn:#262c29;--qni:#86908a;
  --ps:#3e4a5e;--pl:#2b5f80;--pg:#6d5a22;--pu:#262c29;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:10px 16px calc(76px + env(safe-area-inset-bottom))}
body.sheet-open{padding-bottom:calc(44vh + 70px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.app{max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-bottom:10px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;flex:1;white-space:nowrap}
h1 small{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.08em}
.tools{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.search{flex:1 1 180px;position:relative}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
.selwrap{flex:0 1 auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.ibtn{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink2);padding:0 10px}
.temp{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:14px}
.temp input{flex:1;min-height:44px;accent-color:var(--accent)}
.temp output{min-width:7.5em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
@media (max-width:640px){.legend{flex-wrap:nowrap;overflow-x:auto;padding:6px 2px;margin:-6px 0 4px;scrollbar-width:none}.legend button{flex:none}}
.legend button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;position:relative}
.legend button::after{content:"";position:absolute;inset:-6px -2px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(127,127,127,.35)}
.legend button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.main{display:block}
@media (min-width:1000px){.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}}
.tablewrap{position:relative;overflow:auto;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:8px;touch-action:pan-x pan-y;overscroll-behavior:contain;max-height:calc(100vh - 220px)}
.ptable{display:grid;grid-template-columns:repeat(18,var(--cell));grid-auto-rows:var(--cellh);gap:var(--gap);width:max-content;position:relative}
.el{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:calc(var(--cell)*.12);background:var(--fill,var(--qn));color:var(--fink,var(--cink));cursor:pointer;overflow:hidden;line-height:1.05;transition:opacity .15s}
.el:focus-visible{outline:3px solid var(--focus);outline-offset:1px;z-index:2}
.el .s{font-weight:700;font-size:max(11px,calc(var(--cell)*.42))}
.el .n,.el .zh,.el .m{display:none}
.z2 .el .n,.z3 .el .n{display:block;position:absolute;top:2px;left:3px;font-size:max(11px,calc(var(--cell)*.2));opacity:.85}
.z2 .el .s{font-size:max(12px,calc(var(--cell)*.36));margin-top:4px}
.z3 .el .s{font-size:calc(var(--cell)*.32);margin-top:6px}
.z3 .el .zh{display:block;font-size:max(11px,calc(var(--cell)*.2))}
.z3 .el .m{display:block;font-size:max(11px,calc(var(--cell)*.15));opacity:.8}
.el.unk{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(127,127,127,.18) 5px 7px)}
.el.dim{opacity:.22}
.el.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.z1 .ph{font-size:0}
.ph{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:calc(var(--cell)*.12);font-size:max(11px,calc(var(--cell)*.18));color:var(--ink3);text-align:center;line-height:1.1}
.zoom{position:sticky;left:calc(100% - 100px);bottom:0;display:flex;gap:6px;margin-top:8px;width:max-content}
.zoom button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{font-size:12px;color:var(--ink3);margin:8px 2px 0}
/* detail */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.detail .inner{padding:14px}
.placeholder{padding:30px 16px;color:var(--ink3);text-align:center}
@media (max-width:999.98px){
  .detail{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:16px 16px 0 0;height:44vh;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:height .2s;padding-bottom:env(safe-area-inset-bottom);touch-action:pan-y}
  .detail.full{height:calc(100% - 24px)}
  .detail .inner{overflow:auto;flex:1;overscroll-behavior:contain;padding-bottom:84px;touch-action:pan-y}
  .detail.closed{display:none}
}
@media (min-width:1000px){.detail{position:sticky;top:10px;max-height:calc(100vh - 100px);overflow:auto}.dhead .grab,#expandDet{display:none}}
.dhead{display:flex;align-items:center;gap:6px;padding:6px 8px 0}
.dhead .grab{flex:1;display:flex;justify-content:center;align-items:center;min-height:44px;background:none;border:0;cursor:pointer}
.dhead .grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.tile{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:12px}
.big{width:96px;height:104px;border-radius:12px;background:var(--fill);color:var(--fink);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.big .n{position:absolute;top:6px;left:8px;font-size:13px}
.big .s{font-size:40px;font-weight:800;line-height:1}
.big .m{font-size:12px;margin-top:4px}
.tile h2{margin:0;font-size:24px;line-height:1.2}
.tile .en{color:var(--ink2);font-size:14px}
.tile .cat{display:inline-block;margin-top:6px;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.nav{display:flex;gap:8px;margin:0 0 12px}
.nav button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px}
table.props{width:100%;border-collapse:collapse;font-size:14px}
table.props th{text-align:left;font-weight:500;color:var(--ink2);padding:7px 8px 7px 0;width:7.2em;vertical-align:top;white-space:nowrap}
table.props td{padding:7px 0;border-bottom:1px solid var(--surface2)}
table.props tr:last-child td{border-bottom:0}
.unit{border:1px solid var(--line);background:var(--surface2);border-radius:6px;min-height:28px;padding:0 8px;font-size:12px;cursor:pointer;margin-left:6px;position:relative}
.unit::after{content:"";position:absolute;inset:-8px -4px}
h3{font-size:13px;letter-spacing:.08em;color:var(--ink3);margin:16px 0 6px;font-weight:700}
.cfg{font-size:15px;word-break:break-word;line-height:1.7}
.cfg b{font-size:17px}
.viz{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.bohr{width:170px;height:170px;flex:none}
.bohr circle.orbit{fill:none;stroke:var(--line);stroke-width:1}
.bohr circle.e{fill:var(--accent)}
.bohr circle.nuc{fill:var(--fill)}
.bohr text{fill:var(--fink);font-size:11px;font-weight:700}
.boxes{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.boxrow{display:flex;gap:0}
.boxrow span{width:30px;height:34px;border:1.5px solid var(--ink2);margin-left:-1.5px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);letter-spacing:-2px}
.boxrow span:first-child{margin-left:0}
.pred{font-size:12px;color:var(--ink3);margin-top:6px}
/* list */
.list{display:flex;flex-direction:column;gap:4px}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.6em 2.8em 1fr auto;align-items:center;gap:10px;min-height:52px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.row:focus-visible{outline:3px solid var(--focus)}
.row .sw{width:2.6em;height:2.6em;border-radius:8px;background:var(--fill);color:var(--fink);display:flex;align-items:center;justify-content:center;font-weight:800}
.row .nm b{display:block;font-size:15px}
.row .nm span{font-size:12px;color:var(--ink3)}
.row .ms{font-size:13px;color:var(--ink2);text-align:right}
.empty{padding:24px;text-align:center;color:var(--ink3)}
/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px}
.q{font-size:20px;font-weight:700;margin:6px 0 14px;min-height:60px}
.q .big-sym{font-size:44px;display:block;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;cursor:pointer}
.opts button.right{background:var(--c5);color:var(--cink);border-color:transparent}
.opts button.wrong{background:var(--c0);color:var(--cink);border-color:transparent}
.qstat{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:12px;gap:10px;flex-wrap:wrap}
.qnext{margin-top:12px;min-height:48px;width:100%;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
/* bottom bar */
.modebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.modebar .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;width:100%;max-width:420px}
.modebar button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink2);cursor:pointer}
.modebar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
footer{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.6}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:60}
@media (hover:hover){.el:hover{filter:brightness(1.06);box-shadow:inset 0 0 0 2px var(--ink2)} .row:hover{border-color:var(--ink2)} .opts button:hover{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
<header>
  <h1>周期表 <small>118 種元素</small></h1>
  <button class="ibtn" id="themeBtn" type="button" aria-label="切換主題">自動</button>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="搜尋：氧、O、8" aria-label="搜尋元素" autocomplete="off" enterkeyhint="search"></div>
    <label class="selwrap" for="colorBy">著色
      <select id="colorBy">
        <option value="cat">分類</option><option value="phase">狀態</option><option value="en">電負度</option><option value="radius">原子半徑</option><option value="mp">熔點</option><option value="year">發現年代</option>
      </select></label>
  </div>
</header>
<div class="temp" id="tempRow" hidden><label for="tempK">溫度</label><input type="range" id="tempK" min="0" max="6000" step="1" value="298"><output id="tempOut" class="num">298 K</output></div>
<div class="legend" id="legend" role="group" aria-label="圖例（點選只顯示該類）"></div>

<div class="main">
  <section id="vTableView">
    <div class="tablewrap" id="wrap">
      <div class="ptable" id="ptable" role="grid" aria-label="元素週期表"></div>
      <div class="zoom"><button type="button" id="zoomOut" aria-label="縮小">−</button><button type="button" id="zoomIn" aria-label="放大">＋</button></div>
    </div>
    <p class="hint" id="hint">雙指或 ＋／− 縮放，格子夠大時會顯示原子序與中文名；點元素看詳情。</p>
  </section>
  <section id="vListView" hidden><div class="list" id="list"></div></section>
  <section id="vQuizView" hidden>
    <div class="quiz">
      <div class="qstat" style="margin-top:0"><span id="qType"></span><span id="qScore" class="num"></span></div>
      <div class="q" id="qText" aria-live="polite"></div>
      <div class="opts" id="qOpts"></div>
      <button class="qnext" id="qNext" type="button">下一題</button>
      <div class="qstat"><span id="qWeak"></span><button class="unit" id="qReset" type="button">重設紀錄</button></div>
    </div>
  </section>
  <aside class="detail closed" id="detail" aria-label="元素詳情">
    <div class="dhead">
      <button class="grab" id="grab" type="button" aria-label="展開或收合詳情"><span></span></button>
      <button class="ibtn" id="expandDet" type="button">展開</button>
      <button class="ibtn" id="closeDet" type="button" aria-label="關閉詳情">關閉</button>
    </div>
    <div class="inner" id="detInner"><div class="placeholder">點選任一元素，這裡會顯示它的性質、電子組態與模型。</div></div>
  </aside>
</div>
<footer>原子量採 IUPAC 標準原子量（簡化至五位有效數字），方括號為最穩定同位素質量數；熔沸點、密度、電負度、游離能、半徑來自 Periodic-Table-JSON（Bowserinator，CC BY-SA 3.0，數據源自維基百科），本頁對其做了欄位整理與 100 號以後預測值的移除。104 號以後的性質多為理論預測或未知。</footer>
</div>
<nav class="modebar" aria-label="檢視模式"><div class="seg">
  <button type="button" id="mTable" aria-pressed="true">表格</button>

  <button type="button" id="mQuiz" aria-pressed="false">測驗</button>
</div></nav>

/* ---------- electron configuration ---------- */
const L='spdf';
const ORDER=[];for(let s=1;s<=8;s++)for(let l=0;l<4;l++){const n=s-l;if(n>l)ORDER.push([n,l]);}
ORDER.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
const EXC={24:{'3d':5,'4s':1},29:{'3d':10,'4s':1},41:{'4d':4,'5s':1},42:{'4d':5,'5s':1},44:{'4d':7,'5s':1},45:{'4d':8,'5s':1},46:{'4d':10,'5s':0},47:{'4d':10,'5s':1},
  57:{'4f':0,'5d':1},58:{'4f':1,'5d':1},64:{'4f':7,'5d':1},78:{'5d':9,'6s':1},79:{'5d':10,'6s':1},89:{'5f':0,'6d':1},90:{'5f':0,'6d':2},91:{'5f':2,'6d':1},92:{'5f':3,'6d':1},93:{'5f':4,'6d':1},96:{'5f':7,'6d':1},103:{'6d':0,'7p':1}};
const cfgCache={};
function occ(z){
  if(cfgCache[z])return cfgCache[z];
  const m=new Map();let r=z;
  for(const [n,l] of ORDER){if(r<=0)break;const k=Math.min(r,4*l+2);m.set(n+L[l],k);r-=k;}
  if(EXC[z])for(const [k,v] of Object.entries(EXC[z]))m.set(k,v);
  return cfgCache[z]=m;
}
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';const sup=n=>String(n).split('').map(d=>SUP[d]).join('');
const sortSub=(a,b)=>(+a[0]-+b[0])||(L.indexOf(a[1])-L.indexOf(b[1]));
function cfgFull(z){return [...occ(z)].filter(([,v])=>v>0).sort((a,b)=>sortSub(a[0],b[0])).map(([k,v])=>k+sup(v)).join(' ');}
const NOBLE=[2,10,18,36,54,86];
function cfgShort(z){
  const core=[...NOBLE].reverse().find(n=>n<z);if(!core)return cfgFull(z);
  const a=occ(z),c=occ(core);const rest=[];
  for(const [k,v] of a){const d=v-(c.get(k)||0);if(d>0)rest.push([k,d]);}
  rest.sort((x,y)=>sortSub(x[0],y[0]));
  return '['+E[core-1].sym+'] '+rest.map(([k,v])=>k+sup(v)).join(' ');
}
function shells(z){const sh=[];for(const [k,v] of occ(z)){if(!v)continue;const n=+k[0];sh[n-1]=(sh[n-1]||0)+v;}return Array.from(sh,x=>x||0);}
function lastSub(z){
  const a=[...occ(z)].filter(([,v])=>v>0);
  const partial=a.filter(([k,v])=>v<4*L.indexOf(k[1])+2);
  // choose the partially filled subshell with highest filling order, else last filled
  const ord=k=>ORDER.findIndex(([n,l])=>n+L[l]===k);
  const pick=(partial.length?partial:a).sort((x,y)=>ord(y[0])-ord(x[0]))[0];
  return pick;
}

let cur=null;
function newQ(){
  // bias toward missed elements
  const weak=Object.entries(QZ.perElement).filter(([,v])=>v.wrong>0).map(([z])=>+z);
  const target=(weak.length&&rnd(3)===0)?E[weak[rnd(weak.length)]-1]:POOL[rnd(POOL.length)];
  const type=rnd(3);const opts=new Set([target.z]);
  while(opts.size<4){let c;if(type===2){const cand=POOL.filter(o=>Math.abs(o.x-target.x)<=2&&Math.abs(o.y-target.y)<=2&&o.z!==target.z);c=cand.length>=3&&rnd(4)?cand[rnd(cand.length)]:POOL[rnd(POOL.length)];}else c=POOL[rnd(POOL.length)];opts.add(c.z);}
  const arr=[...opts];for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  cur={type,target,opts:arr,done:false};renderQ();
}
function renderQ(){
  const {type,target,opts}=cur;const qt=$('qText');qt.textContent='';
  $('qType').textContent=['符號 → 名稱','名稱 → 原子序','位置 → 符號'][type];
  if(type===0){const s=document.createElement('span');s.className='big-sym';s.textContent=target.sym;qt.append(s,'是哪一種元素？');}
  else if(type===1){qt.append(`「${target.zh}」的原子序是多少？`);}
  else{qt.append(target.group?`第 ${target.period} 週期、第 ${target.group} 族的元素是？`:`${target.z<72?'鑭':'錒'}系第 ${target.x-2} 個元素是？`);}
  const box=$('qOpts');box.textContent='';
  opts.forEach(z=>{const e=E[z-1];const b=document.createElement('button');b.type='button';b.className=type===1?'num':'';b.textContent=type===0?e.zh:type===1?e.z:e.sym;b.dataset.z=z;b.onclick=()=>answer(z,b);box.append(b);});
  $('qScore').textContent=`答對 ${QZ.correct}/${QZ.asked}`+(QZ.asked?`（${Math.round(QZ.correct/QZ.asked*100)}%）`:'');
  const weak=Object.entries(QZ.perElement).filter(([,v])=>v.wrong>0).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,5).map(([z])=>E[z-1].zh);
  $('qWeak').textContent=weak.length?'常錯：'+weak.join('、'):'';
}
function answer(z,btn){
  if(cur.done)return;cur.done=true;const ok=z===cur.target.z;
  QZ.asked++;if(ok)QZ.correct++;const pe=QZ.perElement[cur.target.z]||(QZ.perElement[cur.target.z]={n:0,wrong:0});pe.n++;if(!ok)pe.wrong++;
  store.set('quiz',QZ);
  [...$('qOpts').children].forEach(b=>{if(+b.dataset.z===cur.target.z)b.classList.add('right');else if(b===btn)b.classList.add('wrong');});
  $('qScore').textContent=`答對 ${QZ.correct}/${QZ.asked}（${Math.round(QZ.correct/QZ.asked*100)}%）`;
  const t=cur.target;$('qText').append(document.createElement('br'),Object.assign(document.createElement('small'),{textContent:(ok?'答對！':'答錯了。')+`${t.zh} ${t.sym}，${t.z} 號`}));
  $('qNext').focus();
}
$('qNext').onclick=newQ;
$('qReset').onclick=()=>{QZ.asked=0;QZ.correct=0;QZ.perElement={};store.set('quiz',QZ);renderQ();toast('已重設測驗紀錄');};

/* ---------- views ---------- */
function setView(v){
  S.view=v;saveS();
  [['table','mTable','vTableView'],['list','mList','vListView'],['quiz','mQuiz','vQuizView']].forEach(([k,b,s])=>{$(b).setAttribute('aria-pressed',k===v);$(s).hidden=k!==v;});
  $('legend').hidden=v==='quiz';$('tempRow').hidden=v==='quiz'||S.colorBy!=='phase';
  if(v==='list')renderList();
  if(v==='quiz'){if(!cur)newQ();if(isMobile())closeDetail();}
  if(v==='table')layout();
}
$('mTable').onclick=()=>setView('table');$('mList').onclick=()=>setView('list');$('mQuiz').onclick=()=>setView('quiz');

let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800);}

layout();paint();setView(['table','list','quiz'].includes(S.view)?S.view:'table');
if(S.view!=='quiz')openDetail(lastZ);
window.__pt={E,cfgFull,cfgShort,shells,phaseAt,search,openDetail,setZoom,get zoom(){return zoom},S,paint,setView};
})();
</script>
</body></html>
