<script>
(() => {
'use strict';
const P = 'shift-calendar:v1:';
const store = {

const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]); } for (const c of kids) if (c != null) n.append(c); return n; };
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- date helpers (day numbers via UTC) ---------- */
const dnOf = s => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const dsOf = n => { const t = new Date(n * 86400000); return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0'); };

/* ---------- data ---------- */
const TEMPLATES = [

];

function sanitize(d) {

    const sw = el('input', { type: 'checkbox', id: 'p2-on', checked: p.on ? 'checked' : false }); sw.onchange = () => { p.on = sw.checked; renderSettings(); };
    body.append(el('label', { class: 'switch', for: 'p2-on' }, sw, el('span', { text: '在月曆中並列第二位成員的班別' })));
    body.append(el('p', { class: 'hint', text: '兩人同一天都休假時，月曆格左上角會出現 ★，方便約時間。' }));
    const nm = el('input', { type: 'text', id: 'p2-name', value: p.name, maxlength: 8 }); nm.oninput = () => { p.name = nm.value.trim() || '成員二'; };
    body.append(el('label', { class: 'lbl', for: 'p2-name', text: '成員名稱' }), nm);
    if (p.on) body.append(ruleEditor(p.rules, 2));
  } else {
    const nm = el('input', { type: 'text', id: 'gen-name', value: draft.name, maxlength: 20 }); nm.oninput = () => { draft.name = nm.value.trim() || '我的班表'; };
    body.append(el('label', { class: 'lbl', for: 'gen-name', text: '班表名稱（顯示在標題與匯出圖片）' }), nm);
    body.append(el('span', { class: 'lbl', text: '一週開始於' }));
    const ws = el('div', { class: 'seg' });
    [[1, '週一'], [0, '週日']].forEach(([v, t]) => ws.append(el('button', { type: 'button', id: 'ws-' + v, 'aria-pressed': String(draft.weekStart === v), text: t, onclick: () => { draft.weekStart = v; renderSettings(); } })));
    body.append(ws);
    body.append(el('span', { class: 'lbl', text: '外觀' }));
    const th = el('div', { class: 'seg' });
    [['auto', '跟隨系統'], ['light', '淺色'], ['dark', '深色']].forEach(([v, t]) => th.append(el('button', { type: 'button', id: 'theme-' + v, 'aria-pressed': String(theme === v), text: t, onclick: () => { theme = v; store.set('theme', v); applyTheme(); renderSettings(); } })));
    body.append(th);
    body.append(el('span', { class: 'lbl', text: '資料' }));
    body.append(el('div', { class: 'actions' },
      el('button', { type: 'button', class: 'btn', id: 'clear-ov', text: `清除所有手動改班（${Object.keys(draft.overrides).length}）`, onclick: async () => { if (await confirmBox('會刪除所有手動改班與備註，規則不受影響。', '清除')) { draft.overrides = {}; renderSettings(); } } }),
      el('button', { type: 'button', class: 'btn dan', id: 'reset-all', text: '還原範例資料', onclick: async () => { if (await confirmBox('會清除你所有的班別、規則與改班，回到範例。', '還原')) { draft = sampleData(); segIdx = 0; renderSettings(); } } })));
    body.append(el('p', { class: 'hint', text: '資料只存在這台裝置的瀏覽器中。' }));
  }
}
$('#setSave').onclick = () => {
  const err = m => { $('#setErr').textContent = m; };
  if (draft.shifts.some(s => !s.short || !s.name)) return err('每個班別都需要名稱與簡稱。');
  if (draft.shifts.some(s => (s.start && !s.end) || (!s.start && s.end))) return err('上下班時間要同時填寫，或同時留空（休假）。');
  const all = [...draft.rules, ...(draft.people[0].on ? draft.people[0].rules : [])];
  if (all.some(r => !r.sequence.length)) return err('循環序列是空的，至少要有 1 天。');
  if (all.some(r => !validDate(r.from))) return err('請填寫規則的起始日。');
  const froms = draft.rules.map(r => r.from); if (new Set(froms).size !== froms.length) return err('兩段規則的起始日相同，請修改。');
  if (!draft.people[0].rules.length) draft.people[0].rules = [{ from: todayStr(), type: 'cycle', sequence: [draft.shifts[0].id] }];
  draft.sample = false;

};

/* ---------- export PNG ---------- */
let dl = null;
(async () => { try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; } })();
function drawPng() {
  const W = 1080, pad = 56, cw = (W - pad * 2) / 7, ch = 132, p2 = data.people[0] && data.people[0].on;
  const H = 210 + 56 + ch * 6 + 260;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const F = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#151b26'; g.font = `800 64px ${F}`; g.textBaseline = 'alphabetic';
  g.fillText(`${curY} 年 ${curM} 月`, pad, 120);
  g.font = `600 32px ${F}`; g.fillStyle = '#4f5867'; g.fillText(data.name + (p2 ? '＋' + data.people[0].name : ''), pad, 170);
  g.fillStyle = '#151b26'; g.fillRect(pad, 196, W - pad * 2, 4);
  const top = 210;
  g.fillRect(pad, top, W - pad * 2, 56);
  g.fillStyle = '#ffffff'; g.font = `700 28px ${F}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 7; i++) g.fillText(WD[(i + data.weekStart) % 7], pad + cw * i + cw / 2, top + 28);
  const first = dnOf(`${curY}-${String(curM).padStart(2, '0')}-01`), start = first - mod(dow(first) - data.weekStart, 7);
  const y0 = top + 56;
  for (let i = 0; i < 42; i++) {
    const n = start + i, ds = dsOf(n), m = Number(ds.slice(5, 7)), d = Number(ds.slice(8));
    const x = pad + (i % 7) * cw, y = y0 + Math.floor(i / 7) * ch, out = m !== curM;
    g.fillStyle = out ? '#f3f4f6' : '#ffffff'; g.fillRect(x, y, cw, ch);
    g.strokeStyle = '#d5d9e0'; g.lineWidth = 2; g.strokeRect(x, y, cw, ch);
    g.globalAlpha = out ? .4 : 1;
    const w = dow(n); g.fillStyle = (w === 0 || w === 6) ? '#c63d28' : '#151b26';
    g.font = `700 28px ${F}`; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(String(d), x + 12, y + 10);
    const ids = [shiftOn(ds)]; if (p2) ids.push(shiftOn(ds, 1));
    const bw = p2 ? (cw - 30) / 2 : cw - 24, bh = 62;
    ids.forEach((id, k) => {
      const s = shiftById(id); if (!s) return;
      const bx = x + 12 + k * (bw + 6), by = y + 54;
      if (k === 1) { g.fillStyle = '#ffffff'; roundRect(g, bx + 2, by + 2, bw - 4, bh - 4, 9); g.fill(); g.strokeStyle = s.color; g.lineWidth = 4; g.stroke(); }
      else { g.fillStyle = s.color; roundRect(g, bx, by, bw, bh, 10); g.fill(); }
      g.fillStyle = k === 1 ? '#151b26' : textOn(s.color); g.font = `800 ${p2 ? 34 : 40}px ${F}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(s.short, bx + bw / 2, by + bh / 2 + 2);
    });
    if (data.overrides[ds]) { g.fillStyle = '#d6452f'; g.beginPath(); g.moveTo(x + cw - 26, y + 2); g.lineTo(x + cw - 2, y + 2); g.lineTo(x + cw - 2, y + 26); g.fill(); }
    if (p2 && isRest(shiftById(ids[0])) && isRest(shiftById(ids[1]))) { g.fillStyle = '#d6452f'; g.font = `800 26px ${F}`; g.textAlign = 'right'; g.textBaseline = 'top'; g.fillText('★', x + cw - 12, y + 10); }
    g.globalAlpha = 1;
  }
  // legend + stats
  const st = monthStats(curY, curM);
  let ly = y0 + ch * 6 + 50, lx = pad;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  for (const s of data.shifts) {
    const label = `${s.name}${isRest(s) ? '' : ' ' + s.start + '–' + s.end}  ${st.counts[s.id] || 0} 天`;
    g.font = `500 26px ${F}`; const tw = g.measureText(label).width;
    if (lx + 52 + tw > W - pad) { lx = pad; ly += 56; }
    g.fillStyle = s.color; roundRect(g, lx, ly - 20, 40, 40, 7); g.fill();
    g.fillStyle = textOn(s.color); g.font = `800 24px ${F}`; g.textAlign = 'center'; g.fillText(s.short, lx + 20, ly + 1);
    g.fillStyle = '#151b26'; g.font = `500 26px ${F}`; g.textAlign = 'left'; g.fillText(label, lx + 52, ly);
    lx += 52 + tw + 34;
  }
  ly += 70;
  g.fillStyle = '#151b26'; g.font = `800 40px ${F}`; g.fillText(`總工時 ${fmtH(st.hours)} 小時`, pad, ly);
  g.font = `500 24px ${F}`; g.fillStyle = '#6b7280'; g.textAlign = 'right';
  g.fillText((p2 ? '★ 共同休假　' : '') + '紅色三角＝手動改班', W - pad, ly);
  return c;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function exportPng() {
  const c = drawPng();
  const fname = `班表-${curY}-${String(curM).padStart(2, '0')}.png`;
  if (dl) {
    try {
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await dl.save({ filename: fname, data: blob }); toast('已匯出 ' + fname); return;
    } catch (e) { if (String(e && (e.message || e)).toLowerCase().includes('declin')) return; }
  }
  $('#expImg').src = c.toDataURL('image/png');
  $('#expMsg').textContent = '長按（或右鍵）圖片即可儲存或分享給家人。';
  $('#expDlg').showModal();
}

window.__sc = { ruleShift, shiftOn, hoursOf, monthStats, dnOf, dsOf, get data() { return data; }, drawPng };
render();
})();
