<title>多功能計時器</title>
<style>
/* Instrument-panel look: cool steel gray, hairline cards, cobalt accent, phase colors for intervals */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #12171d;
  --ink-2: #3f4854;
  --muted: #5f6975;
  --line: #d2d8df;
  --line-strong: #aeb7c2;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #dfe7fb;
  --work: #c9342a;
  --rest: #1b7f46;
  --prep: #a77a00;
  --work-tint: #fbe5e2;
  --rest-tint: #dcf1e3;
  --prep-tint: #f8edc8;
  --done: #e08a00;
  --done-tint: #ffe9c2;
  --fast: #1b7f46;
  --slow: #c9342a;
  --overlay: rgba(14, 18, 24, .48);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #171b20; --surface-2: #1e232a; --ink: #e9edf2; --ink-2: #c0c8d2; --muted: #8f99a5;
    --line: #2a3139; --line-strong: #46505c; --accent: #86a6ff; --accent-ink: #0a1022; --accent-soft: #1d2741;
    --work: #ff7166; --rest: #5ad18f; --prep: #f1c445; --work-tint: #3b1b19; --rest-tint: #12301f; --prep-tint: #332a0d;
    --done: #ffb02e; --done-tint: #3e2b08; --fast: #5ad18f; --slow: #ff7166; --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #171b20; --surface-2: #1e232a; --ink: #e9edf2; --ink-2: #c0c8d2; --muted: #8f99a5;
  --line: #2a3139; --line-strong: #46505c; --accent: #86a6ff; --accent-ink: #0a1022; --accent-soft: #1d2741;
  --work: #ff7166; --rest: #5ad18f; --prep: #f1c445; --work-tint: #3b1b19; --rest-tint: #12301f; --prep-tint: #332a0d;
  --done: #ffb02e; --done-tint: #3e2b08; --fast: #5ad18f; --slow: #ff7166; --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(12px, env(safe-area-inset-top)) calc(32px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; }

/* Top bar */
.top { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line-strong); }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.brand p { margin: 0; font: 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .06em; }
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--ink-2); border: 1px solid transparent; }
.icon-btn svg { width: 22px; height: 22px; }
@media (hover: hover) {
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost:hover, .icon-btn:hover { background: var(--surface-2); }
}

/* Quick presets */
.quick { display: flex; align-items: center; gap: 8px; padding: 12px 0; overflow-x: auto; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick-label { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; flex: none; }
.chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--surface); font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.chip small { font-family: var(--sans); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 2px; }
@media (hover: hover) { .chip:hover { border-color: var(--accent); color: var(--accent); } }

/* Cards */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1060px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  --tint: var(--surface); --phase: var(--accent);
  position: relative; background: var(--tint); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px 12px; transition: transform .2s ease, background-color .3s ease, opacity .2s ease;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.card[data-phase="work"] { --tint: var(--work-tint); --phase: var(--work); border-color: color-mix(in srgb, var(--work) 35%, var(--line)); }
.card[data-phase="rest"] { --tint: var(--rest-tint); --phase: var(--rest); border-color: color-mix(in srgb, var(--rest) 35%, var(--line)); }
.card[data-phase="prep"] { --tint: var(--prep-tint); --phase: var(--prep); border-color: color-mix(in srgb, var(--prep) 40%, var(--line)); }
.card.is-done { --phase: var(--done); border-color: var(--done); animation: flash 1s steps(2, jump-none) infinite; }
.card.is-done.acked { animation: none; --tint: var(--surface); border-color: var(--line); }
@keyframes flash { 0% { background: var(--done-tint); } 100% { background: var(--surface); } }
.card.dragging { z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.18); transform: scale(1.02); transition: none; }
.card.swiping { transition: none; }
.card-head { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.grip { width: 32px; height: 44px; display: grid; place-items: center; color: var(--muted); cursor: grab; touch-action: none; flex: none; margin-left: -6px; }
.grip svg { width: 16px; height: 16px; }
.tag { flex: none; font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2); letter-spacing: .04em; }
.name { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 15px; min-height: 44px; padding: 0 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name-input { flex: 1; min-width: 0; height: 40px; font: 600 16px var(--sans); padding: 0 8px; border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); color: var(--ink); }
.del { color: var(--muted); }
.card-body { display: flex; align-items: center; gap: 14px; margin-top: 2px; }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .ticks { stroke: var(--line-strong); }
.ring .prog { stroke: var(--phase); transition: stroke .3s; }
.play { position: absolute; inset: 12px; border-radius: 50%; background: var(--phase); color: var(--accent-ink); display: grid; place-items: center; }
.card[data-phase] .play, .card.is-done .play { color: #fff; }
:root[data-theme="dark"] .card[data-phase] .play, :root[data-theme="dark"] .card.is-done .play { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card[data-phase] .play, :root:not([data-theme="light"]) .card.is-done .play { color: #111; } }
.play svg { width: 24px; height: 24px; }
.readout { flex: 1; min-width: 0; }
.time { display: block; font: 600 48px/1.05 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; color: var(--ink); border-radius: 4px; text-align: left; width: 100%; }
.time.long { font-size: 36px; }
.time.xlong { font-size: 30px; }
.time .cs { font-size: .55em; color: var(--muted); letter-spacing: 0; }
.card.adjustable .time { touch-action: none; cursor: ns-resize; }
.sub { margin-top: 4px; font-size: 13px; color: var(--muted); min-height: 20px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sub b { color: var(--phase); font-weight: 700; }
.foot { display: flex; gap: 8px; margin-top: 10px; }
.foot .btn { flex: 1; padding: 0 8px; }
.foot .btn svg { width: 18px; height: 18px; }
.stop-btn { flex: 1; min-height: 52px; border-radius: 6px; background: var(--done); color: #1a1200; font-weight: 800; font-size: 18px; letter-spacing: .1em; }
.laps { margin-top: 8px; border-top: 1px dashed var(--line-strong); }
.laps summary { min-height: 44px; display: flex; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; list-style: none; gap: 6px; }
.laps summary::-webkit-details-marker { display: none; }
.laps summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .2s; margin: 0 4px; }
.laps[open] summary::before { transform: rotate(45deg); }
.lap-list { margin: 0; padding: 0; list-style: none; max-height: 200px; overflow-y: auto; font: 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
.lap-list li { display: grid; grid-template-columns: 3.5em 1fr 1fr; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
.lap-list li span:nth-child(2), .lap-list li span:nth-child(3) { text-align: right; }
.lap-list li span:nth-child(3) { color: var(--muted); }
.lap-list li.fast span:nth-child(2) { color: var(--fast); font-weight: 700; }
.lap-list li.slow span:nth-child(2) { color: var(--slow); font-weight: 700; }
.lap-head { font: 600 11px/1 var(--mono) !important; color: var(--muted); letter-spacing: .06em; }
.del-reveal { position: absolute; inset: 1px; opacity: 0; border-radius: 8px; background: var(--work); color: #fff; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; font-weight: 700; z-index: -1; }
.slot { position: relative; z-index: 0; }
.slot:has(.card.swiping) .del-reveal, .slot.removing .del-reveal { opacity: 1; }
.empty { padding: 40px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px; }
.note { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--surface); color: var(--ink);
  border-radius: 12px 12px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border: 1px solid var(--line-strong); border-bottom: 0;
}
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 12px; border-bottom: 1px solid var(--line-strong); } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow-y: auto; } .sheet { max-height: none; border-radius: 0 0 12px 12px; } }
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
.seg button { min-height: 44px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span, .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.input { height: 44px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); color: var(--ink); font: 16px var(--sans); width: 100%; }
.hms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hms label { display: grid; gap: 4px; }
.hms .input { font: 600 26px var(--mono); text-align: center; height: 56px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.grid2 label { display: grid; gap: 4px; }
.grid2 .input { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tpls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tpl { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 22px; background: var(--surface-2); }
.tpl button { min-height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600; position: relative; }
.tpl button::after { content: ""; position: absolute; inset: -2px 0; }
.tpl .x { padding: 0 10px 0 4px; color: var(--muted); }
.summary { font: 13px/1.5 var(--mono); color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
.err { color: var(--work); font-size: 13px; font-weight: 600; min-height: 20px; margin: -4px 0 8px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .btn { flex: 1 1 120px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.switch-row:last-of-type { border-bottom: 0; }
.switch-row div { display: grid; }
.switch-row small { color: var(--muted); font-size: 12px; }
.switch { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line-strong); position: relative; flex: none; cursor: pointer; margin: 0; }
.switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::before { transform: translateX(20px); }
.switch::after { content: ""; position: absolute; inset: -8px; }
.theme-seg { margin: 12px 0 0; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 4px 4px 4px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.toast button { min-height: 44px; padding: 0 12px; font-weight: 700; color: var(--bg); text-decoration: underline; }
.toast:not(:has(button:not([hidden]))) { padding: 12px 16px; }

/* Fullscreen */
.fs { position: fixed; inset: 0; z-index: 50; background: var(--tint, var(--bg)); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); --phase: var(--accent); }
.fs[data-phase="work"] { --tint: var(--work-tint); --phase: var(--work); }
.fs[data-phase="rest"] { --tint: var(--rest-tint); --phase: var(--rest); }
.fs[data-phase="prep"] { --tint: var(--prep-tint); --phase: var(--prep); }
.fs.is-done { --phase: var(--done); animation: flash 1s steps(2, jump-none) infinite; }
.fs-name { font-size: 16px; color: var(--muted); font-weight: 600; }
.fs-phase { font-size: clamp(20px, 6vw, 44px); font-weight: 800; color: var(--phase); letter-spacing: .1em; min-height: 1.2em; }
.fs-time { font: 600 22vw/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; white-space: nowrap; margin: 2vh 0; }
.fs-time .cs { font-size: .5em; color: var(--muted); }
.fs-round { font: 600 clamp(14px, 3.5vw, 22px) var(--mono); color: var(--ink-2); min-height: 1.3em; }
.fs-pause { width: 96px; height: 96px; border-radius: 50%; background: var(--phase); color: #fff; display: grid; place-items: center; margin-top: 3vh; }
.fs-pause svg { width: 40px; height: 40px; }
.fs-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); flex-wrap: wrap; }
.fs-top { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 12px; }
.fs.hide-ctl .fs-bar, .fs.hide-ctl .fs-top, .fs.hide-ctl .fs-pause { visibility: hidden; }
@media (orientation: landscape) and (max-height: 560px) {
  .fs { flex-direction: column; }
  .fs-time { margin: 0; }
  .fs-pause { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: 64px; height: 64px; margin: 0; }
  .fs-pause svg { width: 28px; height: 28px; }
  .fs-bar { justify-content: flex-end; padding-right: max(16px, env(safe-area-inset-right)); }

@media (prefers-reduced-motion: reduce) {

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>多功能計時器</h1>
      <p id="clock">--:--:--</p>
    </div>
    <button class="btn btn-primary" id="addBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增
    </button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <nav class="quick" aria-label="快速倒數">
    <span class="quick-label">快速</span>
    <button class="chip" type="button" data-min="1">1<small>分</small></button>
    <button class="chip" type="button" data-min="3">3<small>分</small></button>
    <button class="chip" type="button" data-min="5">5<small>分</small></button>
    <button class="chip" type="button" data-min="10">10<small>分</small></button>
    <button class="chip" type="button" data-min="15">15<small>分</small></button>
    <button class="chip" type="button" data-min="30">30<small>分</small></button>
  </nav>

  <main class="grid" id="list" aria-live="off"></main>
  <div class="empty" id="empty" hidden>還沒有計時器。點「新增」或上方快速按鈕建立。</div>
  <p class="note">提示：左滑卡片可刪除；倒數暫停時，在時間數字上下滑動可 ±1 分鐘；按住左側握把拖曳可排序。頁面重新整理後計時會依時間戳接續。手機鎖屏或切到背景時瀏覽器可能暫停頁面，屆時無法發出提示音，回到畫面後會補算並標示結束時間。若沒有聲音，請關閉手機靜音模式。</p>
</div>

<div class="scrim" id="addScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <h2 id="addTitle">新增計時器</h2>
    <div class="seg" role="group" aria-label="類型" id="typeSeg">
      <button type="button" id="typeCountdown" data-type="countdown" aria-pressed="true">倒數</button>
      <button type="button" id="typeStopwatch" data-type="stopwatch" aria-pressed="false">碼錶</button>
      <button type="button" id="typeInterval" data-type="interval" aria-pressed="false">間歇</button>

<script>

  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grip: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="3" r="1.4"/><circle cx="11" cy="3" r="1.4"/><circle cx="5" cy="8" r="1.4"/><circle cx="11" cy="8" r="1.4"/><circle cx="5" cy="13" r="1.4"/><circle cx="11" cy="13" r="1.4"/></svg>'
};
const TYPE_LABEL = { countdown: '倒數', stopwatch: '碼錶', interval: '間歇' };
const PHASE_LABEL = { prep: '準備', work: '運動', rest: '休息', setrest: '組間休息' };

let timers = store.get(K.timers, null);
function validTimer(t) { return t && typeof t.id === 'string' && TYPE_LABEL[t.type] && ['idle','running','paused','done'].includes(t.status); }

}

  timers = [];
  timers.push(newTimer('countdown', { name: '範例：燉湯', duration: 40 * 60000 }));
  timers.push(newTimer('countdown', { name: '範例：煮麵', duration: 8 * 60000 }));

// ---------- time math ----------
function elapsedOf(t, now) { return t.pausedElapsed + (t.status === 'running' ? Math.max(0, now - t.startAt) : 0); }

}

// ---------- audio ----------

function logic() {

    </article>`;

    slot, card, name: card.querySelector('.name'), play: card.querySelector('.play'), prog: card.querySelector('.prog'),
    time: card.querySelector('.time'), sub: card.querySelector('.sub'), foot: card.querySelector('.foot'),
    laps: card.querySelector('.laps'), lastText: '', lastSub: '', lastOff: -1, lastPhase: null

function updateCard(t, now) {

// ---------- gestures ----------
function attachGestures(t, e) {
  const card = e.card;

  card.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.grip') || ev.target.closest('input')) return;
    if (card.classList.contains('adjustable') && ev.target.closest('.time')) return;
    sx = ev.clientX; sy = ev.clientY; sw = false; pid = ev.pointerId; dx = 0;
  });
  card.addEventListener('pointermove', ev => {
    if (pid !== ev.pointerId) return;
    const mx = ev.clientX - sx, my = ev.clientY - sy;
    if (!sw) {

      if (mx < -12 && Math.abs(mx) > Math.abs(my) * 1.5) { sw = true; card.classList.add('swiping'); try { card.setPointerCapture(ev.pointerId); } catch {} }
    }

    if (pid !== ev.pointerId) return; pid = null;

  };

  card.addEventListener('pointercancel', ev => { if (pid === ev.pointerId) { pid = null; card.classList.remove('swiping'); card.style.transform = ''; } });

  // vertical swipe on time: ±1 min

  e.time.addEventListener('pointerdown', ev => {
    if (!card.classList.contains('adjustable')) return;
    ty = ev.clientY; tAcc = 0; tid = ev.pointerId; try { e.time.setPointerCapture(ev.pointerId); } catch {}
  });
  e.time.addEventListener('pointermove', ev => {
    if (tid !== ev.pointerId || ty === null) return;
    const d = ty - ev.clientY;
    const steps = Math.trunc(d / 28) - tAcc;
    if (steps) {
      tAcc += steps;
      const nd = Math.min(MAX_MS, Math.max(t.pausedElapsed + 1000, t.duration + steps * 60000));

  // drag reorder via grip
  const grip = card.querySelector('.grip');
  let gid = null, gy0 = 0;
  grip.addEventListener('pointerdown', ev => {

  });

    if (gid !== ev.pointerId) return;

    const slots = [...listEl.children];
    for (const s of slots) {
      if (s === e.slot) continue;

      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {

        gy0 += e.slot.getBoundingClientRect().top - before;

}
$('#fsPause').addEventListener('click', ev => { ev.stopPropagation(); const t = fsTimer(); if (t) toggle(t); });
$('#fsReset').addEventListener('click', ev => { ev.stopPropagation(); const t = fsTimer(); if (t) reset(t); });
$('#fsLap').addEventListener('click', ev => { ev.stopPropagation(); const t = fsTimer(); if (t) lap(t); });
$('#fsStop').addEventListener('click', ev => { ev.stopPropagation(); const t = fsTimer(); if (t) ack(t); });
$('#fsExit').addEventListener('click', ev => { ev.stopPropagation(); const id = fsId; closeFs(); const e = els.get(id); if (e) e.play.focus(); });
fs.addEventListener('click', ev => { if (!ev.target.closest('button')) fs.classList.toggle('hide-ctl'); });
document.addEventListener('keydown', ev => {
  if (!fsId) return;
  if (ev.key === 'Escape') { closeFs(); }
  else if (ev.key === ' ' && ev.target === document.body) { ev.preventDefault(); const t = fsTimer(); if (t) toggle(t); }
});

// ---------- main loop ----------
function frame() {
  if (document.visibilityState === 'visible') {
    const now = Date.now();
    for (const t of timers) if (t.status === 'running') updateCard(t, now);
    if (fsId) updateFs(false);
    $('#clock').textContent = new Date(now).toLocaleTimeString('zh-TW', { hour12: false });
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    // mark stale ticks so we don't beep for crossings that happened while hidden
    for (const t of timers) { const r = rtOf(t); r.lastSec = null; r.lastIdx = null; }
    logic(); timers.forEach(refreshCard);
  }
  syncWake();
});
addEventListener('storage', ev => { if (ev.key === K.timers) { const v = store.get(K.timers, null); if (Array.isArray(v)) {
  // update the existing objects in place: each card's listeners close over its timer object
  const old = new Map(timers.map(t => [t.id, t]));
  timers = v.filter(validTimer).map(n => { const o = old.get(n.id); if (!o) return n; for (const k of Object.keys(o)) if (!(k in n)) delete o[k]; return Object.assign(o, n); });
  renderAll(); } } });

// Initial: settle anything that finished while the page was closed (no sound for stale ones)
(function boot() {
  const now = Date.now();
  for (const t of timers) {
    if (t.status !== 'running') continue;
    if (t.type !== 'stopwatch' && elapsedOf(t, now) >= t.duration) { t.status = 'done'; t.doneAt = t.startAt + (t.duration - t.pausedElapsed); t.pausedElapsed = t.duration; t.ack = false; }
  }
  save(); renderAll(); syncWake(); requestAnimationFrame(frame);
})();

// test hook for automated verification
window.__timerDeck = { get timers() { return timers; }, phasesOf, locate, fmtCountdown, fmtSW, readCountdown };
})();
</script>
