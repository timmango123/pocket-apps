<title>單位換算</title>
<style>
/* Drafting-table look: cool grey paper, ink-blue type, tabular numerals, ruler ticks under the main field. */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --ink: #0f2430;
  --muted: #566a75;
  --line: #d3dbdf;
  --line-strong: #a9b8c0;
  --accent: #0a6a86;
  --accent-ink: #ffffff;
  --accent-soft: #e0eff3;
  --star: #b07600;
  --warn-bg: #fff2c2;
  --warn-ink: #5c4300;
  --err: #b42318;
  --err-soft: #fde8e6;
  --tick: #8ea2ac;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1418; --surface: #152027; --surface-2: #111a20; --ink: #e3edf1; --muted: #93a8b2;
    --line: #26353d; --line-strong: #3d525c; --accent: #4fb8d4; --accent-ink: #04161d; --accent-soft: #163541;
    --star: #f2b84b; --warn-bg: #3d3112; --warn-ink: #f5dc8f; --err: #ff8a80; --err-soft: #3a1a18; --tick: #4d6470;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #152027; --surface-2: #111a20; --ink: #e3edf1; --muted: #93a8b2;
  --line: #26353d; --line-strong: #3d525c; --accent: #4fb8d4; --accent-ink: #04161d; --accent-soft: #163541;
  --star: #f2b84b; --warn-bg: #3d3112; --warn-ink: #f5dc8f; --err: #ff8a80; --err-soft: #3a1a18; --tick: #4d6470;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-block: 12px calc(88px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; }

header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
header.top h1 { font-size: 20px; font-weight: 750; letter-spacing: .02em; margin: 0; flex: 1; }
header.top h1 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; letter-spacing: 0; }
.icon-btn {
  min-width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-size: 13px;
}
.icon-btn svg { width: 18px; height: 18px; }

/* category tabs */
.tabs {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
  margin: 0 -16px 14px; padding: 0 16px; scroll-snap-type: x proximity;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted);
  font-size: 15px; font-weight: 600; position: relative; scroll-snap-align: start;
}
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--accent); border-radius: 2px 2px 0 0;
}

/* main field */
.source {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 0; margin-bottom: 14px;
}
.source label.cap { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; margin-bottom: 4px; }
.source .row1 { display: flex; gap: 10px; align-items: stretch; }
#main-value {
  flex: 1 1 auto; min-width: 0; width: 100%; font-family: var(--mono); font-size: 32px !important; font-weight: 600;
  font-variant-numeric: tabular-nums; border: 0; background: transparent; padding: 4px 0; height: 52px;
}
#main-value:focus-visible { outline: none; }
.source:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.select-wrap { position: relative; flex: 0 0 auto; max-width: 46%; }
#main-unit {
  appearance: none; -webkit-appearance: none; height: 52px; min-width: 96px; max-width: 100%; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 32px 0 12px; font-weight: 650; font-size: 16px;
  text-overflow: ellipsis;
}
.select-wrap::after {
  content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.ruler {
  height: 12px; margin: 6px -14px 0; border-top: 1px solid var(--line);
  background:
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 50px) 0 0 / 100% 10px no-repeat,
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 10px) 0 0 / 100% 5px no-repeat;
  opacity: .7; border-radius: 0 0 14px 14px;
}
.msgline { min-height: 22px; font-size: 13px; color: var(--muted); margin-top: 2px; font-family: var(--mono); overflow-wrap: anywhere; }
.msgline.err { color: var(--err); font-family: var(--sans); font-weight: 600; }
.ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.op {
  min-width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--mono); font-size: 16px; position: relative;
}
.op::after { content: ""; position: absolute; inset: -4px -2px; }

/* results */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 8px; gap: 8px; }
.sec-head h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 700; }
.sec-head .hint { font-size: 12px; color: var(--muted); }
.results { display: grid; gap: 6px; touch-action: pan-y; }
.r {
  display: grid; grid-template-columns: 40px minmax(54px, auto) minmax(0, 1fr) 44px; align-items: center; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 56px; padding-right: 2px;
  position: relative;
}
.r.is-src { border-color: var(--accent); background: var(--accent-soft); }
.r.is-src::before {
  content: "來源"; position: absolute; top: -8px; right: 50px; font-size: 11px; font-weight: 700; color: var(--accent-ink);
  background: var(--accent); padding: 0 6px; border-radius: 4px; line-height: 16px;
}
.star, .copy {
  width: 44px; height: 44px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center;
  color: var(--line-strong); border-radius: 10px;
}
.star { width: 40px; }
.star svg, .copy svg { width: 18px; height: 18px; }
.star[aria-pressed="true"] { color: var(--star); }
.copy { color: var(--muted); }
.r .lab {
  border: 0; background: none; text-align: left; padding: 6px 4px; min-height: 44px; display: flex; flex-direction: column;
  justify-content: center; line-height: 1.2;
}
.r .lab b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.r .lab span { font-size: 12px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.r input.val {
  width: 100%; min-width: 0; border: 0; background: transparent; text-align: right; font-family: var(--mono);
  font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; padding: 8px 4px; height: 44px; border-radius: 8px;
}
.r input.val:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
.r input.val::placeholder { color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 500; }
.r.unset input.val { cursor: pointer; }

/* rates */
.rates { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.rates h2 { font-size: 15px; margin: 0 0 2px; }
.rates p.sub { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.banner { border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-bottom: 10px; background: var(--warn-bg); color: var(--warn-ink); }
.rate-row { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.rate-row:first-of-type { border-top: 0; }
.rate-row .code { font-family: var(--mono); font-weight: 700; font-size: 15px; line-height: 1.1; }
.rate-row .code small { display: block; font-family: var(--sans); font-weight: 500; color: var(--muted); font-size: 11px; }
.rate-field { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rate-field input {
  width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2);
  padding: 0 10px; font-family: var(--mono); font-size: 16px; text-align: right;
}
.rate-field input[aria-invalid="true"] { border-color: var(--err); background: var(--err-soft); }
.rate-field span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rate-row .date { font-size: 11px; color: var(--muted); text-align: right; min-width: 64px; line-height: 1.2; }
.rate-row .date.sample { color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px; padding: 2px 6px; text-align: center; }
.rate-row .rerr { grid-column: 2 / -1; color: var(--err); font-size: 12px; font-weight: 600; margin-top: -2px; }

/* bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.bar .in { max-width: 1080px; margin: 0 auto; display: flex; gap: 10px; }
.bar button { height: 48px; border-radius: 12px; font-weight: 700; font-size: 15px; border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 16px; }
.bar #swap { flex: 1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar #swap .u { font-family: var(--mono); font-weight: 600; }

.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 9; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.swipe-hint { font-size: 12px; color: var(--muted); text-align: center; margin: 12px 0 0; }

@media (hover: hover) {
  .tab:hover { color: var(--ink); }
  .r .lab:hover b { color: var(--accent); }
  .star:hover, .copy:hover { background: var(--surface-2); }
  .icon-btn:hover, .op:hover, .bar button:hover { border-color: var(--accent); }
}

/* desktop: vertical category menu, two-column results */
@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; align-items: start; }
  .tabs { flex-direction: column; border-bottom: 0; border-right: 1px solid var(--line); margin: 0; padding: 0 12px 0 0; position: sticky; top: 12px; overflow: visible; }
  .tab { text-align: left; padding: 0 14px; border-radius: 8px; }
  .tab[aria-selected="true"] { background: var(--accent-soft); }
  .tab[aria-selected="true"]::after { left: auto; right: -13px; top: 8px; bottom: 8px; width: 3px; height: auto; border-radius: 2px 0 0 2px; }
  .results { grid-template-columns: 1fr 1fr; gap: 8px; }
  .bar { position: static; background: none; border: 0; padding: 14px 0 0; }
  .bar .in { max-width: 420px; margin: 0 0 0 auto; }
  .swipe-hint { display: none; }
  .toast { bottom: 24px; }
}
@media (max-height: 500px) and (max-width: 899px) {
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .bar { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  .bar button { height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>單位換算<small>離線可用</small></h1>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="切換主題">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      <span id="theme-label">自動</span>

  </header>

  <div class="layout">
    <nav class="tabs" id="tabs" role="tablist" aria-label="換算類別"></nav>

    <main>

          <input id="main-value" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="main-msg">
          <div class="select-wrap"><select id="main-unit" aria-label="來源單位"></select></div>
        </div>
        <div class="msgline" id="main-msg" aria-live="polite"></div>

          <button class="op" type="button" data-op="-" aria-label="減">−</button>

          <button class="op" type="button" data-op="(" aria-label="左括號">(</button>
          <button class="op" type="button" data-op=")" aria-label="右括號">)</button>

      <p class="swipe-hint">在結果區左右滑動可切換類別</p>

        <div class="in">

<script>
(() => {
'use strict';
const KEY = k => 'unit-convert:v1:' + k;
const store = {
  get(k, def) { try { const s = localStorage.getItem(KEY(k)); if (s == null) return def; return JSON.parse(s); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch (e) {} }
};

/* ---------- unit tables: factors as fractions n/d of the base unit ---------- */
const F = (n, d = 1) => ({ n, d });
const CATS = [
  { id: 'length', name: '長度', base: 'm', def: ['m', 'ft', '1'], units: [
    ['mm', '公釐', 'mm', F(1, 1000)], ['cm', '公分', 'cm', F(1, 100)], ['m', '公尺', 'm', F(1)], ['km', '公里', 'km', F(1000)],
    ['in', '英寸', 'in', F(254, 10000)], ['ft', '英尺', 'ft', F(3048, 10000)], ['yd', '碼', 'yd', F(9144, 10000)],
    ['mi', '英里', 'mi', F(1609344, 1000)], ['tchi', '台尺', '', F(10, 33)], ['tcun', '台寸', '', F(1, 33)] ] },
  { id: 'weight', name: '重量', base: 'kg', def: ['tjin', 'g', '1'], units: [
    ['g', '公克', 'g', F(1, 1000)], ['kg', '公斤', 'kg', F(1)], ['t', '公噸', 't', F(1000)],
    ['oz', '盎司', 'oz', F(28349523125, 1e12)], ['lb', '磅', 'lb', F(45359237, 1e8)],
    ['tjin', '台斤', '', F(3, 5)], ['tliang', '台兩', '', F(3, 80)], ['sjin', '市斤', '', F(1, 2)] ] },
  { id: 'temp', name: '溫度', temp: true, def: ['F', 'C', '100'], units: [
    ['C', '攝氏', '°C'], ['F', '華氏', '°F'], ['K', '絕對溫度', 'K'] ] },
  { id: 'area', name: '面積', base: 'm²', def: ['ping', 'm2', '1'], units: [
    ['m2', '平方公尺', 'm²', F(1)], ['km2', '平方公里', 'km²', F(1e6)], ['ha', '公頃', 'ha', F(1e4)],
    ['ping', '坪', '', F(400, 121)], ['jia', '甲', '', F(1173600, 121)], ['fen', '分', '', F(117360, 121)],
    ['ft2', '平方英尺', 'ft²', F(9290304, 1e8)], ['acre', '英畝', 'acre', F(40468564224, 1e7)] ] },
  { id: 'volume', name: '體積', base: 'L', def: ['L', 'cup', '1'], units: [
    ['mL', '毫升', 'mL', F(1, 1000)], ['L', '公升', 'L', F(1)], ['m3', '立方公尺', 'm³', F(1000)],
    ['usgal', '美制加侖', 'US gal', F(3785411784, 1e9)], ['ukgal', '英制加侖', 'UK gal', F(454609, 1e5)],
    ['cup', '杯', '240 mL', F(6, 25)], ['tbsp', '大匙', '15 mL', F(3, 200)], ['tsp', '小匙', '5 mL', F(1, 200)] ] },
  { id: 'speed', name: '速度', base: 'm/s', def: ['kmh', 'mph', '100'], units: [
    ['kmh', '公里/時', 'km/h', F(1000, 3600)], ['ms', '公尺/秒', 'm/s', F(1)],
    ['mph', '英里/時', 'mph', F(1609344, 3600000)], ['kn', '節', 'kn', F(1852, 3600)] ] },
  { id: 'fx', name: '匯率', fx: true, def: ['TWD', 'USD', '1000'], units: [
    ['TWD', '新台幣', 'TWD'], ['USD', '美元', 'USD'], ['JPY', '日圓', 'JPY'], ['EUR', '歐元', 'EUR'],
    ['CNY', '人民幣', 'CNY'], ['KRW', '韓元', 'KRW'], ['HKD', '港幣', 'HKD'] ] }
];
const SAMPLE_RATES = { USD: 32.1, JPY: 0.215, EUR: 35.2, CNY: 4.5, KRW: 0.0235, HKD: 4.12 };
const unitOf = (cat, id) => cat.units.find(u => u[0] === id);
const catById = id => CATS.find(c => c.id === id) || CATS[0];

/* ---------- persistent state ---------- */
let rates = store.get('rates', null);
if (!rates || typeof rates !== 'object') {
  rates = {};
  for (const k in SAMPLE_RATES) rates[k] = { rate: SAMPLE_RATES[k], updated: null, sample: true };
}
let favs = store.get('favs', {});
if (!favs || typeof favs !== 'object') favs = {};
const lastRaw = store.get('last', null);
const last = (lastRaw && typeof lastRaw === 'object') ? lastRaw : {};
const perCat = {};
for (const c of CATS) {
  const saved = last.per && last.per[c.id];
  const ok = saved && unitOf(c, saved.src) && unitOf(c, saved.prev);
  perCat[c.id] = ok ? { src: saved.src, prev: saved.prev, text: String(saved.text ?? '') } : { src: c.def[0], prev: c.def[1], text: c.def[2] };
}
let curCat = catById(last.cat).id;
let editing = null;      // unit id whose row input is being typed in, or null
let saveTimer = 0;
function saveLast() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set('last', { cat: curCat, per: perCat }), 300);
}

/* ---------- parsing ---------- */
function normalize(s) {
  return String(s)
    .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // full-width ASCII
    .replace(/[×＊]/g, '*').replace(/[÷]/g, '/').replace(/[−–—]/g, '-').replace(/。/g, '.')
    .replace(/[,\s　、]/g, '');
}
// Recursive-descent parser for + - * / ( ) and decimal numbers (no eval).
function evaluate(src) {
  const s = normalize(src);
  if (!s) return { empty: true };
  if (!/^[0-9.+\-*/()eE]+$/.test(s)) return { error: '請輸入數字' };
  let i = 0;
  const peek = () => s[i];
  function num() {
    const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(s.slice(i));
    if (!m) throw 0;
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function factor() {
    const c = peek();
    if (c === '+') { i++; return factor(); }
    if (c === '-') { i++; return -factor(); }
    if (c === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    return num();
  }
  function term() {
    let v = factor();
    while (peek() === '*' || peek() === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : v / r; }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  try {
    const v = expr();
    if (i !== s.length || !isFinite(v)) return { error: '請輸入數字' };
    const isExpr = /[+\-*/()]/.test(s.replace(/^[+-]/, '').replace(/[eE][+-]/g, ''));
    return { value: v, isExpr };
  } catch (e) { return { error: '請輸入數字' }; }
}

/* ---------- conversion ---------- */
function factorOf(cat, id) {
  if (cat.fx) {
    if (id === 'TWD') return F(1);
    const r = rates[id];
    return (r && r.rate > 0) ? F(r.rate) : null;
  }
  return unitOf(cat, id)[3];
}
const toC = { C: v => v, F: v => (v - 32) * 5 / 9, K: v => v - 273.15 };
const fromC = { C: v => v, F: v => v * 9 / 5 + 32, K: v => v + 273.15 };
// returns number, or null (rate not set)
function convert(cat, v, from, to) {
  if (from === to) return v;
  if (cat.temp) return fromC[to](toC[from](v));
  const a = factorOf(cat, from), b = factorOf(cat, to);
  if (!a || !b) return null;
  return (v * a.n * b.d) / (a.d * b.n);
}
function round10(x) { return Number(x.toPrecision(10)); }
const nf = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 16 });
function fmt(x) {
  if (x === 0 || Object.is(x, -0)) return { show: '0', raw: '0' };
  const a = Math.abs(x);
  if (a >= 1e12 || a < 1e-6) {
    const [m, e] = x.toExponential(9).split('e');
    const mm = m.replace(/\.?0+$/, '');
    const s = mm + 'e' + (e[0] === '+' ? e.slice(1) : e);
    return { show: s, raw: s };
  }
  const r = round10(x);
  return { show: nf.format(r), raw: String(r) };
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const tabsEl = $('tabs'), resEl = $('results'), mainVal = $('main-value'), mainUnit = $('main-unit'), msgEl = $('main-msg');
const ratesEl = $('rates'), rateRows = $('rate-rows'), banner = $('rate-banner'), swapBtn = $('swap');
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';

for (const c of CATS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.id = 'tab-' + c.id; b.dataset.cat = c.id; b.textContent = c.name;
  tabsEl.appendChild(b);
}
const rowRefs = new Map(); // unit id -> {row, input}

function unitLabel(u) { return u[2] ? u[1] + ' ' + u[2] : u[1]; }
function shortSym(u) { return u[2] && !/\s/.test(u[2]) ? u[2] : u[1]; }
function favList() { return favs[curCat] || []; }

function buildCategory() {
  const cat = catById(curCat);
  for (const b of tabsEl.children) b.setAttribute('aria-selected', String(b.dataset.cat === curCat));
  const active = tabsEl.querySelector('[aria-selected="true"]');
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  mainUnit.innerHTML = '';
  for (const u of cat.units) { const o = document.createElement('option'); o.value = u[0]; o.textContent = unitLabel(u); mainUnit.appendChild(o); }
  ratesEl.hidden = !cat.fx;
  if (cat.fx) buildRates();
  buildRows();
  const st = perCat[curCat];
  mainUnit.value = st.src;
  mainVal.value = st.text;
  recalc();
}

function buildRows() {
  const cat = catById(curCat);
  const fl = favList();
  const order = cat.units.slice().sort((a, b) => {
    const fa = fl.indexOf(a[0]), fb = fl.indexOf(b[0]);
    if ((fa >= 0) !== (fb >= 0)) return fa >= 0 ? -1 : 1;
    if (fa >= 0) return fa - fb;
    return cat.units.indexOf(a) - cat.units.indexOf(b);
  });
  resEl.innerHTML = '';
  rowRefs.clear();
  for (const u of order) {
    const fav = fl.includes(u[0]);
    const row = document.createElement('div');
    row.className = 'r'; row.dataset.unit = u[0];
    row.innerHTML =
      `<button class="star" type="button" data-act="star" aria-pressed="${fav}" aria-label="${fav ? '取消常用' : '設為常用'}：${u[1]}">${fav ? STAR : STAR_O}</button>` +
      `<button class="lab" type="button" data-act="src" aria-label="把${u[1]}設為來源單位"><b></b><span></span></button>` +
      `<input class="val" id="val-${cat.id}-${u[0]}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${unitLabel(u)} 數值">` +
      `<button class="copy" type="button" data-act="copy" aria-label="複製${u[1]}數值">${COPY}</button>`;
    row.querySelector('b').textContent = u[1];
    row.querySelector('.lab span').textContent = u[2] || ' ';
    if (!u[2]) row.querySelector('.lab span').hidden = true;
    resEl.appendChild(row);
    rowRefs.set(u[0], { row, input: row.querySelector('input'), raw: '' });
  }
}

let curValue = null; // number in source unit, or null
function setMsg(text, err) { msgEl.textContent = text; msgEl.classList.toggle('err', !!err); }

function recalc() {
  const cat = catById(curCat);
  const st = perCat[curCat];
  const ev = evaluate(st.text);
  let value = null, err = '';
  if (ev.error) err = ev.error;
  else if (!ev.empty) {
    value = ev.value;
    if (cat.temp && toC[st.src](value) < -273.15 - 1e-9) { err = '低於絕對零度（−273.15 °C），無法換算'; value = null; }
    if (cat.fx && value != null && !factorOf(cat, st.src)) { err = '尚未設定 ' + st.src + ' 匯率，請在上方填入'; value = null; }
  }
  curValue = value;
  if (err) setMsg(err, true);
  else if (ev.isExpr && value != null) setMsg('= ' + fmt(value).show);
  else setMsg('');
  for (const [id, ref] of rowRefs) {
    ref.row.classList.toggle('is-src', id === st.src);
    const isUnset = cat.fx && !factorOf(cat, id);
    ref.row.classList.toggle('unset', isUnset);
    ref.input.readOnly = isUnset;
    if (id === editing) continue;
    if (isUnset) { ref.input.value = ''; ref.input.placeholder = '未設定'; ref.raw = ''; continue; }
    ref.input.placeholder = value == null ? '—' : '';
    if (value == null) { ref.input.value = ''; ref.raw = ''; continue; }
    const out = convert(cat, value, st.src, id);
    if (out == null) { ref.input.value = ''; ref.input.placeholder = '未設定'; ref.raw = ''; continue; }
    const f = fmt(out);
    ref.input.value = f.show; ref.raw = f.raw;
  }
  const pu = unitOf(cat, st.prev), su = unitOf(cat, st.src);
  swapBtn.innerHTML = '交換　<span class="u"></span>';
  swapBtn.querySelector('.u').textContent = shortSym(su) + ' ⇄ ' + shortSym(pu);
  swapBtn.setAttribute('aria-label', '交換來源單位：' + su[1] + ' 與 ' + pu[1]);
  saveLast();
}

function setSource(id, keepQuantity) {
  const cat = catById(curCat);
  const st = perCat[curCat];
  if (id === st.src) return;
  let newText = st.text;
  if (keepQuantity && curValue != null) {
    const out = convert(cat, curValue, st.src, id);
    if (out != null) newText = fmt(out).raw;
  }
  st.prev = st.src; st.src = id; st.text = newText;
  mainUnit.value = id; mainVal.value = newText;
  recalc();
}

/* ---------- rates ---------- */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function buildRates() {
  const cat = catById('fx');
  rateRows.innerHTML = '';
  for (const u of cat.units) {
    if (u[0] === 'TWD') continue;
    const r = rates[u[0]];
    const row = document.createElement('div');
    row.className = 'rate-row'; row.dataset.code = u[0];
    row.innerHTML = `<div class="code">${u[0]}<small>${u[1]}</small></div>` +
      `<label class="rate-field"><span>1 ${u[0]} =</span><input id="rate-${u[0]}" type="text" inputmode="decimal" autocomplete="off" placeholder="未設定" aria-label="1 ${u[1]} 等於多少新台幣"><span>TWD</span></label>` +
      `<div class="date"></div><div class="rerr" hidden></div>`;
    row.querySelector('input').value = r && r.rate ? String(r.rate) : '';
    rateRows.appendChild(row);
    updateRateDate(row);
  }
  updateBanner();
}
function updateRateDate(row) {
  const r = rates[row.dataset.code];
  const d = row.querySelector('.date');
  d.classList.toggle('sample', !!(r && r.sample));
  d.textContent = !r || !r.rate ? '—' : r.sample ? '範例' : '更新 ' + (r.updated || '').slice(5).replace('-', '/');
  if (r && r.updated && !r.sample) d.title = r.updated;
}
function updateBanner() {
  const list = Object.entries(rates).filter(([, r]) => r && r.rate);
  const samples = list.filter(([, r]) => r.sample).map(([k]) => k);
  const now = Date.now();
  const stale = list.filter(([, r]) => !r.sample && r.updated && (now - new Date(r.updated + 'T00:00:00').getTime()) > 30 * 864e5).map(([k]) => k);
  const parts = [];
  if (stale.length) parts.push('匯率可能過期：' + stale.join('、') + ' 已超過 30 天未更新。');
  if (samples.length) parts.push(samples.join('、') + ' 目前是範例匯率，換算前請改成你查到的實際數字。');
  banner.hidden = !parts.length;
  banner.textContent = parts.join(' ');
}
rateRows.addEventListener('input', e => {
  const inp = e.target.closest('input'); if (!inp) return;
  const row = inp.closest('.rate-row'), code = row.dataset.code, errEl = row.querySelector('.rerr');
  const ev = evaluate(inp.value);
  if (ev.empty) {
    delete rates[code]; inp.removeAttribute('aria-invalid'); errEl.hidden = true;
  } else if (ev.error || !(ev.value >= 0.0001 && ev.value <= 100000)) {
    inp.setAttribute('aria-invalid', 'true'); errEl.hidden = false;
    errEl.textContent = ev.error ? '請輸入數字' : '匯率需介於 0.0001 到 100000 之間';
    return;
  } else {
    rates[code] = { rate: ev.value, updated: todayStr() };
    inp.removeAttribute('aria-invalid'); errEl.hidden = true;
  }
  store.set('rates', rates);
  updateRateDate(row); updateBanner(); recalc();
});

/* ---------- events ---------- */
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  if (b.dataset.cat === curCat) return;
  curCat = b.dataset.cat; editing = null; buildCategory();
});
tabsEl.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  stepCat(e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1);
  $('tab-' + curCat).focus();
});
function stepCat(d) {
  const i = CATS.findIndex(c => c.id === curCat);
  const n = (i + d + CATS.length) % CATS.length;
  curCat = CATS[n].id; editing = null; buildCategory();
}
mainVal.addEventListener('input', () => { perCat[curCat].text = mainVal.value; editing = null; recalc(); });
mainUnit.addEventListener('change', () => {
  const st = perCat[curCat];
  if (mainUnit.value !== st.src) { st.prev = st.src; st.src = mainUnit.value; }
  recalc();
});
document.querySelector('.ops').addEventListener('click', e => {
  const b = e.target.closest('[data-op]'); if (!b) return;
  const op = b.dataset.op;
  const s = mainVal.selectionStart ?? mainVal.value.length, en = mainVal.selectionEnd ?? s;
  mainVal.value = mainVal.value.slice(0, s) + op + mainVal.value.slice(en);
  mainVal.focus();
  try { mainVal.setSelectionRange(s + 1, s + 1); } catch (_) {}
  perCat[curCat].text = mainVal.value; recalc();
});

resEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  const row = e.target.closest('.r'); if (!row) return;
  const id = row.dataset.unit;
  if (!btn) {
    if (row.classList.contains('unset')) { const ri = $('rate-' + id); if (ri) { ri.focus(); ri.scrollIntoView({ block: 'center' }); } }
    return;
  }
  const act = btn.dataset.act;
  if (act === 'src') { editing = null; setSource(id, true); }
  else if (act === 'star') {
    const list = favList().slice();
    const k = list.indexOf(id);
    if (k >= 0) list.splice(k, 1); else list.push(id);
    favs[curCat] = list; store.set('favs', favs);
    buildRows(); recalc();
    const nb = resEl.querySelector(`.r[data-unit="${CSS.escape(id)}"] .star`); if (nb) nb.focus();
  } else if (act === 'copy') {
    const ref = rowRefs.get(id);
    copyText(ref.raw, ref.input);
  }
});
resEl.addEventListener('input', e => {
  const inp = e.target.closest('input.val'); if (!inp) return;
  const id = inp.closest('.r').dataset.unit;
  const st = perCat[curCat];
  if (st.src !== id) { st.prev = st.src; st.src = id; mainUnit.value = id; }
  editing = id;
  st.text = inp.value; mainVal.value = inp.value;
  recalc();
});
resEl.addEventListener('focusout', e => {
  if (e.target.matches && e.target.matches('input.val') && editing) { editing = null; recalc(); }
});
resEl.addEventListener('focusin', e => {
  const inp = e.target.closest('input.val');
  if (inp && !inp.readOnly) { try { inp.select(); } catch (_) {} }
});

$('swap').addEventListener('click', () => {
  const st = perCat[curCat];
  editing = null;
  setSource(st.prev, true);
});
$('clear').addEventListener('click', () => {
  perCat[curCat].text = ''; mainVal.value = ''; editing = null; recalc(); mainVal.focus();
});

// swipe on results to change category
let sx = 0, sy = 0, swiping = false;
resEl.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; swiping = true; }, { passive: true });
resEl.addEventListener('touchend', e => {
  if (!swiping) return; swiping = false;
  const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepCat(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- copy & toast ---------- */
const toastEl = $('toast'); let toastT = 0;
function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1600); }
function copyText(text, fallbackInput) {
  if (!text) { toast('沒有可複製的數值'); return; }
  const fallback = () => {
    if (fallbackInput) { fallbackInput.focus(); try { fallbackInput.select(); } catch (_) {} }
    toast('無法自動複製，已選取數值，請手動複製');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已複製 ' + text), fallback);
    } else fallback();
  } catch (e) { fallback(); }
}

/* ---------- theme ---------- */
const THEMES = ['auto', 'light', 'dark'], TLABEL = { auto: '自動', light: '淺色', dark: '深色' };
let theme = store.get('theme', 'auto'); if (!THEMES.includes(theme)) theme = 'auto';
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  $('theme-label').textContent = TLABEL[theme];
}
$('theme-btn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(); });
applyTheme();

buildCategory();
window.__uc = { evaluate, convert: (c, v, a, b) => convert(catById(c), v, a, b), fmt };
})();
</script>
</body></html>
