<title>分帳小幫手</title>
<style>
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#16202a; --ink-2:#4a5866; --ink-3:#66737f;
  --line:#d3dae1; --line-strong:#aeb9c4;
  --accent:#0a6b57; --accent-ink:#ffffff; --accent-soft:#d8eee7;
  --credit:#0a6b57; --debt:#ad2c36; --debt-soft:#f8e1e3; --warn:#8a5a00;
  --focus:#1c5fd1; --scrim:rgba(14,20,26,.45); --shadow:0 1px 0 rgba(16,24,32,.06), 0 6px 18px -10px rgba(16,24,32,.25);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --surface:#161e26; --surface-2:#1d2731; --ink:#e5ebf0; --ink-2:#a3b2bf; --ink-3:#8796a4;
    --line:#2a3743; --line-strong:#3e4d5b;
    --accent:#4cc2a0; --accent-ink:#04231b; --accent-soft:#163a31;
    --credit:#5ad0ad; --debt:#ff8c92; --debt-soft:#3a1e22; --warn:#f0c060;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161e26; --surface-2:#1d2731; --ink:#e5ebf0; --ink-2:#a3b2bf; --ink-3:#8796a4;
  --line:#2a3743; --line-strong:#3e4d5b;
  --accent:#4cc2a0; --accent-ink:#04231b; --accent-soft:#163a31;
  --credit:#5ad0ad; --debt:#ff8c92; --debt-soft:#3a1e22; --warn:#f0c060;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding:12px 16px calc(96px + env(safe-area-inset-bottom));min-height:100%;}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* Header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;
  background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1}
.mark small{font-size:9px;font-weight:600;letter-spacing:.12em;opacity:.75;margin-top:3px}
.evname{flex:1;min-width:0;position:relative}
.evname label{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.evname input{width:100%;border:0;border-bottom:1.5px dashed var(--line-strong);background:transparent;padding:2px 0 4px;font-size:18px;font-weight:700;border-radius:0}
.evname input:focus{outline:none;border-bottom-color:var(--accent)}
.iconbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.menu{position:absolute;right:0;top:50px;z-index:30;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu button{display:block;width:100%;min-height:44px;text-align:left;padding:0 12px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.menu button.danger{color:var(--debt)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.topright{position:relative}

.sample{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:12px}
.sample span{flex:1}
.sample button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px}

/* Sections */
.sec{margin-bottom:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sechead h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.sechead .meta{font-size:12px;color:var(--ink-3)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-weight:600}
.chip .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700}
.hint{font-size:13px;color:var(--ink-3);margin:2px 2px 0}

/* Expense list */
.list{display:flex;flex-direction:column;gap:8px}
.item{position:relative;border-radius:12px}
.item .del{position:absolute;right:0;top:0;bottom:0;width:120px;border:0;border-radius:12px;padding-left:32px;background:var(--debt);color:var(--surface);font-weight:700;cursor:pointer;visibility:hidden}
.item.reveal .del{visibility:visible}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;touch-action:pan-y;transition:transform .2s ease;width:100%;text-align:left}
.card.drag{transition:none}
.card .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right}
.card .s{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--ink-3);text-align:right}
.empty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* Receipt result */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px 16px;position:relative;box-shadow:var(--shadow)}
.receipt::before,.receipt::after{content:"";position:absolute;left:-1px;right:-1px;height:8px;
  background:radial-gradient(circle at 6px 0, var(--bg) 4.5px, transparent 5px) 0 0/12px 8px repeat-x}
.receipt::before{top:-1px}
.receipt::after{bottom:-1px;transform:rotate(180deg)}
.rhead{text-align:center;border-bottom:1.5px dashed var(--line-strong);padding-bottom:10px;margin-bottom:10px}
.rhead .ttl{font-weight:800;font-size:16px;letter-spacing:.04em;word-break:break-all}
.rhead .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.rhead .total{font-family:var(--mono);font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;color:var(--ink-3);text-align:right;padding:4px 0;letter-spacing:.06em}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-top:1px dotted var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--sans);font-weight:600;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pos{color:var(--credit);font-weight:700}
td.neg{color:var(--debt);font-weight:700}
.xfers{margin-top:12px;border-top:1.5px dashed var(--line-strong);padding-top:10px}
.xfers h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 0;border-bottom:1px dotted var(--line)}
.xf .amt{margin-left:auto}
.xf .who{max-width:38%}
.xf .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xf .from{color:var(--debt)} .xf .to{color:var(--credit)}
.xf .arr{color:var(--ink-3);font-size:13px}
.xf .amt{font-family:var(--mono);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.xf .note{flex-basis:100%;font-size:12px;color:var(--ink-3);margin-top:-4px}
.done{padding:10px 0;text-align:center;color:var(--ink-2);font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--debt);color:var(--debt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions .btn{flex:1}
.manual{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-family:var(--mono);font-size:14px}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .btn{width:100%;max-width:560px;display:block;margin:0 auto;min-height:56px;font-size:17px;border-radius:14px;box-shadow:var(--shadow)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.txt{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px}
.txt:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.txt.amt{font-family:var(--mono);font-size:20px;font-weight:700}
.err{color:var(--debt);font-size:13px;margin-top:4px;min-height:0}
.okmsg{color:var(--credit);font-size:13px;margin-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface);cursor:pointer;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center}
.prow span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .preview{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:right}
.prow3{grid-template-columns:minmax(0,1fr) 90px 90px}
.sheetact{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.sheetact .btn{flex:1}
.sheetact .btn.danger{flex:0 0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;gap:6px;align-items:stretch}
.hrow .go{flex:1;min-height:52px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;cursor:pointer;min-width:0}
.hrow .go b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .go small{color:var(--ink-3);font-size:12px}
.hrow .go[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hrow .x{width:48px;border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--debt);cursor:pointer}
.dlgmsg{margin:0 0 16px;color:var(--ink-2)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}
.toast button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--bg);font-weight:800;cursor:pointer;text-decoration:underline}
.toast.plain{padding:12px 16px}

@media (hover:hover){
  .chip:hover,.iconbtn:hover,.btn:hover,.pick button:hover,.hrow .go:hover{border-color:var(--ink-3)}
  .menu button:hover{background:var(--surface-2)}
  .btn.primary:hover{filter:brightness(1.07)}
  .card:hover{border-color:var(--line-strong)}
}
@media (min-width:900px){
  body{padding:24px 32px 32px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
  .right{position:sticky;top:24px}
  .bar{position:static;padding:0;background:none;margin-top:10px}
  .bar .btn{max-width:none}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:86%}
  .sheet .grab{display:none}
  .toast{bottom:24px}
}
@media (max-height:500px) and (min-width:600px){ .bar{background:none;pointer-events:none} .bar .btn{pointer-events:auto;min-height:48px;max-width:260px;margin:0 0 0 auto;font-size:16px} body{padding-bottom:calc(76px + env(safe-area-inset-bottom))} }
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<script>
(() => {
'use strict';
const KEY_EVENTS = 'split-bill:v1:events', KEY_CUR = 'split-bill:v1:current';
const MAX_MEMBERS = 30, MAX_EVENTS = 50, MAX_CENTS = 999999900;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); };

/* ---------- storage ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }

function sanitizeEvent(e){
  if (!e || typeof e !== 'object' || typeof e.id !== 'string') return null;
  const members = Array.isArray(e.members) ? e.members.filter(m => m && typeof m.id==='string' && typeof m.name==='string').slice(0,MAX_MEMBERS) : [];
  const ids = new Set(members.map(m=>m.id));
  const expenses = (Array.isArray(e.expenses)?e.expenses:[]).filter(x => x && typeof x.id==='string' && Number.isInteger(x.amountCents) && x.amountCents>0 && ids.has(x.payerId) && ['equal','amount','ratio'].includes(x.mode) && x.shares && typeof x.shares==='object')
    .map(x => { const sh = {}; for (const k in x.shares) if (ids.has(k) && Number.isFinite(+x.shares[k]) && +x.shares[k] > 0) sh[k] = Math.round(+x.shares[k]); return {...x, title:String(x.title||'費用'), shares:sh}; })
    .filter(x => Object.keys(x.shares).length && (x.mode!=='amount' || Object.values(x.shares).reduce((a,b)=>a+b,0)===x.amountCents));
  return { id:e.id, name:String(e.name||'未命名活動').slice(0,40), members, expenses,
    currency: typeof e.currency==='string' ? e.currency.slice(0,4) : '$', roundInt: !!e.roundInt, sample: !!e.sample,
    updatedAt: Number(e.updatedAt)||Date.now() };
}
function load(){
  let arr = [];
  try { const raw = JSON.parse(lsGet(KEY_EVENTS) || '[]'); if (Array.isArray(raw)) arr = raw.map(sanitizeEvent).filter(Boolean); } catch(e){ arr = []; }
  return arr;
}
let events = load();
let curId = lsGet(KEY_CUR);
function save(){
  events.sort((a,b)=>b.updatedAt-a.updatedAt);
  if (events.length > MAX_EVENTS) events = events.slice(0, MAX_EVENTS);
  lsSet(KEY_EVENTS, JSON.stringify(events)); lsSet(KEY_CUR, curId);
}
function cur(){ return events.find(e=>e.id===curId); }
function touch(){ const e = cur(); if (e) e.updatedAt = Date.now(); save(); render(); }

function makeSample(){
  const m = ['小明','小華','小美','阿傑'].map(n=>({id:uid(), name:n}));
  const [a,b,c,d] = m.map(x=>x.id);
  const all = o => Object.fromEntries(m.map(x=>[x.id,1]));
  return { id:uid(), name:'週五燒肉聚餐（範例）', sample:true, currency:'$', roundInt:false, updatedAt:Date.now(), members:m, expenses:[

/* ---------- money ---------- */
function parseAmount(str){
  const s = String(str).trim().replace(/,/g,'');
  if (!s) return {err:'請輸入金額'};
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return {err: /^-/.test(s) ? '金額不可為負數' : '請輸入數字，最多兩位小數'};
  const [i,f=''] = s.split('.');
  if (i.length > 9) return {err:'金額上限 9,999,999'};
  const c = parseInt(i,10)*100 + parseInt((f+'00').slice(0,2),10);
  if (c <= 0) return {err:'金額必須大於 0'};
  if (c > MAX_CENTS) return {err:'金額上限 9,999,999'};
  return {cents:c};
}
function fmt(c, sym){
  const e = cur(); sym = sym ?? (e ? e.currency : '$');
  const neg = c < 0; c = Math.abs(c);
  const i = Math.floor(c/100), f = c%100;
  return (neg?'−':'') + sym + i.toLocaleString('en-US') + (f ? '.' + String(f).padStart(2,'0') : '');
}
function centsToInput(c){ const f=c%100; return Math.floor(c/100) + (f? '.'+String(f).padStart(2,'0') : ''); }

/* allocation: returns {memberId: cents} for one expense, following member order */
function allocate(exp, members){
  const order = members.map(m=>m.id).filter(id => exp.shares[id] > 0);
  const out = {}; const total = exp.amountCents;
  if (!order.length) return out;
  if (exp.mode === 'amount'){ order.forEach(id => out[id] = exp.shares[id]); return out; }
  const w = order.map(id => exp.mode==='ratio' ? exp.shares[id] : 1);
  const W = w.reduce((a,b)=>a+b,0);
  let used = 0;
  order.forEach((id,i) => { out[id] = Math.floor(total * w[i] / W); used += out[id]; });
  let r = total - used, i = 0;
  while (r > 0){ out[order[i % order.length]]++; r--; i++; }
  return out;
}
function computeNets(e){
  const paid = {}, owed = {};
  e.members.forEach(m => { paid[m.id]=0; owed[m.id]=0; });
  for (const x of e.expenses){
    paid[x.payerId] += x.amountCents;
    const a = allocate(x, e.members);
    for (const k in a) owed[k] += a[k];
  }
  return e.members.map(m => ({id:m.id, name:m.name, paid:paid[m.id], owed:owed[m.id], net:paid[m.id]-owed[m.id]}));
}
function settle(rows){
  const cred = rows.filter(r=>r.net>0).map(r=>({id:r.id, v:r.net}));
  const debt = rows.filter(r=>r.net<0).map(r=>({id:r.id, v:-r.net}));
  const out = [];
  // exact matches first
  for (const d of debt){
    const c = cred.find(c => c.v === d.v && c.v > 0);
    if (c && d.v > 0){ out.push({from:d.id, to:c.id, c:d.v}); c.v = 0; d.v = 0; }
  }
  for (;;){
    const cs = cred.filter(x=>x.v>0).sort((a,b)=>b.v-a.v), ds = debt.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    if (!cs.length || !ds.length) break;
    const t = Math.min(cs[0].v, ds[0].v);
    out.push({from:ds[0].id, to:cs[0].id, c:t}); cs[0].v -= t; ds[0].v -= t;
  }
  return out;
}
function finalTransfers(e){
  const rows = computeNets(e);
  let xs = settle(rows);
  let note = null;
  if (e.roundInt && xs.length){
    const exact = xs.reduce((a,x)=>a+x.c,0);
    const target = Math.round(exact/100)*100;
    // largest remainder: floor every transfer, then give the leftover dollars to the largest remainders (total = target, never negative)
    xs.forEach(x => { x.exact = x.c; x.c = Math.floor(x.c/100)*100; });
    let left = Math.round((target - xs.reduce((a,x)=>a+x.c,0))/100);
    xs.map((x,i)=>i).sort((a,b)=>(xs[b].exact-xs[b].c)-(xs[a].exact-xs[a].c) || a-b).forEach(i => { if (left > 0){ xs[i].c += 100; left--; } });
    if (target !== exact) note = target - exact;
    xs = xs.filter(x => x.c > 0);
  }
  return {rows, xs, note};
}
window.__splitBill = { allocate, computeNets, settle, finalTransfers, parseAmount };

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, undo){
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => L.innerHTML = '', undo ? 5000 : 2400);

let lastFocus = null;

function closeSheet(){ $('#layer').innerHTML=''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape'){ if ($('#layer').innerHTML) closeSheet(); else closeMenu(); } });

function confirmDlg(title, msg, okLabel='確定', danger=true){
  return new Promise(res => {
    const prev = $('#layer').innerHTML ? null : 1;
    const holder = document.createElement('div');
    holder.innerHTML = `<div class="scrim" style="z-index:50;align-items:center"><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cfT" style="border-radius:16px;max-width:420px;margin:16px"><h2 id="cfT">${esc(title)}</h2><p class="dlgmsg">${esc(msg)}</p>
      <div class="sheetact" style="position:static"><button class="btn ghost" id="cfNo">取消</button>${okLabel?`<button class="btn ${danger?'danger':'primary'}" id="cfOk" style="flex:1">${esc(okLabel)}</button>`:''}</div></div></div>`;
    document.body.appendChild(holder);
    const done = v => { holder.remove(); res(v); };
    holder.querySelector('#cfNo').onclick = () => done(false);
    const ok = holder.querySelector('#cfOk'); if (ok) ok.onclick = () => done(true);
    if (!okLabel) holder.querySelector('#cfNo').textContent = '知道了';
    (ok || holder.querySelector('#cfNo')).focus();
  });
}

/* member sheet */
function memberSheet(mid){
  const e = cur(); const m = mid ? e.members.find(x=>x.id===mid) : null;
  openSheet(`<h2 id="sheetTitle">${m?'編輯成員':'加入成員'}</h2>
    <div class="field"><label for="mName">名稱（1～20 字）</label><input class="txt" id="mName" maxlength="20" autocomplete="off" value="${m?esc(m.name):''}" autofocus><div class="err" id="mErr"></div></div>
    <div class="sheetact">${m?'<button class="btn danger" id="mDel">刪除</button>':''}<button class="btn ghost" id="mCancel">取消</button><button class="btn primary" id="mSave">${m?'儲存':'加入'}</button></div>`, sh => {
    const inp = sh.querySelector('#mName');
    const submit = () => {
      const name = inp.value.trim();
      const err = !name ? '請輸入名稱' : [...name].length > 20 ? '最多 20 字' : e.members.some(x => x.id !== mid && x.name.trim() === name) ? '已有同名成員' : (!m && e.members.length >= MAX_MEMBERS) ? '最多 30 人' : '';
      sh.querySelector('#mErr').textContent = err;
      if (err) { inp.focus(); return; }
      if (m) m.name = name; else e.members.push({id:uid(), name});
      closeSheet(); touch();
      if (!m) toast(`已加入 ${name}`);
    };
    sh.querySelector('#mSave').onclick = submit;
    inp.addEventListener('keydown', ev => { if (ev.key==='Enter') submit(); });
    sh.querySelector('#mCancel').onclick = closeSheet;
    const del = sh.querySelector('#mDel');
    if (del) del.onclick = async () => {
      const payN = e.expenses.filter(x=>x.payerId===mid).length;
      if (payN){ await confirmDlg('無法刪除', `${m.name} 是 ${payN} 筆費用的付款人，請先把那些費用改成其他人付款。`, null); return; }
      const shareN = e.expenses.filter(x=>x.shares[mid]).length;
      if (shareN && !(await confirmDlg(`刪除 ${m.name}？`, `${m.name} 參與了 ${shareN} 筆費用的分攤，刪除後會從這些分攤中移除，由其餘的人重新分攤。`, '刪除'))) return;
      removeMember(e, mid); closeSheet(); touch(); toast(`已刪除 ${m.name}`);
    };
  });
}
function removeMember(e, mid){
  e.members = e.members.filter(x=>x.id!==mid);
  e.expenses.forEach(x => {
    if (!x.shares[mid]) return;
    delete x.shares[mid];
    if (x.mode === 'amount'){ const ids = Object.keys(x.shares); x.mode = 'equal'; x.shares = {}; ids.forEach(i => x.shares[i]=1); }
    if (!Object.keys(x.shares).length) e.members.forEach(mm => x.shares[mm.id]=1);
  });
}

      const shares = {};
      if (st.mode === 'equal') ids.forEach(i => shares[i]=1);
      else if (st.mode === 'ratio') ids.forEach(i => shares[i]=+st.ratio[i]);
      else ids.forEach(i => { const v = String(st.amt[i]).trim(); if (v) { const c = parseAmount(v).cents; if (c) shares[i]=c; } });
      const rec = {id: x0 ? x0.id : uid(), title: q('#xTitle').value.trim() || '未命名費用', amountCents:cents, payerId:st.payer, mode:st.mode, shares};
      if (x0) Object.assign(x0, rec); else e.expenses.push(rec);
      closeSheet(); touch(); toast(x0 ? '已更新' : `已新增 ${rec.title}`);
    };
    const d = q('#xDel'); if (d) d.onclick = () => { closeSheet(); deleteExpense(x0.id); };
  });
}
function deleteExpense(id){
  const e = cur(); const idx = e.expenses.findIndex(x=>x.id===id); if (idx<0) return;
  const [x] = e.expenses.splice(idx,1); touch();
  toast(`已刪除 ${x.title}`, () => { const ev = events.find(v=>v.id===e.id); if (ev){ ev.expenses.splice(Math.min(idx, ev.expenses.length),0,x); touch(); } });
}

/* settings, history */
function settingsSheet(){
  const e = cur();
  const syms = ['$','NT$','¥','€','£','₩','HK$','US$'];
  openSheet(`<h2 id="sheetTitle">幣別與進位</h2>
    <div class="field"><label for="sCur">顯示幣別</label><select class="txt" id="sCur">${syms.map(s=>`<option ${s===e.currency?'selected':''}>${s}</option>`).join('')}</select></div>
    <label class="switch" for="sRound"><input type="checkbox" id="sRound" ${e.roundInt?'checked':''}> 轉帳金額四捨五入到整數元</label>
    <p class="hint">進位後的差額會併入最後一筆轉帳並註明。</p>
    <div class="sheetact"><button class="btn primary" id="sDone">完成</button></div>`, sh => {
    sh.querySelector('#sDone').onclick = () => { e.currency = sh.querySelector('#sCur').value; e.roundInt = sh.querySelector('#sRound').checked; closeSheet(); touch(); };
  });
}
function histSheet(){
  const draw = sh => {
    const list = events.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
    sh.querySelector('#hList').innerHTML = list.map(v => {
      const t = v.expenses.reduce((a,x)=>a+x.amountCents,0);
      const d = new Date(v.updatedAt);
      return `<div class="hrow"><button class="go" data-go="${v.id}" aria-current="${v.id===curId}"><b>${esc(v.name)}</b><small>${v.members.length} 人 · ${fmt(t, v.currency)} · ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</small></button><button class="x" data-rm="${v.id}" aria-label="刪除活動 ${esc(v.name)}">✕</button></div>`;
    }).join('');
  };
  openSheet(`<h2 id="sheetTitle">歷史活動</h2><p class="hint" style="margin:-6px 0 10px">最多保存 50 個，依更新時間排序。</p><div class="hist" id="hList"></div>
    <div class="sheetact"><button class="btn ghost" id="hClose">關閉</button><button class="btn primary" id="hNew">開新活動</button></div>`, sh => {
    draw(sh);
    sh.querySelector('#hClose').onclick = closeSheet;
    sh.querySelector('#hNew').onclick = () => { closeSheet(); newEvent(); };
    sh.querySelector('#hList').addEventListener('click', async ev => {
      const g = ev.target.closest('[data-go]'), r = ev.target.closest('[data-rm]');
      if (g){ curId = g.dataset.go; save(); closeSheet(); render(); }
      if (r){
        const v = events.find(x=>x.id===r.dataset.rm);
        if (!(await confirmDlg(`刪除「${v.name}」？`, '活動與所有費用會一併刪除，無法復原。', '刪除'))) return;
        events = events.filter(x=>x.id!==v.id);
        if (!events.length){ const n = blank(); events.push(n); }
        if (!cur()) curId = events.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
        save(); render(); draw(sh);
      }
    });
  });
}
function blank(){ return {id:uid(), name:'未命名活動', members:[], expenses:[], currency: (cur()||{}).currency || '$', roundInt:false, sample:false, updatedAt:Date.now()}; }
function newEvent(){
  const n = blank(); events.unshift(n); curId = n.id;
  if (events.length > MAX_EVENTS){ events.sort((a,b)=>b.updatedAt-a.updatedAt); events = events.slice(0, MAX_EVENTS); }
  save(); render(); toast('已開新活動，先加入成員吧'); setTimeout(()=>$('#eventName').focus(), 50);
}

/* menu */
function closeMenu(){ $('#menu').hidden = true; $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').onclick = ev => { ev.stopPropagation(); const h = !$('#menu').hidden; $('#menu').hidden = h; $('#menuBtn').setAttribute('aria-expanded', String(!h)); if (!h) $('#mNew').focus(); };
document.addEventListener('click', ev => { if (!ev.target.closest('.topright')) closeMenu(); });
$('#mNew').onclick = () => { closeMenu(); newEvent(); };
$('#sampleNew').onclick = () => newEvent();
$('#mHist').onclick = () => { closeMenu(); histSheet(); };
$('#mSet').onclick = () => { closeMenu(); settingsSheet(); };
$('#mClear').onclick = async () => {
  closeMenu(); const e = cur();
  if (!e.expenses.length){ toast('目前沒有費用'); return; }
  if (!(await confirmDlg('清除所有費用？', `「${e.name}」的 ${e.expenses.length} 筆費用會被清除，成員保留。`, '清除'))) return;
  const old = e.expenses; e.expenses = []; touch();
  toast('已清除費用', () => { e.expenses = old; touch(); });
};

$('#eventName').addEventListener('input', ev => { const e = cur(); e.name = ev.target.value.trim() || '未命名活動'; e.updatedAt = Date.now(); save(); const t = document.querySelector('.rhead .ttl'); if (t) t.textContent = e.name; });
$('#eventName').addEventListener('blur', render);
$('#addExp').onclick = () => expenseSheet();

/* chips: tap or long-press */
let lpTimer = null, lpFired = false;
$('#chips').addEventListener('pointerdown', ev => {
  const c = ev.target.closest('[data-mid]'); if (!c) return;
  lpFired = false; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; if (navigator.vibrate) try{navigator.vibrate(10)}catch(e){} memberSheet(c.dataset.mid); }, 500);
});
['pointerup','pointercancel','pointerleave'].forEach(t => $('#chips').addEventListener(t, () => clearTimeout(lpTimer)));
$('#chips').addEventListener('contextmenu', ev => { if (ev.target.closest('[data-mid]')) ev.preventDefault(); });
$('#chips').addEventListener('click', ev => {
  if (ev.target.closest('#addMember')) return memberSheet();
  const c = ev.target.closest('[data-mid]'); if (!c) return;
  if (lpFired){ lpFired = false; return; }
  memberSheet(c.dataset.mid);
});

/* list: tap to edit, swipe-left to reveal delete */
let sw = null, openCard = null;
function hideDel(card){ setTimeout(() => { if (card.style.transform === '') card.parentElement.classList.remove('reveal'); }, 220); }
function closeOpen(except){ if (openCard && openCard !== except){ openCard.style.transform=''; hideDel(openCard); openCard=null; } }
$('#list').addEventListener('pointerdown', ev => {
  const card = ev.target.closest('.card'); if (!card) return;
  closeOpen(card);
  sw = {card, x:ev.clientX, y:ev.clientY, base: card === openCard ? -88 : 0, dx:0, moved:false, id:ev.pointerId};
});
$('#list').addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.id) return;
  const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y;
  if (!sw.moved){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.moved = true; sw.card.classList.add('drag'); sw.card.parentElement.classList.add('reveal'); try{sw.card.setPointerCapture(ev.pointerId)}catch(e){} } else if (Math.abs(dy) > 10){ sw = null; return; } else return; }
  sw.dx = dx; const t = Math.max(-120, Math.min(0, sw.base + dx));
  sw.card.style.transform = `translateX(${t}px)`;
});
function endSwipe(){
  if (!sw) return; const s = sw; sw = null;
  s.card.classList.remove('drag');
  if (!s.moved) return;
  s.card.dataset.swiped = '1';
  const t = s.base + s.dx;
  if (t < -50){ s.card.style.transform = 'translateX(-88px)'; openCard = s.card; s.card.parentElement.querySelector('.del').tabIndex = 0; }
  else { s.card.style.transform = ''; hideDel(s.card); if (openCard === s.card) openCard = null; }
}
$('#list').addEventListener('pointerup', endSwipe);
$('#list').addEventListener('pointercancel', endSwipe);
$('#list').addEventListener('click', ev => {
  const d = ev.target.closest('[data-del]'); if (d){ openCard = null; deleteExpense(d.dataset.del); return; }
  const c = ev.target.closest('[data-edit]'); if (!c) return;
  if (c.dataset.swiped){ delete c.dataset.swiped; return; }
  if (openCard === c){ closeOpen(); return; }
  expenseSheet(c.dataset.edit);
});
$('#list').addEventListener('keydown', ev => {
  const c = ev.target.closest('[data-edit]');
  if (c && (ev.key === 'Delete' || ev.key === 'Backspace')){ ev.preventDefault(); deleteExpense(c.dataset.edit); }
});

/* copy / share */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) return true;
  } catch(e){}
  return false;
}
$('#receipt').addEventListener('click', async ev => {
  if (ev.target.closest('#copyBtn')){
    const text = resultText();
    if (await copyText(text)) toast('已複製，可以貼到群組了');
    else { const m = $('#manualCopy'); m.hidden = false; m.value = text; m.focus(); m.select(); toast('無法自動複製，請長按文字手動複製'); }
  }
  if (ev.target.closest('#shareBtn')){
    try { await navigator.share({text: resultText()}); } catch(e){ if (e && e.name !== 'AbortError') toast('分享未完成'); }
  }
});

render();
})();
</script>
</body></html>
