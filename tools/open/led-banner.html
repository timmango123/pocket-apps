function closePlayer() {
  player.hidden = true; document.body.style.overflow = ''; playing = false; cancelAnimationFrame(plRaf); plRaf = 0;
  try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {}
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  unlockScreen(); store.set('current', cfg); sync(); pvRefresh(); $('#btnPlay').focus();
}
function updPctl() { $('#pSpd').textContent = '速度 ' + cfg.speed; $('#pPause').innerHTML = playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'; }
let ctlT = 0;
function showCtl() { $('#pctl').classList.remove('hide'); clearTimeout(ctlT); ctlT = setTimeout(() => $('#pctl').classList.add('hide'), 3000); }
function spd(d) { cfg.speed = Math.max(1, Math.min(10, cfg.speed + d)); saveSoon(); updPctl(); }
$('#btnPlay').addEventListener('click', openPlayer);
$('#pSlow').addEventListener('click', () => { spd(-1); showCtl(); });
$('#pFast').addEventListener('click', () => { spd(1); showCtl(); });
$('#pPause').addEventListener('click', () => { playing = !playing; updPctl(); showCtl(); });
$('#pExit').addEventListener('click', closePlayer);
window.addEventListener('resize', () => { if (!player.hidden) sizePlayer(); });
document.addEventListener('fullscreenchange', () => { if (!player.hidden) sizePlayer(); });
// gestures: tap = controls, double tap = exit, horizontal swipe = speed, vertical swipe = next board
let g = null, lastTap = 0;
player.addEventListener('pointerdown', (e) => { if (e.target.closest('.pctl:not(.hide)')) return; g = { x: e.clientX, y: e.clientY, acc: 0, lx: e.clientX, moved: false }; });
player.addEventListener('pointermove', (e) => {
  if (!g) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (Math.hypot(dx, dy) > 12) g.moved = true;
  // in rotated mode the long edge is vertical on screen
  const along = pl.rot ? -(e.clientY - (g.ly ?? g.y)) : e.clientX - g.lx;
  if (pl.rot) g.ly = e.clientY; else g.lx = e.clientX;
  const horiz = pl.rot ? Math.abs(dy) > Math.abs(dx) : Math.abs(dx) > Math.abs(dy);
  if (g.moved && horiz) { g.acc += along; while (Math.abs(g.acc) >= 50) { spd(g.acc > 0 ? 1 : -1); g.acc -= Math.sign(g.acc) * 50; showCtl(); } }
});
player.addEventListener('pointerup', (e) => {
  if (!g) return; const dx = e.clientX - g.x, dy = e.clientY - g.y; const moved = g.moved; g = null;
  const cross = pl.rot ? dx : dy, alongD = pl.rot ? dy : dx;
  if (moved && Math.abs(cross) > 60 && Math.abs(cross) > Math.abs(alongD) * 1.5) { nextBoard(cross > 0 ? -1 : 1); return; }
  if (moved) return;
  const now = performance.now();
  if (now - lastTap < 320) { lastTap = 0; closePlayer(); return; }
  lastTap = now; showCtl();
});
document.addEventListener('keydown', (e) => {
  if (player.hidden) { if (e.key === 'Escape') document.querySelectorAll('.scrim').forEach(d => { if (d.id !== 'dlgFlash') d.hidden = true; }); return; }
  if (e.key === 'Escape') closePlayer();
  else if (e.key === ' ') { e.preventDefault(); playing = !playing; updPctl(); showCtl(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { spd(1); showCtl(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { spd(-1); showCtl(); }
  else if (e.key === 'PageDown' || e.key === 'n') nextBoard(1);
  else if (e.key === 'PageUp') nextBoard(-1);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(plRaf); plRaf = 0; cancelAnimationFrame(pvRaf); pvRaf = 0; store.set('current', cfg); }
  else if (!player.hidden) { lockScreen(); plKick(); } else pvKick();
});

let wake = null, warned = false;
async function lockScreen() {
  try { if ('wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); } else throw 0; }
  catch (e) { if (!warned) { warned = true; toast('無法保持螢幕常亮，請暫時關閉自動鎖定'); } }
}
function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }
let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

window.__led = { encode, decode, Banner, get cfg() { return cfg; }, set cfg(v) { cfg = sanitize(v); sync(); pvRefresh(); }, pv, pl, get saved() { return saved; } };
sync(); pv.resize(false); pvKick();
})();
</script>
</body></html>
