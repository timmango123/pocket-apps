<title>照片濾鏡</title>
<style>
:root{
  --bg:#e6e7e8; --surface:#f5f5f4; --surface-2:#ffffff; --ink:#17181a; --muted:#5a5d62; --line:#c9cbce; --line-2:#dcdddf;

  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111213; --surface:#1a1b1d; --surface-2:#222326; --ink:#e9e8e6; --muted:#a2a3a6; --line:#34363a; --line-2:#28292c;
  --accent:#ff8a7a; --accent-ink:#2a0703; --accent-soft:#3c1d19; --stage:#050506; --stage-ink:#eceae6; --track:#44464b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111213; --surface:#1a1b1d; --surface-2:#222326; --ink:#e9e8e6; --muted:#a2a3a6; --line:#34363a; --line-2:#28292c;
  --accent:#ff8a7a; --accent-ink:#2a0703; --accent-soft:#3c1d19; --stage:#050506; --stage-ink:#eceae6; --track:#44464b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{margin:0 auto 0 4px;font-size:17px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
header h1 small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:6px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--ink)}.btn.primary:not(:disabled):hover{filter:brightness(1.08);border-color:var(--accent)}}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stage{position:relative;background:var(--stage);border-radius:2px;display:grid;place-items:center;width:100%;aspect-ratio:var(--ar,1.5);max-height:min(56vh,560px);min-height:200px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage canvas{max-width:100%;max-height:100%;display:block}
.stage .tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:2px}
.stage .orig{position:absolute;right:8px;top:8px;font-size:12px;color:var(--stage-ink);background:rgba(0,0,0,.55);padding:3px 8px;border-radius:2px}
.stage .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--stage-ink);opacity:.75;pointer-events:none}
.split{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;cursor:ew-resize;touch-action:none}
.split::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.split::after{content:"◀ ▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;font-size:11px;padding:4px 6px;border-radius:2px;white-space:nowrap}
.split .lbl{position:absolute;top:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;white-space:nowrap}
.split .lbl.l{right:30px}.split .lbl.r{left:30px}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 2px 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}

.tabs button:last-child{border-right:0}

.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:10px;margin-top:10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.fthumb{flex:0 0 auto;width:76px;border:0;background:none;padding:0;cursor:pointer;scroll-snap-align:start;text-align:center}
.fthumb .no{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:left;padding-left:2px}
.fthumb canvas{display:block;width:72px;height:72px;margin:0 auto;border:2px solid transparent;border-radius:2px;background:var(--stage)}
.fthumb .nm{display:block;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fthumb[aria-pressed="true"] canvas{border-color:var(--accent)}
.fthumb[aria-pressed="true"] .nm{color:var(--accent);font-weight:700}

.row label{font-size:14px;font-weight:600}
.row output{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row output.on{color:var(--accent);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--track);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--track);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9.5px;border-radius:50%;background:var(--surface-2);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:2px solid var(--ink)}
input[type=range]:focus-visible{outline:2px solid var(--accent)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 4px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.small{font-size:12px;color:var(--muted);margin:6px 0 0}
.cmpPanel p{margin:0 0 8px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:30;padding:16px}
.sheet .card{width:min(520px,100%);background:var(--surface-2);border-radius:4px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:calc(100% - 8px);overflow:auto}
.sheet h2{margin:0 0 10px;font-size:17px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}

.prog{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.result img{display:block;max-width:100%;max-height:50vh;margin:8px auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:3px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.drop{outline:3px dashed var(--accent);outline-offset:-6px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}

  .fp .strip{flex-wrap:wrap;overflow:visible}

}
@media (max-height:600px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}

  .side{max-height:calc(100vh - 70px);overflow:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="app">
  <header class="top">
    <h1>照片濾鏡<small id="dimTop"></small></h1>
    <button class="btn" id="openBtn" type="button">開啟</button>
    <button class="btn" id="resetBtn" type="button">重設</button>
    <button class="btn primary" id="exportBtn" type="button">匯出</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </header>
  <div class="layout">
    <div>
      <div class="stage" id="stage" tabindex="0" aria-label="預覽，長按顯示原圖">
        <canvas id="pv"></canvas>
        <span class="tag" id="sampleTag">範例照片</span>
        <span class="orig" id="origTag" hidden>原圖</span>
        <div class="split" id="split" hidden role="slider" tabindex="0" aria-label="對照分割線" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="lbl l">原圖</span><span class="lbl r">調整後</span></div>
        <span class="hint" id="hint">長按看原圖・左右滑動換濾鏡</span>
      </div>
      <div class="meta"><span id="metaName">sample.jpg</span><span id="metaState">原圖 100%</span></div>
    </div>
    <div class="side">
      <div class="tabs" role="tablist">
        <button class="mob" role="tab" id="tab-filter" aria-selected="true" type="button">濾鏡</button>
        <button class="mob" role="tab" id="tab-adjust" aria-selected="false" type="button">調整</button>
        <button role="tab" id="tab-compare" aria-selected="false" type="button">對照</button>
      </div>
      <div class="panel fp" id="panelFilter">
        <div class="strip" id="strip"></div>
        <div class="row" id="strRow"><label for="strength">強度</label><input type="range" id="strength" min="0" max="100" step="1" value="100"><output id="strOut">100%</output></div>
        <div class="actions"><button class="btn" id="saveCustom" type="button">存成自訂濾鏡</button><button class="btn" id="delCustom" type="button" hidden>刪除此自訂</button></div>
        <p class="small" id="customNote">自訂濾鏡會記住目前的濾鏡、強度與全部調整，最多 10 組。</p>
      </div>
      <div class="panel ap" id="panelAdjust" hidden>
        <div class="subhead"><span>雙擊（或連點兩下）滑桿可歸零</span></div>
        <div id="params"></div>
      </div>
      <div class="panel cmpPanel" id="panelCompare" hidden>
        <p>拖動預覽上的分割線：左側是原圖，右側是調整後。</p>
        <p class="small">鍵盤：按 <b>\</b> 暫時顯示原圖、方向鍵移動分割線。</p>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="exSheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2 id="exTitle">匯出照片</h2>
    <div class="seg" role="radiogroup" aria-label="格式">
      <label><input type="radio" name="fmt" id="fmt-jpg" value="jpg" checked>JPG 92%</label>
      <label><input type="radio" name="fmt" id="fmt-png" value="png">PNG 無損</label>

    <div id="exInfo" class="small"></div>
    <div class="prog" id="exProg" hidden><i></i></div>

    <div class="actions">
      <button class="btn primary" id="exGo" type="button">下載</button>
      <button class="btn" id="exClose" type="button">關閉</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='photo-filter:v1:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};
const toast=(m,ms=2200)=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);};
let dl=null;

/* ---------- parameters ---------- */
const PARAMS=[
  {key:'exposure',label:'曝光',min:-2,max:2,step:0.05,def:0,fmt:v=>(v>0?'+':'')+v.toFixed(2)},
  {key:'brightness',label:'亮度',min:-100,max:100,step:1,def:0},
  {key:'contrast',label:'對比',min:-100,max:100,step:1,def:0},
  {key:'highlights',label:'亮部',min:-100,max:100,step:1,def:0},
  {key:'shadows',label:'陰影',min:-100,max:100,step:1,def:0},
  {key:'saturation',label:'飽和度',min:-100,max:100,step:1,def:0},
  {key:'vibrance',label:'自然飽和',min:-100,max:100,step:1,def:0},
  {key:'temp',label:'色溫',min:-100,max:100,step:1,def:0},
  {key:'tint',label:'色調',min:-100,max:100,step:1,def:0},
  {key:'sharpen',label:'銳利度',min:0,max:100,step:1,def:0},
  {key:'vignette',label:'暈影',min:0,max:100,step:1,def:0},
  {key:'grain',label:'顆粒',min:0,max:100,step:1,def:0},
];
const defParams=()=>Object.fromEntries(PARAMS.map(p=>[p.key,p.def]));

/* ---------- filters (curves → LUT) ---------- */
const FILTERS=[
  {id:'none',name:'原圖'},
  {id:'vivid',name:'鮮明',all:[[0,0],[.25,.2],[.75,.82],[1,1]],sat:.3},
  {id:'warm',name:'暖陽',r:[[0,.02],[.5,.56],[1,1]],b:[[0,0],[.5,.44],[1,.92]],sat:.1},
  {id:'cool',name:'冷調',r:[[0,0],[.5,.45],[1,.95]],b:[[0,.04],[.5,.56],[1,1]],sat:-.05},
  {id:'mono',name:'黑白',mono:true,all:[[0,.02],[1,.98]]},
  {id:'mono-hc',name:'高反差黑白',mono:true,all:[[0,0],[.3,.16],[.7,.86],[1,1]]},
  {id:'sepia',name:'褐色懷舊',mono:true,r:[[0,.1],[.5,.62],[1,1]],g:[[0,.06],[.5,.5],[1,.94]],b:[[0,.02],[.5,.36],[1,.8]]},
  {id:'film',name:'底片',all:[[0,.08],[.5,.5],[1,.96]],r:[[0,0],[.6,.63],[1,1]],g:[[0,.04],[.4,.42],[1,1]],b:[[0,.02],[1,.92]],sat:-.1},
  {id:'polaroid',name:'拍立得',all:[[0,.1],[.5,.55],[1,.95]],r:[[0,.04],[1,1]],b:[[0,.08],[.5,.48],[1,.9]],sat:-.15},
  {id:'soft',name:'淡雅',all:[[0,.1],[1,.92]],sat:-.35},
  {id:'night',name:'夜城',r:[[0,0],[.3,.24],[.7,.78],[1,1]],g:[[0,.04],[.5,.5],[1,.96]],b:[[0,.12],[.4,.42],[.75,.68],[1,.85]],sat:.15},
  {id:'jp',name:'日系',all:[[0,.12],[.5,.6],[1,1]],r:[[0,0],[1,.96]],b:[[0,.05],[1,1]],sat:-.2},
];
function curve(pts,v){ if(!pts) return v; if(v<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++){ const [x1,y1]=pts[i]; if(v<=x1){ const [x0,y0]=pts[i-1]; return y0+(y1-y0)*(v-x0)/(x1-x0);} } return pts[pts.length-1][1]; }
for(const f of FILTERS){ f.R=new Float32Array(256);f.G=new Float32Array(256);f.B=new Float32Array(256);
  for(let i=0;i<256;i++){ const v=curve(f.all,i/255); f.R[i]=curve(f.r,v); f.G[i]=curve(f.g,v); f.B[i]=curve(f.b,v); }
  f.sat=f.sat||0; f.mono=!!f.mono; }

/* ---------- state ---------- */
const S={ src:null, iw:0, ih:0, name:'sample.jpg', sample:true, work:null, workData:null, ww:0, wh:0,
  params:defParams(), filter:'none', strength:100, customIdx:-1, tab:'filter', compare:false, split:.5, showOrig:false };
let customs=store.get('custom',[]); if(!Array.isArray(customs)) customs=[];

/* ---------- pipeline ---------- */
const smooth=(a,b,x)=>{ let t=(x-a)/(b-a); t=t<0?0:t>1?1:t; return t*t*(3-2*t); };
function hash(x,y,seed){ let h=(x*374761393+y*668265263+seed*2147483647)|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function prep(p,filterId,strength){
  const ev=Math.pow(2,p.exposure), b=p.brightness/100*.3, k=1+p.contrast/200;
  const base=new Float32Array(256); for(let i=0;i<256;i++){ let c=i/255*ev+b; base[i]=(c-.5)*k+.5; }
  return { base, hl:p.highlights/100*.25, sh:p.shadows/100*.25, rT:1+p.temp/100*.1, bT:1-p.temp/100*.1, gT:1-p.tint/100*.08,
    sat:p.saturation/100, vib:p.vibrance/100, f:FILTERS.find(f=>f.id===filterId)||FILTERS[0], fs:strength/100,
    sharp:p.sharpen/100*1.5, vig:p.vignette/100, grain:p.grain/100*.22 };
}
/* src: RGBA of rows [sy0, sy0+srows) of an image of width w; process output rows [oy0, oy0+orows) (absolute coords inside a full image fw×fh) */
function processRows(src,w,sy0,srows,dst,oy0,orows,fw,fh,P){
  const {base,hl,sh,rT,bT,gT,sat,vib,f,fs,sharp,vig,grain}=P;
  const doF=f.id!=='none'&&fs>0, FR=f.R,FG=f.G,FB=f.B, fsat=f.sat, mono=f.mono;
  const cx=fw/2, cy=fh/2, inv=1/Math.sqrt(cx*cx+cy*cy);
  for(let y=oy0;y<oy0+orows;y++){
    const ry=y-sy0, rowOff=ry*w*4, up=(ry>0?ry-1:ry)*w*4, dn=(ry<srows-1?ry+1:ry)*w*4;
    let o=(y-oy0)*w*4;
    for(let x=0;x<w;x++,o+=4){
      const i=rowOff+x*4; let r=src[i],g=src[i+1],b=src[i+2];
      if(sharp>0){ const l=x>0?-4:0, rr=x<w-1?4:0; const c=x*4;
        for(let ch=0;ch<3;ch++){ const s=src[up+c+l+ch]+src[up+c+ch]+src[up+c+rr+ch]+src[rowOff+c+l+ch]+src[rowOff+c+ch]+src[rowOff+c+rr+ch]+src[dn+c+l+ch]+src[dn+c+ch]+src[dn+c+rr+ch];
          let v=src[i+ch]+sharp*(src[i+ch]-s/9); v=v<0?0:v>255?255:Math.round(v); if(ch===0)r=v;else if(ch===1)g=v;else b=v; } }
      r=base[r];g=base[g];b=base[b];
      if(hl!==0||sh!==0){ let L=.2126*r+.7152*g+.0722*b; L=L<0?0:L>1?1:L; const d=hl*smooth(.5,1,L)+sh*(1-smooth(0,.5,L)); r+=d;g+=d;b+=d; }
      r*=rT; b*=bT; g*=gT;
      if(sat!==0||vib!==0){ const gr=.2126*r+.7152*g+.0722*b; let m=1+sat;
        if(vib!==0){ const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let cs=mx-mn; cs=cs<0?0:cs>1?1:cs; m*=1+vib*(1-cs); }
        if(m<0)m=0; r=gr+(r-gr)*m; g=gr+(g-gr)*m; b=gr+(b-gr)*m; }
      if(doF){ let fr,fg,fb;
        if(mono){ let gr=.2126*r+.7152*g+.0722*b; gr=gr<0?0:gr>1?1:gr; const gi=Math.round(gr*255); fr=FR[gi];fg=FG[gi];fb=FB[gi]; }
        else { const ri=Math.round((r<0?0:r>1?1:r)*255), gi=Math.round((g<0?0:g>1?1:g)*255), bi=Math.round((b<0?0:b>1?1:b)*255); fr=FR[ri];fg=FG[gi];fb=FB[bi]; }
        if(fsat!==0){ const gr=.2126*fr+.7152*fg+.0722*fb, m=1+fsat; fr=gr+(fr-gr)*m; fg=gr+(fg-gr)*m; fb=gr+(fb-gr)*m; }
        r+=(fr-r)*fs; g+=(fg-g)*fs; b+=(fb-b)*fs; }
      if(vig>0){ const dx=x+.5-cx, dy=y+.5-cy; const m=1-vig*smooth(.4,1,Math.sqrt(dx*dx+dy*dy)*inv); r*=m;g*=m;b*=m; }
      if(grain>0){ const n=(hash(x,y,7)-.5)*grain; r+=n;g+=n;b+=n; }
      dst[o]=r*255; dst[o+1]=g*255; dst[o+2]=b*255; dst[o+3]=src[i+3];
    }
  }
}
function renderImageData(srcData,P){ const {width:w,height:h,data}=srcData; const out=new ImageData(w,h); processRows(data,w,0,h,out.data,0,h,w,h,P); return out; }

/* ---------- sample photo ---------- */
function makeSample(){
  const W=1600,H=1067,c=document.createElement('canvas'); c.width=W;c.height=H; const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,H*.62); g.addColorStop(0,'#3d6fa8'); g.addColorStop(.55,'#9fb9cf'); g.addColorStop(1,'#f2c48d'); x.fillStyle=g; x.fillRect(0,0,W,H);
  const sg=x.createRadialGradient(1120,520,10,1120,520,260); sg.addColorStop(0,'rgba(255,240,200,1)'); sg.addColorStop(.12,'rgba(255,225,160,.9)'); sg.addColorStop(1,'rgba(255,200,140,0)'); x.fillStyle=sg; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.55)'; for(const [cx,cy,s] of [[300,180,1],[560,240,.7],[1350,150,.9]]){ for(let i=0;i<6;i++){ x.beginPath(); x.ellipse(cx+i*38*s,cy+Math.sin(i*1.7)*10,70*s,26*s,0,0,7); x.fill(); } }
  const ridge=(y0,amp,col,seed)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(0,H); for(let X=0;X<=W;X+=8){ const y=y0-amp*(.5+.5*Math.sin(X/170+seed))*(.6+.4*Math.sin(X/53+seed*3)); x.lineTo(X,y);} x.lineTo(W,H); x.fill(); };
  ridge(560,170,'#6d7f97',1); ridge(610,120,'#4f6377',2.4); ridge(660,70,'#3a4b55',4.1);
  g=x.createLinearGradient(0,660,0,H); g.addColorStop(0,'#8fa7b8'); g.addColorStop(1,'#33505c'); x.fillStyle=g; x.fillRect(0,660,W,H-660);
  x.fillStyle='rgba(255,226,170,.55)'; for(let i=0;i<26;i++){ const y=672+i*9; x.fillRect(1120-140+(i*37%90),y,280-(i*13%120),2); }
  x.fillStyle='#2c3b22'; x.beginPath(); x.moveTo(0,H); x.lineTo(0,820); x.quadraticCurveTo(380,760,760,880); x.quadraticCurveTo(980,950,1100,H); x.fill();
  x.fillStyle='#1f2a18'; for(let i=0;i<14;i++){ const tx=40+i*52, ty=830+Math.sin(i)*20+i*4, th=110+(i*29%60); x.beginPath(); x.moveTo(tx,ty-th); x.lineTo(tx-22,ty); x.lineTo(tx+22,ty); x.fill(); }
  x.fillStyle='#b8432f'; x.fillRect(560,812,90,58); x.fillStyle='#6d2a1f'; x.beginPath(); x.moveTo(548,814); x.lineTo(605,772); x.lineTo(662,814); x.fill(); x.fillStyle='#f3d27a'; x.fillRect(578,830,18,18);
  x.fillStyle='#d9d2c3'; x.beginPath(); x.moveTo(1240,820); x.lineTo(1300,780); x.lineTo(1300,820); x.fill(); x.fillStyle='#b9b0a0'; x.fillRect(1236,820,74,6);
  const id=x.getImageData(0,0,W,H), d=id.data; for(let i=0;i<d.length;i+=4){ const n=(hash(i>>2,3,1)-.5)*10; d[i]+=n;d[i+1]+=n;d[i+2]+=n; } x.putImageData(id,0,0);
  return c;
}

/* ---------- loading ---------- */
const MAXSIDE=8192, MAXPIX=16777216;
async function decode(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
  const url=URL.createObjectURL(file); try{ const img=new Image(); img.src=url; await img.decode(); return img; } finally{ URL.revokeObjectURL(url); }
}
function setSource(img,name,isSample){
  let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, sc=1;
  if(Math.max(w,h)>MAXSIDE) sc=MAXSIDE/Math.max(w,h); if(w*h*sc*sc>MAXPIX) sc=Math.sqrt(MAXPIX/(w*h));
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(sc<1) toast(`已縮小至 ${c.width}×${c.height} 以免記憶體不足`,3500);
  if(img.close) try{img.close();}catch(e){}
  S.src=c; S.iw=c.width; S.ih=c.height; S.name=name; S.sample=isSample;
  const ws=Math.min(1,1080/Math.max(c.width,c.height)); S.ww=Math.max(1,Math.round(c.width*ws)); S.wh=Math.max(1,Math.round(c.height*ws));
  const wc=document.createElement('canvas'); wc.width=S.ww; wc.height=S.wh; const wx=wc.getContext('2d',{willReadFrequently:true}); wx.imageSmoothingQuality='high'; wx.drawImage(c,0,0,S.ww,S.wh);
  S.workData=wx.getImageData(0,0,S.ww,S.wh);
  const pv=$('#pv'); pv.width=S.ww; pv.height=S.wh; $('#stage').style.setProperty('--ar',(S.iw/S.ih).toFixed(4));
  $('#sampleTag').hidden=!isSample; $('#metaName').textContent=name; $('#dimTop').textContent=`${S.iw}×${S.ih}`;
  buildThumbs(); schedule();
}
async function loadFile(file){
  if(!file) return; if(file.type && !file.type.startsWith('image/')){ toast('請選擇圖片檔'); return; }
  try{ const img=await decode(file); setSource(img,file.name||'photo.jpg',false); toast('已開啟 '+(file.name||'圖片')); }
  catch(e){ toast(/heic|heif/i.test(file.name||file.type)?'此格式無法解碼，請先轉成 JPG':'無法讀取這張圖片',3500); }
}

/* ---------- thumbnails ---------- */
let thumbBase=null;
function buildThumbs(){
  const t=document.createElement('canvas'); t.width=96;t.height=96; const x=t.getContext('2d',{willReadFrequently:true});
  const s=Math.max(96/S.iw,96/S.ih); x.drawImage(S.src,(96-S.iw*s)/2,(96-S.ih*s)/2,S.iw*s,S.ih*s); thumbBase=x.getImageData(0,0,96,96);
  drawStrip();
}
function drawStrip(){
  const strip=$('#strip'); strip.innerHTML='';
  const items=FILTERS.map((f,i)=>({kind:'f',i,name:f.name,filter:f.id,strength:100,params:defParams()}))
    .concat(customs.map((c,i)=>({kind:'c',i,name:c.name,filter:c.filter,strength:c.strength,params:Object.assign(defParams(),c.params)})));
  items.forEach((it,n)=>{
    const b=document.createElement('button'); b.type='button'; b.className='fthumb'; b.id=it.kind==='f'?'f-'+FILTERS[it.i].id:'c-'+it.i;
    const sel=it.kind==='f'?(S.customIdx<0&&S.filter===it.filter):(S.customIdx===it.i);
    b.setAttribute('aria-pressed',sel?'true':'false');
    b.innerHTML=`<span class="no">${String(n+1).padStart(2,'0')}${it.kind==='c'?' 自訂':''}</span><canvas width="96" height="96"></canvas><span class="nm"></span>`;
    b.querySelector('.nm').textContent=it.name;
    const cv=b.querySelector('canvas'); if(thumbBase) cv.getContext('2d').putImageData(renderImageData(thumbBase,prep(it.params,it.filter,it.strength)),0,0);
    b.onclick=()=>{ if(it.kind==='f') selectFilter(it.filter); else applyCustom(it.i); };
    strip.appendChild(b);
  });
}
function markStrip(){ for(const b of $('#strip').children){ const id=b.id; const on=id.startsWith('f-')?(S.customIdx<0&&id==='f-'+S.filter):(id==='c-'+S.customIdx); b.setAttribute('aria-pressed',on?'true':'false'); }
  $('#delCustom').hidden=S.customIdx<0; }
function selectFilter(id){ S.filter=id; S.customIdx=-1; if(S.strength===0) S.strength=100; syncUI(); schedule(); save(); }
function applyCustom(i){ const c=customs[i]; if(!c) return; S.filter=c.filter; S.strength=c.strength; S.params=Object.assign(defParams(),c.params); S.customIdx=i; syncUI(); schedule(); save(); }

/* ---------- params UI ---------- */
function fmtVal(p,v){ return p.fmt?p.fmt(v):(v>0&&p.min<0?'+':'')+v; }
function buildParams(){
  const box=$('#params'); box.innerHTML='';
  for(const p of PARAMS){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<label for="p-${p.key}">${p.label}</label><input type="range" id="p-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}"><output id="o-${p.key}"></output>`;
    box.appendChild(row);
    const inp=row.querySelector('input'); let lastTap=0;
    inp.addEventListener('input',()=>{ S.params[p.key]=parseFloat(inp.value); S.customIdx=-1; markStrip(); updOut(p); schedule(); });
    inp.addEventListener('change',save);
    const reset=()=>{ S.params[p.key]=p.def; inp.value=p.def; updOut(p); S.customIdx=-1; markStrip(); schedule(); save(); };
    inp.addEventListener('dblclick',reset);
    inp.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; const n=performance.now(); if(n-lastTap<320){ e.preventDefault(); reset(); lastTap=0; } else lastTap=n; });
  }
}
function updOut(p){ const v=S.params[p.key], o=$('#o-'+p.key); o.textContent=fmtVal(p,v); o.classList.toggle('on',v!==p.def); }
function syncUI(){
  for(const p of PARAMS){ $('#p-'+p.key).value=S.params[p.key]; updOut(p); }
  $('#strength').value=S.strength; $('#strOut').textContent=S.strength+'%'; $('#strRow').hidden=S.filter==='none';
  markStrip(); updMeta();
}
function updMeta(){ const f=FILTERS.find(f=>f.id===S.filter); const n=PARAMS.filter(p=>S.params[p.key]!==p.def).length;
  $('#metaState').textContent=(S.customIdx>=0?customs[S.customIdx].name+'・':'')+f.name+(S.filter!=='none'?' '+S.strength+'%':'')+(n?`・${n} 項調整`:''); }
function save(){ store.set('last',{params:S.params,filter:S.filter,strength:S.strength}); updMeta(); }

/* ---------- render ---------- */
let rq=0, processed=null;
function schedule(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; render(); }); }
function render(){
  if(!S.workData) return;
  processed=renderImageData(S.workData,prep(S.params,S.filter,S.strength));
  paint(); updMeta();
}
function paint(){
  if(!processed) return;
  const x=$('#pv').getContext('2d');
  if(S.showOrig){ x.putImageData(S.workData,0,0); }
  else { x.putImageData(processed,0,0); if(S.compare){ const sw=Math.round(S.ww*S.split); if(sw>0) x.putImageData(S.workData,0,0,0,0,sw,S.wh); } }
  $('#origTag').hidden=!S.showOrig;
  if(S.compare) placeSplit();
}
function placeSplit(){ const pv=$('#pv').getBoundingClientRect(), st=$('#stage').getBoundingClientRect(); const sp=$('#split');
  sp.style.left=(pv.left-st.left+pv.width*S.split)+'px'; sp.setAttribute('aria-valuenow',Math.round(S.split*100)); }

/* ---------- tabs ---------- */
function setTab(t){
  const desk=matchMedia('(min-width:900px)').matches;
  if(t==='compare'){ S.compare=desk?!S.compare:true; if(!desk) S.tab='compare'; }
  else { S.compare=false; S.tab=t; }
  $('#tab-filter').setAttribute('aria-selected',S.tab==='filter'); $('#tab-adjust').setAttribute('aria-selected',S.tab==='adjust'); $('#tab-compare').setAttribute('aria-selected',S.compare?'true':'false');
  $('#panelFilter').hidden=S.tab!=='filter'; $('#panelAdjust').hidden=S.tab!=='adjust'; $('#panelCompare').hidden=!S.compare;
  $('#split').hidden=!S.compare; $('#hint').textContent=S.compare?'拖動分割線比較':'長按看原圖・左右滑動換濾鏡';
  paint();
}
$('#tab-filter').onclick=()=>setTab('filter'); $('#tab-adjust').onclick=()=>setTab('adjust'); $('#tab-compare').onclick=()=>setTab('compare');

/* ---------- stage gestures ---------- */
(()=>{
  const st=$('#stage'); let lp=0, sx=0, sy=0, down=false, moved=false;
  st.addEventListener('pointerdown',e=>{ if(e.target.closest('#split')) return; down=true; moved=false; sx=e.clientX; sy=e.clientY;
    lp=setTimeout(()=>{ if(down&&!moved){ S.showOrig=true; paint(); } },380); });
  st.addEventListener('pointermove',e=>{ if(!down) return; if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10){ moved=true; clearTimeout(lp);} });
  const up=e=>{ if(!down) return; down=false; clearTimeout(lp);
    if(S.showOrig){ S.showOrig=false; paint(); return; }
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!S.compare && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ const i=FILTERS.findIndex(f=>f.id===S.filter); const n=(i+(dx<0?1:-1)+FILTERS.length)%FILTERS.length; selectFilter(FILTERS[n].id); toast(FILTERS[n].name,900);
      const el=$('#f-'+FILTERS[n].id); if(el) el.scrollIntoView({block:'nearest',inline:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); } };
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',()=>{down=false;clearTimeout(lp); if(S.showOrig){S.showOrig=false;paint();}});
  st.addEventListener('contextmenu',e=>e.preventDefault());
  const sp=$('#split'); let drag=false;
  sp.addEventListener('pointerdown',e=>{ drag=true; sp.setPointerCapture(e.pointerId); e.preventDefault(); });
  sp.addEventListener('pointermove',e=>{ if(!drag) return; const r=$('#pv').getBoundingClientRect(); S.split=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); paint(); });
  sp.addEventListener('pointerup',()=>drag=false);
  sp.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ S.split=Math.min(1,Math.max(0,S.split+(e.key==='ArrowLeft'?-.05:.05))); paint(); e.preventDefault(); } });
  addEventListener('resize',()=>{ if(S.compare) placeSplit(); });
  addEventListener('keydown',e=>{ if(e.key==='\\'&&!e.repeat&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ S.showOrig=true; paint(); } });
  addEventListener('keyup',e=>{ if(e.key==='\\'){ S.showOrig=false; paint(); } });
})();

/* ---------- controls ---------- */
$('#strength').addEventListener('input',e=>{ S.strength=+e.target.value; $('#strOut').textContent=S.strength+'%'; S.customIdx=-1; markStrip(); schedule(); });
$('#strength').addEventListener('change',save);
$('#openBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{ loadFile(e.target.files[0]); e.target.value=''; };
$('#resetBtn').onclick=()=>{ S.params=defParams(); S.filter='none'; S.strength=100; S.customIdx=-1; syncUI(); schedule(); save(); toast('已重設全部參數'); };
$('#saveCustom').onclick=()=>{
  if(customs.length>=10){ toast('自訂濾鏡最多 10 組，請先刪除一組'); return; }
  let n=1; while(customs.some(c=>c.name==='自訂 '+n)) n++;
  customs.push({name:'自訂 '+n,filter:S.filter,strength:S.strength,params:{...S.params}}); store.set('custom',customs);
  S.customIdx=customs.length-1; drawStrip(); markStrip(); updMeta(); toast('已存成「自訂 '+n+'」');
};
$('#delCustom').onclick=()=>{ if(S.customIdx<0) return; const b=$('#delCustom');
  if(b.dataset.arm!=='1'){ b.dataset.arm='1'; b.textContent='再按一次確認刪除'; setTimeout(()=>{b.dataset.arm='';b.textContent='刪除此自訂';},3000); return; }
  b.dataset.arm=''; b.textContent='刪除此自訂'; const nm=customs[S.customIdx].name; customs.splice(S.customIdx,1); store.set('custom',customs); S.customIdx=-1; drawStrip(); markStrip(); toast('已刪除 '+nm); };
// drag & drop, paste
addEventListener('dragover',e=>{ e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave',e=>{ if(e.target===document.documentElement||e.target===document.body) document.body.classList.remove('drop'); });
addEventListener('drop',e=>{ e.preventDefault(); document.body.classList.remove('drop'); const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });
addEventListener('paste',e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });

/* ---------- export ---------- */
let exUrl=null, busy=false;
function openExport(){ $('#exSheet').hidden=false; $('#exResult').hidden=true; $('#exProg').hidden=true; $('#exGo').disabled=false;
  $('#exGo').textContent=dl?'下載':'產生圖片'; $('#exInfo').textContent=`輸出原解析度 ${S.iw}×${S.ih}，檔名 ${outName()}`; $('#exGo').focus(); }
function outName(){ const fmt=document.querySelector('input[name=fmt]:checked').value; return S.name.replace(/\.[^.]+$/,'')+'-filtered.'+fmt; }
document.querySelectorAll('input[name=fmt]').forEach(r=>r.addEventListener('change',()=>{ $('#exInfo').textContent=`輸出原解析度 ${S.iw}×${S.ih}，檔名 ${outName()}`; store.set('fmt',r.value); }));
$('#exportBtn').onclick=openExport;
$('#exClose').onclick=()=>{ if(busy){ busy=false; } $('#exSheet').hidden=true; if(exUrl){ URL.revokeObjectURL(exUrl); exUrl=null; } $('#exportBtn').focus(); };
$('#exSheet').addEventListener('click',e=>{ if(e.target.id==='exSheet') $('#exClose').click(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#exSheet').hidden) $('#exClose').click(); });
async function renderFull(onProg){
  const W=S.iw,H=S.ih, P=prep(S.params,S.filter,S.strength);
  const sx=S.src.getContext('2d',{willReadFrequently:true});
  const out=document.createElement('canvas'); out.width=W; out.height=H; const ox=out.getContext('2d');
  const CH=1024;
  for(let y0=0;y0<H;y0+=CH){
    if(!busy) throw new Error('cancel');
    const rows=Math.min(CH,H-y0), sy0=Math.max(0,y0-1), sy1=Math.min(H,y0+rows+1);
    const src=sx.getImageData(0,sy0,W,sy1-sy0); const dst=new ImageData(W,rows);
    processRows(src.data,W,sy0,sy1-sy0,dst.data,y0,rows,W,H,P);
    ox.putImageData(dst,0,y0); onProg((y0+rows)/H);
    await new Promise(r=>setTimeout(r,0));
  }
  return out;
}
$('#exGo').onclick=async()=>{
  if(busy) return; busy=true; const fmt=document.querySelector('input[name=fmt]:checked').value, name=outName();
  const pr=$('#exProg'), bar=pr.querySelector('i'); pr.hidden=false; bar.style.width='0'; $('#exGo').disabled=true; $('#exResult').hidden=true;
  try{
    const c=await renderFull(p=>bar.style.width=(p*100).toFixed(1)+'%');
    const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),fmt==='png'?'image/png':'image/jpeg',.92));
    c.width=c.height=1;
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast('已儲存 '+name); }catch(e){ if(!/declin|cancel|abort/i.test(String(e&&(e.name||e.message)))) toast('下載失敗，改以圖片顯示'); else toast('已取消下載'); showResult(blob); } }
    else showResult(blob);
    window.__lastExport={name,blob,w:S.iw,h:S.ih};
  }catch(e){ if(e.message!=='cancel') toast('匯出失敗：記憶體不足或圖片過大'); }
  finally{ busy=false; $('#exGo').disabled=false; pr.hidden=true; }
};
function showResult(blob){ if(exUrl) URL.revokeObjectURL(exUrl); exUrl=URL.createObjectURL(blob); $('#exImg').src=exUrl; $('#exResult').hidden=false; }

/* ---------- init ---------- */
buildParams();
const last=store.get('last',null); if(last&&typeof last==='object'){ S.params=Object.assign(defParams(),last.params||{}); for(const p of PARAMS){ const v=+S.params[p.key]; S.params[p.key]=isFinite(v)?Math.min(p.max,Math.max(p.min,v)):p.def; } if(FILTERS.some(f=>f.id===last.filter)) S.filter=last.filter; if(last.strength>=0&&last.strength<=100) S.strength=+last.strength; }
const lf=store.get('fmt','jpg'); if(lf==='png') $('#fmt-png').checked=true;
setSource(makeSample(),'sample.jpg',true); syncUI(); setTab('filter');
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; } })();
window.__pf={S,PARAMS,FILTERS,prep,processRows,renderImageData,setTab,setSource};
})();
</script>
</body></html>
