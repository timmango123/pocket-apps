<title>節拍器</title>
<style>
/* Practice-room look: sage-gray paper, engraved dial, deep teal for the beat, brass for accents */
:root {
  --bg: #eef1ed;
  --surface: #fbfcfa;
  --surface-2: #e4e9e3;
  --ink: #141915;
  --ink-2: #3c463f;
  --muted: #5d6a61;
  --line: #cfd7cf;
  --line-strong: #a3b0a6;
  --accent: #0b6a5f;
  --accent-ink: #ffffff;
  --accent-soft: #d4e8e3;
  --brass: #94600f;
  --brass-soft: #f1e2c4;
  --dial: #f6f8f5;
  --dial-edge: #c3cdc4;
  --ok: #1d7a3e;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --knob: min(220px, calc(100vw - 32px - 2 * 52px - 2 * 10px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --surface: #171d1a; --surface-2: #202823; --ink: #e7ede8; --ink-2: #c2ccc5; --muted: #8e9b92;
    --line: #2a332e; --line-strong: #46534b; --accent: #4fc4b1; --accent-ink: #06201b; --accent-soft: #163a33;
    --brass: #e3ad55; --brass-soft: #3a2c12; --dial: #1c2420; --dial-edge: #34413a; --ok: #62cf8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --surface: #171d1a; --surface-2: #202823; --ink: #e7ede8; --ink-2: #c2ccc5; --muted: #8e9b92;
  --line: #2a332e; --line-strong: #46534b; --accent: #4fc4b1; --accent-ink: #06201b; --accent-soft: #163a33;
  --brass: #e3ad55; --brass-soft: #3a2c12; --dial: #1c2420; --dial-edge: #34413a; --ok: #62cf8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(10px, env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 980px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.top h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.top h1 small { font: 500 11px var(--mono); color: var(--muted); letter-spacing: .08em; margin-left: 6px; }
.tbtn { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-strong); background: var(--surface); }
.tbtn svg { width: 20px; height: 20px; }
@media (hover: hover) { .tbtn:hover { border-color: var(--accent); color: var(--accent); } }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
@media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; } }

/* beat dots */
.beats { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 52px; }
.dot { position: relative; width: 44px; height: 48px; display: grid; place-items: center; }
.dot i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--line-strong); transition: transform .06s, background-color .06s; }
.dot[data-lv="2"] i { width: 28px; height: 28px; background: color-mix(in srgb, var(--brass) 45%, var(--surface-2)); }
.dot[data-lv="0"] i { background: transparent; border: 2px dashed var(--line-strong); }
.dot.on i { background: var(--accent); transform: scale(1.18); }
.dot.on[data-lv="2"] i { background: var(--brass); }
.dot.on[data-lv="0"] i { background: transparent; border-color: var(--muted); }
.beats.many .dot { width: 30px; }
.beats.many .dot::after { content: ""; position: absolute; inset: 0 -3px; }
.beats.many .dot i { width: 14px; height: 14px; }
.beats.many .dot[data-lv="2"] i { width: 22px; height: 22px; }
.subs { display: flex; justify-content: center; gap: 6px; height: 10px; margin-top: 2px; }
.subs span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.subs span.on { background: var(--accent); }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin: 2px 0 0; }

/* bpm readout */
.readout { text-align: center; margin-top: 4px; }
.bpm { display: inline-block; font: 700 72px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; touch-action: none; cursor: ns-resize; padding: 2px 10px; border-radius: 8px; color: var(--ink); user-select: none; -webkit-user-select: none; }
.bpm-input { width: 4.2ch; font: 700 64px/1 var(--mono); text-align: center; border: 2px solid var(--accent); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 4px; }
.term { font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.term b { font-weight: 700; font-style: italic; color: var(--ink-2); font-family: Georgia, "Times New Roman", serif; font-size: 16px; letter-spacing: .02em; margin-right: 6px; }

/* dial row */
.dialrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
.steps { display: grid; gap: 10px; }
.step { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); font: 700 15px var(--mono); color: var(--ink-2); }
.step.big { font-size: 13px; color: var(--muted); }
@media (hover: hover) { .step:hover { border-color: var(--accent); color: var(--accent); } }
.step:active { background: var(--accent-soft); }
.knob { position: relative; width: var(--knob); height: var(--knob); flex: none; touch-action: none; border-radius: 50%; user-select: none; -webkit-user-select: none; }
.knob svg.face { position: absolute; inset: 0; width: 100%; height: 100%; }
.knob .rim { fill: var(--dial); stroke: var(--dial-edge); }
.knob .tick { stroke: var(--line-strong); }
.knob .arc-bg { stroke: var(--line); }
.knob .arc { stroke: var(--accent); transition: stroke-dashoffset .12s; }
.knob .rot { transform-origin: 50% 50%; }
.knob .notch { fill: var(--brass); }
.knob:focus-visible { outline-offset: 4px; }
.playbtn { position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--dial), 0 0 0 7px var(--dial-edge); }
.playbtn svg { width: 34px; height: 34px; }
.playbtn.pulse { animation: pulse .12s ease-out; }
@keyframes pulse { from { transform: scale(1.06); } to { transform: scale(1); } }

.tap { display: flex; width: 100%; min-height: 56px; margin-top: 14px; border-radius: 10px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); font-weight: 700; font-size: 17px; letter-spacing: .08em; align-items: center; justify-content: center; gap: 10px; user-select: none; -webkit-user-select: none; }
.tap small { font: 500 12px var(--mono); color: var(--muted); letter-spacing: 0; }
.tap:active, .tap.hit { background: var(--accent-soft); }
.stats { display: flex; justify-content: center; gap: 22px; margin-top: 10px; font: 600 14px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-family: var(--sans); font-weight: 500; font-size: 12px; margin-right: 4px; }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); flex-wrap: wrap; padding: 6px 0; }
.row:last-child { border-bottom: 0; }
.row > label, .row > .lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.sig { display: flex; align-items: center; gap: 6px; font: 700 18px var(--mono); }
select, .num { height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); color: var(--ink); font: 600 15px var(--sans); padding: 0 10px; }
.num { width: 5.2em; font-family: var(--mono); text-align: center; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { min-width: 48px; min-height: 44px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: grid; place-items: center; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg svg { width: 30px; height: 20px; }
input[type="range"] { width: min(200px, 55%); accent-color: var(--accent); height: 44px; }
details.ramp { margin-top: 12px; }
details.ramp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 52px; font-weight: 700; font-size: 15px; }
details.ramp > summary::-webkit-details-marker { display: none; }
details.ramp > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
details.ramp[open] > summary::after { transform: rotate(-135deg); }
.ramp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; padding-bottom: 10px; }
.ramp-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.ramp-grid .num { width: 100%; }
.switch-row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.switch { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; }
.switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::before { transform: translateX(20px); }
.switch::after { content: ""; position: absolute; inset: -8px; }
.prog { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 4px 0 6px; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.ramp-status { font-size: 13px; color: var(--muted); min-height: 20px; padding-bottom: 10px; }
.ramp-status.reached { color: var(--ok); font-weight: 700; }
.foot-note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
kbd { font: 600 11px var(--mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 10, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border: 1px solid var(--line-strong); border-bottom: 0; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 14px; border-bottom: 1px solid var(--line-strong); } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow-y: auto; } .sheet { max-height: none; border-radius: 0 0 14px 14px; } }
.sheet h2 { margin: 0 0 10px; font-size: 18px; }
.save-row { display: flex; gap: 8px; margin-bottom: 6px; }
.save-row input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); color: var(--ink); padding: 0 10px; font: 16px var(--sans); }
.pbtn { min-height: 44px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }
.gbtn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-strong); font-weight: 600; font-size: 14px; }
.plist { list-style: none; margin: 8px 0 12px; padding: 0; }
.plist li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.plist .load { flex: 1; min-width: 0; text-align: left; min-height: 52px; display: grid; padding: 4px 0; }
.plist .load b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .load span { font: 12px var(--mono); color: var(--muted); }
.plist .rm { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.plist .rm svg { width: 18px; height: 18px; }
.msg { font-size: 13px; min-height: 20px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }

@media (orientation: landscape) and (max-height: 500px) {
  :root { --knob: min(200px, 52vh); }
  .bpm { font-size: 56px; }
  .beats { min-height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>節拍器<small id="engineTag">精準預排程</small></h1>
    <button class="tbtn" id="presetBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5h14M5 12h14M5 19h9"/></svg>組合
    </button>
    <button class="tbtn" id="themeBtn" type="button" aria-label="切換主題"></button>
  </header>

  <div class="layout">
    <section aria-label="節拍與速度">
      <div class="beats" id="beats" role="group" aria-label="拍點（點擊切換重音／普通／靜音）"></div>
      <div class="subs" id="subs" aria-hidden="true"></div>
      <div class="readout">
        <div class="bpm" id="bpm" tabindex="0" role="button" aria-label="BPM，點擊輸入，上下滑動調整">120</div>
        <div class="term" id="term"><b>Allegro</b>快板</div>
      </div>
      <div class="dialrow">
        <div class="steps">
          <button class="step" type="button" id="plus1" aria-label="加 1 BPM">+1</button>
          <button class="step" type="button" id="minus1" aria-label="減 1 BPM">−1</button>
        </div>
        <div class="knob" id="knob" role="slider" tabindex="0" aria-label="速度旋鈕" aria-valuemin="20" aria-valuemax="300" aria-valuenow="120">
          <svg class="face" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="rim" cx="110" cy="110" r="106" stroke-width="2"/>
            <circle class="arc-bg" cx="110" cy="110" r="96" fill="none" stroke-width="4"/>
            <circle class="arc" id="arc" cx="110" cy="110" r="96" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 110 110)"/>
            <g id="ticks"></g>
            <g class="rot" id="rot"><rect class="notch" x="106" y="18" width="8" height="22" rx="4"/></g>
          </svg>
          <button class="playbtn" id="play" type="button" aria-label="播放"></button>
        </div>
        <div class="steps">
          <button class="step big" type="button" id="plus5" aria-label="加 5 BPM">+5</button>
          <button class="step big" type="button" id="minus5" aria-label="減 5 BPM">−5</button>
        </div>
      </div>
      <button class="tap" id="tap" type="button">點擊測速 Tap <small id="tapInfo">連點 4 次以上</small></button>
      <div class="stats" aria-live="off"><div><span>小節</span><b id="barCount">0</b></div><div><span>時間</span><b id="elapsed">00:00</b></div></div>
    </section>

    <section aria-label="參數">
      <div class="panel">
        <div class="row">
          <span class="lbl" id="sigLbl">拍號</span>
          <div class="sig" role="group" aria-labelledby="sigLbl">
            <select id="sigNum" aria-label="每小節拍數"></select>
            <span aria-hidden="true">/</span>
            <select id="sigDen" aria-label="拍子單位"><option value="2">2</option><option value="4">4</option><option value="8">8</option></select>
          </div>
        </div>
        <div class="row">
          <span class="lbl" id="subLbl">細分</span>
          <div class="seg" role="group" aria-labelledby="subLbl" id="subSeg">
            <button type="button" id="sub1" data-sub="1" aria-label="無細分"><svg viewBox="0 0 30 20"><ellipse cx="13" cy="15" rx="4" ry="3" fill="currentColor"/><path d="M17 15V2" stroke="currentColor" stroke-width="1.6"/></svg></button>
            <button type="button" id="sub2" data-sub="2" aria-label="八分音符"><svg viewBox="0 0 30 20"><ellipse cx="7" cy="15" rx="3.5" ry="2.6" fill="currentColor"/><ellipse cx="21" cy="15" rx="3.5" ry="2.6" fill="currentColor"/><path d="M10.3 15V3h14v12M10.3 3h14" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10.3 3h14" stroke="currentColor" stroke-width="3"/></svg></button>
            <button type="button" id="sub3" data-sub="3" aria-label="三連音"><svg viewBox="0 0 30 20"><ellipse cx="5" cy="15" rx="3" ry="2.3" fill="currentColor"/><ellipse cx="14" cy="15" rx="3" ry="2.3" fill="currentColor"/><ellipse cx="23" cy="15" rx="3" ry="2.3" fill="currentColor"/><path d="M8 15V5M17 15V5M26 15V5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5h18" stroke="currentColor" stroke-width="3"/><text x="16" y="3.4" font-size="5" text-anchor="middle" fill="currentColor" font-family="sans-serif">3</text></svg></button>
            <button type="button" id="sub4" data-sub="4" aria-label="十六分音符"><svg viewBox="0 0 30 20"><g fill="currentColor"><ellipse cx="4" cy="15" rx="2.6" ry="2"/><ellipse cx="11" cy="15" rx="2.6" ry="2"/><ellipse cx="18" cy="15" rx="2.6" ry="2"/><ellipse cx="25" cy="15" rx="2.6" ry="2"/></g><path d="M6.4 15V3M13.4 15V3M20.4 15V3M27.4 15V3" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 3h21M6.4 7h21" stroke="currentColor" stroke-width="2.4"/></svg></button>
          </div>
        </div>
        <div class="row">
          <label for="sound">音色</label>
          <select id="sound">
            <option value="wood">木魚</option>
            <option value="beep">電子嗶</option>
            <option value="cowbell">牛鈴</option>
            <option value="voice">人聲數拍</option>
          </select>
        </div>
        <div class="row">
          <label for="volume">音量</label>
          <input type="range" id="volume" min="0" max="100" step="1">
        </div>
      </div>

      <details class="ramp panel" id="rampPanel">
        <summary>漸快／漸慢練習</summary>
        <div class="switch-row"><label for="rampOn">啟用（播放時從起始速度開始）</label><input type="checkbox" class="switch" id="rampOn"></div>
        <div class="ramp-grid">
          <label>起始 BPM<input class="num" id="rampFrom" type="number" inputmode="numeric" min="20" max="300"></label>
          <label>目標 BPM<input class="num" id="rampTo" type="number" inputmode="numeric" min="20" max="300"></label>
          <label>每幾小節<input class="num" id="rampEvery" type="number" inputmode="numeric" min="1" max="64"></label>
          <label>每次加減 BPM<input class="num" id="rampStep" type="number" inputmode="numeric" min="1" max="50"></label>
        </div>
        <div class="prog" aria-hidden="true"><i id="rampBar"></i></div>

  let pid = null, lastA = 0, acc = 0;
  const ang = ev => { const r = knob.getBoundingClientRect(); return Math.atan2(ev.clientY - (r.top + r.height / 2), ev.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  knob.addEventListener('pointerdown', ev => {
    if (ev.target.closest('#play')) return;
    pid = ev.pointerId; lastA = ang(ev); acc = 0; knob.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  knob.addEventListener('pointermove', ev => {
    if (pid !== ev.pointerId) return;
    const a = ang(ev); let d = a - lastA; if (d > 180) d -= 360; if (d < -180) d += 360; lastA = a;
    acc += d;
    const steps = Math.trunc((acc + Math.sign(acc) * 1e-6) / 15);
    if (steps) { acc -= steps * 15; setBpm(S.bpm + steps); }
  });
  const end = ev => { if (pid === ev.pointerId) pid = null; };
  knob.addEventListener('pointerup', end); knob.addEventListener('pointercancel', end);
  knob.addEventListener('wheel', ev => { ev.preventDefault(); setBpm(S.bpm + (ev.deltaY < 0 ? 1 : -1)); }, { passive: false });
  knob.addEventListener('keydown', ev => {
    const m = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 }[ev.key];
    if (m) { ev.preventDefault(); ev.stopPropagation(); setBpm(S.bpm + m * (ev.shiftKey ? 5 : 1)); }
    else if (ev.key === 'Home') { ev.preventDefault(); setBpm(MIN); } else if (ev.key === 'End') { ev.preventDefault(); setBpm(MAX); }
  });
})();

// bpm number: vertical swipe ±1 per 12px; tap to type
(() => {
  const el = $('#bpm');
  let pid = null, y0 = 0, used = 0, moved = false;
  el.addEventListener('pointerdown', ev => { pid = ev.pointerId; y0 = ev.clientY; used = 0; moved = false; el.setPointerCapture(ev.pointerId); });
  el.addEventListener('pointermove', ev => {
    if (pid !== ev.pointerId) return;
    const steps = Math.trunc((y0 - ev.clientY) / 12) - used;
    if (Math.abs(y0 - ev.clientY) > 6) moved = true;
    if (steps) { used += steps; setBpm(S.bpm + steps); }
  });
  el.addEventListener('pointerup', ev => { if (pid !== ev.pointerId) return; pid = null; if (!moved) edit(); });
  el.addEventListener('pointercancel', () => { pid = null; });
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); edit(); } });
  function edit() {
    const inp = document.createElement('input');
    inp.className = 'bpm-input'; inp.id = 'bpmInput'; inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = MIN; inp.max = MAX; inp.value = S.bpm; inp.setAttribute('aria-label', 'BPM（20–300）');
    el.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const fin = commit => {
      if (done) return; done = true;
      inp.replaceWith(el);
      if (commit && inp.value.trim() !== '') { const raw = Math.round(+inp.value); setBpm(raw); if (raw !== S.bpm) toast(`速度範圍 ${MIN}～${MAX}，已調整為 ${S.bpm}`); }
      renderBpm(); el.focus();
    };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); });
    inp.addEventListener('blur', () => fin(true));
  }
})();

// tap tempo: last 6 taps, median interval, reset after 2 s gap
const taps = [];
function tapAt(ms) {
  if (taps.length && ms - taps[taps.length - 1] > 2000) taps.length = 0;
  taps.push(ms); if (taps.length > 6) taps.shift();
  if (taps.length < 2) { $('#tapInfo').textContent = '繼續點…'; return null; }
  const iv = []; for (let i = 1; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]);
  iv.sort((a, b) => a - b);
  const m = iv.length % 2 ? iv[(iv.length - 1) / 2] : (iv[iv.length / 2 - 1] + iv[iv.length / 2]) / 2;
  const b = clampBpm(60000 / m);
  $('#tapInfo').textContent = `${taps.length} 次 · ${b} BPM`;
  if (S.ramp.on && !playing) { S.ramp.on = false; $('#rampOn').checked = false; }
  setBpm(b);
  return b;
}
$('#tap').addEventListener('pointerdown', ev => { ev.preventDefault(); tapAt(ev.timeStamp); flashTap(); });
$('#tap').addEventListener('click', ev => { if (ev.detail === 0) { tapAt(performance.now()); flashTap(); } }); // keyboard activation
function flashTap() { const t = $('#tap'); t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 90); }

// keyboard shortcuts
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('input, select, textarea, .scrim')) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const onBtn = ev.target.closest && ev.target.closest('button, summary');
  if (ev.key === ' ' && !onBtn) { ev.preventDefault(); playing ? stop() : play(); }
  else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') { ev.preventDefault(); setBpm(S.bpm + (ev.key === 'ArrowUp' ? 1 : -1) * (ev.shiftKey ? 5 : 1)); }
  else if (ev.key === 't' || ev.key === 'T') { tapAt(ev.timeStamp); flashTap(); }
});

// theme
$('#themeBtn').addEventListener('click', () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); save(); });

// presets
function renderPresets() {
  const ul = $('#presetList'); ul.innerHTML = '';
  if (!S.presets.length) { ul.innerHTML = '<li><span class="msg" style="padding:12px 0">尚無組合</span></li>'; return; }
  const subName = ['', '無細分', '八分', '三連音', '十六分'];
  S.presets.forEach((p, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'load'; b.id = 'preset-' + i;
    b.innerHTML = `<b></b><span>${p.bpm} BPM · ${p.sig[0]}/${p.sig[1]} · ${subName[p.sub] || ''}</span>`;
    b.querySelector('b').textContent = p.name;
    b.addEventListener('click', () => {
      S.sig = [p.sig[0], p.sig[1]]; S.sub = p.sub || 1; S.accents = (p.accents || []).slice(); S.sound = p.sound || S.sound;
      fitAccents(S); if (beat >= S.sig[0]) beat = 0; if (subIdx >= S.sub) subIdx = 0;
      S.ramp.on = false;
      setBpm(p.bpm, 'force'); renderParams(); renderBeats(); save(); closePresets(); toast(`已載入「${p.name}」`);
    });
    const x = document.createElement('button'); x.type = 'button'; x.className = 'rm'; x.innerHTML = ICON.x; x.setAttribute('aria-label', '刪除 ' + p.name);
    x.addEventListener('click', () => { S.presets.splice(i, 1); save(); renderPresets(); $('#presetMsg').textContent = `已刪除「${p.name}」`; });
    li.append(b, x); ul.appendChild(li);
  });
}
let lastFocus = null;
function openPresets() { lastFocus = document.activeElement; renderPresets(); $('#presetMsg').textContent = `最多 20 組，目前 ${S.presets.length} 組`; $('#presetScrim').hidden = false; $('#presetName').focus(); }
function closePresets() { $('#presetScrim').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$('#presetBtn').addEventListener('click', openPresets);
$('#presetClose').addEventListener('click', closePresets);
$('#presetScrim').addEventListener('click', e => { if (e.target === e.currentTarget) closePresets(); });
$('#presetScrim').addEventListener('keydown', e => { if (e.key === 'Escape') closePresets(); });
$('#presetSave').addEventListener('click', () => {
  const name = $('#presetName').value.trim();
  if (!name) { $('#presetMsg').textContent = '請輸入名稱（1～20 字）'; $('#presetName').focus(); return; }
  const p = { name, bpm: S.bpm, sig: S.sig.slice(), sub: S.sub, accents: S.accents.slice(), sound: S.sound };
  const i = S.presets.findIndex(q => q.name === name);
  if (i >= 0) S.presets[i] = p;
  else { if (S.presets.length >= 20) { $('#presetMsg').textContent = '已達 20 組上限，請先刪除一組'; return; } S.presets.push(p); }
  save(); renderPresets(); $('#presetName').value = ''; $('#presetMsg').textContent = `已儲存「${name}」`;
});
$('#presetName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#presetSave').click(); });

// ---------- visual loop ----------
function frame() {
  if (playing && ctx && document.visibilityState === 'visible') {
    const now = ctx.currentTime;
    let hit = null;
    while (queue.length && queue[0].time <= now) hit = queue.shift();
    if (hit) {
      lit(hit.beat, S.sub > 1 ? hit.sub : -1);
      if (hit.sub === 0 && hit.beat === 0) { const p = $('#play'); p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse'); }
      $('#barCount').textContent = hit.bar + 1;
    }
    const sec = Math.max(0, Math.floor(now - startTime));
    if (sec !== lastStatsSec) { lastStatsSec = sec; $('#elapsed').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; }
    if (uiQueue.bpm) { uiQueue.bpm = false; renderBpm(); save(); }
  }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
applyTheme(); renderParams(); renderBeats(); renderBpm(); renderPlay(); requestAnimationFrame(frame);

// hook for automated verification
window.__metro = { S, tapAt, setBpm, get scheduled() { return scheduled; }, get ctx() { return ctx; }, get playing() { return playing; }, get worker() { return !!worker; }, get bar() { return bar; } };
})();
</script>
</body></html>
