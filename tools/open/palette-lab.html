<title>調色盤工作室</title>
<style>
:root{
  --bg:#f1f1ef; --paper:#fbfbfa; --ink:#161616; --ink-2:#3d3d3b; --muted:#6a6a66; --rule:#d4d4cf; --rule-2:#e4e4e0;
  --btn:#161616; --btn-ink:#fbfbfa; --chip-ring:#161616;
  --pass:#17663a; --pass-bg:#d9eedf; --fail:#a3221b; --fail-bg:#f5dcd9;
  --chk-a:#ffffff; --chk-b:#dcdcd7; --shade:rgba(15,15,15,.5); --err:#b42318;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --paper:#1a1a19; --ink:#ededea; --ink-2:#c9c9c4; --muted:#9a9a94; --rule:#353533; --rule-2:#262625;
  --btn:#ededea; --btn-ink:#121212; --chip-ring:#ededea;
  --pass:#7ad99a; --pass-bg:#183323; --fail:#ff958c; --fail-bg:#3a1c1a;
  --chk-a:#2b2b2a; --chk-b:#1e1e1d; --shade:rgba(0,0,0,.66); --err:#ff8a7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --paper:#1a1a19; --ink:#ededea; --ink-2:#c9c9c4; --muted:#9a9a94; --rule:#353533; --rule-2:#262625;
  --btn:#ededea; --btn-ink:#121212; --chip-ring:#ededea;
  --pass:#7ad99a; --pass-bg:#183323; --fail:#ff958c; --fail-bg:#3a1c1a;
  --chk-a:#2b2b2a; --chk-b:#1e1e1d; --shade:rgba(0,0,0,.66); --err:#ff8a7e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.top h1{flex:1;margin:0;font-size:20px;font-weight:800;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;min-width:0}
.top h1 small{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;padding:0 10px;font-size:14px;font-weight:600}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.layout{grid-template-columns:minmax(300px,360px) minmax(0,1fr);align-items:start}}
.sec{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px}
.sec>h2{margin:0 0 10px;font-size:11.5px;font-family:var(--mono);font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h2 span{font-family:var(--sans);letter-spacing:.04em;text-transform:none;font-size:12.5px;color:var(--ink-2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px}
.tabs button{height:44px;border:0;background:var(--paper);cursor:pointer;font-weight:700;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.hero{height:120px;border-radius:3px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px;margin-bottom:12px;border:1px solid var(--rule)}
.hero b{font-family:var(--mono);font-size:22px;letter-spacing:.04em}
.hero span{font-size:12px;font-weight:600;opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.hexin{flex:1;min-width:0;height:44px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:0 12px;font-family:var(--mono);font-size:16px}
.hexin.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.errline{color:var(--err);font-size:12px;min-height:16px;margin:4px 0 0}
input[type=color]{width:52px;height:44px;border:1px solid var(--rule);border-radius:4px;padding:3px;background:var(--paper);flex:none;cursor:pointer}
.sl{display:grid;grid-template-columns:22px minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:4px}
.sl label{font-family:var(--mono);font-weight:700;font-size:13px}
.sl output{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:var(--track,var(--rule));border:1px solid var(--rule)}
input[type=range]::-moz-range-track{height:14px;border-radius:7px;background:var(--track,var(--rule));border:1px solid var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);margin-top:-7px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.fld{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:12px 0 6px}
select{width:100%;height:44px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:0 10px;font-size:15px}
.btn{min-height:44px;border-radius:4px;border:1px solid var(--ink);background:var(--paper);font-weight:700;font-size:14px;cursor:pointer;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.solid{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* photo */
.photo{position:relative;margin-top:10px;display:flex;justify-content:center;background:conic-gradient(var(--chk-a) 25%,var(--chk-b) 0 50%,var(--chk-a) 0 75%,var(--chk-b) 0) 0 0/14px 14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.photo canvas{display:block;max-width:100%;max-height:340px;cursor:crosshair}
.loupe{position:absolute;width:80px;height:80px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink),0 4px 12px rgba(0,0,0,.35);pointer-events:none;overflow:hidden}
.loupe canvas{width:80px;height:80px;display:block;max-height:none;image-rendering:pixelated}
.loupe::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid #fff;box-shadow:0 0 0 1px #000}
.badge{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;background:var(--shade);color:#fff;pointer-events:none}
.picked{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.picked i{width:44px;height:44px;border-radius:3px;border:1px solid var(--rule);flex:none}
.picked code{font-family:var(--mono);font-size:15px;flex:1;min-width:80px}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg2 button{height:44px;min-width:64px;border:0;background:var(--paper);cursor:pointer;font-weight:700;font-family:var(--mono)}
.seg2 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
/* strip */
.strip{display:grid;gap:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw{position:relative;cursor:grab;outline-offset:2px;min-width:0;border:0;padding:0;background:none;text-align:center;color:var(--ink)}
.sw .chip{height:88px;border-radius:3px;border:1px solid rgba(127,127,127,.25);position:relative;transition:transform .15s}
.sw[aria-expanded="true"] .chip{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--chip-ring)}
.sw .hx{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em;margin-top:5px;white-space:nowrap;overflow:hidden;color:var(--ink-2)}
.sw .lk{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.sw.dragging{opacity:.85;z-index:2}
.sw.dragging .chip{transform:scale(1.06)}
.sw.pressing .chip{transform:scale(.96)}
.detail{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.dl{display:grid;grid-template-columns:62px minmax(0,1fr) 44px;align-items:center;border-bottom:1px solid var(--rule-2);min-height:44px}
.dl dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.dl dd{margin:0;font-family:var(--mono);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);border-radius:4px}
/* contrast */
.pick{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.pick .lb{font-weight:800;font-size:13px;line-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cc{width:44px;height:44px;border-radius:3px;border:1px solid var(--rule);cursor:pointer;padding:0;position:relative}
.cc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--chip-ring)}
.cc.hexbox{width:auto;flex:1;min-width:104px;font-family:var(--mono);padding:0 10px;background:var(--paper);cursor:text;font-size:15px}
.preview{border-radius:3px;padding:16px;border:1px solid var(--rule);margin:6px 0 10px}
.preview p{margin:0}
.preview .n{font-size:16px}
.preview .b{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.ratio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ratio b{font-family:var(--mono);font-size:30px;letter-spacing:-.02em}
.ratio span{font-size:12.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.bd{border-radius:3px;padding:6px 4px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25}
.bd b{display:block;font-family:var(--mono);font-size:12.5px}
.bd.pass{background:var(--pass-bg);color:var(--pass)}
.bd.fail{background:var(--fail-bg);color:var(--fail)}
.fix{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px;border:1px dashed var(--rule);border-radius:4px;font-size:13px}
.fix i{width:28px;height:28px;border-radius:3px;border:1px solid var(--rule);flex:none}
.fix code{font-family:var(--mono)}
/* export */
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp .btn{width:100%}
pre.code{background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:10px;font-family:var(--mono);font-size:12px;overflow:auto;margin:10px 0 0;max-height:160px;white-space:pre}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);z-index:31;display:flex;flex-direction:column;border-left:2px solid var(--ink)}
.drawer header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--rule);min-height:60px}
.drawer header h3{margin:0;flex:1;font-size:17px}
.dlist{overflow:auto;flex:1;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sv{border-bottom:1px solid var(--rule-2);padding:10px 0}
.sv .bars{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--rule);cursor:pointer;width:100%;padding:0}
.sv .bars i{flex:1}
.sv .meta{display:flex;align-items:center;gap:4px;margin-top:6px}
.sv .meta input{flex:1;min-width:0;height:44px;border:1px dashed var(--rule);border-radius:4px;background:transparent;padding:0 8px;font-weight:600;font-size:15px}
.sv .meta input:focus{border-color:var(--rule);background:var(--bg)}
.sv small{display:block;color:var(--muted);font-size:11.5px;padding-left:8px;font-family:var(--mono)}
.empty{color:var(--muted);text-align:center;padding:32px 8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.ov{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .box{background:var(--paper);border-radius:4px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:12px}
.ov img{display:block;width:100%;height:auto;border:1px solid var(--rule)}
@media (max-height:600px){.ov{align-items:flex-start;overflow:auto}}
@media (hover:hover){.ib:hover,.btn:hover{border-color:var(--ink)} .cp:hover{background:var(--rule-2)} .sw:hover .chip{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>調色盤工作室 <small id="topHint">PALETTE LAB</small></h1>
    <button class="ib" id="themeBtn" type="button" aria-label="切換主題"></button>
    <button class="ib" id="drawerBtn" type="button" aria-label="我的調色盤">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16M15 4v16"/></svg>
    </button>
  </header>

  <div class="layout">
    <section class="sec" aria-label="來源">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-base" aria-selected="true" aria-controls="pane-base">主色產生</button>
        <button type="button" role="tab" id="tab-photo" aria-selected="false" aria-controls="pane-photo">照片取色</button>
      </div>

      <div id="pane-base" role="tabpanel" aria-labelledby="tab-base">
        <div class="hero" id="hero"><span id="heroTag">範例主色</span><b id="heroHex">#000000</b></div>
        <div class="row">
          <input class="hexin" id="hexIn" type="text" autocomplete="off" spellcheck="false" aria-label="主色（HEX、rgb()、hsl() 或色名）" placeholder="#1E3A5F、rgb()、tomato">
          <input type="color" id="nativeColor" aria-label="色彩選擇器">
          <button class="ib" id="eyeBtn" type="button" hidden aria-label="螢幕取色">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4l6 6-2 2-6-6zM12 8l-8 8v4h4l8-8"/></svg>
          </button>
        </div>
        <p class="errline" id="hexErr" aria-live="polite"></p>
        <div class="sl"><label for="hS">H</label><input type="range" id="hS" min="0" max="359" step="1"><output id="hO"></output></div>
        <div class="sl"><label for="sS">S</label><input type="range" id="sS" min="0" max="100" step="1"><output id="sO"></output></div>
        <div class="sl"><label for="lS">L</label><input type="range" id="lS" min="0" max="100" step="1"><output id="lO"></output></div>
        <label class="fld" for="rule">配色規則</label>
        <select id="rule">
          <option value="comp">互補</option>
          <option value="analog">類似</option>
          <option value="triad">三角</option>
          <option value="split">分裂互補</option>
          <option value="tetrad">四方</option>
          <option value="mono">單色漸層</option>
          <option value="material">Material 色階</option>
        </select>
      </div>

      <div id="pane-photo" role="tabpanel" aria-labelledby="tab-photo" hidden>
        <div class="row" style="flex-wrap:wrap">
          <label class="btn solid" for="photoIn" role="button" tabindex="0" id="photoBtn">選擇照片</label>
          <input type="file" id="photoIn" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
          <span style="flex:1"></span>
          <div class="seg2" role="group" aria-label="自動萃取色數">
            <button type="button" id="n5" aria-pressed="true">5 色</button>
            <button type="button" id="n8" aria-pressed="false">8 色</button>
          </div>
        </div>
        <div class="photo" id="photoBox">
          <canvas id="photoCv" width="10" height="10" aria-label="照片，點按取色"></canvas>
          <span class="badge" id="photoBadge">範例照片</span>
          <div class="loupe" id="loupe" hidden><canvas id="loupeCv" width="80" height="80"></canvas></div>
        </div>
        <p class="errline" id="photoErr"></p>
        <div class="picked" id="pickedRow" hidden>
          <i id="pickedChip"></i><code id="pickedHex"></code>
          <button class="btn ghost" type="button" id="pickAdd">放入色條</button>
          <button class="btn ghost" type="button" id="pickBase">設為主色</button>
        </div>
        <p class="hint">點按或拖移照片取色（放開時確定）；選取色條中的色塊後再取色，會替換該色塊。</p>
      </div>
    </section>

    <div style="display:grid;gap:16px;min-width:0">
      <section class="sec" aria-label="結果色條">
        <h2>配色 <span id="stripInfo"></span></h2>
        <div class="strip" id="strip" role="listbox" aria-label="結果色條"></div>
        <p class="hint">點色塊看數值；長按 0.5 秒鎖定（重新產生時不變）；左右拖曳可排序。</p>
        <div class="detail" id="detail" hidden></div>
      </section>

      <section class="sec" aria-label="對比檢查">
        <h2>對比檢查 <span>WCAG 2.x</span></h2>
        <div class="pick"><div class="lb">文字</div><div class="chips" id="fgChips"></div></div>
        <div class="pick"><div class="lb">背景</div><div class="chips" id="bgChips"></div></div>
        <div class="preview" id="preview">
          <p class="n">一般文字 16px：今天的會議改到下午三點。</p>
          <p class="b">大字 24px 粗體</p>
        </div>
        <div class="ratio"><b id="ratio">—</b><span id="ratioNote"></span></div>
        <div class="badges" id="badges"></div>
        <div class="fix" id="fix" hidden></div>
      </section>

      <section class="sec" aria-label="匯出">
        <h2>匯出</h2>
        <div class="exp">
          <button class="btn" type="button" id="copyCss">複製 CSS 變數</button>
          <button class="btn" type="button" id="copyJson">複製 JSON</button>
          <button class="btn" type="button" id="pngBtn">下載 PNG 色卡</button>
          <button class="btn solid" type="button" id="saveBtn">存入我的調色盤</button>
        </div>
        <pre class="code" id="codeOut" tabindex="0" aria-label="匯出內容"></pre>
      </section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="我的調色盤" role="dialog" aria-modal="true">
  <header><h3>我的調色盤 <small id="savedCount" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></small></h3><button class="ib" type="button" id="drawerClose" aria-label="關閉">✕</button></header>
  <div class="dlist" id="dlist"></div>

peru:cd853f,pink:ffc0cb,plum:dda0dd,powderblue:b0e0e6,purple:800080,rebeccapurple:663399,red:ff0000,rosybrown:bc8f8f,royalblue:4169e1,saddlebrown:8b4513,salmon:fa8072,sandybrown:f4a460,seagreen:2e8b57,seashell:fff5ee,sienna:a0522d,silver:c0c0c0,skyblue:87ceeb,slateblue:6a5acd,slategray:708090,slategrey:708090,snow:fffafa,springgreen:00ff7f,steelblue:4682b4,tan:d2b48c,teal:008080,thistle:d8bfd8,tomato:ff6347,turquoise:40e0d0,violet:ee82ee,wheat:f5deb3,white:ffffff,whitesmoke:f5f5f5,yellow:ffff00,yellowgreen:9acd32';
const NAMED=Object.fromEntries(NAMES.split(',').map(p=>p.split(':')));
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3||h.length===4) h=h.split('').map(c=>c+c).join(''); if(!/^[0-9a-f]{6}([0-9a-f]{2})?$/i.test(h)) return null; return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16),a:h.length===8?Math.round(parseInt(h.slice(6,8),16)/255*1000)/1000:1}; }

  if(/^#?[0-9a-f]{3,8}$/.test(s)){ return [3,4,6,8].includes(s.replace('#','').length) ? hexToRgb(s) : null; }

  if(m){ const p=m[1].split(/[\s,\/]+/).filter(Boolean); if(p.length<3||p.length>4) return null;
    const ch=v=>/%$/.test(v)? parseFloat(v)*2.55 : parseFloat(v); const r=ch(p[0]),g=ch(p[1]),b=ch(p[2]);
    let a=p[3]==null?1:(/%$/.test(p[3])?parseFloat(p[3])/100:parseFloat(p[3]));
    if([r,g,b,a].some(v=>isNaN(v))) return null; return {r:Math.round(clamp(r,0,255)),g:Math.round(clamp(g,0,255)),b:Math.round(clamp(b,0,255)),a:clamp(a,0,1)}; }
  m=s.match(/^hsla?\(\s*([^)]*)\)$/);
  if(m){ const p=m[1].split(/[\s,\/]+/).filter(Boolean); if(p.length<3||p.length>4) return null;
    const h=parseFloat(p[0]), sa=parseFloat(p[1]), l=parseFloat(p[2]); let a=p[3]==null?1:(/%$/.test(p[3])?parseFloat(p[3])/100:parseFloat(p[3]));
    if([h,sa,l,a].some(v=>isNaN(v))) return null; const c=hslToRgb(h,clamp(sa,0,100),clamp(l,0,100)); c.a=clamp(a,0,1); return c; }
  return null;
}
const h2=n=>Math.round(n).toString(16).padStart(2,'0').toUpperCase();
const toHex=c=>'#'+h2(c.r)+h2(c.g)+h2(c.b)+(c.a!=null&&c.a<1?h2(c.a*255):'');
function rgbToHsl({r,g,b}){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0, s=0; const l=(mx+mn)/2;
  if(d){ s=d/(1-Math.abs(2*l-1)); h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; if(h<0) h+=360; }

function hslToRgb(h,s,l){ h=((h%360)+360)%360; s/=100; l/=100; const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;

const lin=v=>{ v/=255; return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
const unlin=v=> v<=0.0031308? 12.92*v : 1.055*Math.pow(v,1/2.4)-0.055;
function rgbToOklab({r,g,b}){ const R=lin(r),G=lin(g),B=lin(b);
  const l=Math.cbrt(0.4122214708*R+0.5363325363*G+0.0514459929*B), m=Math.cbrt(0.2119034982*R+0.6806995451*G+0.1073969566*B), s=Math.cbrt(0.0883024619*R+0.2817188376*G+0.6299787005*B);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s, 1.9779984951*l-2.4285922050*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.8086757660*s]; }
function oklabToLinear(L,a,b){ const l=(L+0.3963377774*a+0.2158037573*b)**3, m=(L-0.1055613458*a-0.0638541728*b)**3, s=(L-0.0894841775*a-1.2914855480*b)**3;
  return [4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.7076147010*s]; }

/* ===================== rules ===================== */
function generate(base, rule){
  const [h,s,l]=rgbToHsl(base);
  const H=(dh,dl=0,ss=s)=>hslToRgb(h+dh, ss, clamp(l+dl,5,95));
  switch(rule){
    case 'comp': return [H(0,-20),H(0),H(0,20),H(180),H(180,20)];
    case 'analog': return [H(-30),H(-15),H(0),H(15),H(30)];
    case 'triad': return [H(0,-25),H(0),H(0,25),H(120),H(240)];
    case 'split': return [H(0,-20),H(0),H(0,20),H(150),H(210)];
    case 'tetrad': return [H(0),H(90),H(180),H(270),H(0,0,8)];
    case 'mono': { const [,C,Hh]=rgbToOklch(base); return [0.95,0.80,0.65,0.50,0.35,0.20].map(L=>oklchToRgb(L,C,Hh)); }
    case 'material': { const [,C,Hh]=rgbToOklch(base); return Array.from({length:10},(_,i)=>{ const t=i/9; const L=0.97-(0.97-0.25)*t; const k=Math.sin(Math.PI*(0.12+0.76*t)); return oklchToRgb(L, C*k, Hh); }); }
  }
  return [base];
}
const RULE_NAME={comp:'互補',analog:'類似',triad:'三角',split:'分裂互補',tetrad:'四方',mono:'單色漸層',material:'Material 色階'};

/* ===================== median cut ===================== */
function extract(data, n){ // data: Uint8ClampedArray RGBA
  const px=[]; for(let i=0;i<data.length;i+=4){ if(data[i+3]>128) px.push([data[i],data[i+1],data[i+2]]); }
  if(!px.length) return [];
  if(px.length<100){ const cnt=new Map(); px.forEach(p=>{ const k=p.join(','); cnt.set(k,(cnt.get(k)||0)+1); }); const [k]=[...cnt.entries()].sort((a,b)=>b[1]-a[1])[0]; const [r,g,b]=k.split(',').map(Number); return [{r,g,b,a:1}]; }
  const range=bx=>{ let mn=[255,255,255], mx=[0,0,0]; for(const p of bx) for(let c=0;c<3;c++){ if(p[c]<mn[c]) mn[c]=p[c]; if(p[c]>mx[c]) mx[c]=p[c]; } const r=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]]; const ch=r.indexOf(Math.max(...r)); return {ch, size:r[ch]}; };
  let boxes=[{px, ...range(px)}];
  while(boxes.length<16){
    let bi=-1, best=0; boxes.forEach((b,i)=>{ const sc=b.size*Math.sqrt(b.px.length); if(b.size>0 && b.px.length>1 && sc>best){ best=sc; bi=i; } });
    if(bi<0) break;
    const b=boxes[bi]; b.px.sort((x,y)=>x[b.ch]-y[b.ch]);
    let mid=b.px.length>>1; // keep equal values together where possible
    const v=b.px[mid][b.ch]; let lo=mid; while(lo>0 && b.px[lo-1][b.ch]===v) lo--; let hi=mid; while(hi<b.px.length && b.px[hi][b.ch]===v) hi++;
    mid = lo>0 ? lo : hi; if(mid<=0||mid>=b.px.length) mid=b.px.length>>1;
    const A=b.px.slice(0,mid), B=b.px.slice(mid);
    boxes.splice(bi,1,{px:A,...range(A)},{px:B,...range(B)});
  }
  const cols=boxes.map(b=>{ let r=0,g=0,bl=0; for(const p of b.px){ r+=p[0]; g+=p[1]; bl+=p[2]; } const k=b.px.length; return {c:{r:Math.round(r/k),g:Math.round(g/k),b:Math.round(bl/k),a:1}, n:k}; }).sort((a,b)=>b.n-a.n);
  const kept=[];
  for(const x of cols){ const hit=kept.find(k=>labDist(k.c,x.c)<0.08); if(hit){ const t=hit.n+x.n; hit.c={r:Math.round((hit.c.r*hit.n+x.c.r*x.n)/t),g:Math.round((hit.c.g*hit.n+x.c.g*x.n)/t),b:Math.round((hit.c.b*hit.n+x.c.b*x.n)/t),a:1}; hit.n=t; } else kept.push({c:x.c,n:x.n}); }
  kept.sort((a,b)=>b.n-a.n);
  return kept.slice(0,n).map(k=>k.c).sort((a,b)=>rgbToOklab(a)[0]-rgbToOklab(b)[0]);
}

function applyNew(cols){
  const locked=strip.map((s,i)=>s.locked?i:-1).filter(i=>i>=0);

/* ===================== strip ===================== */
const LOCK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function renderStrip(){
  const el=$('#strip'); const n=strip.length; const cols = n<=8 ? n : Math.ceil(n/2);
  el.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  el.innerHTML='';
  strip.forEach((s,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='sw'; b.dataset.i=i; b.setAttribute('role','option');
    b.setAttribute('aria-expanded', String(i===sel)); b.setAttribute('aria-selected', String(i===sel));
    const hx=toHex(s.c), ink=inkFor(s.c);
    b.setAttribute('aria-label', `${hx}${s.locked?'，已鎖定':''}`);
    b.innerHTML=`<div class="chip" style="background:${hx}">${s.locked?`<span class="lk" style="color:${ink};background:${ink==='#FFFFFF'?'rgba(0,0,0,.35)':'rgba(255,255,255,.55)'}">${LOCK}</span>`:''}</div><span class="hx">${n>5?hx.slice(1):hx}</span>`;
    el.appendChild(b);
  });
  $('#stripInfo').textContent = `${source==='base'?RULE_NAME[rule]:'照片萃取'}・${n} 色${strip.some(s=>s.locked)?`・鎖定 ${strip.filter(s=>s.locked).length}`:''}`;
  renderDetail();
}
function renderDetail(){
  const d=$('#detail'); if(sel<0||!strip[sel]){ d.hidden=true; d.innerHTML=''; return; }
  const s=strip[sel], c=s.c; d.hidden=false;
  const rows=[['HEX',fmt.hex(c)],['RGB',fmt.rgb(c)],['HSL',fmt.hsl(c)],['OKLCH',fmt.oklch(c)]];
  d.innerHTML=`<div class="row" style="margin-bottom:6px"><i style="width:28px;height:28px;border-radius:3px;border:1px solid var(--rule);background:${toHex(c)};flex:none"></i><b style="flex:1;font-size:14px">第 ${sel+1} 色</b><button class="cp" type="button" id="dClose" aria-label="收合">✕</button></div>
    ${rows.map(([k,v])=>`<div class="dl"><dt>${k}</dt><dd>${v}</dd><button class="cp" type="button" data-copy="${v}" aria-label="複製 ${k}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg></button></div>`).join('')}
    <div class="btnrow"><button class="btn ghost" type="button" id="dLock">${s.locked?'解除鎖定':'鎖定'}</button><button class="btn ghost" type="button" id="dBase">設為主色</button><button class="btn ghost" type="button" id="dFg">設為文字</button><button class="btn ghost" type="button" id="dBg">設為背景</button></div>`;
}
$('#detail').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy) return copy(b.dataset.copy);
  const s=strip[sel]; if(!s) return;
  if(b.id==='dClose'){ sel=-1; renderStrip(); }
  else if(b.id==='dLock'){ toggleLock(sel); }
  else if(b.id==='dBase'){ setBase(s.c); }
  else if(b.id==='dFg'){ fg={...s.c}; fgUser=true; renderContrast(); toast('已設為文字色'); }
  else if(b.id==='dBg'){ bg={...s.c}; bgUser=true; renderContrast(); toast('已設為背景色'); }
});
function toggleLock(i){ strip[i].locked=!strip[i].locked; try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} renderStrip(); toast(strip[i].locked?'已鎖定':'已解除鎖定'); }
// pointer: tap = detail, long press = lock, horizontal drag = reorder
(function(){
  const el=$('#strip'); let st=null;
  el.addEventListener('pointerdown', e=>{
    const sw=e.target.closest('.sw'); if(!sw || e.button>0) return;
    st={i:+sw.dataset.i, x:e.clientX, y:e.clientY, id:e.pointerId, drag:false, long:false, sw};
    sw.classList.add('pressing');
    st.timer=setTimeout(()=>{ if(st && !st.drag){ st.long=true; sw.classList.remove('pressing'); toggleLock(st.i); } }, 500);
  });
  el.addEventListener('pointermove', e=>{
    if(!st || e.pointerId!==st.id) return;
    const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.drag && !st.long){
      if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){ cancel(); return; }
      if(Math.abs(dx)>8){ st.drag=true; clearTimeout(st.timer); try{ el.setPointerCapture(e.pointerId); }catch(_){} st.sw.classList.remove('pressing'); st.sw.classList.add('dragging'); }
    }
    if(st.drag){
      e.preventDefault();
      const target=[...el.children].findIndex(c=>{ const r=c.getBoundingClientRect(); return e.clientY>=r.top-6 && e.clientY<=r.bottom+30 && e.clientX>=r.left && e.clientX<=r.right; });
      if(target>=0 && target!==st.i){
        const [m]=strip.splice(st.i,1); strip.splice(target,0,m);
        if(sel===st.i) sel=target; else if(sel>=0){ if(st.i<sel && target>=sel) sel--; else if(st.i>sel && target<=sel) sel++; }
        st.i=target; renderStrip(); st.sw=el.children[target]; st.sw.classList.add('dragging');
      }
    }
  });
  function cancel(){ if(!st) return; clearTimeout(st.timer); st.sw.classList.remove('pressing','dragging'); st=null; }
  el.addEventListener('pointerup', e=>{
    if(!st) return; const s=st; cancel();
    if(s.drag){ renderStrip(); renderExport(); return; }
    if(s.long) return;
    sel = sel===s.i ? -1 : s.i; renderStrip();
    if(sel>=0 && pickPending===false){}
  });
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('keydown', e=>{ // keyboard: Enter=detail, L=lock, Alt+Arrow=move
    const sw=e.target.closest('.sw'); if(!sw) return; const i=+sw.dataset.i;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel= sel===i?-1:i; renderStrip(); el.children[i]?.focus(); }
    else if(e.key.toLowerCase()==='l'){ toggleLock(i); el.children[i]?.focus(); }
    else if(e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ const t=clamp(i+(e.key==='ArrowLeft'?-1:1),0,strip.length-1); const [m]=strip.splice(i,1); strip.splice(t,0,m); sel=t; renderStrip(); renderExport(); el.children[t]?.focus(); }
  });
})();

/* ===================== contrast ===================== */
const WHITE={r:255,g:255,b:255,a:1}, BLACK={r:0,g:0,b:0,a:1};
function autoContrast(){
  if(!strip.length) return;
  const byL=[...strip].map(s=>s.c).sort((a,b)=>lum(a)-lum(b));
  if(!fgUser || !fg) fg={...byL[0]};
  if(!bgUser || !bg) bg={...byL[byL.length-1]};
}
function chipsHTML(kind, cur){
  const opts=[...strip.map(s=>s.c), WHITE, BLACK];
  const seen=new Set(); let html='';
  for(const c of opts){ const hx=toHex(c); if(seen.has(hx)) continue; seen.add(hx);
    html+=`<button class="cc" type="button" data-kind="${kind}" data-hex="${hx}" style="background:${hx}" aria-label="${kind==='fg'?'文字':'背景'} ${hx}" aria-pressed="${cur&&toHex(cur)===hx}"></button>`; }
  html+=`<input class="cc hexbox" id="${kind}Hex" type="text" spellcheck="false" autocomplete="off" value="${cur?toHex(cur):''}" aria-label="${kind==='fg'?'文字色':'背景色'}（可輸入 HEX，含透明度）">`;
  return html;
}
function renderContrast(){
  if(!fg||!bg) return;
  const ae=document.activeElement, keep = ae && (ae.id==='fgHex'||ae.id==='bgHex') ? ae.id : null;
  if(!keep){ $('#fgChips').innerHTML=chipsHTML('fg',fg); $('#bgChips').innerHTML=chipsHTML('bg',bg); }
  else { document.querySelectorAll('.cc[data-kind]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.hex===toHex(b.dataset.kind==='fg'?fg:bg)))); }
  const p=$('#preview'); p.style.background=toHex({...bg,a:1}); p.style.color= fg.a<1 ? `rgba(${fg.r},${fg.g},${fg.b},${fg.a})` : toHex(fg);
  const r=contrast(fg,bg), rs=ratioStr(r);
  $('#ratio').textContent=rs+':1';
  $('#ratioNote').textContent = fg.a<1 ? '文字色含透明度，已先與背景合成' : `${toHex(fg)} 於 ${toHex(bg)}`;
  const v=r; // badges use the unrounded ratio so 4.497 never shows as a pass
  const B=[['AA','一般文字',4.5],['AA','大字',3],['AAA','一般文字',7],['AAA','大字',4.5]];
  $('#badges').innerHTML=B.map(([lv,k,t])=>{ const ok=v>=t; return `<div class="bd ${ok?'pass':'fail'}"><b>${lv} ${ok?'通過':'未過'}</b>${k} ≥${t}</div>`; }).join('');
  const fx=$('#fix');
  if(r<4.5){ const s=suggest(fg,bg); if(s){ fx.hidden=false; fx.innerHTML=`<span>建議修正（保持色相）：</span><i style="background:${toHex(s)}"></i><code>${toHex(s)}</code><code>${ratioStr(contrast(s,bg))}:1</code><button class="btn ghost" type="button" id="applyFix">套用建議色</button>`; fx.dataset.hex=toHex(s); } else { fx.hidden=false; fx.innerHTML='<span>此背景下無法只調亮度達到 4.5:1，請換背景色。</span>'; fx.dataset.hex=''; } }
  else fx.hidden=true;
}
function suggest(f,b){
  const solid=over(f,b); let [L,C,H]=rgbToOklch(solid); const Lb=rgbToOklab(b)[0];
  let dir = L>Lb ? 1 : L<Lb ? -1 : (Lb>0.5?-1:1);
  for(let pass=0; pass<2; pass++){
    let l=L;
    for(let i=0;i<101;i++){ l+=dir*0.01; if(l<0||l>1) break; const c=oklchToRgb(l,C,H); if(contrast(c,b)>=4.5) return c; }
    dir=-dir;
  }
  return null;
}
document.addEventListener('click', e=>{
  const c=e.target.closest('.cc[data-kind]');
  if(c){ const col=parseColor(c.dataset.hex); if(c.dataset.kind==='fg'){ fg=col; fgUser=true; } else { bg=col; bgUser=true; } renderContrast(); return; }
  if(e.target.id==='applyFix'){ const hx=$('#fix').dataset.hex; if(hx){ const nc=parseColor(hx); const fi=strip.findIndex(s=>toHex(s.c)===toHex({...fg,a:1})); fg=nc; fgUser=true; if(fi>=0 && !strip[fi].locked){ strip[fi].c=nc; renderStrip(); renderExport(); } renderContrast(); toast('已套用 '+hx); } }
});

let photoLoaded=false; const pcv=$('#photoCv'); let pctx=pcv.getContext('2d',{willReadFrequently:true});
async function loadImageSource(src, isSample){
  $('#photoErr').textContent='';
  const MAXS=4096;
  const w=src.width, h=src.height; const s=Math.min(1, MAXS/Math.max(w,h));
  pcv.width=Math.max(1,Math.round(w*s)); pcv.height=Math.max(1,Math.round(h*s));
  pctx=pcv.getContext('2d',{willReadFrequently:true}); pctx.clearRect(0,0,pcv.width,pcv.height); pctx.drawImage(src,0,0,pcv.width,pcv.height);
  photoLoaded=true; $('#photoBadge').hidden=!isSample; $('#pickedRow').hidden=true;
  // extraction on <=200px copy
  const t=Math.min(1,200/Math.max(pcv.width,pcv.height)); const sc=document.createElement('canvas'); sc.width=Math.max(1,Math.round(pcv.width*t)); sc.height=Math.max(1,Math.round(pcv.height*t));
  const sx=sc.getContext('2d',{willReadFrequently:true}); sx.imageSmoothingQuality='high'; sx.drawImage(pcv,0,0,sc.width,sc.height);
  photoColors=extract(sx.getImageData(0,0,sc.width,sc.height).data, 8);
  if(!photoColors.length){ $('#photoErr').textContent='圖片幾乎全透明，找不到可用的顏色。'; photoColors=null; return; }
  if(photoColors.length<nPhoto) $('#photoErr').textContent=`這張圖只找到 ${photoColors.length} 種主要顏色。`;
  if(source==='photo') regen();
}
async function loadFile(f){
  if(!f) return;
  try{
    let bmp=await createImageBitmap(f);
    if(bmp.width*bmp.height>40e6){ const rw=Math.round(bmp.width*Math.sqrt(16e6/(bmp.width*bmp.height))); bmp.close(); bmp=await createImageBitmap(f,{resizeWidth:rw,resizeQuality:'high'}); }
    await loadImageSource(bmp,false); bmp.close(); toast('已萃取顏色');
  }catch(e){
    try{ const u=URL.createObjectURL(f); const img=new Image(); img.src=u; await img.decode(); await loadImageSource(img,false); URL.revokeObjectURL(u); }
    catch(e2){ $('#photoErr').textContent='此格式無法讀取，請先轉成 JPG'; }
  }
}

function loadSamplePhoto(){
  const w=900,h=600,c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,330); g.addColorStop(0,'#7FB6D9'); g.addColorStop(1,'#CFE3EC'); x.fillStyle=g; x.fillRect(0,0,w,330);
  x.fillStyle='#1F5E78'; x.fillRect(0,300,w,140);
  x.fillStyle='#E8D2A8'; x.beginPath(); x.moveTo(0,420); x.quadraticCurveTo(450,380,900,430); x.lineTo(900,600); x.lineTo(0,600); x.fill();
  x.fillStyle='#C8442F'; x.beginPath(); x.moveTo(560,330); x.quadraticCurveTo(660,250,760,330); x.closePath(); x.fill();
  x.strokeStyle='#3A2E2A'; x.lineWidth=6; x.beginPath(); x.moveTo(660,300); x.lineTo(660,470); x.stroke();
  x.fillStyle='#F2B84B'; x.beginPath(); x.arc(170,110,48,0,7); x.fill();
  x.fillStyle='#2D3B2F'; x.beginPath(); x.moveTo(0,300); x.lineTo(120,220); x.lineTo(260,300); x.fill();
  loadImageSource(c,true);
}
function ptToImg(e){ const r=pcv.getBoundingClientRect(); return {x:clamp((e.clientX-r.left)/r.width*pcv.width,0,pcv.width-1), y:clamp((e.clientY-r.top)/r.height*pcv.height,0,pcv.height-1), dx:e.clientX-r.left, dy:e.clientY-r.top, r}; }
function avg3(x,y){ x=Math.round(x); y=Math.round(y); const x0=clamp(x-1,0,pcv.width-1), y0=clamp(y-1,0,pcv.height-1), x1=clamp(x+1,0,pcv.width-1), y1=clamp(y+1,0,pcv.height-1);
  const d=pctx.getImageData(x0,y0,x1-x0+1,y1-y0+1).data; let r=0,g=0,b=0,a=0,n=0; for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; a+=d[i+3]; n++; }
  return {r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n),a:1, alpha:a/n}; }
const lcv=$('#loupeCv'); const lctx=lcv.getContext('2d');
function showLoupe(p){
  const L=$('#loupe'); L.hidden=false; const box=$('#photoBox').getBoundingClientRect();
  const left=p.r.left-box.left+p.dx-40, top=p.r.top-box.top+p.dy-100;
  L.style.left=clamp(left,0,box.width-80)+'px'; L.style.top=(top<0? p.r.top-box.top+p.dy+20 : top)+'px';
  lctx.imageSmoothingEnabled=false; lctx.fillStyle='#888'; lctx.fillRect(0,0,80,80);
  lctx.drawImage(pcv, Math.round(p.x)-5, Math.round(p.y)-5, 10, 10, 0, 0, 80, 80);
}
let pickPending=false, picking=false, picked=null;
pcv.addEventListener('pointerdown', e=>{ if(!photoLoaded) return; picking=true; try{ pcv.setPointerCapture(e.pointerId); }catch(_){} const p=ptToImg(e); showLoupe(p); });
pcv.addEventListener('pointermove', e=>{ if(!picking) return; showLoupe(ptToImg(e)); });
pcv.addEventListener('pointerup', e=>{ if(!picking) return; picking=false; $('#loupe').hidden=true; const p=ptToImg(e); const c=avg3(p.x,p.y);
  if(c.alpha<10){ toast('這裡是透明區域'); return; }
  picked={r:c.r,g:c.g,b:c.b,a:1}; $('#pickedRow').hidden=false; $('#pickedChip').style.background=toHex(picked); $('#pickedHex').textContent=toHex(picked);
  if(sel>=0 && strip[sel] && !strip[sel].locked){ strip[sel].c=picked; renderStrip(); renderContrast(); renderExport(); toast(`已替換第 ${sel+1} 色`); }
});
pcv.addEventListener('pointercancel', ()=>{ picking=false; $('#loupe').hidden=true; });
$('#pickAdd').addEventListener('click',()=>{ if(!picked) return; if(sel>=0 && strip[sel] && !strip[sel].locked){ strip[sel].c=picked; } else if(strip.length<8){ strip.push({c:picked,locked:false}); } else { const i=strip.map(s=>s.locked).lastIndexOf(false); if(i<0){ toast('全部色塊都鎖定了'); return; } strip[i].c=picked; } renderStrip(); renderContrast(); renderExport(); toast('已放入色條'); });
$('#pickBase').addEventListener('click',()=>{ if(picked) setBase(picked); });

/* ===================== init ===================== */
renderBase(); regen();
window.__pl={ parseColor, contrast, ratioStr, toHex, generate, extract, rgbToOklch, oklchToRgb, suggest, names:Object.keys(NAMED).length, get strip(){ return strip; }, get fg(){ return fg; }, get bg(){ return bg; } };
})();
</script>
