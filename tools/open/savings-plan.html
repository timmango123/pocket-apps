      <div class="row2">

      <p class="foot">試算以逐月模擬，結果僅供規劃參考；實際投資報酬會波動，非保證收益。</p>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const K = 'savings-plan:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(K + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) {} }
};
const DEF = { principal: '100000', monthly: '10000', target: '4000000', rate: '6', years: '20', freq: 'm', timing: 'end', growth: '', inflation: '2' };
let S = Object.assign({}, DEF);
const saved = store.get('inputs', null);
let isExample = true;
if (saved && typeof saved === 'object') { for (const k in DEF) if (typeof saved[k] === 'string') S[k] = saved[k]; isExample = !!saved.__example; }
let mode = store.get('mode', 'fv'); if (!['fv', 'pmt', 'years'].includes(mode)) mode = 'fv';

/* theme */
const themeSaved = store.get('theme', null);
if (themeSaved === 'light' || themeSaved === 'dark') document.documentElement.dataset.theme = themeSaved;
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next); requestAnimationFrame(draw);
});

/* ---------- 純函式 ---------- */
const num = s => { const t = String(s == null ? '' : s).replace(/[,\s，]/g, ''); if (t === '') return NaN; const v = Number(t); return isFinite(v) ? v : NaN; };
const toCents = yuan => Math.round(yuan * 100);
function monthlyRate(R, freq) {
  if (freq === 'y') return Math.pow(1 + R, 1 / 12) - 1;
  if (freq === 'd') return Math.pow(1 + R / 365, 365 / 12) - 1;
  return R / 12;
}
/* 逐月模擬；金額以「分」為整數。回傳 [{month, contributed, balance}]（month 0 = 起點） */
function simulate(p) {
  const r = monthlyRate(p.rate, p.freq), out = [{ month: 0, contributed: p.principal, balance: p.principal }];
  let bal = p.principal, contrib = p.principal, reach = p.target > 0 && bal >= p.target ? 0 : -1;
  const maxM = p.months;
  for (let m = 1; m <= maxM; m++) {
    const pay = Math.round(p.monthly * Math.pow(1 + p.growth, Math.floor((m - 1) / 12)));
    if (p.timing === 'begin') { bal += pay; bal = Math.round(bal * (1 + r)); }
    else { bal = Math.round(bal * (1 + r)); bal += pay; }
    contrib += pay;
    out.push({ month: m, contributed: contrib, balance: bal, pay });
    if (reach < 0 && p.target > 0 && bal >= p.target) { reach = m; if (p.stopAtTarget) break; }
  }
  out.reach = reach;
  return out;
}
/* 二分搜尋每月需存（以元為精度，回傳分） */
function solveMonthly(p) {
  let lo = 0, hi = Math.max(100, Math.ceil(p.target / 100)); // 元
  const fvOf = yuan => { const s = simulate(Object.assign({}, p, { monthly: yuan * 100, stopAtTarget: false })); return s[s.length - 1].balance; };
  if (fvOf(0) >= p.target) return { cents: 0, already: true };
  if (fvOf(hi) < p.target) { // 極端負報酬時擴大上限
    let tries = 0; while (fvOf(hi) < p.target && tries < 20) { hi *= 4; tries++; }
    if (fvOf(hi) < p.target) return null;
  }
  for (let i = 0; i < 60 && hi - lo > 1; i++) { const mid = Math.floor((lo + hi) / 2); if (fvOf(mid) >= p.target) hi = mid; else lo = mid; }
  return { cents: hi * 100 };
}
const NF = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const full = c => (c < 0 ? '−' : '') + NF.format(Math.abs(Math.round(c / 100)));
function short(c) {
  const y = c / 100, a = Math.abs(y), s = y < 0 ? '−' : '';
  if (a >= 1e8) return s + (a / 1e8).toFixed(2) + ' 億';
  if (a >= 1e4) return s + (a / 1e4).toFixed(1) + ' 萬';
  return s + NF.format(Math.round(a));
}
const ymText = m => { const y = Math.floor(m / 12), mo = m % 12; return y ? ('第 ' + y + ' 年' + (mo ? ' ' + mo + ' 個月' : '') ) : ('第 ' + mo + ' 個月'); };
function reachText(m) { if (m === 0) return '起始本金已達成'; const y = Math.floor(m / 12), mo = m % 12; return mo === 0 ? '第 ' + y + ' 年整達成' : '第 ' + y + ' 年 ' + mo + ' 個月達成'; }

/* ---------- 讀取輸入 ---------- */
const ids = ['principal', 'monthly', 'target', 'rate', 'years', 'growth', 'inflation'];
function fill() {
  ids.forEach(k => { $('#' + k).value = S[k]; });
  $('#rate-range').value = isFinite(num(S.rate)) ? Math.max(-50, Math.min(50, num(S.rate))) : 6;
  $('#years-range').value = isFinite(num(S.years)) ? Math.max(1, Math.min(100, num(S.years))) : 20;
  document.querySelectorAll('[data-freq]').forEach(b => b.setAttribute('aria-pressed', b.dataset.freq === S.freq));
  document.querySelectorAll('[data-timing]').forEach(b => b.setAttribute('aria-pressed', b.dataset.timing === S.timing));
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('#f-monthly').hidden = mode === 'pmt';
  $('#f-years').hidden = mode === 'years';
  $('#target-opt').textContent = mode === 'fv' ? '（選填，畫目標線）' : '';
  $('#example-note').hidden = !isExample;
}
function readParams() {
  const errs = [];
  const P = num(S.principal), M = num(S.monthly), T = num(S.target), R = num(S.rate), Y = num(S.years);
  const G = S.growth.trim() === '' ? 0 : num(S.growth), I = S.inflation.trim() === '' ? 0 : num(S.inflation);
  const principal = isNaN(P) ? 0 : P, monthly = isNaN(M) ? 0 : M, target = isNaN(T) ? 0 : T;
  if (principal < 0 || monthly < 0 || target < 0) errs.push('金額不可為負數');
  if (principal > 1e12 || monthly > 1e10 || target > 1e13) errs.push('金額過大');
  if (isNaN(R) || R < -50 || R > 50) errs.push('年報酬率需介於 −50% 到 50%');
  if (mode !== 'years' && (isNaN(Y) || Y < 1 || Y > 100 || Math.floor(Y) !== Y)) errs.push('年數需為 1 到 100 的整數');
  if (isNaN(G) || G < -50 || G > 50) errs.push('投入年增率需介於 −50% 到 50%');
  if (isNaN(I) || I < -20 || I > 50) errs.push('通膨率需介於 −20% 到 50%');
  if (mode !== 'fv' && !(target > 0)) errs.push('請輸入目標金額');
  return { errs, p: { principal: toCents(principal), monthly: toCents(monthly), target: toCents(target), rate: R / 100, years: Y, growth: G / 100, inflation: I / 100, freq: S.freq, timing: S.timing } };
}

/* ---------- 計算與繪製 ---------- */
let last = null; // {sim, years, p, main}
function compute() {
  const { errs, p } = readParams();
  const err = $('#err'), msg = $('#msg');
  err.hidden = !errs.length; err.textContent = errs.join('；');
  msg.hidden = true;
  if (errs.length) { last = null; blank(); return; }
  let sim, months, mainK = '終值', main = '', mainSub = '', extraMain = null;
  if (mode === 'fv') {
    if (p.principal === 0 && p.monthly === 0) { msg.hidden = false; msg.textContent = '請輸入本金或每月投入'; last = null; blank(); return; }
    months = p.years * 12; sim = simulate(Object.assign({}, p, { months }));
  } else if (mode === 'pmt') {
    months = p.years * 12;
    const sol = solveMonthly(Object.assign({}, p, { months }));
    if (!sol) { msg.hidden = false; msg.textContent = '在此報酬率下無法於 ' + p.years + ' 年內達成目標'; last = null; blank(); return; }
    p.monthly = sol.cents;
    sim = simulate(Object.assign({}, p, { months }));
    mainK = '每月需存'; extraMain = sol.already ? '不需再投入' : full(sol.cents) + ' 元';
    mainSub = sol.already ? '初始本金在 ' + p.years + ' 年後即可達到目標' : '連續 ' + p.years + ' 年' + (p.growth ? '（之後每年增加 ' + S.growth + '%）' : '') + '，到期約 ' + full(sim[sim.length - 1].balance) + ' 元';
  } else {
    if (p.principal === 0 && p.monthly === 0) { msg.hidden = false; msg.textContent = '請輸入本金或每月投入'; last = null; blank(); return; }
    const full100 = simulate(Object.assign({}, p, { months: 1200, stopAtTarget: true }));
    if (full100.reach < 0) { msg.hidden = false; msg.textContent = '100 年內無法達成'; months = 1200; sim = full100; }
    else { months = Math.max(12, Math.ceil(full100.reach / 12) * 12); sim = simulate(Object.assign({}, p, { months })); }
    mainK = '需要時間';
    extraMain = full100.reach < 0 ? '100 年內無法達成' : full100.reach === 0 ? '已達成' : ((Math.floor(full100.reach / 12) ? Math.floor(full100.reach / 12) + ' 年 ' : '') + (full100.reach % 12 ? full100.reach % 12 + ' 個月' : '')).trim();
    mainSub = full100.reach > 0 ? '共 ' + full100.reach + ' 個月，屆時累積 ' + full(full100[full100.reach].balance) + ' 元' : '';
  }
  const end = sim[sim.length - 1], yrs = months / 12;
  const gain = end.balance - end.contributed;
  const ratio = end.balance !== 0 ? gain / end.balance : 0;
  $('#r-main-k').textContent = mainK;
  $('#r-main').textContent = extraMain || (full(end.balance) + ' 元');
  $('#r-main').title = '';
  $('#r-main-sub').textContent = extraMain ? (mainSub) : ('約 ' + short(end.balance) + '　·　' + yrs + ' 年後');
  $('#r-contrib').textContent = short(end.contributed);
  $('#r-contrib-sub').textContent = full(end.contributed) + ' 元';
  const g = $('#r-gain'); g.textContent = short(gain); g.className = 'v ' + (gain < 0 ? 'neg' : 'pos');
  $('#r-gain-sub').textContent = full(gain) + ' 元';
  const rr = $('#r-ratio'); rr.textContent = (ratio * 100).toFixed(1) + '%'; rr.className = 'v ' + (gain < 0 ? 'neg' : '');
  $('#r-ratio-sub').textContent = gain < 0 ? '虧損' : '總收益 ÷ 終值';
  const realOn = p.inflation !== 0;
  $('#r-x-k').textContent = realOn ? '換算今日購買力' : '年底結算';
  if (realOn) {
    const real = Math.round(end.balance / Math.pow(1 + p.inflation, yrs));
    $('#r-real').textContent = short(real); $('#r-real-sub').textContent = '通膨 ' + S.inflation + '%，' + full(real) + ' 元';
  } else { $('#r-real').textContent = yrs + ' 年'; $('#r-real-sub').textContent = '共 ' + months + ' 個月'; }
  const goal = $('#r-goal');
  if (p.target > 0) {
    const reach = sim.reach;
    goal.textContent = reach >= 0 ? reachText(reach) + '（目標 ' + short(p.target) + '）' : '期間內未達目標 ' + short(p.target) + '，差 ' + short(p.target - end.balance);
    goal.className = 'v ' + (reach >= 0 ? 'pos' : 'neg');
  } else { goal.textContent = '未設定目標金額'; goal.className = 'v'; }
  last = { sim, months, p };
  table(); draw();
}
function blank() {
  ['#r-main', '#r-contrib', '#r-gain', '#r-ratio', '#r-real', '#r-goal'].forEach(s => { $(s).textContent = '—'; $(s).className = 'v'; });
  ['#r-main-sub', '#r-contrib-sub', '#r-gain-sub', '#r-ratio-sub', '#r-real-sub'].forEach(s => { $(s).textContent = ''; });
  $('#table tbody').innerHTML = ''; $('#table tfoot').innerHTML = ''; draw();
}
function yearRows() {
  const { sim, months } = last, rows = [];
  for (let y = 1; y * 12 <= months; y++) {
    const e = sim[y * 12], s = sim[(y - 1) * 12];
    if (!e) break;
    const contribY = e.contributed - s.contributed, gainY = (e.balance - s.balance) - contribY;
    rows.push({ y, bal: e.balance, contrib: contribY, gain: gainY, reach: last.sim.reach > (y - 1) * 12 && last.sim.reach <= y * 12 });
  }
  return rows;
}
function table() {
  const rows = yearRows(), tb = document.createDocumentFragment();
  let tc = 0, tg = 0;
  rows.forEach(r => {
    tc += r.contrib; tg += r.gain;
    const tr = document.createElement('tr'); if (r.reach) tr.className = 'reach';
    tr.innerHTML = '<td>' + r.y + '</td><td>' + full(r.bal) + '</td><td>' + full(r.contrib) + '</td><td' + (r.gain < 0 ? ' class="neg"' : '') + '>' + full(r.gain) + '</td>';
    tb.appendChild(tr);
  });
  const body = $('#table tbody'); body.innerHTML = ''; body.appendChild(tb);
  const p0 = last.p.principal, endB = rows.length ? rows[rows.length - 1].bal : p0;
  $('#table tfoot').innerHTML = '<tr><td>合計</td><td>' + full(endB) + '</td><td>' + full(tc + p0) + '</td><td' + (tg < 0 ? ' class="neg"' : '') + '>' + full(tg) + '</td></tr>';
  $('#table tfoot td:nth-child(3)').title = '含初始本金 ' + full(p0) + ' 元';
}

/* canvas */
const cv = $('#chart'), tip = $('#tip');
let hoverYear = null, geom = null;
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function draw() {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const ink = css('--muted'), line = css('--line');
  c.font = '11px system-ui, sans-serif';
  if (!last) { c.fillStyle = ink; c.textAlign = 'center'; c.fillText('—', w / 2, h / 2); geom = null; return; }
  const { sim, months, p } = last, Y = months / 12;
  const pts = []; for (let y = 0; y <= Y; y++) { const s = sim[y * 12]; if (s) pts.push({ y, c: s.contributed, b: s.balance }); }
  let maxV = 0, minV = 0; pts.forEach(q => { maxV = Math.max(maxV, q.c, q.b); minV = Math.min(minV, q.b); });
  if (p.target > 0) maxV = Math.max(maxV, p.target);
  const top = niceMax(maxV * 1.05);
  const axl = v => { const y = v / 100, a = Math.abs(y); const t = n => String(+n.toFixed(2)); return a >= 1e8 ? t(y / 1e8) + '億' : a >= 1e4 ? t(y / 1e4) + '萬' : NF.format(y); };
  let L = 0; for (let i = 0; i <= 4; i++) L = Math.max(L, c.measureText(axl(top * i / 4)).width); L = Math.ceil(L) + 10;
  const R = 12, T = 12, B = 24, pw = w - L - R, ph = h - T - B;
  const X = y => L + (Y ? y / Y : 0) * pw, Yp = v => T + ph - (v / top) * ph;
  // grid
  c.strokeStyle = line; c.lineWidth = 1; c.fillStyle = ink; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4, yy = Math.round(Yp(v)) + .5; c.beginPath(); c.moveTo(L, yy); c.lineTo(w - R, yy); c.stroke(); c.fillText(axl(v), L - 6, yy); }
  c.textAlign = 'center'; c.textBaseline = 'top';
  const step = Math.max(1, Math.ceil(Y / Math.max(2, Math.floor(pw / 46))));
  for (let y = 0; y <= Y; y += step) c.fillText(y + '年', X(y), T + ph + 6);
  // contributed area
  const area = (getV, base, color) => {
    c.beginPath(); c.moveTo(X(pts[0].y), Yp(base(pts[0])));
    pts.forEach(q => c.lineTo(X(q.y), Yp(getV(q))));
    for (let i = pts.length - 1; i >= 0; i--) c.lineTo(X(pts[i].y), Yp(base(pts[i])));
    c.closePath(); c.fillStyle = color; c.fill();
  };
  area(q => Math.max(0, Math.min(q.c, Math.max(q.b, 0))), () => 0, css('--principal'));
  // gains (positive)
  area(q => Math.max(q.b, q.c), q => q.c, css('--gain'));
  // losses: between balance and contributed where balance < contributed
  area(q => Math.min(q.b, q.c), q => q.c, css('--loss-soft'));
  // balance line
  c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(X(q.y), Yp(Math.max(q.b, 0))) : c.moveTo(X(q.y), Yp(Math.max(q.b, 0)))); c.strokeStyle = css('--ink'); c.lineWidth = 1.5; c.stroke();
  // target
  if (p.target > 0 && p.target <= top) {
    const ty = Math.round(Yp(p.target)) + .5; c.setLineDash([5, 4]); c.strokeStyle = css('--target'); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(L, ty); c.lineTo(w - R, ty); c.stroke(); c.setLineDash([]);
    c.fillStyle = css('--target'); c.textAlign = 'left'; c.textBaseline = 'bottom'; c.font = '600 11px system-ui, sans-serif';
    c.fillText('目標 ' + short(p.target), L + 4, ty - 3);
    if (sim.reach >= 0) { const rx = X(sim.reach / 12); c.beginPath(); c.arc(rx, ty, 5, 0, Math.PI * 2); c.fill(); c.strokeStyle = css('--surface'); c.lineWidth = 2; c.stroke(); }
  }
  // hover
  if (hoverYear != null && hoverYear <= Y) {
    const q = pts[hoverYear]; if (q) { const x = X(q.y); c.strokeStyle = css('--ink'); c.lineWidth = 1; c.beginPath(); c.moveTo(x + .5, T); c.lineTo(x + .5, T + ph); c.stroke(); c.fillStyle = css('--ink'); c.beginPath(); c.arc(x, Yp(Math.max(q.b, 0)), 4, 0, Math.PI * 2); c.fill(); }
  }
  geom = { L, pw, Y, X, pts };
}
function showTip(clientX) {
  if (!geom) return;
  const r = cv.getBoundingClientRect(), x = clientX - r.left;
  let y = Math.round(((x - geom.L) / geom.pw) * geom.Y); y = Math.max(0, Math.min(geom.Y, y));
  hoverYear = y; draw();
  const q = geom.pts[y]; if (!q) return;
  tip.hidden = false;
  tip.innerHTML = (y === 0 ? '起點' : '第 ' + y + ' 年底') + '<br>累積 ' + full(q.b) + ' 元<br>投入 ' + full(q.c) + ' 元<br>收益 ' + full(q.b - q.c) + ' 元';
  const px = geom.X(y), tw = tip.offsetWidth, boxW = cv.parentElement.clientWidth;
  let left = px + 16 + 12; if (left + tw > boxW - 8) left = px + 16 - tw - 12; left = Math.max(8, left);
  tip.style.left = left + 'px';
}
function hideTip() { hoverYear = null; tip.hidden = true; draw(); }
cv.addEventListener('pointerdown', e => { showTip(e.clientX); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) showTip(e.clientX); });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
cv.addEventListener('touchmove', e => { if (hoverYear != null && e.touches[0]) { showTip(e.touches[0].clientX); } }, { passive: true });
document.addEventListener('pointerdown', e => { if (e.target !== cv && hoverYear != null) hideTip(); });
let rz = 0; const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(draw); };
addEventListener('resize', onResize); addEventListener('orientationchange', onResize);

/* ---------- 事件 ---------- */
let tCalc = 0, tSave = 0;
const saveNow = () => store.set('inputs', Object.assign({}, S, { __example: isExample }));
function changed(immediate) {
  clearTimeout(tCalc); if (immediate) compute(); else tCalc = setTimeout(compute, 150);
  clearTimeout(tSave); tSave = setTimeout(() => { saveNow(); store.set('mode', mode); }, 300);
}
function userEdit() { if (isExample) { isExample = false; $('#example-note').hidden = true; } }
ids.forEach(k => $('#' + k).addEventListener('input', e => {
  S[k] = e.target.value; userEdit();
  if (k === 'rate' && isFinite(num(S.rate))) $('#rate-range').value = num(S.rate);
  if (k === 'years' && isFinite(num(S.years))) $('#years-range').value = num(S.years);
  changed();
}));
$('#rate-range').addEventListener('input', e => { S.rate = e.target.value; $('#rate').value = S.rate; userEdit(); changed(); });
$('#years-range').addEventListener('input', e => { S.years = e.target.value; $('#years').value = S.years; userEdit(); changed(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { mode = b.dataset.mode; fill(); changed(true); }
  else if (b.dataset.freq) { S.freq = b.dataset.freq; userEdit(); fill(); changed(true); }
  else if (b.dataset.timing) { S.timing = b.dataset.timing; userEdit(); fill(); changed(true); }
});
$('#reset').addEventListener('click', () => { S = Object.assign({}, DEF); isExample = true; fill(); changed(true); });

let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200); }
$('#copy').addEventListener('click', () => {
  if (!last) return;
  const rows = yearRows(); let tc = 0, tg = 0;
  const lines = ['年\t年底累積\t當年投入\t當年收益'];
  rows.forEach(r => { tc += r.contrib; tg += r.gain; lines.push([r.y, Math.round(r.bal / 100), Math.round(r.contrib / 100), Math.round(r.gain / 100)].join('\t')); });
  lines.push(['合計', Math.round((rows.length ? rows[rows.length - 1].bal : last.p.principal) / 100), Math.round((tc + last.p.principal) / 100), Math.round(tg / 100)].join('\t'));
  const text = lines.join('\n');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#table')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取表格，請手動複製'); };
  try { navigator.clipboard.writeText(text).then(() => toast('已複製 ' + rows.length + ' 年資料（Tab 分隔）'), fallback); } catch (e) { fallback(); }
});

fill(); compute();
window.__savings = { simulate, solveMonthly, monthlyRate, get last() { return last; } };
})();
</script>
