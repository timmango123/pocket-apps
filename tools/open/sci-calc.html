  if (e.key === 'Escape') { if (!$('#drawer').hidden || !$('#menu').hidden) { openDrawer(false); openMenu(false); return; } press('AC'); e.preventDefault(); return; }
  if (!$('#drawer').hidden || !$('#menu').hidden) return;
  const map = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', '^': '^', '(': '(', ')': ')', '%': '%', '!': 'fact', '.': '.', ',': '.', 'p': 'π', 'e': 'e', 'Enter': '=', '=': '=', 'Backspace': 'BS', 'Delete': 'AC' };
  let act = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (!act) return;
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.closest('.k, .tb') && document.activeElement.matches(':focus-visible')) return; // 讓按鈕自己處理
  e.preventDefault(); press(act);
});

/* ================= 自我測試（30 組） ================= */
function selfTest() {
  const cases = [
    ['2+3×4', '14'], ['2^3^2', '512'], ['−2^2', '−4'], ['0.1+0.2', '0.3'], ['sin(30)', '0.5', 'deg'], ['sin(π÷6)', '0.5', 'rad'],
    ['(1+2)(3+4)', '21'], ['2π', '6.28318530717959'], ['3(4+5)', '27'], ['50+10%', '55'], ['10%', '0.1'], ['200−25%', '150'],
    ['50×10%', '5'], ['5!', '120'], ['0!', '1'], ['170!', '7.25741561530799E+306'], ['171!', 'E:overflow'], ['1÷0', 'E:div0'],
    ['√(−1)', 'E:domain'], ['log(0)', 'E:domain'], ['ln(e)', '1'], ['log(1000)', '3'], ['√(16)+∛(27)', '7'], ['sin(180)', '0', 'deg'],
    ['cos(90)', '0', 'deg'], ['tan(45)', '1', 'deg'], ['tan(90)', 'E:domain', 'deg'], ['(2+3', '5'], ['2×(3+(4−1', '12'], ['0.5!', '0.88622692545276'],
    ['10 mod 3', '1'], ['2^−1', '0.5'], ['−3²', '−9'], ['abs(−7)', '7'], ['4⁻¹', '0.25'], ['1.5E3+1', '1501'], ['2+', 'E:syntax'], ['sin⁻¹(1)', '90', 'deg']
  ];
  const fails = [];
  cases.forEach(([ex, want, ang]) => {
    let got;
    try { got = formatNum(evaluate(ex, { angle: ang || 'deg', ans: 0 })); } catch (e) { got = 'E:' + e.code; }
    if (got !== want) fails.push(ex + ' → ' + got + '（應為 ' + want + '）');
  });
  return { total: cases.length, fails };
}

renderKeys(); applyTheme(); render();
window.__sciCalc = { evaluate: (s, angle) => { try { return formatNum(evaluate(s, { angle: angle || 'deg', ans: st.ans })); } catch (e) { return 'E:' + e.code; } }, selfTest, state: st };
})();
