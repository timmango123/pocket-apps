<title>九九乘法練習</title>
<style>
:root{
  --bg:#edf2f8; --grid:#dbe5f1; --surface:#ffffff; --ink:#1b2a47; --muted:#56647d; --line:#c7d3e3; --line-strong:#8797b2;
  --accent:#2350a8; --accent-ink:#ffffff; --accent-soft:#dde7fa;
  --pencil:#f2b53a; --pencil-ink:#3a2a00;
  --ok:#1f8048; --ok-soft:#dcf2e4; --bad:#cc3328; --bad-soft:#fbe1de;
  --key:#ffffff; --key-shadow:#b7c5da; --key-ok:#2350a8; --key-ok-ink:#fff;
  --cell-empty:#e3e8ef; --heat-l:52%; --focus:#2350a8;
  --num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111827; --grid:#182236; --surface:#1a2337; --ink:#e4eaf6; --muted:#9aa8c2; --line:#2a3650; --line-strong:#4a5a7a;
  --accent:#8fb0ff; --accent-ink:#0b1630; --accent-soft:#22305a;
  --pencil:#f2c35a; --pencil-ink:#2b1f00;
  --ok:#6fdc9a; --ok-soft:#173726; --bad:#ff8579; --bad-soft:#3c1d1b;
  --key:#212c45; --key-shadow:#0a0f1c; --key-ok:#8fb0ff; --key-ok-ink:#0b1630;
  --cell-empty:#253049; --heat-l:42%; --focus:#8fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111827; --grid:#182236; --surface:#1a2337; --ink:#e4eaf6; --muted:#9aa8c2; --line:#2a3650; --line-strong:#4a5a7a;
  --accent:#8fb0ff; --accent-ink:#0b1630; --accent-soft:#22305a;
  --pencil:#f2c35a; --pencil-ink:#2b1f00;
  --ok:#6fdc9a; --ok-soft:#173726; --bad:#ff8579; --bad-soft:#3c1d1b;
  --key:#212c45; --key-shadow:#0a0f1c; --key-ok:#8fb0ff; --key-ok-ink:#0b1630;
  --cell-empty:#253049; --heat-l:42%; --focus:#8fb0ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:980px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px;padding-bottom:10px}
.top h1{margin:0 auto 0 0;font-size:18px;display:flex;align-items:center;gap:8px}
.top h1 i{font-style:normal;width:26px;height:26px;border-radius:6px;background:var(--pencil);color:var(--pencil-ink);display:grid;place-items:center;font-weight:900;font-size:16px;transform:rotate(-6deg)}
.icon-btn{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;display:inline-grid;place-items:center;padding:0 10px}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;min-width:56px;padding:0 14px;border:2px solid var(--line-strong);background:var(--surface);border-radius:12px;cursor:pointer;font-weight:800;font-size:20px;font-family:var(--num)}
.chip.sm{min-width:44px;min-height:44px;font-size:15px;padding:0 8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:block}
select,input[type=text],input[type=number]{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 10px}
input[type=number]{width:7em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{position:relative;display:block;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:64px}
.mode input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mode b{display:block;font-size:15px}
.mode small{color:var(--muted);font-size:12px}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.btn{min-height:46px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.start{width:100%;min-height:60px;font-size:20px;letter-spacing:.3em;border-radius:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.records{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.records div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.records b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:8px 0 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:700;font-size:13px}
.confirm span{flex:1;min-width:8em}
.setup-grid{display:grid;gap:0 12px}
@media (min-width:860px){.setup-grid{grid-template-columns:1fr 1fr}}
/* quiz */
#s-quiz{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 90px)}
.qbar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qbar .pill{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 14px;min-height:44px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.qbar .pill small{font-weight:600;color:var(--muted);font-size:12px}
.qbar .sp{flex:1}
.timebar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--pencil);width:100%}
.qbox{position:relative;flex:1;min-height:150px;background:var(--surface);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;touch-action:pan-y;transition:background .15s,border-color .15s;overflow:hidden}
.qbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.qbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.qbox.bad.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.question{font-family:var(--num);font-size:56px;font-weight:800;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.answer{font-family:var(--num);font-size:44px;font-weight:800;min-width:3.2em;min-height:64px;text-align:center;border-bottom:4px solid var(--pencil);margin-top:6px;font-variant-numeric:tabular-nums;color:var(--accent)}
.answer.empty::after{content:"?";color:var(--line-strong)}
.fix{font-size:16px;font-weight:700;color:var(--bad);min-height:24px;margin-top:6px}
.paused{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:3}
.paused b{font-size:22px}
.star{position:absolute;top:10px;right:12px;font-weight:900;color:var(--pencil-ink);background:var(--pencil);border-radius:20px;padding:4px 12px;font-size:14px;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg);opacity:0}20%{transform:scale(1.15) rotate(4deg);opacity:1}80%{opacity:1}100%{transform:scale(1) translateY(-10px);opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{-webkit-tap-highlight-color:transparent;min-height:64px;border:0;border-radius:14px;background:var(--key);box-shadow:0 3px 0 var(--key-shadow),inset 0 0 0 1px var(--line);font-family:var(--num);font-size:28px;font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.key:active,.key.down{transform:translateY(2px);box-shadow:0 1px 0 var(--key-shadow),inset 0 0 0 1px var(--line)}
.key.fn{font-size:17px;font-family:inherit;color:var(--muted)}
.key.ok{background:var(--key-ok);color:var(--key-ok-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--key-ok) 55%,#000)}
@media (orientation:landscape) and (max-height:520px){
  #s-quiz{display:grid;grid-template-columns:1fr minmax(260px,320px);grid-template-rows:auto auto 1fr;min-height:calc(100dvh - 80px);gap:8px 14px}
  .qbar{grid-column:1 / -1}.timebar{grid-column:1 / -1}
  .qbox{min-height:0}
  .pad{gap:6px;align-self:end}
  .key{min-height:48px;font-size:22px}
  .question{font-size:46px}.answer{font-size:34px;min-height:48px}
  .top{padding-bottom:4px}
}
/* result */
.big-score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.big-score .main{font-family:var(--num);font-size:56px;font-weight:900;line-height:1;color:var(--accent)}
.big-score .main small{font-size:20px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.metrics div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.metrics b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.metrics small{color:var(--muted);font-size:12px}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted)}
td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
td.x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
td.c{color:var(--ok);font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn:first-child{grid-column:1 / -1;min-height:54px}
/* stats */
.charts{display:grid;gap:12px}
@media (min-width:760px){.charts{grid-template-columns:1fr 1fr}}
svg.chart{width:100%;height:auto;display:block}
svg.chart .ax{stroke:var(--line);stroke-width:1}
svg.chart text{fill:var(--muted);font-size:10px}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
svg.chart .ma{fill:none;stroke:var(--pencil);stroke-width:2;stroke-dasharray:5 4}
svg.chart circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:4px}
.legend i.d{border-top:2.5px dashed var(--pencil)}
.heat{display:grid;grid-template-columns:22px repeat(9,1fr);gap:3px;font-variant-numeric:tabular-nums}
.heat .h{font-size:12px;color:var(--muted);display:grid;place-items:center;font-weight:700}
.heat button{aspect-ratio:1;min-height:30px;border:0;border-radius:5px;background:var(--cell-empty);font-size:11px;font-weight:700;color:#14202f;cursor:pointer;padding:0}
.heat button.none{color:var(--muted)}
.heat button[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .dw{color:var(--muted);font-weight:700}
.cal span{min-height:34px;display:grid;place-items:center;border-radius:8px;font-variant-numeric:tabular-nums}
.cal span.some{background:var(--accent-soft)}
.cal span.done{background:var(--ok);color:var(--surface);font-weight:800}
.cal span.today{outline:2px solid var(--pencil)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (hover:hover){.key:hover{filter:brightness(1.04)}.btn:not(:disabled):hover,.chip:hover,.icon-btn:hover{border-color:var(--accent)}}
@media (max-width:370px){.question{font-size:48px}.chip{min-width:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
<header class="top">
  <h1><i aria-hidden="true">×</i>九九乘法練習</h1>
  <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" aria-label="音效開關"></button>
  <button class="icon-btn" id="btn-theme" type="button" aria-label="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</header>

<!-- setup -->
<section id="s-setup">
  <div class="card">
    <div class="row">
      <label for="user" style="font-weight:700;font-size:13px;color:var(--muted);flex-basis:100%">練習者</label>
      <select id="user" class="grow" style="min-width:7em"></select>
      <button class="btn" id="btn-user-add" type="button">新增</button>
      <button class="btn" id="btn-user-rename" type="button">改名</button>
      <button class="btn danger" id="btn-user-del" type="button">刪除</button>
    </div>
    <div class="row" id="user-form" hidden style="margin-top:8px"><input type="text" id="user-name" class="grow" maxlength="10" placeholder="名字（1–10 字）" autocomplete="off"><button class="btn primary" id="btn-user-save" type="button">儲存</button><button class="btn" id="btn-user-cancel" type="button">取消</button></div>
    <div class="confirm" id="user-del-confirm" hidden><span id="user-del-text">確定刪除？紀錄會一併刪除。</span><button class="btn danger" id="btn-user-del-yes" type="button">刪除</button><button class="btn" id="btn-user-del-no" type="button">取消</button></div>
  </div>
  <div class="setup-grid">
    <div class="card">
      <h2>運算（可多選）</h2>
      <div class="chips" role="group" aria-label="運算">
        <button class="chip" type="button" id="op-add" data-op="add" aria-pressed="false" aria-label="加法">＋</button>
        <button class="chip" type="button" id="op-sub" data-op="sub" aria-pressed="false" aria-label="減法">－</button>
        <button class="chip" type="button" id="op-mul" data-op="mul" aria-pressed="true" aria-label="乘法">×</button>
        <button class="chip" type="button" id="op-div" data-op="div" aria-pressed="false" aria-label="除法">÷</button>
      </div>
      <div id="add-cfg" hidden>
        <label class="lbl" for="add-range">加減範圍</label>
        <div class="row"><select id="add-range"><option value="10">10 以內</option><option value="20">20 以內</option><option value="100">100 以內</option><option value="custom">自訂最大值</option></select>
        <input type="number" id="add-max" min="1" max="9999" value="50" inputmode="numeric" aria-label="自訂最大值" hidden></div>
      </div>
      <div id="mul-cfg">
        <label class="lbl" id="mul-lbl">乘除範圍</label>
        <div class="chips" role="group" aria-labelledby="mul-lbl"><button class="chip sm" type="button" id="mul-99" aria-pressed="true" style="padding:0 12px">九九（2–9）</button><button class="chip sm" type="button" id="mul-tables" aria-pressed="false" style="padding:0 12px">指定段</button></div>
        <div class="chips" id="tables" role="group" aria-label="指定段" style="margin-top:8px" hidden></div>
      </div>
      <p class="err" id="setup-err" hidden></p>
    </div>
    <div class="card">
      <h2>模式</h2>
      <div class="modes" role="radiogroup" aria-label="模式">
        <label class="mode"><input type="radio" name="mode" id="mode-timed" value="timed"><b>限時 60 秒</b><small>答越多越好</small></label>
        <label class="mode"><input type="radio" name="mode" id="mode-fixed" value="fixed" checked><b>固定 20 題</b><small>看花多少時間</small></label>
        <label class="mode"><input type="radio" name="mode" id="mode-endless" value="endless"><b>無限練習</b><small>隨時結束</small></label>
        <label class="mode"><input type="radio" name="mode" id="mode-weak" value="weak"><b>弱點加強</b><small>多練常錯的題</small></label>
      </div>
      <div class="records"><div>上次成績<b id="rec-last">—</b></div><div>最佳紀錄<b id="rec-best">—</b></div></div>
    </div>
  </div>
  <button class="btn primary start" id="btn-start" type="button">開始</button>
  <div class="row" style="margin-top:12px"><button class="btn grow" id="btn-stats" type="button">進步曲線與統計</button></div>
</section>

<!-- quiz -->
<section id="s-quiz" hidden>
  <div class="qbar">
    <span class="pill" id="q-left"><small id="q-left-lbl">題</small><span id="q-left-val">1/20</span></span>
    <span class="pill" title="連對"><small>連對</small><span id="q-streak">0</span></span>
    <span class="sp"></span>
    <button class="icon-btn" id="btn-pause" type="button" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="btn" id="btn-end" type="button">結束</button>
  </div>
  <div class="timebar" id="timebar" hidden><i id="timebar-fill"></i></div>
  <div class="qbox" id="qbox" aria-live="polite">
    <div class="question" id="question">7 × 8 =</div>
    <div class="answer empty" id="answer" aria-label="你的答案"></div>
    <div class="fix" id="fix"></div>
    <div class="paused" id="paused" hidden><b>已暫停</b><span class="hint">題目先藏起來，休息一下</span><button class="btn primary" id="btn-resume" type="button">繼續</button></div>
  </div>
  <div class="pad" id="pad" aria-label="數字鍵盤">
    <button class="key" type="button" data-k="1">1</button><button class="key" type="button" data-k="2">2</button><button class="key" type="button" data-k="3">3</button>
    <button class="key" type="button" data-k="4">4</button><button class="key" type="button" data-k="5">5</button><button class="key" type="button" data-k="6">6</button>
    <button class="key" type="button" data-k="7">7</button><button class="key" type="button" data-k="8">8</button><button class="key" type="button" data-k="9">9</button>
    <button class="key fn" type="button" data-k="C" id="key-clear" aria-label="清除（長按全清）">清除</button><button class="key" type="button" data-k="0">0</button><button class="key ok" type="button" data-k="OK" id="key-ok" aria-label="確認">確認</button>
  </div>
  <p class="hint" style="text-align:center;margin:0">往左滑可跳過（算答錯）・實體鍵盤可用數字與 Enter</p>
</section>

<!-- result -->
<section id="s-result" hidden>
  <div class="card">
    <h2 id="res-title">成績</h2>
    <div class="big-score"><div class="main" id="res-main">18<small>/20</small></div><div id="res-cmp" class="hint" style="margin:0 0 6px"></div></div>
    <div class="metrics"><div><b id="res-acc">90%</b><small>正確率</small></div><div><b id="res-avg">2.1</b><small>平均秒數</small></div><div><b id="res-n">20</b><small>作答題數</small></div></div>

  </div>

    <h2>錯題</h2>

  </div>

    <button class="btn" id="btn-home" type="button" style="grid-column:1 / -1">回設定</button>
  </div>
</section>

<!-- stats -->
<section id="s-stats" hidden>
  <div class="row" style="margin-bottom:10px"><button class="btn" id="btn-back" type="button">← 回設定</button><span class="hint grow" id="stats-user" style="margin:0"></span></div>
  <p class="hint" id="stats-empty" hidden style="margin-bottom:12px">還沒有紀錄。完成一次練習後，這裡會畫出正確率與速度的進步曲線。</p>
  <div class="charts">
    <div class="card"><h2>正確率（近 30 次）</h2><svg class="chart" id="chart-acc" viewBox="0 0 320 150" role="img" aria-label="正確率折線圖"></svg><div class="legend"><span><i></i>每次</span><span><i class="d"></i>5 次移動平均</span></div></div>
    <div class="card"><h2>平均每題秒數</h2><svg class="chart" id="chart-ms" viewBox="0 0 320 150" role="img" aria-label="平均秒數折線圖"></svg><div class="legend"><span><i></i>每次</span><span><i class="d"></i>5 次移動平均</span></div></div>
  </div>
  <div class="charts">
    <div class="card"><h2>乘法熱力格（顏色＝正確率）</h2><div class="heat" id="heat"></div><p class="hint" id="heat-info">點格子看練習次數與平均秒數。灰色是還沒練過。</p></div>
    <div class="card"><h2 id="cal-title">每日目標</h2><div class="cal" id="cal"></div>
      <div class="row" style="margin-top:10px"><label for="goal" class="hint" style="margin:0">每日目標題數</label><input type="number" id="goal" min="5" max="999" value="50" inputmode="numeric"><span class="hint" id="today-count" style="margin:0"></span></div></div>
  </div>
</section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = k => 'math-drill:v1:' + k;
const store = {
  get(k, d) { let raw = null; try { raw = localStorage.getItem(KEY(k)); } catch { return d; } if (raw == null) return d; try { return JSON.parse(raw); } catch { try { localStorage.setItem(KEY('corrupt'), raw); } catch {} return d; } },
  set(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(KEY(k)); } catch {} }
};
function randInt(n) { if (n <= 1) return 0; const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const SYM = { add: '+', sub: '−', mul: '×', div: '÷' };

/* ---------- theme & sound ---------- */
const THEMES = ['auto', 'light', 'dark'], TL = { auto: '自動', light: '淺色', dark: '深色' };
let theme = store.get('theme', 'auto'); if (!THEMES.includes(theme)) theme = 'auto';
function applyTheme() { if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; $('btn-theme').title = '主題：' + TL[theme]; $('btn-theme').setAttribute('aria-label', '切換主題（' + TL[theme] + '）'); }
applyTheme();
$('btn-theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); store.set('theme', theme); toast('主題：' + TL[theme]); });
let actx = null;
function audio() { if (!cfg.sound) return null; try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch { actx = null; } return actx; }
function tone(f, dur, type) { const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02); }
const sndOk = () => tone(880, .08, 'sine'), sndBad = () => tone(220, .15, 'square');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';

/* ---------- users ---------- */
let users = store.get('users', null);
if (!Array.isArray(users) || !users.length) { users = [{ id: 'u1', name: '小朋友' }]; store.set('users', users); }
let uid = store.get('current', users[0].id); if (!users.some(u => u.id === uid)) uid = users[0].id;
const DEFAULT_CFG = { ops: ['mul'], addRange: '10', addMax: 50, mulMode: '99', tables: [2, 3, 4, 5, 6, 7, 8, 9], mode: 'fixed', sound: true, goal: 50 };
let cfg;
const uk = k => k + ':' + uid;
function loadUser() { cfg = Object.assign({}, DEFAULT_CFG, store.get(uk('settings'), {})); if (!Array.isArray(cfg.ops)) cfg.ops = ['mul']; if (!Array.isArray(cfg.tables)) cfg.tables = DEFAULT_CFG.tables.slice(); }
const saveCfg = () => store.set(uk('settings'), cfg);
function renderUsers() {
  const sel = $('user'); sel.textContent = '';
  for (const u of users) { const o = document.createElement('option'); o.value = u.id; o.textContent = u.name; sel.append(o); }
  sel.value = uid; $('btn-user-add').disabled = users.length >= 5; $('btn-user-del').disabled = users.length <= 1;
}
let userFormMode = null;
$('user').addEventListener('change', () => { uid = $('user').value; store.set('current', uid); loadUser(); syncSetup(); });
$('btn-user-add').addEventListener('click', () => { userFormMode = 'add'; $('user-form').hidden = false; $('user-name').value = ''; $('user-name').focus(); $('user-del-confirm').hidden = true; });
$('btn-user-rename').addEventListener('click', () => { userFormMode = 'rename'; $('user-form').hidden = false; $('user-name').value = users.find(u => u.id === uid).name; $('user-name').focus(); $('user-del-confirm').hidden = true; });
$('btn-user-cancel').addEventListener('click', () => { $('user-form').hidden = true; });
function saveUserForm() {
  const name = $('user-name').value.trim();
  if (!name || [...name].length > 10) { toast('名字需 1–10 個字'); return; }
  if (userFormMode === 'add') { if (users.length >= 5) return; const id = 'u' + Date.now().toString(36); users.push({ id, name }); uid = id; store.set('current', uid); loadUser(); }
  else users.find(u => u.id === uid).name = name;
  store.set('users', users); $('user-form').hidden = true; renderUsers(); syncSetup();
}
$('btn-user-save').addEventListener('click', saveUserForm);
$('user-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveUserForm(); });
$('btn-user-del').addEventListener('click', () => { $('user-del-text').textContent = `確定刪除「${users.find(u => u.id === uid).name}」？紀錄會一併刪除。`; $('user-del-confirm').hidden = false; $('user-form').hidden = true; });
$('btn-user-del-no').addEventListener('click', () => { $('user-del-confirm').hidden = true; });
$('btn-user-del-yes').addEventListener('click', () => {
  if (users.length <= 1) return;
  for (const k of ['settings', 'sessions', 'facts', 'best', 'daily']) store.del(uk(k));
  users = users.filter(u => u.id !== uid); uid = users[0].id; store.set('users', users); store.set('current', uid);
  $('user-del-confirm').hidden = true; loadUser(); renderUsers(); syncSetup(); toast('已刪除');
});

/* ---------- setup ---------- */
const tablesEl = $('tables');
for (let t = 1; t <= 12; t++) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip sm'; b.id = 'tbl-' + t; b.dataset.t = t; b.textContent = t; b.setAttribute('aria-label', t + ' 的段'); tablesEl.append(b); }
function comboKey(mode, ops) { return mode + '|' + ops.slice().sort().join(','); }
function syncSetup() {
  document.querySelectorAll('[data-op]').forEach(b => b.setAttribute('aria-pressed', cfg.ops.includes(b.dataset.op)));
  const hasAdd = cfg.ops.includes('add') || cfg.ops.includes('sub'), hasMul = cfg.ops.includes('mul') || cfg.ops.includes('div');
  $('add-cfg').hidden = !hasAdd; $('mul-cfg').hidden = !hasMul;
  $('add-range').value = cfg.addRange; $('add-max').hidden = cfg.addRange !== 'custom'; $('add-max').value = cfg.addMax;
  $('mul-99').setAttribute('aria-pressed', cfg.mulMode === '99'); $('mul-tables').setAttribute('aria-pressed', cfg.mulMode === 'tables');
  tablesEl.hidden = cfg.mulMode !== 'tables';
  tablesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', cfg.tables.includes(+b.dataset.t)));
  const r = document.querySelector(`input[name=mode][value="${cfg.mode}"]`); if (r) r.checked = true;
  $('goal').value = cfg.goal;
  $('btn-sound').innerHTML = cfg.sound ? ICON_ON : ICON_OFF; $('btn-sound').setAttribute('aria-pressed', cfg.sound);
  let err = '';
  if (!cfg.ops.length) err = '請至少選一種運算';
  else if (hasMul && cfg.mulMode === 'tables' && !cfg.tables.length) err = '請至少選一個段';
  else if (hasAdd && cfg.addRange === 'custom' && !(cfg.addMax >= 1 && cfg.addMax <= 9999)) err = '自訂最大值需在 1–9999';
  $('setup-err').textContent = err; $('setup-err').hidden = !err; $('btn-start').disabled = !!err;
  // records
  const ses = store.get(uk('sessions'), []), ck = comboKey(cfg.mode, cfg.ops);
  const last = [...ses].reverse().find(s => comboKey(s.mode, s.ops) === ck);
  $('rec-last').textContent = last ? fmtScore(last) : '—';
  const best = store.get(uk('best'), {})[ck];
  $('rec-best').textContent = best ? fmtScore(best) : '—';
}
function fmtScore(s) { return s.mode === 'timed' ? `${s.score} 題・${Math.round(s.accuracy * 100)}%` : `${Math.round(s.accuracy * 100)}%・${(s.avgMs / 1000).toFixed(1)} 秒/題`; }
document.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => { const op = b.dataset.op; cfg.ops = cfg.ops.includes(op) ? cfg.ops.filter(x => x !== op) : [...cfg.ops, op]; saveCfg(); syncSetup(); }));
$('add-range').addEventListener('change', () => { cfg.addRange = $('add-range').value; saveCfg(); syncSetup(); });
$('add-max').addEventListener('input', () => { cfg.addMax = parseInt($('add-max').value, 10) || 0; saveCfg(); syncSetup(); });
$('mul-99').addEventListener('click', () => { cfg.mulMode = '99'; saveCfg(); syncSetup(); });
$('mul-tables').addEventListener('click', () => { cfg.mulMode = 'tables'; saveCfg(); syncSetup(); });
tablesEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const t = +b.dataset.t; cfg.tables = cfg.tables.includes(t) ? cfg.tables.filter(x => x !== t) : [...cfg.tables, t].sort((a, b) => a - b); saveCfg(); syncSetup(); });
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { cfg.mode = r.value; saveCfg(); syncSetup(); }));
$('btn-sound').addEventListener('click', () => { cfg.sound = !cfg.sound; saveCfg(); syncSetup(); if (cfg.sound) sndOk(); });
$('goal').addEventListener('change', () => { const g = parseInt($('goal').value, 10); if (g >= 5 && g <= 999) { cfg.goal = g; saveCfg(); renderCalendar(); } else $('goal').value = cfg.goal; });

/* ---------- question generation ---------- */
function addMaxOf(c) { return c.addRange === 'custom' ? Math.max(1, Math.min(9999, c.addMax | 0)) : +c.addRange; }
function tablesOf(c) { return c.mulMode === '99' ? [2, 3, 4, 5, 6, 7, 8, 9] : c.tables; }
function makeQ(op, a, b) {
  if (op === 'add') return { op, a, b, ans: a + b, key: `${a}+${b}` };
  if (op === 'sub') return { op, a, b, ans: a - b, key: `${a}-${b}` };
  if (op === 'mul') return { op, a, b, ans: a * b, key: `${Math.min(a, b)}x${Math.max(a, b)}` };
  return { op, a, b, ans: a / b, key: `${a}/${b}` };
}
function genOne(c) {
  const op = c.ops[randInt(c.ops.length)];
  if (op === 'add') { const M = addMaxOf(c), a = randInt(M + 1), b = randInt(M - a + 1); return makeQ('add', a, b); }
  if (op === 'sub') { const M = addMaxOf(c), a = randInt(M + 1), b = randInt(a + 1); return makeQ('sub', a, b); }
  const tbs = tablesOf(c), t = tbs[randInt(tbs.length)], bMax = t > 9 ? 12 : 9, m = 1 + randInt(bMax);
  if (op === 'mul') return randInt(2) ? makeQ('mul', t, m) : makeQ('mul', m, t);
  const divisor = randInt(2) ? t : m; return makeQ('div', t * m, divisor);
}
function parseKey(k) {
  let m;
  if ((m = k.match(/^(\d+)\+(\d+)$/))) return makeQ('add', +m[1], +m[2]);
  if ((m = k.match(/^(\d+)-(\d+)$/))) return makeQ('sub', +m[1], +m[2]);
  if ((m = k.match(/^(\d+)x(\d+)$/))) return randInt(2) ? makeQ('mul', +m[1], +m[2]) : makeQ('mul', +m[2], +m[1]);
  if ((m = k.match(/^(\d+)\/(\d+)$/)) && +m[2] !== 0 && +m[1] % +m[2] === 0) return makeQ('div', +m[1], +m[2]);
  return null;
}
const opOfKey = k => k.includes('+') ? 'add' : k.includes('-') ? 'sub' : k.includes('x') ? 'mul' : 'div';
function weakWeights(facts, ops, now = Date.now()) {
  const out = [];
  for (const [k, f] of Object.entries(facts)) {
    if (!ops.includes(opOfKey(k)) || !f.n) continue;
    let w = 1 + 3 * (f.wrong / f.n) + Math.min(f.totalMs / f.n / 1000 / 3, 2);
    if (now - (f.last || 0) > 7 * 864e5) w += .5;
    out.push([k, w]);
  }
  return out;
}
function weightedPick(list) { const tot = list.reduce((s, x) => s + x[1], 0); let r = randInt(1e6) / 1e6 * tot; for (const [k, w] of list) { if ((r -= w) < 0) return k; } return list[list.length - 1][0]; }

/* ---------- quiz engine ---------- */
let Q = null;  // running quiz
function startQuiz(opts = {}) {
  audio();
  const mode = opts.mode || cfg.mode;
  let source = 'normal', weights = null, queue = null;
  if (opts.queue) { source = 'queue'; queue = opts.queue.slice(); }
  else if (mode === 'weak') {
    const facts = store.get(uk('facts'), {}), w = weakWeights(facts, cfg.ops);
    const records = w.reduce((s, [k]) => s + facts[k].n, 0);
    if (records < 10) toast(`弱點加強需要至少 10 筆紀錄（目前 ${records} 筆），先用一般出題`);
    else { source = 'weak'; weights = w; }
  }
  const total = queue ? queue.length : mode === 'fixed' || mode === 'weak' ? 20 : mode === 'timed' ? Infinity : Infinity;
  Q = { mode: opts.queue ? 'wrong' : mode, ops: cfg.ops.slice(), source, weights, queue, total, items: [], used: new Set(), lastKey: '', streak: 0, bestStreak: 0,
    elapsed: 0, runStart: performance.now(), paused: false, qElapsed: 0, qStart: 0, cur: null, input: '', locked: false, limit: mode === 'timed' && !opts.queue ? 60000 : 0, done: false };
  show('s-quiz');
  $('btn-end').textContent = Q.mode === 'timed' ? '放棄' : '結束';
  $('timebar').hidden = !Q.limit;
  nextQ(); tick();
}
function now() { return Q.paused ? Q.elapsed : Q.elapsed + (performance.now() - Q.runStart); }
function pickNext() {
  if (Q.source === 'queue') return Q.queue.length ? parseKey(Q.queue.shift()) : null;
  for (let tries = 0; tries < 60; tries++) {
    const q = Q.source === 'weak' ? parseKey(weightedPick(Q.weights)) : genOne({ ...cfg, ops: Q.ops });
    if (!q) continue;
    if (q.key === Q.lastKey && tries < 59) continue;
    if (Q.total !== Infinity && Q.used.has(q.key) && tries < 50) continue;
    return q;
  }
  return genOne({ ...cfg, ops: Q.ops });
}
function nextQ() {
  if (Q.items.length >= Q.total) return finish();
  const q = pickNext(); if (!q) return finish();
  Q.cur = q; Q.lastKey = q.key; Q.used.add(q.key); Q.input = ''; Q.qStart = now(); Q.locked = false;
  $('question').textContent = `${q.a} ${SYM[q.op]} ${q.b} =`;
  $('fix').textContent = ''; $('qbox').className = 'qbox';
  renderInput(); renderBar();
}
function renderInput() { const a = $('answer'); a.textContent = Q.input; a.classList.toggle('empty', !Q.input); }
function renderBar() {
  if (Q.limit) { $('q-left-lbl').textContent = '剩餘'; const left = Math.max(0, Q.limit - now()); $('q-left-val').textContent = `0:${String(Math.ceil(left / 1000)).padStart(2, '0')}`.replace('0:60', '1:00'); $('timebar-fill').style.width = (left / Q.limit * 100) + '%'; }
  else if (Q.total !== Infinity) { $('q-left-lbl').textContent = '題'; $('q-left-val').textContent = `${Math.min(Q.items.length + 1, Q.total)}/${Q.total}`; }
  else { $('q-left-lbl').textContent = '已答'; $('q-left-val').textContent = Q.items.length; }
  $('q-streak').textContent = Q.streak;
}
let raf = 0;
function tick() { cancelAnimationFrame(raf); if (!Q || Q.done) return; if (!Q.paused) { renderBar(); if (Q.limit && now() >= Q.limit) return finish(); } raf = requestAnimationFrame(tick); }
function press(k) {
  if (!Q || Q.done || Q.paused || Q.locked) return;
  if (k === 'C') { Q.input = Q.input.slice(0, -1); renderInput(); return; }
  if (k === 'CA') { Q.input = ''; renderInput(); return; }
  if (k === 'OK') { if (Q.input === '') return; submit(+Q.input); return; }
  if (/^\d$/.test(k) && Q.input.length < 4) { Q.input = (Q.input === '0' ? '' : Q.input) + k; renderInput(); }
}
function submit(val, skipped = false) {
  const q = Q.cur, ms = Math.min(30000, now() - Q.qStart), correct = !skipped && val === q.ans;
  Q.items.push({ q: q.key, text: `${q.a} ${SYM[q.op]} ${q.b}`, answer: skipped ? null : val, correct, ms, ans: q.ans });
  recordFact(q.key, correct, ms);
  const box = $('qbox');
  if (correct) {
    Q.streak++; Q.bestStreak = Math.max(Q.bestStreak, Q.streak); sndOk(); box.className = 'qbox ok';
    if ([5, 10, 20].includes(Q.streak) || (Q.streak > 20 && Q.streak % 10 === 0)) celebrate(Q.streak);
    Q.locked = true; setTimeout(() => Q && !Q.done && nextQ(), RM() ? 120 : 260);
  } else {
    Q.streak = 0; sndBad(); box.className = 'qbox bad shake';
    if (Q.mode === 'timed') { Q.locked = true; setTimeout(() => Q && !Q.done && nextQ(), 200); }
    else { $('fix').textContent = `${skipped ? '跳過' : '答錯'}：正確答案是 ${q.ans}`; Q.locked = true; setTimeout(() => Q && !Q.done && nextQ(), 1000); }
  }
  renderBar();
}
function celebrate(n) { const s = document.createElement('div'); s.className = 'star'; s.textContent = `★ 連對 ${n} 題！`; $('qbox').append(s); setTimeout(() => s.remove(), 1000); }
function recordFact(key, correct, ms) {
  const facts = store.get(uk('facts'), {}), f = facts[key] || { n: 0, wrong: 0, totalMs: 0, last: 0 };
  f.n++; if (!correct) f.wrong++; f.totalMs += ms; f.last = Date.now(); facts[key] = f; store.set(uk('facts'), facts);
  const daily = store.get(uk('daily'), {}), d = dayKey(); daily[d] = (daily[d] || 0) + 1; store.set(uk('daily'), daily);
}
function setPaused(p) {
  if (!Q || Q.done || Q.paused === p) return;
  if (p) { Q.elapsed += performance.now() - Q.runStart; Q.paused = true; }
  else { Q.runStart = performance.now(); Q.paused = false; tick(); }
  $('paused').hidden = !p;
}
$('btn-pause').addEventListener('click', () => setPaused(!Q.paused));
$('btn-resume').addEventListener('click', () => setPaused(false));
document.addEventListener('visibilitychange', () => { if (document.hidden && Q && !Q.done && !$('s-quiz').hidden) setPaused(true); });
$('btn-end').addEventListener('click', () => { if (!Q) return; if (Q.mode === 'timed') { Q.done = true; Q = null; show('s-setup'); syncSetup(); } else finish(); });

// keypad: pointerdown for speed; click as keyboard/AT fallback
let clearHold = 0, lastPd = 0;
$('pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('.key'); if (!b) return;
  e.preventDefault(); lastPd = performance.now(); b.classList.add('down');
  if (b.dataset.k === 'C') { clearHold = setTimeout(() => { press('CA'); clearHold = -1; }, 550); return; }
  press(b.dataset.k);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('pad').addEventListener(ev, e => {
  document.querySelectorAll('.key.down').forEach(k => k.classList.remove('down'));
  if (ev === 'pointerup') { const b = e.target.closest('.key'); if (b && b.dataset.k === 'C' && clearHold > 0) { clearTimeout(clearHold); press('C'); } }
  if (clearHold > 0 && ev !== 'pointerup') clearTimeout(clearHold); clearHold = 0;
}));
$('pad').addEventListener('click', e => { const b = e.target.closest('.key'); if (!b || performance.now() - lastPd < 600) return; press(b.dataset.k); });
document.addEventListener('keydown', e => {
  if ($('s-quiz').hidden || e.target.closest('input, select')) return;
  if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('C'); e.preventDefault(); }
  else if (e.key === 'Delete' || e.key === 'Escape') press('CA');
  else if (e.key === 'Enter') { if (!e.target.closest('button')) { press('OK'); e.preventDefault(); } }
});
// swipe left on question = skip
{ let x0 = 0, y0 = 0; const qb = $('qbox');
  qb.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  qb.addEventListener('pointerup', e => { const dx = e.clientX - x0, dy = e.clientY - y0; if (dx < -70 && Math.abs(dx) > Math.abs(dy) * 1.5 && Q && !Q.done && !Q.paused && !Q.locked) submit(null, true); }); }

/* ---------- finish / result ---------- */
let lastWrong = [];
function finish() {
  if (!Q || Q.done) return;
  Q.done = true; cancelAnimationFrame(raf);
  const n = Q.items.length, correct = Q.items.filter(i => i.correct).length;
  const acc = n ? correct / n : 0, avgMs = n ? Q.items.reduce((s, i) => s + i.ms, 0) / n : 0;
  const score = Q.mode === 'timed' ? correct : correct;
  const sum = { ts: Date.now(), mode: Q.mode, ops: Q.ops, score, accuracy: acc, avgMs: Math.round(avgMs), n, correct };
  const ses = store.get(uk('sessions'), []), ck = comboKey(sum.mode, sum.ops);
  const prev = [...ses].reverse().find(s => comboKey(s.mode, s.ops) === ck);
  let newBest = false;
  if (n) {
    ses.push(sum); store.set(uk('sessions'), ses.slice(-200));
    const best = store.get(uk('best'), {}), b = best[ck];
    const better = !b || (sum.mode === 'timed' ? sum.score > b.score || (sum.score === b.score && sum.accuracy > b.accuracy) : sum.accuracy > b.accuracy || (sum.accuracy === b.accuracy && sum.avgMs < b.avgMs));
    if (better && (sum.mode !== 'endless' || n >= 10)) { best[ck] = sum; store.set(uk('best'), best); newBest = !!b; }
  }
  // render
  $('res-title').textContent = { timed: '限時 60 秒', fixed: '固定 20 題', endless: '無限練習', weak: '弱點加強', wrong: '錯題練習' }[sum.mode] + '・' + sum.ops.map(o => SYM[o]).join(' ');
  $('res-main').innerHTML = sum.mode === 'timed' ? `${correct}<small> 題答對</small>` : `${correct}<small>/${n}</small>`;
  $('res-acc').textContent = Math.round(acc * 100) + '%'; $('res-avg').textContent = (avgMs / 1000).toFixed(1); $('res-n').textContent = n;
  const cmp = $('res-cmp');
  if (prev && n) {
    const dA = Math.round(acc * 100) - Math.round(prev.accuracy * 100), dT = (avgMs - prev.avgMs) / 1000;
    cmp.innerHTML = `與上次比：正確率 <span class="${dA >= 0 ? 'up' : 'down'}">${dA >= 0 ? '↑' : '↓'}${Math.abs(dA)}%</span>，速度 <span class="${dT <= 0 ? 'up' : 'down'}">${dT <= 0 ? '↑ 快' : '↓ 慢'} ${Math.abs(dT).toFixed(1)} 秒</span>`;
  } else cmp.textContent = n ? '第一次用這個組合練習' : '這次沒有作答';
  $('res-best').textContent = newBest ? '★ 新的最佳紀錄！' : (Q.bestStreak >= 5 ? `最長連對 ${Q.bestStreak} 題` : '');
  lastWrong = Q.items.filter(i => !i.correct);
  const tb = $('wrong-body'); tb.innerHTML = lastWrong.map(i => `<tr><td class="n">${esc(i.text)}</td><td class="n x">${i.answer == null ? '跳過' : i.answer}</td><td class="n c">${i.ans}</td></tr>`).join('');
  $('wrong-card').hidden = !lastWrong.length;
  $('btn-wrong').disabled = !lastWrong.length;
  show('s-result');
}
$('btn-again').addEventListener('click', () => { const m = Q && Q.mode; if (m === 'wrong') startQuiz({ queue: Q.items.map(i => i.q) }); else startQuiz(); });
$('btn-wrong').addEventListener('click', () => { if (!lastWrong.length) return; const keys = [...new Set(lastWrong.map(i => i.q))]; for (let i = keys.length - 1; i > 0; i--) { const j = randInt(i + 1); [keys[i], keys[j]] = [keys[j], keys[i]]; } startQuiz({ queue: keys }); });
$('btn-to-stats').addEventListener('click', openStats);
$('btn-home').addEventListener('click', () => { show('s-setup'); syncSetup(); });
$('btn-start').addEventListener('click', () => { if (!$('btn-start').disabled) startQuiz(); });
$('btn-stats').addEventListener('click', openStats);
$('btn-back').addEventListener('click', () => { show('s-setup'); syncSetup(); });

/* ---------- stats ---------- */
function movingAvg(v, k = 5) { return v.map((_, i) => { const s = v.slice(Math.max(0, i - k + 1), i + 1); return s.reduce((a, b) => a + b, 0) / s.length; }); }
function lineChart(svg, vals, min, max, fmt) {
  const W = 320, H = 150, L = 34, R = 8, T = 10, B = 22, n = vals.length;
  const x = i => L + (n <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), y = v => T + (1 - (v - min) / (max - min || 1)) * (H - T - B);
  let s = '';
  for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4, yy = y(v); s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text x="${L - 4}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
  if (n) {
    s += `<text x="${L}" y="${H - 6}">第 1 次</text><text x="${W - R}" y="${H - 6}" text-anchor="end">最近</text>`;
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    s += `<polyline class="ln" points="${pts}"/>`;
    if (n >= 3) s += `<polyline class="ma" points="${movingAvg(vals).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`;
    vals.forEach((v, i) => { s += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8"><title>${fmt(v)}</title></circle>`; });
  } else s += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">尚無資料</text>`;
  svg.innerHTML = s;
}
function openStats() {
  show('s-stats');
  const user = users.find(u => u.id === uid);
  $('stats-user').textContent = `${user.name} 的紀錄`;
  const ses = store.get(uk('sessions'), []).slice(-30);
  $('stats-empty').hidden = ses.length > 0;
  lineChart($('chart-acc'), ses.map(s => s.accuracy * 100), 0, 100, v => Math.round(v) + '%');
  const secs = ses.map(s => s.avgMs / 1000), mx = Math.max(5, Math.ceil(Math.max(0, ...secs)));
  lineChart($('chart-ms'), secs, 0, mx, v => v.toFixed(v < 10 && mx < 10 ? 1 : 0) + 's');
  renderHeat(); renderCalendar();
}
function renderHeat() {
  const facts = store.get(uk('facts'), {}), h = $('heat'); h.innerHTML = '<span class="h">×</span>';
  for (let c = 1; c <= 9; c++) h.insertAdjacentHTML('beforeend', `<span class="h">${c}</span>`);
  for (let r = 1; r <= 9; r++) {
    h.insertAdjacentHTML('beforeend', `<span class="h">${r}</span>`);
    for (let c = 1; c <= 9; c++) {
      const key = `${Math.min(r, c)}x${Math.max(r, c)}`, f = facts[key], b = document.createElement('button');
      b.type = 'button'; b.id = `cell-${r}-${c}`; b.textContent = r * c; b.setAttribute('aria-pressed', 'false');
      if (f && f.n) { const acc = 1 - f.wrong / f.n; b.style.background = `hsl(${Math.round(acc * 120)}, 70%, var(--heat-l))`; b.dataset.acc = acc.toFixed(2); b.setAttribute('aria-label', `${r} × ${c}：正確率 ${Math.round(acc * 100)}%`); }
      else { b.className = 'none'; b.setAttribute('aria-label', `${r} × ${c}：尚未練習`); }
      b.addEventListener('click', () => {
        h.querySelectorAll('button[aria-pressed="true"]').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');
        $('heat-info').textContent = f && f.n ? `${r} × ${c} = ${r * c}：練習 ${f.n} 次，答錯 ${f.wrong} 次（正確率 ${Math.round((1 - f.wrong / f.n) * 100)}%），平均 ${(f.totalMs / f.n / 1000).toFixed(1)} 秒` : `${r} × ${c} = ${r * c}：還沒練過`;
      });
      h.append(b);
    }
  }
}
function renderCalendar() {
  const daily = store.get(uk('daily'), {}), d = new Date(), y = d.getFullYear(), m = d.getMonth();
  $('cal-title').textContent = `每日目標・${y} 年 ${m + 1} 月`;
  const cal = $('cal'); cal.innerHTML = ['日', '一', '二', '三', '四', '五', '六'].map(w => `<span class="dw">${w}</span>`).join('');
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) cal.insertAdjacentHTML('beforeend', '<span></span>');
  for (let day = 1; day <= days; day++) {
    const k = dayKey(new Date(y, m, day)), c = daily[k] || 0;
    const cls = [c >= cfg.goal ? 'done' : c ? 'some' : '', day === d.getDate() ? 'today' : ''].join(' ').trim();
    cal.insertAdjacentHTML('beforeend', `<span class="${cls}" title="${c} 題">${c >= cfg.goal ? '✓' : day}</span>`);
  }
  const today = daily[dayKey()] || 0;
  $('today-count').textContent = `今天 ${today} / ${cfg.goal} 題` + (today >= cfg.goal ? '，達成！' : '');
}

/* ---------- screens / boot ---------- */
function show(id) { for (const s of ['s-setup', 's-quiz', 's-result', 's-stats']) $(s).hidden = s !== id; window.scrollTo(0, 0); }
loadUser(); renderUsers(); syncSetup();
</script>
