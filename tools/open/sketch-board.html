<title>白板畫布</title>
<style>
/* Drafting table: dotted paper, graphite floating rails, signal-yellow active tool, blue selection */
:root{
  --bg:#ecedea; --board:#f9f9f7; --dot:#c3c6cb; --surface:#ffffff; --sunk:#f2f3f1; --ink:#1b1d21; --muted:#5d6269; --faint:#8d9299;
  --line:#d9dbd8; --line-strong:#b8bcbf; --tool-on:#1b1d21; --tool-on-ink:#ffd23f; --accent:#2f6fec; --accent-soft:#e3ecfd;
  --danger:#c92a2a; --danger-soft:#fde3e3; --shadow:0 6px 20px -6px rgba(25,28,35,.28),0 1px 2px rgba(25,28,35,.12);
  --pop:0 18px 44px -10px rgba(20,22,28,.38);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --board:#e3e4e0; --dot:#a9adb3; --surface:#202328; --sunk:#1a1d21; --ink:#e7e9ec; --muted:#a2a8b0; --faint:#737981;
  --line:#30343a; --line-strong:#454a52; --tool-on:#ffd23f; --tool-on-ink:#17191c; --accent:#7aa7ff; --accent-soft:#22314f;
  --danger:#ff8f8f; --danger-soft:#3d1f1f; --shadow:0 6px 20px -6px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4); --pop:0 18px 44px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --board:#e3e4e0; --dot:#a9adb3; --surface:#202328; --sunk:#1a1d21; --ink:#e7e9ec; --muted:#a2a8b0; --faint:#737981;
  --line:#30343a; --line-strong:#454a52; --tool-on:#ffd23f; --tool-on-ink:#17191c; --accent:#7aa7ff; --accent-soft:#22314f;
  --danger:#ff8f8f; --danger-soft:#3d1f1f; --shadow:0 6px 20px -6px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4); --pop:0 18px 44px -10px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none;
  padding-block:0;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--board);cursor:crosshair}
#cv.t-select{cursor:default} #cv.panning{cursor:grabbing}
/* floating rails */
.rail{position:fixed;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;padding:4px}
.top{top:max(10px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));height:52px}
.top input{flex:1;min-width:0;height:44px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;font-weight:700;font-size:16px;letter-spacing:.02em}
.top input:focus{border-color:var(--line-strong);background:var(--sunk);outline:none}
.ib{width:44px;height:44px;flex:none;border:0;background:none;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative;padding:0}
.ib svg{width:22px;height:22px}
.ib:disabled{opacity:.35;cursor:default}
.ib[aria-pressed="true"]{background:var(--tool-on);color:var(--tool-on-ink)}
.tools{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));height:56px;padding:5px}
.tools .ib{width:44px;height:44px}
.tools .ib .more{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.6}
.sep{width:1px;height:28px;background:var(--line);margin:0 2px;flex:none}
.zoom{right:max(16px,env(safe-area-inset-right));bottom:calc(78px + env(safe-area-inset-bottom));height:48px;padding:2px}
.zoom .pct{min-width:58px;height:44px;border:0;background:none;font:600 13px var(--mono);font-variant-numeric:tabular-nums;cursor:pointer;border-radius:8px;color:var(--ink)}
.hint{transition:opacity .4s;position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left));bottom:calc(84px + env(safe-area-inset-bottom));max-width:calc(100% - 180px);font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:8px;padding:6px 10px;pointer-events:none}
@media (min-width:700px) and (orientation:landscape){
  .top{left:calc(84px + env(safe-area-inset-left))}
  .tools{left:max(16px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));bottom:auto;transform:none;flex-direction:column;height:auto;width:56px;max-height:calc(100% - 20px);overflow-y:auto}
  .tools .sep{width:28px;height:1px;margin:2px 0}
  .zoom{bottom:calc(16px + env(safe-area-inset-bottom))}
  .hint{left:calc(84px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
}
/* panels */
.panel{position:fixed;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:12px;display:grid;gap:10px;
  left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(358px,calc(100% - 32px))}
@media (min-width:700px) and (orientation:landscape){.panel{left:calc(84px + env(safe-area-inset-left));top:72px;bottom:auto;transform:none;width:300px;max-height:calc(100% - 82px);overflow:auto}}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.plab{font:700 11px var(--sans);letter-spacing:.14em;color:var(--muted);width:100%}
.sw{width:36px;height:36px;border-radius:18px;border:1px solid var(--line-strong);cursor:pointer;padding:0;position:relative;background:var(--c)}
.sw::after{content:"";position:absolute;inset:-4px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{min-width:52px;height:40px;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);padding:0 10px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--tool-on);color:var(--tool-on-ink)}
.seg svg{width:20px;height:20px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.ctx{position:fixed;z-index:9;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:4px;display:grid;min-width:150px}
.ctx button{height:44px;border:0;background:none;text-align:left;padding:0 12px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.ctx button.danger{color:var(--danger)}
/* menu sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(12,14,18,.42);display:flex;align-items:flex-start;justify-content:flex-start;padding:max(10px,env(safe-area-inset-top)) 16px 16px}
.sheet{width:min(360px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:14px;display:grid;gap:14px}
@media (max-height:600px){.scrim{align-items:flex-start}}
.sheet h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.sheet section{display:grid;gap:8px}
.sheet section>.seg{justify-self:start}
.blist{display:grid;gap:4px}
.brow{display:flex;align-items:center;gap:4px;border-radius:9px}
.brow.on{background:var(--accent-soft)}
.brow .open{flex:1;min-width:0;height:44px;border:0;background:none;text-align:left;padding:0 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;border-radius:9px}
.brow .open b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .open span{font-size:11px;color:var(--faint)}
.btn{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--tool-on);color:var(--tool-on-ink);border-color:var(--tool-on)}
.btn.danger{color:var(--danger)} .btn.armed{background:var(--danger-soft);border-color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;color:var(--faint);margin:0}
/* text editing overlay */
#editor{position:fixed;z-index:6;margin:0;border:1.5px dashed var(--accent);background:transparent;resize:none;overflow:hidden;outline:none;padding:0;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere;transform-origin:center center;color:#1e1e1e}
/* preview + toast */
.pv{position:fixed;inset:0;z-index:30;background:rgba(12,14,18,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pv .box{background:var(--surface);border-radius:12px;box-shadow:var(--pop);padding:12px;max-width:100%;max-height:100%;overflow:auto;display:grid;gap:10px}
.pv img{max-width:100%;max-height:70vh;justify-self:center;background:repeating-conic-gradient(var(--sunk) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:var(--pop);max-width:calc(100% - 32px);text-align:center}
@media (hover:hover){.ib:hover:not(:disabled):not([aria-pressed="true"]){background:var(--sunk)}.ctx button:hover,.brow .open:hover{background:var(--sunk)}.btn:hover{border-color:var(--accent)}.zoom .pct:hover{background:var(--sunk)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
const FONT = 'system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const COLORS = ["#1e1e1e", "#e03131", "#2f9e44", "#1971c2", "#f08c00", "#9c36b5", "#0c8599", "#868e96"];
const NOTE_COLORS = ["#fff1a8", "#ffd6e0", "#c8f0d4", "#cfe6ff", "#ffe0bf"];
const WIDTHS = [2, 4, 8], HL_WIDTHS = [10, 18, 30], TEXT_SIZES = [18, 28, 44];
const ZMIN = 0.1, ZMAX = 8;
const LSK = "sketch-board:v1:";

  toast(`已匯入 ${items.length} 個物件`);
}
