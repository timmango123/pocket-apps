<script>
(() => {
'use strict';
const KEY = 'breath-guide:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = (s) => document.querySelector(s);

const MODES = [
  { id: '478', name: '4-7-8', phases: [['inhale', 4], ['hold', 7], ['exhale', 8]] },
  { id: 'box', name: '方塊', phases: [['inhale', 4], ['hold', 4], ['exhale', 4], ['holdOut', 4]] },
  { id: 'res', name: '共振', phases: [['inhale', 5.5], ['exhale', 5.5]] },
  { id: 'relax', name: '放鬆', phases: [['inhale', 4], ['exhale', 6]] },
  { id: 'custom', name: '自訂', phases: null }
];
const PH_NAME = { inhale: '吸氣', hold: '閉氣', exhale: '吐氣', holdOut: '閉氣' };
const DEF = { mode: '478', durType: 'cycles', minutes: 3, cycles: 4, tone: 'hum', vol: 60, vib: true, vibSec: false, scene: 'night', theme: 'auto' };
let S = Object.assign({}, DEF, store.get('settings', {}));
let custom = store.get('custom', null);
if (!Array.isArray(custom) || !custom[0]) custom = [{ name: '自訂', in: 4, hold: 2, out: 6, hold2: 0 }];
const clampSec = (v) => { v = Math.round(Number(v) * 2) / 2; return Number.isFinite(v) ? Math.max(0, Math.min(20, v)) : 0; };
function saveS() { store.set('settings', S); }

function phasesOf(id) {
  if (id === 'custom') { const c = custom[0]; return [['inhale', c.in], ['hold', c.hold], ['exhale', c.out], ['holdOut', c.hold2]].map(([t, s]) => [t, clampSec(s)]).filter(p => p[1] > 0); }
  return MODES.find(m => m.id === id).phases.slice();
}
const cycleLen = (ph) => ph.reduce((a, p) => a + p[1], 0);
function planCycles(ph) {
  const L = cycleLen(ph); if (L <= 0) return 0;
  return S.durType === 'cycles' ? S.cycles : Math.max(1, Math.ceil(S.minutes * 60 / L - 1e-9));
}
const fmt = (sec) => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const fmtS = (s) => (Math.round(s * 10) / 10).toString();

function applyLook() {
  const r = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
  if (S.scene === 'night') r.removeAttribute('data-scene'); else r.setAttribute('data-scene', S.scene);
}
applyLook();
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

// ---------- UI: setup ----------
function renderModes() {
  $('#modes').innerHTML = MODES.map(m => `<button class="chip" data-mode="${m.id}" aria-pressed="${S.mode === m.id}">${m.name}</button>`).join('');
}
function renderSetup() {
  const ph = phasesOf(S.mode), L = cycleLen(ph), n = planCycles(ph);
  $('#customBox').hidden = S.mode !== 'custom';
  if (S.mode === 'custom') { const c = custom[0]; $('#cIn').value = c.in; $('#cHold').value = c.hold; $('#cOut').value = c.out; $('#cHold2').value = c.hold2; }
  $('#desc').innerHTML = L > 0 ? ph.map(p => `${PH_NAME[p[0]]} <b>${fmtS(p[1])}</b>`).join(' · ') + ` ｜ 一循環 <b>${fmtS(L)}</b> 秒` : '各階段 0–20 秒，0 表示略過';
  document.querySelectorAll('#durSeg button').forEach(b => b.setAttribute('aria-pressed', String(S.durType === 'minutes' && +b.dataset.min === S.minutes)));
  $('#cycStep').classList.toggle('on', S.durType === 'cycles');
  $('#cycOut').textContent = S.cycles + ' 循環';
  const ok = L >= 2;
  $('#btnStart').disabled = !ok;
  const warn = $('#warn');
  if (!ok) { warn.hidden = false; warn.textContent = '節奏總長至少 2 秒才能開始'; }
  else if (S.mode === '478' && n > 8) { warn.hidden = false; warn.textContent = `目前為 ${n} 個循環。初學者建議不超過 4 循環，如頭暈請停止`; }
  else warn.hidden = true;
  $('#btnStart').textContent = ok ? `開始 · ${S.durType === 'cycles' ? n + ' 循環' : '約 ' + fmt(n * L)}` : '開始';
  renderFoot();
  idleOrb(ph);
}
function weekDays() {
  const log = store.get('log', []);
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  const key = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const monKey = key(mon);
  return new Set(log.filter(e => e && e.date >= monKey).map(e => e.date)).size;
}
function renderFoot() { const n = weekDays(); $('#foot').textContent = n ? `本週已練習 ${n} 天` : '本週還沒練習，從一次 1 分鐘開始也很好'; }

$('#modes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mode]'); if (!b || run) return;
  S.mode = b.dataset.mode;
  if (S.mode === '478') { S.durType = 'cycles'; S.cycles = 4; }
  saveS(); renderModes(); renderSetup();
});
$('#durSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-min]'); if (!b) return; S.durType = 'minutes'; S.minutes = +b.dataset.min; saveS(); renderSetup(); });
$('#cycMinus').addEventListener('click', () => { S.durType = 'cycles'; S.cycles = Math.max(1, S.cycles - 1); saveS(); renderSetup(); });
$('#cycPlus').addEventListener('click', () => { S.durType = 'cycles'; S.cycles = Math.min(60, S.cycles + 1); saveS(); renderSetup(); });
['cIn', 'cHold', 'cOut', 'cHold2'].forEach((id, i) => {
  $('#' + id).addEventListener('change', (e) => {
    const k = ['in', 'hold', 'out', 'hold2'][i]; custom[0][k] = clampSec(e.target.value); e.target.value = custom[0][k];
    store.set('custom', custom); renderSetup();
  });
});

// ---------- sizing ----------
function layout() {
  const st = $('#stage').getBoundingClientRect();
  const d = Math.max(120, Math.min(st.width * .86, (st.height - 26) * .9, 460));
  $('#orbbox').style.setProperty('--d', d + 'px');
  $('#orb').style.setProperty('--d', d + 'px');
}
new ResizeObserver(layout).observe($('#stage'));

// ---------- audio ----------
let ac = null, master = null;
function ensureAudio() {
  if (S.tone === 'off') return;
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function vol() { return (S.vol / 100) * 0.35; }
function playPhase(type, sec) {
  if (!ac || S.tone === 'off' || S.vol === 0) return;
  const t0 = ac.currentTime;
  if (S.tone === 'hum') {
    if (type !== 'inhale' && type !== 'exhale') return;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'triangle'; f.type = 'lowpass'; f.frequency.value = 800;
    const up = type === 'inhale';
    o.frequency.setValueAtTime(up ? 220 : 330, t0); o.frequency.linearRampToValueAtTime(up ? 330 : 220, t0 + sec);
    const v = vol();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + Math.min(1, sec * .3));
    g.gain.setValueAtTime(v, t0 + Math.max(sec * .3, sec - 1)); g.gain.linearRampToValueAtTime(0, t0 + sec);
    o.connect(f); f.connect(g); g.connect(master); o.start(t0); o.stop(t0 + sec + .05);
  } else {
    const base = type === 'inhale' ? 660 : type === 'exhale' ? 440 : 550;
    [1, 2.76].forEach((m, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sine'; o.frequency.value = base * m; f.type = 'lowpass'; f.frequency.value = 2400;
      const v = vol() * (i ? .25 : .9);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + 2.2);
      o.connect(f); f.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 2.3);
    });
  }
}
function vibrate(ms) { if (!S.vib && ms === 30) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- wake lock ----------
let wake = null, wakeWarned = false;
async function lockScreen() {
  try {
    if ('wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); }
    else if (!wakeWarned) { wakeWarned = true; toast('此瀏覽器無法保持螢幕常亮，請手動關閉自動鎖定'); }
  } catch (e) { if (!wakeWarned) { wakeWarned = true; toast('無法保持螢幕常亮，請手動關閉自動鎖定'); } }
}
function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }

// ---------- engine ----------
let run = null; // {ph, L, cycles, start, pausedAt, pausedTotal, lastKey, lastSecTick}
const now = () => performance.now();
function stateAt(r, t) {
  const el = Math.max(0, (r.pausedAt != null ? r.pausedAt : t) - r.start - r.pausedTotal) / 1000;
  const total = r.cycles * r.L;
  if (el >= total) return { done: true, el: total, cycle: r.cycles, total };
  const cycle = Math.floor(el / r.L);
  let inC = el - cycle * r.L, i = 0;
  while (i < r.ph.length - 1 && inC >= r.ph[i][1]) { inC -= r.ph[i][1]; i++; }
  return { done: false, el, cycle, i, type: r.ph[i][0], sec: r.ph[i][1], into: inC, prog: Math.min(1, inC / r.ph[i][1]), total };
}
const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function scaleFor(type, p) {
  if (type === 'inhale') return .4 + .6 * ease(p);
  if (type === 'exhale') return 1 - .6 * ease(p);
  return type === 'hold' ? 1 : .4;
}
function drawOrb(type, p) {
  const orb = $('#orb'); const s = scaleFor(type, p);
  if (reduced.matches) { orb.style.transform = 'scale(.8)'; orb.style.opacity = String(.25 + (s - .4) / .6 * .75); }
  else { orb.style.transform = `scale(${s})`; orb.style.opacity = '1'; }
  orb.classList.toggle('glow', type === 'hold');
}
function drawDot(r, st) {
  const sq = $('#square');
  const isBox = (r ? r.mode : S.mode) === 'box';
  sq.hidden = !isBox;
  if (!isBox) return;
  const dot = $('#dot');
  if (!r || !st || st.done) { dot.style.left = '0%'; dot.style.top = '100%'; return; }
  const p = st.prog; let x, y;
  if (st.i === 0) { x = 0; y = 1 - p; } else if (st.i === 1) { x = p; y = 0; } else if (st.i === 2) { x = 1; y = p; } else { x = 1 - p; y = 1; }
  dot.style.left = x * 100 + '%'; dot.style.top = y * 100 + '%';
}
function idleOrb(ph) {
  if (run) return;
  drawOrb('hold', 0); $('#orb').style.transform = reduced.matches ? 'scale(.8)' : 'scale(.7)'; $('#orb').classList.remove('glow');
  $('#label').innerHTML = '<div class="idle">按下開始，跟著圓形呼吸</div>';
  $('#progress').textContent = '';
  drawDot(null, null);
}
let raf = 0;
function frame() {
  raf = 0; if (!run) return;
  const st = stateAt(run, now());
  if (st.done) { finish(true); return; }
  const key = st.cycle + ':' + st.i;
  if (key !== run.lastKey) {
    run.lastKey = key;
    if (run.pausedAt == null) { playPhase(st.type, st.sec); vibrate(30); }
    run.lastSecTick = 0;
  }
  if (S.vibSec && st.type === 'inhale' && run.pausedAt == null) {
    const whole = Math.floor(st.into);
    if (whole > run.lastSecTick) { run.lastSecTick = whole; vibrate(15); }
  }
  drawOrb(st.type, st.prog); drawDot(run, st);
  const left = Math.max(1, Math.ceil(st.sec - st.into - 1e-6));
  $('#label').innerHTML = `<div class="ph">${run.pausedAt != null ? '已暫停' : PH_NAME[st.type]}</div><div class="sec num">${left}</div>`;
  $('#progress').textContent = `第 ${st.cycle + 1} / ${run.cycles} 循環 · 剩 ${fmt(st.total - st.el)}`;
  if (run.pausedAt == null && !document.hidden) raf = requestAnimationFrame(frame);
}
function startRun() {
  const ph = phasesOf(S.mode), L = cycleLen(ph);
  if (L < 2) return;
  ensureAudio();
  run = { ph, L, cycles: planCycles(ph), start: now(), pausedAt: null, pausedTotal: 0, lastKey: '', lastSecTick: 0, mode: S.mode };
  document.body.classList.add('running'); document.body.classList.remove('calm');
  $('#btnStart').hidden = true; $('#runCtrl').hidden = false; $('#tapcatch').hidden = false;
  $('#btnPause').textContent = '暫停';
  lockScreen(); scheduleCalm();
  frame();
}
function pauseRun() {
  if (!run || run.pausedAt != null) return;
  run.pausedAt = now(); $('#btnPause').textContent = '繼續';
  document.body.classList.remove('calm'); unlockScreen(); frame();
}
function resumeRun() {
  if (!run || run.pausedAt == null) return;
  ensureAudio();
  run.pausedTotal += now() - run.pausedAt; run.pausedAt = null; run.lastKey = '';
  $('#btnPause').textContent = '暫停'; lockScreen(); scheduleCalm(); frame();
}
function finish(complete) {
  if (!run) return;
  const st = stateAt(run, now());
  const seconds = Math.round(st.el), cycles = complete ? run.cycles : st.cycle;
  if (cycles >= 1) {
    const log = store.get('log', []);
    const d = new Date();
    log.push({ date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, mode: run.mode, seconds, cycles });
    store.set('log', log.slice(-365));
  }
  run = null; cancelAnimationFrame(raf); raf = 0; unlockScreen();
  document.body.classList.remove('running', 'calm');
  $('#btnStart').hidden = false; $('#runCtrl').hidden = true; $('#tapcatch').hidden = true;
  if (complete || cycles >= 1) {
    $('#dTime').textContent = fmt(seconds); $('#dCyc').textContent = cycles;
    const n = weekDays(); $('#dWeek').textContent = `本週已練習 ${n} 天。慢慢起身，喝口水。`;
    $('#dlgDone').hidden = false; setTimeout(() => $('#btnAgain').focus(), 30);
    if (complete) playPhase('hold', 0);
  }
  renderSetup();
}
let calmT = 0;
function scheduleCalm() { clearTimeout(calmT); calmT = setTimeout(() => { if (run && run.pausedAt == null) document.body.classList.add('calm'); }, 3000); }

$('#btnStart').addEventListener('click', startRun);
$('#btnPause').addEventListener('click', () => { run && (run.pausedAt == null ? pauseRun() : resumeRun()); });
$('#btnStop').addEventListener('click', () => finish(false));
$('#tapcatch').addEventListener('click', () => {
  if (!run) return;
  if (document.body.classList.contains('calm')) { document.body.classList.remove('calm'); scheduleCalm(); }
  else if (run.pausedAt != null) resumeRun();
  else { document.body.classList.add('calm'); }
});
$('#btnAgain').addEventListener('click', () => { $('#dlgDone').hidden = true; startRun(); });
$('#btnClose').addEventListener('click', () => { $('#dlgDone').hidden = true; $('#btnStart').focus(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (run && run.pausedAt == null) pauseRun(); }
  else if (run) frame();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { document.querySelectorAll('.scrim:not([hidden])').forEach(d => d.hidden = true); return; }
  if (e.key === ' ' && run && !e.target.closest('input, button')) { e.preventDefault(); run.pausedAt == null ? pauseRun() : resumeRun(); }
});

// ---------- settings ----------
function syncSet() {
  document.querySelectorAll('#toneSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.tone)));
  document.querySelectorAll('#sceneSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.scene)));
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.theme)));
  $('#vol').value = S.vol; $('#vib').checked = S.vib; $('#vibSec').checked = S.vibSec;
}
$('#btnSet').addEventListener('click', () => { syncSet(); $('#dlgSet').hidden = false; setTimeout(() => $('#dlgSet [data-close]').focus(), 30); });
$('#dlgSet').addEventListener('click', (e) => { if (e.target.id === 'dlgSet' || e.target.closest('[data-close]')) { $('#dlgSet').hidden = true; $('#btnSet').focus(); } });
$('#toneSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.tone = b.dataset.v; saveS(); syncSet(); if (S.tone !== 'off') { ensureAudio(); playPhase(S.tone === 'hum' ? 'inhale' : 'inhale', 1.2); } });
$('#vol').addEventListener('change', (e) => { S.vol = +e.target.value; saveS(); ensureAudio(); playPhase('exhale', 1); });
$('#vib').addEventListener('change', (e) => { S.vib = e.target.checked; saveS(); });
$('#vibSec').addEventListener('change', (e) => { S.vibSec = e.target.checked; saveS(); });
$('#sceneSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.scene = b.dataset.v; saveS(); applyLook(); syncSet(); });
$('#themeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.v; saveS(); applyLook(); syncSet(); });

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

window.__breath = { phasesOf, cycleLen, planCycles, state: () => run && stateAt(run, now()), get S() { return S; } };
renderModes(); renderSetup(); layout();
})();
</script>
</body></html>
