<title>HTML 即時預覽</title>
<style>
:root{
  --bg:#e6e8ec; --surface:#ffffff; --surface2:#f2f3f5; --ed:#fbfbfc; --ink:#16181d; --muted:#5b616d; --line:#cfd3da;
  --run:#f2b705; --run-ink:#1d1600; --sel:#1f4fd1; --focus:#1f4fd1;
  --c-html:#c2410c; --c-css:#2257c9; --c-js:#8a6a00;
  --warn:#8a5a00; --warn-bg:#fff4d6; --err:#b42318; --err-bg:#fdeceb; --res:#2f6b3a;
  --shadow:0 1px 2px rgba(22,24,29,.10), 0 4px 16px rgba(22,24,29,.06);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --efs:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#181b20; --surface2:#20242b; --ed:#14161a; --ink:#e7e9ee; --muted:#9aa1ad; --line:#2d323a;
  --run:#f5c542; --run-ink:#1d1600; --sel:#7aa2ff; --focus:#7aa2ff;
  --c-html:#ff8a5c; --c-css:#7fa7ff; --c-js:#e9c95c;
  --warn:#f2c46b; --warn-bg:#2d2412; --err:#ff8b80; --err-bg:#2e1715; --res:#8fd19e;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#181b20; --surface2:#20242b; --ed:#14161a; --ink:#e7e9ee; --muted:#9aa1ad; --line:#2d323a;
  --run:#f5c542; --run-ink:#1d1600; --sel:#7aa2ff; --focus:#7aa2ff;
  --c-html:#ff8a5c; --c-css:#7fa7ff; --c-js:#e9c95c;
  --warn:#f2c46b; --warn-bg:#2d2412; --err:#ff8b80; --err-bg:#2e1715; --res:#8fd19e;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:var(--appH,100%);display:flex;flex-direction:column;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:6px;min-height:44px;flex:0 0 auto}
.name{flex:1;min-width:0;height:44px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 8px;font-weight:700;font-size:16px;text-overflow:ellipsis}
.name:focus{border-color:var(--line);background:var(--surface);outline:none}
.name:focus-visible{outline:2px solid var(--focus)}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.run{background:var(--run);color:var(--run-ink);border-color:transparent}
.btn.icon{padding:0;width:44px}
.btn.danger{color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
@media (hover:hover){.btn:hover{filter:brightness(.95)} .tab:hover{color:var(--ink)} .wlist .open:hover{background:var(--surface2)} .menu button:hover{background:var(--surface2)}}
.split{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.edpane{flex:1 1 0}
.pvpane{flex:1 1 0}
.divider{flex:0 0 14px;position:relative;cursor:row-resize;touch-action:none;display:grid;place-items:center}
.divider::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--line)}
.divider::after{content:"";position:absolute;inset:-15px 0}
.divider:focus-visible{outline:none}
.divider:focus-visible::before{background:var(--focus)}
.divider.drag::before{background:var(--sel)}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:44px;touch-action:pan-y}
.tab{border:0;background:transparent;padding:0 12px;min-height:44px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;flex:1 1 0;justify-content:center;max-width:150px}
.tab .cnt{font:11px var(--mono);font-weight:400;opacity:.85}
.tab[aria-selected="true"]{color:var(--ink)}
#tabHtml[aria-selected="true"]{border-bottom-color:var(--c-html)}
#tabCss[aria-selected="true"]{border-bottom-color:var(--c-css)}
#tabJs[aria-selected="true"]{border-bottom-color:var(--c-js)}
.tab i{width:8px;height:8px;border-radius:2px;display:inline-block}
#tabHtml i{background:var(--c-html)} #tabCss i{background:var(--c-css)} #tabJs i{background:var(--c-js)}
.saved{margin-left:auto;align-self:center;padding:0 10px;font-size:11px;color:var(--muted);white-space:nowrap}
.keys{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;border-bottom:1px solid var(--line);flex:0 0 auto;scrollbar-width:none;background:var(--surface2)}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font:600 16px var(--mono);cursor:pointer;padding:0 8px}
.keys button.wide{font:600 13px system-ui,sans-serif}
@media (pointer:fine){.keys{display:none}}
.editor{flex:1;min-height:0;display:flex;background:var(--ed);position:relative}
.editor:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.gutter{flex:0 0 auto;min-width:40px;padding:10px 8px 60px 6px;text-align:right;color:var(--muted);overflow:hidden;white-space:pre;user-select:none;-webkit-user-select:none;border-right:1px solid var(--line);opacity:.8}
.gutter,#edWrap textarea{font-family:var(--mono);font-size:var(--efs);line-height:calc(var(--efs) * 1.5)}
@media (pointer:coarse){.gutter,#edWrap textarea{font-size:max(16px, var(--efs)) !important;line-height:calc(max(16px, var(--efs)) * 1.5)}}
#edWrap{flex:1;min-width:0;display:flex}
#edWrap textarea{flex:1;min-width:0;width:100%;height:100%;border:0;resize:none;padding:10px 10px 10px 8px;white-space:pre;overflow:auto;background:transparent;tab-size:2;-moz-tab-size:2;outline:none;color:var(--ink);overscroll-behavior:contain}
.pvbar{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:52px}
.pvbar select{height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip input{width:18px;height:18px;margin:0;accent-color:var(--sel)}
.grow{flex:1}
.pvwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#pv{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0;width:100%;height:100%}
.pvwrap.fixed{background:repeating-linear-gradient(45deg,var(--surface2) 0 8px,var(--surface) 8px 16px)}
.pvinfo{position:absolute;right:6px;bottom:6px;font:11px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:3px;pointer-events:none}
.pvpane.full{position:fixed;inset:0;z-index:40;border-radius:0;border:0}
.pvpane.full .pvbar{padding-left:16px;padding-right:16px}
.con{flex:0 0 auto;border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:46%;min-height:0}
.con.open{flex:0 1 42%;max-height:320px}
.conhead{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 6px 0 0}
.conhead .tg{flex:1;min-height:44px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.conhead .tg svg{width:14px;height:14px;transition:transform .15s}
.con.open .conhead .tg svg{transform:rotate(90deg)}
.pill{font:11px var(--mono);padding:1px 6px;border-radius:9px;background:var(--surface2);color:var(--muted)}
.pill.e{background:var(--err-bg);color:var(--err)}
.pill.w{background:var(--warn-bg);color:var(--warn)}
.logs{flex:1;min-height:40px;overflow:auto;font:12px/1.45 var(--mono);border-top:1px solid var(--line);overscroll-behavior:contain}
.log{padding:4px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.log .ln{color:var(--muted);margin-right:6px}
.log.warn{background:var(--warn-bg);color:var(--warn)}
.log.error{background:var(--err-bg);color:var(--err)}
.log.result{color:var(--res)}
.log.cmd{color:var(--muted)}
.log.info{color:var(--sel)}
.log.empty{color:var(--muted);font-family:system-ui,sans-serif}
.conin{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line)}
.conin input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--ed);padding:0 8px;font:13px var(--mono)}
.banner{font-size:12px;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line)}
/* side by side */
@media (min-width:760px) and (orientation:landscape){
  .split{flex-direction:row}
  .divider{cursor:col-resize}
  .divider::before{width:4px;height:44px}
  .divider::after{inset:0 -15px}
}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:min(640px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.dlg header h2{font-size:16px;margin:0;flex:1}
.dlg .body{padding:12px 16px;overflow:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.menu{display:flex;flex-direction:column;padding:6px}
.menu button,.menu label{min-height:48px;border:0;background:transparent;text-align:left;padding:0 12px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:10px}
.menu small{color:var(--muted);font-size:12px;margin-left:auto}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wlist li{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px}
.wlist li.cur{border-color:var(--sel);box-shadow:inset 3px 0 0 var(--sel)}
.wlist .open{flex:1;min-width:0;min-height:48px;border:0;background:transparent;text-align:left;padding:4px 10px;border-radius:6px;cursor:pointer}
.wlist .open b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.wlist .open span{font-size:12px;color:var(--muted)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tpl button{min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;text-align:left;padding:10px;display:flex;flex-direction:column;gap:4px}
.tpl button b{font-size:14px}
.tpl button span{font-size:12px;color:var(--muted)}
.setrow{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-size:15px}
.setrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--sel);margin:0}
.setrow select{margin-left:auto;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}
.setrow small{display:block;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;z-index:80;max-width:calc(100% - 32px);pointer-events:none;opacity:0;transition:opacity .2s;font-size:14px}
.toast.show{opacity:1}
@media (max-height:600px){dialog{max-height:calc(100% - 16px);margin-top:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <input class="name" id="projName" aria-label="作品名稱（點擊改名）" maxlength="80" autocomplete="off">
    <button class="btn" id="worksBtn" type="button" aria-haspopup="dialog">作品</button>
    <button class="btn run" id="runBtn" type="button" title="執行（Ctrl/⌘ + Enter）"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>執行</button>
    <button class="btn icon" id="moreBtn" type="button" aria-label="更多" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>

  <div class="split" id="split">
    <section class="pane edpane" id="edPane" aria-label="編輯器">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" id="tabHtml" data-k="html" aria-selected="true" type="button"><i></i>HTML <span class="cnt" id="cntHtml">0</span></button>
        <button class="tab" role="tab" id="tabCss" data-k="css" aria-selected="false" type="button"><i></i>CSS <span class="cnt" id="cntCss">0</span></button>
        <button class="tab" role="tab" id="tabJs" data-k="js" aria-selected="false" type="button"><i></i>JS <span class="cnt" id="cntJs">0</span></button>
        <span class="saved" id="saved" aria-live="polite"></span>
      </div>
      <div class="keys" id="keys" aria-label="快捷符號"></div>
      <div class="banner" id="bigWarn" hidden></div>
      <div class="editor">
        <div class="gutter" id="gutter" aria-hidden="true">1</div>
        <div id="edWrap">
          <textarea id="edHtml" aria-label="HTML 程式碼" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
          <textarea id="edCss" aria-label="CSS 程式碼" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" hidden></textarea>
          <textarea id="edJs" aria-label="JavaScript 程式碼" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" hidden></textarea>
        </div>
      </div>
    </section>
    <div class="divider" id="divider" role="separator" tabindex="0" aria-label="拖曳調整編輯器與預覽比例" aria-valuemin="15" aria-valuemax="85"></div>
    <section class="pane pvpane" id="pvPane" aria-label="預覽">
      <div class="pvbar">
        <select id="pvWidth" aria-label="裝置寬度"><option value="auto">自適應</option><option value="375">375 手機</option><option value="768">768 平板</option></select>
        <label class="chip"><input type="checkbox" id="autoChk"> 自動執行</label>
        <span class="grow"></span>
        <button class="btn icon ghost" id="reloadBtn" type="button" aria-label="重新整理預覽" title="重新整理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="btn icon ghost" id="fullBtn" type="button" aria-label="全螢幕預覽" aria-pressed="false" title="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="pvwrap" id="pvWrap">
        <iframe id="pv" title="預覽" sandbox="allow-scripts allow-modals allow-forms"></iframe>
        <span class="pvinfo" id="pvInfo" hidden></span>
      </div>
      <div class="con" id="con">
        <div class="conhead">
          <button class="tg" id="conToggle" type="button" aria-expanded="false" aria-controls="conBody"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7z"/></svg>主控台 <span class="pill" id="cntAll">0</span><span class="pill w" id="cntWarn" hidden>0</span><span class="pill e" id="cntErr" hidden>0</span></button>
          <button class="btn ghost" id="conClear" type="button">清除</button>
        </div>
        <div id="conBody" hidden style="display:flex;flex-direction:column;min-height:0;flex:1">
          <div class="logs" id="logs" role="log" aria-live="polite"></div>
          <form class="conin" id="conForm" autocomplete="off">
            <input id="conIn" placeholder="輸入一行 JS，在預覽中執行" aria-label="在預覽中執行的 JavaScript" spellcheck="false" autocapitalize="off">
            <button class="btn" type="submit">執行</button>
          </form>
        </div>
      </div>
    </section>
  </div>
</div>

<dialog id="dlgMore" aria-label="更多">
  <div class="dlg">
    <header><h2>選單</h2><button class="btn icon ghost" data-close type="button" aria-label="關閉">✕</button></header>
    <div class="menu">
      <button type="button" id="mNew">新增空白作品</button>
      <button type="button" id="mTpl">從範本新增…<small>6 個範本</small></button>
      <button type="button" id="mDup">複製此作品</button>
      <button type="button" id="mDl" hidden>下載為單一 .html</button>
      <button type="button" id="mCopy">複製完整 HTML</button>
      <label for="importFile" id="mImport">匯入 .html 檔</label>
      <button type="button" id="mSet">設定</button>
    </div>
  </div>
</dialog>
<input type="file" id="importFile" accept=".html,.htm,text/html" hidden>

<dialog id="dlgWorks" aria-label="作品">
  <div class="dlg">
    <header><h2>我的作品</h2><button class="btn icon ghost" data-close type="button" aria-label="關閉">✕</button></header>
    <div class="body">
      <ul class="wlist" id="wlist"></ul>
      <p class="note" id="storeNote"></p>
    </div>
    <footer><button class="btn" id="wTpl" type="button">從範本新增</button><button class="btn run" id="wNew" type="button">新增空白</button></footer>
  </div>
</dialog>

<dialog id="dlgTpl" aria-label="範本">
  <div class="dlg">
    <header><h2>選擇範本</h2><button class="btn icon ghost" data-close type="button" aria-label="關閉">✕</button></header>
    <div class="body"><div class="tpl" id="tplList"></div><p class="note">範本會建立成新作品，不會覆蓋目前的作品。</p></div>
  </div>
</dialog>

<dialog id="dlgSet" aria-label="設定">
  <div class="dlg">
    <header><h2>設定</h2><button class="btn icon ghost" data-close type="button" aria-label="關閉">✕</button></header>
    <div class="body">
      <label class="setrow"><input type="checkbox" id="sAuto"><span>自動執行<small>停止輸入 0.8 秒後自動更新預覽</small></span></label>
      <label class="setrow"><input type="checkbox" id="sSafe"><span>安全模式<small>迴圈連續執行超過 2 秒就中止，避免頁面凍結</small></span></label>
      <label class="setrow"><input type="checkbox" id="sTag"><span>自動補上結束標籤<small>輸入 &lt;div&gt; 後自動補 &lt;/div&gt;</small></span></label>
      <label class="setrow"><input type="checkbox" id="sBr"><span>括號與引號自動配對</span></label>
      <label class="setrow">字級<select id="sFont"><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>18</option></select></label>
      <p class="note">預覽在沙盒 iframe 中執行（未開放同源權限），預覽程式讀不到本工具的資料。外部 &lt;script src&gt; 等資源在離線時會載入失敗，主控台會提示。</p>

      seen = seen.concat([v]);
      if (Array.isArray(v)) { var a = []; for (var i = 0; i < v.length && i < 100; i++) a.push(ser(v[i], d + 1, seen)); if (v.length > 100) a.push('…另 ' + (v.length - 100) + ' 項'); return '[' + a.join(', ') + ']'; }
      if (v instanceof Map) { var m = []; v.forEach(function (val, k) { if (m.length < 50) m.push(ser(k, d + 1, seen) + ' => ' + ser(val, d + 1, seen)); }); return 'Map(' + v.size + ') {' + m.join(', ') + '}'; }
      if (v instanceof Set) { var st = []; v.forEach(function (val) { if (st.length < 50) st.push(ser(val, d + 1, seen)); }); return 'Set(' + v.size + ') {' + st.join(', ') + '}'; }
      var keys = Object.keys(v), o = [], name = v.constructor && v.constructor.name && v.constructor.name !== 'Object' ? v.constructor.name + ' ' : '';
      for (var j = 0; j < keys.length && j < 50; j++) o.push((/^[A-Za-z_$][\w$]*$/.test(keys[j]) ? keys[j] : JSON.stringify(keys[j])) + ': ' + ser(v[keys[j]], d + 1, seen));
      if (keys.length > 50) o.push('…');
      return name + '{' + o.join(', ') + '}';
    } catch (e) { return '[無法顯示]'; }
  }
  function post(m) { m.__hp = TOK; try { P.postMessage(m, '*'); } catch (e) {} }
  function send(level, args) { var a = []; for (var i = 0; i < args.length; i++) a.push(ser(args[i], 0, [], true)); post({ type: 'log', level: level, text: a.join(' ') }); }
  ['log', 'info', 'warn', 'error', 'debug'].forEach(function (k) { var o = console[k]; console[k] = function () { send(k === 'debug' ? 'log' : k, arguments); try { if (k !== 'error') o.apply(console, arguments); } catch (e) {} }; });
  console.clear = function () { post({ type: 'clear' }); };
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.nodeType === 1) { post({ type: 'log', level: 'error', text: '載入失敗（可能離線）：' + (t.src || t.href || tagOf(t)) }); return; }
    var ln = e.lineno || 0, where = ln > OFF && ln <= OFF + JSN ? 'JS 第 ' + (ln - OFF) + ' 行' : ln ? '文件第 ' + ln + ' 行' : '';
    post({ type: 'log', level: 'error', text: (e.message || '錯誤'), where: where });
    e.preventDefault();
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; post({ type: 'log', level: 'error', text: '未處理的 Promise 拒絕：' + (r && r.message ? r.message : ser(r, 0, [], true)) }); e.preventDefault(); });
  var gs = 0, armed = false, gc = 0;
  window.__g = function () {
    if (!armed) { armed = true; gs = Date.now(); gc = 0; Promise.resolve().then(function () { armed = false; }); return; }
    if ((++gc & 1023) === 0 && Date.now() - gs > 2000) { armed = false; throw new Error('迴圈超過 2 秒，已中止'); }
  };
  window.addEventListener('message', function (e) {
    if (e.source !== P || !e.data || e.data.__hp !== TOK || e.data.type !== 'eval') return;
    try { var r = (0, eval)(e.data.code); post({ type: 'log', level: 'result', text: ser(r, 0, [], false) }); }
    catch (err) { post({ type: 'log', level: 'error', text: String(err) }); }
  });
});
let runTok = '', runT = null;
const esc = s => s.replace(/<\/(script)/gi, '<\\/$1');
function buildDoc(forExport) {
  const html = ED.html.value, css = ED.css.value, js = ED.js.value;
  if (forExport) {
    const name = ($('projName').value || '作品').replace(/[<>&]/g, '');
    return '<!doctype html>\n<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + name + '</title>\n<style>\n' + css.replace(/<\/style/gi, '<\\/style') + '\n</style>\n</head>\n<body>\n' + html + '\n<script>\n' + esc(js) + '\n<\/script>\n</body>\n</html>\n';
  }
  if (!html.trim() && !css.trim() && !js.trim()) {
    return '<!doctype html><meta charset="utf-8"><style>body{margin:0;height:100vh;display:grid;place-items:center;font:15px system-ui,sans-serif;color:#6b7280;background:#fafafa;text-align:center;padding:16px;box-sizing:border-box}</style><p>三個分頁都是空的。<br>在 HTML、CSS 或 JS 分頁輸入內容，預覽會顯示在這裡。</p>';
  }
  runTok = rid();
  const userJs = S.safe ? guardLoops(js) : js;
  const head = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>(' + BRIDGE.replace('__TOK__', runTok).replace('__JSN__', String((js.match(/\n/g) || []).length + 1)) + ')();<\/script><style>' + css.replace(/<\/style/gi, '<\\/style') + '</style></head><body>' + html + '\n<script>\n';
  const off = (head.match(/\n/g) || []).length;
  return head.replace('__OFF__', String(off)) + esc(userJs) + '\n<\/script></body></html>';
}
function run(clear) {
  clearTimeout(runT); runT = null;
  if (clear !== false) clearConsole();
  $('pv').srcdoc = buildDoc(false);
}
function scheduleRun() { if (!S.autoRun) return; clearTimeout(runT); runT = setTimeout(() => run(true), 800); }
$('runBtn').onclick = () => run(true);
$('reloadBtn').onclick = () => run(true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.target.closest('textarea')) { e.preventDefault(); run(true); } if (e.key === 'Escape' && $('pvPane').classList.contains('full')) setFull(false); });

/* ---------- console ---------- */
let counts = { all: 0, warn: 0, error: 0 };
function clearConsole() { $('logs').innerHTML = ''; counts = { all: 0, warn: 0, error: 0 }; updCounts(); emptyHint(); }
function emptyHint() { if (!$('logs').children.length) { const d = document.createElement('div'); d.className = 'log empty'; d.textContent = '尚無輸出。console.log 的內容與錯誤會顯示在這裡。'; $('logs').appendChild(d); } }
function updCounts() { $('cntAll').textContent = counts.all; $('cntWarn').textContent = counts.warn; $('cntWarn').hidden = !counts.warn; $('cntErr').textContent = counts.error; $('cntErr').hidden = !counts.error; }
function addLog(level, text, where) {
  const L = $('logs'); const e = L.querySelector('.empty'); if (e) e.remove();
  const d = document.createElement('div'); d.className = 'log ' + level;
  if (where) { const s = document.createElement('span'); s.className = 'ln'; s.textContent = where; d.appendChild(s); }
  d.appendChild(document.createTextNode((level === 'result' ? '← ' : '') + text));
  L.appendChild(d); while (L.children.length > 500) L.firstChild.remove();
  if (level !== 'cmd') counts.all++; if (level === 'warn') counts.warn++; if (level === 'error') counts.error++;
  updCounts(); L.scrollTop = L.scrollHeight;
}
window.addEventListener('message', e => {
  if (e.source !== $('pv').contentWindow) return;
  const m = e.data; if (!m || m.__hp !== runTok) return;
  if (m.type === 'clear') { clearConsole(); return; }
  if (m.type === 'log') addLog(['log', 'info', 'warn', 'error', 'result'].includes(m.level) ? m.level : 'log', String(m.text).slice(0, 20000), m.where);
});
function setCon(open) { S.conOpen = open; saveS(); $('con').classList.toggle('open', open); $('conBody').hidden = !open; $('conToggle').setAttribute('aria-expanded', String(open)); requestAnimationFrame(fitPreview); }
$('conToggle').onclick = () => setCon(!S.conOpen);
$('conClear').onclick = () => clearConsole();
$('conForm').addEventListener('submit', e => {
  e.preventDefault(); const code = $('conIn').value.trim(); if (!code) return;
  addLog('cmd', '› ' + code);
  try { $('pv').contentWindow.postMessage({ __hp: runTok, type: 'eval', code }, '*'); } catch (err) { addLog('error', '無法送到預覽'); }
  $('conIn').value = '';
});

/* ---------- divider / layout ---------- */
const side = () => matchMedia('(min-width:760px) and (orientation:landscape)').matches;
function applyRatio() { $('edPane').style.flexGrow = S.ratio; $('pvPane').style.flexGrow = 1 - S.ratio; $('divider').setAttribute('aria-valuenow', Math.round(S.ratio * 100)); $('divider').setAttribute('aria-orientation', side() ? 'vertical' : 'horizontal'); requestAnimationFrame(fitPreview); }
$('divider').addEventListener('pointerdown', e => {
  e.preventDefault(); const dv = e.currentTarget; dv.setPointerCapture(e.pointerId); dv.classList.add('drag');
  const r = $('split').getBoundingClientRect();
  const mv = ev => { const f = side() ? (ev.clientX - r.left) / r.width : (ev.clientY - r.top) / r.height; S.ratio = Math.max(0.15, Math.min(0.85, f)); applyRatio(); };
  const up = () => { dv.classList.remove('drag'); saveS(); dv.removeEventListener('pointermove', mv); dv.removeEventListener('pointerup', up); dv.removeEventListener('pointercancel', up); };
  dv.addEventListener('pointermove', mv); dv.addEventListener('pointerup', up); dv.addEventListener('pointercancel', up);
});
$('divider').addEventListener('keydown', e => { const d = { ArrowUp: -0.05, ArrowLeft: -0.05, ArrowDown: 0.05, ArrowRight: 0.05 }[e.key]; if (!d) return; e.preventDefault(); S.ratio = Math.max(0.15, Math.min(0.85, S.ratio + d)); applyRatio(); saveS(); });
function fitPreview() {
  const wrap = $('pvWrap'), f = $('pv'), W = wrap.clientWidth, H = wrap.clientHeight;
  if (S.pvWidth === 'auto') { f.style.width = '100%'; f.style.height = '100%'; f.style.transform = ''; f.style.left = '0'; wrap.classList.remove('fixed'); $('pvInfo').hidden = true; return; }
  const w = +S.pvWidth, s = Math.min(1, W / w);
  f.style.width = w + 'px'; f.style.height = (H / s) + 'px'; f.style.transform = s < 1 ? `scale(${s})` : ''; f.style.left = Math.max(0, (W - w * s) / 2) + 'px';
  wrap.classList.add('fixed'); $('pvInfo').hidden = false; $('pvInfo').textContent = w + 'px' + (s < 1 ? ' · ' + Math.round(s * 100) + '%' : '');
}
$('pvWidth').onchange = e => { S.pvWidth = e.target.value; saveS(); fitPreview(); };
new ResizeObserver(fitPreview).observe($('pvWrap'));
window.addEventListener('resize', applyRatio);
function setFull(on) { $('pvPane').classList.toggle('full', on); $('fullBtn').setAttribute('aria-pressed', String(on)); $('fullBtn').setAttribute('aria-label', on ? '離開全螢幕' : '全螢幕預覽'); requestAnimationFrame(fitPreview); }
$('fullBtn').onclick = () => setFull(!$('pvPane').classList.contains('full'));
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => { const kb = innerHeight - vv.height > 120; document.documentElement.style.setProperty('--appH', kb ? vv.height + 'px' : '100%'); };
  vv.addEventListener('resize', fit);
}
// auto-run chip + settings
function syncSettingsUI() {
  $('autoChk').checked = S.autoRun; $('sAuto').checked = S.autoRun; $('sSafe').checked = S.safe; $('sTag').checked = S.autoTag; $('sBr').checked = S.brackets;
  $('sFont').value = String(S.font); document.documentElement.style.setProperty('--efs', S.font + 'px'); $('pvWidth').value = S.pvWidth;
  $('runBtn').title = S.autoRun ? '立即執行（Ctrl/⌘ + Enter）' : '執行（Ctrl/⌘ + Enter）';
}
$('autoChk').onchange = e => { S.autoRun = e.target.checked; if (S.autoRun) S.safe = true; else clearTimeout(runT); saveS(); syncSettingsUI(); if (S.autoRun) run(true); };
$('sAuto').onchange = e => { S.autoRun = e.target.checked; if (S.autoRun) S.safe = true; else clearTimeout(runT); saveS(); syncSettingsUI(); };
$('sSafe').onchange = e => { S.safe = e.target.checked; saveS(); };
$('sTag').onchange = e => { S.autoTag = e.target.checked; saveS(); };
$('sBr').onchange = e => { S.brackets = e.target.checked; saveS(); };
$('sFont').onchange = e => { S.font = +e.target.value; saveS(); syncSettingsUI(); gutter(true); };

/* ---------- dialogs ---------- */
function openDlg(id) { const d = $(id); try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
function closeDlg(id) { const d = $(id); try { d.close(); } catch (e) { d.removeAttribute('open'); } }
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d) closeDlg(d.id); });
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeDlg(d.id));
});
$('moreBtn').onclick = () => openDlg('dlgMore');
$('worksBtn').onclick = async () => { await renderWorks(); openDlg('dlgWorks'); };
$('mSet').onclick = () => { closeDlg('dlgMore'); syncSettingsUI(); openDlg('dlgSet'); };
const fmtTime = t => { const d = new Date(t); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
async function renderWorks() {
  if (saveT) await flushSave();
  const list = await allProjects().catch(() => []); const ul = $('wlist'); ul.innerHTML = '';
  list.forEach((p, i) => {
    const li = document.createElement('li'); if (P && p.id === P.id) li.className = 'cur';
    const o = document.createElement('button'); o.type = 'button'; o.className = 'open'; o.id = 'work' + i;
    const b = document.createElement('b'); b.textContent = p.name; const s = document.createElement('span'); s.textContent = fmtTime(p.updatedAt) + ' · ' + (p.html.length + p.css.length + p.js.length) + ' 字';
    o.append(b, s); o.onclick = () => { closeDlg('dlgWorks'); loadIntoEditor(p); };
    const cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn icon ghost'; cp.setAttribute('aria-label', '複製「' + p.name + '」'); cp.title = '複製'; cp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>'; cp.hidden = useLS;
    cp.onclick = async () => { const c = Object.assign({}, p, { id: rid(), name: p.name + '（副本）', updatedAt: Date.now() }); await putProject(c); renderWorks(); toast('已複製'); };
    const del = document.createElement('button'); del.type = 'button'; del.className = 'btn icon ghost danger'; del.id = 'del' + i; del.setAttribute('aria-label', '刪除「' + p.name + '」'); del.title = '刪除'; del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    del.onclick = () => confirmDel(p);
    li.append(o, cp, del); ul.appendChild(li);
  });
  $('storeNote').textContent = useLS ? '此瀏覽器無法使用 IndexedDB，只能保存一個作品（存在 localStorage）。' : '共 ' + list.length + ' 個作品，依最後修改時間排序，自動儲存在這個瀏覽器中。';
  $('wNew').hidden = $('wTpl').hidden = useLS && list.length > 0;
}
let pendingDel = null;
function confirmDel(p) { pendingDel = p; $('cfTitle').textContent = '刪除作品'; $('cfMsg').textContent = '確定要刪除「' + p.name + '」嗎？刪除後無法復原。'; openDlg('dlgConfirm'); $('cfNo').focus(); }
$('cfNo').onclick = () => { pendingDel = null; closeDlg('dlgConfirm'); };
$('cfYes').onclick = async () => {
  const p = pendingDel; pendingDel = null; closeDlg('dlgConfirm'); if (!p) return;
  if (P && p.id === P.id) { clearTimeout(saveT); saveT = null; }
  await delProject(p.id); toast('已刪除「' + p.name + '」');
  if (P && p.id === P.id) { const rest = await allProjects(); if (rest.length) loadIntoEditor(rest[0]); else { const n = newProject(TPL[0]); await putProject(n); loadIntoEditor(n); } }
  if ($('dlgWorks').open) renderWorks();
};
async function createFrom(tpl) {
  if (saveT) await flushSave();
  if (useLS) { toast('此瀏覽器只能保存一個作品，已改為覆蓋目前作品'); }
  const n = newProject(tpl); await putProject(n).catch(() => {}); loadIntoEditor(n); setTab(tpl.html || !tpl.css && !tpl.js ? 'html' : 'css');
  toast('已建立「' + n.name + '」');
}
$('mNew').onclick = () => { closeDlg('dlgMore'); createFrom(TPL[0]); };
$('wNew').onclick = () => { closeDlg('dlgWorks'); createFrom(TPL[0]); };
$('mTpl').onclick = () => { closeDlg('dlgMore'); openDlg('dlgTpl'); };
$('wTpl').onclick = () => { closeDlg('dlgWorks'); openDlg('dlgTpl'); };
TPL.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.id = 'tpl-' + t.id; const x = document.createElement('b'); x.textContent = t.name; const y = document.createElement('span'); y.textContent = t.desc; b.append(x, y); b.onclick = () => { closeDlg('dlgTpl'); createFrom(t); }; $('tplList').appendChild(b); });
$('mDup').onclick = async () => { closeDlg('dlgMore'); if (useLS) { toast('此瀏覽器只能保存一個作品'); return; } await flushSave(); const c = Object.assign({}, P, { id: rid(), name: P.name + '（副本）', updatedAt: Date.now() }); await putProject(c); loadIntoEditor(c); toast('已複製為「' + c.name + '」'); };
$('mCopy').onclick = () => {
  const txt = buildDoc(true); closeDlg('dlgMore');
  const fb = () => { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;left:16px;top:16px;width:calc(100% - 32px);height:40%;z-index:90'; document.body.appendChild(t); t.select(); toast('請手動複製（已選取）'); t.addEventListener('blur', () => t.remove()); };
  try { navigator.clipboard.writeText(txt).then(() => toast('已複製完整 HTML（' + txt.length + ' 字）'), fb); } catch (e) { fb(); }
};
let dl = null;
(async () => { try { dl = await (window.claude?.use?.('downloads')); } catch (e) { dl = null; } $('mDl').hidden = !dl; })();
$('mDl').onclick = async () => {
  closeDlg('dlgMore'); if (!dl) return;
  const fn = (($('projName').value || 'playground').trim().replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 60) || 'playground') + '.html';
  try { await dl.save({ filename: fn, data: buildDoc(true) }); toast('已下載 ' + fn); }
  catch (e) { if (!/declin|cancel|abort/i.test(String(e && (e.name || e.message || e)))) toast('下載失敗，可改用「複製完整 HTML」'); }
};
$('importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; closeDlg('dlgMore'); if (!f) return;
  try {
    const text = await f.text(); const doc = new DOMParser().parseFromString(text, 'text/html');
    const css = [...doc.querySelectorAll('style')].map(s => s.textContent.replace(/^\n+|\s+$/g, '')).join('\n\n');
    doc.querySelectorAll('style').forEach(s => s.remove());
    const js = [...doc.querySelectorAll('script:not([src])')].filter(s => !s.type || /javascript|module/i.test(s.type)).map(s => { const t = s.textContent.replace(/^\n+|\s+$/g, ''); s.remove(); return t; }).join('\n\n');
    const extra = [...doc.head.querySelectorAll('link[rel="stylesheet"], script[src]')].map(n => n.outerHTML).join('\n');
    const body = doc.body ? doc.body.innerHTML.replace(/^\s+|\s+$/g, '') : '';
    const name = (doc.title || f.name.replace(/\.html?$/i, '')).trim() || '匯入的作品';
    if (saveT) await flushSave();
    const n = { id: rid(), name, html: (extra ? extra + '\n' : '') + body + '\n', css: css ? css + '\n' : '', js: js ? js + '\n' : '', updatedAt: Date.now() };
    await putProject(n); loadIntoEditor(n); setTab('html'); toast('已匯入「' + name + '」');
  } catch (err) { toast('無法匯入這個檔案'); }
};

/* ---------- init ---------- */
(async () => {
  syncSettingsUI(); setCon(!!S.conOpen); applyRatio(); setTab('html'); emptyHint();
  db = await idbOpen(); useLS = !db;
  let list = []; try { list = await allProjects(); } catch (e) { useLS = true; list = await allProjects(); }
  const curId = lsGet('current', null);
  let p = list.find(x => x.id === curId) || list[0];
  if (!p) { p = newProject(TPL[2], '範例：按鈕計數器'); try { await putProject(p); } catch (e) {} }
  loadIntoEditor(p);
  window.__hp = { get P() { return P; }, S, run, guardLoops, buildDoc, allProjects, get useLS() { return useLS; }, ready: true };
})();
})();
</script>
