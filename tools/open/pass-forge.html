<title>密碼產生器</title>
<style>
:root {
  --bg: #e9edf1; --surface: #ffffff; --surface-2: #f3f5f8; --ink: #141c27; --muted: #566273; --line: #d3dae3; --line-strong: #b4bfcc;
  --accent: #8f4f12; --accent-soft: #f6e8d8; --accent-ink: #ffffff; --focus: #1f56b8;
  --c-upper: #1d50ad; --c-lower: #141c27; --c-digit: #9a3f06; --c-sym: #a8174f;
  --s1: #c0392b; --s2: #d2691e; --s3: #b8901a; --s4: #3d8a4b; --s5: #1c7465; --s-off: #d9dfe6;
  --warn: #8a5a00; --warn-bg: #fff4d6; --toast-bg: #141c27; --toast-ink: #f3f5f8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1318; --surface: #181e26; --surface-2: #1f2630; --ink: #e8edf3; --muted: #9ba7b6; --line: #2b3440; --line-strong: #3f4a59;
  --accent: #e3a35a; --accent-soft: #3a2a17; --accent-ink: #1a1206; --focus: #8db4ff;
  --c-upper: #8fb5ff; --c-lower: #e8edf3; --c-digit: #f2b26e; --c-sym: #ff8db5;
  --s1: #ec6a5c; --s2: #f0924a; --s3: #e0c050; --s4: #6cc27b; --s5: #4fc3ae; --s-off: #2b3440;
  --warn: #f1c665; --warn-bg: #33290f; --toast-bg: #e8edf3; --toast-ink: #141c27;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e26; --surface-2: #1f2630; --ink: #e8edf3; --muted: #9ba7b6; --line: #2b3440; --line-strong: #3f4a59;
  --accent: #e3a35a; --accent-soft: #3a2a17; --accent-ink: #1a1206; --focus: #8db4ff;
  --c-upper: #8fb5ff; --c-lower: #e8edf3; --c-digit: #f2b26e; --c-sym: #ff8db5;
  --s1: #ec6a5c; --s2: #f0924a; --s3: #e0c050; --s4: #6cc27b; --s5: #4fc3ae; --s-off: #2b3440;
  --warn: #f1c665; --warn-bg: #33290f; --toast-bg: #e8edf3; --toast-ink: #141c27;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
.wrap { max-width: 920px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 18px 0 14px; border-bottom: 3px solid var(--ink); margin-bottom: 16px; }
h1 { margin: 0; font-size: 22px; letter-spacing: .04em; font-weight: 800; display: flex; align-items: baseline; gap: 10px; }
h1 small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; font-family: var(--mono); }
.tabs { display: flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.tabs button { min-height: 44px; padding: 0 14px; border: 0; background: transparent; font-weight: 600; cursor: pointer; border-left: 1.5px solid var(--ink); white-space: nowrap; }
.tabs button:first-child { border-left: 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.result { background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 16px; position: relative; }
.result-top { display: flex; gap: 12px; align-items: flex-start; }
.pw { flex: 1; min-width: 0; font-family: var(--mono); font-size: 26px; line-height: 1.35; overflow-wrap: anywhere; word-break: break-all; cursor: copy; padding: 4px 2px; min-height: 44px; border-radius: 4px; letter-spacing: .02em; }
.pw.long { font-size: 18px; }
.pw.phrase { word-break: normal; overflow-wrap: anywhere; }
.toast button { white-space: nowrap; }
@media (min-width: 600px) { .actions { flex-direction: row; } }
@media (hover: hover) and (pointer: fine) { .pull-hint { display: none; } }
.pw.empty { color: var(--muted); font-family: var(--sans); font-size: 16px; cursor: default; }
.pw .u { color: var(--c-upper); } .pw .l { color: var(--c-lower); } .pw .d { color: var(--c-digit); } .pw .s { color: var(--c-sym); font-weight: 700; }
.pw .sep { color: var(--muted); }
.round { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.round svg { width: 24px; height: 24px; }
.round.primary { background: var(--ink); color: var(--bg); }
.round:disabled { opacity: .4; cursor: not-allowed; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { font-style: normal; font-family: var(--mono); font-weight: 700; }
.pull-hint { font-size: 12px; color: var(--muted); }

.meter { margin-top: 14px; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.bars span { height: 8px; background: var(--s-off); border-radius: 1px; }
.meter-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.grade { font-weight: 800; font-size: 18px; }
.bits { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.crack { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 10px 0 0; font-size: 13px; }
.crack dt { color: var(--muted); }
.crack dd { margin: 0; font-family: var(--mono); text-align: right; font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

.panel { margin-top: 18px; }
.settings { display: grid; gap: 14px; }
@media (min-width: 760px) { .settings.two { grid-template-columns: 1fr 1fr; gap: 14px 28px; } }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.sect-title { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; }
.len-row { display: flex; align-items: center; gap: 12px; }
.len-row input[type=range] { flex: 1; min-width: 0; height: 44px; accent-color: var(--accent); }
.num { width: 76px; min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--surface); padding: 0 8px; font-family: var(--mono); text-align: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); cursor: pointer; }
.toggle span small { display: block; color: var(--muted); font-size: 12px; }
.toggle input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--s-off); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(18px); }
.text-in { width: 100%; min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--surface); padding: 8px 10px; font-family: var(--mono); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 44px; min-width: 44px; padding: 0 12px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 4px; cursor: pointer; font-family: var(--mono); font-weight: 600; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.msg { font-size: 13px; color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 4px; margin: 8px 0 0; }

.batch { margin-top: 22px; border-top: 1.5px solid var(--line-strong); padding-top: 14px; }
.batch-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--surface); font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { border-color: var(--line-strong); }
.list { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
.list li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.list .pw { font-size: 15px; padding: 8px 2px; }
.list .idx { font-family: var(--mono); color: var(--muted); font-size: 12px; width: 22px; flex: none; text-align: right; }
.mini { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: 600; }
.empty-line { color: var(--muted); font-size: 13px; padding: 10px 0; }

.check-in { display: flex; gap: 8px; }
.check-in input { flex: 1; min-width: 0; font-size: 20px; }
.breakdown { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.breakdown li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--surface-2); border-radius: 4px; font-size: 13px; }
.breakdown code { font-family: var(--mono); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.breakdown .g { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.tips { margin: 10px 0 0; padding-left: 20px; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-ink); border-radius: 6px; padding: 6px 6px 6px 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 4px 18px rgba(0,0,0,.25); z-index: 10; }
.toast button { min-height: 40px; border: 0; background: transparent; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; padding: 0 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (hover: hover) {
  .round:hover { background: var(--surface-2); } .round.primary:hover { background: var(--ink); opacity: .88; }
  .btn:hover, .seg button:hover { border-color: var(--ink); }
  .pw:not(.empty):hover { background: var(--surface-2); }
}
@media (max-width: 420px) {
  .tabs { width: 100%; } .tabs button { flex: 1; padding: 0 6px; }
  .pw { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
<header>
  <h1>密碼產生器 <small>PASS·FORGE</small></h1>
  <div class="tabs" role="tablist" aria-label="模式">
    <button role="tab" id="tab-random" aria-selected="true" data-tab="random">隨機密碼</button>
    <button role="tab" id="tab-phrase" aria-selected="false" data-tab="phrase">詞組密碼</button>
    <button role="tab" id="tab-check" aria-selected="false" data-tab="check">檢查強度</button>
  </div>
</header>

<section class="result" id="result" aria-live="polite">
  <div id="gen-view">
    <div class="result-top">
      <div class="pw" id="pw" title="點一下複製" role="button" tabindex="0" aria-label="產生的密碼，點一下複製"></div>
      <div class="actions">
        <button class="round primary" id="btn-copy" type="button" aria-label="複製"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg></button>
        <button class="round" id="btn-regen" type="button" aria-label="重新產生"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </div>
    <div class="legend" id="legend"><span><i style="color:var(--c-upper)">A</i> 大寫</span><span><i style="color:var(--c-lower)">a</i> 小寫</span><span><i style="color:var(--c-digit)">0</i> 數字</span><span><i style="color:var(--c-sym)">#</i> 符號</span><span class="pull-hint">在此區往下拉也能重新產生</span></div>
  </div>
  <div id="check-view" hidden>
    <label class="sect-title" for="check-input">輸入要檢查的密碼（不會儲存）</label>
    <div class="check-in">
      <input class="text-in" id="check-input" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例如 P@ssw0rd">
      <button class="btn ghost" id="btn-show" type="button" aria-pressed="false">顯示</button>
    </div>
  </div>
  <div class="meter" id="meter">
    <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="meter-row"><span class="grade" id="grade">—</span><span class="bits" id="bits"></span></div>
    <dl class="crack" id="crack"></dl>
    <p class="note" id="meter-note"></p>
  </div>
  <ul class="breakdown" id="breakdown" hidden></ul>
  <ul class="tips" id="tips" hidden></ul>
</section>

<section class="panel" id="panel-random">
  <div class="settings two">
    <fieldset>
      <p class="sect-title">長度</p>
      <div class="len-row">
        <input type="range" id="len-range" min="4" max="128" value="20" aria-label="長度滑桿">
        <input class="num" type="number" id="len-num" min="4" max="128" value="20" inputmode="numeric" aria-label="長度">
      </div>
      <p class="sect-title" style="margin-top:12px">字元類型</p>
      <label class="toggle"><span>大寫字母 <small>A–Z</small></span><input type="checkbox" id="opt-upper" checked></label>
      <label class="toggle"><span>小寫字母 <small>a–z</small></span><input type="checkbox" id="opt-lower" checked></label>
      <label class="toggle"><span>數字 <small>0–9</small></span><input type="checkbox" id="opt-digit" checked></label>
      <label class="toggle"><span>符號 <small id="sym-preview"></small></span><input type="checkbox" id="opt-sym" checked></label>
    </fieldset>
    <fieldset>
      <p class="sect-title">規則</p>
      <label class="toggle"><span>排除易混淆字元 <small>0 O 1 l I |</small></span><input type="checkbox" id="opt-ambig"></label>
      <label class="toggle"><span>每類至少一個 <small>確保每種勾選的類型都出現</small></span><input type="checkbox" id="opt-each" checked></label>
      <label class="toggle"><span>不重複字元 <small>每個字元最多出現一次</small></span><input type="checkbox" id="opt-unique"></label>
      <label class="sect-title" for="opt-symset" style="display:block;margin-top:12px">自訂符號集（留空用預設）</label>
      <input class="text-in" id="opt-symset" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="!@#$%^&*()-_=+[]{};:,.<>/?~">
      <p class="msg" id="random-msg" hidden></p>
    </fieldset>
  </div>
</section>

<section class="panel" id="panel-phrase" hidden>
  <div class="settings two">
    <fieldset>
      <p class="sect-title">字數</p>
      <div class="len-row">
        <input type="range" id="words-range" min="3" max="12" value="5" aria-label="字數滑桿">
        <input class="num" type="number" id="words-num" min="3" max="12" value="5" inputmode="numeric" aria-label="字數">
      </div>
      <p class="sect-title" style="margin-top:12px">詞庫</p>
      <div class="seg" id="list-seg">
        <button type="button" id="list-eff" data-v="eff" aria-pressed="true">英文 EFF（7,776 詞）</button>
        <button type="button" id="list-py" data-v="py" aria-pressed="false">中文拼音（2,048 詞）</button>
      </div>
    </fieldset>
    <fieldset>
      <p class="sect-title">分隔符</p>
      <div class="seg" id="sep-seg">
        <button type="button" id="sep-dash" data-v="-" aria-pressed="true">-</button>
        <button type="button" id="sep-space" data-v=" " aria-pressed="false">空白</button>
        <button type="button" id="sep-dot" data-v="." aria-pressed="false">.</button>
        <button type="button" id="sep-under" data-v="_" aria-pressed="false">_</button>
        <button type="button" id="sep-digit" data-v="digit" aria-pressed="false">隨機數字</button>
      </div>
      <label class="toggle" style="margin-top:6px"><span>首字母大寫</span><input type="checkbox" id="opt-cap"></label>
      <label class="toggle"><span>附加一位數字</span><input type="checkbox" id="opt-adddigit"></label>
    </fieldset>
  </div>
</section>

<section class="batch" id="batch">
  <p class="sect-title">批次產生</p>
  <div class="batch-row">
    <label for="batch-n">數量</label>
    <input class="num" type="number" id="batch-n" min="1" max="50" value="5" inputmode="numeric">
    <button class="btn primary" id="btn-batch" type="button">產生多組</button>
    <button class="btn ghost" id="btn-batch-copy" type="button" hidden>全部複製</button>
  </div>
  <ul class="list" id="batch-list" hidden></ul>
  <p class="sect-title" style="margin-top:22px">本次歷史</p>
  <p class="note" style="margin-top:0">只保存在記憶體中，最多 10 組，關閉頁面即消失；不會寫入任何儲存空間。</p>
  <ul class="list" id="history"></ul>
</section>
<p class="note" style="margin-block:24px 8px;color:var(--muted)">英文詞表：EFF Large Wordlist（Electronic Frontier Foundation，CC BY 3.0 US）。常見密碼清單僅用於強度檢查，全程在本機計算。</p>
</div>

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  const order = ['random', 'phrase', 'check'], i = order.indexOf(opts.tab);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; setTab(n); $('tab-' + n).focus(); }
});
function bindRange(rangeId, numId, key, min, max) {
  const apply = (v, commit) => {
    v = parseInt(v, 10); if (isNaN(v)) return;
    if (commit) v = Math.max(min, Math.min(max, v));
    if (v < min || v > max) return;
    opts[key] = v; $(rangeId).value = v; if (commit || document.activeElement !== $(numId)) $(numId).value = v;
    save(); regen();
  };
  $(rangeId).addEventListener('input', e => apply(e.target.value, true));
  $(numId).addEventListener('input', e => apply(e.target.value, false));
  $(numId).addEventListener('change', e => apply(e.target.value, true));
}
bindRange('len-range', 'len-num', 'len', 4, 128);
bindRange('words-range', 'words-num', 'words', 3, 12);
for (const k of ['upper', 'lower', 'digit', 'sym', 'ambig', 'each', 'unique']) $('opt-' + k).addEventListener('change', e => { opts[k] = e.target.checked; save(); regen(); });
$('opt-cap').addEventListener('change', e => { opts.cap = e.target.checked; save(); regen(); });
$('opt-adddigit').addEventListener('change', e => { opts.adddigit = e.target.checked; save(); regen(); });
$('opt-symset').addEventListener('input', e => { opts.symset = e.target.value; save(); syncUI(); regen(); });
$('sep-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; opts.sep = b.dataset.v; save(); syncUI(); regen(); });
$('list-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; opts.list = b.dataset.v; save(); syncUI(); regen(); });
$('btn-regen').addEventListener('click', regen);
$('btn-copy').addEventListener('click', () => copyText(current));
$('pw').addEventListener('click', () => copyText(current));
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyText(current); } });
$('btn-batch').addEventListener('click', runBatch);
$('btn-batch-copy').addEventListener('click', () => copyText(batchItems.join('\n')));
$('check-input').addEventListener('input', renderCheck);
$('btn-show').addEventListener('click', () => {
  const inp = $('check-input'), show = inp.type === 'password';
  inp.type = show ? 'text' : 'password'; $('btn-show').textContent = show ? '隱藏' : '顯示'; $('btn-show').setAttribute('aria-pressed', String(show));
});
// 在結果區往下拉重新產生
(() => {
  let y0 = null;
  const el = $('gen-view');
  el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchmove', e => { if (y0 != null && e.touches[0].clientY - y0 > 70) { y0 = null; regen(); toast('已重新產生'); } }, { passive: true });
  el.addEventListener('touchend', () => { y0 = null; });
})();

syncUI();
if (opts.tab === 'check') { renderCheck(); } else regen();
renderHistory();
</script>
</body></html>
