<title>Markdown 筆記本</title>
<style>
/* Notebook: ruled-paper editor, serif reading pane, library-green ink. Mobile = tabs; desktop ≥900px = list | editor | preview */
:root{
  --bg:#eef0ec; --paper:#fbfcf9; --panel:#f4f6f1; --ink:#1c2620; --muted:#5f6b63; --faint:#8a958d;
  --line:#d9ded6; --rule:#e8ece5; --accent:#2c6a52; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --mark:#f3e27a; --danger:#b2332b; --danger-soft:#f7e1de; --code-bg:#eef1ec;
  --hl-k:#7a3e9d; --hl-s:#2a7a3a; --hl-c:#8a958d; --hl-n:#b0561b; --hl-t:#1f5f9e;
  --shadow:0 10px 30px rgba(20,30,25,.16);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Iowan Old Style","Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --paper:#161b18; --panel:#1b211e; --ink:#dfe6e1; --muted:#9aa69e; --faint:#6f7b73;
  --line:#2b332e; --rule:#1f2622; --accent:#6cc39c; --accent-ink:#0d1a14; --accent-soft:#1f3a2e;
  --mark:#6b5f1a; --danger:#ef8077; --danger-soft:#3a1f1c; --code-bg:#1d2420;
  --hl-k:#d29bf0; --hl-s:#8fd19a; --hl-c:#76827a; --hl-n:#f0a96b; --hl-t:#82b8ef;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --paper:#161b18; --panel:#1b211e; --ink:#dfe6e1; --muted:#9aa69e; --faint:#6f7b73;
  --line:#2b332e; --rule:#1f2622; --accent:#6cc39c; --accent-ink:#0d1a14; --accent-soft:#1f3a2e;
  --mark:#6b5f1a; --danger:#ef8077; --danger-soft:#3a1f1c; --code-bg:#1d2420;
  --hl-k:#d29bf0; --hl-s:#8fd19a; --hl-c:#76827a; --hl-n:#f0a96b; --hl-t:#82b8ef;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:56px auto 1fr auto;padding-inline:max(0px,env(safe-area-inset-left)) max(0px,env(safe-area-inset-right))}
/* top bar */
.top{display:flex;align-items:center;gap:4px;padding:0 8px 0 6px;background:var(--paper);border-bottom:1px solid var(--line);min-width:0}
.ib{width:44px;height:44px;flex:none;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--accent-soft)}
.titlewrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
#titleBtn{all:unset;cursor:text;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:24px;line-height:24px;border-radius:4px}
#titleBtn:focus-visible{outline:2px solid var(--accent)}
#titleInput{font:inherit;font-weight:650;font-size:16px;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--paper);color:var(--ink);width:100%}
#saveState{font-size:11px;color:var(--faint);line-height:14px}
#saveState.busy{color:var(--accent)}
/* tabs */
.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--line);padding:0 12px}
.tab{flex:1;height:44px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);position:relative}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
/* workspace */
.work{position:relative;min-height:0;display:grid;grid-template-columns:1fr}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.pane[data-hide="1"]{display:none}
#editor{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background-color:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:var(--fs);line-height:1.6;padding:16px 16px 24px;tab-size:4;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% calc(var(--fs) * 1.6);background-position:0 calc(16px - 1px + var(--fs)*1.6);background-attachment:local}
#editor.mono{font-family:var(--mono);font-size:calc(var(--fs) * .92)}
#editor:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.toolbar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 8px;flex:none;transition:transform .12s}
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:44px;height:44px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink);font-weight:700;font-size:14px;padding:0 8px}
.tb svg{width:20px;height:20px}
.tb:active{background:var(--accent-soft)}
.tb:disabled{opacity:.35}
.tbsep{flex:none;width:1px;background:var(--line);margin:8px 4px}
#preview{flex:1;min-height:0;overflow:auto;background:var(--paper);padding:20px 16px 48px;-webkit-overflow-scrolling:touch}
.status{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 16px calc(6px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* rendered markdown */
.md{font-family:var(--serif);font-size:calc(var(--fs) + 1px);line-height:1.75;color:var(--ink);max-width:720px;margin:0 auto;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-family:var(--sans);line-height:1.3;margin:1.4em 0 .5em;letter-spacing:-.01em}
.md h1{font-size:1.65em;font-weight:750;padding-bottom:.25em;border-bottom:2px solid var(--ink)}
.md h2{font-size:1.32em;font-weight:700}
.md h3{font-size:1.12em;font-weight:700}
.md h4,.md h5,.md h6{font-size:1em;font-weight:700;color:var(--muted)}
.md p{margin:.7em 0}
.md a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.md blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.md ul,.md ol{padding-left:1.6em;margin:.6em 0}
.md li{margin:.2em 0}
.md li>ul,.md li>ol{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task>input{width:18px;height:18px;margin:0 .45em 0 0;vertical-align:-3px;accent-color:var(--accent);cursor:pointer}
.md li.task.done>.tt{color:var(--faint);text-decoration:line-through}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;line-height:1.55;position:relative}
.md pre code{background:none;padding:0;font-size:.82em;display:block;white-space:pre}
.md pre[data-lang]::before{content:attr(data-lang);position:absolute;right:8px;top:4px;font:11px var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0;position:relative;overflow:visible}
.md img{max-width:100%;height:auto;border-radius:6px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-family:var(--sans);font-size:.9em;margin:1em 0}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;white-space:nowrap}
.md th{background:var(--panel);font-weight:650}
.md del{color:var(--faint)}
.md mark{background:var(--mark);color:inherit}
.md .tag{font-family:var(--sans);font-size:.85em;color:var(--accent);background:var(--accent-soft);padding:0 .35em;border-radius:4px}
.md .imgmiss{display:inline-block;padding:6px 10px;border:1px dashed var(--line);color:var(--faint);font:12px var(--sans);border-radius:6px}
.hl-k{color:var(--hl-k)} .hl-s{color:var(--hl-s)} .hl-c{color:var(--hl-c);font-style:italic} .hl-n{color:var(--hl-n)} .hl-t{color:var(--hl-t)}
/* drawer */
.drawer{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);background:var(--panel);z-index:30;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.38);z-index:29}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.dhead h2{font-size:13px;letter-spacing:.12em;margin:0;flex:1;color:var(--muted);font-weight:700}
.search{margin:0 12px 8px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 12px 0 36px;font:inherit;font-size:15px}
.search svg{position:absolute;left:11px;top:13px;width:18px;height:18px;color:var(--faint)}
.newbtn{margin:0 12px 8px;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.newbtn svg{width:18px;height:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 12px;min-height:32px;font-size:13px;cursor:pointer;color:var(--muted);position:relative}
.chip::after{content:"";position:absolute;inset:-6px 0}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line);list-style:none;margin:0;padding:0}
.item{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.item .del{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--danger);color:#fff;font-weight:650;cursor:pointer}
.item .face{position:relative;background:var(--panel);display:flex;gap:4px;align-items:stretch;transition:transform .18s ease;touch-action:pan-y}
.item.cur .face{background:var(--paper)}
.item.cur .face::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.item .open{all:unset;flex:1;min-width:0;padding:10px 4px 10px 16px;cursor:pointer;display:block}
.item .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.it{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.id{font-size:11px;color:var(--faint);margin-top:2px}
.pin{width:44px;border:0;background:none;cursor:pointer;color:var(--faint);display:grid;place-items:center}
.pin svg{width:18px;height:18px}
.pin[aria-pressed="true"]{color:var(--accent)}
.empty{padding:24px 16px;color:var(--faint);font-size:13px;text-align:center}
.dfoot{padding:8px 12px;font-size:11px;color:var(--faint);border-top:1px solid var(--line)}
@media (hover:hover){
  .ib:hover,.tb:hover{background:var(--accent-soft)}
  .item .face:hover{background:var(--paper)}
  .item:hover .xdel{opacity:1}
  .menu button:hover{background:var(--accent-soft)}
  .chip:hover{border-color:var(--accent)}
}
.xdel{width:40px;border:0;background:none;cursor:pointer;color:var(--danger);display:grid;place-items:center;opacity:0}
.xdel:focus-visible{opacity:1}
.xdel svg{width:17px;height:17px}
@media (pointer:coarse){.xdel{display:none}}
/* menu & dialogs */
.menu{position:fixed;right:8px;top:52px;z-index:40;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;max-height:calc(100% - 64px);overflow:auto}
.menu button{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.menu button svg{width:18px;height:18px;color:var(--muted);flex:none}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .row{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
.menu .row span{flex:1}
.menu .row button{width:44px;justify-content:center;padding:0;font-weight:700;color:var(--ink)}
.menu .seg{display:flex;gap:2px;background:var(--panel);border-radius:8px;padding:2px}
.menu .seg button{min-height:40px;width:auto;padding:0 10px;font-size:13px}
.menu .seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent);font-weight:650}
.menu .danger{color:var(--danger)}
.menu .danger svg{color:var(--danger)}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,15,12,.4)}
.dlg .box{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(420px,100%);padding:20px;max-height:calc(100% - 32px);overflow:auto}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{background:var(--danger);border-color:var(--danger);color:#fff}
.dlg textarea{width:100%;height:180px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:8px;margin-bottom:12px}
@media (max-height:600px){.dlg{place-items:start center;overflow:auto}}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:10px;padding:0 6px 0 14px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;min-height:44px;padding:0 10px;cursor:pointer}
.toast:not(:has(button)){padding-right:14px}
#mirror{position:absolute;visibility:hidden;left:-9999px;top:0;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word}
.dropzone{outline:2px dashed var(--accent);outline-offset:-8px}
/* desktop: three columns */
@media (min-width:900px){
  .app{grid-template-rows:56px 1fr auto;grid-template-columns:260px 1fr 1fr}
  .top{grid-column:1/-1}
  .tabs{display:none}
  .work{grid-column:2/-1;grid-template-columns:1fr 1fr}
  .pane[data-hide="1"]{display:flex}
  #pEdit{border-right:1px solid var(--line)}
  .status{grid-column:1/-1}
  .drawer{position:static;grid-row:2;grid-column:1;transform:none;width:auto;box-shadow:none;border-right:1px solid var(--line);z-index:auto;padding-bottom:0}
  .scrim,#menuDrawerBtn,#closeDrawer{display:none}
  .top{padding-left:16px}
  .dhead{min-height:56px}
  .app>.drawer{grid-row:2}
  #preview{padding:28px 32px 64px}
}
.toolbar.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
@media (max-height:440px) and (max-width:899px){
  .app{grid-template-rows:48px auto 1fr auto}
  .tab{height:44px}
  .status{display:none}
  .app{grid-template-rows:48px auto 1fr 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">

<script>
"use strict";
/* ============ Markdown parser (self-written, escape-first) ============ */
const MD = (() => {
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
  const SAFE_LINK = /^(https?:|mailto:|#)/i;
  const SAFE_IMG = /^(https?:|idb:|data:image\/(png|jpe?g|gif|webp);)/i;

  /* ---- syntax highlight ---- */
  const KW = {
    js: "const let var function return if else for while do switch case break continue new class extends import from export default try catch finally throw await async yield typeof instanceof in of this null undefined true false delete void static get set super",
    py: "def class return if elif else for while in not and or import from as with try except finally raise lambda None True False pass break continue yield global nonlocal is async await del assert self print",
    css: "important media keyframes import from to and not only supports",
  };
  const kwSet = {}; for (const k in KW) kwSet[k] = new Set(KW[k].split(" "));
  const LANG = { javascript: "js", js: "js", jsx: "js", ts: "js", typescript: "js", tsx: "js", node: "js", python: "py", py: "py", html: "html", xml: "html", svg: "html", css: "css", scss: "css", json: "json" };
  const RX = {
    js: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b|\b0x[\da-f]+\b)|([A-Za-z_$][\w$]*)/gi,
    py: /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rbfu]?"(?:\\.|[^"\\\n])*"|[rbfu]?'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gi,
    css: /(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#[\da-f]{3,8}\b|-?\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg|fr)?)|([\w-]+(?=\s*:)|@[\w-]+)/gi,
    json: /()("(?:\\.|[^"\\\n])*"(?=\s*:))|("(?:\\.|[^"\\\n])*")|(-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b|\btrue\b|\bfalse\b|\bnull\b)/gi,
    html: /(<!--[\s\S]*?-->)|("[^"\n]*"|'[^'\n]*')|(<\/?[\w:-]+|\/?>)|(\s[\w:-]+(?==))/g,
  };
  function highlight(code, lang) {
    const L = LANG[(lang || "").toLowerCase()];
    if (!L) return esc(code);
    const rx = RX[L]; rx.lastIndex = 0;
    let out = "", last = 0, m;
    while ((m = rx.exec(code))) {
      if (m[0] === "") { rx.lastIndex++; continue; }
      out += esc(code.slice(last, m.index));
      let cls = null;
      if (L === "json") cls = m[2] ? "hl-t" : m[3] ? "hl-s" : m[4] ? "hl-n" : null;
      else if (L === "html") cls = m[1] ? "hl-c" : m[2] ? "hl-s" : m[3] ? "hl-t" : m[4] ? "hl-k" : null;
      else if (m[1]) cls = "hl-c";
      else if (m[2]) cls = "hl-s";
      else if (m[3]) cls = "hl-n";
      else if (m[4]) cls = L === "css" ? "hl-k" : kwSet[L].has(m[4]) ? "hl-k" : (/^[A-Z]/.test(m[4]) ? "hl-t" : null);
      out += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]);
      last = rx.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  /* ---- inline ---- */
  function inline(src, ctx, noLinks) {
    const store = ctx.store;
    const ph = html => "\u0000" + (store.push(html) - 1) + "\u0000";
    let s = src;
    // code spans
    s = s.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, t, c) => {
      c = c.replace(/\n/g, " ");
      if (/^ .* $/.test(c) && /\S/.test(c)) c = c.slice(1, -1);
      return ph("<code>" + esc(c) + "</code>");
    });
    // backslash escapes
    s = s.replace(/\\([!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~])/g, (_, c) => ph(esc(c)));
    // hard break via backslash newline
    s = s.replace(/\\\n/g, () => ph("<br>"));
    // images
    s = s.replace(/!\[([^\]\n]*)\]\(\s*<?([^\s)>]*)>?(?:\s+"([^"]*)")?\s*\)/g, (all, alt, url, title) => {
      if (!SAFE_IMG.test(url)) return ph(esc(all));
      const t = title ? ` title="${esc(title)}"` : "";
      if (/^idb:/i.test(url)) {
        const id = url.slice(4);
        ctx.images.add(id);
        return ph(`<img data-idb="${esc(id)}" alt="${esc(alt)}"${t} loading="lazy">`);
      }
      return ph(`<img src="${esc(url)}" alt="${esc(alt)}"${t} loading="lazy">`);
    });
    if (!noLinks) {
      // links
      s = s.replace(/\[((?:[^\[\]\n]|\[[^\[\]\n]*\])+)\]\(\s*<?([^\s)>]*)>?(?:\s+"([^"]*)")?\s*\)/g, (all, text, url, title) => {
        if (!SAFE_LINK.test(url)) return all;
        const t = title ? ` title="${esc(title)}"` : "";
        const ext = /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : "";
        return ph(`<a href="${esc(url)}"${t}${ext}>${restore(inline(text, ctx, true), store)}</a>`);
      });
      // <autolink>
      s = s.replace(/<((?:https?:\/\/|mailto:)[^\s<>]+)>/gi, (_, u) => ph(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`));
      // bare URLs (GFM autolink)
      s = s.replace(/(^|[^\w/"'=])((?:https?:\/\/|www\.)[^\s<>\u0000]+)/gi, (all, pre, u) => {
        let trail = "";
        const mm = u.match(/[.,:;!?)\]'"。，、；：！？）」』]+$/);
        if (mm) { trail = mm[0]; u = u.slice(0, -trail.length); }
        // keep balanced parens
        if (trail.startsWith(")") && (u.split("(").length > u.split(")").length)) { u += ")"; trail = trail.slice(1); }
        const href = /^www\./i.test(u) ? "http://" + u : u;
        return pre + ph(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`) + trail;
      });
    }
    // escape everything else (raw HTML shows as text)
    s = esc(s);
    // emphasis
    s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
    s = s.replace(/==(?=\S)([^=\n]*?\S)==/g, "<mark>$1</mark>");
    s = s.replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, "$1<strong>$2</strong>");
    s = s.replace(/\*(?=[^\s*])([^*]*?[^\s*])\*/g, "<em>$1</em>");
    s = s.replace(/\*(?=[^\s*])([^*])\*/g, "<em>$1</em>");
    s = s.replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_]|[^\s_])_(?!\w)/g, "$1<em>$2</em>");
    // #tags
    s = s.replace(/(^|[\s(（])#([\p{L}\p{N}_\-]{1,40})/gu, '$1<span class="tag">#$2</span>');
    // hard breaks: two trailing spaces
    s = s.replace(/ {2,}\n/g, "<br>\n");
    return restore(s, store);
  }
  function restore(s, store) {
    let guard = 0;
    while (s.indexOf("\u0000") >= 0 && guard++ < 8) s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => store[+i] ?? "");
    return s;
  }

  /* ---- blocks ---- */
  const RE = {
    fence: /^ {0,3}(`{3,}|~{3,})\s*([^`\s]*)[^`]*$/,
    heading: /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/,
    hr: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/,
    quote: /^ {0,3}> ?/,
    list: /^( *)([-*+]|\d{1,9}[.)])(?:([ \t]+)(.*)|$)/,
    tableDelim: /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/,
    setext: /^ {0,3}(=+|-+)[ \t]*$/,
  };
  const isBlank = l => /^\s*$/.test(l);
  const expandTabs = l => l.replace(/^\t+/, t => "    ".repeat(t.length));
  function splitRow(row) {
    row = row.trim();
    if (row.startsWith("|")) row = row.slice(1);
    if (row.endsWith("|") && !row.endsWith("\\|")) row = row.slice(0, -1);
    const cells = []; let cur = "";
    for (let i = 0; i < row.length; i++) {
      if (row[i] === "\\" && row[i + 1] === "|") { cur += "\\|"; i++; continue; }
      if (row[i] === "|") { cells.push(cur.trim()); cur = ""; } else cur += row[i];
    }
    cells.push(cur.trim());
    return cells;
  }
  function startsBlock(l, next) {
    return RE.fence.test(l) || RE.heading.test(l) || RE.hr.test(l) || RE.quote.test(l) ||
      (RE.list.test(l) && /\S/.test((l.match(RE.list) || [])[4] || "")) ;
  }
  function slugify(t, ctx) {
    let s = t.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z#0-9]+;/g, "").trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, "-") || "h";
    let n = ctx.slugs.get(s) || 0; ctx.slugs.set(s, n + 1);
    return n ? s + "-" + n : s;
  }

  function blocks(lines, nos, ctx, tight) {
    let out = "", i = 0;
    while (i < lines.length) {
      const l = lines[i], no = nos[i];
      if (isBlank(l)) { i++; continue; }
      let m;
      // fenced code
      if ((m = l.match(RE.fence))) {
        const fence = m[1], lang = m[2], indent = l.match(/^ */)[0].length; const buf = [];
        i++;
        while (i < lines.length && !new RegExp("^ {0,3}" + fence[0] + "{" + fence.length + ",}\\s*$").test(lines[i])) {
          buf.push(lines[i].replace(new RegExp("^ {0," + indent + "}"), "")); i++;
        }
        i++;
        const la = lang ? ` data-lang="${esc(lang)}"` : "";
        out += `<pre data-line="${no}"${la}><code${lang ? ` class="language-${esc(lang)}"` : ""}>${highlight(buf.join("\n"), lang)}</code></pre>\n`;
        continue;
      }
      if ((m = l.match(RE.heading))) {
        const n = m[1].length, txt = inline((m[2] || "").trim(), ctx);
        out += `<h${n} id="${esc(slugify(txt, ctx))}" data-line="${no}">${txt}</h${n}>\n`; i++; continue;
      }
      if (RE.hr.test(l)) { out += `<hr data-line="${no}">\n`; i++; continue; }
      if (RE.quote.test(l)) {
        const buf = [], bn = [];
        while (i < lines.length && (RE.quote.test(lines[i]) || (!isBlank(lines[i]) && buf.length && !isBlank(buf[buf.length - 1]) && !startsBlock(lines[i])))) {
          buf.push(lines[i].replace(RE.quote, "")); bn.push(nos[i]); i++;
        }
        out += `<blockquote data-line="${no}">\n${blocks(buf, bn, ctx)}</blockquote>\n`; continue;
      }
      if ((m = l.match(RE.list)) && (m[4] !== undefined || true)) {
        const r = list(lines, nos, i, ctx);
        if (r) { out += r.html; i = r.next; continue; }
      }
      // table
      if (l.includes("|") && i + 1 < lines.length && RE.tableDelim.test(lines[i + 1]) && lines[i + 1].includes("-")) {
        const head = splitRow(l), aligns = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : /^:-/.test(c) ? "left" : "");
        if (head.length === aligns.length || aligns.length >= 1) {
          const cols = head.length;
          const al = j => aligns[j] ? ` style="text-align:${aligns[j]}"` : "";
          let h = `<table data-line="${no}"><thead><tr>` + head.map((c, j) => `<th${al(j)}>${inline(c, ctx)}</th>`).join("") + "</tr></thead><tbody>";
          i += 2;
          while (i < lines.length && !isBlank(lines[i]) && lines[i].includes("|") && !startsBlock(lines[i])) {
            const cells = splitRow(lines[i]);
            h += "<tr>"; for (let j = 0; j < cols; j++) h += `<td${al(j)}>${inline(cells[j] || "", ctx)}</td>`; h += "</tr>";
            i++;
          }
          out += h + "</tbody></table>\n"; continue;
        }
      }
      // paragraph (+ setext)
      const buf = [l]; i++;
      let setext = 0;
      while (i < lines.length && !isBlank(lines[i])) {
        const nl = lines[i];
        if (/^ {0,3}=+[ \t]*$/.test(nl)) { setext = 1; i++; break; }
        if (/^ {0,3}-+[ \t]*$/.test(nl)) { setext = 2; i++; break; }
        if (startsBlock(nl)) break;
        if (nl.includes("|") && i + 1 < lines.length && RE.tableDelim.test(lines[i + 1]) && lines[i + 1].includes("-")) break;
        buf.push(nl); i++;
      }
      const txt = inline(buf.map(x => x.replace(/^\s+/, "")).join("\n"), ctx);
      if (setext) out += `<h${setext} id="${esc(slugify(txt, ctx))}" data-line="${no}">${txt}</h${setext}>\n`;
      else out += tight ? txt + "\n" : `<p data-line="${no}">${txt}</p>\n`;
    }
    return out;
  }

  function list(lines, nos, i, ctx) {
    const first = lines[i].match(RE.list);
    if (!first) return null;
    const baseIndent = first[1].length;
    const ordered = /\d/.test(first[2]);
    const delim = first[2].slice(-1);
    const items = [];
    let loose = false, sawBlank = false;
    while (i < lines.length) {
      const m = lines[i].match(RE.list);
      if (!m || m[1].length < baseIndent || m[1].length > baseIndent + 1) break;
      if (ordered !== /\d/.test(m[2]) || (ordered ? m[2].slice(-1) !== delim : m[2] !== first[2] && false)) break;
      if (sawBlank) loose = true;
      sawBlank = false;
      const content = m[4] || "";
      const pad = (m[3] || " ").length;
      const contentIndent = m[1].length + m[2].length + (pad > 4 ? 1 : pad);
      const buf = [content], bn = [nos[i]];
      const startNo = nos[i];
      i++;
      while (i < lines.length) {
        const l = lines[i];
        if (isBlank(l)) {
          // blank: continue only if next non-blank line is indented into this item
          let j = i + 1; while (j < lines.length && isBlank(lines[j])) j++;
          if (j < lines.length && lines[j].match(/^ */)[0].length >= Math.min(contentIndent, baseIndent + 2)) { buf.push(""); bn.push(nos[i]); i++; sawBlank = true; continue; }
          sawBlank = true; i++; break;
        }
        const ind = l.match(/^ */)[0].length;
        if (ind >= Math.min(contentIndent, baseIndent + 2)) {
          if (sawBlank) loose = true;
          buf.push(l.slice(Math.min(ind, contentIndent))); bn.push(nos[i]); i++; sawBlank = false; continue;
        }
        if (RE.list.test(l) || startsBlock(l)) break;
        // lazy continuation of paragraph
        if (buf.length && !isBlank(buf[buf.length - 1])) { buf.push(l.trim()); bn.push(nos[i]); i++; continue; }
        break;
      }
      items.push({ buf, bn, startNo, num: ordered ? parseInt(m[2], 10) : 0 });
      if (sawBlank) {
        // blank then next item at same indent → loose; else end
        if (i < lines.length) { const mm = lines[i].match(RE.list); if (!mm || mm[1].length !== baseIndent) break; }
      }
    }
    const tag = ordered ? "ol" : "ul";
    const startAttr = ordered && items[0].num !== 1 ? ` start="${items[0].num}"` : "";
    let html = `<${tag}${startAttr} data-line="${items[0].startNo}">\n`;
    for (const it of items) {
      let task = null;

  host.innerHTML = `<div class="toast"><span></span>${actLabel ? `<button></button>` : ""}</div>`;
  host.querySelector("span").textContent = msg;
  if (actLabel) { const b = host.querySelector("button"); b.textContent = actLabel; b.onclick = () => { host.innerHTML = ""; act(); }; }
  toastT = setTimeout(() => host.innerHTML = "", actLabel ? 5000 : 2600);
}

/* ============ boot ============ */
(async () => {
  applyPrefs();
  await Store.open();
  if (Store.mode === "ls") $("storeNote").textContent = "IndexedDB 無法使用：筆記改存在 localStorage，圖片功能停用";
  try { notes = await Store.allNotes(); } catch { notes = []; }
  if (!notes.length) {
    const t = Date.now();
    const n = { id: uid(), title: "", body: SAMPLE, tags: tagsOf(SAMPLE), pinned: true, created: t, updated: t };
    notes.push(n); try { await Store.putNote(n); } catch {}
  }
  const last = LS.get("lastOpen", null);
  await openNote(notes.find(n => n.id === last) || sorted()[0]);
  window.__mdReady = true;
})();
window.MD = MD;
</script>
