<title>閱讀速度訓練</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#eceef2;--line:#d5d9e0;--ink:#14171c;--ink2:#4a515c;--ink3:#6b7280;
  --accent:#28407a;--accent-ink:#ffffff;--focus-ch:#d0213a;--hl:#fde9b6;--hl-ink:#14171c;--ok:#1f7a4a;--bad:#b42318;--ring:#e3632c;
  --stage:#fbfbfc;--rule:#b9c0cc;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--surface2:#20242c;--line:#323844;--ink:#e8eaee;--ink2:#a8b0bd;--ink3:#8a93a1;
  --accent:#9db4ef;--accent-ink:#0c1630;--focus-ch:#ff6b7d;--hl:#4a3d14;--hl-ink:#f4e7c2;--ok:#6fd39b;--bad:#ff8f86;--ring:#ff9b6a;
  --stage:#121419;--rule:#3d4452;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface2:#20242c;--line:#323844;--ink:#e8eaee;--ink2:#a8b0bd;--ink3:#8a93a1;
  --accent:#9db4ef;--accent-ink:#0c1630;--focus-ch:#ff6b7d;--hl:#4a3d14;--hl-ink:#f4e7c2;--ok:#6fd39b;--bad:#ff8f86;--ring:#ff9b6a;
  --stage:#121419;--rule:#3d4452;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:2px 0 12px}
h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .tick{display:inline-block;width:3px;height:18px;background:var(--focus-ch);margin-right:8px;vertical-align:-3px;border-radius:2px}
.hbtn{min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lab{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink3);margin:0 0 8px;display:block}
.srcrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
textarea{width:100%;min-height:180px;height:28vh;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.7}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--hl);color:var(--hl-ink);margin-right:6px}
.set{display:grid;grid-template-columns:6.5em 1fr 5.5em;align-items:center;gap:8px 10px;font-size:14px;margin-bottom:6px}
.set output{text-align:right;color:var(--ink2)}
.set.chunkrow{grid-template-columns:6.5em auto minmax(0,1fr)}
.set.chunkrow output{text-align:left}
@media (max-width:420px){.set{grid-template-columns:4.5em minmax(0,1fr) 5.5em}.set.chunkrow{grid-template-columns:4.5em auto minmax(0,1fr)}.seg button{min-width:44px}}
input[type=range]{width:100%;min-height:44px;margin:0;accent-color:var(--accent)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.seg button{min-width:52px;min-height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.toggles{display:grid;grid-template-columns:1fr;gap:2px;margin-top:6px}
@media (min-width:560px){.toggles{grid-template-columns:1fr 1fr}}
.tg{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.tg input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.tg small{color:var(--ink3);font-size:12px;display:block;line-height:1.3}
.go{display:flex;gap:10px;flex-wrap:wrap}
.go .btn{flex:1 1 160px;min-height:52px;font-size:17px}
/* reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--stage);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
.rtop{display:flex;align-items:center;gap:8px;max-width:720px;width:100%;margin:0 auto}
.rtop .ttl{flex:1;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagewrap{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto;min-height:0}
.stage{position:relative;height:30vh;min-height:120px;max-height:260px;display:flex;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--rule)}
.stage::before{top:0}.stage::after{bottom:0}
.tickt,.tickb{position:absolute;left:50%;width:2px;height:12px;background:var(--focus-ch);transform:translateX(-1px);opacity:.75}
.tickt{top:0}.tickb{bottom:0}
.word{display:grid;grid-template-columns:1fr auto 1fr;width:100%;font-size:var(--fs,40px);line-height:1.2;white-space:pre;font-weight:500;letter-spacing:.01em}
.word .pre{text-align:right;overflow:hidden}
.word .post{text-align:left;overflow:hidden}
.word .fc{text-align:center}
.word.orp .fc{color:var(--focus-ch)}
.word.long{font-size:calc(var(--fs,40px)*.6)}
.ready{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:15px;pointer-events:none}
.rinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:14px;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.ctx{margin-top:14px;font-size:16px;line-height:1.8;color:var(--ink2);max-height:28vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ctx mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.rctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:720px;width:100%;margin:12px auto 0}
.rctl button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.rctl button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghint{text-align:center;font-size:12px;color:var(--ink3);margin-top:8px}
/* done & dialogs */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 8px);overflow:auto;padding:16px}
@media (max-height:600px){.scrim{align-items:flex-start;overflow:auto}.dlg{max-height:none}}
.dlg h2{margin:0 0 4px;font-size:19px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dhead h2{flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--surface2);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--ink3)}
.qz{margin:12px 0}
.qz p{margin:0 0 6px;font-weight:600}
.qz .opts{display:grid;gap:6px}
.qz .opts button{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.qz .opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qz .opts button.right{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.qz .opts button.wrong{border-color:var(--bad);color:var(--bad)}
.stars{display:flex;gap:6px}
.stars button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.libitem{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--surface2);padding:6px 0}
.libitem .open{flex:1;min-height:48px;text-align:left;border:0;background:none;cursor:pointer;padding:4px 0}
.libitem .open b{display:block;font-size:15px}
.libitem .open span{font-size:12px;color:var(--ink3)}
.libitem .del{min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--surface2);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--ink3);font-size:11px}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
table.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.hist th,table.hist td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--surface2)}
table.hist th{color:var(--ink3);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}
footer{font-size:12px;color:var(--ink3);margin-top:16px;line-height:1.6}
@media (hover:hover){.btn:hover,.hbtn:hover,.rctl button:hover{border-color:var(--accent)}.libitem .open:hover b{color:var(--accent)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
<header>
  <h1><span class="tick" aria-hidden="true"></span>閱讀速度訓練</h1>
  <button class="hbtn" id="libBtn" type="button">文庫</button>
  <button class="hbtn" id="statsBtn" type="button">統計</button>
  <button class="hbtn" id="themeBtn" type="button" aria-label="切換主題">自動</button>
</header>

<section class="card" aria-labelledby="srcLab">
  <span class="lab" id="srcLab">文本</span>
  <div class="srcrow">
    <button class="btn" id="pickBuiltin" type="button">內建短文</button>
    <label class="btn file">開啟 .txt / .md<input type="file" id="fileIn" accept=".txt,.md,text/plain,text/markdown"></label>
    <button class="btn" id="saveText" type="button">存入文庫</button>
    <button class="btn" id="clearText" type="button">清空</button>
  </div>
  <textarea id="text" spellcheck="false" aria-label="要閱讀的文字"></textarea>
  <div class="meta"><span id="srcInfo"></span><span id="estInfo" class="num"></span></div>
</section>

<section class="card" aria-labelledby="setLab">
  <span class="lab" id="setLab">設定</span>
  <div class="set"><label for="speed">速度</label><input type="range" id="speed" min="200" max="1200" step="25" value="400"><output id="speedOut" class="num">400 字/分</output></div>
  <div class="set chunkrow"><span id="chunkLab">每次顯示</span><div class="seg" role="group" aria-labelledby="chunkLab"><button type="button" id="chunk1" aria-pressed="true">1</button><button type="button" id="chunk2" aria-pressed="false">2</button><button type="button" id="chunk3" aria-pressed="false">3</button></div><output id="chunkOut" style="font-size:12px">一個詞</output></div>
  <div class="set"><label for="fontSize">字級</label><input type="range" id="fontSize" min="24" max="72" step="2" value="40"><output id="fontOut" class="num">40 px</output></div>
  <div class="toggles">
    <label class="tg"><input type="checkbox" id="punct" checked><span>標點延長停留<small>逗號 ×1.5、句號 ×2、段落 ×2.5</small></span></label>
    <label class="tg"><input type="checkbox" id="orp" checked><span>焦點字標紅<small>英文約 35% 處、中文第 2 字</small></span></label>
    <label class="tg"><input type="checkbox" id="ramp"><span>漸進加速<small>由 70% 速度在 30 秒內升到目標</small></span></label>
  </div>
</section>

<div class="go">
  <button class="btn primary" id="startBtn" type="button">開始閱讀</button>
  <button class="btn" id="resumeBtn" type="button" hidden>從上次位置續讀</button>
</div>
<footer>中文斷詞優先使用瀏覽器內建 Intl.Segmenter；不支援時改用內嵌詞表（取自新酷音 libchewing-data 詞庫頻率最高的 2 萬詞，LGPL-2.1-or-later）做最長匹配。內建練習短文為本工具自行撰寫。</footer>
</div>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-label="閱讀畫面">
  <div class="rtop"><span class="ttl" id="rTitle"></span><button class="hbtn" id="exitBtn" type="button">結束</button></div>
  <div class="stagewrap">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="點一下暫停或繼續">
      <span class="tickt"></span><span class="tickb"></span>
      <div class="word" id="word"><span class="pre" id="wPre"></span><span class="fc" id="wFc"></span><span class="post" id="wPost"></span></div>
      <div class="ready" id="readyMsg"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="rinfo num"><span id="rPos"></span><span id="rSpeed"></span><span id="rLeft"></span></div>
    <div class="ctx" id="ctx" hidden aria-live="polite"></div>
  </div>
  <div class="rctl">
    <button type="button" id="prevSent" aria-label="上一句">‹ 句</button>
    <button type="button" id="slower" aria-label="減速">−25</button>
    <button type="button" class="main" id="playBtn">暫停</button>
    <button type="button" id="faster" aria-label="加速">+25</button>
    <button type="button" id="nextSent" aria-label="下一句">句 ›</button>
  </div>
  <p class="ghint">點畫面暫停／繼續・左右滑跳句・上下滑調速・空白鍵／方向鍵</p>
</div>

<div class="scrim" id="doneDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <h2 id="doneTitle">讀完了</h2>
  <div class="kpis"><div class="kpi"><b class="num" id="dWords"></b><span id="dWordsLab">字數</span></div><div class="kpi"><b class="num" id="dTime"></b><span>用時</span></div><div class="kpi"><b class="num" id="dWpm"></b><span id="dWpmLab">實際速度</span></div></div>
  <div id="quizBox"></div>
  <div class="go" style="margin-top:12px"><button class="btn primary" id="saveResult" type="button">記錄成績</button><button class="btn" id="skipResult" type="button">不記錄</button></div>
</div></div>

<div class="scrim" id="libDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="libTitle">
  <div class="dhead"><h2 id="libTitle">文庫</h2><button class="hbtn" id="libClose" type="button">關閉</button></div>
  <span class="lab">內建短文（附理解題）</span><div id="libBuiltin"></div>
  <span class="lab" style="margin-top:14px">我的文本</span><div id="libMine"></div>
</div></div>

<div class="scrim" id="statsDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="dhead"><h2 id="statsTitle">閱讀紀錄</h2><button class="hbtn" id="statsClose" type="button">關閉</button></div>
  <div class="kpis"><div class="kpi"><b class="num" id="sN"></b><span>次數</span></div><div class="kpi"><b class="num" id="sAvg"></b><span id="sAvgLab">平均速度</span></div><div class="kpi"><b class="num" id="sScore"></b><span>平均理解度</span></div></div>
  <span class="lab" id="chartTitle" style="margin-top:6px"></span><div style="position:relative" id="chartBox"></div>
  <div id="histBox"></div>
  <div class="go" style="margin-top:10px"><button class="btn" id="clearHist" type="button">清除紀錄</button></div>
</div></div>

<div class="scrim" id="confirmDlg" hidden><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" style="max-width:380px">
  <h2 id="cfTitle"></h2><p id="cfMsg" style="color:var(--ink2);font-size:14px"></p>
  <div class="go"><button class="btn" id="cfNo" type="button">取消</button><button class="btn primary" id="cfYes" type="button">確定</button></div>
</div></div>

到了後來，人們發現直接用熱水沖泡散茶更簡單，也更能保留茶葉本身的香氣。泡茶的方式改變了，茶具也跟著改變：大碗換成了小杯，茶壺開始講究材質與形狀。有人偏愛紫砂壺，認為它能讓茶湯更圓潤；也有人喜歡白瓷，因為能清楚看見茶湯的顏色。

{id:'zh2',lang:'zh',title:'城市裡的行道樹',text:`走在街上，我們很少特別注意身旁的行道樹，但它們其實默默替城市做了很多事。夏天的午後，柏油路面被太陽曬得發燙，有樹蔭的人行道卻能明顯涼快許多。樹葉會遮擋陽光，也會透過蒸散作用把水分釋放到空氣中，讓周圍的溫度降低。

行道樹也能減少噪音、攔截灰塵，並為鳥類和昆蟲提供棲身的地方。清晨時分，常能聽到麻雀和白頭翁在枝頭吵鬧，這些聲音讓城市多了一點生氣。

不過，在城市裡種樹並不容易。樹根需要足夠的土壤和空間，如果樹穴太小，根系只能往地面竄，結果把人行道撐得高低不平。選擇樹種時也要考慮很多因素，例如成長速度、樹冠大小、是否容易斷枝，以及落葉和果實會不會造成清潔上的困擾。

近年來，有些城市開始用更長遠的眼光規劃行道樹。他們擴大樹穴、改善土壤，修剪時也避免把樹冠剪得光禿禿的。一棵樹要長得高大茂密，往往需要二三十年，好好照顧它們，等於是替下一代的城市留下一片綠蔭。`,

{q:'樹穴太小可能造成什麼問題？',o:['樹木長得太快','鳥類不來築巢','根系把人行道撐得不平','樹葉變色'],a:2},

{id:'zh3',lang:'zh',title:'睡眠如何幫助記憶',text:`考試前熬夜讀書，是許多學生都有過的經驗。然而，越來越多的研究指出，睡眠並不是浪費時間，而是學習過程中重要的一環。

白天學到的新資訊，一開始只是暫時存放在大腦裡，很容易被遺忘。進入睡眠之後，大腦會反覆整理這些資訊，把重要的部分和原本的知識連結起來，讓記憶變得更穩固。這個過程有點像在夜裡替檔案分類、貼上標籤，第二天要找的時候就比較容易。

睡眠可以分成好幾個階段，不同階段似乎負責不同的工作。深層睡眠和記住事實、單字等內容有關；而作夢較多的快速動眼期，則可能幫助我們整合經驗、發現事物之間的關聯。如果睡得太少，這些階段就會被壓縮，學過的東西也比較難留下來。

所以，與其在考前一晚通宵，不如把讀書的時間分散到前幾天，每天讀一點，晚上好好睡一覺。規律的作息、睡前少看螢幕、白天適度運動，都能讓睡眠品質更好。休息本身，也是學習的一部分。`,

{q:'文中認為深層睡眠和什麼比較有關？',o:['記住事實與單字','控制體溫','消化食物','發現新點子'],a:0},
{q:'作者對考前準備的建議是？',o:['考前一晚通宵','完全不要讀書','把讀書時間分散到前幾天並好好睡覺','只在早上讀書'],a:2}]},
{id:'en1',lang:'en',title:'The Last Lighthouse Keepers',text:`For centuries, lighthouses were tended by people who lived beside them. A keeper's day followed the light. Before sunset, the lamp had to be lit, and through the night it needed fuel, a clean glass, and a turning lens that never stopped. If the light failed, a ship could run onto the rocks.

The work was lonely and repetitive. Many keepers lived on small islands with their families, cut off from towns for weeks when storms came. They kept careful logbooks, writing down the weather, passing ships, and every small repair. Those notes are now valued by historians and scientists who study how the climate and the coast have changed.

During the twentieth century, electric lamps and automatic timers slowly replaced most of these duties. A machine could switch the light on at dusk and off at dawn, and a technician could visit only when something broke. One by one, the keepers packed their belongings and left.

Today, many old lighthouses are museums, guesthouses, or simply landmarks. Visitors climb the narrow stairs and look out over the water, often surprised by how small the living rooms were. The lights still turn at night, but the people who once watched over them have become part of the story of the sea.`,
quiz:[{q:'Why was it important that the light never failed?',o:['Visitors would complain','Ships could run onto the rocks','The lens would break','Keepers would lose their jobs'],a:1},
{q:'Why are the keepers’ logbooks valued today?',o:['They contain poems','They record weather and coastal changes','They list ship prices','They explain how to build lenses'],a:1},
{q:'What mainly replaced the keepers’ duties?',o:['Larger ships','Radio stations','Electric lamps and automatic timers','Volunteers from towns'],a:2}]},
{id:'en2',lang:'en',title:'How a Swarm Chooses a Home',text:`In late spring, a crowded honeybee colony may split in two. The old queen leaves with thousands of workers, and the swarm settles on a branch while it searches for a new home. What happens next is a remarkable example of group decision making.

A few hundred older bees act as scouts. They fly out in different directions and inspect hollow trees, wall cavities, and other possible sites. A good home must be the right size, dry, protected from wind, and have a small entrance that is easy to defend.

When a scout finds a promising site, she returns to the swarm and performs a waggle dance. The direction of the dance points toward the site, and its length hints at the distance. A scout that found an excellent place dances with more energy and repeats her dance more times than one that found an ordinary place.

Other scouts follow the dances, visit the sites themselves, and then dance for the ones they like. Over time, support grows for the best option while weaker options fade away. When enough scouts gather at one site, the swarm lifts into the air and flies there together. No single bee makes the choice; the decision emerges from many small, independent judgments.`,

{q:'According to the text, who makes the final choice?',o:['The queen','The oldest scout','No single bee; it emerges from many judgments','The beekeeper'],a:2}]},
{id:'en3',lang:'en',title:'Paper Maps in a GPS World',text:`Most of us now find our way with a phone. We type a destination, and a calm voice tells us when to turn. It is fast and convenient, and it rarely gets lost. So why do some hikers, sailors, and teachers still carry paper maps?

One reason is reliability. A paper map does not need a battery or a signal. In deep valleys, remote forests, or during a power cut, a folded sheet of paper keeps working long after a screen has gone dark.

Another reason is understanding. Turn-by-turn directions show only the next step, so it is easy to arrive somewhere without knowing where you are. A map shows the whole area at once: the river you crossed, the hill you climbed, the road you could take if your route is blocked. People who plan with maps often build a stronger mental picture of a place.

Paper maps also invite curiosity. Spreading one out on a table, you notice a lake you have never visited or a small village with an unusual name. None of this means we should give up our phones. The best approach may be to use both: let the device guide the details, and let the map help you see the bigger picture.`,

/* ---------- segmentation ---------- */
const CJK=/[㐀-䶿一-鿿豈-﫿]/;
const CJKg=/[㐀-䶿一-鿿豈-﫿]/g;

function dict(){if(DICT)return DICT;DICT=new Set();for(const [n,s] of Object.entries(ZH_WORDS)){const k=+n;for(let i=0;i<s.length;i+=k)DICT.add(s.slice(i,i+k));}return DICT;}
function fmmSeg(run){const d=dict();const out=[];let i=0;while(i<run.length){let L=Math.min(4,run.length-i);for(;L>1;L--){if(d.has(run.slice(i,i+L)))break;}out.push(run.slice(i,i+L));i+=L;}return out;}
let SEG=null;try{if(typeof Intl!=='undefined'&&Intl.Segmenter)SEG=new Intl.Segmenter('zh-Hant',{granularity:'word'});}catch(e){SEG=null;}
const forceFallback={on:false};
function segWords(s){ // returns [{t, word:boolean}]
  if(SEG&&!forceFallback.on)return Array.from(SEG.segment(s),x=>({t:x.segment,word:!!x.isWordLike}));
  const out=[];const re=/([㐀-䶿一-鿿豈-﫿]+)|([A-Za-z0-9À-ɏ'’\-]+)|(\s+)|(.)/gu;let m;
  while((m=re.exec(s))){if(m[1])fmmSeg(m[1]).forEach(w=>out.push({t:w,word:true}));else if(m[2])out.push({t:m[2],word:true});else if(m[3])out.push({t:m[3],word:false});else out.push({t:m[4],word:false});}
  return out;
}
const SENT_END=/[。！？!?…]|\.(?=$|["'”’)\]]*$)/;
const COMMA=/[，,、；;：:]/;
function detectLang(t){const c=(t.match(CJKg)||[]).length;const nonsp=t.replace(/\s/g,'').length||1;return c/nonsp>0.3?'zh':'en';}
/* items: {text, units, fac:[punct factor], len factor, sent, para} */
function build(text,opts){
  const lang=opts.lang||detectLang(text);const items=[];const sents=[];let sent=0;
  const paras=text.replace(/\r/g,'').split(/\n\s*\n|\n/).map(p=>p.trim()).filter(Boolean);
  const pushSent=()=>{};
  paras.forEach((p,pi)=>{
    let sentStartItem=items.length;
    const endSentence=()=>{if(items.length>sentStartItem){sents.push(sentStartItem);items.slice(sentStartItem).forEach(it=>it.sent=sents.length-1);sentStartItem=items.length;}};
    if(lang==='en'){
      const words=p.split(/\s+/).filter(Boolean);let buf=[];
      const flush=()=>{if(!buf.length)return;const t=buf.join(' ');items.push(mk(t,buf.length,lang));buf=[];};
      words.forEach(w=>{buf.push(w);const endP=/[,;:]["'”’)\]]*$/.test(w);const endS=/[.!?…]["'”’)\]]*$/.test(w);
        if(buf.length>=opts.chunk||endP||endS)flush();if(endS)endSentence();});
      flush();endSentence();
    }else{
      const toks=segWords(p);const maxC=opts.chunk===1?0:opts.chunk===2?4:6;let cur='',curUnits=0,curWords=0;
      const flush=()=>{if(cur.trim()){items.push(mk(cur.trim(),Math.max(1,curUnits),lang));}cur='';curUnits=0;curWords=0;};
      toks.forEach(tk=>{
        const t=tk.t;
        if(/^\s+$/.test(t)){if(cur&&!CJK.test(cur.slice(-1)))cur+=' ';return;}
        if(!tk.word&&/^[「『（(“‘《〈\[]+$/.test(t)){if(cur&&curUnits>0&&maxC===0)flush();cur+=t;return;}
        if(!tk.word){ // punctuation attaches to previous chunk
          if(cur)cur+=t;else if(items.length&&items[items.length-1].sent===undefined)items[items.length-1].text+=t;else cur+=t;
          if(SENT_END.test(t)||COMMA.test(t)){flush();if(SENT_END.test(t))endSentence();}
          return;}
        const u=(t.match(CJKg)||[]).length||1;
        const limit=maxC===0?0:maxC;
        if(cur&&curUnits>0&&(limit===0||curUnits+u>limit))flush();
        cur+=t;curUnits+=u;curWords++;
      });
      flush();endSentence();
    }
    if(items.length)items[items.length-1].para=true;
  });
  if(!sents.length&&items.length)sents.push(0);
  items.forEach(it=>{if(it.sent==null)it.sent=sents.length-1;});
  return {items,sents,lang,units:items.reduce((a,b)=>a+b.units,0)};

function mk(text,units,lang){
  const chars=[...text];let focus;
  if(lang==='en'){const core=text.replace(/^[^A-Za-z0-9À-ɏ]+/,'');const lead=chars.length-[...core].length;const lettersLen=[...core.replace(/[^A-Za-z0-9À-ɏ'’\-]+$/,'')].length||1;
    focus=lead+Math.min(lettersLen-1,Math.round(lettersLen*0.35));}
  else{let idx=[];chars.forEach((c,i)=>{if(CJK.test(c)||/[A-Za-z0-9]/.test(c))idx.push(i);});focus=idx.length>=2?idx[1]:(idx[0]||0);}
  const longest=Math.max(...text.split(/\s+/).map(w=>w.length));
  return {text,units,focus,long:lang==='en'?longest>8:false,huge:longest>20,sent:undefined,para:false};

function factor(it,punct){

  return f;
}
function delayMs(it,speed,punct){return 60000/speed*it.units*factor(it,punct);}

  const b=$('libBuiltin');b.textContent='';
  BUILTIN.forEach(x=>{const r=document.createElement('div');r.className='libitem';const o=document.createElement('button');o.type='button';o.className='open';
    o.innerHTML='<b></b><span></span>';o.children[0].textContent=x.title;o.children[1].textContent=(x.lang==='zh'?'中文・':'英文・')+(x.lang==='zh'?(x.text.match(CJKg)||[]).length+' 字':x.text.split(/\s+/).length+' 詞')+'・3 題';
    o.onclick=()=>{loadText(x.text,x.title,x.id);closeLib();};r.append(o);b.append(r);});
  const m=$('libMine');m.textContent='';
  if(!lib.length)m.append(Object.assign(document.createElement('p'),{textContent:'還沒有存入的文本。在主畫面按「存入文庫」即可保存（最多 20 篇）。',style:'color:var(--ink3);font-size:14px;margin:6px 0'}));
  lib.forEach(x=>{const r=document.createElement('div');r.className='libitem';const o=document.createElement('button');o.type='button';o.className='open';o.innerHTML='<b></b><span></span>';o.children[0].textContent=x.title;
    const p=progress[x.h];o.children[1].textContent=new Date(x.date).toLocaleDateString('zh-TW')+'・'+x.t.length.toLocaleString()+' 字元'+(p?'・讀到 '+Math.round(p.pct)+'%':'');
    o.onclick=()=>{loadText(x.t,x.title);closeLib();};
    const d=document.createElement('button');d.type='button';d.className='del';d.textContent='刪除';d.onclick=async()=>{if(await confirmBox('刪除文本','確定刪除「'+x.title+'」？')){lib=lib.filter(y=>y.h!==x.h);store.set('library',lib);openLib();}};
    r.append(o,d);m.append(r);});
  $('libDlg').hidden=false;$('libClose').focus();
}
function closeLib(){$('libDlg').hidden=true;$('libBtn').focus();}
$('libBtn').onclick=openLib;$('libClose').onclick=closeLib;

/* ---------- reader ---------- */
const R={doc:null,i:0,playing:false,nextAt:0,raf:0,speed:400,playMs:0,lastTs:0,startWall:0,hash:'',wake:null,readUnits:0,elapsedRead:0};
const wPre=$('wPre'),wFc=$('wFc'),wPost=$('wPost'),word=$('word');
function show(i){
  const it=R.doc.items[i];if(!it){wPre.textContent=wFc.textContent=wPost.textContent='';return;}
  const ch=[...it.text];wPre.textContent=ch.slice(0,it.focus).join('');wFc.textContent=ch[it.focus]||'';wPost.textContent=ch.slice(it.focus+1).join('');
  word.classList.toggle('long',it.huge);
  const pct=R.doc.items.length?(i/R.doc.items.length*100):0;$('barFill').style.width=pct.toFixed(1)+'%';
}
function effSpeed(){if(!prefs.ramp)return R.speed;return R.speed*(0.7+0.3*Math.min(1,R.playMs/30000));}
function remainingMs(){let ms=0;const it=R.doc.items;for(let k=R.i;k<it.length;k++)ms+=delayMs(it[k],R.speed,prefs.punct);return ms;}
let infoTick=0;
function updRInfo(force){
  const now=performance.now();if(!force&&now-infoTick<250)return;infoTick=now;
  $('rPos').textContent=`${Math.min(R.i+1,R.doc.items.length)} / ${R.doc.items.length}`;
  $('rSpeed').textContent=Math.round(effSpeed())+' '+unitName(R.doc.lang)+'/分';
  $('rLeft').textContent='剩 '+fmtTime(remainingMs());
}
function loop(ts){
  if(!R.playing)return;
  const now=performance.now();const dt=now-R.lastTs;R.lastTs=now;R.playMs+=dt;
  let guard=0;
  while(now>=R.nextAt&&guard++<50){
    R.i++;
    if(R.i>=R.doc.items.length){finish();return;}
    show(R.i);R.nextAt+=delayMs(R.doc.items[R.i],effSpeed(),prefs.punct);
  }
  updRInfo();
  if(now-R.lastSave>5000)saveProgress();
  R.raf=requestAnimationFrame(loop);
}
function play(){
  if(R.i>=R.doc.items.length)R.i=0;
  R.playing=true;R.lastTs=performance.now();R.lastSave=R.lastTs;show(R.i);
  R.nextAt=R.lastTs+delayMs(R.doc.items[R.i],effSpeed(),prefs.punct);
  $('playBtn').textContent='暫停';$('ctx').hidden=true;$('readyMsg').textContent='';
  requestWake();
  cancelAnimationFrame(R.raf);R.raf=requestAnimationFrame(loop);updRInfo(true);
}
function pause(){
  if(!R.playing)return;R.playing=false;cancelAnimationFrame(R.raf);$('playBtn').textContent='繼續';saveProgress();renderCtx();updRInfo(true);releaseWake();
}
function toggle(){R.playing?pause():play();}
function renderCtx(){
  const d=R.doc;const it=d.items[R.i];if(!it)return;const s=it.sent;
  const from=Math.max(0,s-2),to=Math.min(d.sents.length-1,s+2);
  const start=d.sents[from],end=to+1<d.sents.length?d.sents[to+1]:d.items.length;
  const box=$('ctx');box.textContent='';
  for(let k=start;k<end;k++){const t=d.items[k].text;const sep=d.lang==='en'||/[A-Za-z0-9]$/.test(t)?' ':'';
    if(k===R.i){const m=document.createElement('mark');m.textContent=t;box.append(m,sep);}else box.append(t+sep);
    if(d.items[k].para&&k<end-1)box.append(document.createElement('br'));}
  box.hidden=false;const m=box.querySelector('mark');if(m)m.scrollIntoView({block:'nearest'});
}
function jumpSent(dir){
  const d=R.doc;const s=d.items[Math.min(R.i,d.items.length-1)].sent;
  let ns=s+dir;if(dir<0&&R.i>d.sents[s]+1)ns=s; // go to start of current sentence first
  ns=Math.max(0,Math.min(d.sents.length-1,ns));R.i=d.sents[ns];show(R.i);
  if(R.playing){R.nextAt=performance.now()+delayMs(d.items[R.i],effSpeed(),prefs.punct);}else renderCtx();
  updRInfo(true);
}
function adjSpeed(delta){
  const zh=R.doc.lang==='zh';const min=zh?200:100,max=zh?1200:1000;R.speed=Math.max(min,Math.min(max,R.speed+delta));
  if(zh)prefs.speedZh=R.speed;else prefs.speedEn=R.speed;savePrefs();updRInfo(true);toast(R.speed+' '+unitName(R.doc.lang)+'/分');
}
function saveProgress(){
  if(!R.doc)return;R.lastSave=performance.now();
  let u=0;for(let k=0;k<R.i;k++)u+=R.doc.items[k].units; // position in units survives a chunk-size change
  progress[R.hash]={i:R.i,u,pct:R.i/R.doc.items.length*100,t:Date.now()};
  const keys=Object.keys(progress);if(keys.length>40){keys.sort((a,b)=>progress[a].t-progress[b].t).slice(0,keys.length-40).forEach(k=>delete progress[k]);}
  store.set('progress',progress);
}
async function requestWake(){try{if(navigator.wakeLock&&!R.wake){R.wake=await navigator.wakeLock.request('screen');R.wake.addEventListener('release',()=>R.wake=null);}}catch(e){R.wake=null;}}
function releaseWake(){try{R.wake&&R.wake.release();}catch(e){}R.wake=null;}
async function openReader(resume){
  const text=ta.value;if(!text.trim())return;
  let doc;
  if(text.length>500000){ // batch segmentation with progress
    $('startBtn').disabled=true;const parts=text.split(/\n/);const items=[],sents=[];let done=0;const lang=detectLang(text.slice(0,20000));
    for(let k=0;k<parts.length;k+=400){const sub=build(parts.slice(k,k+400).join('\n'),{chunk:prefs.chunk,lang});const off=items.length,soff=sents.length;
      sub.sents.forEach(s=>sents.push(s+off));sub.items.forEach(it=>{it.sent+=soff;items.push(it);});done+=400;
      $('startBtn').textContent='斷詞中 '+Math.min(100,Math.round(done/parts.length*100))+'%';await new Promise(r=>setTimeout(r,0));}
    $('startBtn').textContent='開始閱讀';$('startBtn').disabled=false;doc={items,sents,lang,units:items.reduce((a,b)=>a+b.units,0)};
  }else doc=build(text,{chunk:prefs.chunk});
  if(!doc.items.length){toast('沒有可閱讀的內容');return;}
  R.doc=doc;R.hash=fnv(text);R.speed=doc.lang==='zh'?prefs.speedZh:prefs.speedEn;R.playMs=0;R.startWall=performance.now();
  const p=progress[R.hash];let ri=0;
  if(resume&&p){if(p.u!=null){let u=0;while(ri<doc.items.length-1&&u+doc.items[ri].units<=p.u)u+=doc.items[ri++].units;}else ri=Math.min(p.i,doc.items.length-1);}
  R.i=ri;R.startI=R.i;
  word.style.setProperty('--fs',prefs.fontSize+'px');word.classList.toggle('orp',prefs.orp);
  $('rTitle').textContent=(src.title||'自訂文本')+'・'+doc.units.toLocaleString()+' '+unitName(doc.lang);
  $('reader').hidden=false;document.body.style.overflow='hidden';
  show(R.i);$('playBtn').textContent='開始';$('readyMsg').textContent='';$('ctx').hidden=true;updRInfo(true);
  $('stage').focus({preventScroll:true});
  play();
}
function closeReader(){pause();$('reader').hidden=true;document.body.style.overflow='';$('ctx').hidden=true;releaseWake();updInfo();$('startBtn').focus();}
$('startBtn').onclick=()=>openReader(false);
$('resumeBtn').onclick=()=>openReader(true);
$('exitBtn').onclick=closeReader;
$('playBtn').onclick=toggle;
$('prevSent').onclick=()=>jumpSent(-1);$('nextSent').onclick=()=>jumpSent(1);
$('slower').onclick=()=>adjSpeed(-25);$('faster').onclick=()=>adjSpeed(25);
/* gestures on stage */
const stage=$('stage');let gs=null;
stage.addEventListener('pointerdown',e=>{gs={x:e.clientX,y:e.clientY,ly:e.clientY,moved:false,id:e.pointerId};try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',e=>{if(!gs)return;const dx=e.clientX-gs.x,dy=e.clientY-gs.y;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(e.clientY-gs.ly)>=30){const steps=Math.trunc((gs.ly-e.clientY)/30);adjSpeed(steps*25);gs.ly-=steps*30;gs.moved=true;}
  if(Math.abs(dx)>10||Math.abs(dy)>10)gs.moved=true;});
stage.addEventListener('pointerup',e=>{if(!gs)return;const dx=e.clientX-gs.x,dy=e.clientY-gs.y;
  if(!gs.moved)toggle();else if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)jumpSent(dx<0?1:-1);gs=null;});
stage.addEventListener('pointercancel',()=>gs=null);
stage.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toggle();}});
document.addEventListener('keydown',e=>{
  if($('reader').hidden||!$('doneDlg').hidden)return;
  if(e.target.closest&&e.target.closest('button')&&e.key===' '&&e.target!==stage)return;
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowLeft'){e.preventDefault();jumpSent(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();jumpSent(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();adjSpeed(25);}
  else if(e.key==='ArrowDown'){e.preventDefault();adjSpeed(-25);}
  else if(e.key==='Escape'){e.preventDefault();closeReader();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.playing)pause();});

/* ---------- finish & quiz ---------- */
let result=null;
function finish(){
  R.playing=false;cancelAnimationFrame(R.raf);releaseWake();
  const d=R.doc;const readUnits=d.items.slice(R.startI).reduce((a,b)=>a+b.units,0);
  const dur=R.playMs;const wpm=dur>0?readUnits/(dur/60000):0;
  delete progress[R.hash];store.set('progress',progress);
  $('barFill').style.width='100%';
  result={date:Date.now(),words:readUnits,wpm:Math.round(wpm),duration:Math.round(dur/1000),score:null,title:src.title||'自訂文本',lang:d.lang};
  $('dWords').textContent=readUnits.toLocaleString();$('dWordsLab').textContent=d.lang==='zh'?'字數':'詞數';
  $('dTime').textContent=fmtTime(dur);$('dWpm').textContent=Math.round(wpm);$('dWpmLab').textContent='實際 '+unitName(d.lang)+'/分';
  const qb=$('quizBox');qb.textContent='';
  const b=src.builtin&&BUILTIN.find(x=>x.id===src.builtin&&x.text===ta.value);
  if(b){
    const ans=new Array(b.quiz.length).fill(-1);
    const h=document.createElement('p');h.style.cssText='margin:6px 0;color:var(--ink2);font-size:14px';h.textContent='理解小測：選好答案後按「記錄成績」。';qb.append(h);
    b.quiz.forEach((q,qi)=>{const box=document.createElement('div');box.className='qz';const p=document.createElement('p');p.textContent=(qi+1)+'. '+q.q;const o=document.createElement('div');o.className='opts';
      q.o.forEach((t,oi)=>{const bt=document.createElement('button');bt.type='button';bt.textContent=t;bt.id=`q${qi}o${oi}`;bt.setAttribute('aria-pressed','false');bt.onclick=()=>{if(result.graded)return;ans[qi]=oi;[...o.children].forEach((x,k)=>x.setAttribute('aria-pressed',k===oi));};o.append(bt);});
      box.append(p,o);qb.append(box);});
    result.grade=()=>{let c=0;b.quiz.forEach((q,qi)=>{const o=qb.querySelectorAll('.qz')[qi].querySelectorAll('button');o[q.a].classList.add('right');if(ans[qi]===q.a)c++;else if(ans[qi]>=0)o[ans[qi]].classList.add('wrong');});result.graded=true;return Math.round(c/b.quiz.length*100);};
  }else{
    const p=document.createElement('p');p.style.cssText='margin:6px 0;font-weight:600';p.textContent='自評理解程度（1 = 幾乎沒懂，5 = 完全理解）';
    const s=document.createElement('div');s.className='stars';let v=0;
    for(let k=1;k<=5;k++){const bt=document.createElement('button');bt.type='button';bt.textContent=k;bt.id='self'+k;bt.setAttribute('aria-pressed','false');bt.onclick=()=>{v=k;[...s.children].forEach((x,j)=>x.setAttribute('aria-pressed',j<k));};s.append(bt);}
    qb.append(p,s);result.grade=()=>v?v*20:null;
  }
  $('saveResult').textContent='記錄成績';$('saveResult').disabled=false;
  $('doneDlg').hidden=false;$('saveResult').focus();
}
$('saveResult').onclick=()=>{
  if(!result)return;
  if(result.saved){$('doneDlg').hidden=true;closeReader();return;}
  result.score=result.grade();const {grade,graded,...rec}=result;history.push(rec);if(history.length>200)history=history.slice(-200);store.set('history',history);
  result.saved=true;$('saveResult').textContent='完成';
  toast('已記錄'+(rec.score!=null?'，理解度 '+rec.score+'%':''));
  if(!src.builtin){$('doneDlg').hidden=true;closeReader();}
};
$('skipResult').onclick=()=>{$('doneDlg').hidden=true;result=null;closeReader();};

/* ---------- stats ---------- */
function openStats(){
  const lastLang=history.length?(history[history.length-1].lang||'zh'):'zh';
  const h=history.filter(x=>(x.lang||'zh')===lastLang).slice(-30);
  $('sN').textContent=history.length;
  $('chartTitle').textContent=`最近 ${h.length} 次${lastLang==='zh'?'中文（字/分）':'英文（詞/分）'}速度`;
  $('sAvg').textContent=h.length?Math.round(h.reduce((a,b)=>a+b.wpm,0)/h.length):'—';
  $('sAvgLab').textContent='平均速度（'+(lastLang==='zh'?'字':'詞')+'/分）';
  const sc=history.filter(x=>x.score!=null);$('sScore').textContent=sc.length?Math.round(sc.reduce((a,b)=>a+b.score,0)/sc.length)+'%':'—';
  const box=$('chartBox');box.textContent='';
  if(h.length<1){box.append(Object.assign(document.createElement('p'),{textContent:'還沒有紀錄。讀完一篇並按「記錄成績」後，這裡會畫出最近 30 次的速度變化。',style:'color:var(--ink3);font-size:14px'}));}
  else{
    const W=520,H=200,pl=40,pr=12,pt=14,pb=26;const max=Math.max(...h.map(x=>x.wpm)),min=Math.min(...h.map(x=>x.wpm));
    const lo=Math.max(0,Math.floor((min*0.85)/50)*50),hi=Math.ceil((max*1.1)/50)*50||50;
    const X=i=>pl+(h.length===1?(W-pl-pr)/2:(W-pl-pr)*i/(h.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/((hi-lo)||1));
    const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','chart');svg.setAttribute('role','img');
    svg.setAttribute('aria-label',`最近 ${h.length} 次閱讀速度，從 ${h[0].wpm} 到 ${h[h.length-1].wpm}`);
    const el=(t,a)=>{const x=document.createElementNS(ns,t);for(const k in a)x.setAttribute(k,a[k]);svg.append(x);return x;};
    for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;el('line',{x1:pl,x2:W-pr,y1:Y(v),y2:Y(v),class:'grid'});el('text',{x:pl-6,y:Y(v)+4,'text-anchor':'end'}).textContent=Math.round(v);}
    el('text',{x:pl,y:H-6}).textContent='較早';el('text',{x:W-pr,y:H-6,'text-anchor':'end'}).textContent='最近';
    el('polyline',{points:h.map((x,i)=>X(i).toFixed(1)+','+Y(x.wpm).toFixed(1)).join(' '),class:'ln'});
    const tip=document.createElement('div');tip.className='tip';tip.hidden=true;
    h.forEach((x,i)=>{el('circle',{cx:X(i),cy:Y(x.wpm),r:4,class:'pt'});const hit=el('circle',{cx:X(i),cy:Y(x.wpm),r:14,class:'hit',tabindex:0});
      const showTip=()=>{const r=svg.getBoundingClientRect(),k=r.width/W;tip.style.left=(X(i)*k)+'px';tip.style.top=(Y(x.wpm)*k)+'px';tip.textContent=`${new Date(x.date).toLocaleDateString('zh-TW')}・${x.wpm} ${unitName(x.lang||'zh')}/分${x.score!=null?'・理解 '+x.score+'%':''}`;tip.hidden=false;};
      hit.addEventListener('pointerenter',showTip);hit.addEventListener('focus',showTip);hit.addEventListener('pointerleave',()=>tip.hidden=true);hit.addEventListener('blur',()=>tip.hidden=true);hit.addEventListener('click',showTip);});
    box.append(svg,tip);
  }
  const hb=$('histBox');hb.textContent='';
  if(history.length){const t=document.createElement('table');t.className='hist';t.innerHTML='<thead><tr><th>日期</th><th>文本</th><th>速度</th><th>理解</th></tr></thead>';const tb=document.createElement('tbody');
    history.slice(-10).reverse().forEach(x=>{const tr=document.createElement('tr');[new Date(x.date).toLocaleDateString('zh-TW'),x.title,x.wpm+' '+unitName(x.lang||'zh')+'/分',x.score!=null?x.score+'%':'—'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});tb.append(tr);});
    t.append(tb);hb.append(t);}
  $('statsDlg').hidden=false;$('statsClose').focus();
}
$('statsBtn').onclick=openStats;$('statsClose').onclick=()=>{$('statsDlg').hidden=true;$('statsBtn').focus();};
$('clearHist').onclick=async()=>{if(!history.length)return;if(await confirmBox('清除紀錄','確定清除全部 '+history.length+' 筆閱讀紀錄？')){history=[];store.set('history',history);openStats();}};
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('libDlg').hidden)closeLib();else if(!$('statsDlg').hidden)$('statsClose').click();else if(!$('confirmDlg').hidden)$('cfNo').click();});

/* ---------- init ---------- */
const cur=store.get('current',null);
if(cur&&cur.t){loadText(cur.t,cur.title,cur.builtin);}else loadText(BUILTIN[0].text,BUILTIN[0].title,BUILTIN[0].id);
window.__sr={build,delayMs,factor,R,prefs,segWords,fmmSeg,forceFallback,get hasSeg(){return !!SEG},openReader,history:()=>history,BUILTIN};
})();
</script>
