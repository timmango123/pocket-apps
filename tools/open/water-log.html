if (!valid(data)) data = sample();
let theme = lsGet(TKEY, 'auto');
const applyTheme = () => theme === 'auto' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', theme);
applyTheme();
function prune() {
  const cut = new Date(); cut.setDate(cut.getDate() - 365); const ck = dayKey(cut.getTime());
  for (const k in data.days) if (k < ck || !data.days[k].length && k !== dayKey()) delete data.days[k];
}
prune();
const save = () => lsSet(KEY, data);

const S = () => data.settings;
const toUnit = ml => S().unit === 'oz' ? Math.round(ml / OZ) : Math.round(ml);
const fromUnit = v => S().unit === 'oz' ? Math.round(v * OZ) : Math.round(v);
const fmt = ml => toUnit(ml).toLocaleString('en-US') + ' ' + S().unit;
const total = k => (data.days[k] || []).reduce((a, e) => a + e.ml, 0);

/* ---------- wave ---------- */
const wave = $('#wave'), wave2 = $('#wave2'), waterG = $('#waterG');
let phase = 0, raf = 0, lastT = 0;
function wavePath(ph, amp) {
  let d = `M -10 ${Math.sin(ph) * amp}`;
  for (let x = -10; x <= 210; x += 10) d += ` L ${x} ${(Math.sin(ph + (x / 200) * Math.PI * 2) * amp).toFixed(2)}`;
  return d + ' L 210 260 L -10 260 Z';
}
function frame(t) {
  if (lastT) phase += (t - lastT) / 2000 * Math.PI * 2; lastT = t;
  wave.setAttribute('d', wavePath(phase, 4)); wave2.setAttribute('d', wavePath(-phase * .8 + 1.4, 3.2));
  raf = requestAnimationFrame(frame);
}
function startWave() { cancelAnimationFrame(raf); lastT = 0; if (reduce.matches || document.hidden) { wave.setAttribute('d', wavePath(0, 0)); wave2.setAttribute('d', wavePath(0, 0)); return; } raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else { startWave(); render(); checkRemind(); } });
reduce.addEventListener?.('change', startWave);

/* ---------- render ---------- */
let curDay = dayKey();
function levelY(ml) { const r = Math.min(ml / S().goal, 1); return 228 - r * 204; } // interior 24..228
function render() {
  curDay = dayKey();
  const k = curDay, tot = total(k), g = S().goal;
  const d = new Date();
  $('#dateLbl').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 星期${WD[d.getDay()]}`;
  waterG.style.transform = `translateY(${levelY(tot + (dragAdd || 0))}px)`;
  $('#amt').textContent = ''; $('#amt').append(toUnit(tot).toLocaleString('en-US') + ' ', el('small', { text: `/ ${toUnit(g).toLocaleString('en-US')} ${S().unit}` }));
  const pct = Math.round(tot / g * 100);
  $('#pct').textContent = pct + '%' + (pct >= 100 ? '　達標' : '');
  $('#cup').setAttribute('aria-label', `今日已喝 ${fmt(tot)}，目標 ${fmt(g)}，${pct}%`);
  const over = tot - g;
  $('#over').hidden = over <= 0; $('#over').textContent = `超標 +${fmt(over)}`;
  const drops = $('#drops'); drops.textContent = '';
  if (over > 0) for (const x of [70, 100, 130]) drops.append(svgEl('circle', { class: 'drop', cx: x, cy: -6, r: 4 }));
  // quick
  const q = $('#quick'); q.textContent = '';
  S().presets.forEach((ml, i) => q.append(el('button', { class: 'qb', id: 'q' + i, type: 'button', 'aria-label': `加入 ${fmt(ml)}`, onclick: () => add(ml) }, '+' + toUnit(ml), el('small', { text: S().unit }))));
  q.append(el('button', { class: 'qb custom', id: 'qCustom', type: 'button', onclick: openCustom }, '自訂', el('small', { text: S().unit })));
  // log
  const list = data.days[k] || [];
  const log = $('#log'); log.textContent = '';
  $('#logCount').textContent = list.length ? `${list.length} 筆` + (data.sample ? '・範例' : '') : '';
  if (!list.length) log.append(el('li', { class: 'empty', text: '今天還沒有紀錄，按上方按鈕加入第一杯。' }));
  list.slice().reverse().forEach(e => {
    const t = new Date(e.t);
    const row = el('div', { class: 'row' },
      el('span', { class: 'tm', text: `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` }),
      el('span', { class: 'ml', text: '＋' + fmt(e.ml) }),
      el('button', { class: 'del', type: 'button', 'aria-label': '刪除這筆', onclick: () => remove(e) }, '✕'));
    const li = el('li', null, el('div', { class: 'bgdel', 'aria-hidden': 'true', text: '刪除' }), row);
    swipeDelete(row, () => remove(e));
    log.append(li);
  });
  // week
  const wk = $('#week'); wk.textContent = '';
  const cap = 1.3; let sum = 0, hits = 0;
  for (let i = 6; i >= 0; i--) {
    const dd = new Date(); dd.setHours(12, 0, 0, 0); dd.setDate(dd.getDate() - i);
    const key = dayKey(dd.getTime()), v = total(key); sum += v; if (v >= g) hits++;
    const h = Math.min(v / g, cap) / cap * 100;
    wk.append(el('div', { class: 'bcol' + (i === 0 ? ' today' : ''), title: `${key} ${fmt(v)}` },
      el('span', { class: 'v', text: v ? (S().unit === 'oz' ? toUnit(v) : (v / 1000).toFixed(1) + 'L') : '' }),
      el('div', { class: 'bar' + (v >= g ? ' hit' : ''), style: `height:${h}%` }),
      el('span', { class: 'lab', text: i === 0 ? '今天' : `${dd.getMonth() + 1}/${dd.getDate()}` })));
  }
  const gl = el('div', { class: 'goal' }, el('span', { text: '目標' }));
  gl.style.bottom = `calc(22px + (100% - 22px) * ${(1 / cap).toFixed(4)})`;
  wk.append(gl);
  $('#weekSum').textContent = `達標 ${hits}/7 天・日均 ${fmt(Math.round(sum / 7))}`;
  // banners
  renderBanners();
}
const svgEl = (tag, attrs) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
let remindMsg = '';
function renderBanners() {
  const b = $('#banners'); b.textContent = '';
  if (remindMsg) b.append(el('div', { class: 'banner remind', role: 'status', id: 'remindBanner' }, el('span', { text: remindMsg }),
    el('button', { type: 'button', text: '喝了 ' + fmt(S().presets[1]), onclick: () => add(S().presets[1]) }),
    el('button', { type: 'button', text: '稍後', onclick: () => { remindMsg = ''; lastRemind = Date.now(); renderBanners(); } })));
  if (data.sample) b.append(el('div', { class: 'banner', id: 'sampleBanner' }, el('span', { text: '目前顯示的是範例紀錄。加入第一杯時會自動清除。' }),
    el('button', { type: 'button', text: '清除範例', onclick: clearSample })));
}
function clearSample() { data = { settings: data.settings, days: {} }; save(); render(); }

/* ---------- actions ---------- */
let undoTimer = 0;
function add(ml) {
  $('#addErr').textContent = '';
  ml = Math.round(ml);
  if (!(ml >= 10 && ml <= 2000)) { $('#addErr').textContent = `單筆需介於 ${fmt(10)}～${fmt(2000)}。`; return false; }
  if (data.sample) { data = { settings: data.settings, days: {} }; }
  const k = dayKey(); const list = data.days[k] || (data.days[k] = []);
  if (list.length >= 100) { $('#addErr').textContent = '一天最多 100 筆。'; return false; }
  const e = { t: Date.now(), ml }; list.push(e);
  save(); remindMsg = ''; lastRemind = 0; render();
  showToast(`已加入 ${fmt(ml)}`, () => { const l = data.days[k]; const i = l ? l.indexOf(e) : -1; if (i >= 0) { l.splice(i, 1); save(); render(); } });
  return true;
}
function remove(e) {
  const k = dayKey(e.t), l = data.days[k]; if (!l) return; const i = l.indexOf(e); if (i < 0) return;
  l.splice(i, 1); save(); render();
  showToast(`已刪除 ${fmt(e.ml)}`, () => { l.splice(i, 0, e); data.days[k] = l; save(); render(); });
}
function showToast(msg, undo) {
  document.querySelectorAll('.toast').forEach(t => t.remove()); clearTimeout(undoTimer);
  const t = el('div', { class: 'toast', role: 'status' }, el('span', { text: msg }));
  if (undo) t.append(el('button', { type: 'button', id: 'undoBtn', text: '復原', onclick: () => { undo(); t.remove(); } }));
  document.body.append(t); undoTimer = setTimeout(() => t.remove(), 5000);
}
function openCustom() { $('#customRow').hidden = false; $('#customIn').value = ''; $('#customIn').placeholder = `容量（${S().unit}）`; $('#customIn').focus(); }
$('#customCancel').onclick = () => { $('#customRow').hidden = true; $('#addErr').textContent = ''; };
const doCustom = () => { const v = Number($('#customIn').value); if (!v) { $('#addErr').textContent = '請輸入容量。'; return; } if (add(fromUnit(v))) $('#customRow').hidden = true; };
$('#customAdd').onclick = doCustom;
$('#customIn').addEventListener('keydown', e => { if (e.key === 'Enter') doCustom(); });

function swipeDelete(row, onDel) {
  let sx = 0, sy = 0, dx = 0, on = false, locked = null;
  row.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; dx = 0; on = true; locked = null; });
  row.addEventListener('pointermove', e => {
    if (!on) return; const mx = e.clientX - sx, my = e.clientY - sy;
    if (locked == null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if (locked === 'x') { row.setPointerCapture(e.pointerId); row.classList.add('dragging'); } }
    if (locked === 'x') { dx = Math.min(0, mx); row.style.transform = `translateX(${dx}px)`; }
  });
  const end = () => { if (!on) return; on = false; row.classList.remove('dragging'); if (locked === 'x' && dx < -90) { row.style.transform = 'translateX(-110%)'; setTimeout(onDel, 160); } else row.style.transform = ''; };
  row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
}

/* cup swipe-up: +50 ml per 24px */
let dragAdd = 0;
(() => {
  const cup = $('#cup'); let sy = null, pid = null;
  cup.addEventListener('pointerdown', e => { sy = e.clientY; pid = e.pointerId; dragAdd = 0; cup.setPointerCapture(e.pointerId); });
  cup.addEventListener('pointermove', e => {
    if (sy == null || e.pointerId !== pid) return;
    const steps = Math.max(0, Math.min(40, Math.floor((sy - e.clientY) / 24)));
    const v = steps * 50; if (v === dragAdd) return; dragAdd = v;
    $('#dragLbl').hidden = !v; $('#dragLbl').textContent = '+' + fmt(v);
    waterG.style.transform = `translateY(${levelY(total(dayKey()) + v)}px)`;
  });
  const end = e => { if (sy == null) return; sy = null; const v = dragAdd; dragAdd = 0; $('#dragLbl').hidden = true; if (v >= 50) add(v); else render(); };
  cup.addEventListener('pointerup', end); cup.addEventListener('pointercancel', () => { sy = null; dragAdd = 0; $('#dragLbl').hidden = true; render(); });
})();

/* ---------- reminders (in-page only) ---------- */
let lastRemind = 0, remTimer = 0;
const hm = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
function checkRemind() {
  clearTimeout(remTimer);
  if (dayKey() !== curDay) render();
  const r = S().remind;
  if (r && r.on) {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    const inWin = mins >= hm(r.from) && mins < hm(r.to);
    const list = data.days[dayKey()] || [];
    const last = list.length ? Math.max(...list.map(e => e.t)) : (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() + hm(r.from) * 60000; })();
    const gap = Date.now() - Math.max(last, lastRemind), every = r.every * 60000;
    if (inWin && !remindMsg && gap >= every) {
      const since = Math.round((Date.now() - last) / 60000);
      remindMsg = list.length ? `該喝水了，距離上一杯已經 ${since >= 60 ? Math.floor(since / 60) + ' 小時 ' + (since % 60) + ' 分' : since + ' 分鐘'}。` : '該喝水了，今天還沒喝第一杯。';
      lastRemind = Date.now();
      try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
      renderBanners();
    }
  }
  remTimer = setTimeout(checkRemind, 30000);
}

/* ---------- settings ---------- */
let dl = null;
(async () => { try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; } if (dl) $('#expDl').hidden = false; })();
let draftUnit = 'ml', draftTheme = 'auto';
function fillSettings() {
  const s = S(); draftUnit = s.unit; draftTheme = theme;
  $('#setErr').textContent = ''; $('#expText').hidden = true;
  setUnitInputs(s.goal, s.presets);
  $('#remOn').checked = !!s.remind.on; $('#remEvery').value = String(s.remind.every); $('#remFrom').value = s.remind.from; $('#remTo').value = s.remind.to;
  segState();
}
function setUnitInputs(goalMl, presetsMl) {
  const cv = ml => draftUnit === 'oz' ? Math.round(ml / OZ) : ml;
  $('#goalIn').value = cv(goalMl); presetsMl.forEach((v, i) => $('#pre' + i).value = cv(v));
  document.querySelectorAll('.unitTxt').forEach(x => x.textContent = draftUnit);
}
function readMl(id) { const v = Number($(id).value); if (!Number.isFinite(v) || v <= 0) return NaN; return draftUnit === 'oz' ? Math.round(v * OZ) : Math.round(v); }
function segState() {
  document.querySelectorAll('#unitSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === draftUnit)));
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === draftTheme)));
}
document.querySelectorAll('#unitSeg button').forEach(b => b.onclick = () => {
  if (b.dataset.u === draftUnit) return;
  // keep the exact ml values when the inputs are untouched-equivalent
  const prev = draftUnit, s = S();
  const back = id => { const v = Number($(id).value); return prev === 'oz' ? Math.round(v * OZ) : v; };
  const keep = (id, orig) => { const shown = prev === 'oz' ? Math.round(orig / OZ) : orig; return Number($(id).value) === shown ? orig : back(id); };
  const g = keep('#goalIn', s.goal), p = [0, 1, 2, 3].map(i => keep('#pre' + i, s.presets[i]));
  draftUnit = b.dataset.u; setUnitInputs(g, p); segState();
});
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => { draftTheme = b.dataset.t; theme = draftTheme; lsSet(TKEY, theme); applyTheme(); segState(); });
$('#kgApply').onclick = () => {
  const kg = Number($('#kgIn').value);
  if (!(kg >= 20 && kg <= 300)) { $('#setErr').textContent = '請輸入 20～300 kg 的體重。'; return; }
  const ml = Math.min(6000, Math.max(500, Math.round(kg * 30 / 50) * 50));
  $('#setErr').textContent = ''; $('#goalIn').value = draftUnit === 'oz' ? Math.round(ml / OZ) : ml;
  $('#goalIn').dataset.exact = ml;
};
$('#goalIn').addEventListener('input', () => { delete $('#goalIn').dataset.exact; });
$('#openSet').onclick = () => { fillSettings(); $('#setDlg').showModal(); };
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); }));
$('#setSave').onclick = () => {
  const s = S(), err = m => { $('#setErr').textContent = m; };
  const keep = (id, orig) => { const shown = draftUnit === 'oz' ? Math.round(orig / OZ) : orig; return Number($(id).value) === shown ? orig : readMl(id); };
  let goal = $('#goalIn').dataset.exact ? Number($('#goalIn').dataset.exact) : keep('#goalIn', s.goal);
  if (!(goal >= 500 && goal <= 6000)) return err('每日目標需介於 500～6,000 ml（約 17～203 oz）。');
  const pre = [0, 1, 2, 3].map(i => keep('#pre' + i, s.presets[i]));
  if (pre.some(v => !(v >= 10 && v <= 2000))) return err('快速按鈕容量需介於 10～2,000 ml。');
  const from = $('#remFrom').value || '09:00', to = $('#remTo').value || '21:00';
  if (hm(from) >= hm(to)) return err('提醒的結束時間要晚於開始時間。');
  data.settings = { goal, unit: draftUnit, presets: pre, remind: { on: $('#remOn').checked, every: Number($('#remEvery').value), from, to } };
  save(); lastRemind = 0; remindMsg = ''; $('#setDlg').close(); render(); checkRemind();
};
const exportStr = () => JSON.stringify({ app: 'water-log', version: 1, exportedAt: new Date().toISOString(), data: { settings: data.settings, days: data.days } }, null, 1);
$('#expDl').onclick = async () => {
  try { await dl.save({ filename: `water-log-${dayKey()}.json`, data: exportStr() }); $('#setErr').textContent = ''; }
  catch (e) { if (!/declin/i.test(String(e && (e.message || e)))) $('#setErr').textContent = '下載失敗，請改用複製。'; }
};
$('#expCopy').onclick = () => {
  const s = exportStr();
  const fallback = () => { const t = $('#expText'); t.hidden = false; t.value = s; t.focus(); t.select(); $('#setErr').textContent = '無法自動複製，已選取下方文字，請手動複製。'; };
  try { navigator.clipboard.writeText(s).then(() => { $('#setErr').textContent = ''; showToast('已複製備份 JSON'); }, fallback); } catch (e) { fallback(); }
};
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async () => {
  const f = $('#impFile').files[0]; $('#impFile').value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const d = j && j.data ? j.data : j;
    if (!valid(d)) throw new Error('bad');
    data = { settings: d.settings, days: d.days }; prune(); save(); $('#setDlg').close(); render(); showToast('已匯入備份');
  } catch (e) { $('#setErr').textContent = '檔案格式不正確，未變更現有資料。'; }
};

window.__wl = { levelY, toUnit, fromUnit, total, get data() { return data; }, OZ, checkRemind };
render(); startWave(); checkRemind();
})();
</script>
</body></html>
