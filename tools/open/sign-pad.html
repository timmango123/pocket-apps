<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --paper:#f4f4f1; --paper-edge:#3a423b; --guide:#c4c9d2; --guide-ink:#9aa1ad; --danger:#ff9c94; --danger-soft:#3e1f1d;
  --check-a:#262c27; --check-b:#1d221e;
  --shadow:0 12px 30px -12px rgba(0,0,0,.7); --pop:0 14px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1d221e; --sunk:#181c19; --ink:#e4e8e3; --muted:#a1aaa1; --faint:#737c74;
  --line:#2e352f; --line-strong:#434c44; --accent:#a9bff0; --accent-ink:#0f1a33; --accent-soft:#25304a;
  --paper:#f4f4f1; --paper-edge:#3a423b; --guide:#c4c9d2; --guide-ink:#9aa1ad; --danger:#ff9c94; --danger-soft:#3e1f1d;
  --check-a:#262c27; --check-b:#1d221e;

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:0 calc(28px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;min-height:60px}
h1{flex:1;margin:0;font:700 22px/1.2 var(--serif);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;flex:none}

.stage{position:relative}

.tg input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px;flex:none}

.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}

legend{font:700 16px var(--serif);letter-spacing:.1em;padding:0 10px 0 0}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (min-width:640px){.outs{grid-template-columns:repeat(4,1fr)}}
.hint{font-size:12px;color:var(--faint);margin:8px 2px 0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(380px,100%);height:100%;background:var(--surface);box-shadow:var(--pop);display:flex;flex-direction:column;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.drawer header h2{flex:1;margin:0;font:700 18px var(--serif);letter-spacing:.08em}
.list{flex:1;overflow:auto;margin:0 -4px;padding:0 4px;display:grid;gap:10px;align-content:start}
.item{border:1px solid var(--line);border-radius:4px;background:var(--sunk);display:grid;grid-template-columns:1fr auto;gap:0}
.item img{grid-column:1/-1;width:100%;aspect-ratio:1000/600;object-fit:contain;background:var(--paper);border-bottom:1px solid var(--line);border-radius:4px 4px 0 0;display:block}
.item .meta{padding:6px 10px;font-size:13px;min-width:0}
.item .meta b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta span{color:var(--faint);font-size:12px}
.item .acts{display:flex;align-items:center;gap:4px;padding:4px}
.empty{color:var(--faint);font-size:14px;padding:20px 4px}
.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger-soft);border-color:var(--danger)}

.big-on{overflow:hidden}
.stage.big{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:8px}
.stage.big .sheet{max-height:none;flex:none}
.bigbar{display:none;gap:8px;flex:none}
.stage.big .bigbar{display:flex}
.rot{display:none;font-size:13px;color:var(--muted);text-align:center}
.stage.big .rot{display:block}
@media (orientation:landscape){.stage.big .rot{display:none}}
/* preview */
.pv{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pv .box{background:var(--surface);border-radius:6px;box-shadow:var(--pop);padding:14px;max-width:min(640px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.pv img{max-width:100%;height:auto;background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/16px 16px;border:1px solid var(--line);justify-self:center;-webkit-touch-callout:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:22px;font-size:14px;box-shadow:var(--pop);max-width:calc(100vw - 32px)}
@media (hover:hover){.ib:hover,.btn:hover:not(:disabled),.sw:hover{border-color:var(--accent)}.sheet .x:hover{color:var(--danger)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = "sign-pad:v1:";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
};
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }

/* ---- board geometry: strokes live in a fixed 1000×600 board, stored normalised 0–1 ---- */
const BW = 1000, BH = 600, U = 2.5;           // U: board units per reference CSS px (board ≈ 400 px wide)
const CFG = { minF: 0.5, maxF: 1.6, k: 1.2, alpha: 0.7, maxStep: 0.10, minDist: 1.2, pxPerUnit1x: 0.6 };

let theme = LS.get("theme", "auto");
function applyTheme() { if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; }
applyTheme();
$("themeBtn").addEventListener("click", () => {
  const sys = matchMedia("(prefers-color-scheme: dark)").matches, now = theme === "dark" || (theme === "auto" && sys);
  theme = now ? "light" : "dark"; if ((theme === "dark") === sys) theme = "auto"; applyTheme(); LS.set("theme", theme);
});

let prefs = Object.assign({ color: "#1b2a5e", bw: 2.5, pressure: true, crop: true, margin: true, scale: 2, custom: "#2e7d32" }, LS.get("prefs", {}));
const savePrefs = () => LS.set("prefs", prefs);

let strokes = [];            // [{color, bw, points:[{x,y,t,p,w}]}]  x,y normalised; w in board units
let undoStack = [], redoStack = [];
function commit(next) { undoStack.push(strokes); if (undoStack.length > 100) undoStack.shift(); redoStack = []; strokes = next; changed(); }
function changed() {
  const has = strokes.length > 0;
  $("ph").style.opacity = has || cur ? 0 : 1;
  for (const id of ["pngBtn", "svgBtn", "showBtn", "copySvgBtn", "copyImgBtn", "saveBtn", "clearBtn", "recolorBtn"]) $(id).disabled = !has;
  $("undoBtn").disabled = $("bUndo").disabled = !undoStack.length; $("redoBtn").disabled = $("bRedo").disabled = !redoStack.length;
  $("cnt").textContent = strokes.length + " 筆畫";
  redraw();
}

/* ---- canvas sizing (DPR-sharp) ---- */
const cv = $("cv"), sheet = $("sheet"); let ctx = cv.getContext("2d"), scale = 1, dpr = 1;
function resize() {
  const r = sheet.getBoundingClientRect(); if (!r.width) return;
  dpr = Math.min(3, window.devicePixelRatio || 1); scale = r.width / BW;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); redraw();

new ResizeObserver(resize).observe(sheet);

/* ---- stroke geometry shared by canvas and SVG ---- */
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, w: (a.w + b.w) / 2 });
function P(pt) { return { x: pt.x * BW, y: pt.y * BH, w: pt.w }; }
// Segment i of a stroke as {a, c, b} (quadratic, c may be null for straight) in board units with widths.
function segCount(n) { return n < 2 ? 0 : n === 2 ? 1 : n; }
function segment(pts, i) {
  const n = pts.length;
  if (n === 2) return { a: P(pts[0]), c: null, b: P(pts[1]) };
  if (i === 0) return { a: P(pts[0]), c: null, b: mid(P(pts[0]), P(pts[1])) };
  if (i === n - 1) return { a: mid(P(pts[n - 2]), P(pts[n - 1])), c: null, b: P(pts[n - 1]) };

}
function sampleSeg(s) {
  const len = s.c ? Math.hypot(s.c.x - s.a.x, s.c.y - s.a.y) + Math.hypot(s.b.x - s.c.x, s.b.y - s.c.y) : Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y);

    else out.push({ x: u * s.a.x + t * s.b.x, y: u * s.a.y + t * s.b.y, w: u * s.a.w + t * s.b.w });

}
// Outline polygon (left side forward, right side back) + round caps; filled with nonzero rule.

  }

  path.circle(S[0].x, S[0].y, S[0].w / 2); path.circle(S[S.length - 1].x, S[S.length - 1].y, S[S.length - 1].w / 2);
}
function canvasPath(c) {
  return {
    poly(pts) { c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); },

}
function drawSeg(c, st, i) {
  c.fillStyle = st.color; c.beginPath();
  const pts = st.points;
  if (pts.length === 1) { const p = P(pts[0]); canvasPath(c).circle(p.x, p.y, p.w / 2); }

function drawStroke(c, st) { const n = st.points.length; if (n === 1) drawSeg(c, st, 0); else for (let i = 0; i < segCount(n); i++) drawSeg(c, st, i); }
function redraw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  for (const s of strokes) drawStroke(ctx, s);
  if (cur && cur.points.length > 1) for (let i = 0; i < segCount(cur.points.length) - 1; i++) drawSeg(ctx, cur, i);
}

/* ---- input ---- */
let cur = null, curId = null, vEma = 0, lastW = 0, usePen = false;
function toBoard(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
function addPoint(e, force) {
  const b = toBoard(e), t = e.timeStamp || performance.now(), pts = cur.points, last = pts[pts.length - 1];
  const bw = cur.bw * U, minW = bw * CFG.minF, maxW = bw * CFG.maxF;
  if (last) {

    if (dist < 0.01) return false;

  pts.push({ x: +b.x.toFixed(5), y: +b.y.toFixed(5), t: Math.round(t), p: +(e.pressure || 0).toFixed(3), w: +w.toFixed(3) });

cv.addEventListener("pointerdown", e => {

  cur = { color: prefs.color, bw: prefs.bw, points: [] }; vEma = 0; usePen = false; addPoint(e, true);
  $("ph").style.opacity = 0;
});
cv.addEventListener("pointermove", e => {
  if (!cur || e.pointerId !== curId) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; const list = evs.length ? evs : [e];
  for (const ev of list) {
    if (addPoint(ev)) {
      const n = cur.points.length; if (n >= 3) { ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0); drawSeg(ctx, cur, n - 2); }
      else if (n === 2) { ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0); drawSeg(ctx, { ...cur, points: cur.points }, 0); }

});
function finish(e) {
  if (!cur || e.pointerId !== curId) return;

  const st = cur; cur = null; curId = null;
  if (st.points.length) commit(strokes.concat([st])); else changed();
}
cv.addEventListener("pointerup", finish); cv.addEventListener("pointercancel", finish);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ---- undo / redo / clear ---- */
function undo() { if (!undoStack.length) return; redoStack.push(strokes); strokes = undoStack.pop(); changed(); }
function redo() { if (!redoStack.length) return; undoStack.push(strokes); strokes = redoStack.pop(); changed(); }
function clearAll() { if (strokes.length) { commit([]); toast("已清空，可按復原找回"); } }
$("undoBtn").onclick = $("bUndo").onclick = undo; $("redoBtn").onclick = $("bRedo").onclick = redo;
$("clearBtn").onclick = $("bClear").onclick = $("xBtn").onclick = clearAll;
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if (e.key === "Escape") { closeDrawer(); $("pv").hidden = true; if (stage.classList.contains("big")) exitBig(); }
});

/* ---- pen settings ---- */
function syncPen() {
  for (const b of document.querySelectorAll("[data-c]")) b.setAttribute("aria-pressed", String(b.dataset.c === prefs.color));
  const isCustom = ![...document.querySelectorAll("[data-c]")].some(b => b.dataset.c === prefs.color);
  $("c-custom-wrap").setAttribute("aria-pressed", String(isCustom)); if (isCustom) $("customDot").style.background = prefs.color;
  $("c-custom").value = prefs.custom;
  for (const b of document.querySelectorAll("[data-w]")) b.setAttribute("aria-pressed", String(+b.dataset.w === prefs.bw));
  $("pressure").checked = prefs.pressure; $("optCrop").checked = prefs.crop; $("optMargin").checked = prefs.margin;
  for (const b of document.querySelectorAll("[data-s]")) b.setAttribute("aria-pressed", String(+b.dataset.s === prefs.scale));
}
syncPen();
for (const b of document.querySelectorAll("[data-c]")) b.onclick = () => { prefs.color = b.dataset.c; savePrefs(); syncPen(); };
$("c-custom").addEventListener("input", e => { prefs.color = prefs.custom = e.target.value; savePrefs(); syncPen(); });
$("c-custom").addEventListener("click", () => { prefs.color = prefs.custom; savePrefs(); syncPen(); });
for (const b of document.querySelectorAll("[data-w]")) b.onclick = () => { prefs.bw = +b.dataset.w; savePrefs(); syncPen(); };
for (const b of document.querySelectorAll("[data-s]")) b.onclick = () => { prefs.scale = +b.dataset.s; savePrefs(); syncPen(); };
$("pressure").onchange = e => { prefs.pressure = e.target.checked; savePrefs(); };
$("optCrop").onchange = e => { prefs.crop = e.target.checked; savePrefs(); };
$("optMargin").onchange = e => { prefs.margin = e.target.checked; savePrefs(); };
$("recolorBtn").onclick = () => { if (!strokes.length) return; commit(strokes.map(s => ({ ...s, color: prefs.color }))); toast("已把全部筆畫換成目前顏色"); };

/* ---- export ---- */
function bounds(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of list) for (const p of s.points) { const r = p.w / 2 + 1, x = p.x * BW, y = p.y * BH; x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); }
  return { x0, y0, x1, y1 };
}
function frame(list = strokes) {
  const k = CFG.pxPerUnit1x * prefs.scale;                 // output px per board unit
  let b = prefs.crop ? bounds(list) : { x0: 0, y0: 0, x1: BW, y1: BH };
  const m = prefs.margin ? 16 / k : 0;
  b = { x0: b.x0 - m, y0: b.y0 - m, x1: b.x1 + m, y1: b.y1 + m };
  return { b, k, W: Math.max(1, Math.round((b.x1 - b.x0) * k)), H: Math.max(1, Math.round((b.y1 - b.y0) * k)) };
}
function renderPNG(list = strokes) {
  const f = frame(list), c = document.createElement("canvas"); c.width = f.W; c.height = f.H;
  const g = c.getContext("2d"); g.setTransform(f.k, 0, 0, f.k, -f.b.x0 * f.k, -f.b.y0 * f.k);
  for (const s of list) drawStroke(g, s);
  return c;
}
const pngBlob = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/png"));
function renderSVG(list = strokes) {
  const f = frame(list), r = n => +n.toFixed(1);
  let body = "";
  for (const s of list) {
    let d = "";
    const sp = { poly(pts) { d += "M" + pts.map(p => r(p[0]) + " " + r(p[1])).join("L") + "Z"; }, circle(x, y, rr) { rr = r(rr); d += `M${r(x - rr)} ${r(y)}a${rr} ${rr} 0 1 1 ${r(2 * rr)} 0a${rr} ${rr} 0 1 1 ${r(-2 * rr)} 0Z`; } };
    const n = s.points.length;
    if (n === 1) { const p = P(s.points[0]); sp.circle(p.x, p.y, p.w / 2); }
    else { let S = []; for (let i = 0; i < segCount(n); i++) { const ss = sampleSeg(segment(s.points, i)); S = S.length ? S.concat(ss.slice(1)) : ss; } outline(S, sp); }
    body += `<path fill="${s.color}" d="${d}"/>`;
  }

}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
let DL = null;
(async () => {
  try { DL = await window.claude?.use?.("downloads"); } catch { DL = null; }
  $("pngBtn").hidden = $("svgBtn").hidden = !DL; $("showBtn").hidden = $("copySvgBtn").hidden = !!DL;
  if (DL) $("outHint").textContent = "輸出為透明背景 PNG 或可縮放的 SVG。";
})();
async function save(filename, data) {
  try { await DL.save({ filename, data }); toast("已送出下載"); }
  catch (e) { if (!/declin|cancel|denied/i.test(String(e && (e.message || e.name)))) toast("下載失敗"); }
}
$("pngBtn").onclick = async () => { if (DL && strokes.length) save(`signature-${stamp()}.png`, await pngBlob(renderPNG())); };
$("svgBtn").onclick = () => { if (DL && strokes.length) save(`signature-${stamp()}.svg`, renderSVG()); };
$("showBtn").onclick = () => { if (!strokes.length) return; $("pvImg").src = renderPNG().toDataURL("image/png"); $("pv").hidden = false; $("pvClose").focus(); };
$("pvClose").onclick = () => $("pv").hidden = true;
$("pv").addEventListener("click", e => { if (e.target === $("pv")) $("pv").hidden = true; });
$("copySvgBtn").onclick = async () => {
  const s = renderSVG();
  try { await navigator.clipboard.writeText(s); toast("已複製 SVG 程式碼"); }
  catch { const ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0;top:0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); toast(ok ? "已複製 SVG 程式碼" : "無法存取剪貼簿"); }
};
const canCopyImg = typeof ClipboardItem !== "undefined" && !!navigator.clipboard?.write;
$("copyImgBtn").hidden = !canCopyImg;
$("copyImgBtn").onclick = async () => {
  if (!strokes.length) return;
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob(renderPNG()) })]); toast("已複製簽名圖片"); }
  catch { toast("這個環境不允許複製圖片，請改用其他輸出方式"); }
};

/* ---- my signatures ---- */
function sampleSig() {
  // A procedurally generated cursive flourish, so the drawer opens with something to try.
  const mk = (fn, n, dur, color = "#1b2a5e", bw = 2.5) => {
    const st = { color, bw, points: [] }; let ve = 0, lw = 0, last = null;
    for (let i = 0; i <= n; i++) {
      const u = i / n, ease = 0.5 - 0.5 * Math.cos(Math.PI * u), [x, y] = fn(u), t = Math.round(ease * dur);
      const minW = bw * U * CFG.minF, maxW = bw * U * CFG.maxF; let w;
      if (last) { const d = Math.hypot((x - last.x) * BW, (y - last.y) * BH), v = d / U / Math.max(1, t - last.t); ve = CFG.alpha * v + (1 - CFG.alpha) * ve; w = Math.max(minW, maxW - ve * CFG.k * U); w = Math.min(lw * 1.1, Math.max(lw * 0.9, w)); }
      else w = (minW + maxW) / 2;
      lw = w; last = { x, y, t }; st.points.push({ x: +x.toFixed(5), y: +y.toFixed(5), t, p: 0, w: +w.toFixed(3) });
    }
    return st;
  };
  const a = mk(u => { const th = u * Math.PI * 2 * 4.2; return [0.14 + 0.62 * u + 0.045 * Math.cos(th), 0.56 - 0.17 * Math.sin(th) * (0.6 + 0.4 * Math.sin(u * 3)) - 0.05 * u]; }, 220, 1900);
  const b = mk(u => [0.12 + 0.74 * u, 0.74 - 0.05 * Math.sin(u * Math.PI) + 0.02 * u], 60, 420);
  const c = mk(() => [0.8, 0.43], 0, 0);
  return [a, b, c];
}
let saved = LS.get("saved", null);
if (!Array.isArray(saved)) { saved = [{ id: "sample", name: "範例簽名", at: Date.now(), strokes: sampleSig() }]; }
function persistSaved() { if (!LS.set("saved", saved)) toast("無法寫入本機儲存空間，重新整理後會遺失"); }
function thumb(list) {
  const c = document.createElement("canvas"); c.width = 500; c.height = 300; const g = c.getContext("2d");
  g.setTransform(0.5, 0, 0, 0.5, 0, 0); for (const s of list) drawStroke(g, s); return c.toDataURL("image/png");
}
function renderList() {
  const L = $("list"); L.innerHTML = "";
  if (!saved.length) { L.innerHTML = '<p class="empty">還沒有已存的簽名。寫好後按「存成我的簽名」。</p>'; }
  for (const s of saved) {
    const d = document.createElement("div"); d.className = "item";
    const img = new Image(); img.src = thumb(s.strokes); img.alt = s.name; d.appendChild(img);
    const m = document.createElement("div"); m.className = "meta"; const b = document.createElement("b"); b.textContent = s.name; const sp = document.createElement("span"); sp.textContent = new Date(s.at).toLocaleString("zh-TW", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); m.append(b, sp); d.appendChild(m);
    const a = document.createElement("div"); a.className = "acts";
    const ld = document.createElement("button"); ld.className = "btn pri"; ld.textContent = "載入"; ld.onclick = () => { commit(JSON.parse(JSON.stringify(s.strokes))); closeDrawer(); toast("已載入「" + s.name + "」，可換顏色後再輸出"); };
    const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "刪除"; del.setAttribute("aria-label", "刪除 " + s.name);
    del.onclick = () => { if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "確定刪除"; setTimeout(() => { del.classList.remove("armed"); del.textContent = "刪除"; }, 3000); return; } saved = saved.filter(x => x !== s); persistSaved(); renderList(); };
    a.append(ld, del); d.appendChild(a); L.appendChild(d);
  }
  $("wipeBtn").disabled = !saved.length;
}
let lastFocus = null;
function openDrawer() { lastFocus = document.activeElement; renderList(); $("drawer").hidden = false; $("dClose").focus(); }
function closeDrawer() { if ($("drawer").hidden) return; $("drawer").hidden = true; lastFocus?.focus?.(); }
$("savedBtn").onclick = openDrawer; $("dClose").onclick = closeDrawer;
$("drawer").addEventListener("click", e => { if (e.target === $("drawer")) closeDrawer(); });
$("wipeBtn").onclick = () => {
  const b = $("wipeBtn");
  if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "再按一次確認清除全部"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "清除所有已存簽名"; }, 3500); return; }
  saved = []; persistSaved(); b.classList.remove("armed"); b.textContent = "清除所有已存簽名"; renderList(); toast("已清除所有已存簽名");
};
$("saveBtn").onclick = () => {
  if (!strokes.length) return;
  const real = saved.filter(s => s.id !== "sample");
  if (real.length >= 10) { toast("最多存 10 個，請先在「我的簽名」刪除"); return; }
  const n = real.length + 1; saved = [{ id: Date.now().toString(36), name: "簽名 " + n, at: Date.now(), strokes: JSON.parse(JSON.stringify(strokes)) }].concat(saved);
  persistSaved(); toast("已存成「簽名 " + n + "」");
};

/* ---- big landscape canvas ---- */
const stage = $("stage");
function fitBig() {
  if (!stage.classList.contains("big")) { sheet.style.width = sheet.style.height = ""; return; }
  const bar = stage.querySelector(".bigbar").offsetHeight + 8 + (stage.querySelector(".rot").offsetHeight || 0) + 8;
  const aw = innerWidth - 24, ah = innerHeight - bar - 16, w = Math.min(aw, ah * BW / BH);
  sheet.style.width = Math.floor(w) + "px"; sheet.style.height = Math.floor(w * BH / BW) + "px";
}
async function enterBig() {
  stage.classList.add("big"); document.documentElement.classList.add("big-on"); fitBig();
  try { if (stage.requestFullscreen && !document.fullscreenElement) await stage.requestFullscreen(); await screen.orientation?.lock?.("landscape"); } catch { /* iframe / iOS: hint only */ }
  fitBig(); $("bDone").focus();
}
function exitBig() {
  stage.classList.remove("big"); document.documentElement.classList.remove("big-on"); fitBig();
  try { screen.orientation?.unlock?.(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
}
$("bigBtn").onclick = enterBig; $("bDone").onclick = exitBig;
addEventListener("resize", fitBig);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && stage.classList.contains("big")) fitBig(); });

changed();
window.__sp = { get strokes() { return strokes; }, renderPNG, renderSVG, bounds, frame, sampleSig, get prefs() { return prefs; }, undo, redo, commit, CFG, get saved() { return saved; } };
window.__spReady = true;
</script>
