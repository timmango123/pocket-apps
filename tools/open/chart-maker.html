<script>

const $ = id => document.getElementById(id);

const SAMPLE = '月份\t門市\t網路\n一月\t1,240\t860\n二月\t1,180\t990\n三月\t1,420\t1,210\n四月\t1,360\t1,480\n五月\t1,510\t1,620\n六月\t1,690\t1,950';

const saveData = () => { try { localStorage.setItem(KEY_DATA, text); } catch {} };

/* ---------- 解析 ---------- */
function parseNum(raw) {
  let s = String(raw).trim();
  if (!s) return { empty: true };
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1).trim(); }
  if (/^[-−–]/.test(s)) { neg = !neg; s = s.slice(1).trim(); } else if (s[0] === '+') s = s.slice(1).trim();
  s = s.replace(/^(NT\$|US\$|HK\$|NT|\$|＄|￥|¥|€|£|元)/i, '').replace(/(元|NTD|TWD)$/i, '').trim();

  s = s.replace(/[,，\s_]/g, '');

  return isFinite(v) ? { v, pct } : null;

  const out = []; let cur = '', q = false;

function parseData(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n').map((l, i) => ({ l, n: i + 1 })).filter(x => x.l.trim());
  const res = { labels: [], series: [], errors: [], delim: '', hasHeader: false, labelCol: false, pct: false };
  if (!lines.length) return res;
  let rows;
  if (lines.some(x => x.l.includes('\t'))) { res.delim = 'Tab'; rows = lines.map(x => x.l.split('\t')); }
  else if (lines.every(x => splitCSV(x.l).length >= 2) && (() => { const c = lines.map(x => splitCSV(x.l).length); return c.filter(v => v === c[0]).length >= c.length * 0.8; })()) { res.delim = '逗號'; rows = lines.map(x => splitCSV(x.l)); }
  else {
    res.delim = '空白'; rows = lines.map(x => x.l.trim().split(/\s+/));
    // 標籤含空白時，把多出的前段併成標籤
    const counts = rows.map(r => r.length).sort((a, b) => a - b), med = counts[Math.floor(counts.length / 2)];
    rows = rows.map(r => r.length > med && med >= 2 ? [r.slice(0, r.length - med + 1).join(' '), ...r.slice(r.length - med + 1)] : r);

  body.forEach((r, i) => {
    res.labels.push(res.labelCol ? (r[0] || `（空白）`) : String(i + 1));

}

/* ---------- 數字格式 ---------- */
function fmt(v, o = opts, compact = false) {

  let s;

    s = num(v / u, dec != null ? dec : compact ? undefined : 1, !compact) + n;

}

/* ---------- 刻度 ---------- */
function niceTicks(min, max, zero) {

  const range = max - min, base = Math.pow(10, Math.floor(Math.log10(range / 5)));

    if (!best || Math.abs(n - 5) < Math.abs(best.n - 5)) best = { step, lo, hi, n };

  const ticks = []; for (let i = 0; i <= best.n; i++) ticks.push(Number((best.lo + i * best.step).toPrecision(12)));

/* ---------- 文字量測 ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function tw(s, size, weight = 400) { mctx.font = `${weight} ${size}px ${FONT}`; return mctx.measureText(String(s)).width; }

const n2 = v => Math.round(v * 100) / 100;
// 依填色亮度選擇標籤文字顏色（深色或白色），確保對比
function onFill(hex) { const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); const L = .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; return 1.05 / (L + .05) >= (L + .05) / 0.065 ? '#ffffff' : '#16202a'; }

/* ---------- 繪圖 ---------- */
// render(type, data, opts, w, h, {mode, interactive}) → SVG 字串（內嵌樣式，不依賴頁面 CSS）
function render(type, d, o, W, H, env) {
  const M = MODES[env.mode], pal = PALETTES[o.palette] || PALETTES.default, colors = pal[env.mode];
  const fs = Math.max(12, Math.min(18, Math.round(Math.min(W, H) / 38)));
  const parts = [];
  const tip = t => env.interactive ? ` data-tip="${esc(t)}"` : '';
  const T = (x, y, s, a = {}) => `<text x="${n2(x)}" y="${n2(y)}"${a.anchor ? ` text-anchor="${a.anchor}"` : ''}${a.base ? ` dominant-baseline="${a.base}"` : ''} font-size="${a.size || fs}"${a.weight ? ` font-weight="${a.weight}"` : ''} fill="${a.fill || M.muted}"${a.rot ? ` transform="rotate(${a.rot} ${n2(x)} ${n2(y)})"` : ''}>${esc(s)}</text>`;
  const pad = Math.round(fs * 1.1);
  let top = pad, bottom = H - pad, left = pad, right = W - pad;
  const bg = o.bg === 'transparent' ? '' : `<rect width="${W}" height="${H}" fill="${o.bg === 'dark' ? MODES.dark.surface : MODES.light.surface}"/>`;
  // 標題
  if (o.title) { parts.push(T(left, top + fs * 1.3, clip(o.title, fs * 1.4, W - pad * 2), { size: Math.round(fs * 1.4), weight: 700, fill: M.ink })); top += fs * 1.95; }
  if (o.subtitle) { parts.push(T(left, top + fs * 1.05, clip(o.subtitle, fs, W - pad * 2), { fill: M.muted })); top += fs * 1.5; }
  if (o.title || o.subtitle) top += fs * 0.5;

  const isPie = type === 'pie' || type === 'donut';
  const emptyMsg = msg => { parts.push(`<rect x="${left}" y="${top}" width="${right - left}" height="${Math.max(10, bottom - top)}" rx="8" fill="none" stroke="${M.grid}" stroke-width="2" stroke-dasharray="6 6"/>`, T((left + right) / 2, (top + bottom) / 2, msg, { anchor: 'middle', base: 'middle', fill: M.muted })); return wrap(); };
  const wrap = () => `<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family='${FONT}'>${bg}${parts.join('')}</svg>`;
  const notes = env.notes;

  if (!d || !d.series.length || !d.labels.length) return emptyMsg('請貼上資料');

  // 系列（可見）
  const allSeries = d.series.map((s, i) => ({ ...s, i, color: colors[i % 8], dash: i >= 8 ? '6 4' : '' }));
  // 圖例
  let legendItems = [];
  if (isPie) legendItems = null; // 圓餅另外處理
  else if (type === 'scatter') legendItems = [];
  else if (allSeries.length > 1) legendItems = allSeries.map(s => ({ key: 's' + s.i, name: s.name, color: s.color, dash: s.dash, off: hidden.has('s' + s.i), line: type === 'line' }));

    const hit = env.interactive ? `<rect x="${n2(x - 4)}" y="${n2(y - sz * 0.5)}" width="${n2(w + 8)}" height="${n2(sz * 1.9)}" fill="transparent"/>` : '';

  /* ----- 圓餅／甜甜圈 ----- */

    if (excluded) notes.push(`圓餅圖只使用第一個系列「${s0.name}」；已排除 ${excluded} 個 0 或負值。`);
    else if (allSeries.length > 1) notes.push(`圓餅圖只使用第一個系列「${s0.name}」。`);
    if (!items.length) return emptyMsg('沒有正數，無法繪製圓餅圖');

    const legend = items.map(it => ({ key: it.key, name: it.name, color: it.color, off: hidden.has(it.key) }));
    let vis = items.filter(it => !hidden.has(it.key));
    let total = vis.reduce((a, b) => a + b.v, 0);
    if (o.merge && vis.length > 2) {

    }

    const cx = (left + right) / 2, availH = bottom - top, availW = right - left;

      for (let k = 1; k < list.length; k++) if (list[k].y - list[k - 1].y < fs * 1.25) list[k].y = list[k - 1].y + fs * 1.25;
      for (const x of list) {
        const px = cx + Math.cos(x.mid) * R, py = cy + Math.sin(x.mid) * R, ex = cx + Math.cos(x.mid) * (R + fs * 0.9), lx = cx + side * (R + fs * 1.6);
        parts.push(`<polyline points="${n2(px)},${n2(py)} ${n2(ex)},${n2(x.y)} ${n2(lx)},${n2(x.y)}" fill="none" stroke="${M.axis}" stroke-width="1"/>`);
        parts.push(T(lx + side * 4, x.y, x.pctTxt, { anchor: side > 0 ? 'start' : 'end', base: 'middle', fill: M.ink, size: Math.round(fs * 0.9) }));

    if (type === 'donut') {
      parts.push(T(cx, cy - fs * 0.35, fmt(total, o, true), { anchor: 'middle', base: 'middle', fill: M.ink, weight: 700, size: Math.round(Math.min(fs * 1.5, r0 * 0.45)) }));
      parts.push(T(cx, cy + fs * 0.95, '合計', { anchor: 'middle', base: 'middle', size: Math.round(fs * 0.85) }));

    if (o.labels) {

    }

    const yt = niceTicks(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)), o.zero);
    const ax = axesFrame(yt, null, xt, false, ss ? 19 : Math.max(5, fs * 0.36) + 2);
    const smax = ss ? Math.max(...pts.map(p => Math.abs(p.s || 0))) || 1 : 1;
    const col = colors[0];
    for (const p of pts) {
      const r = ss ? 4 + 14 * Math.sqrt(Math.abs(p.s || 0) / smax) : Math.max(4.5, fs * 0.36);
      parts.push(`<circle cx="${n2(ax.X(p.x))}" cy="${n2(ax.Y(p.y))}" r="${n2(r)}" fill="${col}" fill-opacity="${ss ? 0.7 : 0.9}" stroke="${M.surface}" stroke-width="1.5"${tip(`${d.labelCol ? p.lab + '\n' : ''}${sx.name}：${fmt(p.x)}\n${sy.name}：${fmt(p.y)}${ss ? `\n${ss.name}：${fmt(p.s)}` : ''}`)}/>`);
      if (o.labels && pts.length <= 30 && d.labelCol) parts.push(T(ax.X(p.x) + r + 3, ax.Y(p.y), clip(p.lab, Math.round(fs * 0.8), 120), { base: 'middle', size: Math.round(fs * 0.8), fill: M.muted }));

        if (env.interactive && h < 12) parts.push(`<rect x="${n2(c0)}" y="${n2(Math.min(v0, v1) - 8)}" width="${n2(barW)}" height="${n2(h + 16)}" fill="transparent"${tip(t)}/>`);
        if (o.labels) parts.push(T(c0 + barW / 2, v >= 0 ? v1 - 5 : v1 + lblSize + 3, fmt(v, o, true), { anchor: 'middle', size: lblSize, fill: M.ink }));

        const x = Math.min(v0, v1), w = Math.abs(v1 - v0);

        if (o.labels) parts.push(T(v >= 0 ? v1 + 5 : v1 - 5, c0 + barW / 2, fmt(v, o, true), { anchor: v >= 0 ? 'start' : 'end', base: 'middle', size: lblSize, fill: M.ink }));

      for (const s of vis) { const v = s.values[i]; if (v == null || v === 0) continue; const from = v > 0 ? pos : neg; const to = from + v; if (v > 0) pos = to; else neg = to; segs.push({ s, v, from, to }); }

        const dir = g === lastPos ? 'up' : g === lastNeg ? 'down' : 'none';
        parts.push(`<path d="${barPath(c0, y, barW, h, dir)}" fill="${g.s.color}"${tip(`${d.labels[i]}\n${g.s.name}：${fmt(g.v)}\n合計：${fmt(pos + neg)}`)}/>`);
        if (o.labels && h > lblSize + 4 && tw(fmt(g.v, o, true), lblSize) < barW - 4) parts.push(T(c0 + barW / 2, y + h / 2, fmt(g.v, o, true), { anchor: 'middle', base: 'middle', size: lblSize, fill: onFill(g.s.color), weight: 600 }));
      }
      if (o.labels && segs.length) parts.push(T(ax.C(i), ax.V(pos) - 5, fmt(pos + neg, o, true), { anchor: 'middle', size: lblSize, fill: M.ink, weight: 600 }));
    }
  } else { // line / area
    const showDots = n < 50;
    for (const s of vis) {
      const segsPts = []; let cur = [];
      for (let i = 0; i < n; i++) { const v = s.values[i]; if (v == null) { if (cur.length) segsPts.push(cur); cur = []; } else cur.push([ax.C(i), ax.V(v), i, v]); }
      if (cur.length) segsPts.push(cur);
      for (const sp of segsPts) {
        if (sp.length < 2) continue;
        const dLine = o.smooth ? monotonePath(sp) : 'M' + sp.map(p => `${n2(p[0])},${n2(p[1])}`).join('L');
        if (type === 'area') {
          const base = ax.V(Math.max(yt.lo, Math.min(0, yt.hi)));
          parts.push(`<path d="${dLine}L${n2(sp[sp.length - 1][0])},${n2(base)}L${n2(sp[0][0])},${n2(base)}Z" fill="${s.color}" fill-opacity="${vis.length > 1 ? 0.16 : 0.22}" stroke="none"/>`);
        }
        parts.push(`<path d="${dLine}" fill="none" stroke="${s.color}" stroke-width="${Math.max(2, fs / 7)}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`);
      }
      for (const sp of segsPts) for (const p of sp) {
        if (showDots || sp.length === 1) parts.push(`<circle cx="${n2(p[0])}" cy="${n2(p[1])}" r="${n2(Math.max(4, fs * 0.3))}" fill="${s.color}" stroke="${M.surface}" stroke-width="2"/>`);
        if (o.labels && n <= 24) parts.push(T(p[0], p[1] - fs * 0.6, fmt(p[3], o, true), { anchor: 'middle', size: lblSize, fill: M.ink }));
      }
    }
  }
  // 折線／面積：每個類別一條垂直感應帶，提示列出該類別所有系列
  if ((type === 'line' || type === 'area') && env.interactive) {
    for (let i = 0; i < n; i++) {
      const rows = vis.filter(s => s.values[i] != null).map(s => `${vis.length > 1 || allSeries.length > 1 ? s.name + '：' : ''}${fmt(s.values[i])}`);
      if (!rows.length) continue;
      parts.push(`<rect x="${n2(ax.C(i) - ax.band / 2)}" y="${n2(ax.top)}" width="${n2(ax.band)}" height="${n2(ax.bottom - ax.top)}" fill="transparent"${tip(d.labels[i] + '\n' + rows.join('\n'))}/>`);
    }
  }
  // 0 軸線放在最上層
  if (yt.lo < 0 && yt.hi > 0) {
    const z = ax.V(0);
    parts.push(horiz ? `<line x1="${n2(z)}" y1="${n2(ax.top)}" x2="${n2(z)}" y2="${n2(ax.bottom)}" stroke="${M.ink}" stroke-width="1.2"/>` : `<line x1="${n2(ax.left)}" y1="${n2(z)}" x2="${n2(ax.right)}" y2="${n2(z)}" stroke="${M.ink}" stroke-width="1.2"/>`);
  }
  return wrap();

  // 軸框：回傳座標換算函式。cats 為類別（長條／折線），xt 為數值 X（散佈）
  function axesFrame(yt, cats, xt, horizontal, inset = 0) {
    const ts = Math.round(fs * 0.85);
    const valueLabels = yt.ticks.map(v => fmt(v, o, true));
    const yTitleW = o.ytitle ? fs * 1.6 : 0, xTitleH = o.xtitle ? fs * 1.7 : 0;
    let L = left + yTitleW, B = bottom - xTitleH, R = right, Tt = top + fs * 0.4;
    let rot = false, catW = 0;
    if (!horizontal) {
      L += Math.max(...valueLabels.map(s => tw(s, ts))) + 8;
      if (cats) {
        const n = cats.length, band = (R - L) / n;
        const labels = cats.map(c => clip(c, ts, 140));
        const maxW = Math.max(...labels.map(s => tw(s, ts)));
        rot = n > 12 || maxW > band - 6;
        const step = rot ? Math.max(1, Math.ceil((ts * 1.25) / band)) : 1;
        B -= rot ? Math.min(maxW * 0.72 + ts, (bottom - top) * 0.35) : ts * 1.7;
        if (rot && maxW * 0.72 > (bottom - top) * 0.35 - ts) labels.forEach((s, i) => labels[i] = clip(s, ts, ((bottom - top) * 0.35 - ts) / 0.72));
        catW = band;
        const C = i => L + band * (i + 0.5);
        cats.forEach((c, i) => { if (i % step) return; parts.push(rot ? T(C(i) + ts * 0.3, B + ts * 0.9, labels[i], { anchor: 'end', size: ts, rot: -45 }) : T(C(i), B + ts * 1.3, labels[i], { anchor: 'middle', size: ts })); });
      } else {
        const xl = xt.ticks.map(v => fmt(v, o, true));
        B -= ts * 1.7;
        R -= Math.max(0, tw(xl[xl.length - 1], ts) / 2 - inset);
        xt.ticks.forEach((v, i) => { const x = L + inset + (v - xt.lo) / (xt.hi - xt.lo) * (R - L - 2 * inset); parts.push(`<line x1="${n2(x)}" y1="${n2(Tt)}" x2="${n2(x)}" y2="${n2(B)}" stroke="${M.grid}" stroke-width="1"/>`); parts.push(T(x, B + ts * 1.3, xl[i], { anchor: 'middle', size: ts })); });
      }
      const Yf = v => B - inset - (v - yt.lo) / (yt.hi - yt.lo) * (B - Tt - 2 * inset);
      yt.ticks.forEach((v, i) => { const y = Yf(v); parts.push(`<line x1="${n2(L)}" y1="${n2(y)}" x2="${n2(R)}" y2="${n2(y)}" stroke="${M.grid}" stroke-width="1"/>`); parts.push(T(L - 6, y, valueLabels[i], { anchor: 'end', base: 'middle', size: ts })); });
      parts.push(`<line x1="${n2(L)}" y1="${n2(B)}" x2="${n2(R)}" y2="${n2(B)}" stroke="${M.axis}" stroke-width="1"/>`);
      if (o.ytitle) parts.push(T(left + fs * 0.5, (Tt + B) / 2, clip(o.ytitle, ts, B - Tt), { anchor: 'middle', base: 'middle', size: ts, rot: -90, fill: M.ink }));
      if (o.xtitle) parts.push(T((L + R) / 2, bottom - fs * 0.25, clip(o.xtitle, ts, R - L), { anchor: 'middle', size: ts, fill: M.ink }));
      const Y = Yf;
      return { band: cats ? catW : 30, C: i => L + catW * (i + 0.5), V: Y, Y, X: xt ? (v => L + inset + (v - xt.lo) / (xt.hi - xt.lo) * (R - L - 2 * inset)) : null, left: L, right: R, top: Tt, bottom: B };
    }
    // 橫條：類別在 Y 軸
    const labels = cats.map(c => clip(c, ts, (right - left) * 0.38));
    L += Math.max(...labels.map(s => tw(s, ts))) + 10;
    B -= ts * 1.7;
    const band = (B - Tt) / cats.length;
    const C = i => Tt + band * (i + 0.5);
    const X = v => L + (v - yt.lo) / (yt.hi - yt.lo) * (R - L);
    const step = Math.max(1, Math.ceil(ts * 1.2 / band));
    cats.forEach((c, i) => { if (i % step === 0) parts.push(T(L - 8, C(i), labels[i], { anchor: 'end', base: 'middle', size: ts })); });
    const vl = valueLabels; let lastX = -1e9;
    yt.ticks.forEach((v, i) => { const x = X(v); parts.push(`<line x1="${n2(x)}" y1="${n2(Tt)}" x2="${n2(x)}" y2="${n2(B)}" stroke="${M.grid}" stroke-width="1"/>`); const w = tw(vl[i], ts); if (x - w / 2 > lastX + 6) { parts.push(T(x, B + ts * 1.3, vl[i], { anchor: 'middle', size: ts })); lastX = x + w / 2; } });
    parts.push(`<line x1="${n2(L)}" y1="${n2(Tt)}" x2="${n2(L)}" y2="${n2(B)}" stroke="${M.axis}" stroke-width="1"/>`);
    if (o.ytitle) parts.push(T((L + R) / 2, bottom - fs * 0.25, clip(o.ytitle, ts, R - L), { anchor: 'middle', size: ts, fill: M.ink }));
    if (o.xtitle) parts.push(T(left + fs * 0.5, (Tt + B) / 2, clip(o.xtitle, ts, B - Tt), { anchor: 'middle', base: 'middle', size: ts, rot: -90, fill: M.ink }));
    return { band, C, V: X, left: L, right: R, top: Tt, bottom: B };
  }
}
function barPath(x, y, w, h, dir) {
  const r = Math.min(4, w / 2, h / 2);
  if (dir === 'none' || r <= 0.5) return `M${n2(x)},${n2(y)}h${n2(w)}v${n2(h)}h${n2(-w)}Z`;
  if (dir === 'up') return `M${n2(x)},${n2(y + h)}V${n2(y + r)}Q${n2(x)},${n2(y)} ${n2(x + r)},${n2(y)}H${n2(x + w - r)}Q${n2(x + w)},${n2(y)} ${n2(x + w)},${n2(y + r)}V${n2(y + h)}Z`;
  if (dir === 'down') return `M${n2(x)},${n2(y)}V${n2(y + h - r)}Q${n2(x)},${n2(y + h)} ${n2(x + r)},${n2(y + h)}H${n2(x + w - r)}Q${n2(x + w)},${n2(y + h)} ${n2(x + w)},${n2(y + h - r)}V${n2(y)}Z`;
  if (dir === 'right') return `M${n2(x)},${n2(y)}H${n2(x + w - r)}Q${n2(x + w)},${n2(y)} ${n2(x + w)},${n2(y + r)}V${n2(y + h - r)}Q${n2(x + w)},${n2(y + h)} ${n2(x + w - r)},${n2(y + h)}H${n2(x)}Z`;
  return `M${n2(x + w)},${n2(y)}H${n2(x + r)}Q${n2(x)},${n2(y)} ${n2(x)},${n2(y + r)}V${n2(y + h - r)}Q${n2(x)},${n2(y + h)} ${n2(x + r)},${n2(y + h)}H${n2(x + w)}Z`;
}
function arcPath(cx, cy, R, r0, a0, a1) {
  if (a1 - a0 >= Math.PI * 2 - 1e-6) a1 = a0 + Math.PI * 2 - 1e-4;
  const large = a1 - a0 > Math.PI ? 1 : 0, p = (r, a) => `${n2(cx + Math.cos(a) * r)},${n2(cy + Math.sin(a) * r)}`;
  if (!r0) return `M${n2(cx)},${n2(cy)}L${p(R, a0)}A${n2(R)},${n2(R)} 0 ${large} 1 ${p(R, a1)}Z`;
  return `M${p(R, a0)}A${n2(R)},${n2(R)} 0 ${large} 1 ${p(R, a1)}L${p(r0, a1)}A${n2(r0)},${n2(r0)} 0 ${large} 0 ${p(r0, a0)}Z`;
}
// 單調三次插值（Fritsch–Carlson），避免過衝
function monotonePath(pts) {
  const n = pts.length, x = pts.map(p => p[0]), y = pts.map(p => p[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = x[i + 1] - x[i]; m[i] = (y[i + 1] - y[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let dStr = `M${n2(x[0])},${n2(y[0])}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; dStr += `C${n2(x[i] + h)},${n2(y[i] + t[i] * h)} ${n2(x[i + 1] - h)},${n2(y[i + 1] - t[i + 1] * h)} ${n2(x[i + 1])},${n2(y[i + 1])}`; }
  return dStr;
}

/* ---------- 頁面 ---------- */
const pageDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
const aspectVal = () => (ASPECTS.find(a => a[0] === opts.aspect) || ASPECTS[1])[1];
function exportSize() { const r = aspectVal(); return r >= 1 ? [960, Math.round(960 / r)] : [Math.round(1080 * r), 1080]; }
function previewMode() { return opts.bg === 'dark' ? 'dark' : opts.bg === 'white' ? 'light' : (pageDark() ? 'dark' : 'light'); }
let lastNotes = [];
function draw() {
  const wrapEl = $('pwrap');
  const W = Math.max(280, Math.round(wrapEl.clientWidth || 340));
  let H = Math.round(W / aspectVal());
  const maxH = Math.max(360, innerHeight * 0.85);
  let w = W;
  if (H > maxH) { H = Math.round(maxH); w = Math.round(H * aspectVal()); }
  const notes = [];
  const svg = render(opts.type, data, opts, w, H, { mode: previewMode(), interactive: true, notes });
  const tmp = new DOMParser().parseFromString(svg, 'image/svg+xml').documentElement;
  const el = $('chart');
  el.setAttribute('viewBox', tmp.getAttribute('viewBox'));
  el.style.maxWidth = w + 'px'; el.style.margin = '0 auto';
  el.innerHTML = '';
  for (const c of [...tmp.childNodes]) el.appendChild(document.importNode(c, true));
  el.setAttribute('font-family', FONT);
  wrapEl.classList.toggle('solid', opts.bg !== 'transparent');
  $('note').textContent = notes.join(' ');
  $('note').hidden = !notes.length;
  lastNotes = notes;
  const [ew, eh] = exportSize();
  $('export-hint').textContent = `匯出尺寸 ${ew}×${eh}，PNG 為 2 倍（${ew * 2}×${eh * 2}）。背景依「樣式設定」而非頁面主題${opts.bg === 'transparent' ? '；透明背景使用深色文字' : ''}。`;
  $('tip').hidden = true;
  $('png-out').hidden = true; $('srcbox').hidden = true;
}
function exportSVG() {
  const [w, h] = exportSize();
  return render(opts.type, data, opts, w, h, { mode: opts.bg === 'dark' ? 'dark' : 'light', interactive: false, notes: [] });
}
function reparse() {
  data = parseData(text);
  const det = $('detect'), errs = $('errs');
  if (!data.labels.length) det.innerHTML = '尚無資料，請貼上兩欄（標籤＋數值）或多欄表格。';
  else det.innerHTML = `<span class="tag">${text === SAMPLE ? '範例' : esc(data.delim) + ' 分隔'}</span>偵測到 <b>${data.labels.length}</b> 個類別 × <b>${data.series.length}</b> 個系列${data.hasHeader ? '・首列為標題' : ''}${data.labelCol ? '' : '・無標籤欄，以 1、2、3… 編號'}`;
  errs.hidden = !data.errors.length;
  errs.innerHTML = data.errors.slice(0, 30).map(e => `<li>${esc(e)}</li>`).join('') + (data.errors.length > 30 ? `<li>…另有 ${data.errors.length - 30} 處</li>` : '');
  hidden = new Set([...hidden].filter(k => { const i = +k.slice(1); return k[0] === 's' ? i < data.series.length : i < data.labels.length; }));
  draw();
}

/* ---------- 控制項 ---------- */
$('types').innerHTML = TYPES.map(([k, name, icon]) => `<button type="button" id="type-${k}" data-v="${k}" aria-pressed="false"><svg viewBox="0 0 26 20" fill="none" stroke="currentColor">${icon}</svg>${name}</button>`).join('');
$('aspect').innerHTML = ASPECTS.map(([k]) => `<button type="button" id="aspect-${k.replace(':', 'x')}" data-v="${k}" aria-pressed="false">${k}</button>`).join('');
$('pals').innerHTML = Object.entries(PALETTES).map(([k, p]) => `<button type="button" id="pal-${k}" data-v="${k}" aria-pressed="false">${p.name}<span class="sw">${p.light.slice(0, 6).map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`).join('');
const FIELDS = { title: 'o-title', subtitle: 'o-subtitle', xtitle: 'o-xtitle', ytitle: 'o-ytitle' };
const SELECTS = { format: 'o-format', abbr: 'o-abbr', legendPos: 'o-legendpos', bg: 'o-bg' };
const CHECKS = { labels: 'o-labels', legend: 'o-legend', zero: 'o-zero', smooth: 'o-smooth', merge: 'o-merge' };
function syncControls() {
  for (const b of $('types').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.type));
  for (const b of $('aspect').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.aspect));
  for (const b of $('pals').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.palette));
  for (const [k, id] of Object.entries(FIELDS)) if (document.activeElement !== $(id)) $(id).value = opts[k];
  for (const [k, id] of Object.entries(SELECTS)) $(id).value = opts[k];
  for (const [k, id] of Object.entries(CHECKS)) $(id).checked = opts[k];
  $('o-smooth').disabled = !['line', 'area'].includes(opts.type);
  $('o-merge').disabled = !['pie', 'donut'].includes(opts.type);
}
function setOpt(k, v) { opts[k] = v; saveOpts(); syncControls(); draw(); }
$('types').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { if (opts.type !== b.dataset.v) hidden.clear(); setOpt('type', b.dataset.v); } });
$('aspect').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setOpt('aspect', b.dataset.v); });
$('pals').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setOpt('palette', b.dataset.v); });
for (const [k, id] of Object.entries(FIELDS)) $(id).addEventListener('input', e => setOpt(k, e.target.value));
for (const [k, id] of Object.entries(SELECTS)) $(id).addEventListener('change', e => setOpt(k, e.target.value));
for (const [k, id] of Object.entries(CHECKS)) $(id).addEventListener('change', e => setOpt(k, e.target.checked));
let parseTimer = 0;
$('data-input').addEventListener('input', e => { text = e.target.value; saveData(); clearTimeout(parseTimer); parseTimer = setTimeout(reparse, 150); });
$('btn-sample').addEventListener('click', () => { text = SAMPLE; $('data-input').value = text; if (!opts.title) opts.title = SAMPLE_TITLE; saveData(); saveOpts(); hidden.clear(); syncControls(); reparse(); });
$('btn-clear').addEventListener('click', () => { text = ''; $('data-input').value = ''; if (opts.title === SAMPLE_TITLE) opts.title = ''; saveData(); saveOpts(); hidden.clear(); syncControls(); reparse(); $('data-input').focus(); });

// 提示泡泡與圖例切換
$('chart').addEventListener('click', e => {
  const leg = e.target.closest('[data-leg]');
  if (leg) { const k = leg.dataset.leg; hidden.has(k) ? hidden.delete(k) : hidden.add(k); draw(); return; }
  const m = e.target.closest('[data-tip]'), tipEl = $('tip');
  if (!m) { tipEl.hidden = true; return; }
  const box = $('pwrap').getBoundingClientRect();
  tipEl.textContent = m.dataset.tip; tipEl.hidden = false;
  let x = e.clientX - box.left + 12, y = e.clientY - box.top - tipEl.offsetHeight - 10;
  if (x + tipEl.offsetWidth > box.width - 4) x = Math.max(4, e.clientX - box.left - tipEl.offsetWidth - 12);
  if (y < 4) y = e.clientY - box.top + 14;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});

/* ---------- 匯出 ---------- */
let toastT = 0;
function toast(t, ms = 2000) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }
function svgToPngBlob(svg, w, h) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('PNG 轉換失敗')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('SVG 載入失敗')); };
    img.src = url;
  });
}
const fileBase = () => (opts.title || '圖表').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40) || 'chart';
let dl = null;
async function save(filename, dataOut) {
  try { await dl.save({ filename, data: dataOut }); toast('已送出下載：' + filename); }
  catch (e) { const m = String(e && (e.message || e)); toast(/declin|cancel|denied/i.test(m) ? '已取消下載' : '下載失敗：' + m, 3000); }
}
$('btn-png').addEventListener('click', async () => { const [w, h] = exportSize(); try { await save(fileBase() + '.png', await svgToPngBlob(exportSVG(), w, h)); } catch (e) { toast(e.message); } });
$('btn-svg').addEventListener('click', () => save(fileBase() + '.svg', exportSVG()));
$('btn-show-png').addEventListener('click', async () => {
  const [w, h] = exportSize();
  try { const b = await svgToPngBlob(exportSVG(), w, h); const r = new FileReader(); r.onload = () => { $('png-img').src = r.result; $('png-out').hidden = false; }; r.readAsDataURL(b); } catch (e) { toast(e.message); }
});
$('btn-copy').addEventListener('click', async () => {
  const s = exportSVG();
  try { await navigator.clipboard.writeText(s); toast('已複製 SVG 原始碼'); }
  catch { const box = $('srcbox'); box.hidden = false; box.value = s; box.focus(); box.select(); toast('無法自動複製，已選取原始碼，請手動複製', 3000); }
});
(async () => {
  try { dl = await window.claude?.use?.('downloads'); } catch { dl = null; }
  const on = !!dl;
  $('btn-png').hidden = !on; $('btn-svg').hidden = !on; $('btn-show-png').hidden = on;
})();

/* ---------- 啟動 ---------- */
$('data-input').value = text;
syncControls();
reparse();
let rw = 0;
new ResizeObserver(() => { const w = $('pwrap').clientWidth; if (Math.abs(w - rw) > 2) { rw = w; draw(); } }).observe($('pwrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
</body></html>
