<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:6px 16px calc(20px + env(safe-area-inset-bottom))}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto}
header.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:52px}
header h1{margin:0;text-align:center;font-size:16px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:44px;min-width:44px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn .n{font-family:var(--mono)}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--accent)}}
.layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.main,.side{min-width:0}
.screen{position:relative;background:var(--screen);border-radius:4px;overflow:hidden;aspect-ratio:var(--ar,1.778);max-height:56vh;width:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:ew-resize}

.chip{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.62);color:var(--screen-ink);padding:2px 7px;border-radius:3px;font-variant-numeric:tabular-nums}
.chip.tc{font-size:14px;font-weight:600}
.chip.sample{font-family:var(--sans);background:var(--mark);color:#1b1500;font-weight:700}
.screen .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .1s}

.tl{position:relative;height:56px;margin-top:8px;background:var(--screen);border-radius:3px;overflow:hidden;touch-action:none;cursor:pointer}

.tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--mark);box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.tl .mk{position:absolute;top:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent);margin-left:-6px;pointer-events:none;filter:drop-shadow(0 0 1px #000)}

.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
.shutter:active::after{inset:8px}
.fmt{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}

.fmt button+button{border-left:1px solid var(--line)}
.fmt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.info{font-size:13px;color:var(--muted);margin:8px 0 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}

.field .row{display:flex;gap:6px}.field .row input{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.side .box{padding:12px;margin-top:0}

.trayHead h2{margin:0;font-size:15px}

.cap{position:relative;border:2px solid transparent;border-radius:3px;padding:0;background:var(--screen);cursor:pointer;overflow:hidden;aspect-ratio:16/10}

.cap span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 4px;text-align:left}
.cap[aria-pressed="true"]{border-color:var(--accent)}
.cap[aria-pressed="true"]::before{content:"✓";position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;z-index:1}
.trayAct{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trayAct .btn{flex:1 1 auto}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:16px 4px;text-align:center;margin:0}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.drawer .panel{width:100%;max-height:80%;overflow:auto;background:var(--surface);border-radius:8px 8px 0 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:grid;place-items:center;padding:16px}
.sheet .box2{width:min(620px,100%);background:var(--surface);border-radius:6px;padding:14px;max-height:calc(100% - 16px);overflow:auto}
.sheet img{display:block;max-width:100%;max-height:58vh;margin:8px auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

.kbd{font-size:12px;color:var(--muted);margin-top:8px}
@media (min-width:980px){

}
@media (max-width:979px){ .side{display:none} }
@media (max-height:600px) and (orientation:landscape){
  .main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
  .viewA{position:sticky;top:6px}
  .ctrls{margin-top:0}
  .screen{max-height:calc(100vh - 90px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app">

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='video-frames:v1:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};
const toast=(m,ms=2400)=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);};
const rm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
let dl=null;
const vid=$('#vid');
const set=Object.assign({fmt:'png',bN:16,bLayout:'grid',bBg:'#000000',bW:2160,bStamp:true,fps:'auto'},store.get('settings',{})||{});
const S={ name:'sample', sample:true, dur:0, fps:30, fpsEst:null, url:null, caps:[], sel:new Set(), speed:1, best:null };
const saveSet=()=>store.set('settings',set);

/* ---------- time helpers ---------- */
const fmtTC=t=>{ t=Math.max(0,t||0); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=Math.floor(t%60), ms=Math.floor((t-Math.floor(t))*1000+1e-6);
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0'); };
const fileTC=t=>fmtTC(t).replace(/[:.]/g,'-');
const fps=()=>set.fps==='auto'?(S.fpsEst||30):+set.fps;
function seekTo(v,t){ return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; res(); };
  const to=setTimeout(fin,4000);
  v.addEventListener('seeked',()=>{ clearTimeout(to); if(v.requestVideoFrameCallback){ v.requestVideoFrameCallback(()=>fin()); setTimeout(fin,150); } else fin(); },{once:true});
  v.currentTime=Math.max(0,Math.min(t,(S.dur||v.duration||t)-1e-3)); }); }
async function fixDuration(v){ if(isFinite(v.duration)&&v.duration>0) return v.duration;
  await new Promise(r=>{ const h=()=>{ if(isFinite(v.duration)&&v.duration>0){ v.removeEventListener('durationchange',h); r(); } }; v.addEventListener('durationchange',h); v.currentTime=1e7; setTimeout(r,4000); });
  const d=v.duration; await seekTo(v,0); return isFinite(d)?d:0; }

/* ---------- IndexedDB ---------- */
let db=null;
const idb=()=>new Promise(res=>{ try{ const r=indexedDB.open('video-frames',1); r.onupgradeneeded=()=>r.result.createObjectStore('captures',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } });
const tx=(mode,fn)=>new Promise(res=>{ if(!db) return res(null); try{ const t=db.transaction('captures',mode); const st=t.objectStore('captures'); const r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>res(null); }catch(e){ res(null); } });

/* ---------- sample video (canvas + MediaRecorder) ---------- */
async function makeSampleVideo(){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream) return null;
  const W=640,H=360,c=document.createElement('canvas'); c.width=W;c.height=H; const x=c.getContext('2d'); const stream=c.captureStream(30);
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m)); if(!mime) return null;
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2500000}); const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const DUR=4000; const t0=performance.now(); let f=0;
  const draw=()=>{ const t=(performance.now()-t0)/1000; f++;
    const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#183a4a'); g.addColorStop(1,'#0b1a22'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.08)'; for(let i=0;i<W;i+=40){ x.beginPath(); x.moveTo(i+.5,0); x.lineTo(i+.5,H); x.stroke(); }
    x.fillStyle='#2a5b49'; x.fillRect(0,H-60,W,60);
    // swinging figure: club arc
    const ang=-2.4+Math.sin(t*1.6)*2.2, cx=W/2, cy=150;
    x.strokeStyle='#e9eef2'; x.lineWidth=10; x.lineCap='round'; x.beginPath(); x.moveTo(cx,cy-40); x.lineTo(cx,cy+60); x.moveTo(cx,cy+60); x.lineTo(cx-30,H-62); x.moveTo(cx,cy+60); x.lineTo(cx+30,H-62); x.stroke();
    x.fillStyle='#e9eef2'; x.beginPath(); x.arc(cx,cy-62,22,0,7); x.fill();
    const hx=cx+Math.cos(ang)*40, hy=cy+Math.sin(ang)*40; x.beginPath(); x.moveTo(cx,cy-20); x.lineTo(hx,hy); x.stroke();

const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,f.data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),name); off+=30+name.length+sz; }
  const cdSize=cd.reduce((a,p)=>a+p.length,0); const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'}); }

async function buildCollage(items,opt,onProg){ // items: [{draw:(ctx,x,y,w,h)=>..., time, w, h}]

    await items[i].draw(x,X,Y,w,h);
    if(opt.stamp){ const fs=Math.max(10,Math.round(w*.05)); x.font=`600 ${fs}px ui-monospace,Menlo,monospace`; const txt=fmtTC(items[i].time); const tw=x.measureText(txt).width;
      x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(X,Y+h-fs*1.5,tw+fs*.8,fs*1.5); x.fillStyle='#fff'; x.textBaseline='middle'; x.fillText(txt,X+fs*.4,Y+h-fs*.75); }
    onProg&&onProg((i+1)/N); }

}

  busy=true; const pr=$('#bProg'), bar=pr.querySelector('i'); pr.hidden=false; bar.style.width='0'; vid.pause(); const back=vid.currentTime;
  try{ const times=[]; for(let i=0;i<N;i++) times.push(Math.min(S.dur-1e-3,a+(b-a)*i/(N-1)));
    const items=times.map(t=>({time:t,w:vid.videoWidth,h:vid.videoHeight,draw:async(x,X,Y,w,h)=>{ await seekTo(vid,t); x.drawImage(vid,X,Y,w,h); }}));
    const r=await buildCollage(items,{layout:set.bLayout,bg:set.bBg,width:+set.bW,stamp:set.bStamp},p=>bar.style.width=(p*100)+'%');
    const blob=await toBlob(r.canvas,'image/jpeg',.92); window.__lastCollage={blob,times,cols:r.cols,rows:r.rows,W:r.W,H:r.H};
    await seekTo(vid,back); updTime();
    await deliver(blob,`${(S.name||'video').replace(/\.[^.]+$/,'')}-burst-${N}.jpg`,`${N} 張・${r.cols}×${r.rows}・${r.W}×${r.H}px・${fmtTC(a)} → ${fmtTC(b)}`);
  }catch(e){ toast('產生拼圖失敗'); console.warn(e); } finally{ busy=false; pr.hidden=true; }
};
async function collageFromSel(){ const caps=S.caps.filter(c=>S.sel.has(c.id)).sort((a,b)=>a.time-b.time); if(caps.length<2) return;
  const items=caps.map(c=>({time:c.time,w:c.w,h:c.h,draw:async(x,X,Y,w,h)=>{ const bm=await createImageBitmap(c.blob); x.drawImage(bm,X,Y,w,h); bm.close&&bm.close(); }}));
  try{ const r=await buildCollage(items,{layout:set.bLayout,bg:set.bBg,width:+set.bW,stamp:set.bStamp}); const blob=await toBlob(r.canvas,'image/jpeg',.92); window.__lastCollage={blob,times:caps.map(c=>c.time),cols:r.cols,rows:r.rows,W:r.W,H:r.H};
    closeDrawer(); await deliver(blob,`${(caps[0].src||'video').replace(/\.[^.]+$/,'')}-collage-${caps.length}.jpg`,`${caps.length} 張・${r.W}×${r.H}px`); }catch(e){ toast('產生拼圖失敗'); } }

/* ---------- sharpest frame ---------- */
function lapVar(src,w,h){ const tw=320, th=Math.max(2,Math.round(tw*h/w)); const c=lapVar.c||(lapVar.c=document.createElement('canvas')); c.width=tw; c.height=th; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(src,0,0,tw,th);
  const d=x.getImageData(0,0,tw,th).data; const g=new Float32Array(tw*th); for(let i=0;i<tw*th;i++) g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  let s=0,s2=0,n=0; for(let y=1;y<th-1;y++) for(let X=1;X<tw-1;X++){ const i=y*tw+X; const l=g[i-1]+g[i+1]+g[i-tw]+g[i+tw]-4*g[i]; s+=l; s2+=l*l; n++; } const m=s/n; return s2/n-m*m; }
$('#sharpBtn').onclick=async()=>{
  if(busy||!S.dur) return; busy=true; vid.pause(); const btn=$('#sharpBtn'); btn.disabled=true; const t0=vid.currentTime, f=fps();
  const v2=document.createElement('video'); v2.muted=true; v2.playsInline=true; v2.preload='auto'; v2.src=S.url;
  try{ await new Promise((res,rej)=>{ v2.onloadeddata=res; v2.onerror=rej; setTimeout(rej,8000); });
    const a=Math.max(0,t0-.5), b=Math.min(S.dur-1e-3,t0+.5); let best=null, bs=-1, n=0; const fa=Math.floor(a*f), fb=Math.floor(b*f);
    for(let k=fa;k<=fb;k++){ const t=Math.min(S.dur-1e-3,k/f+.25/f); await seekTo2(v2,t); const v=lapVar(v2,v2.videoWidth,v2.videoHeight); n++; if(v>bs){ bs=v; best=t; } btn.textContent=`分析 ${n}/${fb-fa+1}`; }
    S.best=best; drawMarks(); const info=$('#sharpInfo'); info.hidden=false; info.innerHTML=''; info.append(`在 ±0.5 秒內比較 ${n} 格，最清晰的是 ${fmtTC(best)}（清晰度 ${bs.toFixed(0)}）。`);
    const go=document.createElement('button'); go.className='btn'; go.type='button'; go.id='gotoBest'; go.textContent='跳到這一格'; go.style.marginLeft='8px'; go.onclick=async()=>{ await seekTo(vid,best); updTime(); }; info.append(go);
    window.__sharp={best,score:bs,n};
  }catch(e){ toast('分析失敗'); } finally{ v2.removeAttribute('src'); v2.load(); busy=false; btn.disabled=false; btn.textContent='找最清晰'; }
};

/* ---------- open ---------- */
$('#openBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; if(f.type&&!f.type.startsWith('video/')&&!/\.(mov|mp4|webm|m4v|mkv)$/i.test(f.name)){ toast('請選擇影片檔'); return; }
  if(f.type&&!vid.canPlayType(f.type)&&!/quicktime/.test(f.type)) toast('瀏覽器可能無法播放這種格式，嘗試中…');
  if(await loadVideo(f,f.name,false)) toast('已開啟 '+f.name); };
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{ e.preventDefault(); const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('video/')); if(f&&await loadVideo(f,f.name,false)) toast('已開啟 '+f.name); });
let rt=0; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(S.url) buildTimeline(); },250); });

/* ---------- init ---------- */
(async()=>{
  try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; }
  db=await idb();
  const rows=await tx('readonly',st=>st.getAll())||[];
  for(const r of rows.sort((a,b)=>a.id<b.id?-1:1)){ try{ const bm=await createImageBitmap(r.blob); S.caps.push({...r,thumb:await thumbOf(bm,r.w,r.h)}); bm.close&&bm.close(); }catch(e){} }
  renderTray();
  const blob=await makeSampleVideo().catch(()=>null);
  if(blob&&S.sample&&!S.dur){ await loadVideo(blob,'sample.webm',true); }
  else if(!S.dur){ $('#msg').textContent='此瀏覽器無法產生範例影片，請按「開啟影片」選擇檔案。'; }
  drawMarks(); window.__vfReady=true;
})();
window.__vf={S,set,vid,fmtTC,fps,loadVideo,zipStore,crc32};
})();
</script>
