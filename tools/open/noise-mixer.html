.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

/* deck */
.deck{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;box-shadow:var(--shadow)}

.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.scrim{position:fixed;inset:0;background:rgba(5,12,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;border:1px solid var(--line)}

.btn{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
@media (max-height:600px){.scrim{align-items:flex-start;overflow:auto}.sheet{max-height:none;border-radius:0 0 20px 20px}}

<div class="wrap">

(function(){
'use strict';
const $=s=>document.querySelector(s);

];

 {name:'專注',tracks:{pink:{on:true,vol:45},fan:{on:true,vol:40,param:.5},stream:{on:true,vol:25,param:.4}}},

];

let settings=Object.assign({timerMin:30,fadeSec:120,anim:!reduced},store.get(KEY.settings,{}));
let playing=false;
let timer=null; // {endAt,fade}
const saveMix=()=>store.set(KEY.mix,{tracks:mix,master:masterVol,preset:activePreset});

/* ---------- audio ---------- */
let ctx=null,A={};
const inst={}; // track id -> instance
function makeNoise(kind,sec,channels){
  const sr=ctx.sampleRate,N=Math.floor(sr*sec),F=Math.floor(sr*0.5);
  const buf=ctx.createBuffer(channels,N,sr);
  for(let c=0;c<channels;c++){
    const d=new Float32Array(N+F);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(let i=0;i<N+F;i++){const w=Math.random()*2-1;
      if(kind==='white')d[i]=w*0.5;
      else if(kind==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
      else{last=(last+.02*w)/1.02;d[i]=last*3.5}}
    // crossfade tail into head so the loop has no seam
    for(let i=0;i<F;i++){const a=Math.sqrt(i/F),b=Math.sqrt(1-i/F);d[i]=d[i]*a+d[N+i]*b}
    buf.copyToChannel(d.subarray(0,N),c);
  }
  return buf;
}
function makeClicks(count,lenMs,hp){ // short enveloped noise bursts, pre-rendered
  const out=[];const sr=ctx.sampleRate;
  for(let k=0;k<count;k++){const n=Math.floor(sr*lenMs/1000*(0.6+Math.random()*0.8));const b=ctx.createBuffer(1,n,sr);const d=b.getChannelData(0);let prev=0,lp=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;let s=hp?(w-prev):w;prev=w;lp+= (s-lp)*(hp?0.6:0.35);const env=Math.exp(-i/(n*0.22))*Math.min(1,i/(sr*0.0008));d[i]=lp*env}
    out.push(b)}
  return out;
}
function ensureAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('此瀏覽器不支援 Web Audio');
  ctx=new AC({latencyHint:'playback'});
  A.white=makeNoise('white',10,2);A.pink=makeNoise('pink',10,2);A.brown=makeNoise('brown',10,2);
  A.drops=makeClicks(8,18,true);A.crackles=makeClicks(10,6,true);
  A.mix=ctx.createGain();A.run=ctx.createGain();A.run.gain.value=0;A.sleep=ctx.createGain();A.master=ctx.createGain();
  A.master.gain.value=sq(masterVol);
  A.comp=ctx.createDynamicsCompressor();A.comp.threshold.value=-14;A.comp.knee.value=12;A.comp.ratio.value=6;A.comp.attack.value=.005;A.comp.release.value=.25;
  A.an=ctx.createAnalyser();A.an.fftSize=1024;A.anBuf=new Float32Array(A.an.fftSize);
  A.mix.connect(A.run);A.run.connect(A.sleep);A.sleep.connect(A.master);A.master.connect(A.comp);A.comp.connect(A.an);A.an.connect(ctx.destination);
  setInterval(tick,250);
}
const sq=v=>Math.pow(v/100,2);
function loopSrc(buf){const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start(ctx.currentTime,Math.random()*9);return s}
function filt(type,f,q){const n=ctx.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!=null)n.Q.value=q;return n}
function gain(v){const g=ctx.createGain();g.gain.value=v;return g}
function osc(type,f){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.start();return o}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* each builder: returns {out, nodes:[stoppables], set(param), sched(from,to)} */
const BUILD={
 white(){const s=loopSrc(A.white),g=gain(.32);s.connect(g);return{out:g,stop:[s]}},
 pink(){const s=loopSrc(A.pink),g=gain(.55);s.connect(g);return{out:g,stop:[s]}},
 brown(){const s=loopSrc(A.brown),hp=filt('highpass',25),g=gain(.75);s.connect(hp);hp.connect(g);return{out:g,stop:[s]}},
 rain(p){const s=loopSrc(A.pink),hp=filt('highpass',1000,.5),lp=filt('lowpass',5000,.5),bed=gain(.5),out=gain(1);
   s.connect(hp);hp.connect(lp);lp.connect(bed);bed.connect(out);
   const dropBus=gain(.5);dropBus.connect(out);
   const me={out,stop:[s],p,next:0,
     set(p){me.p=p;bed.gain.setTargetAtTime(.3+.6*p,ctx.currentTime,.2)},
     sched(from,to){const rate=20+180*me.p;let t=Math.max(me.next,from);
       while(t<to){const src=ctx.createBufferSource();src.buffer=A.drops[(Math.random()*A.drops.length)|0];src.playbackRate.value=rnd(.6,1.5);
         const g=ctx.createGain();g.gain.value=rnd(.04,.35)*(Math.random()<.08?2.2:1);
         let pn=null;if(ctx.createStereoPanner){pn=ctx.createStereoPanner();pn.pan.value=rnd(-.8,.8);src.connect(g);g.connect(pn);pn.connect(dropBus)}else{src.connect(g);g.connect(dropBus)}
         src.start(t);t+=-Math.log(1-Math.random())/rate}
       me.next=t}};
   me.set(p);return me},
 thunder(p){const out=gain(1);const s=loopSrc(A.brown),lp=filt('lowpass',110,.7),bed=gain(.18);s.connect(lp);lp.connect(bed);bed.connect(out);
   const me={out,stop:[s],p,next:ctx.currentTime+rnd(1.5,4),
     set(p){me.p=p},
     sched(from,to){while(me.next<to){const t=Math.max(me.next,from);boom(t,out);const lo=20+40*(1-me.p),hi=45+45*(1-me.p);me.next=t+rnd(lo,hi)}}};
   return me},
 ocean(p){const s=loopSrc(A.brown),lp=filt('lowpass',800,.4),wave=gain(.55),out=gain(1.1);
   const hiss=loopSrc(A.pink),hb=filt('bandpass',1800,.6),hg=gain(.25);
   s.connect(lp);lp.connect(wave);hiss.connect(hb);hb.connect(hg);hg.connect(wave);wave.connect(out);
   const lfo=osc('sine',1/10),dep=gain(.45),fdep=gain(550);lfo.connect(dep);dep.connect(wave.gain);lfo.connect(fdep);fdep.connect(lp.frequency);
   const me={out,stop:[s,hiss,lfo],set(p){lfo.frequency.setTargetAtTime(1/(12-4*p),ctx.currentTime,.5)}};me.set(p);return me},
 wind(p){const s=loopSrc(A.pink),bp=filt('bandpass',500,1.4),g=gain(.9),out=gain(1.6);s.connect(bp);bp.connect(g);g.connect(out);
   let f=500,a=.8;const me={out,stop:[s],p,next:0,set(p){me.p=p},
     sched(from,to){while(me.next<to){const t=Math.max(me.next,from);const step=60+260*me.p;f=clamp(f+rnd(-step,step),300,900);a=clamp(a+rnd(-.35,.35)*(.4+me.p),.25,1);
       bp.frequency.setTargetAtTime(f,t,1.2);g.gain.setTargetAtTime(a,t,1.0);me.next=t+rnd(.8,2.2)}}};return me},
 fan(p){const s=loopSrc(A.brown),lp=filt('lowpass',400,.7),g=gain(.9),out=gain(1);s.connect(lp);lp.connect(g);g.connect(out);
   const h1=osc('sine',60),hg1=gain(.018),h2=osc('sine',120),hg2=gain(.007);h1.connect(hg1);hg1.connect(out);h2.connect(hg2);hg2.connect(out);
   const me={out,stop:[s,h1,h2],set(p){lp.frequency.setTargetAtTime(260+500*p,ctx.currentTime,.3);h1.frequency.setTargetAtTime(50+20*p,ctx.currentTime,.3);h2.frequency.setTargetAtTime(2*(50+20*p),ctx.currentTime,.3)}};me.set(p);return me},
 fire(p){const s=loopSrc(A.brown),lp=filt('lowpass',320,.6),rum=gain(.7),out=gain(1);s.connect(lp);lp.connect(rum);rum.connect(out);
   const h=loopSrc(A.pink),hb=filt('bandpass',2200,.8),hg=gain(.05);h.connect(hb);hb.connect(hg);hg.connect(out);
   const bus=gain(.55);const bhp=filt('highpass',1500,.7);bus.connect(bhp);bhp.connect(out);
   const me={out,stop:[s,h],p,next:0,set(p){me.p=p},
     sched(from,to){const rate=2+12*me.p;let t=Math.max(me.next,from);
       while(t<to){const n=Math.random()<.2?3+((Math.random()*4)|0):1;let tt=t;
         for(let i=0;i<n;i++){const src=ctx.createBufferSource();src.buffer=A.crackles[(Math.random()*A.crackles.length)|0];src.playbackRate.value=rnd(.5,1.6);const g=gain(rnd(.15,.9));src.connect(g);g.connect(bus);src.start(tt);tt+=rnd(.01,.06)}
         t+=-Math.log(1-Math.random())/rate}me.next=t}};return me},
 stream(p){const s=loopSrc(A.white),out=gain(1);const stop=[s];const bands=[[450,2.5],[900,3],[1700,3.5],[3200,4]];const gs=[];
   bands.forEach(([f,q],i)=>{const bp=filt('bandpass',f*rnd(.9,1.1),q),g=gain(.35);s.connect(bp);bp.connect(g);g.connect(out);
     const l=osc('sine',rnd(.08,.35)),d=gain(.22);l.connect(d);d.connect(g.gain);stop.push(l);
     const l2=osc('sine',rnd(.03,.12)),d2=gain(f*.15);l2.connect(d2);d2.connect(bp.frequency);stop.push(l2);gs.push(g)});
   const me={out,stop,set(p){gs.forEach((g,i)=>g.gain.setTargetAtTime((.2+.35*p)*(i===0?1.4:1),ctx.currentTime,.3))}};me.set(p);return me},
 heart(p){const out=gain(1),lp=filt('lowpass',140,.7);lp.connect(out);
   const me={out,stop:[],p,next:ctx.currentTime+.1,set(p){me.p=p},
     sched(from,to){const per=60/(55+30*me.p);while(me.next<to){const t=Math.max(me.next,from);thump(t,1,lp);thump(t+.28,.6,lp);me.next=t+per}}};return me}
};
function boom(t,dest){
  const dur=rnd(3,6);const s=ctx.createBufferSource();s.buffer=A.brown;const lp=filt('lowpass',rnd(250,420),.8);const g=ctx.createGain();
  s.connect(lp);lp.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(rnd(1.4,2.4),t+.1);g.gain.exponentialRampToValueAtTime(.0005,t+.1+dur);
  lp.frequency.setValueAtTime(lp.frequency.value,t);lp.frequency.exponentialRampToValueAtTime(90,t+dur);
  s.start(t,Math.random()*3,dur+.3);
  if(Math.random()<.55){const c=ctx.createBufferSource();c.buffer=A.white;const cl=filt('lowpass',1800,.5),cg=ctx.createGain();c.connect(cl);cl.connect(cg);cg.connect(dest);
    cg.gain.setValueAtTime(.0001,t);cg.gain.linearRampToValueAtTime(.35,t+.03);cg.gain.exponentialRampToValueAtTime(.0005,t+.6);c.start(t,Math.random()*5,.8)}
}
function thump(t,amp,dest){const o=ctx.createOscillator();o.type='sine';const g=ctx.createGain();o.connect(g);g.connect(dest);
  o.frequency.setValueAtTime(85,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(1.6*amp,t+.012);g.gain.exponentialRampToValueAtTime(.0005,t+.2);o.start(t);o.stop(t+.25)}

function toneFreq(v){return 200*Math.pow(100,v)}
function startTrack(id){
  const st=mix[id];let it=inst[id];
  if(it){ // revive a fading instance
    clearTimeout(it.kill);it.kill=null;
  }else{
    const b=BUILD[id](st.param);const tone=filt('lowpass',toneFreq(st.tone),.5);const g=gain(0);
    b.out.connect(tone);tone.connect(g);g.connect(A.mix);it=inst[id]={b,tone,g,kill:null};
  }
  const now=ctx.currentTime;it.g.gain.cancelScheduledValues(now);it.g.gain.setValueAtTime(it.g.gain.value,now);it.g.gain.linearRampToValueAtTime(sq(st.vol),now+1);
}
function stopTrack(id){
  const it=inst[id];if(!it||it.kill)return;const now=ctx.currentTime;
  it.g.gain.cancelScheduledValues(now);it.g.gain.setValueAtTime(it.g.gain.value,now);it.g.gain.linearRampToValueAtTime(0,now+1);
  it.kill=setTimeout(()=>{for(const s of it.b.stop){try{s.stop()}catch(e){}}try{it.g.disconnect()}catch(e){}delete inst[id]},1150);
}
function syncAudio(){if(!ctx)return;for(const t of TRACKS){if(mix[t.id].on)startTrack(t.id);else stopTrack(t.id)}}
function setTrackVol(id){const it=inst[id];if(it&&!it.kill)it.g.gain.setTargetAtTime(sq(mix[id].vol),ctx.currentTime,.05)}
function setTrackTone(id){const it=inst[id];if(it)it.tone.frequency.setTargetAtTime(toneFreq(mix[id].tone),ctx.currentTime,.05)}
function setTrackParam(id){const it=inst[id];if(it&&it.b.set)it.b.set(mix[id].param)}

let schedUntil=0;
function tick(){
  if(ctx&&ctx.state==='running'){
    const now=ctx.currentTime,to=now+1.5;const from=Math.max(now+.02,schedUntil);
    for(const id in inst){const b=inst[id].b;if(b.sched&&!inst[id].kill)b.sched(from,to)}
    schedUntil=to;
  }
  if(timer){
    const rem=timer.endAt-Date.now();
    if(rem<=0){timer=null;pause('睡眠定時結束，已自動暫停');}
    else if(ctx&&playing){const g=rem<timer.fade*1000?Math.max(0,rem/(timer.fade*1000)):1;A.sleep.gain.setTargetAtTime(g,ctx.currentTime,.08)}
    renderTimer();
  }
}

async function play(){
  try{ensureAudio()}catch(e){setStatus(e.message);return}
  if(!TRACKS.some(t=>mix[t.id].on)){setStatus('請先開啟至少一個音軌');return}
  try{await ctx.resume()}catch(e){}
  playing=true;schedUntil=0;syncAudio();
  const now=ctx.currentTime;A.run.gain.cancelScheduledValues(now);A.run.gain.setValueAtTime(A.run.gain.value,now);A.run.gain.linearRampToValueAtTime(1,now+.4);
  if(!timer)A.sleep.gain.setValueAtTime(1,now);
  renderPlay();mediaSession();setStatus(statusText());startFx();
}
let pauseT=null;
function pause(msg){
  playing=false;renderPlay();setStatus(msg||'已暫停');
  if(!ctx)return;const now=ctx.currentTime;A.run.gain.cancelScheduledValues(now);A.run.gain.setValueAtTime(A.run.gain.value,now);A.run.gain.linearRampToValueAtTime(0,now+.35);
  clearTimeout(pauseT);pauseT=setTimeout(()=>{if(!playing){ctx.suspend().catch(()=>{});A.sleep.gain.value=1}},450);
  if('mediaSession' in navigator)try{navigator.mediaSession.playbackState='paused'}catch(e){}
}
function mediaSession(){
  if(!('mediaSession' in navigator))return;
  try{
    const names=TRACKS.filter(t=>mix[t.id].on).map(t=>t.name).join('、');
    if(window.MediaMetadata)navigator.mediaSession.metadata=new MediaMetadata({title:names||'白噪音',artist:'白噪音產生器'});
    navigator.mediaSession.playbackState='playing';
    navigator.mediaSession.setActionHandler('play',()=>play());
    navigator.mediaSession.setActionHandler('pause',()=>pause());
  }catch(e){}
}

/* ---------- UI ---------- */
function setStatus(t){$('#status').textContent=t}
function statusText(){const on=TRACKS.filter(t=>mix[t.id].on);return on.length?'播放中：'+on.map(t=>t.name).join('、'):'沒有開啟的音軌'}
function renderPlay(){const b=$('#play-btn');b.setAttribute('aria-label',playing?'暫停':'播放');
  $('#play-ic').innerHTML=playing?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>':'<path d="M8 5.5v13l11-6.5z"/>'}
function paintRange(r){const p=(r.value-r.min)/(r.max-r.min)*100;r.style.setProperty('--p',p+'%')}

const grid=$('#grid');const expanded=new Set();
function cardHTML(t){const st=mix[t.id];const ex=expanded.has(t.id);
  const sub=t.id==='heart'&&st.on?`每分鐘 ${Math.round(55+30*st.param)} 下`:t.sub;
  return `<button class="tog" id="tog-${t.id}" aria-pressed="${st.on}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[t.id]}</svg></span><span class="nm"><b>${t.name}</b><small>${st.on&&t.id!=='heart'?'開啟中':sub}</small></span></button>
  <div class="ctl" ${st.on?'':'hidden'}>
   <div class="row"><label for="vol-${t.id}">音量</label><input type="range" id="vol-${t.id}" data-k="vol" data-id="${t.id}" min="0" max="100" value="${st.vol}" aria-label="${t.name}音量"></div>
   <div class="adv" ${ex?'':'hidden'}>
    <div class="row"><label for="tone-${t.id}">音色</label><input type="range" id="tone-${t.id}" data-k="tone" data-id="${t.id}" min="0" max="100" value="${Math.round(st.tone*100)}" aria-label="${t.name}音色（左柔和、右明亮）"></div>
    ${t.param?`<div class="row"><label for="param-${t.id}">${t.param}</label><input type="range" id="param-${t.id}" data-k="param" data-id="${t.id}" min="0" max="100" value="${Math.round(st.param*100)}" aria-label="${t.name}${t.param}"></div>`:''}
   </div>
  </div>
  <button class="more" id="more-${t.id}" ${st.on?'':'hidden'} aria-expanded="${ex}">${ex?'收合調整':'音色與強度'}</button>`}
function renderGrid(){grid.innerHTML=TRACKS.map(t=>`<div class="card${mix[t.id].on?' on':''}" id="card-${t.id}">${cardHTML(t)}</div>`).join('');grid.querySelectorAll('input[type=range]').forEach(paintRange);renderCounts()}
function renderCard(id){const t=TRACKS.find(x=>x.id===id);const c=$('#card-'+id);c.className='card'+(mix[id].on?' on':'');c.innerHTML=cardHTML(t);c.querySelectorAll('input[type=range]').forEach(paintRange);renderCounts()}
function renderCounts(){const n=TRACKS.filter(t=>mix[t.id].on).length;$('#on-count').textContent=`已開 ${n} / ${TRACKS.length}`}

grid.addEventListener('click',e=>{
  const tog=e.target.closest('.tog');const more=e.target.closest('.more');
  if(tog){const id=tog.id.slice(4);mix[id].on=!mix[id].on;activePreset=null;saveMix();renderCard(id);renderPresets();
    if(mix[id].on&&!playing){play();return}
    if(playing){if(mix[id].on)startTrack(id);else stopTrack(id);if(!TRACKS.some(t=>mix[t.id].on))pause('所有音軌已關閉');else{setStatus(statusText());mediaSession()}}
    $('#tog-'+id).focus();return}
  if(more){const id=more.id.slice(5);expanded.has(id)?expanded.delete(id):expanded.add(id);renderCard(id);$('#more-'+id).focus()}
});
grid.addEventListener('input',e=>{const r=e.target;if(r.type!=='range')return;paintRange(r);const id=r.dataset.id,k=r.dataset.k;const v=Number(r.value);
  if(k==='vol'){mix[id].vol=v;ctx&&setTrackVol(id)}else if(k==='tone'){mix[id].tone=v/100;ctx&&setTrackTone(id)}else{mix[id].param=v/100;ctx&&setTrackParam(id);if(id==='heart')$('#card-'+id+' .nm small').textContent='每分鐘 '+Math.round(55+30*mix[id].param)+' 下'}
  activePreset=null;renderPresetsActive();});
grid.addEventListener('change',()=>saveMix());

const mv=$('#master-vol');mv.value=masterVol;$('#master-out').textContent=masterVol;paintRange(mv);
mv.addEventListener('input',()=>{masterVol=Number(mv.value);$('#master-out').textContent=masterVol;paintRange(mv);if(ctx)A.master.gain.setTargetAtTime(sq(masterVol),ctx.currentTime,.05)});
mv.addEventListener('change',saveMix);
$('#play-btn').addEventListener('click',()=>{playing?pause():play()});

/* presets */
function presetKey(p,b){return (b?'b:':'u:')+p.name}
function renderPresets(){
  const box=$('#presets');let h=BUILTIN.map(p=>`<button class="chip${activePreset===presetKey(p,1)?' active':''}" role="listitem" data-p="${esc(presetKey(p,1))}">${esc(p.name)}</button>`).join('');
  h+=userPresets.map((p,i)=>`<span class="uchip" role="listitem"><button class="chip${activePreset===presetKey(p,0)?' active':''}" data-p="${esc(presetKey(p,0))}">${esc(p.name)}</button><button class="x" data-del="${i}" aria-label="刪除組合 ${esc(p.name)}">×</button></span>`).join('');
  h+=`<button class="chip add" id="save-preset">＋ 儲存目前組合</button>`;
  box.innerHTML=h;$('#preset-count').textContent=userPresets.length?`自訂 ${userPresets.length}/20`:'';
}
function renderPresetsActive(){document.querySelectorAll('#presets .chip[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===activePreset))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyPreset(key){
  const b=key.startsWith('b:');const name=key.slice(2);const p=(b?BUILTIN:userPresets).find(x=>x.name===name);if(!p)return;
  mix=normMix(p.tracks);if(!b&&p.master!=null){masterVol=clamp(num(p.master,masterVol),0,100);mv.value=masterVol;$('#master-out').textContent=masterVol;paintRange(mv);if(ctx)A.master.gain.setTargetAtTime(sq(masterVol),ctx.currentTime,.05)}
  activePreset=key;saveMix();renderGrid();renderPresets();
  if(playing){syncAudio();setStatus(statusText());mediaSession()}else play();
}
let undo=null;
$('#presets').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(d){const i=+d.dataset.del;const removed=userPresets.splice(i,1)[0];store.set(KEY.presets,userPresets);if(activePreset===presetKey(removed,0))activePreset=null;renderPresets();
    toast(`已刪除「${removed.name}」`,()=>{userPresets.splice(i,0,removed);store.set(KEY.presets,userPresets);renderPresets()});return}
  if(e.target.closest('#save-preset')){openSave();return}
  const c=e.target.closest('[data-p]');if(c)applyPreset(c.dataset.p);
});
function openSave(){
  const on=TRACKS.filter(t=>mix[t.id].on);$('#save-msg').textContent='';
  if(!on.length){toast('請先開啟至少一個音軌');return}
  if(userPresets.length>=20){toast('自訂組合最多 20 組，請先刪除一組');return}
  $('#save-desc').textContent='包含：'+on.map(t=>`${t.name} ${mix[t.id].vol}`).join('、');
  $('#preset-name').value='我的組合 '+(userPresets.length+1);openSheet('#save-sheet','#preset-name');
}
$('#save-cancel').addEventListener('click',()=>closeSheet('#save-sheet'));
$('#save-ok').addEventListener('click',savePreset);
$('#preset-name').addEventListener('keydown',e=>{if(e.key==='Enter')savePreset()});
function savePreset(){
  const name=$('#preset-name').value.trim();if(!name){$('#save-msg').textContent='請輸入名稱';return}
  if(BUILTIN.some(p=>p.name===name)){$('#save-msg').textContent='與內建組合同名，請換一個名稱';return}
  const tracks={};for(const t of TRACKS)if(mix[t.id].on)tracks[t.id]=Object.assign({},mix[t.id]);
  const i=userPresets.findIndex(p=>p.name===name);const p={name,tracks,master:masterVol};
  if(i>=0)userPresets[i]=p;else userPresets.push(p);store.set(KEY.presets,userPresets);activePreset='u:'+name;saveMix();renderPresets();closeSheet('#save-sheet');toast(i>=0?`已更新「${name}」`:`已儲存「${name}」`);
}

/* sheets */
let lastFocus=null;
function openSheet(sel,focusSel){lastFocus=document.activeElement;$(sel).hidden=false;setTimeout(()=>$(focusSel).focus(),30)}
function closeSheet(sel){$(sel).hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)closeSheet('#'+s.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.scrim:not([hidden])').forEach(s=>closeSheet('#'+s.id))});

/* timer */
const TMIN=[15,30,45,60,90],FADE=[[30,'30 秒'],[120,'2 分'],[300,'5 分']];
let pickMin=settings.timerMin,pickFade=settings.fadeSec;
function renderTimerSheet(){
  $('#timer-chips').innerHTML=TMIN.map(m=>`<button class="chip" id="tm-${m}" data-m="${m}" aria-pressed="${pickMin===m&&!$('#timer-custom').value}">${m} 分</button>`).join('');
  $('#fade-chips').innerHTML=FADE.map(([s,l])=>`<button class="chip" id="fade-${s}" data-f="${s}" aria-pressed="${pickFade===s}">${l}</button>`).join('');
  $('#timer-cancel').hidden=!timer;
}
$('#timer-btn').addEventListener('click',()=>{$('#timer-msg').textContent='';$('#timer-custom').value=TMIN.includes(pickMin)?'':pickMin;renderTimerSheet();openSheet('#timer-sheet','#tm-'+(TMIN.includes(pickMin)?pickMin:30))});
$('#timer-chips').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;pickMin=+b.dataset.m;$('#timer-custom').value='';renderTimerSheet();$('#tm-'+pickMin).focus()});
$('#fade-chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;pickFade=+b.dataset.f;renderTimerSheet();$('#fade-'+pickFade).focus()});
$('#timer-custom').addEventListener('input',()=>{document.querySelectorAll('#timer-chips .chip').forEach(c=>c.setAttribute('aria-pressed','false'))});
$('#timer-start').addEventListener('click',()=>{
  let m=pickMin;const cv=$('#timer-custom').value.trim();
  if(cv){m=Number(cv);if(!Number.isFinite(m)||m<1||m>600){$('#timer-msg').textContent='自訂時間請輸入 1–600 分鐘';return}m=Math.round(m)}
  if(pickFade>m*60){$('#timer-msg').textContent='淡出時長不能比定時還長';return}
  pickMin=m;settings.timerMin=m;settings.fadeSec=pickFade;store.set(KEY.settings,settings);
  timer={endAt:Date.now()+m*60000,fade:pickFade};closeSheet('#timer-sheet');renderTimer();
  if(!playing)play();else setStatus(`睡眠定時 ${m} 分鐘，最後 ${fmtFade(pickFade)}淡出`);
});
$('#timer-cancel').addEventListener('click',()=>{timer=null;if(ctx)A.sleep.gain.setTargetAtTime(1,ctx.currentTime,.1);renderTimer();closeSheet('#timer-sheet');toast('已取消睡眠定時')});
function fmtFade(s){return s>=60?(s/60)+' 分鐘':s+' 秒'}
function renderTimer(){const b=$('#timer-btn'),l=$('#timer-label');
  if(!timer){b.classList.remove('on');l.textContent='睡眠定時';return}
  const r=Math.max(0,Math.ceil((timer.endAt-Date.now())/1000));const h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60;
  b.classList.add('on');l.textContent=(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')+(r*1000<timer.fade*1000?' 淡出中':'');}
setInterval(()=>{if(!ctx&&timer)tick();},1000);

/* toast */
let toastT=null;
function toast(text,undoFn){$('#toast-text').textContent=text;const u=$('#toast-undo');u.hidden=!undoFn;undo=undoFn||null;$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{$('#toast').hidden=true;undo=null},5000)}
$('#toast-undo').addEventListener('click',()=>{if(undo)undo();undo=null;$('#toast').hidden=true});

/* theme */
const THEMES=['auto','light','dark'],TL={auto:'自動',light:'淺色',dark:'深色'};
let theme=store.get(KEY.theme,'auto');if(!THEMES.includes(theme))theme='auto';
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);$('#theme-btn').textContent=TL[theme];$('#theme-btn').setAttribute('aria-label','主題：'+TL[theme]+'，點擊切換')}
$('#theme-btn').addEventListener('click',()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];store.set(KEY.theme,theme);applyTheme();fxColor=null});
applyTheme();

/* background fx + level meter */
const cv=$('#bgfx'),g2=cv.getContext('2d');let fxOn=false,parts=[],fxColor=null,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
addEventListener('resize',resize);resize();
function renderAnimBtn(){const b=$('#anim-btn');b.setAttribute('aria-pressed',String(settings.anim));b.textContent='背景動畫：'+(settings.anim?'開':'關')}
$('#anim-btn').addEventListener('click',()=>{settings.anim=!settings.anim;store.set(KEY.settings,settings);renderAnimBtn();if(!settings.anim)g2.clearRect(0,0,cv.width,cv.height);startFx()});
renderAnimBtn();
function startFx(){if(fxOn)return;fxOn=true;requestAnimationFrame(frame)}
let lastT=0;
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  // level meter
  let lvl=0;if(ctx&&playing&&A.an){A.an.getFloatTimeDomainData(A.anBuf);let s=0;for(let i=0;i<A.anBuf.length;i+=4)s+=A.anBuf[i]*A.anBuf[i];lvl=Math.min(1,Math.sqrt(s/(A.anBuf.length/4))*4);window.__level=lvl}
  $('#play-btn').style.setProperty('--lvl',reduced?0:lvl.toFixed(3));
  const W=cv.width,H=cv.height;g2.clearRect(0,0,W,H);
  if(settings.anim&&playing&&!document.hidden){
    if(!fxColor)fxColor=getComputedStyle(document.documentElement).getPropertyValue('--drop').trim();
    const wet=mix.rain.on||mix.thunder.on;const target=wet?Math.round(26+50*mix.rain.param):18;
    while(parts.length<target)parts.push(newPart(wet,true));if(parts.length>target)parts.length=target;
    g2.strokeStyle=fxColor;g2.fillStyle=fxColor;g2.lineWidth=1.2*dpr;g2.lineCap='round';
    for(const p of parts){
      if(p.wet){p.y+=p.v*dt*H;p.x+=p.v*dt*H*.08;g2.beginPath();g2.moveTo(p.x,p.y);g2.lineTo(p.x-p.l*.08,p.y-p.l);g2.stroke()}
      else{p.y-=p.v*dt*H*.05;p.x+=Math.sin(ts/1600+p.ph)*.25*dpr;g2.beginPath();g2.arc(p.x,p.y,p.r,0,6.283);g2.fill()}
      if(p.y>H+40||p.y<-20||p.wet!==wet)Object.assign(p,newPart(wet,false));
    }
  }
  if(playing||lvl>0.001){requestAnimationFrame(frame)}else{fxOn=false;g2.clearRect(0,0,W,H);$('#play-btn').style.setProperty('--lvl',0)}
}
function newPart(wet,any){const W=cv.width,H=cv.height;return wet?{wet:true,x:Math.random()*W*1.1-W*.05,y:any?Math.random()*H:-30,v:rnd(.5,.9),l:rnd(10,22)*dpr}:{wet:false,x:Math.random()*W,y:any?Math.random()*H:H+10,v:rnd(.3,.8),r:rnd(1,2.4)*dpr,ph:Math.random()*6}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing){startFx();tick()}});

renderGrid();renderPresets();renderPlay();renderTimer();
if(savedMix)setStatus(TRACKS.some(t=>mix[t.id].on)?'已還原上次的混音，按播放開始':'點選音軌開始播放');
window.__nm={get A(){return A},get ctx(){return ctx},get playing(){return playing},get timer(){return timer},inst,mix:()=>mix,sleepGain:()=>A.sleep&&A.sleep.gain.value,setTimerEnd(ms){if(timer)timer.endAt=Date.now()+ms}};
})();
</script>
</body></html>
