<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }

<title>圖案底紋</title>
<style>
:root{
  --bg:#eef0ec; --surface:#fbfbf9; --surface-2:#f1f3ef; --ink:#13201b; --ink-2:#34443d; --muted:#5d6b64; --line:#ccd3cd; --line-2:#e1e6e1;
  --acc:#1d5a48; --acc-ink:#ffffff; --danger:#b3261e; --warn-bg:#fdf3d5; --warn-ink:#634800;
  --chk-a:#ffffff; --chk-b:#dfe3de; --code:#f6f7f4; --toast:#13201b; --toast-ink:#fff; --frame:#e0218a; --shade:rgba(12,20,16,.6);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171d1a; --surface-2:#1f2622; --ink:#e6ece8; --ink-2:#c1cbc5; --muted:#93a19a; --line:#313b36; --line-2:#242c28;
  --acc:#8fd3b9; --acc-ink:#0c1a14; --danger:#ff8a80; --warn-bg:#382e12; --warn-ink:#ffe08a;
  --chk-a:#2a302d; --chk-b:#1e2421; --code:#141916; --toast:#e6ece8; --toast-ink:#0f1412; --frame:#ff5cb4; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171d1a; --surface-2:#1f2622; --ink:#e6ece8; --ink-2:#c1cbc5; --muted:#93a19a; --line:#313b36; --line-2:#242c28;
  --acc:#8fd3b9; --acc-ink:#0c1a14; --danger:#ff8a80; --warn-bg:#382e12; --warn-ink:#ffe08a;
  --chk-a:#2a302d; --chk-b:#1e2421; --code:#141916; --toast:#e6ece8; --toast-ink:#0f1412; --frame:#ff5cb4; --shade:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{flex:1;min-width:0;margin:0;font-size:18px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
header h1 .mark{width:22px;height:22px;flex:none;border:1.5px solid var(--ink);background:radial-gradient(circle,var(--ink) 1.6px,transparent 2.2px) 0 0/7px 7px}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.solid{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:650}
.btn svg{width:18px;height:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:4px}
.pvcol{min-width:0}
.pv{position:relative;height:45vh;min-height:220px;max-height:560px;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--chk-a);background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#pvFill{position:absolute;inset:0}
#frame{position:absolute;border:1.5px dashed var(--frame);pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.pvctl{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none}
.pvctl>*{pointer-events:auto}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:3px;font-size:13.5px;cursor:pointer}
.chip input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.zoom{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.zoom button{min-width:44px;min-height:44px;border:0;background:transparent;cursor:pointer;font-size:16px}
.zoom output{min-width:44px;text-align:center;font-family:var(--mono);font-size:12.5px}
.tag{position:absolute;left:8px;top:8px;font-size:12px;padding:3px 8px;background:var(--shade);color:#fff;border-radius:3px;pointer-events:none}
.types{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ty{flex:none;width:72px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);scroll-snap-align:start}
.ty i{width:64px;height:64px;display:block;border:1px solid var(--line);background-color:var(--surface)}
.ty[aria-pressed="true"] i{outline:2.5px solid var(--acc);outline-offset:2px}
.ty[aria-pressed="true"]{color:var(--ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px}
.panel+.panel{margin-top:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.ph h2{font-size:12px;letter-spacing:.16em;color:var(--muted);margin:0;font-weight:700}
.ctl{display:grid;grid-template-columns:4.6em minmax(0,1fr) 4.2em;align-items:center;gap:0 8px}
.ctl label{font-size:13.5px;color:var(--ink-2)}
.ctl output{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;min-width:0;height:44px;margin:0;accent-color:var(--acc);cursor:pointer;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row>label{font-size:13.5px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cf{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.cf .pair{display:flex;align-items:center;gap:6px}
input[type=color]{width:100%;min-width:44px;height:44px;border:1px solid var(--line);border-radius:3px;padding:3px;background:var(--surface);cursor:pointer}
input[type=color]:disabled{opacity:.35}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:0}
input[type=text],input[type=number],select{min-height:44px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2);padding:0 10px;font-size:15px;min-width:0}
input[type=number]{width:96px;font-family:var(--mono)}
.small{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.warn{font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:3px;padding:6px 10px;margin:8px 0 0}
pre.code{margin:8px 0 0;background:var(--code);border:1px solid var(--line-2);border-radius:3px;padding:10px 12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.favs{display:flex;gap:8px;flex-wrap:wrap}
.fav{position:relative;width:64px;height:64px;border:1px solid var(--line);cursor:pointer;padding:0;background-color:var(--surface)}
.fav .x{position:absolute;right:-8px;top:-8px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:none;align-items:flex-start;justify-content:flex-end;padding:0}
.fav .x span{width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:14px;line-height:22px;text-align:center;display:block}
.favs.editing .fav .x{display:flex}
.pals{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pal{display:flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0 10px;text-align:left;font-size:13.5px}
.pal span{display:flex;flex:none}
.pal span i{width:18px;height:28px;display:block}
.ov{position:fixed;inset:0;background:var(--shade);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto}
.ov .card{background:var(--surface);border:1px solid var(--line);padding:14px;max-width:min(560px,100%);width:100%}
.ov img{display:block;max-width:100%;max-height:60vh;margin:10px auto;border:1px solid var(--line);background-color:var(--chk-a)}
@media (max-height:600px){ .ov{place-items:start center} }
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:3px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
@media (hover:hover){.btn:hover,.chip:hover,.pal:hover{border-color:var(--ink-2)} .ty:hover i{border-color:var(--ink-2)}}
@media (min-width:900px), (min-width:640px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .pvcol{position:sticky;top:8px}
  .pv{height:min(60vh,600px)}
}
@media (max-height:500px) and (orientation:landscape){ .pv{height:calc(100vh - 150px);min-height:180px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1><span class="mark" aria-hidden="true"></span>圖案底紋產生器</h1>
  <button class="btn" type="button" id="randBtn" title="隨機圖案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>隨機</button>
  <button class="btn" type="button" id="themeBtn" aria-label="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/></svg></button>
</header>

<div class="layout">
  <div class="pvcol">
    <div class="pv" id="pv" aria-label="圖案預覽，單指拖曳平移，雙指縮放">
      <div id="pvFill"></div>
      <div id="frame" hidden></div>
      <span class="tag" id="sampleTag">範例：錯位圓點</span>
      <div class="pvctl">
        <label class="chip"><input type="checkbox" id="showFrame">顯示單元框</label>
        <div class="zoom"><button type="button" id="zOut" aria-label="縮小預覽">−</button><output id="zOut2">100%</output><button type="button" id="zIn" aria-label="放大預覽">＋</button></div>
      </div>
    </div>
    <div class="types" id="types" role="group" aria-label="圖案種類"></div>
  </div>

  <div>
    <section class="panel">
      <div class="ph"><h2 id="paramTitle">參數</h2><span class="small" id="tileInfo" style="margin:0"></span></div>
      <div id="params"></div>
      <div class="row" id="seedRow" hidden><label for="seed">種子</label><input type="number" id="seed" min="0" max="999999999" step="1"><button class="btn" type="button" id="reseed">換一組</button></div>
      <div id="common"></div>
      <p class="warn" id="pWarn" hidden></p>
    </section>

    <section class="panel">
      <div class="ph"><h2>顏色</h2><button class="btn" type="button" id="palBtn" hidden>從調色盤套用</button></div>
      <div class="cols">
        <div class="cf"><label for="fg">前景</label><input type="color" id="fg"></div>
        <div class="cf"><label for="bg">背景</label><input type="color" id="bg"><label class="chk" style="min-height:36px"><input type="checkbox" id="bgT">透明</label></div>
        <div class="cf"><label for="fg2">第二前景</label><input type="color" id="fg2"><label class="chk" style="min-height:36px"><input type="checkbox" id="use2">使用</label></div>
      </div>
      <div class="pals" id="pals" hidden></div>
    </section>

    <section class="panel">
      <div class="ph"><h2>輸出</h2></div>
      <div class="btns">
        <button class="btn solid" type="button" id="copyCss">複製 CSS（data URI）</button>
        <button class="btn" type="button" id="copySvg">複製 SVG 程式碼</button>
        <button class="btn" type="button" id="dlSvg">下載 SVG（單元）</button>
        <button class="btn" type="button" id="copyPure" hidden>複製純 CSS 版</button>
      </div>
      <pre class="code" id="cssOut" tabindex="0"></pre>
      <div class="row">
        <label for="pngSize">PNG 尺寸</label>
        <select id="pngSize"><option value="unit">單元</option><option value="1920x1080" selected>1920×1080</option><option value="3000x3000">3000×3000</option><option value="custom">自訂</option></select>
        <label class="chk"><input type="checkbox" id="png2x">2× 解析度</label>
      </div>
      <div class="row" id="customRow" hidden>
        <input type="number" id="pngW" min="1" max="8192" value="1200" aria-label="寬"> × <input type="number" id="pngH" min="1" max="8192" value="800" aria-label="高"> px
      </div>
      <div class="row"><button class="btn solid" type="button" id="pngBtn" style="flex:1">下載 PNG</button></div>
      <p class="small" id="dlNote" hidden>此環境無法直接下載：SVG 會改為複製程式碼，PNG 會顯示成圖片，長按（電腦按右鍵）即可儲存。</p>
    </section>

    <section class="panel">
      <div class="ph"><h2>收藏</h2><div class="row" style="margin:0"><button class="btn" type="button" id="favAdd">收藏目前圖案</button><button class="btn" type="button" id="favEdit" aria-pressed="false" hidden>管理</button></div></div>
      <div class="favs" id="favs"></div>
      <p class="small" id="favEmpty">尚無收藏，最多 50 個。</p>
    </section>
  </div>
</div>
</div>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovT">
  <div class="card"><div class="ph"><h2 id="ovT">PNG 圖片</h2><button class="btn" type="button" id="ovClose">關閉</button></div><p class="small" id="ovNote"></p><img id="ovImg" alt="產生的 PNG 圖案"></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='pattern-maker:v1:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));return true;}catch(e){return false;}}};
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2300);}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r2=n=>Math.round(n*100)/100;
const rnd=()=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; };
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- pattern definitions ---------- */
// each param: [key,label,min,max,step,default]
const SZ=['size','單元尺寸',8,200,1];
const TYPES={
  dots:{name:'圓點',params:[[...SZ,24],['r','點半徑',1,100,.5,4]]},
  dotsOff:{name:'錯位圓點',params:[[...SZ,32],['r','點半徑',1,100,.5,5]],two:'中心點'},
  diag:{name:'斜條紋',params:[[...SZ,20],['width','線寬',.5,100,.5,6]]},
  hstripes:{name:'橫條紋',params:[[...SZ,20],['width','線寬',.5,100,.5,6]],two:'第二條紋'},
  grid:{name:'格線',params:[[...SZ,24],['width','線寬',.5,50,.5,1]]},
  checker:{name:'方格棋盤',params:[[...SZ,32]],two:'另一組方格'},
  tri:{name:'三角',params:[[...SZ,32]],two:'倒三角'},
  hex:{name:'六角',params:[['r','六角半徑',4,100,1,16],['stroke','線寬',.5,20,.5,2]],two:'填色'},
  wave:{name:'波浪',params:[['size','波長',8,200,1,40],['amp','振幅',0,60,.5,6],['gap','間距',4,200,1,20],['width','線寬',.5,20,.5,2]]},
  zigzag:{name:'鋸齒',params:[['size','波長',8,200,1,24],['amp','振幅',0,60,.5,5],['gap','間距',4,200,1,16],['width','線寬',.5,20,.5,2]]},
  cross:{name:'十字',params:[[...SZ,32],['arm','臂長',1,100,.5,7],['width','線寬',.5,40,.5,2.5]]},
  diamond:{name:'菱形',params:[[...SZ,32],['k','菱形大小',10,100,1,60]],two:'角落菱形'},
  scales:{name:'魚鱗',params:[['r','鱗片半徑',4,100,1,16],['width','線寬',.5,20,.5,1.5]],two:'鱗片填色'},
  bricks:{name:'磚牆',params:[['size','磚寬',8,200,1,48],['h','磚高',4,200,1,22],['width','灰縫',.5,30,.5,3]],two:'磚塊填色'},
  rings:{name:'同心圓',params:[[...SZ,60],['n','圈數',1,12,1,4],['width','線寬',.5,20,.5,2]],two:'交錯圈色'},
  random:{name:'隨機點陣',params:[['size','單元尺寸',20,200,1,80],['n','點數',1,200,1,24],['r','點半徑',.5,30,.5,3]],two:'第二點色',seed:true},
};
const ORDER=Object.keys(TYPES);
const COMMON=[['angle','旋轉',0,180,1,0,'°'],['scale','縮放',25,400,5,100,'%'],['opacity','透明度',0,100,1,100,'%']];

const circle=(x,y,r,f)=>`<circle cx='${r2(x)}' cy='${r2(y)}' r='${r2(r)}' fill='${f}'/>`;
const rect=(x,y,w,h,f)=>`<rect x='${r2(x)}' y='${r2(y)}' width='${r2(w)}' height='${r2(h)}' fill='${f}'/>`;
const poly=(pts,f)=>`<polygon points='${pts.map(p=>r2(p[0])+','+r2(p[1])).join(' ')}' fill='${f}'/>`;
// gen(type, p, F, F2, BGF) -> {w,h,body}
function gen(type,p,F,F2,BGF){
  const S=Math.max(4,p.size||0);
  switch(type){
    case 'dots': return {w:S,h:S,body:circle(S/2,S/2,p.r,F)};
    case 'dotsOff': return {w:S,h:S,body:[[0,0],[S,0],[0,S],[S,S]].map(([x,y])=>circle(x,y,p.r,F)).join('')+circle(S/2,S/2,p.r,F2||F)};
    case 'diag': return {w:S,h:S,body:`<path d='M${-S},${S} L${S},${-S} M${-S},${2*S} L${2*S},${-S} M0,${2*S} L${2*S},0' stroke='${F}' stroke-width='${r2(p.width)}' fill='none'/>`};
    case 'hstripes': return {w:S,h:S,body:rect(0,0,S,Math.min(p.width,S),F)+(F2?rect(0,S/2,S,Math.min(p.width,S/2),F2):'')};
    case 'grid': return {w:S,h:S,body:rect(0,0,S,Math.min(p.width,S),F)+rect(0,0,Math.min(p.width,S),S,F)};
    case 'checker': return {w:S,h:S,body:rect(0,0,S/2,S/2,F)+rect(S/2,S/2,S/2,S/2,F)+(F2?rect(S/2,0,S/2,S/2,F2)+rect(0,S/2,S/2,S/2,F2):'')};
    case 'tri': return {w:S,h:S,body:poly([[0,S],[S/2,0],[S,S]],F)+(F2?poly([[0,0],[S/2,0],[0,S]],F2)+poly([[S/2,0],[S,0],[S,S]],F2):'')};
    case 'hex': { const r=Math.max(4,p.r), w=Math.sqrt(3)*r, h=3*r;
      const hx=(cx,cy)=>'M'+[...Array(6)].map((_,i)=>{const a=Math.PI/180*(60*i-90);return r2(cx+r*Math.cos(a))+','+r2(cy+r*Math.sin(a));}).join(' L')+'Z';
      const d=[[0,0],[w,0],[w/2,1.5*r],[0,h],[w,h]].map(c=>hx(c[0],c[1])).join(' ');
      return {w,h,body:`<path d='${d}' fill='${F2||'none'}' stroke='${F}' stroke-width='${r2(p.stroke)}'/>`}; }
    case 'wave': case 'zigzag': { const G=Math.max(4,p.gap), a=p.amp; let out='';
      for(const yy of [G/2-G,G/2,G/2+G]){ if(yy+a+p.width<0||yy-a-p.width>G) continue;
        let d;
        if(type==='wave') d=`M${-S},${r2(yy)} Q${r2(-S*.75)},${r2(yy-2*a)} ${r2(-S/2)},${r2(yy)} T0,${r2(yy)} T${r2(S/2)},${r2(yy)} T${S},${r2(yy)} T${r2(S*1.5)},${r2(yy)} T${2*S},${r2(yy)}`;
        else { const pts=[]; for(let k=-2;k<=4;k++) pts.push(r2(k*S/2)+','+r2(yy+(k%2===0?a:-a))); d='M'+pts.join(' L'); }
        out+=`<path d='${d}' fill='none' stroke='${F}' stroke-width='${r2(p.width)}' stroke-linejoin='${type==='wave'?'round':'miter'}'/>`; }
      return {w:S,h:G,body:out}; }
    case 'cross': { const c=S/2, a=Math.min(p.arm,S/2), w=p.width; return {w:S,h:S,body:rect(c-a,c-w/2,2*a,w,F)+rect(c-w/2,c-a,w,2*a,F)}; }
    case 'diamond': { const c=S/2, d=S/2*p.k/100, dm=(x,y,f)=>poly([[x,y-d],[x+d,y],[x,y+d],[x-d,y]],f);
      return {w:S,h:S,body:dm(c,c,F)+(F2?[[0,0],[S,0],[0,S],[S,S]].map(([x,y])=>dm(x,y,F2)).join(''):'')}; }
    case 'scales': { const r=Math.max(4,p.r), fill=F2||BGF||'none', sw=r2(p.width);
      const c=(x,y)=>`<circle cx='${r2(x)}' cy='${r2(y)}' r='${r}' fill='${fill}' stroke='${F}' stroke-width='${sw}'/>`;
      return {w:2*r,h:2*r,body:c(0,0)+c(2*r,0)+c(r,r)+c(0,2*r)+c(2*r,2*r)}; }
    case 'bricks': { const B=S, H=Math.max(4,p.h), m=p.width;
      return {w:B,h:2*H,body:(F2?rect(0,0,B,2*H,F2):'')+rect(0,0,B,m,F)+rect(0,H,B,m,F)+rect(0,0,m,H,F)+rect(B/2,H,m,H,F)}; }
    case 'rings': { let out=''; for(let i=1;i<=p.n;i++) out+=`<circle cx='${S/2}' cy='${S/2}' r='${r2(S/2*i/p.n-p.width/2)}' fill='none' stroke='${F2&&i%2===0?F2:F}' stroke-width='${r2(p.width)}'/>`; return {w:S,h:S,body:out}; }
    case 'random': { const R=mulberry32(p.seed>>>0), r=p.r; let out='';
      for(let i=0;i<p.n;i++){ const x=R()*S, y=R()*S, f=F2&&R()<.5?F2:F;
        for(const dx of [-S,0,S]) for(const dy of [-S,0,S]){ const X=x+dx, Y=y+dy; if(X+r<0||X-r>S||Y+r<0||Y-r>S) continue; out+=circle(X,Y,r,f); } }
      return {w:S,h:S,body:out}; }
  }
}

function sanitize(s){ const d=defaults(); if(!s||typeof s!=='object') return d; const o=Object.assign({},d,s); if(!TYPES[o.type]) o.type=d.type;
  o.params=Object.assign({},d.params); if(s.params&&typeof s.params==='object') for(const t of ORDER) if(s.params[t]) o.params[t]=Object.assign({},d.params[t],s.params[t]);

/* ---------- tile building ---------- */
const P=()=>S.params[S.type];
function hexA(h,a){ return h; }
function baseTile(st){ st=st||S; const F=st.fg, F2=st.use2&&TYPES[st.type].two?st.fg2:null; return gen(st.type,st.params[st.type],F,F2,st.bgT?null:st.bg); }
// lattice fit so rotated output is perfectly periodic in x and y
function fitLattice(w,h,s,ang){
  const t=ang*Math.PI/180, c=Math.cos(t), sn=Math.sin(t);
  const M=[[c*s*w,-sn*s*h],[sn*s*w,c*s*h]]; // columns are lattice vectors
  const lim=Math.max(700,12*Math.max(w,h)*s), N=48;
  let bp=null,bq=null,ep=1e9,eq=1e9;
  for(let i=-N;i<=N;i++) for(let j=-N;j<=N;j++){ if(!i&&!j) continue;
    const vx=M[0][0]*i+M[0][1]*j, vy=M[1][0]*i+M[1][1]*j;
    if(vx>=40&&vx<=lim){ const e=Math.abs(vy)/vx+vx/lim*0.002; if(e<ep){ep=e;bp=[i,j,vx,vy];} }
    if(vy>=40&&vy<=lim){ const e=Math.abs(vx)/vy+vy/lim*0.002; if(e<eq){eq=e;bq=[i,j,vx,vy];} }
  }
  const X=Math.round(bp[2]), Y=Math.round(bq[3]);
  const det=bp[0]*bq[1]-bq[0]*bp[1];
  // Tidx = diag(X,Y) * inv([p q])
  const inv=[[bq[1]/det,-bq[0]/det],[-bp[1]/det,bp[0]/det]];
  const T=[[X*inv[0][0],X*inv[0][1]],[Y*inv[1][0],Y*inv[1][1]]];
  return {X,Y,m:[T[0][0]/w,T[1][0]/w,T[0][1]/h,T[1][1]/h]};
}
const XMLNS="xmlns='http://www.w3.org/2000/svg'";
// returns {w,h,svg} where svg has no background (for CSS) or with background
function buildTile(opts){ opts=opts||{}; const st=opts.state||S; const k=opts.k||1;
  const t=baseTile(st); const s=st.scale/100, op=st.opacity/100;
  const bgEl=(W,H)=>opts.withBg&&!st.bgT?`<rect width='${W}' height='${H}' fill='${st.bg}'/>`:'';
  const g=op<1?`<g opacity='${r2(op)}'>${t.body}</g>`:t.body;
  if(!st.angle){ const W=r2(t.w*s), H=r2(t.h*s);
    return {w:W,h:H,base:t,svg:`<svg ${XMLNS} width='${r2(W*k)}' height='${r2(H*k)}' viewBox='0 0 ${r2(t.w)} ${r2(t.h)}'>${opts.withBg&&!st.bgT?`<rect width='${r2(t.w)}' height='${r2(t.h)}' fill='${st.bg}'/>`:''}${g}</svg>`}; }
  const L=fitLattice(t.w,t.h,s,st.angle), m=L.m.map(v=>+v.toFixed(5));
  return {w:L.X,h:L.Y,base:t,rot:true,svg:`<svg ${XMLNS} width='${L.X*k}' height='${L.Y*k}' viewBox='0 0 ${L.X} ${L.Y}'><defs><pattern id='p' patternUnits='userSpaceOnUse' width='${r2(t.w)}' height='${r2(t.h)}' patternTransform='matrix(${m.join(' ')} 0 0)'>${g}</pattern></defs>${bgEl(L.X,L.Y)}<rect width='${L.X}' height='${L.Y}' fill='url(#p)'/></svg>`};
}
function dataURI(svg){ return 'data:image/svg+xml,'+encodeURIComponent(svg).replace(/%20/g,' ').replace(/%3D/g,'=').replace(/%3A/g,':').replace(/%2F/g,'/').replace(/%2C/g,',').replace(/%3B/g,';').replace(/%27/g,"'"); }
function cssText(){ const t=buildTile(); return `background-color: ${S.bgT?'transparent':S.bg};\nbackground-image: url("${dataURI(t.svg)}");`; }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return a>=1?hex:`rgba(${n>>16},${n>>8&255},${n&255},${r2(a)})`; }
function pureCSS(){
  if(S.angle) return null; const p=P(), s=S.scale/100, F=rgba(S.fg,S.opacity/100), B=S.bgT?'transparent':S.bg, size=r2(Math.max(4,p.size)*s);
  switch(S.type){
    case 'dots': return `background-color: ${B};\nbackground-image: radial-gradient(circle at center, ${F} ${r2(p.r*s)}px, transparent ${r2(p.r*s+.5)}px);\nbackground-size: ${size}px ${size}px;`;
    case 'hstripes': if(S.use2) return null; return `background-color: ${B};\nbackground-image: repeating-linear-gradient(180deg, ${F} 0 ${r2(p.width*s)}px, transparent ${r2(p.width*s)}px ${size}px);`;
    case 'diag': { const per=r2(size/Math.SQRT2); return `background-color: ${B};\nbackground-image: repeating-linear-gradient(-45deg, ${F} 0 ${r2(Math.min(p.width*s,per))}px, transparent ${r2(Math.min(p.width*s,per))}px ${per}px);`; }

  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d');
  if(!S.bgT){ x.fillStyle=S.bg; x.fillRect(0,0,cw,ch); }
  const im=await loadImg(t.svg); const tc=document.createElement('canvas'); tc.width=Math.max(1,Math.round(t.w*k)); tc.height=Math.max(1,Math.round(t.h*k)); tc.getContext('2d').drawImage(im,0,0,tc.width,tc.height);
  x.fillStyle=x.createPattern(tc,'repeat'); x.fillRect(0,0,cw,ch);
  return c;
}
$('#pngBtn').onclick=async()=>{ const b=$('#pngBtn'); b.disabled=true; const old=b.textContent; b.textContent='產生中…';
  try{ const c=await makePNG(); const blob=await new Promise(r=>c.toBlob(r,'image/png')); if(!blob) throw new Error('blob');
    if(await save(fname('png'),blob)) return;
    const url=URL.createObjectURL(blob); $('#ovImg').src=url; $('#ovImg').dataset.url=url; $('#ovNote').textContent=`${c.width}×${c.height} px。長按圖片（電腦按右鍵）即可儲存。`; $('#ov').hidden=false; $('#ovClose').focus();
  }catch(e){ toast('PNG 產生失敗：'+(e.message||e)); } finally{ b.disabled=false; b.textContent=old; } };
function closeOv(){ $('#ov').hidden=true; const u=$('#ovImg').dataset.url; if(u){ URL.revokeObjectURL(u); $('#ovImg').removeAttribute('src'); delete $('#ovImg').dataset.url; } }
$('#ovClose').onclick=closeOv; $('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeOv(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#ov').hidden) closeOv(); });

/* ---------- favorites ---------- */
let favs=store.get('favorites',[]); if(!Array.isArray(favs)) favs=[];
function renderFavs(){ const host=$('#favs'); host.innerHTML='';
  favs.forEach((f,i)=>{ const st=sanitize({...defaults(),type:f.type,params:{[f.type]:f.params},...f.colors,angle:f.angle,scale:f.scale,opacity:f.opacity});
    if(f.seed!=null) st.params[f.type].seed=f.seed;
    const t=buildTile({state:st}); const k=clamp(32/Math.max(t.w,t.h),.25,1.2);
    const b=document.createElement('div'); b.className='fav'; b.tabIndex=0; b.setAttribute('role','button'); b.id='fav'+i; b.setAttribute('aria-label','載入收藏 '+(i+1)+'：'+TYPES[f.type].name);
    b.style.backgroundColor=st.bgT?'transparent':st.bg; b.style.backgroundImage=`url("${dataURI(t.svg)}")`; b.style.backgroundSize=`${r2(t.w*k)}px ${r2(t.h*k)}px`;
    b.innerHTML=`<button type="button" class="x" aria-label="刪除收藏 ${i+1}"><span>×</span></button>`;
    const load=()=>{ if(host.classList.contains('editing')) return; S.type=f.type; S.params[f.type]=Object.assign(defParams(f.type),f.params); if(f.seed!=null) S.params[f.type].seed=f.seed; Object.assign(S,f.colors,{angle:f.angle,scale:f.scale,opacity:f.opacity}); S=sanitize(S); render(); toast('已載入收藏'); };
    b.addEventListener('click',e=>{ if(e.target.closest('.x')){ favs.splice(i,1); store.set('favorites',favs); renderFavs(); return; } load(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target===b) load(); });
    host.appendChild(b); });
  $('#favEmpty').hidden=favs.length>0; $('#favEdit').hidden=!favs.length; if(!favs.length){ host.classList.remove('editing'); $('#favEdit').textContent='管理'; $('#favEdit').setAttribute('aria-pressed','false'); }
}
$('#favAdd').onclick=()=>{ if(favs.length>=50){ toast('已達 50 個上限'); return; }
  const p=Object.assign({},P()); favs.unshift({type:S.type,params:p,colors:{fg:S.fg,bg:S.bg,bgT:S.bgT,fg2:S.fg2,use2:S.use2},seed:p.seed??null,angle:S.angle,scale:S.scale,opacity:S.opacity});
  if(!store.set('favorites',favs)) toast('瀏覽器無法儲存，重新整理後會遺失'); else toast('已收藏'); renderFavs(); };
$('#favEdit').onclick=()=>{ const on=!$('#favs').classList.contains('editing'); $('#favs').classList.toggle('editing',on); $('#favEdit').textContent=on?'完成':'管理'; $('#favEdit').setAttribute('aria-pressed',on); };

/* ---------- theme ---------- */
const themes=['auto','light','dark'], tName={auto:'跟隨系統',light:'淺色',dark:'深色'}; let theme=store.get('theme','auto'); if(!themes.includes(theme)) theme='auto';
function applyTheme(){ if(theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',theme); $('#themeBtn').title='主題：'+tName[theme]; }
$('#themeBtn').onclick=()=>{ theme=themes[(themes.indexOf(theme)+1)%3]; store.set('theme',theme); applyTheme(); toast('主題：'+tName[theme]); };
applyTheme();
$('#sampleTag').hidden=!!savedState;
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; }
  $('#dlSvg').hidden=!dl; $('#pngBtn').textContent=dl?'下載 PNG':'產生 PNG'; $('#dlNote').hidden=!!dl; })();
addEventListener('resize',render);
renderFavs(); draw();
window.__pm={get S(){return S;},set S(v){S=sanitize(v);render();},gen,buildTile,fitLattice,cssText,pureCSS,makePNG,dataURI,TYPES,draw};
})();
</script>
