<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>字卡產生器</title>
<style>
:root{
  --bg:#eceeef; --surface:#ffffff; --surface-2:#f6f7f8; --ink:#0f1113; --muted:#575d64; --line:#cfd3d7; --line-2:#e1e4e7;
  --accent:#c9302a; --accent-ink:#ffffff; --accent-soft:#f7dedc; --err:#c9302a; --shade:rgba(10,12,14,.55); --stagebg:#dfe2e5;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#18191c; --surface-2:#1f2024; --ink:#ececee; --muted:#9da1a8; --line:#31343a; --line-2:#26282d;
  --accent:#ff6b5e; --accent-ink:#2a0806; --accent-soft:#3c1916; --err:#ff8a7f; --shade:rgba(0,0,0,.72); --stagebg:#08090a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#18191c; --surface-2:#1f2024; --ink:#ececee; --muted:#9da1a8; --line:#31343a; --line-2:#26282d;
  --accent:#ff6b5e; --accent-ink:#2a0806; --accent-soft:#3c1916; --err:#ff8a7f; --shade:rgba(0,0,0,.72); --stagebg:#08090a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:8px 16px calc(28px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:50px;margin-bottom:4px}
header h1{flex:1;margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;min-width:0}
header h1 span{color:var(--accent)}
.btn{min-height:44px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;font-size:13px;padding:0 10px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;border-radius:2px}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.work{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.previewCol{min-width:0;position:sticky;top:0;z-index:5;background:var(--bg);padding-top:4px}
.stick{padding:6px 0 4px}
.stage{display:flex;justify-content:center;align-items:center;background:var(--stagebg);padding:10px;border-radius:2px;position:relative}
#cv{display:block;touch-action:none;box-shadow:0 8px 28px rgba(0,0,0,.22);-webkit-user-select:none;user-select:none;cursor:grab}
.warnRow{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:22px;font-size:12px;color:var(--muted);margin-top:4px}
#overflow{color:var(--err);font-weight:800}
.note{font-size:13px;background:var(--accent-soft);padding:6px 10px;border-left:3px solid var(--accent);margin:4px 0 6px}
.customSize{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.customSize input{width:96px;min-height:44px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-family:var(--mono);border-radius:2px}
.controls{min-width:0}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:2px;line-height:1.4}
.field textarea{resize:vertical;min-height:84px}
@media (max-width:899px){.field textarea,.field input[type=text]{scroll-margin-top:calc(30vh + 120px)}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--ink);margin-top:6px}
.tab{min-height:48px;border:0;background:none;cursor:pointer;font-weight:800;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pane{display:none;padding:12px 0}
.pane.on{display:block}
.pane h2{display:none;font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 0 8px;font-weight:800}
.row{display:grid;grid-template-columns:80px minmax(0,1fr) 58px;gap:8px;align-items:center;min-height:44px}
.row>label{font-size:14px}
.row output{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px;margin:2px 0}
.row2>label:first-child{min-width:80px;font-size:14px}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent)}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);background:var(--surface);padding:2px;border-radius:2px;cursor:pointer}
select{min-height:44px;border:1px solid var(--line);background:var(--surface);padding:0 10px;border-radius:2px;min-width:150px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:4px 0}
#bgFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:100%;overflow:auto;padding:16px;border-radius:4px}
.sheet h3{margin:0 0 10px;font-size:17px;font-weight:900}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tpl{border:1px solid var(--line);background:var(--surface-2);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;font-weight:700;border-radius:2px;position:relative}
.tpl canvas{width:100%;aspect-ratio:1;display:block}
.tpl .del{position:absolute;right:0;top:0;width:32px;height:32px;border:0;background:var(--shade);color:#fff;cursor:pointer;font-size:16px}
.outimg{display:block;max-width:100%;max-height:46vh;margin:8px auto;border:1px solid var(--line)}
.sheetBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (hover:hover){.btn:hover,.chip:hover,.tpl:hover{border-color:var(--ink)}.tab:hover{color:var(--ink)}.tab[aria-selected="true"]:hover{color:var(--bg)}}
@media (min-width:900px){
  .work{grid-template-columns:minmax(0,3fr) minmax(320px,2fr);align-items:start}
  .tabs{display:none}
  .pane{display:block;border-top:1px solid var(--line);padding:12px 0 6px}
  .pane h2{display:block}
}
@media (orientation:landscape) and (max-height:520px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1>字卡<span>產生器</span></h1>
    <button class="btn" type="button" id="tplBtn">範本</button>
    <button class="btn primary" type="button" id="dlBtn">下載</button>
  </header>
  <div class="work">
    <section class="previewCol">
      <div class="chips" role="radiogroup" aria-label="尺寸" id="sizeRow"></div>
      <div class="customSize" id="customSize" hidden>
        <input type="number" id="cWidth" min="200" max="4096" aria-label="自訂寬度"> × <input type="number" id="cHeight" min="200" max="4096" aria-label="自訂高度"> <span class="hint">px（200–4096）</span>
      </div>
      <div class="stick" id="stick">
        <div class="stage" id="stage"><canvas id="cv" aria-label="字卡預覽，拖曳文字可上下移動"></canvas></div>
        <div class="warnRow"><span id="sizeInfo"></span><span id="overflow" role="status" hidden>文字超出版面</span></div>
      </div>
      <div class="note" id="sampleNote" hidden><b>範例</b>：這是示範字卡，直接修改下方文字或套用範本即可。</div>
    </section>
    <section class="controls">
      <label class="field" for="title"><span>主標</span><textarea id="title" rows="3" placeholder="在這裡輸入標題"></textarea></label>
      <label class="field" for="sub"><span>副標</span><input type="text" id="sub" placeholder="（選填）"></label>
      <label class="field" for="author"><span>署名</span><input type="text" id="author" placeholder="（選填）"></label>
      <nav class="tabs" role="tablist" aria-label="樣式">
        <button class="tab" type="button" role="tab" id="tab-text" data-tab="text" aria-selected="true" aria-controls="pane-text">文字</button>
        <button class="tab" type="button" role="tab" id="tab-bg" data-tab="bg" aria-selected="false" aria-controls="pane-bg">背景</button>
        <button class="tab" type="button" role="tab" id="tab-layout" data-tab="layout" aria-selected="false" aria-controls="pane-layout">版面</button>
      </nav>
      <div class="pane on" id="pane-text" data-pane="text" role="tabpanel">
        <h2>文字</h2>
        <div class="row2"><label for="font">字型</label><select id="font"><option value="sans">黑體</option><option value="serif">明體</option><option value="round">圓體</option><option value="mono">等寬</option></select></div>
        <div class="row2"><label>字重</label><div class="chips" id="weightRow" role="radiogroup" aria-label="字重"></div></div>
        <div class="row2"><label class="check" for="autoSize"><input type="checkbox" id="autoSize"> 自動字級</label></div>
        <div class="row"><label for="fsize">字級</label><input type="range" id="fsize" min="24" max="240" step="1"><output id="fsizeOut"></output></div>
        <div class="row"><label for="lh">行高</label><input type="range" id="lh" min="1" max="2" step="0.05"><output id="lhOut"></output></div>
        <div class="row"><label for="ls">字距</label><input type="range" id="ls" min="-0.05" max="0.3" step="0.01"><output id="lsOut"></output></div>
        <div class="row2"><label for="color">顏色</label><input type="color" id="color"></div>
        <div class="row"><label for="strokeW">描邊</label><input type="range" id="strokeW" min="0" max="20" step="1"><output id="strokeWOut"></output></div>
        <div class="row2"><label for="strokeC">描邊色</label><input type="color" id="strokeC"><label class="check" for="shadow"><input type="checkbox" id="shadow"> 陰影</label></div>
        <div class="row2"><label>對齊</label><div class="chips" id="alignRow" role="radiogroup" aria-label="對齊"></div></div>
      </div>
      <div class="pane" id="pane-bg" data-pane="bg" role="tabpanel">
        <h2>背景</h2>
        <div class="chips" id="bgTypeRow" role="radiogroup" aria-label="背景類型"></div>
        <div id="bgSolid"><div class="row2"><label for="bgColor">底色</label><input type="color" id="bgColor"></div></div>
        <div id="bgGrad">
          <div class="row2"><label for="g1">漸層</label><input type="color" id="g1" aria-label="漸層起點"><input type="color" id="g2" aria-label="漸層終點"></div>
          <div class="row"><label for="gAngle">角度</label><input type="range" id="gAngle" min="0" max="360" step="5"><output id="gAngleOut"></output></div>
        </div>
        <div id="bgPhoto">
          <div class="row2"><button class="btn small" type="button" id="pickBg">選擇背景照片</button><span class="hint" id="photoName"></span></div>
          <div class="row"><label for="dim">暗化</label><input type="range" id="dim" min="0" max="80" step="1"><output id="dimOut"></output></div>
          <div class="row" id="blurRow"><label for="blur">模糊</label><input type="range" id="blur" min="0" max="20" step="1"><output id="blurOut"></output></div>
          <p class="hint">在畫布上文字以外的地方拖曳，可移動照片焦點。</p>
        </div>
      </div>
      <div class="pane" id="pane-layout" data-pane="layout" role="tabpanel">
        <h2>版面</h2>
        <div class="row2"><label>垂直位置</label><div class="chips" id="vposRow" role="radiogroup" aria-label="垂直位置"></div></div>
        <div class="row"><label for="pad">內距</label><input type="range" id="pad" min="0" max="20" step="1"><output id="padOut"></output></div>
        <div class="row2"><label class="check" for="hl"><input type="checkbox" id="hl"> 強調色帶</label><input type="color" id="hlColor" aria-label="色帶顏色"></div>
        <div class="row2"><label for="deco">裝飾</label><select id="deco"><option value="none">無</option><option value="quote">大引號</option><option value="bar">頂部色條</option><option value="frame">細框</option></select><input type="color" id="accent" aria-label="裝飾顏色"></div>
        <p class="hint">拖曳畫布上的文字可微調位置；雙指縮放改字級；雙擊文字跳到輸入框。</p>
      </div>
    </section>
  </div>
</div>
<input type="file" id="bgFile" accept="image/*" aria-label="選擇背景照片">

<div class="ov" id="tplOv" hidden role="dialog" aria-modal="true" aria-labelledby="tplTitle">
  <div class="sheet">
    <h3 id="tplTitle">範本 <span class="hint">（只換樣式，不改文字）</span></h3>
    <div class="tgrid" id="tplGrid"></div>
    <h3 style="margin-top:16px">我的範本 <span class="hint" id="presetCount"></span></h3>
    <div class="tgrid" id="presetGrid"></div>
    <div class="sheetBtns"><button class="btn" type="button" id="savePreset">儲存目前樣式</button><button class="btn primary" type="button" id="tplClose">關閉</button></div>
  </div>
</div>
<div class="ov" id="dlOv" hidden role="dialog" aria-modal="true" aria-labelledby="dlTitle">
  <div class="sheet">
    <h3 id="dlTitle">輸出字卡</h3>
    <div class="chips" id="fmtRow" role="radiogroup" aria-label="格式"></div>
    <p class="hint" id="dlInfo"></p>
    <img class="outimg" id="outImg" alt="字卡輸出" hidden>
    <p class="hint" id="outHint" hidden>此環境無法直接下載：請長按（或右鍵）圖片另存。</p>
    <div class="sheetBtns"><button class="btn" type="button" id="dlClose">關閉</button><button class="btn primary" type="button" id="dlGo">下載</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const DRAFT='caption-card:v1:draft', PRESETS='caption-card:v1:presets';
const SIZES=[['1:1','方形',1080,1080],['4:5','直式',1080,1350],['9:16','限動',1080,1920],['16:9','橫式',1920,1080],['custom','自訂',0,0]];
const FAM={sans:'"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif',serif:'"Songti TC","Noto Serif TC","PMingLiU","Source Han Serif TC",serif',
  round:'"Yuanti TC","jf-openhuninn-2.0","Arial Rounded MT Bold",ui-rounded,"PingFang TC","Noto Sans TC",sans-serif',mono:'ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK TC",monospace'};
const STYLE_KEYS=['font','weight','autoSize','fontSize','lh','ls','color','strokeW','strokeC','shadow','align','bgType','bg','g1','g2','gAngle','dim','blur','vy','pad','hl','hlColor','deco','accent'];
const BASE={font:'sans',weight:900,autoSize:true,fontSize:96,lh:1.3,ls:0,color:'#111111',strokeW:0,strokeC:'#ffffff',shadow:false,align:'center',
  bgType:'solid',bg:'#ffffff',g1:'#ff7e5f',g2:'#feb47b',gAngle:135,dim:40,blur:0,vy:.5,pad:10,hl:false,hlColor:'#ffe066',deco:'none',accent:'#c9302a'};
const TEMPLATES=[
  ['白底黑字',{}],
  ['黑底黃字',{bg:'#111111',color:'#ffd400'}],
  ['漸層夕陽',{bgType:'grad',g1:'#ff6a5b',g2:'#ffc178',gAngle:150,color:'#ffffff',shadow:true}],
  ['照片暗化白字',{bgType:'photo',dim:45,color:'#ffffff',weight:700,shadow:true}],
  ['筆記卡',{bg:'#f4eee2',color:'#3a3226',font:'serif',weight:700,align:'left',vy:.38,deco:'frame',accent:'#8c7a5b',pad:13,lh:1.6}],
  ['引言',{bg:'#1f2a44',color:'#f4f1ea',font:'serif',weight:700,align:'left',deco:'quote',accent:'#e8b04a',lh:1.45}],
  ['公告',{color:'#14213d',align:'left',vy:.32,deco:'bar',accent:'#e63946',hl:true,hlColor:'#ffd166'}],
  ['極簡',{bg:'#e8e8e3',color:'#222222',weight:400,autoSize:false,fontSize:56,align:'left',vy:1,pad:8}],
];
const SAMPLE={title:'把今天過好，\n就是最好的計畫。',sub:'週一給自己的一句提醒',author:'— 範例字卡'};
let st={size:'4:5',cw:1080,ch:1080,title:SAMPLE.title,sub:SAMPLE.sub,author:SAMPLE.author,...BASE,...TEMPLATES[2][1],fmt:'png',fx:.5,fy:.5,sample:true};
let photo=null, samplePhoto=null;
try{ const d=JSON.parse(localStorage.getItem(DRAFT)||'null'); if(d&&typeof d==='object'){ st={...st,...d,sample:false}; } }catch(e){}
if(!SIZES.some(s=>s[0]===st.size)) st.size='4:5';
const dims=()=>{ if(st.size==='custom') return [clampI(st.cw,200,4096),clampI(st.ch,200,4096)]; const s=SIZES.find(s=>s[0]===st.size); return [s[2],s[3]]; };
const clampI=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v||a)));

/* ---------- text layout ---------- */
const mctx=document.createElement('canvas').getContext('2d');
const NO_START=new Set('，。、！？；：」』）】》〉〕…‥・·,.!?;:)]}％%‧〜～ー—'.split(''));
const NO_END=new Set('「『（【《〈〔([{“‘'.split(''));
const TOKEN=/[㐀-鿿豈-﫿　-〿＀-￯—…·‘’“”]|[^\s㐀-鿿豈-﫿　-〿＀-￯—…·‘’“”]+|\s+/gu;
const fontStr=(w,size,fam)=>`${w} ${size}px ${FAM[fam]||FAM.sans}`;
function makeMeasure(font,lsPx){ mctx.font=font; const cache=new Map();
  const cw=ch=>{ let v=cache.get(ch); if(v===undefined){ v=mctx.measureText(ch).width; cache.set(ch,v);} return v; };
  return str=>{ if(!str) return 0; if(!lsPx){ mctx.font=font; return mctx.measureText(str).width; } let w=0,n=0; for(const c of str){ w+=cw(c); n++; } return w+lsPx*n; }; }
function breakLines(text,maxW,measure){
  const out=[];
  for(const para of String(text).replace(/\r/g,'').split('\n')){
    const toks=para.match(TOKEN)||[]; let cur=[];
    const commit=()=>{ while(cur.length&&/^\s+$/.test(cur[cur.length-1])) cur.pop(); const t=cur.join(''); out.push({text:t,w:measure(t)}); cur=[]; };
    const width=()=>measure(cur.join(''));
    for(const t of toks){
      if(/^\s+$/.test(t)){ if(cur.length) cur.push(t); continue; }
      if(width()+measure(t)<=maxW||!cur.length&&measure(t)<=maxW){ cur.push(t); continue; }
      const split=t=>{ let piece=''; for(const c of t){ if(piece&&measure(piece+c)>maxW&&!NO_START.has(c)){ cur=[piece]; commit(); piece=c; } else piece+=c; } cur=[piece]; };
      if(!cur.length){ split(t); continue; } // single token wider than line: split by characters
      let carry=[t];
      const first=s=>[...s][0];
      while(NO_START.has(first(carry[0]))&&cur.length>1&&!/^\s+$/.test(cur[cur.length-1])) carry.unshift(cur.pop());
      if(NO_START.has(first(carry[0]))&&cur.length===1){ cur.push(...carry); carry=[]; } // hang punctuation rather than leave a lonely line
      while(cur.length>1&&NO_END.has([...cur[cur.length-1]].pop())) carry.unshift(cur.pop());
      if(carry.length){ commit(); cur=carry; if(cur.length===1&&measure(cur[0])>maxW){ cur=[]; split(carry[0]); } } else { commit(); }
      // a carried run that is still too wide gets split again on the next token
    }
    if(cur.length||!toks.length) commit();
    out[out.length-1].end=true;
  }
  return out;

function layoutCard(W,H,s,placeholder){

function savePresets(a){ try{ localStorage.setItem(PRESETS,JSON.stringify(a.slice(0,20))); return true; }catch(e){ toast('無法儲存（瀏覽器儲存空間不可用）'); return false; } }
function buildTpl(){ const g=$('#tplGrid'); g.innerHTML='';
  TEMPLATES.forEach(([name,o],i)=>{ const tile=tplTile(name,{...BASE,...o},()=>{ applyStyle({...BASE,...o}); closeTpl(); toast('已套用「'+name+'」'); }); tile.id='tpl-'+i; g.appendChild(tile); });
  const ps=loadPresets(), pg=$('#presetGrid'); pg.innerHTML=''; $('#presetCount').textContent=`${ps.length} / 20`;
  if(!ps.length){ const p=document.createElement('p'); p.className='hint'; p.textContent='還沒有自存範本。'; pg.appendChild(p); }
  ps.forEach((p,i)=>{ const tile=tplTile(p.name,{...BASE,...p.style},()=>{ applyStyle({...BASE,...p.style}); closeTpl(); },()=>{ const a=loadPresets(); a.splice(i,1); savePresets(a); buildTpl(); }); tile.id='preset-'+i; pg.appendChild(tile); }); }
function closeTpl(){ $('#tplOv').hidden=true; $('#tplBtn').focus(); }
$('#tplBtn').addEventListener('click',()=>{ buildTpl(); $('#tplOv').hidden=false; $('#tplClose').focus(); });
$('#tplClose').addEventListener('click',closeTpl);
$('#tplOv').addEventListener('click',e=>{ if(e.target.id==='tplOv') closeTpl(); });
$('#savePreset').addEventListener('click',()=>{ const a=loadPresets(); if(a.length>=20){ toast('最多 20 組，請先刪除一組'); return; }
  a.push({name:'我的範本 '+(a.length+1),style:styleOf(st)}); if(savePresets(a)){ buildTpl(); toast('已儲存目前樣式'); } });

/* ---------- output ---------- */
let dl=null;
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; } $('#dlGo').textContent=dl?'下載':'產生圖片'; })();
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;};
async function renderBlob(){ try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const [W,H]=dims(); const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); const L=drawCard(x,W,H,st,{}); window.__exportLines=L.tl.map(l=>l.text);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),st.fmt==='jpg'?'image/jpeg':'image/png',.92)); }
function buildDl(){ const [W,H]=dims(); $('#dlInfo').textContent=`${W} × ${H} px，${st.fmt==='jpg'?'JPG 92%':'PNG'}`+(lastL&&lastL.overflow?'。注意：文字超出版面':''); }
let outURL=null; function hideOut(){ $('#outImg').hidden=true; $('#outHint').hidden=true; if(outURL){ URL.revokeObjectURL(outURL); outURL=null; } }
$('#dlBtn').addEventListener('click',()=>{ buildDl(); hideOut(); $('#dlOv').hidden=false; $('#dlGo').focus(); });
$('#dlClose').addEventListener('click',()=>{ $('#dlOv').hidden=true; hideOut(); $('#dlBtn').focus(); });
$('#dlOv').addEventListener('click',e=>{ if(e.target.id==='dlOv') $('#dlClose').click(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!$('#dlOv').hidden) $('#dlClose').click(); else if(!$('#tplOv').hidden) closeTpl(); });
$('#dlGo').addEventListener('click',async()=>{ const b=$('#dlGo'), old=b.textContent; b.disabled=true; b.textContent='處理中…';
  try{ const blob=await renderBlob(); const name=`caption-${stamp()}.${st.fmt}`;
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast('已送出儲存：'+name); }catch(err){ const m=String(err&&err.message||err); toast(/declin|denied|cancel/i.test(m)?'已取消儲存':'儲存失敗：'+m); } }
    else { hideOut(); outURL=URL.createObjectURL(blob); $('#outImg').src=outURL; $('#outImg').hidden=false; $('#outHint').hidden=false; } }
  catch(e){ toast('輸出失敗'); } finally{ b.disabled=false; b.textContent=old; } });

/* ---------- init ---------- */
samplePhoto=makeSamplePhoto();
syncUI(); sizeCanvas(); syncUI();
idbGet().then(async blob=>{ if(blob){ try{ photo=shrink(await decodeBlob(blob),3000); }catch(e){} } window.__photoReady=true; draw(); syncUI(); });
let rt=0; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(sizeCanvas,80); });
window.__cc={st:()=>st,breakLines:(t,w,size,font)=>breakLines(t,w,makeMeasure(fontStr(900,size,font||'sans'),0)),layoutCard:(W,H)=>layoutCard(W,H,st,false),renderBlob,hasPhoto:()=>!!photo};
})();
</script>
