<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>照片濾鏡</title>
<style>
:root{
  --bg:#e6e7e8; --surface:#f5f5f4; --surface-2:#ffffff; --ink:#17181a; --muted:#5a5d62; --line:#c9cbce; --line-2:#dcdddf;
  --accent:#a3261b; --accent-ink:#ffffff; --accent-soft:#f2dcd8; --stage:#2a2b2e; --stage-ink:#eceae6; --track:#c3c5c8;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111213; --surface:#1a1b1d; --surface-2:#222326; --ink:#e9e8e6; --muted:#a2a3a6; --line:#34363a; --line-2:#28292c;
  --accent:#ff8a7a; --accent-ink:#2a0703; --accent-soft:#3c1d19; --stage:#050506; --stage-ink:#eceae6; --track:#44464b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111213; --surface:#1a1b1d; --surface-2:#222326; --ink:#e9e8e6; --muted:#a2a3a6; --line:#34363a; --line-2:#28292c;
  --accent:#ff8a7a; --accent-ink:#2a0703; --accent-soft:#3c1d19; --stage:#050506; --stage-ink:#eceae6; --track:#44464b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{margin:0 auto 0 4px;font-size:17px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
header h1 small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:6px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--ink)}.btn.primary:not(:disabled):hover{filter:brightness(1.08);border-color:var(--accent)}}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stage{position:relative;background:var(--stage);border-radius:2px;display:grid;place-items:center;width:100%;aspect-ratio:var(--ar,1.5);max-height:min(56vh,560px);min-height:200px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage canvas{max-width:100%;max-height:100%;display:block}
.stage .tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:2px}
.stage .orig{position:absolute;right:8px;top:8px;font-size:12px;color:var(--stage-ink);background:rgba(0,0,0,.55);padding:3px 8px;border-radius:2px}
.stage .hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:10px;pointer-events:none}
.split{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;cursor:ew-resize;touch-action:none}
.split::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.split::after{content:"◀ ▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;font-size:11px;padding:4px 6px;border-radius:2px;white-space:nowrap}
.split .lbl{position:absolute;top:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;white-space:nowrap}
.split .lbl.l{right:30px}.split .lbl.r{left:30px}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 2px 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.tabs button{min-height:44px;border:0;background:none;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:10px;margin-top:10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;container-type:inline-size}
/* about 4.5 thumbnails across, so the next one always peeks out and the strip reads as scrollable */
.fthumb{flex:0 0 auto;width:72px;width:clamp(62px,calc((100cqw + 8px)/4.5 - 8px),84px);border:0;background:none;padding:0;cursor:pointer;scroll-snap-align:start;text-align:center;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fthumb .no{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:left;padding-left:2px}
.fthumb canvas{display:block;width:100%;height:auto;aspect-ratio:1;margin:0 auto;border:2px solid transparent;border-radius:2px;background:var(--stage)}
.fthumb .nm{display:block;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fthumb[aria-pressed="true"] canvas{border-color:var(--accent)}
.fthumb[aria-pressed="true"] .nm{color:var(--accent);font-weight:700}
.fthumb:disabled{opacity:.4}
.row{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;min-height:44px}
.row label{font-size:14px;font-weight:600}
.row output,.row .val{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row .val{min-height:44px;min-width:44px;padding:0 2px;border:0;background:none;cursor:pointer;border-radius:3px}
.row output.on,.row .val.on{color:var(--accent);font-weight:700}
.row .val.on{text-decoration:underline dotted;text-underline-offset:3px}
.cname{display:flex;align-items:center;gap:8px;margin-top:8px}
.cname label{font-size:13px;color:var(--muted);white-space:nowrap}
.cname input{flex:1;min-width:0;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2)}
.privacy{margin-top:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--track);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--track);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9.5px;border-radius:50%;background:var(--surface-2);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:2px solid var(--ink)}
input[type=range]:focus-visible{outline:2px solid var(--accent)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 4px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.small{font-size:12px;color:var(--muted);margin:6px 0 0}
.cmpPanel p{margin:0 0 8px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:30;padding:16px}
.sheet .card{width:min(520px,100%);background:var(--surface-2);border-radius:4px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:calc(100% - 8px);overflow:auto}
.sheet h2{margin:0 0 10px;font-size:17px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-3px}
.prog{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.result img{display:block;max-width:100%;max-height:50vh;margin:8px auto;border:1px solid var(--line)}
/* informational: never takes a touch, so it can't block a control under it; only its 復原 button can be tapped */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:3px;font-size:14px;z-index:40;max-width:calc(100% - 32px);pointer-events:none;display:flex;align-items:center;gap:12px;width:max-content}
.toast.top{top:calc(12px + env(safe-area-inset-top));bottom:auto}
.toast.in-stage{position:absolute;bottom:36px;z-index:5;max-width:calc(100% - 16px);font-size:13px;padding:8px 12px}
.toast .tbtn{pointer-events:auto;min-height:44px;min-width:56px;margin:-8px -8px -8px 0;padding:0 12px;border:1px solid currentColor;border-radius:3px;background:none;color:inherit;font-weight:700;cursor:pointer;flex:0 0 auto}
.drop{outline:3px dashed var(--accent);outline-offset:-6px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .stage{max-height:min(76vh,760px)}
  .tabs button.mob{display:none}
  .tabs{grid-template-columns:1fr}
  .panel.fp,.panel.ap{display:block!important}
  .fp .strip{flex-wrap:wrap;overflow:visible}
  .fp .fthumb{width:calc((100cqw - 25px)/4)}
  .side{max-height:calc(100vh - 80px);overflow:auto}
}
@media (max-height:600px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .stage{max-height:calc(100vh - 80px);min-height:160px}
  .side{max-height:calc(100vh - 70px);overflow:auto}
}
@media (max-width:899px) and (orientation:portrait) and (min-height:760px){
  /* tall phones: two rows of thumbnails use the space that used to stay empty below */
  .strip{display:grid;grid-template-columns:repeat(var(--cols,6),min-content);justify-content:start;column-gap:8px;row-gap:4px}
}
@media (max-width:899px) and (orientation:portrait) and (max-height:620px){
  .stage{max-height:42vh;min-height:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1>照片濾鏡<small id="dimTop"></small></h1>
    <button class="btn" id="openBtn" type="button">開啟</button>
    <button class="btn" id="resetBtn" type="button">重設</button>
    <button class="btn primary" id="exportBtn" type="button">匯出</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </header>
  <div class="layout">
    <div>
      <div class="stage" id="stage" tabindex="0" aria-label="預覽，長按顯示原圖">
        <canvas id="pv"></canvas>
        <span class="tag" id="sampleTag">範例照片</span>
        <span class="orig" id="origTag" hidden>原圖</span>
        <div class="split" id="split" hidden role="slider" tabindex="0" aria-label="對照分割線" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="lbl l">原圖</span><span class="lbl r">調整後</span></div>
        <span class="hint" id="hint">長按看原圖・左右滑動換濾鏡</span>
      </div>
      <div class="meta"><span id="metaName">sample.jpg</span><span id="metaState">原圖 100%</span></div>
    </div>
    <div class="side">
      <div class="tabs" role="tablist">
        <button class="mob" role="tab" id="tab-filter" aria-selected="true" type="button">濾鏡</button>
        <button class="mob" role="tab" id="tab-adjust" aria-selected="false" type="button">調整</button>
        <button role="tab" id="tab-compare" aria-selected="false" type="button">對照</button>
      </div>
      <div class="panel fp" id="panelFilter">
        <div class="strip" id="strip"></div>
        <div class="row" id="strRow"><label for="strength">強度</label><input type="range" id="strength" min="0" max="100" step="1" value="100"><output id="strOut">100%</output></div>
        <div class="actions"><button class="btn" id="saveCustom" type="button">存成自訂濾鏡</button><button class="btn" id="delCustom" type="button" hidden>刪除此自訂</button></div>
        <div class="cname" id="cNameRow" hidden><label for="cName">名稱</label><input id="cName" type="text" maxlength="12" enterkeyhint="done" autocomplete="off"></div>
        <p class="small" id="customNote">自訂濾鏡會記住目前的濾鏡、強度與全部調整，最多 10 組。</p>
      </div>
      <div class="panel ap" id="panelAdjust" hidden>
        <div class="subhead"><span>點右側數值可把該項歸零</span></div>
        <div id="params"></div>
      </div>
      <div class="panel cmpPanel" id="panelCompare" hidden>
        <p>拖動預覽上的分割線：左側是原圖，右側是調整後。</p>
        <p class="small">鍵盤：按 <b>\</b> 暫時顯示原圖、方向鍵移動分割線。</p>
      </div>
      <p class="small privacy">照片只在這台裝置上處理，不會上傳；最後開啟的照片存在本機，下次打開會自動載入。</p>
    </div>
  </div>
</div>

<div class="sheet" id="exSheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2 id="exTitle">匯出照片</h2>
    <div class="seg" role="radiogroup" aria-label="格式">
      <label><input type="radio" name="fmt" id="fmt-jpg" value="jpg" checked>JPG 92%</label>
      <label><input type="radio" name="fmt" id="fmt-png" value="png">PNG 無損</label>
    </div>
    <div id="exInfo" class="small"></div>
    <div class="prog" id="exProg" hidden><i></i></div>
    <div class="result" id="exResult" hidden><p class="small">按「儲存圖片」，或長按／右鍵圖片儲存。</p><img id="exImg" alt="匯出的照片"><a id="exDl" download hidden></a></div>
    <div class="actions">
      <button class="btn primary" id="exGo" type="button">下載</button>
      <button class="btn" id="exClose" type="button">關閉</button>
      <button class="btn" id="exShare" type="button" hidden>分享</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button class="tbtn" id="toastBtn" type="button" hidden>復原</button></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='photo-filter:v1:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(KEY+k);}catch(e){}}};
let dl=null;

/* ---------- taps ----------
   Buttons fire on pointerup (tracked per pointerId, so a tap with another finger already down still counts and a
   slow tap still counts); the click the browser sends afterwards is swallowed page-wide in the capture phase, so it
   can never land on a different control that has just appeared under the finger. Keyboard clicks (detail 0) and
   programmatic clicks still go through the element's click listener. */
const TAP=new WeakMap();
function tap(el,fn,native=false){ TAP.set(el,{fn,native}); if(!native) el.addEventListener('click',e=>fn(e,e.target)); return el; }
const tapEl=t=>{ for(let n=t;n&&n.nodeType===1;n=n.parentElement) if(TAP.has(n)) return n; return null; };
const downs=new Map(); let swallowUntil=0;
document.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; const el=tapEl(e.target); if(el) downs.set(e.pointerId,{el,t:e.target,x:e.clientX,y:e.clientY,ok:true}); else downs.delete(e.pointerId); },true);
document.addEventListener('pointermove',e=>{ const d=downs.get(e.pointerId); if(d&&d.ok&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>12) d.ok=false; },true);
document.addEventListener('pointercancel',e=>{ downs.delete(e.pointerId); swallowUntil=performance.now()+800; },true);
document.addEventListener('pointerup',e=>{
  swallowUntil=performance.now()+800;
  const d=downs.get(e.pointerId); downs.delete(e.pointerId); if(!d||!d.ok) return;
  const el=d.el; if(!el.isConnected||el.disabled||el.closest('[hidden]')||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12) return;
  const hit=document.elementFromPoint(e.clientX,e.clientY); if(!hit||!el.contains(hit)) return;
  const h=TAP.get(el); if(h.native) el.click(); else h.fn(e,d.t);
},true);
addEventListener('click',e=>{
  if(!e.isTrusted||!(e.detail>0||e.pointerType)) return;               // keyboard / programmatic clicks pass
  if(performance.now()<swallowUntil||tapEl(e.target)){ e.stopImmediatePropagation(); e.preventDefault(); }
},true);
addEventListener('contextmenu',e=>{ const el=tapEl(e.target); if(el&&el.id!=='exSheet') e.preventDefault(); },true);   // the exported image keeps its long-press menu

/* ---------- toast (informational, never blocks a control; optional 復原 button) ---------- */
let toastAct=null;
function toast(m,ms=2200,act=null){
  const t=$('#toast'), st=$('#stage'), b=$('#toastBtn');
  $('#toastMsg').textContent=m; toastAct=act; b.hidden=!act; if(act) b.textContent=act.label;
  // over the preview when it is in view (nothing tappable there), else at the screen edge; above an open sheet's buttons
  const r=st.getBoundingClientRect(), inView=r.top>=-4&&r.bottom<=innerHeight+4&&r.height>=120;
  const sheet=!$('#exSheet').hidden;
  if(inView&&!sheet){ if(t.parentNode!==st) st.appendChild(t); t.className='toast in-stage'; }
  else { if(t.parentNode!==document.body) document.body.appendChild(t); t.className='toast'+(sheet?' top':''); }
  t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; toastAct=null; },act?Math.max(ms,6000):ms);
}
tap($('#toastBtn'),()=>{ const a=toastAct; toastAct=null; clearTimeout(toast._t); $('#toast').hidden=true; if(a) a.fn(); });

/* ---------- parameters ---------- */
const PARAMS=[
  {key:'exposure',label:'曝光',min:-2,max:2,step:0.05,def:0,fmt:v=>(v>0?'+':'')+v.toFixed(2)},
  {key:'brightness',label:'亮度',min:-100,max:100,step:1,def:0},
  {key:'contrast',label:'對比',min:-100,max:100,step:1,def:0},
  {key:'highlights',label:'亮部',min:-100,max:100,step:1,def:0},
  {key:'shadows',label:'陰影',min:-100,max:100,step:1,def:0},
  {key:'saturation',label:'飽和度',min:-100,max:100,step:1,def:0},
  {key:'vibrance',label:'自然飽和',min:-100,max:100,step:1,def:0},
  {key:'temp',label:'色溫',min:-100,max:100,step:1,def:0},
  {key:'tint',label:'色調',min:-100,max:100,step:1,def:0},
  {key:'sharpen',label:'銳利度',min:0,max:100,step:1,def:0},
  {key:'vignette',label:'暈影',min:0,max:100,step:1,def:0},
  {key:'grain',label:'顆粒',min:0,max:100,step:1,def:0},
];
const defParams=()=>Object.fromEntries(PARAMS.map(p=>[p.key,p.def]));
function cleanParams(o){ const out=defParams(); if(o&&typeof o==='object') for(const p of PARAMS){ const v=+o[p.key]; if(o[p.key]!=null&&isFinite(v)) out[p.key]=Math.min(p.max,Math.max(p.min,v)); } return out; }

/* ---------- filters (curves → LUT) ---------- */
const FILTERS=[
  {id:'none',name:'原圖'},
  {id:'vivid',name:'鮮明',all:[[0,0],[.25,.2],[.75,.82],[1,1]],sat:.3},
  {id:'warm',name:'暖陽',r:[[0,.02],[.5,.56],[1,1]],b:[[0,0],[.5,.44],[1,.92]],sat:.1},
  {id:'cool',name:'冷調',r:[[0,0],[.5,.45],[1,.95]],b:[[0,.04],[.5,.56],[1,1]],sat:-.05},
  {id:'mono',name:'黑白',mono:true,all:[[0,.02],[1,.98]]},
  {id:'mono-hc',name:'高反差黑白',mono:true,all:[[0,0],[.3,.16],[.7,.86],[1,1]]},
  {id:'sepia',name:'褐色懷舊',mono:true,r:[[0,.1],[.5,.62],[1,1]],g:[[0,.06],[.5,.5],[1,.94]],b:[[0,.02],[.5,.36],[1,.8]]},
  {id:'film',name:'底片',all:[[0,.08],[.5,.5],[1,.96]],r:[[0,0],[.6,.63],[1,1]],g:[[0,.04],[.4,.42],[1,1]],b:[[0,.02],[1,.92]],sat:-.1},

    r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); })
    .catch(e=>{ dbp=null; throw e; }));

      if(seq!==photoSeq){ await idb.del(id).catch(()=>{}); return; }
      store.set('photo',{id,name});

const MAXSIDE=8192, MAXPIX=16777216;

  const wc=document.createElement('canvas'); wc.width=ww; wc.height=wh; const wx=wc.getContext('2d',{willReadFrequently:true}); wx.imageSmoothingQuality='high'; wx.drawImage(c,0,0,ww,wh);

function markStrip(){ for(const b of $('#strip').children){ const id=b.id; const on=id.startsWith('f-')?(S.customIdx<0&&id==='f-'+S.filter):(id==='c-'+S.customIdx); b.setAttribute('aria-pressed',on?'true':'false'); }
  $('#delCustom').hidden=S.customIdx<0; $('#cNameRow').hidden=S.customIdx<0; if(S.customIdx>=0&&document.activeElement!==$('#cName')) $('#cName').value=customs[S.customIdx].name; }
function selectFilter(id){ S.filter=id; S.customIdx=-1; if(S.strength===0) S.strength=100; syncUI(); schedule(); save(); }
function applyCustom(i){ const c=customs[i]; if(!c) return; S.filter=c.filter; S.strength=c.strength; S.params=Object.assign(defParams(),c.params); S.customIdx=i; syncUI(); schedule(); save(); }

/* ---------- params UI ---------- */
function fmtVal(p,v){ return p.fmt?p.fmt(v):(v>0&&p.min<0?'+':'')+v; }
function buildParams(){
  const box=$('#params'); box.innerHTML='';
  for(const p of PARAMS){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<label for="p-${p.key}">${p.label}</label><input type="range" id="p-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}"><button type="button" class="val" id="o-${p.key}" aria-label="${p.label}歸零"></button>`;
    box.appendChild(row);
    const inp=row.querySelector('input');
    inp.addEventListener('input',()=>{ S.params[p.key]=parseFloat(inp.value); S.customIdx=-1; markStrip(); updOut(p); schedule(); save(); });
    inp.addEventListener('change',()=>{ save(); kickFull(); });
    const reset=()=>{ S.params[p.key]=p.def; inp.value=p.def; updOut(p); S.customIdx=-1; markStrip(); schedule(); save(); };
    inp.addEventListener('dblclick',reset);                     // mouse: double-click the slider
    tap(row.querySelector('.val'),reset);                       // touch & keyboard: tap the number
  }
}
function updOut(p){ const v=S.params[p.key], o=$('#o-'+p.key); o.textContent=fmtVal(p,v); o.classList.toggle('on',v!==p.def); o.title=v!==p.def?'點一下歸零':''; }
function syncUI(){
  for(const p of PARAMS){ $('#p-'+p.key).value=S.params[p.key]; updOut(p); }
  $('#strength').value=S.strength; $('#strOut').textContent=S.strength+'%'; $('#strRow').hidden=S.filter==='none';
  markStrip(); updMeta();
}
function updMeta(){ const f=FILTERS.find(f=>f.id===S.filter); const n=PARAMS.filter(p=>S.params[p.key]!==p.def).length;
  $('#metaState').textContent=(S.customIdx>=0&&customs[S.customIdx]?customs[S.customIdx].name+'・':'')+f.name+(S.filter!=='none'?' '+S.strength+'%':'')+(n?`・${n} 項調整`:''); }
function save(){ store.set('last',{params:S.params,filter:S.filter,strength:S.strength,customIdx:S.customIdx}); updMeta(); }

/* ---------- render ----------
   Every change paints a quick preview at ≤540 px on the next frame; the full ≤1080 px preview follows once the
   changes pause, computed in bands between frames so it never blocks a drag, and dropped if another change comes. */
let rq=0, processed=null, quickC=null, fullJob=null, fullT=0, wantFull=false; const stats={quick:0,full:0};
function schedule(fullNow=false){ wantFull=wantFull||fullNow; cancelFull(); if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; render(); }); }
function cancelFull(){ clearTimeout(fullT); fullT=0; if(fullJob){ fullJob.dead=true; fullJob=null; } }
function render(){
  if(!S.workData) return;
  const now=wantFull||!S.quickData; wantFull=false;
  if(now){ processed=renderImageData(S.workData,prep(S.params,S.filter,S.strength,1)); quickC=null; stats.full++; }
  else {
    const q=renderImageData(S.quickData,prep(S.params,S.filter,S.strength,S.qw/S.ww));
    if(!quickC){ quickC=document.createElement('canvas'); }
    if(quickC.width!==S.qw||quickC.height!==S.qh){ quickC.width=S.qw; quickC.height=S.qh; }
    quickC.getContext('2d').putImageData(q,0,0); processed=null; stats.quick++;
    if(!dragging) fullT=setTimeout(startFull,90);   // while a slider is held, only quick previews; the full one follows on release
  }
  paint(); updMeta();
}
let dragging=false;
addEventListener('pointerdown',e=>{ if(e.target.type==='range') dragging=true; },true);
for(const ev of ['pointerup','pointercancel']) addEventListener(ev,()=>{ if(dragging){ dragging=false; kickFull(); } },true);
// a slider was let go: start the full preview now instead of after the drag pause
function kickFull(){ if(!processed&&!rq&&!fullJob&&S.workData){ clearTimeout(fullT); fullT=setTimeout(startFull,0); } }
function startFull(){
  fullT=0; const job={dead:false}; fullJob=job;
  const w=S.ww,h=S.wh,src=S.workData,out=new ImageData(w,h), P=prep(S.params,S.filter,S.strength,1), BAND=96;
  let y0=0;
  const step=()=>{ if(job.dead) return; const t0=performance.now();
    while(y0<h&&performance.now()-t0<12){ const rows=Math.min(BAND,h-y0); processRows(src.data,w,0,h,out.data.subarray(y0*w*4),y0,rows,w,h,P); y0+=rows; }
    if(y0<h){ setTimeout(step,0); return; }
    fullJob=null; processed=out; quickC=null; stats.full++; paint(); };
  step();
}
function paint(){
  const x=$('#pv').getContext('2d');
  if(S.showOrig){ x.putImageData(S.workData,0,0); }
  else if(processed||quickC){
    if(processed) x.putImageData(processed,0,0); else { x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(quickC,0,0,S.ww,S.wh); }
    if(S.compare){ const sw=Math.round(S.ww*S.split); if(sw>0) x.putImageData(S.workData,0,0,0,0,sw,S.wh); }
  }
  $('#origTag').hidden=!S.showOrig;
  if(S.compare) placeSplit();
}
function placeSplit(){ const pv=$('#pv').getBoundingClientRect(), st=$('#stage').getBoundingClientRect(); const sp=$('#split');
  sp.style.left=(pv.left-st.left+pv.width*S.split)+'px'; sp.setAttribute('aria-valuenow',Math.round(S.split*100)); }

/* ---------- tabs ---------- */
function setTab(t){
  const desk=matchMedia('(min-width:900px)').matches;
  if(t==='compare'){ S.compare=desk?!S.compare:true; if(!desk) S.tab='compare'; }
  else { S.compare=false; S.tab=t; }
  $('#tab-filter').setAttribute('aria-selected',S.tab==='filter'); $('#tab-adjust').setAttribute('aria-selected',S.tab==='adjust'); $('#tab-compare').setAttribute('aria-selected',S.compare?'true':'false');
  $('#panelFilter').hidden=S.tab!=='filter'; $('#panelAdjust').hidden=S.tab!=='adjust'; $('#panelCompare').hidden=!S.compare;
  $('#split').hidden=!S.compare; $('#hint').textContent=S.compare?'拖動分割線比較':'長按看原圖・左右滑動換濾鏡';
  paint();
}
tap($('#tab-filter'),()=>setTab('filter')); tap($('#tab-adjust'),()=>setTab('adjust')); tap($('#tab-compare'),()=>setTab('compare'));

/* ---------- stage gestures ---------- */
(()=>{
  const st=$('#stage'); let lp=0, sx=0, sy=0, pid=null, moved=false;
  const end=()=>{ pid=null; clearTimeout(lp); };
  st.addEventListener('pointerdown',e=>{ if(pid!==null||e.target.closest('#split,.toast')) return; pid=e.pointerId; moved=false; sx=e.clientX; sy=e.clientY;
    lp=setTimeout(()=>{ if(pid!==null&&!moved){ S.showOrig=true; paint(); } },380); });
  st.addEventListener('pointermove',e=>{ if(e.pointerId!==pid) return; if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10){ moved=true; clearTimeout(lp);} });
  const up=e=>{ if(e.pointerId!==pid) return; end();
    if(S.showOrig){ S.showOrig=false; paint(); return; }
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!S.compare && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ const i=FILTERS.findIndex(f=>f.id===S.filter); const n=(i+(dx<0?1:-1)+FILTERS.length)%FILTERS.length; selectFilter(FILTERS[n].id); toast(FILTERS[n].name,900);
      const el=$('#f-'+FILTERS[n].id); if(el) el.scrollIntoView({block:'nearest',inline:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); } };
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',e=>{ if(e.pointerId!==pid) return; end(); if(S.showOrig){S.showOrig=false;paint();}});
  st.addEventListener('contextmenu',e=>e.preventDefault());
  const sp=$('#split'); let drag=false;
  sp.addEventListener('pointerdown',e=>{ drag=true; sp.setPointerCapture(e.pointerId); e.preventDefault(); });
  sp.addEventListener('pointermove',e=>{ if(!drag) return; const r=$('#pv').getBoundingClientRect(); S.split=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); paint(); });
  sp.addEventListener('pointerup',()=>drag=false); sp.addEventListener('pointercancel',()=>drag=false);
  sp.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ S.split=Math.min(1,Math.max(0,S.split+(e.key==='ArrowLeft'?-.05:.05))); paint(); e.preventDefault(); } });
  addEventListener('resize',()=>{ if(S.compare) placeSplit(); });
  addEventListener('keydown',e=>{ if(e.key==='\\'&&!e.repeat&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ S.showOrig=true; paint(); } });
  addEventListener('keyup',e=>{ if(e.key==='\\'){ S.showOrig=false; paint(); } });
})();

/* ---------- controls ---------- */
$('#strength').addEventListener('input',e=>{ S.strength=+e.target.value; $('#strOut').textContent=S.strength+'%'; S.customIdx=-1; markStrip(); schedule(); save(); });
$('#strength').addEventListener('change',()=>{ save(); kickFull(); });
tap($('#openBtn'),()=>$('#fileInput').click());
$('#fileInput').onchange=e=>{ loadFile(e.target.files[0]); e.target.value=''; };
tap($('#resetBtn'),()=>{
  const prev={params:{...S.params},filter:S.filter,strength:S.strength,customIdx:S.customIdx};
  S.params=defParams(); S.filter='none'; S.strength=100; S.customIdx=-1; syncUI(); schedule(); save();
  toast('已重設全部參數',6000,{label:'復原',fn:()=>{ Object.assign(S,{params:prev.params,filter:prev.filter,strength:prev.strength,customIdx:prev.customIdx<customs.length?prev.customIdx:-1}); syncUI(); schedule(); save(); toast('已復原'); }});
});
tap($('#saveCustom'),()=>{
  if(customs.length>=10){ toast('自訂濾鏡最多 10 組，請先刪除一組'); return; }
  let n=1; while(customs.some(c=>c.name==='自訂 '+n)) n++;
  customs.push({name:'自訂 '+n,filter:S.filter,strength:S.strength,params:{...S.params}}); store.set('custom',customs);
  S.customIdx=customs.length-1; drawStrip(); markStrip(); save(); toast('已存成「自訂 '+n+'」，可在下方改名');
});
let delArmT=0;
const disarm=()=>{ const b=$('#delCustom'); clearTimeout(delArmT); b.dataset.arm=''; b.textContent='刪除此自訂'; };
tap($('#delCustom'),()=>{ if(S.customIdx<0) return; const b=$('#delCustom');
  if(b.dataset.arm!=='1'){ b.dataset.arm='1'; b.textContent='再按一次確認刪除'; clearTimeout(delArmT); delArmT=setTimeout(disarm,3000); return; }
  disarm(); const idx=S.customIdx, item=customs[idx]; customs.splice(idx,1); store.set('custom',customs); S.customIdx=-1; drawStrip(); markStrip(); save();
  toast('已刪除 '+item.name,6000,{label:'復原',fn:()=>{ if(customs.length>=10){ toast('自訂濾鏡已滿 10 組，無法復原'); return; }
    const at=Math.min(idx,customs.length); customs.splice(at,0,item); store.set('custom',customs);
    if(S.customIdx>=at) S.customIdx++;
    if(S.customIdx<0&&S.filter===item.filter&&S.strength===item.strength&&PARAMS.every(p=>S.params[p.key]===item.params[p.key])) S.customIdx=at;
    drawStrip(); markStrip(); save(); toast('已復原「'+item.name+'」'); }});
});
$('#cName').addEventListener('change',()=>{ const i=S.customIdx, inp=$('#cName'); if(i<0||!customs[i]) return;
  const v=inp.value.trim().slice(0,12); if(!v){ inp.value=customs[i].name; toast('名稱不能空白'); return; }
  customs[i].name=v; inp.value=v; store.set('custom',customs); const nm=document.querySelector('#c-'+i+' .nm'); if(nm) nm.textContent=v; updMeta(); });
$('#cName').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
// drag & drop, paste
addEventListener('dragover',e=>{ e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave',e=>{ if(e.target===document.documentElement||e.target===document.body) document.body.classList.remove('drop'); });
addEventListener('drop',e=>{ e.preventDefault(); document.body.classList.remove('drop'); const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });
addEventListener('paste',e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/')); if(f) loadFile(f); });

/* ---------- export ---------- */
let exUrl=null, exFile=null, busy=false, exReady=false;
const exInfo=()=>(S.iw!==S.ow||S.ih!==S.oh?`輸出 ${S.iw}×${S.ih}（原圖 ${S.ow}×${S.oh} 已縮小）`:`輸出原解析度 ${S.iw}×${S.ih}`)+`，檔名 ${outName()}`;
// without a downloads API the same button first makes the picture, then saves it (an <a download>), so nothing moves under the finger
const setReady=v=>{ exReady=v; $('#exGo').textContent=dl?'下載':v?'儲存圖片':'產生圖片'; if(!v){ $('#exResult').hidden=true; $('#exShare').hidden=true; } };
function openExport(){ $('#exSheet').hidden=false; $('#exProg').hidden=true; $('#exGo').disabled=false; setReady(false); $('#exInfo').textContent=exInfo(); $('#exGo').focus(); }
function outName(){ const fmt=document.querySelector('input[name=fmt]:checked').value; let b=S.name.replace(/\.[^.]*$/,'').trim(); if(!b) b='photo'; return b+'-filtered.'+fmt; }
document.querySelectorAll('input[name=fmt]').forEach(r=>{ r.addEventListener('change',()=>{ $('#exInfo').textContent=exInfo(); store.set('fmt',r.value); if(!busy) setReady(false); }); tap(r.closest('label'),null,true); });
tap($('#exportBtn'),openExport);
const closeExport=()=>{ if(busy){ busy=false; } $('#exSheet').hidden=true; if(exUrl){ URL.revokeObjectURL(exUrl); exUrl=null; } exFile=null; $('#exportBtn').focus(); };
tap($('#exClose'),closeExport);
tap($('#exSheet'),(e,t)=>{ if((t||e.target)===$('#exSheet')) closeExport(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#exSheet').hidden) closeExport(); });
async function renderFull(onProg,fmt){
  const W=S.iw,H=S.ih, P=prep(S.params,S.filter,S.strength,S.iw/S.ww), R=P.sr;
  const sx=S.src.getContext('2d',{willReadFrequently:true});
  const out=document.createElement('canvas'); out.width=W; out.height=H; const ox=out.getContext('2d');
  // JPG has no transparency: composite onto white, otherwise see-through pixels turn black
  const flat=fmt==='jpg'; if(flat){ ox.fillStyle='#fff'; ox.fillRect(0,0,W,H); }
  const CH=1024; let tmp=null;
  for(let y0=0;y0<H;y0+=CH){
    if(!busy) throw new Error('cancel');
    const rows=Math.min(CH,H-y0), sy0=Math.max(0,y0-R), sy1=Math.min(H,y0+rows+R);
    const src=sx.getImageData(0,sy0,W,sy1-sy0); const dst=new ImageData(W,rows);
    processRows(src.data,W,sy0,sy1-sy0,dst.data,y0,rows,W,H,P);
    if(flat){ if(!tmp){ tmp=document.createElement('canvas'); tmp.width=W; tmp.height=Math.min(CH,H); } tmp.getContext('2d').putImageData(dst,0,0); ox.drawImage(tmp,0,0,W,rows,0,y0,W,rows); }
    else ox.putImageData(dst,0,y0);
    onProg((y0+rows)/H);
    await new Promise(r=>setTimeout(r,0));
  }
  if(tmp) tmp.width=tmp.height=1;
  return out;
}
tap($('#exGo'),async()=>{
  if(exReady&&exUrl&&!dl){ $('#exDl').click(); return; }
  if(busy) return; busy=true; const fmt=document.querySelector('input[name=fmt]:checked').value, name=outName();
  const pr=$('#exProg'), bar=pr.querySelector('i'); pr.hidden=false; bar.style.width='0'; $('#exGo').disabled=true; $('#exResult').hidden=true;
  try{
    const c=await renderFull(p=>bar.style.width=(p*100).toFixed(1)+'%',fmt);
    const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),fmt==='png'?'image/png':'image/jpeg',.92));
    c.width=c.height=1;
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast('已儲存 '+name); }catch(e){ if(!/declin|cancel|abort/i.test(String(e&&(e.name||e.message)))) toast('下載失敗，改以圖片顯示'); else toast('已取消下載'); showResult(blob,name); } }
    else showResult(blob,name);
    window.__lastExport={name,blob,w:S.iw,h:S.ih};
  }catch(e){ if(e.message!=='cancel') toast('匯出失敗：記憶體不足或圖片過大'); }
  finally{ busy=false; $('#exGo').disabled=false; pr.hidden=true; }
});
function showResult(blob,name){ if(exUrl) URL.revokeObjectURL(exUrl); exUrl=URL.createObjectURL(blob); $('#exImg').src=exUrl;
  const a=$('#exDl'); a.href=exUrl; a.download=name;
  try{ exFile=new File([blob],name,{type:blob.type}); }catch(e){ exFile=null; }
  $('#exShare').hidden=!(exFile&&navigator.canShare&&navigator.share&&(()=>{ try{ return navigator.canShare({files:[exFile]}); }catch(e){ return false; } })());
  $('#exResult').hidden=false; setReady(true); }
tap($('#exShare'),async()=>{ if(!exFile) return; try{ await navigator.share({files:[exFile],title:exFile.name}); }catch(e){ if(!/abort/i.test(String(e&&e.name))) toast('無法分享，請改按「儲存圖片」'); } });

/* ---------- init ---------- */
buildParams();
const last=store.get('last',null); if(last&&typeof last==='object'){ S.params=cleanParams(last.params); if(FILTERS.some(f=>f.id===last.filter)) S.filter=last.filter; if(last.strength>=0&&last.strength<=100) S.strength=+last.strength;
  const ci=last.customIdx; if(Number.isInteger(ci)&&ci>=0&&ci<customs.length&&customs[ci].filter===S.filter) S.customIdx=ci; }
const lf=store.get('fmt','jpg'); if(lf==='png') $('#fmt-png').checked=true;
setSource(makeSample(),'sample.jpg',true); syncUI(); setTab('filter');
restorePhoto();
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; } })();
// for tests: true once the full preview is painted and the photo is stored
const idle=()=>!rq&&!fullJob&&!fullT&&!!processed&&!restoring;
window.__pf={S,PARAMS,FILTERS,prep,processRows,renderImageData,setTab,setSource,cleanCustoms,idle,stats,persisted:()=>persistP,get customs(){return customs;}};
})();
</script>
