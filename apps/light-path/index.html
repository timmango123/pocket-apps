<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>光路折鏡</title>
<style>
:root{
  --bg0:#05070f; --bg1:#0b1130; --glass:rgba(140,170,255,.08); --line:rgba(160,190,255,.16);
  --ink:#e8eeff; --dim:#8f9cc8; --acc:#7fe7ff; --acc2:#d98bff; --gold:#ffd66b;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%,#141d4a 0%,#0a0f28 45%,#04060d 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 6px calc(10px + var(--safe-l))}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glass);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .12s,background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lvinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#lvname{font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.diff{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);width:100%}
.dbar{flex:1;max-width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4df0ff,#9b7bff 55%,#ff4d8a)}
#moves{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
#moves b{font-size:20px}
#moves small{display:block;font-size:11px;color:var(--dim)}
#stage{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{flex:0 0 auto;display:flex;justify-content:center;gap:12px;padding:6px 12px calc(10px + var(--safe-b))}
.tbtn{min-width:88px;height:48px;padding:0 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--glass);border:1px solid var(--line);font-size:15px;letter-spacing:.05em;transition:transform .12s}
.tbtn:active{transform:scale(.94)}
.tbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;
  padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
  background:rgba(3,5,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:min(360px,100%);max-height:100%;overflow:auto;padding:22px 20px;border-radius:24px;text-align:center;
  background:linear-gradient(160deg,rgba(40,55,120,.55),rgba(14,18,44,.85));border:1px solid rgba(150,180,255,.22);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.card h2{margin:0 0 6px;font-size:24px;letter-spacing:.12em}
.btn{display:block;width:100%;height:50px;margin-top:10px;border-radius:16px;font-size:16px;letter-spacing:.1em;font-weight:600;
  background:rgba(255,255,255,.07);border:1px solid rgba(160,190,255,.25);transition:transform .12s}
.btn.pri{background:linear-gradient(90deg,#3bd6ff,#9b6bff);color:#071026;border:0;box-shadow:0 6px 24px rgba(90,160,255,.35)}
.btn:active{transform:scale(.96)}
#title{background:radial-gradient(90% 60% at 50% 40%,rgba(10,14,40,.35),rgba(3,5,14,.88))}
.logo{font-size:52px;font-weight:800;letter-spacing:.18em;margin:0 0 4px;padding-left:.18em;
  background:linear-gradient(100deg,#ff6b8b,#ffe36b 30%,#6bffb8 50%,#6bc8ff 70%,#d98bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(120,180,255,.45))}
.sub{color:var(--dim);font-size:14px;letter-spacing:.3em;margin-bottom:26px}
.tmenu{width:min(300px,100%)}
.tmenu .row{display:flex;gap:10px}
.tmenu .row .btn{flex:1}
#select .wrap{width:min(560px,100%);height:100%;display:flex;flex-direction:column}
#select .top{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
#select .top h2{flex:1;margin:0;font-size:20px;letter-spacing:.1em}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);min-height:44px;padding:0 4px}
.switch .tr{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd8ff;transition:transform .2s}
.switch[aria-checked="true"] .tr{background:linear-gradient(90deg,#3bd6ff,#9b6bff)}
.switch[aria-checked="true"] .tr::after{transform:translateX(18px);background:#fff}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:74px;gap:8px;padding:2px 2px 20px;align-content:start}
.tile{position:relative;height:74px;border-radius:14px;background:rgba(120,150,255,.07);border:1px solid rgba(150,180,255,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
.tile .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .st{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.18)}
.tile .st .on{color:var(--gold);text-shadow:0 0 6px rgba(255,200,80,.6)}
.tile .db{width:72%;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.tile .db i{display:block;height:100%;background:linear-gradient(90deg,#4df0ff,#9b7bff 55%,#ff4d8a)}
.tile.done{background:linear-gradient(160deg,rgba(80,200,255,.18),rgba(150,90,255,.12));border-color:rgba(130,210,255,.4)}
.tile.cur{box-shadow:0 0 0 2px var(--acc),0 0 16px rgba(127,231,255,.5)}
.tile.lock{opacity:.38}
.tile .lk{position:absolute;top:5px;right:6px;width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;opacity:.8}
.stars{font-size:40px;letter-spacing:8px;margin:8px 0 2px}
.stars span{color:rgba(255,255,255,.15);display:inline-block;transform:scale(.4);opacity:0;transition:transform .4s cubic-bezier(.3,1.8,.5,1),opacity .3s}
.stars span.in{transform:scale(1);opacity:1}
.stars span.on{color:var(--gold);text-shadow:0 0 14px rgba(255,200,80,.8)}
.rinfo{color:var(--dim);font-size:14px;line-height:1.7}
.rinfo b{color:var(--ink)}
#help .card{text-align:left;width:min(420px,100%)}
#help h2{text-align:center}
.hl{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;line-height:1.5}
.hl canvas{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.35)}
.hl b{color:var(--acc)}
.mix{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;font-size:13px}
.mix i{font-style:normal}
.mix span{white-space:nowrap;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.06)}
#toast{position:absolute;left:50%;width:max-content;max-width:calc(100vw - 32px);text-align:center;top:calc(70px + var(--safe-t));transform:translateX(-50%);z-index:20;pointer-events:none;
  padding:8px 16px;border-radius:14px;background:rgba(20,26,60,.9);border:1px solid rgba(150,180,255,.3);font-size:14px;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
.hid{visibility:hidden}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <div id="lvinfo">
      <div id="lvname">第 1 關</div>
      <div class="diff"><span id="dtxt">難度 1</span><div class="dbar"><i id="dfill" style="width:1%"></i></div></div>
    </div>
    <div id="moves"><b id="mv">0</b><small id="par">標準 0 步</small></div>
    <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
  </header>
  <main id="stage"><canvas id="cv" aria-label="遊戲盤面"></canvas></main>
  <footer id="bar">
    <button class="tbtn" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>復原</button>
    <button class="tbtn" id="bReset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重來</button>
    <button class="tbtn" id="bHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>提示</button>
  </footer>

  <div class="ov" id="title">
    <div class="logo">光路折鏡</div>
    <div class="sub">夜 · 玻 · 璃 · 光 · 謎</div>
    <div class="tmenu">
      <button class="btn pri" id="tPlay">開始遊戲</button>
      <button class="btn" id="tSelect">選擇關卡</button>
      <div class="row"><button class="btn" id="tHelp">玩法說明</button><button class="btn" id="tMute">音效：開</button></div>
    </div>
  </div>

  <div class="ov" id="select">
    <div class="wrap">
      <div class="top">
        <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
        <h2>選擇關卡</h2>
        <button class="switch" id="unlockAll" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="tr"></span></button>
      </div>
      <div id="grid"></div>
    </div>
  </div>

  <div class="ov" id="pause">
    <div class="card">
      <h2>暫停</h2>
      <div class="rinfo" id="pinfo"></div>
      <button class="btn pri" id="pResume">繼續</button>
      <button class="btn" id="pRestart">重新開始</button>
      <button class="btn" id="pHelp">玩法說明</button>
      <button class="btn" id="pSelect">選擇關卡</button>
      <button class="btn" id="pTitle">主選單</button>
    </div>
  </div>

  <div class="ov" id="result">
    <div class="card">
      <h2 id="rTitle">光路接通！</h2>
      <div class="stars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="rinfo" id="rInfo"></div>
      <button class="btn pri" id="rNext">下一關</button>
      <button class="btn" id="rRetry">再挑戰一次</button>
      <button class="btn" id="rSelect">選擇關卡</button>
    </div>
  </div>

  <div class="ov" id="help">
    <div class="card">
      <h2>玩法說明</h2>
      <div class="hl"><canvas data-k="emit"></canvas><div>邊框上的<b>發射器</b>會射出彩色雷射。</div></div>
      <div class="hl"><canvas data-k="mirror"></canvas><div><b>點擊</b>帶轉盤的鏡子，旋轉 90°（／ ↔ ＼）讓光轉彎。</div></div>
      <div class="hl"><canvas data-k="target"></canvas><div>讓每個<b>目標</b>同時收到外圈標示的<b>完全相同</b>顏色。</div></div>
      <div class="mix"><span><i style="color:#ff6b8b">紅</i>＋<i style="color:#5fa8ff">藍</i>＝<i style="color:#d77bff">紫</i></span><span><i style="color:#ff6b8b">紅</i>＋<i style="color:#55f0a0">綠</i>＝<i style="color:#ffe36b">黃</i></span><span><i style="color:#55f0a0">綠</i>＋<i style="color:#5fa8ff">藍</i>＝<i style="color:#6bfff2">青</i></span><span>三色＝白</span></div>
      <div class="hl"><canvas data-k="split"></canvas><div><b>分光鏡</b>：光一半穿過、一半反射，可旋轉。</div></div>
      <div class="hl"><canvas data-k="filter"></canvas><div><b>濾色片</b>：只讓同色成分通過。</div></div>
      <div class="hl"><canvas data-k="prism"></canvas><div><b>稜鏡</b>：紅光左轉、綠光直行、藍光右轉。</div></div>
      <div class="hl"><canvas data-k="crystal"></canvas><div><b>禁觸晶體</b>：任何光碰到都不算過關。</div></div>
      <div class="hl"><canvas data-k="block"></canvas><div><b>石塊</b>擋光；<b>鉚釘固定鏡</b>無法旋轉。</div></div>
      <div class="rinfo" style="margin-top:8px">步數 ≤ 標準步數可得三星。過關不需要達標，鍵盤：方向鍵移動、空白鍵旋轉、Z 復原、R 重來。</div>
      <button class="btn pri" id="hClose">知道了</button>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script>
// ===CORE-START===
var LPCore = (function () {
  'use strict';
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var EMPTY = 0, MIRROR = 1, SPLIT = 2, FMIRROR = 3, BLOCK = 4, FILTER = 5, PRISM = 6, TARGET = 7, CRYSTAL = 8;
  var SLASH = [1, 0, 3, 2], BACK = [3, 2, 1, 0];
  function reflect(o, d) { return o ? BACK[d] : SLASH[d]; }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pop(c) { return (c & 1) + ((c >> 1) & 1) + ((c >> 2) & 1); }
  var SIZES = [[5, 5], [5, 6], [6, 6], [6, 7], [7, 7], [7, 8], [7, 9], [8, 9], [8, 10], [8, 11]];

  function params(L) {
    var t = (L - 1) / 99;
    var sz = SIZES[Math.min(9, Math.floor((L - 1) / 10))];
    var W = sz[0], H = sz[1], N = W * H;
    var g = Math.pow(1.035, L - 1); // compound growth 1 .. ~30
    return {
      L: L, t: t, W: W, H: H, N: N,
      E: Math.min(4, 1 + Math.floor(L / 16)),
      pTurn: Math.min(0.62, 0.32 + 0.004 * L),
      pSplit: L >= 14 ? Math.min(0.4, 0.14 + 0.003 * L) : 0,
      pFixed: L >= 7 ? 0.1 : 0,
      pFilter: L >= 24 ? 0.3 : 0,
      pPrism: L >= 38 ? 0.35 : 0,
      pMix: L >= 16 ? 0.55 : 0,
      combo: L >= 30 ? Math.min(0.6, 0.2 + 0.006 * L) : 0,
      white: L >= 38 ? 0.25 : 0,
      budget: Math.round((W + H) * (0.55 + 0.75 * t)),
      decoys: Math.round(Math.min(N * 0.3, 0.6 * g + N * 0.04 * (L > 3 ? 1 : 0))),
      blocks: L >= 4 ? Math.round(N * (0.03 + 0.03 * t)) : 0,
      crystals: L >= 10 ? Math.round(Math.min(N * 0.16, 0.6 * Math.sqrt(g) + N * 0.09 * t)) : 0,
      pEndEdge: 0.3 + 0.3 * t,
      pFlip: Math.min(0.92, 0.55 + 0.004 * L),
      minRot: Math.min(30, 2 + Math.round(1.2 * Math.sqrt(g) * (1 + 2.4 * t)))
    };
  }

  function newLevel(W, H) {
    var N = W * H;
    return { W: W, H: H, N: N, type: new Uint8Array(N), ori: new Uint8Array(N), mask: new Uint8Array(N), emitters: [] };
  }

  // Trace beams. Returns recv (per cell bits), crystal hit flag, half-seg colors if wantSegs.
  function trace(lv, ori, wantSegs) {
    var W = lv.W, H = lv.H, N = lv.N, type = lv.type, mask = lv.mask;
    var vis = new Uint8Array(N * 4), recv = new Uint8Array(N);
    var half = wantSegs ? new Uint8Array(N * 4) : null, hin = wantSegs ? new Uint8Array(N * 4) : null;
    var exits = wantSegs ? [] : null, stubs = wantSegs ? [] : null;
    var st = [], crystal = 0, touched = new Uint8Array(N);
    var em = lv.emitters;
    for (var e = 0; e < em.length; e++) {
      var E = em[e];
      for (var b = 1; b <= 4; b <<= 1) if (E.c & b) st.push(E.x, E.y, E.d, b);
      if (wantSegs) stubs.push(E);
    }
    while (st.length) {
      var b2 = st.pop(), d = st.pop(), y = st.pop(), x = st.pop();
      for (;;) {
        if (x < 0 || y < 0 || x >= W || y >= H) { if (wantSegs) exits.push(x, y, d, b2); break; }
        var i = y * W + x, k = i * 4 + d;
        if (vis[k] & b2) break;
        vis[k] |= b2;
        var t = type[i];
        touched[i] = 1;
        if (t === BLOCK) break;
        var back = (d + 2) & 3;
        if (wantSegs) { half[i * 4 + back] |= b2; hin[i * 4 + back] = 1; }
        var nd = d, stop = false;
        if (t === MIRROR || t === FMIRROR) nd = reflect(ori[i], d);
        else if (t === SPLIT) {
          var rd = reflect(ori[i], d);
          if (wantSegs) { half[i * 4 + rd] |= b2; }
          st.push(x + DX[rd], y + DY[rd], rd, b2);
        } else if (t === FILTER) { if (!(mask[i] & b2)) stop = true; }
        else if (t === PRISM) { nd = b2 === 1 ? (d + 3) & 3 : b2 === 4 ? (d + 1) & 3 : d; }
        else if (t === TARGET) { recv[i] |= b2; stop = true; }
        else if (t === CRYSTAL) { recv[i] |= b2; crystal = 1; stop = true; }
        if (stop) break;
        if (wantSegs) { half[i * 4 + nd] |= b2; }
        d = nd; x += DX[d]; y += DY[d];
      }
    }
    return { recv: recv, crystal: crystal, half: half, hin: hin, exits: exits, touched: touched };
  }

  function isWin(lv, tr) {
    if (tr.crystal) return false;
    for (var i = 0; i < lv.N; i++) if (lv.type[i] === TARGET && tr.recv[i] !== lv.mask[i]) return false;
    return true;
  }

  function build(L, variant) {
    var P = params(L);
    var rng = mulberry32((Math.imul(L, 0x9E3779B1) ^ Math.imul(variant + 1, 0x85EBCA77) ^ 0x1234567) >>> 0);
    function ri(n) { return Math.floor(rng() * n); }
    for (var attempt = 0; attempt < 200; attempt++) {
      var lv = tryBuild(P, rng, ri);
      if (lv) { lv.L = L; lv.variant = variant; lv.attempt = attempt; return lv; }
    }
    return null;
  }

  function tryBuild(P, rng, ri) {
    var W = P.W, H = P.H, N = P.N;
    var lv = newLevel(W, H);

  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0008, t0 + dur);
  o.connect(g); g.connect(master); if (wet && delay) g.connect(delay);
  o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol, freq){
  if (!AC || muted) return;
  var t0 = AC.currentTime, n = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
  var s = AC.createBufferSource(); s.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 3000; f.Q.value = 1.2;
  var g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
var PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
function sfxTap(i, back){ noise(.04, .25, back ? 1800 : 4200); tone(back ? 330 : 660 + (i % 5)*40, .07, 'triangle', .08); }
function sfxLit(){ tone(PENTA[Math.floor(Math.random()*5)+2], .9, 'sine', .14, 0, true); tone(PENTA[Math.floor(Math.random()*5)]*2, .6, 'sine', .05, .03, true); }
function sfxCrystal(){ tone(110, .35, 'sawtooth', .08); tone(116, .35, 'square', .04); noise(.2, .35, 900); }
function sfxWin(){
  var ch = [523.25, 659.25, 783.99, 987.77, 1174.66, 1567.98];
  for (var k = 0; k < ch.length; k++) { tone(ch[k], 1.8, 'sine', .11, k*.07, true); tone(ch[k]*2, 1.0, 'triangle', .025, k*.07 + .01, true); }
  tone(261.63, 2.2, 'sine', .12, 0, true);
}
function sfxStar(k){ tone([880, 1108.7, 1318.5][k], .5, 'triangle', .1, 0, true); }
function sfxHint(){ tone(1046.5, .3, 'sine', .08, 0, true); tone(1318.5, .3, 'sine', .06, .08, true); }
function sfxNope(){ tone(180, .1, 'square', .05); }
function sfxReset(){ noise(.12, .2, 2000); tone(392, .15, 'triangle', .06); }
function sfxUi(){ tone(880, .06, 'triangle', .05); }
function vibrate(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function setMute(m){
  muted = m; sset('mute', m);
  if (master) master.gain.value = m ? 0 : .55;
  $('muteIcon').innerHTML = m ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>' : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>';
  $('tMute').textContent = '音效：' + (m ? '關' : '開');
}

// ---------- overlays ----------
var ovs = ['title','select','pause','result','help'];
var helpReturn = null;
function showOv(id){ for (var k = 0; k < ovs.length; k++) $(ovs[k]).classList.toggle('show', ovs[k] === id); }
var toastT = 0;
function toast(msg, ms){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, ms || 1800); }
var INTRO = [[C.SPLIT,'新元件：分光鏡，光會一半穿過、一半反射'],[C.CRYSTAL,'新元件：禁觸晶體，別讓任何光碰到它'],[C.FILTER,'新元件：濾色片，只讓同色成分通過'],[C.PRISM,'新元件：稜鏡，紅左轉、綠直行、藍右轉'],[C.FMIRROR,'鉚釘固定鏡無法旋轉'],[C.BLOCK,'石塊會擋住光線']];
function has(lv, t){ for (var i = 0; i < lv.N; i++) if (lv.type[i] === t) return true; return false; }
function introFor(L){
  if (L === 1) return '點擊帶轉盤的鏡子旋轉它，讓光點亮目標';
  var lv = getLevel(L), pv = getLevel(L - 1);
  for (var k = 0; k < INTRO.length; k++) if (has(lv, INTRO[k][0]) && !has(pv, INTRO[k][0])) return INTRO[k][1];
  var mixed = false, pmixed = false;
  for (var i = 0; i < lv.N; i++) if (lv.type[i] === C.TARGET && (lv.mask[i] & (lv.mask[i]-1))) mixed = true;
  for (i = 0; i < pv.N; i++) if (pv.type[i] === C.TARGET && (pv.mask[i] & (pv.mask[i]-1))) pmixed = true;
  if (mixed && !pmixed && L < 40) return '混色目標：需要多道光同時照到，例如紅＋藍＝紫';
  return null;
}

function buildSelect(){
  var g = $('grid'), html = '';
  for (var L = 1; L <= 100; L++) {
    var s = prog.stars[L] || 0, un = isUnlocked(L);
    var cls = 'tile' + (s ? ' done' : '') + (un ? '' : ' lock') + (L === lastLevel ? ' cur' : '');
    html += '<button class="' + cls + '" data-l="' + L + '" aria-label="第' + L + '關 難度' + L + (un ? '' : ' 未解鎖') + '"><span class="n">' + L + '</span>' +
      '<span class="st">' + [0,1,2].map(function(k){ return k < s ? '<span class="on">★</span>' : '★'; }).join('') + '</span>' +
      '<span class="db"><i style="width:' + L + '%"></i></span>' + (un ? '' : '<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>') + '</button>';
  }
  g.innerHTML = html;
  var sw = $('unlockAll'); sw.setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
function openSelect(){
  buildSelect(); showOv('select'); screen = 'select';
  var cur = document.querySelector('.tile.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
}
function nextPlayable(){
  for (var L = 1; L <= 100; L++) if (!prog.stars[L] && isUnlocked(L)) return L;
  return Math.min(100, lastLevel);
}
$('grid').addEventListener('click', function(ev){
  var b = ev.target.closest('.tile'); if (!b) return;
  initAudio();
  var L = +b.getAttribute('data-l');
  if (!isUnlocked(L)) { toast('先完成第 ' + (L-1) + ' 關即可解鎖'); sfxNope(); return; }
  sfxUi(); startLevel(L);
});
$('unlockAll').addEventListener('click', function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); sfxUi(); buildSelect(); });
$('sBack').addEventListener('click', function(){ sfxUi(); showOv('title'); screen = 'title'; showTitleBoard(); });
$('tPlay').addEventListener('click', function(){ initAudio(); sfxUi(); startLevel(nextPlayable()); });
$('tSelect').addEventListener('click', function(){ initAudio(); sfxUi(); openSelect(); });
$('tHelp').addEventListener('click', function(){ initAudio(); helpReturn = 'title'; openHelp(); });
$('tMute').addEventListener('click', function(){ initAudio(); setMute(!muted); sfxUi(); });
$('bMute').addEventListener('click', function(){ initAudio(); setMute(!muted); sfxUi(); });
$('bPause').addEventListener('click', function(){ initAudio(); pause(); });
$('bUndo').addEventListener('click', function(){ initAudio(); undo(); });
$('bReset').addEventListener('click', function(){ initAudio(); if (G && screen === 'game') resetLevel(); });
$('bHint').addEventListener('click', function(){ initAudio(); if (screen === 'game') hint(); });
$('pResume').addEventListener('click', function(){ sfxUi(); showOv(null); screen = 'game'; });
$('pRestart').addEventListener('click', function(){ resetLevel(); });
$('pHelp').addEventListener('click', function(){ helpReturn = 'pause'; openHelp(); });
$('pSelect').addEventListener('click', function(){ sfxUi(); openSelect(); });
$('pTitle').addEventListener('click', function(){ sfxUi(); showOv('title'); screen = 'title'; showTitleBoard(); });
$('rNext').addEventListener('click', function(){ sfxUi(); startLevel(G.L + 1); });
$('rRetry').addEventListener('click', function(){ sfxUi(); startLevel(G.L); });
$('rSelect').addEventListener('click', function(){ sfxUi(); openSelect(); });
$('hClose').addEventListener('click', function(){ sfxUi(); if (helpReturn === 'pause') { showOv('pause'); } else { showOv('title'); } });
function pause(){
  if (screen !== 'game' || !G) return;
  sfxUi(); screen = 'pause';
  $('pinfo').innerHTML = '第 <b>' + G.L + '</b> 關　步數 <b>' + G.moves + '</b>　標準 <b>' + G.lv.par + '</b>';
  showOv('pause');
}
function openHelp(){ sfxUi(); showOv('help'); screen = 'help'; drawHelpIcons(); }
function drawHelpIcons(){
  var list = document.querySelectorAll('#help canvas');
  for (var k = 0; k < list.length; k++) {
    var cvh = list[k], d = 2, c = cvh.getContext('2d'); cvh.width = 44*d; cvh.height = 44*d;
    c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,44,44);
    var kind = cvh.getAttribute('data-k'), cs = 34;
    if (kind === 'emit') { c.strokeStyle = 'rgba(255,79,110,.8)'; c.lineWidth = 3; c.beginPath(); c.moveTo(22, 30); c.lineTo(22, 2); c.stroke(); drawEmitter(c, 22, 34, 0, 1, cs, 0); }
    else if (kind === 'mirror') drawMirror(c, 22, 22, -45, cs, 'mirror', true);
    else if (kind === 'split') drawMirror(c, 22, 22, 45, cs, 'split', false);
    else if (kind === 'target') drawTarget(c, 22, 22, cs, 5, 5, true, 0, 0);
    else if (kind === 'filter') drawFilter(c, 22, 22, cs, 4);
    else if (kind === 'prism') drawPrism(c, 22, 22, cs, 0);
    else if (kind === 'crystal') drawCrystal(c, 22, 22, cs, false, 0);
    else if (kind === 'block') { drawBlock(c, 13, 22, 22); drawMirror(c, 31, 22, 45, 22, 'fixed', false); }
  }
}
function showTitleBoard(){
  // decorative solved level behind the title
  var L = 46, lv = getLevel(L);
  G = { L: L, lv: lv, ori: new Uint8Array(lv.sol), moves: 0, hist: [], won: false, ang: {}, angT: {}, hint: -1, lit: {}, cursor: -1, shake: 0, crystalWas: 0, flash: {}, deco: true };
  for (var k = 0; k < lv.rot.length; k++) { var i = lv.rot[k]; G.ang[i] = G.angT[i] = G.ori[i] ? 45 : -45; }
  for (i = 0; i < lv.N; i++) if (lv.type[i] === C.FMIRROR) G.ang[i] = G.angT[i] = lv.ori[i] ? 45 : -45;
  G.tr = C.trace(lv, G.ori, true);
  for (i = 0; i < lv.N; i++) if (lv.type[i] === C.TARGET) G.lit[i] = G.tr.recv[i] === lv.mask[i];
  layout(); buildStatic();
}

// ---------- input ----------
function cellAt(px, py){
  if (!G) return -1;
  var lv = G.lv, x = Math.floor((px - lay.ox) / lay.cs), y = Math.floor((py - lay.oy) / lay.cs);
  if (x < 0 || y < 0 || x >= lv.W || y >= lv.H) return -1;
  return y*lv.W + x;
}
// touch slop: a finger landing on an empty / fixed cell (or just off the board) picks the closest mirror whose
// centre is within 0.85 cell of the touch point, so near misses on small cells still turn the intended mirror
function nearestTurnable(px, py, fallback){
  var lv = G.lv, cs = lay.cs, best = -1, bd = 0.85 * cs;
  for (var k = 0; k < lv.rot.length; k++) {
    var j = lv.rot[k], cx = lay.ox + (j % lv.W + 0.5)*cs, cy = lay.oy + ((j / lv.W | 0) + 0.5)*cs;
    var d = Math.hypot(px - cx, py - cy);
    if (d < bd) { bd = d; best = j; }
  }
  return best >= 0 ? best : fallback;
}
cv.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  initAudio();
  if (screen !== 'game' || !G || G.deco) return;
  var r = cv.getBoundingClientRect();
  var px = ev.clientX - r.left, py = ev.clientY - r.top, i = cellAt(px, py);
  if (i < 0 || (G.lv.type[i] !== C.MIRROR && G.lv.type[i] !== C.SPLIT)) i = nearestTurnable(px, py, i);
  if (i >= 0) { G.cursor = -1; tapCell(i); }
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(ev){
  var k = ev.key;
  if (screen === 'game' && G && !G.deco) {
    var lv = G.lv;
    if (k === 'Escape' || k === 'p' || k === 'P') { pause(); ev.preventDefault(); return; }
    if (k === 'z' || k === 'Z' || k === 'u' || k === 'U' || k === 'Backspace') { initAudio(); undo(); ev.preventDefault(); return; }
    if (k === 'r' || k === 'R') { initAudio(); resetLevel(); return; }
    if (k === 'h' || k === 'H') { initAudio(); hint(); return; }
    var dirs = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 };
    if (k in dirs) {
      ev.preventDefault();
      if (G.cursor < 0) { G.cursor = lv.rot.length ? lv.rot[0] : 0; return; }
      var x = G.cursor % lv.W, y = G.cursor / lv.W | 0, d = dirs[k];
      x = Math.max(0, Math.min(lv.W - 1, x + C.DX[d])); y = Math.max(0, Math.min(lv.H - 1, y + C.DY[d]));
      G.cursor = y*lv.W + x; return;
    }
    if ((k === ' ' || k === 'Enter') && G.cursor >= 0) { ev.preventDefault(); initAudio(); tapCell(G.cursor); return; }
  } else if (screen === 'pause' && (k === 'Escape' || k === 'p')) { showOv(null); screen = 'game'; }
  else if (screen === 'result' && k === 'Enter' && G && G.L < 100) { startLevel(G.L + 1); }
});

window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

// ---------- test hook ----------
window.__game = {
  start: function(L){ startLevel(L); return true; },
  state: function(){
    if (!G) return null;
    return { level: G.L, moves: G.moves, par: G.lv.par, won: G.won, screen: screen, W: G.lv.W, H: G.lv.H,
      ori: Array.from(G.ori), rot: Array.from(G.lv.rot), crystal: G.tr ? G.tr.crystal : 0 };
  },
  cellClient: function(i){ var r = cv.getBoundingClientRect(), p = cellCenter(i); return { x: r.left + p.x, y: r.top + p.y }; },
  tap: function(i){ return tapCell(i); },
  progress: function(){ return JSON.parse(JSON.stringify(prog)); },
  levelInfo: function(L){ var lv = getLevel(L); return { W: lv.W, H: lv.H, par: lv.par, variant: LEVELS[L-1][0] }; }
};

setMute(muted);
resize();
showTitleBoard();
showOv('title');
startLoop();
})();
</script>
