  if (people.length >= 200) { err.hidden = false; err.textContent = '清單已達上限 200 筆'; return; }
  const dup = people.find(p => p.name === name && p.date === cur.date && p.calendar === cur.calendar);
  if (dup) { toast('「' + name + '」已在清單中'); return; }
  people.push({ id: uid(), name, date: cur.date, calendar: cur.calendar, leap: !!cur.leap });
  savePeople(); renderPeople(); toast('已存入「' + name + '」');
});
$('#copy').addEventListener('click', () => {
  if (!lastText) { toast('目前沒有結果可複製'); return; }
  const fallback = () => { const el = $('#out .hero'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('無法存取剪貼簿：' + lastText); };
  try { navigator.clipboard.writeText(lastText).then(() => toast('已複製：' + lastText), fallback); } catch (e) { fallback(); }
});
/* 匯出／匯入 */
let dl = null;
(async () => { try { dl = await window.claude?.use?.('downloads') || null; } catch (e) { dl = null; } $('#export').textContent = dl ? '匯出' : '複製 JSON'; })();
$('#export').addEventListener('click', async () => {
  const data = JSON.stringify({ app: 'age-zodiac', version: 1, people: people.map(({ id, name, date, calendar, leap }) => ({ id, name, date, calendar, leap })) }, null, 2);
  if (dl) {
    try { await dl.save({ filename: 'birthdays-' + iso(TODAY) + '.json', data }); toast('已匯出 ' + people.length + ' 筆'); }
    catch (e) { if (!/declin/i.test(String(e && (e.code || e.message || e)))) toast('匯出失敗'); }
    return;
  }
  try { await navigator.clipboard.writeText(data); toast('已複製 ' + people.length + ' 筆 JSON'); } catch (e) { toast('無法存取剪貼簿'); }
});
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const arr = Array.isArray(j) ? j : j.people;
    if (!Array.isArray(arr)) throw new Error('fmt');
    let added = 0, bad = 0;
    for (const raw of arr) {
      const p = { id: uid(), name: String(raw && raw.name || '').trim().slice(0, 20), date: String(raw && raw.date || ''), calendar: raw && raw.calendar === 'lunar' ? 'lunar' : 'solar', leap: !!(raw && raw.leap) };
      if (!validPerson(p) || solarOf(p) > TODAY) { bad++; continue; }
      if (people.some(q => q.name === p.name && q.date === p.date && q.calendar === p.calendar)) continue;
      if (people.length >= 200) { bad++; continue; }
      people.push(p); added++;
    }
    savePeople(); renderPeople(); toast('匯入 ' + added + ' 筆' + (bad ? '，略過 ' + bad + ' 筆格式不符' : ''));
  } catch (err) { toast('檔案格式不正確'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const t = TODAY; refreshToday(); if (t !== TODAY) { $('#birth').max = iso(TODAY); } render(); renderPeople(); } });

fill(); render(); renderPeople();
window.__age = { calcAge: (a, b) => calcAge(parseISO(a), parseISO(b)), zodiacSign, lunarYearOf: s => lunarYearOf(parseISO(s)), nextBirthday: (p, t) => nextBirthday(p, parseISO(t)), solarToLunar: s => solarToLunar(parseISO(s)), lunarToSolar: (y, m, d, l) => { const n = lunarToSolar(y, m, d, l); return n == null ? null : iso(n); }, spring: y => iso(SPRING[y - 1900]), settings };
})();
</script>
