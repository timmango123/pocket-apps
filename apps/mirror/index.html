<title>鏡子</title>
<style>
/* A vanity mirror: an oval glass ringed with warm bulbs on the welcome card; once open, the whole screen is glass with smoked controls. */
:root {
  --bg: #f6eee8;
  --bg-2: #efe2d9;
  --card: #fffaf6;
  --ink: #2a1f22;
  --ink-2: #57464a;
  --muted: #7a676b;
  --line: #e6d6cc;
  --accent: #a4554b;
  --accent-ink: #ffffff;
  --accent-soft: #f4dcd5;
  --glass: linear-gradient(150deg, #e9eef3 0%, #c9d3dc 38%, #f4f6f8 52%, #b9c4ce 100%);
  --frame: #d9b9a6;
  --bulb: #fff3d6;
  --bulb-glow: rgba(255, 196, 110, .75);
  --warn-bg: #fbe6e1;
  --focus: #1b56d6;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  /* camera surface: always dark, like a lit mirror in a dim room */
  --smoke: rgba(18, 14, 16, .55);
  --smoke-2: rgba(18, 14, 16, .78);
  --smoke-line: rgba(255, 255, 255, .16);
  --on-smoke: #fbf6f4;
  --on-smoke-dim: #cbbfbd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141012; --bg-2: #1c1619; --card: #1f191c; --ink: #f4ebe8; --ink-2: #d9cbc7; --muted: #a8979a; --line: #33292d;
    --accent: #e8a598; --accent-ink: #2a1210; --accent-soft: #3b2522;
    --glass: linear-gradient(150deg, #3a4249 0%, #232a31 40%, #4a535b 53%, #1b2026 100%);
    --frame: #6e5249; --bulb: #ffe9bf; --bulb-glow: rgba(255, 186, 90, .55); --warn-bg: #3a201d; --focus: #8fb2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141012; --bg-2: #1c1619; --card: #1f191c; --ink: #f4ebe8; --ink-2: #d9cbc7; --muted: #a8979a; --line: #33292d;
  --accent: #e8a598; --accent-ink: #2a1210; --accent-soft: #3b2522;
  --glass: linear-gradient(150deg, #3a4249 0%, #232a31 40%, #4a535b 53%, #1b2026 100%);
  --frame: #6e5249; --bulb: #ffe9bf; --bulb-glow: rgba(255, 186, 90, .55); --warn-bg: #3a201d; --focus: #8fb2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- welcome ---------- */
.intro { position: fixed; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 70%); }
.vanity { position: relative; width: 196px; height: 250px; margin: 6px auto 26px; flex: none; }
.vanity .oval { position: absolute; inset: 18px; border-radius: 50%; background: var(--glass); box-shadow: 0 0 0 7px var(--frame), 0 0 0 8px rgba(0,0,0,.08), 0 22px 40px -18px rgba(60, 20, 10, .45); overflow: hidden; }
.vanity .oval::before { content: ""; position: absolute; left: 22%; top: 10%; width: 22%; height: 55%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0)); transform: rotate(18deg); }
.vanity .oval::after { content: ""; position: absolute; left: 56%; top: 16%; width: 7%; height: 30%; border-radius: 50%; background: rgba(255,255,255,.45); transform: rotate(18deg); }
.bulb { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--bulb); box-shadow: 0 0 10px 3px var(--bulb-glow), 0 0 0 2px rgba(0,0,0,.05); }
.intro h1 { margin: 0; font-size: 26px; letter-spacing: .12em; font-weight: 700; }
.intro .lead { margin: 6px 0 22px; color: var(--muted); text-align: center; max-width: 300px; font-size: 14px; }
.cta { min-height: 56px; min-width: 220px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; letter-spacing: .06em; padding: 0 28px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 24px -12px var(--accent); }
.cta svg { width: 22px; height: 22px; }
.cta:disabled { opacity: .6; }
.ghost { margin-top: 10px; min-height: 44px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 16px; text-decoration: underline; text-underline-offset: 3px; }
.err { margin-top: 16px; max-width: 340px; width: 100%; background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--ink); }
.err b { display: block; margin-bottom: 2px; }
.err a { color: var(--accent); font-weight: 600; word-break: break-all; }
.privacy { margin-top: 18px; color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }

/* ---------- camera stage ---------- */
.stage { position: fixed; inset: 0; background: #000; color: var(--on-smoke); overflow: hidden; }
.frame { position: absolute; inset: 0; transition: background-color .2s; }
.view { position: absolute; overflow: hidden; background: #0b0a0b; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.frame.ringon .view { border-radius: 18px; }
.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
.layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.layer video.flip { transform: scaleX(-1); }
.layer canvas { position: absolute; display: block; }
.fillmsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #5a4636; font-size: 14px; background: radial-gradient(90% 60% at 50% 45%, rgba(255,255,255,.55), rgba(255,255,255,0)); }
.fillmsg div { max-width: 260px; }
.fillmsg b { display: block; color: #2a1f22; font-size: 18px; margin-bottom: 6px; letter-spacing: .08em; }
.fillmsg button { margin-top: 16px; min-height: 44px; border-radius: 999px; border: 1px solid rgba(60,40,30,.25); background: rgba(255,255,255,.6); color: #2a1f22; padding: 0 18px; }

.bar { position: absolute; left: 0; right: 0; display: flex; align-items: center; z-index: 5; transition: opacity .2s, transform .2s; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.bar.top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); justify-content: space-between; gap: 8px; }
.bar.bottom { bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.stage.bare .bar { opacity: 0; pointer-events: none; }
.stage.bare .bar > * { pointer-events: none; }
.stage.bare .bar.top { transform: translateY(-12px); }
.stage.bare .bar.bottom { transform: translateY(12px); }
.grp { display: flex; gap: 6px; background: var(--smoke); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--smoke-line); border-radius: 999px; padding: 4px; }
.ib { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--on-smoke); display: grid; place-items: center; }
.ib svg { width: 22px; height: 22px; }
.ib[aria-pressed="true"] { background: var(--bulb); color: #3a2410; }
.side { display: flex; min-width: 0; }
.side.r { justify-content: flex-end; }
.pill { min-width: 64px; height: 44px; border-radius: 999px; border: 1px solid var(--smoke-line); background: var(--smoke); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: var(--on-smoke); font: 600 15px/1 var(--mono); padding: 0 12px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill svg { width: 20px; height: 20px; }
.pill.txt { font: 600 14px/1 var(--sans); }
.shutter { width: 72px; height: 72px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.22); display: grid; place-items: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 0 0 3px rgba(255,255,255,.9) inset; }
.shutter span { width: 56px; height: 56px; border-radius: 50%; background: #fff; color: #2a1f22; display: grid; place-items: center; transition: transform .1s; }
.shutter:active span { transform: scale(.92); }
.shutter svg { width: 24px; height: 24px; }
.frozen .shutter span { background: var(--bulb); }
.tagf { position: absolute; z-index: 4; left: max(14px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 56px); background: rgba(10, 132, 255, .92); color: #fff; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 8px; letter-spacing: .06em; pointer-events: none; }
.hintz { position: absolute; z-index: 4; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--smoke-2); color: var(--on-smoke); padding: 10px 16px; border-radius: 12px; font: 600 22px/1 var(--mono); pointer-events: none; opacity: 0; transition: opacity .25s; }
.hintz.show { opacity: 1; }

/* adjust drawer */
.drawer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; background: rgba(22, 17, 19, .88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--smoke-line); border-radius: 20px 20px 0 0; padding: 8px 18px calc(16px + env(safe-area-inset-bottom)); color: var(--on-smoke); max-height: 70%; overflow-y: auto; }
.drawer .grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); margin: 2px auto 8px; }
.drawer h2 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.drawer h2 button { border: 0; background: none; color: var(--on-smoke-dim); min-height: 40px; padding: 0 4px; font-size: 14px; }
.ctl { display: grid; grid-template-columns: 64px 1fr 48px; align-items: center; gap: 10px; min-height: 46px; }
.ctl label { font-size: 14px; color: var(--on-smoke-dim); }
.ctl output { font: 13px/1 var(--mono); text-align: right; color: var(--on-smoke); }
input[type="range"] { width: 100%; height: 32px; accent-color: #ffd28a; margin: 0; }
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; }
.row2 span { font-size: 14px; color: var(--on-smoke-dim); }
.seg { display: flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--on-smoke-dim); min-width: 56px; height: 38px; border-radius: 8px; font-size: 14px; }
.seg button[aria-checked="true"] { background: rgba(255,255,255,.9); color: #2a1f22; font-weight: 700; }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 0; background: rgba(255,255,255,.2); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: #e39b6c; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.tip { font-size: 12.5px; color: var(--on-smoke-dim); margin: 6px 0 0; }

.resume { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(0,0,0,.72); border: 0; color: var(--on-smoke); width: 100%; font-size: 15px; }
.resume div { display: grid; justify-items: center; gap: 10px; }
.resume svg { width: 48px; height: 48px; }
.toast { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 60px); transform: translateX(-50%); background: rgba(20, 16, 18, .9); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }

@media (min-width: 900px) and (pointer: fine) {
  .stage { display: flex; flex-direction: column; align-items: center; background: #111; }
  .bar { position: relative; width: min(960px, 100% - 48px); padding: 12px 0; }
  .bar.top { order: 0; padding-top: 16px; }
  .bar.bottom { order: 2; padding-bottom: 20px; }
  .frame { position: relative; order: 1; flex: 1 1 auto; width: min(960px, 100% - 48px); max-height: calc(min(960px, 100vw - 48px) / var(--ar, 1.7778)); border-radius: 18px; overflow: hidden; }
  .stage.bare .bar { opacity: 1; pointer-events: auto; transform: none; }
  .stage.bare .bar > * { pointer-events: auto; }
  .drawer { left: 50%; right: auto; width: 420px; transform: translateX(-50%); bottom: 96px; border-radius: 20px; border: 1px solid var(--smoke-line); }
  .tagf { left: 24px; top: 24px; position: absolute; }
}
</style>

<script>
/*CORE-START*/
const ZMIN = 1, ZMAX = 5;
const clampZoom = z => Math.min(ZMAX, Math.max(ZMIN, isFinite(z) ? z : 1));
// Layer transform is translate(tx,ty) scale(z) with origin 0 0 over a W×H view; keep the view fully covered
function clampPan(z, tx, ty, W, H) {
  return { tx: Math.min(0, Math.max(W - z * W, tx)), ty: Math.min(0, Math.max(H - z * H, ty)) };
}
// Zoom to z2 keeping the content under view point (cx,cy) fixed
function zoomAt(s, z2, cx, cy, W, H) {
  z2 = clampZoom(z2);
  const px = (cx - s.tx) / s.z, py = (cy - s.ty) / s.z, p = clampPan(z2, cx - z2 * px, cy - z2 * py, W, H);
  return { z: z2, tx: p.tx, ty: p.ty };
}
// Pinch: content point under the first midpoint follows the current midpoint
function pinch(s0, d0, d1, m0, m1, W, H) {
  const z2 = clampZoom(s0.z * (d1 / Math.max(1, d0)));
  const px = (m0.x - s0.tx) / s0.z, py = (m0.y - s0.ty) / s0.z, p = clampPan(z2, m1.x - z2 * px, m1.y - z2 * py, W, H);
  return { z: z2, tx: p.tx, ty: p.ty };
}
const doubleTapZoom = z => (z < 1.75 ? 2.5 : 1);
// object-fit: cover rectangle of a srcW×srcH image inside W×H
function coverRect(srcW, srcH, W, H) {
  const k = Math.max(W / srcW, H / srcH), w = srcW * k, h = srcH * k;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h, k };
}
// The part of the (displayed, already mirrored if mirroring is on) frame that is visible in the view
function visibleSource(srcW, srcH, W, H, z, tx, ty) {
  const r = coverRect(srcW, srcH, W, H);
  const cx0 = -tx / z, cy0 = -ty / z, cw = W / z, ch = H / z;
  let sx = (cx0 - r.x) / r.k, sy = (cy0 - r.y) / r.k, sw = cw / r.k, sh = ch / r.k;
  sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(srcW - sx, sw); sh = Math.min(srcH - sy, sh);
  return { sx, sy, sw, sh };
}
// A rectangle in mirrored frame coordinates -> the same pixels in the raw camera frame
function mirrorRect(r, srcW) { return { sx: srcW - r.sx - r.sw, sy: r.sy, sw: r.sw, sh: r.sh }; }
