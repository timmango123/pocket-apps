<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>誰是臥底／狼人殺主持</title>
<style>
:root{
  --bg:#efe8da; --surface:#fffdf7; --surface-2:#f5efe3; --ink:#1f1a17; --ink-2:#5a514a; --ink-3:#7d746b;
  --line:#dcd2c2; --line-strong:#b9ad9a;
  --accent:#9a2a33; --accent-ink:#fff6f0; --accent-soft:#f6e0dd;
  --night:#1e2f4d; --night-ink:#f3f0e6; --night-soft:#dbe3f0;
  --moon:#d9a441; --good:#2e6b4a; --good-soft:#dcebe0; --bad:#9a2a33; --bad-soft:#f6e0dd; --warn:#8a5a00;
  --focus:#1c5fd1; --scrim:rgba(20,16,12,.5);
  --shadow:0 1px 0 rgba(40,30,20,.05), 0 8px 22px -12px rgba(40,30,20,.35);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e121c; --surface:#171c29; --surface-2:#1f2634; --ink:#ece7dc; --ink-2:#b3ab9e; --ink-3:#8c8578;
    --line:#2b3344; --line-strong:#414c62;
    --accent:#e2616a; --accent-ink:#2a0a0d; --accent-soft:#3a1d21;
    --night:#283b5e; --night-ink:#f3f0e6; --night-soft:#1f2c45;
    --moon:#f0bb52; --good:#6fc494; --good-soft:#193126; --bad:#ff7b84; --bad-soft:#3d1c20; --warn:#f0c060;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e121c; --surface:#171c29; --surface-2:#1f2634; --ink:#ece7dc; --ink-2:#b3ab9e; --ink-3:#8c8578;
  --line:#2b3344; --line-strong:#414c62;
  --accent:#e2616a; --accent-ink:#2a0a0d; --accent-soft:#3a1d21;
  --night:#283b5e; --night-ink:#f3f0e6; --night-soft:#1f2c45;
  --moon:#f0bb52; --good:#6fc494; --good-soft:#193126; --bad:#ff7b84; --bad-soft:#3d1c20; --warn:#f0c060;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100%;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom));
  background-image:radial-gradient(circle at 85% -10%, color-mix(in srgb, var(--moon) 22%, transparent), transparent 42%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:10px}
.mark{flex:none;width:44px;height:44px;border-radius:50%;background:var(--night);color:var(--moon);display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:.02em;box-shadow:inset -6px -4px 0 rgba(0,0,0,.25)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:17px;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}

/* Segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:800;cursor:pointer;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .meta{font-weight:600;letter-spacing:0;color:var(--ink-3);font-size:12px}
.hint{font-size:13px;color:var(--ink-3);margin:6px 2px 0}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--warn);border:1px dashed var(--line-strong);border-radius:999px;padding:2px 8px;font-weight:700;letter-spacing:0}

/* Stepper rows */
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{flex:1;min-width:0;font-weight:700}
.row .lbl small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden;flex:none}
.step button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:40px;text-align:center;font-weight:800;font-size:18px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 10px;font-size:16px;min-width:0}
.names .n{display:flex;align-items:center;gap:6px;min-width:0}
.names .n b{flex:none;width:22px;text-align:right;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 10px;font-size:16px;resize:vertical}
details summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--ink-2);list-style:none}
details summary::before{content:"▸";margin-right:6px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.switch{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.switch .lbl{flex:1;font-weight:700}
.switch .lbl small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.switch input{width:0;height:0;opacity:0;position:absolute}
.switch .tog{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line-strong);position:relative;transition:background .15s}
.switch .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .tog{background:var(--good)}
.switch input:checked + .tog::after{transform:translateX(20px)}
.switch input:focus-visible + .tog{outline:2px solid var(--focus);outline-offset:2px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick button{min-height:44px;min-width:64px;padding:0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.pick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.roles{display:grid;grid-template-columns:1fr;gap:0}
.err{color:var(--bad);font-size:13px;font-weight:700;margin-top:8px}

/* Buttons */
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;padding:0 16px;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.night{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;font-size:17px;width:100%;border-radius:14px;box-shadow:var(--shadow)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* Screens */
.screen[hidden]{display:none}
.phase{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:800}
.phase .meta{letter-spacing:0;font-weight:600;color:var(--ink-3)}

/* Pass / reveal */
.pass{background:var(--night);color:var(--night-ink);border-radius:20px;padding:26px 18px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pass::before{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--moon);opacity:.95;box-shadow:inset -22px -12px 0 rgba(0,0,0,.18)}
.pass::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 90%, rgba(255,255,255,.08), transparent 50%);pointer-events:none}
.pass .k{position:relative;font-size:12px;letter-spacing:.2em;opacity:.75}
.pass .who{position:relative;font-size:30px;font-weight:900;line-height:1.2;word-break:break-all}
.pass .who small{display:block;font-size:14px;font-weight:600;opacity:.8;margin-top:4px}
.pass .btn{position:relative;background:var(--moon);border-color:var(--moon);color:#2a1d05;margin-top:8px}
.pass .btn.alt{background:transparent;border-color:rgba(255,255,255,.4);color:var(--night-ink);box-shadow:none;min-height:48px;font-size:15px}
.reveal{background:var(--surface);border:2px solid var(--line-strong);border-radius:20px;padding:22px 18px 18px;text-align:center;box-shadow:var(--shadow);min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.reveal .k{font-size:12px;letter-spacing:.2em;color:var(--ink-3)}
.reveal .word{font-size:40px;font-weight:900;line-height:1.15;word-break:break-all;color:var(--night)}
.reveal .word.blank{color:var(--ink-3);font-size:30px}
.reveal .role{font-size:34px;font-weight:900;line-height:1.15}
.reveal .role.wolf{color:var(--bad)} .reveal .role.good{color:var(--good)}
.reveal .desc{font-size:14px;color:var(--ink-2);max-width:34em;margin:0 auto}
.reveal .mates{font-size:14px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:6px 10px;margin-top:4px}
.reveal .btn{margin-top:10px}

/* Round / speaking */
.speaker{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow);margin-bottom:12px}
.speaker .k{font-size:12px;letter-spacing:.2em;color:var(--ink-3)}
.speaker .who{font-size:30px;font-weight:900;line-height:1.2;word-break:break-all}
.speaker .timer{font-family:var(--mono);font-size:56px;font-weight:800;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:4px 0}
.speaker .timer.low{color:var(--bad)}
.speaker .timer.over{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.order span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.order span.now{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.order span.done{opacity:.5;text-decoration:line-through}
.order span i{font-style:normal;font-size:11px;opacity:.7;font-family:var(--mono)}

/* Player grid (vote / target) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pbtn{min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:800;cursor:pointer;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;color:var(--ink);word-break:break-all}
.pbtn small{font-size:11px;font-weight:600;color:var(--ink-3);font-family:var(--mono)}
.pbtn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pbtn.dead{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.pbtn.wide{grid-column:1/-1;min-height:48px;flex-direction:row;background:transparent;border-style:dashed;color:var(--ink-2)}
.pbtn:disabled{cursor:not-allowed}

/* Night script */
.script{background:var(--night);color:var(--night-ink);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.script::before{content:"";position:absolute;right:-30px;top:-52px;width:96px;height:96px;border-radius:50%;background:var(--moon);opacity:.9;box-shadow:inset -18px -10px 0 rgba(0,0,0,.18)}
.script.day{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.script.day::before{background:var(--moon);opacity:.9;box-shadow:0 0 0 10px color-mix(in srgb, var(--moon) 25%, transparent)}
.script .k{position:relative;font-size:12px;letter-spacing:.2em;opacity:.75;margin-bottom:6px}
.script .line{position:relative;font-size:22px;font-weight:900;line-height:1.35;padding-right:40px}
.script .sub{position:relative;font-size:14px;opacity:.85;margin-top:6px}
.script .speakbtn{position:absolute;right:12px;bottom:12px;min-width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;font-weight:800;cursor:pointer;font-size:13px;padding:0 10px}
.script.day .speakbtn{border-color:var(--line);background:var(--surface-2);color:var(--ink-2)}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--moon)}
.steps i.done{background:var(--night)}
.secret{border:1.5px dashed var(--line-strong);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700}
.secret.wolf{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)} .secret.good{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.notice{border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.notice.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.notice.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.potions{display:flex;gap:8px;margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--ink-3)}
.potions span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.potions span.used{text-decoration:line-through;opacity:.5}

/* Result */
.banner{border-radius:20px;padding:22px 16px;text-align:center;box-shadow:var(--shadow);margin-bottom:12px}
.banner.good{background:var(--good);color:#fff} .banner.bad{background:var(--accent);color:var(--accent-ink)} .banner.neutral{background:var(--night);color:var(--night-ink)}
.banner .k{font-size:12px;letter-spacing:.2em;opacity:.8}
.banner .w{font-size:32px;font-weight:900;line-height:1.2}
.banner .r{font-size:14px;opacity:.9;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700;width:36%;word-break:break-all}
td.dead{color:var(--ink-3);text-decoration:line-through}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line)}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .tag.good{background:var(--good-soft);color:var(--good);border-color:transparent} .tag.mid{background:var(--surface-2);color:var(--ink-2)}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:6px 0;border-top:1px dotted var(--line);display:flex;gap:8px}
.log li b{flex:none;font-family:var(--mono);font-weight:700;color:var(--ink-3);min-width:3.2em}
.log li.h{font-weight:800;color:var(--night);border-top:1px solid var(--line-strong)}
:root[data-theme="dark"] .log li.h{color:var(--moon)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .log li.h{color:var(--moon)} }

/* Sheet / modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet p{margin:0 0 8px;color:var(--ink-2)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90%;text-align:center}

@media (min-width:900px){ body{padding:20px 24px 40px} .wrap{max-width:720px} .names{grid-template-columns:1fr 1fr 1fr} }
@media (max-height:560px){ .pass,.reveal{min-height:220px;padding-top:16px} .speaker .timer{font-size:44px} .reveal .word{font-size:34px} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark" id="mark" aria-hidden="true">臥</div>
    <div class="ttl"><h1 id="h-title">誰是臥底／狼人殺主持</h1><div class="sub" id="h-sub">一台手機傳著看身分，主持人照著念</div></div>
    <button class="iconbtn" id="log-btn" type="button" hidden aria-label="遊戲紀錄">紀錄</button>
    <button class="iconbtn" id="quit-btn" type="button" hidden aria-label="結束遊戲">結束</button>
    <button class="iconbtn" id="theme-btn" type="button" aria-label="切換主題">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      <span id="theme-label">自動</span>
    </button>
  </header>

  <!-- ===== SETUP ===== -->
  <section class="screen" id="s-setup">
    <div class="seg" role="tablist" aria-label="遊戲">
      <button type="button" role="tab" id="mode-uc" aria-selected="true">誰是臥底</button>
      <button type="button" role="tab" id="mode-ww" aria-selected="false">狼人殺</button>
    </div>

    <div class="card">
      <h2>玩家 <span class="meta"><span id="sample-badge" class="sample">範例名單</span></span></h2>
      <div class="row"><div class="lbl">人數<small id="count-hint">3–20 人</small></div>
        <div class="step"><button type="button" id="cnt-minus" aria-label="減少人數">−</button><output id="cnt-out">8</output><button type="button" id="cnt-plus" aria-label="增加人數">+</button></div></div>
      <div class="names" id="names"></div>
      <p class="hint">名字可留白，會顯示「玩家 N」。順序就是座位順序（順時針）。</p>
    </div>

    <div id="setup-uc">
      <div class="card">
        <h2>臥底設定</h2>

  class UCGame {

  function wwPreset(n) {

      s.push({ id: 'wolf', role: 'wolf', line: '狼人請睜眼，請互相確認同伴，並選擇今晚要殺的對象。', sub: '狼人用手勢統一目標。', after: '狼人請閉眼。' });

      if (this.has('seer')) s.push({ id: 'seer', role: 'seer', line: '預言家請睜眼，請選擇你要查驗的人。', sub: '主持人用手勢告知：好人或狼人。', after: '預言家請閉眼。' });
      s.push({ id: 'dawn', line: '天亮了，請大家睜眼。', sub: '' });
      return s;
    }
    startNight() {
      this.night++; this.phase = 'night'; this.stepIdx = 0;
      this.act = { wolf: null, guard: null, save: false, poison: null, seer: null, seerResult: null };
      this.addLog('第' + this.night + '夜', '天黑請閉眼');
    }
    guardOk(i) { return i == null || (i !== this.lastGuard && this.players[i].alive); }
    setGuard(i) { if (!this.guardOk(i)) return false; this.act.guard = i; return true; }
    setWolf(i) { if (i != null && !this.players[i].alive) return false; this.act.wolf = i; return true; }
    witchSave(on) {
      if (on && (!this.witch.save || this.act.wolf == null)) return false;
      if (on && this.act.poison != null) return false; // one potion per night
      this.act.save = !!on; return true;
    }
    witchPoison(i) {
      if (i != null && (!this.witch.poison || !this.players[i].alive || this.act.save)) return false;
      this.act.poison = i; return true;
    }
    seerCheck(i) {
      if (i == null || !this.players[i].alive) return null;
      this.act.seer = i; this.act.seerResult = ROLES[this.players[i].role].side; return this.act.seerResult;
    }
    resolveNight() {
      const a = this.act, N = i => (i == null ? '沒有人' : this.players[i].name);
      if (this.has('guard')) this.addLog('第' + this.night + '夜', '守衛守護 ' + N(a.guard));
      this.addLog('第' + this.night + '夜', '狼人殺 ' + N(a.wolf));
      if (this.has('witch')) this.addLog('第' + this.night + '夜', '女巫' + (a.save ? '用解藥救 ' + N(a.wolf) : a.poison != null ? '用毒藥毒 ' + N(a.poison) : '沒用藥'));
      if (this.has('seer') && a.seer != null) this.addLog('第' + this.night + '夜', '預言家查驗 ' + N(a.seer) + '：' + (a.seerResult === 'wolf' ? '狼人' : '好人'));
      if (a.save) this.witch.save = false;
      if (a.poison != null) this.witch.poison = false;
      this.lastGuard = a.guard;
      const deaths = resolveNight(a);
      this.applyDeaths(deaths, '第' + this.night + '夜');
      this.phase = 'day';
      this.addLog('第' + this.night + '天', deaths.length ? '昨晚死亡：' + deaths.map(d => this.players[d.i].name).join('、') : '昨晚是平安夜');
      return deaths;
    }
    applyDeaths(deaths, tag) {
      deaths.forEach(d => {
        const p = this.players[d.i]; if (!p.alive) return;
        p.alive = false; p.cause = d.cause;
        if (p.role === 'hunter' && d.cause !== 'poison') this.pending.push({ type: 'shoot', i: p.i, role: 'hunter' });
        if (p.role === 'wolfking' && d.cause === 'vote') this.pending.push({ type: 'shoot', i: p.i, role: 'wolfking' });
      });
      this.checkWin();
    }
    shoot(target) { // target index or null (放棄)
      const pd = this.pending.shift(); if (!pd) return null;
      const who = this.players[pd.i];
      if (target == null || !this.players[target].alive) { this.addLog(this.phase === 'day' ? '第' + this.night + '天' : '第' + this.night + '夜', ROLES[who.role].name + ' ' + who.name + ' 沒有開槍'); return []; }
      this.addLog('第' + this.night + '天', ROLES[who.role].name + ' ' + who.name + ' 開槍帶走 ' + this.players[target].name);
      const d = [{ i: target, cause: 'shot' }]; this.applyDeaths(d, '第' + this.night + '天'); return d;
    }
    vote(i) { // i: index or null (平票／無人出局)
      if (this.result) return null;
      if (i == null) { this.addLog('第' + this.night + '天', '投票平手，無人出局'); return { none: true }; }
      const p = this.players[i]; if (!p.alive) return null;
      if (p.role === 'idiot' && !p.idiotShown) { p.idiotShown = true; this.addLog('第' + this.night + '天', '投票出局 ' + p.name + '，翻牌是白癡，免死但失去投票權'); return { idiot: true, player: p }; }
      this.addLog('第' + this.night + '天', '投票出局 ' + p.name + '（' + ROLES[p.role].name + '）');
      this.applyDeaths([{ i, cause: 'vote' }], '第' + this.night + '天');
      return { player: p };
    }
    counts() {
      const a = this.alive();
      return { wolf: a.filter(p => ROLES[p.role].side === 'wolf').length, villager: a.filter(p => p.role === 'villager').length, god: a.filter(p => ROLES[p.role].kind === 'god').length };
    }
    checkWin() {
      if (this.result) return this.result;
      const c = this.counts(), good = c.villager + c.god;
      let r = null;
      if (c.wolf === 0) r = { winner: 'good', reason: '狼人全部出局，好人獲勝' };
      else if (good === 0) r = { winner: 'wolf', reason: '好人全部出局，狼人獲勝' };
      else if (this.winMode === 'side' && this.hasVillagers && c.villager === 0) r = { winner: 'wolf', reason: '村民全部出局（屠邊），狼人獲勝' };
      else if (this.winMode === 'side' && this.hasGods && c.god === 0) r = { winner: 'wolf', reason: '神職全部出局（屠邊），狼人獲勝' };
      else if (c.wolf >= good) r = { winner: 'wolf', reason: '狼人人數不少於好人，狼人獲勝' };
      if (r) { this.result = r; this.pending = []; this.addLog('結束', r.reason); }
      return r;
    }
  }
  return { randInt, shuffle, BANK, CATS, parseCustom, pool, bankSize, ucValidate, ucDeal, UCGame, ROLES, ROLE_ORDER, wwPreset, wwValidate, wwDeal, resolveNight, WWGame };
})();
/*CORE-END*/

<script>

/* ---------- settings ---------- */
const SAMPLE = ['小明', '阿華', '佳佳', '小美', '阿強', '阿婷', '小傑', '阿凱', '小芸', '阿豪', '欣欣', '阿德'];
const DEF = { mode: 'uc', count: 8, names: [], sample: true, under: 1, blank: 0, lastN: 3, timer: 60, cats: ['食物', '日常', '動物', '地點', '職業', '娛樂', '自訂'], custom: '', roles: WH.wwPreset(8), rolesFor: 8, winMode: 'side', timerWw: 120, voice: false };
let S = Object.assign({}, DEF, store.get('settings', {}) || {});

/* ---------- voice ---------- */
let voiceObj = null;
function pickVoice() {
  try {

  } catch (e) {}

/* ---------- toast / sheet ---------- */

/* ---------- screens ---------- */

  $('mark').textContent = S.mode === 'uc' ? '臥' : '狼';

  $('h-sub').hidden = inGame;
  window.scrollTo(0, 0);
}

/* ---------- setup ---------- */
function stepper(minusId, plusId, outId, get, set, min, max, d) {
  d = d || 1;
  const render = () => { $(outId).textContent = get(); $(minusId).disabled = get() <= min(); $(plusId).disabled = get() >= max(); };
  $(minusId).addEventListener('click', () => { if (get() > min()) { set(Math.max(min(), get() - d)); save(); renderSetup(); } });

  return render;
}
const R = [];

R.push(stepper('t-minus', 't-plus', 't-out', () => S.timer, v => S.timer = v, () => 0, () => 300, 15));
R.push(stepper('tw-minus', 'tw-plus', 'tw-out', () => S.timerWw, v => S.timerWw = v, () => 0, () => 600, 30));
document.querySelectorAll('[data-last]').forEach(b => b.addEventListener('click', () => { S.lastN = +b.dataset.last; save(); renderSetup(); }));
document.querySelectorAll('[data-win]').forEach(b => b.addEventListener('click', () => { S.winMode = b.dataset.win; save(); renderSetup(); }));
$('voice').addEventListener('change', () => { S.voice = $('voice').checked; save(); if (S.voice) speak('語音朗讀已開啟', true); });
$('mode-uc').addEventListener('click', () => { S.mode = 'uc'; save(); renderSetup(); });
$('mode-ww').addEventListener('click', () => { S.mode = 'ww'; if (S.count < 5) S.count = 5; if (S.rolesFor !== S.count) { S.roles = WH.wwPreset(S.count); S.rolesFor = S.count; } save(); renderSetup(); });
$('preset-btn').addEventListener('click', () => { S.roles = WH.wwPreset(S.count); S.rolesFor = S.count; save(); renderSetup(); toast('已套用 ' + S.count + ' 人推薦配置'); });
$('custom').addEventListener('input', () => { S.custom = $('custom').value; save(); renderBankMeta(); });

function renderCats() {

  $('setup-uc').hidden = S.mode !== 'uc'; $('setup-ww').hidden = S.mode !== 'ww';
  $('count-hint').textContent = S.mode === 'uc' ? '3–20 人' : '5–20 人（6–12 人最順）';
  $('h-sub').textContent = S.mode === 'uc' ? '一台手機傳著看詞，主持人計時與記票' : '一台手機傳著看身分，主持人照著念夜晚台詞';

let G = null, deal = null, tick = null;
$('start-btn').addEventListener('click', () => {

$('quit-btn').addEventListener('click', () => confirmSheet('結束這一局？', '會回到設定畫面，這局的紀錄會留著可以查看。', '結束遊戲', () => { stopTimer(); if (G) store.set('lastlog', G.log); G = null; show('s-setup'); renderSetup(); }, true));
$('log-btn').addEventListener('click', () => showLog());
function logHtml(log) {

}

    return '<div class="k">你的詞</div><div class="word">' + esc(p.word) + '</div><div class="desc">記住它，不要念出來。輪到你時用一句話描述，但別講得太明。</div>';
  }

  return '<div class="k">你的身分</div><div class="role ' + (wolf ? 'wolf' : 'good') + '">' + r.name + '</div><div class="desc">' + esc(r.desc) + '</div>' + mates;

function renderDeal() {
  const n = G.players.length, box = $('deal-box');
  $('deal-meta').textContent = Math.min(deal.i + 1, n) + ' ／ ' + n;
  if (deal.i >= n) {
    box.innerHTML = '<div class="pass"><div class="k">大家都看過了</div><div class="who">把手機交給主持人<small>接下來由主持人操作，玩家不要看螢幕</small></div><button class="btn big" id="deal-done" type="button">' + (S.mode === 'uc' ? '開始第一輪發言' : '開始第一夜') + '</button></div>';
    $('deal-done').onclick = () => { if (S.mode === 'uc') { show('s-uc'); renderUC(); } else { show('s-ww'); renderWW(); } };
    return;
  }
  const p = G.players[deal.i];
  if (!deal.shown) {
    box.innerHTML = '<div class="pass"><div class="k">' + (deal.i === 0 ? '第一位' : '請把手機交給下一位') + '</div><div class="who">' + esc(p.name) + '<small>確認旁邊沒有人在看，再按下面的按鈕</small></div><button class="btn big" id="deal-show" type="button">我是 ' + esc(p.name) + '，看我的' + (S.mode === 'uc' ? '詞' : '身分') + '</button></div>';
    $('deal-show').onclick = () => { deal.shown = true; vib(10); renderDeal(); };
  } else {
    box.innerHTML = '<div class="reveal">' + roleCard(p) + '<button class="btn big night" id="deal-hide" type="button">記住了，蓋起來</button></div><p class="hint" style="text-align:center">按下後畫面會換成「交給下一位」，別人看不到你的' + (S.mode === 'uc' ? '詞' : '身分') + '。</p>';
    $('deal-hide').onclick = () => { deal.shown = false; deal.i++; vib(10); renderDeal(); };
  }
}

/* ---------- timer ---------- */
const T = { left: 0, total: 0, running: false };
function stopTimer() { clearInterval(tick); tick = null; T.running = false; }
function fmt(s) { const a = Math.abs(s); return (s < 0 ? '−' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); }
function timerHtml(id) { return '<div class="timer ' + (T.left < 0 ? 'over' : T.left <= 10 ? 'low' : '') + '" id="' + id + '">' + fmt(T.left) + '</div>'; }
function setTimer(total) { stopTimer(); T.total = total; T.left = total; }
function toggleTimer(onTick) {
  if (T.running) { stopTimer(); onTick(); return; }
  T.running = true;
  tick = setInterval(() => { T.left--; if (T.left === 0) vib([80, 60, 80]); onTick(); }, 1000);
  onTick();
}
function timerButtons() {
  return '<div class="actions"><button class="btn" id="t-toggle" type="button">' + (T.running ? '暫停' : T.left === T.total ? '開始計時' : '繼續') + '</button><button class="btn ghost" id="t-reset" type="button">重設</button></div>';
}
function wireTimer(onTick, total) {
  const b = $('t-toggle'); if (!b) return;
  b.onclick = () => toggleTimer(onTick);
  $('t-reset').onclick = () => { setTimer(total); onTick(); };
}

/* ---------- 誰是臥底 play ---------- */
function ucRoleTag(p) { return p.role === 'under' ? '<span class="tag bad">臥底</span>' : p.role === 'blank' ? '<span class="tag mid">白板</span>' : '<span class="tag good">平民</span>'; }
function renderUC() {
  const box = $('uc-box'), c = G.counts(), alive = G.alive();
  $('uc-meta').textContent = '剩 ' + alive.length + ' 人・臥底方 ' + (c.under + c.blank) + ' 人';
  if (G.phase === 'speak') {
    $('uc-phase').textContent = '第 ' + G.round + ' 輪・發言';
    const cur = G.players[G.order[G.speaker]];
    if (!G._timerFor || G._timerFor !== G.round + ':' + G.speaker) { setTimer(G.timer); G._timerFor = G.round + ':' + G.speaker; }
    const upd = () => { const t = $('uc-timer'); if (t) { t.textContent = fmt(T.left); t.className = 'timer ' + (T.left < 0 ? 'over' : T.left <= 10 ? 'low' : ''); } const b = $('t-toggle'); if (b) b.textContent = T.running ? '暫停' : T.left === T.total ? '開始計時' : '繼續'; };
    box.innerHTML = '<div class="speaker"><div class="k">現在發言</div><div class="who">' + esc(cur.name) + '</div>' + (G.timer ? timerHtml('uc-timer') : '<div class="hint">不計時</div>') + '<div class="order">' + G.order.map((i, k) => '<span class="' + (k === G.speaker ? 'now' : k < G.speaker ? 'done' : '') + '"><i>' + (k + 1) + '</i>' + esc(G.players[i].name) + '</span>').join('') + '</div>' + (G.timer ? timerButtons() : '') + '</div>' +
      '<button class="btn big night" id="uc-next" type="button">' + (G.speaker < G.order.length - 1 ? '下一位：' + esc(G.players[G.order[G.speaker + 1]].name) : '發言結束，開始投票') + '</button>' +
      (G.round > 1 ? '' : '<p class="hint" style="text-align:center">從隨機的人開始，順時針輪流各用一句話描述自己的詞。</p>');
    wireTimer(upd, G.timer);
    $('uc-next').onclick = () => { stopTimer(); G.nextSpeaker(); vib(10); renderUC(); };
    return;
  }
  if (G.phase === 'vote') {
    stopTimer();
    $('uc-phase').textContent = '第 ' + G.round + ' 輪・投票';
    box.innerHTML = '<div class="card"><h2>大家指認後，點被淘汰的人</h2><div class="grid">' + G.players.map(p => '<button class="pbtn' + (p.alive ? '' : ' dead') + '" type="button" data-i="' + p.i + '"' + (p.alive ? '' : ' disabled') + '><span>' + esc(p.name) + '</span><small>' + (p.alive ? '#' + (p.i + 1) : '已出局') + '</small></button>').join('') + '</div></div>' +
      '<div class="actions"><button class="btn ghost" id="uc-revote" type="button">平票，再發言一輪</button></div>';
    box.querySelectorAll('.pbtn[data-i]').forEach(b => b.onclick = () => {
      const p = G.players[+b.dataset.i];
      confirmSheet('淘汰 ' + p.name + '？', '確認後會公布他的身分。', '淘汰並公布', () => { const r = G.eliminate(p.i); vib(30); showUCReveal(r); }, true);
    });
    $('uc-revote').onclick = () => { G.addLog('第' + G.round + '輪', '投票平手，重新發言'); G.newRound(); renderUC(); };
    return;
  }
  if (G.phase === 'guess') {
    $('uc-phase').textContent = '第 ' + G.round + ' 輪・白板猜詞';
    const p = G.players[G.pending.i];
    box.innerHTML = '<div class="card"><h2>' + esc(p.name) + ' 是白板，可以猜平民的詞</h2><p>請他說出猜的詞，主持人判定（平民詞只有主持人看得到）：</p><div class="secret good">平民的詞：' + esc(G.civWord) + '</div><div class="actions"><button class="btn ghost" id="g-no" type="button">猜錯</button><button class="btn primary" id="g-yes" type="button">猜對，白板獲勝</button></div></div>';
    $('g-no').onclick = () => { const r = G.blankGuess(false); afterUC(r); };
    $('g-yes').onclick = () => { const r = G.blankGuess(true); afterUC(r); };
  }
}
function showUCReveal(r) {
  const p = r.player, R = { civ: '平民', under: '臥底', blank: '白板' };
  sheet('<h2>' + esc(p.name) + ' 出局</h2><div class="notice ' + (p.role === 'civ' ? 'good' : 'bad') + '" style="font-size:20px;text-align:center">' + (p.role === 'under' ? '是臥底！' : p.role === 'blank' ? '是白板！' : '是平民…') + (p.word ? '<br><small>他的詞：' + esc(p.word) + '</small>' : '') + '</div><div class="actions"><button class="btn night" data-x="ok" type="button">' + (r.guess ? '讓白板猜詞' : r.result && r.result.over ? '看結果' : '繼續下一輪') + '</button></div>',
    (root, close) => { root.querySelector('[data-x="ok"]').onclick = () => { close(); if (r.guess) renderUC(); else afterUC(r.result); }; });
}
function afterUC(r) { if (G.result) showResult(); else renderUC(); }

/* ---------- 狼人殺 play ---------- */
function pgrid(list, opts) {
  opts = opts || {};
  return '<div class="grid">' + list.map(p => {
    const dis = !p.alive || (opts.disable && opts.disable(p));
    return '<button class="pbtn' + (!p.alive ? ' dead' : '') + (opts.sel === p.i ? ' sel' : '') + '" type="button" data-i="' + p.i + '"' + (dis ? ' disabled' : '') + '><span>' + esc(p.name) + '</span><small>' + (!p.alive ? '已出局' : opts.sub ? opts.sub(p) : '#' + (p.i + 1)) + '</small></button>';
  }).join('') + (opts.none ? '<button class="pbtn wide' + (opts.sel === null ? ' sel' : '') + '" type="button" data-i="none">' + esc(opts.none) + '</button>' : '') + '</div>';
}
function scriptHtml(line, sub, day) {
  return '<div class="script' + (day ? ' day' : '') + '"><div class="k">' + (day ? '白天' : '第 ' + G.night + ' 夜') + '</div><div class="line">' + esc(line) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '<button class="speakbtn" type="button" id="say" aria-label="朗讀台詞">朗讀</button></div>';
}
function wireSay(text) { const b = $('say'); if (b) b.onclick = () => speak(text, true); if (S.voice) speak(text); }
function renderWW() {
  const box = $('ww-box'), c = G.counts();
  $('ww-meta').textContent = '狼 ' + c.wolf + '・民 ' + c.villager + '・神 ' + c.god;
  if (G.result) { showResult(); return; }
  if (G.pending.length) { renderShoot(); return; }
  if (G.phase === 'night') renderNight(); else renderDay();
}
function renderNight() {
  const box = $('ww-box'), steps = G.steps(), st = steps[G.stepIdx], a = G.act;
  $('ww-phase').textContent = '第 ' + G.night + ' 夜・' + (st.role ? WH.ROLES[st.role].name : st.id === 'close' ? '閉眼' : '天亮');
  const bar = '<div class="steps">' + steps.map((s, k) => '<i class="' + (k < G.stepIdx ? 'done' : k === G.stepIdx ? 'on' : '') + '"></i>').join('') + '</div>';
  const deadNote = st.role && !G.roleAlive(st.role) ? '<div class="notice">' + WH.ROLES[st.role].name + '已經出局，照念台詞但不用等，停幾秒再閉眼。</div>' : '';
  let body = '', nextLabel = '下一步', canNext = true, say = st.line;
  const N = i => (i == null ? '沒有人' : G.players[i].name);
  if (st.id === 'close') {
    body = (G.night === 1 ? '<p class="hint">第一晚可以先讓大家熟悉：念台詞，等所有人閉眼再開始。</p>' : '');
  } else if (st.id === 'guard') {
    if (G.roleAlive('guard')) body = '<div class="card"><h2>守衛守護誰？<span class="meta">昨晚：' + esc(N(G.lastGuard)) + '</span></h2>' + pgrid(G.players, { sel: a.guard, none: '不守任何人', disable: p => p.i === G.lastGuard, sub: p => p.i === G.lastGuard ? '昨晚守過' : '#' + (p.i + 1) }) + '</div>';
  } else if (st.id === 'wolf') {
    body = '<div class="card"><h2>狼人要殺誰？</h2>' + pgrid(G.players, { sel: a.wolf, none: '空刀，不殺人', sub: p => WH.ROLES[p.role].side === 'wolf' ? '狼' : '#' + (p.i + 1) }) + '</div>';
    canNext = a.wolf !== undefined && (a.wolf !== null || a._wolfNone);
    if (!canNext) nextLabel = '請先選目標';
  } else if (st.id === 'witch') {
    say = a.wolf == null ? '女巫請睜眼。今晚是平安夜，沒有人死。你要用毒藥嗎？' : '女巫請睜眼。今晚他死了，你要救嗎？你要用毒藥嗎？';
    if (G.roleAlive('witch')) {
      const w = G.witch;
      body = '<div class="card"><h2>女巫<span class="meta"></span></h2><div class="potions"><span class="' + (w.save ? '' : 'used') + '">解藥</span><span class="' + (w.poison ? '' : 'used') + '">毒藥</span></div>' +
        '<div class="secret bad">今晚被殺：' + esc(N(a.wolf)) + '</div>' +
        (a.wolf != null && w.save ? '<div class="pick" style="margin-top:10px"><button type="button" id="w-nosave" aria-pressed="' + !a.save + '">不救</button><button type="button" id="w-save" aria-pressed="' + a.save + '">用解藥救</button></div>' : (a.wolf != null ? '<p class="hint">解藥已經用過，不能救。</p>' : '')) +
        (w.poison && !a.save ? '<p class="hint" style="margin-top:10px">要毒誰？（一晚只能用一瓶）</p>' + pgrid(G.players, { sel: a.poison, none: '不用毒藥' }) : (w.poison ? '<p class="hint">用了解藥，今晚不能再用毒藥。</p>' : '<p class="hint">毒藥已經用過。</p>')) + '</div>';
    }
  } else if (st.id === 'seer') {
    if (G.roleAlive('seer')) body = '<div class="card"><h2>預言家要查誰？</h2>' + pgrid(G.players, { sel: a.seer }) + (a.seer != null ? '<div class="secret ' + (a.seerResult === 'wolf' ? 'wolf' : 'good') + '">' + esc(N(a.seer)) + ' 是' + (a.seerResult === 'wolf' ? '狼人' : '好人') + '（只給主持人看，用手勢告訴預言家）</div>' : '') + '</div>';
  } else if (st.id === 'dawn') {
    const d = WH.resolveNight(a);
    body = '<div class="card"><h2>天亮後公布</h2>' + (d.length ? '<div class="notice bad">昨晚死亡：' + d.map(x => esc(N(x.i)) + (x.note ? '（' + x.note + '）' : '')).join('、') + '</div>' : '<div class="notice good">昨晚是平安夜</div>') + '<p class="hint">按「天亮」後正式結算；有獵人的話會接著問要不要開槍。</p></div>';
    nextLabel = '天亮，結算';
    say = st.line + (d.length ? '昨晚死亡的是 ' + d.map(x => N(x.i)).join('、') + '。' : '昨晚是平安夜。');
  }
  box.innerHTML = bar + scriptHtml(say, st.sub, false) + deadNote + body +
    '<div class="actions">' + (G.stepIdx > 0 ? '<button class="btn ghost" id="n-prev" type="button">上一步</button>' : '') + '<button class="btn big night" id="n-next" type="button"' + (canNext ? '' : ' disabled') + '>' + nextLabel + '</button></div>';
  wireSay(say);
  box.querySelectorAll('.pbtn').forEach(b => b.onclick = () => {
    const v = b.dataset.i === 'none' ? null : +b.dataset.i;
    if (st.id === 'guard') { if (!G.setGuard(v)) toast('不能連續兩晚守同一個人'); }
    else if (st.id === 'wolf') { G.setWolf(v); a._wolfNone = v === null; if (a.save && v == null) a.save = false; }
    else if (st.id === 'witch') { if (!G.witchPoison(v)) toast('今晚已經用了解藥'); }
    else if (st.id === 'seer') { G.seerCheck(v); }
    vib(8); renderNight();
  });
  if ($('w-save')) { $('w-save').onclick = () => { if (!G.witchSave(true)) toast('已經選了毒藥，一晚只能用一瓶'); renderNight(); }; $('w-nosave').onclick = () => { G.witchSave(false); renderNight(); }; }
  if ($('n-prev')) $('n-prev').onclick = () => { G.stepIdx--; renderNight(); };
  $('n-next').onclick = () => {
    if (st.id === 'dawn') { stopTimer(); G._dawn = G.resolveNight(); G._dayTimer = false; G._daySay = null; vib([30, 40, 30]); renderWW(); return; }
    if (st.after && S.voice) setTimeout(() => speak(st.after), 300);
    G.stepIdx++; renderNight();
  };
}
function renderShoot() {
  const box = $('ww-box'), pd = G.pending[0], who = G.players[pd.i], rn = WH.ROLES[pd.role].name;
  $('ww-phase').textContent = '第 ' + G.night + ' 天・' + rn + '開槍';
  const say = rn + ' ' + who.name + ' 出局，請問要開槍帶走誰？';
  box.innerHTML = scriptHtml(say, '可以選擇不開槍。', true) + '<div class="card"><h2>' + rn + ' ' + esc(who.name) + ' 要帶走誰？</h2>' + pgrid(G.players, { sel: G._shot, none: '不開槍' }) + '</div><div class="actions"><button class="btn big primary" id="shoot-ok" type="button"' + (G._shot === undefined ? ' disabled' : '') + '>確認</button></div>';
  wireSay(say);
  box.querySelectorAll('.pbtn').forEach(b => b.onclick = () => { G._shot = b.dataset.i === 'none' ? null : +b.dataset.i; renderShoot(); });
  $('shoot-ok').onclick = () => { const t = G._shot; G._shot = undefined; G.shoot(t); vib(30); renderWW(); };
}
function renderDay() {
  const box = $('ww-box'), last = G.log.filter(l => l.tag === '第' + G.night + '天');
  $('ww-phase').textContent = '第 ' + G.night + ' 天・' + (G.phase === 'vote' ? '投票' : '討論');
  if (G.phase === 'day') {
    if (!G._dayTimer) { setTimer(G.timer); G._dayTimer = true; }
    if (!G._daySay) { const d = G._dawn || []; G._daySay = (d.length ? '昨晚死亡的是 ' + d.map(x => G.players[x.i].name).join('、') + '。' : '昨晚是平安夜。') + '請大家發言討論。'; }
    const upd = () => { const t = $('ww-timer'); if (t) { t.textContent = fmt(T.left); t.className = 'timer ' + (T.left < 0 ? 'over' : T.left <= 10 ? 'low' : ''); } const b = $('t-toggle'); if (b) b.textContent = T.running ? '暫停' : T.left === T.total ? '開始計時' : '繼續'; };
    box.innerHTML = scriptHtml(G._daySay, '死亡的玩家可以留遺言（被毒死的除外）。', true) +
      '<div class="speaker"><div class="k">白天討論</div>' + (G.timer ? timerHtml('ww-timer') + timerButtons() : '<div class="hint">不計時</div>') + '</div>' +
      '<button class="btn big primary" id="to-vote" type="button">討論結束，開始投票</button>';
    wireSay(G._daySay); wireTimer(upd, G.timer);
    $('to-vote').onclick = () => { stopTimer(); G.phase = 'vote'; renderDay(); };
    return;
  }
  const say = '請大家投票，指向你認為是狼人的人。';
  box.innerHTML = scriptHtml(say, '主持人數票，點出局的人；平票可選「無人出局」。', true) + '<div class="card"><h2>誰被投出局？</h2>' + pgrid(G.players, { none: '平票／無人出局', sub: p => p.role === 'idiot' && p.idiotShown ? '白癡・不能投' : '#' + (p.i + 1) }) + '</div>';
  wireSay(say);
  box.querySelectorAll('.pbtn').forEach(b => b.onclick = () => {
    const v = b.dataset.i === 'none' ? null : +b.dataset.i;
    const go = () => {
      const r = G.vote(v); vib(30); G._daySay = null; G._dayTimer = false;
      if (r && r.idiot) toast(r.player.name + ' 是白癡，翻牌免死');
      afterDay();
    };
    if (v == null) confirmSheet('無人出局？', '這一天沒有人被投出去，直接進入夜晚。', '進入夜晚', go); else confirmSheet('投出 ' + G.players[v].name + '？', '出局者可以留遺言。', '確認出局', go, true);
  });
}
function afterDay() {
  if (G.result) { showResult(); return; }
  if (G.pending.length) { renderShoot(); return; }
  G.startNight(); renderWW();
}

/* ---------- result ---------- */
function showResult() {
  stopTimer(); show('s-result'); store.set('lastlog', G.log);
  const box = $('res-box'), r = G.result;
  let cls, title;
  if (S.mode === 'uc') { cls = r.winner === 'civ' ? 'good' : r.winner === 'blank' ? 'neutral' : 'bad'; title = r.winner === 'civ' ? '平民獲勝' : r.winner === 'blank' ? '白板獲勝' : '臥底獲勝'; }
  else { cls = r.winner === 'good' ? 'good' : 'bad'; title = r.winner === 'good' ? '好人獲勝' : '狼人獲勝'; }
  $('res-meta').textContent = S.mode === 'uc' ? '第 ' + G.round + ' 輪' : '第 ' + G.night + ' 夜';
  const rows = G.players.map(p => '<tr><td class="' + (p.alive ? '' : 'dead') + '">' + esc(p.name) + '</td><td>' + (S.mode === 'uc' ? ucRoleTag(p) + (p.word ? ' ' + esc(p.word) : '') : '<span class="tag ' + (WH.ROLES[p.role].side === 'wolf' ? 'bad' : WH.ROLES[p.role].kind === 'god' ? 'mid' : 'good') + '">' + WH.ROLES[p.role].name + '</span>') + (p.alive ? '' : ' <small style="color:var(--ink-3)">出局</small>') + '</td></tr>').join('');
  box.innerHTML = '<div class="banner ' + cls + '"><div class="k">結果</div><div class="w">' + title + '</div><div class="r">' + esc(r.reason) + '</div>' + (S.mode === 'uc' ? '<div class="r">平民詞「' + esc(G.civWord) + '」・臥底詞「' + esc(G.undWord) + '」</div>' : '') + '</div>' +
    '<div class="card"><h2>身分公開</h2><table>' + rows + '</table></div>' +
    '<div class="card"><h2>遊戲紀錄</h2>' + logHtml(G.log) + '</div>' +
    '<div class="stack"><button class="btn big primary" id="again" type="button">再來一局（同樣設定）</button><button class="btn big ghost" id="back" type="button">回到設定</button></div>';
  if (S.voice) speak(title + '。' + r.reason);
  vib([40, 60, 40]);
  $('again').onclick = () => { $('start-btn').click(); };
  $('back').onclick = () => { G = null; show('s-setup'); renderSetup(); };
}

/* ---------- init ---------- */
renderSetup(); show('s-setup');
window.__wh = { get G() { return G; }, S, WH, renderSetup, show, setTimer, T };
})();
</script>
