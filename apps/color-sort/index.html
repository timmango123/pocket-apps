<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>鍊金藥劑室</title>
<style>
:root{
  --bg:#2a1c14; --ink:#f7e8d0; --ink2:#cdb08c; --card:#3a2619f2; --card2:#4b3222; --chip:#2f1f15e6; --line:#6e4c33;
  --btn1:#f2a65a; --btn2:#d9792f; --btnsh:#8f4a17; --btnink:#2a1408; --sec:#4e3424; --secsh:#2b1b10; --gold:#ffcf5a; --dim:#6b5242;
  --ov:#140c08b0; --good:#7fd38a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"]{
  --bg:#f3f1ec; --ink:#3a2c22; --ink2:#6b5848; --card:#fffdf9f4; --card2:#f1ebe2; --chip:#fffdf9e8; --line:#ddd2c4;
  --btn1:#f4a261; --btn2:#e07b35; --btnsh:#b8601f; --btnink:#3a1a06; --sec:#efe8de; --secsh:#d6cabb; --gold:#f2b51d; --dim:#cbbfb0;
  --ov:#e9e4dcb8; --good:#2f9e55;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --ink:#3a2c22; --ink2:#6b5848; --card:#fffdf9f4; --card2:#f1ebe2; --chip:#fffdf9e8; --line:#ddd2c4;
    --btn1:#f4a261; --btn2:#e07b35; --btnsh:#b8601f; --btnink:#3a1a06; --sec:#efe8de; --secsh:#d6cabb; --gold:#f2b51d; --dim:#cbbfb0;
    --ov:#e9e4dcb8; --good:#2f9e55;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px)}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--chip);display:grid;place-items:center;box-shadow:0 3px 10px #0003,inset 0 1px 0 #ffffff14}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active,.tool:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--chip);box-shadow:0 3px 10px #0003;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px}
.lvname{font-weight:800;font-size:16px;white-space:nowrap;line-height:1.15}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.fl{display:inline-flex;gap:1px}
.fl svg{width:10px;height:12px}
.stat{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap;line-height:1.2}
.stat b{color:var(--ink);font-size:16px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:10px;pointer-events:none;
  padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px)}
.bottom>*{pointer-events:auto}
.tool{position:relative;height:50px;flex:1 1 0;max-width:150px;min-width:0;white-space:nowrap;padding:0 10px;border-radius:25px;background:var(--chip);box-shadow:0 4px 14px #0003,inset 0 1px 0 #ffffff14;
  display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.tool svg{flex:none;width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.tool .bd{min-width:20px;height:20px;border-radius:10px;background:var(--btn1);color:var(--btnink);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tool[disabled]{opacity:.4}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #0006;padding:22px 20px;width:min(370px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:16px;margin-top:11px;font-weight:800;font-size:17px;color:var(--btnink);
  background:linear-gradient(180deg,var(--btn1),var(--btn2));box-shadow:0 5px 0 var(--btnsh),0 8px 18px #0004}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0}
.stars{font-size:46px;letter-spacing:8px;margin:2px 0 4px;color:var(--dim);line-height:1.1}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #b9831288,0 0 18px #ffcf5a66;display:inline-block;animation:starpop .55s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-50deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:2px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
.note{font-size:13px !important;opacity:.9}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{margin-top:7vh;text-align:center}
.ttl h1{font-size:46px;margin:0;letter-spacing:6px;color:var(--ink);text-shadow:0 3px 0 #0004,0 0 30px #f4a26166}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:8px;font-size:15px;letter-spacing:1px}
.tbtns{width:100%;max-width:330px;display:flex;flex-direction:column;padding-bottom:6px}
/* select */
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.selhead{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px)}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px;text-align:left}
.sw .trk{flex:none;width:46px;height:28px;border-radius:14px;background:var(--dim);position:relative;transition:background .2s}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--btn2)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;
  padding:4px calc(var(--sar) + 12px) calc(var(--sab) + 20px) calc(var(--sal) + 12px)}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{height:82px;border-radius:14px;background:var(--card2);box-shadow:0 3px 0 var(--secsh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;position:relative}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--dim);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .fl svg{width:8px;height:10px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--btn1);outline-offset:-1px}
.lt.lock{opacity:.5}
.lt.lock svg.lk{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.sect{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--ink2);padding:8px 2px 0;letter-spacing:1px}
/* menu */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.setrow:last-child{border-bottom:0}
.seg{display:flex;background:var(--sec);border-radius:12px;padding:3px}
.seg button{min-width:44px;height:38px;border-radius:9px;font-size:13px;font-weight:700;padding:0 8px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--btn1);color:var(--btnink)}
.statsg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}
.statsg div{background:var(--sec);border-radius:12px;padding:8px 6px;font-size:12px;color:var(--ink2)}
.statsg b{display:block;font-size:19px;color:var(--ink)}
.scroll{max-height:min(60vh,520px);overflow-y:auto;touch-action:pan-y;margin:0 -6px;padding:0 6px}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--sec);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:76px;height:96px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.55}
.mech b{color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:30;background:#1d120cee;color:#fbe9cf;padding:10px 16px;border-radius:14px;
  font-size:14px;font-weight:600;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .35s;border:1px solid #6e4c33}
@media (max-height:600px){
  .ov{align-items:flex-start}
  .ttl{margin-top:2vh}.ttl h1{font-size:34px}
  .card{padding:16px 16px}
  .btn{height:46px;margin-top:9px}
  #title{flex-direction:row;align-items:flex-start;justify-content:space-between}
  #title .ttl{width:48%;margin-top:3vh}
  #title .tbtns{width:46%;align-self:center}
  .tool{height:46px}
}
@media (hover:hover){ .btn:hover{filter:brightness(1.06)} .lt:hover{filter:brightness(1.08)} .ibtn:hover,.tool:hover{filter:brightness(1.12)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe" aria-hidden="true" style="position:fixed;visibility:hidden;pointer-events:none;padding:0 var(--sar) 0 var(--sal)"></div>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="fl" id="hFl"></span></div>
    </div>
    <div class="stat">步數 <b id="hMoves">0</b><br>目標 <span id="hPar">0</span></div>
  </div>
  <button class="ibtn" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="tool" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋<span class="bd" id="nUndo">5</span></button>
  <button class="tool" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示<span class="bd" id="nHint">2</span></button>
  <button class="tool" id="bTube" aria-label="加一支小試管"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v13a2 2 0 004 0V3"/><path d="M19 8v6M16 11h6"/></svg>試管<span class="bd" id="nTube">1</span></button>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>鍊金藥劑室</h1>
    <div class="sub">倒出秩序・封存每一瓶藥水</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始調配</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tMenu">設定與統計</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="menu"><div class="card">
  <h2 id="mTitle">選單</h2>
  <div class="scroll">
    <div class="setrow"><span>音效</span><button class="sw" id="swSound" role="switch" aria-checked="true" aria-label="音效"><span class="trk"></span></button></div>
    <div class="setrow"><span>色盲圖案模式</span><button class="sw" id="swPattern" role="switch" aria-checked="false" aria-label="色盲圖案模式"><span class="trk"></span></button></div>
    <div class="setrow"><span>無限悔棋<br><small style="color:var(--ink2);font-size:12px">開啟後最多 ★★</small></span><button class="sw" id="swInf" role="switch" aria-checked="false" aria-label="無限悔棋"><span class="trk"></span></button></div>
    <div class="setrow"><span>震動</span><button class="sw" id="swVib" role="switch" aria-checked="true" aria-label="震動"><span class="trk"></span></button></div>
    <div class="setrow"><span>主題</span><div class="seg" id="segTheme"><button data-v="auto">自動</button><button data-v="dark">木架</button><button data-v="light">白色</button></div></div>
    <div class="statsg" id="statsG"></div>
  </div>
  <button class="btn" id="mResume">繼續</button>
  <div class="row2" id="mGameBtns"><button class="btn sec" id="mSelect">選擇關卡</button><button class="btn sec" id="mHelp">玩法說明</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">調配完成！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>目標<b id="wPar">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p class="note" id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wShare">分享成績</button></div>
  <button class="btn sec" id="wSelect">選擇關卡</button>
</div></div>

<div class="ov hidden" id="stuck"><div class="card">
  <h2 id="kTitle">無路可走</h2>
  <p id="kMsg">已經沒有任何合法的倒法了。<br>悔棋幾步換條路，或整關重來。</p>
  <div class="row2"><button class="btn" id="kUndo">悔棋一步</button><button class="btn sec" id="kRestart">重來</button></div>
  <button class="btn sec" id="kTube">加一支小試管（最多 ★）</button>
  <button class="btn sec" id="kLook">先看看局面</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機制</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始調配</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
// ---- Color-sort core: pure logic shared by the game and the Node verifier ----
// A level D = {k, n, caps:[..], tubes:["abc",..] (bottom->top, a=color0), hid:[bitmask], fz:[thaw], par}
// Game state S = {t:[[c..]], cap:[..], fz:[..], h:[[bool..]], tot:[..]}
function csInit(D) {
  var t = D.tubes.map(function (s) { return s.split('').map(function (ch) { return ch.charCodeAt(0) - 97; }); });
  var h = t.map(function (tb, i) { var m = (D.hid && D.hid[i]) || 0; return tb.map(function (_, j) { return j < tb.length - 1 && !!((m >> j) & 1); }); });
  var tot = []; t.forEach(function (tb) { tb.forEach(function (c) { tot[c] = (tot[c] || 0) + 1; }); });
  return { t: t, cap: D.caps.slice(), fz: D.caps.map(function (_, i) { return (D.fz && D.fz[i]) || 0; }), h: h, tot: tot };
}
function csClone(S) { return { t: S.t.map(function (a) { return a.slice(); }), cap: S.cap.slice(), fz: S.fz.slice(), h: S.h.map(function (a) { return a.slice(); }), tot: S.tot }; }
function csSealed(S, i) {
  var tb = S.t[i]; if (!tb.length) return false;
  var c = tb[0]; for (var j = 1; j < tb.length; j++) if (tb[j] !== c) return false;
  return tb.length === S.tot[c];
}
function csSealedCount(S) { var n = 0; for (var i = 0; i < S.t.length; i++) if (csSealed(S, i)) n++; return n; }
function csFrozen(S, i, sc) { return S.fz[i] > (sc === undefined ? csSealedCount(S) : sc); }
// how many layers pour a->b would move (0 = illegal)
function csAmount(S, a, b, sc) {
  if (a === b) return 0;
  var A = S.t[a], B = S.t[b]; if (!A.length) return 0;
  if (sc === undefined) sc = csSealedCount(S);
  if (S.fz[a] > sc || S.fz[b] > sc) return 0;
  if (csSealed(S, a) || csSealed(S, b)) return 0;
  var free = S.cap[b] - B.length; if (free <= 0) return 0;
  var c = A[A.length - 1]; if (B.length && B[B.length - 1] !== c) return 0;
  var run = 1; while (run < A.length && A[A.length - 1 - run] === c) run++;
  return Math.min(run, free);
}
// pure: returns {S, n, c} or null
function csPour(S, a, b) {
  var n = csAmount(S, a, b); if (!n) return null;
  var R = csClone(S), A = R.t[a], B = R.t[b], c = A[A.length - 1];

      html += '<button class="lt lock" data-n="' + n + '" aria-label="第 ' + n + ' 關（未解鎖）"><span class="n">' + n + '</span><svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="dn">難度 ' + dn + '</span></button>';
    } else {
      html += '<button class="lt' + (n === cur && !isd ? ' cur' : '') + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + dn + '"><span class="n">' + n + '</span><span class="st">' +
        [1,2,3].map(function(k){ return '<span class="' + (k <= st ? 'on' : '') + '">★</span>'; }).join('') + '</span><span class="fl">' + flaskSVG(flasks(n), diffColor(n)) + '</span><span class="dn">難度 ' + dn + '</span></button>';
    }
  }
  g.innerHTML = html;
  $('selSum').textContent = '已完成 ' + done + ' / ' + NL + ' 關・三星 ' + three + ' 關・難度以燒瓶 1–5 表示';
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
function openSelect(){
  status = 'select'; buildGrid(); showOnly('select');
  $('hud').classList.add('hidden'); $('bottom').classList.add('hidden');
  var cur = $('grid').querySelector('.lt.cur') || $('grid').querySelector('.lt[data-n="' + Math.min(NL, firstOpen()) + '"]');
  if (cur) setTimeout(function(){ try{ cur.scrollIntoView({ block: 'center' }); }catch(e){} }, 30);
}
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.getAttribute('data-n');
  if (!unlocked(n)){ SFX.bad(); toast('先完成第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
});
bindTap('unlockSw', function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); SFX.click(); buildGrid(); });
bindTap('sBack', function(){ SFX.click(); goTitle(); });
bindTap('tPlay', function(){ SFX.click(); startLevel(playTarget()); });
bindTap('tSelect', function(){ SFX.click(); openSelect(); });
bindTap('tHelp', function(){ SFX.click(); openHelp(); });
bindTap('tMenu', function(){ SFX.click(); openMenu(); });

var menuFrom = 'title';
function setSw(id, on){ $(id).setAttribute('aria-checked', on ? 'true' : 'false'); }
function openMenu(){
  menuFrom = status === 'play' || status === 'stuck' ? 'play' : 'title';
  if (menuFrom === 'play'){ status = 'paused'; sel = -1; }
  $('mTitle').textContent = menuFrom === 'play' ? '暫停・第 ' + levelN + ' 關' : '設定與統計';
  $('mGameBtns').classList.toggle('hidden', menuFrom !== 'play');
  $('mResume').textContent = menuFrom === 'play' ? '繼續' : '返回';
  setSw('swSound', settings.sound); setSw('swPattern', settings.pattern); setSw('swInf', settings.infUndo); setSw('swVib', settings.vib);
  [].forEach.call($('segTheme').children, function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-v') === settings.theme ? 'true' : 'false'); });
  var done = Object.keys(progress).length, three = 0; for (var k in starsSaved) if (starsSaved[k] === 3) three++;
  var ratio = stats.parSum ? (stats.movesSum / stats.parSum) : 0;
  $('statsG').innerHTML = '<div>總倒水次數<b>' + stats.pours + '</b></div><div>已過關<b>' + done + ' / ' + NL + '</b></div>' +
    '<div>三星關卡<b>' + three + '</b></div><div>平均步數比<b>' + (ratio ? ratio.toFixed(2) + '×' : '—') + '</b></div>' +
    '<div>零悔棋過關<b>' + (stats.zeroUndo || 0) + '</b></div><div>用過提示<b>' + stats.hints + '</b></div>';
  showOnly('menu');
}
bindTap('bMenu', function(){ SFX.click(); finishAnims(); openMenu(); });
bindTap('mResume', function(){ SFX.click(); if (menuFrom === 'play'){ showOnly(null); status = 'play'; deadVer = -1; } else goTitle(); });
bindTap('mSelect', function(){ SFX.click(); openSelect(); });
bindTap('mHelp', function(){ SFX.click(); openHelp(); });
bindTap('swSound', function(){ settings.sound = !settings.sound; saveSettings(); setSw('swSound', settings.sound); SFX.click(); });
bindTap('swPattern', function(){ settings.pattern = !settings.pattern; saveSettings(); setSw('swPattern', settings.pattern); SFX.click(); });
bindTap('swInf', function(){ settings.infUndo = !settings.infUndo; saveSettings(); setSw('swInf', settings.infUndo); SFX.click(); if (S) updateHud(); });
bindTap('swVib', function(){ settings.vib = !settings.vib; saveSettings(); setSw('swVib', settings.vib); SFX.click(); vib(15); });
$('segTheme').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; audio(); settings.theme = b.getAttribute('data-v'); saveSettings(); applyTheme(); SFX.click();
  [].forEach.call($('segTheme').children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); });

bindTap('bRestart', function(){ if (status === 'play') doRestart(true); });
bindTap('bUndo', function(){ doUndo(); });
bindTap('bHint', function(){ useHint(); });
bindTap('bTube', function(){ addTube(); });
bindTap('kUndo', function(){ doUndo(); });
bindTap('kRestart', function(){ doRestart(); });
bindTap('kTube', function(){ addTube(); });
bindTap('kLook', function(){ SFX.click(); if (status === 'stuck'){ deadAck = posVer; status = 'play'; showOnly(null); } });

/* win */
var lastWin = null;
// the clear is recorded the moment the last tube seals (not when the card appears 1 s later), exactly once
function bankWin(){
  var par = curPar(), st = moves <= par + 2 ? 3 : moves <= Math.floor(par * 1.5) ? 2 : 1;
  var capMsg = '';
  if ((settings.infUndo || infUsed) && st > 2){ st = 2; capMsg = '（用了無限悔棋，最多 ★★）'; }
  if (bonusUsed && st > 1){ st = 1; capMsg = '（使用了小試管，最多 ★）'; }
  var prevBest = progress[levelN];
  progress[levelN] = prevBest === undefined ? moves : Math.min(prevBest, moves); sset('progress', progress);
  starsSaved[levelN] = Math.max(starsSaved[levelN] || 0, st); sset('stars', starsSaved);
  stats.clears++; stats.movesSum += moves; stats.parSum += par; if (!undoUsed) stats.zeroUndo = (stats.zeroUndo || 0) + 1; saveStats();
  delete saves[levelN]; sset('saves', saves);
  lastWin = { n: levelN, moves: moves, stars: st, capMsg: capMsg, par: par };
}
function showWin(){
  if (!lastWin) return;
  var par = lastWin.par, st = lastWin.stars, capMsg = lastWin.capMsg;
  $('wTitle').textContent = levelN === NL ? '大功告成！' : ['調配完成！', '漂亮的配方！', '完美封瓶！'][st - 1];
  $('wStars').innerHTML = [1,2,3].map(function(k){ return '<span class="' + (k <= st ? 'on' : '') + '" style="animation-delay:' + (k*.18) + 's">★</span>'; }).join('');
  for (var k = 0; k < st; k++) SFX.star && setTimeout(SFX.star.bind(null, k), 200 + k*180);
  $('wMoves').textContent = moves; $('wPar').textContent = par; $('wBest').textContent = progress[levelN];
  var msg = st === 3 ? '步數在目標 +2 以內，完美！' : st === 2 ? '★★★ 需要 ' + (par + 2) + ' 步以內' : '★★ 需要 ' + Math.floor(par * 1.5) + ' 步以內';
  if (capMsg) msg = capMsg;
  if (levelN === NL) msg = '你完成了全部 100 道鍊金配方！';
  $('wMsg').textContent = msg;
  $('wNext').classList.toggle('hidden', levelN >= NL);
  showOnly('win');
}
bindTap('wNext', function(){ SFX.click(); startLevel(levelN + 1); });
bindTap('wRetry', function(){ SFX.click(); startLevel(levelN, true); });
bindTap('wSelect', function(){ SFX.click(); openSelect(); });
bindTap('wShare', function(){
  if (!lastWin) return;
  var txt = '鍊金藥劑室 第 ' + lastWin.n + ' 關 ' + lastWin.moves + ' 步 ' + '★★★'.slice(0, lastWin.stars);
  SFX.click();
  if (navigator.share){ navigator.share({ text: txt }).catch(function(){}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast('已複製：' + txt); }, function(){ toast(txt); });
  else toast(txt);
});

/* help + intro */
function mechCanvas(kind){
  var c = document.createElement('canvas'), s = 2; c.width = 76*s; c.height = 96*s;
  var g = c.getContext('2d'); g.scale(s, s);
  var geo = { w: 26, lh: 15, gt: 2, neck: 10 };
  var specs = {
    basic: [[ [0,3,0,3], 4, {} ], [ [3,3], 4, {} ]],
    cap5:  [[ [1,1,1,1,1], 5, { cork: 1 } ], [ [4,2,4], 5, {} ]],
    hidden:[[ [5,7,8,2], 4, { hid: [1,1,1,0] } ], [ [7,7], 4, {} ]],
    mixed: [[ [6,6,0], 3, {} ], [ [2,2,4,4,2,2], 6, {} ]],
    one:   [[ [3,8,3,8,8], 5, {} ], [ [], 6, {} ]],
    frozen:[[ [9,1,9,1], 4, { frozen: 1, fzN: 1 } ], [ [0,0,0,0], 4, { cork: 1 } ]]
  }[kind];
  var maxCap = Math.max(specs[0][1], specs[1][1]);
  var by = 92;
  specs.forEach(function(sp, k){
    var cap = sp[1], Ht = cap*geo.lh + geo.gt + geo.neck;
    var hid = sp[2].hid || [];
    var layers = sp[0].map(function(c, j){ return { c: c, h: geo.lh, hid: !!hid[j] }; });
    drawTubeAt(g, geo, cap, layers, Object.assign({ x: 20 + k*36, y: by - Ht, cork: -1, pattern: settings.pattern }, sp[2]), undefined);
  });
  return c;
}
var MECH = {
  basic: { t: '倒水分色', d: '點一支試管選取（會浮起），再點另一支把頂端的藥水倒過去。只能倒進空管，或頂端同色且還有空位的試管。' },
  cap5:  { t: '五層試管', d: '從這關開始，每種藥水有 5 層、試管也變成 5 層高。集滿同一色就會蓋上軟木塞。' },
  hidden:{ t: '隱藏層', d: '標著「？」的藥水看不見顏色，等上面的藥水倒走、它露到最上層時才會揭曉。先清出空位再探路！' },
  mixed: { t: '不同容量', d: '試管有 3–6 層不同高度。某色全部集中在同一支試管裡（不必裝滿）就會封瓶。小試管很適合當暫存。' },
  one:   { t: '只剩一支空管', d: '空管只剩一支大的 6 層試管，操作空間變少了。部分試管一開始沒裝滿，善用這些空位。' },
  frozen:{ t: '冰凍管', d: '冰凍的試管不能倒出也不能倒入。先封滿圖示上的數量（例如「封1」＝先封好 1 支）才會解凍。' }
};
function mechRow(kind){
  var m = MECH[kind], row = document.createElement('div'); row.className = 'mech';
  row.appendChild(mechCanvas(kind));
  var d = document.createElement('div'); d.innerHTML = '<b>' + m.t + '</b><br>' + m.d; row.appendChild(d);
  return row;
}
function openHelp(){
  var prev = status;
  var b = $('helpBody'); b.innerHTML = '';
  var p = document.createElement('p'); p.innerHTML = '讓每支試管只裝一種藥水。所有藥水都封瓶就過關。<br>★★★：目標步數 +2 以內；★★：目標 ×1.5 以內。';
  b.appendChild(p);
  ['basic', 'cap5', 'hidden', 'mixed', 'one', 'frozen'].forEach(function(k){ b.appendChild(mechRow(k)); });
  var p2 = document.createElement('p'); p2.className = 'note';
  p2.innerHTML = '悔棋每關 5 次（設定可改無限，最多 ★★）・提示每關 2 次・加小試管每關 1 次（最多 ★）。走到死路時會提醒你。<br>分不清顏色？設定裡打開「色盲圖案模式」，每種藥水都有自己的圖案。<br>進度會自動保存，下次從同一步接著玩。<br>鍵盤：1–9／0 選試管、Z 悔棋、R 重來（按兩次）、H 提示。';
  b.appendChild(p2);
  helpReturn = prev; if (status === 'play') status = 'paused';
  showOnly('help');
}
var helpReturn = 'title';
bindTap('hOk', function(){
  SFX.click();
  if (helpReturn === 'play' || helpReturn === 'paused'){ if (helpReturn === 'paused') openMenu(); else { showOnly(null); status = 'play'; } }
  else if (helpReturn === 'title') goTitle(); else showOnly(null);
});
function showIntro(kind){
  status = 'paused';
  $('iTitle').textContent = kind === 'basic' ? '歡迎來到鍊金藥劑室' : '新機制：' + MECH[kind].t;
  var b = $('iBody'); b.innerHTML = ''; b.appendChild(mechRow(kind));
  showOnly('intro');
}
bindTap('iOk', function(){ SFX.click(); showOnly(null); status = 'play'; });

/* ---------------- test hook ---------------- */
window.__game = {
  levelCount: NL,
  startLevel: function(n){ startLevel(n); if (status === 'paused'){ showOnly(null); status = 'play'; } },
  state: function(){ return { status: status, level: levelN, moves: moves, par: curPar(), animating: Q.length > 0, sel: sel, tubes: S ? S.t.length : 0, won: S ? csWon(S) : false }; },
  tubeCenter: function(i){ var p = tubePos(i); return { x: p.cx, y: (p.my + p.by) / 2 }; },
  levelData: function(n){ return levelData(n); },
  freeze: function(t){ freezeT = t; },
  legal: function(){ return S ? csMoves(S) : []; },
  diff: function(n){ return { n: diffN(n), flasks: flasks(n) }; },
  more: function(){ return { undos: undosLeft, hints: hintsLeft, bonus: bonusUsed, hint: hintMv ? [hintMv.a, hintMv.b] : null, mv: mvList.slice(), dead: deadKind, infUsed: infUsed, stars: lastWin && lastWin.n === levelN ? lastWin.stars : 0 }; },
  layout: function(){ return { w: LAY.w, lh: LAY.lh, rows: LAY.rowIdx.map(function(r){ return { from: r.from, to: r.to, top: r.top, bot: r.bot, pitch: r.pitch }; }), pos: LAY.pos.map(function(p, i){ return { cx: p.cx, top: p.my, by: p.by, h: tubeH(S.cap[i]) }; }) }; },
  solve: function(){ var r = csSolve(S, { limit: 400000 }); return r && r.sol; },
  setMoves: function(list){ for (var i = 0; i < list.length; i++){ var r = csPour(S, list[i][0], list[i][1]); if (!r) return false; hist.push({ S: S, moves: moves }); S = r.S; moves++; mvList.push(list[i]); } posVer++; deadVer = -1; updateHud(); saveGame(); return true; }
};

applyTheme();
layout();
goTitle();
startLoop();
})();
