<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>購物清單</title>
<style>
:root{
  --bg:#f2eee4; --paper:#fffdf7; --surface:#fffdf7; --surface-2:#f6f2e8; --ink:#1d2a21; --ink-2:#46544a; --ink-3:#647068;
  --line:#e3ddcf; --line-strong:#c9c1ae; --rule:#ece6d8;
  --board:#22432d; --board-2:#1a3623; --on-board:#f4f1e4; --on-board-2:#bcd0bd; --board-line:rgba(255,255,255,.12);
  --chip-on:#f4f1e4; --chip-on-ink:#1a3623;
  --accent:#2f6b3c; --accent-ink:#ffffff; --accent-soft:#e2eedc; --check:#2f7d43;
  --tomato:#c4462f; --warn:#9a5b00; --warn-bg:#fbf1dc; --danger:#b4332a;
  --focus:#2f6bff; --scrim:rgba(20,24,18,.46);
  --shadow:0 1px 0 rgba(40,36,20,.05),0 10px 22px -16px rgba(40,36,20,.45);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101511; --paper:#171e18; --surface:#18201a; --surface-2:#1f2921; --ink:#e7ece4; --ink-2:#b0bcb1; --ink-3:#8f9c91;
    --line:#29342b; --line-strong:#3d4a3f; --rule:#222c24;
    --board:#1c3324; --board-2:#162a1d; --on-board:#eef2e6; --on-board-2:#a9c2ad; --board-line:rgba(255,255,255,.09);
    --chip-on:#e7efe0; --chip-on-ink:#173020;
    --accent:#86cf95; --accent-ink:#0d2414; --accent-soft:#1f3326; --check:#79c98a;
    --tomato:#ff8a72; --warn:#f0b65a; --warn-bg:#2a2414; --danger:#ff8379;
    --focus:#8fb0ff; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 22px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101511; --paper:#171e18; --surface:#18201a; --surface-2:#1f2921; --ink:#e7ece4; --ink-2:#b0bcb1; --ink-3:#8f9c91;
  --line:#29342b; --line-strong:#3d4a3f; --rule:#222c24;
  --board:#1c3324; --board-2:#162a1d; --on-board:#eef2e6; --on-board-2:#a9c2ad; --board-line:rgba(255,255,255,.09);
  --chip-on:#e7efe0; --chip-on-ink:#173020;
  --accent:#86cf95; --accent-ink:#0d2414; --accent-soft:#1f3326; --check:#79c98a;
  --tomato:#ff8a72; --warn:#f0b65a; --warn-bg:#2a2414; --danger:#ff8379;
  --focus:#8fb0ff; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 22px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-anchor:none;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100%;
  background-image:radial-gradient(rgba(120,100,60,.07) 1px,transparent 1.2px);background-size:14px 14px}
:root[data-theme="dark"] body{background-image:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{background-image:none} }
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
svg{flex:none}

/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo{flex:none;width:44px;height:44px;border-radius:13px;background:var(--board);color:var(--on-board);display:grid;place-items:center;box-shadow:var(--shadow)}
.logo svg{width:26px;height:26px}
.logo.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1)}}
.listbtn{flex:1;min-width:0;height:48px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:0 10px 0 12px;text-align:left;box-shadow:var(--shadow)}
.listbtn .lt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.listbtn small{font-size:11px;color:var(--ink-3);letter-spacing:.12em}
.listbtn b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listbtn svg{width:18px;height:18px;color:var(--ink-3)}
.iconbtn{flex:none;width:44px;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border:1px dashed currentColor;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px;letter-spacing:.05em}

.sample{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px dashed currentColor;border-radius:12px;padding:4px 4px 4px 12px;margin-bottom:10px}
.sample span{flex:1;line-height:1.35}
.sample button{flex:none;min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600}

/* layout */
.side{display:contents}
.main{min-width:0}

/* board */
.board{background:var(--board);color:var(--on-board);border-radius:18px;padding:12px 14px 12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 21px,var(--board-line) 21px 22px),repeating-linear-gradient(0deg,transparent 0 21px,var(--board-line) 21px 22px);opacity:.35;mask-image:linear-gradient(180deg,#000,transparent 75%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%)}
.board>*{position:relative}
.bmain{display:flex;align-items:flex-end;gap:10px;min-height:46px}
.bnum{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.blabel{display:flex;flex-direction:column;line-height:1.25;padding-bottom:2px;min-width:0}
.blabel b{font-size:15px}
.blabel span{font-size:12px;color:var(--on-board-2)}
.best{margin-left:auto;text-align:right;line-height:1.25;padding-bottom:2px}
.best span{display:block;font-size:11px;color:var(--on-board-2);letter-spacing:.08em}
.best b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.bdone{display:flex;align-items:center;gap:10px;min-height:46px}
.bdone .ok{width:40px;height:40px;border-radius:50%;background:var(--chip-on);color:var(--chip-on-ink);display:grid;place-items:center}
.bdone .ok svg{width:24px;height:24px}
.bdone b{font-size:19px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.16);margin:10px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#9fdc8f,#d8f0a0);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stores{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}
.stores::-webkit-scrollbar{display:none}
.schip{flex:none;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--on-board);font-size:14px;position:relative}
.schip em{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.schip .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,#ccc)}
.schip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:700}
.schip.add{border-style:dashed;color:var(--on-board-2)}
.schip.add svg{width:14px;height:14px}

/* composer */
.composer{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px 6px;background:var(--bg)}
.composer::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.cbar{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:15px;padding:4px 4px 4px 12px;box-shadow:var(--shadow);transition:border-color .15s}
.cbar:focus-within{border-color:var(--accent)}
.cbar svg.lead{width:20px;height:20px;color:var(--ink-3);align-self:center}
.cbar input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:46px;outline:none;padding:0 2px}
.cbar input::placeholder{color:var(--ink-3)}
.addbtn{flex:none;min-width:64px;height:46px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;padding:0 14px}
.addbtn:active{transform:scale(.96)}
.status{position:relative;height:44px;margin-top:6px}
.preview{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;height:44px;font-size:13px;color:var(--ink-2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.preview::-webkit-scrollbar{display:none}
.preview .hint{color:var(--ink-3);font-size:12.5px;padding-left:4px;overflow:hidden;text-overflow:ellipsis}
.smsg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:0 0 0 12px;font-size:14px;animation:sin .22s cubic-bezier(.2,.9,.3,1.1)}
.smsg svg{width:18px;height:18px;color:var(--check);flex:none}
.smsg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smsg button{flex:none;height:44px;min-width:64px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 14px}
.smsg.warn svg{color:var(--warn)}
@keyframes sin{from{opacity:0;transform:translateY(-4px)}}
.warnbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--danger);background:var(--surface);border:1.5px solid currentColor;border-radius:12px;padding:4px 4px 4px 12px;margin-bottom:10px}
.warnbar span{flex:1;line-height:1.35}
.warnbar button{flex:none;min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-weight:700;font-size:13px}
.pv{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px;min-height:28px}
.pv .cic{width:20px;height:20px;border-radius:6px}
.pv .cic svg{width:14px;height:14px}
.pv.err{color:var(--danger);border-color:currentColor}
.sug{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.sug svg{width:15px;height:15px;color:var(--accent)}
.sug small{color:var(--ink-3);font-size:12px}

/* frequent */
.freq{margin:4px 0 6px}
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.fhead h2{margin:0;font-size:12px;letter-spacing:.16em;color:var(--ink-3);font-weight:700}
.fhead button{min-height:44px;margin:-4px 0;border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;padding:0 2px 0 10px;position:relative}
.fhead button::after{content:"";position:absolute;inset:-4px -4px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{min-height:44px;display:inline-flex;align-items:center;gap:5px;padding:0 12px 0 9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.03);transition:transform .12s}
.fchip svg{width:16px;height:16px;color:var(--accent)}
.fchip.in{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.fchip.in svg{color:var(--check)}
.fchip:active,.sug:active{transform:scale(.95)}
.fchip.hide{display:none}
.fchip.more{border-style:dashed;color:var(--accent);font-weight:700;padding:0 12px}

/* list */
.sgroup{margin-top:14px;content-visibility:auto;contain-intrinsic-size:auto 400px}
.shead{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding-left:4px;font-size:15px;font-weight:800;letter-spacing:.04em}
.shead .dot{width:10px;height:10px;border-radius:50%;background:var(--sc,var(--ink-3));box-shadow:0 0 0 3px color-mix(in srgb,var(--sc,#999) 22%,transparent)}
.shead em{font-style:normal;font-weight:600;font-size:12px;color:var(--ink-3)}
.shead .go{margin-left:auto;min-height:44px;margin-top:-4px;margin-bottom:-4px;border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:600;position:relative;padding:0 2px}
.shead .go::after{content:"";position:absolute;inset:-4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;margin:0;padding:9px 12px 4px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
.chead em{font-style:normal;color:var(--ink-3);font-weight:600;letter-spacing:0}
.cgroup+.cgroup{border-top:1px solid var(--rule)}
.cic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.cic svg{width:16px;height:16px}
.items{list-style:none;margin:0;padding:0 0 4px}
.it{display:flex;align-items:stretch;position:relative;scroll-margin:96px 0 24px}
.it+.it::before{content:"";position:absolute;left:48px;right:12px;top:0;border-top:1px dashed var(--line)}
.tg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;border:0;background:transparent;text-align:left;padding:6px 4px 6px 12px}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background .18s,border-color .18s,transform .18s}
.box svg{width:16px;height:16px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease .05s}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.nm{font-size:16px;font-weight:600;overflow-wrap:anywhere;position:relative;align-self:flex-start}
.nm::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.mt{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.q{flex:none;min-width:56px;max-width:40%;min-height:44px;margin:4px 8px 4px 0;align-self:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 10px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q svg{width:16px;height:16px;color:var(--ink-3)}
.q.plain{min-width:44px;background:transparent;border-color:transparent}
.it.done .box{background:var(--check);border-color:var(--check);color:#fff;transform:scale(1)}
.it.done .box svg{stroke-dashoffset:0}
.it.done .nm{color:var(--ink-3)}
.it.done .nm::after{transform:scaleX(1)}
.it.done .q{opacity:.55}
.it.flash .tg{animation:flash 1.1s ease}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.tg:active .box{transform:scale(.86)}

.donegrp{margin-top:18px;content-visibility:auto;contain-intrinsic-size:auto 300px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dtoggle{min-height:44px;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--ink-2);padding:0 4px}
.dtoggle svg{width:18px;height:18px;transition:transform .2s}
.dtoggle[aria-expanded="false"] svg.chev{transform:rotate(-90deg)}
.dtoggle .cart{color:var(--check)}
.clearbtn{margin-left:auto;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-size:13px;font-weight:600;padding:0 12px;position:relative}
.clearbtn::after{content:"";position:absolute;inset:-2px}
.donegrp .card{background:var(--surface-2)}

.alldone{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--accent-soft);border-radius:16px;padding:12px 12px 12px 14px}
.alldone p{margin:0;flex:1;font-size:14px;line-height:1.4}
.alldone b{display:block;font-size:16px}
.alldone button{flex:none;min-height:44px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 14px}

.empty{text-align:center;padding:28px 16px 12px;color:var(--ink-2)}
.empty svg{width:120px;height:96px;color:var(--ink-3)}
.empty h3{margin:8px 0 4px;font-size:17px;color:var(--ink)}
.empty p{margin:0 auto;max-width:300px;font-size:14px;line-height:1.55}
.empty .tip{display:inline-block;margin-top:10px;font-size:13px;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:6px 10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:6px;background:#1d2a21;color:#f4f1e4;border-radius:14px;padding:4px 4px 4px 14px;max-width:calc(100% - 24px);width:max-content;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);font-size:14px;animation:tin .22s cubic-bezier(.2,.9,.3,1.2)}
:root[data-theme="dark"] .toast{background:#e7ece4;color:#142017}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast{background:#e7ece4;color:#142017} }
.toast{pointer-events:none}
.toast span{flex:1;min-width:0;padding:10px 0;line-height:1.35}
.toast button{pointer-events:auto;flex:none;min-height:44px;min-width:56px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:inherit;font-weight:800;padding:0 12px}
:root[data-theme="dark"] .toast button{background:rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast button{background:rgba(0,0,0,.08)} }
.toast button[hidden]{display:none}
.toast.solo{padding:4px 16px}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
@keyframes tin{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3{margin:16px 0 8px;font-size:12px;letter-spacing:.14em;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.06em}
.txt{width:100%;min-height:48px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface-2);padding:0 12px;font-size:16px}
.txt:focus{outline:none;border-color:var(--accent)}
textarea.txt{padding:10px 12px;min-height:130px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;min-height:0}
.err:empty{display:none}
.note{font-size:13px;color:var(--ink-3);margin:6px 0;line-height:1.5}
.stepper{display:flex;align-items:center;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--sc,#999)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.catb{min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;padding:4px 2px}
.catb .cic{width:28px;height:28px;border-radius:9px}
.catb .cic svg{width:18px;height:18px}
.catb[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c);background:var(--surface);font-weight:700}
.sheetact{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:700;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 140px}
.lrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);min-height:56px}
.lrow:last-child{border-bottom:0}
.lrow .lmain{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:4px 0}
.lrow .lmain b{display:block;font-size:16px;overflow-wrap:anywhere}
.lrow .lmain small{display:block;font-size:12.5px;color:var(--ink-3)}

.lrow .lmain .radio.on{border-color:var(--accent)}
.lrow .lmain .radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.mini{flex:none;width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.mini svg{width:18px;height:18px}
.mini.danger{color:var(--danger)}
.mini:disabled{opacity:.35;cursor:default}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .txt{flex:1;min-width:0}
.menu .mrow{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:16px;padding:0 2px}
.menu .mrow svg{width:20px;height:20px;color:var(--ink-2)}
.menu .mrow small{margin-left:auto;color:var(--ink-3);font-size:13px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.switchrow{display:flex;align-items:center;gap:10px;min-height:52px}
.switchrow span{flex:1}
.sw{width:56px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.sw i{width:48px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}

    q('#eDone').onclick = closeSheet;
    q('#eDel').onclick = () => {
      undoStack.push(before);
      list.items = list.items.filter(i => i.id !== id); hold.delete(id);
      sheetClose = null; closeSheet(); save(); render(); toast('已刪除 ' + it.name, true);
    };
  }, () => {
    if (JSON.stringify(it) !== orig) {
      const m = state.mem[normName(it.name)];

  });
}

function quickAdd(name) {

let downloads = null;

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}

async function doImport(text, errEl) {
  const fail = m => { if (errEl) errEl.textContent = m; else toast(m); };
  if (!String(text || '').trim()) return fail('請先選擇備份檔或貼上備份文字');
  let obj; try { obj = JSON.parse(text); } catch (e) { return fail('看不懂這段內容：不是購物清單的備份（JSON 格式錯誤）'); }
  const data = obj && obj.app === APP ? obj.data : obj;
  const st = cleanState(data);
  if (!st) return fail('這不是購物清單的備份檔，裡面找不到清單');
  const n = st.lists.reduce((a, l) => a + l.items.length, 0);
  if (!(await confirmDlg('取代目前的資料？', `備份裡有 ${st.lists.length} 份清單、${n} 個品項。目前的清單會被取代，匯入後可以按「復原」。`, '匯入'))) return;
  snap(); state = st; state.sample = false; hold.clear(); freqOrder = null; save(); closeSheet(); render(); toast(`已匯入 ${st.lists.length} 份清單`, true);
}
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  if (f.size > 20 * 1024 * 1024) { toast('檔案太大，不像是購物清單的備份'); return; }
  const r = new FileReader();
  r.onload = () => { const e = document.querySelector('#iErr'); doImport(String(r.result || ''), e); };
  r.onerror = () => toast('讀不到這個檔案');
  r.readAsText(f);
});

/* ---------- events ---------- */
$('#composer').addEventListener('submit', ev => { ev.preventDefault(); submitAdd($('#addInput').value); });
$('#addInput').addEventListener('input', () => { hideMsg(); lsSet(DKEY, $('#addInput').value); renderPreview(); });
$('#addInput').addEventListener('paste', ev => {
  const t = (ev.clipboardData || window.clipboardData) && (ev.clipboardData || window.clipboardData).getData('text');
  if (t && /\n/.test(t.trim())) {
    ev.preventDefault();
    const r = parseText(t);
    if (!r.items.length) { toast('貼上的內容裡找不到品項'); return; }
    const res = addEntries(r.items);
    fx.add(); render(); toast(`已從貼上的文字加入 ${res.length} 項`, true);
  }
});
$('#preview').addEventListener('click', ev => {
  const b = ev.target.closest('[data-sug]'); if (!b) return;
  $('#addInput').value = ''; quickAdd(b.dataset.sug); $('#addInput').focus({ preventScroll: true });
});
$('#freq').addEventListener('click', ev => {
  const a = ev.target.closest('[data-add]'); if (a) { quickAdd(a.dataset.add); return; }
  if (ev.target.closest('[data-more]')) { freqSheet(); return; }
  if (ev.target.closest('#freqAll')) freqSheet();
});
$('#board').addEventListener('click', ev => {
  const s = ev.target.closest('[data-store]'); if (s) { setFilter(s.dataset.store); return; }
  if (ev.target.closest('#storeAdd')) storesSheet();
});
$('#listArea').addEventListener('click', ev => {
  const e = ev.target.closest('[data-edit]'); if (e) { editSheet(e.dataset.edit); return; }
  const t = ev.target.closest('.tg'); if (t) { toggleItem(t.closest('[data-id]').dataset.id); return; }
  const g = ev.target.closest('.go[data-store]'); if (g) { setFilter(g.dataset.store); window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); return; }
  if (ev.target.closest('#doneToggle')) { prefs.showDone = !prefs.showDone; savePrefs(); render(); return; }
  if (ev.target.closest('#clearDone') || ev.target.closest('#clearDone2')) clearDone();
});
$('#listBtn').addEventListener('click', listsSheet);
$('#warnBackup').addEventListener('click', async () => { const ok = await copyText(JSON.stringify({ app: APP, version: 1, exportedAt: new Date().toISOString(), data: state })); toast(ok ? '備份已複製，貼到記事本存起來' : '無法複製，請到「更多」裡用備份'); });
$('#shareBtn').addEventListener('click', shareSheet);
$('#menuBtn').addEventListener('click', menuSheet);
$('#clearSample').addEventListener('click', async () => {
  if (!(await confirmDlg('清空範例？', '範例清單和範例常買項目會移除，店家會保留。之後想反悔可以按「復原」。', '清空'))) return;
  snap();
  for (const k in state.mem) if (state.mem[k].s) delete state.mem[k];
  const keep = state.lists.filter(l => !l.sample);
  const fresh = { id: 'L' + newId(), name: '購物清單', sample: false, items: [] };
  state.lists = keep.length ? keep : [fresh];
  state.cur = state.lists[0].id; state.sample = false; state.filter = 'all'; hold.clear(); freqOrder = null;
  save(); render(); toast('範例已清空，開始寫你的清單吧', true);
  if (matchMedia('(pointer:fine)').matches) $('#addInput').focus();
});
let rzT = null;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { freqMaxRows = innerHeight < 700 ? 1 : 2; fitFreq(); }, 80); });
addEventListener('storage', ev => { if (ev.key === KEY && ev.newValue) { try { const st = cleanState(JSON.parse(ev.newValue)); if (st) { state = st; hold.clear(); render(); } } catch (e) {} } });

/* ---------- boot ---------- */
applyTheme();
load();
freqMaxRows = innerHeight < 700 ? 1 : 2;
{ const d = lsGet(DKEY); if (d) $('#addInput').value = d.slice(0, 200); }
render();
document.documentElement.dataset.ready = '1';
window.__shop = { get state() { return state; }, parseEntry, parseText, shareText, categorize, totals };
(async () => { try { downloads = await (window.claude && window.claude.use ? window.claude.use('downloads') : null) || null; } catch (e) { downloads = null; } })();
})();
</script>
