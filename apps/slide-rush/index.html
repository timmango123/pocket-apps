/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();

  ctx.save();

  ctx.translate(CX + shx, CY + shy); ctx.rotate(a * ROLL); ctx.translate(-CX, -CY);

    for (let k = kStart + 1; k <= kEnd; k++) { const o = k * (NS + 1) + NS; ctx.lineTo(PX[o], PY[o]); }
    for (let j = NS - 1; j >= 0; j--) { const o = kEnd * (NS + 1) + j; ctx.lineTo(PX[o], PY[o]); }
    for (let k = kEnd - 1; k > kStart; k--) { const o = k * (NS + 1); ctx.lineTo(PX[o], PY[o]); }

function drawBackground(th) {
  const ext = Math.hypot(W, H) * 0.75 + 40;
  const L = CX - ext, T = CY - ext, S = ext * 2;
  const g = ctx.createLinearGradient(0, T + ext * 0.4, 0, CY);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(L, T, S, ext + 2);
  // sun
  const sunX = CX + ((-bgX * 0.15) % (S) + S * 1.5) % S - S / 2, sunY = CY - Math.min(W, H) * 0.42;
  ctx.fillStyle = th.sun; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(sunX, sunY, 64, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(sunX, sunY, 40, 0, 6.283); ctx.fill();

  const off1 = bgX * 0.4;
  ctx.fillStyle = th.far; ctx.beginPath(); ctx.moveTo(L, CY + 2);

  } else if (th.scene === 'mesa') {
    for (let xx = L - 60; xx <= L + S + 60; xx += 30) { const u = Math.floor((xx + off1) / 150); const h = 40 + ((u * 9301 + 49297) % 233280) / 233280 * 70; ctx.lineTo(xx, CY - h); }
  } else {

    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(vx - 50, CY - 170); ctx.lineTo(vx + 50, CY - 170); ctx.lineTo(vx + 20, CY - 140); ctx.lineTo(vx - 10, CY - 120); ctx.lineTo(vx - 30, CY - 150); ctx.fill();
    ctx.fillStyle = 'rgba(90,60,70,0.35)';
    for (let n = 0; n < 4; n++) { ctx.beginPath(); ctx.arc(vx + n * 30 - 20 + Math.sin(raceTime + n) * 6, CY - 200 - n * 34, 26 + n * 10, 0, 6.283); ctx.fill(); }
  }
  // near layer
  const off2 = bgX * 0.8;
  ctx.fillStyle = th.near; ctx.beginPath(); ctx.moveTo(L, CY + 2);
  for (let xx = L; xx <= L + S + 30; xx += 20) { const u = (xx + off2) * 0.011; ctx.lineTo(xx, CY - 12 - 9 * Math.sin(u) - 5 * Math.sin(u * 2.3)); }
  ctx.lineTo(L + S + 30, CY + 2); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = th.near; ctx.fillStyle = th.near; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const step = 110, startX = L - ((off2 % step) + step) % step;

function drawPad(k, ang, i) {

  project(k, R * Math.sin(ang - w), R * (1 - Math.cos(ang - w)) + 4); const ax = tmpX, ay = tmpY;
  project(k, R * Math.sin(ang + w), R * (1 - Math.cos(ang + w)) + 4); const bx = tmpX, by = tmpY;

  project(k + 0.25, R * Math.sin(ang + w * 0.7), R * (1 - Math.cos(ang + w * 0.7)) + 6); const rx = tmpX, ry = tmpY;
  project(k + 0.55, R * Math.sin(ang), R * (1 - Math.cos(ang)) + 6); const mx = tmpX, my = tmpY;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(rx, ry); ctx.lineTo(mx, my); ctx.lineTo(lx, ly); ctx.closePath(); ctx.fill();
}

function drawBall(k, ang, i) {
  const rad = 170;
  project(k + 0.5, R * Math.sin(ang) - Math.sin(ang) * rad, R * (1 - Math.cos(ang)) + Math.cos(ang) * rad);
  const X = tmpX, Y = tmpY, r = rad * tmpS;

  for (let q = 0; q < 6; q++) { ctx.fillStyle = cols[q]; ctx.beginPath(); ctx.moveTo(X, Y); ctx.arc(X, Y, r, rot + q * 1.047, rot + (q + 1) * 1.047); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X, Y, r * 0.22, 0, 6.283); ctx.fill();

function drawRacer(r) {
  if (r.z - camZ < 760) return;
  let a = r.a, lift = 0, spin = 0;
  if (r.isPlayer && r.off > 0) {
    const u = 1 - r.off / 1.5;
    a = r.offDir * (RIM * 0.9 + u * 0.3); lift = Math.sin(Math.min(1, u * 1.4) * Math.PI) * 700; spin = u * 9 * r.offDir;

  ctx.fillStyle = '#f2b38a'; ctx.beginPath(); ctx.arc(0, -ry * 0.5 - 175 * s, 48 * s, 0, 6.283); ctx.fill();

// ---------- HUD ----------
const el = { rank: $('#rankNum'), timer: $('#timer'), speed: $('#speed'), lean: $('#tagLean'), boost: $('#tagBoost'), warn: $('#tagWarn'), hint: $('#hint'), prog: $('#progress') };
const dots = [];
for (let n = 0; n < 7; n++) { const d = document.createElement('div'); d.className = 'dot' + (racers[n].isPlayer ? ' me' : ''); if (!racers[n].isPlayer) d.style.background = racers[n].col; el.prog.appendChild(d); dots.push(d); }

function fmtTime(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function currentRank() {
  let rank = 1;
  for (let n = 0; n < 6; n++) { const r = racers[n]; if (r.finish >= 0 && (player.finish < 0 || r.finish < player.finish)) rank++; else if (r.finish < 0 && player.finish < 0 && r.z > player.z) rank++; }
  return rank;
}
function updateHUD() {
  if (state === 'menu') return;
  const rank = currentRank();
  if (rank !== hudCache.rank) { el.rank.textContent = rank; hudCache.rank = rank; }
  const t = fmtTime(player.finish >= 0 ? player.finish : raceTime);
  if (t !== hudCache.t) { el.timer.textContent = t; hudCache.t = t; }
  const v = Math.round(player.v * 0.0085);
  if (v !== hudCache.v) { el.speed.textContent = v; hudCache.v = v; }
  const ln = state === 'race' && leanShow > 0.5 ? 1 : 0; if (ln !== hudCache.lean) { el.lean.classList.toggle('on', !!ln); hudCache.lean = ln; }
  const bs = boostShow > 0 ? 1 : 0; if (bs !== hudCache.boost) { el.boost.classList.toggle('on', !!bs); hudCache.boost = bs; }
  const wd = state === 'race' ? warnDir : 0;
  if (wd !== hudCache.warn) { el.warn.classList.toggle('on', wd !== 0); el.warn.textContent = wd < 0 ? '‹‹ 左急彎' : '急彎 ››'; hudCache.warn = wd; }

  for (let n = 0; n < 7; n++) { const u = clamp((racers[n].z - 30 * SEG) / span, 0, 1); dots[n].style.left = (u * 100).toFixed(2) + '%'; }
  if (hintT > 0) { hintT -= 1 / 60; if (hintT <= 0) el.hint.style.opacity = '0'; }
}
let msgTimer = 0;
function showMsg(text, dur, small) {
  const m = $('#msg'); clearTimeout(msgTimer);
  if (!text) { m.classList.remove('show'); return; }
  m.textContent = text; m.classList.toggle('small', !!small); m.classList.add('show');
  msgTimer = setTimeout(() => m.classList.remove('show'), dur * 1000);

// ---------- flow ----------
function passed(i) { const p = prog[i]; return !!(p && p.rank <= needRank(i)); }
let unlockAll = !!store.get('sr_unlockAll', false);
function unlocked(i) { return unlockAll || i === 0 || passed(i - 1); }
function syncUnlockSwitch() { const b = $('#unlockAll'); b.setAttribute('aria-checked', String(unlockAll)); }
$('#unlockAll').addEventListener('click', () => { unlockAll = !unlockAll; store.set('sr_unlockAll', unlockAll); syncUnlockSwitch(); renderMenu(); });
function firstOpen() { let i = 0; while (i < NTRACK - 1 && passed(i)) i++; return i; }
let menuWorld = -1;
const MEDAL = ['#ffd23f', '#d9e2e8', '#f0a868'];
function renderMenu() {

  const cont = firstOpen();

  const cb = $('#contBtn');
  cb.innerHTML = `<span>${prog[cont] ? '再挑戰' : '開始'}</span><b>${trackDef(cont).name}</b><small>第 ${cont + 1} 道・難度 ${cont + 1}・前 ${needRank(cont)} 名過關</small>`;
  cb.onclick = () => { audioInit(); startRace(cont); };
  let fin = 0, wins = 0; for (let i = 0; i < NTRACK; i++) if (prog[i]) { fin++; if (prog[i].rank === 1) wins++; }
  $('#menuStats').textContent = `已完成 ${fin} / ${NTRACK} 道・冠軍 ${wins} 次`;

function selectTrack(i) { trkIdx = i; trk = trackDef(i); buildTrack(trk); placeGrid(); }

cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag); cv.addEventListener('lostpointercapture', endDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keyL = true; e.preventDefault(); audioInit(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keyR = true; e.preventDefault(); audioInit(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'paused') resumeGame(); else pauseGame(); }
  else if ((k === 'Enter' || k === ' ') && state === 'menu' && document.activeElement === document.body) { e.preventDefault(); audioInit(); startRace(trkIdx); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keyL = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keyR = false;

addEventListener('blur', () => { keyL = keyR = false; });

function resize() {

  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

}
addEventListener('resize', resize);
