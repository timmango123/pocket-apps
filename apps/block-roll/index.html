<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>石碑翻滾</title>
<style>
:root{
  --ink:#3a3226; --ink2:#7a6c58; --card:#fffaf0f0; --card2:#f4ecdc; --line:#e4d8c2; --gold:#d4a72c; --gold2:#b8891a; --teal:#2e5e6e; --teal2:#3f7a8c;
  --ov:#f3e9d6b0; --sel:linear-gradient(180deg,#fbeedd,#e6eef5); --btnsh:#c7b896; --pip:#e6dccb;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#efe6d2; --ink2:#b4a88f; --card:#1c2236f0; --card2:#252c44; --line:#323a56; --gold:#e6bd4a; --gold2:#c9a02c; --teal:#5d9fb2; --teal2:#7cb8c9;
    --ov:#070b1cb8; --sel:linear-gradient(180deg,#0d1430,#1a2244); --btnsh:#0a0e1e; --pip:#323a56; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e9dcc6;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme: dark){ html,body{background:#0b1024} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #3a2a1022;display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 10px #3a2a1022;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.lvname{font-weight:800;font-size:16px;white-space:nowrap}
.diff{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}
.pips i{width:5px;height:10px;border-radius:2px;background:var(--pip)}
.stat{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.2}
.stat b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.tb{width:60px;height:58px;border-radius:16px;background:var(--card);box-shadow:0 4px 12px #3a2a1026;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink2);position:relative}
.tb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tb:active{transform:scale(.94)}
.tb[disabled]{opacity:.4}
.tb.on{background:var(--teal);color:#fff}.tb.on svg{stroke:#fff}
.tb .bdg{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#3a2a10;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tb.swap{background:linear-gradient(180deg,#f3d27a,#d9ae3c);color:#3a2a10}.tb.swap svg{stroke:#3a2a10}
.zoom{position:fixed;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 60px);z-index:5}
.zoom.on{background:var(--teal)}.zoom.on svg{stroke:#fff}
.pad{position:fixed;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 80px);width:148px;height:148px;z-index:5}
.pad button{position:absolute;width:56px;height:56px;border-radius:16px;background:var(--card);box-shadow:0 4px 12px #3a2a1030;display:grid;place-items:center}
.pad button:active{transform:scale(.92);background:var(--card2)}
.pad svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pad .pn{right:4px;top:4px}.pad .pe{right:4px;bottom:4px}.pad .ps{left:4px;bottom:4px}.pad .pw{left:4px;top:4px}
.pad .pn svg{transform:rotate(45deg)}.pad .pe svg{transform:rotate(135deg)}.pad .ps svg{transform:rotate(225deg)}.pad .pw svg{transform:rotate(315deg)}
.pad .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;color:var(--ink2);pointer-events:none;background:var(--card);padding:2px 6px;border-radius:8px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px #2a1e0a44;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--line)}
.card h2{margin:4px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;background:linear-gradient(180deg,#4b8a9c,#2e5e6e);color:#fff;box-shadow:0 5px 0 #1d3f4a,0 8px 18px #1d3f4a44}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d3f4a}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--btnsh)}
.btn.gold{background:linear-gradient(180deg,#f3d27a,#d4a72c);color:#3a2a10;box-shadow:0 5px 0 #a07a14,0 8px 18px #a07a1444}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0;color:var(--pip)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #a07a14;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 6px;font-size:14px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start}
.ttl{margin-top:8vh;text-align:center;width:100%}
.ttl h1{font-size:52px;margin:0;letter-spacing:8px;color:#3a2a10;text-shadow:0 3px 0 #f6e3b0,0 10px 26px #a07a1466}
@media (prefers-color-scheme: dark){ .ttl h1{color:#f3dfa8;text-shadow:0 3px 0 #6b5216,0 0 30px #e6bd4a55} }
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:10px;font-size:15px;letter-spacing:2px}
.tbtns{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 24px);display:flex;flex-direction:column;align-items:center;gap:0;padding:0 24px}
.tbtns .btn{max-width:320px}
@media (max-height:600px){ .ttl{margin-top:2vh}.ttl h1{font-size:38px} .tbtns{position:static;margin-top:12px} #title{flex-direction:column;align-items:center} }
#select{align-items:stretch;padding:0;background:var(--sel)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 6px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--pip);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#4f9a86}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.selsum b{color:var(--ink)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--sab) + 20px);touch-action:pan-y}
.seg{display:flex;align-items:center;gap:8px;margin:12px 2px 8px;font-weight:800;font-size:14px}
.seg i{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px #0002}
.seg span{font-size:11px;font-weight:600;color:var(--ink2)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lt{aspect-ratio:1/1.12;border-radius:15px;background:var(--card);box-shadow:0 3px 0 var(--btnsh),0 6px 14px #3a2a1018;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:52px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--pip);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:70%;height:5px;border-radius:3px;background:var(--pip);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--gold)}
.lt.lock{opacity:.55;box-shadow:0 3px 0 var(--btnsh)}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:8;background:#2a2418ee;color:#fff3d6;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:60px;height:52px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;text-align:left;font-size:15px;font-weight:700}
.opt small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.badge{display:inline-block;margin:4px 0 0;padding:4px 10px;border-radius:10px;background:var(--card2);font-size:12px;font-weight:700;color:var(--ink2)}
.shareimg{max-width:100%;border-radius:14px;margin-top:8px}
@media (orientation:landscape) and (max-height:520px){
  .bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--sat) + 60px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) 6px;gap:6px}
  .tb{width:58px;height:50px}
  .pad{right:calc(var(--sar) + 80px);bottom:calc(var(--sab) + 10px)}
  .zoom{right:auto;left:calc(var(--sal) + 10px)}
}
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .lt:hover{filter:brightness(1.03)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="pips" id="hPips"></span></div>
    </div>
    <div class="stat">步數 <b id="hMoves">0</b><br>最少 <span id="hOpt">0</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<button class="ibtn zoom hidden" id="bZoom" aria-label="放大跟隨" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
<div class="bottom hidden" id="bottom">
  <button class="tb" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="tb" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示<span class="bdg" id="hintN">3</span></button>
  <button class="tb swap hidden" id="bSwap" aria-label="切換方塊"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>切換</button>
  <button class="tb" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
  <button class="tb" id="bPadT" aria-label="方向鍵" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l3 3h-6zM12 21l3-3H9zM3 12l3-3v6zM21 12l-3-3v6z"/></svg>方向鍵</button>
</div>

<div class="pad hidden" id="pad" aria-label="方向鍵盤">
  <button class="pn" data-d="0" aria-label="北"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <button class="pe" data-d="1" aria-label="東"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <button class="ps" data-d="2" aria-label="南"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <button class="pw" data-d="3" aria-label="西"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <span class="lbl">翻滾</span>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>石碑翻滾</h1>
    <div class="sub">翻滾石碑・直立落進雲端神殿的洞口</div>
  </div>
  <div class="tbtns">
    <button class="btn gold" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2" style="width:100%;max-width:320px"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tSet">設定</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pDemo">看示範</button></div>
  <div class="row2"><button class="btn sec" id="pHelp">說明</button><button class="btn sec" id="pSet">設定</button></div>
  <button class="btn sec" id="pSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">石碑歸位！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>最少<b id="wOpt">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn gold" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wDemo">看示範</button></div>
  <div class="row2"><button class="btn sec" id="wShare">分享成績</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="opt"><div>音效<small>落地、開關與過關音效</small></div><button class="sw" id="oSound" role="switch" aria-checked="true" aria-label="音效"><span class="trk"></span></button></div>
  <div class="opt"><div>震動<small>支援的手機上提供觸覺回饋</small></div><button class="sw" id="oVib" role="switch" aria-checked="true" aria-label="震動"><span class="trk"></span></button></div>
  <div class="opt"><div>方向鍵盤<small>在右下角顯示斜向方向鍵</small></div><button class="sw" id="oPad" role="switch" aria-checked="false" aria-label="方向鍵盤"><span class="trk"></span></button></div>
  <div class="opt"><div>滑動轉 45°<small>開啟後：上滑＝往右上（北），右滑＝往右下（東）</small></div><button class="sw" id="oRot" role="switch" aria-checked="false" aria-label="滑動轉 45 度"><span class="trk"></span></button></div>
  <button class="btn" id="oOk">完成</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機關</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="shareov"><div class="card">
  <h2>分享成績</h2>
  <p>長按或右鍵圖片即可儲存。</p>
  <img id="shareImg" class="shareimg" alt="成績圖">
  <button class="btn" id="shOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
// Tiles: 0 void, 1 floor, 2 fragile, 3 goal, 4 bridge, 5 light switch, 6 heavy switch, 7 split pad
// Level def: {r:"rows/joined", sw:[[group,mode],...] (row-major order of switch cells; mode 0 toggle,1 on,2 off),

/* ---------------- in-level save ----------------
   Every level in progress is kept as the list of moves from the start (plus falls, hints left and the selected cube),
   at most SAVE_MAX levels, newest first. On load the moves are replayed with the game's own rules: a save that does not
   replay cleanly (wrong level, a move that falls or wins, bad numbers) is dropped instead of putting the slab somewhere
   it can't be. Written after every settled move and again on pagehide / when the tab is hidden. */
var SAVE_MAX = 8;
function readSaves(){ var o = sget('saves', {}); return isObj(o) ? o : {}; }
function saveGame(){
  if (!L || demo || (status !== 'play' && status !== 'paused' && status !== 'intro')) return;
  var mv = hist.map(function(h){ return h.mv; }), f = falls;
  // a roll still in the air: keep it only once it is known to land safely (a fall counts as a step, a win isn't saved)
  if (anim && (anim.kind === 'tumble' || anim.kind === 'drop' || anim.kind === 'roll' && (anim.r.ev.fail || anim.r.ev.win) || anim.kind === 'win')) { mv.pop(); if (anim.kind !== 'win' && !(anim.kind === 'roll' && anim.r.ev.win)) f++; }
  if (!mv.length && !f && hintsLeft === 3) { clearSave(levelN); return; }
  var sv = readSaves(), sel = S && !S.s && !(anim && anim.kind !== 'split') ? (activeCell === S.b ? 1 : 0) : 0;
  sv[levelN] = { mv: mv, f: f, hl: hintsLeft, act: sel, t: Date.now() };
  var ks = Object.keys(sv).sort(function(a, b){ return ((sv[b] && sv[b].t) || 0) - ((sv[a] && sv[a].t) || 0); });
  for (var i = SAVE_MAX; i < ks.length; i++) delete sv[ks[i]];
  sset('saves', sv);
}
function clearSave(n){ var sv = readSaves(); if (sv[n]) { delete sv[n]; sset('saves', sv); } }
function loadSave(n, L2){
  var g = readSaves()[n];

  var s = initState(L2), h = [];
  for (var i = 0; i < g.mv.length; i++) {
    var mv = g.mv[i]; if (!isInt(mv, 0, s.s ? 3 : 7)) return null;
    var r = doMove(L2, s, mv); if (r.ev.fail || r.ev.win) return null;
    h.push({ S: s, active: s.s ? -1 : (mv >> 2 ? s.b : s.a), mv: mv }); s = r.S;

}

function restartQuiet(){ S = initState(L); hist = []; falls = 0; anim = null; queued = null; hint = null; activeCell = -1; brokenCell = -1; syncBridges(true); updateHud(); }

/* ---------------- hints & demo ---------------- */
var hintMemo = {};
// what the game looks like right now; a hint or demo whose search finishes after this changed is thrown away
function sig(){ return levelN + '|' + status + '|' + hist.length + '|' + falls + '|' + (S ? stateKey(L, S) : '') + '|' + (anim ? 1 : 0) + '|' + (demo ? 1 : 0); }
function solutionFrom(cb){
  if (solCache[levelN]) { cb(solCache[levelN]); return; }
  toast('神殿推算中…', 900);
  var n = levelN, L0 = L;
  setTimeout(function(){
    if (levelN !== n || L !== L0) return;
    var r = solve(L0, null, { limit: 2500000 });
    if (r && r.len > 0) solCache[n] = r;
    cb(r);
  }, 40);
}
// index of the current position on the cached shortest path from the start (-1 when off it)
function pathIndex(r){
  if (!r.keys) { var s = initState(L); r.keys = [stateKey(L, s)]; for (var i = 0; i < r.sol.length - 1; i++) { s = doMove(L, s, r.sol[i]).S; r.keys.push(stateKey(L, s)); } }
  return r.keys.indexOf(stateKey(L, S));
}
function cloneS(s){ return { s: s.s, p: s.p, o: s.o, a: s.a, b: s.b, m: s.m }; }
function useHint(){
  if (status !== 'play' || hintsLeft <= 0) return;
  interruptDemo();
  if (anim && !settleAnim()) return;
  audio(); SFX.ui();
  var k = stateKey(L, S);
  // the arrow is already showing for this exact position: point at it again instead of charging a second hint
  if (hint && hint.k === k) { if (hint.cube >= 0) activeCell = hint.cube; toast('照箭頭方向翻滾（還需 ' + hint.len + ' 步）', 2000); return; }
  var give = function(mv, len){
    hintsLeft--; hint = { d: mv & 3, k: k, cube: S.s ? -1 : (mv >> 2 ? S.b : S.a), len: len };
    if (hint.cube >= 0) activeCell = hint.cube;
    toast('照箭頭方向翻滾（剩 ' + hintsLeft + ' 次提示，還需 ' + len + ' 步）', 2600);
    updateHud(); saveGame();
  };
  var c = solCache[levelN], i = c ? pathIndex(c) : -1;
  if (i >= 0) { give(c.sol[i], c.len - i); return; }
  var mk = levelN + ':' + k;
  if (hintMemo[mk]) { give(hintMemo[mk].mv, hintMemo[mk].len); return; }
  toast('神殿推算中…', 900);
  var sg = sig();
  setTimeout(function(){
    if (sig() !== sg) return; // the player moved meanwhile: no hint for a stale position, nothing charged
    var r = solve(L, cloneS(S), { limit: 2500000 });
    if (sig() !== sg) return;
    if (r.len === -2) toast('這個局面太複雜，推算不出來；悔棋幾步再試（沒有扣提示）', 2800);
    else if (r.len < 0) toast('這個局面已經走不到終點了，試試悔棋或重來（沒有扣提示）', 2800);
    else { hintMemo[mk] = { mv: r.sol[0], len: r.len }; give(r.sol[0], r.len); }
  }, 40);
}
// 看示範 from the pause menu keeps the player's own position and puts it back when the demo ends or is stopped,
// so a demo can neither wipe a half-played level nor be finished by the player for stars.
function startDemo(){
  var snap = status === 'paused' && (hist.length || falls) ? { S: S, hist: hist.slice(), falls: falls, active: activeCell, hl: hintsLeft } : null;
  hint = null; demo = null;
  status = 'play'; showOnly(null); showGameUi(true); layout();
  var n = levelN;
  solutionFrom(function(r){
    if (levelN !== n || status !== 'play' || demo) return;
    if (!r || r.len <= 0) { toast('示範暫時無法使用'); return; }
    restartQuiet();
    demo = { sol: r.sol, i: 0, wait: 0.5, running: true, snap: snap };
    toast('示範中：最短 ' + r.len + ' 步（點畫面可停止）', 2500);
  });
}
function endDemo(msg){
  var d = demo; if (!d) return false;
  demo = null; anim = null; queued = null; hint = null; brokenCell = -1;
  if (d.snap) { S = d.snap.S; hist = d.snap.hist; falls = d.snap.falls; activeCell = d.snap.active; hintsLeft = d.snap.hl; syncBridges(true); updateHud(); }
  else restartQuiet();
  if (msg) toast(msg + (d.snap ? '（已回到你原本的位置）' : ''));
  return true;
}
function interruptDemo(){ return endDemo('已停止示範'); }
function stopDemo(){ endDemo(''); }

/* ---------------- share ---------------- */
function shareResult(){
  var mv = moveCount(), st = stars3(mv);
  var c = document.createElement('canvas'); c.width = 600; c.height = 760; var g = c.getContext('2d');
  var gr = g.createLinearGradient(0, 0, 0, 760); gr.addColorStop(0, '#f6d9b8'); gr.addColorStop(1, '#cfe3f2'); g.fillStyle = gr; g.fillRect(0, 0, 600, 760);
  try { g.drawImage(cv, 0, 0, cv.width, cv.height, 40, 170, 520, 520 * cv.height / cv.width > 420 ? 420 : 520 * cv.height / cv.width); } catch (e) {}
  g.fillStyle = '#3a2a10'; g.textAlign = 'center'; g.font = 'bold 54px system-ui, sans-serif'; g.fillText('石碑翻滾', 300, 80);
  g.font = 'bold 30px system-ui, sans-serif'; g.fillText('第 ' + levelN + ' 關・' + mv + ' 步（最少 ' + L.opt + '）', 300, 130);
  g.font = '64px system-ui, sans-serif'; g.fillStyle = '#d4a72c'; g.fillText('★'.repeat(st) + '☆'.repeat(3 - st), 300, 730);
  var text = '我在「石碑翻滾」第 ' + levelN + ' 關用了 ' + mv + ' 步（最少 ' + L.opt + ' 步）' + '★'.repeat(st);
  c.toBlob(function(blob){
    var done = false;
    try {
      if (blob && navigator.canShare && window.File) { var f = new File([blob], 'block-roll-' + levelN + '.png', { type: 'image/png' }); if (navigator.canShare({ files: [f] })) { done = true; navigator.share({ files: [f], text: text }).catch(function(){}); } }
    } catch (e) {}
    if (!done) { $('shareImg').src = c.toDataURL('image/png'); showOnly('shareov'); }
  }, 'image/png');
}

/* ---------------- input ---------------- */
// one record per finger, so a second thumb that lands before the first has lifted never cancels the first one's swipe
var ptrs = {};
function mapSwipe(dx, dy){
  if (opts.rot) { if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3; return dy < 0 ? 0 : 2; }
  if (dx >= 0 && dy < 0) return 0; if (dx >= 0 && dy >= 0) return 1; if (dx < 0 && dy >= 0) return 2; return 3;
}
var SWIPE = 24;
cv.addEventListener('pointerdown', function(e){
  audio();
  if (status !== 'play') return;
  e.preventDefault();
  // a touch that stops the demo only stops it: it doesn't also roll the slab
  if (interruptDemo()) { ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, done: true }; return; }
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, done: false };
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove', function(e){
  var p = ptrs[e.pointerId]; if (!p || p.done) return;
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (dx * dx + dy * dy >= SWIPE * SWIPE) { p.done = true; tryMove(mapSwipe(dx, dy)); }
  e.preventDefault();
});
cv.addEventListener('pointerup', function(e){
  var p = ptrs[e.pointerId]; if (!p) return;
  delete ptrs[e.pointerId];
  if (p.done || status !== 'play') return;
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (dx * dx + dy * dy >= SWIPE * SWIPE) { tryMove(mapSwipe(dx, dy)); return; }
  if (!S || S.s || demo) return;
  // tap a cube to select it (also right after a cube's roll: the roll is finished first instead of the tap being lost)
  if (anim && anim.kind !== 'roll' && anim.kind !== 'split') return;
  if (anim && !settleAnim()) return;
  if (S.s) return;
  var w = toWorld(e.clientX, e.clientY + cam.s * 0.5), best = -1, bd = 1.6;
  [S.a, S.b].forEach(function(c){ var d = Math.hypot(c % L.w + 0.5 - w[0], ((c / L.w) | 0) + 0.5 - w[1]); if (d < bd) { bd = d; best = c; } });
  if (best >= 0 && best !== activeCell) { activeCell = best; SFX.ui(); vib(8); flash.push({ c: [best], t: 0.35 }); saveGame(); }
});
cv.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; });
var padBtns = document.querySelectorAll('#pad button');
for (var pb = 0; pb < padBtns.length; pb++) (function(b){
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); if (status !== 'play' || interruptDemo()) return; tryMove(+b.getAttribute('data-d')); });
})(padBtns[pb]);
window.addEventListener('keydown', function(e){
  var k = e.key;
  if (status === 'play') {
    var map = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
    if (map[k] !== undefined) { e.preventDefault(); if (e.repeat && anim) return; if (interruptDemo()) return; tryMove(map[k]); return; }
    if (k === ' ') { e.preventDefault(); swapCube(); return; }
    if (k === 'z' || k === 'Z') { undo(); return; }
    if (k === 'r' || k === 'R') { restart(); return; }
    if (k === 'h' || k === 'H') { useHint(); return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { pauseGame(); return; }
  } else if (status === 'won' && (k === 'Enter' || k === ' ')) { e.preventDefault(); if (levelN < NL) startLevel(levelN + 1); }
});
function pauseGame(){
  if (status !== 'play') return;
  stopDemo(); status = 'paused';
  var pr = prog[levelN]; $('pInfo').textContent = '第 ' + levelN + ' 關・難度 ' + diffN(levelN) + '・最少 ' + L.opt + ' 步' + (pr ? '・最佳 ' + pr.b + ' 步' : '');
  showOnly('pause');
}
function resume(){ status = 'play'; showOnly(null); showGameUi(true); layout(); }
function on(id, fn){ $(id).addEventListener('click', function(e){ audio(); fn(e); }); }
on('tPlay', function(){ SFX.ui(); startLevel(playTarget()); });
// 繼續冒險 goes back to a half-played level first, else to the first level not yet cleared
function playTarget(){ var n = lastLevel(); if (hasSave(n) && isUnlocked(n)) return n; for (var i = 1; i <= NL; i++) if (!prog[i]) return i; return n; }
on('tSelect', function(){ SFX.ui(); openSelect(); });
on('tHelp', function(){ SFX.ui(); helpBack = 'title'; openHelp(); });
on('tSet', function(){ SFX.ui(); openSettings('title'); });
on('sBack', function(){ SFX.ui(); openTitle(); });
on('unlockSw', function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); SFX.ui(); vib(10); buildSelect(); });
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.getAttribute('data-n');
  if (!isUnlocked(n)) { SFX.bump(); toast('先通過第 ' + (n - 1) + ' 關，或開啟「解鎖全部關卡」'); return; }
  SFX.ui(); startLevel(n);
});
on('bPause', function(){ SFX.ui(); pauseGame(); });
on('bMute', function(){ opts.sound = !opts.sound; saveOpts(); if (opts.sound) SFX.ui(); });
on('bUndo', function(){ undo(); });
on('bRestart', function(){ restart(); });
on('bHint', function(){ useHint(); });
on('bSwap', function(){ swapCube(); });
on('bZoom', function(){ zoom = !zoom; opts.zoom = zoom; saveOpts(); $('bZoom').classList.toggle('on', zoom); $('bZoom').setAttribute('aria-pressed', zoom ? 'true' : 'false'); SFX.ui(); });
on('bPadT', function(){ opts.pad = !opts.pad; saveOpts(); showGameUi(true); SFX.ui(); layout(); });
on('pResume', function(){ SFX.ui(); resume(); });
on('pRestart', function(){ resume(); restart(); });
on('pDemo', function(){ SFX.ui(); startDemo(); });
on('pHelp', function(){ SFX.ui(); helpBack = 'pause'; openHelp(); });
on('pSet', function(){ SFX.ui(); openSettings('pause'); });
on('pSelect', function(){ SFX.ui(); openSelect(); });
var helpBack = 'title';
on('hOk', function(){ SFX.ui(); if (helpBack === 'pause') showOnly('pause'); else openTitle(); });
on('iOk', function(){ SFX.ui(); status = 'play'; showOnly(null); showGameUi(true); toast('第 ' + levelN + ' 關・最少 ' + L.opt + ' 步'); });
on('wNext', function(){ SFX.ui(); if (levelN < NL) startLevel(levelN + 1); });
on('wRetry', function(){ SFX.ui(); startLevel(levelN); });
on('wDemo', function(){ SFX.ui(); startDemo(); });
on('wShare', function(){ SFX.ui(); shareResult(); });
on('wSelect', function(){ SFX.ui(); openSelect(); });
on('shOk', function(){ SFX.ui(); showOnly('win'); });
function swToggle(id, key){ on(id, function(){ opts[key] = !opts[key]; $(id).setAttribute('aria-checked', opts[key] ? 'true' : 'false'); saveOpts(); SFX.ui(); if (key === 'vib' && opts.vib) vib(20); }); }
swToggle('oSound', 'sound'); swToggle('oVib', 'vib'); swToggle('oPad', 'pad'); swToggle('oRot', 'rot');
on('oOk', function(){ SFX.ui(); if (settingsBack === 'pause') { showOnly('pause'); } else openTitle(); });

window.addEventListener('resize', function(){ layout(); });
window.addEventListener('pagehide', function(){ saveGame(); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { saveGame(); running = false; if (raf) cancelAnimationFrame(raf); raf = 0; if (status === 'play' && !anim) pauseGame(); }
  else { running = true; last = 0; if (!raf) raf = requestAnimationFrame(frame); }
});

/* ---------------- test hooks ---------------- */
window.__game = {
  state: function(){ return { status: status, level: levelN, moves: moveCount(), animating: !!anim, split: !!(S && !S.s), active: S && !S.s ? (activeCell === S.b ? 1 : 0) : 0, cubes: S && !S.s ? [S.a, S.b] : null, opt: L ? L.opt : 0 }; },
  center: function(c){ var p = P(c % L.w + 0.5, ((c / L.w) | 0) + 0.5, 0.5); return { x: p[0], y: p[1] }; },
  more: function(){ return { falls: falls, hints: hintsLeft, hint: hint ? hint.d : -1, hintCube: hint ? hint.cube : -1, demo: !!demo, hist: hist.map(function(h){ return h.mv; }), key: S ? stateKey(L, S) : -1, activeCell: activeCell, zoom: zoom }; },
  // screen box of the whole board (top faces) under the settled camera
  board: function(){ var t = camTarget(), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (var c = 0; c < L.N; c++) if (L.kind[c]) for (var k = 0; k < 4; k++) { var x = c % L.w + (k & 1), y = ((c / L.w) | 0) + (k >> 1), px = t.ox + (x - y) * t.s, py = t.oy + (x + y) * t.s * 0.5; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); } return { l: x0, r: x1, t: y0, b: y1, s: t.s }; }
};

updateMuteIcon();
openTitle();
layout();
raf = requestAnimationFrame(frame);
})();

</script>
</body>
