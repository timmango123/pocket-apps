<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>文字工具箱</title>
<style>
/* Proofing desk: measuring-strip stats, lettered operation drawers, teal highlighter accent with amber change marks */
:root{
  --bg:#e9ebee; --surface:#ffffff; --sunk:#f3f4f6; --ink:#14171c; --muted:#5a616c; --faint:#878e99;
  --line:#d5d9df; --line-strong:#b9bfc8; --accent:#0d6f78; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --amber:#a35d00; --amber-soft:#fdf0d9; --danger:#b42318; --danger-soft:#fde4e1;
  --shadow:0 12px 32px rgba(15,20,30,.18);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#181b20; --sunk:#13161a; --ink:#e4e7ec; --muted:#9aa2ae; --faint:#6d7580;
  --line:#2a2f37; --line-strong:#3a414b; --accent:#4fc1ca; --accent-ink:#06191b; --accent-soft:#16343a;
  --amber:#f2b552; --amber-soft:#3a2b12; --danger:#f97066; --danger-soft:#3b1a17;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#181b20; --sunk:#13161a; --ink:#e4e7ec; --muted:#9aa2ae; --faint:#6d7580;
  --line:#2a2f37; --line-strong:#3a414b; --accent:#4fc1ca; --accent-ink:#06191b; --accent-soft:#16343a;
  --amber:#f2b552; --amber-soft:#3a2b12; --danger:#f97066; --danger-soft:#3b1a17;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:60px;padding-top:4px}
.brand{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:750;letter-spacing:.02em;white-space:nowrap}
.brand small{font:11px var(--mono);color:var(--faint);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 10px;font-size:14px;font-weight:600}
.ib svg{width:19px;height:19px;flex:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lab{font:600 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
/* input */
.io-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line)}
.io-head .lab{flex:1}
.mini{min-height:36px;min-width:44px;padding:0 10px;border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);position:relative}
.mini::after{content:"";position:absolute;inset:-4px 0}
.mini:disabled{opacity:.4;cursor:default}
textarea.io{display:block;width:100%;height:30vh;min-height:150px;resize:vertical;border:0;background:transparent;padding:12px;font-size:15px;line-height:1.6;outline:none;border-radius:0 0 10px 10px;font-family:var(--sans)}
textarea.io:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft)}
#output{background:var(--sunk)}
/* stats strip */
.stats{margin:10px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;cursor:pointer;width:100%;padding:0;text-align:left}
.stat{padding:8px 10px 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;position:relative}
.stat:nth-child(3n){border-right:0}
.stat:nth-child(n+4){border-bottom:0}
.stat b{display:block;font:650 19px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 8px);opacity:.7}
.stats-more{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;margin-top:-6px;padding:14px 12px 10px;background:var(--surface);font-size:13px}
.stats-more .row{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-bottom:8px}
.stats-more .row b{color:var(--ink);font-family:var(--mono)}
.top10{display:flex;flex-wrap:wrap;gap:6px}
.top10 span{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--sunk)}
.top10 em{font-style:normal;font-size:16px}
.top10 i{font-style:normal;font:11px var(--mono);color:var(--muted)}
.hint{font-size:12px;color:var(--amber);margin:6px 2px 0}
/* ops */
.ops{margin-top:14px;display:grid;gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;cursor:pointer;user-select:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .key{font:700 12px var(--mono);width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.grp>summary .nm{font-weight:700;flex:1}
.grp>summary .chev{width:16px;height:16px;color:var(--faint);transition:transform .15s}
.grp[open]>summary .chev{transform:rotate(180deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 10px}
.op{min-height:48px;border:1px solid var(--line);background:var(--sunk);border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;padding:4px 8px;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.25}
.op .sig{font:600 11px var(--mono);color:var(--accent);min-width:2.6em;flex:none}
.op:active{background:var(--accent-soft);border-color:var(--accent)}
.op:disabled{opacity:.42;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 12px 12px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin:0 10px;padding-left:2px;padding-top:10px}
.opts label{display:inline-flex;align-items:center;gap:6px;min-height:36px;cursor:pointer}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.opts select{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px}
/* find/replace */
.fr{padding:10px;display:grid;gap:8px;border-top:1px dashed var(--line);margin:0 10px 10px;padding-inline:0}
.fr input[type=text]{width:100%;height:44px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px;font-family:var(--mono);font-size:15px}
.fr .frow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.fr .frow label{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.fr .frow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.fr .msg{font-size:13px;min-height:20px}
.fr .msg.err{color:var(--danger)}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* chain + result */
.res{margin-top:14px}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);min-height:52px}
.chain .lab{margin-right:4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:6px;font-size:13px;font-weight:600;padding-left:8px;min-height:32px}
.step .n{font:600 10px var(--mono);color:var(--accent);margin-right:5px}
.step button{border:0;background:none;width:32px;height:32px;cursor:pointer;color:var(--muted);display:grid;place-items:center;position:relative}
.step button::after{content:"";position:absolute;inset:-6px -2px}
.step button svg{width:14px;height:14px}
.arrow{color:var(--faint);font-size:12px}
.chain .empty{color:var(--faint);font-size:13px}
.res-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.res-foot .delta{flex:1 1 100%;font-size:13px;color:var(--muted)}
.res-foot .delta b{color:var(--amber);font-family:var(--mono)}
.res-foot .btn{flex:1 1 0}
.busy{display:inline-flex;align-items:center;gap:8px;color:var(--amber);font-size:13px}
.busy i{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
footer.note{margin-top:18px;font-size:11px;color:var(--faint);line-height:1.6}
/* dialog + toast */
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,14,20,.45)}
.dlg .box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg .bh{display:flex;align-items:center;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
.dlg .bh h3{flex:1;margin:0;font-size:16px}
.dlg ul{list-style:none;margin:0;padding:0;overflow:auto}
.dlg li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.dlg li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dlg li .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.dlg li .m{font:11px var(--mono);color:var(--faint);margin-top:2px}
.dlg .empty{padding:24px 16px;color:var(--faint);text-align:center}
.dlg .bf{padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
@media (max-height:600px){.dlg{place-items:start center;overflow:auto}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (hover:hover){
  .ib:hover,.mini:hover:not(:disabled){background:var(--sunk);border-color:var(--line-strong)}
  .op:hover:not(:disabled){border-color:var(--accent);background:var(--surface)}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .stats:hover{border-color:var(--line-strong)}
  .dlg li button:hover{background:var(--sunk)}
  .step button:hover{color:var(--danger)}
}
@media (min-width:600px){
  .stats{grid-template-columns:repeat(6,1fr)}
  .stat{border-bottom:0}
  .stat:nth-child(3n){border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .grid{grid-template-columns:repeat(4,1fr)}
}
/* desktop */
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .ops{grid-column:1/-1;grid-template-columns:repeat(4,1fr);align-items:start;margin-top:0;order:-1}
  .grid{grid-template-columns:1fr 1fr;gap:5px}
  .op{min-height:44px;font-size:13px;padding:4px 8px}
  .op .sig{display:none}
  .opts{padding-top:6px;padding-bottom:8px}
  .opts label{min-height:30px}
  .res{margin-top:0}
  textarea.io{height:46vh}
  .stats{grid-template-columns:repeat(6,1fr)}
  .stat{border-bottom:0}
  .stat:nth-child(3n){border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
}
.jump{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);font-size:13px}
.jump span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jump button{min-height:44px;border:0;border-radius:7px;padding:0 12px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
@media (min-width:900px){.jump{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>文字工具箱</h1><small>TEXT·KIT</small></div>
    <button class="ib" id="histBtn" aria-label="歷史紀錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>歷史</button>
    <button class="ib" id="themeBtn" aria-label="切換深淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </header>

  <div class="layout">
    <section>
      <div class="panel">
        <div class="io-head"><span class="lab">輸入</span>
          <button class="mini" id="pasteBtn">貼上</button>
          <button class="mini" id="clearBtn">清空</button>
        </div>
        <textarea class="io" id="input" spellcheck="false" aria-label="輸入文字" placeholder="在這裡貼上或輸入文字"></textarea>
      </div>
      <button class="stats" id="stats" aria-expanded="false" aria-controls="statsMore" title="點擊看詳細統計">
        <div class="stat"><b id="sChars">0</b><span>字元（含空白）</span></div>
        <div class="stat"><b id="sCharsNoWs">0</b><span>字元（不含空白）</span></div>
        <div class="stat"><b id="sHan">0</b><span>中文字</span></div>
        <div class="stat"><b id="sWords">0</b><span>英文詞</span></div>
        <div class="stat"><b id="sLines">0</b><span>行 · <i id="sParas" style="font-style:normal">0</i> 段</span></div>
        <div class="stat"><b id="sBytes">0</b><span>位元組 UTF-8</span></div>
      </button>
      <div class="stats-more" id="statsMore" hidden>
        <div class="row"><span>標點 <b id="sPunct">0</b></span><span>數字 <b id="sDigits">0</b></span><span>空白 <b id="sWs">0</b></span><span>emoji <b id="sEmoji">0</b></span></div>
        <div class="lab" style="margin-bottom:6px">最常出現的 10 個字</div>
        <div class="top10" id="top10"></div>
      </div>
      <p class="hint" id="bigHint" hidden></p>
    </section>

    <section class="ops" id="ops">
      <details class="grp" open>
        <summary><span class="key">A</span><span class="nm">轉換</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="grid">
          <button class="op" data-op="s2t"><span class="sig">简→繁</span>簡體轉繁體</button>
          <button class="op" data-op="t2s"><span class="sig">繁→简</span>繁體轉簡體</button>
          <button class="op" data-op="f2h"><span class="sig">Ａ→A</span>全形轉半形</button>
          <button class="op" data-op="h2f"><span class="sig">A→Ａ</span>半形轉全形</button>
          <button class="op" data-op="upper"><span class="sig">AB</span>英文大寫</button>
          <button class="op" data-op="lower"><span class="sig">ab</span>英文小寫</button>
          <button class="op" data-op="title"><span class="sig">Ab</span>每字首大寫</button>
          <button class="op" data-op="sentence"><span class="sig">A.</span>句首大寫</button>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="optTw" checked>簡→繁套用台灣用語（软件→軟體）</label>
          <label><input type="checkbox" id="optAlnum">全半形只轉英數、保留標點</label>
        </div>
      </details>
      <details class="grp" open>
        <summary><span class="key">B</span><span class="nm">清理</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="grid">
          <button class="op" data-op="rmEmpty"><span class="sig">¶×</span>去除空行</button>
          <button class="op" data-op="mergeEmpty"><span class="sig">¶¶→¶</span>多空行併為一</button>
          <button class="op" data-op="trim"><span class="sig">␣a␣</span>去行首尾空白</button>
          <button class="op" data-op="rmSpace"><span class="sig">␣×</span>去全部空白</button>
          <button class="op" data-op="dedupe"><span class="sig">≡→=</span>去除重複行</button>
          <button class="op" data-op="stripHtml"><span class="sig">&lt;/&gt;</span>移除 HTML 標籤</button>
          <button class="op" data-op="spacing"><span class="sig">中 A</span>中英間加空格</button>
          <button class="op" data-op="punct"><span class="sig">,→，</span>統一中文標點</button>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="optDedupCase">去重忽略大小寫</label>
          <label><input type="checkbox" id="optDedupTrim" checked>去重忽略前後空白</label>
        </div>
      </details>
      <details class="grp" open>
        <summary><span class="key">C</span><span class="nm">排序</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="grid">
          <button class="op" data-op="sortAsc"><span class="sig">A→Z</span>升冪排序</button>
          <button class="op" data-op="sortDesc"><span class="sig">Z→A</span>降冪排序</button>
          <button class="op" data-op="sortLen"><span class="sig">短→長</span>依長度排序</button>
          <button class="op" data-op="shuffle"><span class="sig">⤨</span>隨機打亂</button>
          <button class="op" data-op="reverse"><span class="sig">↑↓</span>反轉行序</button>
        </div>
        <div class="opts">
          <label>中文排序依
            <select id="optColl"><option value="zh-Hant">筆畫</option><option value="zh-Hant-u-co-zhuyin">注音</option><option value="zh">拼音</option></select>
          </label>
        </div>
      </details>
      <details class="grp" open>
        <summary><span class="key">D</span><span class="nm">其他</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="grid">
          <button class="op" data-op="lineNo"><span class="sig">1.</span>加行號</button>
          <button class="op" data-op="bullet"><span class="sig">- </span>包成清單</button>
          <button class="op" data-op="nfc"><span class="sig">NFC</span>Unicode 正規化</button>
          <button class="op" id="frToggle" aria-expanded="false" aria-controls="frPanel"><span class="sig">a→b</span>尋找與取代</button>
        </div>
        <div class="fr" id="frPanel" hidden>
          <input type="text" id="frFind" placeholder="尋找" aria-label="尋找" autocomplete="off" spellcheck="false">
          <input type="text" id="frRepl" placeholder="取代為（正規模式可用 $1）" aria-label="取代為" autocomplete="off" spellcheck="false">
          <div class="frow">
            <label><input type="checkbox" id="frRegex">正規表示式</label>
            <label><input type="checkbox" id="frCase">區分大小寫</label>
          </div>
          <div class="msg" id="frMsg" aria-live="polite"></div>
          <button class="btn pri" id="frApply">全部取代（加入處理鏈）</button>
        </div>
      </details>
    </section>

    <section class="res panel" aria-label="結果">
      <div class="chain" id="chain" aria-live="polite"></div>
      <div class="io-head"><span class="lab">結果</span><span id="busy" class="busy" hidden><i></i>處理中…</span></div>
      <textarea class="io" id="output" readonly aria-label="處理結果" placeholder="點選上方的操作，結果會出現在這裡"></textarea>
      <div class="res-foot">
        <div class="delta" id="delta">尚未套用任何操作</div>
        <button class="btn pri" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>複製</button>
        <button class="btn" id="useBtn">用結果取代輸入</button>
        <button class="btn" id="dlBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>下載 .txt</button>
      </div>
    </section>
  </div>
  <footer class="note">文字只在你的瀏覽器中處理，不會上傳。繁簡對照資料取自 OpenCC（Apache-2.0），經精簡後內嵌；繁簡轉換為詞組最長匹配加逐字對照，罕見一對多字仍可能需要人工校對。</footer>
</div>
<div class="jump" id="jump" hidden><span id="jumpTxt"></span><button id="jumpBtn">看結果</button></div>

<div id="toastHost" aria-live="polite"></div>

<script>
"use strict";
/*ZHDATA*/

/* ======== pure text processing (shared with Web Worker) ======== */
function KIT(ZH, hasDOM) {
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("zh-Hant", { granularity: "grapheme" }) : null;
  const graphemes = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);

  /* ---- 繁簡 dictionaries (lazy) ---- */
  let D = null;
  function build() {
    if (D) return D;
    const charMap = str => { const m = new Map(), a = Array.from(str); for (let i = 0; i + 1 < a.length; i += 2) m.set(a[i], a[i + 1]); return m; };
    const phr = str => {
      const m = new Map(); let max = 1; const starts = new Set();
      for (const e of str.split("|")) { const a = Array.from(e); const h = a.length / 2; const k = a.slice(0, h).join(""); m.set(k, a.slice(h).join("")); if (h > max) max = h; starts.add(a[0]); }
      return { m, max, starts };
    };
    const tw = (() => {
      const m = new Map(); let max = 1; const starts = new Set();
      for (const e of ZH.twP.split("|")) { const [k, v] = e.split("\t"); m.set(k, v); const L = Array.from(k).length; if (L > max) max = L; starts.add(Array.from(k)[0]); }
      return { m, max, starts };
    })();
    D = { s2tC: charMap(ZH.s2tC), s2tP: phr(ZH.s2tP), t2sC: charMap(ZH.t2sC), t2sP: phr(ZH.t2sP), tw, twV: charMap(ZH.twV) };
    return D;
  }
  // longest-match phrase pass + per-char fallback; returns [text, changedChars]
  function convert(text, P, C) {
    const a = Array.from(text); let out = "", n = 0;
    for (let i = 0; i < a.length;) {
      const ch = a[i];
      if (P && P.starts.has(ch)) {
        let hit = null, L = Math.min(P.max, a.length - i);
        for (; L >= 1; L--) { const k = a.slice(i, i + L).join(""); const v = P.m.get(k); if (v !== undefined) { hit = v; if (v !== k) { const va = Array.from(v); for (let j = 0; j < Math.max(L, va.length); j++) if (va[j] !== a[i + j]) n++; } break; } }
        if (hit !== null) { out += hit; i += L; continue; }
      }
      const c = C ? C.get(ch) : undefined;
      if (c !== undefined && c !== ch) { out += c; n++; } else out += ch;
      i++;
    }
    return [out, n];
  }
  function s2t(text, tw) {
    const d = build();
    let [r] = convert(text, d.s2tP, d.s2tC);
    if (tw) { [r] = convert(r, d.tw, d.twV); }
    return r;
  }
  function t2s(text) { const d = build(); return convert(text, d.t2sP, d.t2sC)[0]; }

  /* ---- helpers ---- */
  const lines = s => s.split("\n");
  const rnd = n => { const b = new Uint32Array(1); const lim = Math.floor(0x100000000 / n) * n; let x; do { crypto.getRandomValues(b); x = b[0]; } while (x >= lim); return x % n; };
  const collator = loc => { try { return new Intl.Collator(loc, { numeric: true, sensitivity: "variant" }); } catch { return new Intl.Collator(undefined, { numeric: true }); } };
  const HAN = "\\p{Script=Han}";
  const PUNCT = { ",": "，", ".": "。", "!": "！", "?": "？", ";": "；", ":": "：", "(": "（", ")": "）" };

  function stripHtml(s) {
    const pre = s.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li|h[1-6]|tr|blockquote|pre)>/gi, "$&\n").replace(/<(p|div|h[1-6]|tr|blockquote)(\s[^>]*)?>/gi, "\n$&");
    let txt;
    if (hasDOM && typeof DOMParser !== "undefined") {
      const doc = new DOMParser().parseFromString(pre, "text/html");
      doc.querySelectorAll("script,style,template,noscript").forEach(e => e.remove());
      txt = doc.body ? doc.body.textContent : "";
    } else {
      txt = pre.replace(/<(script|style)[\s\S]*?<\/\1>/gi, "").replace(/<!--[\s\S]*?-->/g, "").replace(/<[^>]*>/g, "")
        .replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
    }
    return txt.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
  }

  /* ---- operations: (text, opts) -> text ---- */
  const OPS = {
    s2t: (s, o) => s2t(s, o.tw),
    t2s: s => t2s(s),
    f2h: (s, o) => s.replace(o.alnum ? /[０-９Ａ-Ｚａ-ｚ]/g : /[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(o.alnum ? /(?!)/g : /　/g, " "),
    h2f: (s, o) => s.replace(o.alnum ? /[0-9A-Za-z]/g : /[\x21-\x7E]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(o.alnum ? /(?!)/g : / /g, "　"),
    upper: s => s.toUpperCase(),
    lower: s => s.toLowerCase(),
    title: s => s.replace(/[A-Za-z][A-Za-z'’]*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()),
    sentence: s => s.toLowerCase().replace(/(^|[.!?。！？]\s*|\n\s*)([a-z])/g, (_, p, c) => p + c.toUpperCase()).replace(/\bi\b/g, "I"),
    rmEmpty: s => lines(s).filter(l => l.trim() !== "").join("\n"),
    mergeEmpty: s => s.replace(/\n[ \t　]*(?:\n[ \t　]*)+\n/g, "\n\n"),
    trim: s => lines(s).map(l => l.replace(/^[\s　]+|[\s　]+$/g, "")).join("\n"),
    rmSpace: s => s.replace(/[^\S\n]|　|​/g, ""),
    dedupe: (s, o) => { const seen = new Set(); return lines(s).filter(l => { let k = l; if (o.dTrim) k = k.trim(); if (o.dCase) k = k.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).join("\n"); },
    stripHtml: s => stripHtml(s),
    spacing: s => s
      .replace(new RegExp(`(${HAN})([A-Za-z0-9@#$%^&*+=_/~\\-])`, "gu"), "$1 $2")
      .replace(new RegExp(`([A-Za-z0-9@#$%^&*+=_/~\\-])(${HAN})`, "gu"), "$1 $2"),
    punct: s => s
      .replace(new RegExp(`(${HAN}|[」』）》])[ \\t]*([,.!?;:])(?![\\d\\w])[ \\t]*`, "gu"), (_, a, p) => a + PUNCT[p])
      .replace(new RegExp(`(${HAN})[ \\t]*([,!?;:])[ \\t]*(?=${HAN})`, "gu"), (_, a, p) => a + PUNCT[p])
      .replace(new RegExp(`\\(([^()\\n]*${HAN}[^()\\n]*)\\)`, "gu"), "（$1）"),
    sortAsc: (s, o) => { const c = collator(o.coll); return lines(s).sort(c.compare).join("\n"); },
    sortDesc: (s, o) => { const c = collator(o.coll); return lines(s).sort((a, b) => c.compare(b, a)).join("\n"); },
    sortLen: (s, o) => { const c = collator(o.coll); return lines(s).map(l => [l, graphemes(l).length]).sort((a, b) => a[1] - b[1] || c.compare(a[0], b[0])).map(x => x[0]).join("\n"); },
    shuffle: s => { const a = lines(s); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a.join("\n"); },
    reverse: s => lines(s).reverse().join("\n"),
    lineNo: s => { const a = lines(s); const w = String(a.length).length; return a.map((l, i) => String(i + 1).padStart(w, " ") + ". " + l).join("\n"); },
    bullet: s => lines(s).map(l => l.trim() ? "- " + l : l).join("\n"),
    nfc: s => s.normalize("NFC"),
    replace: (s, o) => { const r = makeRegex(o.find, o.regex, o.cs); if (r.error) throw new Error(r.error); return s.replace(r.re, o.regex ? o.repl : () => o.repl); },
  };
  function makeRegex(find, regex, cs) {
    if (!find) return { error: "請輸入要尋找的文字" };
    try { return { re: new RegExp(regex ? find : find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g" + (cs ? "" : "i") + "u") }; }
    catch (e) { return { error: "正規表示式語法錯誤：" + e.message.replace(/^Invalid regular expression: /, "") }; }
  }
  function countMatches(s, o) { const r = makeRegex(o.find, o.regex, o.cs); if (r.error) return r; let n = 0; for (const m of s.matchAll(r.re)) { n++; if (n > 1e6) break; } return { n }; }

  /* change count: lines changed when line count differs, else chars changed */
  function delta(a, b) {
    if (a === b) return { n: 0, unit: "處" };
    const la = lines(a), lb = lines(b);
    if (la.length === lb.length) {
      let n = 0;
      for (let i = 0; i < la.length; i++) if (la[i] !== lb[i]) {
        const x = Array.from(la[i]), y = Array.from(lb[i]);
        if (x.length === y.length) { for (let j = 0; j < x.length; j++) if (x[j] !== y[j]) n++; }
        else { // count changed runs
          let p = 0; while (p < x.length && p < y.length && x[p] === y[p]) p++;
          let q = 0; while (q < x.length - p && q < y.length - p && x[x.length - 1 - q] === y[y.length - 1 - q]) q++;
          n += Math.max(1, Math.max(x.length, y.length) - p - q);
        }
      }
      return { n, unit: "處" };
    }
    const cnt = new Map(); for (const l of la) cnt.set(l, (cnt.get(l) || 0) + 1);
    let added = 0; for (const l of lb) { const c = cnt.get(l); if (c) cnt.set(l, c - 1); else added++; }
    let removed = 0; for (const c of cnt.values()) removed += c;
    return { n: added + removed, unit: "行", added, removed };
  }

  function stats(s) {
    const g = graphemes(s);
    let han = 0, ws = 0, punct = 0, digits = 0, emoji = 0;
    const freq = new Map();
    const reHan = /^\p{Script=Han}/u, reWs = /^\s+$/u, reP = /^[\p{P}\p{S}]/u, reD = /^\p{Nd}$/u, reE = /\p{Extended_Pictographic}/u;
    for (const c of g) {
      if (reWs.test(c)) { ws++; continue; }
      if (reHan.test(c)) han++;
      else if (reD.test(c)) digits++;
      else if (reE.test(c)) emoji++;
      else if (reP.test(c)) punct++;
      freq.set(c, (freq.get(c) || 0) + 1);
    }
    const words = (s.match(/[A-Za-z0-9'’-]+/g) || []).filter(w => /[A-Za-z0-9]/.test(w)).length;
    const top = [...freq].filter(([c]) => !reP.test(c)).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const ls = s === "" ? 0 : lines(s).length;
    const paras = s.split(/\n[ \t　]*\n/).filter(p => p.trim()).length;
    return { chars: g.length, noWs: g.length - ws, han, words, lines: ls, paras, bytes: new TextEncoder().encode(s).length, punct, digits, ws, emoji, top };
  }
  return { OPS, run(text, steps) { let t = text; for (const st of steps) t = OPS[st.op](t, st.o); return t; }, delta, stats, countMatches, makeRegex, s2t, t2s };
}

/* ======== app ======== */
const K = KIT(ZH, true);
const $ = id => document.getElementById(id);
const inp = $("input"), outp = $("output");
const LS = {
  get(k, d) { try { const v = localStorage.getItem("text-kit:v1:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("text-kit:v1:" + k, JSON.stringify(v)); } catch {} },
};
const LABEL = { s2t: "簡→繁", t2s: "繁→簡", f2h: "全→半形", h2f: "半→全形", upper: "大寫", lower: "小寫", title: "字首大寫", sentence: "句首大寫",
  rmEmpty: "去空行", mergeEmpty: "併空行", trim: "去首尾空白", rmSpace: "去全部空白", dedupe: "去重複行", stripHtml: "去 HTML", spacing: "中英加空格", punct: "中文標點",
  sortAsc: "升冪", sortDesc: "降冪", sortLen: "依長度", shuffle: "隨機打亂", reverse: "反轉行序", lineNo: "加行號", bullet: "包成清單", nfc: "NFC", replace: "取代" };
const BIG_STATS = 2 * 1024 * 1024, BIG_RUN = 1024 * 1024;
const SAMPLE = `【範例文字：可按「清空」後貼上你自己的內容】
后来发现这个软件很好用，头发也不再那么干燥。
ＡＢＣ　１２３　全形英數字
hello world. this is a TEXT KIT demo!
   前後有多餘空白的一行


重複的一行
重複的一行
<p>移除 <b>HTML</b> 標籤</p>
用iPhone拍了3張照片,檔案很大.
banana
Apple
蘋果`;

let prefs = Object.assign({ tw: true, alnum: false, dCase: false, dTrim: true, coll: "zh-Hant" }, LS.get("prefs", {}));
let steps = [];
let lastRunId = 0;
let outFull = "";
const SHOW_MAX = 200000;

/* ---- options ---- */
function readOpts() {
  prefs.tw = $("optTw").checked; prefs.alnum = $("optAlnum").checked; prefs.dCase = $("optDedupCase").checked; prefs.dTrim = $("optDedupTrim").checked; prefs.coll = $("optColl").value;
  LS.set("prefs", prefs);
}
function optsFor(op) {
  const o = {};
  if (op === "s2t") o.tw = prefs.tw;
  if (op === "f2h" || op === "h2f") o.alnum = prefs.alnum;
  if (op === "dedupe") { o.dCase = prefs.dCase; o.dTrim = prefs.dTrim; }
  if (op.startsWith("sort")) o.coll = prefs.coll;
  return o;
}
$("optTw").checked = prefs.tw; $("optAlnum").checked = prefs.alnum; $("optDedupCase").checked = prefs.dCase; $("optDedupTrim").checked = prefs.dTrim; $("optColl").value = prefs.coll;
for (const id of ["optTw", "optAlnum", "optDedupCase", "optDedupTrim", "optColl"]) $(id).addEventListener("change", () => { readOpts(); });

/* ---- stats ---- */
let statT = 0;
const fmt = n => n.toLocaleString("zh-TW");
function showStats(st) {
  $("sChars").textContent = fmt(st.chars); $("sCharsNoWs").textContent = fmt(st.noWs); $("sHan").textContent = fmt(st.han); $("sWords").textContent = fmt(st.words);
  $("sLines").textContent = fmt(st.lines); $("sParas").textContent = fmt(st.paras); $("sBytes").textContent = fmt(st.bytes);
  $("sPunct").textContent = fmt(st.punct); $("sDigits").textContent = fmt(st.digits); $("sWs").textContent = fmt(st.ws); $("sEmoji").textContent = fmt(st.emoji);
  const t = $("top10"); t.innerHTML = "";
  for (const [c, n] of st.top) { const s = document.createElement("span"); const e = document.createElement("em"); e.textContent = c; const i = document.createElement("i"); i.textContent = "×" + fmt(n); s.append(e, i); t.appendChild(s); }
  if (!st.top.length) t.innerHTML = '<span style="border:0;background:none;color:var(--faint)">（無）</span>';
}
function updateStats() {
  clearTimeout(statT);
  const s = inp.value, big = s.length > BIG_STATS;
  $("bigHint").hidden = !big;
  if (big) $("bigHint").textContent = `文字超過 2MB（約 ${(s.length / 1048576).toFixed(1)}MB），統計改為停止輸入 300 毫秒後更新，處理會在背景執行。`;
  statT = setTimeout(() => {
    if (big) work({ type: "stats", text: s }).then(r => r && showStats(r)).catch(() => showStats(K.stats(s)));
    else showStats(K.stats(s));
  }, big ? 300 : 0);
}
$("stats").addEventListener("click", () => { const m = $("statsMore"); m.hidden = !m.hidden; $("stats").setAttribute("aria-expanded", String(!m.hidden)); });

/* ---- worker for large text ---- */
let W = null, wSeq = 0; const wWait = new Map();
function getWorker() {
  if (W !== null) return W;
  try {
    const src = `"use strict";const ZH=${JSON.stringify(ZH)};${KIT.toString()};const K=KIT(ZH,false);
onmessage=e=>{const d=e.data;try{let r;if(d.type==="stats")r=K.stats(d.text);else{const out=K.run(d.text,d.steps);r={out,delta:K.delta(d.text,out)};}postMessage({id:d.id,r});}catch(err){postMessage({id:d.id,error:String(err&&err.message||err)});}};`;
    W = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    W.onmessage = e => { const p = wWait.get(e.data.id); if (!p) return; wWait.delete(e.data.id); e.data.error ? p.rej(new Error(e.data.error)) : p.res(e.data.r); };
    W.onerror = () => { for (const p of wWait.values()) p.rej(new Error("worker")); wWait.clear(); W = false; };
  } catch { W = false; }
  return W;
}
function work(msg) {
  const w = getWorker();
  if (!w) return Promise.reject(new Error("no-worker"));
  return new Promise((res, rej) => { const id = ++wSeq; wWait.set(id, { res, rej }); w.postMessage(Object.assign({ id }, msg)); });
}

/* ---- run chain ---- */
async function recompute() {
  const id = ++lastRunId;
  renderChain();
  const text = inp.value;
  if (!steps.length) { outFull = ""; outp.value = ""; $("delta").textContent = "尚未套用任何操作"; updateButtons(); updJump(); return; }
  let out, d;
  const showBusy = text.length > BIG_RUN;
  $("busy").hidden = !showBusy;
  try {
    if (showBusy) {
      try { const r = await work({ type: "run", text, steps }); out = r.out; d = r.delta; }
      catch (e) { if (e.message !== "no-worker" && e.message !== "worker") throw e; await new Promise(r => setTimeout(r, 30)); out = K.run(text, steps); d = K.delta(text, out); }
    } else { out = K.run(text, steps); d = K.delta(text, out); }
  } catch (e) {
    if (id !== lastRunId) return;
    $("busy").hidden = true; toast(e.message || "處理失敗"); steps.pop(); renderChain(); return recompute();
  }
  if (id !== lastRunId) return;
  $("busy").hidden = true;
  outFull = out;
  outp.value = out.length > SHOW_MAX ? out.slice(0, SHOW_MAX) : out;
  $("delta").innerHTML = (d.n === 0 ? "沒有任何變更" : d.unit === "行"
    ? `變更了 <b>${fmt(d.n)}</b> 行（新增 ${fmt(d.added)}・移除 ${fmt(d.removed)}）`
    : `變更了 <b>${fmt(d.n)}</b> 處`) + (out.length > SHOW_MAX ? `<br>結果共 ${fmt(out.length)} 字元，畫面只顯示前 ${fmt(SHOW_MAX)} 字元；複製與下載為完整內容。` : "");
  updateButtons();
  if (typeof updJump === "function") updJump();
}
const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function renderChain() {
  const c = $("chain"); c.innerHTML = '<span class="lab">處理鏈</span>';
  if (!steps.length) { c.insertAdjacentHTML("beforeend", '<span class="empty">點選操作後依序加入，可點 × 移除某一步</span>'); return; }
  steps.forEach((st, i) => {
    if (i) c.insertAdjacentHTML("beforeend", '<span class="arrow" aria-hidden="true">→</span>');
    const el = document.createElement("span"); el.className = "step";
    const n = document.createElement("span"); n.className = "n"; n.textContent = String(i + 1).padStart(2, "0");
    const t = document.createTextNode(st.label);
    const b = document.createElement("button"); b.innerHTML = X_SVG; b.setAttribute("aria-label", "移除步驟：" + st.label);
    b.onclick = () => { steps.splice(i, 1); recompute(); };
    el.append(n, t, b); c.appendChild(el);
  });
  if (steps.length > 1) { const b = document.createElement("button"); b.className = "mini"; b.textContent = "全部清除"; b.onclick = () => { steps = []; recompute(); }; c.appendChild(b); }
}
function addStep(op, o, label) {
  if (!inp.value) return;
  saveHistory(inp.value);
  steps.push({ op, o: o || optsFor(op), label: label || LABEL[op] });
  recompute();
}
function updateButtons() {
  const empty = !inp.value;
  document.querySelectorAll(".op[data-op]").forEach(b => b.disabled = empty);
  $("frApply").disabled = empty;
  $("clearBtn").disabled = empty;
  $("copyBtn").disabled = $("useBtn").disabled = $("dlBtn").disabled = !steps.length;
}
$("ops").addEventListener("click", e => { const b = e.target.closest(".op[data-op]"); if (b && !b.disabled) addStep(b.dataset.op); });

/* ---- find / replace ---- */
$("frToggle").addEventListener("click", () => { const p = $("frPanel"); p.hidden = !p.hidden; $("frToggle").setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) $("frFind").focus(); frCheck(); });
const frOpts = () => ({ find: $("frFind").value, repl: $("frRepl").value, regex: $("frRegex").checked, cs: $("frCase").checked });
let frT = 0;
function frCheck() {
  clearTimeout(frT);
  frT = setTimeout(() => {
    const o = frOpts(), m = $("frMsg");
    if (!o.find) { m.textContent = ""; m.className = "msg"; return; }
    const src = steps.length ? outFull : inp.value;
    const r = inp.value.length > BIG_STATS ? K.makeRegex(o.find, o.regex, o.cs) : K.countMatches(src, o);
    if (r.error) { m.textContent = r.error; m.className = "msg err"; return; }
    m.className = "msg"; m.textContent = r.n === undefined ? "語法正確" : `${steps.length ? "目前結果" : "輸入"}中找到 ${fmt(r.n)} 個符合`;
  }, 150);
}
for (const id of ["frFind", "frRepl", "frRegex", "frCase"]) $(id).addEventListener("input", frCheck);
$("frApply").addEventListener("click", () => {
  const o = frOpts(); const r = K.makeRegex(o.find, o.regex, o.cs);
  if (r.error) { $("frMsg").textContent = r.error; $("frMsg").className = "msg err"; return; }
  const short = s => s.length > 8 ? s.slice(0, 8) + "…" : s;
  addStep("replace", o, `取代「${short(o.find)}」→「${short(o.repl)}」`);
  setTimeout(frCheck, 50);
});
[$("frFind"), $("frRepl")].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("frApply").click(); } }));

/* ---- input events ---- */
let draftT = 0, recompT = 0;
inp.addEventListener("input", () => {
  updateStats(); updateButtons();
  clearTimeout(draftT); draftT = setTimeout(() => { if (inp.value.length <= 1024 * 1024) LS.set("input", inp.value); }, 500);
  if (steps.length) { clearTimeout(recompT); recompT = setTimeout(recompute, inp.value.length > BIG_RUN ? 400 : 120); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && inp.value.length <= 1024 * 1024) LS.set("input", inp.value); });
function setInput(v, keepSteps) {
  inp.value = v; if (!keepSteps) steps = [];
  updateStats(); updateButtons(); recompute(); frCheck();
  if (v.length <= 1024 * 1024) LS.set("input", v);
}
$("clearBtn").addEventListener("click", () => { if (inp.value) saveHistory(inp.value); setInput(""); inp.focus(); toast("已清空，原文已存入歷史"); });
$("pasteBtn").addEventListener("click", async () => {
  try { const t = await navigator.clipboard.readText(); if (!t) { toast("剪貼簿是空的"); return; } setInput(t, true); toast("已貼上"); }
  catch { inp.focus(); toast("無法讀取剪貼簿，請在輸入框長按並選擇「貼上」"); }
});
$("useBtn").addEventListener("click", () => { saveHistory(inp.value); setInput(outFull); toast("結果已移到輸入區，處理鏈已清空"); });
$("copyBtn").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(outFull); toast("已複製結果"); }
  catch { outp.focus(); outp.select(); toast("請按住選取的文字手動複製"); }
});

/* ---- downloads ---- */
let DL = null;
(async () => { try { DL = await window.claude?.use?.("downloads"); } catch { DL = null; } $("dlBtn").hidden = !DL; })();
$("dlBtn").addEventListener("click", async () => {
  if (!DL) return;
  const d = new Date(); const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}-${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
  try { await DL.save({ filename: `text-kit-${stamp}.txt`, data: outFull }); toast("已送出下載"); }
  catch (e) { if (!/declin|cancel|denied/i.test(String(e && (e.message || e.name)))) toast("下載失敗，請改用複製"); }
});

/* ---- history ---- */
function saveHistory(text) {
  if (!text || text.length > 100 * 1024 || text === SAMPLE) return;
  let h = LS.get("history", []);
  h = h.filter(x => x.text !== text); h.unshift({ t: Date.now(), text }); h = h.slice(0, 20);
  LS.set("history", h);
}
$("histBtn").addEventListener("click", () => {
  const h = LS.get("history", []);
  const host = $("dlgHost"); const prevFocus = document.activeElement;
  host.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="hT"><div class="box"><div class="bh"><h3 id="hT">最近的輸入（${h.length}/20）</h3><button class="ib" id="hClose" aria-label="關閉" style="border:0">${X_SVG}</button></div><ul id="hList"></ul><div class="bf"><button class="btn" id="hClear"${h.length ? "" : " disabled"}>清除歷史</button></div></div></div>`;
  const ul = $("hList");
  if (!h.length) ul.innerHTML = '<li class="empty">還沒有紀錄。套用操作、清空或取代輸入時，原文會自動存在這裡（單筆上限 100KB）。</li>';
  for (const it of h) {
    const li = document.createElement("li"); const b = document.createElement("button");
    const p = document.createElement("div"); p.className = "p"; p.textContent = it.text.replace(/\s+/g, " ").slice(0, 80);
    const m = document.createElement("div"); m.className = "m"; m.textContent = new Date(it.t).toLocaleString("zh-TW", { hour12: false }) + "・" + fmt(it.text.length) + " 字元";
    b.append(p, m); b.onclick = () => { close(); setInput(it.text); toast("已載入歷史紀錄"); };
    li.appendChild(b); ul.appendChild(li);
  }
  const close = () => { host.innerHTML = ""; prevFocus?.focus?.(); };
  $("hClose").onclick = close;
  $("hClear").onclick = () => { LS.set("history", []); close(); toast("已清除歷史"); };
  host.querySelector(".dlg").addEventListener("click", e => { if (e.target.classList.contains("dlg")) close(); });
  host.querySelector(".dlg").addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  $("hClose").focus();
});

/* ---- theme ---- */
function applyTheme(t) { const r = document.documentElement; if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme"); }
let theme = LS.get("theme", "auto"); applyTheme(theme);
$("themeBtn").addEventListener("click", () => {
  const dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  theme = dark ? "light" : "dark"; applyTheme(theme); LS.set("theme", theme); toast(dark ? "淺色模式" : "深色模式");
});

/* ---- mobile jump-to-result bar ---- */
let resVisible = false;
const resEl = document.querySelector(".res");
try { new IntersectionObserver(es => { resVisible = es[0].isIntersecting; updJump(); }, { threshold: 0.15 }).observe(resEl); } catch {}
function updJump() {
  const show = steps.length > 0 && !resVisible;
  $("jump").hidden = !show;
  if (show) $("jumpTxt").textContent = `${steps.length} 個步驟・` + $("delta").textContent.split("結果共")[0];
}
$("jumpBtn").addEventListener("click", () => resEl.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }));
document.body.style.paddingBottom = "calc(80px + env(safe-area-inset-bottom))";

/* ---- toast ---- */
let toastT = 0;
function toast(msg) { const h = $("toastHost"); clearTimeout(toastT); h.innerHTML = '<div class="toast"></div>'; h.firstChild.textContent = msg; toastT = setTimeout(() => h.innerHTML = "", 2400); }

/* ---- boot ---- */
(() => {
  const draft = LS.get("input", null);
  inp.value = draft != null && draft !== "" ? draft : SAMPLE;
  updateStats(); updateButtons(); renderChain();
  if (inp.value === SAMPLE) { steps = [{ op: "s2t", o: optsFor("s2t"), label: LABEL.s2t }]; recompute(); }
  window.__tkReady = true;
})();
window.__K = K;
window.__out = () => outFull;
</script>
