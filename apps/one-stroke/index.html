<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>一筆繪境</title>
<style>
:root{
  --paper:#efe5cf; --paper2:#f7f0df; --ink:#1d1a1c; --ink2:#3b3532; --muted:#7a6a58;
  --cinnabar:#b3362a; --gold:#a8843a; --silk:#4a3524;
  --kai:"Kaiti TC","STKaiti","BiauKai","DFKai-SB","KaiTi","Kai","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --serif:"Noto Serif CJK TC","Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:5}
.scr.on{display:flex}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);
  display:none;align-items:center;gap:8px;z-index:4;pointer-events:none}
#hud.on{display:flex}
#hud > *{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:rgba(250,244,230,.75);box-shadow:inset 0 0 0 1.5px rgba(74,53,36,.35);color:var(--silk);flex:none}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#hudMid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#hudLv{font-family:var(--kai);font-size:22px;font-weight:700;letter-spacing:2px;white-space:nowrap}
#hudDiff{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.dbar{display:inline-flex;gap:2px}
.dbar i{display:block;width:7px;height:8px;border-radius:2px;background:rgba(74,53,36,.16)}
.dbar i.f{background:linear-gradient(#3a3430,#1d1a1c)}
.dbar i.f.hot{background:linear-gradient(#c4473a,#922a20)}
#hudTime{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink2);min-width:58px;text-align:right;font-family:ui-monospace,Menlo,monospace}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:none;flex-direction:column;align-items:center;gap:6px;z-index:4;pointer-events:none}
#bar.on{display:flex}
#status{font-size:14px;color:var(--muted);min-height:20px;text-align:center;font-family:var(--kai);letter-spacing:1px}
#status b{color:var(--cinnabar);font-weight:700}
#btns{display:flex;gap:10px;pointer-events:auto;width:100%;max-width:420px}
.bb{flex:1;height:52px;border-radius:14px;background:rgba(250,244,230,.82);box-shadow:inset 0 0 0 1.5px rgba(74,53,36,.35),0 2px 0 rgba(74,53,36,.18);
  font-size:16px;font-family:var(--kai);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--silk)}
.bb:active{transform:translateY(1px)}
.bb[disabled]{opacity:.4}
.bb .n{font-size:12px;background:var(--cinnabar);color:#fbeee0;border-radius:9px;padding:1px 6px;font-family:var(--serif)}
/* panels */
.panel{background:linear-gradient(var(--paper2),#efe4cb);border-radius:18px;box-shadow:0 0 0 3px var(--silk),0 0 0 5px #c9a967,0 18px 40px rgba(40,25,10,.35);
  padding:22px 20px;width:min(340px,calc(100vw - 40px));text-align:center;position:relative}
.dim{background:rgba(30,22,16,.45);justify-content:center;padding:16px}
.big{font-family:var(--kai);font-size:30px;font-weight:700;letter-spacing:4px;margin:2px 0 10px}
.pbtn{display:block;width:100%;height:52px;margin-top:10px;border-radius:14px;font-size:18px;font-family:var(--kai);font-weight:700;letter-spacing:3px;
  background:var(--ink);color:#f3e9d4;box-shadow:0 3px 0 #000}
.pbtn.alt{background:transparent;color:var(--silk);box-shadow:inset 0 0 0 1.5px rgba(74,53,36,.45)}
.pbtn.red{background:var(--cinnabar);box-shadow:0 3px 0 #6e1d15}
.pbtn:active{transform:translateY(2px)}
/* title */
#title{justify-content:flex-end;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 20px)}
#tWrap{display:flex;flex-direction:column;align-items:center;width:min(360px,100%)}
#tName{font-family:var(--kai);font-size:clamp(44px,14vw,84px);white-space:nowrap;font-weight:700;letter-spacing:.08em;line-height:1.05;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.4)}
#tSeal{margin-top:8px;display:inline-block;background:var(--cinnabar);color:#f6e7d6;font-family:var(--kai);font-size:15px;padding:5px 10px;border-radius:4px;
  letter-spacing:3px;transform:rotate(-3deg);box-shadow:inset 0 0 0 2px rgba(255,235,215,.35)}
#tSub{font-family:var(--kai);font-size:18px;color:var(--ink2);margin:16px 0 26px;letter-spacing:4px;text-align:center}
#tWrap .pbtn{max-width:280px}
#tProg{margin-top:14px;color:var(--muted);font-size:14px}
#title{padding-bottom:calc(var(--sab) + 7vh)}
.lk{width:11px;height:11px;stroke:var(--muted);fill:none;stroke-width:2.4}
/* select */
#select{padding:calc(var(--sat) + 8px) 0 0;background:rgba(239,229,207,.92)}
#selHead{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;padding:0 calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px)}
#selHead h2{flex:1;margin:0;font-family:var(--kai);font-size:24px;letter-spacing:3px}
#selSub{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:560px;padding:0 calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px);gap:10px;font-size:14px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:14px;color:var(--ink2);font-family:var(--serif)}
.sw .tr{width:46px;height:26px;border-radius:13px;background:rgba(74,53,36,.25);position:relative;transition:background .2s}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fbf5e8;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] .tr{background:var(--cinnabar)}
.sw[aria-checked="true"] .tr::after{transform:translateX(20px)}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:560px;padding:4px calc(var(--sar) + 12px) calc(var(--sab) + 24px) calc(var(--sal) + 12px);
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
.tile{position:relative;height:76px;border-radius:12px;background:linear-gradient(#f8f2e4,#eee2c8);box-shadow:inset 0 0 0 1.5px rgba(74,53,36,.3),0 2px 0 rgba(74,53,36,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;min-height:56px}
.tile .num{font-family:var(--kai);font-size:21px;font-weight:700;line-height:1}
.tile .sz{font-size:10px;color:var(--muted);line-height:1}
.tile .dbar i{width:4px;height:6px;border-radius:1px}
.tile .st{font-size:10px;line-height:1;color:var(--cinnabar);letter-spacing:-1px;min-height:10px}
.tile.done{background:linear-gradient(#efe6d3,#e2d3b2)}
.tile.done .num{color:var(--ink)}
.tile.cur{box-shadow:inset 0 0 0 2.5px var(--cinnabar),0 2px 0 rgba(74,53,36,.15)}
.tile.lock{opacity:.45}
.tile.lock .num{color:var(--muted)}
.tile:active{transform:scale(.96)}
/* how */
.how p{margin:8px 0;line-height:1.6;font-size:15px;text-align:left;color:var(--ink2)}
.how b{color:var(--cinnabar)}
.res-row{display:flex;justify-content:space-around;margin:6px 0 4px}
.res-row div{display:flex;flex-direction:column;gap:2px}
.res-row small{color:var(--muted);font-size:12px}
.res-row span{font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--kai);font-weight:700}
#rStars{font-size:34px;letter-spacing:6px;color:var(--cinnabar);min-height:44px}
#rStars .off{color:rgba(74,53,36,.2)}
#rNote{color:var(--muted);font-size:13px;min-height:18px}
.newrec{color:var(--cinnabar);font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translate(-50%,-10px);opacity:0;transition:all .25s;z-index:9;pointer-events:none;
  background:rgba(29,26,28,.88);color:#f3e9d4;padding:8px 16px;border-radius:20px;font-size:14px;font-family:var(--kai);letter-spacing:1px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
/* Short screens (phone in landscape): centred overlays clip their top; let them scroll from the top instead. */
@media (max-height: 600px) { #title { justify-content: flex-start; overflow-y: auto; } #title > * { flex-shrink: 0; } #title > :first-child { margin-top: auto; } }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="ib" id="bMenu" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <div id="hudMid"><div id="hudLv">第 1 關</div><div id="hudDiff">難度 <span id="hudDN">1</span><span class="dbar" id="hudBar"></span></div></div>
  <div id="hudTime">0:00.0</div>
  <button class="ib" id="bMute" aria-label="靜音"></button>
</div>

<div id="bar">
  <div id="status"></div>
  <div id="btns">
    <button class="bb" id="bHint">提示 <span class="n" id="hintN">3</span></button>
    <button class="bb" id="bUndo">退一步</button>
    <button class="bb" id="bReset">重畫</button>
  </div>
</div>

<div class="scr on" id="title">
  <div id="tWrap">
    <div id="tName">一筆繪境</div>
    <div id="tSeal">一筆成畫</div>
    <div id="tSub">一筆走遍 · 依序過印</div>
    <button class="pbtn red" id="tPlay">起筆</button>
    <button class="pbtn alt" id="tSel">選擇關卡</button>
    <button class="pbtn alt" id="tHow">玩法說明</button>
    <div id="tProg"></div>
  </div>
</div>

<div class="scr" id="select">
  <div id="selHead">
    <button class="ib" id="selBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>選擇關卡</h2>
    <span id="selCount" style="color:var(--muted);font-size:14px"></span>
  </div>
  <div id="selSub">
    <span>難度隨關卡遞增</span>
    <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="tr"></span></button>
  </div>
  <div id="grid"></div>
</div>

<div class="scr dim" id="how">
  <div class="panel how">
    <div class="big">玩法</div>
    <p>從 <b>①</b> 起筆，<b>一筆</b>畫過棋盤上的<b>每一格</b>，每格只能經過一次。</p>
    <p>途中必須依序經過朱印數字 <b>1 → 2 → 3…</b>，並在<b>最後一個數字</b>收筆。</p>
    <p>粗墨線是<b>牆</b>，不可穿越；空白處是<b>缺格</b>。</p>
    <p>拖曳延伸筆畫，沿原路<b>拖回</b>可收回；<b>點一下</b>筆畫上的某格可從該處截斷。鍵盤：方向鍵移動、Backspace 退一步、H 提示。</p>
    <button class="pbtn" id="howOk">明白了</button>
  </div>
</div>

<div class="scr dim" id="pause">
  <div class="panel">
    <div class="big">暫停</div>
    <button class="pbtn red" id="pResume">繼續</button>
    <button class="pbtn alt" id="pRestart">重新開始本關</button>
    <button class="pbtn alt" id="pHow">玩法說明</button>
    <button class="pbtn alt" id="pSel">選擇關卡</button>
  </div>
</div>

<div class="scr dim" id="result">
  <div class="panel">
    <div class="big" id="rTitle">一筆成畫</div>
    <div id="rStars"></div>
    <div class="res-row">
      <div><small>用時</small><span id="rTime">0:00</span></div>
      <div><small>最佳</small><span id="rBest">0:00</span></div>
      <div><small>提示</small><span id="rHints">0</span></div>
    </div>
    <div id="rNote"></div>
    <button class="pbtn red" id="rNext">下一關</button>
    <button class="pbtn alt" id="rAgain">再畫一次</button>
    <button class="pbtn alt" id="rSel">選擇關卡</button>
  </div>
</div>
<div id="toast"></div>

/* ---------- level decode ---------- */
function decode(s){
  const [wh, holes, walls, cps, dirs] = s.split('|');
  const [W, H] = wh.split(',').map(Number);
  const open = new Uint8Array(W*H).fill(1);
  if (holes) holes.split('.').forEach(h => open[parseInt(h,36)] = 0);
  const wl = walls ? walls.split('.').map(p => p.split(':').map(v => parseInt(v,36))) : [];
  const cp = cps.split('.').map(v => parseInt(v,36));
  const sol = [cp[0]];
  for (const ch of dirs){ const c = sol[sol.length-1]; sol.push(ch==='U'?c-W:ch==='D'?c+W:ch==='R'?c+1:c-1); }
  return {W,H,open,walls:wl,cps:cp,sol};
}
const LV_META = LEVELS.map(s => { const [wh,holes] = s.split('|'); const [W,H] = wh.split(',').map(Number); return {W,H,n:W*H-(holes?holes.split('.').length:0)}; });

    AC = new (window.AudioContext||window.webkitAudioContext)();

    // simple feedback delay "hall"
    const d = AC.createDelay(1); d.delayTime.value = 0.13;
    const fb = AC.createGain(); fb.gain.value = 0.32;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;
    verb = AC.createGain(); verb.gain.value = 0.35;

}

/* ---------- canvas ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');

let KAI = 'serif';
const INK = [[29,27,34],[46,58,84],[88,64,92],[176,58,42]]; // ink -> indigo -> plum -> cinnabar
function gradColor(t, a=1){
  t = clamp(t,0,1)*(INK.length-1); const i = Math.min(INK.length-2, Math.floor(t)), f = t-i;
  const c0 = INK[i], c1 = INK[i+1];

function makePaper(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(w*.5,h*.42,Math.min(w,h)*.1,w*.5,h*.5,Math.max(w,h)*.75);
  gr.addColorStop(0,'#f4ecd9'); gr.addColorStop(1,'#e2d4b4');
  g.fillStyle = gr; g.fillRect(0,0,w,h);
  // fibers
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  g.lineCap = 'round';
  const nf = Math.floor(w*h/900);
  for (let i=0;i<nf;i++){
    const x = rnd()*w, y = rnd()*h, l = (4+rnd()*22)*DPR, a = rnd()*Math.PI*2;
    g.strokeStyle = rnd()<.5 ? 'rgba(120,95,60,'+(.04+rnd()*.06)+')' : 'rgba(255,252,240,'+(.10+rnd()*.12)+')';
    g.lineWidth = (.4+rnd()*.8)*DPR;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+1)*l*.5, y+Math.sin(a+1)*l*.5, x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
  }
  // faint distant mountains (ink wash) at bottom
  for (let k=0;k<2;k++){
    g.fillStyle = 'rgba(60,55,50,'+(k?0.05:0.08)+')';
    g.beginPath(); const base = h*(0.86+k*0.05); g.moveTo(0,h);
    for (let x=0;x<=w;x+=w/40){ const y = base - (Math.sin(x/w*6+k*2)*.5+.5)*h*(0.07-k*.02) - (Math.sin(x/w*17+k)*.5+.5)*h*.025; g.lineTo(x,y); }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  // speckles
  for (let i=0;i<nf/3;i++){ g.fillStyle = 'rgba(90,70,40,'+(rnd()*.08)+')'; g.fillRect(rnd()*w, rnd()*h, DPR, DPR); }
  return c;
}
// ink-wash blot sprites per gradient stop
const BLOTS = []; const BLOT_STEPS = 10;
function makeBlots(){
  BLOTS.length = 0;
  for (let k=0;k<BLOT_STEPS;k++){
    const arr = [];
    for (let v=0; v<3; v++){
      const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d');
      let seed = 11+v*31+k; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
      for (let j=0;j<7;j++){
        const r = S*(.22+rnd()*.16), x = S/2+(rnd()-.5)*S*.2, y = S/2+(rnd()-.5)*S*.2;
        const gr = g.createRadialGradient(x,y,r*.2,x,y,r);
        gr.addColorStop(0, gradColor(k/(BLOT_STEPS-1), .22)); gr.addColorStop(.75, gradColor(k/(BLOT_STEPS-1), .12)); gr.addColorStop(1, gradColor(k/(BLOT_STEPS-1), 0));
        g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      arr.push(c);
    }
    BLOTS.push(arr);

}

/* ---------- game state ---------- */
const G = {
  screen:'title', level:1, lv:null, W:0, H:0, N:0, open:null, walls:[], wallSet:new Set(), cpNum:null, cps:[], total:0,
  path:[], inPath:null, vT:null, hintsLeft:HINTS_PER_LEVEL, hintsUsed:0, ghost:[], tStart:0, tAcc:0, running:false, won:false, wonAt:0,
  paused:false, cell:40, bx:0, by:0, shake:0, shakeT:0, blocked:-1, blockedT:0, lastStepT:0

const parts = [];

function wallKey(a,b){ return a<b ? a*1024+b : b*1024+a; }
function isUnlocked(L){ return L===1 || unlockAll || !!progress[L-1] || !!progress[L]; }

function startLevel(L){
  L = clamp(L|0, 1, LEVELS.length);
  const lv = decode(LEVELS[L-1]);
  Object.assign(G, {level:L, lv, W:lv.W, H:lv.H, N:lv.W*lv.H, open:lv.open, walls:lv.walls, cps:lv.cps,
    path:[], ghost:[], hintsLeft:HINTS_PER_LEVEL, hintsUsed:0, tStart:0, tAcc:0, running:false, won:false, wonAt:0, paused:false});
  G.wallSet = new Set(lv.walls.map(([a,b]) => wallKey(a,b)));
  G.cpNum = new Int16Array(G.N); lv.cps.forEach((c,i) => G.cpNum[c] = i+1);
  G.total = 0; for (let c=0;c<G.N;c++) if (G.open[c]) G.total++;
  G.hintsLeft = hintCount(G.total);
  G.inPath = new Int16Array(G.N).fill(-1); G.vT = new Float64Array(G.N);
  parts.length = 0;
  lastLevel = L; sset('last', L);
  $('hudLv').textContent = '第 '+L+' 關';
  $('hudDN').textContent = L; diffBar($('hudBar'), L);
  show('game'); layout(); updateUI();
}

function nextCp(){ // next checkpoint number expected
  let k = 1; for (const c of G.path) if (G.cpNum[c]) k = G.cpNum[c]+1; return k;
}
function adjacent(a,b){
  const W = G.W; const ax = a%W, bx = b%W;
  if (Math.abs(a-b)===W) return true;
  return Math.abs(a-b)===1 && Math.floor(a/W)===Math.floor(b/W);
}
function canEnter(n){
  if (n<0 || n>=G.N || !G.open[n] || G.inPath[n]>=0) return false;
  const h = G.path[G.path.length-1];
  if (!adjacent(h,n) || G.wallSet.has(wallKey(h,n))) return false;
  if (G.cpNum[h] === G.cps.length) return false; // already at final seal
  const k = G.cpNum[n];
  if (k && k !== nextCp()) return 'order';
  return true;
}
function now(){ return performance.now(); }
function elapsed(){ return G.tAcc + (G.running && !G.paused && !G.won ? now()-G.tStart : 0); }
function startTimer(){ if (!G.running && !G.won){ G.running = true; G.tStart = now(); } }

function push(n){
  const L = G.path.length;
  G.path.push(n); G.inPath[n] = L; G.vT[n] = now(); G.lastStepT = now();
  startTimer();
  if (G.ghost.length && G.ghost[0]===n) G.ghost.shift(); else if (G.ghost.length) G.ghost = [];
  // sound: pentatonic rising with progress
  const prog = L/(G.total-1);
  const step = Math.floor(prog*12);
  if (G.cpNum[n]){ pluck(noteFreq(step+5), .5, 0, true, 2); pluck(noteFreq(step), .3, 0.03, false, 2); spawnSplash(n, 16, 1.4); }
  else { pluck(noteFreq(step + (L%2?0:0)), .32, 0, false, 1.4); spawnSplash(n, 4, .7); }

}
function pop(){
  const c = G.path.pop(); if (c===undefined) return;
  G.inPath[c] = -1;

}
function truncateTo(i){ // keep path[0..i]

}
function blockedAt(n){ G.blocked = n; G.blockedT = now(); G.shake = 5; thud(); }

function stepToward(t){
  // move head one cell toward target cell t; returns true if moved
  const h = G.path[G.path.length-1];
  if (h===t) return false;
  const W = G.W, hx = h%W, hy = (h/W)|0, tx = t%W, ty = (t/W)|0;
  const dx = tx-hx, dy = ty-hy;
  const cands = [];
  const sx = dx? (dx>0?1:-1):0, sy = dy?(dy>0?W:-W):0;
  if (Math.abs(dx) >= Math.abs(dy)){ if (sx) cands.push(h+sx); if (sy) cands.push(h+sy); }
  else { if (sy) cands.push(h+sy); if (sx) cands.push(h+sx); }
  const prev = G.path.length>1 ? G.path[G.path.length-2] : -1;
  for (const n of cands){
    if (n===prev){ pop(); return true; }
    const ok = canEnter(n);
    if (ok===true){ push(n); return true; }
    if (ok==='order' && n===t){ blockedAt(n); return false; }

function checkWin(){
  if (G.path.length === G.total && G.path[G.path.length-1] === G.cps[G.cps.length-1]){
    G.tAcc = elapsed(); G.won = true; G.wonAt = now(); G.running = false;
    const tot = G.tAcc;
    winChord(); G.shake = 8;
    for (let i=0;i<G.path.length;i+=2) spawnSplash(G.path[i], 4, 1.6);
    const stars = G.hintsUsed===0?3:G.hintsUsed===1?2:1;
    const prev = progress[G.level];
    const isRec = !prev || !prev.t || tot < prev.t;
    progress[G.level] = { s: Math.max(stars, prev?prev.s||0:0), t: isRec ? Math.round(tot) : prev.t };
    sset('progress', progress);
    G.result = {tot, stars, isRec, best: progress[G.level].t};
    setTimeout(() => { if (G.won && G.screen==='game') showResult(); }, 1500);
  }

}

/* ---------- hints ---------- */
function useHint(){
  if (G.won || G.hintsLeft<=0 || G.paused) { if (G.hintsLeft<=0) toast('本關提示已用完'); return; }
  const sol = G.lv.sol;
  let k = 0; while (k < G.path.length && G.path[k]===sol[k]) k++;
  if (k===0){ G.path.forEach(c=>G.inPath[c]=-1); G.path = []; G.inPath[sol[0]] = 0; G.path.push(sol[0]); G.vT[sol[0]] = now(); k = 1; }
  else if (k < G.path.length){ truncateTo(k-1); toast('筆畫已退回到正確處'); }
  // reveal next segment: until next seal (inclusive), 3..hintLen cells (longer on big boards)
  const g = [], maxLen = hintLen(G.total);
  for (let i=k; i<sol.length && g.length<maxLen; i++){ g.push(sol[i]); if (G.cpNum[sol[i]] && g.length>=3) break; }
  G.ghost = g; G.ghostT = now();

/* ---------- particles ---------- */
function cellXY(c){ return [G.bx + (c%G.W + .5)*G.cell, G.by + (((c/G.W)|0) + .5)*G.cell]; }
function spawnSplash(c, n, pw){
  const [x,y] = cellXY(c); const t = G.inPath[c]>=0 ? G.inPath[c]/(G.total-1) : 0;
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (40+Math.random()*120)*pw;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:(1+Math.random()*2.6)*pw*(G.cell/44),life:0,max:.45+Math.random()*.5,col:gradColor(t,1)});
  }

/* ---------- layout & draw ---------- */
function layout(){
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
  paperTex = makePaper(cv.width, cv.height);
  if (G.lv){
    const hudB = $('hud').classList.contains('on') ? $('hud').getBoundingClientRect().bottom : 60;
    const barT = $('bar').classList.contains('on') ? $('bar').getBoundingClientRect().top : VH-80;
    const side = 16 + 10;
    const avW = VW - side*2, avH = (barT - hudB) - 28;
    G.cell = Math.max(18, Math.floor(Math.min(avW/G.W, avH/G.H, 78)));
    G.hudB = hudB;
    G.bx = Math.round((VW - G.cell*G.W)/2); G.by = Math.round(hudB + 14 + (avH - G.cell*G.H)/2);

}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

let lastT = 0, rafId = 0, titleT0 = performance.now();
function frame(t){

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (paperTex) ctx.drawImage(paperTex, 0,0, VW, VH);
  if (G.screen==='game' && G.lv) drawGame(t, dt);
  else drawTitleArt(t);
  // timer text

}

function drawTitleArt(t){
  // a slow self-drawing brush stroke weaving through a ghost grid
  const s = (t - titleT0)/1000;
  const W = 6, H = 6;
  if (G.screen!=='title') return;
  const tn = $('tName').getBoundingClientRect();
  const room = tn.top - 10; const cell = Math.min(VW*.8/W, Math.max(20, room - 30)/H);
  const ox = VW/2 - W*cell/2, oy = Math.max(10, room/2 - H*cell/2 + 6);
  ctx.save(); ctx.globalAlpha = .55;
  ctx.strokeStyle = 'rgba(74,53,36,.08)'; ctx.lineWidth = 1;
  for (let i=0;i<=W;i++){ ctx.beginPath(); ctx.moveTo(ox+i*cell, oy); ctx.lineTo(ox+i*cell, oy+H*cell); ctx.stroke(); }
  for (let j=0;j<=H;j++){ ctx.beginPath(); ctx.moveTo(ox, oy+j*cell); ctx.lineTo(ox+W*cell, oy+j*cell); ctx.stroke(); }
  // serpentine-ish fixed path
  const P = [0,1,2,3,4,5,11,10,9,8,7,6,12,13,14,15,16,17,23,22,21,20,19,18,24,25,26,27,28,29,35,34,33,32,31,30];
  const len = ((s*4) % (P.length+14));
  const n = Math.min(P.length, Math.floor(len));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i=1;i<=n && i<P.length;i++){
    const a = P[i-1], b = P[i];
    let f = 1; if (i===n && n<P.length) f = len - n;
    const ax = ox+(a%W+.5)*cell, ay = oy+(((a/W)|0)+.5)*cell, bx = ox+(b%W+.5)*cell, by = oy+(((b/W)|0)+.5)*cell;
    ctx.strokeStyle = gradColor(i/(P.length-1), .5); ctx.lineWidth = cell*.32;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(lerp(ax,bx,f), lerp(ay,by,f)); ctx.stroke();
  }
  ctx.restore();
}

function drawGame(t, dt){
  const {W,H,cell} = G; const now_ = t;
  // shake
  let sx = 0, sy = 0;
  if (G.shake > 0.1){ sx = (Math.random()-.5)*G.shake; sy = (Math.random()-.5)*G.shake; G.shake *= Math.pow(0.0005, dt); } else G.shake = 0;
  ctx.save(); ctx.translate(sx, sy);
  const bx = G.bx, by = G.by, bw = W*cell, bh = H*cell;
  // mounting (silk border + paper)
  ctx.save();
  ctx.shadowColor = 'rgba(40,25,10,.28)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#4a3524'; rr(ctx, bx-14, by-14, bw+28, bh+28, 10); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(201,169,103,.8)'; ctx.lineWidth = 1.5; rr(ctx, bx-9, by-9, bw+18, bh+18, 7); ctx.stroke();
  ctx.fillStyle = '#f5edda'; rr(ctx, bx-6, by-6, bw+12, bh+12, 5); ctx.fill();
  // cells
  const pad = Math.max(1.5, cell*.045);
  for (let c=0;c<G.N;c++){
    const x = bx + (c%W)*cell, y = by + ((c/W)|0)*cell;
    if (!G.open[c]){
      ctx.save(); rr(ctx, x+pad, y+pad, cell-pad*2, cell-pad*2, cell*.12); ctx.clip();
      ctx.fillStyle = 'rgba(74,53,36,.16)'; ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle = 'rgba(74,53,36,.22)'; ctx.lineWidth = 1;
      for (let k=-cell;k<cell;k+=cell/5){ ctx.beginPath(); ctx.moveTo(x+k, y+cell); ctx.lineTo(x+k+cell, y); ctx.stroke(); }
      ctx.restore();
      continue;
    }
    ctx.fillStyle = ((c%W + ((c/W)|0))&1) ? 'rgba(120,95,60,.07)' : 'rgba(120,95,60,.11)';
    rr(ctx, x+pad, y+pad, cell-pad*2, cell-pad*2, cell*.14); ctx.fill();
  }
  // seal-order strip above the board
  const nkS = nextCp(), KS = G.cps.length;
  {
    const room = by - 14 - (G.hudB||60);
    if (room > 44){
      const r = Math.min(13, (bw-20)/(KS*2.6)); const gap = r*2.6;
      const y0 = by - 14 - Math.min(room/2, 46);
      const x0 = bx + bw/2 - (KS-1)*gap/2;
      ctx.strokeStyle = 'rgba(74,53,36,.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0+(KS-1)*gap, y0); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 '+Math.round(r*1.05)+'px '+KAI;
      for (let k=1;k<=KS;k++){
        const x = x0+(k-1)*gap, done = k<nkS || G.won;
        ctx.beginPath(); if (k===KS) rr(ctx,x-r,y0-r,r*2,r*2,r*.3); else ctx.arc(x,y0,r,0,Math.PI*2);
        ctx.fillStyle = done ? '#b3362a' : '#f6eedc'; ctx.fill();
        ctx.strokeStyle = '#b3362a'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = done ? '#fbeee0' : '#b3362a'; ctx.fillText(String(k), x, y0+1);
      }
      const best = progress[G.level] && progress[G.level].t;
      ctx.fillStyle = 'rgba(90,72,55,.85)'; ctx.font = '14px '+KAI;
      ctx.fillText((best ? '最佳 '+fmt(best)+' · ' : '')+'過印次序', bx+bw/2, y0 - r - 14);
    }
  }
  // ink washes for visited cells
  const T1 = G.total-1;
  for (let i=0;i<G.path.length;i++){
    const c = G.path[i]; const [x,y] = cellXY(c);
    const age = clamp((now_ - G.vT[c])/380, 0, 1); const e = easeOut(age);
    const spr = BLOTS[Math.round(i/T1*(BLOT_STEPS-1))][c%3];
    const s = cell*(0.6 + 0.45*e);
    ctx.globalAlpha = 0.2 + 0.6*e;
    ctx.drawImage(spr, x-s/2, y-s/2, s, s);
  }
  ctx.globalAlpha = 1;
  // walls
  ctx.lineCap = 'round';
  for (const [a,b] of G.walls){
    let x1,y1,x2,y2;
    const ax = a%W, ay = (a/W)|0;
    if (b===a+1){ x1 = x2 = bx+(ax+1)*cell; y1 = by+ay*cell+cell*.04; y2 = y1+cell*.92; }
    else { y1 = y2 = by+(ay+1)*cell; x1 = bx+ax*cell+cell*.04; x2 = x1+cell*.92; }
    ctx.strokeStyle = '#1d1816'; ctx.lineWidth = Math.max(4, cell*.13);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(29,24,22,.35)'; ctx.lineWidth = Math.max(6, cell*.2);
    ctx.beginPath(); ctx.moveTo(lerp(x1,x2,.15),lerp(y1,y2,.15)); ctx.lineTo(lerp(x1,x2,.7),lerp(y1,y2,.7)); ctx.stroke();
  }
  // ghost hint
  if (G.ghost.length && G.path.length){
    const pts = [G.path[G.path.length-1], ...G.ghost];
    ctx.save();
    ctx.setLineDash([cell*.12, cell*.14]); ctx.lineDashOffset = -now_/40;
    ctx.strokeStyle = 'rgba(168,132,58,.85)'; ctx.lineWidth = cell*.14; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((c,i)=>{ const [x,y] = cellXY(c); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    ctx.restore();
    const [gx,gy] = cellXY(G.ghost[G.ghost.length-1]);
    ctx.fillStyle = 'rgba(168,132,58,.35)'; ctx.beginPath(); ctx.arc(gx,gy,cell*.2+Math.sin(now_/200)*cell*.03,0,Math.PI*2); ctx.fill();
  }
  // path stroke
  const n = G.path.length;
  const wBase = cell*.36;
  if (n>0){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const winWave = G.won ? (now_-G.wonAt)/900 : -1;
    for (let i=1;i<n;i++){
      const a = G.path[i-1], b = G.path[i];
      let [ax,ay] = cellXY(a), [bx2,by2] = cellXY(b);
      const age = clamp((now_ - G.vT[b])/90, 0, 1);
      const ex = lerp(ax,bx2,easeOut(age)), ey = lerp(ay,by2,easeOut(age));
      const tt = i/T1;
      const w = wBase*(1 + .07*Math.sin(i*1.7) - .1*tt);
      ctx.strokeStyle = gradColor(tt, .96); ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
      // flowing sheen
      let sh = Math.max(0, Math.cos(i*.45 - now_/260)); sh = sh*sh*sh*sh;
      if (winWave>=0){ const d = Math.abs(i/n - winWave); if (d<.12) sh = Math.max(sh, 1-d/.12); }
      if (sh>.05){
        ctx.strokeStyle = 'rgba(255,240,215,'+(sh*.38)+')'; ctx.lineWidth = w*.32;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
      }
    }
    // dry-brush highlight along the whole stroke
    ctx.strokeStyle = 'rgba(255,244,226,.13)'; ctx.lineWidth = wBase*.16;
    ctx.beginPath(); for (let i=0;i<n;i++){ const [x,y] = cellXY(G.path[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    if (n>1){ const age = clamp((now_ - G.vT[G.path[n-1]])/90,0,1); if (age<1){} } ctx.stroke();
    // head brush tip
    const h = G.path[n-1]; const [hx,hy] = cellXY(h);
    const tt = (n-1)/T1;
    const pulse = 1 + .08*Math.sin(now_/180);
    ctx.fillStyle = gradColor(tt, 1);
    ctx.beginPath(); ctx.arc(hx,hy, wBase*.62*pulse, 0, Math.PI*2); ctx.fill();
    if (!G.won){ ctx.strokeStyle = gradColor(tt, .25); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx,hy, wBase*.95+Math.sin(now_/180)*2, 0, Math.PI*2); ctx.stroke(); }
  }
  // particles
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life += dt; if (p.life>p.max){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= Math.pow(.02,dt); p.vy *= Math.pow(.02,dt);
    ctx.globalAlpha = 1 - p.life/p.max; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // checkpoints (seals)
  const nk = nextCp(); const K = G.cps.length;
  const fs = Math.round(cell*.36);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k=1;k<=K;k++){
    const c = G.cps[k-1]; const [x,y] = cellXY(c);
    const r = cell*.31;
    const visited = G.inPath[c]>=0;
    let jx = 0;
    if (G.blocked===c){ const a = (now_-G.blockedT)/400; if (a<1) jx = Math.sin(a*30)*(1-a)*cell*.08; }
    if (k===nk && !G.won){
      const p = (now_%1400)/1400;
      ctx.strokeStyle = 'rgba(179,54,42,'+(0.5*(1-p))+')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x,y, r+4+p*cell*.22, 0, Math.PI*2); ctx.stroke();
    }
    ctx.beginPath();
    if (k===K) rr(ctx, x-r+jx, y-r, r*2, r*2, r*.28); else ctx.arc(x+jx, y, r, 0, Math.PI*2);
    if (visited){ ctx.fillStyle = '#b3362a'; ctx.fill(); ctx.strokeStyle = 'rgba(255,230,210,.5)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else { ctx.fillStyle = 'rgba(250,244,230,.95)'; ctx.fill(); ctx.strokeStyle = '#b3362a'; ctx.lineWidth = Math.max(2, cell*.055); ctx.stroke(); }
    ctx.fillStyle = visited ? '#fbeee0' : '#b3362a';
    ctx.font = '700 '+(k>=10?Math.round(fs*.82):fs)+'px '+KAI;
    ctx.fillText(String(k), x+jx, y+1);
  }
  ctx.globalAlpha = 1;
  // win flourish: big translucent seal stamp
  if (G.won){
    const a = clamp((now_-G.wonAt-500)/500, 0, 1);
    if (a>0){
      const s = cell*Math.min(W,H)*.32*(1.4-.4*easeOut(a));
      ctx.save(); ctx.translate(bx+bw/2, by+bh/2); ctx.rotate(-.08);
      ctx.globalAlpha = .82*easeOut(a);
      ctx.fillStyle = '#b3362a'; rr(ctx,-s/2,-s/2,s,s,s*.08); ctx.fill();
      ctx.strokeStyle = 'rgba(251,238,224,.8)'; ctx.lineWidth = s*.03; rr(ctx,-s/2+s*.07,-s/2+s*.07,s*.86,s*.86,s*.05); ctx.stroke();
      ctx.fillStyle = '#fbeee0'; ctx.font = '700 '+Math.round(s*.34)+'px '+KAI;
      ctx.fillText('成', 0, -s*.18); ctx.fillText('畫', 0, s*.2);
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ---------- UI ---------- */
function updateUI(){
  if (!G.lv) return;
  $('hintN').textContent = G.hintsLeft;
  $('bHint').disabled = G.hintsLeft<=0 || G.won;
  $('bUndo').disabled = G.path.length<=1 || G.won;
  $('bReset').disabled = G.path.length===0 || G.won;
  const st = $('status');
  if (G.won) st.innerHTML = '<b>一筆成畫！</b>';
  else if (!G.path.length) st.innerHTML = '從 <b>①</b> 起筆 · 共 '+G.total+' 格';
  else {
    const h = G.path[G.path.length-1];
    if (G.cpNum[h]===G.cps.length && G.path.length<G.total) st.innerHTML = '已到終點，但還有 <b>'+(G.total-G.path.length)+'</b> 格未走過';
    else st.innerHTML = '已走 <b>'+G.path.length+'</b> / '+G.total+' 格 · 下一印 <b>'+nextCp()+'</b>';
  }
}
const SCREENS = ['title','select','how','pause','result'];
function show(s){
  // s: title | select | game ; overlays handled separately
  G.screen = s;
  for (const k of ['title','select']) $(k).classList.toggle('on', k===s);
  for (const k of ['pause','result','how']) $(k).classList.remove('on');
  $('hud').classList.toggle('on', s==='game'); $('bar').classList.toggle('on', s==='game');
  if (s==='select') buildGrid();
  if (s==='title') updateTitle();
  layout();
}
function updateTitle(){
  const done = Object.keys(progress).length;
  $('tProg').textContent = done ? ('已完成 '+done+' / '+LEVELS.length+' 關') : '共 '+LEVELS.length+' 關';
  $('tPlay').textContent = done ? '續筆 · 第 '+firstOpen()+' 關' : '起筆';
}
function firstOpen(){ for (let L=1; L<=LEVELS.length; L++) if (!progress[L]) return L; return LEVELS.length; }
function buildGrid(){
  const g = $('grid'); let h = '';
  const cur = firstOpen();
  for (let L=1; L<=LEVELS.length; L++){
    const m = LV_META[L-1], p = progress[L], un = isUnlocked(L);
    const f = Math.max(1, Math.ceil(L/20)); let bar = '<span class="dbar">';
    for (let i=0;i<5;i++) bar += '<i class="'+(i<f?('f'+(i>=4?' hot':'')):'')+'"></i>';
    bar += '</span>';
    const stars = p ? '★'.repeat(p.s||1) : (un?'':'<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>');
    h += '<button class="tile'+(p?' done':'')+(un?'':' lock')+(L===cur?' cur':'')+'" data-l="'+L+'" aria-label="第'+L+'關 難度'+L+(un?'':' 未解鎖')+'">'+
      '<span class="num">'+L+'</span><span class="sz">'+m.W+'×'+m.H+'</span>'+bar+'<span class="st">'+stars+'</span></button>';
  }
  g.innerHTML = h;
  $('selCount').textContent = Object.keys(progress).length+' / '+LEVELS.length;
  $('unlockSw').setAttribute('aria-checked', unlockAll?'true':'false');
  requestAnimationFrame(()=>{ const el = g.querySelector('.cur'); if (el) g.scrollTop = Math.max(0, el.offsetTop - g.clientHeight/2); });
}
function showResult(){
  const r = G.result; if (!r) return;
  $('rStars').innerHTML = [1,2,3].map(i=>'<span class="'+(i<=r.stars?'':'off')+'">★</span>').join('');
  $('rTime').textContent = fmt(r.tot);
  $('rBest').textContent = fmt(r.best);
  $('rHints').textContent = G.hintsUsed;
  $('rTitle').textContent = G.level===LEVELS.length ? '百境圓滿' : '一筆成畫';
  $('rNote').innerHTML = r.isRec ? '<span class="newrec">新紀錄！</span>' : (r.stars<3?'不用提示可得三星':'');
  $('rNext').style.display = G.level<LEVELS.length ? '' : 'none';
  $('result').classList.add('on');
}
function pause(){ if (G.screen!=='game' || G.won || G.paused) return; if (G.running){ G.tAcc = elapsed(); } G.paused = true; $('pause').classList.add('on'); }
function resume(){ if (!G.paused) return; G.paused = false; if (G.running) G.tStart = now(); $('pause').classList.remove('on'); }

/* ---------- input ---------- */
function cellAt(px, py, strict){
  const fx = (px - G.bx)/G.cell, fy = (py - G.by)/G.cell;
  const x = Math.floor(fx), y = Math.floor(fy);
  if (x<0||y<0||x>=G.W||y>=G.H) return -1;
  if (strict){ const ix = fx-x, iy = fy-y; if (ix<.12||ix>.88||iy<.12||iy>.88) return -2; }
  const c = y*G.W+x; return G.open[c] ? c : -1;
}
let drag = null;
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (G.screen!=='game' || G.won || G.paused) return;
  e.preventDefault();
  const c = cellAt(e.clientX, e.clientY, false);
  if (c<0) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  drag = {id:e.pointerId, moved:false, startC:c, x:e.clientX, y:e.clientY};
  if (!G.path.length){
    if (c===G.cps[0]){ push(c); }
    else { blockedAt(G.cps[0]); toast('請從 ① 起筆'); drag = null; }
    updateUI(); return;
  }
  const i = G.inPath[c];
  if (i>=0){
    if (i < G.path.length-1){
      // a finger that lands on the cell just before the head (or right next to the head) is most likely
      // resuming the stroke: hold the cut until a tap (pointerup) or a deliberate drag away from the head
      const h = G.path[G.path.length-1], [hx,hy] = cellXY(h);
      if (i === G.path.length-2 || Math.max(Math.abs(e.clientX-hx), Math.abs(e.clientY-hy)) < G.cell*0.75) drag.hold = i;
      else cutAt(i);
    }
  } else if (adjacent(G.path[G.path.length-1], c)){
    stepToward(c);
  } else { drag = null; }
  updateUI();
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id!==e.pointerId || G.won || G.paused) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length?evs:[e])){
    const t = cellAt(ev.clientX, ev.clientY, true);
    if (t<0) continue;
    if (drag.hold != null){
      if (t === drag.startC) continue;
      const h = G.path[G.path.length-1];
      if (t === h || (G.inPath[t] < 0 && adjacent(h, t))) drag.hold = null;   // carry on from the head
      else { const k = drag.hold; drag.hold = null; cutAt(k); }               // deliberate drag back: cut, then follow
    }
    let guard = 0;
    while (guard++ < 40 && G.path.length && G.path[G.path.length-1]!==t){ if (!stepToward(t)) break; if (G.won) break; }
  }
  updateUI();
});
function cutAt(i){ const c = G.path[i]; truncateTo(i); pluck(noteFreq(0)/2, .25, 0, false, 1); spawnSplash(c, 6, 1); G.ghost = []; }
function endDrag(e){
  if (drag && drag.id===e.pointerId){
    if (drag.hold != null && e.type==='pointerup' && !G.won && !G.paused){ cutAt(drag.hold); updateUI(); } // a tap on an earlier cell cuts there
    drag = null;
  }
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
document.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  audioInit();
  if (G.screen!=='game') { if (e.key==='Enter' && G.screen==='title') $('tPlay').click(); return; }
  if (e.key==='Escape' || e.key==='p' || e.key==='P'){ G.paused ? resume() : pause(); e.preventDefault(); return; }
  if (G.won){ if (e.key==='Enter' && $('result').classList.contains('on')) $('rNext').click(); return; }
  if (G.paused) return;
  const dirs = {ArrowUp:-G.W, ArrowDown:G.W, ArrowLeft:-1, ArrowRight:1, w:-G.W, s:G.W, a:-1, d:1};
  if (e.key in dirs){
    e.preventDefault();
    if (!G.path.length){ push(G.cps[0]); updateUI(); return; }
    const h = G.path[G.path.length-1], n = h + dirs[e.key];
    if ((e.key==='ArrowLeft'||e.key==='a') && h%G.W===0) return;
    if ((e.key==='ArrowRight'||e.key==='d') && h%G.W===G.W-1) return;
    if (G.path.length>1 && n===G.path[G.path.length-2]) pop();
    else { const ok = canEnter(n); if (ok===true) push(n); else if (ok==='order') blockedAt(n); else { G.shake = 3; } }
    updateUI();
  } else if (e.key==='Backspace' || e.key==='z'){ e.preventDefault(); $('bUndo').click(); }
  else if (e.key==='h' || e.key==='H'){ useHint(); }
  else if (e.key==='r' || e.key==='R'){ $('bReset').click(); }
});

/* ---------- buttons ---------- */
function tap(id, fn){ $(id).addEventListener('click', e => { audioInit(); fn(e); }); }
tap('tPlay', () => { pluck(noteFreq(0), .4); startLevel(firstOpen()); });
tap('tSel', () => { pluck(noteFreq(2), .3); show('select'); });
tap('tHow', () => $('how').classList.add('on'));
tap('howOk', () => $('how').classList.remove('on'));
tap('selBack', () => show('title'));
tap('unlockSw', () => { unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); pluck(noteFreq(unlockAll?7:2), .3); });
$('grid').addEventListener('click', e => {
  audioInit();
  const b = e.target.closest('.tile'); if (!b) return;
  const L = +b.dataset.l;
  if (!isUnlocked(L)){ thud(); toast('先完成第 '+(L-1)+' 關，或開啟「解鎖全部關卡」'); return; }
  pluck(noteFreq(4), .35); startLevel(L);
});
tap('bMenu', () => pause());
tap('bMute', () => setMuted(!muted));
tap('pResume', resume);
tap('pRestart', () => startLevel(G.level));
tap('pHow', () => $('how').classList.add('on'));
tap('pSel', () => show('select'));
tap('bHint', useHint);
tap('bUndo', () => { if (G.won || G.path.length<=1) return; pop(); G.ghost = []; updateUI(); });
tap('bReset', () => { if (G.won) return; truncateTo(-1); G.ghost = []; pluck(noteFreq(-5), .3); updateUI(); });
tap('rNext', () => startLevel(G.level+1));
tap('rAgain', () => startLevel(G.level));
tap('rSel', () => show('select'));

/* ---------- lifecycle ---------- */
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(layout, 60); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ cancelAnimationFrame(rafId); rafId = 0; pause(); if (AC) AC.suspend && AC.suspend(); }
  else { if (!rafId){ lastT = performance.now(); rafId = requestAnimationFrame(frame); } if (AC && !muted) AC.resume && AC.resume(); }
});
KAI = getComputedStyle(document.documentElement).getPropertyValue('--kai').trim() || 'serif';
makeBlots(); drawMuteIcon(); layout(); updateTitle();
rafId = requestAnimationFrame(frame);

/* ---------- test hook ---------- */
window.__game = {
  levels: LEVELS.length,
  start: L => startLevel(L),
  state: () => ({screen:G.screen, level:G.level, W:G.W, H:G.H, total:G.total, path:G.path.slice(), won:G.won, paused:G.paused,
                 hintsLeft:G.hintsLeft, cps:G.cps.slice(), time:elapsed(), resultShown:$('result').classList.contains('on')}),
  solution: L => decode(LEVELS[(L||G.level)-1]).sol,
  level: L => { const d = decode(LEVELS[L-1]); return {W:d.W,H:d.H,open:Array.from(d.open),walls:d.walls,cps:d.cps,sol:d.sol}; },
  cellCenter: c => { const [x,y] = cellXY(c); return {x,y}; },
  cellSize: () => G.cell,
};
</script>
