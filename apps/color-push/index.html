<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>積木推推樂</title>
<style>
:root{
--bg:#f7efe3; --ink:#4a3a2c; --ink2:#8a725c; --card:#fffaf2f0; --cardS:#fffdf8; --line:#ead9c3; --accent:#ff8fa3; --gold:#ffc23d;
--btn1:#ffa6b7; --btn2:#ff8099; --btnS:#e0607b; --sec:#f6ead9; --secS:#e2cfb4; --ov:#f3e6d3b8; --shadow:#7a5c4333;
--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
:root{ --bg:#262335; --ink:#f1e9ff; --ink2:#b4a8cf; --card:#34304bf0; --cardS:#3b3655; --line:#4a4466; --accent:#ff6b88;
--btn1:#ff7d96; --btn2:#f0587a; --btnS:#b83a5a; --sec:#423c5e; --secS:#2b2740; --ov:#1d1a2bc4; --shadow:#00000066; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus:not(:focus-visible){outline:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active,.pill:active,.btn:active,.lt:active{transform:translateY(2px)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;gap:6px}
.lvname{font-weight:800;font-size:16px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;margin-top:2px}
.bricks{display:inline-flex;gap:2px}
.bricks i{width:8px;height:7px;border-radius:2px;background:var(--line);display:block}
.stat{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.2}
.stat b{color:var(--ink);font-size:16px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bottom>*{pointer-events:auto}
.pill{height:50px;min-width:92px;padding:0 14px;border-radius:25px;background:var(--card);box-shadow:0 4px 0 var(--line),0 8px 16px var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;position:relative}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill[disabled]{opacity:.45}
.pill .badge{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 4px var(--shadow)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--cardS);border-radius:26px;box-shadow:0 6px 0 var(--line),0 18px 50px var(--shadow);padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;min-height:50px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 5px 0 var(--btnS),0 8px 18px var(--shadow)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secS)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--line);line-height:1.1}
.stars .on{color:var(--gold);text-shadow:0 3px 0 #d99a10;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:18px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between}
.ttl{margin-top:7vh;text-align:center}
.ttl h1{font-size:46px;margin:0;letter-spacing:4px;color:var(--ink);text-shadow:0 4px 0 var(--line)}
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:8px;font-size:15px}
.tbtns{width:100%;max-width:320px;padding-bottom:12px}
/* level select */
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#7bc89c}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:12px;color:var(--ink2);line-height:1.5}
.grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:max-content;gap:8px;align-content:start;touch-action:pan-y}
.chap{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--ink2);padding:10px 4px 0;display:flex;gap:8px;align-items:center}
.chap::after{content:"";flex:1;height:2px;background:var(--line);border-radius:1px}
.lt{height:70px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px;min-height:56px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .bricks i{width:6px;height:5px}
.lt.done{background:color-mix(in srgb,var(--card) 80%,#95d5b2)}
.lt.cur{outline:3px solid var(--accent);outline-offset:-1px}
.lt.lock{opacity:.55}
.lt.lock svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt.lock .n{font-size:15px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:30;background:#4a3a2cee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .35s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--sec);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:96px;height:48px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.demo{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);z-index:6;background:var(--card);border-radius:22px;padding:0 18px;min-height:44px;display:flex;align-items:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--line)}
.tut{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);z-index:4;color:var(--ink2);font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap;background:var(--card);padding:8px 14px;border-radius:14px}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{max-height:none} }
@media (orientation:landscape) and (max-height:520px){
.hud{right:auto;width:230px;flex-wrap:wrap}
.hud .hmid{order:3;flex-basis:100%;height:auto;padding:8px 12px;flex-direction:column;align-items:flex-start}
.hud .stat{text-align:left}
.bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) calc(var(--sab) + 8px) 8px}
.demo,.tut{bottom:calc(var(--sab) + 12px)}
.ttl{margin-top:2vh}.ttl h1{font-size:36px}
.selwrap{max-width:900px}
.grid{grid-template-columns:repeat(10,1fr)}
.lt{height:62px}
}
@media (hover:hover){ .btn:hover,.pill:hover,.ibtn:hover{filter:brightness(1.04)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="bricks" id="hBricks"></span></div>
    </div>
    <div class="stat">推動 <b id="hPush">0</b><br>最少 <span id="hOpt">4</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="pill" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="pill" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
  <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示<span class="badge" id="hintN">3</span></button>
</div>
<div class="tut hidden" id="tut">在任何地方滑動，讓小木偶走路、推積木</div>
<button class="demo hidden" id="demoBar">示範播放中・點這裡停止</button>

<div class="ov" id="title">
  <div class="ttl">
    <h1>積木推推樂</h1>
    <div class="sub">一推整排動・把積木推回同色格</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <button class="btn sec" id="tHelp">玩法說明</button>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>休息一下</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pDemo">觀看解答</button><button class="btn sec" id="pHelp">玩法說明</button></div>
  <button class="btn sec" id="pSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">完成！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>推動<b id="wPush">0</b></div><div>最少<b id="wOpt">0</b></div><div>最佳<b id="wBest">0</b></div><div>走路<b id="wSteps">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wShare">分享成績</button></div>
  <button class="btn sec" id="wSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新玩法</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script id="coreSrc">
/*CORE-START*/
// ---- 積木推推樂 core rules (shared by the page, the Node generator, the verifier and the hint worker) ----
// dirs: 0 up, 1 right, 2 down, 3 left
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
// terrain codes
var T_FLOOR = 0, T_WALL = 1, T_ICE = 2, T_TGT = 3 /* 3..8 = target colour 0..5 */, T_DOOR = 10 /* 10..13 = door dir */, T_PAINT = 20 /* 20..25 = paint colour */;
function isTgt(t) { return t >= 3 && t <= 8; }
function isDoor(t) { return t >= 10 && t <= 13; }
function isPaint(t) { return t >= 20 && t <= 25; }
// Level text: t = terrain rows ("#" wall, "." floor, "~" ice, "A-F" target, "^>v<" one-way door, "1-6" paint cell)
//             o = object rows ("a-f" block, "@" pusher), g = glue pairs [[cellA, cellB], ...] (cells index into the grid), P = push limit (0 = unlimited)
function parseLevel(def) {
  var tr = def.t.split('/'), orow = def.o.split('/');
  var h = tr.length, w = tr[0].length, N = w * h;
  var ter = new Uint8Array(N), pos = [], col = [], p = -1, tg = [], hasIce = false, hasDoor = false, hasPaint = false;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var c = y * w + x, ch = tr[y][x], oc = orow[y][x], k;
    if (ch === '#') ter[c] = T_WALL;
    else if (ch === '~') { ter[c] = T_ICE; hasIce = true; }
    else if ((k = 'ABCDEF'.indexOf(ch)) >= 0) { ter[c] = T_TGT + k; tg.push(c); }
    else if ((k = '^>v<'.indexOf(ch)) >= 0) { ter[c] = T_DOOR + k; hasDoor = true; }
    else if ((k = '123456'.indexOf(ch)) >= 0) { ter[c] = T_PAINT + k; hasPaint = true; }
    if ((k = 'abcdef'.indexOf(oc)) >= 0) { pos.push(c); col.push(k); }
    else if (oc === '@') p = c;
  }
  var nb = new Int16Array(N * 4);
  for (c = 0; c < N; c++) for (var d = 0; d < 4; d++) {
    var nx = c % w + DX[d], ny = ((c / w) | 0) + DY[d];
    nb[c * 4 + d] = (nx < 0 || ny < 0 || nx >= w || ny >= h) ? -1 : ny * w + nx;
  }
  var mate = []; for (var i = 0; i < pos.length; i++) mate.push(-1);
  (def.g || []).forEach(function (pr) { var a = pos.indexOf(pr[0]), b = pos.indexOf(pr[1]); if (a >= 0 && b >= 0) { mate[a] = b; mate[b] = a; } });
  var L = { w: w, h: h, N: N, ter: ter, nb: nb, tg: tg, mate: mate, P: def.P || 0, n: pos.length,
    hasIce: hasIce, hasDoor: hasDoor, hasPaint: hasPaint, hasGlue: (def.g || []).length > 0, S0: { p: p, pos: pos, col: col } };
  L.tgC = [[], [], [], [], [], []]; tg.forEach(function (c) { L.tgC[ter[c] - T_TGT].push(c); });
  // targets a block of colour k could still end on (its own colour, or any colour a paint cell can give it)
  var pc = {}; for (c = 0; c < N; c++) if (isPaint(ter[c])) pc[ter[c] - T_PAINT] = 1;
  L.tgK = L.tgC.map(function (lst, k) { return tg.filter(function (c) { var tk = ter[c] - T_TGT; return tk === k || pc[tk]; }); });
  // longest straight run of ice (+1) = most cells one push can carry a block
  var run = 0;
  for (c = 0; c < N; c++) if (ter[c] === T_ICE) for (d = 1; d <= 2; d++) { var k2 = 0, cc = c; while (cc >= 0 && ter[cc] === T_ICE) { k2++; cc = nb[cc * 4 + d]; } if (k2 > run) run = k2; }
  L.iceStep = run ? run + 1 : 1;
  buildDist(L);
  return L;
}
function initState(L) { return { p: L.S0.p, pos: L.S0.pos.slice(), col: L.S0.col.slice() }; }
function cloneState(S) { return { p: S.p, pos: S.pos.slice(), col: S.col.slice() }; }
// can something moving in dir d enter cell c?
function enterable(L, c, d) { if (c < 0) return false; var t = L.ter[c]; return t !== T_WALL && (!isDoor(t) || t - T_DOOR === d); }
function isWon(L, S) {
  for (var i = 0; i < S.pos.length; i++) { var t = L.ter[S.pos[i]]; if (!isTgt(t) || t - T_TGT !== S.col[i]) return false; }
  return true;
}
// One player move. Returns null when nothing happens (L.why = 'wall' | 'block' | 'heavy'),
// else { S, push, set:[ids moved], paths:{id:[cells]}, maxRow, slid, paint:[{id,c,col}] }
function step(L, S, d, lite) {
  var nb = L.nb, n = nb[S.p * 4 + d];
  if (!enterable(L, n, d)) { L.why = 'wall'; return null; }
  var occ = L._occ || (L._occ = new Int16Array(L.N)); occ.fill(-1);
  for (var i = 0; i < S.pos.length; i++) occ[S.pos[i]] = i;
  if (occ[n] < 0) return { S: { p: n, pos: S.pos, col: S.col }, push: false };
  // collect the moving set: the row in front + glued partners + whatever they shove
  var inSet = L._in || (L._in = new Uint8Array(64)); inSet.fill(0);
  var set = [occ[n]]; inSet[occ[n]] = 1;

worker = new Worker(URL.createObjectURL(new Blob([src], { type:'text/javascript' })));
}catch(e){ worker = null; }

}
function showHint(h){

function askHint(){

var key = blockKey(S), k = L.solKeys.lastIndexOf(key);
if (k >= 0 && k < L.sol.length && (L.sol[k].c === S.p || walkPath(L, S, L.sol[k].c))){ showHint(L.sol[k]); return; }

var done = function(res){

if (lv !== levelN || status !== 'play') return;
if (res && res.len > 0 && res.p){ showHint(res.p); }
else if (res && res.len === -1){ toast('這個局面已經卡住了，先悔棋或重來吧！'); }
else toast('這個局面太複雜了，先重來再試試提示？');

var id = ++workerId, timer = setTimeout(function(){ w.onmessage = null; done(null); }, 1500);
w.onmessage = function(e){ if (e.data.id !== id) return; clearTimeout(timer); done(e.data); };

function makeBg(){
var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W*DPR)); c.height = Math.max(1, Math.round(H*DPR));
var g = c.getContext('2d'); g.scale(DPR, DPR);
g.fillStyle = TH.mat; g.fillRect(0, 0, W, H);
var T = 92, cols = Math.ceil(W/T)+1, rows = Math.ceil(H/T)+1;
for (var y=0;y<rows;y++) for (var x=0;x<cols;x++){ g.fillStyle = TH.tiles[(x + y*2) % 4]; g.fillRect(x*T, y*T, T, T); }
for (y=0;y<rows;y++) for (x=0;x<cols;x++){
g.fillStyle = TH.tiles[(x + y*2) % 4];
if ((x+y)%2){ g.beginPath(); g.arc(x*T + T, y*T + T/2, 9, 0, 6.283); g.fill(); g.beginPath(); g.arc(x*T + T/2, y*T + T, 9, 0, 6.283); g.fill(); }
else { g.fillStyle = TH.tiles[(x+1 + y*2) % 4]; g.beginPath(); g.arc(x*T + T, y*T + T/2, 9, 0, 6.283); g.fill(); g.fillStyle = TH.tiles[(x + (y+1)*2) % 4]; g.beginPath(); g.arc(x*T + T/2, y*T + T, 9, 0, 6.283); g.fill(); }
}
g.strokeStyle = TH.seam; g.lineWidth = 1.2;
for (x=0;x<=cols;x++){ g.beginPath(); g.moveTo(x*T, 0); g.lineTo(x*T, H); g.stroke(); }
for (y=0;y<=rows;y++){ g.beginPath(); g.moveTo(0, y*T); g.lineTo(W, y*T); g.stroke(); }
g.fillStyle = dark ? 'rgba(255,255,255,.03)' : 'rgba(122,92,67,.04)';
for (var i=0;i<W*H/900;i++){ g.beginPath(); g.arc(Math.random()*W, Math.random()*H, 1.2, 0, 6.283); g.fill(); }
if (dark){ for (i=0;i<36;i++){ g.fillStyle = 'rgba(255,240,200,' + (0.15+Math.random()*0.35) + ')'; g.beginPath(); g.arc(Math.random()*W, Math.random()*H, 0.8+Math.random()*1.2, 0, 6.283); g.fill(); } }
return c;
}

ctx.strokeStyle = TH.floorLine; ctx.lineWidth = 1;
ctx.beginPath(); for (x=1;x<w;x++){ ctx.moveTo(ox + x*s + .5, oy); ctx.lineTo(ox + x*s + .5, oy + h*s); } for (y=1;y<h;y++){ ctx.moveTo(ox, oy + y*s + .5); ctx.lineTo(ox + w*s, oy + y*s + .5); } ctx.stroke();
for (c=0;c<L.N;c++){
x = ox + (c % w)*s; y = oy + ((c / w)|0)*s; t = L.ter[c];
if (t === T_ICE) drawIce(ctx, x, y, s, time);
else if (isTgt(t)) drawTarget(ctx, x, y, s, COLS[t - T_TGT], time);
else if (isDoor(t)) drawDoor(ctx, x, y, s, t - T_DOOR, time);
else if (isPaint(t)) drawPaint(ctx, x, y, s, COLS[t - T_PAINT]);
}
for (c=0;c<L.N;c++) if (L.ter[c] === T_WALL) drawWall(ctx, ox + (c % w)*s, oy + ((c / w)|0)*s, s, c);
if (hint && status !== 'won'){
hint.t += 0;
var cur = S.p, pulse = 0.5 + 0.5*Math.sin(time*6);
ctx.fillStyle = dark ? 'rgba(255,220,120,.8)' : 'rgba(230,140,40,.75)';
for (var i=0;i<hint.path.length;i++){ cur = L.nb[cur*4 + hint.path[i]]; var pc = cxy(cur); ctx.beginPath(); ctx.arc(ox + (pc.x+.5)*s, oy + (pc.y+.5)*s, s*0.07, 0, 6.283); ctx.fill(); }
}
var ents = [], vs = anim ? anim.from : S;
for (var b=0;b<vs.pos.length;b++){
var bp = anim ? animBlockPos(b) : cxy(S.pos[b]);
var colI = vs.col[b];
if (anim && anim.r.paint) for (var k=0;k<anim.r.paint.length;k++) if (anim.r.paint[k].id === b && anim.paintDone[k]) colI = anim.r.paint[k].col;
ents.push({ kind:'b', id:b, x:bp.x, y:bp.y, col:colI });
}
var pp;
if (anim){ var a0 = cxy(anim.from.p), a1 = cxy(anim.r.S.p), u = easeOut(Math.min(1, anim.t/anim.t0)); pp = { x:a0.x + (a1.x-a0.x)*u, y:a0.y + (a1.y-a0.y)*u }; }
else pp = cxy(S.p);
ents.push({ kind:'p', x:pp.x, y:pp.y });
ents.sort(function(e1, e2){ return e1.y - e2.y || (e1.kind === 'p' ? 1 : -1); });
var glueDraw = [];
for (i=0;i<ents.length;i++){
var e = ents[i];
if (e.kind === 'b'){
var ex = e.x, ey = e.y, lift = 0;
var rc = effects.recoil[e.id]; if (rc){ var tt = rc.t; var off = Math.sin(tt*34)*Math.exp(-tt*13)*0.07; ex += DX[rc.d]*off; ey += DY[rc.d]*off; }
if (effects.heavyWig > 0 && !anim){ var nb0 = L.nb[S.p*4 + effects.wobbleDir]; if (nb0 >= 0){ var row = 0, cc = nb0; while (cc >= 0 && row < 12){ var occ = S.pos.indexOf(cc); if (occ < 0) break; if (occ === e.id){ ex += Math.sin(time*60)*0.03*effects.heavyWig*2; break; } cc = L.nb[cc*4 + effects.wobbleDir]; row++; } } }
var bo = effects.bounce[e.id]; if (bo != null) lift = Math.sin(Math.min(1, bo/0.35)*Math.PI)*s*0.22;
if (effects.winT >= 0){ var wt = effects.winT - e.id*0.07; if (wt > 0 && wt < 0.5) lift = Math.max(lift, Math.sin(wt/0.5*Math.PI)*s*0.45); }
var ter = L.ter[S.pos[e.id]], ok = !anim && isTgt(ter) && ter - T_TGT === e.col;
drawBlock(ctx, ox + ex*s, oy + ey*s, s, COLS[e.col], { lift: lift, ok: ok, glow: dark || ok && TH.glow });
var m = L.mate[e.id]; if (m > e.id) glueDraw.push([e.id, m]);
} else {
var lean = 0, squash = 0;
if (anim && anim.r.push){ lean = Math.sin(Math.min(1, anim.t/anim.t0)*Math.PI); squash = lean; }
if (effects.wobble > 0) squash = Math.max(squash, Math.sin(effects.wobble*Math.PI)*0.6);
var sh = effects.shakeHead > 0 ? Math.sin(effects.shakeHead*40)*effects.shakeHead*2 : 0;
var hop = effects.winT >= 0 ? Math.abs(Math.sin(effects.winT*7))*Math.max(0, 1 - effects.winT*0.6) : 0;
drawPuppet(ctx, ox + e.x*s, oy + e.y*s, s, face, { lean: lean, squash: squash, shake: sh, hop: hop, strain: lean > 0.2 || effects.heavyWig > 0, blink: (time % 3.2) < 0.12 });
}
}
for (i=0;i<glueDraw.length;i++){
var g1 = ents.find(function(q){ return q.kind === 'b' && q.id === glueDraw[i][0]; }), g2 = ents.find(function(q){ return q.kind === 'b' && q.id === glueDraw[i][1]; });
drawGlue(ctx, ox + g1.x*s, oy + g1.y*s, ox + g2.x*s, oy + g2.y*s, s);
}
if (hint && status !== 'won'){
var hc = cxy(hint.c), hd = hint.d, pl = 0.5 + 0.5*Math.sin(time*6);
ctx.save(); ctx.translate(ox + (hc.x + .5 + DX[hd])*s, oy + (hc.y + .45 + DY[hd])*s); ctx.rotate(hd*Math.PI/2);
ctx.translate(0, -pl*s*0.1);
ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6;
ctx.fillStyle = dark ? '#ffcc4a' : '#ff9b3d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s*0.06); ctx.lineJoin = 'round';
ctx.beginPath(); ctx.moveTo(0, -s*0.34); ctx.lineTo(s*0.28, -s*0.04); ctx.lineTo(s*0.11, -s*0.04); ctx.lineTo(s*0.11, s*0.26); ctx.lineTo(-s*0.11, s*0.26); ctx.lineTo(-s*0.11, -s*0.04); ctx.lineTo(-s*0.28, -s*0.04); ctx.closePath();
ctx.stroke(); ctx.shadowBlur = 0; ctx.fill(); ctx.restore();
}
for (i=effects.rings.length-1;i>=0;i--){
var rg = effects.rings[i]; var k2 = rg.t/0.6;
ctx.strokeStyle = rg.col; ctx.globalAlpha = Math.max(0, 1-k2); ctx.lineWidth = Math.max(2, s*0.08*(1-k2));
ctx.beginPath(); ctx.arc(ox + (rg.x+.5)*s, oy + (rg.y+.5)*s, s*(0.4 + k2*0.5), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
}
for (i=0;i<particles.length;i++){
var q = particles[i], al = Math.max(0, q.life/q.max);
ctx.globalAlpha = al; ctx.fillStyle = q.col;
var qx = ox + q.x*s, qy = oy + q.y*s, qr = q.r*s;
if (q.sq){ ctx.save(); ctx.translate(qx, qy); ctx.rotate(q.rot + time*5); ctx.fillRect(-qr, -qr*0.7, qr*2, qr*1.4); ctx.restore(); }
else if (q.star){ ctx.save(); ctx.translate(qx, qy); ctx.rotate(time*4); ctx.beginPath(); for (var j=0;j<10;j++){ var rad = j%2 ? qr*0.45 : qr*1.4; ctx.lineTo(Math.cos(j*Math.PI/5)*rad, Math.sin(j*Math.PI/5)*rad); } ctx.fill(); ctx.restore(); }
else { ctx.beginPath(); ctx.arc(qx, qy, qr, 0, 6.283); ctx.fill(); }
}
ctx.globalAlpha = 1;
if (L.P){
ctx.fillStyle = dark ? '#b4a8cf' : '#8a725c'; ctx.font = '700 12px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
ctx.fillText('推力上限：一次最多推 ' + L.P + ' 塊', ox + w*s/2, oy + h*s + fp + 5);
}
}
function update(dt){
time += dt;
stepAnim(dt);
stepDemo(dt);
for (var k in effects.recoil){ effects.recoil[k].t += dt; if (effects.recoil[k].t > 0.4) delete effects.recoil[k]; }
for (k in effects.bounce){ effects.bounce[k] += dt; if (effects.bounce[k] > 0.35) delete effects.bounce[k]; }
for (var i=effects.rings.length-1;i>=0;i--){ effects.rings[i].t += dt; if (effects.rings[i].t > 0.6) effects.rings.splice(i, 1); }
if (effects.wobble > 0) effects.wobble = Math.max(0, effects.wobble - dt*5);
if (effects.shakeHead > 0) effects.shakeHead = Math.max(0, effects.shakeHead - dt);
if (effects.heavyWig > 0) effects.heavyWig = Math.max(0, effects.heavyWig - dt);
if (effects.winT >= 0) effects.winT += dt;
for (i=particles.length-1;i>=0;i--){ var p = particles[i]; p.life -= dt; if (p.life <= 0){ particles.splice(i, 1); continue; } p.x += p.vx*dt; p.y += p.vy*dt; if (p.g) p.vy += p.g*dt; p.vx *= 0.97; }
}
var last = 0, running = true;
function frame(ts){
if (!running) return;
var dt = Math.min(0.05, last ? (ts - last)/1000 : 0.016); last = ts;
update(dt); draw();
requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', function(){
if (document.hidden){ running = false; if (AC && AC.state === 'running') AC.suspend().catch(function(){}); }
else if (!running){ running = true; last = 0; requestAnimationFrame(frame); }
});
/* ---------- input ---------- */
var ptr = null;
function canPlay(){ return (status === 'play' || status === 'anim') && L; }
cv.addEventListener('pointerdown', function(e){
if (!canPlay()) return;
audio();
if (demo){ stopDemo(); }
ptr = { id:e.pointerId, x0:e.clientX, y0:e.clientY, ax:e.clientX, ay:e.clientY, t0:performance.now(), moved:false, dir:-1, timer:null };
try{ cv.setPointerCapture(e.pointerId); }catch(er){}
});
function holdRepeat(){
if (!ptr || ptr.dir < 0) return;
tryMove(ptr.dir);
ptr.timer = setTimeout(holdRepeat, 140);
}
cv.addEventListener('pointermove', function(e){
if (!ptr || e.pointerId !== ptr.id) return;
var dx = e.clientX - ptr.ax, dy = e.clientY - ptr.ay;
if (Math.abs(e.clientX - ptr.x0) > 10 || Math.abs(e.clientY - ptr.y0) > 10) ptr.moved = true;
if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
ptr.ax = e.clientX; ptr.ay = e.clientY;
if (d === ptr.dir) return;
ptr.dir = d; clearTimeout(ptr.timer);
tryMove(d);
ptr.timer = setTimeout(holdRepeat, 280);
});
function endPtr(e){
if (!ptr || e.pointerId !== ptr.id) return;
clearTimeout(ptr.timer);
if (!ptr.moved && performance.now() - ptr.t0 < 500 && e.type === 'pointerup'){
var gx = Math.floor((e.clientX - board.x)/board.s), gy = Math.floor((e.clientY - board.y)/board.s);
if (gx >= 0 && gy >= 0 && gx < L.w && gy < L.h) walkTo(gy*L.w + gx);
}
ptr = null;
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
document.addEventListener('keydown', function(e){
var k = e.key;
if (status === 'title' && (k === 'Enter' || k === ' ')){ $('tPlay').click(); return; }
if (!canPlay()){ if (k === 'Escape' && !$('pause').classList.contains('hidden')) resume(); return; }
var map = { ArrowUp:0, w:0, W:0, ArrowRight:1, d:1, D:1, ArrowDown:2, s:2, S:2, ArrowLeft:3, a:3, A:3 };
if (map[k] !== undefined){ e.preventDefault(); if (demo) stopDemo(); tryMove(map[k]); }
else if (k === 'z' || k === 'Z' || k === 'Backspace'){ e.preventDefault(); undo(); }
else if (k === 'r' || k === 'R'){ restart(); }
else if (k === 'h' || k === 'H'){ askHint(); }
else if (k === 'Escape' || k === 'p'){ pauseGame(); }
});
/* ---------- UI ---------- */
var OVS = ['title','select','pause','win','help','intro'];
function showOnly(id){ OVS.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); }); }
var toastT = null;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.opacity = 0; toastT = setTimeout(function(){ t.classList.add('hidden'); }, 400); }, 2000); }
var toastSeen = {};
function toastOnce(k, msg){ if (toastSeen[k] && Date.now() - toastSeen[k] < 6000) return; toastSeen[k] = Date.now(); toast(msg); }
function pauseGame(){
if (status === 'anim') flushAnim();
if (status !== 'play') return;
if (demo) stopDemo();
status = 'paused';
$('pInfo').textContent = '第 ' + levelN + ' 關・推動 ' + pushes + '・最少 ' + L.m + (starsS[levelN] ? '・最佳 ' + '★★★'.slice(0, starsS[levelN]) : '');
showOnly('pause');
}

function renderGrid(){
var g = $('grid'), html = '', cur = firstOpen();
for (var n=1;n<=NL;n++){
for (var c=0;c<CHAPTERS.length;c++) if (CHAPTERS[c].lv === n) html += '<div class="chap">' + CHAPTERS[c].name + '</div>';
if (!unlocked(n)){ html += '<button class="lt lock" data-n="'+n+'" aria-label="第 '+n+' 關（未解鎖）"><span class="n">'+n+'</span><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="bricks">'+bricksHtml(n)+'</span></button>'; continue; }
var st = starsS[n]||0, sh = '';
for (var i=0;i<3;i++) sh += '<span class="'+(i<st?'on':'')+'">★</span>';
html += '<button class="lt'+(isDone(n)?' done':'')+(n===cur?' cur':'')+'" data-n="'+n+'" aria-label="第 '+n+' 關，難度 '+DN[n-1]+'"><span class="n">'+n+'</span><span class="st">'+sh+'</span><span class="bricks">'+bricksHtml(n)+'</span></button>';
}
g.innerHTML = html;
var done = 0, stars = 0; for (n=1;n<=NL;n++){ if (isDone(n)) done++; stars += starsS[n]||0; }
$('selSum').textContent = '已過關 ' + done + '/' + NL + '・★ ' + stars + '/' + (NL*3) + '・總推動 ' + stats.pushes + ' 次・最長一推 ' + stats.longest + ' 塊';
$('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
function openSelect(){
status = 'select'; renderGrid(); showOnly('select'); $('hud').classList.add('hidden'); $('bottom').classList.add('hidden'); $('tut').classList.add('hidden'); stopDemo();
var cur = $('grid').querySelector('.cur'); if (cur) setTimeout(function(){ try{ cur.scrollIntoView({ block:'center' }); }catch(e){} }, 30);
}
function miniScene(key){
var cnv = document.createElement('canvas'), s = 32, cw = 3, chh = 1.5;
cnv.width = cw*s*2; cnv.height = chh*s*2;
var g = cnv.getContext('2d'); g.scale(2, 2);
g.fillStyle = TH.floor; rr(g, 0, 0, cw*s, chh*s, 8); g.fill();
var y0 = s*0.25;
if (key === 'basic'){ drawPuppet(g, 0, y0, s, 1); drawBlock(g, s, y0, s, COLS[0]); drawBlock(g, 2*s, y0, s, COLS[0]); }
else if (key === 'color'){ drawBlock(g, 0, y0, s, COLS[1]); drawTarget(g, s, y0, s, COLS[1]); drawBlock(g, 2*s, y0, s, COLS[2], { ok:false }); }
else if (key === 'split'){ drawPuppet(g, 0, y0, s, 1); drawBlock(g, s, y0, s, COLS[0]); drawBlock(g, 2*s, y0, s, COLS[1]); }
else if (key === 'ice'){ drawIce(g, s, y0, s, 0); drawIce(g, 2*s, y0, s, 0); drawBlock(g, 0, y0, s, COLS[1]); }
else if (key === 'power'){ drawBlock(g, 0, y0, s, COLS[3]); drawBlock(g, s, y0, s, COLS[2]); drawBlock(g, 2*s, y0, s, COLS[0]); }
else if (key === 'glue'){ drawBlock(g, 0.5*s, y0, s, COLS[4]); drawBlock(g, 1.5*s, y0, s, COLS[1]); drawGlue(g, 0.5*s, y0, 1.5*s, y0, s); }
else if (key === 'paint'){ drawBlock(g, 0, y0, s, COLS[0]); drawPaint(g, s, y0, s, COLS[3]); drawBlock(g, 2*s, y0, s, COLS[3]); }
else if (key === 'door'){ drawPuppet(g, 0, y0, s, 1); drawDoor(g, s, y0, s, 1, 0.3); drawDoor(g, 2*s, y0, s, 3, 0.3); }
else { drawIce(g, 0, y0, s, 0); drawDoor(g, s, y0, s, 1, 0.3); drawPaint(g, 2*s, y0, s, COLS[2]); }

}
