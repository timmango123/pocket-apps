<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>數回</title>
<script>
/* apply the saved theme before first paint */
(function(){ var t = 'auto'; try{ t = JSON.parse(localStorage.getItem('slitherlink:v1:theme')) || 'auto'; }catch(e){}
var d = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();
</script>
<style>
:root{
--bg:#efe7d8; --bg2:#e6dcc8; --paper:#fbf7ee; --ink:#2b251e; --ink2:#75695a; --ink3:#a3967f; --card:#fffdf8f2; --card2:#f4ede0; --rule:#e2d7c3;
--red:#c8402c; --red2:#a83322; --redsoft:#c8402c1f; --teal:#1d8a84; --tealsoft:#1d8a8424; --gold:#e3a72f; --err:#d3261c;
--sh1:0 2px 0 #0000000a,0 4px 14px #5a42200f; --sh2:0 16px 50px #4a361a33;
--ovbg:#efe7d8b8; --lock:#ebe3d4; --tile:#fffdf8; --tileSh:#dccfb8; --done:#f7e9e2;
--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="dark"]{
--bg:#11141d; --bg2:#0b0d14; --paper:#181c28; --ink:#eee7da; --ink2:#a69e90; --ink3:#6f6a62; --card:#1d2230f2; --card2:#252b3b; --rule:#2c3343;
--red:#f0b048; --red2:#c98a22; --redsoft:#f0b0481f; --teal:#52d0c4; --tealsoft:#52d0c426; --gold:#f0b048; --err:#ff5a50;
--sh1:0 2px 0 #00000033,0 4px 14px #0000004d; --sh2:0 16px 50px #00000080;
--ovbg:#0b0d14b8; --lock:#1a1e29; --tile:#1f2433; --tileSh:#0c0e15; --done:#2c2a26;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hidden{display:none !important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;flex:none;color:var(--ink);transition:transform .12s}
.ibtn:active{transform:scale(.92)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;gap:8px}
.lvl{min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.lvsub{font-size:11px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.pips{display:inline-flex;gap:2px;align-items:center}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--rule)}
.pips i.on{background:var(--red)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap}
.clock svg{width:15px;height:15px;stroke:var(--ink2)}
/* ---------- tool bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
.bar > *{pointer-events:auto}
.tb{flex:1;max-width:92px;min-width:0;height:56px;border-radius:16px;background:var(--card);box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink);transition:transform .12s,background .2s,color .2s}
.tb:active{transform:scale(.93)}
.tb[disabled]{opacity:.38}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tb .k{font-size:12px;line-height:1}
.tb{position:relative}
.tb .badge{position:absolute;top:4px;right:calc(50% - 36px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;line-height:17px;text-align:center}
.tb .badge.zero{background:var(--rule);color:var(--ink2)}
:root[data-theme="dark"] .tb .badge:not(.zero){color:#10201e}
.tb.hl{background:var(--teal);color:#fff}
@media (orientation: landscape) and (max-height:520px){
.bar{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--sat) + 60px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) 6px;gap:6px}
.tb{flex:none;width:76px;height:50px;max-width:none}
.hud{right:calc(var(--sar) + 86px)}
}
.zoomfit{position:fixed;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 62px);z-index:4}
@media (orientation: landscape) and (max-height:520px){ .zoomfit{right:calc(var(--sar) + 100px)} }
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);background:var(--ovbg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .22s ease}
@media (max-height:620px){ .ov{align-items:flex-start;overflow-y:auto} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:translateY(14px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh2);padding:22px 20px 20px;width:min(380px,100%);text-align:center;animation:pop .32s cubic-bezier(.2,.8,.3,1);margin:auto;position:relative}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2);transition:transform .1s,box-shadow .1s;letter-spacing:1px}
:root[data-theme="dark"] .btn:not(.sec){color:#221a0c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--rule)}
.btn.sec:active{box-shadow:0 1px 0 var(--rule)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
.stars svg{width:42px;height:42px;fill:var(--rule);stroke:none}
.stars svg.on{fill:var(--gold);animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-50deg)}to{transform:none}}
.res{display:flex;justify-content:center;gap:22px;margin:6px 0 4px;font-size:12px;color:var(--ink2)}
.res b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.res .best{color:var(--teal);font-size:11px;font-weight:700}
#win{align-items:flex-end;background:transparent;animation:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#win .card{margin:auto auto 0;will-change:transform}
#win{will-change:opacity}
.bar{transition:opacity .25s}
body.ov-win .bar{opacity:0;pointer-events:none}
@media (max-height:620px){
#win .card{padding:12px 14px 14px;border-radius:20px}
#win h2{font-size:20px;margin:0 0 2px}
#win .stars svg{width:30px;height:30px}
#win .res{margin:2px 0 0;gap:18px}
#win .res b{font-size:17px}
#win p{display:none}
#win .btn{min-height:46px;font-size:15px;margin-top:8px}
}
@media (orientation: landscape) and (max-height:520px){ #win{justify-content:flex-start;align-items:center} #win .card{margin:auto auto auto 0;width:min(340px,48vw);padding:16px} #win .stars svg{width:34px;height:34px} }
/* ---------- title ---------- */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:stretch}
.ttl{margin-top:5vh;text-align:center}
.ttl h1{margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;font-size:64px;letter-spacing:14px;padding-left:14px;color:var(--ink);line-height:1.05}
.ttl h1 span{color:var(--red)}
.ttl .sub{margin-top:10px;font-size:15px;color:var(--ink2);letter-spacing:1px}
.seal{display:inline-block;margin-top:12px;border:2px solid var(--red);color:var(--red);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800;letter-spacing:3px;transform:rotate(-3deg)}
.tbtns{display:flex;flex-direction:column;align-items:center;padding:0 8px calc(var(--sab) + 4px)}
.tbtns .btn{max-width:340px}
.tsmall{display:flex;gap:10px;margin-top:12px;justify-content:center}
.tstat{margin-top:12px;font-size:13px;color:var(--ink2);text-align:center}
@media (orientation: landscape) and (max-height:520px){
#title{flex-direction:row;align-items:center;justify-content:space-around}
.ttl{margin-top:0}.ttl h1{font-size:48px}
.tbtns{width:min(340px,46vw);padding-bottom:0}
}
/* ---------- level select ---------- */
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 4px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap;font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;letter-spacing:2px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px;white-space:nowrap}
.sw .trk{width:44px;height:26px;border-radius:13px;background:var(--rule);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--teal)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 calc(var(--sar) + 16px) 4px calc(var(--sal) + 16px);font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 24px) calc(var(--sal) + 12px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y;overscroll-behavior:contain}
@media (min-width:600px){ .grid{grid-template-columns:repeat(10,1fr)} }
.ch{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;padding:14px 4px 2px;border-bottom:1px solid var(--rule);margin-bottom:2px}
.ch b{font-family:"Noto Serif TC","Songti TC",serif;font-size:18px;font-weight:900;letter-spacing:2px}
.ch span{font-size:12px;color:var(--ink2);flex:1;min-width:0}
.ch em{font-style:normal;font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.lt{height:60px;border-radius:14px;background:var(--tile);box-shadow:0 3px 0 var(--tileSh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-variant-numeric:tabular-nums}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{display:flex;gap:1px}
.lt .st svg{width:11px;height:11px;fill:var(--rule)}
.lt .st svg.on{fill:var(--gold)}
.lt.done{background:var(--done)}
.lt.cur{box-shadow:0 3px 0 var(--tileSh),inset 0 0 0 2.5px var(--red)}
.lt.prog::after{content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
.lt.lock{background:var(--lock);box-shadow:0 3px 0 var(--tileSh);color:var(--ink3)}
.lt.lock svg.i{width:16px;height:16px}
.lt:active{transform:scale(.95)}
/* ---------- hint box & toast ---------- */
.hintbox{will-change:transform;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 78px);z-index:7;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--sh2);padding:12px 14px 12px;width:min(440px,calc(100vw - 20px));animation:hpop .28s cubic-bezier(.2,.8,.3,1)}
@keyframes hpop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.hhead{display:flex;align-items:center;gap:8px;margin:-4px -6px 4px 0}
.chip{font-size:12px;font-weight:800;color:var(--teal);background:var(--tealsoft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.hhead .sp{flex:1}
.hx{width:44px;height:44px;margin:-4px 0;display:grid;place-items:center;color:var(--ink2)}
.htxt{font-size:14.5px;line-height:1.6;text-align:left}
.htxt b{color:var(--red)}
.hact{display:flex;gap:8px;margin-top:8px}
.hact button{flex:1;height:44px;border-radius:12px;font-weight:800;font-size:15px;background:var(--card2)}
.hact button.pri{background:var(--teal);color:#fff}
@media (orientation: landscape) and (max-height:520px){ .hintbox{bottom:calc(var(--sab) + 8px);left:calc(var(--sal) + 10px);transform:none;width:min(360px,44vw);animation:none} }
.toast{position:fixed;left:50%;top:calc(var(--sat) + 6px);min-height:44px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--sh2);max-width:calc(100vw - 24px);width:max-content;text-align:center;transition:opacity .3s;pointer-events:none;line-height:1.35}
@media (orientation: landscape) and (max-height:520px){ .toast{top:calc(var(--sat) + 10px);max-width:min(640px,72vw);padding:8px 16px} }
/* ---------- help ---------- */
.helpscroll{max-height:min(58vh,520px);overflow-y:auto;margin:4px -8px 0;padding:0 8px;text-align:left;touch-action:pan-y;overscroll-behavior:contain}
.hs{display:flex;gap:12px;align-items:center;margin:10px 0;background:var(--card2);border-radius:16px;padding:10px 12px}
.hs svg{flex:none;width:78px;height:62px}
.hs div{font-size:14px;color:var(--ink2);line-height:1.55;text-align:left;min-width:0}
.hs b{display:block;color:var(--ink);font-size:15px;margin-bottom:1px}
.hsec{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:2px;margin:14px 2px 0}
.dg .dot{fill:var(--ink)} .dg .ln{stroke:var(--red);stroke-width:4;stroke-linecap:round;fill:none} .dg .x{stroke:var(--ink3);stroke-width:1.8;stroke-linecap:round}
.dg text{font:700 15px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dg .gh{stroke:var(--teal);stroke-width:3;stroke-dasharray:4 4;stroke-linecap:round;fill:none}
.dg .hc{fill:var(--tealsoft)}
.dg .bad{stroke:var(--err)}
/* settings rows */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:6px 4px;text-align:left;font-weight:700;font-size:15px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:52px;height:38px;border-radius:9px;font-size:13px;font-weight:800;color:var(--ink2);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .tb:hover,.ibtn:hover,.lt:hover{filter:brightness(1.04)} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
const stop = e => e.preventDefault();
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
const live = new Set();
const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
Tracked.prototype = AC.prototype;
window.AudioContext = Tracked;
if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
document.addEventListener('visibilitychange', wake);
['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="數回盤面：點邊畫線，再點一次打叉，拖曳可連續畫線"></canvas>
<div class="hud hidden" id="hud">
<button class="ibtn" id="bPause" aria-label="暫停與選單"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
<div class="hmid">
<div class="lvl"><div class="lvname" id="hLevel">第 1 關</div><div class="lvsub"><span id="hSize">5×5</span><span class="pips" id="hPips"></span><span id="hCh">初筆</span></div></div>
<div class="clock" aria-label="用時"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="hTime">0:00</span></div>
</div>
<button class="ibtn" id="bMute" aria-label="音效"><svg class="i" viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>
<button class="ibtn zoomfit hidden" id="bFit" aria-label="縮回全圖"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path d="M9 12h6"/></svg></button>
<div class="bar hidden" id="bar">
<button class="tb" id="bUndo" aria-label="復原"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span class="k">復原</span></button>
<button class="tb" id="bRedo" aria-label="重做"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg><span class="k">重做</span></button>
<button class="tb" id="bMode" aria-pressed="false" aria-label="切換打叉模式"><svg class="i" viewBox="0 0 24 24" id="modeIcon"></svg><span class="k" id="modeTxt">畫線</span></button>
<button class="tb" id="bCheck" aria-label="檢查錯誤"><svg class="i" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg><span class="k">檢查</span><span class="badge" id="ckLeft" aria-hidden="true">3</span></button>
<button class="tb" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span class="k">提示</span></button>
</div>
<div class="ov" id="title">
<div class="ttl">
<h1>數<span>回</span></h1>
<div class="sub">依數字畫出一條封閉迴路</div>
<div class="seal">百題</div>
</div>
<div class="tbtns">
<button class="btn" id="tPlay">開始遊戲</button>
<button class="btn sec" id="tSelect">選擇關卡</button>
<div class="tsmall">

  hs(D.trial, '假設法', '卡住時，假設某條邊畫線（或打 ✕），照規則往下推；如果推出矛盾，就代表正好相反。提示會用虛線演示整個推理。') +
  '<div class="hsec">工具</div>' +
  hs(diag(2, 1, { lines: [[0, 0, 1, 0]], xs: [[1, 0, 2, 0, 1]] }), '檢查與提示', '「檢查」會把畫錯的線和 ✕ 標成紅色（「檢查」標出錯處和「提示」指出錯處合計有次數限制，數字顯示在按鈕上；用完後只告訴你錯幾處。前 15 關不限次數）；「提示」會指出下一步並說明理由，可以按「幫我畫上」。不用提示、在目標時間內完成，可拿滿三顆星。');
var INTROS = {
  1: ['畫一條封閉迴路', hs(D.rules, '規則', '連接點畫出一個不分岔、不交叉的大圈。數字表示它四周有幾條線。') + hs(D.tap, '操作', '點邊畫線，再點變 ✕，拖曳可以一次畫好幾段。') + '<p>第一關會一步一步帶你推。</p>'],
  4: ['新規則：不能提早封閉', hs(D.loop, '同一條線的兩端', '兩個線頭如果屬於同一條線，接起來會變成小圈。題目只要一條大迴路，所以中間要打 ✕。') + '<p>從這一關開始，會需要用到這個推理。</p>'],
  10: ['新技巧：斜角推理', hs(D.corner3, '角落的 3', '外側沒有路時，線不能只碰到角的一邊：3 的角兩邊都畫。') + hs(D.corner1, '角落的 1', '1 只有一條線，角上兩條邊都打 ✕。') + '<p>同樣的道理也能用在被 ✕ 包住的角，提示會說明每一步。</p>'],
  37: ['新技巧：假設法', hs(D.trial, '推出矛盾', '假設一條邊畫線，往下推；如果出現矛盾（數字超過、分岔、提早封閉），它就一定是 ✕。') + '<p>接下來的關卡偶爾會用到。卡住時按提示，會用虛線演示推理過程。</p>'],
  61: ['長卷：大盤面', hs(diag(3, 2, { lines: [[0, 0, 3, 0], [3, 0, 3, 2], [3, 2, 0, 2], [0, 2, 0, 0]] }), '雙指縮放', '盤面變大了，兩根手指可以放大、移動；右上角的按鈕可以縮回全圖。') + '<p>慢慢來，進度會自動保存。</p>']
};
function showIntro(n){ var it = INTROS[n]; $('iTitle').textContent = it[0]; $('iBody').innerHTML = it[1]; showOv('intro'); paused = true; seen['i' + n] = 1; sset('seen', seen); }
function openHelp(from){ $('helpBody').innerHTML = HELP; $('help').dataset.from = from || ''; showOv('help'); if (screen === 'play') paused = true; $('helpBody').scrollTop = 0; }
function openSettings(from){
  $('settings').dataset.from = from || '';
  function seg(id, val){ Array.prototype.forEach.call($(id).children, function(b){ b.setAttribute('aria-pressed', b.dataset.v === String(val) ? 'true' : 'false'); }); }
  seg('segTheme', theme); seg('segSound', settings.sound); seg('segVib', settings.vib); seg('segDim', settings.dim);
  showOv('settings'); if (screen === 'play') paused = true;
}
function muteIcon(){
  $('muteIcon').innerHTML = '<path d="M4 9h4l5-4v14l-5-4H4z"/>' + (settings.sound ? '<path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>');
  $('bMute').setAttribute('aria-label', settings.sound ? '關閉音效' : '開啟音效');
}
function saveSettings(){ sset('settings', settings); }
/* ---------------- wiring ---------------- */
function on(id, f){ $(id).addEventListener('click', function(e){ audio(); f(e); }); }
on('tPlay', function(){ SFX.click(); var n = +$('tPlay').dataset.n || firstOpen(); startLevel(n); });
on('tSelect', function(){ SFX.click(); openSelect(); });
on('tHelp', function(){ SFX.click(); openHelp('title'); });
on('tSet', function(){ SFX.click(); openSettings('title'); });
on('sBack', function(){ SFX.click(); showScreen('title'); });
on('unlockSw', function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); SFX.click(); buildGrid(); });
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.dataset.n;
  if (!unlocked(n)){ SFX.bad(); toast('先完成第 ' + (n - 1) + ' 關，或打開「全部解鎖」'); return; }
  SFX.click(); startLevel(n);
});
on('bPause', function(){ SFX.click(); openPause(); });
on('bMute', function(){ settings.sound = settings.sound ? 0 : 1; saveSettings(); muteIcon(); if (settings.sound) SFX.click(); });
on('bUndo', function(){ undo(); });
on('bRedo', function(){ redo(); });
on('bMode', function(){ toggleMode(); });
on('bCheck', function(){ doCheck(); });
on('bHint', function(){ doHint(); });
on('bFit', function(){ view.z = 1; clampView(); dirty = true; SFX.click(); });
on('pResume', function(){ SFX.click(); resume(); });
on('pRestart', function(){ SFX.click(); showOv('confirm'); });
on('cNo', function(){ SFX.click(); showOv('pause'); });
on('cYes', function(){ SFX.click(); startLevel(G.n, true); });
on('pHelp', function(){ SFX.click(); openHelp('pause'); });
on('pSet', function(){ SFX.click(); openSettings('pause'); });
on('pSelect', function(){ SFX.click(); saveCur(true); paused = false; openSelect(); });
on('hOk', function(){ SFX.click(); if ($('help').dataset.from === 'pause') showOv('pause'); else { hideOvs(); paused = false; if (G) G.last = now(); } });
on('iOk', function(){ SFX.click(); hideOvs(); paused = false; if (G) G.last = now(); afterIntro(); });
on('setOk', function(){ SFX.click(); if ($('settings').dataset.from === 'pause') showOv('pause'); else { hideOvs(); paused = false; } });
on('wNext', function(){ SFX.click(); nextLevel(); });
on('wAgain', function(){ SFX.click(); startLevel(G.n, true); });
on('wSelect', function(){ SFX.click(); openSelect(); });
on('hintX', function(){ if (G && G.hint && G.hint.coach){ G.coach = 0; seen.coach = 1; sset('seen', seen); } hideHint(); });
on('hintDo', function(){ applyHint(); });
['segTheme', 'segSound', 'segVib', 'segDim'].forEach(function(id){
  $(id).addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return; audio();
    var v = b.dataset.v;
    if (id === 'segTheme'){ theme = v; sset('theme', theme); applyTheme(); }
    else { var key = { segSound: 'sound', segVib: 'vib', segDim: 'dim' }[id]; settings[key] = +v; saveSettings(); muteIcon(); dirty = true; }
    Array.prototype.forEach.call($(id).children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    SFX.click(); if (id === 'segVib' && settings.vib) vib(15);
  });
});
document.addEventListener('visibilitychange', function(){ if (document.hidden){ saveCur(true); cancelStroke(); ptrs.clear(); pinch = null; if (screen === 'play' && G && !G.won && !paused) openPause(); } else if (G) G.last = now(); });
window.addEventListener('pagehide', function(){ saveCur(true); });
window.addEventListener('resize', function(){ resize(); if (G && screen === 'play'){ layout(); if (G.won && G.lift){ var lf = liftFor(); G.lift = lf ? (lf.t0 = -1e9, lf) : null; } } });
/* ---------------- test hooks (read state; start levels) ---------------- */
window.__game = {
  state: function(){ return G ? { n: G.n, W: G.P.W, H: G.P.H, won: G.won, winShown: !$('win').classList.contains('hidden'), lines: G.lines, crosses: G.crosses, solLines: G.solLines, hints: G.hints, checks: G.checks, elapsed: G.elapsed, undo: G.undo.length, redo: G.redo.length, mode: mode, zoom: view.z, screen: screen, paused: paused, overlay: OVS.filter(function(k){ return !$(k).classList.contains('hidden'); })[0] || null, hint: G.hint ? G.hint.chip : null, coach: G.coach } : { screen: screen }; },
  E: function(){ return G ? Array.from(G.E) : null; },
  puzzle: function(){ return G ? { W: G.P.W, H: G.P.H, code: LEVELS[G.n - 1][0], clue: Array.from(G.P.clue) } : null; },
  sol: function(){ return G ? Array.from(G.sol) : null; },
  flash: function(){ return G && G.flash ? G.flash.edges.slice() : []; },
  lastCheck: function(){ return G ? G.lastCheck : null; },
  marksLeft: function(){ return G ? Math.max(0, marksFor(G.P) - G.marks) : 0; },
  area: function(){ var L = layout(); return { x: L.ax, y: L.ay, w: L.aw, h: L.ah }; },
  edgeXY: function(e){ return edgeScreen(e); },
  vertexXY: function(v){ var W1 = G.P.W + 1; return toS(v % W1, (v / W1) | 0); },
  cellSize: function(){ return cs(); },
  hintEdges: function(){ return G && G.hint && G.hint.edges ? G.hint.edges.slice() : []; },
  pressEdge: function(){ return drag && !drag.moved ? drag.hl : -1; },
  boardRect: function(){ var r = boardRect(G.P); return { x: r[0], y: r[1], w: r[2], h: r[3] }; },
  levels: function(){ return LEVELS.length; },
  progress: function(){ return JSON.parse(JSON.stringify(prog)); },
  start: function(n, fresh){ startLevel(n, fresh); return true; }
};
/* ---------------- boot ---------------- */
resize(); muteIcon(); toggleModeInit();
function toggleModeInit(){ $('modeIcon').innerHTML = '<circle cx="5" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><path d="M7.5 12h9" stroke-width="3"/>'; }
showScreen('title');
requestAnimationFrame(frame);
})();
</script>
