<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>冰原企鵝</title>
<style>
:root{
  --ink:#2c3e5a; --ink2:#5b6f8e; --card:#ffffffee; --accent:#5aa9e6; --accent2:#7cc6c2; --warm:#ff9f80; --gold:#ffc94d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f5;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);
  display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #4a6a8a22,0 1px 0 #fff inset;
  display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 10px #4a6a8a22;
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.lvname{font-weight:800;font-size:16px;white-space:nowrap}
.diff{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}
.pips i{width:5px;height:10px;border-radius:2px;background:#d6e3ee}
.stat{font-size:13px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.15}
.stat b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:52px;min-width:104px;padding:0 18px;border-radius:26px;background:var(--card);box-shadow:0 4px 14px #4a6a8a2a;
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.45}
.fishct{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;background:var(--card);height:52px;padding:0 16px;border-radius:26px;box-shadow:0 4px 14px #4a6a8a2a}
.hidden{display:none !important}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:#bcd9ecaa;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:#fffffff2;border-radius:26px;box-shadow:0 18px 50px #2c4a6a33;padding:24px 22px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.card h2{margin:4px 0 8px;font-size:26px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;
  background:linear-gradient(180deg,#7cc0f0,#5aa9e6);color:#fff;box-shadow:0 5px 0 #3f86c0,0 8px 18px #3f86c044}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3f86c0}
.btn.sec{background:#eef5fb;color:var(--ink);box-shadow:0 4px 0 #cbdcea}
.btn.warm{background:linear-gradient(180deg,#ffb79e,#ff9070);box-shadow:0 5px 0 #d96b4f,0 8px 18px #d96b4f44}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:44px;letter-spacing:6px;margin:6px 0;color:#d9e3ec}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #e0a420;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
/* title */
#title .card{background:transparent;box-shadow:none;animation:none}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start}
.ttl{margin-top:9vh;text-align:center;width:100%}
.ttl h1{font-size:54px;margin:0;letter-spacing:6px;color:#2c4a6e;text-shadow:0 4px 0 #fff,0 10px 24px #4a7aa055}
.ttl .sub{color:#4d6687;font-weight:600;margin-top:8px;font-size:16px}
.tbtns{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 28px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 24px}
.tbtns .btn{max-width:320px}
/* level select */
#select{align-items:stretch;padding:0;background:linear-gradient(180deg,#d9eefa,#e8e4f6)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:22px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:#c9d6e2;position:relative;transition:background .2s}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0002;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#6cc3a6}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-content:start;touch-action:pan-y}
.lt{aspect-ratio:1/1.12;border-radius:16px;background:#fff;box-shadow:0 3px 0 #c8d9e8,0 6px 14px #4a6a8a1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:4px}
.lt .n{font-size:20px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:#d4dee8;line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:70%;height:5px;border-radius:3px;background:#e4ecf3;overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:9px;color:var(--ink2);line-height:1}
.lt.done{background:#f0fbf6}
.lt.cur{outline:3px solid #7cc0f0}
.lt.lock{background:#e7eef5;box-shadow:0 3px 0 #cfdbe6;color:#9fb2c4}
.lt.lock svg{width:18px;height:18px;stroke:#9fb2c4;fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);z-index:8;background:#2c3e5aee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:#f2f8fc;border-radius:16px;padding:10px}
.mech canvas{flex:none;width:56px;height:56px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 6px;font-size:14px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="pips" id="hPips"></span></div>
    </div>
    <div class="stat">步數 <b id="hMoves">0</b><br>最少 <span id="hOpt">3</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="pill" id="bUndo" aria-label="復原"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>復原</button>
  <div class="fishct" id="fishCt" aria-label="小魚"><svg width="26" height="18" viewBox="0 0 26 18"><path d="M3 9c3-6 11-7 16 0-5 7-13 6-16 0z" fill="#ff9f80"/><path d="M19 9l6-5v10z" fill="#ff8a66"/><circle cx="8" cy="8" r="1.5" fill="#2c3e5a"/></svg><span id="hFish">0/1</span></div>
  <button class="pill" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>冰原企鵝</h1>
    <div class="sub">滑過冰面・收集小魚・回到冰屋</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <button class="btn sec" id="tHelp">玩法說明</button>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <button class="btn sec" id="pSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">回家囉！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>最少<b id="wOpt">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn warm" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2>撲通！掉進水裡了</h2>
  <p>裂開的冰面踩過一次就會碎掉。<br>復原一步再想想吧！</p>
  <div class="row2"><button class="btn" id="fUndo">復原一步</button><button class="btn sec" id="fRestart">重來</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機關</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 0 up, 1 right, 2 down, 3 left
// tiles: 0 ice, 1 rock, 2 snow, 3 crack, 4..7 arrow (dir = t-4), 8 warp, 9 igloo
function parseLevel(rows) {
  var h = rows.length, w = rows[0].length, N = w * h;
  var tile = new Array(N).fill(0), fish = [], cracks = [], blocks = [];
  var fishIdx = new Int16Array(N).fill(-1), crackIdx = new Int16Array(N).fill(-1), warpOf = new Int16Array(N).fill(-1);
  var start = -1, igloo = -1, wp = {};
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var ch = rows[y][x], c = y * w + x;
    switch (ch) {
      case '#': tile[c] = 1; break;
      case 's': tile[c] = 2; break;
      case 'c': tile[c] = 3; crackIdx[c] = cracks.length; cracks.push(c); break;
      case '^': tile[c] = 4; break;
      case '>': tile[c] = 5; break;
      case 'v': tile[c] = 6; break;
      case '<': tile[c] = 7; break;
      case 'G': tile[c] = 9; igloo = c; break;
      case 'P': start = c; break;
      case 'f': fishIdx[c] = fish.length; fish.push(c); break;
      case 'B': blocks.push(c); break;
      default:
        if (ch >= '1' && ch <= '9') { tile[c] = 8; if (wp[ch] !== undefined) { warpOf[c] = wp[ch]; warpOf[wp[ch]] = c; } else wp[ch] = c; }
    }
  }
  return { w: w, h: h, N: N, tile: tile, fish: fish, fishIdx: fishIdx, cracks: cracks, crackIdx: crackIdx, warpOf: warpOf, start: start, igloo: igloo, blocks0: blocks, rows: rows };
}
function initState(L) {
  return { p: L.start, fm: 0, cr: new Array(L.cracks.length).fill(0), bl: L.blocks0.slice().sort(function (a, b) { return a - b; }) };
}
function stateKey(S) { return S.p + '|' + S.fm + '|' + S.cr.join('') + '|' + S.bl.join(','); }
// returns null if the move changes nothing (or loops forever); else {S, ev}
function doMove(L, S, d) {
  var w = L.w, h = L.h, tile = L.tile;
  var cr = S.cr.slice(), bl = S.bl.slice(), fm = S.fm;
  var all = (1 << L.fish.length) - 1;
  var ev = { path: [{ c: S.p }], fish: [], breaks: [], push: null, result: 'move', dir: d };
  var pos = S.p, dir = d, seen = {}, pushIdx = -1, pushDir = 0, n, t, x, y, nx, ny, ci;
  while (true) {
    var k = pos * 4 + dir; if (seen[k]) return null; seen[k] = 1;
    x = pos % w; y = (pos / w) | 0; nx = x + DIRS[dir][0]; ny = y + DIRS[dir][1];
    if (nx < 0 || ny < 0 || nx >= w || ny >= h) break;
    n = ny * w + nx; t = tile[n];
    if (t === 1) break;
    var bi = bl.indexOf(n);
    if (bi >= 0) { pushIdx = bi; pushDir = dir; break; }
    if (t === 9 && fm !== all) break;
    ci = L.crackIdx[pos];
    if (ci >= 0 && cr[ci] === 0) { cr[ci] = 1; ev.breaks.push({ c: pos, step: ev.path.length - 1 }); }
    pos = n; ev.path.push({ c: n });
    if (t === 9) { ev.result = 'win'; break; }
    ci = L.crackIdx[n];
    if (ci >= 0 && cr[ci] === 1) { ev.result = 'fall'; break; }
    var fi = L.fishIdx[n];
    if (fi >= 0 && !((fm >> fi) & 1)) { fm |= 1 << fi; ev.fish.push({ i: fi, step: ev.path.length - 1 }); }
    if (t === 2) break;
    if (t >= 4 && t <= 7) { dir = t - 4; continue; }
    if (t === 8) { var o = L.warpOf[n]; if (bl.indexOf(o) < 0) { pos = o; ev.path.push({ c: o, warp: true }); } else break; }
  }
  var blockMoved = false;
  if (pushIdx >= 0) {
    var bp = bl[pushIdx], bd = pushDir, bpath = [{ c: bp }], seen2 = {}, sunk = false;
    while (true) {
      var k2 = bp * 4 + bd; if (seen2[k2]) return null; seen2[k2] = 1;
      x = bp % w; y = (bp / w) | 0; nx = x + DIRS[bd][0]; ny = y + DIRS[bd][1];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) break;
      n = ny * w + nx; t = tile[n];
      if (t === 1 || t === 9 || n === pos || bl.indexOf(n) >= 0) break;
      var fi2 = L.fishIdx[n]; if (fi2 >= 0 && !((fm >> fi2) & 1)) break;
      ci = L.crackIdx[n];
      if (ci >= 0 && cr[ci] === 1) { cr[ci] = 2; bpath.push({ c: n, sink: true }); sunk = true; break; }
      bp = n; bpath.push({ c: n });
      if (t === 2) break;
      if (t >= 4 && t <= 7) { bd = t - 4; continue; }
      if (t === 8) { var o2 = L.warpOf[n]; if (o2 !== pos && bl.indexOf(o2) < 0) { bp = o2; bpath.push({ c: o2, warp: true }); } else break; }
    }
    if (bpath.length > 1) {
      blockMoved = true;
      if (sunk) bl.splice(pushIdx, 1); else bl[pushIdx] = bp;
      bl.sort(function (a, b) { return a - b; });
      ev.push = { path: bpath, sunk: sunk };
    }
  }
  if (ev.path.length === 1 && !blockMoved) return null;
  return { S: { p: pos, fm: fm, cr: cr, bl: bl }, ev: ev };
}
// BFS: returns {len, sol:[dirs]} or null; limit = max states
function solve(L, limit) {
  limit = limit || 400000;
  var S0 = initState(L), k0 = stateKey(S0);
  var prev = new Map(); prev.set(k0, null);
  var q = [S0], keys = [k0], head = 0;
  while (head < q.length) {
    var S = q[head], K = keys[head]; head++;
    for (var d = 0; d < 4; d++) {
      var r = doMove(L, S, d); if (!r) continue;
      if (r.ev.result === 'fall') continue;
      if (r.ev.result === 'win') {
        var sol = [d], kk = K;
        while (prev.get(kk)) { var pr = prev.get(kk); sol.push(pr[1]); kk = pr[0]; }
        sol.reverse(); return { len: sol.length, sol: sol, states: q.length };
      }
      var nk = stateKey(r.S);
      if (prev.has(nk)) continue;
      prev.set(nk, [K, d]); q.push(r.S); keys.push(nk);
      if (q.length > limit) return { len: -2, states: q.length };
    }
  }
  return null;
}
/*CORE-END*/

var LEVELS = [
["##..../Pf.#../....../....../.....G/..#..#",3],
[".##.G./f.P.../.#..../....#./.#..../......",4],
["#...../....../..P.#./.#..#./G..f../....#.",4],
["....##/#f..../....G./.#..#./.....P/......",4],
[".....#/....../....##/G....#/.f..../P....#",4],
["#....#/#.Pf../....../....../....##/G.s...",4],
["##..../#...../..fG../s...#./.#.P../......",4],
["...P../G....f/....../..s###/.....#/.....#",4],
["G...##/.P.s#./....#./....../..#.../....../....f#",4],

<script>
(function(){
'use strict';
var ID = 'ice-slide:';
function sget(k, d){ try{ var v = localStorage.getItem(ID+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem(ID+k, JSON.stringify(v)); }catch(e){} }

var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
var prog = sget('progress', {}); if (!prog || typeof prog !== 'object') prog = {};
var unlockAll = !!sget('unlockAll', false);
var muted = !!sget('mute', false);
var NL = LEVELS.length;

/* ---------------- audio ---------------- */
var AC = null, master = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);}catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') { try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(f, dur, type, vol, f2, delay){
  if (muted || !AC) return;
  var t = AC.currentTime + (delay||0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
var noiseBuf = null;
function noise(dur, vol, f1, f2, q, delay, ftype){
  if (muted || !AC) return;
  if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); var d = noiseBuf.getChannelData(0); for (var i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  var t = AC.currentTime + (delay||0), s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = ftype||'bandpass'; fl.Q.value = q||1; fl.frequency.setValueAtTime(f1, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.05);
}
var SFX = {
  slide: function(n){ noise(Math.min(0.5, 0.12+n*0.05), 0.12, 2500, 5000, 0.8); },
  bump: function(){ tone(140, 0.14, 'sine', 0.25, 70); noise(0.06, 0.08, 400, 200, 1); },
  stop: function(){ tone(420, 0.08, 'triangle', 0.08, 300); },
  fish: function(k){ var b = 660 * Math.pow(1.06, k||0); tone(b, 0.1, 'triangle', 0.18); tone(b*1.5, 0.14, 'triangle', 0.16, null, 0.07); },
  crack: function(){ noise(0.18, 0.2, 3000, 1200, 4, 0, 'highpass'); tone(900, 0.05, 'square', 0.05, 500); },
  splash: function(){ noise(0.6, 0.35, 1800, 200, 0.7); tone(300, 0.25, 'sine', 0.15, 80); },
  push: function(){ tone(110, 0.22, 'triangle', 0.22, 80); noise(0.3, 0.09, 900, 500, 2); },
  plop: function(){ tone(500, 0.18, 'sine', 0.2, 120); noise(0.3, 0.15, 1000, 300, 1); },
  warp: function(){ tone(300, 0.25, 'sine', 0.16, 1200); tone(450, 0.25, 'sine', 0.08, 1800, 0.05); },
  win: function(){ [523,659,784,1047].forEach(function(f,i){ tone(f, 0.25, 'triangle', 0.18, null, i*0.1); }); tone(1319, 0.5, 'sine', 0.12, null, 0.42); },
  undo: function(){ tone(500, 0.07, 'sine', 0.1, 380); },
  click: function(){ tone(700, 0.05, 'triangle', 0.08); },
  open: function(){ tone(784, 0.12, 'sine', 0.14); tone(1175, 0.2, 'sine', 0.12, null, 0.08); }
};
function setMuteIcon(){
  $('muteIcon').innerHTML = muted
    ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'
    : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 010 7M19.5 6a8.5 8.5 0 010 12"/>';
}

/* ---------------- level & state ---------------- */
var levelN = 1, L = null, S = null, hist = [], status = 'title'; // title|select|play|anim|won|fail|paused
var anim = null, queued = null, lastDir = 2, introSeen = sget('intro', {}) || {};
var parsed = {};
function getLevel(n){
  if (!parsed[n]) { var e = LEVELS[n-1], Lv = parseLevel(e[0].split('/')); Lv.opt = e[1];
    var seen = {}, k = 0; Lv.warpPair = {};
    for (var c=0;c<Lv.N;c++) if (Lv.tile[c] === 8 && seen[c] === undefined){ seen[c] = seen[Lv.warpOf[c]] = 1; Lv.warpPair[c] = Lv.warpPair[Lv.warpOf[c]] = k++; }
    parsed[n] = Lv; }
  warpPair = parsed[n].warpPair; return parsed[n];
}
function isDone(n){ return !!prog[n]; }
function unlocked(n){ return unlockAll || n === 1 || isDone(n-1) || isDone(n); }
function highestUnlocked(){ for (var n=1;n<=NL;n++){ if (!isDone(n)) return unlocked(n) ? n : Math.max(1,n-1); } return NL; }
function starsFor(m, opt){ return m <= opt ? 3 : (m <= Math.ceil(opt*1.4)+1 ? 2 : 1); }
function diffColor(n){ var t=(n-1)/99; var h = 160 - 160*t; return 'hsl('+h+',62%,'+(60-8*t)+'%)'; }

var MECH = [
  {lv:1, key:'basic', name:'滑行', desc:'企鵝會一直滑到撞上石頭或邊緣才停下。吃光所有小魚後，冰屋的門就會打開！'},
  {lv:6, key:'snow', name:'雪地', desc:'滑到雪地上會立刻停住，好好利用它來煞車。'},
  {lv:16, key:'crack', name:'裂冰', desc:'裂開的冰只能經過一次，離開後就會碎成冰水。再踩上去就會掉進水裡！'},
  {lv:26, key:'arrow', name:'輸送帶', desc:'踩上箭頭會被轉向，朝箭頭方向繼續滑行。'},
  {lv:36, key:'block', name:'冰塊', desc:'撞上冰塊時企鵝會停下，冰塊則被推著滑出去。冰塊掉進冰水會填平成冰面。'},

function showHelp(){
  var b = $('helpBody'); b.innerHTML = '';
  var p = document.createElement('p'); p.innerHTML = '在畫面上<b>滑動</b>（或用方向鍵／WASD）讓企鵝朝該方向滑行。吃光所有小魚，再滑進冰屋就過關！<br>用越少步數完成，星星越多。'; b.appendChild(p);
  MECH.forEach(function(m){ b.appendChild(mechRow(m)); });
  var p2 = document.createElement('p'); p2.innerHTML = '快捷鍵：Z 復原・R 重來・Esc 暫停'; b.appendChild(p2);
  showOnly('help');
}
function showIntro(m){
  status = 'paused';
  $('iTitle').textContent = m.key === 'basic' ? '歡迎來到冰原！' : '新機關：' + m.name;
  var b = $('iBody'); b.innerHTML = ''; b.appendChild(mechRow(m));
  if (m.key === 'basic'){ var p = document.createElement('p'); p.textContent = '在畫面任意處滑動來移動企鵝。'; b.appendChild(p); }
  showOnly('intro');
}

/* ---------------- test hook ---------------- */
window.__game = {
  get status(){ return status; }, get level(){ return levelN; }, get moves(){ return hist.length; },
  levelCount: NL,
  startLevel: function(n){ startLevel(n); if (status === 'paused') { showOnly(null); status = 'play'; } },
  state: function(){ return { status: status, level: levelN, moves: hist.length, opt: L && L.opt, p: S && S.p, fm: S && S.fm, animating: !!anim }; },
  levelRows: function(n){ return LEVELS[n-1][0].split('/'); },
  levelOpt: function(n){ return LEVELS[n-1][1]; },
  boardRect: function(){ return { x: board.x, y: board.y, s: board.s, w: L.w, h: L.h }; },
  move: function(d){ tryMove(d); }
};

setMuteIcon();
layout();
startLoop();
})();
</script>
