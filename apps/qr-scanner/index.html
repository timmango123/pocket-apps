<title>QR 碼掃描器</title>
<style>

  --accent: #4cc489; --accent-ink: #072015; --accent-soft: #163327;

* { box-sizing: border-box; }
html, body { margin: 0; }

.btn { min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }

.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); margin-left: 6px; vertical-align: 2px; }
.domain { font-size: 20px; font-weight: 800; overflow-wrap: anywhere; margin: 0 0 2px; }

.fields dd { margin: 0; overflow-wrap: anywhere; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pw { font-family: var(--mono); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.panel h2 { margin: 0 0 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }

.hlist .m { font-size: 12px; color: var(--muted); }

.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (hover: hover) { .btn:hover { border-color: var(--accent); } .btn.primary:hover { filter: brightness(1.07); } .hlist button.item:hover { background: var(--surface-2); } }

<script>
'use strict';

const QRCore = (() => {
  const ECL_IDX = { L: 0, M: 1, Q: 2, H: 3 };
  const ECL_FMT = [1, 0, 3, 2];
  const ECC = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  const NB = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
  // GF(256), primitive polynomial 0x11D
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; }
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  const div = (a, b) => a ? EXP[(LOG[a] + 255 - LOG[b]) % 255] : 0;
  function rsDivisor(deg) {
    const r = new Uint8Array(deg); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = mul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  }
  function rsRemainder(data, divisor) {
    const r = new Uint8Array(divisor.length);
    for (const b of data) { const f = b ^ r[0]; r.copyWithin(0, 1); r[r.length - 1] = 0; for (let i = 0; i < r.length; i++) r[i] ^= mul(divisor[i], f); }
    return r;
  }
  function rawModules(v) { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; }
  const dataCodewords = (v, e) => Math.floor(rawModules(v) / 8) - ECC[e][v] * NB[e][v];
  function alignPositions(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6]; for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }
  const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
  const CC_BITS = { 1: [10, 12, 14], 2: [9, 11, 13], 4: [8, 16, 16] };
  const ccIdx = v => v <= 9 ? 0 : v <= 26 ? 1 : 2;
  function makeSegment(text) {
    const push = (arr, val, n) => { for (let i = n - 1; i >= 0; i--) arr.push((val >>> i) & 1); };
    const bits = [];
    if (/^[0-9]*$/.test(text) && text.length) {
      for (let i = 0; i < text.length; i += 3) { const g = text.substr(i, 3); push(bits, parseInt(g, 10), g.length * 3 + 1); }
      return { mode: 1, count: text.length, bits, name: '數字' };
    }
    if (text.length && [...text].every(c => ALNUM.includes(c))) {
      for (let i = 0; i + 1 < text.length; i += 2) push(bits, ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i + 1]), 11);
      if (text.length % 2) push(bits, ALNUM.indexOf(text[text.length - 1]), 6);
      return { mode: 2, count: text.length, bits, name: '英數' };
    }
    const bytes = new TextEncoder().encode(text);
    for (const b of bytes) push(bits, b, 8);
    return { mode: 4, count: bytes.length, bits, name: '位元組' };
  }
  function segBits(seg, v, eci) {
    const cc = CC_BITS[seg.mode][ccIdx(v)];
    if (seg.count >= (1 << cc)) return Infinity;
    return (eci && seg.mode === 4 ? 12 : 0) + 4 + cc + seg.bits.length;
  }
  const MASKS = [
    (r, c) => (r + c) % 2 === 0, (r, c) => r % 2 === 0, (r, c) => c % 3 === 0, (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0, (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0, (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0];
  function formatBits(e, mask) {
    const data = (ECL_FMT[e] << 3) | mask; let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    return ((data << 10) | rem) ^ 0x5412;
  }
  function versionBits(v) { let rem = v; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25); return (v << 12) | rem; }
  // Function-pattern geometry, shared by encoder and decoder. Returns {m, fn} with m[r*size+c].
  function baseMatrix(v) {
    const size = v * 4 + 17, m = new Uint8Array(size * size), fn = new Uint8Array(size * size);
    const set = (c, r, d) => { m[r * size + c] = d ? 1 : 0; fn[r * size + c] = 1; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])

  try { navigator.vibrate && navigator.vibrate(60); } catch {}
  if (!prefs.sound || !actx || actx.state !== 'running') return;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = 1320;
  g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.12);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.14);
}
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
function setStatus(t, kind) { const s = $('status'); s.textContent = t; s.className = 'status' + (kind ? ' ' + kind : ''); }

// 開啟時用內建編碼器畫一張略為傾斜的 QR 碼照片，並以同一套解碼流程解出，作為範例。
async function showSample() {
  const text = 'https://www.example.com/menu?table=12';
  const q = QRCore.encodeQR(text, { ecl: 'M' }), n = q.size, ppm = 9, quiet = 4, side = (n + quiet * 2) * ppm;
  const W = 640, H = 480, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#8d9aa3'); g.addColorStop(1, '#5d6a73'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.12);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-side / 2 + 6, -side / 2 + 8, side, side + 40);
  ctx.fillStyle = '#fbfaf6'; ctx.fillRect(-side / 2, -side / 2, side, side + 40);
  ctx.fillStyle = '#1b1f23';
  for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.modules[r * n + cc]) ctx.fillRect(-side / 2 + (cc + quiet) * ppm, -side / 2 + (r + quiet) * ppm, ppm + 0.5, ppm + 0.5);
  ctx.font = '600 18px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('掃描看菜單', 0, side / 2 + 22);
  ctx.restore();
  showPreview(c, W, H, true);
  const res = await decodeSource(c, W, H);
  drawOverlay(res, W, H);
  if (res.length) { renderResults(res, true); setStatus('範例：選一張含 QR 碼的圖片開始解讀。'); }
}
renderHistory();
showSample();
