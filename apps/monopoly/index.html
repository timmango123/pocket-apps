<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
/*CORE-START*/
var MP = (function () {
  'use strict';
  // ---------- board ----------
  // groups: 0 brown … 7 navy. rent: [base, 1棟, 2棟, 3棟, 4棟, 大樓]
  const G = [
    { n: '離島', c: '#9a6a4a' }, { n: '外島', c: '#4fb3d9' }, { n: '東部', c: '#d9628e' }, { n: '南投嘉屏', c: '#ee8a2c' },
    { n: '府城港都', c: '#d8433a' }, { n: '中部竹苗', c: '#e8bf26' }, { n: '北北桃', c: '#2f9e5b' }, { n: '台北精華', c: '#2e4fa8' }
  ];
  const P = (n, g, price, house, rent) => ({ t: 'prop', n, g, price, house, rent });
  const SQ = [
    { t: 'go', n: '起點' },
    P('綠島', 0, 600, 500, [40, 200, 600, 1800, 3200, 4500]),
    { t: 'chance', n: '機會' },
    P('蘭嶼', 0, 600, 500, [60, 300, 900, 2700, 4000, 5500]),
    { t: 'tax', n: '所得稅', amt: 1500 },
    P('澎湖', 1, 1000, 500, [60, 300, 900, 2700, 4000, 5500]),
    P('金門', 1, 1000, 500, [60, 300, 900, 2700, 4000, 5500]),
    P('馬祖', 1, 1200, 500, [80, 400, 1000, 3000, 4500, 6000]),
    { t: 'jail', n: '監獄' },
    P('台東', 2, 1400, 1000, [100, 500, 1500, 4500, 6250, 7500]),
    P('花蓮', 2, 1400, 1000, [100, 500, 1500, 4500, 6250, 7500]),
    { t: 'fate', n: '命運' },
    P('宜蘭', 2, 1600, 1000, [120, 600, 1800, 5000, 7000, 9000]),
    P('屏東', 3, 1800, 1000, [140, 700, 2000, 5500, 7500, 9500]),
    P('嘉義', 3, 1800, 1000, [140, 700, 2000, 5500, 7500, 9500]),
    P('南投', 3, 2000, 1000, [160, 800, 2200, 6000, 8000, 10000]),
    { t: 'park', n: '夜市' },
    P('台南', 4, 2200, 1500, [180, 900, 2500, 7000, 8750, 10500]),
    { t: 'chance', n: '機會' },
    P('高雄', 4, 2400, 1500, [200, 1000, 3000, 7500, 9250, 11000]),
    { t: 'rail', n: '高鐵', price: 2000 },
    P('彰化', 5, 2600, 1500, [220, 1100, 3300, 8000, 9750, 11500]),
    P('新竹', 5, 2600, 1500, [220, 1100, 3300, 8000, 9750, 11500]),
    P('台中', 5, 2800, 1500, [240, 1200, 3600, 8500, 10250, 12000]),
    { t: 'gojail', n: '警察局' },
    P('桃園', 6, 3000, 2000, [260, 1300, 3900, 9000, 11000, 12750]),
    P('新北', 6, 3200, 2000, [280, 1500, 4500, 10000, 12000, 14000]),
    { t: 'fate', n: '命運' },
    { t: 'rail', n: '機場', price: 2000 },
    P('大安', 7, 3500, 2000, [350, 1750, 5000, 11000, 13000, 15000]),
    { t: 'tax', n: '奢侈稅', amt: 1000 },
    P('信義', 7, 4000, 2000, [500, 2000, 6000, 14000, 17000, 20000])
  ];
  const MAXR = 60, N = SQ.length, JAIL = 8, GO_PAY = 2000, START = 15000, BAIL = 500, RAIL_RENT = [400, 1000];
  const GROUP_SQ = G.map((_, g) => SQ.map((s, i) => s.g === g && s.t === 'prop' ? i : -1).filter(i => i >= 0));
  const RAILS = SQ.map((s, i) => s.t === 'rail' ? i : -1).filter(i => i >= 0);
  const buyable = i => SQ[i].t === 'prop' || SQ[i].t === 'rail';
  // ---------- cards ----------
  // k: kind. mv: advance to square; back: steps back; jail; free; cash; each (+ from each player, - to each); rep: per house / per tower
  const CH = [
    { tx: '環島一圈回到起點，領取 $2,000', k: 'mv', to: 0 },
    { tx: '搭高鐵出差：前進到高鐵站', k: 'mv', to: 20 },
    { tx: '受邀到信義區開會：前進到信義', k: 'mv', to: 31 },
    { tx: '去台南吃小吃：前進到台南', k: 'mv', to: 17 },
    { tx: '走錯路，後退三格', k: 'back', n: 3 },
    { tx: '闖紅燈被抓：直接入獄', k: 'jail' },
    { tx: '出獄許可證：留著，下次入獄可免費出獄', k: 'free' },
    { tx: '統一發票中二獎，領取 $1,000', k: 'cash', v: 1000 },
    { tx: '年終獎金入帳，領取 $1,500', k: 'cash', v: 1500 },
    { tx: '房屋修繕：每棟房子 $250，每座大樓 $1,000', k: 'rep', h: 250, t: 1000 },
    { tx: '飛去開會：前進到機場', k: 'mv', to: 28 },
    { tx: '超速罰單，繳 $500', k: 'cash', v: -500 }
  ];
  const FA = [
    { tx: '健保退費，領取 $500', k: 'cash', v: 500 },
    { tx: '生日快樂！每位玩家包紅包 $300 給你', k: 'each', v: 300 },
    { tx: '過年發紅包：給每位玩家 $200', k: 'each', v: -200 },
    { tx: '股票大漲，獲利 $1,000', k: 'cash', v: 1000 },
    { tx: '颱風災損：每棟房子 $400，每座大樓 $1,150', k: 'rep', h: 400, t: 1150 },
    { tx: '夜市逛太久錢包掉了，損失 $500', k: 'cash', v: -500 },
    { tx: '去綠島浮潛：前進到綠島', k: 'mv', to: 1 },
    { tx: '逃漏稅被查：直接入獄', k: 'jail' },
    { tx: '出獄許可證：留著，下次入獄可免費出獄', k: 'free' },
    { tx: '刮刮樂中獎，領取 $2,000', k: 'cash', v: 2000 },
    { tx: '繳學費 $1,000', k: 'cash', v: -1000 },
    { tx: '賞花季到了：前進到花蓮', k: 'mv', to: 10 }
  ];
  // ---------- rng (mulberry32 on a uint32 kept in state, so saves resume the same stream) ----------
  function rnd(st, k) { let a = st[k] = (st[k] + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function shuffle(st, n) { const a = []; for (let i = 0; i < n; i++) a.push(i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd(st, 'ds') * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const NAMES = ['你', '阿財', '美玲', '金伯'];
  function newGame(o) {
    o = o || {};
    const seed = (o.seed == null ? (Date.now() ^ (Math.random() * 1e9)) : o.seed) >>> 0;
    const st = {
      v: 1, seed, rounds: o.rounds == null ? 20 : o.rounds, diff: o.diff == null ? 1 : o.diff, round: 1, turn: 0, turnNo: 0,
      phase: 'roll', actor: 0, pend: null, dbl: 0, again: false, dq: [], last: null,
      P: NAMES.map((nm, i) => ({ nm: (o.names && o.names[i]) || nm, cpu: i > 0, cash: START + (i > 0 ? DIFF_BONUS[o.diff == null ? 1 : o.diff] : 0), pos: 0, jail: 0, card: 0, out: 0 })),
      own: SQ.map(() => -1), lvl: SQ.map(() => 0), mort: SQ.map(() => 0),
      ds: seed ^ 0x51ed27, cs: (seed * 7 + 13) ^ 0x2c1b3, deck: null, over: null, outOrder: [],
      st: NAMES.map(() => ({ rentIn: 0, rentOut: 0, laps: 0, buys: 0, builds: 0 }))
    };
    st.deck = { chance: shuffle(st, CH.length), fate: shuffle(st, FA.length) };
    return st;
  }
  const clone = st => JSON.parse(JSON.stringify(st));
  const alive = st => st.P.map((p, i) => p.out ? -1 : i).filter(i => i >= 0);
  function hasSet(st, p, g) { return GROUP_SQ[g].every(i => st.own[i] === p); }
  function rentOf(st, i, dice) {
    const s = SQ[i], o = st.own[i]; if (o < 0 || st.mort[i]) return 0;
    if (s.t === 'rail') { const n = RAILS.filter(r => st.own[r] === o).length; return RAIL_RENT[n - 1]; }
    const l = st.lvl[i]; if (l > 0) return s.rent[l];
    return s.rent[0] * (hasSet(st, o, s.g) ? 2 : 1);
  }
  function priceOf(i) { return SQ[i].price; }
  function houseCost(i) { return SQ[i].house; }
  function redeemCost(i) { return Math.ceil(SQ[i].price * 0.55 / 10) * 10; }
  function netWorth(st, p) {
    let w = st.P[p].cash;
    for (let i = 0; i < N; i++) if (st.own[i] === p) { w += st.mort[i] ? SQ[i].price / 2 : SQ[i].price; if (SQ[i].t === 'prop') w += st.lvl[i] * SQ[i].house; }
    return w;
  }
  // money the player could raise by selling every building and mortgaging every lot
  function raisable(st, p) {
    let w = st.P[p].cash;
    for (let i = 0; i < N; i++) if (st.own[i] === p) { if (SQ[i].t === 'prop') w += st.lvl[i] * SQ[i].house / 2; if (!st.mort[i]) w += SQ[i].price / 2; }
    return w;
  }
  function owned(st, p) { const a = []; for (let i = 0; i < N; i++) if (st.own[i] === p) a.push(i); return a; }
  // ---------- core actions ----------
  function addCash(st, p, v, why, ev) { st.P[p].cash += v; ev.push({ t: 'cash', p, v, why }); }
  function sendJail(st, p, ev) {
    const pl = st.P[p]; pl.pos = JAIL; pl.jail = 1; st.again = false; st.dbl = 0; ev.push({ t: 'jail', p });
  }
  function moveTo(st, p, to, ev, collect) {
    const pl = st.P[p], from = pl.pos; let steps = (to - from + N) % N;
    const path = []; for (let k = 1; k <= steps; k++) path.push((from + k) % N);
    pl.pos = to; ev.push({ t: 'move', p, path });
    if (collect !== false && steps > 0 && from + steps >= N) { addCash(st, p, GO_PAY, 'go', ev); st.st[p].laps++; }
  }
  function moveSteps(st, p, n, ev) { moveTo(st, p, (st.P[p].pos + n) % N, ev); }
  function drawCard(st, p, kind, ev) {
    const d = st.deck[kind], id = d.shift(), card = (kind === 'chance' ? CH : FA)[id];
    ev.push({ t: 'card', p, kind, id, tx: card.tx });
    if (card.k === 'free') { st.P[p].card = (st.P[p].card || 0) + 1; (st.P[p].cards = st.P[p].cards || []).push(kind + ':' + id); return; }
    d.push(id);

      if (e.why === 'take') log(`${cname(e.p)} 接收破產者的現金 ${fmt(e.v)}`);
      await wait(e.why === 'go' ? 420 : 300); break;

function confetti() {
  if (RM.matches) return; const cv = $('confetti'), ctx = cv.getContext('2d'); cv.hidden = false;
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio; const ps = [];

  for (let i = 0; i < 140; i++) ps.push({ x: Math.random() * W, y: -Math.random() * H * 0.5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, c: cols[i % 6], s: 4 + Math.random() * 6 });
  const t0 = performance.now(); cancelAnimationFrame(confT);
  const f = now => { ctx.clearRect(0, 0, W, H); for (const p of ps) { p.x += p.vx; p.y += p.vy * devicePixelRatio; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); ctx.restore(); } if (now - t0 < 3200) confT = requestAnimationFrame(f); else { cv.hidden = true; } };

}
