<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>心情日記</title>
<style>
:root{
  --bg:#f3f3f1; --paper:#fdfdfb; --ink:#23262b; --muted:#5a5f68; --faint:#8a8f97; --line:#d9dad6; --rule:#e8e8e4;
  --accent:#3d5a80; --accent-ink:#ffffff; --accent-soft:#e3e9f1; --mark:#ffe58a;
  --m1:#e57373; --m2:#f4a261; --m3:#f2d15c; --m4:#a8d58a; --m5:#5cb874; --m-ink:#1b1f24; --empty:#ecece8;
  --up:#2f7d43; --dn:#b8423a; --danger:#b3261e; --warn-bg:#fdf0c9; --warn-ink:#5a4300; --shadow:0 12px 40px rgba(20,24,30,.18);
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --paper:#1d2024; --ink:#e6e6e2; --muted:#a8acb3; --faint:#7d828a; --line:#33373d; --rule:#292c31;
  --accent:#9db6d8; --accent-ink:#13202f; --accent-soft:#25303d; --mark:#7a6420;
  --m1:#c26a6a; --m2:#cf8f57; --m3:#cbb055; --m4:#8db377; --m5:#5a9e6a; --m-ink:#111317; --empty:#26292e;
  --up:#8fd19e; --dn:#f0a3a3; --danger:#f2b8b5; --warn-bg:#3a2f12; --warn-ink:#f2d98f; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --paper:#1d2024; --ink:#e6e6e2; --muted:#a8acb3; --faint:#7d828a; --line:#33373d; --rule:#292c31;
  --accent:#9db6d8; --accent-ink:#13202f; --accent-soft:#25303d; --mark:#7a6420;
  --m1:#c26a6a; --m2:#cf8f57; --m3:#cbb055; --m4:#8db377; --m5:#5a9e6a; --m-ink:#111317; --empty:#26292e;
  --up:#8fd19e; --dn:#f0a3a3; --danger:#f2b8b5; --warn-bg:#3a2f12; --warn-ink:#f2d98f; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto}

.top{display:flex;align-items:center;gap:6px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:8px}
.top h1{margin:0;flex:1;font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.08em}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.mnav{display:flex;align-items:center;gap:2px}
.mnav b{min-width:74px;text-align:center;font-family:var(--serif);font-size:17px}
@media (hover:hover){.ib:hover{border-color:var(--muted)}}

.banner{display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 6px 6px 14px;margin:4px 0 8px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink)}
.banner span{flex:1;min-width:0}
.banner button{min-height:40px;border:0;background:none;font-weight:700;cursor:pointer;padding:0 10px;text-decoration:underline;color:inherit;white-space:nowrap}

.layout{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;margin-top:12px;position:relative}
.card.today{border-top:4px solid var(--accent)}
.card h2{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--muted);font-weight:500}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline}

.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.mb{height:64px;border-radius:50%;max-width:64px;width:100%;justify-self:center;border:2px solid var(--line);background:var(--paper);font-size:30px;cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .12s}
.mb span{filter:grayscale(.65);opacity:.75}
.mb[aria-pressed="true"]{border-color:var(--ink);background:var(--mc);transform:scale(1.06)}
.mb[aria-pressed="true"] span{filter:none;opacity:1}
.mlabels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:6px}
@media (hover:hover){.mb:hover span{filter:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.mb{transition:none}.mb[aria-pressed="true"]{transform:none}}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);padding:0 14px;cursor:pointer;font-size:14px;position:relative}
.tag::after{content:"";position:absolute;inset:-3px 0}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tag.add{border-style:dashed;color:var(--muted)}
.notewrap{position:relative}
textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:4px;padding:8px 10px 22px;font-size:15px;line-height:28px;
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-attachment:local;background-position:0 8px}
.count{position:absolute;right:10px;bottom:6px;font-size:11.5px;color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--paper);padding:0 16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:13px;color:var(--muted)}

.cal{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk span{text-align:center;font-size:12px;color:var(--faint);font-weight:700}
.cell{aspect-ratio:1/1;min-height:44px;border-radius:6px;border:0;background:var(--empty);font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;position:relative;-webkit-touch-callout:none}
.cell.has{color:var(--m-ink)}
.cell.blank{background:none;cursor:default;visibility:hidden}
.cell.future{opacity:.4;cursor:not-allowed}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell .nt{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.6}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px}
.drawer{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.drawer .dt{font-family:var(--serif);font-weight:700;font-size:17px}
.drawer .nt2{white-space:pre-wrap;margin:6px 0;overflow-wrap:anywhere}
.tchips{display:flex;gap:4px;flex-wrap:wrap}
.tchips span{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10.5px;fill:var(--faint);font-family:system-ui,sans-serif}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;opacity:.75}
.chart .ma{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.chart .pt{stroke:var(--paper);stroke-width:1.5;cursor:pointer}
.chart .hit{fill:transparent;cursor:pointer}
.ckey{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.ckey i{display:inline-block;width:18px;border-top:2px solid var(--ink);vertical-align:3px;margin-right:4px;opacity:.75}
.ckey i.d{border-top:2px dashed var(--accent);opacity:1}
.ptinfo{font-size:13.5px;margin-top:6px;min-height:22px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:var(--bg)}
.stat b{display:block;font-size:22px;font-family:var(--serif);line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.corr{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.corr li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.corr .up{color:var(--up);font-weight:700}
.corr .dn{color:var(--dn);font-weight:700}
input[type=search],input[type=text],input[type=password]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;font-size:15px}
.results{list-style:none;margin:8px 0 0;padding:0}
.results li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.results .d{font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px;color:var(--accent);border:0;background:none;cursor:pointer;min-height:32px;padding:0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{color:var(--faint);font-size:14px;padding:16px 0;text-align:center}

dialog{border:0;padding:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,18,22,.5)}
dialog.sheet{width:100%;max-width:520px;margin:auto auto 0;border-radius:14px 14px 0 0;max-height:90%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
dialog.center{width:calc(100% - 32px);max-width:400px;border-radius:12px;padding:18px}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dh h3{margin:0;flex:1;font-size:18px;font-family:var(--serif)}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.err{color:var(--danger);font-size:13px;margin:6px 0 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);padding:0 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tagedit{display:flex;flex-wrap:wrap;gap:6px}
.tagedit span{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:20px;padding-left:12px;font-size:14px}
.tagedit button{width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--faint);border-radius:50%}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
textarea.plain{background:var(--bg);font:12px/1.4 ui-monospace,monospace;min-height:90px;padding:8px}

.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.lock h2{font-family:var(--serif);margin:0}
.lock input{max-width:220px;text-align:center;letter-spacing:.6em;font-size:24px}

@media (min-width:900px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .cell{aspect-ratio:auto;height:52px}
}
@media (max-height:500px) and (orientation:landscape){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .cell{aspect-ratio:auto;height:44px}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>心情日記</h1>
    <div class="mnav">
      <button class="ib" id="prevM" aria-label="上個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
      <b id="mLbl" class="num">10 月</b>
      <button class="ib" id="nextM" aria-label="下個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="ib" id="openSet" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="banners"></div>

  <div class="layout">
    <div>
      <section class="card today" aria-labelledby="qTitle">
        <h2 id="qTitle">今天感覺如何？</h2>
        <div class="moods" id="moods" role="group" aria-label="心情"></div>
        <div class="mlabels" aria-hidden="true"><span>很糟</span><span>不太好</span><span>普通</span><span>不錯</span><span>很好</span></div>
        <div class="tags" id="tags" role="group" aria-label="活動標籤"></div>
        <div class="notewrap">
          <label for="note" class="lbl" style="margin-top:4px">短記</label>
          <textarea id="note" maxlength="280" placeholder="一兩句話記下今天發生的事"></textarea>
          <span class="count num" id="count">0 / 280</span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn pri" id="saveBtn" disabled>儲存</button>
          <span class="msg" id="saveMsg" role="status">先選一個心情</span>
        </div>
      </section>

      <section class="card" aria-labelledby="calH">
        <h3 id="calH">本月心情</h3>
        <div class="cal" id="cal">
          <div class="wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="grid" id="grid" style="margin-top:4px"></div>
        </div>
        <div class="legend"><span><i style="background:var(--m1)"></i>1</span><span><i style="background:var(--m2)"></i>2</span><span><i style="background:var(--m3)"></i>3</span><span><i style="background:var(--m4)"></i>4</span><span><i style="background:var(--m5)"></i>5</span><span>點格子看內容・長按刪除</span></div>
        <div class="drawer" id="drawer" hidden></div>
      </section>
    </div>

    <div>
      <section class="card" aria-labelledby="trendH">
        <h3 id="trendH">趨勢</h3>
        <div id="chartBox"></div>
        <div class="ckey"><span><i></i>每日心情</span><span><i class="d"></i>7 日移動平均</span></div>
        <div class="ptinfo" id="ptinfo"></div>
        <div class="stats" id="stats"></div>
        <h3 style="margin-top:16px">標籤與心情（全部紀錄）</h3>
        <ul class="corr" id="corr"></ul>
      </section>

      <section class="card" aria-labelledby="searchH">
        <h3 id="searchH">搜尋短記</h3>
        <input type="search" id="search" placeholder="輸入關鍵字，例如：跑步" aria-label="搜尋短記">
        <ul class="results" id="results"></ul>
      </section>
    </div>
  </div>
</div>

<dialog class="sheet" id="setDlg" aria-labelledby="setTitle">
  <div class="dh"><h3 id="setTitle">設定</h3><button class="ib" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <span class="lbl">標籤（最多 30 個，每個 1～8 字）</span>
  <div class="tagedit" id="tagEdit"></div>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="newTag" maxlength="8" placeholder="新標籤" aria-label="新標籤名稱"><button class="btn" id="addTag">新增</button></div>
  <div id="pinBox">
    <span class="lbl">PIN 鎖</span>
    <p class="hint" style="margin-top:0">開啟頁面時需輸入 4 位數 PIN。這只能防旁人偷看，資料本身並未加密。</p>
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="password" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 位數字" aria-label="新 PIN"><button class="btn" id="pinSet">設定 PIN</button><button class="btn dan" id="pinOff">移除</button></div>
    <p class="hint" id="pinState"></p>
  </div>
  <span class="lbl">外觀</span>
  <div class="seg" id="themeSeg"><button type="button" id="theme-auto" data-t="auto">跟隨系統</button><button type="button" id="theme-light" data-t="light">淺色</button><button type="button" id="theme-dark" data-t="dark">深色</button></div>
  <span class="lbl">備份與匯出</span>
  <div class="row">
    <button class="btn" id="dlJson" hidden>下載 JSON</button>
    <button class="btn" id="dlMd" hidden>下載 Markdown</button>
    <button class="btn" id="cpJson">複製 JSON</button>
    <button class="btn" id="cpMd">複製 Markdown</button>
    <button class="btn" id="impBtn">匯入 JSON</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
  </div>
  <textarea class="plain" id="expText" hidden readonly aria-label="匯出內容"></textarea>
  <p class="err" id="setErr" role="alert"></p>
</dialog>

<dialog class="center" id="cfmDlg" aria-labelledby="cfmT">
  <div class="dh"><h3 id="cfmT">刪除紀錄？</h3></div>
  <p id="cfmMsg" class="msg"></p>
  <div class="row"><button class="btn dan" id="cfmYes">刪除</button><button class="btn" data-close>取消</button></div>
</dialog>

<div class="lock" id="lock" hidden>
  <h2>心情日記已上鎖</h2>
  <label for="unlockIn" class="msg">輸入 4 位數 PIN</label>
  <input type="password" id="unlockIn" inputmode="numeric" maxlength="4" autocomplete="off">
  <button class="btn pri" id="unlockBtn">解鎖</button>
  <p class="err" id="unlockErr" role="alert"></p>
</div>

<script>
(() => {
'use strict';
const KEY = 'mood-journal:v1:data', TKEY = 'mood-journal:v1:theme';
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]); } for (const c of kids) if (c != null) n.append(c); return n; };
const svg = (tag, attrs) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const dn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDn = n => new Date(n * 864e5).toISOString().slice(0, 10);
const FACES = ['', '😫', '🙁', '😐', '🙂', '😄'];
const NAMES = ['', '很糟', '不太好', '普通', '不錯', '很好'];
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- data ---------- */
const DEFTAGS = ['工作', '運動', '家人', '朋友', '睡眠不足', '天氣差', '閱讀', '加班'];

$('#dlJson').onclick = () => doDl(`mood-journal-${todayStr()}.json`, jsonStr());
$('#dlMd').onclick = () => doDl(`mood-journal-${todayStr()}.md`, mdStr());
function copy(s, label) {
  const fb = () => { const t = $('#expText'); t.hidden = false; t.value = s; t.focus(); t.select(); $('#setErr').textContent = '無法自動複製，已選取下方文字，請手動複製。'; };
  try { navigator.clipboard.writeText(s).then(() => toast('已複製 ' + label), fb); } catch (e) { fb(); }
}
$('#cpJson').onclick = () => copy(jsonStr(), 'JSON');
$('#cpMd').onclick = () => copy(mdStr(), 'Markdown');
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async () => {
  const f = $('#impFile').files[0]; $('#impFile').value = ''; if (!f) return;
  try { const j = JSON.parse(await f.text()); const d = j && j.data ? j.data : j; if (!valid(d)) throw 0; data = { entries: d.entries, tags: d.tags, settings: d.settings || { pin: null } }; save(); $('#setDlg').close(); loadForm(todayStr()); renderAll(); toast('已匯入備份'); }
  catch (e) { $('#setErr').textContent = '檔案格式不正確，未變更現有資料。'; }
};

/* ---------- lock ---------- */
async function unlock() {
  const p = $('#unlockIn').value;
  if (!/^\d{4}$/.test(p)) { $('#unlockErr').textContent = '請輸入 4 位數字。'; return; }
  if (await sha256(p) === data.settings.pin) { $('#lock').hidden = true; $('#unlockIn').value = ''; } else { $('#unlockErr').textContent = 'PIN 不正確。'; $('#unlockIn').value = ''; }
}
$('#unlockBtn').onclick = unlock;
$('#unlockIn').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
if (data.settings.pin && hasSubtle) { $('#lock').hidden = false; setTimeout(() => $('#unlockIn').focus(), 50); }

window.__mj = { movingAvg, tagCorr, get data() { return data; }, sha256 };
loadForm(todayStr());
renderAll();
})();
</script>
