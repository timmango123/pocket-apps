<title>單字閃卡</title>
<style>
/* Ruled index cards: cool paper, faint blue rules, a red header line; ratings speak in traffic colours. */
:root {
  --bg: #e6eaef;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --card: #fdfdfb;
  --rule: #d6e2f0;
  --margin: #e0675d;
  --ink: #18202b;
  --muted: #5a6574;
  --line: #d2d8e0;
  --line-strong: #a5afbd;
  --accent: #2346a0;
  --accent-ink: #ffffff;
  --accent-soft: #e1e8f8;
  --due: #c4372c;
  --new: #2463c9;
  --again: #c4372c; --hard: #b06a00; --good: #1f8a4c; --easy: #2463c9;
  --again-soft: #fbe3e0; --hard-soft: #fbedd6; --good-soft: #dcf2e4; --easy-soft: #e0eafb;
  --shadow: 0 1px 0 rgba(24,32,43,.05), 0 6px 18px rgba(24,32,43,.08);
  --scrim: rgba(12,16,22,.5);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif TC", "PMingLiU", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #181c23; --surface-2: #20252e; --card: #1c2129; --rule: #26303d; --margin: #b65048;
    --ink: #e8ecf1; --muted: #a0aab7; --line: #2c333e; --line-strong: #4a5462; --accent: #8fa9f2; --accent-ink: #0d1733; --accent-soft: #1d2741;
    --due: #ff8075; --new: #7fa8ff; --again: #ff8075; --hard: #f0b45a; --good: #5fd08f; --easy: #7fa8ff;
    --again-soft: #3a1d1b; --hard-soft: #3a2a12; --good-soft: #153222; --easy-soft: #1a2846;
    --shadow: 0 1px 0 rgba(0,0,0,.3); --scrim: rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #181c23; --surface-2: #20252e; --card: #1c2129; --rule: #26303d; --margin: #b65048;
  --ink: #e8ecf1; --muted: #a0aab7; --line: #2c333e; --line-strong: #4a5462; --accent: #8fa9f2; --accent-ink: #0d1733; --accent-soft: #1d2741;
  --due: #ff8075; --new: #7fa8ff; --again: #ff8075; --hard: #f0b45a; --good: #5fd08f; --easy: #7fa8ff;
  --again-soft: #3a1d1b; --hard-soft: #3a2a12; --good-soft: #153222; --easy-soft: #1a2846;
  --shadow: 0 1px 0 rgba(0,0,0,.3); --scrim: rgba(0,0,0,.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-block: 8px calc(24px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  overflow-x: hidden;
}
body.reviewing { height: 100%; overflow: hidden; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
html:has(body.reviewing) { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1100px; margin: 0 auto; height: 100%; }

/* common */
.top { display: flex; align-items: center; gap: 8px; min-height: 52px; margin-bottom: 10px; }
.top h1, .top h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 { font-family: var(--serif); font-size: 23px; letter-spacing: .02em; }
.ib { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); }
.ib svg { width: 21px; height: 21px; }
.ib:disabled { opacity: .35; cursor: default; }
.btn { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 11px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--again); }
.btn.armed { background: var(--again); border-color: var(--again); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; min-height: 52px; font-size: 17px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; margin-left: 6px; font-family: var(--sans); letter-spacing: 0; }
.n-due { color: var(--due); font-weight: 800; font-variant-numeric: tabular-nums; }
.n-new { color: var(--new); font-weight: 800; font-variant-numeric: tabular-nums; }
.in { width: 100%; min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
textarea.in { resize: vertical; line-height: 1.5; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* layout */
.cols { display: grid; gap: 18px; }
@media (min-width: 960px) { .cols.two { grid-template-columns: 380px 1fr; align-items: start; } .cols.two #col-a { position: sticky; top: 8px; } }

/* today card */
.today { position: relative; background: var(--card); border-radius: 14px; padding: 16px 16px 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden;
  background-image: linear-gradient(var(--margin), var(--margin)), repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px);
  background-size: 100% 3px, 100% 100%; background-repeat: no-repeat, repeat; background-position: 0 0, 0 14px; margin-bottom: 14px; }
.today .k { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
.today .big { font-family: var(--serif); font-size: 22px; margin: 4px 0 12px; }
.today .big b { font-size: 30px; font-variant-numeric: tabular-nums; }

/* deck list */
.decks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.deck { position: relative; border-radius: 12px; overflow: hidden; }
.deck .del { visibility: hidden; }
.deck.reveal .del { visibility: visible; }
.deck .del { position: absolute; right: 0; top: 0; bottom: 0; width: 96px; border: 0; background: var(--again); color: var(--surface); font-weight: 800; cursor: pointer; }
.deck .del.armed { background: var(--ink); color: var(--bg); }
.deck .open { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; min-height: 64px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; touch-action: pan-y; transition: transform .2s; }
.deck.sel .open { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.deck .nm { font-weight: 750; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck .meta { grid-column: 1; font-size: 13px; color: var(--muted); }
.deck .cnt { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 12px; align-items: center; font-size: 15px; }
.deck .cnt span { display: grid; justify-items: center; line-height: 1.1; min-width: 2.2em; }
.deck .cnt small { font-size: 11px; color: var(--muted); font-weight: 600; }
.empty { text-align: center; padding: 28px 16px; border: 1.5px dashed var(--line-strong); border-radius: 14px; display: grid; gap: 12px; justify-items: center; }
.empty p { margin: 0; color: var(--muted); }

/* deck detail */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stats3 div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.stats3 b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats3 small { color: var(--muted); font-size: 12px; font-weight: 600; }
.cards { list-style: none; margin: 10px 0 0; padding: 0; }
.cards li { border-bottom: 1px solid var(--line); }
.cards button { width: 100%; min-height: 52px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 4px; border: 0; background: none; text-align: left; cursor: pointer; }
.cards .f { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cards .b { grid-column: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cards .d { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.cards .d.is-new { color: var(--new); }
.cards .d.is-due { color: var(--due); }

/* review */
.rv { height: 100%; display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
.rv-top { display: flex; align-items: center; gap: 8px; flex: none; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.left { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; perspective: 1400px; position: relative; }
.card3d { position: relative; width: 100%; height: min(60vh, 100%); max-height: 520px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .3s ease; }
.card3d.flipped .flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 34px 20px 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; overflow: auto; touch-action: none;
  background-image: linear-gradient(var(--margin), var(--margin)), repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px);
  background-size: 100% 3px, 100% 100%; background-repeat: no-repeat, repeat; background-position: 0 22px, 0 22px; }
.face.back { transform: rotateY(180deg); }
.face .txt { margin-top: auto; } .face > :last-child { margin-bottom: auto; } /* centred, but overflow stays reachable */
.face.scroll { touch-action: pan-y; } /* long content: vertical drag scrolls, horizontal still swipes */
.face .tag { position: absolute; top: 4px; left: 14px; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
.face .txt { font-family: var(--serif); font-size: clamp(22px, 6.2vw, 32px); line-height: 1.35; overflow-wrap: anywhere; max-width: 100%; }
.face .txt.long { font-size: 18px; line-height: 1.55; text-align: left; }
.face .sub { margin-top: 14px; font-size: 15px; color: var(--muted); font-family: var(--serif); white-space: pre-wrap; }
.face .note { margin-top: 12px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line-strong); padding-top: 8px; }
.speak { margin-top: 14px; }
.hintx { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; opacity: 0; display: grid; place-items: center; font-size: 26px; font-weight: 900; letter-spacing: .1em; z-index: 2; }
.hint-l { box-shadow: inset 6px 0 0 var(--again); color: var(--again); background: color-mix(in srgb, var(--again) 10%, transparent); }
.hint-r { box-shadow: inset -6px 0 0 var(--good); color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.hint-u { box-shadow: inset 0 6px 0 var(--easy); color: var(--easy); background: color-mix(in srgb, var(--easy) 10%, transparent); }
.actions { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-height: 64px; }
.actions .show { grid-column: 1 / -1; }
.rate { min-height: 60px; border-radius: 12px; border: 1.5px solid transparent; cursor: pointer; display: grid; place-content: center; gap: 1px; font-weight: 800; font-size: 16px; }
.rate small { font-size: 12px; font-weight: 650; opacity: .85; font-variant-numeric: tabular-nums; }
.r1 { background: var(--again-soft); color: var(--again); border-color: var(--again); }
.r2 { background: var(--hard-soft); color: var(--hard); border-color: var(--hard); }
.r3 { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.r4 { background: var(--easy-soft); color: var(--easy); border-color: var(--easy); }
.kbd { font-size: 12px; color: var(--muted); text-align: center; margin: 0; flex: none; }
@media (orientation: landscape) and (max-height: 520px) {
  .card3d { height: 100%; }
  .face { padding-top: 26px; }
  .rate { min-height: 48px; }
  .actions { min-height: 48px; }
  .kbd { display: none; }
}
.done { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 24px 8px; }
.done h2 { font-family: var(--serif); font-size: 28px; margin: 0; }
.done .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.done .nums div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; }
.done .nums b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.done .nums small { color: var(--muted); font-size: 12px; font-weight: 600; }

/* stats */
.chart { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font-size: 10px; }
.chart .grid { stroke: var(--line); }
.chart .bar-total { fill: var(--line-strong); }
.chart .bar-ok { fill: var(--good); }
.chart .bar-fc { fill: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
h3.sec { font-size: 15px; margin: 18px 0 8px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 640px) { .scrim { align-items: center; } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow: auto; } }
.sheet { background: var(--surface); border-radius: 16px; width: 100%; max-width: 520px; max-height: 100%; overflow: auto; padding: 16px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 18px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet .x { width: 44px; height: 44px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); flex: none; }
.menu-list { display: grid; gap: 6px; }
.menu-list .btn { justify-content: flex-start; min-height: 50px; }
.preview { font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.preview .bad { color: var(--again); }
.preview ol { margin: 4px 0 0; padding-left: 20px; max-height: 140px; overflow: auto; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); text-align: center; font-size: 14px; }
@media (hover: hover) {
  .btn:not(:disabled):hover, .ib:not(:disabled):hover { border-color: var(--ink); }
  .deck .open:hover { border-color: var(--line-strong); }
  .cards button:hover { background: var(--surface-2); }
  .rate:hover { filter: brightness(1.04); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = 'flash-cards:v1:';
const ls = {
  get(k, d) { let raw = null; try { raw = localStorage.getItem(P + k); } catch (e) { return d; } if (raw == null) return d; try { return JSON.parse(raw); } catch (e) { try { localStorage.setItem(P + 'corrupt', raw); } catch (_) {} return d; } },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const MIN = 60000, DAY = 86400000;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function rand01() { if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 0x100000000; } return Math.random(); }
let toastT;
function toast(s, ms = 2200) { const t = $('#toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- settings & theme ----------
let settings = Object.assign({ rollover: 4, newPerDay: 20, reviewLimit: 200 }, ls.get('settings', {}));
let theme = ls.get('theme', 'auto');
function applyTheme() { if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; }
applyTheme();

// ---------- day boundaries (local time, rollover hour) ----------
function dayStart(ts) { const d = new Date(ts - settings.rollover * 3600000); d.setHours(0, 0, 0, 0); d.setHours(settings.rollover); return d.getTime(); }
function dayEnd(ts) { const d = new Date(dayStart(ts)); d.setDate(d.getDate() + 1); return d.getTime(); }
function dayKey(ts) { const d = new Date(ts - settings.rollover * 3600000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
let clock = () => Date.now();

// ---------- SM-2 variant scheduler (pure) ----------
const LEARN = [1, 10], RELEARN = [10];
const clampEase = e => Math.round(Math.min(3, Math.max(1.3, e)) * 100) / 100;
function schedule(card, rating, now, jitter = true) {

    if ([...f].length > 500 || [...b].length > 2000) { fail.push({ line: i + 1, why: '超過字數上限' }); return; }

    else cell += ch;

async function exportFile(filename, data, type) {

function importJSON(obj) {
  if (!obj || !Array.isArray(obj.decks) || !Array.isArray(obj.cards)) throw new Error('不是閃卡 JSON 檔');
  const decks = obj.decks.filter(d => d && d.id && d.name), ids = new Set(decks.map(d => d.id).concat([...db.decks.keys()]));
  const cards = obj.cards.filter(c => c && c.id && ids.has(c.deckId) && typeof c.front === 'string' && typeof c.back === 'string');
  decks.forEach(d => db.decks.set(d.id, d)); write('decks', decks);
  saveCards(cards);
  const have = new Set(db.reviews.map(r => r.id)), revs = (obj.reviews || []).filter(r => r && r.id && !have.has(r.id));
  db.reviews = db.reviews.concat(revs).sort((a, b) => a.ts - b.ts); write('reviews', revs);
  return { decks: decks.length, cards: cards.length };
}
function importText(name, text, isCSV) {
  let pairs = [], fail = [];
  if (isCSV) {
    const rows = parseCSV(text);
    rows.forEach((r, i) => { if (i === 0 && /^(正面|front)$/i.test((r[0] || '').trim())) return; const f = (r[0] || '').trim(), b = (r[1] || '').trim(); if (f && b) pairs.push({ front: f, back: b, tags: (r[2] || '').split(/\s+/).filter(Boolean) }); else fail.push(i + 1); });
  } else { const res = parseBatch(text, []); pairs = res.ok; fail = res.fail.map(f => f.line); }
  if (!pairs.length) throw new Error('檔案中沒有可匯入的卡片');
  const d = newDeck(name.replace(/\.[^.]+$/, '').slice(0, 40) || '匯入的卡組'); saveDeck(d);
  saveCards(pairs.map(p => newCard(d.id, p.front, p.back, '', p.tags || [])));

// ---------- review session ----------
let ses = null;
function buildQueue(deckIds, now = clock()) {
  const end = dayEnd(now), main = [], pending = [];
  deckIds.forEach(id => {
    const d = db.decks.get(id), cnt = todayCounts(id, now), cards = deckCards(id);
    cards.filter(c => (c.state === 'learning' || c.state === 'relearning') && c.due < end).forEach(c => pending.push(c.id));
    const rev = cards.filter(c => c.state === 'review' && c.due < end).sort((a, b) => a.due - b.due).slice(0, cnt.rev);
    const nw = cards.filter(c => c.state === 'new').sort((a, b) => a.created - b.created).slice(0, cnt.nw);
    main.push({ rev, nw });
  });
  // merge decks: reviews by due, new by deck order; then insert 1 new after every 4 reviews
  const rev = [].concat(...main.map(m => m.rev)).sort((a, b) => a.due - b.due), nw = [].concat(...main.map(m => m.nw));
  const q = []; let ri = 0, ni = 0;
  while (ri < rev.length || ni < nw.length) {
    for (let k = 0; k < 4 && ri < rev.length; k++) q.push(rev[ri++].id);
    if (ni < nw.length) q.push(nw[ni++].id);
    if (ri >= rev.length) while (ni < nw.length) q.push(nw[ni++].id);
  }
  return { main: q, pending };
}
function startReview(target) {
  const deckIds = target === 'all' ? [...db.decks.keys()] : (db.decks.has(target) ? [target] : []);
  if (!deckIds.length) { go('#/'); return; }
  const qb = buildQueue(deckIds);
  ses = { target, deckIds, main: qb.main, pending: qb.pending, cur: null, flipped: false, done: 0, correct: 0, wrong: new Set(), undo: [], t0: Date.now(), practice: false };
  nextCard();
}
function pickNext() {
  const now = clock();
  const pend = ses.pending.map(id => db.cards.get(id)).filter(Boolean).sort((a, b) => a.due - b.due);
  if (pend.length && pend[0].due <= now) return pend[0].id;
  if (ses.main.length) return ses.main[0];
  if (pend.length) return pend[0].id;   // learn ahead when nothing else is left
  return null;
}
function nextCard() {
  const id = pickNext();
  if (!id) { ses.cur = null; showDone(); return; }
  ses.main = ses.main.filter(x => x !== id); ses.pending = ses.pending.filter(x => x !== id);
  ses.cur = id; ses.flipped = false; showCard(true);
}
function remaining() { return ses.main.length + ses.pending.length + (ses.cur ? 1 : 0); }
function showCard(reset) {
  if (!ses || !ses.cur) return;
  const c = ses.practice ? ses.practiceCards.get(ses.cur) : db.cards.get(ses.cur), d = db.decks.get(c.deckId) || {};
  $('#rv-done').hidden = true; $('#rv-card').hidden = false; $('#rv-actions').hidden = false; $('#rv-kbd').hidden = false;
  const [f, b] = d.reverse ? [c.back, c.front] : [c.front, c.back];
  const setFace = (el, xel, text, extra) => {
    el.innerHTML = render(text); el.classList.toggle('long', plain(text).length > 80);
    const hasSound = text.includes(SOUND) || (d.autoSpeak && text === c.front);
    const v = 'speechSynthesis' in window && voiceFor(d.lang || 'en-US');
    xel.innerHTML = (extra || '') + (hasSound ? `<button class="btn speak" data-say="${el.id}" ${v ? '' : 'disabled title="找不到對應語音"'}>${IC.sound} ${v ? '朗讀' : '無對應語音'}</button>` : '');
    xel.querySelectorAll('[data-say]').forEach(btn => btn.onclick = e => { e.stopPropagation(); speak(text, d.lang || 'en-US'); });
  };
  setFace($('#rv-front'), $('#rv-front-x'), f, '');
  setFace($('#rv-back'), $('#rv-back-x'), b, `<div class="sub">${render(f)}</div>` + (c.note ? `<div class="note">${esc(c.note)}</div>` : ''));
  $('#rv-tag-f').textContent = d.reverse ? '背面' : '正面'; $('#rv-tag-b').textContent = d.reverse ? '正面' : '背面';
  const card = $('#rv-card');
  fitFaces(reset);
  if (reset) { card.classList.add('noanim'); card.classList.remove('flipped'); card.style.transform = ''; const fl = card.querySelector('.flip'); fl.style.transition = 'none'; void fl.offsetWidth; fl.style.transition = ''; }
  setFlipped(ses.flipped);
  const tot = ses.done + remaining();
  $('#rv-bar').style.width = (tot ? ses.done / tot * 100 : 0) + '%';
  $('#rv-bar-wrap').setAttribute('aria-valuenow', ses.done); $('#rv-bar-wrap').setAttribute('aria-valuemax', tot);
  $('#rv-left').textContent = `${ses.done}／${tot}`;
  $('#rv-undo').disabled = !ses.undo.length;
  if (!ses.practice) { const now = clock(); for (let r = 1; r <= 4; r++) { const n = schedule(c, r, now, false); $('#iv-' + r).textContent = fmtIv(n.due - now); } }
  else for (let r = 1; r <= 4; r++) $('#iv-' + r).textContent = r === 1 ? '再一次' : '練習';
  if (reset && d.autoSpeak && !ses.flipped) speak(f, d.lang || 'en-US');
}
function fitFaces(top) { document.querySelectorAll('#rv-card .face').forEach(f => { if (top) f.scrollTop = 0; f.classList.toggle('scroll', f.scrollHeight > f.clientHeight + 1); }); }
addEventListener('resize', () => { if (ses && ses.cur) fitFaces(false); });
function setFlipped(v) {
  ses.flipped = v; $('#rv-card').classList.toggle('flipped', v);
  $('#rv-card').setAttribute('aria-label', v ? '閃卡背面' : '閃卡正面，點擊翻面');
  $('#rv-show').hidden = v; for (let r = 1; r <= 4; r++) $('#rate-' + r).hidden = !v;
}
function rate(r) {
  if (!ses || !ses.cur || !ses.flipped) return;
  const now = clock();
  if (ses.practice) {
    ses.undo.push({ cur: ses.cur, main: ses.main.slice(), pending: [], done: ses.done, correct: ses.correct });
    if (r === 1) ses.main.push(ses.cur); else ses.correct++;
    ses.done++; nextCard(); return;
  }
  const c = db.cards.get(ses.cur), n = schedule(c, r, now, true);
  const rev = { id: uid(), cardId: c.id, deckId: c.deckId, ts: now, rating: r, interval: n.interval, prevState: c.state, wasNew: c.state === 'new', state: n.state };
  ses.undo.push({ card: Object.assign({}, c), cur: ses.cur, main: ses.main.slice(), pending: ses.pending.slice(), done: ses.done, correct: ses.correct, wrong: [...ses.wrong], review: rev.id });
  saveCards([n]); addReview(rev);
  ses.done++; if (r >= 2) ses.correct++; else ses.wrong.add(c.id);
  if ((n.state === 'learning' || n.state === 'relearning') && n.due < dayEnd(now)) ses.pending.push(n.id);
  if (n.deckId) { const d = db.decks.get(n.deckId); if (d && d.sample) { d.sample = false; saveDeck(d); } }
  nextCard();
}
function undoRate() {
  if (!ses || !ses.undo.length) return;
  const u = ses.undo.pop();
  if (!ses.practice) { saveCards([u.card]); delReview(u.review); ses.wrong = new Set(u.wrong); ses.pending = u.pending; }
  ses.main = u.main; ses.done = u.done; ses.correct = u.correct; ses.cur = u.cur; ses.flipped = true;
  showCard(true); setFlipped(true); toast('已撤銷上一張');
}
function showDone() {
  $('#rv-card').hidden = true; $('#rv-actions').hidden = true; $('#rv-kbd').hidden = true;
  const el = $('#rv-done'); el.hidden = false;
  $('#rv-bar').style.width = '100%'; $('#rv-left').textContent = `${ses.done}／${ses.done}`; $('#rv-undo').disabled = !ses.undo.length;
  const secs = Math.round((Date.now() - ses.t0) / 1000), acc = ses.done ? Math.round(ses.correct / ses.done * 100) : 0;
  const nd = nextDueAfter();
  el.innerHTML = ses.done ? `<h2>${ses.practice ? '練習完成' : '本輪完成'}</h2>
    <div class="nums"><div><b id="dn-count">${ses.done}</b><small>張數</small></div><div><b id="dn-acc">${acc}%</b><small>正確率</small></div><div><b>${secs >= 60 ? Math.floor(secs / 60) + ' 分 ' : ''}${secs % 60} 秒</b><small>用時</small></div></div>
    ${!ses.practice && ses.wrong.size ? `<button class="btn primary" id="dn-wrong">再複習一次錯的（${ses.wrong.size} 張）</button>` : ''}
    <p class="muted" style="margin:0">${nd ? '下次到期：' + new Date(nd).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : ''}</p>
    <button class="btn" id="dn-home">回到卡組</button>`
    : `<h2>今天完成了</h2><p class="muted" style="margin:0">${nd ? '下次到期：' + new Date(nd).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '這裡沒有需要複習的卡片'}</p><button class="btn" id="dn-home">回到卡組</button>`;
  el.querySelector('#dn-home').onclick = exitReview;
  const w = el.querySelector('#dn-wrong');
  if (w) w.onclick = () => {
    const pc = new Map([...ses.wrong].map(id => [id, Object.assign({}, db.cards.get(id))]).filter(([, c]) => c.id));
    ses = { target: ses.target, deckIds: ses.deckIds, main: [...pc.keys()], pending: [], cur: null, flipped: false, done: 0, correct: 0, wrong: new Set(), undo: [], t0: Date.now(), practice: true, practiceCards: pc };
    nextCard();
  };
}
function exitReview() { try { speechSynthesis.cancel(); } catch (e) {} const t = ses && ses.target; ses = null; go(t && t !== 'all' ? '#/deck/' + encodeURIComponent(t) : '#/'); }
$('#rv-exit').onclick = exitReview;
$('#rv-undo').onclick = undoRate;
$('#rv-show').onclick = () => setFlipped(true);
for (let r = 1; r <= 4; r++) $('#rate-' + r).onclick = () => rate(r);

// card: tap to flip, swipe to rate (after flip)
(() => {
  const card = $('#rv-card'); let g = null;
  const hints = { l: $('#hint-l'), r: $('#hint-r'), u: $('#hint-u') };
  const clearHints = () => Object.values(hints).forEach(h => h.style.opacity = 0);
  card.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; g = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, dy: 0, id: e.pointerId }; try { card.setPointerCapture(e.pointerId); } catch (_) {} });
  card.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    g.dx = e.clientX - g.x; g.dy = e.clientY - g.y;
    if (!ses || !ses.flipped) return;
    card.style.transition = 'none';
    card.style.transform = `translate(${g.dx}px, ${Math.min(0, g.dy)}px) rotate(${g.dx / 20}deg)`;
    const w = card.clientWidth * 0.25; clearHints();
    if (-g.dy > Math.abs(g.dx) && g.dy < -20) hints.u.style.opacity = Math.min(1, -g.dy / w);
    else if (g.dx < -20) hints.l.style.opacity = Math.min(1, -g.dx / w);
    else if (g.dx > 20) hints.r.style.opacity = Math.min(1, g.dx / w);
  });
  const end = e => {
    if (!g || (e.pointerId !== undefined && e.pointerId !== g.id)) return;
    const { dx, dy } = g, dt = Math.max(1, performance.now() - g.t), w = card.clientWidth * 0.25;
    const vx = Math.abs(dx) / dt, vy = Math.abs(dy) / dt; g = null; clearHints();
    card.style.transition = ''; card.style.transform = '';
    if (e.type === 'pointercancel') return;
    if (Math.hypot(dx, dy) < 10) { if (ses && ses.cur) setFlipped(!ses.flipped); return; }
    if (!ses || !ses.flipped) return;
    if (-dy > Math.abs(dx) && (-dy > w || (vy > 0.5 && -dy > 30))) { rate(4); return; }
    if (Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > w || (vx > 0.5 && Math.abs(dx) > 30))) rate(dx < 0 ? 1 : 3);
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  card.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setFlipped(!ses.flipped); } });
})();
addEventListener('keydown', e => {
  if (!$('#sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (route.name !== 'review' || !ses || e.target.matches('input, textarea, select')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoRate(); return; }
  if (e.key === ' ') { e.preventDefault(); if (ses.cur) setFlipped(!ses.flipped); return; }
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); rate(+e.key); return; }
  if (e.key === 'Escape') exitReview();
});

// ---------- stats ----------
function barChart(vals, opts) {
  const W = 340, H = 140, pl = 26, pb = 18, pt = 8, n = vals.length, bw = (W - pl) / n;
  const max = Math.max(4, ...vals.map(v => v.total));
  const nice = Math.ceil(max / 4) * 4;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">`;
  for (let k = 0; k <= 4; k++) { const y = pt + (H - pt - pb) * (1 - k / 4); s += `<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke-width="1"/><text class="ax" x="${pl - 4}" y="${y + 3}" text-anchor="end">${nice * k / 4}</text>`; }
  vals.forEach((v, i) => {
    const x = pl + i * bw + 1, h = (H - pt - pb) * v.total / nice, y = H - pb - h;
    if (v.total) s += `<rect class="${opts.cls}" x="${x}" y="${y}" width="${Math.max(1, bw - 2)}" height="${h}" rx="1.5"><title>${v.label}：${v.total}${v.ok != null ? `（正確 ${v.ok}）` : ''}</title></rect>`;
    if (v.ok) { const h2 = (H - pt - pb) * v.ok / nice; s += `<rect class="bar-ok" x="${x}" y="${H - pb - h2}" width="${Math.max(1, bw - 2)}" height="${h2}" rx="1.5"/>`; }
    if (i % 5 === 0 && i < n - 3) s += `<text class="ax" x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${v.tick}</text>`;
    if (i === n - 1) s += `<text class="ax" x="${W}" y="${H - 4}" text-anchor="end">${v.tick}</text>`;
  });
  return s + '</svg>';
}
function renderStats() {
  const el = $('#view-stats'), now = clock(), start = dayStart(now);
  const past = []; const map = new Map();
  for (let i = 29; i >= 0; i--) { const d = new Date(start); d.setDate(d.getDate() - i); const k = dayKey(d.getTime() + 3600000 * 2); const o = { key: k, total: 0, ok: 0, label: `${d.getMonth() + 1}/${d.getDate()}`, tick: `${d.getMonth() + 1}/${d.getDate()}` }; past.push(o); map.set(k, o); }
  db.reviews.forEach(r => { const o = map.get(dayKey(r.ts)); if (o) { o.total++; if (r.rating >= 2) o.ok++; } });
  const fut = [];
  for (let i = 0; i < 30; i++) { const d = new Date(start); d.setDate(d.getDate() + i); const s = d.getTime(), e = new Date(d).setDate(d.getDate() + 1); fut.push({ s, e, total: 0, label: i === 0 ? '今天' : `${d.getMonth() + 1}/${d.getDate()}`, tick: i === 0 ? '今' : `${d.getMonth() + 1}/${d.getDate()}` }); }
  const end30 = fut[29].e;
  for (const c of db.cards.values()) { if (c.state === 'new') continue; const t = Math.max(c.due, start); if (t >= end30) continue; const b = fut.find(f => t >= f.s && t < f.e) || fut[0]; b.total++; }
  const tot = past.reduce((a, b) => a + b.total, 0), ok = past.reduce((a, b) => a + b.ok, 0);
  const all = [...db.cards.values()], mature = all.filter(c => c.state === 'review' && c.interval >= 21).length;
  el.innerHTML = `<div style="max-width:720px;margin:0 auto">
    <header class="top"><button class="ib" id="st-back" aria-label="返回">${IC.back}</button><h2>統計</h2></header>
    <div class="stats3"><div><b>${tot}</b><small>近 30 天複習</small></div><div><b>${tot ? Math.round(ok / tot * 100) : 0}%</b><small>正確率</small></div><div><b>${all.length}</b><small>總卡數・熟練 ${mature}</small></div></div>
    <div class="panel"><h3 class="sec" style="margin-top:0">近 30 天每日複習</h3>${barChart(past, { cls: 'bar-total', label: '近 30 天每日複習數' })}
      <p class="legend"><span><i style="background:var(--good)"></i>記得／困難／簡單</span><span><i style="background:var(--line-strong)"></i>重來</span></p></div>
    <div class="panel" style="margin-top:12px"><h3 class="sec" style="margin-top:0">未來 30 天到期預測</h3>${barChart(fut, { cls: 'bar-fc', label: '未來 30 天到期卡片數' })}
      <p class="muted" style="font-size:12px;margin:6px 0 0">已逾期的卡片算在「今天」。不含新卡。</p></div></div>`;
  el.querySelector('#st-back').onclick = () => go('#/');
}

// ---------- boot ----------
(async () => {
  await dbInit();
  if (!db.decks.size && !ls.get('seeded', false)) { makeSample(); ls.set('seeded', true); }
  onRoute();
})();
window.__fc = {
  schedule, fmtIv, parseBatch, parseCSV, buildQueue, todayCounts, exportJSON, importJSON, dayKey, dayStart, dayEnd, db,
  setClock(fn) { clock = fn || (() => Date.now()); }, get ses() { return ses; }, get mode() { return db.mode; },
  newCard, newDeck, saveDeck, saveCards, delDeck, rerender: () => onRoute(),
};
})();
