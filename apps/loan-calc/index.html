<title>貸款試算</title>
<style>
/* 貸款試算：帳簿式的版面——墨綠底線、本金綠與利息琥珀兩色貫穿摘要、圖表與攤還表；桌面為左側固定輸入欄 */
:root {

  --err: #b42318;

  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --num: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --surface-2: #121b18; --ink: #e3ece8; --muted: #9bb0a7; --line: #273531; --line-strong: #3d4f49;
    --accent: #7cd0aa; --accent-ink: #0b2018; --accent-soft: #1b3229; --principal: #5cc391; --interest: #f0b04f; --balance: #a9c0de; --grid: #22302b;
    --err: #ff8f84; --err-soft: #3a1915; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --surface-2: #121b18; --ink: #e3ece8; --muted: #9bb0a7; --line: #273531; --line-strong: #3d4f49;
  --accent: #7cd0aa; --accent-ink: #0b2018; --accent-soft: #1b3229; --principal: #5cc391; --interest: #f0b04f; --balance: #a9c0de; --grid: #22302b;
  --err: #ff8f84; --err-soft: #3a1915; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-block: 12px calc(28px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 3px double var(--line-strong); padding-bottom: 10px; }
header.top h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .06em; }
header.top h1 small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.icon-btn { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--muted); }
.layout { display: grid; gap: 12px; }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 800; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.inputs > summary { list-style: none; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-weight: 800; letter-spacing: .06em; font-size: 14px; }
details.inputs > summary::-webkit-details-marker { display: none; }
details.inputs > summary .sum { font-weight: 600; font-size: 13px; color: var(--muted); letter-spacing: 0; text-align: right; }
details.inputs > summary::after { content: "收合"; font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 0; flex: none; }
details.inputs:not([open]) > summary::after { content: "展開"; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.unit-in { position: relative; }
.unit-in span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--muted); pointer-events: none; font-weight: 600; }
input[type="text"], input[type="number"] { width: 100%; min-width: 0; height: 48px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); padding: 8px 40px 8px 12px; font-size: 18px; font-weight: 700; font-family: var(--num); font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 44px; border: 0; background: var(--surface); font-weight: 700; font-size: 14px; color: var(--muted); padding: 0 6px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.err:empty { display: none; }
details.adv { margin-top: 12px; border-top: 1px dashed var(--line-strong); padding-top: 4px; }
details.adv > summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; color: var(--accent); cursor: pointer; font-size: 14px; }
.sub { font-size: 13px; font-weight: 800; margin: 10px 0 6px; }
.rowlist { display: grid; gap: 6px; }
.rrow { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px; align-items: end; }
.rrow .x { height: 48px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; }
.btn { min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (hover: hover) { .btn:hover { border-color: var(--accent); } }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* 摘要 */
.summary .k { font-size: 13px; color: var(--muted); font-weight: 700; }
.hero { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
.hero .v { font-size: 44px; font-weight: 800; line-height: 1.05; }
.hero .u { font-size: 16px; color: var(--muted); font-weight: 700; }
.subline { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.subline b { color: var(--ink); }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; }
.ratio { height: 12px; border-radius: 3px; overflow: hidden; display: flex; background: var(--grid); margin: 10px 0 6px; }

.ratio .p { background: var(--principal); } .ratio .i { background: var(--interest); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
.facts div { padding: 9px 0; border-bottom: 1px solid var(--line); display: grid; gap: 1px; min-width: 0; }

.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* 圖表 */

canvas { display: block; width: 100%; height: 230px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.5; white-space: nowrap; transform: translateX(-50%); }
.tip b { font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .line { width: 14px; height: 0; border-top: 2px solid var(--balance); display: inline-block; }

/* 攤還表 */
.tbl-wrap { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; padding-left: 8px; }

td { font-variant-numeric: tabular-nums; }
td.p { color: var(--principal); } td.i { color: var(--interest); }
tr.grace td:first-child { box-shadow: inset 3px 0 var(--interest); }
tr.extra td:first-child { box-shadow: inset 3px 0 var(--principal); font-weight: 800; }

/* 比較 */
.cmp-wrap { overflow-x: auto; }
.cmp th, .cmp td { text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--muted); font-family: var(--sans); font-weight: 700; letter-spacing: 0; }
.cmp thead th { position: static; }
.cmp td.best { font-weight: 800; color: var(--principal); }
.cmp .diff { display: block; font-size: 11px; color: var(--interest); font-weight: 700; }
.cmp .rm { min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.copy-src { position: fixed; left: 0; top: 0; opacity: 0; pointer-events: none; white-space: pre; max-height: 1px; overflow: hidden; }
@media (max-width: 370px) { .hero .v { font-size: 38px; } th, td { padding: 7px 4px; font-size: 12px; } }
@media (min-width: 720px) { .layout.wide { grid-template-columns: 1fr 1fr; } }
@media (min-width: 940px) {
  .layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; gap: 18px; }
  .col.left { position: sticky; top: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(() => {
'use strict';
const KEY = 'loan-calc:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const yuan = n => fmt(n) + ' 元';
function wanStr(p) { const w = p / 10000; return (Number.isInteger(w) ? w.toLocaleString('zh-TW') : w.toLocaleString('zh-TW', { maximumFractionDigits: 4 })) + ' 萬'; }

/* ---------- 計算核心 ---------- */
function validate(inp) {
  const num = s => { const t = String(s == null ? '' : s).replace(/,/g, '').trim(); return t === '' ? NaN : Number(t); };
  const wan = num(inp.amount), rate = num(inp.rate), years = num(inp.years), grace = num(inp.grace === '' ? 0 : inp.grace);
  if (!(wan >= 1 && wan <= 100000)) return { error: '貸款金額需介於 1～100,000 萬元', field: 'amount' };
  if (!(rate >= 0 && rate <= 30)) return { error: '年利率需介於 0～30%', field: 'rate' };
  if (!Number.isInteger(years) || years < 1 || years > 40) return { error: '年限需為 1～40 的整數', field: 'years' };
  if (!Number.isInteger(grace) || grace < 0 || grace >= years) return { error: '寬限期需為整數且小於年限', field: 'grace' };
  const n = years * 12, segs = [], pres = [];
  for (const s of inp.segments || []) {
    const f = num(s.from), r = num(s.rate);
    if (isNaN(r)) continue; // rate not typed yet: unfinished row, ignore
    if (!Number.isInteger(f) || f < 2 || f > n) return { error: '分段利率的起始期數需為 2～' + n, field: 'seg' };
    if (!(r >= 0 && r <= 30)) return { error: '分段利率需介於 0～30%', field: 'seg' };
    segs.push({ from: f, rate: r });
  }
  for (const s of inp.prepays || []) {
    const k = num(s.n), w = num(s.wan);
    if (isNaN(w)) continue; // amount not typed yet: unfinished row, ignore
    if (!Number.isInteger(k) || k < 1 || k > n) return { error: '提前還款的期數需為 1～' + n, field: 'pre' };
    if (!(w > 0)) return { error: '提前還款金額需大於 0', field: 'pre' };
    pres.push({ n: k, amount: Math.round(w * 10000) });
  }
  segs.sort((a, b) => a.from - b.from);
  return { P: Math.round(wan * 10000), rate, n, g: grace * 12, method: inp.method === 'principal' ? 'principal' : 'equal', segs, pres, preMode: inp.preMode === 'shorten' ? 'shorten' : 'reduce' };
}
function annuity(B, r, k) { if (k <= 0) return B; if (r === 0) return Math.round(B / k); const f = Math.pow(1 + r, k); return Math.round(B * r * f / (f - 1)); }
function compute(inp) {
  const v = validate(inp); if (v.error) return v;
  const { P, n, g, method, segs, pres, preMode } = v;
  const sched = []; let B = P, pmt = 0, pfix = 0, recompute = true, prevRate = null;
  for (let i = 1; i <= n && B > 0; i++) {
    let rate = v.rate; for (const s of segs) if (s.from <= i) rate = s.rate;
    if (rate !== prevRate) recompute = true; prevRate = rate;
    const r = rate / 1200, interest = Math.round(B * r);
    let principal = 0;
    if (i > g) {
      if (i === g + 1) recompute = true;
      if (recompute) { const k = n - i + 1; if (method === 'equal') pmt = annuity(B, r, k); else pfix = Math.round(B / k); recompute = false; }
      principal = method === 'equal' ? pmt - interest : pfix;
      if (principal < 0) principal = 0;
      if (i === n || principal >= B) principal = B;
    }
    B -= principal;
    let extra = 0; for (const p of pres) if (p.n === i) extra += p.amount;
    extra = Math.min(extra, B); B -= extra;
    if (extra > 0 && (preMode === 'reduce' || i <= g)) recompute = true;
    sched.push({ n: i, payment: principal + interest, principal, interest, extra, balance: B, rate, grace: i <= g });
  }
  const pay = sched.filter(s => !s.grace), totalInterest = sched.reduce((a, s) => a + s.interest, 0);
  const totalPaid = sched.reduce((a, s) => a + s.payment + s.extra, 0);
  const amts = pay.map(s => s.payment);
  // 本息平均：最後一期吸收誤差，摘要的最高/最低不計最後一期
  const core = method === 'equal' && amts.length > 1 ? amts.slice(0, -1) : amts;
  return {
    v, schedule: sched,
    summary: {
      first: pay.length ? pay[0].payment : 0, max: core.length ? Math.max(...core) : 0, min: core.length ? Math.min(...core) : 0,
      last: amts.length ? amts[amts.length - 1] : 0, gracePay: g && sched.length ? sched[0].payment : 0,
      totalInterest, totalPaid, ratio: totalPaid ? totalInterest / totalPaid : 0, periods: sched.length, n
    }
  };
}

/* ---------- 狀態 ---------- */
const DEF = { amount: '1000', rate: '2', years: 30, grace: 0, method: 'equal', segments: [], prepays: [], preMode: 'reduce' };
let S = Object.assign({}, DEF, store.get('inputs', {}) || {});
if (!Array.isArray(S.segments)) S.segments = []; if (!Array.isArray(S.prepays)) S.prepays = [];
let scenarios = store.get('scenarios', []); if (!Array.isArray(scenarios)) scenarios = []; scenarios = scenarios.filter(s => s && s.inputs).slice(0, 3);
let view = store.get('view', 'year') === 'month' ? 'month' : 'year';
let R = null, saveT = 0;
const flush = () => { clearTimeout(saveT); store.set('inputs', S); store.set('scenarios', scenarios); store.set('view', view); };
const save = () => { clearTimeout(saveT); saveT = setTimeout(flush, 300); };
addEventListener('pagehide', flush);
const isDefault = () => String(S.amount) === DEF.amount && String(S.rate) === DEF.rate && +S.years === DEF.years && !+S.grace && S.method === 'equal' && !S.segments.length && !S.prepays.length;

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast('已複製' + label); }
  catch (e) { const src = $('#copy-src'); src.textContent = text; const r = document.createRange(); r.selectNodeContents(src); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('無法自動複製，已選取內容，請用系統選單複製'); }
}

/* 主題 */
const THEMES = ['auto', 'light', 'dark'], TL = { auto: '自動', light: '淺色', dark: '深色' };
let theme = store.get('theme', 'auto'); if (!THEMES.includes(theme)) theme = 'auto';
const applyTheme = () => { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('#theme-label').textContent = TL[theme]; };
$('#theme-btn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(); drawChart(); });
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => drawChart());

/* ---------- 輸入列 ---------- */
function rowsHTML(kind) {
  const list = kind === 'seg' ? S.segments : S.prepays;
  return list.map((r, i) => kind === 'seg'
    ? '<div class="rrow"><div class="field"><label for="seg-from-' + i + '">第幾期起</label><div class="unit-in"><input type="number" id="seg-from-' + i + '" data-kind="seg" data-i="' + i + '" data-k="from" inputmode="numeric" value="' + esc(r.from ?? '') + '"><span>期</span></div></div><div class="field"><label for="seg-rate-' + i + '">年利率</label><div class="unit-in"><input type="text" id="seg-rate-' + i + '" data-kind="seg" data-i="' + i + '" data-k="rate" inputmode="decimal" value="' + esc(r.rate ?? '') + '"><span>%</span></div></div><button type="button" class="x" data-rm="seg" data-i="' + i + '" aria-label="移除這段利率">✕</button></div>'
    : '<div class="rrow"><div class="field"><label for="pre-n-' + i + '">第幾期</label><div class="unit-in"><input type="number" id="pre-n-' + i + '" data-kind="pre" data-i="' + i + '" data-k="n" inputmode="numeric" value="' + esc(r.n ?? '') + '"><span>期</span></div></div><div class="field"><label for="pre-wan-' + i + '">還款金額</label><div class="unit-in"><input type="text" id="pre-wan-' + i + '" data-kind="pre" data-i="' + i + '" data-k="wan" inputmode="decimal" value="' + esc(r.wan ?? '') + '"><span>萬</span></div></div><button type="button" class="x" data-rm="pre" data-i="' + i + '" aria-label="移除這筆提前還款">✕</button></div>'
  ).join('');
}
function renderRows() { $('#seg-list').innerHTML = rowsHTML('seg'); $('#pre-list').innerHTML = rowsHTML('pre'); $('#seg-add').hidden = S.segments.length >= 5; $('#pre-add').hidden = S.prepays.length >= 10; }
function syncInputs() {
  $('#amount').value = S.amount; $('#rate').value = S.rate; $('#years').value = S.years; $('#grace').value = S.grace;
  document.querySelectorAll('[id^="method-"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.method)));
  document.querySelectorAll('[id^="pre-mode-"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.preMode)));
  document.querySelectorAll('[id^="view-"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
  renderRows();
}

/* ---------- 摘要 ---------- */
function renderSummary() {
  const box = $('#summary'), err = $('#err');
  ['amount', 'rate', 'years', 'grace'].forEach(id => $('#' + id).classList.toggle('bad', !!(R.error && R.field === id)));
  if (R.error) { err.textContent = R.error; box.innerHTML = '<p class="k">修正輸入後即會重新計算。</p>'; $('#inputs-sum').textContent = ''; return; }
  err.textContent = '';
  const s = R.summary, v = R.v, eq = v.method === 'equal';
  $('#inputs-sum').textContent = wanStr(v.P) + '・' + v.rate + '%・' + (v.n / 12) + ' 年';
  const varies = s.max !== s.min;
  let hero, sub = '';
  if (eq) {
    hero = varies ? '<span class="k">首期月付' + (v.g ? '（寬限期後）' : '') + '</span>' : '<span class="k">每月還款' + (v.g ? '（寬限期後）' : '') + '</span>';
    if (varies) sub = '最高 <b class="n">' + yuan(s.max) + '</b>・最低 <b class="n">' + yuan(s.min) + '</b>';
  } else {
    hero = '<span class="k">首期最高月付' + (v.g ? '（寬限期後）' : '') + '</span>';
    sub = '末期最低 <b class="n">' + yuan(s.last) + '</b>';
  }
  if (v.g) sub = '寬限期 ' + (v.g / 12) + ' 年每月只繳息 <b class="n">' + yuan(s.gracePay) + '</b>' + (sub ? '<br>' + sub : '');
  const pPart = s.totalPaid - s.totalInterest;
  const shortened = s.periods < s.n ? '<div><span>提前還清</span><b class="n">縮短 ' + (s.n - s.periods) + ' 期</b></div>' : '';
  box.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' + hero + (isDefault() ? '<span class="pill">範例數值</span>' : '') + '</div>' +
    '<div class="hero"><span class="v n" id="monthly">' + fmt(s.first) + '</span><span class="u">元／月</span></div>' +
    (sub ? '<p class="subline">' + sub + '</p>' : '') +
    '<div class="ratio" aria-hidden="true"><i class="p" style="width:' + (100 - s.ratio * 100).toFixed(2) + '%"></i><i class="i" style="width:' + (s.ratio * 100).toFixed(2) + '%"></i></div>' +
    '<div class="facts">' +
      '<div><span><i class="dot" style="background:var(--interest)"></i>總利息</span><b class="n" id="total-interest">' + yuan(s.totalInterest) + '</b></div>' +
      '<div><span>總還款</span><b class="n" id="total-paid">' + yuan(s.totalPaid) + '</b></div>' +
      '<div><span><i class="dot" style="background:var(--principal)"></i>本金</span><b class="n">' + yuan(pPart) + '</b></div>' +
      '<div><span>利息占比</span><b class="n" id="interest-ratio">' + (s.ratio * 100).toFixed(1) + '%</b></div>' +
      '<div><span>還款期數</span><b class="n">' + s.periods + ' 期</b></div>' + (shortened || '<div><span>還款方式</span><b>' + (eq ? '本息平均' : '本金平均') + '</b></div>') +
    '</div>' +
    '<div class="actions"><button type="button" class="btn primary" id="cmp-save">加入比較</button><button type="button" class="btn" id="csv-btn">' + (DL ? '匯出 CSV' : '複製 CSV') + '</button><button type="button" class="btn" id="copy-sum">複製摘要</button></div>';
}

/* ---------- 圖表 ---------- */
let years = [], hoverIdx = -1;
function yearly() {
  const out = [];
  if (!R || R.error) return out;
  R.schedule.forEach(s => {
    const y = Math.ceil(s.n / 12) - 1;
    if (!out[y]) out[y] = { y: y + 1, payment: 0, principal: 0, interest: 0, extra: 0, balance: 0, from: s.n, to: s.n };
    const o = out[y]; o.payment += s.payment; o.principal += s.principal; o.interest += s.interest; o.extra += s.extra; o.balance = s.balance; o.to = s.n;
  });
  return out;
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
const short = v => v >= 1e8 ? (v / 1e8).toFixed(v % 1e8 ? 1 : 0) + '億' : v >= 1e4 ? (v / 1e4).toLocaleString('zh-TW', { maximumFractionDigits: 1 }) + '萬' : fmt(v);
let layout = null;
function drawChart() {
  const cv = $('#chart'), wrap = $('#chart-wrap'), W = wrap.clientWidth, H = 230, dpr = window.devicePixelRatio || 1;
  if (!W) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const col = { p: cssVar('--principal'), i: cssVar('--interest'), b: cssVar('--balance'), grid: cssVar('--grid'), muted: cssVar('--muted'), ink: cssVar('--ink') };
  if (!years.length) { layout = null; return; }
  c.font = '11px ' + cssVar('--sans');
  const left = 46, right = 46, top = 10, bottom = 24, pw = W - left - right, ph = H - top - bottom;
  const maxBar = niceMax(Math.max(...years.map(y => y.principal + y.extra + y.interest)));
  const maxBal = niceMax(R.v.P);
  c.strokeStyle = col.grid; c.lineWidth = 1; c.fillStyle = col.muted; c.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++) {
    const y = top + ph - ph * k / 4; c.beginPath(); c.moveTo(left, Math.round(y) + .5); c.lineTo(W - right, Math.round(y) + .5); c.stroke();
    c.textAlign = 'right'; c.fillText(short(maxBar * k / 4), left - 6, y);
    c.textAlign = 'left'; c.fillText(short(maxBal * k / 4), W - right + 6, y);
  }
  const n = years.length, slot = pw / n, bw = Math.max(2, Math.min(28, slot * .7));
  years.forEach((y, i) => {
    const x = left + slot * i + (slot - bw) / 2, hp = ph * (y.principal + y.extra) / maxBar, hi = ph * y.interest / maxBar;
    c.globalAlpha = hoverIdx >= 0 && hoverIdx !== i ? .45 : 1;
    c.fillStyle = col.p; c.fillRect(x, top + ph - hp, bw, hp);
    c.fillStyle = col.i; c.fillRect(x, top + ph - hp - hi, bw, hi);
  });
  c.globalAlpha = 1;
  c.strokeStyle = col.b; c.lineWidth = 2; c.beginPath();
  c.moveTo(left, top + ph - ph * R.v.P / maxBal);
  years.forEach((y, i) => c.lineTo(left + slot * (i + 1), top + ph - ph * y.balance / maxBal));
  c.stroke();
  c.fillStyle = col.muted; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const step = [1, 2, 5, 10].find(k => slot * k >= 34) || 10;
  years.forEach((y, i) => { if ((y.y % step === 0 && slot * (i + 1) > 24) || (y.y === 1 && step > 1 && slot * (step - 1) >= 34) || (step === 1)) c.fillText(y.y + (i === n - 1 || (step > 1 && y.y + step > n) ? ' 年' : ''), left + slot * i + slot / 2, H - 6); });
  layout = { left, slot, n, W };
}
function showTip(clientX) {
  if (!layout) return;
  const rect = $('#chart').getBoundingClientRect(), x = clientX - rect.left;
  const i = Math.max(0, Math.min(layout.n - 1, Math.floor((x - layout.left) / layout.slot)));
  if (i !== hoverIdx) { hoverIdx = i; drawChart(); }
  const y = years[i], tip = $('#tip');
  tip.innerHTML = '<b>第 ' + y.y + ' 年</b>（第 ' + y.from + '–' + y.to + ' 期）<br>本金 ' + fmt(y.principal + y.extra) + '<br>利息 ' + fmt(y.interest) + '<br>年底剩餘 ' + fmt(y.balance);
  tip.hidden = false;
  const cx = layout.left + layout.slot * (i + .5), tw = tip.offsetWidth;
  tip.style.left = Math.max(tw / 2, Math.min(layout.W - tw / 2, cx)) + 'px';
}
function hideTip() { $('#tip').hidden = true; if (hoverIdx !== -1) { hoverIdx = -1; drawChart(); } }
const cw = $('#chart-wrap');
cw.addEventListener('pointerdown', e => { showTip(e.clientX); });
cw.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) showTip(e.clientX); });
cw.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
cw.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(hideTip, 1600); });
if ('ResizeObserver' in window) new ResizeObserver(() => drawChart()).observe(cw); else addEventListener('resize', drawChart);

/* ---------- 攤還表 ---------- */
function renderTable() {
  const head = $('#thead'), body = $('#tbody');
  if (!R || R.error) { head.innerHTML = ''; body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;font-family:var(--sans)">修正輸入後顯示</td></tr>'; return; }
  const frag = document.createDocumentFragment();
  if (view === 'year') {
    head.innerHTML = '<tr><th>年度</th><th>繳款合計</th><th>本金</th><th>利息</th><th>年底餘額</th></tr>';
    years.forEach(y => { const tr = document.createElement('tr'); if (y.extra) tr.className = 'extra'; tr.innerHTML = '<td>' + y.y + '</td><td>' + fmt(y.payment + y.extra) + '</td><td class="p">' + fmt(y.principal + y.extra) + '</td><td class="i">' + fmt(y.interest) + '</td><td>' + fmt(y.balance) + '</td>'; frag.appendChild(tr); });
  } else {
    head.innerHTML = '<tr><th>期數</th><th>月付</th><th>本金</th><th>利息</th><th>剩餘本金</th></tr>';
    R.schedule.forEach(s => { const tr = document.createElement('tr'); tr.className = s.grace ? 'grace' : s.extra ? 'extra' : ''; tr.innerHTML = '<td>' + s.n + '</td><td>' + fmt(s.payment + s.extra) + '</td><td class="p">' + fmt(s.principal + s.extra) + '</td><td class="i">' + fmt(s.interest) + '</td><td>' + fmt(s.balance) + '</td>'; frag.appendChild(tr); });
  }
  body.replaceChildren(frag);
}

/* ---------- 比較 ---------- */
function renderCompare() {
  const card = $('#cmp-card'); card.hidden = !scenarios.length; if (!scenarios.length) return;
  const rs = scenarios.map(s => compute(s.inputs));
  const ok = rs.filter(r => !r.error), minI = ok.length ? Math.min(...ok.map(r => r.summary.totalInterest)) : 0, multi = ok.length > 1;
  const cell = (r, f) => r.error ? '<td>—</td>' : '<td class="n">' + f(r) + '</td>';
  let h = '<thead><tr><th></th>' + scenarios.map((s, i) => '<th>方案 ' + 'ABC'[i] + '<br><button type="button" class="rm" data-rm-scn="' + i + '" aria-label="移除方案 ' + 'ABC'[i] + '">移除</button></th>').join('') + '</tr></thead><tbody>';
  const row = (lab, f) => '<tr><td>' + lab + '</td>' + rs.map(r => cell(r, f)).join('') + '</tr>';
  h += row('金額', r => wanStr(r.v.P)) + row('利率', r => r.v.rate + '%' + (r.v.segs.length ? '＊' : '')) + row('年限', r => r.v.n / 12 + ' 年' + (r.v.g ? '（寬限 ' + r.v.g / 12 + '）' : '')) +
    row('方式', r => r.v.method === 'equal' ? '本息' : '本金') + row('首期月付', r => fmt(r.summary.first)) + row('總還款', r => fmt(r.summary.totalPaid));
  h += '<tr><td>總利息</td>' + rs.map(r => r.error ? '<td>—</td>' : '<td class="n' + (multi && r.summary.totalInterest === minI ? ' best' : '') + '">' + fmt(r.summary.totalInterest) + (multi && r.summary.totalInterest > minI ? '<span class="diff">多 ' + fmt(r.summary.totalInterest - minI) + '</span>' : '') + '</td>').join('') + '</tr></tbody>';
  $('#cmp-table').innerHTML = h;
}

/* ---------- CSV ---------- */
let DL = null;
function csv() {
  const lines = ['期數,月付,本金,利息,提前還款,剩餘本金,年利率%'];
  R.schedule.forEach(s => lines.push([s.n, s.payment, s.principal, s.interest, s.extra, s.balance, s.rate].join(',')));
  return '﻿' + lines.join('\r\n') + '\r\n';
}

/* ---------- 主流程 ---------- */
function recalc() {
  R = compute(S); years = yearly(); hoverIdx = -1; $('#tip').hidden = true;
  renderSummary(); drawChart(); renderTable(); renderCompare();
}
const onField = (id, key, num) => $('#' + id).addEventListener('input', e => { S[key] = num ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value; recalc(); save(); });
onField('amount', 'amount'); onField('rate', 'rate'); onField('years', 'years', true); onField('grace', 'grace', true);
document.querySelectorAll('[id^="method-"]').forEach(b => b.addEventListener('click', () => { S.method = b.dataset.v; syncInputs(); recalc(); save(); }));
document.querySelectorAll('[id^="pre-mode-"]').forEach(b => b.addEventListener('click', () => { S.preMode = b.dataset.v; syncInputs(); recalc(); save(); }));
document.querySelectorAll('[id^="view-"]').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; syncInputs(); renderTable(); save(); }));
$('#adv-box').addEventListener('input', e => {
  const t = e.target; if (!t.dataset.kind) return;
  const list = t.dataset.kind === 'seg' ? S.segments : S.prepays; list[+t.dataset.i][t.dataset.k] = t.value; recalc(); save();
});
$('#adv-box').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]'); if (!rm) return;
  (rm.dataset.rm === 'seg' ? S.segments : S.prepays).splice(+rm.dataset.i, 1); renderRows(); recalc(); save();
});
$('#seg-add').addEventListener('click', () => { const n = (Number(S.years) || 30) * 12; S.segments.push({ from: Math.min(13, n), rate: '' }); renderRows(); recalc(); save(); $('#seg-rate-' + (S.segments.length - 1)).focus(); });
$('#pre-add').addEventListener('click', () => { S.prepays.push({ n: Math.min(60, (Number(S.years) || 30) * 12), wan: '' }); renderRows(); recalc(); save(); $('#pre-wan-' + (S.prepays.length - 1)).focus(); });
document.addEventListener('click', async e => {
  if (e.target.closest('#cmp-save')) {
    if (R.error) return;
    if (scenarios.length >= 3) { toast('最多比較 3 組，請先移除一組'); return; }
    scenarios.push({ inputs: JSON.parse(JSON.stringify(S)) }); renderCompare(); save(); toast('已加入方案 ' + 'ABC'[scenarios.length - 1]);
    return;
  }
  const rm = e.target.closest('[data-rm-scn]');
  if (rm) { scenarios.splice(+rm.dataset.rmScn, 1); renderCompare(); save(); return; }
  if (e.target.closest('#copy-sum')) {
    const s = R.summary, v = R.v;
    copyText('貸款 ' + wanStr(v.P) + '，年利率 ' + v.rate + '%，' + v.n / 12 + ' 年' + (v.g ? '（寬限 ' + v.g / 12 + ' 年）' : '') + '，' + (v.method === 'equal' ? '本息平均攤還' : '本金平均攤還') + '：首期月付 ' + yuan(s.first) + '，總利息 ' + yuan(s.totalInterest) + '，總還款 ' + yuan(s.totalPaid), '摘要');
    return;
  }
  if (e.target.closest('#csv-btn')) {
    if (R.error) return;
    const data = csv();
    if (DL) {
      try { await DL.save({ filename: 'loan-schedule-' + Math.round(R.v.P / 10000) + 'wan-' + R.v.rate + 'pct.csv', data }); toast('已匯出 CSV'); }
      catch (err) { if (!/declin|cancel|abort/i.test(String(err && (err.name + err.message)))) toast('匯出失敗，改用「複製 CSV」'); }
    } else copyText(data.replace('﻿', ''), ' CSV（可貼到試算表）');
  }
});
syncInputs(); recalc();
(async () => { try { DL = (await window.claude?.use?.('downloads')) || null; } catch (e) { DL = null; } if (DL) { const b = $('#csv-btn'); if (b) b.textContent = '匯出 CSV'; } })();
window.__loanCalc = { compute };
})();
</script>
