<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>玉珠孤棋</title>
<style>
:root{
  --bg:#2a150d; --ink:#f4ead8; --ink2:#c9b49a; --card:#2c1a11f4; --card2:#3b261a; --line:#5a3a28; --chip:#1a0c06aa;
  --accent:#43b47f; --accentD:#23784f; --gold:#efc35c; --goldD:#a8822c; --danger:#e58a6c; --sh:0 10px 30px #0009;
  --tile:#3a2418; --tileD:#22130b; --tileLock:#2a1a12; --ov:#1a0c06b8;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"]{
  --bg:#efe2bd; --ink:#2d2a1e; --ink2:#6e6347; --card:#fffaeef4; --card2:#f3e8cc; --line:#dccb9f; --chip:#fff8e6cc;
  --accent:#2f7353; --accentD:#1d4f37; --gold:#b98a2c; --goldD:#8a6418; --danger:#b5543c; --sh:0 10px 30px #6b5a2a33;
  --tile:#fffaee; --tileD:#d9c79a; --tileLock:#ece0bf; --ov:#e9dcb5c4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;min-height:44px;box-shadow:var(--sh);padding:4px 12px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.l1,.l2{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.l1 b{font-size:16px}
.diff{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.diff b{color:var(--ink);font-size:13px}
.pips{display:flex;gap:2px}.pips i{width:4px;height:10px;border-radius:2px;background:var(--line)}
.l2{font-size:12px;color:var(--ink2)}.l2 b{color:var(--ink);font-size:13px}
.l2 .gb{color:var(--gold)}
.goal{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 60px);z-index:4;background:var(--chip);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 24px)}
.goal .tg{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accentD);color:#fff}
.goal .gr{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 6px var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
.pill{height:52px;min-width:96px;padding:0 16px;border-radius:26px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:16px;position:relative}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.4}
.pill .bd{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#2a1a0a;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pill.flash{animation:flash .9s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--danger),var(--sh)}}
.deadtag{position:fixed;left:50%;transform:translateX(-50%);z-index:4;font-size:12px;color:var(--danger);background:var(--chip);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
body.land .bar{left:auto;top:calc(var(--sat) + 62px);bottom:auto;right:0;flex-direction:column;width:auto;padding:0 calc(var(--sar) + 10px) 0 0;gap:8px}
body.land .pill{height:48px;min-width:112px}
body.land .goal{left:auto;right:calc(var(--sar) + 10px);transform:none;top:auto;bottom:calc(var(--sab) + 10px);max-width:200px;white-space:normal;flex-wrap:wrap;justify-content:center;border-radius:16px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;color:#fff;
  background:linear-gradient(180deg,var(--accent),var(--accentD));box-shadow:0 4px 0 #0005,0 8px 16px #0003}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:linear-gradient(180deg,#f3cf70,#c99a35);color:#3a2408}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;font-size:15px}
.stars{font-size:42px;letter-spacing:6px;margin:4px 0;color:var(--line)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 var(--goldD);display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;margin:4px 0;padding:4px 12px;border-radius:999px;background:linear-gradient(180deg,#f6d57a,#c99a35);color:#3a2408;font-weight:800;font-size:13px;animation:pop .5s .5s both}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start;padding:0}
.ttl{position:absolute;left:0;right:0;top:calc(var(--sat) + 6vh);text-align:center}
.ttl h1{font-size:50px;margin:0;letter-spacing:8px;color:var(--ink);text-shadow:0 3px 0 #0006,0 0 24px #43b47f55;font-weight:900}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:6px;font-size:15px;letter-spacing:2px}
.tbtns{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 18px);display:flex;flex-direction:column;align-items:center;padding:0 24px}
.tbtns .btn{max-width:320px}
.tbtns .row3{display:flex;gap:8px;width:100%;max-width:320px}.row3 .btn{flex:1;font-size:15px}
body.land .ttl{top:calc(var(--sat) + 14px);left:calc(var(--sal) + 20px);right:auto;width:44%;text-align:left}
body.land .ttl h1{font-size:40px}
body.land .tbtns{left:auto;right:calc(var(--sar) + 16px);top:calc(var(--sat) + 12px);bottom:calc(var(--sab) + 12px);justify-content:center;width:min(46vw,340px);padding:0}
body.land .tbtns .btn{min-height:44px;margin-top:7px}
#select{align-items:stretch;padding:0;background:var(--bg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px calc(var(--sar) + 12px) calc(var(--sab) + 20px) calc(var(--sal) + 12px);display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;align-content:start;touch-action:pan-y}
.chap{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--gold);padding:8px 2px 0;letter-spacing:1px}
.lt{border-radius:14px;background:var(--tile);box-shadow:0 3px 0 var(--tileD);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;padding:6px 4px 7px}
.lt .n{position:absolute;left:7px;top:4px;font-size:14px;font-weight:800}
.lt .tg{position:absolute;right:5px;top:4px;font-size:11px;font-weight:800;color:var(--gold)}
.lt canvas{width:50px;height:50px;margin-top:12px}
.lt .st{font-size:12px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:76%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:2px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--tileLock);opacity:.6}
.lt.gold::after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 106px);transform:translateX(-50%);z-index:30;background:#120804ee;color:#f4ead8;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:14px;padding:10px}
.mech canvas{flex:none;width:64px;height:64px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.scroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.setrow{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.setrow .sw{padding:0}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.stat{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}.stat b{color:var(--gold)}
.ccard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;margin-top:10px;background:var(--card2);border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--line)}
.ccard canvas{width:64px;height:64px;flex:none}.ccard b{font-size:16px}.ccard span{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.ccard:active{transform:scale(.97)}
.rbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);z-index:6;display:flex;gap:10px;align-items:center;background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--sh);font-weight:700;white-space:nowrap}
.rbar .btn{width:auto;margin:0;min-height:44px;padding:0 16px;font-size:15px}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}.lt:hover{filter:brightness(1.06)}.pill:hover,.ibtn:hover{filter:brightness(1.1)}}
@media (max-height:600px){.ov{align-items:flex-start;overflow-y:auto}.card{padding:16px}.card h2{font-size:21px}}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div class="l1"><b id="hLv">第 1 關</b><span class="diff" id="hDiffW">難度 <b id="hD">1.0</b><span class="pips" id="hPips"></span></span></div>
    <div class="l2"><span>剩 <b id="hPegs">0</b> 顆</span><span>手數 <b id="hHands">0</b><span id="hParW">／目標 <span id="hPar">0</span></span></span><span>悔棋 <b id="hUndo">0</b></span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg class="i" viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>
<div class="goal hidden" id="goal"></div>
<div class="deadtag hidden" id="dead">此局已無解・可悔棋</div>
<div class="bar hidden" id="bar">
  <button class="pill" id="bUndo" aria-label="悔棋"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="pill" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示<span class="bd" id="hintN">3</span></button>
  <button class="pill" id="bRestart" aria-label="重來"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
</div>
<div class="rbar hidden" id="rbar"><span id="rTxt">解答回放</span><button class="btn sec" id="rStop">結束回放</button></div>

<div class="ov" id="title">
  <div class="ttl" id="ttl"><h1>玉珠孤棋</h1><div class="sub">玉珠互跳・最後只留一顆</div></div>
  <div class="tbtns" id="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row3"><button class="btn sec" id="tDaily">每日盤</button><button class="btn sec" id="tClassic">經典模式</button></div>
    <div class="row3"><button class="btn sec" id="tHelp">玩法</button><button class="btn sec" id="tStats">統計</button><button class="btn sec" id="tSet">設定</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2 id="pTitle">暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pSet">設定</button></div>
  <div class="row2"><button class="btn sec" id="pHelp">玩法</button><button class="btn sec" id="pSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">過關！</h2>
  <div class="stars" id="wStars"></div>
  <div id="wBadge"></div>
  <div class="res" id="wRes"></div>
  <p id="wMsg"></p>
  <button class="btn gold" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wReplay">觀看解答</button><button class="btn sec" id="wShare">分享成績</button></div>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2 id="fTitle">無路可走</h2>
  <p id="fMsg"></p>
  <div class="row2"><button class="btn" id="fUndo">悔棋一步</button><button class="btn sec" id="fRestart">重來</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機制</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="setrow"><span>音效</span><button class="sw" role="switch" data-k="snd" aria-label="音效"><span class="trk"></span></button></div>
  <div class="setrow"><span>震動</span><button class="sw" role="switch" data-k="vib" aria-label="震動"><span class="trk"></span></button></div>
  <div class="setrow"><span>單擊自動跳（只有一步可走時）</span><button class="sw" role="switch" data-k="auto" aria-label="單擊自動跳"><span class="trk"></span></button></div>
  <div class="setrow"><span>死局預警（盤邊變暗）</span><button class="sw" role="switch" data-k="dead" aria-label="死局預警"><span class="trk"></span></button></div>
  <div class="setrow" style="border:0"><span>主題</span><div class="seg" id="themeSeg"><button data-t="auto">自動</button><button data-t="light">竹蓆</button><button data-t="dark">檀木</button></div></div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>統計</h2>
  <div id="statBody" style="text-align:left"></div>
  <button class="btn" id="stOk">關閉</button>
</div></div>

<div class="ov hidden" id="classic"><div class="card">
  <h2>經典模式</h2>

    if (k === 'Escape') { if (status === 'play') { if (sel >= 0) select(-1); else openPause(); } return; }
  } else if (status === 'won' && (k === 'Enter' || k === ' ') && mode === 'level' && levelN < NL) { e.preventDefault(); startLevel(levelN + 1); }
  else if (status === 'paused' && k === 'Escape') resume();
  else if (status === 'replay' && k === 'Escape') stopReplay();
});

/* ---------------- UI ---------------- */
var OVS = ['title', 'select', 'pause', 'win', 'fail', 'help', 'intro', 'settings', 'stats', 'classic'];
function showOnly(id) { OVS.forEach(function (o) { $(o).classList.toggle('hidden', o !== id); }); }
var toastTimer = 0;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.opacity = 0; toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 400); }, 2000); }
function hideGameUi() { ['hud', 'bar', 'goal', 'rbar', 'dead'].forEach(function (id) { $(id).classList.add('hidden'); }); }
var pauseReturn = 'play';
function openPause() {
  if (status !== 'play') return; finishAnim(); status = 'paused'; drag = null; ptr = null;
  $('pInfo').textContent = mode === 'level' ? '第 ' + levelN + ' 關・難度 ' + dShow(P.D).toFixed(1) + '・' + goalText() : mode === 'daily' ? '每日盤・' + goalText() : '經典模式';
  $('pSelect').textContent = mode === 'level' ? '關卡選擇' : '主選單';
  showOnly('pause');
}
function resume() { status = 'play'; showOnly(null); }
function goSelect() {
  finishAnim(); status = 'select'; hideGameUi(); buildGrid(); showOnly('select');
  var cur = document.querySelector('.lt.cur'); if (cur) { try { cur.scrollIntoView({ block: 'center' }); } catch (e) {} }
}
function goTitle() { status = 'title'; hideGameUi(); showOnly('title'); startDemo(); layout(); }
function isDone(n) { return !!prog[n]; }
function unlocked(n) { return unlockAll || n === 1 || isDone(n - 1) || isDone(n); }
function highestUnlocked() { for (var n = 1; n <= NL; n++) { if (!isDone(n)) return unlocked(n) ? n : Math.max(1, n - 1); } return NL; }
function thumb(cnv, v, size) {
  var g = cnv.getContext('2d'), B = v.B, minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, i;
  for (i = 0; i < B.N; i++) { minx = Math.min(minx, B.xy[i][0]); maxx = Math.max(maxx, B.xy[i][0]); miny = Math.min(miny, B.xy[i][1]); maxy = Math.max(maxy, B.xy[i][1]); }
  var sc = size / (Math.max(maxx - minx, maxy - miny) + 1.2), ox = (size - (maxx - minx) * sc) / 2, oy = (size - (maxy - miny) * sc) / 2;
  g.clearRect(0, 0, size, size);
  var goal = v.goal === 'a' ? [] : v.goalCells;
  for (i = 0; i < B.N; i++) {
    var x = ox + (B.xy[i][0] - minx) * sc, y = oy + (B.xy[i][1] - miny) * sc;
    g.beginPath(); g.arc(x, y, sc * 0.38, 0, 6.283);
    g.fillStyle = B.rock[i] ? '#8d877c' : bit(v.s, i) ? pal.peg[v.L ? Math.floor((v.L - 1) / 10) % 2 : 0][1] : (theme === 'dark' ? '#140804' : '#a88f5a'); g.fill();
    if (goal.indexOf(i) >= 0) { g.strokeStyle = pal.gold; g.lineWidth = Math.max(1.5, sc * 0.14); g.stroke(); }
  }
}
var CHAP = { 1: '入門・小盤', 15: '英式十字', 30: '金框終點', 40: '六方向盤', 55: '經典全盤', 60: '圖案終局', 70: '斜跳變體', 85: '石頭障礙', 100: '最終關' };
var LOCK = '<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;margin-top:22px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
function buildGrid() {
  var g = $('grid'), done = 0, stars = 0, golds = 0, hu = highestUnlocked();
  g.innerHTML = '';
  for (var n = 1; n <= NL; n++) {
    if (CHAP[n]) { var ch = document.createElement('div'); ch.className = 'chap'; ch.textContent = '第 ' + n + ' 關起・' + CHAP[n]; g.appendChild(ch); }
    var e = LEVELS[n - 1], p = prog[n]; if (p) { done++; stars += p.s; if (p.g) golds++; }
    var lk = !unlocked(n), b = document.createElement('button');
    b.className = 'lt' + (lk ? ' lock' : '') + (n === hu && !p ? ' cur' : '') + (p && p.g ? ' gold' : '');
    b.dataset.n = n;
    var d = dShow(e[9] / 1000), tag = e[2] ? '斜' : (SHAPES[e[1]][0] !== 'sq' ? '六' : e[3] ? '石' : e[4] === 'p' ? '圖' : e[4] === 'c' ? '金' : '');
    var st = ''; for (var i = 0; i < 3; i++) st += '<span class="' + (p && i < p.s ? 'on' : '') + '">★</span>';
    b.setAttribute('aria-label', '第 ' + n + ' 關，難度 ' + d.toFixed(1) + (lk ? '（未解鎖）' : ''));
    b.innerHTML = '<span class="n">' + n + '</span>' + (tag ? '<span class="tg">' + tag + '</span>' : '') + (lk ? LOCK : '<canvas width="100" height="100"></canvas>') +
      '<span class="st">' + st + '</span><span class="db"><i style="width:' + (d * 10) + '%;background:' + dColor(d) + '"></i></span><span class="dn">難度 ' + d.toFixed(1) + '</span>';
    g.appendChild(b);
    if (!lk) thumb(b.querySelector('canvas'), lvl(n), 100);
  }
  $('selSum').textContent = '已完成 ' + done + ' / ' + NL + ' 關・★ ' + stars + ' / ' + (NL * 3) + '・金色徽章 ' + golds;
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
$('grid').addEventListener('click', function (e) {
  var b = e.target.closest('.lt'); if (!b) return; var n = +b.dataset.n; audio();
  if (!unlocked(n)) { SFX.back(); if (b.animate) b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); toast('先完成第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
});
$('unlockSw').addEventListener('click', function () { audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
$('sBack').addEventListener('click', function () { SFX.click(); goTitle(); });
$('tPlay').addEventListener('click', function () { audio(); SFX.click(); startLevel(highestUnlocked()); });
$('tSelect').addEventListener('click', function () { audio(); SFX.click(); goSelect(); });
$('tDaily').addEventListener('click', function () { audio(); SFX.click(); startDaily(); });
$('tClassic').addEventListener('click', function () { audio(); SFX.click(); openClassic(); });
var helpReturn = 'title', setReturn = 'title';
$('tHelp').addEventListener('click', function () { audio(); SFX.click(); helpReturn = 'title'; showHelp(); });
$('tStats').addEventListener('click', function () { audio(); SFX.click(); showStats(); });
$('tSet').addEventListener('click', function () { audio(); SFX.click(); setReturn = 'title'; showSettings(); });
$('pHelp').addEventListener('click', function () { SFX.click(); helpReturn = 'pause'; showHelp(); });
$('pSet').addEventListener('click', function () { SFX.click(); setReturn = 'pause'; showSettings(); });
$('hOk').addEventListener('click', function () { SFX.click(); showOnly(helpReturn); });
$('stOk').addEventListener('click', function () { SFX.click(); showOnly('title'); });
$('setOk').addEventListener('click', function () { SFX.click(); showOnly(setReturn); });
$('bMenu').addEventListener('click', function () { audio(); SFX.click(); openPause(); });
$('bMute').addEventListener('click', function () { SET.snd = !SET.snd; sset('settings', SET); setMuteIcon(); audio(); SFX.click(); });
$('bUndo').addEventListener('click', function () { audio(); undo(); });
$('bHint').addEventListener('click', function () { askHint(); });
$('bRestart').addEventListener('click', function () { audio(); restart(); });
$('pResume').addEventListener('click', function () { SFX.click(); resume(); });
$('pRestart').addEventListener('click', function () { status = 'play'; restart(); });
$('pSelect').addEventListener('click', function () { SFX.click(); if (mode === 'level') goSelect(); else goTitle(); });
$('wNext').addEventListener('click', function () { SFX.click(); startLevel(Math.min(NL, levelN + 1)); });
$('wRetry').addEventListener('click', function () { SFX.click(); if (mode === 'level') startLevel(levelN); else if (mode === 'daily') startDaily(); else startClassic(classicWhich); });
$('wSelect').addEventListener('click', function () { SFX.click(); if (mode === 'level') goSelect(); else goTitle(); });
$('wReplay').addEventListener('click', function () { SFX.click(); startReplay(); });
$('rStop').addEventListener('click', function () { SFX.click(); stopReplay(); });
$('wShare').addEventListener('click', function () { SFX.click(); share(); });
$('fUndo').addEventListener('click', function () { undo(); });
$('fRestart').addEventListener('click', function () { status = 'play'; restart(); });
$('iOk').addEventListener('click', function () { audio(); SFX.click(); showOnly(null); status = 'play'; toast(goalText(true)); });
$('cEng').addEventListener('click', function () { SFX.click(); startClassic('eng'); });
$('cEuro').addEventListener('click', function () { SFX.click(); startClassic('euro'); });
$('cBack').addEventListener('click', function () { SFX.click(); showOnly('title'); });
function share() {
  var txt;
  if (mode === 'classic') txt = '玉珠孤棋・經典' + (classicWhich === 'eng' ? '英式 33 孔' : '歐式 37 孔') + '：剩 ' + lastResult.left + ' 顆！';
  else txt = '玉珠孤棋・' + (mode === 'daily' ? '每日盤 ' + dailyKey() : '第 ' + levelN + ' 關') + ' ' + '★★★'.slice(0, lastResult.st) + '☆☆☆'.slice(lastResult.st) + '　手數 ' + hands + '／目標 ' + P.par + (lastResult.gold ? '　◆金色徽章' : '');
  if (navigator.share) { navigator.share({ title: '玉珠孤棋', text: txt }).catch(function () {}); return; }
  try { navigator.clipboard.writeText(txt).then(function () { toast('成績已複製：' + txt); }, function () { toast(txt); }); } catch (e) { toast(txt); }
}
function openClassic() {
  var best = sget('classic', {}) || {};
  $('cEngBest').textContent = best.eng ? '最佳紀錄：剩 ' + best.eng + ' 顆' : '尚未挑戰・中央留空';
  $('cEuroBest').textContent = best.euro ? '最佳紀錄：剩 ' + best.euro + ' 顆' : '尚未挑戰・上緣留空';
  ['eng', 'euro'].forEach(function (w) {
    var B = makeBoard(w), s = [0, 0], hole = w === 'eng' ? B.idx['3,3'] : B.idx['0,4']; for (var i = 0; i < B.N; i++) if (i !== hole) setBit(s, i, 1);
    thumb($(w === 'eng' ? 'cEng' : 'cEuro').querySelector('canvas'), { B: B, s: s, goal: 'a', goalCells: [], L: 0 }, 128);
  });
  showOnly('classic');
}
function showSettings() {
  document.querySelectorAll('#settings .sw').forEach(function (b) { b.setAttribute('aria-checked', SET[b.dataset.k] ? 'true' : 'false'); });
  document.querySelectorAll('#themeSeg button').forEach(function (b) { b.setAttribute('aria-pressed', SET.theme === b.dataset.t ? 'true' : 'false'); });
  showOnly('settings');
}
document.querySelectorAll('#settings .sw').forEach(function (b) {
  b.addEventListener('click', function () { var k = b.dataset.k; SET[k] = !SET[k]; sset('settings', SET); audio(); SFX.click(); setMuteIcon(); if (k === 'dead' && !SET.dead) setDead(false); showSettings(); });
});
document.querySelectorAll('#themeSeg button').forEach(function (b) {
  b.addEventListener('click', function () { SET.theme = b.dataset.t; sset('settings', SET); applyTheme(); SFX.click(); showSettings(); });
});
function showStats() {
  var done = 0, stars = 0; for (var n = 1; n <= NL; n++) if (prog[n]) { done++; stars += prog[n].s; }
  var rows = [['已通關關卡', done + ' / ' + NL], ['累計星星', stars], ['總過關次數', STATS.clears], ['總移除珠數', STATS.removed], ['平均手數', STATS.clears ? (STATS.hands / STATS.clears).toFixed(1) : '—'],
    ['零悔棋過關', STATS.perfect], ['最長零悔棋連勝', STATS.best], ['金色徽章次數', STATS.gold], ['使用提示', STATS.hints], ['悔棋次數', STATS.undos]];
  $('statBody').innerHTML = rows.map(function (r) { return '<div class="stat"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('');
  showOnly('stats');
}
function mechRow(m) {
  var d = document.createElement('div'); d.className = 'mech';
  var c = document.createElement('canvas'); c.width = c.height = 128; thumb(c, lvl(m.lv), 128); d.appendChild(c);
  var t = document.createElement('div'); t.innerHTML = '<b>' + m.name + '</b>（第 ' + m.lv + ' 關起）<br>' + m.desc; d.appendChild(t); return d;

function showHelp() {
  var b = $('helpBody'); b.innerHTML = '';
  var p = document.createElement('p');
  p.innerHTML = '<b>拖曳</b>珠子越過相鄰的一顆珠子，落到後面的空洞；被跳過的珠子會被移除，收進玉碗。也可以<b>先點珠子、再點發光的落點</b>。<br>' +
    '<b>星星</b>：不悔棋 ★★★、悔棋 3 次內 ★★、其他 ★。<br><b>手數</b>：同一顆珠子連續跳只算一手；手數不超過目標得金色徽章。<br>' +
    '<b>提示</b>：每關 3 次，會指出一步仍可解的走法。<br>快捷鍵：Ctrl+Z 悔棋・R 重來・H 提示・Esc 暫停';
  b.appendChild(p);

  showOnly('help');
}
function showIntro(m) {

  $('iTitle').textContent = m.key === 'basic' ? '歡迎來到玉珠孤棋' : '新機制：' + m.name;
  var b = $('iBody'); b.innerHTML = ''; b.appendChild(mechRow(m));
  showOnly('intro');
}

/* ---------------- test hook ---------------- */
window.__game = {
  state: function () { return { status: status, mode: mode, level: levelN, pegs: P ? pegCount(S) : 0, hands: hands, undos: undos, animating: !!anim, sel: sel, dead: deadOn }; },
  solution: function (n) { var v = lvl(n); return v.sol.map(function (m) { return [v.B.mv[m][0], v.B.mv[m][2]]; }); },
  legal: function () { return legalMoves(P.B, S).map(function (m) { return [P.B.mv[m][0], P.B.mv[m][2]]; }); },
  cellXY: function (i) { var p = cell(i); return { x: p.x, y: p.y, s: R.s }; },
  levelInfo: function (n) { var v = lvl(n); return { shape: v.shape, diag: v.diag, goal: v.goal, pegs: v.n, D: v.D, shown: dShow(v.D), hands: v.hands }; },
  startLevel: function (n) { startLevel(n); if (status === 'paused') { showOnly(null); status = 'play'; } }
};

applyTheme(); setMuteIcon(); startDemo(); layout(); startLoop();
})();
