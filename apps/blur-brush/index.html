<title>馬賽克與模糊</title>
<style>
:root{
  --bg:#e3e4e7; --surface:#f6f6f7; --surface-2:#ffffff; --ink:#1b1c20; --ink-2:#464953; --muted:#60636c; --line:#c6c8ce; --line-2:#d9dadf;
  --accent:#a85800; --accent-ink:#ffffff; --accent-soft:#f5e4cc; --stage:#2b2d33; --stage-b:#33363d; --stage-ink:#d9dbe0;
  --shade:rgba(10,11,14,.6); --warn:#8a5200;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131417; --surface:#1b1d21; --surface-2:#23252a; --ink:#e8e9ec; --ink-2:#b7bac2; --muted:#8b8f98; --line:#33363d; --line-2:#2a2d33;
  --accent:#f0a540; --accent-ink:#231400; --accent-soft:#3a2a12; --stage:#0b0c0e; --stage-b:#141518; --stage-ink:#c9ccd3;
  --shade:rgba(0,0,0,.72); --warn:#f0b75e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131417; --surface:#1b1d21; --surface-2:#23252a; --ink:#e8e9ec; --ink-2:#b7bac2; --muted:#8b8f98; --line:#33363d; --line-2:#2a2d33;
  --accent:#f0a540; --accent-ink:#231400; --accent-soft:#3a2a12; --stage:#0b0c0e; --stage-b:#141518; --stage-ink:#c9ccd3;
  --shade:rgba(0,0,0,.72); --warn:#f0b75e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "tools" "fx";
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px;max-width:1400px;margin:0 auto}
.top{grid-area:top;display:flex;align-items:center;gap:6px;min-height:44px}
.top h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:750;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 .bar{display:inline-block;width:22px;height:10px;margin-right:8px;vertical-align:1px;background:repeating-linear-gradient(90deg,var(--ink) 0 5px,var(--accent) 5px 10px,var(--ink-2) 10px 15px,var(--muted) 15px 22px)}
.btn{min-height:44px;min-width:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.icon{padding:0}
.stage{grid-area:stage;position:relative;border-radius:6px;overflow:hidden;background-color:var(--stage);
  background-image:linear-gradient(45deg,var(--stage-b) 25%,transparent 25%,transparent 75%,var(--stage-b) 75%),linear-gradient(45deg,var(--stage-b) 25%,transparent 25%,transparent 75%,var(--stage-b) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage .chip{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip span{background:var(--shade);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px}
.chip .warnc{background:var(--accent);color:var(--accent-ink)}
.empty{position:absolute;inset:0;display:grid;place-items:center}
.empty .btn{min-height:64px;padding:0 28px;font-size:17px}
.zoomtag{position:absolute;right:8px;bottom:8px;font:12px var(--mono);color:var(--stage-ink);background:var(--shade);padding:2px 6px;border-radius:4px;pointer-events:none}
.tools{grid-area:tools;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.tool{min-height:48px;border:0;border-radius:5px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2)}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface-2)}
.fx{grid-area:fx;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface-2);cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.sl{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;align-items:center;gap:8px}
.sl label{font-size:13px;color:var(--ink-2)}
.sl output{font:12.5px var(--mono);text-align:right}
input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--accent);cursor:pointer;background:transparent}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--surface-2);cursor:pointer}
.acts{display:flex;gap:8px;margin-top:4px}
.acts .btn{flex:1}
.note{font-size:12px;color:var(--warn);min-height:0}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.ov{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{background:var(--surface);border-radius:8px;max-width:640px;width:100%;max-height:calc(100% - 16px);overflow:auto;padding:14px}
.ov h3{margin:0 0 6px;font-size:16px}.ov p{font-size:13.5px;color:var(--ink-2);margin:6px 0}
.ov img{max-width:100%;display:block;margin:8px auto;border:1px solid var(--line)}
@media (max-height:600px){.ov{align-items:flex-start;overflow:auto}}
#fileIn{display:none}
.lbl-s{display:inline}
@media (max-width:420px){.lbl-s{display:none}}
/* landscape phones */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "stage tools" "stage fx"}
  .fx{overflow:auto}
  .tool{min-height:44px}
  .lbl-s{display:inline}
}
/* desktop */
@media (min-width:900px) and (min-height:561px){
  .app{grid-template-columns:72px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "tools stage fx";padding-block:12px}
  .tools{grid-template-columns:1fr;align-content:start}
  .tool{min-height:60px}
  .fx{align-self:start;gap:6px}
}
@media (hover:hover){ .btn:not(:disabled):hover{border-color:var(--ink-2)} .tool:not([aria-pressed="true"]):hover{background:var(--line-2)} .seg button:not([aria-pressed="true"]):hover{background:var(--line-2)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1><span class="bar" aria-hidden="true"></span>馬賽克與模糊</h1>
    <button class="btn" type="button" id="openBtn" aria-label="開啟圖片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span class="lbl-s">開啟</span></button>
    <button class="btn icon" type="button" id="undoBtn" aria-label="復原" title="復原（Ctrl+Z）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn icon" type="button" id="redoBtn" aria-label="重做" title="重做（Ctrl+Shift+Z）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn primary" type="button" id="exportBtn">匯出</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="編輯畫布：用手指塗抹要遮住的地方"></canvas>
    <div class="chip" id="chips"></div>
    <div class="empty" id="empty" hidden><button class="btn primary" type="button" id="bigOpen">開啟圖片</button></div>
    <span class="zoomtag" id="zoomTag"></span>
  </div>

  <div class="tools" role="group" aria-label="工具">
    <button class="tool" type="button" id="tBrush" data-mode="brush" aria-pressed="true" title="筆刷（B）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c3 0 5-1 5-4l9-11 2 2-11 9c0 3-2 4-5 4Z"/></svg>筆刷</button>
    <button class="tool" type="button" id="tRect" data-mode="rect" aria-pressed="false" title="方框（R）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12"/></svg>方框</button>
    <button class="tool" type="button" id="tErase" data-mode="erase" aria-pressed="false" title="橡皮擦（E）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 20-4-4L14 6l6 6-8 8Z"/><path d="M8 20h12"/></svg>橡皮擦</button>
    <button class="tool" type="button" id="tHand" data-mode="hand" aria-pressed="false" title="平移縮放（H）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12V5a1.5 1.5 0 0 1 3 0v6V4a1.5 1.5 0 0 1 3 0v7V6a1.5 1.5 0 0 1 3 0v8c0 4-3 7-6 7-2 0-3.5-1-5-3l-3-4a1.5 1.5 0 0 1 2.5-1.7L8 14"/></svg>平移</button>
  </div>

  <section class="fx" aria-label="效果設定">
    <div class="seg" role="group" aria-label="效果">
      <button type="button" id="eMosaic" data-eff="mosaic" aria-pressed="true">馬賽克</button>
      <button type="button" id="eBlur" data-eff="blur" aria-pressed="false">模糊</button>
      <button type="button" id="eSolid" data-eff="solid" aria-pressed="false">純色塗黑</button>
    </div>
    <div class="sl" id="strRow"><label for="strength" id="strLabel">格子大小</label><input type="range" id="strength" min="4" max="64" step="1"><output id="strO"></output></div>
    <div class="sl" id="colRow" hidden><label for="solidColor">塗色</label><input type="color" id="solidColor"><span></span></div>
    <div class="sl"><label for="brush">筆刷大小</label><input type="range" id="brush" min="10" max="120" step="1"><output id="brushO"></output></div>
    <div class="note" id="note" hidden></div>
    <div class="acts">
      <button class="btn" type="button" id="holdBtn" title="按住顯示原圖">按住看原圖</button>
      <button class="btn" type="button" id="applyBtn" title="把目前效果合併進圖片，之後可換別種效果繼續遮">套用並繼續</button>
    </div>
  </section>
</div>
<input type="file" id="fileIn" accept="image/*">
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="card"><h3 id="ovTitle"></h3><div id="ovBody"></div><div class="acts"><button class="btn" type="button" id="ovClose">關閉</button></div></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const P='blur-brush:v1:';
const store={get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));}catch(e){}}};
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}
const SANS='system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const DEF={eff:'mosaic',mosaic:16,blur:16,color:'#111111',brush:40};
let S=Object.assign({},DEF,store.get('settings',{}));
let mode='brush';
const LIM_SIDE=8192, LIM_AREA=16777216;

/* ---------- layers ---------- */
let img=null; // {w,h,name,type,sample}
let base,effect,mask,comp,bx,ex,mx,cx;
const tmp=document.createElement('canvas'), tx_=tmp.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function minCell(){ return Math.max(8,Math.ceil(Math.min(img.w,img.h)*0.012)); }
function effCell(){ return Math.max(S.mosaic,minCell()); }
function blurR(){ return S.blur*Math.max(1,Math.min(img.w,img.h)/800); }
let filterOK=null;
function testFilter(){ try{ const c=mk(20,20),x=c.getContext('2d'); if(!('filter' in x)) return false; x.filter='blur(3px)'; x.fillStyle='#000'; x.fillRect(9,9,2,2); return x.getImageData(4,10,1,1).data[3]>0; }catch(e){return false;} }
function avgColor(src){ const c=mk(1,1),x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,1,1); const d=x.getImageData(0,0,1,1).data; return 'rgb('+d[0]+','+d[1]+','+d[2]+')'; }
function boxBlur(d,w,h,r){ // 3-pass box blur, RGBA, clamped edges
  const tmpA=new Uint8ClampedArray(d.length);
  const pass=(src,dst,horiz)=>{ const len=horiz?w:h, lines=horiz?h:w, div=2*r+1;
    for(let l=0;l<lines;l++){ for(let ch=0;ch<4;ch++){ let acc=0; const idx=i=>{ i=i<0?0:i>=len?len-1:i; return horiz?((l*w+i)*4+ch):((i*w+l)*4+ch); };
      for(let i=-r;i<=r;i++) acc+=src[idx(i)];
      for(let i=0;i<len;i++){ dst[idx(i)]=acc/div; acc+=src[idx(i+r+1)]-src[idx(i-r)]; } } } };
  for(let k=0;k<3;k++){ pass(d,tmpA,true); pass(tmpA,d,false); }
}
function buildEffect(){
  const W=img.w,H=img.h; ex.save(); ex.globalCompositeOperation='source-over'; ex.filter='none'; ex.clearRect(0,0,W,H);
  if(S.eff==='solid'){ ex.fillStyle=S.color; ex.fillRect(0,0,W,H); }
  else if(S.eff==='mosaic'){
    const cell=effCell(), sw=Math.ceil(W/cell), sh=Math.ceil(H/cell);
    // step-down halving so each block is a real average
    let src=base, cw=W, ch=H;
    while(cw/2>sw*1.5 && ch/2>sh*1.5){ const n=mk(Math.ceil(cw/2),Math.ceil(ch/2)); const nx=n.getContext('2d'); nx.imageSmoothingQuality='high'; nx.drawImage(src,0,0,n.width,n.height); src=n; cw=n.width; ch=n.height; }
    const s=mk(sw,sh),sx=s.getContext('2d'); sx.imageSmoothingEnabled=true; sx.imageSmoothingQuality='high'; sx.drawImage(src,0,0,sw,sh);
    ex.imageSmoothingEnabled=false; ex.drawImage(s,0,0,sw*cell,sh*cell); ex.imageSmoothingEnabled=true;
  } else {
    const R=blurR(), bg=avgColor(base);
    if(filterOK===null) filterOK=testFilter();
    if(filterOK){ ex.filter='blur('+R+'px)'; ex.drawImage(base,0,0); ex.filter='none'; }
    else{ const f=Math.max(1,Math.sqrt(W*H/1e6), R/6), sw=Math.max(1,Math.round(W/f)), sh=Math.max(1,Math.round(H/f));
      const s=mk(sw,sh),sx=s.getContext('2d'); sx.imageSmoothingQuality='high'; sx.drawImage(base,0,0,sw,sh);
      const id=sx.getImageData(0,0,sw,sh); boxBlur(id.data,sw,sh,Math.max(1,Math.round(R/f/1.7))); sx.putImageData(id,0,0);
      ex.imageSmoothingQuality='high'; ex.drawImage(s,0,0,W,H); }
    ex.globalCompositeOperation='destination-over'; ex.fillStyle=bg; ex.fillRect(0,0,W,H);
  }
  ex.restore();
}
function compose(r){
  const W=img.w,H=img.h; r=r||{x:0,y:0,w:W,h:H};
  let x0=Math.max(0,Math.floor(r.x)),y0=Math.max(0,Math.floor(r.y)),x1=Math.min(W,Math.ceil(r.x+r.w)),y1=Math.min(H,Math.ceil(r.y+r.h));
  if(x1<=x0||y1<=y0) return; const w=x1-x0,h=y1-y0;
  if(tmp.width<w||tmp.height<h){ tmp.width=Math.max(tmp.width,w); tmp.height=Math.max(tmp.height,h); }
  cx.clearRect(x0,y0,w,h); cx.drawImage(base,x0,y0,w,h,x0,y0,w,h);
  tx_.globalCompositeOperation='copy'; tx_.drawImage(mask,x0,y0,w,h,0,0,w,h);
  tx_.globalCompositeOperation='source-in'; tx_.drawImage(effect,x0,y0,w,h,0,0,w,h);
  tx_.globalCompositeOperation='source-over'; cx.drawImage(tmp,0,0,w,h,x0,y0,w,h);
}

/* ---------- view ---------- */
const view=$('#view'), vx=view.getContext('2d'); let vs=1,vtx=0,vty=0,dpr=1,showOrig=false,hover=null,rectDraft=null;
function sizeView(){ const r=$('#stage').getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); view.width=Math.max(1,Math.round(r.width*dpr)); view.height=Math.max(1,Math.round(r.height*dpr)); }
function fit(){ if(!img) return; const r=$('#stage').getBoundingClientRect(); vs=Math.min(r.width/img.w,r.height/img.h)*0.96; vtx=(r.width-img.w*vs)/2; vty=(r.height-img.h*vs)/2; render(); }
let rq=0; function render(){ if(rq) return; rq=requestAnimationFrame(()=>{rq=0;paint();}); }
function paint(){
  vx.setTransform(1,0,0,1,0,0); vx.clearRect(0,0,view.width,view.height); if(!img) return;
  vx.setTransform(dpr*vs,0,0,dpr*vs,dpr*vtx,dpr*vty); vx.imageSmoothingEnabled=vs<2; vx.imageSmoothingQuality='high';
  vx.drawImage(showOrig?base:comp,0,0);
  vx.setTransform(dpr,0,0,dpr,0,0);
  vx.strokeStyle='rgba(255,255,255,.35)'; vx.lineWidth=1; vx.strokeRect(vtx-.5,vty-.5,img.w*vs+1,img.h*vs+1);
  if(rectDraft){ const a=toView(rectDraft.a),b=toView(rectDraft.b); vx.setLineDash([6,4]); vx.lineWidth=2; vx.strokeStyle='#fff'; vx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y)); vx.strokeStyle='#000'; vx.lineDashOffset=5; vx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y)); vx.setLineDash([]); vx.lineDashOffset=0; }
  if(hover&&(mode==='brush'||mode==='erase')){ vx.beginPath(); vx.arc(hover.x,hover.y,S.brush/2,0,7); vx.lineWidth=2; vx.strokeStyle='rgba(0,0,0,.6)'; vx.stroke(); vx.lineWidth=1; vx.strokeStyle='#fff'; vx.stroke(); }
  $('#zoomTag').textContent=Math.round(vs*100)+'%';
}
function toImg(p){ return {x:(p.x-vtx)/vs,y:(p.y-vty)/vs}; }
function toView(p){ return {x:p.x*vs+vtx,y:p.y*vs+vty}; }
function zoomAt(f,px,py){ const ns=Math.min(16,Math.max(0.02,vs*f)); f=ns/vs; vtx=px-(px-vtx)*f; vty=py-(py-vty)*f; vs=ns; render(); }

/* ---------- history ---------- */
let hist=[],hi=-1,baseBlob=null,histBusy=Promise.resolve();
const toBlob=(c,t='image/png',q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),t,q));
async function blobToCanvasDraw(blob,ctx){ const b=await createImageBitmap(blob); ctx.save(); ctx.globalCompositeOperation='copy'; ctx.drawImage(b,0,0); ctx.restore(); b.close&&b.close(); }
function pushHist(){ histBusy=histBusy.then(async()=>{ const mb=await toBlob(mask); hist=hist.slice(0,hi+1); hist.push({mask:mb,base:baseBlob,eff:S.eff,mosaic:S.mosaic,blur:S.blur,color:S.color}); if(hist.length>31) hist.shift(); hi=hist.length-1; updHist(); }); return histBusy; }
async function restore(h){
  await blobToCanvasDraw(h.mask,mx);
  if(h.base!==baseBlob){ await blobToCanvasDraw(h.base,bx); baseBlob=h.base; }
  const effChanged=h.eff!==S.eff||h.mosaic!==S.mosaic||h.blur!==S.blur||h.color!==S.color;
  Object.assign(S,{eff:h.eff,mosaic:h.mosaic,blur:h.blur,color:h.color}); syncUI(); buildEffect(); compose(); render();
}
function updHist(){ $('#undoBtn').disabled=!(hi>0); $('#redoBtn').disabled=!(hi<hist.length-1); }
async function undo(){ await histBusy; if(hi<=0) return; hi--; await restore(hist[hi]); updHist(); }
async function redo(){ await histBusy; if(hi>=hist.length-1) return; hi++; await restore(hist[hi]); updHist(); }

/* ---------- open ---------- */
async function openSource(src,w,h,meta){
  let s=1; if(w>LIM_SIDE||h>LIM_SIDE) s=Math.min(s,LIM_SIDE/Math.max(w,h)); if(w*h*s*s>LIM_AREA) s=Math.min(s,Math.sqrt(LIM_AREA/(w*h)));
  const W=Math.max(1,Math.floor(w*s)),H=Math.max(1,Math.floor(h*s));
  img=Object.assign({w:W,h:H,scaled:s<1},meta);
  base=mk(W,H); effect=mk(W,H); mask=mk(W,H); comp=mk(W,H);
  bx=base.getContext('2d'); ex=effect.getContext('2d'); mx=mask.getContext('2d'); cx=comp.getContext('2d');
  bx.imageSmoothingQuality='high'; bx.drawImage(src,0,0,W,H);
  if(meta.premask) meta.premask(mx);
  buildEffect(); compose(); baseBlob=await toBlob(base); hist=[];hi=-1; await pushHist();
  $('#empty').hidden=true; sizeView(); fit(); chips();
  if(img.scaled) toast('圖片過大，已縮小至 '+W+'×'+H+' 以免記憶體不足');
}
async function openFile(f){
  if(!f) return; if(!/^image\//.test(f.type)){ toast('這不是圖片檔'); return; }
  let b; try{ b=await createImageBitmap(f,{imageOrientation:'from-image'}); }
  catch(e){ try{ const u=URL.createObjectURL(f); const im=new Image(); im.src=u; await im.decode(); b=im; setTimeout(()=>URL.revokeObjectURL(u),1000); }catch(e2){ toast('此格式無法解碼，請先轉成 JPG 或 PNG'); return; } }
  await openSource(b,b.width||b.naturalWidth,b.height||b.naturalHeight,{name:f.name.replace(/\.[^.]+$/,'')||'image',type:f.type,sample:false});
}
function sampleShot(){
  const W=750,H=1334,c=mk(W,H),x=c.getContext('2d'),sens=[]; c.sens=sens;
  x.fillStyle='#eef1f4'; x.fillRect(0,0,W,H);
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,150); x.fillStyle='#d8dde3'; x.fillRect(0,150,W,2);
  x.fillStyle='#1f2a36'; x.font='600 36px '+SANS; x.textBaseline='middle'; x.fillText('陳範例',120,96);
  x.fillStyle='#8a96a3'; x.font='400 24px '+SANS; x.fillText('範例截圖・程式產生',W-260,96);
  x.fillStyle='#c7d2dd'; x.beginPath(); x.arc(70,96,32,0,7); x.fill();
  const bubble=(y,lines,me)=>{ x.font='400 30px '+SANS; let w=0; lines.forEach(l=>w=Math.max(w,x.measureText(l).width)); const bw=w+48,bh=lines.length*44+30,bxp=me?W-40-bw:40;
    x.fillStyle=me?'#ffd98a':'#ffffff'; x.beginPath(); x.roundRect?x.roundRect(bxp,y,bw,bh,22):x.rect(bxp,y,bw,bh); x.fill();
    x.fillStyle='#1d2329'; lines.forEach((l,i)=>{ const ly=y+37+i*44; x.fillText(l,bxp+24,ly);
      const m=/^(電話 |範例銀行 )(.+)$/.exec(l); if(m){ const x0=bxp+24+x.measureText(m[1]).width; sens.push({x:x0-6,y:ly-24,w:x.measureText(m[2]).width+12,h:48}); } }); return y+bh+26; };
  let y=200;
  y=bubble(y,['嗨，包裹已經寄出了'],false);
  y=bubble(y,['好的！收件資料給你：','電話 0912-345-678'],true);
  y=bubble(y,['地址：範例市範例路 1 號 9 樓'],true);
  y=bubble(y,['匯款帳號：','範例銀行 012-34567-890123'],false);
  y=bubble(y,['收到，謝謝 🙏'],true);
  x.fillStyle='#ffffff'; x.fillRect(0,H-120,W,120); x.fillStyle='#e3e7ec'; x.beginPath(); x.roundRect?x.roundRect(30,H-92,W-60,64,32):x.rect(30,H-92,W-60,64); x.fill();
  x.fillStyle='#98a2ad'; x.font='400 28px '+SANS; x.fillText('輸入訊息',64,H-60);
  return c;
}
async function loadSample(){
  const c=sampleShot();
  await openSource(c,c.width,c.height,{name:'範例截圖',type:'image/png',sample:true,premask:m=>{ m.fillStyle='#fff'; const a=c.sens[0], b=c.sens[1]; m.fillRect(a.x,a.y,a.w,a.h); m.lineCap='round'; m.lineJoin='round'; m.lineWidth=b.h; m.strokeStyle='#fff'; m.beginPath(); m.moveTo(b.x+b.h/2,b.y+b.h/2+2); m.quadraticCurveTo(b.x+b.w/2,b.y+b.h/2-4,b.x+b.w-b.h/2,b.y+b.h/2+1); m.stroke(); }});
}
function chips(){ const c=$('#chips'); c.innerHTML=''; if(!img) return;
  if(img.sample){ const s=document.createElement('span'); s.textContent='範例圖片：已示範遮住電話與帳號'; c.appendChild(s); }
  if(img.scaled){ const s=document.createElement('span'); s.className='warnc'; s.textContent='已縮小至 '+img.w+'×'+img.h; c.appendChild(s); } }

/* ---------- pointer handling ---------- */
const ptrs=new Map(); let stroke=null, pan=null, pinch=null;
function vpos(e){ const r=view.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function lineW(e){ let w=S.brush/vs; if(e.pointerType==='pen'&&e.pressure>0) w*=0.5+e.pressure; return w; }
function strokeSeg(a,ctrl,b,lw){
  mx.save(); mx.globalCompositeOperation=stroke.erase?'destination-out':'source-over'; mx.strokeStyle='#fff'; mx.lineWidth=lw; mx.lineCap='round'; mx.lineJoin='round';
  mx.beginPath(); mx.moveTo(a.x,a.y); if(ctrl) mx.quadraticCurveTo(ctrl.x,ctrl.y,b.x,b.y); else mx.lineTo(b.x+0.01,b.y); mx.stroke(); mx.restore();
  const pts=[a,b].concat(ctrl?[ctrl]:[]), pad=lw/2+2; const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const r={x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
  compose(r); stroke.dirty=true;
}
function addPoint(p,lw){
  const s=stroke; s.pts.push(p); const n=s.pts.length;
  if(n===1){ strokeSeg(p,null,p,lw); s.lastMid=p; return; }
  const prev=s.pts[n-2], mid={x:(prev.x+p.x)/2,y:(prev.y+p.y)/2};
  strokeSeg(s.lastMid,prev,mid,lw); s.lastMid=mid;
}
async function cancelStroke(){ if(!stroke) return; const had=stroke.dirty; stroke=null; rectDraft=null; if(had&&hist[hi]){ await blobToCanvasDraw(hist[hi].mask,mx); compose(); } render(); }
view.addEventListener('pointerdown',e=>{
  if(!img) return; try{view.setPointerCapture(e.pointerId);}catch(_){} const p=vpos(e); ptrs.set(e.pointerId,p);
  if(ptrs.size===2){ cancelStroke(); pan=null; const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}; return; }
  if(ptrs.size>2) return;
  if(mode==='hand'||e.button===1){ pan={x:p.x,y:p.y}; return; }
  if(e.button>0) return;
  if(mode==='rect'){ stroke={rect:true}; rectDraft={a:toImg(p),b:toImg(p)}; render(); return; }
  stroke={pts:[],erase:mode==='erase',dirty:false}; addPoint(toImg(p),lineW(e)); render();
});
view.addEventListener('pointermove',e=>{
  const p=vpos(e); hover=(e.pointerType==='mouse')?p:null;
  if(!ptrs.has(e.pointerId)){ if(hover) render(); return; }
  ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mxp=(a.x+b.x)/2, myp=(a.y+b.y)/2;
    vtx+=mxp-pinch.mx; vty+=myp-pinch.my; zoomAt(d/pinch.d,mxp,myp); pinch={d,mx:mxp,my:myp}; return; }
  if(pan){ vtx+=p.x-pan.x; vty+=p.y-pan.y; pan={x:p.x,y:p.y}; render(); return; }
  if(!stroke) return;
  if(stroke.rect){ rectDraft.b=toImg(p); render(); return; }
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ce of (evs.length?evs:[e])) addPoint(toImg(vpos(ce)),lineW(ce)); render();
});
function endPointer(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null; if(ptrs.size) return; pan=null;
  if(stroke&&stroke.rect&&rectDraft){ const a=rectDraft.a,b=rectDraft.b; const r={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};
    rectDraft=null; stroke=null; if(r.w>2&&r.h>2){ mx.fillStyle='#fff'; mx.fillRect(r.x,r.y,r.w,r.h); compose(r); pushHist(); } render(); return; }
  if(stroke){ const d=stroke.dirty; stroke=null; if(d) pushHist(); render(); }
}
view.addEventListener('pointerup',endPointer); view.addEventListener('pointercancel',e=>{ cancelStroke(); ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; pan=null; });
view.addEventListener('pointerleave',()=>{ hover=null; render(); });
view.addEventListener('wheel',e=>{ if(!img) return; e.preventDefault(); const p=vpos(e); if(e.ctrlKey||!e.shiftKey&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY*0.0015),p.x,p.y); else { vtx-=e.deltaX; vty-=e.deltaY; render(); } },{passive:false});

/* ---------- controls ---------- */
const effMeta={mosaic:{label:'格子大小',min:4,max:64,key:'mosaic'},blur:{label:'模糊半徑',min:4,max:40,key:'blur'}};
function syncUI(){
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.eff===S.eff));
  const m=effMeta[S.eff]; $('#strRow').hidden=!m; $('#colRow').hidden=S.eff!=='solid';
  if(m){ const r=$('#strength'); r.min=m.min; r.max=m.max; r.value=S[m.key]; $('#strLabel').textContent=m.label; $('#strO').textContent=S[m.key]+'px'; }
  $('#solidColor').value=S.color; $('#brush').value=S.brush; $('#brushO').textContent=S.brush+'px';
  let note='';
  if(img&&S.eff==='mosaic'&&S.mosaic<minCell()) note='格子太小可能被辨識，已自動放大到 '+minCell()+'px（原圖短邊 1.2%）';
  if(img&&S.eff==='blur') note='模糊仍可能被還原輪廓，重要個資建議用馬賽克或塗黑';
  $('#note').textContent=note; $('#note').hidden=!note;
  view.style.cursor=mode==='hand'?'grab':mode==='rect'?'crosshair':'none';
}
let effT; function effChanged(immediate){ syncUI(); store.set('settings',S); clearTimeout(effT); const run=()=>{ if(!img) return; buildEffect(); compose(); render(); };
  if(immediate) run(); else effT=setTimeout(run,60); }
let pendingHist=false;
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{ mode=b.dataset.mode; syncUI(); render(); }));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ if(S.eff===b.dataset.eff) return; S.eff=b.dataset.eff; effChanged(true); if(img) pushHist(); }));
$('#strength').addEventListener('input',e=>{ const m=effMeta[S.eff]; if(!m) return; S[m.key]=+e.target.value; effChanged(); pendingHist=true; });
$('#strength').addEventListener('change',()=>{ if(pendingHist&&img){ pendingHist=false; setTimeout(()=>pushHist(),70); } });
$('#solidColor').addEventListener('input',e=>{ S.color=e.target.value; effChanged(); });
$('#solidColor').addEventListener('change',()=>{ if(img) setTimeout(()=>pushHist(),70); });
$('#brush').addEventListener('input',e=>{ S.brush=+e.target.value; $('#brushO').textContent=S.brush+'px'; store.set('settings',S); });
const hold=$('#holdBtn'); const on=()=>{showOrig=true;render();}, off=()=>{showOrig=false;render();};
hold.addEventListener('pointerdown',e=>{ e.preventDefault(); hold.setPointerCapture&&hold.setPointerCapture(e.pointerId); on(); });
['pointerup','pointercancel','lostpointercapture'].forEach(t=>hold.addEventListener(t,off));
hold.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); on(); } });
hold.addEventListener('keyup',off); hold.addEventListener('contextmenu',e=>e.preventDefault());
$('#applyBtn').addEventListener('click',async()=>{ if(!img) return; await histBusy; bx.drawImage(comp,0,0); mx.clearRect(0,0,img.w,img.h); baseBlob=await toBlob(base); buildEffect(); compose(); render(); await pushHist(); toast('已套用，可換別種效果繼續遮'); });
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
$('#openBtn').onclick=()=>$('#fileIn').click(); $('#bigOpen').onclick=()=>$('#fileIn').click();
$('#fileIn').addEventListener('change',e=>{ openFile(e.target.files[0]); e.target.value=''; });
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) openFile(f); });
document.addEventListener('paste',e=>{ const f=e.clipboardData&&e.clipboardData.files[0]; if(f){ e.preventDefault(); openFile(f); } });
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')&&e.target.type!=='range') return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='['){ S.brush=Math.max(10,S.brush-5); syncUI(); render(); store.set('settings',S); }
  else if(e.key===']'){ S.brush=Math.min(120,S.brush+5); syncUI(); render(); store.set('settings',S); }
  else if(k==='b'||k==='r'||k==='e'||k==='h'){ mode={b:'brush',r:'rect',e:'erase',h:'hand'}[k]; syncUI(); render(); }
  else if(k==='0'){ fit(); }
  else if(e.key==='Escape'){ $('#ov').hidden=true; }
});

/* ---------- export ---------- */
let dl=null;
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; } $('#exportBtn').title=dl?'匯出圖片':'產生圖片後長按儲存'; })();
let ovURL=null;
$('#exportBtn').addEventListener('click',async()=>{
  if(!img) return; await histBusy; const btn=$('#exportBtn'); btn.disabled=true;
  try{
    const jpg=img.type==='image/jpeg'; const out=mk(img.w,img.h), ox=out.getContext('2d');
    if(jpg){ ox.fillStyle='#fff'; ox.fillRect(0,0,img.w,img.h); } ox.drawImage(comp,0,0);
    const blob=await toBlob(out,jpg?'image/jpeg':'image/png',jpg?0.95:undefined); out.width=out.height=0;
    const name=img.name+'-masked.'+(jpg?'jpg':'png'); window.__lastExport=blob;

    else{ if(ovURL) URL.revokeObjectURL(ovURL); ovURL=URL.createObjectURL(blob); $('#ovTitle').textContent=name;
      $('#ovBody').innerHTML='<p>此環境無法直接下載。手機請長按圖片選「儲存影像」，電腦請按右鍵另存。遮蓋區的原始像素已被取代，無法還原。</p><img alt="遮蓋後的圖片" src="'+ovURL+'">'; $('#ov').hidden=false; $('#ovClose').focus(); }
  }catch(e){ toast('匯出失敗：'+e.message); } finally{ btn.disabled=false; }
});
$('#ovClose').onclick=()=>$('#ov').hidden=true;

/* ---------- boot ---------- */
new ResizeObserver(()=>{ sizeView(); fit(); }).observe($('#stage'));
syncUI(); updHist(); sizeView(); loadSample().then(syncUI);
window.__bb={sens:()=>sampleShot().sens,get S(){return S;},get img(){return img;},layers:()=>({base,effect,mask,comp}),compose,buildEffect,undo,redo,get hi(){return hi;},get histLen(){return hist.length;},histDone:()=>histBusy,effCell,minCell,boxBlur,setFilterOK:v=>filterOK=v};
