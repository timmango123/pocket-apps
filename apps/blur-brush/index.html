<title>馬賽克與模糊</title>
<style>
:root{
  --bg:#e3e4e7; --surface:#f6f6f7; --surface-2:#ffffff; --ink:#1b1c20; --ink-2:#464953; --muted:#60636c; --line:#c6c8ce; --line-2:#d9dadf;
  --accent:#a85800; --accent-ink:#ffffff; --accent-soft:#f5e4cc; --stage:#2b2d33; --stage-b:#33363d; --stage-ink:#d9dbe0;
  --shade:rgba(10,11,14,.6); --warn:#8a5200;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131417; --surface:#1b1d21; --surface-2:#23252a; --ink:#e8e9ec; --ink-2:#b7bac2; --muted:#8b8f98; --line:#33363d; --line-2:#2a2d33;
  --accent:#f0a540; --accent-ink:#231400; --accent-soft:#3a2a12; --stage:#0b0c0e; --stage-b:#141518; --stage-ink:#c9ccd3;
  --shade:rgba(0,0,0,.72); --warn:#f0b75e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131417; --surface:#1b1d21; --surface-2:#23252a; --ink:#e8e9ec; --ink-2:#b7bac2; --muted:#8b8f98; --line:#33363d; --line-2:#2a2d33;
  --accent:#f0a540; --accent-ink:#231400; --accent-soft:#3a2a12; --stage:#0b0c0e; --stage-b:#141518; --stage-ink:#c9ccd3;
  --shade:rgba(0,0,0,.72); --warn:#f0b75e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "tools" "fx";
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px;max-width:1400px;margin:0 auto}
.top{grid-area:top;display:flex;align-items:center;gap:6px;min-height:44px}
.top h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:750;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 .bar{display:inline-block;width:22px;height:10px;margin-right:8px;vertical-align:1px;background:repeating-linear-gradient(90deg,var(--ink) 0 5px,var(--accent) 5px 10px,var(--ink-2) 10px 15px,var(--muted) 15px 22px)}
.btn{min-height:44px;min-width:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.icon{padding:0}
.stage{grid-area:stage;position:relative;border-radius:6px;overflow:hidden;background-color:var(--stage);
  background-image:linear-gradient(45deg,var(--stage-b) 25%,transparent 25%,transparent 75%,var(--stage-b) 75%),linear-gradient(45deg,var(--stage-b) 25%,transparent 25%,transparent 75%,var(--stage-b) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage .chip{position:absolute;left:8px;bottom:8px;right:64px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:var(--shade);color:#fff;font-size:15px;z-index:5;touch-action:none}
.busy span{display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.55);padding:10px 16px;border-radius:6px}
.busy i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip span{background:var(--shade);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px}
.chip .warnc{background:var(--accent);color:var(--accent-ink)}
.empty{position:absolute;inset:0;display:grid;place-items:center}
.empty .btn{min-height:64px;padding:0 28px;font-size:17px}
.zoomtag{position:absolute;right:8px;bottom:8px;font:12px var(--mono);color:var(--stage-ink);background:var(--shade);padding:2px 6px;border-radius:4px;pointer-events:none}
.tools{grid-area:tools;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.tool{min-height:48px;border:0;border-radius:5px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2)}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface-2)}
.fx{grid-area:fx;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface-2);cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.sl{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;align-items:center;gap:8px}
.sl label{font-size:13px;color:var(--ink-2)}
.sl output{font:12.5px var(--mono);text-align:right}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent);cursor:pointer;background:transparent}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--surface-2);cursor:pointer}
.sls{display:flex;flex-direction:column;gap:2px}
.acts{display:flex;gap:8px;margin-top:4px}
.acts .btn{flex:1}
.acts .btn svg{display:none}
.ls{display:none}
.note{font-size:12px;color:var(--warn);min-height:0}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.ov{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
.ov .card{background:var(--surface);border-radius:8px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column}
.ov h3{margin:0 0 6px;font-size:16px;overflow-wrap:anywhere}.ov p{font-size:13.5px;color:var(--ink-2);margin:6px 0}
.ov .acts{margin:4px 0 2px;flex-wrap:wrap}
.ov img{width:100%;height:auto;max-height:max(100px,calc(100vh - 250px));object-fit:contain;display:block;margin:8px auto 0;background:var(--stage)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
#fileIn{display:none}
.lbl-s{display:inline}
@media (max-width:420px){.top{gap:6px}.top h1{font-size:15px;letter-spacing:0}.top h1 .bar{display:none}#openBtn{padding:0 8px}#exportBtn{padding:0 10px}}
@media (max-width:340px){.lbl-s{display:none}#openBtn{padding:0}#exportBtn{padding:0 8px}.top h1{font-size:14px}}
/* short portrait phones (lobby sizes): hold/apply join the tool row, sliders sit side by side */
@media (orientation:portrait) and (max-height:760px) and (max-width:899px){
  .tools{grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:3px}
  .tools .tool{padding:0;white-space:nowrap}
  .tools .btn{min-height:48px;min-width:0;border:0;border-radius:5px;background:transparent;flex-direction:column;gap:2px;padding:0;font-size:12px;color:var(--ink-2)}
  .tools .btn svg{display:block;width:22px;height:22px}
  .tools .ls{display:inline}.tools .lf{display:none}
  .fx .acts{display:none}
  .sls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sls .sl{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l o" "r r";gap:0 6px}
  .sls .sl label{grid-area:l;font-size:12px}.sls .sl output,.sls .sl>span{grid-area:o;font-size:12px}
  .sls .sl input{grid-area:r}
}
/* landscape phones */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "stage tools" "stage fx"}
  .fx{overflow:auto}
  .tool{min-height:44px}
  .lbl-s{display:inline}
}
/* desktop */
@media (min-width:900px) and (min-height:561px){
  .app{grid-template-columns:72px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "tools stage fx";padding-block:12px}
  .tools{grid-template-columns:1fr;align-content:start}
  .tool{min-height:60px}
  .fx{align-self:start;gap:6px}
}
@media (hover:hover){ .btn:not(:disabled):hover{border-color:var(--ink-2)} .tool:not([aria-pressed="true"]):hover{background:var(--line-2)} .seg button:not([aria-pressed="true"]):hover{background:var(--line-2)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    </div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const P='blur-brush:v1:';
const store={get(k,d){try{const v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));}catch(e){}}};
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}
const SANS='system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const DEF={eff:'mosaic',mosaic:16,blur:16,color:'#111111',brush:40};
const clampInt=(v,a,b,d)=>{ v=Math.round(Number(v)); return Number.isFinite(v)?Math.min(b,Math.max(a,v)):d; };
// settings read back from storage are validated: unknown effect or out-of-range numbers fall back to defaults/limits
function sane(o){ o=o&&typeof o==='object'?o:{}; return {eff:['mosaic','blur','solid'].includes(o.eff)?o.eff:DEF.eff, mosaic:clampInt(o.mosaic,4,64,DEF.mosaic), blur:clampInt(o.blur,4,40,DEF.blur),
  color:typeof o.color==='string'&&/^#[0-9a-f]{6}$/i.test(o.color)?o.color.toLowerCase():DEF.color, brush:clampInt(o.brush,10,120,DEF.brush)}; }
let S=sane(store.get('settings',{}));
let mode='brush';
const LIM_SIDE=8192, LIM_AREA=16777216, BIG=4e6, LO_SIDE=1600;

/* ---------- layers ---------- */
let img=null; // {w,h,name,type,sample,scaled}
let base,effect,mask,comp,bx,ex,mx,cx;
let lo=null,loB=null,lox=null,lobx=null,loS=1; // display-resolution copies of comp/base for big images
const tmp=document.createElement('canvas'); tmp.width=tmp.height=512; const tx_=tmp.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function minCell(){ return Math.max(8,Math.ceil(Math.min(img.w,img.h)*0.012)); }
function effCell(){ return Math.max(S.mosaic,minCell()); }
function blurR(){ return S.blur*Math.max(1,Math.min(img.w,img.h)/800); }
let filterOK=null;
function testFilter(){ try{ const c=mk(20,20),x=c.getContext('2d'); if(!('filter' in x)) return false; x.filter='blur(3px)'; x.fillStyle='#000'; x.fillRect(9,9,2,2); return x.getImageData(4,10,1,1).data[3]>0; }catch(e){return false;} }
function avgColor(src){ const c=mk(1,1),x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,1,1); const d=x.getImageData(0,0,1,1).data; return 'rgb('+d[0]+','+d[1]+','+d[2]+')'; }
function boxBlur(d,w,h,r){ // 3-pass box blur, RGBA, clamped edges
  const tmpA=new Uint8ClampedArray(d.length);
  const pass=(src,dst,horiz)=>{ const len=horiz?w:h, lines=horiz?h:w, div=2*r+1;
    for(let l=0;l<lines;l++){ for(let ch=0;ch<4;ch++){ let acc=0; const idx=i=>{ i=i<0?0:i>=len?len-1:i; return horiz?((l*w+i)*4+ch):((i*w+l)*4+ch); };
      for(let i=-r;i<=r;i++) acc+=src[idx(i)];
      for(let i=0;i<len;i++){ dst[idx(i)]=acc/div; acc+=src[idx(i+r+1)]-src[idx(i-r)]; } } } };
  for(let k=0;k<3;k++){ pass(d,tmpA,true); pass(tmpA,d,false); }
}
// Effects are cached by (base, effect, strength/colour): undo/redo or switching back reuses the canvas instead of
// rebuilding (12 MP mosaic/blur takes seconds on a loaded phone). Solid needs no canvas at all. At most 2 kept.
const effCache=new Map(); let effKeyCur=null, effJob=null, solidCol=null, genSeq=0;
function effKey(){ return base.gen+'|'+S.eff+'|'+(S.eff==='mosaic'?effCell():S.eff==='blur'?blurR():S.color); }
function* mosaicGen(c,cell){ // fills canvas c strip by strip; yields between strips so a big build can run in the background
  const W=img.w,H=img.h,sw=Math.ceil(W/cell),sh=Math.ceil(H/cell),cc=c.getContext('2d');
  const col=new Int32Array(W); for(let x=0;x<W;x++) col[x]=((x/cell)|0)*4;
  const acc=new Float64Array(sw*4), rowsPer=Math.max(1,Math.min(sh,Math.floor(4096/cell),Math.floor(Math.max(cell,1048576/W)/cell))), s=mk(sw,rowsPer), sx=s.getContext('2d');
  cc.clearRect(0,0,W,H); cc.imageSmoothingEnabled=false;
  for(let by0=0;by0<sh;by0+=rowsPer){
    const nb=Math.min(rowsPer,sh-by0), y0=by0*cell, hh=Math.min(nb*cell,H-y0), d=bx.getImageData(0,y0,W,hh).data, out=new ImageData(sw,nb), od=out.data;
    for(let j=0;j<nb;j++){
      acc.fill(0); const ya=j*cell, yb=Math.min(ya+cell,hh);
      for(let y=ya;y<yb;y++){ let i=y*W*4; for(let x=0;x<W;x++,i+=4){ const a=d[i+3]; if(!a) continue; const k=col[x]; acc[k]+=d[i]*a; acc[k+1]+=d[i+1]*a; acc[k+2]+=d[i+2]*a; acc[k+3]+=a; } }
      for(let q=0;q<sw;q++){ const k=q*4,A=acc[k+3],n=(Math.min(cell,W-q*cell))*(yb-ya),o=(j*sw+q)*4; if(A>0){ od[o]=acc[k]/A; od[o+1]=acc[k+1]/A; od[o+2]=acc[k+2]/A; } od[o+3]=A/n; }
    }
    sx.clearRect(0,0,sw,rowsPer); sx.putImageData(out,0,0); cc.drawImage(s,0,0,sw,nb,0,y0,sw*cell,nb*cell);
    yield;
  }
}
function blurInto(c){
  const W=img.w,H=img.h,x=c.getContext('2d'),R=blurR(),bg=avgColor(base); x.save(); x.clearRect(0,0,W,H);
  if(filterOK===null) filterOK=testFilter();
  if(filterOK){ x.filter='blur('+R+'px)'; x.drawImage(base,0,0); x.filter='none'; }

function setBusy(on,msg){ busyOn=on; $('#busy').hidden=!on; $('#busyMsg').textContent=msg||'讀取圖片…'; $('#stage').setAttribute('aria-busy',on?'true':'false');
  ['#openBtn','#exportBtn','#applyBtn','#bigOpen'].forEach(s=>$(s).disabled=on); document.querySelectorAll('.seg button').forEach(b=>b.disabled=on); updHist(); }
const nextPaint=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

/* ---------- open ---------- */
let openTok=0;
function install(src,W,H,meta){ // swap in a new image synchronously (no awaits, so a stale open can't interleave)
  cancelStroke(true); ptrs.clear(); pinch=pan=null;
  img=Object.assign({w:W,h:H},meta);
  base=mk(W,H); mask=mk(W,H); comp=mk(W,H); base.gen=++genSeq;
  bx=base.getContext('2d'); mx=mask.getContext('2d'); cx=comp.getContext('2d');
  effCache.clear(); baseCache.clear(); effJob=null; effKeyCur=null; effect=ex=null; pendR=null; maskBox=null;
  bx.imageSmoothingQuality='high'; bx.drawImage(src,0,0,W,H);
  mx.fillRect(0,0,1,1); mx.clearRect(0,0,1,1); mx.getImageData(0,0,1,1); // allocate the mask now (inside the busy phase), not on the first stroke
}
function afterInstall(){ $('#empty').hidden=true; sizeView(); fit(); chips(); }
async function openSource(src,w,h,meta,tok){
  let s=1; if(w>LIM_SIDE||h>LIM_SIDE) s=Math.min(s,LIM_SIDE/Math.max(w,h)); if(w*h*s*s>LIM_AREA) s=Math.min(s,Math.sqrt(LIM_AREA/(w*h)));
  const W=Math.max(1,Math.floor(w*s)),H=Math.max(1,Math.floor(h*s));
  let blob=meta.blob||null;
  if(!blob){ const c=mk(W,H),x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,W,H); blob=await toBlob(c); c.width=c.height=0; }
  await histBusy; if(tok!==openTok) return false;
  install(src,W,H,{name:meta.name,type:meta.type,sample:meta.sample,scaled:s<1});
  baseBlob=blob; hist=[];hi=-1; dirty=false; mkLo();
  // show the picture first: with an empty mask the result is the original, so the effect can be built afterwards
  if(meta.premask){ meta.premask(mx); maskBox=FULLR(); compose(); pushHist(true); }
  else{ cx.drawImage(base,0,0); if(lo) loUpd(lox,comp,0,0,W,H); pushHist('empty'); }
  afterInstall(); syncUI(); if(!meta.premask) prepEffect();
  if(img.scaled) toast('圖片過大，已縮小至 '+W+'×'+H+' 以免記憶體不足');
  return true;
}
async function openFile(f,confirmed){
  if(!f) return; if(!/^image\//.test(f.type)){ toast('這不是圖片檔'); return; }
  if(!confirmed&&needConfirm()&&!(await askConfirm('取代目前的編輯？','目前這張圖的遮蓋還沒匯出。開啟新圖後，這張圖的編輯和復原紀錄都會被取代。','開啟新圖'))) return;
  const tok=++openTok; setBusy(true,'讀取圖片…'); await nextPaint();
  try{
    let b,viaBitmap=true; try{ b=await createImageBitmap(f,{imageOrientation:'from-image'}); }
    catch(e){ viaBitmap=false; try{ const u=URL.createObjectURL(f); const im=new Image(); im.src=u; await im.decode(); b=im; setTimeout(()=>URL.revokeObjectURL(u),1000); }catch(e2){ if(tok===openTok) toast('此格式無法解碼，請先轉成 JPG 或 PNG'); return; } }
    if(tok!==openTok){ b.close&&b.close(); return; }
    const w=b.width||b.naturalWidth,h=b.height||b.naturalHeight; if(!w||!h){ toast('此格式無法解碼，請先轉成 JPG 或 PNG'); return; }
    await openSource(b,w,h,{name:f.name.replace(/\.[^.]+$/,'')||'image',type:f.type,sample:false,blob:viaBitmap?f:null},tok);
    b.close&&b.close();
  }catch(e){ if(tok===openTok) toast('開啟失敗：'+(e&&e.message||e)); }
  finally{ if(tok===openTok) setBusy(false); }
}
function needConfirm(){ return !!(img&&!img.sample&&dirty); }
function sampleShot(){

    x.fillStyle=me?'#ffd98a':'#ffffff'; x.beginPath(); x.roundRect?x.roundRect(bxp,y,bw,bh,22):x.rect(bxp,y,bw,bh); x.fill();
    x.fillStyle='#1d2329'; lines.forEach((l,i)=>{ const ly=y+37+i*44; x.fillText(l,bxp+24,ly);
      const m=/^(電話 |範例銀行 )(.+)$/.exec(l); if(m){ const x0=bxp+24+x.measureText(m[1]).width; sens.push({x:x0-6,y:ly-24,w:x.measureText(m[2]).width+12,h:48}); } }); return y+bh+26; };

async function loadSample(tok){
  const c=sampleShot();
  await openSource(c,c.width,c.height,{name:'範例截圖',type:'image/png',sample:true,premask:m=>{ m.fillStyle='#fff'; const a=c.sens[0], b=c.sens[1]; m.fillRect(a.x,a.y,a.w,a.h); m.lineCap='round'; m.lineJoin='round'; m.lineWidth=b.h; m.strokeStyle='#fff'; m.beginPath(); m.moveTo(b.x+b.h/2,b.y+b.h/2+2); m.quadraticCurveTo(b.x+b.w/2,b.y+b.h/2-4,b.x+b.w-b.h/2,b.y+b.h/2+1); m.stroke(); }},tok);
}
let chipsOff=false, chipsT=0, chipPos='';
// chips stay inside the picture (landscape: the image is narrow) and clear of the zoom tag; the demo line goes after 8 s
function placeChips(){ if(!img) return; const c=$('#chips'), W=view.width/dpr, H=view.height/dpr;
  let l=Math.max(8,vtx+8), r=Math.max(8,W-(vtx+img.w*vs)+8), b=Math.max(8,H-(vty+img.h*vs)+8); if(b<40) r=Math.max(r,64);
  if(W-l-r<120){ l=8; r=64; } const k=l+'|'+r+'|'+b; if(k===chipPos) return; chipPos=k; c.style.left=l+'px'; c.style.right=r+'px'; c.style.bottom=b+'px'; }
function chips(){ const c=$('#chips'); c.innerHTML=''; if(!img) return; clearTimeout(chipsT); if(img.sample&&!chipsOff) chipsT=setTimeout(()=>{ chipsOff=true; chips(); },8000);
  const add=(t,cls)=>{ const s=document.createElement('span'); if(cls) s.className=cls; s.textContent=t; c.appendChild(s); };
  if(img.sample){ if(!chipsOff) add('範例圖：已示範遮住電話與帳號'); add('按「開啟」換你的圖・圖片不會上傳'); }
  if(img.scaled) add('已縮小至 '+img.w+'×'+img.h,'warnc');
  if(!persistOK) add('無法保存：重新整理會遺失，請先匯出','warnc'); }

/* ---------- pointer handling ---------- */
const ptrs=new Map(); let stroke=null, pan=null, pinch=null;
const MINW=2; // a brush never gets thinner than 2 image px, so a tap at extreme zoom still covers the pixel
function vpos(e){ const r=view.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function lineW(e){ let w=S.brush/vs; if(e.pointerType==='pen'&&e.pressure>0) w*=0.5+e.pressure; return Math.max(MINW,w); }
function strokeSeg(a,ctrl,b,lw){
  mx.save(); mx.globalCompositeOperation=stroke.erase?'destination-out':'source-over'; mx.strokeStyle='#fff'; mx.lineWidth=lw; mx.lineCap='round'; mx.lineJoin='round';
  mx.beginPath(); mx.moveTo(a.x,a.y); if(ctrl) mx.quadraticCurveTo(ctrl.x,ctrl.y,b.x,b.y); else mx.lineTo(b.x+0.01,b.y); mx.stroke(); mx.restore();
  const pts=[a,b].concat(ctrl?[ctrl]:[]), pad=lw/2+2; const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const r={x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
  markDirty(r); stroke.box=uni(stroke.box,r); stroke.dirty=true;
}
function addPoint(p,lw){
  const s=stroke; s.pts.push(p); const n=s.pts.length;
  if(n===1){ strokeSeg(p,null,p,lw); s.lastMid=p; return; }
  const prev=s.pts[n-2], mid={x:(prev.x+p.x)/2,y:(prev.y+p.y)/2};
  strokeSeg(s.lastMid,prev,mid,lw); s.lastMid=mid;
}
async function cancelStroke(drop){ if(!stroke) return; const had=stroke.dirty, box=stroke.box&&clampR(stroke.box); stroke=null; rectDraft=null; pendR=null;
  if(!drop&&had&&box&&hist[hi]){ const m=mask, b=await createImageBitmap(hist[hi].mask,box.x,box.y,box.w,box.h); if(m===mask){ mx.clearRect(box.x,box.y,box.w,box.h); mx.drawImage(b,box.x,box.y); compose(box); } b.close&&b.close(); } render(); }
view.addEventListener('pointerdown',e=>{
  if(!img||busyOn) return; if(img.sample&&!chipsOff){ chipsOff=true; chips(); } try{view.setPointerCapture(e.pointerId);}catch(_){} const p=vpos(e); ptrs.set(e.pointerId,p);
  if(ptrs.size===2){ cancelStroke(); pan=null; const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}; return; }
  if(ptrs.size>2) return;
  if(mode==='hand'||e.button===1){ pan={x:p.x,y:p.y}; return; }
  if(e.button>0) return;
  if(mode==='rect'){ stroke={rect:true}; rectDraft={a:toImg(p),b:toImg(p)}; render(); return; }
  stroke={pts:[],erase:mode==='erase',dirty:false}; addPoint(toImg(p),lineW(e)); render();
});
view.addEventListener('pointermove',e=>{
  const p=vpos(e); hover=(e.pointerType==='mouse')?p:null;
  if(!ptrs.has(e.pointerId)){ if(hover) render(); return; }
  ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mxp=(a.x+b.x)/2, myp=(a.y+b.y)/2;
    vtx+=mxp-pinch.mx; vty+=myp-pinch.my; zoomAt(d/pinch.d,mxp,myp); pinch={d,mx:mxp,my:myp}; return; }
  if(pan){ vtx+=p.x-pan.x; vty+=p.y-pan.y; pan={x:p.x,y:p.y}; fitted=false; render(); return; }
  if(!stroke) return;
  if(stroke.rect){ rectDraft.b=toImg(p); render(); return; }
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ce of (evs.length?evs:[e])) addPoint(toImg(vpos(ce)),lineW(ce)); render();
});
function endPointer(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null; if(ptrs.size) return; pan=null;
  if(stroke&&stroke.rect&&rectDraft){ const a=rectDraft.a,b=rectDraft.b; const r={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};
    rectDraft=null; stroke=null; if(r.w>2&&r.h>2){ mx.fillStyle='#fff'; mx.fillRect(r.x,r.y,r.w,r.h); markDirty(r); flushCompose(); pushHist(false,r); } render(); return; }
  if(stroke){ const d=stroke.dirty, box=stroke.box; stroke=null; if(d){ flushCompose(); pushHist(false,box); } render(); }
}
view.addEventListener('pointerup',endPointer); view.addEventListener('pointercancel',e=>{ cancelStroke(); ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; pan=null; });
view.addEventListener('pointerleave',()=>{ hover=null; render(); });
view.addEventListener('wheel',e=>{ if(!img) return; e.preventDefault(); const p=vpos(e); if(e.ctrlKey||!e.shiftKey&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY*0.0015),p.x,p.y); else { vtx-=e.deltaX; vty-=e.deltaY; fitted=false; render(); } },{passive:false});

const effMeta={mosaic:{label:'格子大小',min:4,max:64,key:'mosaic'},blur:{label:'模糊半徑',min:4,max:40,key:'blur'}};
function syncUI(){
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.eff===S.eff));
  const m=effMeta[S.eff]; $('#strRow').hidden=!m; $('#colRow').hidden=S.eff!=='solid';
  if(m){ const r=$('#strength'); r.min=m.min; r.max=m.max; r.value=S[m.key]; $('#strLabel').textContent=m.label; $('#strO').textContent=S[m.key]+'px'; }
  $('#solidColor').value=S.color; $('#brush').value=S.brush; $('#brushO').textContent=S.brush+'px';
  let note='';
  if(img&&S.eff==='mosaic'&&S.mosaic<minCell()) note='格子太小可能被辨識，已自動放大到 '+minCell()+'px（原圖短邊 1.2%）';
  if(img&&S.eff==='blur') note='模糊仍可能被還原輪廓，重要個資建議用馬賽克或塗黑';
  $('#note').textContent=note; $('#note').hidden=!note;
  view.style.cursor=mode==='hand'?'grab':mode==='rect'?'crosshair':'none';
}
const saveSettings=()=>store.set('settings',S);
let effT,effTok=0;
// big images: show 處理中 while the effect is rebuilt (blur on 12 MP takes seconds); small ones stay synchronous
// (only where the mask has paint; with nothing painted the effect is just prepared in the background)
function effChanged(immediate){ syncUI(); saveSettings(); clearTimeout(effT); const run=()=>{ if(!img) return; if(maskBox) compose(maskBox); else prepEffect(); render(); };
  if(!img) return;
  const heavy=()=>maskBox&&(S.eff!=='solid'&&!effCache.has(effKey())||maskBox.w*maskBox.h>BIG);
  if(img.w*img.h>BIG&&heavy()){ const t=++effTok; effT=setTimeout(async()=>{ if(t!==effTok) return; if(busyOn){ run(); return; } setBusy(true,'處理中…'); await nextPaint(); try{ if(t===effTok) run(); } finally{ setBusy(false); } },immediate?0:120); }
  else if(immediate) run(); else effT=setTimeout(run,60); }

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')&&e.target.type!=='range') return;
  if(e.key==='Escape'&&!$('#ov').hidden){ closeOv(false); return; }
  if(!$('#ov').hidden) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='['){ S.brush=Math.max(10,S.brush-5); syncUI(); showBrushPreview(); saveSettings(); }
  else if(e.key===']'){ S.brush=Math.min(120,S.brush+5); syncUI(); showBrushPreview(); saveSettings(); }
  else if(k==='b'||k==='r'||k==='e'||k==='h'){ mode={b:'brush',r:'rect',e:'erase',h:'hand'}[k]; syncUI(); render(); }
