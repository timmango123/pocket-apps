<title>薪資與勞健保試算</title>
<style>
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface-2:#f5f6f2; --ink:#182019; --ink-2:#48534a; --ink-3:#6b776d;
  --line:#d6dbd2; --line-strong:#aeb7ab;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#d9eee6;
  --hero:#163f36; --hero-2:#1f6f5c; --hero-ink:#f3faf6; --hero-dim:rgba(243,250,246,.72);
  --net:#3cc48f; --li:#f2b24b; --hi:#ef7a7a; --pen:#6aa9ff; --er:#b58cff;
  --warn:#8a5a00; --warn-soft:#fbf1d8; --bad:#b4303a;
  --focus:#1c5fd1; --scrim:rgba(14,20,16,.5); --shadow:0 1px 0 rgba(16,24,18,.05), 0 8px 22px -12px rgba(16,24,18,.3);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --surface:#171d1a; --surface-2:#1f2723; --ink:#e7ece8; --ink-2:#a9b5ad; --ink-3:#8a978e;
    --line:#2b352f; --line-strong:#41504a;
    --accent:#4fc9a2; --accent-ink:#04231b; --accent-soft:#163a31;
    --hero:#10302a; --hero-2:#1b5748; --hero-ink:#eef8f3; --hero-dim:rgba(238,248,243,.68);
    --net:#4fd39b; --li:#f5bd5e; --hi:#f58b8b; --pen:#7fb5ff; --er:#c3a1ff;
    --warn:#f0c060; --warn-soft:#2e2715; --bad:#ff8c92;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171d1a; --surface-2:#1f2723; --ink:#e7ece8; --ink-2:#a9b5ad; --ink-3:#8a978e;
  --line:#2b352f; --line-strong:#41504a;
  --accent:#4fc9a2; --accent-ink:#04231b; --accent-soft:#163a31;
  --hero:#10302a; --hero-2:#1b5748; --hero-ink:#eef8f3; --hero-dim:rgba(238,248,243,.68);
  --net:#4fd39b; --li:#f5bd5e; --hi:#f58b8b; --pen:#7fb5ff; --er:#c3a1ff;
  --warn:#f0c060; --warn-soft:#2e2715; --bad:#ff8c92;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:12px 16px calc(24px + env(safe-area-inset-bottom));min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--hero);color:var(--hero-ink);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1}
.mark small{font-size:8px;font-weight:700;letter-spacing:.14em;opacity:.8;margin-top:3px}
.ttl{flex:1;min-width:0;overflow:hidden}
.ttl h1{margin:0;font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .yr{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .yr b{color:var(--accent);font-weight:700}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}

.sample{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--line-strong);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:12px}
.sample span{flex:1}
.sample button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 14px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero),var(--hero-2));box-shadow:var(--shadow);margin-bottom:12px}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.14em;color:var(--hero-dim);font-weight:700}
.hero .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
.hero .big small{font-size:16px;font-weight:700;margin-right:4px;opacity:.8}
.hero .sub{font-size:13px;color:var(--hero-dim);margin-top:2px}
.hero .sub b{color:var(--hero-ink);font-weight:700}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:12px;background:rgba(0,0,0,.25)}
.bar i{display:block;height:100%;transition:flex-basis .35s ease;min-width:0}
.bar .s-net{background:var(--net)} .bar .s-li{background:var(--li)} .bar .s-hi{background:var(--hi)} .bar .s-pen{background:var(--pen)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.legend div{min-width:0}
.legend .k{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--hero-dim);white-space:nowrap}
.legend .k i{width:8px;height:8px;border-radius:2px;flex:none}
.legend .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;white-space:nowrap}
.legend .v.zero{opacity:.55}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 .meta{font-size:12px;letter-spacing:0;color:var(--ink-3);font-weight:500;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label,.field>.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px;gap:8px}
.field>label small,.field>.lbl small{font-weight:500;color:var(--ink-3);font-size:12px;white-space:nowrap}
.txt{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.txt:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.txt.main{font-size:22px;min-height:52px}
.money{position:relative}
.money .txt{padding-left:36px}
.money::before{content:"NT$";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3);font-weight:700;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;border:0;background:transparent;cursor:pointer;font-weight:700;border-left:1px solid var(--line);padding:0 4px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg7{grid-template-columns:repeat(7,1fr)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg2{grid-template-columns:repeat(2,1fr)}
.hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0}
.hint.diff{color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.hint.diff b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* tabs + rows */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs button{min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:700;color:var(--ink-2);padding:0 4px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px dotted var(--line);align-items:center}
.r:first-child{border-top:0}
.r .n{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.r .n i{width:10px;height:10px;border-radius:3px;flex:none}
.r .n .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .d{grid-column:1;font-size:12px;color:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{grid-column:2;grid-row:1/span 2;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.r .v.minus{color:var(--bad)}
.r .v.plus{color:var(--accent)}
.r.total{border-top:1.5px dashed var(--line-strong);margin-top:4px;padding-top:10px}
.r.total .n{font-weight:800}
.r.total .v{font-size:18px}
.i-net{background:var(--net)} .i-li{background:var(--li)} .i-hi{background:var(--hi)} .i-pen{background:var(--pen)} .i-er{background:var(--er)}
.erbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 10px;background:var(--surface-2)}
.erbar i{display:block;height:100%}
.note{font-size:12px;color:var(--ink-3);margin:10px 2px 0;line-height:1.55}
.note b{color:var(--ink-2)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 16px;cursor:pointer;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.foot{font-size:12px;color:var(--ink-3);line-height:1.6;margin:4px 2px 0}
.foot a{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .lead{font-size:13px;color:var(--ink-2);margin:0 0 12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .txt{font-size:16px}
.unit{position:relative}
.unit .txt{padding-right:40px}
.unit::after{content:attr(data-u);position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);font-weight:700;pointer-events:none}
.sheetact{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.sheetact .btn.ghost{flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}

@media (hover:hover){
  .iconbtn:hover,.btn:hover{border-color:var(--ink-3)}
  .btn.primary:hover{filter:brightness(1.07)}
}
@media (min-width:860px){
  body{padding:24px 32px 32px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .right{position:sticky;top:24px}
  .hero .big{font-size:44px}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:86%}
  .sheet .grab{display:none}
}
@media (max-width:360px){ .hero .big{font-size:32px} .legend{grid-template-columns:repeat(2,1fr)} }
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="wrap">
  <header class="top">

<script>
(() => {
'use strict';
/*CORE-START*/
// ===== 費率與分級表資料（2026 年／民國 115 年版） =====
// 每年可能調整：請以勞動部勞工保險局、衛福部中央健康保險署公告為準。
// liRate：勞保普通事故保險費率（%）；eiRate：就業保險費率（%）；hiRate：健保費率（%）
// oiRate：勞工職業災害保險平均費率（%，雇主全額負擔，各行業不同）
// avgDep：健保雇主負擔之平均眷口數；suppRate：二代健保補充保費率（%）
const DATA = {
  year: 2026, roc: 115,
  minWage: 29500,
  liRate: 11.5, eiRate: 1.0, liEmpShare: 0.2, liErShare: 0.7,
  oiRate: 0.2,
  hiRate: 5.17, hiEmpShare: 0.3, hiErShare: 0.6, avgDep: 0.56, maxDep: 3,
  pensionEr: 6, selfMax: 6,
  suppRate: 2.11, suppBonusMult: 4,
  // 部分工時適用的低於基本工資級距（勞保、勞退）
  lowGrades: [11100, 12540, 13500, 15840, 16500, 17280, 17880, 19047, 20008, 21009, 22000, 23100, 24000, 25250, 26400, 27600],
  // 基本工資以上的共同級距（勞保投保薪資／健保投保金額／勞退月提繳工資）
  grades: [28800, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800,
    48200, 50600, 53000, 55400, 57800, 60800, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600,
    101100, 105600, 110100, 115500, 120900, 126300, 131700, 137100, 142500, 147900, 150000,
    156400, 162800, 169200, 175600, 182000, 189500, 197000, 204500, 212000, 219500],
  liTop: 45800, hiTop: 219500, pensionTop: 150000
};
const SC = {
  DATA,
  // 使用者可改的費率（存在 localStorage）：minWage、liRate、eiRate、hiRate、avgDep、oiRate
  defaults() { return { minWage: DATA.minWage, liRate: DATA.liRate, eiRate: DATA.eiRate, hiRate: DATA.hiRate, avgDep: DATA.avgDep, oiRate: DATA.oiRate }; },
  // 某一險種的完整級距（由低到高）
  grades(kind, cfg) {
    const mw = cfg.minWage, top = kind === 'li' ? DATA.liTop : kind === 'hi' ? DATA.hiTop : DATA.pensionTop;
    const low = kind === 'hi' ? [] : DATA.lowGrades.filter(g => g < mw);
    return [...low, mw, ...DATA.grades.filter(g => g > mw && g <= Math.max(top, mw))];
  },
  // 查級距：取第一個 ≥ 薪資的級距；超過最高級距以最高級距計；低於最低級距以最低級距計
  grade(kind, amount, cfg) {
    const gs = SC.grades(kind, cfg);
    for (const g of gs) if (amount <= g) return g;
    return gs[gs.length - 1];
  },
  round: x => Math.round(x + 1e-9),
  // 主計算。inp: {salary, allow, dep, selfRate, insured(null=依實際), bonusMonths}
  calc(inp, cfg) {
    const c = Object.assign(SC.defaults(), cfg || {});
    const salary = Math.max(0, +inp.salary || 0), allow = Math.max(0, +inp.allow || 0);
    const gross = salary + allow;
    const dep = Math.min(DATA.maxDep, Math.max(0, Math.floor(+inp.dep || 0)));
    const selfRate = Math.min(DATA.selfMax, Math.max(0, +inp.selfRate || 0));
    const insBase = inp.insured != null && inp.insured !== '' && +inp.insured > 0 ? +inp.insured : gross;
    const liG = SC.grade('li', insBase, c), hiG = SC.grade('hi', insBase, c), pG = SC.grade('pen', insBase, c);
    const liTotal = (c.liRate + c.eiRate) / 100;
    const liEmp = SC.round(liG * liTotal * DATA.liEmpShare);
    const hiPer = SC.round(hiG * c.hiRate / 100 * DATA.hiEmpShare);   // 每人（本人或每位眷屬）保費，先四捨五入再乘人數
    const hiEmp = hiPer * (1 + dep);
    const selfPen = SC.round(pG * selfRate / 100);
    const deduct = liEmp + hiEmp + selfPen;
    const net = gross - deduct;
    const liEr = SC.round(liG * liTotal * DATA.liErShare);
    const oi = SC.round(liG * c.oiRate / 100);
    const hiEr = SC.round(hiG * c.hiRate / 100 * DATA.hiErShare * (1 + c.avgDep));
    const penEr = SC.round(pG * DATA.pensionEr / 100);
    const erExtra = liEr + oi + hiEr + penEr;
    const erTotal = gross + erExtra;
    // 年度：×12 加年終；年終超過當月投保金額 4 倍的部分課補充保費
    const bonusM = Math.min(24, Math.max(0, +inp.bonusMonths || 0));
    const bonus = SC.round(salary * bonusM);
    const suppBase = Math.max(0, bonus - hiG * DATA.suppBonusMult);
    const supp = SC.round(suppBase * DATA.suppRate / 100);
    const year = {
      gross: gross * 12 + bonus, bonus, li: liEmp * 12, hi: hiEmp * 12, self: selfPen * 12, supp,
      net: net * 12 + bonus - supp, erTotal: erTotal * 12 + bonus, erExtra: erExtra * 12, penEr: penEr * 12, bonusMonths: bonusM
    };
    return { gross, salary, allow, dep, selfRate, insBase, underInsured: insBase < gross, liG, hiG, pG, liEmp, hiPer, hiEmp, selfPen, deduct, net,
      liEr, oi, hiEr, penEr, erExtra, erTotal, year, cfg: c };
  },
  fmt: n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','),
  pct: x => (Math.round(x * 100) / 100).toString(),
  // 複製用純文字
  text(r) {
    const f = SC.fmt, c = r.cfg, L = [];
    L.push(`【薪資試算】${DATA.year} 年費率（${DATA.roc} 年）`);
    L.push(`月薪 ${f(r.salary)}${r.allow ? '＋津貼 ' + f(r.allow) : ''}＝總額 ${f(r.gross)}`);
    L.push(`投保薪資 ${f(r.insBase)}${r.underInsured ? '（低於實際薪資）' : ''}：勞保級距 ${f(r.liG)}／健保級距 ${f(r.hiG)}／勞退級距 ${f(r.pG)}`);
    L.push(`－勞保（含就保）${SC.pct(c.liRate + c.eiRate)}%×20%：${f(r.liEmp)}`);
    L.push(`－健保 ${SC.pct(c.hiRate)}%×30%×${1 + r.dep} 人：${f(r.hiEmp)}`);
    if (r.selfPen) L.push(`－勞退自提 ${r.selfRate}%：${f(r.selfPen)}`);
    L.push(`＝每月實領（稅前）${f(r.net)}`);
    L.push('');
    L.push(`雇主每月成本 ${f(r.erTotal)}：勞保 ${f(r.liEr)}＋職災 ${f(r.oi)}＋健保 ${f(r.hiEr)}＋勞退 6% ${f(r.penEr)}`);
    const y = r.year;
    L.push(`年度（含年終 ${y.bonusMonths} 個月）：總額 ${f(y.gross)}，扣勞健保自提 ${f(y.li + y.hi + y.self)}${y.supp ? '，補充保費 ' + f(y.supp) : ''}，實領 ${f(y.net)}`);
    L.push('※ 未含所得稅扣繳；費率與級距請以勞保局、健保署公告為準。');
    return L.join('\n');
  }
};

    <h2 id="shT">費率設定</h2>
    <p class="lead">內建 ${DATA.year} 年（民國 ${DATA.roc} 年）數值。每年公告後可在這裡改，會記在這台裝置上。</p>
    ${FIELDS.map(([k, n, u, step]) => `<div class="field"><label for="cfg-${k}">${n}<small>預設 ${d[k]}${u}</small></label><div class="unit" data-u="${u}"><input class="txt" id="cfg-${k}" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${cfg[k]}"></div></div>`).join('')}
    <p class="note">級距表、負擔比例（勞保 2:7:1、健保 3:6:1）、勞退 6% 與補充保費 ${DATA.suppRate}% 寫在程式內，無法在此修改。</p>
    <div class="sheetact"><button class="btn ghost" id="cfgReset" type="button">恢復預設</button><button class="btn primary" id="cfgDone" type="button">完成</button></div>
  </div></div>`;
  const apply = () => {
    for (const [k] of FIELDS) { const v = parseNum($('#cfg-' + k).value); if (v > 0 || k === 'avgDep' || k === 'oiRate') cfg[k] = v; }
    if (cfg.minWage < 1000) cfg.minWage = d.minWage;
    saveCfg(); render(false);
  };
  $('#layer').addEventListener('input', apply);
  $('#cfgReset').addEventListener('click', () => { cfg = SC.defaults(); lsDel(KEY_CFG); for (const [k] of FIELDS) $('#cfg-' + k).value = cfg[k]; render(false); toast('已恢復預設費率'); });
  $('#cfgDone').addEventListener('click', closeSettings);
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSettings(); });
  $('#cfg-minWage').focus();
}
function closeSettings() { $('#layer').innerHTML = ''; $('#setBtn').focus(); }
$('#setBtn').addEventListener('click', openSettings);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scrim')) closeSettings(); });

render(true);
window.__salaryCalc = { SC, get state() { return S; }, get cfg() { return cfg; }, get last() { return last; } };
})();
</script>
