button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }

<title>薪資與勞健保試算</title>
<style>
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface-2:#f4f6f1; --ink:#182019; --ink-2:#46514a; --ink-3:#66726a;
  --line:#dde1d8; --line-strong:#b4bcb0;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --hero:#123a31; --hero-2:#1f6f5c; --hero-ink:#f3faf6; --hero-dim:rgba(243,250,246,.74);
  --net:#3cc48f; --li:#f2b24b; --hi:#ef7a7a; --pen:#6aa9ff; --er:#b58cff; --oth:#9aa79f;
  --warn:#7d5200; --warn-soft:#fbf1d8; --warn-line:#ecd29a; --bad:#b4303a; --bad-soft:#fdeaea;
  --focus:#1c5fd1; --scrim:rgba(14,20,16,.5);
  --shadow:0 1px 0 rgba(16,24,18,.04), 0 10px 26px -16px rgba(16,24,18,.35);
  --shadow-hero:0 18px 36px -20px rgba(18,58,49,.75);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161c19; --surface-2:#1d2521; --ink:#e7ece8; --ink-2:#aab6ae; --ink-3:#8c998f;
    --line:#29332e; --line-strong:#3f4d46;
    --accent:#4fc9a2; --accent-ink:#04231b; --accent-soft:#163a31;
    --hero:#0f2d27; --hero-2:#1a5547; --hero-ink:#eef8f3; --hero-dim:rgba(238,248,243,.7);
    --net:#4fd39b; --li:#f5bd5e; --hi:#f58b8b; --pen:#7fb5ff; --er:#c3a1ff; --oth:#7d8a83;
    --warn:#f0c060; --warn-soft:#2b2414; --warn-line:#5a4a22; --bad:#ff8c92; --bad-soft:#3a1d20;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -14px rgba(0,0,0,.7); --shadow-hero:0 18px 36px -20px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161c19; --surface-2:#1d2521; --ink:#e7ece8; --ink-2:#aab6ae; --ink-3:#8c998f;
  --line:#29332e; --line-strong:#3f4d46;
  --accent:#4fc9a2; --accent-ink:#04231b; --accent-soft:#163a31;
  --hero:#0f2d27; --hero-2:#1a5547; --hero-ink:#eef8f3; --hero-dim:rgba(238,248,243,.7);
  --net:#4fd39b; --li:#f5bd5e; --hi:#f58b8b; --pen:#7fb5ff; --er:#c3a1ff; --oth:#7d8a83;
  --warn:#f0c060; --warn-soft:#2b2414; --warn-line:#5a4a22; --bad:#ff8c92; --bad-soft:#3a1d20;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -14px rgba(0,0,0,.7); --shadow-hero:0 18px 36px -20px rgba(0,0,0,.9);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:12px 16px calc(24px + env(safe-area-inset-bottom));min-height:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}
svg{flex:none}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,var(--hero-2),var(--hero));color:var(--hero-ink);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.mark small{font-size:8px;font-weight:700;letter-spacing:.14em;opacity:.8;margin-top:3px}
.ttl{flex:1;min-width:0;overflow:hidden}
.ttl h1{margin:0;font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .yr{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .yr b{color:var(--accent);font-weight:700}
.ttl .yr em{font-style:normal;color:var(--warn);font-weight:700}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:transform .12s var(--ease),border-color .15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}

.sample{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:12px;animation:fade .3s var(--ease)}
.sample svg{width:18px;height:18px}
.sample span{flex:1;line-height:1.4}
.sample button{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--warn-line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;color:var(--hero-ink);background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.10),transparent 55%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
  linear-gradient(140deg,var(--hero),var(--hero-2));box-shadow:var(--shadow-hero);margin-bottom:12px;transition:background .3s}
.hero.neg{background:linear-gradient(140deg,#4a1d22,#7a2e35)}
.hero .lbl{font-size:12px;letter-spacing:.14em;color:var(--hero-dim);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.hero .lbl span:last-child{letter-spacing:0;font-weight:600}
.hero .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em;white-space:nowrap}
.hero .big small{font-size:15px;font-weight:700;margin-right:6px;opacity:.75;letter-spacing:.02em}
.hero .big.pulse span{animation:pulse .35s var(--ease)}
.hero .sub{font-size:13px;color:var(--hero-dim);margin-top:2px;min-height:20px}
.hero .sub b{color:var(--hero-ink);font-weight:700}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:12px;background:rgba(0,0,0,.25);gap:2px}
.bar i{display:block;height:100%;transition:flex-basis .45s var(--ease);min-width:0;flex:0 0 0}
.bar i:first-child{border-radius:7px 0 0 7px}
.bar .s-net{background:var(--net)} .bar .s-li{background:var(--li)} .bar .s-hi{background:var(--hi)} .bar .s-pen{background:var(--pen)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.legend div{min-width:0}
.legend .k{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--hero-dim);white-space:nowrap}
.legend .k i{width:8px;height:8px;border-radius:2px;flex:none}
.legend .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .v.zero{opacity:.5}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:800;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 .meta{font-size:12px;letter-spacing:0;color:var(--ink-3);font-weight:500;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field>label,.field>.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:6px;gap:8px}
.field>label small,.field>.lbl small{font-weight:500;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.txt{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);padding:0 12px;font-size:16px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;transition:border-color .15s,box-shadow .15s,background .15s}
.txt::placeholder{color:var(--ink-3);opacity:.55;font-weight:500}
.txt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.txt[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.txt.main{font-size:22px;min-height:54px}
.money{position:relative}
.money .txt{padding-left:50px}
.money::before{content:"NT$";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3);font-weight:800;letter-spacing:.03em;pointer-events:none;font-family:var(--sans)}
.money.main .txt{padding-left:54px}
.money.main::before{font-size:13px;left:14px}
.err{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--bad);margin:6px 2px 0;line-height:1.45;animation:fade .2s var(--ease)}
.err svg{width:15px;height:15px;margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>.field{min-width:0}
.seg{display:grid;border:1px solid var(--line-strong);border-radius:11px;overflow:hidden;background:var(--surface);padding:0}
.seg button{min-height:44px;border:0;background:transparent;cursor:pointer;font-weight:700;border-left:1px solid var(--line);padding:0 4px;white-space:nowrap;transition:background .18s var(--ease),color .18s;position:relative}
.seg button:first-child{border-left:0}
.seg button:active{background:var(--accent-soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] + button{border-left-color:transparent}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.75;line-height:1.1}
.seg7{grid-template-columns:repeat(7,1fr)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg2{grid-template-columns:repeat(2,1fr)}
.hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0}
.hint.diff{display:flex;gap:8px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.hint.diff svg{width:16px;height:16px;margin-top:2px}
.hint.diff b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gradechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gradechips span{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.gradechips b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

/* tabs + rows */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:10px;border:1px solid var(--line)}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;color:var(--ink-2);padding:0 4px;white-space:nowrap;transition:background .18s,color .18s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
[role="tabpanel"].in{animation:fade .22s var(--ease)}
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:center}
.r:first-child{border-top:0}
.r .n{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.r .n i{width:10px;height:10px;border-radius:3px;flex:none}
.r .n .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .d{grid-column:1;font-size:12px;color:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{grid-column:2;grid-row:1/span 2;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.r .v.minus{color:var(--bad)}
.r .v.plus{color:var(--accent)}
.r .v.muted{color:var(--ink-3)}
.r.total{border-top:1.5px solid var(--line-strong);margin-top:4px;padding-top:11px}
.r.total .n{font-weight:800}
.r.total .v{font-size:19px}
.i-net{background:var(--net)} .i-li{background:var(--li)} .i-hi{background:var(--hi)} .i-pen{background:var(--pen)} .i-er{background:var(--er)} .i-oth{background:var(--oth)}
.erbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 10px;background:var(--surface-2);gap:2px}
.erbar i{display:block;height:100%}
.note{font-size:12px;color:var(--ink-3);margin:10px 2px 0;line-height:1.6}
.note b{color:var(--ink-2)}
.taxbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.taxbox .h{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.taxgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.taxgrid div{min-width:0}
.taxgrid .k{font-size:11px;color:var(--ink-3)}
.taxgrid .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 16px;cursor:pointer;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),filter .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled="true"]{opacity:.5}
.btn.ghost{background:transparent}
.btn.sm{flex:0 0 auto;min-height:44px;padding:0 14px;font-size:14px}
.foot{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink-3);line-height:1.6;margin:4px 0 0;padding:12px;border:1px dashed var(--line-strong);border-radius:14px}
.foot .ft{flex:1;min-width:0}
.foot .ft strong{color:var(--ink-2)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:8px 16px 0;box-shadow:var(--shadow);animation:up .28s var(--ease)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet h2:focus{outline:none}
.sheet .lead{display:flex;gap:8px;font-size:13px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px;padding:8px 10px;margin:6px 0 12px;line-height:1.5}
.sheet .lead svg{width:16px;height:16px;margin-top:2px}
.grp{margin:16px 0 4px;font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--ink-3)}
.grp:first-of-type{margin-top:4px}
.sheet .field>label{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:5px}
.sheet .field>label>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sheet .field>label .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.sheet .row2 .field{margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{opacity:.55}100%{opacity:1}}
.sheet .txt{font-size:16px}
.ta{width:100%;min-height:92px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);padding:10px 12px;font-family:var(--mono);font-size:14px;line-height:1.5;resize:vertical}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.ta[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.unit{position:relative}
.unit .txt{padding-right:44px}
.unit::after{content:attr(data-u);position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);font-weight:700;pointer-events:none}
.sheetact{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheetact .btn.ghost{flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;min-height:48px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);font-size:14px;display:flex;align-items:center;gap:12px;animation:toastIn .26s var(--ease)}
.toast.plain{padding-right:16px}
.toast button{min-height:40px;min-width:64px;border-radius:10px;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:800;cursor:pointer;padding:0 12px}
@keyframes toastIn{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

@media (hover:hover){
  .iconbtn:hover,.btn:hover{border-color:var(--ink-3)}
  .btn.primary:hover{filter:brightness(1.07)}
  .seg button:not([aria-pressed="true"]):hover,.tabs button:not([aria-selected="true"]):hover{background:var(--surface-2)}
}
@media (min-width:860px){
  body{padding:24px 32px 32px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .right{position:sticky;top:24px}
  .hero .big{font-size:44px}
  .scrim{align-items:center}
  .sheet{border-radius:18px;max-height:86%}
  .sheet .grab{display:none}
}
@media (max-width:360px){ .hero .big{font-size:32px} .legend{grid-template-columns:repeat(2,1fr)} .seg7 button{font-size:14px} .taxgrid .v{font-size:12px} }
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">薪資<small>PAY</small></div>
    <div class="ttl">
      <h1>薪資與勞健保試算</h1>
      <div class="yr" id="yearLine"></div>
    </div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="切換主題"></button>
    <button class="iconbtn" id="setBtn" type="button" aria-label="費率與級距設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <div class="sample" id="sampleBar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>這是範例數字，改成你的薪資就好。</span>
    <button id="sampleClear" type="button">清空重填</button>
  </div>

  <div class="layout">
    <div class="right">
      <section class="hero" id="hero" aria-labelledby="hNet">

<script>
(() => {
'use strict';
/*CORE-START*/
// ===== 費率與分級表資料（2026 年／民國 115 年版，依記憶整理，未連網核對） =====
// 每年可能調整：請以勞動部勞工保險局、衛福部中央健康保險署公告為準；所有數值都能在「費率與級距設定」修改。
const DATA = {
  year: 2026, roc: 115,
  minWage: 29500,
  liRate: 11.5, eiRate: 1.0, liEmpShare: 20, liErShare: 70,   // 勞保普通事故、就業保險（%）；負擔比例 勞工 20%／雇主 70%
  oiRate: 0.2, wfRate: 0.025,                                   // 職災保險（行業平均，雇主全額）、積欠工資墊償基金（雇主全額）
  hiRate: 5.17, hiEmpShare: 30, hiErShare: 60, avgDep: 0.56, maxDep: 3,
  pensionEr: 6, selfMax: 6,
  suppRate: 2.11, suppMult: 4,
  liTop: 45800, oiTop: 72800, hiTop: 219500, pensionTop: 150000,
  // 投保薪資級距（勞保／職災／健保／勞退共用）。低於基本工資的級距只給部分工時使用；基本工資本身永遠是一級。
  grades: [11100, 12540, 13500, 15840, 16500, 17280, 17880, 19047, 20008, 21009, 22000, 23100, 24000, 25250, 26400, 27600, 28800,
    30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800,
    48200, 50600, 53000, 55400, 57800, 60800, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600,
    101100, 105600, 110100, 115500, 120900, 126300, 131700, 137100, 142500, 147900, 150000,
    156400, 162800, 169200, 175600, 182000, 189500, 197000, 204500, 212000, 219500],
  // 勞退月提繳工資另有的低級距（部分工時）
  penLow: [1500, 3000, 4500, 6000, 7500, 8700, 9900]
};
// 可在設定修改的數值：[key, 最小, 最大]
const NUM_KEYS = [['minWage', 1000, 500000], ['liRate', 0, 50], ['eiRate', 0, 20], ['liEmpShare', 0, 100], ['liErShare', 0, 100],
  ['oiRate', 0, 10], ['wfRate', 0, 5], ['hiRate', 0, 30], ['hiEmpShare', 0, 100], ['hiErShare', 0, 100], ['avgDep', 0, 5], ['maxDep', 0, 10],
  ['pensionEr', 0, 20], ['suppRate', 0, 20], ['suppMult', 0, 20], ['liTop', 1000, 9999999], ['oiTop', 1000, 9999999], ['hiTop', 1000, 9999999], ['pensionTop', 1000, 9999999]];
const SC = {
  DATA, NUM_KEYS,
  defaults() { const d = {}; for (const [k] of NUM_KEYS) d[k] = DATA[k]; d.grades = DATA.grades.slice(); d.penLow = DATA.penLow.slice(); return d; },
  // 解析數字表：遞增、不重複的正整數
  parseList(s) {
    const parts = String(s == null ? '' : s).replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 65248)).replace(/(\d),(\d{3})(?!\d)/g, '$1$2')
      .replace(/[，、；;\n\r\t]/g, ',').split(/[,\s]+/).filter(Boolean);
    if (!parts.length) return { ok: false, msg: '至少要有一個數字' };
    const out = [];
    for (const p of parts) {
      const n = +p;
      if (!/^\d+$/.test(p) || !(n > 0)) return { ok: false, msg: `「${p.slice(0, 12)}」不是正整數` };
      if (out.length && n <= out[out.length - 1]) return { ok: false, msg: `級距要由小到大且不重複（${out[out.length - 1]} 之後是 ${n}）` };
      out.push(n);
    }
    return { ok: true, value: out };
  },
  // 把任意設定物件整理成合法設定（不合法的欄位用預設值）
  clean(raw) {
    const c = SC.defaults();
    if (!raw || typeof raw !== 'object') return c;
    for (const [k, lo, hi] of NUM_KEYS) { const v = raw[k]; if (v !== '' && v != null && Number.isFinite(+v) && +v >= lo && +v <= hi) c[k] = +v; }
    c.maxDep = Math.floor(c.maxDep);
    for (const k of ['grades', 'penLow']) if (Array.isArray(raw[k])) { const p = SC.parseList(raw[k].join(',')); if (p.ok) c[k] = p.value; }
    return c;
  },
  // 寬鬆的金額解析：全形數字、逗號、NT$、元、萬、k
  parseNum(v, opt) {
    opt = opt || {};
    let s = String(v == null ? '' : v).trim();
    s = s.replace(/[０-９．，－]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 65248)).replace(/[＄]/g, '$');
    s = s.replace(/^(nt\$?|ntd|新台幣|新臺幣|\$)\s*/i, '').replace(/\s*(元|塊|nt|ntd)$/i, '').replace(/[,\s_]/g, '');
    if (s === '') return { ok: true, value: 0, empty: true };
    if (/^-/.test(s)) return { ok: false, msg: '不能是負數' };
    let mult = 1;
    const m = s.match(/^(\d*\.?\d+)(萬|w|W|千|k|K)?$/);
    if (!m) return { ok: false, msg: `看不懂「${String(v).trim().slice(0, 12)}」，請只輸入數字` + (opt.months ? '，例如 1.5' : '，例如 42000 或 4.2萬') };
    if (m[2]) { if (opt.months) return { ok: false, msg: '年終請輸入月數，例如 1.5' }; mult = /萬|w/i.test(m[2]) ? 10000 : 1000; }
    let n = parseFloat(m[1]) * mult;
    if (!opt.months) n = Math.round(n);
    const max = opt.max == null ? 9999999 : opt.max;
    if (n > max) return { ok: false, msg: opt.months ? `年終月數請在 0～${max} 之間` : `金額太大（上限 ${SC.fmt(max)}）` };
    return { ok: true, value: n };
  },
  // 某一險種的完整級距（由低到高）。kind: li 勞保、oi 職災、hi 健保、pen 勞退；part: 部分工時
  grades(kind, cfg, part) {
    const c = cfg, mw = c.minWage, top = Math.max(mw, c[{ li: 'liTop', oi: 'oiTop', hi: 'hiTop', pen: 'pensionTop' }[kind]]);
    const table = kind === 'pen' ? [...c.penLow.filter(g => g < (c.grades[0] || Infinity)), ...c.grades] : c.grades;
    const low = part && kind !== 'hi' ? table.filter(g => g < mw) : [];
    const mid = c.grades.filter(g => g > mw && g < top);
    return top > mw ? [...low, mw, ...mid, top] : [...low, mw];
  },
  // 查級距：取第一個 ≥ 金額的級距；超過最高級距以最高計；低於最低級距以最低計
  grade(kind, amount, cfg, part) {
    const gs = SC.grades(kind, cfg, part);
    for (const g of gs) if (amount <= g) return g;
    return gs[gs.length - 1];
  },
  round: x => Math.round(x + 1e-9),
  // 主計算。inp: {salary, allow, dep, selfRate, insured(null=依實際), bonusMonths, part, hiIn}
  calc(inp, cfg) {
    const c = SC.clean(Object.assign(SC.defaults(), cfg || {}));
    const R = SC.round, P = x => x / 100;
    const nn = v => { const n = +v; return Number.isFinite(n) && n > 0 ? n : 0; };
    const salary = R(nn(inp.salary)), allow = R(nn(inp.allow));
    const gross = salary + allow;
    const part = !!inp.part, hiIn = !part || inp.hiIn !== false;
    const dep = Math.min(c.maxDep, Math.floor(nn(inp.dep)));
    const selfRate = Math.min(DATA.selfMax, nn(inp.selfRate));
    const insBase = nn(inp.insured) > 0 && inp.insured !== '' ? R(nn(inp.insured)) : gross;
    const liG = SC.grade('li', insBase, c, part), oiG = SC.grade('oi', insBase, c, part), hiG = hiIn ? SC.grade('hi', insBase, c, part) : 0, pG = SC.grade('pen', insBase, c, part);
    // 勞保普通事故與就業保險分開計算、各自四捨五入（同勞保局分擔金額表）
    const liEmpN = R(liG * P(c.liRate) * P(c.liEmpShare)), liEmpE = R(liG * P(c.eiRate) * P(c.liEmpShare));
    const liEmp = liEmpN + liEmpE;
    const hiPer = R(hiG * P(c.hiRate) * P(c.hiEmpShare));          // 每人保費先四捨五入再乘人數
    const hiPeople = hiIn ? 1 + dep : 0;
    const hiEmp = hiPer * hiPeople;
    const selfPen = R(pG * selfRate / 100);
    const deduct = liEmp + hiEmp + selfPen;
    const net = gross - deduct;
    const liEr = R(liG * P(c.liRate) * P(c.liErShare)) + R(liG * P(c.eiRate) * P(c.liErShare));
    const oi = R(oiG * P(c.oiRate));
    const wf = R(liG * P(c.wfRate));
    const hiEr = R(hiG * P(c.hiRate) * P(c.hiErShare) * (1 + c.avgDep));
    const penEr = R(pG * P(c.pensionEr));
    const erExtra = liEr + oi + wf + hiEr + penEr;
    const erTotal = gross + erExtra;
    // 年度：×12 加年終；年終超過當月健保投保金額 suppMult 倍的部分課補充保費
    const bonusM = Math.min(24, nn(inp.bonusMonths));
    const bonus = R(salary * bonusM);
    const suppBase = hiIn ? Math.max(0, bonus - hiG * c.suppMult) : 0;
    const supp = R(suppBase * P(c.suppRate));
    const self = selfPen * 12;
    const year = {
      gross: gross * 12 + bonus, bonus, li: liEmp * 12, hi: hiEmp * 12, self, supp, suppBase,
      net: net * 12 + bonus - supp, erTotal: erTotal * 12 + bonus, erExtra: erExtra * 12, penEr: penEr * 12, bonusMonths: bonusM,
      taxSave: [5, 12, 20, 30, 40].map(t => [t, R(self * t / 100)])
    };
    return { gross, salary, allow, dep, selfRate, part, hiIn, insBase, underInsured: insBase < gross, belowMin: !part && gross > 0 && gross < c.minWage,
      liG, oiG, hiG, pG, liEmpN, liEmpE, liEmp, hiPer, hiPeople, hiEmp, selfPen, deduct, net,
      liEr, oi, wf, hiEr, penEr, erExtra, erTotal, year, cfg: c };
  },
  fmt: n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','),
  pct: x => (Math.round(x * 1000) / 1000).toString(),
  // 複製用純文字
  text(r) {
    const f = SC.fmt, c = r.cfg, L = [];
    L.push(`【薪資試算】依 ${DATA.year} 年（民國 ${DATA.roc} 年）費率${SC.isCustom(c) ? '（已自訂）' : ''}`);
    L.push(`${r.part ? '部分工時' : '全職'}・月薪 ${f(r.salary)}${r.allow ? '＋津貼 ' + f(r.allow) : ''}＝總額 ${f(r.gross)}`);
    L.push(`投保薪資 ${f(r.insBase)}${r.underInsured ? '（低於實際薪資）' : ''}：勞保 ${f(r.liG)}／${r.hiIn ? '健保 ' + f(r.hiG) : '健保未在此投保'}／勞退 ${f(r.pG)}`);
    L.push(`－勞保（含就保）${SC.pct(c.liRate + c.eiRate)}%×${SC.pct(c.liEmpShare)}%：${f(r.liEmp)}`);
    L.push(r.hiIn ? `－健保 ${SC.pct(c.hiRate)}%×${SC.pct(c.hiEmpShare)}%×${r.hiPeople} 人：${f(r.hiEmp)}` : '－健保：未在此投保 0');
    if (r.selfPen) L.push(`－勞退自提 ${r.selfRate}%：${f(r.selfPen)}`);
    L.push(`＝每月實領（稅前）${f(r.net)}`);
    L.push('');
    L.push(`雇主每月成本 ${f(r.erTotal)}：勞保 ${f(r.liEr)}＋職災 ${f(r.oi)}＋墊償 ${f(r.wf)}＋健保 ${f(r.hiEr)}＋勞退 ${SC.pct(c.pensionEr)}% ${f(r.penEr)}`);
    const y = r.year;
    L.push(`年度（含年終 ${y.bonusMonths} 個月）：總額 ${f(y.gross)}，扣勞健保自提 ${f(y.li + y.hi + y.self)}${y.supp ? '，補充保費 ' + f(y.supp) : ''}，實領 ${f(y.net)}`);
    L.push('※ 未含所得稅扣繳；費率與級距請以勞保局、健保署公告為準。');
    return L.join('\n');
  },
  isCustom(c) {
    const d = SC.defaults();
    return NUM_KEYS.some(([k]) => c[k] !== d[k]) || c.grades.join() !== d.grades.join() || c.penLow.join() !== d.penLow.join();
  }
};
/*CORE-END*/

const KEY_IN = 'salary-calc:v1:input', KEY_CFG = 'salary-calc:v1:rates', KEY_THEME = 'salary-calc:v1:theme';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} };
const ICO = {
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>'
};

/* ---------- state ---------- */
const SAMPLE = { salary: 42000, allow: 3000, bonusMonths: 1.5, dep: 1, selfRate: 6, insMode: 'auto', insured: '', part: false, hiIn: true, sample: true };
let S = { ...SAMPLE };
let cfg = SC.defaults();
let tab = 'emp';
const bad = {};   // 欄位 id → 錯誤訊息
try {
  const raw = JSON.parse(lsGet(KEY_IN) || 'null');
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
    S = { ...SAMPLE, sample: false };
    for (const k of ['salary', 'allow', 'bonusMonths']) if (Number.isFinite(+raw[k])) S[k] = Math.max(0, +raw[k]);
    S.bonusMonths = Math.min(24, S.bonusMonths);
    if ([0, 1, 2, 3].includes(raw.dep)) S.dep = raw.dep;
    if (Number.isInteger(raw.selfRate) && raw.selfRate >= 0 && raw.selfRate <= 6) S.selfRate = raw.selfRate;

/* ---------- copy / share ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function guard() {
  if (Object.keys(bad).length) { toast('請先修正標紅的欄位'); return false; }
  if (!last || !last.gross) { toast('請先輸入月薪'); $('#salary').focus(); return false; }
  return true;
}
$('#copyBtn').addEventListener('click', async () => {
  if (!guard()) return;
  const ok = await copyText(SC.text(last)); buzz(12);
  toast(ok ? '已複製試算結果，可以貼到訊息或筆記' : '無法複製，請改用分享或手動選取');
});
if (navigator.share) $('#shareBtn').hidden = false;
$('#shareBtn').addEventListener('click', async () => {
  if (!guard()) return;
  try { await navigator.share({ title: '薪資試算', text: SC.text(last) }); } catch (e) { if (e && e.name !== 'AbortError') toast('無法分享，請改用複製'); }
});

  const d = SC.defaults();
  const fld = ([k, n, u]) => `<div class="field"><label for="cfg-${k}"><span>${n}<i class="dot" id="dot-${k}" hidden></i></span><small>預設 ${fmtCfg(k, d[k])}</small></label><div class="unit" data-u="${u}"><input class="txt" id="cfg-${k}" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${fmtCfg(k, cfg[k])}" aria-describedby="err-cfg-${k}"></div><div class="err" id="err-cfg-${k}" hidden></div></div>`;
  $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="grab"></div>
    <h2 id="shT" tabindex="-1">費率與級距設定</h2>
    <div class="lead">${ICO.info}<span>依 ${DATA.year} 年（民國 ${DATA.roc} 年）資料，如有調整可自行修改。改動立即生效，只存在這台裝置。</span></div>
    ${GROUPS.map(([g, fs]) => `<div class="grp">${g}</div><div class="row2">${fs.map(fld).join('')}</div>`).join('')}
    <div class="grp">級距表</div>
    <div class="field"><label for="cfg-grades"><span>投保薪資級距（勞保／職災／健保／勞退共用）<i class="dot" id="dot-grades" hidden></i></span></label>
      <textarea class="ta" id="cfg-grades" rows="5" spellcheck="false" aria-describedby="err-cfg-grades">${cfg.grades.join(', ')}</textarea>
      <div class="hint" id="cnt-grades"></div><div class="err" id="err-cfg-grades" hidden></div></div>
    <div class="field"><label for="cfg-penLow"><span>勞退額外低級距（部分工時）<i class="dot" id="dot-penLow" hidden></i></span></label>
      <textarea class="ta" id="cfg-penLow" rows="2" spellcheck="false" style="min-height:56px" aria-describedby="err-cfg-penLow">${cfg.penLow.join(', ')}</textarea>
      <div class="err" id="err-cfg-penLow" hidden></div></div>
    <p class="note">基本工資本身一定是一級；低於基本工資的級距只套用在「部分工時」，健保最低以基本工資計。各險種從表中取到各自的最高級距為止。</p>
    <div class="sheetact"><button class="btn ghost" id="cfgReset" type="button">恢復預設</button><button class="btn primary" id="cfgDone" type="button">完成</button></div>
  </div></div>`;
  const ranges = Object.fromEntries(NUM_KEYS.map(([k, lo, hi]) => [k, [lo, hi]]));
  const fieldErr = (k, msg) => { const el = $('#cfg-' + k), b = $('#err-cfg-' + k); if (msg) { el.setAttribute('aria-invalid', 'true'); b.innerHTML = ICO.warn + `<span>${esc(msg)}</span>`; b.hidden = false; } else { el.removeAttribute('aria-invalid'); b.hidden = true; } };
  const marks = () => {
    for (const [k] of NUM_KEYS) $('#dot-' + k).hidden = cfg[k] === d[k];
    for (const k of ['grades', 'penLow']) $('#dot-' + k).hidden = cfg[k].join() === d[k].join();
    $('#cnt-grades').textContent = `共 ${cfg.grades.length} 級，${SC.fmt(cfg.grades[0])}～${SC.fmt(cfg.grades[cfg.grades.length - 1])}`;
  };
  const apply = e => {
    const el = e.target, k = el.dataset ? (el.dataset.k || el.id.replace('cfg-', '')) : '';
    if (k === 'grades' || k === 'penLow') {
      const p = SC.parseList(el.value);
      if (!p.ok) return fieldErr(k, p.msg);
      fieldErr(k, ''); cfg[k] = p.value;
    } else if (ranges[k]) {
      const t = el.value.replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 65248)).replace(/[,\s%％元人倍]/g, '');
      const [lo, hi] = ranges[k], v = +t;
      if (t === '') return fieldErr(k, `請輸入數字（預設 ${fmtCfg(k, d[k])}）`);
      if (!/^\d*\.?\d+$/.test(t) || !Number.isFinite(v)) return fieldErr(k, `「${el.value.trim().slice(0, 12)}」不是數字`);
      if (v < lo || v > hi) return fieldErr(k, `請輸入 ${fmtCfg(k, lo)}～${fmtCfg(k, hi)} 之間的數字`);
      if (k === 'maxDep' && !Number.isInteger(v)) return fieldErr(k, '請輸入整數');
      fieldErr(k, ''); cfg[k] = v;
    } else return;
    saveCfg(); marks(); render(false);
  };
  $('#layer').addEventListener('input', apply);
  $('#layer').addEventListener('focusout', e => { const k = e.target.dataset && e.target.dataset.k; if (k && !e.target.getAttribute('aria-invalid')) e.target.value = fmtCfg(k, cfg[k]); });
  $('#cfgReset').addEventListener('click', () => {
    const prev = JSON.parse(JSON.stringify(cfg));
    cfg = SC.defaults(); saveCfg(); fillCfg(); render(false); buzz();
    toast('已恢復預設費率', '復原', () => { cfg = SC.clean(prev); saveCfg(); if ($('#scrim')) fillCfg(); render(false); });
  });
  const fillCfg = () => { for (const [k] of NUM_KEYS) { $('#cfg-' + k).value = fmtCfg(k, cfg[k]); fieldErr(k, ''); } for (const k of ['grades', 'penLow']) { $('#cfg-' + k).value = cfg[k].join(', '); fieldErr(k, ''); } marks(); };
  $('#cfgDone').addEventListener('click', closeSettings);
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSettings(); });
  marks();
  $('#shT').focus({ preventScroll: true });
}
function closeSettings() { $('#layer').innerHTML = ''; $('#setBtn').focus({ preventScroll: true }); }
$('#setBtn').addEventListener('click', openSettings);
$('#footSet').addEventListener('click', openSettings);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scrim')) closeSettings(); });

render(true);
window.__salaryCalc = { SC, get state() { return S; }, get cfg() { return cfg; }, get last() { return last; } };
})();
</script>
