/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
(function () {
'use strict';
const canvas = document.getElementById('c');
const failEl = document.getElementById('fail');
const hintEl = document.getElementById('hint');
const bRain = document.getElementById('bRain');
const bOrbit = document.getElementById('bOrbit');
const bCalm = document.getElementById('bCalm');
const reloadBtn = document.getElementById('bReload');

function fail(msg) {
  failEl.querySelector('p').textContent = msg;
  failEl.hidden = false;
  document.querySelector('.bar').style.display = 'none';
  hintEl.style.display = 'none';
}

const coarse = window.matchMedia('(pointer: coarse)').matches;
const small = Math.min(screen.width, screen.height) < 700;
const mobile = coarse || small;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
hintEl.textContent = (coarse ? '輕觸激起漣漪・雙指拖曳轉視角' : '點擊拖曳激起漣漪・右鍵拖曳轉動・滾輪縮放') + '\n用漣漪把葉子推進光圈';

/* ---------- WebGL context ---------- */
const ctxOpts = { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' };
let gl = null, isGL2 = false;
try {
  gl = canvas.getContext('webgl2', ctxOpts);
  isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', ctxOpts) || canvas.getContext('experimental-webgl', ctxOpts);
} catch (e) { gl = null; }
if (!gl) { fail('你的瀏覽器沒有啟用 WebGL，無法繪製水面。請改用較新的瀏覽器，或開啟硬體加速。'); return; }

function tryFormat(internal, format, type, linear) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  let ok = false;
  try {
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, type, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fb);
  } catch (e) { ok = false; }
  gl.deleteTexture(t);
  while (gl.getError() !== gl.NO_ERROR) { /* drain */ }
  return ok ? { internal, format, type, linear } : null;
}
let fmt = null;
if (isGL2) {
  const cbf = gl.getExtension('EXT_color_buffer_float');
  const cbh = gl.getExtension('EXT_color_buffer_half_float');
  if (cbf || cbh) fmt = tryFormat(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, true);
  if (!fmt && cbf) fmt = tryFormat(gl.RGBA32F, gl.RGBA, gl.FLOAT, !!gl.getExtension('OES_texture_float_linear'));
} else {
  const hf = gl.getExtension('OES_texture_half_float');
  if (hf) {
    gl.getExtension('EXT_color_buffer_half_float');
    fmt = tryFormat(gl.RGBA, gl.RGBA, hf.HALF_FLOAT_OES, !!gl.getExtension('OES_texture_half_float_linear'));
  }
  if (!fmt && gl.getExtension('OES_texture_float')) {
    gl.getExtension('WEBGL_color_buffer_float');
    fmt = tryFormat(gl.RGBA, gl.RGBA, gl.FLOAT, !!gl.getExtension('OES_texture_float_linear'));
  }

if (!fmt) { fail('此裝置的 WebGL 不支援浮點紋理，無法進行水波模擬。'); return; }

/* ---------- shaders ---------- */
const HEAD = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
const VS = 'attribute vec2 a; varying vec2 vUv; void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.0,1.0); }';

const FS_DROP = HEAD + `
varying vec2 vUv;
uniform sampler2D uState;
uniform vec4 uDrops[8];
uniform int uCount;
void main(){
  vec4 s = texture2D(uState, vUv);
  for (int i = 0; i < 8; i++) {
    if (i >= uCount) break;
    vec4 d = uDrops[i];
    float k = max(0.0, 1.0 - length(vUv - d.xy) / d.z);
    s.r += (0.5 - 0.5 * cos(k * 3.14159265)) * d.w;
  }
  gl_FragColor = s;
}`;

const FS_UPDATE = HEAD + `
varying vec2 vUv;
uniform sampler2D uState;
uniform vec2 uTexel;
uniform float uEdge;
void main(){
  vec4 s = texture2D(uState, vUv);
  float avg = 0.25 * (
    texture2D(uState, vUv - vec2(uTexel.x, 0.0)).r +
    texture2D(uState, vUv + vec2(uTexel.x, 0.0)).r +
    texture2D(uState, vUv - vec2(0.0, uTexel.y)).r +
    texture2D(uState, vUv + vec2(0.0, uTexel.y)).r);
  s.g += (avg - s.r) * 2.0;
  vec2 e = min(vUv, 1.0 - vUv);
  float edge = smoothstep(0.0, uEdge, min(e.x, e.y));
  s.g *= mix(0.86, 0.996, edge);
  s.r += s.g;
  s.r *= mix(0.94, 0.9993, edge);
  gl_FragColor = s;
}`;

const FS_DERIVE = HEAD + `
varying vec2 vUv;
uniform sampler2D uState;
uniform vec2 uTexel;
uniform float uCell;
uniform float uK;
float H(float x, float y){ return texture2D(uState, vUv + vec2(x, y) * uTexel).r; }
void main(){
  float c = H(0.0, 0.0), l = H(-1.0, 0.0), r = H(1.0, 0.0), d = H(0.0, -1.0), u = H(0.0, 1.0);
  float c2 = uCell * uCell;
  float gx = (r - l) / (2.0 * uCell);
  float gz = (u - d) / (2.0 * uCell);
  float hxx = (r - 2.0 * c + l) / c2;
  float hzz = (u - 2.0 * c + d) / c2;
  float hxz = (H(1.0, 1.0) - H(1.0, -1.0) - H(-1.0, 1.0) + H(-1.0, -1.0)) / (4.0 * c2);
  float a = 1.0 + uK * hxx, e = 1.0 + uK * hzz, b = uK * hxz;
  float det = a * e - b * b;
  float caus = min(1.0 / max(abs(det), 0.2), 4.0);
  gl_FragColor = vec4(gx, gz, caus, c);
}`;

const FS_SAND = HEAD + `
varying vec2 vUv;
vec2 h2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float h1(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 15731.743); }
float pn(vec2 p, float per){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = h1(mod(i, per)), b = h1(mod(i + vec2(1.0, 0.0), per));
  float c = h1(mod(i + vec2(0.0, 1.0), per)), d = h1(mod(i + 1.0, per));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec3 pebCol(float k){
  return k < 0.28 ? vec3(0.60, 0.62, 0.62) : k < 0.48 ? vec3(0.86, 0.83, 0.77) : k < 0.68 ? vec3(0.58, 0.44, 0.32)
       : k < 0.84 ? vec3(0.38, 0.38, 0.37) : vec3(0.72, 0.58, 0.47);
}
// returns rgb shaded pebble, a = coverage; near = distance ratio to nearest pebble (for AO)
vec4 layer(vec2 uv, float G, float presence, float rmin, float rmax, float seed, out float near){
  vec2 p = uv * G; vec2 ip = floor(p); vec2 fp = fract(p);
  float best = 9.0; vec3 col = vec3(0.0); near = 9.0;
  vec3 L = normalize(vec3(-0.45, 0.5, 0.75));
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(float(i), float(j));
    vec2 id = mod(ip + o, G);
    vec2 h = h2(id + seed);
    if (h.y > presence) continue;
    vec2 g = h2(id * 1.7 + seed + 3.1);
    vec2 c = o + 0.25 + 0.5 * g;
    float r = mix(rmin, rmax, h.x);
    vec2 d = fp - c;
    float an = h.x * 6.2831;
    float cs = cos(an), sn = sin(an);
    d = vec2(cs * d.x - sn * d.y, sn * d.x + cs * d.y);
    d.x *= 1.0 + 0.7 * g.y;
    float dd = length(d) / r;
    near = min(near, dd);
    if (dd < best) {
      best = dd;
      float z = sqrt(max(1.0 - dd * dd, 0.0));
      vec3 n = normalize(vec3(d / r, z * 1.3 + 0.05));
      float sh = 0.42 + 0.68 * max(dot(n, L), 0.0);
      float spk = pn(p * 9.0, G * 9.0);
      col = pebCol(fract(g.x * 7.13 + h.y * 3.1)) * sh * (0.88 + 0.22 * spk);
      col += pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 18.0) * 0.12;
    }
  }
  return vec4(col, 1.0 - smoothstep(0.9, 1.0, best));
}
void main(){
  vec2 uv = vUv;
  float n1 = pn(uv * 64.0, 64.0), n2 = pn(uv * 192.0, 192.0), n3 = pn(uv * 8.0, 8.0), n4 = pn(uv * 24.0, 24.0);
  vec3 sand = vec3(0.86, 0.76, 0.58) * (0.8 + 0.16 * n1 + 0.14 * n2);
  sand = mix(sand, vec3(0.70, 0.62, 0.48), smoothstep(0.45, 0.8, n3 * 0.7 + n4 * 0.3) * 0.6);
  float grain = h1(floor(uv * 512.0));
  sand *= grain > 0.965 ? 1.25 : (grain < 0.05 ? 0.78 : 1.0);
  float nearA, nearB;
  vec4 gravel = layer(uv, 28.0, 0.22, 0.22, 0.42, 11.0, nearA);
  vec4 peb = layer(uv, 9.0, 0.3, 0.26, 0.46, 2.0, nearB);
  float ao = smoothstep(0.95, 1.4, nearA) * 0.4 + 0.6;
  ao *= smoothstep(0.95, 1.35, nearB) * 0.45 + 0.55;
  vec3 col = sand * ao;
  col = mix(col, gravel.rgb * (smoothstep(0.95, 1.35, nearB) * 0.4 + 0.6), gravel.a);
  col = mix(col, peb.rgb, peb.a);
  gl_FragColor = vec4(col, 1.0);
}`;

const FS_RENDER = HEAD + `
uniform vec2 uRes;
uniform vec3 uEye, uRight, uUp, uFwd, uSun;
uniform float uTanV, uTime, uRain, uWS, uNight, uDusk;
uniform vec2 uRsOff;
uniform sampler2D uDer, uSand;
uniform vec4 uLeaf[3];
uniform vec3 uLeafCol[3];
uniform vec4 uRing;
uniform vec4 uFish[4];
float fishMask(vec2 xz, vec4 F, float soft){
  vec2 d = xz - F.xy; float c = cos(F.z), s = sin(F.z);
  vec2 q = vec2(c * d.x + s * d.y, -s * d.x + c * d.y) / F.w;
  float body = length(vec2(q.x * 0.55, q.y * 1.6)) - 0.5;
  float tq = clamp((-q.x - 0.75) / 0.42, 0.0, 1.0);
  float tail = step(-1.2, q.x) * step(q.x, -0.72) * (1.0 - smoothstep(0.0, soft * 4.0, abs(q.y) - 0.28 * tq));
  return max(1.0 - smoothstep(-soft, soft, body), tail);
}
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + 1.0), f.x), f.y);
}
vec3 sky(vec3 d, bool clouds){
  float y = clamp(d.y, 0.0, 1.0);
  vec3 zen = mix(vec3(0.13, 0.40, 0.74), vec3(0.34, 0.40, 0.48), uRain);
  vec3 hor = mix(vec3(0.80, 0.90, 0.94), vec3(0.60, 0.65, 0.69), uRain);
  zen = mix(zen, vec3(0.28, 0.22, 0.46), uDusk); hor = mix(hor, vec3(1.0, 0.66, 0.42), uDusk);
  zen = mix(zen, vec3(0.02, 0.05, 0.13), uNight); hor = mix(hor, vec3(0.08, 0.15, 0.24), uNight);
  vec3 c = mix(hor, zen, pow(y, 0.5));
  if (clouds && d.y > 0.02) {
    vec2 p = d.xz / (d.y + 0.08) * 0.6 + vec2(uTime * 0.006, uTime * 0.002);
    float n = vnoise(p * 1.5) * 0.6 + vnoise(p * 3.7) * 0.3 + vnoise(p * 8.0) * 0.1;
    float cl = smoothstep(0.48 - 0.25 * uRain, 0.85, n) * smoothstep(0.02, 0.25, d.y);
    c = mix(c, mix(mix(vec3(1.0), vec3(1.0, 0.72, 0.6), uDusk), vec3(0.72, 0.74, 0.77), uRain) * (1.0 - 0.82 * uNight), cl * 0.85);

vec2 leafQ(vec2 xz, vec4 L){

  float m = (1.0 - smoothstep(-soft, soft, abs(q.y) - w)) * step(abs(t), 1.0);
  float stem = (1.0 - smoothstep(0.008, 0.008 + soft, abs(q.y + 0.02 * (t + 1.0)))) * step(-1.28, t) * step(t, -0.9);

  float a = sin(q.x * 3.1 + t * 0.7) + sin(q.y * 3.4 - t * 0.9) + sin((q.x - q.y) * 2.3 + t * 0.5);
  float b = sin(q.x * 4.3 - t * 0.6) + sin(q.y * 3.9 + t * 0.8) + sin((q.x + q.y) * 2.9 - t * 0.4);

    vec3 trans = exp(-vec3(1.5, 0.36, 0.3) * (L + depth * 0.5));
    vec3 water = vec3(0.05, 0.32, 0.36) * (1.0 - uRain * 0.35) * (1.0 - 0.75 * uNight);

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
    throw new Error(gl.getShaderInfoLog(s) || 'shader error');
  }
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(gl.getProgramInfoLog(p) || 'link error');
  return { p, u: Object.create(null) };
}
function U(pr, name) {
  let l = pr.u[name];
  if (l === undefined) l = pr.u[name] = gl.getUniformLocation(pr.p, name);
  return l;
}

let P;
try {
  P = { drop: program(FS_DROP), update: program(FS_UPDATE), derive: program(FS_DERIVE), sand: program(FS_SAND), render: program(FS_RENDER) };
} catch (e) {
  console.warn(e);
  fail('著色器無法在此裝置上編譯，無法繪製水面。');
  return;
}

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.disable(gl.DEPTH_TEST);
gl.disable(gl.BLEND);

function makeTarget(w, h, internal, format, type, filter, wrap) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter === gl.LINEAR_MIPMAP_LINEAR ? gl.LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { t, fb, w, h };
}

/* The rippling pool spans world [-WS, WS]^2: wide enough that taps reach it from almost all of the visible water
   (it used to be [-1, 1], which left the upper three quarters of a portrait screen dead to touch). The cell size is
   within 15% of what it always was, so ripples look the same. */
const WS = 4;
const N = mobile ? 448 : 512;
const CELL = 2 * WS / N;
const simA = makeTarget(N, N, fmt.internal, fmt.format, fmt.type, gl.NEAREST, gl.CLAMP_TO_EDGE);
const simB = makeTarget(N, N, fmt.internal, fmt.format, fmt.type, gl.NEAREST, gl.CLAMP_TO_EDGE);
const der = makeTarget(N, N, fmt.internal, fmt.format, fmt.type, fmt.linear ? gl.LINEAR : gl.NEAREST, gl.CLAMP_TO_EDGE);
let cur = simA, nxt = simB;

/* bake the pebbly sand bed once */
const SAND = 512;
const sand = makeTarget(SAND, SAND, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR, gl.REPEAT);
gl.bindFramebuffer(gl.FRAMEBUFFER, sand.fb);
gl.viewport(0, 0, SAND, SAND);
gl.useProgram(P.sand.p);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
gl.bindTexture(gl.TEXTURE_2D, sand.t);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.generateMipmap(gl.TEXTURE_2D);
const aniso = gl.getExtension('EXT_texture_filter_anisotropic') || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(4, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));

/* ---------- simulation passes ---------- */
const MAXD = 8;
const dropBuf = new Float32Array(MAXD * 4);
const pending = []; // flat list of [u, v, r, s]
let pendingCount = 0;
const PENDING_MAX = 64;
for (let i = 0; i < PENDING_MAX; i++) pending.push([0, 0, 0, 0]);

function pass(pr, target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
  gl.viewport(0, 0, target.w, target.h);
  gl.useProgram(pr.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, cur.t);
  gl.uniform1i(U(pr, 'uState'), 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function swap() { const t = cur; cur = nxt; nxt = t; }
function flushDrops() {
  let i = 0;
  while (i < pendingCount) {
    const n = Math.min(MAXD, pendingCount - i);
    for (let k = 0; k < n; k++) {
      const d = pending[i + k];
      dropBuf[k * 4] = d[0]; dropBuf[k * 4 + 1] = d[1]; dropBuf[k * 4 + 2] = d[2]; dropBuf[k * 4 + 3] = d[3];
    }
    gl.useProgram(P.drop.p);
    gl.uniform4fv(U(P.drop, 'uDrops'), dropBuf);
    gl.uniform1i(U(P.drop, 'uCount'), n);
    pass(P.drop, nxt); swap();
    i += n;
  }
  pendingCount = 0;
}
function stepSim() {
  gl.useProgram(P.update.p);
  gl.uniform2f(U(P.update, 'uTexel'), 1 / N, 1 / N);
  gl.uniform1f(U(P.update, 'uEdge'), 0.14 / WS);
  pass(P.update, nxt); swap();
  simSteps++;
}
function derive() {
  gl.useProgram(P.derive.p);
  gl.uniform2f(U(P.derive, 'uTexel'), 1 / N, 1 / N);
  gl.uniform1f(U(P.derive, 'uCell'), CELL);
  gl.uniform1f(U(P.derive, 'uK'), 0.075);
  pass(P.derive, der);
}
function clearSim() {
  for (const t of [simA, simB, der]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  pendingCount = 0;
}

/* world (x,z) in [-WS,WS] -> drop; strength in world height units. Returns false off the pool. */
let simSteps = 0, dropsAdded = 0;
function addDrop(x, z, radiusW, strength) {
  if (!(x >= -WS && x <= WS && z >= -WS && z <= WS)) return false;
  dropsAdded++;
  if (pendingCount < PENDING_MAX) {
    const d = pending[pendingCount++];
    d[0] = x * 0.5 / WS + 0.5; d[1] = z * 0.5 / WS + 0.5; d[2] = radiusW * 0.5 / WS; d[3] = strength;
  }
  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    const dx = l.x - x, dz = l.z - z;
    const d = Math.hypot(dx, dz) || 1e-4;
    const R = 0.42;
    if (d < R) {
      const f = (1 - d / R) * Math.min(Math.abs(strength), 0.028) * 14;
      l.vx += dx / d * f; l.vz += dz / d * f;
      l.va += (Math.random() - 0.5) * f * 10;
    }
  }
  if (Math.abs(strength) > 0.007) scareFish(x, z);
  return true;
}

/* ---------- fish: drift around the shallows, dart away from a splash ---------- */
const fish = [];
for (let i = 0; i < 4; i++) {
  const a = i * 1.7 + 0.4;
  fish.push({ x: Math.cos(a) * 0.7, z: Math.sin(a) * 0.6, h: a + 1.6, th: a + 1.6, sp: 0.07, burst: 0, s: 0.075 + i * 0.008, wig: i * 2.1 });
}
const fishBuf = new Float32Array(16);
let scares = 0;
function scareFish(x, z) {
  for (const f of fish) {
    const dx = f.x - x, dz = f.z - z, d = Math.hypot(dx, dz);
    if (d < 0.6) { f.th = Math.atan2(dz, dx) + (Math.random() - 0.5) * 0.5; f.h = f.th; f.burst = Math.max(f.burst, 0.85 * (1 - d / 0.6) + 0.35); scares++; }
  }
}
function updateFish(dt, t) {
  for (let i = 0; i < fish.length; i++) {
    const f = fish[i];
    // wander: the wanted heading drifts slowly; far from the middle it turns back home
    f.th += Math.sin(t * 0.21 + f.wig) * dt * 0.5;
    const r = Math.hypot(f.x, f.z);
    if (r > 1.25) {
      const home = Math.atan2(-f.z, -f.x);
      let d = home - f.th; d = Math.atan2(Math.sin(d), Math.cos(d));
      f.th += d * Math.min(1, dt * 1.2);
    }
    let dh = f.th - f.h; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    f.h += dh * Math.min(1, dt * (f.burst > 0.1 ? 8 : 1.5));
    f.burst *= Math.exp(-dt * 1.6);
    const v = f.sp + f.burst;
    f.x += Math.cos(f.h) * v * dt; f.z += Math.sin(f.h) * v * dt;
    f.x = Math.max(-1.8, Math.min(1.8, f.x)); f.z = Math.max(-1.8, Math.min(1.8, f.z));
    // the body sways a little as it swims (faster when fleeing)
    const sway = Math.sin(t * (4 + f.burst * 14) + f.wig) * 0.12;
    fishBuf[i * 4] = f.x; fishBuf[i * 4 + 1] = f.z; fishBuf[i * 4 + 2] = -(f.h + sway); fishBuf[i * 4 + 3] = f.s;
  }
}

/* ---------- light ring: a calm goal. Nudge a leaf into the glow with ripples ---------- */
const STATS_KEY = 'clearwater:stats';
const ring = { x: 0, z: -0.15, r: 0.17, a: 0, show: true, wait: 0 };
let goalNow = 0, goalBest = 0, goalTotal = 0;
try {
  const st = JSON.parse(localStorage.getItem(STATS_KEY));
  if (st && typeof st === 'object') {
    if (Number.isInteger(st.best) && st.best >= 0 && st.best < 1e6) goalBest = st.best;
    if (Number.isInteger(st.total) && st.total >= 0 && st.total < 1e9) goalTotal = st.total;
  }
} catch (e) { /* ignore */ }
const sNow = document.getElementById('sNow'), sBest = document.getElementById('sBest');
function showScore() { sNow.textContent = goalNow; sBest.textContent = goalBest; }
showScore();
function placeRing() {
  for (let k = 0; k < 40; k++) {
    const x = (Math.random() - 0.5) * 1.1, z = (Math.random() - 0.5) * 1.1;
    if (leaves.every(l => Math.hypot(l.x - x, l.z - z) > 0.5)) { ring.x = x; ring.z = z; return; }
  }
  ring.x = -ring.x * 0.8; ring.z = -ring.z * 0.8;
}
function updateRing(dt) {
  if (ring.show) {
    ring.a = Math.min(1, ring.a + dt * 0.8);
    for (const l of leaves) {
      if (ring.a > 0.6 && Math.hypot(l.x - ring.x, l.z - ring.z) < ring.r * 0.85) {
        ring.show = false; ring.wait = 2.2;
        goalNow++; goalTotal++;
        if (goalNow > goalBest) goalBest = goalNow;
        try { localStorage.setItem(STATS_KEY, JSON.stringify({ best: goalBest, total: goalTotal })); } catch (e) { /* ignore */ }
        showScore(); sfx.chime();
        addDrop(ring.x, ring.z, 0.12, 0.012);
        break;
      }
    }
  } else {
    ring.a = Math.max(0, ring.a - dt * 1.2);
    ring.wait -= dt;
    if (ring.wait <= 0 && ring.a === 0) { placeRing(); ring.show = true; }
  }
}

/* ---------- day: a slow cycle of day, dusk, a glowing night and dawn (8 minutes round) ---------- */
const DAY_LEN = 480;
let dayClock = 0.04 * DAY_LEN, night = 0, dusk = 0, phaseName = '';
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function updateDay(dt) {
  dayClock = (dayClock + dt) % DAY_LEN;
  const p = dayClock / DAY_LEN;
  night = sm(0.6, 0.68, p) * (1 - sm(0.88, 0.95, p));
  dusk = sm(0.5, 0.6, p) * (1 - sm(0.62, 0.7, p)) + 0.6 * sm(0.88, 0.94, p) * (1 - sm(0.95, 1.0, p));
  const name = p < 0.52 ? '白晝' : p < 0.64 ? '黃昏' : p < 0.9 ? '夜' : '黎明';
  if (name !== phaseName) {
    if (phaseName) showHint({ 白晝: '天亮了', 黃昏: '黃昏了，水面染上暖色', 夜: '入夜了，水波會發出微光', 黎明: '黎明將至' }[name], 3000);
    phaseName = name;
  }
}

/* ---------- leaves ---------- */
const leaves = [
  { x: -0.38, z: 0.22, a: 0.6, s: 0.3, vx: 0, vz: 0, va: 0.05 },
  { x: 0.42, z: -0.28, a: 2.2, s: 0.25, vx: 0, vz: 0, va: -0.04 },
  { x: 0.12, z: 0.55, a: 4.1, s: 0.27, vx: 0, vz: 0, va: 0.03 }

    const TAU = Math.PI * 2, yaw = ((cam.tYaw % TAU) + TAU) % TAU;
    localStorage.setItem(VIEW_KEY, JSON.stringify({ yaw: +yaw.toFixed(4), pitch: +cam.tPitch.toFixed(4), dist: +cam.tDist.toFixed(4), orbit: orbitMode }));
  } catch (e) { /* ignore */ }
}
function loadView() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) { v = null; }
  if (!v || typeof v !== 'object') return;
  const num = (x, lo, hi) => typeof x === 'number' && isFinite(x) ? Math.max(lo, Math.min(hi, x)) : null;
  const yaw = num(v.yaw, -1e3, 1e3), pitch = num(v.pitch, PITCH_MIN, PITCH_MAX), dist = num(v.dist, DIST_MIN, DIST_MAX);
  if (yaw !== null) cam.yaw = cam.tYaw = yaw;
  if (pitch !== null) cam.pitch = cam.tPitch = pitch;
  if (dist !== null) cam.dist = cam.tDist = dist;
  if (v.orbit === true) setOrbit(true, true);
}
try { if (localStorage.getItem('clearwater:rain') === '1') { rain = true; rainAmt = 1; bRain.setAttribute('aria-pressed', 'true'); } } catch (e) { /* ignore */ }
loadView();

/* ---------- main loop ---------- */
let running = true, last = performance.now(), simAcc = 0, time = 0, rafId = 0;
let ambientT = 0.4, rainAcc = 0;
const stepsPerSec = 0.9 * N / WS;                       // the same world wave speed at any N / WS
const MAX_STEPS = Math.ceil(0.05 * stepsPerSec) + 1;   // covers the longest frame we simulate, so 20-144 Hz all agree
const AMBIENT_AREA = WS * WS;                           // ambient + rain keep the old density over the larger pool
const RAIN_R = 2.5 * CELL;
function lose() {
  running = false; cancelAnimationFrame(rafId); dropPointers(); saveView(); sfx.sleep();
  fail('繪圖資源被系統回收了，正在等待恢復；也可以直接重新載入。');
  reloadBtn.hidden = false;
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lose(); });
// iOS drops the GL context of a page left in the background; once it is handed back, start over with the saved view
canvas.addEventListener('webglcontextrestored', () => location.reload());

/* everything that moves with time; dt is already clamped */
function update(dt) {
  time += dt;
  const ce = 1 - Math.exp(-dt * 10);
  cam.yaw += (cam.tYaw - cam.yaw) * ce;
  cam.pitch += (cam.tPitch - cam.pitch) * ce;
  cam.dist += (cam.tDist - cam.dist) * ce;
  updateCamera();

  if (!reduceMotion) {
    ambientT -= dt;
    while (ambientT <= 0) {
      ambientT += (0.7 + Math.random() * 1.6) / AMBIENT_AREA;
      addDrop((Math.random() - 0.5) * 1.6 * WS, (Math.random() - 0.5) * 1.6 * WS, 0.035, (Math.random() < 0.5 ? -1 : 1) * 0.004);
    }
  }
  rainAmt += ((rain ? 1 : 0) - rainAmt) * (1 - Math.exp(-dt * 1.5));
  if (rain) {
    rainAcc += dt * (mobile ? 45 : 70) * AMBIENT_AREA;
    while (rainAcc >= 1) {
      rainAcc -= 1;
      // 2.5-3.5 cells across: a one-cell drop rings the grid's odd/even mode and shows as a checkerboard
      addDrop((Math.random() - 0.5) * 1.9 * WS, (Math.random() - 0.5) * 1.9 * WS, RAIN_R + Math.random() * CELL, -(0.0012 + Math.random() * 0.0016));
    }
  }
  updateLeaves(dt, time);
  updateFish(dt, time);
  updateRing(dt);
  updateDay(dt);
  sfx.tick(dt);

  if (pendingCount) flushDrops();
  simAcc += dt * stepsPerSec;
  const steps = Math.min(Math.floor(simAcc), MAX_STEPS);
  simAcc -= steps;
  for (let i = 0; i < steps; i++) stepSim();
}

function render() {
  derive();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  const R = P.render;
  gl.useProgram(R.p);
  gl.uniform2f(U(R, 'uRes'), canvas.width, canvas.height);
  gl.uniform3f(U(R, 'uEye'), eye[0], eye[1], eye[2]);
  gl.uniform3f(U(R, 'uFwd'), fwd[0], fwd[1], fwd[2]);
  gl.uniform3f(U(R, 'uRight'), right[0], right[1], right[2]);
  gl.uniform3f(U(R, 'uUp'), up[0], up[1], up[2]);
  gl.uniform3f(U(R, 'uSun'), sun[0], sun[1], sun[2]);
  gl.uniform2f(U(R, 'uRsOff'), rsOff[0], rsOff[1]);
  gl.uniform1f(U(R, 'uTanV'), tanV);
  gl.uniform1f(U(R, 'uTime'), time);
  gl.uniform1f(U(R, 'uRain'), rainAmt);
  gl.uniform1f(U(R, 'uWS'), WS);
  gl.uniform1f(U(R, 'uNight'), night);
  gl.uniform1f(U(R, 'uDusk'), dusk);
  gl.uniform4f(U(R, 'uRing'), ring.x, ring.z, ring.r, ring.a);
  gl.uniform4fv(U(R, 'uFish'), fishBuf);
  gl.uniform4fv(U(R, 'uLeaf'), leafBuf);
  gl.uniform3fv(U(R, 'uLeafCol'), leafCol);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, der.t);
  gl.uniform1i(U(R, 'uDer'), 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, sand.t);
  gl.uniform1i(U(R, 'uSand'), 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0);
}

function frame(now) {
  if (!running) return;
  const rawDt = (now - last) / 1000;
  last = now;
  perfTick(rawDt);
  update(rawDt > 0 ? Math.min(rawDt, 0.05) : 1 / 60);
  render();
  rafId = requestAnimationFrame(frame);
}
function pause() { sfx.sleep(); if (!running) return; running = false; cancelAnimationFrame(rafId); dropPointers(); saveView(); }
function resume() {
  if (!document.hidden && sfx.on && interacted) sfx.wake();
  if (running || !failEl.hidden || gl.isContextLost()) return;
  running = true; last = performance.now(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else resume(); });
window.addEventListener('pagehide', () => { saveView(); pause(); });
window.addEventListener('pageshow', e => { if (e.persisted && !document.hidden) resume(); });
// a welcoming splash so the first frame already shows rings + caustics
addDrop(0.15, -0.1, 0.09, 0.024);
addDrop(-0.45, 0.35, 0.06, 0.014);
window.__clearwater = {
  get drops() { return pendingCount; }, get cam() { return cam; }, get rain() { return rain; }, get orbit() { return orbitMode; },
  get scale() { return renderScale; }, get running() { return running; }, get pointers() { return pointers.size; },
  get steps() { return simSteps; }, get added() { return dropsAdded; }, get maxDist() { return DIST_MAX; },
  leaves, fish, ring, WS, N, perf,
  get goal() { return { now: goalNow, best: goalBest, total: goalTotal }; }, get night() { return night; }, get dusk() { return dusk; },
  get phase() { return phaseName; }, setDay(p) { dayClock = p * DAY_LEN; update(0.001); }, get scares() { return scares; },
  get acts() { return actRuns; }, get sound() { return { on: sfx.on, state: sfx.state }; }, get orbitTaps() { return orbitTaps; }, get tapRipples() { return tapRipples; },
  get hint() { return { text: hintEl.textContent, shown: !hintEl.classList.contains('gone') }; },
  get rainR() { return RAIN_R / CELL; }, tapDrop: TAP_DROP,
  // world point under a screen point, and whether a ripple there lands on the pool
  toWater: (x, y) => screenToWater(x, y),
  // run n frames of dt seconds without rendering (frame-rate tests); returns {steps, drops}
  simulate(dt, n) { const s0 = simSteps, d0 = dropsAdded; for (let i = 0; i < n; i++) update(Math.min(dt, 0.05)); return { steps: simSteps - s0, drops: dropsAdded - d0 }; },
  perfTick, setScale(s) { renderScale = s; resize(); }
};
rafId = requestAnimationFrame(frame);
})();
</script>
