<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1238">
<title>推推殭屍</title>
<style>
:root{--ink:#f6f0ff;--dim:#b9addb;--green:#9cff6b;--gold:#ffcf4a;--pink:#ff7aa8;--panel:rgba(26,17,52,.92);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#140e2c;color:var(--ink);overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;height:100vh;height:100dvh;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.topbtn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);width:46px;height:46px;border-radius:15px;border:2px solid var(--line);background:rgba(20,12,40,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:5;touch-action:manipulation}
.topbtn:active{transform:scale(.92)}
.topbtn svg{width:24px;height:24px}
#pauseBtn{left:calc(env(safe-area-inset-left) + 10px)}
#muteBtn{right:calc(env(safe-area-inset-right) + 10px)}
.hide{display:none!important}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);z-index:10;background:rgba(14,8,32,.62);overflow-y:auto;touch-action:pan-y}
.overlay.show{display:flex}
.card{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.5);text-align:center;margin:auto 0;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
h1{font-size:44px;font-weight:900;letter-spacing:2px;line-height:1.05;color:var(--green);text-shadow:0 4px 0 #3c7a2a,0 8px 18px rgba(0,0,0,.5)}
.sub{color:var(--dim);font-size:14px;margin-top:6px}
h2{font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #8a5a12}
.modes{display:grid;gap:10px;margin-top:16px}
.btn.rush{background:linear-gradient(180deg,#ff9a7a,#e2475c);color:#2a0710}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;border:none;border-radius:18px;padding:10px 16px;font:inherit;font-size:19px;font-weight:800;color:#1b1233;background:var(--green);box-shadow:0 5px 0 #4c9a2f;cursor:pointer;touch-action:manipulation;text-align:left}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4c9a2f}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 #b07a17}
.btn.gold:active{box-shadow:0 1px 0 #b07a17}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);justify-content:center}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px}
.btn .best{font-size:13px;font-weight:800;background:rgba(0,0,0,.15);padding:5px 9px;border-radius:10px;white-space:nowrap}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.dex div{background:rgba(255,255,255,.06);border-radius:14px;padding:6px 2px 7px;font-size:11.5px;line-height:1.3;color:var(--dim)}
.dex canvas{width:60px;height:60px;display:block;margin:0 auto 2px}
.dex b{display:block;color:var(--ink);font-size:12.5px}
.dex .no b{color:var(--pink)}
.tip{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.55}
.tip em{font-style:normal;color:var(--gold)}
.big{font-size:64px;font-weight:900;color:#fff;line-height:1;margin:10px 0 4px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.newbest{display:inline-block;background:var(--pink);color:#fff;font-weight:900;border-radius:12px;padding:4px 12px;font-size:15px;animation:wig 1s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-4deg) scale(1.06)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 2px;font-size:12px;color:var(--dim)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.col{display:grid;gap:12px;margin-top:6px}
.btn.center{justify-content:center;text-align:center}
.kbd{font-size:12px;color:var(--dim);margin-top:10px}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
/* Short screens (phone in landscape): centred overlays clip their top; let them scroll from the top instead. */
@media (max-height: 600px) { .overlay { justify-content: flex-start; } .overlay > * { flex-shrink: 0; } .overlay > :first-child { margin-top: auto; } .overlay > :last-child { margin-bottom: auto; } }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="safe"></div>
  <button id="pauseBtn" class="topbtn hide" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  <button id="muteBtn" class="topbtn" aria-label="靜音切換"><svg id="muteIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg></button>

  <div id="title" class="overlay show">
    <div class="card">
      <h1>推推殭屍</h1>
      <div class="sub">午夜墓園，殭屍們想爬出來散步……敲回去！</div>
      <div class="modes">
        <button class="btn rush" id="btnRush"><span>速推模式<small>30 秒・只敲完全爬出來的那隻</small></span><span class="best" id="bestR">最佳 0</span></button>
        <button class="btn" id="btnSurvival"><span>生存模式<small>三顆心・越撐越快</small></span><span class="best" id="bestS">最佳 0</span></button>
        <button class="btn gold" id="btnTimed"><span>計時挑戰<small>60 秒拚最高分</small></span><span class="best" id="bestT">最佳 0</span></button>
      </div>
      <div class="dex">
        <div><canvas data-t="normal"></canvas><b>小殭</b>敲 1 下</div>
        <div><canvas data-t="helmet"></canvas><b>鐵鍋殭</b>敲 2 下</div>
        <div><canvas data-t="fast"></canvas><b>飛毛腿</b>動作超快</div>
        <div class="no"><canvas data-t="cat"></canvas><b>幽靈貓</b>不要敲！</div>
      </div>
      <div class="tip"><em>速推模式</em>：同時有三隻，分別在冒頭、露半身、全出來三個階段。只能敲<em>全出來</em>的那隻，敲完後另外兩隻各往上爬一段，再冒出一隻新的。敲錯會暈 0.5 秒。<br>土堆<em>抖動</em>、冒出<em>頭頂</em>＝下一隻要出來了！<br>在殭屍爬出墳墓前點牠。連續命中有<em>連擊加倍</em>。</div>
      <div class="kbd" id="kbdTip">鍵盤：墓碑上的字母鍵敲打・P 暫停</div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="card">
      <h2>暫停中</h2>
      <div class="col" style="margin-top:16px">
        <button class="btn center" id="btnResume">繼續</button>
        <button class="btn gold center" id="btnRestart">重新開始</button>
        <button class="btn ghost" id="btnMenu1">回主選單</button>
      </div>
    </div>
  </div>

  <div id="over" class="overlay">
    <div class="card">
      <h2 id="overTitle">遊戲結束</h2>
      <div class="sub" id="overMode">生存模式</div>
      <div class="big" id="overScore">0</div>
      <div id="overBest" class="sub">最佳 0</div>
      <div id="newBest" class="newbest hide">新紀錄！</div>
      <div class="stats">
        <div><b id="stHits">0</b>敲回去</div>
        <div><b id="stCombo">0</b>最高連擊</div>
        <div><b id="stThird">0</b><span id="stThirdL">存活秒數</span></div>
      </div>
      <div class="col">
        <button class="btn center" id="btnRetry">再來一次</button>
        <button class="btn ghost" id="btnMenu2">主選單</button>
      </div>
      <div class="kbd" id="kbdTip2">空白鍵／Enter 快速重來</div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const ID='push-zombie';
const store={
  get(k,d){try{const v=localStorage.getItem(ID+':'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(ID+':'+k,JSON.stringify(v));}catch(e){}}
};
const $=id=>document.getElementById(id);
const app=$('app'),cv=$('cv'),ctx=cv.getContext('2d');
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const fogC=document.createElement('canvas');
const finePointer=matchMedia('(hover:hover) and (pointer:fine)').matches;
if(!finePointer){$('kbdTip').classList.add('hide');$('kbdTip2').classList.add('hide');}

let W=0,H=0,DPR=1,safeT=0,safeB=0,safeL=0,safeR=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const easeOutBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';

/* ================= AUDIO ================= */
let ac=null,master=null,muted=!!store.get('muted',false),noiseBuf=null;
function ensureAudio(){
  if(ac){if(ac.state==='suspended')ac.resume().catch(()=>{});return;}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:0.55;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;}
}
function tone(f,dur,type='sine',vol=0.3,f2=null,delay=0){
  if(!ac||muted)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol=0.2,freq=1200,q=1,delay=0,type='bandpass'){
  if(!ac||muted||!noiseBuf)return;
  const t=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
const SFX={
  bonk(combo){const k=Math.min(combo,24);const p=1+k*0.025;tone(560*p,0.13,'sine',0.45,170*p);tone(1200*p,0.04,'triangle',0.12);noise(0.06,0.25,900,0.8);},
  clank(){tone(1500,0.12,'square',0.08,1100);tone(2300,0.18,'triangle',0.12,2100);noise(0.05,0.2,4000,2);},
  miss(){tone(150,0.08,'sine',0.25,100);},
  escape(){tone(320,0.42,'sawtooth',0.12,110);noise(0.25,0.12,500,0.7);},
  cat(){tone(720,0.12,'sine',0.25,1150);tone(1100,0.22,'sine',0.22,560,0.11);tone(120,0.25,'square',0.06,90);},
  combo(){[660,880,1320].forEach((f,i)=>tone(f,0.12,'triangle',0.16,null,i*0.06));},
  heart(){[784,988,1318].forEach((f,i)=>tone(f,0.16,'sine',0.2,null,i*0.07));},
  start(){tone(440,0.1,'triangle',0.2,null,0);tone(660,0.16,'triangle',0.22,null,0.1);},
  over(){[523,415,330,247].forEach((f,i)=>tone(f,0.25,'triangle',0.2,f*0.97,i*0.14));},
  grow(){noise(0.4,0.18,300,0.6);tone(200,0.3,'triangle',0.15,320);},
  tick(){tone(1000,0.04,'square',0.05);}
};
function setMuteIcon(){
  $('muteIco').innerHTML=muted
    ?'<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/>'
    :'<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>';
  $('muteBtn').setAttribute('aria-pressed',muted?'true':'false');
}
setMuteIcon();
$('muteBtn').addEventListener('click',()=>{ensureAudio();muted=!muted;store.set('muted',muted);if(master)master.gain.value=muted?0:0.55;setMuteIcon();});

/* ================= DRAWING: CHARACTERS ================= */
function drawHelmet(c){
  c.fillStyle='#a7b0c4';
  c.beginPath();c.moveTo(-30,-6);c.bezierCurveTo(-30,-36,30,-36,30,-6);c.closePath();c.fill();
  c.fillStyle='#7b8399';c.beginPath();c.moveTo(8,-30);c.bezierCurveTo(24,-26,30,-16,30,-6);c.lineTo(16,-6);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-12,-22,7,4,-0.5,0,7);c.fill();
  rr(c,-34,-9,68,8,4);c.fillStyle='#8a93a8';c.fill();
  c.fillStyle='#5a6175';rr(c,-6,-38,12,6,3);c.fill();
}
function drawZombie(c,type,o){
  const t=o.t||0;
  if(type==='cat'){drawCat(c,o);return;}
  const skin=type==='fast'?'#b4e06c':'#8fd06c', skinD=type==='fast'?'#7da843':'#5f9c49';
  const shirt=type==='fast'?'#e8693f':type==='helmet'?'#5f78b8':'#8a62c0';
  const shirtD=type==='fast'?'#b5492a':type==='helmet'?'#455a92':'#674596';
  // arms
  c.lineCap='round';
  const sway=Math.sin(t*(type==='fast'?16:9))*4;
  for(const s of [-1,1]){
    let hx,hy;
    if(o.grab){hx=s*40;hy=-4+Math.sin(t*20+s)*2;}
    else if(o.down){hx=s*30;hy=-6;}
    else{hx=s*(30+sway*s*0.5);hy=-86+sway*s;}
    c.strokeStyle=shirtD;c.lineWidth=12;c.beginPath();c.moveTo(s*19,-36);c.quadraticCurveTo(s*34,(-36+hy)/2-4,hx,hy);c.stroke();
    c.fillStyle=skin;c.beginPath();c.arc(hx,hy,7.5,0,7);c.fill();
    c.fillStyle=skinD;c.beginPath();c.arc(hx+s*2,hy+2,3,0,7);c.fill();
  }
  // torso
  rr(c,-24,-46,48,52,13);c.fillStyle=shirt;c.fill();
  c.fillStyle=shirtD;c.beginPath();c.moveTo(-24,-8);c.lineTo(-14,-14);c.lineTo(-8,-6);c.lineTo(0,-13);c.lineTo(6,-5);c.lineTo(24,-12);c.lineTo(24,6);c.lineTo(-24,6);c.fill();
  c.fillStyle='rgba(255,255,255,.18)';c.fillRect(-4,-40,3,22);
  if(type==='fast'){c.fillStyle='#fff';c.font='bold 16px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillText('7',0,-26);}
  // head
  c.save();c.translate(0,-70);c.rotate(o.tilt||0);
  const sq=o.squash||0;c.scale(1+sq*0.25,1-sq*0.25);
  c.fillStyle=skin;c.beginPath();c.ellipse(0,0,28,26,0,0,7);c.fill();
  c.fillStyle=skinD;c.beginPath();c.ellipse(4,6,26,20,0,0.1,Math.PI-0.3);c.fill();
  c.fillStyle=skin;c.beginPath();c.ellipse(-1,0,25,22,0,0,7);c.fill();
  // hair
  if(!o.helmet){c.strokeStyle='#3b2a4a';c.lineWidth=3;c.beginPath();c.moveTo(-4,-25);c.quadraticCurveTo(-8,-36,-2,-38);c.moveTo(2,-26);c.quadraticCurveTo(6,-35,12,-34);c.moveTo(-10,-23);c.quadraticCurveTo(-18,-30,-16,-34);c.stroke();}
  // scar
  c.strokeStyle='#4b7d39';c.lineWidth=2;c.beginPath();c.moveTo(10,-18);c.lineTo(20,-10);c.moveTo(13,-18);c.lineTo(11,-13);c.moveTo(17,-15);c.lineTo(15,-10);c.stroke();
  // eyes
  if(o.dazed){
    c.strokeStyle='#2a1a36';c.lineWidth=3.2;
    for(const [ex,ey,r] of [[-10,-2,6],[11,0,5]]){c.beginPath();c.moveTo(ex-r,ey-r);c.lineTo(ex+r,ey+r);c.moveTo(ex+r,ey-r);c.lineTo(ex-r,ey+r);c.stroke();}
  }else{
    const lx=o.lookX||0,ly=o.lookY||0;
    c.fillStyle='#fff';c.beginPath();c.arc(-10,-2,8.5,0,7);c.fill();c.beginPath();c.arc(11,0,6,0,7);c.fill();
    c.fillStyle=type==='fast'?'#d4271c':'#2a1a36';
    c.beginPath();c.arc(-10+lx*3,-2+ly*3,3.8,0,7);c.fill();c.beginPath();c.arc(11+lx*2,ly*2,2.8,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(-11+lx*3,-4+ly*3,1.3,0,7);c.fill();
  }
  // mouth
  if(o.dazed){c.fillStyle='#3a1f3a';c.beginPath();c.ellipse(1,13,5,6,0,0,7);c.fill();}
  else if(type==='fast'){c.fillStyle='#3a1f3a';c.beginPath();c.moveTo(-10,10);c.quadraticCurveTo(1,22,12,9);c.closePath();c.fill();c.fillStyle='#fff';c.fillRect(-5,10,4,4);c.fillRect(3,10,4,4);}
  else{c.strokeStyle='#2a1a36';c.lineWidth=2.4;c.beginPath();c.moveTo(-10,13);c.quadraticCurveTo(0,10,11,13);c.stroke();c.lineWidth=1.8;c.beginPath();for(let i=-6;i<=8;i+=7){c.moveTo(i,9);c.lineTo(i,16);}c.stroke();}
  if(type==='fast'){
    c.fillStyle='#e23b3b';c.fillRect(-27,-18,54,8);
    c.strokeStyle='#e23b3b';c.lineWidth=5;c.beginPath();c.moveTo(26,-14);c.quadraticCurveTo(38,-18+Math.sin(t*25)*5,46,-10+Math.sin(t*25+1)*6);c.stroke();
  }

const KEYROWS=['1234','qwer','asdf','zxcv'];

function readSafe(){const cs=getComputedStyle($('safe'));safeT=parseFloat(cs.paddingTop)||0;safeR=parseFloat(cs.paddingRight)||0;safeB=parseFloat(cs.paddingBottom)||0;safeL=parseFloat(cs.paddingLeft)||0;}
function computeGrid(){
  const top=safeT+112, bottom=H-safeB-16;
  const availH=Math.max(200,bottom-top), availW=Math.min(W-safeL-safeR-20,560);
  cellW=Math.min(availW/cols,availH/(rows*1.12),165);
  cellH=Math.min(availH/rows,cellW*1.5);
  const bw=cellW*cols,bh=cellH*rows;
  const x0=(W-bw)/2,y0=top+(availH-bh)*0.55;
  boardTop=y0;boardBottom=y0+bh;
  return {x0,y0};
}
function buildGraves(keep){
  const {x0,y0}=computeGrid();
  const old=graves;graves=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const i=r*cols+c,u=cellW/100;
    const g={i,c,r,x:x0+c*cellW,y:y0+r*cellH,w:cellW,h:cellH,u,cx:x0+c*cellW+cellW/2,holeY:y0+r*cellH+cellH-17*u,z:null,shake:0,appear:keep?1:0,variant:(c*7+r*3+(c*r))%3,key:(KEYROWS[r]||'')[c]||''};

}

function params(d){
  const late=1+Math.max(0,d-1.2)*0.5; // keeps tightening past the ~170 s plateau so survival always ends
  return{
    rise:Math.max(0.3/late,0.95-0.55*d),
    hold:Math.max(0.22/late,0.85-0.55*d),
    cue:Math.max(0.3/late,0.6-0.28*d),

  const t=gameTime;

}

function pickType(d){
  if(mode==='survival'&&spawned<5)return'normal';
  const pc=d>0.14?Math.min(0.16,0.07+d*0.09):0;
  const ph=d>0.07?Math.min(0.24,0.1+d*0.14):0;
  const pf=d>0.22?Math.min(0.24,0.06+d*0.17):0;
  const r=Math.random();
  if(r<pc)return'cat';if(r<pc+ph)return'helmet';if(r<pc+ph+pf)return'fast';return'normal';
}
function spawn(demo){
  const d=demo?0.3:diff(),P=params(d);
  const free=graves.filter(g=>!g.z&&g.i!==lastGrave&&g.appear>=1);
  const pool=free.length?free:graves.filter(g=>!g.z&&g.appear>=1);
  if(!pool.length)return false;
  const g=pool[(Math.random()*pool.length)|0];lastGrave=g.i;
  const type=demo?['normal','helmet','fast','cat'][(Math.random()*4)|0]:pickType(d);
  let rise=P.rise,hold=P.hold;
  if(type==='fast'){rise*=0.55;hold*=0.62;}
  if(type==='helmet'){rise*=1.08;}
  if(type==='cat'){hold=Math.max(0.75,1.2-0.35*d);}
  g.z={type,phase:'cue',t:0,p:0,cue:P.cue,rise,hold,hp:type==='helmet'?2:1,helmet:type==='helmet',stun:0,riseAt:0,look:rand(-1,1),squash:0,id:++spawned,demo:!!demo};

}
function rushSpawn(stage,avoid){
  const pool=graves.filter(g=>!g.z&&g!==avoid&&g.appear>=1);
  // very fast tapping can leave every free grave still playing a bonk; reuse one of those so the 3-zombie chain never breaks
  const pick=pool.length?pool:graves.filter(g=>(!g.z||g.z.phase==='bonk')&&g!==avoid);
  if(!pick.length)return;
  const g=pick[(Math.random()*pick.length)|0];
  g.z={type:'normal',phase:'stage',stage,t:0,p:0,cue:0,rise:1,hold:1,hp:1,helmet:false,stun:0,riseAt:gameTime,look:rand(-1,1),squash:0,id:++spawned,demo:false};
  dirt(g.cx,g.holeY,g.u,4);
}

/* ================= INPUT ================= */
function zombieBox(g){
  const z=g.z,u=g.u;if(!z)return null;
  if(z.phase!=='rise'&&z.phase!=='top'&&z.phase!=='stage')return null;
  const top=g.holeY+(1-z.p)*100*u-100*u;
  return{x0:g.cx-42*u,x1:g.cx+42*u,y0:Math.min(top,g.holeY-30*u),y1:g.holeY+14*u};
}
function graveAt(x,y){
  // front-most visible zombie first (lower rows drawn on top)
  for(let i=graves.length-1;i>=0;i--){const b=zombieBox(graves[i]);if(b&&x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1)return graves[i];}
  for(const g of graves)if(x>=g.x&&x<g.x+g.w&&y>=g.y&&y<g.y+g.h)return g;
  return null;
}
function rushHit(g){
  if(stunT>0)return;
  const z=g.z,u=g.u;
  if(!z||z.phase!=='stage'){
    if(!z){if(combo>=3)addPop(g.cx,g.holeY-30*u,'連擊中斷','#c9b8ff',16,0.6);combo=0;SFX.miss();g.shake=0.2;puff(g.cx,g.holeY,u,3,'160,140,200');}
    return;
  }
  const headY=g.holeY+(1-z.p)*100*u-70*u;
  if(z.stage<3){
    wrongs++;combo=0;stunT=STUN_LEN;SFX.miss();g.shake=0.35;z.squash=1;
    flash=0.3;flashColor='255,60,80';shake=Math.max(shake,0.18);
    addPop(g.cx,headY-24*u,'還沒出來！','#ff7a8a',20,0.7);
    return;
  }
  combo++;hits++;maxCombo=Math.max(maxCombo,combo);
  score+=1;scoreBump=1;
  z.phase='bonk';z.t=0;z.squash=1;
  SFX.bonk(Math.min(combo,40));
  stars(g.cx,headY-24*u,u,5);puff(g.cx,g.holeY,u,7);dirt(g.cx,g.holeY,u,3);
  shake=Math.max(shake,0.06);
  addPop(g.cx,headY-30*u,'+1','#ffffff',21,0.55);
  for(const o of graves)if(o.z&&o.z.phase==='stage'&&o.z.stage<3){o.z.stage++;o.z.squash=0.6;}
  rushSpawn(1,g);
}
function hitGrave(g){
  if(!g||g.appear<1)return;
  if(mode==='rush'){rushHit(g);return;}
  const z=g.z,u=g.u;
  if(!z||z.phase==='cue'||z.phase==='bonk'||z.phase==='escape'||z.phase==='leave'||z.phase==='sad'){
    if(!z){ // empty tap: lose combo
      if(combo>=3)addPop(g.cx,g.holeY-30*u,'連擊中斷','#c9b8ff',16,0.6);
      combo=0;SFX.miss();g.shake=0.2;puff(g.cx,g.holeY,u,3,'160,140,200');
    }
    return;
  }
  const headY=g.holeY+(1-z.p)*100*u-70*u;
  if(z.type==='cat'){
    z.phase='sad';z.t=0;SFX.cat();combo=0;
    flash=0.35;flashColor='255,120,190';shake=Math.max(shake,0.25);
    if(mode==='survival'){hearts--;heartBump[Math.max(0,hearts)]=1;addPop(g.cx,headY-30*u,'不要敲貓咪！ -♥','#ff8fb8',20,1);if(hearts<=0)die();}
    else{score=Math.max(0,score-20);addPop(g.cx,headY-30*u,'不要敲貓咪！ -20','#ff8fb8',20,1);}
    return;
  }
  if(z.hp>1){
    z.hp--;z.helmet=false;SFX.clank();helmetFly(g.cx,headY-10*u,u,Math.random()<0.5?-1:1);
    stars(g.cx,headY-20*u,u,3);addPop(g.cx,headY-34*u,'鏘！','#cfe3ff',20,0.5);
    z.p=Math.max(0.12,z.p-0.5);z.phase='rise';z.t=0;z.stun=0.12;z.squash=1;shake=Math.max(shake,0.08);
    return;
  }
  const perfect=z.p<0.62;
  combo++;hits++;if(perfect)perfects++;maxCombo=Math.max(maxCombo,combo);
  const m=mult();
  const base=z.type==='helmet'?20:z.type==='fast'?15:10;
  const pts=Math.round(base*(perfect?1.5:1)*m);
  score+=pts;scoreBump=1;
  z.phase='bonk';z.t=0;z.squash=1;
  SFX.bonk(combo);
  stars(g.cx,headY-24*u,u,perfect?7:5);puff(g.cx,g.holeY,u,8);dirt(g.cx,g.holeY,u,4);
  shake=Math.max(shake,0.1);
  addPop(g.cx,headY-30*u,(perfect?'完美 ':'')+'+'+pts,perfect?'#ffe066':'#ffffff',perfect?24:21,0.75);
  if(m>lastMult){SFX.combo();banner={text:'連擊 ×'+m,t:0,dur:0.9,color:'#9cff6b'};}
  lastMult=m;
  if(mode==='survival'&&combo>0&&combo%25===0&&hearts<3){hearts++;heartBump[hearts-1]=1;SFX.heart();addPop(W/2,safeT+96,'+♥ 回復！','#ff7aa8',22,1);}
}

/* ================= UPDATE ================= */
function updateZombie(g,dt){
  const z=g.z;if(!z)return;
  z.t+=dt;z.squash=Math.max(0,z.squash-dt*6);
  switch(z.phase){
    case'cue':
      if(Math.random()<dt*12)dirt(g.cx,g.holeY,g.u*0.7,1);
      if(z.t>=z.cue){z.phase='rise';z.t=0;z.riseAt=gameTime;dirt(g.cx,g.holeY,g.u,5);}
      break;
    case'rise':
      if(z.stun>0)z.stun-=dt;else z.p+=dt/z.rise;
      if(z.p>=1){z.p=1;z.phase='top';z.t=0;}
      break;
    case'top':
      if(z.t>=z.hold){
        if(z.type==='cat'||z.demo){z.phase='leave';z.t=0;}
        else{
          z.phase='escape';z.t=0;combo=0;lastMult=1;SFX.escape();shake=Math.max(shake,0.3);flash=0.3;flashColor='255,60,80';
          dirt(g.cx,g.holeY,g.u,8);puff(g.cx,g.holeY,g.u,10);
          if(mode==='survival'){hearts--;heartBump[Math.max(0,hearts)]=1;addPop(g.cx,g.holeY-100*g.u,'溜走了！ -♥','#ff6b6b',20,1);if(hearts<=0)die();}
          else{addPop(g.cx,g.holeY-100*g.u,'溜走了！ 連擊歸零','#ff6b6b',20,1);}
        }
      }
      break;
    case'stage':z.p+=(STAGE_P[z.stage]-z.p)*Math.min(1,dt*16);break;
    case'bonk':z.p-=dt/0.14;if(z.t>0.32)g.z=null;break;
    case'leave':z.p-=dt/0.3;if(z.p<=0)g.z=null;break;
    case'sad':if(z.t>0.45){z.p-=dt/0.25;if(z.p<=0)g.z=null;}break;
    case'escape':if(z.t>0.6)g.z=null;break;
  }
}
function update(dt){
  // particles
  for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k!=='dust')p.vy+=900*dt*(p.k==='helmet'?1:0.9);else{p.vx*=0.92;p.vy*=0.92;}if(p.vr)p.rot+=p.vr*dt;}
  particles=particles.filter(p=>p.t<p.life);
  for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<p.life);
  shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*1.6);scoreBump=Math.max(0,scoreBump-dt*5);
  for(let i=0;i<3;i++)heartBump[i]=Math.max(0,heartBump[i]-dt*2.5);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null;}
  for(const g of graves){if(g.appear<1)g.appear=Math.min(1,g.appear+dt*2.6);g.shake=Math.max(0,g.shake-dt);}
  shownScore+= (score-shownScore)*Math.min(1,dt*14);if(Math.abs(score-shownScore)<0.5)shownScore=score;

  if(screen==='title'){
    demoT-=dt;if(demoT<=0){demoT=rand(0.5,1.1);if(activeCount()<3)spawn(true);}
    for(const g of graves)updateZombie(g,dt);
    return;
  }
  if(screen==='ready'){readyT-=dt;if(readyT<=0){screen='play';if(mode==='rush')rushSeed();banner={text:'敲！',t:0,dur:0.6,color:'#9cff6b'};}return;}
  if(screen==='dying'){dieTimer-=dt;for(const g of graves)if(g.z&&(g.z.phase==='bonk'||g.z.phase==='escape'||g.z.phase==='sad'))updateZombie(g,dt*0.5);if(dieTimer<=0)endGame();return;}
  if(screen!=='play')return;

  gameTime+=dt;
  if(mode!=='survival'){
    const L=modeLen(),left=L-gameTime;
    if(left<=5&&Math.ceil(left)!==Math.ceil(left+dt))SFX.tick();
    if(left<=0){gameTime=L;SFX.over();endGame();return;}
  }
  if(mode==='rush'){stunT=Math.max(0,stunT-dt);for(const g of graves)updateZombie(g,dt);return;}
  const [gc,gr]=gridFor();
  if(!pendingGrid&&(gc!==cols||gr!==rows))pendingGrid=[gc,gr];
  if(pendingGrid&&activeCount()===0){
    cols=pendingGrid[0];rows=pendingGrid[1];pendingGrid=null;
    const old=graves.length;buildGraves(false);graves.forEach((g,i)=>g.appear=i<old?1:-(i-old)*0.08);buildBG();
    banner={text:'墓園擴建！',t:0,dur:1.1,color:'#ffcf4a'};SFX.grow();spawnTimer=0.55;shake=0.25;
  }
  const P=params(diff());
  spawnTimer-=dt;
  if(spawnTimer<=0&&!pendingGrid){
    if(activeCount()<P.maxActive&&spawn(false))spawnTimer=P.interval*rand(0.8,1.2);
    else spawnTimer=0.05;
  }
  for(const g of graves)updateZombie(g,dt);
}

/* ================= RENDER ================= */
function drawTomb(c,g,t){
  const u=g.u,cx=g.cx,by=g.holeY-8*u;
  const sh=g.z&&g.z.phase==='cue'?Math.sin(t*60)*1.4*u:0;
  c.save();c.translate(cx+sh*0.3,by);
  const w=56*u,h=50*u;
  // shadow
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(4*u,0,w*0.55,6*u,0,0,7);c.fill();
  c.fillStyle='#9a96b4';
  c.beginPath();
  if(g.variant===0){c.moveTo(-w/2,0);c.lineTo(-w/2,-h+w/2);c.arc(0,-h+w/2,w/2,Math.PI,0);c.lineTo(w/2,0);}
  else if(g.variant===1){c.moveTo(-w/2,0);c.lineTo(-w/2,-h+8*u);c.quadraticCurveTo(-w/2,-h,-w/2+8*u,-h);c.lineTo(w/2-8*u,-h);c.quadraticCurveTo(w/2,-h,w/2,-h+8*u);c.lineTo(w/2,0);}
  else{const a=w*0.18;c.moveTo(-a,0);c.lineTo(-a,-h*0.62);c.lineTo(-w*0.45,-h*0.62);c.lineTo(-w*0.45,-h*0.82);c.lineTo(-a,-h*0.82);c.lineTo(-a,-h-4*u);c.lineTo(a,-h-4*u);c.lineTo(a,-h*0.82);c.lineTo(w*0.45,-h*0.82);c.lineTo(w*0.45,-h*0.62);c.lineTo(a,-h*0.62);c.lineTo(a,0);}
  c.closePath();c.fill();
  c.save();c.clip();c.fillStyle='#77738f';c.fillRect(w*0.18,-h-10*u,w,h+10*u);c.fillStyle='rgba(120,170,110,.5)';c.beginPath();c.ellipse(-w*0.3,-6*u,10*u,6*u,0,0,7);c.fill();c.restore();
  // engraving
  c.fillStyle='#5f5b78';
  if(finePointer&&g.key&&g.variant!==2){c.font=`900 ${Math.round(18*u)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(g.key.toUpperCase(),0,-h*0.5);}
  else if(finePointer&&g.key){c.font=`900 ${Math.round(13*u)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(g.key.toUpperCase(),0,-h*0.35);}
  else if(g.variant===0){c.fillRect(-2*u,-h*0.75,4*u,20*u);c.fillRect(-7*u,-h*0.62,14*u,4*u);}
  else if(g.variant===1){c.fillRect(-14*u,-h*0.7,28*u,3*u);c.fillRect(-10*u,-h*0.55,20*u,3*u);c.fillRect(-12*u,-h*0.4,24*u,3*u);}
  c.restore();
}
function drawHoleBack(c,g){
  const u=g.u;
  c.fillStyle='#5a3e2c';c.beginPath();c.ellipse(g.cx,g.holeY+2*u,44*u,15*u,0,0,7);c.fill();
  c.fillStyle='#1a0f1e';c.beginPath();c.ellipse(g.cx,g.holeY,36*u,10*u,0,0,7);c.fill();
}
function drawHoleFront(c,g,t){
  const u=g.u,z=g.z;
  let sx=0;if(z&&z.phase==='cue')sx=Math.sin(t*70)*2*u;if(g.shake>0)sx+=Math.sin(t*80)*3*u*g.shake*5;
  c.save();c.translate(sx,0);
  c.fillStyle='#6b4a33';
  c.beginPath();c.moveTo(g.cx-46*u,g.holeY);c.quadraticCurveTo(g.cx,g.holeY+30*u,g.cx+46*u,g.holeY);c.quadraticCurveTo(g.cx,g.holeY+12*u,g.cx-46*u,g.holeY);c.fill();
  c.fillStyle='#8a6445';c.beginPath();c.moveTo(g.cx-40*u,g.holeY+1*u);c.quadraticCurveTo(g.cx,g.holeY+14*u,g.cx+40*u,g.holeY+1*u);c.quadraticCurveTo(g.cx,g.holeY+19*u,g.cx-40*u,g.holeY+1*u);c.fill();
  c.fillStyle='#a07a55';c.beginPath();c.arc(g.cx-18*u,g.holeY+9*u,2.5*u,0,7);c.arc(g.cx+12*u,g.holeY+11*u,2*u,0,7);c.fill();

function drawGraveZombie(c,g,t){
  const z=g.z,u=g.u;if(!z)return;
  if(z.phase==='escape'){
    const k=z.t/0.6;
    c.save();c.globalAlpha=1-k;c.translate(g.cx+k*60*u*(g.c<cols/2?-1:1),g.holeY-Math.sin(k*Math.PI)*50*u-k*20*u);c.scale(u,u);
    drawZombie(c,z.type,{t,tilt:Math.sin(t*20)*0.15,down:false,helmet:z.helmet});c.restore();return;
  }
  if(z.phase==='cue'){
    // peeking: glowing eyes + head top
    const pk=0.12+Math.sin(t*14)*0.03;
    c.save();c.beginPath();c.rect(g.cx-60*u,g.y-200*u,120*u,g.holeY-g.y+200*u);c.clip();
    c.translate(g.cx,g.holeY+(1-pk)*100*u);c.scale(u,u);drawZombie(c,z.type,{t,down:true,helmet:z.helmet});c.restore();
    c.fillStyle=z.type==='cat'?'rgba(255,190,230,.95)':'rgba(255,230,90,.95)';
    const blink=(Math.sin(t*5+g.i)>0.92)?0.3:1;
    c.beginPath();c.ellipse(g.cx-8*u,g.holeY+3*u,3*u,2.2*u*blink,0,0,7);c.ellipse(g.cx+8*u,g.holeY+3*u,3*u,2.2*u*blink,0,0,7);c.fill();
    return;
  }
  const p=clamp(z.p,0,1);
  c.save();c.beginPath();c.rect(g.cx-70*u,g.y-220*u,140*u,g.holeY-g.y+220*u);c.clip();
  let jx=0;
  const urgent=z.phase==='top'&&z.type!=='cat'?z.t/z.hold:0;
  if(z.phase==='top')jx=Math.sin(t*(30+urgent*30))*(1+urgent*2.5)*u;
  c.translate(g.cx+jx,g.holeY+(1-p)*100*u);c.scale(u,u);
  drawZombie(c,z.type,{t,grab:z.phase==='top'||(z.phase==='stage'&&z.stage===3),dazed:z.phase==='bonk'||z.stun>0,cry:z.phase==='sad',helmet:z.helmet,squash:z.squash,lookX:z.look,lookY:0.3,tilt:z.phase==='bonk'?0.2:Math.sin(t*4+g.i)*0.06});
  c.restore();
  if(urgent>0.35&&z.phase==='top'){
    const a=clamp((urgent-0.35)*2,0,1);
    c.save();c.globalAlpha=a;c.fillStyle='#ff4d5e';c.font=`900 ${Math.round(26*u)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';
    c.fillText('!',g.cx+36*u,g.holeY-92*u+Math.sin(t*20)*2*u);c.restore();
  }
}

let lastT=0;
function render(t){

    else if(p.k==='dirt'){c.fillStyle=p.color;c.globalAlpha=1-k*k;c.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);c.globalAlpha=1;}

  }

  {const fx=((t*0.02*W+W*0.3)%(W+400))-300;c.drawImage(fogC,fx,boardBottom-W*0.18,W*1.1,W*0.32);}
  c.globalAlpha=1;

    c.font=`900 ${p.size}px ${FONT}`;c.lineWidth=5;c.strokeStyle='rgba(25,12,45,.85)';c.strokeText(p.text,0,0);c.fillStyle=p.color;c.fillText(p.text,0,0);c.restore();
  }
  c.setTransform(DPR,0,0,DPR,0,0);
  if(flash>0){c.fillStyle=`rgba(${flashColor},${flash*0.45})`;c.fillRect(0,0,W,H);}
  // vignette-ish bottom/top gradient for HUD readability
  if(screen!=='title'){const hg=c.createLinearGradient(0,0,0,safeT+110);hg.addColorStop(0,'rgba(12,6,30,.55)');hg.addColorStop(1,'rgba(12,6,30,0)');c.fillStyle=hg;c.fillRect(0,0,W,safeT+110);}
  drawHUD(c,t);
  if(banner){
    const k=banner.t/banner.dur,sc=k<0.2?easeOutBack(k/0.2):1;
    c.save();c.translate(W/2,boardTop+(boardBottom-boardTop)*0.42);c.scale(sc,sc);c.globalAlpha=k>0.75?1-(k-0.75)/0.25:1;
    c.font=`900 ${Math.min(56,W*0.13)}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=10;c.strokeStyle='rgba(20,10,40,.85)';c.strokeText(banner.text,0,0);c.fillStyle=banner.color;c.fillText(banner.text,0,0);c.restore();
  }
}

/* ================= DEX (title icons) ================= */
function drawDex(){
  document.querySelectorAll('.dex canvas').forEach(el=>{
    const s=60*DPR;el.width=s;el.height=s;const c=el.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,s,s);
    const k=s/60;c.translate(30*k,60*k);c.scale(k*0.55,k*0.55);c.translate(0,4);
    const type=el.dataset.t;drawZombie(c,type,{t:0.3,helmet:type==='helmet',lookX:0.3,lookY:0.2});
  });
}

/* ================= LOOP ================= */
let last=performance.now(),raf=0,running=false;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  if(screen!=='paused')update(dt);
  render(now/1000);
}
function startLoop(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stopLoop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(screen==='play'||screen==='ready')pause();stopLoop();}else startLoop();});
// No pause on window blur: on phones (and inside the hub iframe) blur fires on stray focus changes; visibilitychange covers real app switches.

resize();
graves.forEach((g,i)=>g.appear=-i*0.05);
startLoop();

/* ================= TEST HOOK ================= */
window.__game={
  start:m=>startGame(m||'survival'),
  warp:sec=>{gameTime=sec;},
  state:()=>({screen,mode,score,stunT,wrongs,hearts,combo,maxCombo,hits,time:gameTime,cols,rows,
    graves:graves.map(g=>{const z=g.z;let tap=null;if(z){const b=zombieBox(g);tap=b?{x:g.cx,y:Math.max(b.y0+20*g.u,g.holeY-45*g.u)}:{x:g.cx,y:g.holeY-10*g.u};}
      return{i:g.i,x:g.x,y:g.y,w:g.w,h:g.h,cx:g.cx,holeY:g.holeY,ready:g.appear>=1,z:z?{id:z.id,type:z.type,phase:z.phase,stage:z.stage||0,p:z.p,riseAt:z.riseAt,hp:z.hp,t:z.t,hold:z.hold}:null,tap};})}),
};
})();
</script>
