<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>石砲攻城記</title>
<style>
:root{
  --ink:#3b2a1a; --ink2:#7a6146; --card:#fff8ecf0; --card2:#f6ead2; --line:#e0cca8; --accent:#c8692e; --accent2:#a8521f; --gold:#f2b632; --good:#5f8f3e;
  --ovbg:#e9d8b6b0; --pill:#fff8ecee; --shadow:#5a3d1e33; --lock:#e7dcc6; --tile:#fffaf0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#f3e6cf; --ink2:#c2ab88; --card:#1d2236f2; --card2:#262c45; --line:#3a4262; --accent:#e0843f; --accent2:#b9622a; --gold:#f5c04a; --good:#8cc06a;
    --ovbg:#0b1022b8; --pill:#1d2236e8; --shadow:#00000066; --lock:#232842; --tile:#222842; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f1e3c3;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme: dark){ html,body{background:#121a33} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--pill);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--pill);border-radius:14px;min-height:44px;box-shadow:0 3px 10px var(--shadow);display:flex;align-items:center;gap:10px;padding:4px 12px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.2}
.diff{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:5px;height:9px;border-radius:2px;background:var(--line)}
.scorebox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.score{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;line-height:1}
.sbar{position:relative;width:100%;max-width:150px;height:6px;border-radius:3px;background:var(--line);overflow:visible}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#e7a33a,#f2c94c);width:0;transition:width .3s}
.sbar b{position:absolute;top:-4px;width:12px;height:12px;margin-left:-6px;font-size:11px;line-height:12px;text-align:center;color:#bba98a}
.sbar b.on{color:var(--gold);text-shadow:0 0 4px #f5c04a88}
.wind{position:fixed;top:calc(var(--sat) + 60px);left:calc(var(--sal) + 10px);z-index:5;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;background:var(--pill);border-radius:12px;padding:4px 10px 4px 6px;box-shadow:0 3px 10px var(--shadow);pointer-events:none}
.wind svg{width:26px;height:20px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none;z-index:5}
.bottom > *{pointer-events:auto}
.ammo{display:flex;align-items:center;gap:6px;background:var(--pill);border-radius:24px;box-shadow:0 3px 10px var(--shadow);padding:6px 12px 6px 8px;min-height:48px;max-width:calc(100vw - 150px);overflow:hidden}
.ammo canvas{width:30px;height:30px;flex:none}
.ammo .lbl{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.ammo .more{font-size:13px;font-weight:800;color:var(--ink2)}
.skill{height:52px;min-width:52px;padding:0 16px;border-radius:26px;background:linear-gradient(180deg,#f0a24f,#d8742f);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 0 #a8521f,0 6px 14px #a8521f55;display:flex;align-items:center;gap:6px}
.skill:active{transform:translateY(2px);box-shadow:0 2px 0 #a8521f}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:8;background:#3b2a1aee;color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ovbg);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:0 18px 50px var(--shadow);padding:22px 20px;width:min(370px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;background:linear-gradient(180deg,#e8914a,#c8692e);color:#fff;box-shadow:0 5px 0 #96501f,0 8px 18px #96501f44}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #96501f}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0}
.stars{font-size:46px;letter-spacing:8px;margin:2px 0;color:var(--line);line-height:1.1}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c98a14;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:#f5c04a33;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;justify-content:space-between;flex-direction:column}
.ttl{margin-top:6vh;text-align:center}
.ttl h1{font-size:50px;margin:0;letter-spacing:6px;color:#5a3517;text-shadow:0 3px 0 #fff3d6,0 8px 22px #8a5a2a55}
.ttl .sub{color:#6e4b2a;font-weight:700;margin-top:8px;font-size:15px;letter-spacing:1px}
@media (prefers-color-scheme: dark){ .ttl h1{color:#ffe2b0;text-shadow:0 3px 0 #3b2a1a,0 8px 26px #f0a24f55} .ttl .sub{color:#e9c999} }
.tbtns{display:flex;flex-direction:column;align-items:center;padding:0 24px calc(var(--sab) + 10px)}
.tbtns .btn{max-width:320px}
.trow{display:flex;gap:10px;width:100%;max-width:320px}.trow .btn{flex:1}
/* level select */
#select{align-items:stretch;padding:0;background:var(--ovbg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 6px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#7fae55}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));grid-auto-rows:78px;gap:9px;align-content:start;touch-action:pan-y}
.lt{height:78px;border-radius:15px;background:var(--tile);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:44px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--lock);box-shadow:0 3px 0 var(--line);color:var(--ink2);opacity:.75}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.lt .new{position:absolute;top:-5px;right:-4px;font-size:11px;background:var(--accent);color:#fff;border-radius:8px;padding:1px 5px;font-weight:700}
.helpscroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:8px 0;background:var(--card2);border-radius:16px;padding:9px}
.mech canvas{flex:none;width:52px;height:52px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;text-align:left}
.setrow span{font-size:14px;color:var(--ink2)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.statgrid div{background:var(--card2);border-radius:12px;padding:8px;font-size:12px;color:var(--ink2)}
.statgrid b{display:block;font-size:19px;color:var(--ink)}
#shareImg{max-width:100%;border-radius:12px;margin-top:8px}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{max-height:none} .ttl{margin-top:2vh} .ttl h1{font-size:38px} }
@media (max-width:370px){ .lvname{font-size:14px} .score{font-size:15px} .hmid{gap:7px;padding:4px 9px} }
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .lt:hover{filter:brightness(1.03)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1.0</span><span class="pips" id="hPips"></span></div>
    </div>
    <div class="scorebox">
      <div class="score" id="hScore">0</div>
      <div class="sbar" id="hBar"><i id="hBarFill"></i><b>★</b><b>★</b><b>★</b></div>
    </div>
  </div>
  <button class="ibtn" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
</div>

<div class="wind hidden" id="hWind"><svg viewBox="0 0 26 20" id="windSvg"></svg><span id="hWindT"></span></div>
<div class="bottom hidden" id="bottom">
  <div class="ammo" id="ammoRow" aria-label="剩餘彈藥"></div>
  <button class="skill hidden" id="bSkill" aria-label="發動技能"><span id="skillT">分裂！</span></button>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>石砲攻城記</h1>
    <div class="sub">拉弓・瞄準・轟垮城堡</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始攻城</button>
    <button class="btn sec" id="tSelect">攻城地圖</button>
    <div class="trow"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tSet">設定與統計</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>攻城地圖</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSet">設定</button><button class="btn sec" id="pSelect">攻城地圖</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">城堡攻陷！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>分數<b id="wScore">0</b></div><div>剩餘彈藥<b id="wAmmo">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <div class="badges" id="wBadges"></div>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wReplay">慢動作回放</button><button class="btn sec" id="wShare">分享戰果</button></div>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">攻城地圖</button></div>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2>彈藥用盡</h2>
  <p id="fMsg">還有地精躲在城堡裡！換個角度再試一次。</p>
  <button class="btn" id="fRetry">再試一次</button>
  <button class="btn sec" id="fSelect">攻城地圖</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定與統計</h2>
  <div class="setrow"><span>音效</span><button class="sw" id="swSound" role="switch" aria-checked="true"><span class="trk"></span></button></div>
  <div class="setrow"><span>震動回饋</span><button class="sw" id="swVib" role="switch" aria-checked="true"><span class="trk"></span></button></div>
  <div class="setrow"><span>精準模式（隱藏軌跡、分數 ×1.5）</span><button class="sw" id="swPrecise" role="switch" aria-checked="false"><span class="trk"></span></button></div>
  <div class="statgrid" id="statGrid"></div>
  <div class="badges" id="achList"></div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新要素</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始攻城</button>
</div></div>

<div class="ov hidden" id="shareOv"><div class="card">
  <h2>分享戰果</h2>
  <p>長按或右鍵即可儲存圖片。</p>
  <img id="shareImg" alt="戰果圖">
  <button class="btn" id="shareOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<script>
/*CORE-START*/
var DT = 1/120, IDT = 120, GRAV = -10, ITER = 8, TICK = 6;
var VMAX = 22, PULLMAX = 120, PULLMIN = 20;
var SLING_X = 0, SLING_Y = 2.6;
var BETA = 0.2, SLOP = 0.01, VTH = 1.2, WAKEV = 0.25;
var MAT = {
wood:  {d:0.6, hpk:6.5, f:0.6, e:0.1, sc:500},
stone: {d:2.4, hpk:8, f:0.75, e:0.05, sc:800},
ice:   {d:0.9, hpk:3.6, f:0.18, e:0.1, sc:300},
tnt:   {d:0.7, hpk:2.2, f:0.6, e:0.1, sc:500},
gob:   {d:1.0, hpk:3.0, f:0.8, e:0.15, sc:5000},
proj:  {d:3.0, hpk:0, f:0.6, e:0.25, sc:0},
rock:  {d:0, hpk:0, f:0.8, e:0.05, sc:0},
metal: {d:0, hpk:0, f:0.9, e:0.05, sc:0}
};
var AMMO_NAMES = ['石彈','分裂彈','重炸彈','火油彈','彈跳彈'];
function dsincos(x, wantCos){
var k = Math.round(x/6.283185307179586); x = x - k*6.283185307179586;
var q = Math.round(x/1.5707963267948966), r = x - q*1.5707963267948966, r2 = r*r;
var sn = r*(1 + r2*(-1/6 + r2*(1/120 + r2*(-1/5040 + r2*(1/362880 + r2*(-1/39916800 + r2/6227020800))))));
var cs = 1 + r2*(-0.5 + r2*(1/24 + r2*(-1/720 + r2*(1/40320 + r2*(-1/3628800 + r2*(1/479001600 - r2/87178291200))))));
q = ((q % 4) + 4) % 4; if (wantCos) q = (q + 1) % 4;
return q === 0 ? sn : (q === 1 ? cs : (q === 2 ? -sn : -cs));
}
function dsin(x){ return dsincos(x, false); }
function dcos(x){ return dsincos(x, true); }
function dpow(b, n){ var r = 1; for (var i = 0; i < n; i++) r *= b; return r; }
function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function Body(id, shape, w, h, mat, kind){
this.id = id; this.shape = shape; // 0 box, 1 circle
this.hw = shape ? w : w/2; this.hh = shape ? w : h/2; this.r = shape ? w : 0;

var insetCam = null;

/* ---------------- main loop ---------------- */
var tAll = 0;
