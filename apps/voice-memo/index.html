<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>錄音機</title>
<style>
/* A pocket field recorder: warm paper body, a dark glass display with a scrolling level meter, one big red key. */
:root {
  --bg: #f3eee5;
  --card: #fffbf4;
  --card-2: #f7f1e6;
  --ink: #1f1b16;
  --ink-2: #4a4239;
  --muted: #6e6457;
  --line: #e2d8c7;
  --line-2: #cbbfa9;
  --red: #c8102e;
  --red-ink: #ffffff;
  --red-soft: #fbe2e2;
  --amber: #b86e00;
  --sel: rgba(232, 168, 56, 0.20);
  --wave: #2b3446;
  --wave-off: #b9b0a2;
  --played: #c8102e;
  --screen: #16181c;
  --screen-line: #2a2e35;
  --screen-ink: #f4f1ea;
  --screen-dim: #8c919b;
  --live: #ff5a6a;
  --ok: #24764a;
  --focus: #1b56d6;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -18px rgba(60, 40, 10, .45);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12110f; --card: #1b1916; --card-2: #23201c; --ink: #f0eadf; --ink-2: #d2c9bb; --muted: #a39887;
    --line: #2f2b26; --line-2: #48423a; --red: #ff4d5e; --red-ink: #1a0004; --red-soft: #3a1418; --amber: #f0a83c;
    --sel: rgba(240, 168, 60, 0.16); --wave: #d6dde9; --wave-off: #59524a; --played: #ff6b79;
    --screen: #0a0b0d; --screen-line: #24272d; --live: #ff6474; --ok: #6fd39a; --focus: #8fb2ff;
    --shadow: 0 10px 30px -18px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12110f; --card: #1b1916; --card-2: #23201c; --ink: #f0eadf; --ink-2: #d2c9bb; --muted: #a39887;
  --line: #2f2b26; --line-2: #48423a; --red: #ff4d5e; --red-ink: #1a0004; --red-soft: #3a1418; --amber: #f0a83c;
  --sel: rgba(240, 168, 60, 0.16); --wave: #d6dde9; --wave-off: #59524a; --played: #ff6b79;
  --screen: #0a0b0d; --screen-line: #24272d; --live: #ff6474; --ok: #6fd39a; --focus: #8fb2ff;
  --shadow: 0 10px 30px -18px rgba(0,0,0,.9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans);
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 1120px; margin: 0 auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
.top h1 { margin: 0; font-size: 20px; letter-spacing: .04em; display: flex; align-items: center; gap: 9px; font-weight: 700; }
.top h1 .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.usage { font: 12.5px/1 var(--mono); color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; white-space: nowrap; }

.cols { display: block; }
.rec { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 12px 12px 16px; box-shadow: var(--shadow); }
.screen { background: var(--screen); border: 1px solid var(--screen-line); border-radius: 16px; padding: 10px 12px 12px; color: var(--screen-ink); position: relative; overflow: hidden; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 40%); }
.screen-top { display: flex; justify-content: space-between; align-items: center; font: 11.5px/1 var(--mono); letter-spacing: .08em; color: var(--screen-dim); text-transform: uppercase; }
.state { display: inline-flex; align-items: center; gap: 6px; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--screen-dim); }
.rec.on .state { color: var(--live); }
.rec.on .state::before { background: var(--live); animation: blink 1s steps(2, start) infinite; }
.rec.paused .state { color: #f0b54a; }
.rec.paused .state::before { background: #f0b54a; }
@keyframes blink { to { visibility: hidden; } }
#live { display: block; width: 100%; height: 120px; margin: 8px 0 4px; }
.timer { font: 600 48px/1 var(--mono); letter-spacing: .02em; text-align: center; font-variant-numeric: tabular-nums; padding: 2px 0 2px; }
.timer .tenth { color: var(--screen-dim); }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 16px; }
.round { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card-2); display: grid; place-items: center; transition: opacity .15s, transform .1s; }
.round:active:not(:disabled) { transform: scale(.94); }
.round:disabled { opacity: .35; }
.round svg { width: 22px; height: 22px; }
.recbtn { width: 88px; height: 88px; border-radius: 50%; border: 0; padding: 0; background: var(--card); position: relative; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--line-2) inset, 0 6px 18px -8px rgba(200, 16, 46, .6); }
.recbtn .core { width: 66px; height: 66px; border-radius: 50%; background: var(--red); transition: width .22s ease, height .22s ease, border-radius .22s ease; }
.recbtn::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--red); opacity: 0; pointer-events: none; }
.rec.on .recbtn .core, .rec.paused .recbtn .core { width: 34px; height: 34px; border-radius: 8px; }
.rec.on .recbtn::after { animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.92); opacity: .75; } 100% { transform: scale(1.18); opacity: 0; } }
.recbtn:disabled { opacity: .45; }
@media (prefers-reduced-motion: reduce) { .rec.on .recbtn::after, .rec.on .state::before { animation: none; } .rec.on .recbtn::after { opacity: .6; } }
.hint { margin: 12px 4px 0; text-align: center; color: var(--muted); font-size: 13px; }
.notice { margin: 12px 2px 0; padding: 11px 13px; border-radius: 12px; background: var(--red-soft); color: var(--ink); font-size: 13.5px; border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); }
.notice a { color: var(--red); font-weight: 600; word-break: break-all; }
.notice b { display: block; margin-bottom: 3px; }

.banner { margin-top: 12px; background: var(--card); border: 1px dashed var(--amber); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.banner span { flex: 1 1 180px; }
.chip { border: 1px solid var(--line-2); background: var(--card-2); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 14px; }
.chip.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.listhead { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px 8px; }
.listhead h2 { margin: 0; font-size: 15px; letter-spacing: .06em; color: var(--ink-2); }
.listhead span { color: var(--muted); font-size: 13px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.memo { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; overflow: clip; }
.memo.open { border-color: var(--line-2); box-shadow: var(--shadow); }
.swipe { position: relative; overflow: hidden; overflow: clip; }
.under { position: absolute; inset: 0 0 0 auto; width: 92px; border: 0; background: var(--red); color: var(--red-ink); font-weight: 600; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: var(--card); min-height: 64px; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .2s ease; cursor: pointer; }
.row.drag { transition: none; }
.spark { width: 52px; height: 32px; flex: none; border-radius: 8px; background: var(--card-2); }
.info { flex: 1; min-width: 0; }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font: 12.5px/1.3 var(--mono); color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-family: var(--sans); font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--line); margin-left: 4px; }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 6px 4px 0; transition: transform .2s; flex: none; }
.memo.open .chev { transform: rotate(-135deg); margin-bottom: -4px; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--line-2); border-radius: 16px; font-size: 14px; }
.empty svg { display: block; margin: 0 auto 8px; opacity: .6; }

/* editor */
.editor { padding: 4px 12px 14px; border-top: 1px solid var(--line); }
.ed-title { display: none; }
.wavewrap { margin: 0 -12px; padding: 0 12px; touch-action: none; }
.wavebox { position: relative; height: 96px; margin: 12px 0 6px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; border-radius: 10px; background: var(--card-2); }
.wavebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 10px; }
.shade { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); pointer-events: none; }
.shade.l { left: 0; border-radius: 10px 0 0 10px; }
.shade.r { right: 0; border-radius: 0 10px 10px 0; }
.handle { position: absolute; top: 0; bottom: 0; width: 22px; margin-left: -11px; pointer-events: none; outline: none; }
.handle::before { content: ""; position: absolute; left: 9.5px; top: -3px; bottom: -3px; width: 3px; background: var(--amber); border-radius: 2px; }
.handle span { position: absolute; top: 50%; left: 0; width: 22px; height: 34px; margin-top: -17px; border-radius: 7px; background: var(--amber); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.handle span::before, .handle span::after { content: ""; position: absolute; top: 9px; bottom: 9px; width: 2px; background: rgba(255,255,255,.75); border-radius: 1px; }
.handle span::before { left: 7px; } .handle span::after { right: 7px; }
.side .wavewrap { margin: 0 -16px; padding: 0 16px; }
.handle:focus-visible span { outline: 2px solid var(--focus); outline-offset: 2px; }
.playhead { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--played); pointer-events: none; border-radius: 1px; }
.wavemsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 16px; color: var(--muted); font-size: 13px; pointer-events: none; }
.times { display: flex; justify-content: space-between; font: 12.5px/1.2 var(--mono); color: var(--muted); padding: 0 2px; }
.times b { color: var(--amber); font-weight: 600; }
.playrow { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.play svg { width: 22px; height: 22px; }
.pos { font: 600 16px/1.15 var(--mono); color: var(--ink); white-space: nowrap; flex: 1; min-width: 0; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.pos small { font-size: 12px; font-weight: 400; color: var(--muted); }
.speeds { display: flex; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; flex: none; }
.speeds button { border: 0; background: none; border-radius: 8px; padding: 0 7px; min-width: 40px; height: 36px; font: 12.5px/1 var(--mono); color: var(--muted); }
.speeds button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 700; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.btn { min-height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; padding: 0 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--amber); border-color: var(--amber); color: #fff; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .4; }
.acts .wide { grid-column: 1 / -1; }
.ednote { margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); min-height: 1em; }
.ednote.warn { color: var(--amber); }

.side { display: none; }

/* sheets & toast */
.scrim { position: fixed; inset: 0; background: rgba(10, 8, 6, .5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet { width: 100%; max-width: 440px; background: var(--card); border-radius: 20px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); border: 1px solid var(--line); }
.sheet h3 { margin: 0 0 6px; font-size: 17px; }
.sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.sheet .stack { display: grid; gap: 8px; }
.sheet input { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink); padding: 0 12px; font: inherit; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; min-height: 32px; padding: 0 6px; }

@media (min-width: 880px) {
  .cols { display: grid; grid-template-columns: minmax(340px, 400px) 1fr; gap: 24px; align-items: start; }
  .side { display: block; position: sticky; top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 8px 8px 8px; box-shadow: var(--shadow); min-height: 300px; }
  .side .editor { border-top: 0; padding: 12px 16px 16px; }
  .side .ed-title { display: block; margin: 4px 0 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .wavebox { height: 160px; }
  .side-empty { display: grid; place-items: center; min-height: 280px; color: var(--muted); text-align: center; padding: 20px; }
  .acts { grid-template-columns: repeat(3, 1fr); }
  .acts .wide { grid-column: auto; }
  .memo.open .chev { transform: rotate(-45deg); margin-bottom: 0; }
}
</style>

<div class="app">
  <header class="top">
    <h1><span class="dot" aria-hidden="true"></span>錄音機</h1>
    <span class="usage" id="usage" title="錄音占用的空間">已用 0 B</span>
  </header>
  <div class="cols">
    <div>
      <section class="rec" id="rec" aria-label="錄音">
        <div class="screen">
          <div class="screen-top"><span class="state" id="recState">待命</span><span id="recFmt"></span></div>
          <canvas id="live" aria-hidden="true"></canvas>
          <div class="timer" id="timer" role="timer" aria-live="off">00:00<span class="tenth">.0</span></div>
        </div>
        <div class="ctrls">
          <button class="round" id="pauseBtn" type="button" disabled aria-label="暫停錄音"></button>
          <button class="recbtn" id="recBtn" type="button" aria-label="開始錄音"><span class="core"></span></button>
          <button class="round" id="discardBtn" type="button" disabled aria-label="捨棄這段錄音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
        <p class="hint" id="recHint">按紅色按鈕開始錄音，錄音只存在這台裝置。</p>
        <div class="notice" id="notice" hidden role="alert"></div>
      </section>
      <div class="banner" id="recover" hidden>
        <span id="recoverMsg">上次的錄音沒有正常結束。</span>
        <button class="chip solid" id="recoverYes" type="button">復原</button>
        <button class="chip" id="recoverNo" type="button">捨棄</button>
      </div>
      <div class="listhead"><h2>我的錄音</h2><span id="count"></span></div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        還沒有錄音。錄完會出現在這裡，可以播放、剪掉頭尾再下載。
      </div>
    </div>
    <aside class="side" id="side" aria-label="播放與剪輯">
      <div class="side-empty" id="sideEmpty">從左邊選一段錄音<br>來播放與剪輯</div>
    </aside>
  </div>
</div>

<div class="editor" id="editor" hidden>
  <div class="ed-title" id="edTitle"></div>
  <div class="wavewrap" id="wavewrap"><div class="wavebox" id="wavebox" aria-label="波形：點一下跳到該位置，拖曳黃色把手選擇保留範圍">
    <canvas id="thumb"></canvas>
    <div class="shade l" id="shadeL"></div><div class="shade r" id="shadeR"></div>
    <div class="playhead" id="playhead"></div>
    <div class="handle" id="h0" role="slider" tabindex="0" aria-label="剪輯起點"><span></span></div>
    <div class="handle" id="h1" role="slider" tabindex="0" aria-label="剪輯終點"><span></span></div>
    <div class="wavemsg" id="waveMsg" hidden></div>
  </div></div>
  <div class="times"><span id="tA">00:00.0</span><b id="tLen"></b><span id="tB">00:00.0</span></div>
  <div class="playrow">
    <button class="play" id="playBtn" type="button" aria-label="播放"></button>
    <div class="pos"><span id="posNow">00:00.0</span><small>/ <span id="posDur">00:00.0</span></small></div>
    <div class="speeds" role="radiogroup" aria-label="播放速度" id="speeds">
      <button type="button" role="radio" data-r="0.75" aria-checked="false">0.75×</button><button type="button" role="radio" data-r="1" aria-checked="true">1×</button><button type="button" role="radio" data-r="1.5" aria-checked="false">1.5×</button><button type="button" role="radio" data-r="2" aria-checked="false">2×</button>
    </div>
  </div>
  <div class="acts">
    <button class="btn" id="autoBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h3M18 12h3M8 6v12M16 6v12M11 9v6M13 8v8"/></svg>自動修剪</button>
    <button class="btn accent" id="applyBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 20 18M8.5 15.5 20 6"/></svg>套用剪輯</button>
    <button class="btn primary wide" id="dlBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="dlLabel">下載</span></button>
    <button class="btn" id="renameBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg>重新命名</button>
    <button class="btn danger" id="delBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>刪除</button>
  </div>
  <p class="ednote" id="edNote"></p>
</div>

<div class="scrim" id="trimSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="trimTitle">
    <h3 id="trimTitle">套用剪輯</h3>
    <p id="trimDesc"></p>
    <div class="stack">
      <button class="btn accent" id="trimNew" type="button">另存成新錄音（保留原檔）</button>
      <button class="btn" id="trimReplace" type="button">取代原錄音</button>
      <button class="btn" id="trimCancel" type="button">取消</button>
    </div>
  </div>
</div>
<div class="scrim" id="nameSheet" hidden>

    $('recoverNo').onclick = () => { $('recover').hidden = true; dbDel('pending', 'cur').catch(() => {}); };
  }

  /* ---------- boot ---------- */
  setUI(); setTimer(0); sizeLive(); updateUsage();
  (async () => {
    db = await openDB();
    if (!db) { showNotice('<b>這個瀏覽器無法長期保存錄音</b>關閉頁面後錄音會消失，錄完請記得下載。'); }
    try { memos = (await dbAll('memos')).filter(m => m && m.blob); } catch (e) { memos = []; }
    memos.sort((a, b) => b.createdAt - a.createdAt);
    render();
    if (isDesk.matches && memos.length) openSel(memos[0].id);
    checkPending();
  })();
  // theme changes repaint canvases
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { drawThumb(); drawLive(); render(); });
  window.__vm = { memos: () => memos, sel, R };
})();
</script>
