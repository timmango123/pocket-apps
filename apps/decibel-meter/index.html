<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>噪音分貝計</title>
<style>
/* Field sound-level-meter look: cool slate housing, a graphite LCD readout whose digits take the colour of the noise band */
:root {
  --bg: #e7ebee;
  --surface: #f7f9fa;
  --surface-2: #dde3e7;
  --ink: #101920;
  --ink-2: #33414c;
  --muted: #5f6d78;
  --line: #cdd5db;
  --line-strong: #9eabb5;
  --lcd: #141c22;
  --lcd-2: #1d272f;
  --lcd-ink: #e9f1f5;
  --lcd-muted: #8395a2;
  --accent: #0f5c8c;
  --accent-ink: #ffffff;
  --accent-soft: #d5e5f0;
  --b0: #2fa58a; --b1: #5fae3e; --b2: #d6ad12; --b3: #e57a1d; --b4: #d93a2b; --b5: #a3164a;
  --warn: #b42318;
  --chart-avg: #1d3446;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f12; --surface: #141a1f; --surface-2: #1d252c; --ink: #e6edf2; --ink-2: #c0ccd5; --muted: #8796a2;
    --line: #253039; --line-strong: #3d4b56; --lcd: #070a0c; --lcd-2: #10161b; --lcd-ink: #eef5f8; --lcd-muted: #7a8b97;
    --accent: #6cb6e6; --accent-ink: #04121c; --accent-soft: #13283a;
    --b0: #3cc4a3; --b1: #7ccd55; --b2: #ecc53a; --b3: #f39443; --b4: #f25c4b; --b5: #e2457f;
    --warn: #ff7a6b; --chart-avg: #cfe3f1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f12; --surface: #141a1f; --surface-2: #1d252c; --ink: #e6edf2; --ink-2: #c0ccd5; --muted: #8796a2;
  --line: #253039; --line-strong: #3d4b56; --lcd: #070a0c; --lcd-2: #10161b; --lcd-ink: #eef5f8; --lcd-muted: #7a8b97;
  --accent: #6cb6e6; --accent-ink: #04121c; --accent-soft: #13283a;
  --b0: #3cc4a3; --b1: #7ccd55; --b2: #ecc53a; --b3: #f39443; --b4: #f25c4b; --b5: #e2457f;
  --warn: #ff7a6b; --chart-avg: #cfe3f1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(10px, env(safe-area-inset-top)) calc(24px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1000px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--line-strong) 25%, transparent); }
.led[data-s="on"] { background: var(--b1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--b1) 30%, transparent); animation: blink 1.6s ease-in-out infinite; }
.led[data-s="paused"] { background: var(--b2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--b2) 30%, transparent); }
.led[data-s="err"] { background: var(--b4); box-shadow: 0 0 0 3px color-mix(in srgb, var(--b4) 30%, transparent); }
@keyframes blink { 50% { opacity: .45; } }
.tbtn { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px var(--sans); color: var(--ink-2); border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; }
.tbtn svg { width: 20px; height: 20px; }
@media (hover: hover) { .tbtn:hover { border-color: var(--accent); color: var(--accent); } }

/* phone: one column in reading order (readout, start card, curve, controls, settings); desktop: readout left, curve right */
.layout { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.left, .right { display: contents; }
.lcd { order: 1; } #card { order: 2; } .chart-card { order: 3; } .ctrl { order: 4; } details.set { order: 5; }
@media (min-width: 860px) {
  .layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 24px; align-items: stretch; }
  .left, .right { display: flex; flex-direction: column; gap: 12px; }
  .right .chart-card { flex: 1; display: flex; flex-direction: column; } .right .cv-wrap { flex: 1; min-height: 300px; }
}

/* LCD readout */
.lcd { border-radius: 18px; background: linear-gradient(180deg, var(--lcd-2), var(--lcd)); color: var(--lcd-ink); padding: 12px 16px 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.15); --band: var(--lcd-ink); }
.lcd-top { display: flex; justify-content: space-between; align-items: center; font: 600 11px var(--mono); color: var(--lcd-muted); letter-spacing: .08em; text-transform: uppercase; }
.lcd-top .chip { border: 1px solid color-mix(in srgb, var(--lcd-muted) 60%, transparent); border-radius: 6px; padding: 1px 6px; }
.big { display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 100px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.big .num { font: 700 80px/100px var(--mono); letter-spacing: -.03em; color: var(--band); transition: color .3s; text-shadow: 0 0 22px color-mix(in srgb, var(--band) 30%, transparent); }
.big .unit { font: 700 20px var(--mono); color: var(--lcd-muted); }
.level { text-align: center; font-size: 16px; font-weight: 700; min-height: 26px; color: var(--band); }
.level small { font-weight: 500; color: var(--lcd-muted); font-size: 13px; margin-left: 4px; }
.bar { position: relative; height: 14px; border-radius: 7px; margin: 14px 0 4px; background: linear-gradient(90deg, var(--b0) 0%, var(--b1) 20%, var(--b2) 40%, var(--b3) 57%, var(--b4) 72%, var(--b5) 88%); }
.bar .ind, .bar .mx { position: absolute; top: -6px; bottom: -6px; left: 0; width: 0; pointer-events: none; }
.bar .ind::before { content: ""; position: absolute; left: -2px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--lcd-ink); box-shadow: 0 0 0 2px var(--lcd); }
.bar .mx::before { content: ""; position: absolute; left: -5px; top: -4px; border: 5px solid transparent; border-top: 6px solid var(--b4); border-bottom: 0; }
.scale { display: flex; justify-content: space-between; font: 600 10px var(--mono); color: var(--lcd-muted); padding: 0 1px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 12px; border-top: 1px solid color-mix(in srgb, var(--lcd-muted) 30%, transparent); padding-top: 10px; }
.stats div { text-align: center; min-width: 0; }
.stats span { display: block; font-size: 11px; color: var(--lcd-muted); }
.stats b { display: block; font: 700 17px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lcd-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.lcd-foot .note { font-size: 11px; color: var(--lcd-muted); min-width: 0; }
.lbtn { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid color-mix(in srgb, var(--lcd-muted) 60%, transparent); color: var(--lcd-ink); font-size: 13px; font-weight: 600; flex: none; }

/* guide / error card */
.card { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 16px; }
.guide { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.guide .mic { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.guide .mic svg { width: 26px; height: 26px; }
.guide h2 { margin: 0; font-size: 16px; }
.guide p { margin: 0; font-size: 13px; color: var(--muted); }
.go { grid-column: 1 / -1; margin-top: 12px; width: 100%; min-height: 56px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; letter-spacing: .06em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.go svg { width: 22px; height: 22px; }
.go:disabled { opacity: .55; }
.fine { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
.err h2 { margin: 0 0 6px; font-size: 16px; color: var(--warn); }
.err p { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
.err ol { margin: 0 0 8px; padding-left: 20px; font-size: 13px; color: var(--ink-2); }
.err .site { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; margin: 8px 0; padding: 0 12px; text-align: center; overflow-wrap: anywhere; }
.gbtn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); font-weight: 600; font-size: 14px; background: var(--surface); }
.pbtn { min-height: 44px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }

/* controls */
.ctrl { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); align-items: center; gap: 12px; }
.ctrl .side { min-height: 48px; border-radius: 24px; border: 1px solid var(--line-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.ctrl .side svg { width: 18px; height: 18px; }
.ctrl .side:disabled { opacity: .45; cursor: default; }
.play { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line-strong); }
.play svg { width: 26px; height: 26px; }
.play[data-on="1"] { background: var(--b4); color: #fff; }

/* chart */
.chart-card { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 10px 10px 8px; }
.chart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 6px; }
.chart-head h2 { margin: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.seg button { min-width: 52px; min-height: 44px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cv-wrap { position: relative; height: 180px; }
.cv-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; display: block; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--ink); color: var(--bg); font: 600 12px var(--mono); padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translateX(-50%); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); padding: 6px 2px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* settings */
details.set { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; }
details.set > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 52px; font-weight: 700; font-size: 15px; }
details.set > summary::-webkit-details-marker { display: none; }
details.set > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
details.set[open] > summary::after { transform: rotate(-135deg); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid var(--line); flex-wrap: wrap; padding: 6px 0; }
.row .lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.row .lbl small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper output { font: 700 16px var(--mono); min-width: 4.4em; text-align: center; font-variant-numeric: tabular-nums; }
.rbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface-2); font: 700 20px var(--mono); display: grid; place-items: center; }
.rbtn:disabled { opacity: .35; cursor: default; }
.switch { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; }
.switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::before { transform: translateX(20px); }
.switch::after { content: ""; position: absolute; inset: -8px; }
.foot { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 4px 2px 0; }

/* calibration sheet */
.scrim { position: fixed; inset: 0; background: rgba(5, 10, 14, .55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border: 1px solid var(--line-strong); border-bottom: 0; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 16px; border-bottom: 1px solid var(--line-strong); } }
.sheet h2 { margin: 0 0 4px; font-size: 18px; }
.sheet p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.known { display: flex; gap: 8px; align-items: center; margin: 6px 0 4px; }
.known input { flex: 1; min-width: 0; height: 48px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-2); color: var(--ink); padding: 0 12px; font: 600 18px var(--mono); }
.known span { font: 700 14px var(--mono); color: var(--muted); }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.alarm-frame { position: fixed; inset: 0; pointer-events: none; z-index: 50; box-shadow: inset 0 0 0 6px var(--b4); opacity: 0; }
.alarm-frame.on { animation: flash .5s ease-in-out 6 alternate; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .alarm-frame.on { opacity: 1; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1><span class="led" id="led" data-s="idle" role="img" aria-label="未測量"></span>噪音分貝計</h1>
    <button class="tbtn" id="calBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>校正</button>
    <button class="tbtn" id="themeBtn" type="button" aria-label="切換主題"></button>
  </header>

  <div class="layout">
    <div class="left">
      <section class="lcd" id="lcd" aria-label="即時音量">
        <div class="lcd-top"><span id="wTag" class="chip">FAST</span><span id="calTag">CAL +0</span></div>
        <div class="big"><span class="num" id="num">--</span><span class="unit" id="unit">dB</span></div>
        <div class="level" id="level" aria-live="off">尚未開始測量</div>
        <div class="bar" aria-hidden="true" title="白線：目前；紅色三角：最大值"><div class="mx" id="mx" hidden></div><div class="ind" id="ind" hidden></div></div>
        <div class="scale" aria-hidden="true"><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span><span>120</span></div>
        <div class="stats">
          <div><span>最小</span><b id="sMin">--</b></div>
          <div><span>平均 Leq</span><b id="sLeq">--</b></div>
          <div><span>最大</span><b id="sMax">--</b></div>
          <div><span>經過</span><b id="sTime">0:00</b></div>
        </div>
        <div class="lcd-foot"><span class="note" id="lcdNote">手機麥克風・估計值</span><button class="lbtn" id="resetBtn" type="button">重設</button></div>
      </section>

      <section class="card" id="card" aria-live="polite"></section>

      <div class="ctrl" id="ctrl" hidden>
        <button class="side" id="markBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>標記</button>
        <button class="play" id="playBtn" type="button" aria-label="暫停測量" data-on="1"></button>
        <button class="side" id="csvBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>匯出 CSV</button>
      </div>
    </div>

    <div class="right">
      <section class="chart-card" aria-label="歷史曲線">
        <div class="chart-head">
          <h2>歷史曲線</h2>
          <div class="seg" id="range" role="group" aria-label="時間範圍">
            <button type="button" data-r="60">60 秒</button><button type="button" data-r="300">5 分</button><button type="button" data-r="1800">30 分</button>
          </div>
        </div>
        <div class="cv-wrap" id="cvWrap"><canvas id="cv" tabindex="0" aria-label="歷史曲線，左右拖曳查看數值，點兩下切換時間範圍"></canvas><div class="tip" id="tip" hidden></div></div>
        <div class="legend"><span><i style="background:var(--chart-avg)"></i>每秒平均</span><span><i style="background:var(--b3)"></i>每秒最大</span><span><i style="background:var(--accent);width:3px;height:10px"></i>標記</span></div>
      </section>

      <details class="set" id="set">
        <summary>量測設定</summary>
        <div class="row"><span class="lbl">時間加權<small>快 125 ms・慢 1 秒</small></span>
          <div class="seg" id="wSeg" role="group" aria-label="時間加權"><button type="button" data-w="fast">快</button><button type="button" data-w="slow">慢</button></div></div>
        <div class="row"><label class="lbl" for="aW">A 加權<small>依人耳頻率響應估算 dBA</small></label><input class="switch" type="checkbox" id="aW"></div>
        <div class="row"><label class="lbl" for="alOn">超標警示<small>超過門檻持續 3 秒：邊框閃紅並震動</small></label><input class="switch" type="checkbox" id="alOn"></div>
        <div class="row"><span class="lbl">警示門檻</span>
          <div class="stepper"><button class="rbtn" id="alDown" type="button" aria-label="降低 1 dB">−</button><output id="alOut">85 dB</output><button class="rbtn" id="alUp" type="button" aria-label="提高 1 dB">+</button></div></div>
        <p class="foot" id="agcNote">手機麥克風不是專業儀器，數值為估計值；可用「校正」對照已知音量調整。量測資料只留在這個頁面，不會上傳，也不會存檔，除非你自己匯出。</p>
      </details>
    </div>
  </div>
</div>

<div class="scrim" id="calDlg" hidden role="dialog" aria-modal="true" aria-labelledby="calTitle">
  <div class="sheet">
    <h2 id="calTitle">校正</h2>
    <p>拿專業分貝計或已知音量的聲源對照，輸入它顯示的數值，按「套用」即可把目前讀數對齊；也可以直接微調偏移量。</p>
    <div class="row" style="border-top:0"><span class="lbl">目前讀數</span><b id="calNow" style="font:700 20px var(--mono)">--</b></div>
    <label class="lbl" for="calKnown" style="font-size:14px;font-weight:600;color:var(--ink-2)">已知數值</label>
    <div class="known"><input id="calKnown" type="number" inputmode="decimal" min="20" max="120" step="0.1" placeholder="例如 60"><span>dB</span><button class="pbtn" id="calApply" type="button">套用</button></div>

  </div>
</div>
<div class="alarm-frame" id="alarmFrame"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/*CORE-START*/
const DB_BASE = 94;               // 0 dBFS ≈ 94 dB SPL (rule of thumb for phone microphones)
const CAL_MIN = -30, CAL_MAX = 30, DB_MIN = 20, DB_MAX = 120;
const WEIGHT_TAU = { fast: 0.125, slow: 1 };
const BANDS = [
  { max: 30, name: '極安靜', eg: '耳語', emoji: '🍃' },
  { max: 50, name: '安靜', eg: '圖書館', emoji: '📚' },
  { max: 70, name: '一般', eg: '交談', emoji: '💬' },
  { max: 85, name: '吵雜', eg: '車流', emoji: '🚗' },
  { max: 100, name: '很吵', eg: '傷耳風險', emoji: '⚠️' },
  { max: Infinity, name: '危險', eg: '請遠離或戴耳塞', emoji: '🚨' }

// Mean square with the DC offset removed (some microphones idle off-centre).
function meanSquare(buf) {

const $ = s => document.querySelector(s);
const KEY = 'decibel-meter.v1';
const SITE = 'https://timmango123.github.io/pocket-apps/tools/#decibel-meter';

  const s = JSON.parse(localStorage.getItem(KEY) || 'null');

    if (WEIGHT_TAU[s.weighting]) S.weighting = s.weighting;
    S.aWeight = s.aWeight === true;
    if (typeof s.alarm === 'number') S.alarm = Math.max(50, Math.min(115, Math.round(s.alarm)));

} catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

const ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  ext: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'

function applyTheme() {

}
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

// ---------- state ----------
const session = createSession({ weighting: S.weighting, cap: 1800 });

let lastTick = 0, ticks = 0, everStarted = false, cardState = 'idle';

function renderSettings() {
  document.querySelectorAll('#wSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === S.weighting)));
  document.querySelectorAll('#range button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === S.range)));

  $('#alOut').textContent = S.alarm + ' dB';
  $('#alDown').disabled = S.alarm <= 50; $('#alUp').disabled = S.alarm >= 115;
  $('#wTag').textContent = S.weighting === 'fast' ? 'FAST 125ms' : 'SLOW 1s';
  $('#calTag').textContent = 'CAL ' + (S.offset >= 0 ? '+' : '−') + Math.abs(S.offset).toFixed(Number.isInteger(S.offset) ? 0 : 1);
  $('#unit').textContent = S.aWeight ? 'dBA' : 'dB';
  $('#lcdNote').textContent = S.aWeight ? 'dBA（估）・手機麥克風' : '手機麥克風・估計值';
  $('#calOut').textContent = (S.offset >= 0 ? '+' : '−') + Math.abs(S.offset).toFixed(Number.isInteger(S.offset) ? 0 : 1) + ' dB';
  $('#calDown').disabled = S.offset <= CAL_MIN; $('#calUp').disabled = S.offset >= CAL_MAX;

// ---------- readout ----------
function renderReadout() {
  const lv = session.level, st = session.stats, lcd = $('#lcd');
  if (lv == null) {
    $('#num').textContent = '--';
    $('#ind').hidden = true;
    lcd.style.setProperty('--band', 'var(--lcd-ink)');
    $('#level').innerHTML = running ? '量測中…' : everStarted ? '已暫停' : '尚未開始測量';
  } else {
    const d = displayDb(lv, S.offset), bi = bandIndex(lv + S.offset), b = BANDS[bi];
    $('#num').textContent = fmtDb(lv, S.offset);
    lcd.style.setProperty('--band', `var(--b${bi})`);
    $('#level').innerHTML = `${b.emoji} ${b.name}<small>${b.eg}</small>`;
    const ind = $('#ind'); ind.hidden = false; ind.style.left = ((d - DB_MIN) / (DB_MAX - DB_MIN) * 100).toFixed(2) + '%';
  }
  const mx = $('#mx');
  if (st.max != null) { mx.hidden = false; mx.style.left = ((displayDb(st.max, S.offset) - DB_MIN) / (DB_MAX - DB_MIN) * 100).toFixed(2) + '%'; } else mx.hidden = true;
  $('#sMin').textContent = fmtDb(st.min, S.offset, 1);
  $('#sLeq').textContent = fmtDb(st.leq, S.offset, 1);
  $('#sMax').textContent = fmtDb(st.max, S.offset, 1);
  $('#sTime').textContent = fmtElapsed(st.secs);
  if (!$('#calDlg').hidden) $('#calNow').textContent = lv == null ? '--' : fmtDb(lv, S.offset, 1) + ' ' + (S.aWeight ? 'dBA' : 'dB');
}

// ---------- chart ----------
const cv = $('#cv'), cvWrap = $('#cvWrap');
let cssCache = null, inspectX = null;
function css() {
  if (cssCache) return cssCache;
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();

}
function drawChart() {

  lab.forEach(([s, txt], i) => { g.textAlign = i === 0 ? 'left' : i === 2 ? 'right' : 'center'; g.fillText(txt, i === 0 ? L : i === 2 ? L + pw : x(now + s * 1000), h - 4); });

  if (run.length) runs.push(run);

    if (r.length === 1) g.lineTo(cx(r[0]) + 1, y(r[0].avg + S.offset));
    g.lineTo(cx(r[r.length - 1]), T + ph); g.lineTo(cx(r[0]), T + ph); g.closePath();
    g.globalAlpha = .16; g.fillStyle = C.avg; g.fill(); g.globalAlpha = 1;
    // max line
    g.beginPath(); r.forEach((p, i) => { const X = cx(p), Y = y(p.max + S.offset); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.strokeStyle = C.b[3]; g.lineWidth = 1.2; g.lineJoin = 'round'; g.stroke();
    // avg line
    g.beginPath(); r.forEach((p, i) => { const X = cx(p), Y = y(p.avg + S.offset); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.strokeStyle = C.avg; g.lineWidth = 2; g.stroke();
  }
  g.restore();
  // markers
  let mi = 0;
  for (const p of session.hist.since(0)) if (p.mark) {
    mi += p.mark === 1 ? 1 : 0;
    if (p.t < t0 - 1000) continue;
    const X = Math.round(cx(p)) + .5;
    g.strokeStyle = p.mark === 1 ? C.accent : C.muted; g.lineWidth = 1.5; g.setLineDash(p.mark === 1 ? [] : [2, 3]);
    g.beginPath(); g.moveTo(X, T); g.lineTo(X, T + ph); g.stroke(); g.setLineDash([]);
    if (p.mark === 1) { g.fillStyle = C.accent; g.beginPath(); g.moveTo(X, T); g.lineTo(X + 9, T + 4); g.lineTo(X, T + 8); g.fill(); g.font = '700 10px sans-serif'; g.textAlign = 'left'; g.fillText(mi, X + 3, T + 19); }
  }

    const tAt = t0 + (Math.max(L, Math.min(L + pw, inspectX)) - L) / pw * S.range * 1000;
    let best = pts[0]; for (const p of pts) if (Math.abs(p.t + 500 - tAt) < Math.abs(best.t + 500 - tAt)) best = p;
    const X = cx(best);
    g.strokeStyle = C.ink; g.lineWidth = 1; g.beginPath(); g.moveTo(X, T); g.lineTo(X, T + ph); g.stroke();
    g.fillStyle = C.avg; g.beginPath(); g.arc(X, y(best.avg + S.offset), 3.5, 0, 7); g.fill();

    tip.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}・平均 ${fmtDb(best.avg, S.offset, 1)}・最大 ${fmtDb(best.max, S.offset, 1)}${best.mark === 1 ? '・標記' : ''}`;
    const tw = tip.offsetWidth; tip.style.left = Math.max(tw / 2, Math.min(w - tw / 2, X)) + 'px';
  } else tip.hidden = true;
  if (!pts.length) { g.fillStyle = C.muted; g.textAlign = 'center'; g.font = '13px sans-serif'; g.fillText(running ? '每秒記錄一點…' : '開始測量後會畫出曲線', L + pw / 2, T + ph / 2); }
}
new ResizeObserver(() => drawChart()).observe(cvWrap);
let lastUp = 0, lastUpX = 0;
cv.addEventListener('pointerdown', e => { inspectX = e.offsetX; drawChart(); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) { inspectX = e.offsetX; drawChart(); } });
cv.addEventListener('pointerleave', () => { inspectX = null; drawChart(); });
cv.addEventListener('pointercancel', () => { inspectX = null; drawChart(); });
cv.addEventListener('pointerup', e => {
  const t = performance.now();
  if (t - lastUp < 320 && Math.abs(e.offsetX - lastUpX) < 30) { cycleRange(); lastUp = 0; } else { lastUp = t; lastUpX = e.offsetX; }
  if (e.pointerType !== 'mouse') setTimeout(() => { inspectX = null; drawChart(); }, 1600);
});
function cycleRange() { S.range = { 60: 300, 300: 1800, 1800: 60 }[S.range]; save(); renderSettings(); drawChart(); toast('時間範圍：' + { 60: '60 秒', 300: '5 分鐘', 1800: '30 分鐘' }[S.range]); }

// ---------- audio ----------
function ensureCtx() {
  if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}
function policyBlocks() {
  try { const fp = document.permissionsPolicy || document.featurePolicy; if (fp && fp.allowsFeature) return !fp.allowsFeature('microphone'); } catch {}
  return false;
}
async function permState() {
  try { if (navigator.permissions && navigator.permissions.query) return (await navigator.permissions.query({ name: 'microphone' })).state; } catch {}
  return 'unknown';
}
async function start() {
  if (running || starting) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || policyBlocks()) return fail('blocked');
  if (!ensureCtx()) return fail('unsupported');
  starting = true; renderCard('asking');
  const t0 = performance.now();
  try {
    const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
    catch (e) { if (e && e.name === 'OverconstrainedError') stream = await navigator.mediaDevices.getUserMedia({ audio: true }); else throw e; }
  } catch (e) {
    starting = false;
    const name = e && e.name;
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') { const st = await permState(); return fail(st !== 'denied' && performance.now() - t0 < 250 ? 'blocked' : 'denied'); }
    if (name === 'SecurityError') return fail('blocked');
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return fail('nomic');
    if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') return fail('busy');
    return fail('unsupported');
  }
  starting = false;
  if (document.hidden) { stopStream(); renderCard(everStarted ? 'paused' : 'idle'); return; }
  try {
    if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
    src = ctx.createMediaStreamSource(stream);
    an = ctx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0;
    src.connect(an);
    buf = new Float32Array(an.fftSize); spec = new Float32Array(an.frequencyBinCount);
  } catch { stopStream(); return fail('unsupported'); }
  const tr = stream.getAudioTracks()[0];
  tr.addEventListener('ended', () => { if (running) { pause(); fail('busy'); } });
  let agcOn = false; try { const st = tr.getSettings(); agcOn = st.autoGainControl === true || st.noiseSuppression === true; } catch {}
  $('#agcNote').textContent = (agcOn ? '注意：這個瀏覽器沒有關閉自動增益或降噪，讀數可能偏平。' : '') + '手機麥克風不是專業儀器，數值為估計值；可用「校正」對照已知音量調整。量測資料只留在這個頁面，不會上傳，也不會存檔，除非你自己匯出。';
  if (everStarted) session.interrupt();
  everStarted = true; running = true; alarm.reset();
  lastTick = performance.now(); ticks = 0;
  timer = setInterval(tick, 50);
  requestWake();
  renderCard('live'); renderCtrl(); renderReadout();
}
function tick() {
  if (!running || !an) return;
  const now = performance.now(), dt = Math.min(0.5, Math.max(0.001, (now - lastTick) / 1000)); lastTick = now;
  an.getFloatTimeDomainData(buf);
  let ms = meanSquare(buf);
  if (S.aWeight) { an.getFloatFrequencyData(spec); ms *= aWeightRatio(spec, ctx.sampleRate, an.fftSize); }
  const lv = session.feed(ms, dt, Date.now());
  if (S.alarmOn && alarm.update(lv + S.offset, S.alarm, now)) fireAlarm();
  if (++ticks % 2 === 0) renderReadout();
  if (ticks % 20 === 0) drawChart();
}
function fireAlarm() {
  const f = $('#alarmFrame'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch {}
  toast(`超過 ${S.alarm} dB 已持續 3 秒`);
}
function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  try { src && src.disconnect(); } catch {}
  src = null; an = null;
}
function pause(state = 'paused') {
  running = false; clearInterval(timer); timer = 0;
  stopStream(); releaseWake();
  session.interrupt();
  renderCard(state); renderCtrl(); renderReadout(); drawChart();
}
function fail(state) { renderCard(state); $('#led').dataset.s = 'err'; }
async function requestWake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch { wake = null; } }
function releaseWake() { try { wake && wake.release(); } catch {} wake = null; }

// ---------- card + controls ----------
function renderCard(state) {
  cardState = state;
  const card = $('#card'), led = $('#led');
  led.dataset.s = state === 'live' ? 'on' : state === 'paused' ? 'paused' : 'idle';
  led.setAttribute('aria-label', { live: '測量中', paused: '已暫停' }[state] || '未測量');
  const site = `<a class="site" href="${SITE}" target="_blank" rel="noopener">${ICON.ext}開啟網站版分貝計</a>`;
  const retry = '<button class="gbtn" type="button" data-act="start">再試一次</button>';
  if (state === 'live') { card.hidden = true; return; }
  if (state === 'paused' && everStarted) { card.hidden = true; return; }
  card.hidden = false;
  if (state === 'idle' || state === 'asking' || state === 'paused') {
    card.className = 'card';
    card.innerHTML = `<div class="guide"><div class="mic">${ICON.mic}</div><div><h2>用麥克風量環境音量</h2><p>把手機放平、麥克風朝向聲源，不要遮住。</p></div>
      <button class="go" type="button" data-act="start" ${state === 'asking' ? 'disabled' : ''}>${ICON.mic}${state === 'asking' ? '等待麥克風權限…' : '點擊開始測量'}</button>
      <div class="fine">手機麥克風非專業儀器，數值為估計值・聲音只在本機分析，不會錄音或上傳</div></div>`;
    return;
  }
  card.className = 'card err';
  const T = {
    blocked: `<h2>這裡無法使用麥克風</h2><p>目前開啟的頁面不允許取用麥克風（例如嵌在其他網站裡的預覽）。請到網站版使用分貝計：</p>${site}`,
    denied: `<h2>麥克風權限被拒絕</h2><p>請允許此網站使用麥克風，再點「再試一次」：</p><ol><li>iPhone Safari：點網址列的「大小」→「網站設定」→ 麥克風選「允許」。</li><li>Android Chrome：點網址列左側圖示 →「權限」→ 開啟麥克風。</li><li>電腦瀏覽器：點網址列左側的鎖頭或設定圖示，把麥克風改成允許。</li></ol>${retry}<p style="margin-top:10px">如果是在嵌入的頁面裡開啟，請改用網站版：</p>${site}`,
    nomic: `<h2>找不到麥克風</h2><p>這台裝置沒有可用的麥克風。接上耳機麥克風或外接麥克風後再試一次。</p>${retry}`,
    busy: `<h2>麥克風正被其他程式使用</h2><p>通話、錄音或其他 App 佔用了麥克風。請先關閉它們，再試一次。</p>${retry}`,
    unsupported: `<h2>這個瀏覽器不支援麥克風量測</h2><p>請改用新版 Safari、Chrome 或 Edge 開啟網站版：</p>${site}`
  };
  card.innerHTML = T[state] || T.unsupported;
}
function renderCtrl() {
  $('#ctrl').hidden = !everStarted;
  const p = $('#playBtn');
  p.dataset.on = running ? '1' : '0';
  p.innerHTML = running ? ICON.pause : ICON.play;
  p.setAttribute('aria-label', running ? '暫停測量' : '繼續測量');
  $('#markBtn').disabled = !running;
}
$('#card').addEventListener('click', e => { const b = e.target.closest('[data-act="start"]'); if (b) start(); });
$('#playBtn').addEventListener('click', () => { if (running) pause(); else start(); });
$('#markBtn').addEventListener('click', () => { if (!running) return; session.mark(1); toast('已在曲線上加入標記'); setTimeout(drawChart, 1100); });
$('#resetBtn').addEventListener('click', () => { session.reset(); alarm.reset(); renderReadout(); renderCtrl(); drawChart(); toast('已重設統計與曲線'); });
$('#csvBtn').addEventListener('click', () => {
  const pts = session.hist.since(0); if (!pts.length) { toast('還沒有資料可以匯出'); return; }
  const d = new Date(), name = `noise-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.csv`;
  try {
    const url = URL.createObjectURL(new Blob(['﻿' + toCsv(pts, S.offset)], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`已匯出 ${pts.length} 筆（${name}）`);
  } catch { toast('這個環境無法下載檔案'); }
});
document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => { S.range = +b.dataset.r; save(); renderSettings(); drawChart(); }));
cv.addEventListener('dblclick', e => e.preventDefault());
document.querySelectorAll('#wSeg button').forEach(b => b.addEventListener('click', () => { S.weighting = b.dataset.w; session.setWeighting(S.weighting); save(); renderSettings(); }));
$('#aW').addEventListener('change', e => { S.aWeight = e.target.checked; save(); renderSettings(); renderReadout(); });
$('#alOn').addEventListener('change', e => { S.alarmOn = e.target.checked; alarm.reset(); save(); renderSettings(); drawChart(); });
$('#alDown').addEventListener('click', () => { S.alarm = Math.max(50, S.alarm - 1); alarm.reset(); save(); renderSettings(); drawChart(); });
$('#alUp').addEventListener('click', () => { S.alarm = Math.min(115, S.alarm + 1); alarm.reset(); save(); renderSettings(); drawChart(); });
// calibration
function setCal(v) { S.offset = clampCal(v); save(); renderSettings(); renderReadout(); drawChart(); }
let calReturn = null;
$('#calBtn').addEventListener('click', () => { calReturn = document.activeElement; $('#calDlg').hidden = false; $('#calKnown').value = ''; renderReadout(); setTimeout(() => $('#calKnown').focus({ preventScroll: true }), 30); });
function closeCal() { $('#calDlg').hidden = true; if (calReturn && calReturn.focus) calReturn.focus(); }
$('#calClose').addEventListener('click', closeCal);
$('#calDlg').addEventListener('click', e => { if (e.target.id === 'calDlg') closeCal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#calDlg').hidden) closeCal(); });
$('#calDown').addEventListener('click', () => setCal(S.offset - 1));
$('#calUp').addEventListener('click', () => setCal(S.offset + 1));
$('#calReset').addEventListener('click', () => { setCal(0); toast('已恢復預設偏移量'); });
$('#calApply').addEventListener('click', () => {
  const k = parseFloat($('#calKnown').value);
  if (!isFinite(k) || k < 20 || k > 120) { toast('請輸入 20～120 之間的數值'); return; }
  const lv = session.level;
  if (lv == null) { toast('請先開始測量，再對照已知數值'); return; }
  const raw = S.offset + k - (lv + S.offset), want = calibrate(lv, k, S.offset);
  setCal(want);
  toast(Math.abs(raw - want) > 0.05 ? `偏移量最多 ±30 dB，已設為 ${want > 0 ? '+' : ''}${want} dB` : `偏移量設為 ${want >= 0 ? '+' : ''}${want} dB`);
});
$('#calKnown').addEventListener('keydown', e => { if (e.key === 'Enter') $('#calApply').click(); });
$('#themeBtn').addEventListener('click', () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); save(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { cssCache = null; drawChart(); }); } catch {}

// release the microphone whenever the page goes away; the curve marks the interruption
document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
window.addEventListener('pagehide', () => { if (running) pause(); try { ctx && ctx.close(); } catch {} ctx = null; });
setInterval(() => { if (!running && session.hist.size && document.visibilityState === 'visible') drawChart(); }, 5000);

applyTheme(); renderSettings(); renderCard('idle'); renderCtrl(); renderReadout();
window.__db = { S, session, get running() { return running; }, get cardState() { return cardState; }, get stream() { return stream; }, start, pause, toCsv, drawChart };
</script>
