<title>倒數日看板</title>

<div class="wrap" id="app">
  <header>
    <div><h1>倒數日看板</h1><div class="today-line" id="today-line"></div></div>

<script>

'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const K = 'countdown-board:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(K + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 日期純函式（本地日序號） ---------- */
function toDayNumber(y, m, d) { y -= m <= 2 ? 1 : 0; const era = Math.floor(y / 400), yoe = y - era * 400, mp = (m + 9) % 12; const doy = Math.floor((153 * mp + 2) / 5) + d - 1; const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy; return era * 146097 + doe - 719468; }
function fromDayNumber(z) { z += 719468; const era = Math.floor(z / 146097), doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153), d = doy - Math.floor((153 * mp + 2) / 5) + 1, m = mp < 10 ? mp + 3 : mp - 9; return { y: yoe + era * 400 + (m <= 2 ? 1 : 0), m, d }; }
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const dim = (y, m) => [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const weekday = n => ((n + 4) % 7 + 7) % 7;
const pad = n => String(n).padStart(2, '0');
const iso = n => { const g = fromDayNumber(n); return g.y + '-' + pad(g.m) + '-' + pad(g.d); };
function parseISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return null; const y = +m[1], mo = +m[2], d = +m[3]; if (y < 1900 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > dim(y, mo)) return null; return toDayNumber(y, mo, d); }
let TODAY = 0;
const refreshToday = () => { const d = new Date(); TODAY = toDayNumber(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
refreshToday();
/* 下一次（或本次）發生的日序號 */
function occurrence(it, today) {

function targetMs(it, occ) { const g = fromDayNumber(occ); const [hh, mm] = it.time ? it.time.split(':').map(Number) : [0, 0]; return new Date(g.y, g.m - 1, g.d, hh, mm, 0, 0).getTime(); }

function closeDetail() { clearTimeout(tickT); detailId = null; $('#detail').hidden = true; $('#detail').innerHTML = ''; if ($('#sheet').hidden) document.body.classList.remove('lock'); if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); }
function renderDetail() {
  const it = items.find(x => x.id === detailId); if (!it) { closeDetail(); return; }
  const d = $('#detail'), b = bgInfo(it.bg), info = dayInfo(it, TODAY, settings.count);
  d.className = 'detail ' + b.fg; d.style.setProperty('--tbg', b.css); d.style.setProperty('--tbg-solid', b.solid);
  const occ = info ? info.n : parseISO(it.date);
  const rep = it.repeat === 'yearly' ? '每年重複' : it.repeat === 'monthly' ? '每月重複' : '';
  d.innerHTML = '<div class="bar"><button type="button" id="d-close" aria-label="關閉">← 返回</button><span class="spacer"></span><button type="button" id="d-edit">編輯</button></div>' +
    '<div class="body"><div class="em" aria-hidden="true">' + it.emoji + '</div><div class="ttl">' + esc(it.title) + '</div>' +
    '<div class="dt">' + dateText(occ) + (it.time ? ' ' + it.time : '') + (rep ? ' · ' + rep : '') + '</div>' +
    '<div class="lbl" id="d-lbl"></div><div class="clock" id="d-clock" aria-live="off"></div><div class="stats" id="d-stats"></div>' +
    (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') +
    '<div class="share"><button type="button" id="d-share">分享圖片</button></div><div id="d-shot"></div></div>';
  tick();
}
function tick() {
  clearTimeout(tickT);
  const it = items.find(x => x.id === detailId); if (!it) return;
  refreshToday();
  const info = dayInfo(it, TODAY, settings.count); if (!info) return;
  const now = Date.now(), tgt = targetMs(it, info.n);
  let ms = tgt - now; const future = ms > 0;
  const abs = Math.abs(ms);
  const D = Math.floor(abs / 864e5), H = Math.floor(abs % 864e5 / 36e5), M = Math.floor(abs % 36e5 / 6e4), S = Math.floor(abs % 6e4 / 1e3);
  const isToday = info.diff === 0;
  const done = isToday && (!it.time || !future);
  $('#detail').classList.toggle('celebrate', isToday);
  $('#d-lbl').textContent = done ? (it.time ? '時間到了！' : '就是今天！') : future ? '倒數' : (settings.count === 'nth' ? '已經過了（今天是第 ' + (info.num) + ' 天）' : '已經過了');
  const cell = (v, u, c) => '<div' + (c ? ' class="' + c + '"' : '') + '><b>' + v + '</b><span>' + u + '</span></div>';
  $('#d-clock').innerHTML = done && !it.time ? cell('0', '天', 'd') : cell(D.toLocaleString('zh-TW'), '天', 'd') + cell(pad(H), '時') + cell(pad(M), '分') + cell(pad(S), '秒');
  const days = Math.abs(info.diff);
  $('#d-stats').innerHTML = '<span>共 ' + Math.floor(days / 7) + ' 週又 ' + (days % 7) + ' 天</span><span>約 ' + Math.floor(abs / 36e5).toLocaleString('zh-TW') + ' 小時</span>' + (info.diff ? '<span>' + (info.diff > 0 ? '還有 ' : '已過 ') + days.toLocaleString('zh-TW') + ' 天</span>' : '');
  if (!document.hidden) tickT = setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && detailId) tick(); });
$('#detail').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'd-close') closeDetail();
  else if (b.id === 'd-edit') openSheet(detailId);
  else if (b.id === 'd-share') shareImage();
  else if (b.id === 'd-save') saveShot();
});

/* ---------- 分享圖片 1080×1350 ---------- */
let dl = null;
(async () => { try { dl = await window.claude?.use?.('downloads') || null; } catch (e) { dl = null; } $('#export').hidden = false; $('#export').textContent = dl ? '匯出 JSON' : '複製 JSON'; })();
function drawShare(it) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const x = c.getContext('2d'), b = bgInfo(it.bg), info = dayInfo(it, TODAY, settings.count);
  if (b.stops.length > 1) { const gr = x.createLinearGradient(0, 0, 1080, 1350); gr.addColorStop(0, b.stops[0]); gr.addColorStop(1, b.stops[1]); x.fillStyle = gr; } else x.fillStyle = b.stops[0];
  x.fillRect(0, 0, 1080, 1350);
  const fg = b.fg === 'light' ? '#121317' : '#ffffff', fg2 = b.fg === 'light' ? 'rgba(18,19,23,.7)' : 'rgba(255,255,255,.8)';
  const sans = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '180px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.fillText(it.emoji, 540, 330);
  x.fillStyle = fg; x.font = '900 76px ' + sans;
  let t = it.title; while (x.measureText(t).width > 940 && t.length > 1) t = t.slice(0, -1); if (t !== it.title) t = t.slice(0, -1) + '…';
  x.fillText(t, 540, 500);
  x.fillStyle = fg2; x.font = '700 52px ' + sans; x.fillText(info.num == null ? '' : info.label, 540, 640);
  x.fillStyle = fg;
  if (info.num == null) { x.font = '900 170px ' + sans; x.fillText(info.word, 540, 860); }
  else { const n = info.num.toLocaleString('zh-TW'); let size = 320; x.font = '800 ' + size + 'px ' + getComputedStyle(document.documentElement).getPropertyValue('--num'); while (x.measureText(n).width > 760 && size > 120) { size -= 10; x.font = '800 ' + size + 'px ' + getComputedStyle(document.documentElement).getPropertyValue('--num'); } const w = x.measureText(n).width; x.fillText(n, 540 - 40, 900); x.font = '800 72px ' + sans; x.textAlign = 'left'; x.fillText('天', 540 - 40 + w / 2 + 16, 900); x.textAlign = 'center'; }
  x.fillStyle = fg2; x.font = '600 48px ' + sans; x.fillText(dateText(info.n) + (it.time ? ' ' + it.time : ''), 540, 1040);
  x.font = '600 34px ' + sans; x.fillText('倒數日看板', 540, 1270);
  return c;
}
async function shareImage() {
  const it = items.find(x => x.id === detailId); if (!it) return;
  const c = drawShare(it);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = 'countdown-' + it.title.replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 30) + '.png';
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('已儲存圖片'); return; }
    catch (e) { if (/declin/i.test(String(e && (e.code || e.message || e)))) return; }
  }
  try { const f = new File([blob], name, { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: it.title }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  shotURL = c.toDataURL('image/png');
  $('#d-shot').innerHTML = '<img class="shot" id="d-img" alt="' + esc(it.title) + ' 分享圖片" src="' + shotURL + '"><p class="dt" style="margin-top:6px">長按或右鍵圖片即可儲存</p>';
}

/* ---------- 匯出／匯入 ---------- */
$('#export').addEventListener('click', async () => {
  const data = JSON.stringify({ app: 'countdown-board', version: 1, items: items.map(({ id, title, date, time, repeat, emoji, bg, pinned, note, order, createdAt }) => ({ id, title, date, time, repeat, emoji, bg, pinned, note, order, createdAt })) }, null, 2);
  if (dl) { try { await dl.save({ filename: 'countdown-board-' + iso(TODAY) + '.json', data }); toast('已匯出 ' + items.length + ' 筆'); } catch (e) { if (!/declin/i.test(String(e && (e.code || e.message || e)))) toast('匯出失敗'); } return; }
  try { await navigator.clipboard.writeText(data); toast('已複製 ' + items.length + ' 筆 JSON'); } catch (e) { toast('無法存取剪貼簿'); }
});
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), arr = Array.isArray(j) ? j : j.items; if (!Array.isArray(arr)) throw 0;
    let add = 0, bad = 0; const base = items.length ? Math.max(...items.map(x => x.order)) + 1 : 0;
    for (const r of arr) {
      if (!validItem(r)) { bad++; continue; }
      if (items.length >= 100) { bad++; continue; }
      if (items.some(x => x.title === r.title && x.date === r.date)) continue;
      items.push({ id: uid(), title: r.title.trim().slice(0, 30), date: r.date, time: r.time || null, repeat: r.repeat, emoji: typeof r.emoji === 'string' && r.emoji.length <= 8 ? r.emoji : '📅', bg: /^(c:#[0-9a-f]{6}|g:[0-3])$/i.test(r.bg) ? r.bg : 'c:' + COLORS[0], pinned: false, note: String(r.note || '').slice(0, 200), order: base + add, createdAt: Date.now() });
      add++;
    }
    save(); render(); toast('匯入 ' + add + ' 筆' + (bad ? '，略過 ' + bad + ' 筆' : ''));
  } catch (er) { toast('檔案格式不正確'); }
});

render(); scheduleMidnight();
window.__cd = { occurrence: (it, t) => { const n = occurrence(it, parseISO(t)); return n == null ? null : iso(n); }, dayInfo: (it, t, m) => dayInfo(it, parseISO(t), m || 'diff'), bgInfo, lum };
})();
</script>
