<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>森林糖果樹屋</title>
<style>
:root{
--ink:#3b2a1a; --ink2:#7a5f45; --card:#fffaf0f2; --chip:#fff7e8; --line:#ead9bf; --accent:#f58b3c; --accent2:#d96f22; --leaf:#4f9a5e; --gold:#ffc61a;
--ov:#22402c66; --tile:#fffdf7; --tileLock:#e9e2d4; --sel:linear-gradient(180deg,#cfe8c4,#f3e6c8);
--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
:root{ --ink:#f3ead8; --ink2:#c2b297; --card:#1d3326f2; --chip:#25402f; --line:#35523f; --tile:#22382b; --tileLock:#1a2a20; --ov:#050d0899;
--sel:linear-gradient(180deg,#132a1c,#1d2d22); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3d7350;color:var(--ink);
font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme: dark){ html,body{background:#10241a} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #0003;display:grid;place-items:center;flex:none;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.ibtn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 10px #0003;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;gap:6px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.candies{display:inline-flex;gap:1px}
.candies i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.candies i.on{background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ff4d6d 20% 100%)}
.hstars{font-size:18px;letter-spacing:0;flex:none;color:var(--line);white-space:nowrap}
.hstars .on{color:var(--gold);text-shadow:0 1px 0 #b98600}
@media (orientation:landscape) and (max-height:520px){ .hmid{flex:0 0 auto;width:190px} .hud{justify-content:flex-start} .hud .sp{flex:1} }
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px #0005;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;min-height:50px;border-radius:18px;margin-top:11px;font-weight:800;font-size:17px;background:linear-gradient(180deg,#7cc785,#4f9a5e);color:#fff;box-shadow:0 5px 0 #367447,0 8px 18px #36744744}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #367447}
.btn.sec{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.warm{background:linear-gradient(180deg,#ffa766,#f58b3c);box-shadow:0 5px 0 #c4661f,0 8px 18px #c4661f44}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.bigstars{font-size:46px;letter-spacing:8px;margin:2px 0;color:var(--line)}
.bigstars span{display:inline-block}
.bigstars .on{color:var(--gold);text-shadow:0 2px 0 #c99a00;animation:starpop .55s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-60deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 2px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:21px;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start;padding:0}
.ttl{position:absolute;left:0;right:0;top:calc(var(--sat) + 7vh);text-align:center;padding:0 16px;pointer-events:none}
.ttl h1{font-size:44px;margin:0;letter-spacing:4px;color:#fff8e6;text-shadow:0 3px 0 #8d5a2b,0 6px 0 #5b3a1c,0 12px 26px #0006}
.ttl .sub{color:#fff8e6;font-weight:700;margin-top:10px;font-size:15px;text-shadow:0 2px 6px #0008}
.tbtns{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);display:flex;flex-direction:column;align-items:center;gap:0;padding:0 24px}
.tbtns .btn{max-width:320px}
.tbtns .row2{width:100%;max-width:320px}
.tmute{position:absolute;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 10px)}
@media (orientation:landscape) and (max-height:520px){
.ttl{top:calc(var(--sat) + 14px);text-align:left;left:calc(var(--sal) + 24px);right:auto;width:46%} .ttl h1{font-size:34px}
.tbtns{left:auto;right:calc(var(--sar) + 20px);width:340px;bottom:calc(var(--sab) + 12px)} .tbtns .btn{min-height:44px;margin-top:8px}
}
/* select */
#select{align-items:stretch;padding:0;background:var(--sel)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:#c9bfa9;position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#4f9a5e}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px calc(var(--sar) + 12px) calc(var(--sab) + 24px) calc(var(--sal) + 12px);touch-action:pan-y}
.chap{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;gap:8px}
.chap b{font-size:16px}
.chap span{font-size:12px;color:var(--ink2);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lt{aspect-ratio:1/1.14;border-radius:15px;background:var(--tile);box-shadow:0 3px 0 var(--line),0 6px 12px #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px;min-height:44px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:68%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt.done{box-shadow:0 3px 0 #9bcf9f,0 6px 12px #0001}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--tileLock);box-shadow:none;color:var(--ink2);opacity:.75}
.lt.lock svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:30;background:#2b1d10ee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:9px 0;background:var(--chip);border-radius:16px;padding:9px}
.mech canvas{flex:none;width:58px;height:58px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:58vh;overflow-y:auto;margin:4px -6px;padding:0 6px;touch-action:pan-y}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat div{background:var(--chip);border-radius:14px;padding:8px;font-size:12px;color:var(--ink2)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.ach{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:14px;background:var(--chip);margin:6px 0;font-size:13px;color:var(--ink2)}
.ach i{font-style:normal;font-size:20px;width:30px;text-align:center;flex:none;filter:grayscale(1);opacity:.45}
.ach.on i{filter:none;opacity:1}
.ach b{display:block;color:var(--ink);font-size:14px}
.hats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.hats button{width:54px;height:60px;border-radius:16px;background:var(--chip);display:grid;place-items:center;position:relative;box-shadow:0 3px 0 var(--line)}
.hats button[aria-pressed="true"]{outline:3px solid var(--accent)}
.hats button[disabled]{opacity:.4}
.hats canvas{width:50px;height:50px}
.hats small{position:absolute;bottom:-1px;left:0;right:0;font-size:11px;color:var(--ink2)}
.sec-t{font-weight:800;font-size:15px;margin:12px 0 2px;text-align:left}
#shareImg{max-width:100%;border-radius:16px;margin-top:6px;-webkit-touch-callout:default}
.ready{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);z-index:6;background:var(--card);color:var(--ink);font-weight:800;font-size:16px;padding:12px 20px;border-radius:22px;box-shadow:0 6px 18px #0004;pointer-events:none;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
@keyframes bob2{50%{transform:translateY(-6px)}}
.demo-b{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:6;background:#2b1d10dd;color:#ffe9a8;font-weight:700;font-size:14px;padding:8px 14px;border-radius:14px;pointer-events:none;white-space:nowrap}
@media (orientation:landscape) and (max-height:520px){ .ready{left:calc(var(--sal) + 16px);transform:none;animation-name:bob2;bottom:calc(var(--sab) + 16px);white-space:normal;max-width:calc(50vw - 140px)} .demo-b{left:calc(var(--sal) + 16px);transform:none;top:auto;bottom:calc(var(--sab) + 16px)} }
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{margin:auto 0} }
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .ibtn:hover{filter:brightness(1.05)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
const stop = e => e.preventDefault();
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable], #shareImg')) e.preventDefault(); });
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
const live = new Set();
const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
Tracked.prototype = AC.prototype;
window.AudioContext = Tracked;
if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
document.addEventListener('visibilitychange', wake);
['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud hidden" id="hud">
<button class="ibtn" id="bPause" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
<div class="hmid">
<div>
<div class="lvname" id="hLevel">第 1 關</div>

</div>

</div>
</div>
<div class="ov hidden" id="select">

<div class="selhead">
<button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

</div>

</div>
</div>
<div class="ov hidden" id="pause"><div class="card">
<h2>暫停</h2>
<p id="pInfo"></p>
<button class="btn" id="pResume">繼續</button>
<div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>

</div></div>
<div class="ov hidden" id="win"><div class="card">
<h2 id="wTitle">好吃！</h2>
<div class="bigstars" id="wStars"></div>

<p id="wMsg"></p>

</div></div>
<div class="ov hidden" id="help"><div class="card">

<div class="helpscroll" id="helpBody"></div>
<button class="btn" id="hOk">知道了</button>
</div></div>
<div class="ov hidden" id="intro"><div class="card">
<h2 id="iTitle">新機關</h2>
<div id="iBody"></div>
<button class="btn warm" id="iOk">開始挑戰</button>
</div></div>
<div class="ov hidden" id="stats"><div class="card">

<div id="achList"></div>
</div>

</div></div>

</div></div>

<script>
/*CORE-START*/
var DT = 1 / 120, GRAV = 980, CR = 18, BUB_R = 30, FOX_R = 28, STAR_D = 32, PAD_D = CR + 5, SPIKE_D = CR + 4, HAT_D = 22;
var BLOW_STEPS = 60, BLOW_RANGE = 300, BLOW_ACC = 2100, BLOW_COS = 0.82, BUB_LIFT = 300;
var OP_CUT = 0, OP_POP = 1, OP_BLOW = 2, OP_FLIP = 3;
function normLevel(L) {
['r', 'b', 'w', 'k', 'a', 'p', 'h', 's', 'sol'].forEach(function (k) { if (!L[k]) L[k] = []; });
if (!L.v) L.v = [0, 0];
if (L.g === undefined) L.g = null;
return L;
}
function newWorld(L) {
return { t: 0, x: L.c[0], y: L.c[1], vx: L.v[0], vy: L.v[1], gd: 1, ib: -1, rc: [], ac: [], bp: [], bt: [], st: [0, 0, 0], nst: 0, hc: -1, status: 0, ev: null, cuts: 0 };
}
function cloneWorld(W) {
return { t: W.t, x: W.x, y: W.y, vx: W.vx, vy: W.vy, gd: W.gd, ib: W.ib, rc: W.rc.slice(), ac: W.ac.slice(), bp: W.bp.slice(), bt: W.bt.slice(), st: W.st.slice(), nst: W.nst, hc: W.hc, status: W.status, ev: null, cuts: W.cuts };
}
function nRopes(L) { return L.r.length + L.a.length; }
function ropeAttached(L, W, i) {
if (W.rc[i]) return false;
if (i < L.r.length) return true;
return !!W.ac[i - L.r.length];
}
function ropeLen(L, W, i) { return i < L.r.length ? L.r[i][2] : W.ac[i - L.r.length]; }
function anchorAt(L, i, t, out) {
if (i < L.r.length) {
var r = L.r[i];
if (r.length > 3) { var f = 0.5 - 0.5 * Math.cos(6.283185307179586 * t * DT / r[5]); out[0] = r[0] + (r[3] - r[0]) * f; out[1] = r[1] + (r[4] - r[1]) * f; }
else { out[0] = r[0]; out[1] = r[1]; }
} else { var a = L.a[i - L.r.length]; out[0] = a[0]; out[1] = a[1]; }
return out;
}
function segDist(px, py, x1, y1, x2, y2, out) {
var dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy, u = l2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
if (u < 0) u = 0; else if (u > 1) u = 1;
var qx = x1 + dx * u, qy = y1 + dy * u;
if (out) { out[0] = qx; out[1] = qy; }

}

s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()*0.5); s.stop(t+dur+0.05);
}

/* ---------------- vine chains (visual Verlet, pinned to anchor & candy) ---------------- */
function makeChain(i){
var a = anchorAt(L, i, W.t, [0,0]), len = ropeLen(L, W, i), n = Math.max(4, Math.round(len/12)), p = [];
for (var k=0;k<=n;k++){ var x = a[0] + (W.x - a[0])*k/n, y = a[1] + (W.y - a[1])*k/n; p.push([x,y,x,y]); }
return { rope: i, p: p, seg: len/n * 0.995, pinA: true, pinB: true, life: 1 };
}
function stepChain(c){
var p = c.p, n = p.length - 1, g = 980 * W.gd * DT * DT, k, it;
for (k=0;k<=n;k++){ var q = p[k], vx = (q[0]-q[2])*0.985, vy = (q[1]-q[3])*0.985; q[2]=q[0]; q[3]=q[1]; q[0]+=vx; q[1]+=vy+g; }
var a = c.pinA ? anchorAt(L, c.rope, W.t, [0,0]) : null;
for (it=0; it<12; it++){
if (a){ p[0][0]=a[0]; p[0][1]=a[1]; }
if (c.pinB && !candyGone){ p[n][0]=W.x; p[n][1]=W.y; }
for (k=0;k<n;k++){
var A = p[k], B = p[k+1], dx = B[0]-A[0], dy = B[1]-A[1], d = Math.sqrt(dx*dx+dy*dy) || 0.001, df = (d - c.seg)/d * 0.5;
var wa = (k===0 && a) ? 0 : 1, wb = (k+1===n && c.pinB && !candyGone) ? 0 : 1;
if (wa+wb === 0) continue;
var fa = wa/(wa+wb)*2*df, fb = wb/(wa+wb)*2*df;
A[0]+=dx*fa; A[1]+=dy*fa; B[0]-=dx*fb; B[1]-=dy*fb;
}
}
if (a){ p[0][0]=a[0]; p[0][1]=a[1]; }
if (c.pinB && !candyGone){ p[n][0]=W.x; p[n][1]=W.y; }
}
function splitChain(c, at){
var n = c.p.length - 1; at = Math.max(0, Math.min(n-1, at));
var A = { rope: c.rope, p: c.p.slice(0, at+1), seg: c.seg, pinA: true, pinB: false, life: 1, piece: true };
var B = { rope: c.rope, p: c.p.slice(at+1), seg: c.seg, pinA: false, pinB: true, life: 1, piece: true, tail: true };
var cut = c.p[at];
for (var i=0;i<9;i++) parts.push({ x: cut[0], y: cut[1], vx: (Math.random()-0.5)*260, vy: -Math.random()*200, life: 0.7+Math.random()*0.4, kind: 'chip', r: 2+Math.random()*2.5, rot: Math.random()*6 });

}
function syncChains(){
var nr = nRopes(L);
for (var i=0;i<nr;i++){
var c = null, ci = -1;
for (var k=0;k<chains.length;k++) if (chains[k].rope === i){ c = chains[k]; ci = k; }
var att = ropeAttached(L, W, i);
if (att && !c) chains.push(makeChain(i));
else if (!att && c){ chains.splice(ci, 1); splitChain(c, Math.floor(c.p.length*0.4)); }
}
}
function segInter(ax, ay, bx, by, cx, cy, dx, dy){
var r1x = bx-ax, r1y = by-ay, r2x = dx-cx, r2y = dy-cy, den = r1x*r2y - r1y*r2x;
if (Math.abs(den) < 1e-9) return false;
var t = ((cx-ax)*r2y - (cy-ay)*r2x)/den, u = ((cx-ax)*r1y - (cy-ay)*r1x)/den;
return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
function trySwipeCut(x1, y1, x2, y2){
var hit = false;
for (var k=chains.length-1;k>=0;k--){
var c = chains[k], p = c.p;
for (var j=0;j<p.length-1;j++){
if (segInter(x1,y1,x2,y2,p[j][0],p[j][1],p[j+1][0],p[j+1][1])){
if (applyOp(L, W, OP_CUT, c.rope)){ chains.splice(k,1); splitChain(c, j); opLog.push([W.t, 0, c.rope]); hit = true; }
break;
}

}

function drawParts(g){

function drawTrail(g){

/* ---------------- title showcase ---------------- */
function makeShowcase(){
lvl = 1; L = normLevel({ c: [250, 300], v: [0, 0], r: [[195, 150, 160]], s: [[110, 330], [280, 420]], f: [195, 470] });
W = newWorld(L); W.ev = []; chains = []; pieces = []; parts = []; trail = []; candyGone = 0; fox.sad = 0; fox.chew = 0; fox.jump = 0;
syncChains(); for (var s=0;s<60;s++) chains.forEach(stepChain);

/* ---------------- main loop ---------------- */
var lastTs = 0, acc = 0, ftime = 0;
function frame(ts){
requestAnimationFrame(frame);
var dt = Math.min(0.05, Math.max(0, (ts - lastTs)/1000)); lastTs = ts;
if (paused || document.hidden) dt = 0;
ftime += dt; fox.t = ftime;
if (mode === 'title' && W){ // gentle swinging showcase, never ends
acc += dt; var n0 = 0;
while (acc >= DT && n0 < 8){ stepWorld(L, W); W.ev = []; if (W.status){ W.status = 0; } for (var c=0;c<chains.length;c++) stepChain(chains[c]); acc -= DT; n0++; }
candyRot += W.vx*dt/18;
} else {
acc += dt; var n = 0;
while (acc >= DT && n < 8){ tick(); acc -= DT; n++; }
if (n >= 8) acc = 0;
}
for (var i=parts.length-1;i>=0;i--){ var p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i,1); continue; } p.vy += (p.kind === 'leaf' ? 120 : p.kind === 'spark' || p.kind === 'magic' ? 0 : 700)*dt; if (p.kind === 'leaf') p.vx *= 0.98; p.x += p.vx*dt; p.y += p.vy*dt; if (p.rot !== undefined) p.rot += dt*6; if (p.kind === 'spark') { p.vx *= 0.9; p.vy *= 0.9; } }
for (i=floaters.length-1;i>=0;i--){ floaters[i].t += dt*1.6; if (floaters[i].t >= 1) floaters.splice(i,1); }
for (var k in padAnim){ padAnim[k] = Math.max(0, padAnim[k] - dt*2.5); }
for (k in blowAnim){ blowAnim[k] = Math.max(0, blowAnim[k] - dt); }
flipAnim = Math.max(0, flipAnim - dt*3); hatFx = Math.max(0, hatFx - dt*2);
fox.blink = fox.blink > 0 ? fox.blink - dt : (Math.random() < dt*0.35 ? 0.14 : 0);
if (fox.jump > 0) fox.jump = Math.max(0, fox.jump - dt*2.2);
if (fox.chew > 0) fox.chew = Math.max(0, fox.chew - dt);
if (candyGone > 0) candyGone += dt;
if (ghost && ghost.t > 0) ghost.t -= dt;
if (endTimer > 0){ endTimer -= dt; if (endTimer <= 0){ endTimer = -1; if (mode === 'won'){ if (ghost && ghost.demo){ toast('換你囉！照著剛才的時機切切看'); startLevel(lvl); } else finishWin(); } else if (mode === 'failed'){ if (ghost && ghost.demo){ startLevel(lvl); } else finishFail(); } } }
draw();
}
function draw(){

if (bg) ctx.drawImage(bg, 0, 0); else { ctx.fillStyle = '#2d5a3d'; ctx.fillRect(0, 0, cv.width, cv.height); }

if (mode === 'title'){ ctx.save(); var sc = Math.min(1.1, (SH*0.55)/700*1.6); ctx.restore(); }

}
/* ---------------- lifecycle ---------------- */
document.addEventListener('visibilitychange', function(){ if (document.hidden && (mode === 'play' || mode === 'demo')) pauseGame(); });
window.__game = {
