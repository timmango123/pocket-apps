<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>果園快刀</title>
<style>
:root{
  --ink:#3b2413; --ink2:#7a5536; --card:#fff8eedd; --solid:#fffaf3; --line:#ecdcc6; --accent:#e4572e; --accent2:#c43d1c;
  --leaf:#4caf50; --leafoff:#c9b8a2; --shadow:#5a3a1a33; --ovbg:#3b241455; --chip:#fff3e2; --chipon:#e4572e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#fbead6; --ink2:#d4b896; --card:#2b1b12dd; --solid:#2f1f15; --line:#4a3424; --accent:#ff7a45; --accent2:#d9541f;
    --leaf:#6fd26f; --leafoff:#5a4636; --shadow:#0008; --ovbg:#0d070488; --chip:#3a271b; --chipon:#ff7a45; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9a86c;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
@media (prefers-color-scheme: dark){ html,body{background:#3a2618} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
  display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.scard{background:var(--card);border-radius:14px;padding:4px 12px 5px;min-width:84px;box-shadow:0 3px 10px var(--shadow)}
.scard .sc{font-size:26px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent)}
.scard .sc.bump{animation:bump .25s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.scard .best{font-size:11px;color:var(--ink2);font-weight:700;white-space:nowrap}
.hmid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dpill{background:var(--card);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:800;color:var(--ink2);box-shadow:0 3px 10px var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dpill b{color:var(--ink);font-size:15px}
.dbar{display:flex;gap:2px}.dbar i{width:4px;height:10px;border-radius:2px;background:var(--leafoff)}.dbar i.on{background:var(--accent)}
.timer{background:var(--card);border-radius:12px;padding:2px 12px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 10px var(--shadow)}
.timer.low{color:#e53935;animation:bump .5s ease infinite}
.hright{display:flex;align-items:center;gap:6px}
.lives{display:flex;gap:1px;background:var(--card);border-radius:14px;height:44px;padding:0 6px;align-items:center;box-shadow:0 3px 10px var(--shadow)}
.lives svg{width:26px;height:26px;transition:transform .3s,opacity .3s}
.lives svg path{fill:var(--leaf);stroke:#2e7d32;stroke-width:1.2}
.lives svg.off path{fill:var(--leafoff);stroke:var(--leafoff)}
.lives svg.off{transform:scale(.7) rotate(-30deg);opacity:.6}
.lives svg.pop{animation:leafpop .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes leafpop{0%{transform:scale(0)}100%{transform:scale(1)}}
#bPause{pointer-events:auto}
/* title */
#title{position:fixed;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column}
#title button{pointer-events:auto}
.ttop{display:flex;gap:8px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px)}
.ttop .flex{flex:1}
.tname{text-align:center;margin-top:2vh}
.tname h1{margin:0;font-size:clamp(40px,12vw,58px);letter-spacing:6px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 #c43d1c,0 6px 0 #8d2a12,0 12px 24px #0006;line-height:1.1}
.tname .sub{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--ink);background:var(--card);padding:5px 14px;border-radius:20px;box-shadow:0 3px 10px var(--shadow)}
.tspace{flex:1}
.tbottom{padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 14px) calc(var(--sal) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:18px;box-shadow:0 4px 14px var(--shadow);width:min(100%,440px)}
.mode{flex:1;min-height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px}
.mode b{font-size:15px}.mode small{font-size:11px;color:var(--ink2);font-weight:600}
.mode[aria-checked="true"]{background:var(--chipon);color:#fff;box-shadow:0 3px 0 var(--accent2)}
.mode[aria-checked="true"] small{color:#ffe9dc}
.mdesc{font-size:12px;color:var(--ink);background:var(--card);border-radius:12px;padding:5px 12px;text-align:center;font-weight:600;max-width:440px;box-shadow:0 3px 10px var(--shadow)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:var(--ovbg);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--solid);border-radius:26px;box-shadow:0 18px 50px #0005;padding:20px 20px 18px;width:min(360px,100%);text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.2);margin:auto 0}
.card h2{margin:2px 0 6px;font-size:26px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.55;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;
  background:linear-gradient(180deg,#ff8a5c,#e4572e);color:#fff;box-shadow:0 5px 0 #a8391a,0 8px 18px #a8391a44}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8391a}
.btn.sec{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.bigscore{font-size:64px;font-weight:900;color:var(--accent);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:linear-gradient(90deg,#ffcc33,#ff8a3d);color:#fff;font-weight:900;font-size:13px;padding:4px 12px;border-radius:12px;letter-spacing:1px;animation:pop .5s .3s both}
.res{display:flex;justify-content:center;gap:16px;margin:10px 0 2px;font-size:12px;color:var(--ink2)}
.res b{display:block;font-size:20px;color:var(--ink)}
.achnew{margin-top:8px;font-size:13px;color:var(--ink);background:var(--chip);border-radius:12px;padding:6px 10px}
.scroll{max-height:min(62vh,520px);overflow-y:auto;text-align:left;margin:4px -6px 0;padding:0 6px;touch-action:pan-y}
.sec-t{font-weight:900;font-size:15px;margin:12px 0 6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv span:nth-child(even){font-weight:800;text-align:right}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fcell{background:var(--chip);border-radius:12px;padding:6px 2px;text-align:center;font-size:11px;color:var(--ink2)}
.fcell canvas{width:34px;height:34px;display:block;margin:0 auto 2px}
.fcell b{display:block;color:var(--ink);font-size:14px}
.ach{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:var(--chip);margin-bottom:6px;font-size:13px}
.ach .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:15px;flex:none;color:var(--ink2)}
.ach.on .ic{background:linear-gradient(135deg,#ffd54a,#ff9a3d);color:#fff}
.ach b{display:block;font-size:14px}
.ach small{color:var(--ink2);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border-radius:14px;padding:6px 4px 8px;background:var(--chip);min-height:44px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;border:2px solid transparent}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px #e4572e33}
.opt i{display:block;width:100%;height:34px;border-radius:9px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#2b1b12ee;color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s;opacity:0}
.toast.show{opacity:1}
.shareimg{width:100%;border-radius:16px;display:block;margin-top:8px;-webkit-touch-callout:default}
@media (orientation:landscape) and (max-height:500px){
  .tname{margin-top:0}
  .tname h1{font-size:40px}
  .tname .sub{margin-top:4px;font-size:12px;padding:4px 12px}
  .tbottom{flex-direction:row;justify-content:center;align-items:center;gap:10px}
  .modes{width:min(56vw,440px)}
  .mdesc{max-width:34vw}
}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable], .shareimg')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <div class="scard"><div class="sc" id="hScore">0</div><div class="best">最高 <span id="hBest">0</span></div></div>
  <div class="hmid">
    <div class="dpill">難度 <b id="hDiff">1</b><span class="dbar" id="hDbar"></span></div>
    <div class="timer hidden" id="hTimer">60</div>
  </div>
  <div class="hright">
    <div class="lives" id="hLives" aria-label="剩餘 3 命"></div>
    <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>
</div>

<div id="title">
  <div class="ttop">
    <button class="ibtn" id="bStats" aria-label="統計與成就"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
    <button class="ibtn" id="bSkin" aria-label="外觀"><svg viewBox="0 0 24 24"><path d="M4 20l9-9M14 4l6 6-5 1-2-2z"/><circle cx="6" cy="6" r="2"/></svg></button>
    <span class="flex"></span>
    <button class="ibtn" id="bMute" aria-label="音效開關"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
  </div>
  <div class="tname"><h1>果園快刀</h1><div class="sub" id="tSub">劃過「開始」西瓜就開局</div></div>
  <div class="tspace" id="tSpace"></div>
  <div class="tbottom" id="tBottom">
    <div class="modes" role="radiogroup" aria-label="模式">
      <button class="mode" role="radio" data-m="classic" aria-checked="true"><b>經典</b><small>三命</small></button>
      <button class="mode" role="radio" data-m="timed" aria-checked="false"><b>限時</b><small>60 秒</small></button>
      <button class="mode" role="radio" data-m="zen" aria-checked="false"><b>禪</b><small>90 秒</small></button>
      <button class="mode" role="radio" data-m="daily" aria-checked="false"><b>每日</b><small>挑戰</small></button>
    </div>
    <div class="mdesc" id="mDesc"></div>
  </div>
</div>

<div class="ov hidden" id="pauseOv"><div class="card">
  <h2>暫停</h2><p>水果都停在半空中等你。</p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pMenu">主選單</button></div>
</div></div>

<div class="ov hidden" id="overOv"><div class="card">
  <h2 id="oTitle">三葉用盡</h2>
  <div class="bigscore" id="oScore">0</div>
  <div id="oBadge"></div>
  <div class="res"><div>最高分<b id="oBest">0</b></div><div>最大連切<b id="oCombo">0</b></div><div>切開<b id="oSlices">0</b></div><div>時間<b id="oTime">0</b></div></div>
  <div id="oAch"></div>
  <button class="btn" id="oAgain">再來一局</button>
  <div class="row2"><button class="btn sec" id="oShare">分享成績</button><button class="btn sec" id="oMenu">主選單</button></div>
</div></div>

<div class="ov hidden" id="statsOv"><div class="card">
  <h2>統計與成就</h2>
  <div class="scroll" id="statsBody"></div>
  <button class="btn" id="sClose">關閉</button>
</div></div>

<div class="ov hidden" id="skinOv"><div class="card">
  <h2>外觀</h2>
  <div class="sec-t" style="text-align:left">刀光</div>
  <div class="opts" role="radiogroup" aria-label="刀光" id="bladeOpts">
    <button class="opt" role="radio" data-v="bamboo"><i style="background:linear-gradient(90deg,#fff,#f3e3a6,#c9b56a)"></i>竹籤</button>
    <button class="opt" role="radio" data-v="rainbow"><i style="background:linear-gradient(90deg,#ff5a5a,#ffcc3a,#5ad26a,#4aa8ff,#b45aff)"></i>彩虹</button>
    <button class="opt" role="radio" data-v="spark"><i style="background:radial-gradient(circle at 30% 50%,#fff 0 8%,#ffd34a 20%,#ff6a1a 55%,#7a1a00)"></i>火花</button>
  </div>
  <div class="sec-t" style="text-align:left">砧板</div>
  <div class="opts" role="radiogroup" aria-label="砧板" id="boardOpts">
    <button class="opt" role="radio" data-v="wood"><i style="background:repeating-linear-gradient(0deg,#e2b178 0 10px,#d4a066 10px 12px)"></i>木紋</button>
    <button class="opt" role="radio" data-v="marble"><i style="background:linear-gradient(135deg,#f4f1ec 40%,#cfc9c0 45%,#f4f1ec 50%,#e5e0d8)"></i>大理石</button>
    <button class="opt" role="radio" data-v="picnic"><i style="background:repeating-linear-gradient(0deg,#e05a5a88 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,#e05a5a88 0 8px,#fff6ee 8px 16px)"></i>野餐布</button>
  </div>
  <button class="btn" id="kClose">完成</button>
</div></div>

<div class="ov hidden" id="shareOv"><div class="card">
  <h2>成績卡</h2><p>長按（或右鍵）圖片即可儲存。</p>
  <img class="shareimg" id="shareImg" alt="果園快刀成績卡">
  <button class="btn" id="shClose">關閉</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/*CORE-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var FRUIT_IDS=['melon','orange','apple','kiwi','lemon','grapefruit','mango','dragon'];
var KINDS={
  melon:{name:'西瓜',s:1.18,juice:'#ff3b4f'}, orange:{name:'橘子',s:0.98,juice:'#ff9a1f'}, apple:{name:'蘋果',s:0.95,juice:'#ffe39a'},
  kiwi:{name:'奇異果',s:0.86,juice:'#8fd03a'}, lemon:{name:'檸檬',s:0.9,juice:'#ffe14a'}, grapefruit:{name:'葡萄柚',s:1.08,juice:'#ff6b5a'},
  mango:{name:'芒果',s:1.0,juice:'#ffb52a'}, dragon:{name:'火龍果',s:1.0,juice:'#ff3d8b'},
  pine:{name:'金鳳梨',s:1.15,juice:'#ffd23a'}, ice:{name:'冰梨',s:1.0,juice:'#bfeaff'}, peach:{name:'彩虹桃',s:1.0,juice:'#ff9ec0'},
  nut:{name:'刺蝟栗子',s:0.95,juice:'#6b3d1f'}
};
// Difficulty curve (spec 五). t = elapsed play seconds.
function waveInterval(t){return Math.max(0.55,1.6*Math.pow(0.985,t));}
function waveCount(t){return Math.min(6,1+Math.floor(t/20));}
function nutProb(t){return t<15?0:Math.min(0.28,0.05+t*0.0025);}
function gravity(t,H){return 900*(1+Math.min(t,120)/300)*(H/844);}
function diffLevel(t){return 1+Math.floor(t/15);}
function baseR(W,H){return clamp(0.085*Math.min(W,H*0.62),26,46);}
var CUT_TOL=6, NUT_MARGIN=14, BAND_TOP=0.16, BAND_BOT=0.39;
function segDist(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,u=l?((px-ax)*dx+(py-ay)*dy)/l:0;u=u<0?0:u>1?1:u;var x=ax+u*dx-px,y=ay+u*dy-py;return Math.sqrt(x*x+y*y);}
// Stroke through fruit centres (in order), extended past both ends.
function strokeLine(pts,rFirst,rLast){
  var n=pts.length,a,b,d,l;
  if(n===1){return [[pts[0][0]-rFirst-24,pts[0][1]],[pts[0][0]+rFirst+24,pts[0][1]]];}
  a=pts[0];b=pts[1];d=[a[0]-b[0],a[1]-b[1]];l=Math.hypot(d[0],d[1])||1;
  var s=[[a[0]+d[0]/l*(rFirst+24),a[1]+d[1]/l*(rFirst+24)]];
  for(var i=0;i<n;i++)s.push(pts[i]);
  a=pts[n-1];b=pts[n-2];d=[a[0]-b[0],a[1]-b[1]];l=Math.hypot(d[0],d[1])||1;
  s.push([a[0]+d[0]/l*(rLast+24),a[1]+d[1]/l*(rLast+24)]);
  return s;
}
function polyDist(px,py,poly){var m=1e9;for(var i=0;i+1<poly.length;i++)m=Math.min(m,segDist(px,py,poly[i][0],poly[i][1],poly[i+1][0],poly[i+1][1]));return m;}
function placePath(rng,radii,xmin,xmax,top,bot){
  var m=radii.length,i,j;
  if(m===1)return [[xmin+rng()*(xmax-xmin),top+rng()*(bot-top)]];
  for(var a=0;a<80;a++){
    var steep=Math.min(1.25,0.3+a*0.03+(m>4?0.35:0));
    var pts=[[0,top+rng()*(bot-top)]],th=(rng()*2-1)*steep,ok=true;
    for(i=1;i<m;i++){
      var s=(radii[i-1]+radii[i])*(1.1+rng()*0.22);
      th=clamp(th+(rng()*2-1)*0.7,-steep,steep);
      var nx=pts[i-1][0]+Math.cos(th)*s,ny=pts[i-1][1]+Math.sin(th)*s;
      if(ny<top||ny>bot){th=-th;nx=pts[i-1][0]+Math.cos(th)*s;ny=pts[i-1][1]+Math.sin(th)*s;if(ny<top||ny>bot){ok=false;break;}}
      pts.push([nx,ny]);
    }
    if(!ok)continue;
    var w=pts[m-1][0];if(w>xmax-xmin)continue;
    var off=xmin+rng()*(xmax-xmin-w);

function posAt(it,tau){return [it.x0+it.vx*tau,it.y0+it.vy*tau+it.g*tau*tau/2];}
// Verify the guarantee: simulate to T, the stroke through all fruits misses every nut.
function waveSafe(w){

// ---------- spawning ----------
function spawnWave(){
  var t=G.t,w;
  if(t>=30&&t-G.lastPine>=45&&G.rng()<0.35){w=makePineWave(G.rng,t,W,H,R);G.lastPine=t;}
  else{
    var sp=null;
    if(t-G.lastSpec>=10){var r=G.rng();if(t>=60&&r<0.06)sp='peach';else if(t>=45&&r<0.13)sp='ice';}
    if(sp)G.lastSpec=t;
    w=makeWave(G.rng,t,W,H,R,{noNuts:G.mode==='zen',special:sp});
  }
  G.wave=(G.wave||0)+1;for(var i=0;i<w.items.length;i++)addItem(w.items[i]).w=G.wave;
}

// ---------- update ----------
var lastT=performance.now(),frameAvg=16,costAvg=0;
function update(rdt){
  var now=performance.now(),i;
  for(i=pendingStrokes.length-1;i>=0;i--){if(now-pendingStrokes[i].t>=250){finishStroke(pendingStrokes[i].s);pendingStrokes.splice(i,1);}}
  pointers.forEach(function(P){if(P.stroke.hits&&now-P.stroke.lastFast>600){finishStroke(P.stroke);P.stroke=newStroke();}});
  var ts=1;
  if(G.state==='play'){
    if(G.slowmo>0){G.slowmo-=rdt;ts=0.5;}
    if(G.pull>0)G.pull-=rdt;
    G.real+=rdt;
    if(G.timeLeft){G.timeLeft-=rdt;var sec=Math.ceil(G.timeLeft);if(sec<=5&&sec!==G.lastTick&&sec>0){G.lastTick=sec;Snd.tick();}if(G.timeLeft<=0){G.timeLeft=0;endGame('time');}}
    if(G.mode==='classic'&&G.real-G.lastMiss>=120)unlock('nomiss');
  }else if(G.state==='ending'){ts=0.25;G.endT-=rdt;if(G.endT<=0)showOver();}
  var dt=rdt*ts;
  if(G.state==='play'){
    G.t+=dt;G.waveTimer-=dt;
    if(G.waveTimer<=0){spawnWave();G.waveTimer+=waveInterval(G.t);}
    updHud(false);
  }
  if(G.state==='title'){
    if(G.startTimer>0){G.startTimer-=rdt;if(G.startTimer<=0)startGame();}
    G.titleToss-=rdt;if(G.titleToss<=0&&!G.startTimer){G.titleToss=1.6+Math.random();var tw=makeWave(Math.random,8,W,H,R,{noNuts:true});var it=tw.items[0];it.x0=Math.random()<0.5?W*0.12:W*0.88;it.vx=(W/2-it.x0)/tw.T*0.6;addItem(it);}
  }
  var cx=W/2,cy=H*0.42;
  for(i=items.length-1;i>=0;i--){
    var it2=items[i];
    if(it2.kind==='start'){it2.bob+=rdt;it2.y=startY+Math.sin(it2.bob*2.2)*6;it2.rot=Math.sin(it2.bob*1.3)*0.08;continue;}
    if(G.pull>0&&it2.kind!=='nut'&&G.state==='play'){
      var k=6,d=3;it2.vx+=((cx-it2.x)*k-it2.vx*d)*dt;it2.vy+=((cy-it2.y)*k-it2.vy*d)*dt;
    }else it2.vy+=it2.g*dt;
    it2.x+=it2.vx*dt;it2.y+=it2.vy*dt;it2.rot+=it2.spin*dt;
    if(it2.kind==='pine'){if(it2.x<it2.r&&it2.vx<0)it2.vx=-it2.vx;if(it2.x>W-it2.r&&it2.vx>0)it2.vx=-it2.vx;}
    if(it2.y<H-it2.r)it2.entered=true;
    if(it2.vy>0&&it2.y-it2.r>H+4){
      items.splice(i,1);
      if(G.state==='play'&&it2.kind!=='nut'&&it2.kind!=='pine'&&it2.entered){
        G.misses++;stats.misses++;G.lastMiss=G.real;
        if(hasLives()){marks.push({x:clamp(it2.x,24,W-24),life:1.2});Snd.miss();buzz(30);G.shake=Math.max(G.shake,0.25);loseLife();}
      }
    }
  }
  for(i=halves.length-1;i>=0;i--){var h=halves[i];h.vy+=h.g*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.spin*dt;h.life-=dt;if(h.y>H+R*3||h.life<=0)halves.splice(i,1);}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.vy+=(p.type===1?200:700)*dt;p.vx*=1-1.5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(i=pops.length-1;i>=0;i--){pops[i].life-=rdt;pops[i].y-=30*rdt;if(pops[i].life<=0)pops.splice(i,1);}
  for(i=stains.length-1;i>=0;i--){stains[i].life-=rdt;if(stains[i].life<=0)stains.splice(i,1);}
  for(i=marks.length-1;i>=0;i--){marks[i].life-=rdt;if(marks[i].life<=0)marks.splice(i,1);}
  for(i=oldTrails.length-1;i>=0;i--){var tr=oldTrails[i];if(!tr.length||now-tr[tr.length-1].t>200)oldTrails.splice(i,1);}
  G.flash=Math.max(0,G.flash-rdt*2.2);G.shake=Math.max(0,G.shake-rdt);
}

function updLives(gain){var sv=$('hLives').children;for(var i=0;i<3;i++){var on=i<G.lives;sv[i].classList.toggle('off',!on);if(gain&&i===G.lives-1){sv[i].classList.remove('pop');void sv[i].offsetWidth;sv[i].classList.add('pop');}}$('hLives').setAttribute('aria-label','剩餘 '+G.lives+' 命');}
function updHud(force){
  var d=diffLevel(G.t);if(d!==lastDiff||force){lastDiff=d;$('hDiff').textContent=d;var is=dbar.children;for(var i=0;i<8;i++)is[i].classList.toggle('on',i<Math.min(8,d));if(!force&&d>1)toast('難度提升 → '+d);}
  if(G.timeLeft||G.mode==='timed'||G.mode==='zen'){var tl=$('hTimer'),s=Math.ceil(G.timeLeft);tl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');tl.classList.toggle('low',s<=10);}
}
var MDESC={classic:'漏一顆或碰到栗子扣一片葉，每 100 分補一命。',timed:'60 秒無命數，碰到栗子扣 10 分。',zen:'90 秒沒有栗子，安心切個痛快。',daily:'今天的拋擲順序人人相同，比比看誰高分。'};
function updTitle(){
  document.querySelectorAll('.mode').forEach(function(b){b.setAttribute('aria-checked',String(b.dataset.m===G.mode));});
  var bs=modeBest();$('mDesc').innerHTML=MDESC[G.mode]+(bs?' 最高 <b>'+bs+'</b>':'');
}
function muteIcon(){$('muteIcon').innerHTML=settings.muted?'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/>':'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/>';}

// ---------- overlays ----------
document.querySelectorAll('.mode').forEach(function(b){b.addEventListener('click',function(){G.mode=b.dataset.m;settings.mode=G.mode;saveSettings();updTitle();});});
$('bMute').addEventListener('click',function(){settings.muted=!settings.muted;saveSettings();muteIcon();Snd.init();});
$('bPause').addEventListener('click',pauseGame);
$('pResume').addEventListener('click',resumeGame);
$('pRestart').addEventListener('click',function(){$('pauseOv').classList.add('hidden');startGame();});
$('pMenu').addEventListener('click',toTitle);
$('oAgain').addEventListener('click',startGame);
$('oMenu').addEventListener('click',toTitle);
$('oShare').addEventListener('click',shareScore);
$('shClose').addEventListener('click',function(){$('shareOv').classList.add('hidden');});
$('bStats').addEventListener('click',function(){buildStats();$('statsOv').classList.remove('hidden');});
$('sClose').addEventListener('click',function(){$('statsOv').classList.add('hidden');});
$('bSkin').addEventListener('click',function(){syncSkin();$('skinOv').classList.remove('hidden');});
$('kClose').addEventListener('click',function(){$('skinOv').classList.add('hidden');});
function syncSkin(){document.querySelectorAll('#bladeOpts .opt').forEach(function(b){b.setAttribute('aria-checked',String(b.dataset.v===settings.blade));});document.querySelectorAll('#boardOpts .opt').forEach(function(b){b.setAttribute('aria-checked',String(b.dataset.v===settings.board));});}
document.querySelectorAll('#bladeOpts .opt').forEach(function(b){b.addEventListener('click',function(){settings.blade=b.dataset.v;saveSettings();syncSkin();});});
document.querySelectorAll('#boardOpts .opt').forEach(function(b){b.addEventListener('click',function(){settings.board=b.dataset.v;saveSettings();syncSkin();renderBoard();});});
function iconCanvas(k){var s=SPR[k],c=makeCanvas(68,68),x=c.getContext('2d');x.drawImage(s.whole,0,0,68,68);return c;}
function buildStats(){
  var b=$('statsBody'),h='<div class="sec-t">總覽</div><div class="kv">';
  [['遊玩局數',stats.games],['總切數',stats.slices],['最大連切',stats.maxCombo],['碰到栗子',stats.nuts],['漏掉水果',stats.misses],['經典最高',best],['限時最高',stats.bestTimed],['禪模式最高',stats.bestZen],['今日挑戰',stats.daily.date===todayStr()?stats.daily.best:0]].forEach(function(r){h+='<span>'+r[0]+'</span><span>'+r[1]+'</span>';});
  h+='</div><div class="sec-t">各水果切開數</div><div class="fgrid" id="fgrid"></div><div class="sec-t">成就</div>';
  for(var k in ACH){var on=!!stats.ach[k];h+='<div class="ach'+(on?' on':'')+'"><div class="ic">'+(on?'★':'☆')+'</div><div><b>'+ACH[k].n+'</b><small>'+ACH[k].d+'</small></div></div>';}
  b.innerHTML=h;var fg=$('fgrid');
  FRUIT_IDS.concat(['pine','ice','peach']).forEach(function(k){var d=document.createElement('div');d.className='fcell';d.appendChild(iconCanvas(k));var t=document.createElement('div');t.innerHTML='<b>'+(stats.per[k]||0)+'</b>'+KINDS[k].name;d.appendChild(t);fg.appendChild(d);});
}
function shareScore(){
  var c=makeCanvas(600,800),x=c.getContext('2d');
  if(bgC)x.drawImage(bgC,0,0,bgC.width,bgC.height,-(Math.max(600,800*W/H)-600)/2,0,Math.max(600,800*W/H),800);
  x.fillStyle=dark?'rgba(20,10,5,.55)':'rgba(255,248,238,.6)';x.fillRect(40,90,520,620);
  x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  x.font='900 76px system-ui,sans-serif';x.lineWidth=12;x.strokeStyle='#8d2a12';x.strokeText('果園快刀',300,190);x.fillStyle='#fff';x.fillText('果園快刀',300,190);
  var ml={classic:'經典模式',timed:'限時 60 秒',zen:'禪模式',daily:'每日挑戰 '+todayStr()}[G.mode];
  x.font='700 30px system-ui,sans-serif';x.fillStyle=dark?'#fbead6':'#3b2413';x.fillText(ml,300,270);
  x.font='900 170px system-ui,sans-serif';x.fillStyle='#e4572e';x.fillText(String(G.score),300,410);
  x.font='700 30px system-ui,sans-serif';x.fillStyle=dark?'#fbead6':'#3b2413';x.fillText('最大連切 '+G.maxCombo+'　切開 '+G.slices+' 顆',300,540);
  ['melon','orange','dragon','kiwi','lemon'].forEach(function(k,i){var s=SPR[k];x.drawImage(s.whole,80+i*95,580,96,96);});
  c.toBlob(function(blob){
    var f=null;try{f=new File([blob],'fruit-slash.png',{type:'image/png'});}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'果園快刀',text:'我在果園快刀拿到 '+G.score+' 分！'}).catch(function(){showImg();});}
    else showImg();
  });
  function showImg(){$('shareImg').src=c.toDataURL('image/png');$('shareOv').classList.remove('hidden');}
}

// ---------- layout ----------
var startY=0;
function layoutStart(){
  var a=$('tSpace').getBoundingClientRect();
  var top=a.top,bot=a.bottom;if(bot-top<60){top=H*0.3;bot=H*0.75;}
  startY=(top+bot)/2;
  var nr=clamp(Math.min((bot-top)*0.42,W*0.26),40,110);
  if(Math.abs(nr-startR)>0.5||!SPR.start){startR=nr;SPR.start=buildSprite('start',startR);}
  if(startItem){startItem.r=startR;startItem.x=W/2;startItem.y=startY;}
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  R=baseR(W,H);buildSprites();renderBoard();
  if(G.state==='title')layoutStart();
}
window.addEventListener('resize',function(){clearTimeout(resize.t);resize.t=setTimeout(resize,80);});
if(mqDark){var onTheme=function(){dark=mqDark.matches;renderBoard();};if(mqDark.addEventListener)mqDark.addEventListener('change',onTheme);else if(mqDark.addListener)mqDark.addListener(onTheme);}
document.addEventListener('visibilitychange',function(){if(document.hidden){pauseGame();}else{lastT=performance.now();}});
window.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='p'){if(G.paused)resumeGame();else pauseGame();}});

function loop(now){
  requestAnimationFrame(loop);
  var rdt=(now-lastT)/1000;lastT=now;if(rdt>0.05)rdt=0.05;if(rdt<0)rdt=0;
  frameAvg=frameAvg*0.97+rdt*1000*0.03;if(frameAvg>26&&PCAP>120)PCAP=120;
  if(document.hidden)return;
  var c0=performance.now();
  if(!G.paused)update(rdt);
  render();
  costAvg=costAvg*0.95+(performance.now()-c0)*0.05;
}

// test / bot hook (read-only snapshot + state)
window.__game={
  state:function(){return {state:G.state,mode:G.mode,t:G.t,real:G.real,score:G.score,lives:G.lives,maxCombo:G.maxCombo,slices:G.slices,misses:G.misses,diff:diffLevel(G.t),slowmo:G.slowmo,pull:G.pull,paused:G.paused,fps:Math.round(1000/frameAvg),parts:parts.length,ptrs:pointers.size,cost:+costAvg.toFixed(2)};},
  jump:function(t){G.t=t;},
  hold:function(){G.waveTimer=1e9;},
  clear:function(){items.length=0;},
  place:function(kind,x,y,vy){var o=addItem({kind:kind,x0:x,y0:y,vx:0,vy:vy||0,g:vy?gravity(G.t,H):0,r:R*KINDS[kind].s});o.spin=0;o.entered=true;return o.id;},
  set:function(o){for(var k in o)G[k]=o[k];if('lives' in o)updLives();},
  spawn:function(kind){var w=kind==='pine'?makePineWave(Math.random,G.t,W,H,R):makeWave(Math.random,G.t,W,H,R,{special:kind==='ice'||kind==='peach'?kind:null});for(var i=0;i<w.items.length;i++){if(kind==='nut'&&i===0)w.items[i].kind='nut';addItem(w.items[i]);}},
  snap:function(){return {now:performance.now(),W:W,H:H,R:R,state:G.state,ts:G.state==='ending'?0.25:G.slowmo>0?0.5:1,pull:G.pull>0,cx:W/2,cy:H*0.42,items:items.map(function(i){return {id:i.id,w:i.w||0,kind:i.kind,x:i.x,y:i.y,vx:i.vx,vy:i.vy,g:i.g,r:i.r,hits:i.hits};})};}
};

resize();muteIcon();updTitle();toTitle();
requestAnimationFrame(function(n){lastT=n;loop(n);});
})();
</script>
</body>
</html>
