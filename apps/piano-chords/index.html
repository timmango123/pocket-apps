<script>
'use strict';
/*CORE-START*/
const PC = (() => {
const NAT = [0, 2, 4, 5, 7, 9, 11];                 // C D E F G A B

const SOL = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
const ACC = { '-3': '♭♭♭', '-2': '♭♭', '-1': '♭', '0': '', '1': '♯', '2': '♯♯', '3': '♯♯♯' };
const BLACK = new Set([1, 3, 6, 8, 10]);
const LO = 36, HI = 96;                             // C2 … C7
// preferred spelling of each pitch class, then its alternative
const PC_SPELL = [[[0, 0], [6, 1]], [[1, -1], [0, 1]], [[1, 0]], [[2, -1], [1, 1]], [[2, 0], [3, -1]], [[3, 0], [2, 1]], [[3, 1], [4, -1]], [[4, 0]], [[5, -1], [4, 1]], [[5, 0]], [[6, -1], [5, 1]], [[6, 0], [0, -1]]];
const MAJ_SEMI = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];
const I = (d, s) => [d, s];
// chord qualities: id, symbol, Chinese name, intervals [degree, semitones]
const QUAL = [
  ['maj', '', '大三和弦', [I(1, 0), I(3, 4), I(5, 7)]],
  ['m', 'm', '小三和弦', [I(1, 0), I(3, 3), I(5, 7)]],
  ['7', '7', '屬七和弦', [I(1, 0), I(3, 4), I(5, 7), I(7, 10)]],

  ['dim', 'dim', '減三和弦', [I(1, 0), I(3, 3), I(5, 6)]],
  ['dim7', 'dim7', '減七和弦', [I(1, 0), I(3, 3), I(5, 6), I(7, 9)]],

  ['maj9', 'maj9', '大九和弦', [I(1, 0), I(3, 4), I(5, 7), I(7, 11), I(9, 14)]],
  ['m9', 'm9', '小九和弦', [I(1, 0), I(3, 3), I(5, 7), I(7, 10), I(9, 14)]],
  ['add9', 'add9', '加九和弦', [I(1, 0), I(3, 4), I(5, 7), I(9, 14)]],
  ['69', '6/9', '六九和弦', [I(1, 0), I(3, 4), I(5, 7), I(6, 9), I(9, 14)]],
  ['11', '11', '屬十一和弦', [I(1, 0), I(3, 4), I(5, 7), I(7, 10), I(9, 14), I(11, 17)]],
  ['13', '13', '屬十三和弦', [I(1, 0), I(3, 4), I(5, 7), I(7, 10), I(9, 14), I(13, 21)]],
  ['7sus4', '7sus4', '屬七掛四', [I(1, 0), I(4, 5), I(5, 7), I(7, 10)]],
  ['7b9', '7♭9', '屬七降九', [I(1, 0), I(3, 4), I(5, 7), I(7, 10), I(9, 13)]],
  ['aug7', '7♯5', '屬七升五', [I(1, 0), I(3, 4), I(5, 8), I(7, 10)]],
  ['mMaj7', 'mM7', '小大七和弦', [I(1, 0), I(3, 3), I(5, 7), I(7, 11)]],

const QMAP = Object.fromEntries(QUAL.map(q => [q[0], q]));
const SCALES = [
  ['major', '大調', '', [I(1, 0), I(2, 2), I(3, 4), I(4, 5), I(5, 7), I(6, 9), I(7, 11)]],
  ['minor', '自然小調', '', [I(1, 0), I(2, 2), I(3, 3), I(4, 5), I(5, 7), I(6, 8), I(7, 10)]],
  ['harm', '和聲小調', '', [I(1, 0), I(2, 2), I(3, 3), I(4, 5), I(5, 7), I(6, 8), I(7, 11)]],
  ['melo', '旋律小調', '上行；下行用自然小調', [I(1, 0), I(2, 2), I(3, 3), I(4, 5), I(5, 7), I(6, 9), I(7, 11)]],
  ['pentM', '大調五聲', '', [I(1, 0), I(2, 2), I(3, 4), I(5, 7), I(6, 9)]],
  ['pentm', '小調五聲', '', [I(1, 0), I(3, 3), I(4, 5), I(5, 7), I(7, 10)]],
  ['blues', '藍調音階', '', [I(1, 0), I(3, 3), I(4, 5), I(5, 6), I(5, 7), I(7, 10)]],
  ['dorian', 'Dorian', '多利安調式', [I(1, 0), I(2, 2), I(3, 3), I(4, 5), I(5, 7), I(6, 9), I(7, 10)]],
  ['phrygian', 'Phrygian', '弗里幾亞調式', [I(1, 0), I(2, 1), I(3, 3), I(4, 5), I(5, 7), I(6, 8), I(7, 10)]],

  ['mixo', 'Mixolydian', '混合利底亞調式', [I(1, 0), I(2, 2), I(3, 4), I(4, 5), I(5, 7), I(6, 9), I(7, 10)]],
  ['locrian', 'Locrian', '洛克里安調式', [I(1, 0), I(2, 1), I(3, 3), I(4, 5), I(5, 6), I(6, 8), I(7, 10)]],
];
const SMAP = Object.fromEntries(SCALES.map(s => [s[0], s]));

const pcOf = (l, a) => ((NAT[l] + a) % 12 + 12) % 12;
const nameOf = (l, a) => LET[l] + (ACC[a] || '');
function label(l, a, mode) {
  if (mode === 'none') return '';
  const acc = ACC[a] || '';
  if (mode === 'solfege') return SOL[l] + acc;
  if (mode === 'num') return acc + (l + 1);
  return LET[l] + acc;
}
// spell one interval above a root: letters follow the degree, the accidental makes the semitones right (F♯ maj7 → E♯, G♭ maj7 → F)
function spell(rl, ra, [deg, semis]) {
  const l = (rl + deg - 1) % 7;
  let nat = NAT[l] - NAT[rl]; if (nat < 0) nat += 12;
  nat += 12 * Math.floor((deg - 1) / 7);
  const a = ra + semis - nat;
  return { l, a, deg, semis, name: nameOf(l, a), label: intervalLabel(deg, semis) };
}
function intervalLabel(deg, semis) {
  if (deg === 1) return 'R';
  const d = semis - MAJ_SEMI[deg - 1];
  return (d < 0 ? '♭'.repeat(-d) : '♯'.repeat(d)) + deg;
}
const INTERVAL_ZH = ['同度', '小二度', '大二度', '小三度', '大三度', '完全四度', '三全音（增四度）', '完全五度', '小六度', '大六度', '小七度', '大七度', '八度'];
const DYAD_DEG = [1, 2, 2, 3, 3, 4, 4, 5, 6, 6, 7, 7];
const midiOf = (l, a, oct) => 12 * (oct + 1) + NAT[l] + a;

// ---------- scale tab ----------
const syncScRoot = rootPicker($('#scLetters'), $('#scAcc'), () => S.scRoot, r => { S.scRoot = r; scaleChanged(true); });
$('#scType').innerHTML = PC.SCALES.map(s => `<button type="button" class="chip" data-s="${s[0]}" aria-pressed="false">${s[1]}</button>`).join('');
$('#sCount').textContent = `共 ${PC.SCALES.length} 種，左右滑動`;
const updScFade = fadeEdges($('#scType'));
$('#scType').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; S.scale = b.dataset.s; scaleChanged(true); });
$('#scOct').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.scOct = +b.dataset.o; scaleChanged(true); });
let scUp = [], scDown = [], scNotesNow = [];
function scaleChanged(user) {
  const sc = PC.SMAP[S.scale], notes = PC.scaleNotes(S.scRoot.l, S.scRoot.a, S.scale);
  scNotesNow = notes;
  $('#scName').innerHTML = fmt(PC.nameOf(S.scRoot.l, S.scRoot.a) + ' ' + sc[1]);
  $('#scZh').textContent = sc[2];
  setNotes($('#scNotes'), noteChips(notes, n => n.deg === 1 ? 'root' : 'scale'));
  $('#scType').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === S.scale)));
  selectChip($('#scType'), '[aria-pressed="true"]'); updScFade();
  $('#scOct').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.o === S.scOct)); b.textContent = PC.nameOf(S.scRoot.l, S.scRoot.a) + b.dataset.o; });
  syncScRoot();
  scUp = PC.scaleMidi(S.scRoot.l, S.scRoot.a, S.scale, S.scOct);
  scDown = PC.scaleMidi(S.scRoot.l, S.scRoot.a, S.scale === 'melo' ? 'minor' : S.scale, S.scOct).reverse();
  while (scUp[scUp.length - 1] > PC.HI) { scUp = scUp.map(m => m - 12); scDown = scDown.map(m => m - 12); }
  HL = {};
  const byPc = {}; notes.forEach(n => byPc[PC.pcOf(n.l, n.a)] = n);
  for (let m = PC.LO; m <= PC.HI; m++) { const n = byPc[m % 12]; if (n) HL[m] = { role: n.deg === 1 ? 'root' : 'scale', l: n.l, a: n.a }; }
  renderKeys(); ensureVisible(scUp);
  if (user) stopSeq();
  save();
}
$('#playUp').addEventListener('click', () => playSeq(runEvents(scUp)));
$('#playDown').addEventListener('click', () => playSeq(runEvents(scDown)));
$('#playBoth').addEventListener('click', () => playSeq(runEvents(scUp.concat(scDown.slice(1)))));
$('#scCopy').addEventListener('click', () => { copyText(`${$('#scName').textContent}：${scNotesNow.map(n => n.name).join(' ')}`); flashDone($('#scCopy')); });

// ---------- identification tab ----------
function toggleHeld(m, addOnly = false) {
  if (HELD.has(m) && !addOnly) HELD.delete(m); else HELD.add(m);
  identChanged();
}
let identResult = null;
const EMPTY_HTML = '<div class="emptyst"><svg viewBox="0 0 64 52" aria-hidden="true"><g stroke="#a69c8a" stroke-width="1.2"><rect x="1" y="1" width="15" height="50" rx="3" fill="#fbf8f0"/><rect x="16.5" y="1" width="15" height="50" rx="3" fill="#f3d9a4"/><rect x="32" y="1" width="15" height="50" rx="3" fill="#fbf8f0"/><rect x="47.5" y="1" width="15" height="50" rx="3" fill="#efb3a6"/></g><rect x="11" y="1" width="9" height="30" rx="2" fill="#1d1a1b"/><rect x="27" y="1" width="9" height="30" rx="2" fill="#1d1a1b"/><circle cx="24" cy="42" r="3.2" fill="var(--press)"/><circle cx="55" cy="42" r="3.2" fill="var(--press)"/></svg><p>在下方琴鍵按幾個音（再按一次移除），這裡會即時告訴你是什麼和弦。</p></div>';
function identChanged() {
  const ms = [...HELD].sort((a, b) => a - b);
  identResult = PC.identify(ms);
  const r = identResult, best = r.matches[0];
  const spelled = best ? best.notes : (r.notes || []);
  const spellOf = m => spelled.find(x => PC.pcOf(x.l, x.a) === m % 12) || PC.defaultSpell(m);
  setNotes($('#identNotes'), ms.length ? ms.map(m => { const n = spellOf(m); return `<div class="note ${best && n.deg === 1 ? 'root' : ''}"><b>${fmt(PC.label(n.l, n.a, nameMode()))}</b><small>${best ? n.label : Math.floor(m / 12) - 1}</small></div>`; }).join('') : EMPTY_HTML);
  const nm = $('#identName');
  nm.innerHTML = ms.length ? fmt(r.name) : '點琴鍵開始'; nm.classList.toggle('ph', !ms.length);
  $('#identZh').textContent = ms.length ? r.zh : '';
  const alts = r.matches.slice(1, 7);
  $('#identAlts').innerHTML = alts.map((x, i) => `<button type="button" class="chip" data-i="${i + 1}"><span class="sym">${fmt(x.name)}</span><small>${x.zh}</small></button>`).join('');
  $('#identAltBox').hidden = !alts.length;
  $('#identTries').hidden = ms.length > 0;
  $('#identPlay').disabled = !ms.length; $('#identClear').disabled = !ms.length; $('#identCopy').disabled = !ms.length;
  $('#identOpen').disabled = !best;
  if (S.tab === 'ident') {
    HL = {};
    for (const m of ms) { const n = spellOf(m); HL[m] = { role: best && n.deg === 1 ? 'root' : 'tone', l: n.l, a: n.a }; }
    renderKeys();
  }
  S.held = ms; save();
}
function openInChordTab(match) {
  S.chRoot = { l: match.root.l, a: match.root.a }; S.q = match.q; S.inv = match.inv;
  clearSearch(); showTab('chord', true);
}
$('#identAlts').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b && identResult) openInChordTab(identResult.matches[+b.dataset.i]); });
$('#identOpen').addEventListener('click', () => { if (identResult && identResult.matches[0]) openInChordTab(identResult.matches[0]); });
$('#identClear').addEventListener('click', () => {
  const was = [...HELD]; if (!was.length) return;
  HELD.clear(); identChanged();
  toast(`已清除 ${was.length} 個音`, { label: '復原', fn: () => { was.forEach(m => HELD.add(m)); identChanged(); } });
});
$('#identPlay').addEventListener('click', () => { if (HELD.size) playSeq(blockEvents([...HELD].sort((a, b) => a - b), 0, 1500)); });
$('#identCopy').addEventListener('click', () => {
  if (!HELD.size) return;
  const ms = [...HELD].sort((a, b) => a - b), r = identResult, sp = r.matches[0] ? r.matches[0].notes : (r.notes || []);
  const names = ms.map(m => { const n = sp.find(x => PC.pcOf(x.l, x.a) === m % 12) || PC.defaultSpell(m); return PC.nameOf(n.l, n.a); });
  copyText(`${r.name}（${r.zh}）：${names.join(' ')}`); flashDone($('#identCopy'));
});
// one-tap examples for first-time users
[['C/E', [64, 67, 72]], ['Am7', [57, 60, 64, 67]], ['G7', [55, 59, 62, 65]], ['F♯m7♭5', [54, 57, 60, 64]]].forEach(([n, ms]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.innerHTML = '<span class="sym">' + fmt(n) + '</span>';
  b.addEventListener('click', () => { HELD.clear(); ms.forEach(m => HELD.add(m)); identChanged(); ensureVisible(ms); playSeq(blockEvents(ms, 0, 1300)); });
  $('#identTries').appendChild(b);
});

// ---------- tabs ----------
const TABS = ['chord', 'scale', 'ident'];
function showTab(t, play = false) {
  const changed = S.tab !== t;
  S.tab = t;
  document.querySelectorAll('.tabs [role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  $('.tabs .ind').style.transform = `translateX(${TABS.indexOf(t) * 100}%)`;
  for (const k of TABS) $('#tab-' + k).hidden = k !== t;
  stopSeq();
  if (t === 'chord') chordChanged(play); else if (t === 'scale') scaleChanged(); else identChanged();
  if (changed) $('#panel').scrollTop = 0;
  updQualFade(); updScFade();
  save();
}
$('.tabs').addEventListener('click', e => { const b = e.target.closest('[role="tab"]'); if (b) showTab(b.dataset.tab); });

// ---------- header controls ----------
const pedalBtn = $('#pedalBtn');
function syncPedal() { pedalBtn.setAttribute('aria-pressed', String(S.pedal)); Piano.setPedal(S.pedal); }
pedalBtn.addEventListener('click', () => { S.pedal = !S.pedal; syncPedal(); save(); toast(S.pedal ? '延音踏板：踩下（放開琴鍵聲音仍延續）' : '延音踏板：放開'); });
syncPedal();
$('#volBtn').addEventListener('click', () => { const p = $('#volPanel'); p.hidden = !p.hidden; $('#volBtn').setAttribute('aria-expanded', String(!p.hidden)); });
$('#vol').value = S.vol; $('#volOut').textContent = S.vol + '%';
$('#vol').addEventListener('input', () => { S.vol = +$('#vol').value; $('#volOut').textContent = S.vol + '%'; Piano.setVolume(S.vol / 100); save(); });
$('#panicBtn').addEventListener('click', () => { stopSeq(); Piano.allOff(); for (const m of [...PRESSED.keys()]) { PRESSED.delete(m); KEL[m].classList.remove('on'); } fingers.clear(); toast('已停止所有聲音'); });
$('#nameSel').value = S.names;
$('#nameSel').addEventListener('change', () => { S.names = $('#nameSel').value; save(); showTab(S.tab); });

// ---------- boot ----------
layoutKeys();
scrollToWhite(PC.WIDX[60], false);
renderProg();
showTab(S.tab);
if (S.tab !== 'ident') identChanged();
addEventListener('resize', () => { const frac = keysWrap.scrollLeft / Math.max(1, PC.NW * KW); layoutKeys(); keysWrap.scrollLeft = frac * PC.NW * KW; updateMiniWin(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopSeq(); Piano.allOff(); } });
window.__pc = { PC, Piano, S, get HL() { return HL; }, HELD, PRESSED, fingers, get KW() { return KW; }, get KH() { return KH; }, keysWrap };
</script>
