<title>口袋工具箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Mono:wght@700&display=swap">
<style>
/* Sibling of 口袋遊樂場 (apps/game-hub): same shelf of cover cards and full-height player, with a search box and grouped sections for 73 tools. */
:root {
  --bg: #e8eeec;          /* pale workbench green */
  --shelf: #dde5e2;
  --card: #ffffff;
  --ink: #18221f;
  --muted: #586661;
  --line: #c6d2ce;
  --accent: #1f8a70;      /* tool-tag teal */
  --accent-ink: #ffffff;
  --display: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tag-calc: #2f6fd6; --tag-time: #8a3fd1; --tag-image: #c2410c; --tag-design: #be185d; --tag-text: #4d5b16;
  --tag-dev: #0f6f8a; --tag-secure: #5b4bc4; --tag-party: #c23a2b; --tag-learn: #9a6a00; --tag-log: #1f8a5a; --tag-sound: #7a5230;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --shelf: #19211e; --card: #1f2825; --ink: #e9f0ed; --muted: #97a6a0; --line: #2d3a35;
  --accent: #4cc9a4; --accent-ink: #062019;
  --tag-calc: #7aa7ff; --tag-time: #c39bff; --tag-image: #fb9a60; --tag-design: #f48fbf; --tag-text: #b9cc6a;
  --tag-dev: #5fc8e6; --tag-secure: #a99cff; --tag-party: #ff8a7a; --tag-learn: #e8c25e; --tag-log: #5fd3a0; --tag-sound: #d7a77a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121816; --shelf: #19211e; --card: #1f2825; --ink: #e9f0ed; --muted: #97a6a0; --line: #2d3a35;
  --accent: #4cc9a4; --accent-ink: #062019;
  --tag-calc: #7aa7ff; --tag-time: #c39bff; --tag-image: #fb9a60; --tag-design: #f48fbf; --tag-text: #b9cc6a;
  --tag-dev: #5fc8e6; --tag-secure: #a99cff; --tag-party: #ff8a7a; --tag-learn: #e8c25e; --tag-log: #5fd3a0; --tag-sound: #d7a77a;
  color-scheme: dark }

html, body { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); -webkit-tap-highlight-color: transparent; }
body.playing { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap { max-width: 1060px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.badge { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 0 0 3px rgba(255,255,255,.18); }
.badge svg { width: 24px; height: 24px; }
h1 { margin: 0; font: 900 clamp(26px, 6vw, 38px)/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.count { font: 700 12px/1 var(--mono); letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }

.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; margin: 0 -16px; padding: 10px 16px; background: var(--bg); display: grid; gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 44px 0 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 16px var(--body); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }
.search .clear { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border-radius: 10px; color: var(--muted); font-size: 20px; line-height: 1; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.filters::-webkit-scrollbar { display: none; }
@media (min-width: 760px) { .filters { flex-wrap: wrap; overflow: visible; } }
.chip { flex: none; min-height: 40px; padding: 6px 15px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 14px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.section { display: grid; gap: 12px; }
.section + .section { margin-top: 14px; }
.section h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 900 19px/1.3 var(--display); }
.section h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); align-self: center; }
.section h2 small { font: 700 12px var(--mono); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
.card { display: grid; grid-template-rows: auto 1fr; text-align: left; background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 0 var(--line), 0 6px 18px -10px rgba(10,30,24,.35); transition: transform .18s ease, box-shadow .18s ease; min-width: 0; }
@media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: 0 1px 0 var(--line), 0 14px 26px -12px rgba(10,30,24,.45); } }
.card:active { transform: translateY(0) scale(.98); }
.shot { position: relative; aspect-ratio: 3 / 4; background: var(--shelf); overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.shot .go { position: absolute; right: 10px; bottom: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.shot .go svg { width: 16px; height: 16px; }
.last { position: absolute; left: 10px; top: 10px; padding: 3px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
.label { padding: 10px 12px 13px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.label h3 { margin: 0; font: 900 16px/1.3 var(--display); }
.label p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag { font-size: 12px; font-weight: 700; color: var(--c); margin-top: 2px; }
mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; }
.empty { padding: 40px 12px; text-align: center; color: var(--muted); }
.foot { color: var(--muted); font-size: 13px; text-align: center; text-wrap: pretty; }

/* Player */
#player { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: auto 1fr; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 8px; padding: calc(4px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px)); background: var(--card); border-bottom: 1px solid var(--line); min-width: 0; }
.bar button { display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 700; }
.bar .back { background: var(--accent); color: var(--accent-ink); }
.bar .ghost { color: var(--muted); }
@media (hover: hover) { .bar .ghost:hover { color: var(--ink); background: var(--shelf); } }
.bar h3 { flex: 1; min-width: 0; margin: 0; font: 900 16px/1 var(--display); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar svg { width: 16px; height: 16px; }
.stage { position: relative; min-height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
.stage iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
.loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--muted); font-size: 14px; pointer-events: none; text-align: center; padding: 0 24px; }
.loading button { pointer-events: auto; min-height: 44px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.bar .fav[aria-pressed="true"] { color: var(--accent); }
.bar .fav svg { width: 18px; height: 18px; }
.bar .icon { padding: 0 12px; }
.bar .icon svg { width: 18px; height: 18px; }
/* phones: the bar's side buttons go icon-only (their aria-labels still name them) so the title keeps its room */
@media (max-width: 430px) { .bar .ghost { font-size: 0; gap: 0; padding: 0 11px; } .bar .ghost svg { width: 18px; height: 18px; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.star { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.45); color: #ffd25e; display: grid; place-items: center; }
.star svg { width: 15px; height: 15px; }

@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
</style>

<div class="wrap" id="hub">
  <header>
    <div class="brand">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8V20h3.2l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></div>
      <div>
        <h1>口袋工具箱</h1>
        <p class="sub">這個專案做過的實用工具都在這裡，找到就能直接用。</p>
      </div>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="tools">
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜尋工具，例如：圖片、計算、QR" autocomplete="off" enterkeyhint="search" aria-label="搜尋工具">
      <button class="clear" id="clear" type="button" aria-label="清除搜尋" hidden>×</button></label>
    <div class="filters" id="filters" role="group" aria-label="依分類篩選"></div>
  </div>
  <main id="list"></main>
  <p class="foot">每個工具的資料都只存在這台裝置上，不會上傳。從這裡開啟的工具和單獨開啟的頁面各存一份。</p>
</div>

<div id="player" hidden>
  <div class="bar">
    <button class="back" id="back" aria-label="回到工具箱"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>工具箱</button>
    <h3 id="ptitle"></h3>
    <button class="ghost icon" id="share" hidden aria-label="分享這個工具的連結"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 4.8 8 2l3 2.8M3.5 8.5V13h9V8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ghost fav" id="fav" aria-pressed="false" aria-label="收藏這個工具"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>收藏</button>
    <button class="ghost" id="restart" aria-label="重新載入這個工具"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>重新載入</button>
  </div>
  <div class="stage" id="stage"><div class="loading" id="loading"><span id="lmsg">載入中…</span><button id="retry" hidden>再試一次</button></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<!--TOOL_DATA-->

<script>
(() => {
  const META = JSON.parse(document.getElementById('hub-meta').textContent);
  const CATS = { calc: '生活計算', time: '時間與專注', image: '圖片與影像', design: '設計與繪圖', text: '文字與文件', dev: '開發與資料',
    secure: '密碼與 QR 碼', party: '聚會與決定', learn: '學習與記憶', log: '健康與紀錄', sound: '聲音與燈光' };
  const VIEWS = { recent: '最近用過', favs: '收藏' };
  const RECENT_MAX = 12;
  const STAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>';
  const $ = id => document.getElementById(id);
  const byId = new Map(META.map(g => [g.id, g]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    list(k) { try { const a = JSON.parse(this.get(k)); return Array.isArray(a) ? a.filter(id => byId.has(id)) : []; } catch (e) { return []; } }
  };
  let filter = store.get('toolhub.filter') || 'all';
  if (filter !== 'all' && !CATS[filter] && !VIEWS[filter]) filter = 'all';
  let recent = store.list('toolhub.recent');
  const lastOld = store.get('toolhub.last');
  if (!recent.length && byId.has(lastOld)) recent = [lastOld];
  let favs = new Set(store.list('toolhub.favs'));
  let query = '';

  $('count').textContent = `${META.length} 個工具 · ${Object.keys(CATS).length} 類`;

  const filters = $('filters');
  [['all', '全部'], ['recent', VIEWS.recent], ['favs', VIEWS.favs], ...Object.entries(CATS)].forEach(([k, name]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.k = k; b.textContent = name;
    b.onclick = () => { filter = k; store.set('toolhub.filter', k); render(); };
    filters.appendChild(b);
  });

  const norm = s => s.toLowerCase().replace(/\s+/g, '');
  const hay = g => norm(`${g.name} ${g.blurb} ${CATS[g.cat]} ${g.id.replace(/-/g, ' ')}`);
  function matches(g) {
    if (!query) return true;
    return query.split(/\s+/).filter(Boolean).every(t => hay(g).includes(norm(t)));
  }
  function highlight(el, text) {
    const terms = query.split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
    if (!terms.length) { el.textContent = text; return; }
    const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    el.textContent = '';
    text.split(re).forEach((part, i) => {
      if (i % 2) { const m = document.createElement('mark'); m.textContent = part; el.appendChild(m); }
      else if (part) el.appendChild(document.createTextNode(part));
    });
  }

  function card(g, last) {
    const b = document.createElement('button');
    b.className = 'card'; b.setAttribute('aria-label', `開啟 ${g.name}`);
    b.innerHTML = `
      <div class="shot"><img alt="" loading="lazy" src="covers/${g.id}.jpg">
        ${g.id === last ? '<span class="last">上次用</span>' : ''}
        ${favs.has(g.id) ? `<span class="star" aria-label="已收藏">${STAR}</span>` : ''}
        <span class="go" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="label"><h3></h3><p></p><span class="tag" style="--c:var(--tag-${g.cat})">${CATS[g.cat]}</span></div>`;
    highlight(b.querySelector('h3'), g.name);
    highlight(b.querySelector('p'), g.blurb);
    b.onclick = () => open(g);
    // Start downloading as soon as a finger lands, so the tool is usually ready by the time the tap ends.
    b.addEventListener('pointerdown', () => load(g.id).catch(() => {}), { passive: true });
    return b;
  }

  function section(title, cat, items, last) {
    const s = document.createElement('section'); s.className = 'section';
    if (title) {
      const h = document.createElement('h2'); h.style.setProperty('--c', `var(--tag-${cat})`);
      h.textContent = title;
      const n = document.createElement('small'); n.textContent = items.length; h.appendChild(n);
      s.appendChild(h);
    }
    const grid = document.createElement('div'); grid.className = 'grid';
    items.forEach(g => grid.appendChild(card(g, last)));
    s.appendChild(grid);
    return s;
  }

  function render() {
    filters.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.k === filter));
    $('clear').hidden = !query;
    filters.querySelectorAll('.chip').forEach(c => {
      if (!VIEWS[c.dataset.k]) return;
      const n = c.dataset.k === 'recent' ? recent.length : favs.size;
      c.textContent = n ? `${VIEWS[c.dataset.k]} ${n}` : VIEWS[c.dataset.k];
    });
    const last = recent[0];
    const list = $('list'); list.textContent = '';
    const pool = filter === 'recent' ? recent.map(id => byId.get(id)) : filter === 'favs' ? META.filter(g => favs.has(g.id)) : META;
    const shown = pool.filter(g => (filter === 'all' || VIEWS[filter] || g.cat === filter) && matches(g));
    if (!shown.length) {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = VIEWS[filter] && !query ? (filter === 'favs' ? '還沒有收藏。開啟工具後按上方的「收藏」，就會出現在這裡。' : '還沒有用過任何工具，挑一個開始吧。')
        : filter === 'all' ? `找不到「${query}」相關的工具。` : `「${CATS[filter] || VIEWS[filter]}」裡找不到「${query}」，試試切到「全部」。`;
      list.appendChild(p); return;
    }
    if (filter === 'all' && !query) {
      Object.entries(CATS).forEach(([k, name]) => {
        const items = shown.filter(g => g.cat === k);
        if (items.length) list.appendChild(section(name, k, items, last));
      });
    } else {
      list.appendChild(section(query ? `找到 ${shown.length} 個` : '', filter === 'all' || VIEWS[filter] ? 'calc' : filter, shown, last));
      if (query) list.querySelector('h2').style.setProperty('--c', 'var(--accent)');
    }
  }

  $('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
  $('clear').onclick = () => { $('q').value = ''; query = ''; render(); $('q').focus(); };

  // Each tool is its own published file (open/<id>.html), fetched on first open and kept for the session.
  // It still runs through srcdoc, as before, so it shares this page's storage and the claude bridge keeps working.
  const cache = new Map();
  function load(id) {
    if (!cache.has(id)) {
      const p = fetch(`open/${id}.html`).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
      p.catch(() => cache.delete(id));
      cache.set(id, p);
    }
    return cache.get(id);
  }

  // On the standalone site (not inside the claude.ai frame) each app gets its own link: <hub>/#<id>.
  const linkable = (() => { try { return window.top === window && /^https?:$/.test(location.protocol); } catch (e) { return false; } })();
  let current = null, scrollY = 0, token = 0, ownPop = false;
  function open(g, fromUrl) {
    if (current) close(true);
    current = g; scrollY = window.scrollY;
    recent = [g.id, ...recent.filter(id => id !== g.id)].slice(0, RECENT_MAX);
    store.set('toolhub.recent', JSON.stringify(recent));
    store.set('toolhub.last', g.id);
    $('ptitle').textContent = g.name;
    syncFav();
    $('hub').hidden = true; $('player').hidden = false;
    document.body.classList.add('playing');
    if (linkable) {
      document.title = `${g.name}・口袋工具箱`;
      if (!fromUrl && location.hash !== '#' + g.id) history.pushState({ app: g.id }, '', '#' + g.id);
    }
    mount();
  }
  function syncFav() {
    const on = favs.has(current.id);
    $('fav').setAttribute('aria-pressed', on);
    $('fav').setAttribute('aria-label', on ? '取消收藏這個工具' : '收藏這個工具');
    $('fav').lastChild.textContent = on ? '已收藏' : '收藏';
    $('fav').querySelector('path').setAttribute('fill', on ? 'currentColor' : 'none');
  }
  async function mount() {
    const stage = $('stage'), g = current, my = ++token;
    stage.querySelector('iframe')?.remove();
    $('lmsg').textContent = '載入中…'; $('retry').hidden = true; $('loading').hidden = false;
    let html;
    try { html = await load(g.id); }
    catch (e) {
      if (my !== token) return;
      $('lmsg').textContent = '工具載入失敗，請確認網路連線。'; $('retry').hidden = false;
      return;
    }
    if (my !== token || current !== g) return;
    const f = document.createElement('iframe');
    f.title = g.name;
    f.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write; web-share; camera; microphone; geolocation; accelerometer; gyroscope; magnetometer; screen-wake-lock');
    f.addEventListener('load', () => { $('loading').hidden = true; try { f.contentWindow.focus(); } catch (e) {} });
    f.srcdoc = html;
    stage.appendChild(f);
  }
  function close(fromUrl) {
    if (!current) return;
    if (linkable && !fromUrl && location.hash) {
      // opened from the shelf: step back so its history entry goes too; that popstate is ours, so it is skipped
      if (history.state && history.state.app === current.id) { ownPop = true; history.back(); }
      else history.replaceState(null, '', location.pathname + location.search);
    }
    if (linkable) document.title = '口袋工具箱';
    token++;
    $('stage').querySelector('iframe')?.remove();
    current = null;
    $('player').hidden = true; $('hub').hidden = false;
    document.body.classList.remove('playing');
    render();
    window.scrollTo(0, scrollY);
  }
  $('back').onclick = () => close();
  $('share').onclick = async () => {
    if (!current) return;
    const g = current, url = location.origin + location.pathname + '#' + g.id;
    if (navigator.share) {
      try { await navigator.share({ title: g.name, text: `${g.name}：${g.blurb}`, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); toast('已複製連結'); }
    catch (e) { window.prompt('複製這個連結', url); }
  };
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }
  $('restart').onclick = () => current && mount();
  $('retry').onclick = () => current && mount();
  $('fav').onclick = () => {
    if (!current) return;
    favs.has(current.id) ? favs.delete(current.id) : favs.add(current.id);
    store.set('toolhub.favs', JSON.stringify([...favs]));
    syncFav();
  };
  render();
  if (linkable) {
    $('share').hidden = false;
    const fromHash = () => { try { return byId.get(decodeURIComponent(location.hash.slice(1))) || null; } catch (e) { return null; } };
    window.addEventListener('popstate', () => {
      if (ownPop) { ownPop = false; return; }
      const g = fromHash(); g ? g !== current && open(g, true) : close(true);
    });
    const g = fromHash(); if (g) open(g, true);
  }
})();
</script>
