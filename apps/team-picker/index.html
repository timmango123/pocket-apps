<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>分組與抽人</title>
<style>
/* Sports-day pinnies: crisp field-line paper, each team a coloured bib with a big stencilled number. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #17201c;
  --muted: #59635e;
  --line: #d5dad4;
  --line-strong: #a9b2ab;
  --accent: #1f4fa8;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9f7;
  --warn: #a0400b;
  --warn-soft: #fbe9dc;
  --absent: #9aa39d;
  --bib-ink: #121614;
  --b0: #ff9a5c; --b1: #6fb4ff; --b2: #7fd68f; --b3: #ffd34d; --b4: #c3a2ff; --b5: #ff8fb1;
  --b6: #5fd3cb; --b7: #f2b880; --b8: #a8c66c; --b9: #9fb3d9; --b10: #e59be0; --b11: #c9c2a8;
  --shadow: 0 1px 0 rgba(23,32,28,.06), 0 2px 8px rgba(23,32,28,.06);
  --scrim: rgba(10,14,12,.45);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a1f1c; --surface-2: #212724; --ink: #e9eeea; --muted: #a3ada7; --line: #2d3530; --line-strong: #4a544e;
    --accent: #8db3ff; --accent-ink: #0b1630; --accent-soft: #1d2a45; --warn: #ffb27f; --warn-soft: #3a2416; --absent: #69726c; --bib-ink: #101311;
    --b0: #ec8a4f; --b1: #5ea3ec; --b2: #6cc27c; --b3: #e8bf3e; --b4: #ad8ff0; --b5: #ec7d9f;
    --b6: #4fbeb6; --b7: #dca46e; --b8: #95b25c; --b9: #8ca0c6; --b10: #d088cb; --b11: #b6af96;
    --shadow: 0 1px 0 rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a1f1c; --surface-2: #212724; --ink: #e9eeea; --muted: #a3ada7; --line: #2d3530; --line-strong: #4a544e;
  --accent: #8db3ff; --accent-ink: #0b1630; --accent-soft: #1d2a45; --warn: #ffb27f; --warn-soft: #3a2416; --absent: #69726c; --bib-ink: #101311;
  --b0: #ec8a4f; --b1: #5ea3ec; --b2: #6cc27c; --b3: #e8bf3e; --b4: #ad8ff0; --b5: #ec7d9f;
  --b6: #4fbeb6; --b7: #dca46e; --b8: #95b25c; --b9: #8ca0c6; --b10: #d088cb; --b11: #b6af96;
  --shadow: 0 1px 0 rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-block: 8px calc(28px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1180px; margin: 0 auto; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; border-bottom: 2px solid var(--ink); margin-bottom: 14px; }
.top h1 { font-size: 19px; font-weight: 800; letter-spacing: .02em; margin: 0; white-space: nowrap; }
.tabs { display: flex; margin-left: auto; border: 2px solid var(--ink); border-radius: 999px; padding: 2px; }
.tabs button { min-height: 44px; min-width: 64px; border: 0; background: none; border-radius: 999px; font-weight: 700; padding: 0 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { width: 44px; height: 44px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

.cols { display: grid; gap: 16px; }
@media (max-width: 899px) { .app.on-draw .main { order: -1; } .app.on-draw .roster textarea { height: 110px; } }
/* phones: 開始分組 sits right under the header and stays pinned to the top while scrolling (it covers nothing at the top of the page) */
.go-row { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 4px 0 10px; margin: -6px 0 6px; }
.go-row:empty, .app.on-draw .go-row { display: none; }
.go-row .go { margin: 0; box-shadow: var(--shadow); }
.go-row { box-shadow: 0 8px 8px -8px rgba(0,0,0,.28); }
@media (max-height: 499px) { .go-row { position: static; box-shadow: none; } html { scroll-padding-top: 0 !important; } }
@media (max-width: 899px) { html { scroll-padding-top: 80px; } .roster textarea { height: 104px; } }
@media (min-width: 900px) { .cols { grid-template-columns: 360px 1fr; align-items: start; } .roster { position: sticky; top: 10px; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.label { font-weight: 800; font-size: 16px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.count b { color: var(--ink); font-size: 18px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
textarea { width: 100%; height: 160px; resize: vertical; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); line-height: 1.5; font-size: 15px; }
textarea:focus { border-color: var(--accent); outline: none; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 10px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--warn); }
.btn.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
select.btn { padding-right: 30px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
.inline-form { display: flex; gap: 8px; margin-top: 8px; }
.inline-form input { flex: 1; min-width: 0; min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 0 10px; background: var(--surface-2); }
.note { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; margin-top: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; max-height: 260px; overflow: auto; padding: 2px; }
.chip { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.chip small { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; background: var(--ink); color: var(--bg); line-height: 18px; }
.chip.absent { color: var(--absent); text-decoration: line-through; border-style: dashed; background: transparent; }
.chip.absent small { background: var(--absent); }

/* settings */
.settings { display: grid; gap: 12px; }
.seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 44px; padding: 0 14px; border: 0; background: var(--surface); cursor: pointer; font-weight: 650; }
.seg button + button { border-left: 1.5px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.stepper { display: inline-flex; align-items: stretch; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.stepper button { width: 44px; min-height: 44px; border: 0; background: var(--surface-2); font-size: 22px; cursor: pointer; }
.stepper input { width: 64px; border: 0; text-align: center; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; background: var(--surface); }
.stepper input::-webkit-inner-spin-button { display: none; }
.unit { color: var(--muted); font-weight: 600; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
details.rules { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 0 12px; }
details.rules summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; list-style: none; }
details.rules summary::before { content: "＋"; margin-right: 8px; color: var(--accent); }
details.rules[open] summary::before { content: "－"; }
.rule-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 10px; }
.rule-form select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface-2); padding: 0 8px; min-width: 0; }
.rule-form .btn { grid-column: span 1; }
.rule-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.rule-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; background: var(--surface-2); border-radius: 8px; padding-left: 10px; }
.rule-list li span { flex: 1; }
.rule-list li b { font-size: 12px; padding: 1px 6px; border-radius: 6px; }
.rule-list .t { background: var(--accent-soft); color: var(--accent); }
.rule-list .a { background: var(--warn-soft); color: var(--warn); }
.rule-list button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; }

.go { width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 18px; font-weight: 800; letter-spacing: .08em; cursor: pointer; margin-top: 4px; }
.go:disabled { opacity: .4; cursor: not-allowed; }
.msg { min-height: 20px; font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.msg.err { color: var(--warn); font-weight: 650; }

/* result cards */
.groups { display: grid; gap: 12px; margin: 14px 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.groups.many .group { content-visibility: auto; contain-intrinsic-size: 220px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.group.drop { outline: 3px dashed var(--accent); outline-offset: 2px; }
.bib { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; background: var(--bib); color: var(--bib-ink); position: relative; }
.bib .no { font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; min-width: 1.2em; }
.bib input { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; font-weight: 800; font-size: 17px; color: var(--bib-ink); border-radius: 8px; padding: 0 6px; }
.bib input:focus { background: rgba(255,255,255,.4); outline: none; }
.bib input { border-bottom: 2px dashed rgba(18,22,20,.45); border-radius: 8px 8px 0 0; cursor: text; }
.bib .pen { font-size: 15px; opacity: .7; margin-left: -6px; pointer-events: none; }
.bib .n { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.members { list-style: none; margin: 0; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 56px; }
.member { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
.member small { font-size: 11px; color: var(--muted); font-weight: 700; }
.member.dragging { opacity: .35; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg) scale(1.06); box-shadow: 0 8px 24px rgba(0,0,0,.25); background: var(--surface); border: 2px solid var(--accent); }
.res-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.res-tools .grow { flex: 1; min-width: 120px; color: var(--muted); font-size: 13px; }

/* draw */
.stage { text-align: center; border: 2px solid var(--ink); border-radius: 16px; background: var(--surface); padding: 22px 12px 18px; position: relative; overflow: hidden; }
.stage::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%); opacity: .5; pointer-events: none; }
.stage > * { position: relative; }
.big { display: block; width: 100%; min-height: 110px; border: 0; background: none; cursor: pointer; font-size: 48px; font-weight: 900; line-height: 1.1; letter-spacing: .02em; overflow-wrap: anywhere; }
.big.idle { font-size: 22px; color: var(--muted); font-weight: 700; }
.big.rolling { color: var(--muted); }
.big.hit { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.85); } to { transform: none; } }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.draw-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
.draw-ctl .go { flex: 1 1 100%; }
.order { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 650; user-select: none; -webkit-user-select: none; cursor: grab; }
.order li::before { content: counter(o); font-weight: 900; font-variant-numeric: tabular-nums; min-width: 2ch; color: var(--accent); }
.order li.dragging { opacity: .35; }
.order li.drop { box-shadow: 0 -3px 0 var(--accent); }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 0; }
h2.sec { font-size: 15px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }

/* sheet & toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.sheet { background: var(--surface); border-radius: 16px; width: 100%; max-width: 420px; padding: 16px; display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet input { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 0 10px; background: var(--surface-2); }
.tag-quick { display: flex; flex-wrap: wrap; gap: 6px; }
@media (min-width: 600px) { .scrim { align-items: center; } }
.toast { position: fixed; left: 16px; top: 0; background: var(--ink); color: var(--bg); padding: 4px 6px 4px 16px; min-height: 44px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); font-size: 14px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.toast[hidden] { display: none; }
.toast #toast-act { pointer-events: auto; min-height: 44px; min-width: 64px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 800; cursor: pointer; padding: 0 12px; }
.toast #toast-act[hidden] { display: none; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 40vh; overflow: auto; }
.mlist li { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 8px; padding-left: 10px; }
.mlist li span { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.mlist .empty { padding: 10px 0; }
.copybox { width: 100%; height: 140px; }
@media (hover: hover) {
  .btn:not(:disabled):hover, .chip:hover, .member:hover { border-color: var(--ink); }
  .go:not(:disabled):hover { filter: brightness(1.12); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>分組與抽人</h1>
    <div class="tabs" role="tablist">
      <button id="tab-group" role="tab" aria-selected="true" aria-controls="pane-group">分組</button>
      <button id="tab-draw" role="tab" aria-selected="false" aria-controls="pane-draw">抽人</button>
    </div>
    <button class="icon-btn" id="theme-btn" aria-label="切換主題：跟隨系統" title="主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </header>
  <div class="go-row" id="go-row"></div>

  <div class="cols">
    <section class="panel roster" aria-label="名單">
      <div class="row-head">
        <label class="label" for="roster-text">名單<span class="badge" id="sample-badge">範例</span></label>
        <span class="count" id="count">共 <b>0</b> 人</span>
      </div>
      <textarea id="roster-text" spellcheck="false" placeholder="每行一位，例如：&#10;王小明&#10;李大華,女"></textarea>
      <p class="hint">每行一人；寫成「姓名,標籤」可加標籤（例如 男／女、A／B 級）。點晶片切換出席，長按設定標籤。</p>
      <div class="btnrow">
        <select class="btn" id="roster-load" aria-label="載入名單"><option value="">載入名單</option></select>
        <button class="btn" id="roster-save">儲存名單</button>
        <button class="btn" id="roster-manage">管理／備份</button>
        <button class="btn danger" id="roster-clear">清空</button>
      </div>
      <div class="inline-form" id="save-form" hidden>
        <input id="roster-name" maxlength="30" placeholder="名單名稱，例如 三年二班" aria-label="名單名稱">
        <button class="btn primary" id="roster-save-ok">儲存</button>
      </div>
      <div class="note" id="roster-note" hidden></div>
      <div class="chips" id="chips" aria-label="出席名單"></div>
    </section>

    <div class="main">
      <section id="pane-group" role="tabpanel" aria-labelledby="tab-group">
        <div class="panel settings">
          <div class="set-row">
            <div class="seg" role="group" aria-label="分組方式">
              <button id="by-count" aria-pressed="true">分成幾組</button>
              <button id="by-size" aria-pressed="false">每組幾人</button>
            </div>
            <div class="stepper">
              <button id="k-minus" aria-label="減少">−</button>
              <input id="k-input" type="number" inputmode="numeric" min="1" max="1000" value="3" aria-label="數量">
              <button id="k-plus" aria-label="增加">＋</button>
            </div>
            <span class="unit" id="k-unit">組</span>
          </div>
          <div class="set-row">
            <label class="check"><input type="checkbox" id="opt-tag"> 依標籤平衡</label>
            <label class="check"><input type="checkbox" id="opt-avoid"> 盡量避開上次同組</label>
            <select class="btn" id="name-theme" aria-label="組名主題">
              <option value="num">組名：第 1 組</option>
              <option value="animal">組名：動物</option>
              <option value="color">組名：顏色</option>
            </select>
          </div>
          <details class="rules" id="rules">
            <summary id="rules-sum">同組規則（0）</summary>
            <ul class="rule-list" id="rule-list"></ul>
            <div class="rule-form">
              <select id="rule-a" aria-label="第一人"></select>
              <select id="rule-b" aria-label="第二人"></select>
              <select id="rule-type" aria-label="規則類型"><option value="together">固定在一起</option><option value="apart">不可同組</option></select>
              <button class="btn" id="rule-add">加入規則</button>
            </div>
          </details>
          <div id="go-slot"><button class="go" id="go">開始分組</button></div>
        </div>
        <p class="msg" id="go-msg" role="status"></p>
        <div id="result" hidden>
          <div class="groups" id="groups"></div>
          <div class="res-tools">
            <button class="btn" id="regroup">重新分組</button>
            <button class="btn" id="copy-text">複製結果</button>
            <button class="btn" id="copy-csv">複製 CSV</button>
            <span class="grow">長按成員可拖到別組</span>
          </div>
        </div>
      </section>

      <section id="pane-draw" role="tabpanel" aria-labelledby="tab-draw" hidden>
        <div class="stage">
          <button class="big idle" id="draw-big" aria-live="polite">點這裡抽人</button>
          <p class="sub" id="draw-sub"></p>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const P = 'team-picker:v1:';
const store = {
  get(k, d) {
    let raw = null;
    try { raw = localStorage.getItem(P + k); } catch (e) { return d; }
    if (raw == null) return d;
    try { return JSON.parse(raw); } catch (e) { try { localStorage.setItem(P + 'corrupt', raw); } catch (_) {} return d; }
  },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(P + k); } catch (e) {} }
};

// ---------- stored-data validation: anything of the wrong type or shape falls back to defaults ----------
const MAX = 1000, ROSTER_CAP = 100;
const SAMPLE = ['王小明,男', '李大華,男', '陳怡君,女', '林志豪,男', '張雅婷,女', '黃冠宇,男', '吳佩珊,女', '劉家豪,男', '蔡宜蓁,女', '楊承恩,男', '許詩涵,女', '鄭宇翔,男'].join('\n');
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const str = (v, d = '') => typeof v === 'string' ? v : d;
const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
const posInt = (v, d) => Number.isInteger(v) && v >= 1 && v <= MAX ? v : d;
const THEMES = ['num', 'animal', 'color'];
function cleanCurrent(v) {
  if (!isObj(v)) v = {};
  return {
    text: str(v.text, SAMPLE), absent: strArr(v.absent), mode: v.mode === 'size' ? 'size' : 'count',
    kCount: posInt(v.kCount, 3), kSize: posInt(v.kSize, 4), optTag: v.optTag === true, optAvoid: v.optAvoid === true,
    nameTheme: THEMES.includes(v.nameTheme) ? v.nameTheme : 'num', tab: v.tab === 'draw' ? 'draw' : 'group'
  };
}
function cleanResult(v) {
  if (!isObj(v) || !Array.isArray(v.groups) || !v.groups.length || !v.groups.every(Array.isArray)) return null;
  const groups = v.groups.map(g => g.filter(p => isObj(p) && typeof p.name === 'string').map(p => ({ name: p.name, tag: str(p.tag) })));
  const names = groups.map((_, i) => Array.isArray(v.names) && typeof v.names[i] === 'string' ? v.names[i] : '');
  return { groups, names };
}
function cleanRosters(v) {
  if (!Array.isArray(v)) return [];
  return v.filter(r => isObj(r) && typeof r.name === 'string' && Array.isArray(r.people)).map((r, i) => ({
    id: typeof r.id === 'string' && r.id ? r.id : 'r' + Date.now().toString(36) + i, name: r.name,
    people: r.people.filter(p => isObj(p) && typeof p.name === 'string').map(p => ({ name: p.name, tag: str(p.tag), absent: p.absent === true }))
  }));
}
const pairOk = r => Array.isArray(r) && r.length === 2 && typeof r[0] === 'string' && typeof r[1] === 'string' && r[0] !== r[1];
function cleanRules(v) {
  if (!isObj(v)) return { together: [], apart: [] };
  return { together: Array.isArray(v.together) ? v.together.filter(pairOk).map(r => [r[0], r[1]]) : [], apart: Array.isArray(v.apart) ? v.apart.filter(pairOk).map(r => [r[0], r[1]]) : [] };
}
function cleanDraw(v) {
  if (!isObj(v)) return { order: [], norepeat: true };
  return { order: strArr(v.order), norepeat: v.norepeat !== false };
}
function cleanLast(v) {
  if (!Array.isArray(v) || !v.every(Array.isArray)) return null;
  return v.map(strArr);
}

// ---------- secure random (rejection sampling, buffered) ----------
const hasCrypto = !!(window.crypto && crypto.getRandomValues);
const rbuf = new Uint32Array(512); let rpos = rbuf.length;
function r32() { if (rpos >= rbuf.length) { crypto.getRandomValues(rbuf); rpos = 0; } return rbuf[rpos++]; }
function randInt(n) {
  if (n <= 1) return 0;
  if (!hasCrypto) return Math.floor(Math.random() * n);
  const lim = Math.floor(0x100000000 / n) * n; let x;
  do { x = r32(); } while (x >= lim);
  return x % n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- toast (optionally with 復原) / copy ----------
let toastT, toastUndo = null;
function toast(s, undo, ms) {
  const t = $('#toast'); $('#toast-text').textContent = s; t.hidden = false;
  toastUndo = undo || null; $('#toast-act').hidden = !undo;
  placeToast(); setTimeout(placeToast, 60); setTimeout(placeToast, 450);
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; toastUndo = null; }, ms || (undo ? 6000 : 2200));
}
/* The toast never covers a control: with a sheet open it sits just above the sheet (or below it); otherwise it takes the
   lowest free spot of the viewport (centre, then left / right) that touches no button, field, chip or member, and moves
   again whenever the page scrolls or the layout changes. */
const CTRL_SEL = 'button, input:not([type=file]), select, textarea, summary, label.check, .member, #draw-order li[data-i]';
function placeToast() {
  const t = $('#toast'); if (t.hidden) return;
  const W = document.documentElement.clientWidth, H = innerHeight, edge = 12, m = 1;
  t.style.left = edge + 'px'; t.style.top = '0px';
  const tw = Math.min(t.offsetWidth, W - 2 * edge), th = t.offsetHeight;
  const sheet = [...document.querySelectorAll('.scrim')].find(x => !x.hidden);
  let rects, soft = [];
  if (sheet) {
    const r = sheet.firstElementChild.getBoundingClientRect();
    rects = [r];
  } else {
    rects = [];
    const cb = $('#chips').getBoundingClientRect();   // chips scroll inside their box: only the visible part counts
    document.querySelectorAll(CTRL_SEL).forEach(el => {
      if (t.contains(el)) return;
      let r = el.getBoundingClientRect();
      if (el.classList.contains('chip')) {
        if (r.bottom > 0 && r.top < H) soft.push(r);   // the scrolled-away part of a chip: avoid it too when there is room
        r = { left: Math.max(r.left, cb.left), right: Math.min(r.right, cb.right), top: Math.max(r.top, cb.top), bottom: Math.min(r.bottom, cb.bottom) };
        r.width = r.right - r.left; r.height = r.bottom - r.top; if (r.width <= 0 || r.height <= 0) return;
      }
      if (r.width && r.height && r.bottom > 0 && r.top < H && r.right > 0 && r.left < W) rects.push(r);
    });
  }
  const hits = (x, y, list = rects) => { let a = 0; for (const r of list) { const w = Math.min(x + tw + m, r.right) - Math.max(x - m, r.left), h = Math.min(y + th + m, r.bottom) - Math.max(y - m, r.top); if (w > 0.5 && h > 0.5) a += w * h; } return a; };
  const xs = [...new Set([Math.round((W - tw) / 2), edge, Math.round(W - edge - tw)])].filter(x => x >= edge - 0.5);
  const bottom = H - th - 16;
  let best = null, clean = null;
  for (let y = bottom; y >= edge && !clean; y -= 2) {
    for (const x of xs) {
      const a = hits(x, y); if (!best || a < best.a) best = { x, y, a };
      if (!a && !hits(x, y, soft)) { clean = { x, y, a: 0 }; break; }
    }
  }
  if (clean) best = clean;
  if (!best || best.a > 0) {
    // no clear spot (e.g. a long draw order): always the same place, at the top under the header / pinned 開始分組 row.
    // The toast body lets taps through (pointer-events: none), so only 復原 itself can take a tap.
    let y = edge; const gr = $('#go-row');
    if (!sheet && gr && gr.getClientRects().length) { const r = gr.getBoundingClientRect(); if (r.bottom > 0 && r.top < H) y = Math.max(y, Math.round(r.bottom) + 6); }
    y = Math.min(y, Math.max(edge, H - th - edge));
    // of centre / left / right, take the one where 復原 (the only part that takes taps) is over the fewest controls
    const act = $('#toast-act'), ax = act.hidden ? 0 : act.offsetLeft, aw = act.hidden ? 0 : act.offsetWidth;
    const actHits = (x, y) => { if (!aw) return 0; let a = 0; for (const r of rects) { const w = Math.min(x + ax + aw + m, r.right) - Math.max(x + ax - m, r.left), h = Math.min(y + th + m, r.bottom) - Math.max(y - m, r.top); if (w > 0.5 && h > 0.5) a += w * h; } return a; };
    best = { x: xs[0], y, a: actHits(xs[0], y) };
    for (const x of xs.slice(1)) { const a = actHits(x, y); if (a < best.a) best = { x, y, a }; }
    // 復原 would still sit on a control there: move to the lowest spot where it doesn't
    if (best.a > 0) for (let yy = bottom; yy >= edge && best.a > 0; yy -= 4) for (const x of xs) { const a = actHits(x, yy); if (a < best.a) { best = { x, y: yy, a }; if (!a) break; } }
  }
  t.style.left = best.x + 'px'; t.style.top = best.y + 'px';
}
let toastRaf = 0;
const toastSoon = () => { if (!toastRaf && !$('#toast').hidden) toastRaf = requestAnimationFrame(() => { toastRaf = 0; placeToast(); }); };
addEventListener('scroll', toastSoon, { capture: true, passive: true });
addEventListener('resize', toastSoon);
// in-place layout changes (rules expanded, save form opened, roster rebuilt, results re-rendered) move the toast too
document.addEventListener('toggle', toastSoon, true);
if (window.ResizeObserver) { const ro = new ResizeObserver(toastSoon); ro.observe(document.querySelector('.app')); ro.observe(document.body); }
if (window.MutationObserver) new MutationObserver(toastSoon).observe(document.querySelector('.app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'open', 'class'] });
$('#toast-act').addEventListener('click', () => { const u = toastUndo; toastUndo = null; $('#toast').hidden = true; clearTimeout(toastT); if (u) { u(); toast('已復原'); } });
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (ok) toast('已複製'); else { $('#copy-area').value = text; showSheet('#copy-sheet'); $('#copy-area').focus(); $('#copy-area').select(); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('已複製'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
// sheets: remember when each was shown, so only a press that started after it appeared can close it from the backdrop
let screenGen = 0;
function showSheet(sel) { const s = $(sel); s.hidden = false; s.dataset.shown = performance.now(); screenGen++; placeToast(); }
function hideSheet(sel) { const s = typeof sel === 'string' ? $(sel) : sel; if (!s.hidden) { s.hidden = true; screenGen++; placeToast(); } }
$('#copy-close').onclick = () => hideSheet('#copy-sheet');

// two-tap confirmation instead of confirm(); the tap layer swallows the browser's own click after a tap, so only a second real tap (or key press) confirms
function armed(btn, label, action) {
  const orig = btn.textContent; let t;
  const disarm = () => { clearTimeout(t); btn.classList.remove('armed'); btn.textContent = orig; };
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { disarm(); action(); return; }
    btn.classList.add('armed'); btn.textContent = label;
    t = setTimeout(disarm, 3000);
  });
}

// ---------- theme ----------
const themes = ['auto', 'light', 'dark'], themeName = { auto: '跟隨系統', light: '淺色', dark: '深色' };
let theme = store.get('theme', 'auto');
if (!themes.includes(theme)) theme = 'auto';
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  $('#theme-btn').setAttribute('aria-label', '切換主題：' + themeName[theme]);
}
$('#theme-btn').onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(); toast('主題：' + themeName[theme]); };
applyTheme();

// ---------- roster ----------
let cur = cleanCurrent(store.get('current', null));
let absent = new Set(cur.absent);
let people = [];   // [{name, base, tag, line}]
let parseInfo = { dups: 0, over: 0 };

/** Each line "name,tag". Repeated names get the next free "(n)" suffix that is not also a name typed in the list. */
function parse(text) {
  const rows = []; let over = 0;
  text.split(/\r?\n/).forEach((raw, line) => {
    const s = raw.trim(); if (!s) return;
    const m = s.split(/[,\t，]/);
    const base = m[0].trim(); if (!base) return;
    if (rows.length >= MAX) { over++; return; }
    rows.push({ base, tag: (m[1] || '').trim(), line });
  });
  const typed = new Set(rows.map(r => r.base)), used = new Set(), next = new Map(); let dups = 0;
  const out = rows.map(r => {
    let name = r.base;
    if (used.has(name)) {
      dups++; let c = next.get(r.base) || 2;
      while (typed.has(`${r.base}(${c})`) || used.has(`${r.base}(${c})`)) c++;
      name = `${r.base}(${c})`; next.set(r.base, c + 1);
    }
    used.add(name);
    return { name, base: r.base, tag: r.tag, line: r.line };
  });
  return { list: out, dups, over };
}
const present = () => people.filter(p => !absent.has(p.name));
function saveCurrent() { cur.text = $('#roster-text').value; cur.absent = [...absent]; store.set('current', cur); }

function setCount() {
  const n = present().length;
  $('#count').innerHTML = `共 <b>${people.length}</b> 人` + (people.length !== n ? `，出席 <b>${n}</b>` : '');
}
function refreshRoster() {
  clearTimeout(inputT); inputT = null;
  const r = parse($('#roster-text').value);
  people = r.list; parseInfo = r;
  const names = new Set(people.map(p => p.name));
  absent.forEach(n => { if (!names.has(n)) absent.delete(n); });
  setCount();
  $('#sample-badge').hidden = $('#roster-text').value !== SAMPLE;
  const notes = [];
  if (r.dups) notes.push(`有 ${r.dups} 個同名，已自動加上 (2)、(3) 區分`);
  if (r.over) notes.push(`超過 ${MAX} 人上限，已略過 ${r.over} 行`);
  $('#roster-note').hidden = !notes.length; $('#roster-note').textContent = notes.join('；');
  const chips = $('#chips'); chips.textContent = '';
  const frag = document.createDocumentFragment();
  people.forEach((p, i) => {
    const b = document.createElement('button'); b.className = 'chip' + (absent.has(p.name) ? ' absent' : '');
    b.dataset.i = i; b.textContent = p.name; b.setAttribute('aria-pressed', String(!absent.has(p.name)));
    if (p.tag) { const s = document.createElement('small'); s.textContent = p.tag; b.appendChild(s); }
    frag.appendChild(b);
  });
  chips.appendChild(frag);
  refreshRuleSelects(); updateGoState(); refreshDraw(); saveCurrent();
}
let inputT = null;
$('#roster-text').addEventListener('input', () => { clearTimeout(inputT); inputT = setTimeout(refreshRoster, 150); });
// never lose the last keystrokes: save right away when the page is hidden or unloaded
function flush() { if (inputT) refreshRoster(); else saveCurrent(); }
addEventListener('pagehide', flush);
addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

// chips: tap toggles attendance (via the tap layer), long-press edits tag
let lpTimer = null;
$('#chips').addEventListener('pointerdown', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const i = +c.dataset.i, id = e.pointerId;
  const sx = e.clientX, sy = e.clientY;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    // the long-press consumes this press: its release must not toggle the chip or land on the sheet's backdrop
    const d = downs.get(id); if (d) d.used = true;
    openTag(i);
  }, 500);
  const mv = ev => { if (ev.pointerId === id && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) clearTimeout(lpTimer); };
  const up = ev => { if (ev.pointerId !== id) return; clearTimeout(lpTimer); removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
});
$('#chips').addEventListener('contextmenu', e => { if (e.target.closest('.chip')) e.preventDefault(); });
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const p = people[+c.dataset.i]; if (!p) return;
  if (absent.has(p.name)) absent.delete(p.name); else absent.add(p.name);
  c.classList.toggle('absent', absent.has(p.name)); c.setAttribute('aria-pressed', String(!absent.has(p.name)));
  setCount(); updateGoState(); refreshDraw(); saveCurrent();
});

// tag sheet
let tagFor = -1;
function openTag(i) {
  tagFor = i; const p = people[i]; if (!p) return;
  $('#tag-title').textContent = `「${p.name}」的標籤`;
  $('#tag-input').value = p.tag;
  const tags = [...new Set(people.map(q => q.tag).filter(Boolean).concat(['男', '女']))].slice(0, 8);
  $('#tag-quick').innerHTML = '';
  tags.forEach(t => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.onclick = () => setTag(t); $('#tag-quick').appendChild(b); });
  showSheet('#tag-sheet'); $('#tag-input').focus();
}
function setTag(t) {
  const p = people[tagFor]; hideSheet('#tag-sheet'); if (!p) return;
  const lines = $('#roster-text').value.split(/\r?\n/);
  t = t.replace(/[,\t，]/g, ' ').trim();
  lines[p.line] = p.base + (t ? ',' + t : '');
  $('#roster-text').value = lines.join('\n'); refreshRoster();
}
$('#tag-ok').onclick = () => setTag($('#tag-input').value);
$('#tag-clear').onclick = () => setTag('');
$('#tag-cancel').onclick = () => hideSheet('#tag-sheet');
$('#tag-input').addEventListener('keydown', e => { if (e.key === 'Enter') setTag($('#tag-input').value); });
document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', e => { if (e.target === s) hideSheet(s); }));
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.scrim').forEach(s => hideSheet(s)); });

// saved rosters
let rosters = cleanRosters(store.get('rosters', []));
function refreshRosterSelect() {
  const sel = $('#roster-load'); sel.innerHTML = '<option value="">載入名單</option><option value="__sample">範例：12 人（男女標籤）</option>';
  rosters.forEach(r => { const o = document.createElement('option'); o.value = r.id; o.textContent = `${r.name}（${r.people.length} 人）`; sel.appendChild(o); });
  if (!$('#manage-sheet').hidden) renderManage();
}
function loadRoster(r) {
  $('#roster-text').value = r.people.map(p => p.name + (p.tag ? ',' + p.tag : '')).join('\n');
  absent = new Set(); refreshRoster();
  // names after parse may have (2) suffixes; map absent flags by order
  r.people.forEach((p, i) => { if (p.absent && people[i]) absent.add(people[i].name); });
  refreshRoster(); toast(`已載入「${r.name}」`);
}
$('#roster-load').addEventListener('change', e => {
  const v = e.target.value; e.target.value = ''; if (!v) return;
  if (v === '__sample') { $('#roster-text').value = SAMPLE; absent.clear(); refreshRoster(); toast('已載入範例名單'); return; }
  const r = rosters.find(x => x.id === v); if (r) loadRoster(r);
});
$('#roster-save').onclick = () => { const f = $('#save-form'); f.hidden = !f.hidden; if (!f.hidden) $('#roster-name').focus(); };
function doSave() {
  const name = $('#roster-name').value.trim(); if (!name) { $('#roster-name').focus(); return; }
  if (!people.length) { toast('名單是空的'); return; }
  const data = { id: Date.now().toString(36), name, people: people.map(p => ({ name: p.base, tag: p.tag, absent: absent.has(p.name) })) };
  const ex = rosters.findIndex(r => r.name === name);
  if (ex >= 0) { data.id = rosters[ex].id; rosters[ex] = data; }
  else if (rosters.length >= ROSTER_CAP) { toast(`已儲存 ${rosters.length} 份名單（上限 ${ROSTER_CAP}），請先在「管理／備份」刪除不用的名單`, null, 5000); return; }
  else rosters.unshift(data);
  store.set('rosters', rosters); refreshRosterSelect();
  $('#save-form').hidden = true; $('#roster-name').value = ''; toast(`已儲存「${name}」`);
}

function planK(n, md, v) {
  if (md === 'count') return { K: v };
  const M = Math.max(1, v); let K = Math.ceil(n / M); const r = n % M; let extra = false;
  if (r && K > 1 && r < M / 2) { K = Math.floor(n / M); extra = true; }
  return { K, M, extra };
}
function validate() {
  const n = present().length, v = kVal[mode];
  if (!n) return '請先在名單輸入人名（每行一人）';
  if (!Number.isInteger(v) || v < 1) return '請輸入正整數';
  const { K } = planK(n, mode, v);
  if (mode === 'size' && K < 2) return `每組 ${v} 人時只能分成 1 組，請減少每組人數（出席 ${n} 人）`;
  if (K < 2) return '至少要分成 2 組';

}

const ANIMALS = ['老虎', '海豚', '獵鷹', '熊貓', '狐狸', '企鵝', '袋鼠', '花豹', '白鯨', '貓頭鷹', '水獺', '刺蝟'];

function defaultName(i) {

/** Pure grouping. ppl: [{name, tag}], o: {K, tag, together, apart, last}. Larger groups come first. */
function makeGroups(ppl, o) {
  const K = o.K, n = ppl.length;
  const idx = new Map(ppl.map((p, i) => [p.name, i]));
  // union-find for "together"
  const par = ppl.map((_, i) => i);
  const find = i => par[i] === i ? i : (par[i] = find(par[i]));
  (o.together || []).forEach(([a, b]) => { if (idx.has(a) && idx.has(b)) par[find(idx.get(a))] = find(idx.get(b)); });
  const um = new Map(); ppl.forEach((p, i) => { const r = find(i); if (!um.has(r)) um.set(r, []); um.get(r).push(i); });
  const units = [...um.values()];
  const cap = Math.ceil(n / K);
  const big = units.find(u => u.length > cap);
  if (big) return { error: `「${big.map(i => ppl[i].name).join('、')}」綁定在一起共 ${big.length} 人，超過每組上限 ${cap} 人` };
  const apart = (o.apart || []).filter(([a, b]) => idx.has(a) && idx.has(b)).map(([a, b]) => [idx.get(a), idx.get(b)]);
  // last grouping as a group number per person: overlap = pairs sharing both last and new group (O(n) per try)
  const lastG = new Int32Array(n).fill(-1); let hasLast = false;
  if (Array.isArray(o.last)) o.last.forEach((g, gi) => Array.isArray(g) && g.forEach(nm => { const i = idx.get(nm); if (i !== undefined && lastG[i] < 0) { lastG[i] = gi; hasLast = true; } }));
  const singles = units.every(u => u.length === 1);
  const tagOf = ppl.map(p => p.tag || '');
  const where = new Int32Array(n);

  function once() {
    const groups = Array.from({ length: K }, () => []);
    if (singles) {
      let seq;
      if (o.tag) {
        const buckets = new Map(); ppl.forEach((p, i) => { const t = tagOf[i]; if (!buckets.has(t)) buckets.set(t, []); buckets.get(t).push(i); });
        seq = [].concat(...[...buckets.values()].map(b => shuffle(b.slice())));
      } else seq = shuffle(ppl.map((_, i) => i));
      // continuous round-robin over a shuffled group order: sizes and per-tag counts differ by <= 1
      const order = shuffle(Array.from({ length: K }, (_, i) => i));
      seq.forEach((p, i) => groups[order[i % K]].push(p));
    } else {
      const us = shuffle(units.slice()).sort((a, b) => b.length - a.length);
      const tagCount = Array.from({ length: K }, () => new Map());
      us.forEach(u => {
        let best = -1, bestKey = null;
        const cand = shuffle(Array.from({ length: K }, (_, i) => i));
        for (const g of cand) {
          const fits = groups[g].length + u.length <= cap ? 0 : 1;
          const tc = o.tag ? u.reduce((s, i) => s + (tagCount[g].get(tagOf[i]) || 0), 0) : 0;
          const key = [fits, groups[g].length, tc];
          if (!bestKey || key[0] < bestKey[0] || (key[0] === bestKey[0] && (key[1] < bestKey[1] || (key[1] === bestKey[1] && key[2] < bestKey[2])))) { best = g; bestKey = key; }
        }
        u.forEach(i => { groups[best].push(i); tagCount[best].set(tagOf[i], (tagCount[best].get(tagOf[i]) || 0) + 1); });
      });
      groups.forEach(g => shuffle(g));
    }
    groups.forEach((g, gi) => g.forEach(i => { where[i] = gi; }));
    let conflicts = 0; for (const [a, b] of apart) if (where[a] === where[b]) conflicts++;
    let overlap = 0;
    if (hasLast) groups.forEach(g => { const c = new Map(); for (const i of g) { const l = lastG[i]; if (l >= 0) { const k = c.get(l) || 0; overlap += k; c.set(l, k + 1); } } });
    return { groups, conflicts, overlap };
  }
  const tries = Math.max(apart.length ? 200 : 1, hasLast ? 50 : 1);
  let best = null, attempts = 0;
  for (let t = 0; t < tries; t++) {
    const r = once(); attempts++;
    if (!best || r.conflicts * 1e6 + r.overlap < best.conflicts * 1e6 + best.overlap) best = r;
    if (best.conflicts === 0 && (!hasLast || best.overlap === 0 || t >= 49)) break;
  }
  // 不可同組 still violated after the random tries: repair with min-conflicts swaps (equal-size units, same tags when
  // balancing tags, so group sizes and tag balance stay as they are), then an exact backtracking search that either finds
  // an arrangement or proves that none exists.
  let proven = false, tagRelaxed = false;
  if (best.conflicts > 0) {
    const fixed = repairApart(best.groups);
    if (fixed.groups) {
      best = { groups: fixed.groups, conflicts: 0, overlap: overlapOf(fixed.groups) };
      // the exact search ignores tags: say so if that left a tag unevenly spread (counts differing by more than 1)
      if (o.tag && fixed.search) {
        const tags = [...new Set(tagOf)];
        tagRelaxed = tags.some(tg => { const c = fixed.groups.map(g => g.reduce((s, i) => s + (tagOf[i] === tg ? 1 : 0), 0)); return Math.max(...c) - Math.min(...c) > 1; });
      }
    }
    proven = fixed.proven;
  }
  // stable: bigger groups first, so "多 1 人的組在前面" is true
  const groups = best.groups.map((g, i) => [g, i]).sort((a, b) => b[0].length - a[0].length || a[1] - b[1]).map(x => x[0].map(i => ppl[i]));
  return { groups, conflicts: best.conflicts, overlap: best.overlap, attempts, proven: best.conflicts > 0 && proven, tagRelaxed };

  function overlapOf(groups) {
    let overlap = 0;
    if (hasLast) groups.forEach(g => { const c = new Map(); for (const i of g) { const l = lastG[i]; if (l >= 0) { const k = c.get(l) || 0; overlap += k; c.set(l, k + 1); } } });
    return overlap;
  }
  /** groups: arrays of person indices. Returns { groups } with no apart conflict, or { proven } when none can exist. */
  function repairApart(start) {
    const U = units.length, uOf = new Int32Array(n);
    units.forEach((u, k) => u.forEach(i => { uOf[i] = k; }));
    const adj = Array.from({ length: U }, () => []), edges = [];
    let self = 0;
    for (const [a, b] of apart) { const ua = uOf[a], ub = uOf[b]; if (ua === ub) self++; else { adj[ua].push(ub); adj[ub].push(ua); edges.push([ua, ub]); } }
    if (self) return { proven: true };                 // two people tied by 固定同組 but also 不可同組
    const gOf = new Int32Array(U);
    start.forEach((g, gi) => g.forEach(i => { gOf[uOf[i]] = gi; }));
    const size = units.map(u => u.length);
    const sig = units.map(u => u.length + (o.tag ? '|' + u.map(i => tagOf[i]).sort().join('\u0001') : ''));
    const bySig = new Map(); sig.forEach((k, u) => { if (!bySig.has(k)) bySig.set(k, []); bySig.get(k).push(u); });
    const conf = (u, g, skip) => { let c = 0; for (const v of adj[u]) if (v !== skip && gOf[v] === g) c++; return c; };
    const total = () => { let c = 0; for (const [a, b] of edges) if (gOf[a] === gOf[b]) c++; return c; };
    const toGroups = g => { const out = Array.from({ length: K }, () => []); units.forEach((u, k) => u.forEach(i => out[g[k]].push(i))); out.forEach(x => shuffle(x)); return out; };
    // 1) min-conflicts local search with a little random noise, about 40 ms at most
    let cur = total();
    const t0 = performance.now();
    for (let it = 0; cur > 0 && it < 200000; it++) {
      if ((it & 127) === 0 && performance.now() - t0 > 40) break;
      const bad = []; for (const [a, b] of edges) if (gOf[a] === gOf[b]) bad.push(a, b);
      const u = bad[randInt(bad.length)], gu = gOf[u];
      let bestW = -1, bestD = Infinity, ties = 0;
      for (const w of bySig.get(sig[u])) {
        const gw = gOf[w]; if (gw === gu) continue;
        const d = conf(u, gw, w) + conf(w, gu, u) - conf(u, gu, -1) - conf(w, gw, -1);
        if (d < bestD) { bestD = d; bestW = w; ties = 1; } else if (d === bestD && randInt(++ties) === 0) bestW = w;
      }
      if (bestW < 0) continue;
      if (bestD <= 0 || randInt(10) === 0) { const gw = gOf[bestW]; gOf[bestW] = gu; gOf[u] = gw; cur += bestD; }
    }
    if (cur === 0) return { groups: toGroups(gOf) };
    // 2) exact search over the units that have 不可同組 partners; the others fill the remaining seats
    const cons = []; for (let u = 0; u < U; u++) if (adj[u].length) cons.push(u);
    cons.sort((a, b) => adj[b].length - adj[a].length || size[b] - size[a]);
    const singlesOnly = size.every(x => x === 1);
    // seats per group: with only single people the sizes are forced (they differ by at most 1); otherwise at most cap each
    const caps = singlesOnly ? start.map(g => g.length) : Array(K).fill(cap);
    const load = new Array(K).fill(0), as = new Int32Array(U).fill(-1);
    let nodes = 0, aborted = false;
    const order = shuffle(Array.from({ length: K }, (_, i) => i));
    function bt(k) {
      if (k === cons.length) return true;
      if (++nodes > 300000) { aborted = true; return false; }
      const u = cons[k], tried = new Set();
      for (const g of order) {
        if (load[g] + size[u] > caps[g]) continue;
        if (load[g] === 0) { const key = caps[g]; if (tried.has(key)) continue; tried.add(key); }   // empty groups of one size are interchangeable
        let ok = true; for (const v of adj[u]) if (as[v] === g) { ok = false; break; }
        if (!ok) continue;
        as[u] = g; load[g] += size[u];
        if (bt(k + 1)) return true;
        as[u] = -1; load[g] -= size[u];
        if (aborted) return false;
      }
      return false;
    }
    if (!bt(0)) return { proven: !aborted };
    // place everyone else: largest unit first into the group with the most free seats
    const rest = []; for (let u = 0; u < U; u++) if (!adj[u].length) rest.push(u);
    shuffle(rest).sort((a, b) => size[b] - size[a]);
    const goal = start.map(g => g.length);
    for (const u of rest) {
      let g = -1, room = -Infinity;
      for (let x = 0; x < K; x++) { const r = (singlesOnly ? caps[x] : goal[x]) - load[x]; if (r > room) { room = r; g = x; } }
      as[u] = g; load[g] += size[u];
    }
    if (load.some((l, x) => l > cap)) return { proven: false };
    return { groups: toGroups(as), search: true };
  }
}

let result = cleanResult(store.get('result', null));
if (result) result.names = result.names.map((n, i) => n || defaultName(i));
let lastResultShown = !!result;
function saveResult() { if (result) store.set('result', result); else store.del('result'); }
function runGrouping() {
  const err = validate(); if (err) { updateGoState(); return; }

  const n = ppl.length, plan = planK(n, mode, kVal[mode]);
  const last = opt.avoid ? cleanLast(store.get('lastGroups', null)) : null;
  const t0 = performance.now();
  const r = makeGroups(ppl, { K: plan.K, tag: opt.tag, together: rules.together, apart: rules.apart, last });
  const ms = performance.now() - t0;
  const m = $('#go-msg');
  if (r.error) { m.className = 'msg err'; m.textContent = r.error; lastResultShown = false; return; }
  const prev = result ? { result: JSON.parse(JSON.stringify(result)), last: store.get('lastGroups', null), msg: m.textContent, cls: m.className } : null;
  // previous result becomes "last" for avoid-overlap next time
  store.set('lastGroups', r.groups.map(g => g.map(p => p.name)));
  result = { groups: r.groups.map(g => g.map(p => ({ name: p.name, tag: p.tag }))), names: r.groups.map((_, i) => defaultName(i)) };
  saveResult(); lastResultShown = true;
  const sizes = result.groups.map(g => g.length);
  const parts = [`${n} 人分成 ${plan.K} 組（${sizes.join('／')}）`];
  if (mode === 'size' && sizes.some(s => s !== plan.M)) parts.push(plan.extra ? `每組 ${plan.M} 人無法整除，多出的人分給前面幾組（各多 1 人）` : `每組 ${plan.M} 人無法整除，最後幾組少 1 人`);
  if (r.conflicts) { m.className = 'msg err'; parts.unshift(r.proven ? `條件無法同時滿足：以下是最接近的結果，仍有 ${r.conflicts} 組「不可同組」衝突` : `找不到符合條件的分法：以下是最接近的結果，仍有 ${r.conflicts} 組「不可同組」衝突`); }
  else m.className = 'msg';
  if (r.tagRelaxed) parts.push('為了讓「不可同組」都成立，標籤平衡已放寬（部分標籤在各組人數差超過 1）');
  if (last && !r.conflicts) parts.push(`與上次同組的配對 ${r.overlap} 對`);
  m.textContent = parts.join('。');
  m.dataset.ms = ms.toFixed(1);
  renderResult();
  if (prev) toast('已重新分組', () => {
    result = prev.result; saveResult(); if (prev.last) store.set('lastGroups', prev.last); else store.del('lastGroups');
    renderResult(); m.className = prev.cls; m.textContent = prev.msg; lastResultShown = true;
  });
  if (!matchMedia('(min-width: 900px)').matches) $('#go-msg').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
$('#go').onclick = runGrouping;
$('#regroup').onclick = runGrouping;

function renderResult() {
  const box = $('#groups'); box.innerHTML = '';
  if (!result) { $('#result').hidden = true; return; }
  $('#result').hidden = false;
  box.classList.toggle('many', result.groups.length > 20);
  result.groups.forEach((g, gi) => {
    const card = document.createElement('div'); card.className = 'group'; card.dataset.g = gi;
    card.style.setProperty('--bib', `var(--b${gi % 12})`);
    card.innerHTML = `<div class="bib"><span class="no">${gi + 1}</span><input id="gname-${gi}" aria-label="第 ${gi + 1} 組名稱（點一下可改名）" title="點一下可改組名" maxlength="20"><span class="pen" aria-hidden="true">✎</span><span class="n">${g.length} 人</span></div><ul class="members"></ul>`;
    const inp = card.querySelector('input'); inp.value = result.names[gi] || defaultName(gi);
    inp.addEventListener('change', () => { result.names[gi] = inp.value.trim() || defaultName(gi); inp.value = result.names[gi]; saveResult(); });
    const ul = card.querySelector('ul');
    g.forEach((p, pi) => {
      const li = document.createElement('li'); li.className = 'member'; li.dataset.g = gi; li.dataset.p = pi; li.textContent = p.name;
      if (p.tag) { const s = document.createElement('small'); s.textContent = p.tag; li.appendChild(s); }
      ul.appendChild(li);
    });
    box.appendChild(card);
  });
}
function resultText() { return result.groups.map((g, i) => `【${result.names[i]}】${g.map(p => p.name).join('、')}`).join('\n'); }
// spreadsheet-safe: a cell starting with = + - @ (or tab / CR) is prefixed with ' so it is never run as a formula
function csvCell(s) { s = String(s); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function resultCSV() { return '組別,姓名\n' + result.groups.map((g, i) => g.map(p => csvCell(result.names[i]) + ',' + csvCell(p.name)).join('\n')).join('\n'); }
$('#copy-text').onclick = () => result && copyText(resultText());
$('#copy-csv').onclick = () => result && copyText(resultCSV());

// ---------- long-press drag (Pointer Events, works on touch) ----------
function enableDrag(container, itemSel, onOver, onDrop) {
  let st = null;
  container.addEventListener('contextmenu', e => { if (e.target.closest(itemSel)) e.preventDefault(); });
  container.addEventListener('pointerdown', e => {
    const it = e.target.closest(itemSel); if (!it || e.button > 0) return;
    if (st) { clearTimeout(st.timer); if (st.on) return; }
    st = { it, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
    st.timer = setTimeout(() => {
      if (!st) return;
      st.on = true; it.classList.add('dragging');
      const gh = it.cloneNode(true); gh.classList.add('ghost'); gh.classList.remove('dragging'); document.body.appendChild(gh); st.gh = gh;
      gh.style.left = st.x + 'px'; gh.style.top = st.y + 'px';
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    }, e.pointerType === 'mouse' ? 120 : 300);
  });
  addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 8) { clearTimeout(st.timer); st = null; } return; }
    st.gh.style.left = st.x + 'px'; st.gh.style.top = st.y + 'px';
    onOver(document.elementFromPoint(st.x, st.y));
  });
  // block scrolling once a drag is live (first touchmove after the hold is still cancelable)
  addEventListener('touchmove', e => { if (st && st.on && e.cancelable) e.preventDefault(); }, { passive: false });
  const end = e => {
    if (!st || (e.pointerId !== undefined && e.pointerId !== st.id)) return;
    clearTimeout(st.timer);
    if (st.on) { st.gh.remove(); st.it.classList.remove('dragging'); onOver(null); if (e.type === 'pointerup') onDrop(st.it, document.elementFromPoint(st.x, st.y)); }
    st = null;
  };
  addEventListener('pointerup', end); addEventListener('pointercancel', end);
}
enableDrag($('#groups'), '.member', el => {
  document.querySelectorAll('.group.drop').forEach(c => c.classList.remove('drop'));
  const c = el && el.closest('.group'); if (c) c.classList.add('drop');
}, (it, el) => {
  const c = el && el.closest('.group'); if (!c) return;
  const from = +it.dataset.g, to = +c.dataset.g, pi = +it.dataset.p; if (from === to) return;
  const [p] = result.groups[from].splice(pi, 1); result.groups[to].push(p);
  saveResult(); renderResult(); toast(`${p.name} → ${result.names[to]}`);
});

// ---------- draw ----------
let draw = cleanDraw(store.get('drawState', null));
$('#draw-norepeat').checked = draw.norepeat;
let rolling = false;
function attendees() { return present().map(p => p.name); }
function pool() { const used = new Set(draw.order); return draw.norepeat ? attendees().filter(n => !used.has(n)) : attendees(); }
function saveDraw() { store.set('drawState', draw); }
function refreshDraw() {
  const all = attendees(), pl = pool();
  const done = draw.norepeat && all.length > 0 && pl.length === 0;
  $('#draw-next').disabled = rolling || !pl.length;
  $('#draw-big').disabled = rolling || !pl.length;
  $('#draw-sub').textContent = !all.length ? '名單是空的，請先輸入人名' : done ? `全部抽完（${all.length} 人），按「重置」重新開始` : draw.norepeat ? `未抽 ${pl.length} 人／出席 ${all.length} 人` : `每次從出席 ${all.length} 人中抽（可重複）`;
  if (done && !rolling) { const b = $('#draw-big'); b.textContent = '全部抽完'; b.className = 'big idle'; }
  else if (!draw.order.length && !rolling) { const b = $('#draw-big'); b.textContent = '點這裡抽人'; b.className = 'big idle'; }
  const ol = $('#draw-order'); ol.innerHTML = '';
  draw.order.forEach((n, i) => { const li = document.createElement('li'); li.dataset.i = i; li.textContent = n; ol.appendChild(li); });
  if (!draw.order.length) ol.innerHTML = '<li class="empty" style="cursor:default;border:0;background:none">還沒有抽出任何人</li>';
  $('#order-count').textContent = draw.order.length ? `${draw.order.length} 人` : '';
}
function drawNext() {
  if (rolling) return;
  const pl = pool(); if (!pl.length) { refreshDraw(); return; }
  const pick = pl[randInt(pl.length)];
  const big = $('#draw-big');
  const finish = () => {
    rolling = false; big.textContent = pick; big.className = 'big'; void big.offsetWidth; big.classList.add('hit');
    draw.order.push(pick); saveDraw(); refreshDraw();
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (_) {}
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || pl.length === 1) { finish(); return; }
  rolling = true; refreshDraw(); big.className = 'big rolling';
  // delays ease from 50ms to 250ms, about 1.2s in total; the final name is the pre-chosen pick
  const delays = []; let d = 50, total = 0;
  while (total < 1200) { delays.push(d); total += d; d = Math.min(250, d * 1.16); }
  let k = 0, lastShown = '';
  const tick = () => {
    if (k >= delays.length) { finish(); return; }
    let nm; do { nm = pl[randInt(pl.length)]; } while (pl.length > 2 && nm === lastShown);
    lastShown = nm; big.textContent = nm;
    setTimeout(tick, delays[k++]);
  };
  tick();
}
$('#draw-next').onclick = drawNext;
$('#draw-big').onclick = drawNext;
$('#draw-norepeat').onchange = e => { draw.norepeat = e.target.checked; saveDraw(); refreshDraw(); };
armed($('#draw-reset'), '確定重置？', () => {
  const old = draw.order.slice();
  draw.order = []; saveDraw(); refreshDraw();
  toast('已重置抽人順序', () => { draw.order = old; saveDraw(); refreshDraw(); });
});
$('#draw-copy').onclick = () => { if (!draw.order.length) { toast('還沒有抽出任何人'); return; } copyText(draw.order.map((n, i) => `${i + 1}. ${n}`).join('\n')); };
enableDrag($('#draw-order'), 'li[data-i]', el => {
  document.querySelectorAll('.order li.drop').forEach(c => c.classList.remove('drop'));
  const li = el && el.closest('#draw-order li[data-i]'); if (li) li.classList.add('drop');
}, (it, el) => {
  const li = el && el.closest('#draw-order li[data-i]'); if (!li) return;
  const from = +it.dataset.i, to = +li.dataset.i; if (from === to) return;
  const [n] = draw.order.splice(from, 1); draw.order.splice(to, 0, n); saveDraw(); refreshDraw();
});

// ---------- tabs ----------
function setTab(t) {
  const g = t === 'group';
  if (cur.tab !== t) screenGen++;
  $('#tab-group').setAttribute('aria-selected', String(g)); $('#tab-draw').setAttribute('aria-selected', String(!g));
  $('#pane-group').hidden = !g; $('#pane-draw').hidden = g; $('.app').classList.toggle('on-draw', !g);
  cur.tab = t; saveCurrent();
}
$('#tab-group').onclick = () => setTab('group');
$('#tab-draw').onclick = () => setTab('draw');
$('.tabs').addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const t = cur.tab === 'draw' ? 'group' : 'draw'; setTab(t); $('#tab-' + t).focus(); } });

/* ---------- touch: act on release ----------
   Every control runs on pointerup of the pointer that went down on it (tracked per pointerId), only if it was released on that
   control (moved < 10 px, or inside its box grown by 16 px). So a tap still works while another finger rests on the page
   (Chromium sends no click then), two overlapping taps both act, and a control that appears under the finger can't fire.
   The action runs as el.click() under `firing`. pointerdown's default is prevented (no focus jump / keyboard on the next
   screen), so a focused text field is blurred by hand. The browser's own click that follows (Chromium 141: detail 0, no
   pointerType) is swallowed in the capture phase: any click within 800 ms of the last tap, unless Enter/Space was pressed
   after that tap. A lone detail-0 click (keyboard, screen reader) still acts once. A chip held long enough to open the tag
   sheet is consumed by that (its release does nothing), and a sheet's backdrop only closes from a press that began on it. */
const TAP_SEL = 'button, summary, label.check, label.check input';
const downs = new Map();
let firing = false, lastTapUp = -1e9, lastKey = -1e9;
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') lastKey = performance.now(); }, true);
addEventListener('keyup', e => { if (e.key === ' ') lastKey = performance.now(); }, true);
function tapTarget(t) {
  if (!(t instanceof Element)) return null;
  if (t.classList.contains('scrim')) return t;
  let el = t.closest(TAP_SEL);
  if (el && el.tagName === 'LABEL') el = el.querySelector('input') || el;
  return el;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = tapTarget(e.target);
  if (!el || el.disabled) return;
  downs.set(e.pointerId, { el, id: el.id, chip: el.classList.contains('chip') ? el.dataset.i : null, gen: screenGen, t0: performance.now(), x: e.clientX, y: e.clientY });
  e.preventDefault();
});
document.addEventListener('pointerup', e => {
  const d = downs.get(e.pointerId); if (!d) return;
  downs.delete(e.pointerId);
  lastTapUp = performance.now();
  if (d.used) return;                       // a long-press already acted
  let el = d.el;
  // the same screen may have re-rendered (chips, rule list): find the control again; a real screen / sheet change cancels
  if (!el.isConnected) {
    if (d.gen !== screenGen) return;
    el = d.id ? document.getElementById(d.id) : d.chip != null ? document.querySelector(`#chips .chip[data-i="${d.chip}"]`) : null;
    if (!el) return;
  }
  if (el.disabled) return;
  if (d.gen !== screenGen && !el.closest('.scrim:not([hidden])') && !el.closest('.toast')) {
    // a sheet opened or the tab changed while this finger was down: only controls inside the now-visible sheet may act
    if (document.querySelector('.scrim:not([hidden])')) return;
  }
  const box = (el.closest('label') || el).getBoundingClientRect(), m = 16;
  if (!box.width && !box.height) return;
  const still = Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10;
  const inBox = e.clientX >= box.left - m && e.clientX <= box.right + m && e.clientY >= box.top - m && e.clientY <= box.bottom + m;
  if (!still && !inBox) return;
  if (el.classList.contains('scrim') && !(d.t0 > (+el.dataset.shown || 0))) return;
  const a = document.activeElement;
  if (a && a !== el && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'checkbox') a.blur();
  if (!el.classList.contains('scrim') && a !== el) try { el.focus({ preventScroll: true, focusVisible: false }); } catch (_) {}
  firing = true; try { el.click(); } finally { firing = false; }
});
document.addEventListener('pointercancel', e => downs.delete(e.pointerId));
addEventListener('click', e => {
  if (firing) return;
  const t = e.target;
  // a click on a text box or select only places the caret / opens the picker; let it through
  if (t instanceof Element && (t.matches('textarea, select, option, input:not([type=radio]):not([type=checkbox])') || (t.closest('label') && !t.closest('.check')))) return;
  const recentTap = performance.now() - lastTapUp < 800 && !(lastKey > lastTapUp);
  if (recentTap || (e.isTrusted && (e.detail > 0 || e.pointerType))) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('button, summary')) e.preventDefault(); });

// ---------- 開始分組: pinned under the header on phones, inside the settings panel on wide screens ----------
const wideMq = matchMedia('(min-width: 900px)');
function placeGo() { const host = wideMq.matches ? $('#go-slot') : $('#go-row'); if ($('#go').parentElement !== host) host.appendChild($('#go')); }
if (wideMq.addEventListener) wideMq.addEventListener('change', placeGo); else if (wideMq.addListener) wideMq.addListener(placeGo);
placeGo();

// ---------- init ----------
$('#roster-text').value = cur.text;
refreshRosterSelect();
refreshRoster();
setMode(mode);
setTab(cur.tab);
renderResult();
if (result) { const s = result.groups.map(g => g.length); $('#go-msg').textContent = `上次結果：${s.length} 組（${s.join('／')}）`; }

window.__tp = { placeToast, makeGroups, planK, parse, randInt, csvCell, resultCSV: () => result && resultCSV(), snapshot, applyState, get result() { return result; }, get draw() { return draw; }, get rosters() { return rosters; }, get rules() { return rules; }, get people() { return people; }, get absent() { return [...absent]; }, get theme() { return theme; }, get k() { return kVal[mode]; } };
})();
</script>
