<!doctype html>

<title>星軌跳躍</title>
<style>
:root{--ink:#eef3ff;--dim:#9aa6d6;--cy:#6ff3ff;--gold:#ffd66b;--panel:rgba(14,18,48,.78);--line:rgba(140,170,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#04051a;color:var(--ink);overflow:hidden;overscroll-behavior:none;
font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;height:100dvh;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{transition:opacity .3s;position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.ibtn{pointer-events:auto;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(14,18,48,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn:active{transform:scale(.94)}
#scoreBox{text-align:center;line-height:1;margin-top:2px}
#score{font-size:54px;font-weight:800;letter-spacing:1px;text-shadow:0 0 18px rgba(111,243,255,.55),0 2px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
#best{font-size:13px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
#combo{margin-top:8px;display:inline-block;font-size:14px;font-weight:700;color:#1b1030;background:linear-gradient(90deg,#ffe58a,#ffb36b);padding:4px 10px;border-radius:999px;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
#combo.on{opacity:1;transform:scale(1)}
body.menu #scoreBox,body.menu #pauseBtn{opacity:0;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13%);text-align:center;font-size:18px;font-weight:700;color:var(--cy);text-shadow:0 0 12px rgba(111,243,255,.6);pointer-events:none;animation:pulse 1.4s ease-in-out infinite;opacity:0;transition:opacity .3s}
#hint.on{opacity:1}
#hint small{display:block;font-size:13px;color:var(--dim);font-weight:500;margin-top:6px;text-shadow:none}
@keyframes pulse{50%{transform:translateY(-4px);filter:brightness(1.3)}}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.9);padding:10px 18px;border-radius:14px;background:rgba(10,12,40,.75);border:1px solid var(--line);font-weight:700;font-size:16px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap;color:var(--gold)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);background:radial-gradient(ellipse at 50% 40%,rgba(10,14,50,.55),rgba(2,3,14,.85));touch-action:none}
.ov.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:min(360px,100%);text-align:center;padding:26px 22px 22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{font-size:44px;font-weight:900;letter-spacing:4px;margin:4px 0 2px;background:linear-gradient(180deg,#fff,#9fe9ff 55%,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(111,243,255,.35))}
.sub{font-size:12px;letter-spacing:6px;color:var(--dim);margin-bottom:16px}
.how{font-size:14px;line-height:1.7;color:#cdd6ff;text-align:left;background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;margin:12px 0 16px}
.how b{color:var(--cy)}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:16px;font:inherit;font-size:19px;font-weight:800;letter-spacing:2px;color:#08102a;cursor:pointer;background:linear-gradient(180deg,#8ff6ff,#3fc5ff);box-shadow:0 6px 24px rgba(63,197,255,.35),inset 0 -3px 0 rgba(0,0,0,.15);margin-top:10px}
.btn.alt{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:16px;min-height:48px}
.btn:active{transform:translateY(1px) scale(.99)}
.bigsc{font-size:68px;font-weight:900;line-height:1;margin:8px 0 2px;text-shadow:0 0 22px rgba(111,243,255,.5);font-variant-numeric:tabular-nums}
.newrec{display:none;color:#1b1030;background:linear-gradient(90deg,#ffe58a,#ffb36b);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;margin:6px auto 0;width:max-content}
.newrec.on{display:block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 6px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--dim)}
.ttl{font-size:22px;font-weight:800;color:#ffb3c7;letter-spacing:2px}
.muted{color:var(--dim);font-size:13px;margin-top:10px}
.bestline{color:var(--gold);font-weight:700;font-size:15px}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

[hidden] { display: none !important; }

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body class="menu">
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud">
    <button class="ibtn" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
    <div id="scoreBox"><div id="score">0</div><div id="best">最佳 0</div><div id="combo">完美 ×2</div></div>

  </div>
  <div id="hint">點擊螢幕發射<small>沿切線飛出，對準下一顆星球</small></div>

  <div class="ov on" id="title">
    <div class="card">
      <div class="logo">星軌跳躍</div>
      <div class="sub">ORBIT HOP</div>
      <div class="bestline" id="tBest">最佳紀錄 0</div>
      <div class="how">
        ● 太空人繞著星球公轉，<b>點擊螢幕</b>就沿切線直線飛出。<br>
        ● 飛進下一顆星球的<b>引力圈</b>即被捕獲，得 1 分。<br>
        ● 從正中心穿過＝<b>完美</b>，額外加分並累積連擊。<br>
        ● 收集<b>星塵</b>加分；小心小行星與黑洞。錯過就漂流太空！
      </div>

    <div class="card">

        <div class="stat"><div class="v" id="oJumps">0</div><div class="k">成功跳躍</div></div>
        <div class="stat"><div class="v" id="oPerf">0</div><div class="k">完美次數</div></div>
        <div class="stat"><div class="v" id="oCombo">0</div><div class="k">最高連擊</div></div>
        <div class="stat"><div class="v" id="oDust">0</div><div class="k">星塵</div></div>
      </div>

      <button class="btn alt" id="overMenuBtn">主選單</button>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const ID='orbit-hop';
const store={get(k,d){try{const v=localStorage.getItem(ID+':'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(ID+':'+k,String(v))}catch(e){}}};

/* ---------- constants & helpers ---------- */
const DT=1/120, V=470, TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TMP={x:0,y:0}, TMP2={x:0,y:0};

const PAL=[
 ['#ffd29a','#f07a3c','#6e2410','#ffb36b'],
 ['#a8f0ff','#3b9cf0','#123a7a','#6fd8ff'],
 ['#dcc2ff','#8a5af0','#2e1670','#b48cff'],
 ['#b5ffd0','#35c47d','#0d5a35','#6fffb0'],
 ['#ffc0d6','#ec5a8d','#6e1438','#ff8fb5'],
 ['#fff0a8','#e7b636','#6e4f0d','#ffe27a'],
 ['#c9e4ff','#7d8fb8','#2a3354','#c3d4ff']
];

/* ---------- world / physics (shared with generator & bot) ---------- */
function pPos(p,t,o){if(p.mv){const s=Math.sin(t*p.mv.w+p.mv.ph);o.x=p.x0+p.mv.ax*s;o.y=p.y0+p.mv.ay*s}else{o.x=p.x0;o.y=p.y0}return o}
function aPos(a,t,o){o.x=a.cx+a.dr*Math.cos(t*a.dw+a.ph);o.y=a.cy+a.dr*Math.sin(t*a.dw+a.ph);return o}
// one physics step of a flight; returns 0 continue,1 captured,2 black hole,3 asteroid,4 lost
function flyStep(s,t,tgt){
  const holes=tgt.holes, asts=tgt.asts;
  if(holes.length){
    for(let i=0;i<holes.length;i++){const h=holes[i];const dx=h.x-s.x,dy=h.y-s.y,d2=dx*dx+dy*dy;
      if(d2<h.r*h.r)return 2;const d=Math.sqrt(d2),acc=h.k/Math.max(d2,900);s.vx+=dx/d*acc*DT;s.vy+=dy/d*acc*DT}
    const sp=Math.hypot(s.vx,s.vy);s.vx*=V/sp;s.vy*=V/sp;
  }
  s.x+=s.vx*DT;s.y+=s.vy*DT;s.ft+=DT;
  for(let i=0;i<asts.length;i++){const a=asts[i];aPos(a,t,TMP2);const dx=TMP2.x-s.x,dy=TMP2.y-s.y,rr=a.r+6;if(dx*dx+dy*dy<rr*rr)return 3}
  pPos(tgt,t,TMP2);const d=Math.hypot(s.x-TMP2.x,s.y-TMP2.y);
  if(d<=tgt.R+tgt.tol)return 1;
  if(!(d<=s.d0+140)||s.ft>2.4)return 4;
  return 0;
}
function launchState(src,tgt,a,t,s){
  pPos(src,t,TMP);s.x=TMP.x+src.R*Math.cos(a);s.y=TMP.y+src.R*Math.sin(a);
  const sg=src.w<0?-1:1;s.vx=-Math.sin(a)*sg*V;s.vy=Math.cos(a)*sg*V;s.ft=0;
  pPos(tgt,t,TMP);s.d0=Math.hypot(s.x-TMP.x,s.y-TMP.y);return s;
}
const SIM={x:0,y:0,vx:0,vy:0,ft:0,d0:0};
function simLaunch(src,tgt,a,t){
  const s=launchState(src,tgt,a,t,SIM);
  if(!tgt.holes.length){ // quick geometric reject
    pPos(tgt,t,TMP);const rx=TMP.x-s.x,ry=TMP.y-s.y;const along=(rx*s.vx+ry*s.vy)/V;const perp=Math.abs(rx*s.vy-ry*s.vx)/V;
    const slack=tgt.R+tgt.tol+(tgt.mv?Math.abs(tgt.mv.ax)+Math.abs(tgt.mv.ay)+4:2);
    if(perp>slack||along<-slack)return 4;
  }
  let tt=t;for(;;){tt+=DT;const e=flyStep(s,tt,tgt);if(e)return e}
}
// longest contiguous launch window (seconds) guaranteed from arbitrary arrival states
// Resumable: mwRun() stops at `deadline` (performance.now ms) and continues from the same sample next call,
// so the result (and the world RNG sequence) is identical to an uninterrupted run.
function mwInit(src,tgt,need){
  const wa=Math.abs(src.w), dyn=!!(src.mv||tgt.mv||tgt.asts.length);
  return {src,tgt,need,dyn,samples:dyn?6:1,step:dyn?0.008:0.004,H:dyn?Math.max(TAU/wa*1.3,4.5):TAU/wa*1.25,
    worst:1e9,k:0,tau:0,run:0,best:0};
}
function mwRun(st,deadline){
  const src=st.src,tgt=st.tgt,need=st.need,step=st.step,H=st.H;let cnt=0;
  while(st.k<st.samples){
    const t0=st.dyn?3+st.k*1.37:0, a0=st.k*2.39;
    let run=st.run,best=st.best,tau=st.tau;
    for(;tau<H;tau+=step){
      if(deadline&&(++cnt&15)===0&&performance.now()>deadline){st.tau=tau;st.run=run;st.best=best;return false}
      if(simLaunch(src,tgt,a0+src.w*tau,t0+tau)===1){run+=step;if(run>best)best=run}else run=0;
      if(need&&best>=need)break;
    }
    if(best<st.worst)st.worst=best;
    st.tau=0;st.run=0;st.best=0;
    if(need&&st.worst<need){st.k=st.samples;break}
    st.k++;
  }
  return true;
}
function measureWindow(src,tgt,need){const st=mwInit(src,tgt,need);mwRun(st,0);return st.worst}
const minWin=n=>Math.max(0.115,0.46*Math.exp(-n/42));

function newWorld(seed){
  const rng=mulberry32(seed>>>0);
  const w={seed,rng,planets:[]};
  const p0={i:0,x0:0,y0:0,r:30,R:62,tol:24,w:1.25,mv:null,asts:[],holes:[],dust:[],pal:1,ring:false,tilt:0,win:9,band:rng()};
  w.planets.push(p0);
  return w;
}
function planetProps(w,n,easy){
  const r=w.rng,rr=(a,b)=>a+(b-a)*r();
  const pr=rr(15,33);
  const p={i:n,r:pr,R:pr+rr(24,34),tol:Math.max(10,24-n*0.2),mv:null,asts:[],holes:[],dust:[],pal:(r()*PAL.length)|0,
    ring:r()<0.35,tilt:rr(-0.5,0.5),band:r()};
  let sp=Math.min(3.1,1.3+n*0.028)*rr(0.88,1.12);
  if(easy)sp=Math.min(sp,2.6);
  const sgn=n<4?(n%2?-1:1):(r()<0.5?-1:1);
  p.w=sp*sgn;return p;
}
function genPlanet(w,budget){
  const n=w.planets.length, prev=w.planets[n-1], prev2=w.planets[n-2];
  const r=w.rng,rr=(a,b)=>a+(b-a)*r();
  const need=minWin(n), tStart=performance.now(), deadline=budget?tStart+budget:0;
  let t0=w.genTries||0;
  if(w.genPend){ // finish the candidate whose window check ran out of frame budget last time
    const pd=w.genPend;if(!mwRun(pd.st,deadline))return null;
    w.genPend=null;const p=pd.p,win=pd.st.worst;
    if(win>=need||pd.tries===29){p.win=win;p.tries=pd.tries;w.genTries=0;placeDust(w,prev,p);w.planets.push(p);return p}
    t0=pd.tries+1;
  }
  for(let tries=t0;tries<30;tries++){
    if(budget&&tries>(w.genTries||0)&&performance.now()-tStart>budget){w.genTries=tries;return null}
    const easy=tries>=22;
    const p=planetProps(w,n,easy);
    const rc=p.R+p.tol, prc=prev.R+prev.tol;
    let D=easy?Math.max(prc+rc+30,190):clamp(220+n*1.6,220,330)+rr(-16,16);
    if(!easy)D=Math.min(D,2*rc/(Math.abs(prev.w)*need*1.12)+rr(-10,10));
    D=Math.max(D,prc+rc+40);
    let th=rr(-0.8,0.8);
    if(prev.x0>70)th-=0.35;if(prev.x0<-70)th+=0.35;
    if(easy)th*=0.4;
    p.x0=prev.x0+D*Math.sin(th);p.y0=prev.y0-D*Math.cos(th);
    if(Math.abs(p.x0)>150)continue;
    if(prev2&&Math.hypot(p.x0-prev2.x0,p.y0-prev2.y0)<rc+prev2.R+prev2.tol+40)continue;
    if(!easy&&n>=12&&r()<Math.min(0.5,(n-12)*0.018)){
      const ax=rr(28,58)*(r()<0.5?-1:1);
      if(Math.abs(p.x0)+Math.abs(ax)>175)p.x0-=Math.sign(p.x0)*20;
      p.mv={ax,ay:rr(-12,12),w:TAU/rr(3,5.2),ph:rr(0,TAU)};
    }
    const mx=(prev.x0+p.x0)/2,my=(prev.y0+p.y0)/2, ux=(p.x0-prev.x0)/D,uy=(p.y0-prev.y0)/D, nx=-uy,ny=ux;
    if(!easy&&n>=22&&r()<Math.min(0.75,(n-22)*0.02)){
      const cnt=(n>45&&r()<Math.min(0.6,(n-45)*0.01+0.3))?((n>90&&r()<0.4)?3:2):1;
      for(let k=0;k<cnt;k++){
        const f=rr(0.35,0.68),off=rr(14,62)*(r()<0.5?-1:1);
        p.asts.push({cx:prev.x0+(p.x0-prev.x0)*f+nx*off,cy:prev.y0+(p.y0-prev.y0)*f+ny*off,r:rr(9,15),dr:rr(5,14),dw:rr(0.6,1.4)*(r()<0.5?-1:1),ph:rr(0,TAU),rot:rr(0,TAU),seed:r()});
      }
    }
    if(!easy&&n>=35&&r()<Math.min(0.45,(n-35)*0.012+0.08)){
      const side=r()<0.5?-1:1,off=rr(85,125)*side;
      p.holes.push({x:mx+nx*off,y:my+ny*off,r:13,k:rr(0.8e6,1.5e6)});
    }
    const st=mwInit(prev,p,easy?0:need);
    if(!mwRun(st,deadline)){w.genPend={p,tries,st};w.genTries=tries;return null}
    const win=st.worst;
    if(win>=need||tries===29){p.win=win;p.tries=tries;w.genTries=0;placeDust(w,prev,p);w.planets.push(p);return p}
  }
}
function placeDust(w,src,tgt){
  const r=w.rng;if(r()>0.62)return;
  const dx=tgt.x0-src.x0,dy=tgt.y0-src.y0,D=Math.hypot(dx,dy),th=Math.atan2(dy,dx);
  const sg=src.w<0?-1:1;
  // tangent point whose tangent line passes through target centre, moving toward it
  let best=null;
  for(const s of [1,-1]){const a=th+s*Math.acos(clamp(src.R/D,-1,1));const vx=-Math.sin(a)*sg,vy=Math.cos(a)*sg;
    const lx=src.x0+src.R*Math.cos(a),ly=src.y0+src.R*Math.sin(a);if((tgt.x0-lx)*vx+(tgt.y0-ly)*vy>0)best={lx,ly}}
  if(!best)return;

  const sg=p.w<0?-1:1;astro.vx=-Math.sin(astro.a)*sg*V;astro.vy=Math.cos(astro.a)*sg*V;astro.ft=0;

function physics(){
  T+=DT;
  const p=world.planets[astro.pi];
  if(astro.st==='orbit'){
    astro.a+=p.w*DT;astro.rad+=(p.R-astro.rad)*Math.min(1,DT*9);astro.since+=DT;
    pPos(p,T,TMP);astro.x=TMP.x+astro.rad*Math.cos(astro.a);astro.y=TMP.y+astro.rad*Math.sin(astro.a);
    if(pending&&mode==='play'){pending=false;doLaunch()}
  }else if(astro.st==='fly'){
    const q=world.planets[astro.pi+1];
    const e=flyStep(astro,T,q);
    for(const d of q.dust){if(!d.taken&&(d.x-astro.x)**2+(d.y-astro.y)**2<22*22){d.taken=true;dustN++;score++;updHud();SFX.dust();burst(d.x,d.y,12,'rgba(255,226,122,1)',120,2,0.5);texts.push({x:d.x,y:d.y-10,t:'+1 星塵',life:0.8,col:'#ffe27a'})}}

    while(world.planets.length<astro.pi+3)genPlanet(world);
    if(world.planets.length<astro.pi+7)genPlanet(world,5);
    if(mode==='dying'){deathTimer+=dt;astro.face+=astro.spin*dt;if(deathTimer>1.0)gameOver()}
  }
  // trail
  if(mode!=='title'&&mode!=='paused'){trail.push(astro.x,astro.y);if(trail.length>56)trail.splice(0,2)}
  // camera
  if(world&&mode!=='paused'){
    const f=focusPoint();const k=1-Math.exp(-(astro.st==='fly'?3.2:2.6)*dt);cam.x+=(f.x-cam.x)*k;cam.y+=(f.y-cam.y)*k;
    cam.punch*=Math.exp(-dt*6);cam.shake*=Math.exp(-dt*8);cam.s=S0*(1+cam.punch);
  }

    for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.96;q.vy*=0.96}
    for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1)}

  }

}

      ctx.strokeStyle='rgba(255,226,122,.22)';ctx.setLineDash([]);ctx.beginPath();ctx.arc(x,y,(p.R+p.tol)*0.26+3,0,TAU);ctx.stroke()}
    ctx.strokeStyle=hexA(pal[3],isCur?0.55:0.25);ctx.lineWidth=isCur?1.6:1;ctx.setLineDash([6,8]);ctx.lineDashOffset=-(T*p.w*p.R);ctx.beginPath();ctx.arc(x,y,p.R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    if(p.ring){ctx.strokeStyle=hexA(pal[0],0.5);ctx.lineWidth=p.r*0.22;ctx.beginPath();ctx.ellipse(x,y,p.r*1.85,p.r*0.5,p.tilt,Math.PI,TAU);ctx.stroke()}
    const sp=planetSprite(p);ctx.drawImage(sp.c,x-sp.size/2,y-sp.size/2,sp.size,sp.size);
    if(p.ring){ctx.strokeStyle=hexA(pal[0],0.75);ctx.lineWidth=p.r*0.22;ctx.beginPath();ctx.ellipse(x,y,p.r*1.85,p.r*0.5,p.tilt,0,Math.PI);ctx.stroke();
      ctx.strokeStyle=hexA(pal[3],0.4);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y,p.r*2.1,p.r*0.6,p.tilt,0,Math.PI);ctx.stroke()}
    if(p.mv&&i>=ci){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(p.x0-p.mv.ax,p.y0-p.mv.ay);ctx.lineTo(p.x0+p.mv.ax,p.y0+p.mv.ay);ctx.stroke();ctx.setLineDash([])}
    if(i<ci-0)continue;
    for(const a of p.asts){aPos(a,T,TMP);if(TMP.y<vTop||TMP.y>vBot)continue;drawAsteroid(TMP.x,TMP.y,a)}
    for(const d of p.dust){if(d.taken)continue;const s=16+3*Math.sin(wallT*5+d.ph);ctx.save();ctx.translate(d.x,d.y);ctx.rotate(wallT*1.5+d.ph);ctx.drawImage(dustSpr,-s,-s,s*2,s*2);ctx.restore()}
  }
  // aim guide
  if(astro.st==='orbit'&&(mode==='play')){const p=P[ci];const sg=p.w<0?-1:1;const tx=-Math.sin(astro.a)*sg,ty=Math.cos(astro.a)*sg;
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.setLineDash([2,7]);ctx.beginPath();ctx.moveTo(astro.x+tx*10,astro.y+ty*10);ctx.lineTo(astro.x+tx*(launched?70:110),astro.y+ty*(launched?70:110));ctx.stroke();ctx.setLineDash([])}
  // trail
  ctx.lineCap='round';
  for(let i=2;i<trail.length;i+=2){const f=i/trail.length;ctx.strokeStyle=`rgba(140,240,255,${f*0.6})`;ctx.lineWidth=f*5;ctx.beginPath();ctx.moveTo(trail[i-2],trail[i-1]);ctx.lineTo(trail[i],trail[i+1]);ctx.stroke()}
  // rings
  for(const r of rings){const f=1-r.life/r.max;ctx.strokeStyle=`rgba(${r.col},${(1-f)*0.8})`;ctx.lineWidth=3*(1-f)+0.5;ctx.beginPath();ctx.arc(r.x,r.y,r.r*(1+f*0.6),0,TAU);ctx.stroke()}
  // astronaut
  if(mode!=='title'||true)drawAstro();
  // particles
  ctx.globalCompositeOperation='lighter';
  for(const q of parts){const f=q.life/q.max;ctx.globalAlpha=Math.min(1,f*1.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // texts
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`800 ${t.big?20:14}px -apple-system,"PingFang TC","Noto Sans TC",sans-serif`;ctx.lineWidth=3;ctx.strokeStyle='rgba(10,8,30,.7)';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x,t.y)}
  ctx.globalAlpha=1;
}
function drawAsteroid(x,y,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(a.rot+wallT*a.dw*0.7);
  const r=mulberry32((a.seed*1e6)|0);ctx.fillStyle='#6b5a52';ctx.strokeStyle='#a89080';ctx.lineWidth=1.2;ctx.beginPath();
  for(let i=0;i<9;i++){const an=i/9*TAU,rad=a.r*(0.78+r()*0.3);ctx.lineTo(Math.cos(an)*rad,Math.sin(an)*rad)}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(30,20,20,.45)';ctx.beginPath();ctx.arc(a.r*0.25,-a.r*0.2,a.r*0.25,0,TAU);ctx.arc(-a.r*0.3,a.r*0.3,a.r*0.16,0,TAU);ctx.fill();
  ctx.restore();
}
function drawAstro(){
  const x=astro.x,y=astro.y;
  ctx.drawImage(glowSprite('rgba(140,240,255,0.6)'),x-22,y-22,44,44);
  ctx.save();ctx.translate(x,y);ctx.rotate(astro.face+Math.PI/2);
  if(astro.st==='fly'){const fl=6+Math.random()*5;const g=ctx.createLinearGradient(0,6,0,6+fl);g.addColorStop(0,'rgba(255,220,140,.95)');g.addColorStop(1,'rgba(255,90,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-3,6);ctx.lineTo(3,6);ctx.lineTo(0,6+fl);ctx.fill()}
  ctx.fillStyle='#c9d2ea';ctx.fillRect(-5.5,-1,11,8);// backpack
  ctx.fillStyle='#f4f6ff';ctx.beginPath();ctx.arc(0,0,6.5,0,TAU);ctx.fill();
  const vg=ctx.createLinearGradient(-4,-5,4,0);vg.addColorStop(0,'#ffe9a8');vg.addColorStop(1,'#ff8a3c');ctx.fillStyle=vg;ctx.beginPath();ctx.ellipse(0,-1.8,4.2,2.8,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(-1.6,-2.8,0.9,0,TAU);ctx.fill();
  ctx.restore();
}

/* ---------- loop ---------- */
let last=performance.now(),raf=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;if(dt<0)dt=0;wallT+=dt;
  const pa=performance.now();update(dt);const pb=performance.now();render();const pc=performance.now();
  if(window.__perf){__perf.u.push(pb-pa);__perf.r.push(pc-pb)}
  if(world&&history){history.push({wall:now,t:T,a:astro.a,pi:astro.pi,st:astro.st,since:astro.since,mode});if(history.length>90)history.shift()}
}
function startLoop(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}

/* ---------- input & UI ---------- */
function tap(){audioInit();if(mode==='play'&&astro.st==='orbit')pending=true}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
for(const b of ['pauseBtn','muteBtn'])$(b).addEventListener('pointerdown',e=>e.stopPropagation());
function startGame(seed){document.body.classList.remove('menu');audioInit();SFX.click();el.title.classList.remove('on');el.over.classList.remove('on');el.pause.classList.remove('on');newGame(seed);mode='play'}
function pauseGame(){if(mode!=='play')return;mode='paused';el.pause.classList.add('on')}
function resumeGame(){if(mode!=='paused')return;mode='play';el.pause.classList.remove('on');last=performance.now()}
function toMenu(){document.body.classList.add('menu');newGame(12345);mode='title';el.over.classList.remove('on');el.pause.classList.remove('on');el.title.classList.add('on');$('tBest').textContent='最佳紀錄 '+best;el.hint.classList.remove('on')}
$('startBtn').onclick=()=>startGame();
$('againBtn').onclick=()=>startGame();
$('restartBtn').onclick=()=>startGame();
$('menuBtn').onclick=()=>{SFX.click();toMenu()};
$('overMenuBtn').onclick=()=>{SFX.click();toMenu()};
$('resumeBtn').onclick=()=>{SFX.click();resumeGame()};
$('pauseBtn').onclick=()=>{audioInit();if(mode==='play')pauseGame();else if(mode==='paused')resumeGame()};
el.mute.onclick=()=>{audioInit();toggleMute()};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){e.preventDefault();
    if(mode==='play')tap();else if(mode==='title')startGame();else if(mode==='over'&&performance.now()-overAt>400)startGame();else if(mode==='paused')resumeGame()}
  else if(e.code==='KeyP'||e.code==='Escape'){if(mode==='play')pauseGame();else if(mode==='paused')resumeGame()}
  else if(e.code==='KeyM'){audioInit();toggleMute()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();stopLoop()}else startLoop()});
addEventListener('resize',resize);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- test hook ---------- */
window.__game={
  start(seed){startGame(seed)},
  state(){return{mode,T,score,jumps,perfects,combo,maxCombo,dust:dustN,best,astro:{st:astro.st,pi:astro.pi,a:astro.a,since:astro.since,x:astro.x,y:astro.y},planets:world?world.planets.length:0,lastLaunchWall,lastLaunchT,lastDeath}},
  // plan a launch using only the state observed delayMs ago
  botPlan(delayMs){
    const now=performance.now();let h=null;for(let i=history.length-1;i>=0;i--){if(history[i].wall<=now-delayMs){h=history[i];break}}
    if(!h||h.mode!=='play'||h.st!=='orbit'||h.since<0.35)return null;
    const src=world.planets[h.pi],tgt=world.planets[h.pi+1];if(!tgt)return null;
    const tmin=(now-h.wall)/1000+0.03,H=TAU/Math.abs(src.w)*1.3+0.6;let rs=-1;
    // scan full windows (including ones already in progress) and aim at the centre of the first whose centre is still ahead
    for(let tau=Math.max(0,tmin-1);tau<tmin+H;tau+=0.004){const hit=simLaunch(src,tgt,h.a+src.w*tau,h.t+tau)===1;
      if(hit&&rs<0)rs=tau;if(!hit&&rs>=0){const len=tau-rs,c=rs+len/2;if(c>=tmin&&len>0.03)return{wall:h.wall+c*1000,tg:h.t+c,now,width:len,pi:h.pi};rs=-1}}
    return null;
  },
  warp(n,sc){if(sc!=null){score=sc;jumps=n;launched=true;el.hint.classList.remove('on');updHud()}while(world.planets.length<n+4)genPlanet(world);astro.pi=n;astro.st='orbit';astro.since=1;astro.rad=world.planets[n].R;const f=focusPoint();cam.x=f.x;cam.y=f.y;trail.length=0},
  genStats(N,seed){const w=newWorld(seed||1);const out=[];const t0=performance.now();for(let i=1;i<=N;i++){const t1=performance.now();const p=genPlanet(w);out.push({ms:+(performance.now()-t1).toFixed(1),tries:p.tries,n:i,win:+p.win.toFixed(3),need:+minWin(i).toFixed(3),w:+p.w.toFixed(2),D:Math.round(Math.hypot(p.x0-w.planets[i-1].x0,p.y0-w.planets[i-1].y0)),mv:!!p.mv,ast:p.asts.length,hole:p.holes.length})}return{ms:Math.round(performance.now()-t0),out}}
};

resize();setMuteIcon();$('tBest').textContent='最佳紀錄 '+best;
// title-screen backdrop: a world drifting in the background
newGame(12345);el.hint.classList.remove('on');
startLoop();
})();
</script>
