<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>夜市花燈</title>
<style>
:root{
  --ink:#fff4dc; --ink2:#cbbde8; --card:#1b173df2; --card2:#2a2458; --line:#ffffff22; --gold:#ffc94a; --red:#e63946;
  --btn:#2b2560; --btnSh:#120e2c; --chip:#ffffff14; --scrim:#0a0c2499; --tile:#241f4f; --tileSh:#100c2a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: light){
  :root{ --ink:#3b1d27; --ink2:#7d4b4f; --card:#fff6e8f4; --card2:#ffe8cc; --line:#3b1d2722; --btn:#fff3e2; --btnSh:#e0b48c;
    --chip:#3b1d2712; --scrim:#7a3b2a55; --tile:#fff3e3; --tileSh:#e6bf98; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1638;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme: light){ html,body{background:#ffd8a8} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg{flex:none}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--btnSh),0 6px 14px #0003;display:grid;place-items:center;flex:none}
.ibtn svg,.pill svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active,.pill:active,.btn:active,.lt:active,.chip:active{transform:translateY(2px)}
.hmid{flex:1;min-width:0;height:50px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--btnSh),0 6px 14px #0003;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.lvname{font-weight:800;font-size:16px;white-space:nowrap}
.diff{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);white-space:nowrap;margin-top:2px}
.diff b{color:var(--ink);font-size:12px}
.pips{display:inline-flex;gap:2px;margin-left:2px}
.pips i{width:7px;height:9px;border-radius:4px 4px 3px 3px;background:var(--chip);display:block}
.pips i.on{background:linear-gradient(#ffd46a,#e63946);box-shadow:0 0 5px #ffb34788}
.stat{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.25}
.stat b{color:var(--ink);font-size:18px}
.stat .opt{color:var(--gold);font-weight:800;font-size:13px}
@media (prefers-color-scheme: light){ .stat .opt{color:#b8641a} }
.goal{position:fixed;left:0;right:0;z-index:5;bottom:calc(var(--sab) + 76px);display:flex;justify-content:center;pointer-events:none;padding:0 10px}
.goal>div{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 12px #0003;max-width:100%;flex-wrap:wrap;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:3px;color:var(--ink2);font-weight:600;font-size:12px}
.dot{width:12px;height:14px;border-radius:50%;display:inline-block;border:1px solid #0004}
.d0{background:#5a1a1a}.d1{background:#e63946;box-shadow:0 0 6px #e63946}.d2{background:#ffc94a;box-shadow:0 0 7px #ffc94a}.dl{background:radial-gradient(#ffe48a,#ff8a3a 60%,#e63946);box-shadow:0 0 7px #ffaa44}
.goal canvas{width:22px;height:22px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.pill{height:52px;min-width:96px;padding:0 16px;border-radius:26px;background:var(--card);box-shadow:0 4px 0 var(--btnSh),0 8px 16px #0003;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:16px;position:relative}
.pill[disabled]{opacity:.45}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#3b1d27;font-size:12px;display:grid;place-items:center;padding:0 5px}
@media (orientation:landscape) and (max-height:520px){
  .hud{right:auto;width:calc(var(--sal) + 330px)}
  .goal{right:auto;width:calc(var(--sal) + 330px);bottom:auto;top:calc(var(--sat) + 66px);padding-left:calc(var(--sal) + 10px)}
  .bottom{right:auto;width:calc(var(--sal) + 330px);flex-wrap:wrap;gap:8px;padding-left:calc(var(--sal) + 10px)}
  .bottom{gap:6px}
  .pill{min-width:84px;padding:0 10px;height:48px;font-size:15px;gap:5px}
}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--scrim);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 50px #0006;padding:22px 20px;width:min(370px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} }
.btn{display:block;width:100%;min-height:50px;border-radius:17px;margin-top:11px;font-weight:800;font-size:17px;background:linear-gradient(180deg,#ffd76a,#f0a92a);color:#3b1d1f;box-shadow:0 5px 0 #b06d12,0 8px 18px #b06d1255}
.btn.red{background:linear-gradient(180deg,#ff6b6b,#e63946);color:#fff;box-shadow:0 5px 0 #9c1f2a,0 8px 18px #9c1f2a55}
.btn.sec{background:var(--btn);color:var(--ink);box-shadow:0 4px 0 var(--btnSh)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--chip)}
.stars span{display:inline-block;color:#ffffff26}
@media (prefers-color-scheme: light){ .stars span{color:#3b1d2722} }
.stars span.on{color:var(--gold);text-shadow:0 0 14px #ffb347,0 2px 0 #c77a12;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:2px 0 4px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;flex-direction:column;justify-content:space-between}
.ttl{margin-top:16vh;text-align:center}
.ttl h1{font-size:54px;margin:0;letter-spacing:8px;color:#ffe3a0;text-shadow:0 0 18px #ff9a3c,0 0 40px #e6394688,0 3px 0 #8a1d24}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:10px;font-size:15px;letter-spacing:2px}
@media (prefers-color-scheme: light){ .ttl h1{color:#c0272d;text-shadow:0 0 16px #ffd27a,0 3px 0 #fff3dc} }
.tbtns{display:flex;flex-direction:column;align-items:center;padding:0 24px calc(var(--sab) + 18px)}
.tbtns .btn{max-width:320px}
.tbtns .row2{width:100%;max-width:320px}
@media (orientation:landscape) and (max-height:520px){ .ttl{margin-top:calc(var(--sat) + 104px)}.ttl h1{font-size:40px}.ttl .sub{margin-top:4px}.tbtns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:0 10px}.tbtns .btn{max-width:200px}.tbtns .row2{max-width:410px} }
/* level select */
#select{align-items:stretch;padding:0;background:linear-gradient(180deg,#141a44,#2a1d52)}
@media (prefers-color-scheme: light){ #select{background:linear-gradient(180deg,#ffe2bd,#ffcfae)} }
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 6px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--chip);position:relative;transition:background .2s;border:1px solid var(--line)}
.sw .trk::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#e6a42a}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 24px);display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px;align-content:start;touch-action:pan-y}
.chh{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;margin:10px 2px 0;font-weight:800;font-size:16px}
.chh small{font-weight:600;font-size:12px;color:var(--ink2)}
.lt{height:78px;border-radius:16px;background:var(--tile);box-shadow:0 3px 0 var(--tileSh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:58px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;line-height:1;color:var(--chip)}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt .db i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffc94a,#e63946)}
.lt.done{box-shadow:0 3px 0 var(--tileSh),inset 0 0 0 2px #ffc94a66}
.lt.cur{box-shadow:0 3px 0 var(--tileSh),inset 0 0 0 3px #ffc94a}
.lt.lock{opacity:.55}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#1b173df2;color:#fff4dc;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s;box-shadow:0 6px 20px #0005;border:1px solid #ffc94a55}
@media (orientation:landscape) and (max-height:520px){ .toast{left:calc(var(--sal) + 170px);top:auto;bottom:calc(var(--sab) + 76px)} }
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--chip);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:84px;height:84px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.55}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.helpscroll h3{margin:12px 0 4px;font-size:15px}
.helpscroll p{font-size:14px;margin:4px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}
.chip{min-width:52px;min-height:44px;border-radius:14px;background:var(--btn);box-shadow:0 3px 0 var(--btnSh);font-weight:800;font-size:15px;padding:0 12px}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#ffd76a,#f0a92a);color:#3b1d1f;box-shadow:0 3px 0 #b06d12}
.lbl{font-size:13px;color:var(--ink2);font-weight:700;margin-top:6px}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.statg div{background:var(--chip);border-radius:14px;padding:10px 6px;font-size:12px;color:var(--ink2)}
.statg b{display:block;font-size:22px;color:var(--ink)}
.ach{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:14px}
.ach i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex:none;font-size:15px}
.ach.on i{background:linear-gradient(#ffe08a,#f0a92a);color:#3b1d1f;box-shadow:0 0 10px #ffb34788}
.ach small{display:block;color:var(--ink2);font-size:12px}
.ach:not(.on){opacity:.6}
@media (hover:hover){ .btn:hover,.pill:hover,.ibtn:hover,.lt:hover,.chip:hover{filter:brightness(1.08)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div><div class="lvname" id="hLevel">第 1 關</div><div class="diff"><span id="hDiffL">難度</span> <b id="hDiff">1</b><span class="pips" id="hPips"></span></div></div>
    <div class="stat">步數 <b id="hMoves">0</b><br>最少 <span class="opt" id="hOpt">3</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>
<div class="goal hidden" id="goal"><div id="goalIn"></div></div>
<div class="bottom hidden" id="bottom">
  <button class="pill" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span id="hintLbl">提示</span><span class="badge" id="hHints">3</span></button>
  <button class="pill" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
</div>

<div class="ov" id="title">
  <div class="ttl"><h1>夜市花燈</h1><div class="sub">點亮一盞，鄰居跟著變</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始點燈</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2"><button class="btn sec" id="tDaily">每日挑戰</button><button class="btn sec" id="tFree">自由盤</button></div>
    <div class="row2"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tStats">統計成就</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>休息一下</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續點燈</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSelect">關卡</button><button class="btn sec" id="pHome">主畫面</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">燈火通明！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>最少<b id="wOpt">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn red" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡</button></div>
  <button class="btn sec" id="wShare">分享成績</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機制</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="solveAsk"><div class="card">
  <h2>提示用完了</h2>
  <p>要觀看解答播放嗎？<br>播放解答過關最多只能拿 1 顆星。</p>
  <div class="row2"><button class="btn" id="sYes">播放解答</button><button class="btn sec" id="sNo">再想想</button></div>
</div></div>

<div class="ov hidden" id="free"><div class="card">
  <h2>自由盤</h2>
  <div class="lbl">盤面大小</div><div class="opts" id="fSize"></div>
  <div class="lbl">顏色數</div><div class="opts" id="fCol"></div>
  <div class="lbl">格子形狀</div><div class="opts" id="fShape"></div>
  <button class="btn" id="fGo">隨機生成</button>
  <button class="btn sec" id="fBack">返回</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>統計與成就</h2>
  <div class="statg" id="stGrid"></div>
  <div id="achList"></div>
  <button class="btn" id="stOk">返回</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
// Board: w x h cells, shape 'sq' | 'hex' (odd-r offset: odd rows shifted right by half a cell).
// mask: string of '1'/'0' (row-major) or null = all active. kinds: per-cell action pattern.
// Kinds: 0 plus (self + 4 orthogonal), 1 X (self + 4 diagonal), 2 long (self + orthogonal dist 1 and 2), 3 hex (self + 6).
var KIND_NAMES = ['十字', 'X 形', '加長', '六角'];
function hexNb(x, y) {
  return (y & 1)
    ? [[x - 1, y], [x + 1, y], [x, y - 1], [x + 1, y - 1], [x, y + 1], [x + 1, y + 1]]
    : [[x - 1, y], [x + 1, y], [x - 1, y - 1], [x, y - 1], [x - 1, y + 1], [x, y + 1]];
}
function kindOffsets(k, x, y) {
  if (k === 0) return [[x, y], [x, y - 1], [x + 1, y], [x, y + 1], [x - 1, y]];
  if (k === 1) return [[x, y], [x - 1, y - 1], [x + 1, y - 1], [x + 1, y + 1], [x - 1, y + 1]];

function makeGame(def, m, mode, n){

    disp: null, anim: [], hint: null, cursor: -1, pressed: -1, winAt: 0, rise: 0, auto: null, sparkT: 0 };
  g.s = g.start.slice(); g.disp = g.start.slice();

}

  showOnly(null); ['hud','goal','bottom'].forEach(function(id){ $(id).classList.remove('hidden'); });

  var c = centerOf();
  for (var i = 0; i < G.B.n; i++){ var d = Math.hypot(G.pos[i].x - c.x, G.pos[i].y - c.y) / G.pitch; G.anim[i] = { t0: clock + d * 0.05, from: G.disp[i], to: G.disp[i], spark: true, intro: true }; }
}

/* ---------- in-page random boards (daily / free) ---------- */
function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  var def = { w: w, h: h, p: p, shape: hex ? 'hex' : 'sq', kinds: hex ? '3' : '0', mask: mask };
  var B = buildBoard(def), best = null;
  for (var att = 0; att < 30; att++){
    var rnd = rng(seed + att * 101), s = new Uint8Array(B.n).fill(B.target);
    for (var i = 0; i < B.n; i++){ var k = rnd() < 0.55 ? 1 + Math.floor(rnd() * (p - 1)) : 0; for (var q = 0; q < k * (p - 1); q++) press(B, s, i); }
    var r = solve(B, s, 200000);

    best = { s: s, m: r.moves };
    if (r.moves >= Math.max(3, B.n * 0.35)) break;
  }

}

/* ---------- layout ---------- */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bgCache = null; layout();
}
function boardArea(){
  var land = W > H && H <= 520;
  if (land){
    var hb = $('bottom').getBoundingClientRect(), hh = $('hud').getBoundingClientRect();
    var left = Math.max(hb.right, hh.right) + 8;
    return { x: left, y: 10, w: W - left - 12, h: H - 20 };
  }
  var top = $('hud').getBoundingClientRect().bottom + 10, bot = $('goal').getBoundingClientRect().top - 8;
  if (bot - top < 100){ top = 60; bot = H - 120; }
  return { x: 10, y: top, w: W - 20, h: bot - top };
}
function layout(){
  if (!G) return;
  var B = G.B, ux = [], uy = [], minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, hex = B.shape === 'hex';
  for (var i = 0; i < B.n; i++){
    var c = B.cells[i], x = c % B.w, y = (c / B.w) | 0;
    var px = hex ? x + ((y & 1) ? 0.5 : 0) : x, py = hex ? y * 0.866 : y * 1.04;
    ux.push(px); uy.push(py);
    minx = Math.min(minx, px); maxx = Math.max(maxx, px); miny = Math.min(miny, py); maxy = Math.max(maxy, py);
  }
  var A = boardArea(), spanX = maxx - minx + 1, spanY = maxy - miny + 1.08;
  var pitch = Math.min(A.w / spanX, A.h / spanY, 104);
  var ox = A.x + (A.w - spanX * pitch) / 2 + pitch / 2 - minx * pitch;
  var oy = A.y + (A.h - spanY * pitch) / 2 + pitch * 0.54 - miny * pitch;
  G.pos = []; for (i = 0; i < B.n; i++) G.pos.push({ x: ox + ux[i] * pitch, y: oy + uy[i] * pitch });
  G.pitch = pitch; G.hex = hex;
  G.r = pitch * (hex ? 0.3 : 0.31);
  makeSprites(G.r);
}

/* ---------- sprites ---------- */

  red:  ['#ff9a7a', '#e63946', '#9a1c28', '#ffb000'],
  gold: ['#fff6c0', '#ffc94a', '#d98a14', '#ff7a2a'],
  lit:  ['#fff2a6', '#ff9a3c', '#d42f3c', '#ffcf40']

var GLOW = { red: 'rgba(255,70,60,', gold: 'rgba(255,200,80,', lit: 'rgba(255,160,60,' };
function lookOf(v, p){ return v === 0 ? 'off' : (p === 2 ? 'lit' : (v === 1 ? 'red' : 'gold')); }
function makeSprites(r){

  sprR = r; sprLight = LIGHT;
  var s = DPR, wpx = Math.ceil(r * 2.6 * s), hpx = Math.ceil(r * 3.6 * s);
  Object.keys(LOOK).forEach(function(k){
    var c = document.createElement('canvas'); c.width = wpx; c.height = hpx;
    var g = c.getContext('2d'); g.scale(s, s); g.translate(r * 1.3, r * 1.6);
    drawLanternShape(g, r, LOOK[k], k);
    SPR[k] = c;
  });
  Object.keys(GLOW).forEach(function(k){
    var R = r * 2.5, c = document.createElement('canvas'); c.width = c.height = Math.ceil(R * 2 * s);
    var g = c.getContext('2d'); g.scale(s, s);
    var gr = g.createRadialGradient(R, R, 0, R, R, R);
    var a = k === 'gold' ? 0.75 : 0.55;
    gr.addColorStop(0, GLOW[k] + a + ')'); gr.addColorStop(0.35, GLOW[k] + (a * 0.45) + ')'); gr.addColorStop(1, GLOW[k] + '0)');

}
function drawLanternShape(g, r, col, k){

  g.strokeStyle = k === 'off' ? 'rgba(0,0,0,0.3)' : 'rgba(120,30,10,0.28)'; g.lineWidth = Math.max(1, r * 0.045);

  g.strokeStyle = 'rgba(255,255,255,' + (k === 'off' ? 0.1 : 0.32) + ')'; g.lineWidth = Math.max(1, r * 0.06);

function rr(g, x, y, w, h, rad){ g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); }

/* ---------- background ---------- */
var bgCache = null, bgLight = null, starsBg = [];
function buildBg(){
  bgCache = document.createElement('canvas'); bgCache.width = cv.width; bgCache.height = cv.height; bgLight = LIGHT;
  var g = bgCache.getContext('2d'); g.scale(DPR, DPR);
  var sky = g.createLinearGradient(0, 0, 0, H);
  if (LIGHT){ sky.addColorStop(0, '#ffd8a8'); sky.addColorStop(0.6, '#ffc29a'); sky.addColorStop(1, '#f39a8a'); }
  else { sky.addColorStop(0, '#0f1638'); sky.addColorStop(1, '#251a4d'); }
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  var rnd = rng(77);
  if (!LIGHT){ for (var i = 0; i < 90; i++){ g.fillStyle = 'rgba(255,255,255,' + (0.15 + rnd() * 0.5) + ')'; g.fillRect(rnd() * W, rnd() * H * 0.7, 1.4, 1.4); } }
  else { g.fillStyle = 'rgba(255,240,200,0.6)'; g.beginPath(); g.arc(W * 0.8, H * 0.16, 34, 0, 7); g.fill(); }
  // far stalls silhouettes
  var base = H, x = -20;
  g.fillStyle = LIGHT ? '#8a4a5a' : '#171233';
  while (x < W + 40){
    var w = 60 + rnd() * 70, h = 50 + rnd() * 50;
    g.fillRect(x, base - h, w, h);
    g.beginPath(); g.moveTo(x - 8, base - h); g.lineTo(x + w / 2, base - h - 22 - rnd() * 12); g.lineTo(x + w + 8, base - h); g.fill();
    // string lights
    for (var k = 0; k < 7; k++){
      var lx = x + (k + 0.5) * w / 7, ly = base - h + 6 + Math.sin(k / 6 * Math.PI) * 6;
      g.fillStyle = ['#ffcf6a','#ff7a5a','#ffe9a0'][k % 3]; g.globalAlpha = 0.85;
      g.beginPath(); g.arc(lx, ly, 1.8, 0, 7); g.fill(); g.globalAlpha = 1; g.fillStyle = LIGHT ? '#8a4a5a' : '#171233';
    }
    x += w + 6 + rnd() * 20;
  }
  // haze over stalls
  var hz = g.createLinearGradient(0, H - 140, 0, H);
  hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, LIGHT ? 'rgba(120,50,60,0.25)' : 'rgba(255,120,60,0.08)');
  g.fillStyle = hz; g.fillRect(0, H - 140, W, 140);

/* ---------- drawing ---------- */
function hexPath(g, x, y, R){ g.beginPath(); for (var i = 0; i < 6; i++){ var a = Math.PI / 6 + i * Math.PI / 3; g[i ? 'lineTo' : 'moveTo'](x + R * Math.cos(a), y + R * Math.sin(a)); } g.closePath(); }
function kindIcon(g, k, x, y, s, col){
  // line glyphs: + (cross), x (X-shape), long + with end dots, hex star

  g.beginPath(); for (var i = 0; i < dirs.length; i++){ g.moveTo(x, y); g.lineTo(x + dirs[i][0] * len, y + dirs[i][1] * len); } g.stroke();

}

function drawTitleLanterns(){
  var land = W > H && H <= 520, n = Math.max(5, Math.round(W / 70)), r = Math.min(land ? 20 : 26, W / n * 0.32);

  ctx.strokeStyle = LIGHT ? '#6a3a2a' : '#c9a25a'; ctx.lineWidth = 1.5; ctx.beginPath();

    '<h3>星星</h3><p>★★★ 用最少步數；★★ 不超過最少步數 ×1.5＋2；過關至少 ★。</p>' +
    '<h3>技巧：追燈法</h3><p>從最上面一列開始，看到熄著的燈就點它正下方那盞，一列一列追下去。最後一列剩下的模式，回頭調整第一列再追一次。點擊順序不影響結果！</p>' +
    '<h3>提示</h3><p>每關 3 次提示，會標出一盞該點的燈與次數；用完可播放解答（最多 1 星）。悔棋無限次。</p>' +
    '<h3>鍵盤</h3><p>方向鍵移動游標、空白鍵點燈、Z 悔棋、R 重來、H 提示。</p>';
}
function openFree(){
  function chips(id, opts, key){
    var el = $(id); el.innerHTML = '';
    opts.forEach(function(o){ var b = document.createElement('button'); b.className = 'chip'; b.textContent = o[0]; b.setAttribute('aria-pressed', freeOpt[key] === o[1] ? 'true' : 'false');
      b.onclick = function(){ SFX.click(); freeOpt[key] = o[1]; sset('free', freeOpt); openFree(); }; el.appendChild(b); });
  }
  chips('fSize', [['3×3',3],['4×4',4],['5×5',5],['6×6',6],['7×7',7]], 'size');
  chips('fCol', [['雙色',2],['三色',3]], 'p');
  chips('fShape', [['方格',false],['六角',true]], 'hex');
  showOnly('free');
}

/* ---------- events ---------- */
var down = null;
cv.addEventListener('pointerdown', function(e){
  audio(); if (!G || status !== 'play') return;
  var i = hit(e.clientX, e.clientY); if (i < 0) return;
  down = { id: e.pointerId, i: i }; G.pressed = i; G.cursor = -1;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove', function(e){ if (!down || e.pointerId !== down.id) return; if (hit(e.clientX, e.clientY) !== down.i){ down = null; if (G) G.pressed = -1; } });
cv.addEventListener('pointerup', function(e){ if (!down || e.pointerId !== down.id) return; var i = down.i; down = null; G.pressed = -1; if (hit(e.clientX, e.clientY) === i) doPress(i); });
cv.addEventListener('pointercancel', function(){ down = null; if (G) G.pressed = -1; });
document.addEventListener('keydown', function(e){
  if (!G || status !== 'play'){ if (e.key === 'Escape' && status === 'paused' && !$('pause').classList.contains('hidden')){ status = 'play'; showOnly(null); } return; }
  var k = e.key;
  if (k === 'ArrowLeft'){ keyMove(-1, 0); e.preventDefault(); } else if (k === 'ArrowRight'){ keyMove(1, 0); e.preventDefault(); }
  else if (k === 'ArrowUp'){ keyMove(0, -1); e.preventDefault(); } else if (k === 'ArrowDown'){ keyMove(0, 1); e.preventDefault(); }
  else if (k === ' ' || k === 'Enter'){ if (G.cursor < 0) G.cursor = 0; else doPress(G.cursor); e.preventDefault(); }
  else if (k === 'z' || k === 'Z') undo(); else if (k === 'r' || k === 'R') restart(); else if (k === 'h' || k === 'H') hintPress();
  else if (k === 'Escape') openPause();
});
function openPause(){ if (!G || status !== 'play') return; status = 'paused'; $('pInfo').textContent = (G.mode === 'level' ? '第 ' + G.n + ' 關' : G.mode === 'daily' ? '每日挑戰' : '自由盤') + '・步數 ' + G.moves + '・最少 ' + G.m; showOnly('pause'); }
function on(id, f){ $(id).addEventListener('click', function(e){ audio(); SFX.click(); f(e); }); }
on('bMenu', openPause);
on('bMute', function(){ muted = !muted; sset('mute', muted); setMuteIcon(); });
on('bUndo', undo); on('bRestart', restart); on('bHint', hintPress);
on('tPlay', function(){ startLevel(nextLevel()); });
on('tSelect', openSelect);
on('tDaily', startDaily);
on('tFree', openFree);
on('tHelp', function(){ $('helpBody').innerHTML = helpHTML(); showOnly('help'); });
on('tStats', showStats);
on('stOk', function(){ showOnly(G ? null : 'title'); if (!G) status = 'title'; });
on('sBack', goTitle);
on('unlockSw', function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
$('grid').addEventListener('click', function(e){ var b = e.target.closest('.lt'); if (!b) return; audio(); var n = +b.dataset.n; if (!unlocked(n)){ toast('先通過第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; } SFX.click(); startLevel(n); });
on('pResume', function(){ status = 'play'; showOnly(null); });
on('pRestart', function(){ status = 'play'; restart(); });
on('pHelp', function(){ $('helpBody').innerHTML = helpHTML(); showOnly('help'); });
on('pSelect', openSelect);
on('pHome', goTitle);
on('hOk', function(){ if (G){ status = 'play'; showOnly(null); } else { status = 'title'; showOnly('title'); } });
on('iOk', function(){ status = 'play'; showOnly(null); toast('第 ' + G.n + ' 關・最少 ' + G.m + ' 步'); });
on('sYes', playSolution);
on('sNo', function(){ showOnly(null); });
on('fGo', startFree);
on('fBack', function(){ showOnly('title'); });
on('wNext', function(){ if (G.mode === 'level'){ if (G.n < NL) startLevel(G.n + 1); else openSelect(); } else if (G.mode === 'daily') goTitle(); else startFree(); });
on('wRetry', restart);
on('wSelect', openSelect);
on('wShare', share);
window.addEventListener('resize', function(){ resize(); });
if (mqLight && mqLight.addEventListener) mqLight.addEventListener('change', function(){ LIGHT = mqLight.matches; sprR = 0; if (G) layout(); });

/* ---------- loop ---------- */
var last = 0, raf = 0, running = true;
function frame(ts){
  raf = 0; if (!running) return;
  var dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts; clock += dt;
  if (G){
    if (status === 'auto' && G.auto && clock >= G.auto.next){
      if (G.auto.k < G.auto.seq.length){ doPress(G.auto.seq[G.auto.k++]); G.auto.next = clock + 0.33; }
    }
    if (status === 'auto' && solved(G.B, G.s) && !G.winAt){ status = 'winning'; G.winAt = clock + 0.45; }
    if (status === 'winning' && G.winAt && clock >= G.winAt && !G.rise) startRise();
    if (G.rise){
      for (var k = 0; k < 4; k++) if (G['fw' + k] && clock >= G['fw' + k]){ G['fw' + k] = 0; launch(W * (0.2 + Math.random() * 0.6)); }
      if (status === 'winning' && clock >= G.winShowAt) finishWin();
      if (status === 'won' && clock - G.winShowAt < 8 && Math.random() < dt * 0.9) launch(W * (0.15 + Math.random() * 0.7));
    }
  }
  stepFx(dt);
  draw();
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ running = false; if (raf) cancelAnimationFrame(raf); raf = 0; sset('stats', stats); if (AC && AC.state === 'running') AC.suspend().catch(function(){}); }
  else { running = true; last = 0; if (AC && AC.state === 'suspended') AC.resume().catch(function(){}); if (!raf) raf = requestAnimationFrame(frame); }
});
window.addEventListener('pagehide', function(){ sset('stats', stats); });

window.__game = {
  state: function(){ return { status: status, moves: G ? G.moves : 0, animating: !!(G && G.animating), level: G ? G.n : 0, m: G ? G.m : 0, mode: G ? G.mode : '' }; },
  cell: function(i){ return G && G.pos[i] ? { x: G.pos[i].x, y: G.pos[i].y, pitch: G.pitch } : null; },
  n: function(){ return G ? G.B.n : 0; }
};

setMuteIcon(); resize(); showOnly('title');
raf = requestAnimationFrame(frame);
})();
</script>
</body>
