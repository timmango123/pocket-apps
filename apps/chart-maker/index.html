<script>

const DEF = { type: 'bar', aspect: '4:3', title: SAMPLE_TITLE, subtitle: '', xtitle: '', ytitle: '', palette: 'default', format: 'auto', abbr: 'zh', legend: true, legendPos: 'top', labels: false, zero: true, smooth: false, merge: true, bg: 'white' };

const MAX_ABS = 1e100;

const half = s => s.replace(/[０-９．－＋（）]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
function parseNum(raw) {
  let s = half(String(raw)).trim();
  if (!s) return { empty: true };
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1).trim(); }

// 單調三次插值（Fritsch–Carlson），避免過衝
function monotonePath(pts) {
  const n = pts.length, x = pts.map(p => p[0]), y = pts.map(p => p[1]);
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = x[i + 1] - x[i]; m[i] = (y[i + 1] - y[i]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let dStr = `M${n2(x[0])},${n2(y[0])}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; dStr += `C${n2(x[i] + h)},${n2(y[i] + t[i] * h)} ${n2(x[i + 1] - h)},${n2(y[i + 1] - t[i + 1] * h)} ${n2(x[i + 1])},${n2(y[i + 1])}`; }
  return dStr;
}

/* ---------- 頁面 ---------- */
const pageDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
const aspectVal = () => (ASPECTS.find(a => a[0] === opts.aspect) || ASPECTS[1])[1];
function exportSize() { const r = aspectVal(); return r >= 1 ? [960, Math.round(960 / r)] : [Math.round(1080 * r), 1080]; }
function previewMode() { return opts.bg === 'dark' ? 'dark' : opts.bg === 'white' ? 'light' : (pageDark() ? 'dark' : 'light'); }
let lastNotes = [];
function draw() {
  const wrapEl = $('pwrap');
  const W = Math.max(280, Math.round(wrapEl.clientWidth || 340));
  let H = Math.round(W / aspectVal());
  // 預覽高度留出下載按鈕的位置（橫向手機、矮螢幕也看得到按鈕）
  const maxH = Math.max(240, innerHeight - 150);
  let w = W;
  if (H > maxH) { H = Math.round(maxH); w = Math.round(H * aspectVal()); }
  const notes = [];
  const svg = render(opts.type, data, opts, w, H, { mode: previewMode(), interactive: true, notes });
  const tmp = new DOMParser().parseFromString(svg, 'image/svg+xml').documentElement;
  const el = $('chart');
  el.setAttribute('viewBox', tmp.getAttribute('viewBox'));
  el.style.maxWidth = w + 'px'; el.style.margin = '0 auto';
  el.replaceChildren(...[...tmp.childNodes].map(c => document.importNode(c, true)));
  el.setAttribute('font-family', FONT);
  const tname = (TYPES.find(t => t[0] === opts.type) || TYPES[0])[1];
  el.setAttribute('aria-label', `${opts.title || '圖表'}（${tname}圖${data && data.labels.length ? `，${data.labels.length} 個類別 × ${data.series.length} 個系列` : '，尚無資料'}）`);
  wrapEl.classList.toggle('solid', opts.bg !== 'transparent');
  $('note').textContent = notes.join(' ');
  $('note').hidden = !notes.length;
  lastNotes = notes;
  const [ew, eh] = exportSize();
  $('export-hint').textContent = `匯出尺寸 ${ew}×${eh}，PNG 為 2 倍（${ew * 2}×${eh * 2}）。背景依「樣式設定」而非頁面主題${opts.bg === 'transparent' ? '；透明背景使用深色文字' : ''}。`;
  $('tip').hidden = true;
  $('png-out').hidden = true; $('srcbox').hidden = true;
}
function exportSVG() {
  const [w, h] = exportSize();
  return render(opts.type, data, opts, w, h, { mode: opts.bg === 'dark' ? 'dark' : 'light', interactive: false, notes: [] });
}
function reparse() {
  clearTimeout(parseTimer);
  data = parseData(text);
  const det = $('detect'), errs = $('errs');
  if (!data.labels.length) det.textContent = '尚無資料：每列一筆，貼上兩欄（標籤＋數值）或多欄表格；手機上可用空白或逗號分隔。';
  else det.innerHTML = `<span class="tag">${text === SAMPLE ? '範例' : esc(data.delim) + ' 分隔'}</span>偵測到 <b>${data.labels.length}</b> 個類別 × <b>${data.series.length}</b> 個系列${data.hasHeader ? '・首列為標題' : ''}${data.labelCol ? (data.labelNum ? '・第一欄當標籤（年份）' : '') : '・無標籤欄，以 1、2、3… 編號'}`;
  errs.hidden = !data.errors.length;
  errs.innerHTML = data.errors.slice(0, 30).map(e => `<li>${esc(e)}</li>`).join('') + (data.errors.length > 30 ? `<li>…另有 ${data.errors.length - 30} 處</li>` : '');
  hidden = new Set([...hidden].filter(k => { if (k === 'other') return true; const i = +k.slice(1); return k[0] === 's' ? i < data.series.length : i < data.labels.length; }));
  draw();
}

/* ---------- 控制項 ---------- */
$('types').innerHTML = TYPES.map(([k, name, icon]) => `<button type="button" id="type-${k}" data-v="${k}" aria-pressed="false"><svg viewBox="0 0 26 20" fill="none" stroke="currentColor" aria-hidden="true">${icon}</svg>${name}</button>`).join('');
$('aspect').innerHTML = ASPECTS.map(([k]) => `<button type="button" id="aspect-${k.replace(':', 'x')}" data-v="${k}" aria-pressed="false">${k}</button>`).join('');
$('pals').innerHTML = Object.entries(PALETTES).map(([k, p]) => `<button type="button" id="pal-${k}" data-v="${k}" aria-pressed="false">${p.name}<span class="sw" aria-hidden="true">${p.light.slice(0, 6).map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`).join('');
const FIELDS = { title: 'o-title', subtitle: 'o-subtitle', xtitle: 'o-xtitle', ytitle: 'o-ytitle' };
const SELECTS = { format: 'o-format', abbr: 'o-abbr', legendPos: 'o-legendpos', bg: 'o-bg' };
const CHECKS = { labels: 'o-labels', legend: 'o-legend', zero: 'o-zero', smooth: 'o-smooth', merge: 'o-merge' };
for (const id of Object.values(FIELDS)) { $(id).maxLength = MAX_TEXT; $(id).enterKeyHint = 'done'; $(id).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) e.target.blur(); }); }
function syncControls() {
  for (const b of $('types').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.type));
  for (const b of $('aspect').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.aspect));
  for (const b of $('pals').children) b.setAttribute('aria-pressed', String(b.dataset.v === opts.palette));
  for (const [k, id] of Object.entries(FIELDS)) if (document.activeElement !== $(id)) $(id).value = opts[k];
  for (const [k, id] of Object.entries(SELECTS)) $(id).value = opts[k];
  for (const [k, id] of Object.entries(CHECKS)) $(id).checked = opts[k];
  // 只對當前圖表類型有作用的選項才可勾選
  $('o-smooth').disabled = !['line', 'area'].includes(opts.type);
  $('o-merge').disabled = !['pie', 'donut'].includes(opts.type);
  $('o-zero').disabled = !['line', 'scatter'].includes(opts.type);
  $('o-legend').disabled = opts.type === 'scatter';
  $('o-legendpos').disabled = opts.type === 'scatter' || !opts.legend;
}
function setOpt(k, v) { opts[k] = v; saveOpts(); syncControls(); draw(); }
$('types').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { if (opts.type !== b.dataset.v) hidden.clear(); setOpt('type', b.dataset.v); } });
$('aspect').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setOpt('aspect', b.dataset.v); });
$('pals').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setOpt('palette', b.dataset.v); });
for (const [k, id] of Object.entries(FIELDS)) $(id).addEventListener('input', e => setOpt(k, e.target.value.slice(0, MAX_TEXT)));
for (const [k, id] of Object.entries(SELECTS)) $(id).addEventListener('change', e => setOpt(k, e.target.value));
for (const [k, id] of Object.entries(CHECKS)) $(id).addEventListener('change', e => setOpt(k, e.target.checked));
let parseTimer = 0;
$('data-input').addEventListener('input', e => {
  text = e.target.value; saveDataSoon();
  // 範例被改掉後，「範例」標題也跟著拿掉，免得匯出的圖還寫著範例
  if (text !== SAMPLE && opts.title === SAMPLE_TITLE) { opts.title = ''; saveOpts(); syncControls(); }
  clearTimeout(parseTimer); parseTimer = setTimeout(reparse, 150);
});
// 換資料（範例、清除）前留一份，提示上可以「復原」
function replaceData(t, title) {
  const prev = { text, title: opts.title, hidden: new Set(hidden) };
  if (prev.text === t && prev.title === title) return;
  text = t; $('data-input').value = t; opts.title = title;
  saveData(); saveOpts(); hidden.clear(); syncControls(); reparse();
  if (prev.text.trim()) toast(t ? '已換成範例資料' : '已清除資料', 6000, () => { text = prev.text; $('data-input').value = text; opts.title = prev.title; hidden = prev.hidden; saveData(); saveOpts(); syncControls(); reparse(); toast('已復原'); });
}
$('btn-sample').addEventListener('click', () => replaceData(SAMPLE, SAMPLE_TITLE));
$('btn-clear').addEventListener('click', () => { replaceData('', opts.title === SAMPLE_TITLE ? '' : opts.title); $('data-input').focus({ preventScroll: true }); });

// 提示泡泡與圖例切換。手指點不準時，取 14px 內最近的圖例或資料點
function nearest(sel, x, y, within) {
  let best = null, bd = within;
  for (const el of $('chart').querySelectorAll(sel)) {
    const b = el.getBoundingClientRect(), dx = Math.max(b.left - x, 0, x - b.right), dy = Math.max(b.top - y, 0, y - b.bottom), dist = Math.hypot(dx, dy);
    if (dist < bd) { bd = dist; best = el; }
  }
  return best;
}
$('chart').addEventListener('click', e => {
  const tipEl = $('tip');
  // 直接點到的長條／扇形／點優先；透明感應帶（rect）不擋住旁邊的圖例
  const mark = e.target.closest('[data-tip]'), solid = mark && mark.tagName !== 'rect';
  const leg = e.target.closest('[data-leg]') || (!solid && nearest('[data-leg]', e.clientX, e.clientY, 14));
  if (leg) {
    const k = leg.dataset.leg, off = !hidden.has(k);
    off ? hidden.add(k) : hidden.delete(k); draw();
    toast(`${off ? '已隱藏' : '已顯示'}「${leg.dataset.name || ''}」`, 1500);
    return;
  }
  const m = mark || nearest('[data-tip]', e.clientX, e.clientY, 14);
  if (!m) { tipEl.hidden = true; return; }
  const box = $('pwrap').getBoundingClientRect();
  tipEl.textContent = m.dataset.tip; tipEl.hidden = false;
  let x = e.clientX - box.left + 12, y = e.clientY - box.top - tipEl.offsetHeight - 10;
  if (x + tipEl.offsetWidth > box.width - 4) x = Math.max(4, e.clientX - box.left - tipEl.offsetWidth - 12);
  if (y < 4) y = Math.min(e.clientY - box.top + 14, box.height - tipEl.offsetHeight - 4);
  tipEl.style.left = x + 'px'; tipEl.style.top = Math.max(4, y) + 'px';
});
// 點圖表以外的地方就收起提示泡泡
document.addEventListener('pointerdown', e => { if (!$('pwrap').contains(e.target)) $('tip').hidden = true; });

/* ---------- 匯出 ---------- */
let toastT = 0;
function toast(t, ms = 2000, undo) {
  const el = $('toast'); el.replaceChildren(Object.assign(document.createElement('span'), { textContent: t }));
  if (undo) { const b = Object.assign(document.createElement('button'), { type: 'button', id: 'toast-undo', textContent: '復原' }); b.addEventListener('click', () => { clearTimeout(toastT); el.hidden = true; undo(); }, { once: true }); el.append(b); }
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms);
}
function svgToPngBlob(svg, w, h) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('PNG 轉換失敗')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('SVG 載入失敗')); };
    img.src = url;
  });
}
const fileBase = () => (opts.title || '圖表').replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^[-.]+|-+$/g, '').slice(0, 40) || '圖表';
let dl = null, pngURL = '';
// Claude 的下載服務可用時交給它；否則用 <a download>，PNG 另外顯示在下方，長按也能存
function anchorSave(name, blob) {
  const u = URL.createObjectURL(blob), a = Object.assign(document.createElement('a'), { href: u, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function save(filename, dataOut) {
  if (!dl) { anchorSave(filename, typeof dataOut === 'string' ? new Blob([dataOut], { type: 'image/svg+xml;charset=utf-8' }) : dataOut); toast('已下載：' + filename); return; }
  try { await dl.save({ filename, data: dataOut }); toast('已送出下載：' + filename); }
  catch (e) { const m = String(e && (e.message || e)); toast(/declin|cancel|denied/i.test(m) ? '已取消下載' : '下載失敗：' + m, 3000); }
}
// 匯出中停用按鈕，連點不會下載兩次
async function busy(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  try { await fn(); } catch (e) { if (!e || e.name !== 'AbortError') toast('匯出失敗：' + (e && e.message || e), 3000); }
  finally { btn.disabled = false; btn.removeAttribute('aria-busy'); }
}
const pngBlob = () => { const [w, h] = exportSize(); return svgToPngBlob(exportSVG(), w, h); };
$('btn-png').addEventListener('click', () => busy($('btn-png'), async () => {
  const b = await pngBlob(), name = fileBase() + '.png';
  await save(name, b);
  if (!dl) { if (pngURL) URL.revokeObjectURL(pngURL); pngURL = URL.createObjectURL(b); $('png-img').src = pngURL; $('png-out').hidden = false; }
}));
$('btn-svg').addEventListener('click', () => busy($('btn-svg'), () => save(fileBase() + '.svg', exportSVG())));
$('btn-share').addEventListener('click', () => busy($('btn-share'), async () => {
  const name = fileBase() + '.png', file = new File([await pngBlob()], name, { type: 'image/png' });
  await navigator.share({ files: [file], title: opts.title || '圖表' });
}));
$('btn-copy').addEventListener('click', async () => {
  const s = exportSVG();
  try { await navigator.clipboard.writeText(s); toast('已複製 SVG 原始碼'); }
  catch { const box = $('srcbox'); box.hidden = false; box.value = s; box.focus(); box.select(); toast('無法自動複製，已選取原始碼，請手動複製', 3000); }
});
try { $('btn-share').hidden = !(navigator.canShare && navigator.share && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); } catch { $('btn-share').hidden = true; }
(async () => {
  try { dl = await window.claude?.use?.('downloads') || null; } catch { dl = null; }
})();

/* ---------- 啟動 ---------- */
$('data-input').value = text;
syncControls();
reparse();
let rw = 0;
new ResizeObserver(() => { const w = $('pwrap').clientWidth; if (Math.abs(w - rw) > 2) { rw = w; draw(); } }).observe($('pwrap'));
// 旋轉或視窗變矮時重算預覽高度（鍵盤彈出不算：寬度不變且高度只少一點）
let rh = innerHeight;
addEventListener('resize', () => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return; if (Math.abs(innerHeight - rh) > 200 || $('pwrap').clientWidth !== rw) { rh = innerHeight; draw(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.__cm = { get opts() { return opts; }, get data() { return data; }, get hidden() { return hidden; }, parseData, parseNum, fmt, tickLabels, niceTicks, render, exportSVG };
window.__cmReady = true;
</script>
