<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "json-viewer:v1:";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(KEY + k); } catch {} }
};
/* ================= Taps =================
   One physical tap = one action. A single finger is handled by the native click (keeps clipboard / file-picker
   permissions). When another finger is down at the same time the browser sends no click at all, so the action
   runs on pointerup instead, and the click that might still follow is dropped. A click only counts if the
   finger also went down on the same control (so a long-press release never hits the sheet that just opened). */
const tapFns = new Map(); // element -> { fn, native, self }
const presses = new Map(); // pointerId -> press record
let lastUp = null; // { el, t, acted } from the latest finger lift
let LONG_MS = 500; // long press on a row
/* Ghost guard: after an action ran on a finger's pointerup, the browser may still send that finger's compatibility
   events (mousedown / focus / click) to whatever is under it now (e.g. the textarea below a sheet that just closed).
   Until the next finger goes down (at most 700 ms): cancel the touchend default, drop trusted clicks, and undo a
   focus that lands on a text field. Focus the app moves itself (userFocus) is allowed. */
let ghostUntil = 0, ghostEnd = false, allowFocus = false;
const ghostOn = () => performance.now() < ghostUntil;
function armGhost() { ghostUntil = performance.now() + 700; ghostEnd = true; }
function userFocus(el, o) { allowFocus = true; try { el.focus(o); } finally { allowFocus = false; } }
function runTap(fn, e) { allowFocus = true; try { fn(e); } finally { allowFocus = false; } }
// the touchend right after that pointerup belongs to the same finger: cancelling it stops the click and focus at the source
document.addEventListener("touchend", e => { if (ghostEnd) { ghostEnd = false; if (e.cancelable) e.preventDefault(); } }, { capture: true, passive: false });
document.addEventListener("click", e => { if (e.isTrusted && ghostOn()) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener("mousedown", e => { if (e.isTrusted && ghostOn()) e.preventDefault(); }, true);
document.addEventListener("focusin", e => {
  const t = e.target;
  if (!allowFocus && ghostOn() && t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { e.stopImmediatePropagation(); t.blur(); }
}, true);
const tapStats = { rows: 0, multi: 0 }; // for tests: row taps, and button taps run on pointerup (several fingers / slow press)
function onTap(el, fn, o = {}) {
  tapFns.set(el, { fn, native: !!o.native, self: !!o.self });
  el.addEventListener("click", e => {
    if (o.self && e.target !== el) return;
    const pt = e.pointerType, u = lastUp; lastUp = null;
    if (pt === "mouse" || pt === "") { if (!o.native) runTap(fn, e); return; } // mouse, keyboard or programmatic click
    // touch / pen (or a browser that does not say): only the click of a finger that went down and up on this control
    if (u && performance.now() - u.t < 1000) { if (u.el === el && !u.acted) { if (!o.native) runTap(fn, e); } else e.preventDefault(); return; }
    if (pt === "touch" || pt === "pen") { e.preventDefault(); return; }
    if (!o.native) runTap(fn, e);
  });
}
function tapTarget(t) {

  } else { bigText = null; src.value = t; src.hidden = false; $("bigNote").hidden = true; }
  setCompact(compact);
  lastText = null; clearTimeout(inT);
  if (!restoring) persistNow();
  if (t.length > 20 * 1048576) {
    const m = document.createElement("span"); m.className = "msg"; m.textContent = "檔案很大，可能需要數秒…"; setStatus("idle", m);
    setTimeout(() => analyze(true), 30);
  } else analyze(true);
}
/* replace the input but keep the old one for 復原 */
function replaceInput(t, sample, msg) {
  const prev = { text: curText(), sample: isSample, compact };
  loadText(t, sample);
  if (typeof msg === "function") msg = msg(); // built from the new result
  if (prev.text && prev.text !== t) toast(msg, { label: "復原", fn: () => { setCompact(prev.compact); loadText(prev.text, prev.sample); toast("已復原"); } });
  else toast(msg);
}
onTap($("sampleBtn"), () => { replaceInput(SAMPLE, true, "已載入範例資料"); setCompact(true); });
onTap($("clearBtn"), () => {
  if (!curText()) { setCompact(false); userFocus(src); return; }
  replaceInput("", false, "已清除"); setCompact(false); userFocus(src);
});
onTap($("pasteBtn"), async () => {
  try { const t = await navigator.clipboard.readText(); if (!t) { toast("剪貼簿是空的"); return; } replaceInput(t, false, "已貼上"); }
  catch { setCompact(false); userFocus(src); toast("無法讀取剪貼簿，請長按輸入框貼上"); }
});
onTap($("fileBtn"), () => $("fileIn").click());
function readFile(f) {
  if (!f) return;
  if (f.size > 20 * 1048576) toast("檔案很大，可能需要數秒");
  const r = new FileReader();
  r.onload = () => replaceInput(String(r.result), false, "已開啟 " + f.name);
  r.onerror = () => toast("讀取檔案失敗");
  r.readAsText(f);
}
$("fileIn").addEventListener("change", e => { readFile(e.target.files[0]); e.target.value = ""; });
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); src.classList.add("drop"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); src.classList.remove("drop"); }));
document.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f); });

onTap($("fmtBtn"), () => { analyze(); if (!doc) { toast("JSON 格式錯誤，請先修正"); return; } replaceInput(outputText(), isSample, "已格式化"); });
onTap($("minBtn"), () => { analyze(); if (!doc) { toast("JSON 格式錯誤，請先修正"); return; } replaceInput(serialize(0, "", $("sortChk").checked), isSample, "已壓縮"); });
onTap($("bigEdit"), () => {
  const t = bigText; if (t == null) return; bigText = null; $("bigNote").hidden = true; src.hidden = false; src.value = t; lastText = t; setCompact(false); toast("已放入編輯區");
});
onTap($("fixBtn"), () => {
  const r = repair(curText().replace(/^﻿/, ""));
  const what = Object.entries(r.kinds).map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join("、");
  replaceInput(r.text, false, () => r.fixes ? (doc ? `已修復 ${r.fixes} 處：${what}` : `已修改 ${r.fixes} 處（${what}），仍有錯誤需手動修正`) : "找不到可自動修復的地方，請依錯誤位置手動修正");
});
$("indentSel").addEventListener("change", () => { LS.set("indent", $("indentSel").value); textCache = null; renderText(); warmText(); });
$("sortChk").addEventListener("change", () => { LS.set("sortKeys", $("sortChk").checked); textCache = null; renderText(); warmText(); });
onTap($("sortChk").closest("label"), () => { const c = $("sortChk"); c.checked = !c.checked; c.dispatchEvent(new Event("change", { bubbles: true })); }, { native: true });
onTap($("expBtn"), () => setAll(0));
onTap($("colBtn"), () => setAll(1));
onTap($("copyBtn"), () => {
  if (!doc) { if (curText()) copyText(curText(), "已複製原始輸入"); else toast("沒有內容可以複製"); return; }
  copyText(textCache == null && curText().length > HEAVY ? outputText : outputText(), "已複製格式化後的 JSON");
});

/* downloads: the host's download capability when there is one, otherwise a plain a[download] of a Blob */
let DL = null;
(async () => { try { DL = await window.claude?.use?.("downloads"); } catch { DL = null; } })();
async function download() {
  if (!doc) { toast("JSON 格式錯誤，無法下載；可先用「複製」保存原始輸入"); return; }
  const filename = jsonl ? "data.json" : "formatted.json";
  if (textCache == null && curText().length > HEAVY) { toast("處理中…", null, 60000); await nextPaint(); }
  const data = outputText();
  if (DL) {
    try { await DL.save({ filename, data }); toast("已送出下載"); return; }
    catch (e) { if (/declin|cancel|denied|abort/i.test(String(e && (e.message || e.name)))) { toast("已取消下載"); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast("已下載 " + filename);
  } catch { toast("下載失敗，請改用複製"); }
}
onTap($("dlBtn"), download);

/* init */
const ind = LS.get("indent", "2"); if (["2", "4", "tab"].includes(ind)) $("indentSel").value = ind;
$("sortChk").checked = !!LS.get("sortKeys", false);
function ready() { window.__jvReady = true; }
function restoreSmall() {
  const last = LS.get("last", null);
  if (typeof last === "string" && last.trim()) loadText(last, false, true); else loadText(SAMPLE, true);
  setCompact(!!doc);
}
window.__jv = { load: loadText, parseJSON, repair, lineCol, serialize: (t, ind, sort) => { const save = doc; doc = parseJSON(t); const r = serialize(0, ind, sort); doc = save; return r; }, ParseError, get doc() { return doc; }, jsonPath: id => jsonPath(id), persistNow, tapStats, textReady: () => textCache != null, setLongPress: ms => { LONG_MS = ms; } };
const pend = LS.get("bigPending", null); LS.del("bigPending");
let pendDone = false; // the write may have finished even though the page closed before hearing so
const warnPending = () => { if (pend && !pendDone) setSaveWarn(`上次內容未存完（${fmtKB(pend.bytes || 0)}，儲存完成前頁面就關閉了），請重新開啟檔案`); };
const bigMeta = LS.get("bigLast", null);
if (bigMeta || pend) {
  const m = document.createElement("span"); m.className = "msg"; m.textContent = "正在還原上次的內容…"; setStatus("idle", m);
  idbDo("readonly", s => s.get("last")).then(v => v instanceof Blob ? v.text() : v).then(t => {
    const isNew = !!pend && typeof t === "string" && t.length === pend.chars;
    if (isNew) { pendDone = true; LS.set("bigLast", { chars: t.length, bytes: pend.bytes, at: pend.at }); LS.del("last"); }
    if (typeof t === "string" && t.trim() && (isNew || bigMeta)) { loadText(t, false, true); setCompact(!!doc); }
    else if (!bigMeta) restoreSmall();
    else { restoreSmall(); toast("找不到上次的大型內容"); }
  }, () => { restoreSmall(); toast("無法讀取上次的大型內容"); }).then(warnPending, warnPending).then(ready, ready);
} else { restoreSmall(); warnPending(); ready(); }
})();
</script>
