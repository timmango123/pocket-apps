<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "json-viewer:v1:";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(KEY + k); } catch {} }
};
let toastT;
function toast(msg) {
  const h = $("toastHost"); h.innerHTML = ""; const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, 2000);
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || "已複製"); return; } catch {}
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;height:1px";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    if (ok) { toast(okMsg || "已複製"); return; }
  } catch {}
  toast("無法自動複製，請長按文字手動複製");
}

/* ================= Parser: iterative, precise positions, keeps raw numbers ================= */
const MAXSAFE = Number.MAX_SAFE_INTEGER;
function ParseError(msg, pos) { this.msg = msg; this.pos = pos; }
function parseJSON(src) {
  const n = src.length; let i = 0;
  const T = [], K = [], V = [], P = [], D = [], E = [], C = [], BIG = [];  // type,key,value,parent,depth,end,childCount,big
  const stack = []; // node ids of open containers
  const starts = [];
  const fail = (m, p) => { throw new ParseError(m, p == null ? i : p); };
  const ws = () => { while (i < n) { const c = src.charCodeAt(i); if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break; } };
  let pendingKey = null;
  const add = (type, value, big) => {
    const id = T.length, par = stack.length ? stack[stack.length - 1] : -1;
    T.push(type); V.push(value); P.push(par); D.push(stack.length); E.push(id + 1); C.push(0); BIG.push(big ? 1 : 0);
    if (par >= 0) { K.push(T[par] === "array" ? C[par] : pendingKey); C[par]++; } else K.push(null);
    return id;
  };
  const readString = () => {
    const start = i; i++; let out = ""; let seg = i;
    for (;;) {
      if (i >= n) fail("字串沒有結尾的雙引號（未閉合字串）", start);
      const c = src.charCodeAt(i);
      if (c === 34) { out += src.slice(seg, i); i++; return out; }
      if (c === 92) {
        out += src.slice(seg, i); const e = src[i + 1];
        switch (e) {
          case '"': out += '"'; break; case "\\": out += "\\"; break; case "/": out += "/"; break;
          case "b": out += "\b"; break; case "f": out += "\f"; break; case "n": out += "\n"; break;
          case "r": out += "\r"; break; case "t": out += "\t"; break;
          case "u": { const h = src.slice(i + 2, i + 6); if (!/^[0-9a-fA-F]{4}$/.test(h)) fail("非法的 \\u 跳脫，需要 4 位十六進位數字", i); out += String.fromCharCode(parseInt(h, 16)); i += 4; break; }
          default: if (i + 1 >= n) fail("字串沒有結尾的雙引號（未閉合字串）", start); fail("非法跳脫序列 \\" + e + "（只允許 \\\" \\\\ \\/ \\b \\f \\n \\r \\t \\u）", i);
        }
        i += 2; seg = i; continue;
      }
      if (c < 32) { if (c === 10 || c === 13) fail("字串在換行前沒有閉合（未閉合字串；字串中的換行要寫成 \\n）", start); fail("字串中不可有未跳脫的控制字元", i); }
      i++;
    }
  };
  const NUM = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
  const readValue = () => {
    if (i >= n) fail("內容意外結束，這裡應該要有一個值");
    const c = src[i];
    if (c === "{" || c === "[") {
      const id = add(c === "{" ? "object" : "array", null);
      stack.push(id); starts.push(i); i++; ws();
      if (src[i] === (c === "{" ? "}" : "]")) { i++; stack.pop(); starts.pop(); return 1; }
      return c === "{" ? 2 : 3; // 2: expect key, 3: expect value
    }
    if (c === '"') { const s = readString(); add("string", s); return 1; }
    if (c === "-" || (c >= "0" && c <= "9")) {
      NUM.lastIndex = i; const m = NUM.exec(src);
      if (!m) fail(c === "-" ? "負號後面需要數字" : "數字格式不正確");
      const raw = m[0]; const nx = src[i + raw.length];
      if (nx >= "0" && nx <= "9") fail("數字不可有前導零", i);
      if (nx === "." || nx === "e" || nx === "E") fail("數字格式不正確（小數點或指數後需要數字）", i + raw.length);
      const intLike = !/[.eE]/.test(raw);
      const big = intLike ? Math.abs(Number(raw)) > MAXSAFE : (raw.replace(/^-|[eE].*$|\./g, "").replace(/^0+/, "").length > 17);
      add("number", raw, big); i += raw.length; return 1;
    }
    if (src.startsWith("true", i)) { add("boolean", "true"); i += 4; return 1; }
    if (src.startsWith("false", i)) { add("boolean", "false"); i += 5; return 1; }
    if (src.startsWith("null", i)) { add("null", "null"); i += 4; return 1; }
    if (c === "'") fail("字串必須用雙引號，不能用單引號");
    if (c === "}" || c === "]") fail("這裡缺少值，卻遇到「" + c + "」");

    if (hits.length && jump) { hitPos = 0; reveal(hits[0]); }
  }
  updateCount(); renderTree(false);
}
function updateCount() {
  $("cnt").textContent = hits.length ? (hitPos + 1) + "/" + hits.length : "0/0";
  $("prevBtn").disabled = $("nextBtn").disabled = !hits.length;
}
function reveal(id) {
  let changed = false;
  for (let p = doc.P[id]; p >= 0; p = doc.P[p]) if (collapsed[p]) { collapsed[p] = 0; changed = true; }
  if (changed) computeVis();
  if ($("vp").hidden) setTab(true);
  let lo = 0, hi = vis.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (vis[m] < id) lo = m + 1; else hi = m; }
  vp.scrollTop = Math.max(0, lo * RH - vp.clientHeight / 2 + RH / 2);
  renderTree(false); updateCount();
}
function step(d) { if (!hits.length) return; hitPos = (hitPos + d + hits.length) % hits.length; reveal(hits[hitPos]); }
let qT; $("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => runSearch(true), 200); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); step(e.shiftKey ? -1 : 1); } });
$("nextBtn").addEventListener("click", () => step(1));
$("prevBtn").addEventListener("click", () => step(-1));

/* ================= Input wiring ================= */
let inT;
function schedule() {
  clearTimeout(inT);
  const big = curText().length > 20 * 1048576;
  inT = setTimeout(() => analyze(), big ? 50 : 300);
}
src.addEventListener("input", () => { if (isSample) { isSample = false; $("sampleChip").hidden = true; } schedule(); });
function loadText(t, sample) {
  isSample = !!sample; $("sampleChip").hidden = !sample;
  if (t.length > BIG_EDIT) {
    bigText = t; src.value = ""; src.hidden = true; $("bigNote").hidden = false;
    $("bigMsg").textContent = `大型內容（${fmtKB(new Blob([t]).size)}）為保持流暢，不放入編輯區；可直接瀏覽、搜尋、複製與下載。`;
  } else { bigText = null; src.value = t; src.hidden = false; $("bigNote").hidden = true; }
  lastText = null;
  if (t.length > 20 * 1048576) {
    const m = document.createElement("span"); m.className = "msg"; m.textContent = "檔案很大，可能需要數秒…"; setStatus("idle", m);
    setTimeout(() => analyze(true), 30);
  } else analyze(true);
}
$("sampleBtn").addEventListener("click", () => { loadText(SAMPLE, true); toast("已載入範例資料"); });
$("clearBtn").addEventListener("click", () => { loadText(""); LS.del("last"); src.focus(); });
$("pasteBtn").addEventListener("click", async () => {
  try { const t = await navigator.clipboard.readText(); if (!t) { toast("剪貼簿是空的"); return; } loadText(t); toast("已貼上"); }
  catch { src.focus(); toast("無法讀取剪貼簿，請長按輸入框貼上"); }
});
$("fileBtn").addEventListener("click", () => $("fileIn").click());
function readFile(f) {
  if (!f) return;
  if (f.size > 20 * 1048576) toast("檔案很大，可能需要數秒");
  const r = new FileReader();
  r.onload = () => { loadText(String(r.result)); toast("已開啟 " + f.name); };
  r.onerror = () => toast("讀取檔案失敗");
  r.readAsText(f);
}
$("fileIn").addEventListener("change", e => { readFile(e.target.files[0]); e.target.value = ""; });
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); src.classList.add("drop"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); src.classList.remove("drop"); }));
document.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f); });

$("fmtBtn").addEventListener("click", () => { analyze(); if (!doc) { toast("JSON 格式錯誤，請先修正"); return; } loadText(outputText(), isSample); toast("已格式化"); });
$("minBtn").addEventListener("click", () => { analyze(); if (!doc) { toast("JSON 格式錯誤，請先修正"); return; } loadText(serialize(0, "", $("sortChk").checked), isSample); toast("已壓縮"); });
$("bigEdit").addEventListener("click", () => {
  const t = bigText; if (t == null) return; bigText = null; $("bigNote").hidden = true; src.hidden = false; src.value = t; lastText = t; toast("已放入編輯區");
});
$("fixBtn").addEventListener("click", () => {
  const r = repair(curText().replace(/^﻿/, ""));
  loadText(r.text);
  toast(doc ? `已修復 ${r.fixes} 處` : `已修改 ${r.fixes} 處，仍有錯誤需手動修正`);
});
$("indentSel").addEventListener("change", () => { LS.set("indent", $("indentSel").value); textCache = null; renderText(); });
$("sortChk").addEventListener("change", () => { LS.set("sortKeys", $("sortChk").checked); textCache = null; renderText(); });
$("expBtn").addEventListener("click", () => setAll(0));
$("colBtn").addEventListener("click", () => setAll(1));
$("copyBtn").addEventListener("click", () => {
  if (!doc) { if (curText()) copyText(curText(), "已複製原始輸入"); else toast("沒有內容可以複製"); return; }
  copyText(outputText(), "已複製格式化後的 JSON");
});

/* downloads */
let DL = null;
(async () => { try { DL = await window.claude?.use?.("downloads"); } catch { DL = null; } $("dlBtn").hidden = !DL; document.querySelector(".dock .in").style.gridTemplateColumns = DL ? "repeat(4,1fr)" : "repeat(3,1fr)"; })();
document.querySelector(".dock .in").style.gridTemplateColumns = "repeat(3,1fr)";
$("dlBtn").addEventListener("click", async () => {
  if (!DL) return;
  if (!doc) { toast("JSON 格式錯誤，無法下載"); return; }
  try { await DL.save({ filename: jsonl ? "data.json" : "formatted.json", data: outputText() }); toast("已送出下載"); }
  catch (e) { if (!/declin|cancel|denied|abort/i.test(String(e && (e.message || e.name)))) toast("下載失敗，請改用複製"); }
});

/* init */
const ind = LS.get("indent", "2"); if (["2", "4", "tab"].includes(ind)) $("indentSel").value = ind;
$("sortChk").checked = !!LS.get("sortKeys", false);
const last = LS.get("last", null);
if (typeof last === "string" && last.trim()) loadText(last); else loadText(SAMPLE, true);
window.__jv = { load: loadText, parseJSON, repair, lineCol, serialize: (t, ind, sort) => { const save = doc; doc = parseJSON(t); const r = serialize(0, ind, sort); doc = save; return r; }, ParseError, get doc() { return doc; }, jsonPath: id => jsonPath(id) };
window.__jvReady = true;
})();
</script>
