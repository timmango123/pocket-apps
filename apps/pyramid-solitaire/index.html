<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>金字塔接龍</title>
<style>
:root{
  --ink:#3a2433; --ink2:#7a5a5e; --panel:#fff8e8e6; --panel2:#fff3dc; --line:#e9cf9b; --accent:#e8892f; --accent2:#c4553b; --gold:#ffc23a;
  --ovbg:#5a2a3a66; --btn1:#f7b04f; --btn2:#e6822f; --btnsh:#b85d1f; --sec:#fff1d6; --secsh:#e2c48e; --tile:#fffaf0; --tilesh:#e6cfa0; --lock:#efe1c6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="dark"]{
  --ink:#f3e6cc; --ink2:#b9a9c9; --panel:#2a2246e6; --panel2:#332a55; --line:#5a4b82; --ovbg:#0d0a1a99;
  --sec:#3a3060; --secsh:#241d40; --tile:#2f2750; --tilesh:#1d1736; --lock:#241e3e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9654e;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
:root[data-theme="dark"] body{background:#1a1530}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--panel);box-shadow:0 3px 10px #3a1a2a33;display:grid;place-items:center;flex:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;background:var(--panel);border-radius:14px;height:44px;box-shadow:0 3px 10px #3a1a2a33;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.pyr{width:15px;height:12px;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(to top,var(--accent) var(--f),#c9b28a55 var(--f));flex:none}
.stat{font-size:11px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.25}
.stat b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:50px;min-width:96px;padding:0 14px;border-radius:25px;background:var(--panel);box-shadow:0 4px 14px #3a1a2a33;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.45}
.pill.busy{opacity:.7}
@media (orientation:landscape) and (max-height:520px){
  .bottom{left:auto;top:calc(var(--sat) + 60px);bottom:auto;flex-direction:column;padding:0 calc(var(--sar) + 10px) 0 0;gap:8px}
  .pill{min-width:104px;height:46px}
}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ovbg);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s ease}
@media (max-height:600px){.ov{align-items:flex-start;overflow-y:auto}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--panel2);border-radius:24px;box-shadow:0 18px 50px #2a0f1f55,0 0 0 2px var(--line) inset;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;min-height:50px;border-radius:16px;margin-top:11px;font-weight:800;font-size:17px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 5px 0 var(--btnsh),0 8px 18px #b85d1f44;text-shadow:0 1px 0 #a24e1a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh);text-shadow:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:42px;letter-spacing:6px;margin:4px 0;color:#d8c7a6}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #d4891a;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:8px 6px;font-size:14px;color:var(--ink2);text-align:left}
.res b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.res .tot{font-size:18px;color:var(--ink);font-weight:800;border-top:2px dashed var(--line);padding-top:5px}
/* title */
#title{background:linear-gradient(180deg,#00000000 30%,#2a0f1f55);-webkit-backdrop-filter:none;backdrop-filter:none;align-items:stretch}
:root[data-theme="dark"] #title{background:linear-gradient(180deg,#00000000 30%,#0d0a1aaa)}
.tw{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:100%;min-height:100%}
.ttl{margin-top:5vh;text-align:center}
.ttl h1{font-size:50px;margin:0;letter-spacing:8px;color:#fff6df;text-shadow:0 3px 0 #b8562e,0 8px 26px #5a1a2a88}
.ttl .sub{color:#fff1d8;font-weight:700;margin-top:8px;font-size:15px;text-shadow:0 1px 3px #5a1a2a99}
.tbtns{display:flex;flex-direction:column;align-items:center;width:100%;max-width:320px;padding-bottom:8px}
.tbtns .row2{width:100%}
@media (orientation:landscape) and (max-height:520px){.ttl{margin-top:2vh}.ttl h1{font-size:38px}.tbtns{max-width:520px}.tbtns .btn{min-height:46px;margin-top:8px}}
/* level select */
#select{align-items:stretch;padding:0;background:var(--panel2);-webkit-backdrop-filter:none;backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:#cdb894;position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;align-content:start;touch-action:pan-y}
.sec-h{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--accent2);padding:10px 2px 2px;display:flex;align-items:center;gap:6px}
:root[data-theme="dark"] .sec-h{color:#f0a868}
.lt{height:76px;border-radius:14px;background:var(--tile);box-shadow:0 3px 0 var(--tilesh),0 6px 12px #3a1a2a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px;min-height:56px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:#d8c7a6;line-height:1}
.lt .st .on{color:var(--gold)}
.lt .dl{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2);line-height:1}
.lt.done{background:linear-gradient(180deg,var(--tile),#ffe9c2)}
:root[data-theme="dark"] .lt.done{background:linear-gradient(180deg,var(--tile),#4a3a5a)}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--lock);box-shadow:0 3px 0 var(--tilesh);color:#a8957a}
.lt.lock svg{width:16px;height:16px;stroke:#a8957a;fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:30;background:#3a2433ee;color:#fff;padding:9px 15px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.scroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.scroll p{font-size:14px}
.scroll h3{font-size:15px;margin:12px 0 4px;color:var(--ink)}
.pairs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.pairs span{background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:4px 7px;font-size:13px;font-weight:700;white-space:nowrap}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px dashed var(--line);font-size:15px;font-weight:600;text-align:left}
.seg{display:flex;background:var(--sec);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:40px;min-width:44px;padding:0 9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ach{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ach i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sec);flex:none;font-size:16px;color:#bba98a}
.ach.on i{background:linear-gradient(180deg,#ffd76a,#e8892f);color:#fff}
.ach div{font-size:13px;color:var(--ink2);line-height:1.35}
.ach b{color:var(--ink);font-size:14px;display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kv div{background:var(--panel);border-radius:14px;padding:8px 4px;font-size:12px;color:var(--ink2);text-align:center}
.kv b{display:block;font-size:20px;color:var(--ink)}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff"><i class="pyr" id="hPyr" style="--f:10%"></i>難度 <span id="hDiff">1.0</span></div>
    </div>
    <div class="stat">翻回 <b id="hRec">2</b><br>分數 <b id="hScore">0</b></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="pill" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span id="hintTxt">提示</span></button>
  <button class="pill" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
</div>

<div class="ov" id="title"><div class="tw">
  <div class="ttl">
    <h1>金字塔接龍</h1>
    <div class="sub">兩張湊十三・拆光黃昏沙丘上的金字塔</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <button class="btn sec" id="tDaily">每日金字塔</button>
    <div class="row2"><button class="btn sec" id="tStats">統計成就</button><button class="btn sec" id="tSet">設定</button></div>
    <button class="btn sec" id="tHelp">玩法說明</button>
  </div>
</div></div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSet">設定</button><button class="btn sec" id="pSelect">選關</button></div>
  <button class="btn sec" id="pHome">回到首頁</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">金字塔清空！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res" id="wRes"></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">選關</button></div>
  <button class="btn sec" id="wShare">分享成績</button>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2>沒有可配對的牌了</h2>
  <p id="fMsg">牌庫翻回次數用完，金字塔還剩幾張。<br>悔棋回去換個順序試試！</p>
  <div class="row2"><button class="btn" id="fUndo">悔棋</button><button class="btn sec" id="fRestart">重來</button></div>
  <button class="btn sec" id="fSelect">選關</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新規則</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div id="setBody"></div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>統計與成就</h2>
  <div class="scroll" id="statsBody"></div>
  <button class="btn" id="stOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<script id="main">
/*CORE-START*/
// SOLVER-BEGIN — shared rules + DFS solver (also extracted by demo/gen.js and demo/verify.js)
var NP = 28, NS = 24, FULL = (1 << 28) - 1 >>> 0;
var COVER = [], ROWOF = [], COLOF = [], BELOW = [];
(function () {
  for (var r = 0; r < 7; r++) for (var i = 0; i <= r; i++) {
    var p = r * (r + 1) / 2 + i; ROWOF[p] = r; COLOF[p] = i;
    COVER[p] = r < 6 ? [(r + 1) * (r + 2) / 2 + i, (r + 1) * (r + 2) / 2 + i + 1] : null;
  }
  // BELOW[p]: mask of all cards that (transitively) cover p — they must go before p is free
  for (var q = 27; q >= 0; q--) {
    var m = 0;
    if (COVER[q]) { var a = COVER[q][0], b = COVER[q][1]; m = (1 << a) | (1 << b) | BELOW[a] | BELOW[b]; }
    BELOW[q] = m >>> 0;
  }
})();
function rankOf(c) { return c % 13 + 1; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function dealFromSeed(seed) {
  var d = [], i; for (i = 0; i < 52; i++) d.push(i);
  var rnd = mulberry32(seed);
  for (i = 51; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = d[i]; d[i] = d[j]; d[j] = t; }
  var cards = d, rk = d.map(rankOf);
  return { seed: seed, cards: cards, rk: rk }; // loc 0..27 pyramid, 28..51 stock (28 = first card drawn)
}
// state: pm = removed pyramid mask, um = used stock mask, p = stock pointer, r = recycles used
function initState() { return { pm: 0, um: 0, p: 0, r: 0 }; }
function isRemoved(s, pos) { return ((s.pm >>> pos) & 1) === 1; }
function isFree(s, pos) {
  if ((s.pm >>> pos) & 1) return false;
  var c = COVER[pos]; if (!c) return true;
  return ((s.pm >>> c[0]) & 1) === 1 && ((s.pm >>> c[1]) & 1) === 1;
}
// waste = unused stock indices < p, in order; returns [drawnIdx, wasteTopIdx] (-1 when absent)
function wasteTops(s) {
  var a = -1, b = -1;
  for (var i = s.p - 1; i >= 0; i--) if (!((s.um >>> i) & 1)) { if (a < 0) a = i; else { b = i; break; } }
  return [a, b];
}
function wasteList(s) { var w = []; for (var i = 0; i < s.p; i++) if (!((s.um >>> i) & 1)) w.push(i); return w; }
function stockLeft(s) { var n = 0; for (var i = s.p; i < NS; i++) if (!((s.um >>> i) & 1)) n++; return n; }
function nextStock(s) { for (var i = s.p; i < NS; i++) if (!((s.um >>> i) & 1)) return i; return -1; }
function unusedCount(s) { var n = 0; for (var i = 0; i < NS; i++) if (!((s.um >>> i) & 1)) n++; return n; }
// available locations (pyramid pos 0..27, or 28+stockIdx for drawn card / waste top)
function availLocs(s) {

    $('iTitle').textContent = INTROS[key][0]; $('iBody').innerHTML = INTROS[key][1]; G.status = 'intro'; showOv('intro');
  }
}
$('iOk').onclick = function () { audio(); SFX.click(); hideOv('intro'); G.status = 'play'; G.t0 = performance.now(); };
function nextPlayable() { for (var n = 1; n <= 100; n++) if (!isDone(n)) return n; return progress.last || 100; }
function buildGrid() {
  var g = $('grid'), h = '', tiers = [[1, '第 1–30 關・牌庫可翻回 2 次'], [31, '第 31–70 關・牌庫可翻回 1 次'], [71, '第 71–100 關・牌庫不可翻回']];
  var cur = nextPlayable(), doneN = 0, starN = 0;
  for (var n = 1; n <= 100; n++) {
    tiers.forEach(function (t) { if (t[0] === n) h += '<div class="sec-h">' + t[1] + '</div>'; });
    var d = progress.done[n], df = diffOf(LEVELS[n - 1][2]);
    if (d) { doneN++; starN += d.stars; }
    if (!unlocked(n)) { h += '<button class="lt lock" data-n="' + n + '" aria-label="第 ' + n + ' 關（未解鎖）"><span class="n">' + n + '</span><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>'; continue; }
    var st = ''; for (var i = 0; i < 3; i++) st += '<span class="' + (d && i < d.stars ? 'on' : '') + '">★</span>';
    h += '<button class="lt' + (d ? ' done' : '') + (n === cur ? ' cur' : '') + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + df.toFixed(1) + '"><span class="n">' + n + '</span><span class="st">' + st + '</span><span class="dl"><i class="pyr" style="--f:' + Math.round(df * 10) + '%"></i>' + df.toFixed(1) + '</span></button>';
  }
  g.innerHTML = h;
  $('selSum').textContent = '已完成 ' + doneN + ' / 100 關・共 ' + starN + ' 顆星・難度 1.0–10.0';
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
$('grid').addEventListener('click', function (e) {
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.dataset.n; if (!unlocked(n)) { SFX.bad(); toast('先完成第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); enterLevel(n);
});
$('unlockSw').addEventListener('click', function () { audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
function openSelect() { hideAll(); hideGame(); buildGrid(); showOv('select'); var c = document.querySelector('.lt.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
function goTitle() { hideAll(); hideGame(); startLevel(nextPlayable(), true); showOv('title'); }
function openPause() {
  if (G.status !== 'play') return; G.status = 'paused'; G.pausedAt = performance.now();
  var li = G.n === 'daily' ? '每日金字塔' : '第 ' + G.n + ' 關・難度 ' + diffOf(levelInfo(G.n).S).toFixed(1);
  $('pInfo').textContent = li + '・' + (G.maxR === 0 ? '不可翻回' : '可翻回 ' + G.maxR + ' 次'); showOv('pause');
}
function resume() { hideOv('pause'); if (G.pausedAt) { G.t0 += performance.now() - G.pausedAt; G.pausedAt = 0; } G.status = 'play'; }
$('bPause').onclick = function () { audio(); SFX.click(); openPause(); };
$('pResume').onclick = function () { SFX.click(); resume(); };
$('pRestart').onclick = function () { SFX.click(); hideAll(); startLevel(G.n); };
$('pSelect').onclick = function () { SFX.click(); openSelect(); };
$('pHome').onclick = function () { SFX.click(); goTitle(); };
$('pHelp').onclick = function () { SFX.click(); openHelp(); };
$('pSet').onclick = function () { SFX.click(); openSettings(); };
$('bMute').onclick = function () { settings.sound = !settings.sound; saveSettings(); setMuteIcon(); audio(); SFX.click(); };
$('bUndo').onclick = function () { audio(); undo(); };
$('bHint').onclick = function () { hint(); };
$('bRestart').onclick = function () { audio(); SFX.click(); if (G.status === 'play' || G.status === 'lost') { hideAll(); startLevel(G.n); } };
$('wNext').onclick = function () { SFX.click(); if (G.n === 'daily' || G.n === 100) goTitle(); else enterLevel(G.n + 1); };
$('wRetry').onclick = function () { SFX.click(); hideAll(); startLevel(G.n); };
$('wSelect').onclick = function () { SFX.click(); openSelect(); };
$('wShare').onclick = function () {
  var t = '金字塔接龍 ' + (G.n === 'daily' ? '每日金字塔 ' + todayKey() : '第 ' + G.n + ' 關') + ' 清空！' + '★'.repeat(starsFor()) + ' 分數 ' + G.score + '，用時 ' + fmtTime(G.elapsed);
  if (navigator.share) navigator.share({ title: '金字塔接龍', text: t }).catch(function () {});
  else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('成績已複製'); }, function () { toast(t); });
  else toast(t);
};
$('fUndo').onclick = function () { undo(); };
$('fRestart').onclick = function () { SFX.click(); hideAll(); startLevel(G.n); };
$('fSelect').onclick = function () { SFX.click(); openSelect(); };
$('tPlay').onclick = function () { audio(); SFX.click(); enterLevel(nextPlayable()); };
$('tSelect').onclick = function () { audio(); SFX.click(); openSelect(); };
$('tDaily').onclick = function () { audio(); SFX.click(); playDaily(); };
$('tHelp').onclick = function () { audio(); SFX.click(); openHelp(); };
$('tStats').onclick = function () { audio(); SFX.click(); openStats(); };
$('tSet').onclick = function () { audio(); SFX.click(); openSettings(); };
$('sBack').onclick = function () { SFX.click(); goTitle(); };
var helpFrom = null;
function openHelp() {
  $('helpBody').innerHTML = '<p>28 張牌排成七層金字塔，下方是 24 張牌庫。</p><h3>怎麼移除</h3><p>點選兩張<b>點數相加為 13</b> 的牌，它們會化成沙粒消失；<b>K = 13</b>，點一下就能單獨移除。也可以把一張牌拖到另一張上配對。</p><div class="pairs"><span>A+Q</span><span>2+J</span><span>3+10</span><span>4+9</span><span>5+8</span><span>6+7</span><span>K</span></div><h3>哪些牌能用</h3><p>發著金光的牌：沒被下一層兩張牌壓住的金字塔牌（只壓一邊也不行）、<b>翻出</b>的那張與<b>廢牌堆頂</b>（兩者也能互配）。</p><h3>牌庫</h3><p>點牌庫翻一張。翻完後依關卡可翻回：1–30 關 2 次、31–70 關 1 次、71–100 關不可翻回。</p><h3>勝負與計分</h3><p>金字塔拆光即過關。每對 +5、K +5、清空第 n 層 +25×n、清塔 +500、剩餘牌庫每張 +10。沒牌可配又不能翻回就失敗，可悔棋或重來。</p><p>★ 過關 ★★ 不用提示 ★★★ 不悔棋也不用提示。</p><h3>桌機鍵盤</h3><p>Space 翻牌庫、Z 悔棋、H 提示、Esc 暫停。</p>';
  helpFrom = $('pause').classList.contains('hidden') ? null : 'pause';
  hideOv('pause'); showOv('help');
}
$('hOk').onclick = function () { SFX.click(); hideOv('help'); if (helpFrom === 'pause') showOv('pause'); };
function seg(key, opts) { return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) { return '<button data-v="' + o[0] + '" aria-pressed="' + (String(settings[key]) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
var setFrom = null;
function openSettings() {
  $('setBody').innerHTML = '<div class="set"><span>音效</span>' + seg('sound', [[true, '開'], [false, '關']]) + '</div>' +
    '<div class="set"><span>震動</span>' + seg('vib', [[true, '開'], [false, '關']]) + '</div>' +
    '<div class="set"><span>點數小字</span>' + seg('nums', [['auto', '自動'], ['on', '顯示'], ['off', '隱藏']]) + '</div>' +
    '<div class="set" style="border:0"><span>主題</span>' + seg('skin', [['auto', '自動'], ['dusk', '黃昏'], ['nile', '尼羅河'], ['night', '星夜']]) + '</div>' +
    '<p style="font-size:12px;margin-top:8px">點數小字「自動」：第 1–50 關顯示，第 51 關起隱藏。</p>';
  setFrom = $('pause').classList.contains('hidden') ? null : 'pause';
  hideOv('pause'); showOv('settings');
}
$('setBody').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var k = b.parentNode.dataset.k, v = b.dataset.v;
  settings[k] = v === 'true' ? true : v === 'false' ? false : v; saveSettings(); audio(); SFX.click();
  b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  if (k === 'skin') applyTheme(); if (k === 'nums') buildFaces(); if (k === 'sound') setMuteIcon();
});
$('setOk').onclick = function () { SFX.click(); hideOv('settings'); if (setFrom === 'pause') showOv('pause'); };
var ACH = {
  first: ['初次登頂', '清空第一座金字塔'], pure: ['一氣呵成', '不悔棋、不用提示清塔'], norecycle: ['不回頭', '在可翻回的關卡中不翻回就清塔'],
  double: ['雙層崩落', '一次配對同時清空兩層'], saver: ['存糧大師', '清塔時牌庫還剩 8 張以上'], daily: ['每日朝聖', '完成一次每日金字塔'],
  l30: ['沙丘旅人', '通過第 30 關'], l70: ['法老之友', '通過第 70 關'], l100: ['百塔之王', '通過第 100 關']
};
function openStats() {
  var rate = stats.plays ? Math.round(stats.wins / stats.plays * 100) : 0, doneN = Object.keys(progress.done).length;
  var h = '<div class="kv"><div><b>' + stats.plays + '</b>遊玩局數</div><div><b>' + rate + '%</b>勝率</div><div><b>' + (stats.fastest ? fmtTime(stats.fastest) : '—') + '</b>最快清塔</div><div><b>' + doneN + '</b>已過關卡</div><div><b>' + stats.best + '</b>最高分</div><div><b>' + stats.pairs + '</b>累計配對</div></div>';
  for (var k in ACH) h += '<div class="ach' + (stats.ach[k] ? ' on' : '') + '"><i>' + (stats.ach[k] ? '★' : '☆') + '</i><div><b>' + ACH[k][0] + '</b>' + ACH[k][1] + '</div></div>';
  $('statsBody').innerHTML = h; showOv('stats');
}
$('stOk').onclick = function () { SFX.click(); hideOv('stats'); };

/* ===== boot ===== */
window.addEventListener('resize', function () { resize(); });
applyTheme(); resize(); setMuteIcon();
startLevel(nextPlayable(), true);
startLoop();
// test hook for demo/verify.js (read-only view of the game)
window.__game = {
  state: function () { return { status: G.status, n: G.n, s: G.s, score: G.score, sel: G.sel, anim: FX.fly.length > 0 || FX.vanish.length > 0 }; },
  rect: function (loc) { var R = locRect(loc); return { x: R.x, y: R.y - (G.sel === loc ? 6 : 0), w: R.w, h: R.h }; },
  stock: function () { return slotRect('stock'); }
};
</script>
</body>
