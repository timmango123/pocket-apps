<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
/*ART-START*/
// Path2D that remembers a bounding box (control points included, so it is a safe over-estimate); the zoomed-in
// outline renderer skips shapes that are off screen
class BPath extends Path2D {
  constructor() { super(); this.b = [1e9, 1e9, -1e9, -1e9]; }
  _p(x, y, r) { r = r || 0; const b = this.b; if (x - r < b[0]) b[0] = x - r; if (y - r < b[1]) b[1] = y - r; if (x + r > b[2]) b[2] = x + r; if (y + r > b[3]) b[3] = y + r; }
  moveTo(x, y) { this._p(x, y); super.moveTo(x, y); }
  lineTo(x, y) { this._p(x, y); super.lineTo(x, y); }
  bezierCurveTo(a, b, c, d, x, y) { this._p(a, b); this._p(c, d); this._p(x, y); super.bezierCurveTo(a, b, c, d, x, y); }
  quadraticCurveTo(a, b, x, y) { this._p(a, b); this._p(x, y); super.quadraticCurveTo(a, b, x, y); }
  arc(x, y, r, a0, a1, ccw) { this._p(x, y, r); super.arc(x, y, r, a0, a1, ccw); }
  arcTo(a, b, c, d, r) { this._p(a, b); this._p(c, d); super.arcTo(a, b, c, d, r); }
  ellipse(x, y, rx, ry, rot, a0, a1, ccw) { this._p(x, y, Math.max(rx, ry)); super.ellipse(x, y, rx, ry, rot, a0, a1, ccw); }
  rect(x, y, w, h) { this._p(x, y); this._p(x + w, y + h); super.rect(x, y, w, h); }
}
// ---- Line-art generator: every picture is a list of drawing ops on a 1000×1000 sheet. ----
// op [0,path,colour]  filled shape with an outline (painter's order: later shapes cover earlier ones and their lines)
// op [1,path,w]       outline only (veins, whiskers, dividers) — still splits regions
// op [2,path] / [3]   clip to a shape / end clip (used for shards and textures inside a shape)
const ART = (() => {
  const TAU = Math.PI * 2;
  function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const P2 = () => new BPath();
  function C(x, y, r) { const p = P2(); p.arc(x, y, r, 0, TAU); p.closePath(); return p; }
  function E(x, y, rx, ry, rot) { const p = P2(); p.ellipse(x, y, rx, ry, rot || 0, 0, TAU); p.closePath(); return p; }
  function Rc(x, y, w, h, r) {
    const p = P2(); r = Math.min(r || 0, w / 2, h / 2);
    if (!r) { p.rect(x, y, w, h); return p; }
    p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath(); return p;
  }
  function P(pts) { const p = P2(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p; }
  function O(pts) { const p = P2(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); return p; }
  // smooth curve through points (Catmull-Rom → Bézier); closed or open
  function crv(p, pts, closed, t) {
    t = t == null ? 0.5 : t; const n = pts.length, g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const a = g(i - 1), b = g(i), c = g(i + 1), d = g(i + 2);
      p.bezierCurveTo(b[0] + (c[0] - a[0]) * t / 3, b[1] + (c[1] - a[1]) * t / 3, c[0] - (d[0] - b[0]) * t / 3, c[1] - (d[1] - b[1]) * t / 3, c[0], c[1]);
    }
    if (closed) p.closePath();
    return p;
  }
  const B = (pts, t) => crv(P2(), pts, true, t);
  const Q = (pts, t) => crv(P2(), pts, false, t);
  const pol = (cx, cy, r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  // a petal from base (x,y) pointing at angle a: length L, half-width w; tip 0 = pointed, 1 = round
  function petal(x, y, a, L, w, round) {
    const dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx, p = P2();
    const at = (s, k) => [x + dx * L * s + nx * w * k, y + dy * L * s + ny * w * k];
    const tip = at(1, 0), r = round || 0;
    p.moveTo(x, y);
    let c1 = at(0.2, 1.25), c2 = at(0.85 - r * 0.1, 0.95 + r * 0.4);
    p.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
    c1 = at(0.85 - r * 0.1, -0.95 - r * 0.4); c2 = at(0.2, -1.25);
    p.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], x, y);
    p.closePath(); return p;
  }
  function star(cx, cy, n, r1, r2, rot) { const pts = []; for (let i = 0; i < n * 2; i++) pts.push(pol(cx, cy, i % 2 ? r2 : r1, (rot || 0) + i * Math.PI / n)); return P(pts); }
  function ngon(cx, cy, n, r, rot) { const pts = []; for (let i = 0; i < n; i++) pts.push(pol(cx, cy, r, (rot || 0) + i * TAU / n)); return P(pts); }
  function ringSeg(cx, cy, r0, r1, a0, a1) { const p = P2(); p.arc(cx, cy, r1, a0, a1); p.arc(cx, cy, r0, a1, a0, true); p.closePath(); return p; }
  function ring(cx, cy, r0, r1) { const p = P2(); p.arc(cx, cy, r1, 0, TAU); p.closePath(); p.moveTo(cx + r0, cy); p.arc(cx, cy, r0, 0, TAU, true); p.closePath(); return p; }
  function arcLine(cx, cy, r, a0, a1) { const p = P2(); p.arc(cx, cy, r, a0, a1); return p; }

  // ---- colour helpers ----
  function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function rgb2hex(r, g, b) { return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1); }
  function rgb2hsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0; if (mx !== mn) { const d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; } return [h, s, l]; }
  function hsl2rgb(h, s, l) { if (!s) return [l * 255, l * 255, l * 255]; const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; const f = t => { t = (t + 1) % 1; return 255 * (t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p); }; return [f(h + 1 / 3), f(h), f(h - 1 / 3)]; }
  // lighten (+) / darken (−) by lightness delta
  function sh(hex, dl) { const [h, s, l] = rgb2hsl(...hex2rgb(hex)); return rgb2hex(...hsl2rgb(h, s, Math.max(0.06, Math.min(0.97, l + dl)))); }
  function mix(a, b, t) { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); }

  // ---- geometry: Voronoi cells inside a box (for stained glass, low-poly skies, cracked ice) ----
  function clipPoly(poly, ax, ay, bx, by) { // keep side where (p-a)·(b-a) <= 0 … i.e. nearer to a than to b
    const mx = (ax + bx) / 2, my = (ay + by) / 2, nx = bx - ax, ny = by - ay, out = [];
    const side = q => (q[0] - mx) * nx + (q[1] - my) * ny;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
      if (sp <= 0) out.push(p);
      if ((sp < 0) !== (sq < 0) && sp !== sq) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
    }
    return out;
  }
  function voronoi(pts, x0, y0, x1, y1) {
    return pts.map((a, i) => {
      let poly = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      for (let j = 0; j < pts.length && poly.length; j++) if (j !== i) poly = clipPoly(poly, a[0], a[1], pts[j][0], pts[j][1]);
      return poly;
    });
  }
  function centroid(poly) { let x = 0, y = 0; poly.forEach(p => { x += p[0]; y += p[1]; }); return [x / poly.length, y / poly.length]; }
  // well-spread random points (best of k candidates)
  function spread(R, n, x0, y0, x1, y1, inside) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      let best = null, bd = -1;
      for (let k = 0; k < 12; k++) {
        const c = [x0 + R() * (x1 - x0), y0 + R() * (y1 - y0)];
        if (inside && !inside(c[0], c[1])) continue;
        let d = 1e9; for (const p of pts) d = Math.min(d, (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2);
        if (d > bd) { bd = d; best = c; }
      }
      if (best) pts.push(best);
    }
    // one Lloyd step for rounder cells
    return voronoi(pts, x0, y0, x1, y1).map((poly, i) => poly.length ? centroid(poly) : pts[i]);
  }

  function scene() {
    const ops = [];
    const S = {
      ops,
      f(p, c) { ops.push([0, p, c]); return S; },
      l(p, w) { ops.push([1, p, w || 1]); return S; },
      clip(p) { ops.push([2, p]); return S; },
      un() { ops.push([3]); return S; },
      // a colour hint only for the gallery preview: no outline, not part of the regions or the colours
      tint(p, c) { ops.push([4, p, c]); return S; },
      // fill a shape, then break it into Voronoi shards in the given colours (stained glass)
      shards(p, box, cols, n, R, base) {
        S.f(p, base || cols[0]);
        if (n < 2) return S;
        const pts = spread(R, n, box[0], box[1], box[2], box[3], box[4]);
        S.clip(p);
        voronoi(pts, box[0] - 2, box[1] - 2, box[2] + 2, box[3] + 2).forEach((poly, i) => { if (poly.length > 2) S.f(P(poly), cols[Math.floor(R() * cols.length)]); });
        S.un(); S.l(p);
        return S;
      },
      // fill a shape with horizontal (or angled) bands of colours, band edges optionally wavy
      bands(p, y0, y1, cols, wav, R, x0, x1) {
        x0 = x0 == null ? -10 : x0; x1 = x1 == null ? 1010 : x1;
        S.f(p, cols[0]); S.clip(p);
        const n = cols.length;
        for (let i = 1; i < n; i++) {
          const y = y0 + (y1 - y0) * i / n, pts = [[x0, y1 + 20]];
          const ph = R ? R() * TAU : i, k = 2 + (R ? Math.floor(R() * 2) : 1);
          for (let s = 0; s <= 24; s++) { const x = x0 + (x1 - x0) * s / 24; pts.push([x, y + Math.sin(ph + s / 24 * TAU * k / 2) * (wav || 0)]); }
          pts.push([x1, y1 + 20]);
          S.f(P(pts), cols[i]);
        }
        S.un(); S.l(p);
        return S;
      },
    };
    return S;
  }
  return { TAU, rng, C, E, Rc, P, O, B, Q, pol, petal, star, ngon, ringSeg, ring, arcLine, sh, mix, hex2rgb, rgb2hex, rgb2hsl, voronoi, spread, centroid, scene };
})();

// ---- 曼陀羅 & 圖紋 ----
const PICS = [];
(() => {
  const { TAU, C, E, Rc, P, O, B, Q, pol, petal, star, ngon, ringSeg, ring, arcLine, sh, mix, voronoi, spread } = ART;
  const add = (cat, name, draw, rc) => PICS.push({ cat, name, draw, rc });
  const PAL = {
    sunset: ['#fbd38d', '#f6a96b', '#e9785a', '#c4566a', '#7b4b78', '#3e4a6d'],
    ocean: ['#d8f1f5', '#9edcea', '#57bdd8', '#2a8fba', '#1f5f8f', '#f4d58d'],
    garden: ['#f7ecc2', '#bfdcaa', '#7fb685', '#4b8064', '#f4b2c0', '#e0688a'],
    tea: ['#f4e3c6', '#dca46c', '#ae7250', '#6f4f3e', '#a7c0a4', '#4f7c74'],
    jewel: ['#ffd166', '#ef476f', '#2ec4a0', '#1d8ab5', '#244d63', '#9b6cf0'],
    pastel: ['#fde2e4', '#f9c6d6', '#d6ece6', '#b9dfe6', '#cdd8fb', '#fff0c9'],
    autumn: ['#f3cf92', '#e17c5f', '#86b59d', '#4a4e6c', '#f6f0dc', '#b86a7a'],
    indigo: ['#eef2f8', '#bccde6', '#83a0cc', '#4e72a8', '#2d4a76', '#f2c14e'],
    peach: ['#ffd8bf', '#ffb9a6', '#e79c9f', '#b9879a', '#76708a', '#fff3e8'],
    forest: ['#edf6de', '#bcd09e', '#8ea06e', '#6c8455', '#3f5f45', '#e1a862'],
    temple: ['#c8443a', '#eab454', '#2a7a63', '#f5e6c8', '#34496a', '#df7a3a'],
    candy: ['#ffe5ec', '#ffc2d1', '#ff8fab', '#a8e0d8', '#79c7e3', '#fff1a8'],
    plum: ['#f8eef3', '#e3b7cb', '#c27ba0', '#874c79', '#4c3a5e', '#e8c26b'],
  };

  // ---------- mandala ----------
  // ring spec: [type, r0, r1, a, b, extra]
  function mandala(S, R, o) {
    const cx = 500, cy = 500, n = o.n, st = TAU / n;
    S.f(Rc(-5, -5, 1010, 1010), o.bg);
    if (o.corner) {
      [[0, 0], [1000, 0], [0, 1000], [1000, 1000]].forEach(([x, y], i) => {
        o.corner.forEach((c, k) => S.f(C(x, y, c[0]), c[1]));
      });
    }
    if (o.frame) S.f(C(cx, cy, o.frame[0]), o.frame[1]);
    for (const [type, r0, r1, a, b, ex] of o.rings) {
      const rm = (r0 + r1) / 2, rot = (ex && ex.rot) || 0;

    saveNow(); mode = mode === 'free' ? 'num' : 'free'; set.free = mode === 'free' ? 1 : 0; saveSet(); anims = []; fx.confetti = []; fx.reveal = null; fx.replay = null;
    lineAlpha = mode === 'num' && complete ? 0.28 : 1;
    if (mode === 'num') sel = firstOpen(sel);
    repaintAll(); renderPal(); updTitle(); hideBubble(); closeSheet('done');
    // the first-time tips talk about numbers and grey pieces: not shown while colouring freely
    if (mode === 'free') { endCoach(); toast('自由上色：任何顏色都能塗，不影響數字進度', 2600); } else if (!set.tut && !complete) showCoach(1);
  }
  $('bBook').addEventListener('click', () => openBook());
  $('bHint').addEventListener('click', hint);
  // free colouring: undo / redo one region at a time
  function freeStep(from, to) {
    if (!P || mode !== 'free') return;
    const h = from.pop(); if (!h) return;
    to.push([h[0], freeCol[h[0]]]); freeCol[h[0]] = h[1];
    anims = anims.filter(a => a.k !== h[0]); paintRegion(h[0], regionC32(h[0])); flush(); queueSave(); updTitle(); sfx.pick();
  }
  $('bUndo').addEventListener('click', () => freeStep(freeHist, freeFut));
  $('bRedo').addEventListener('click', () => freeStep(freeFut, freeHist));
  $('bMenu').addEventListener('click', () => { $('mSoundR').textContent = set.snd ? '開' : '關'; openSheet('menu'); });
  $('zIn').addEventListener('click', () => { markAct(); zoomBy(1.7); });
  $('zOut').addEventListener('click', () => { markAct(); zoomBy(1 / 1.7); });
  $('zFit').addEventListener('click', () => { markAct(); setView(fitView(), true); });
  $('mSave').addEventListener('click', () => { closeSheet('menu'); exportPng(false); });
  $('mFree').addEventListener('click', () => { closeSheet('menu'); toggleFree(); });
  $('mSound').addEventListener('click', () => { set.snd = set.snd ? 0 : 1; saveSet(); $('mSoundR').textContent = set.snd ? '開' : '關'; if (set.snd) sfx.pick(); });
  $('mTheme').addEventListener('click', () => { set.theme = { auto: 'light', light: 'dark', dark: 'auto' }[set.theme]; saveSet(); applyTheme(); });
  $('mHelp').addEventListener('click', () => { closeSheet('menu'); openSheet('help'); });
  $('mReset').addEventListener('click', () => {
    closeSheet('menu'); if (!P) return;
    $('cfT').textContent = mode === 'free' ? '清空自由上色？' : '重新填這張？';
    $('cfP').textContent = mode === 'free' ? '自由上色的顏色會全部清掉，數字填色的進度不受影響。' : '已塗的顏色會清掉，最佳紀錄會留著。';
    openSheet('confirm');
  });
  $('cfOk').addEventListener('click', () => {
    closeSheet('confirm'); if (!P) return;
    const i = cur;
    if (mode === 'free') {
      const prev = freeCol.slice(); freeCol.fill(0); freeHist = []; freeFut = []; repaintAll(); saveNow(); updTitle();
      toast('已清空', 5000, '復原', () => { if (cur !== i || !P || !freeCol) return; freeCol.set(prev); repaintAll(); saveNow(); });
      return;
    }
    const r = rec(i), prev = { ...r }, prevThumb = store.get('th:' + NAMES[i]);
    Object.assign(r, { o: '', f: 0, t: 0, m: 0, h: 0, d: 0 }); saveRec(i); store.del('th:' + NAMES[i]); delete thumbs[NAMES[i]];
    openPicture(i);
    toast('已清掉重來', 5000, '復原', () => { Object.assign(rec(i), prev); saveRec(i); if (prevThumb) { store.set('th:' + NAMES[i], prevThumb); thumbs[NAMES[i]] = prevThumb; } openPicture(i); });
  });
  $('dReplay').addEventListener('click', timelapse);
  $('dSave').addEventListener('click', () => exportPng(false));
  $('dShare').addEventListener('click', () => exportPng(true));
  $('dNext').addEventListener('click', () => { closeSheet('done'); nextPicture(); });

  // ---- export ----
  function composePng() {
    const W = 1200, H = 1330, c = mkCanvas(W, H), x = c.getContext('2d');
    x.fillStyle = '#f7f1e6'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(60,40,20,0.12)'; x.fillRect(64, 70, 1080, 1080);
    x.fillStyle = PAPER; x.fillRect(60, 60, 1080, 1080);
    const pc = pictureCanvas(); x.imageSmoothingQuality = 'high'; x.drawImage(pc, 60, 60, 1080, 1080); dropCanvas(pc);
    const lc = mkCanvas(1080, 1080); replay(lc.getContext('2d'), P.ops, 'mask', 1.08, INK);
    x.globalAlpha = mode === 'num' && complete ? 0.3 : 1; x.drawImage(lc, 60, 60); x.globalAlpha = 1; dropCanvas(lc);
    x.fillStyle = '#3a3440'; x.textAlign = 'center'; x.font = '600 46px "Songti TC", "Noto Serif TC", serif'; x.fillText(NAMES[cur], W / 2, 1232);
    const d = new Date(); x.fillStyle = '#8e8579'; x.font = '24px system-ui, sans-serif'; x.fillText(`填色本 · No.${NO[cur]} · ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, W / 2, 1282);
    return c;
  }
  let shareOK = false;
  try { shareOK = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.png', { type: 'image/png' })] })); } catch (e) { shareOK = false; }
  $('dShare').hidden = !shareOK;
  function exportPng(share) {
    if (!P) return;
    const c = composePng(), name = `color-book-${String(NO[cur]).padStart(3, '0')}.png`; // ASCII: some browsers drop non-ASCII download names
    c.toBlob(blob => {
      dropCanvas(c);
      if (!blob) { toast('存圖失敗，請再試一次'); return; }
      if (share && shareOK) { navigator.share({ files: [new File([blob], name, { type: 'image/png' })], title: NAMES[cur] }).catch(() => {}); return; }
      const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      window.__cbLastExport = { name, size: blob.size };
      toast('已存成圖片', 1800);
    }, 'image/png');
  }

  // ---- gallery ----
  const grid = $('grid');
  let io = null;
  function openBook() {
    saveNow(); if (P && nFilled && mode === 'num' && !complete) saveThumb();
    hideBubble(); $('book').hidden = false; renderChips(); renderGrid();
    const c = grid.querySelector('.card.cur'); if (c) c.scrollIntoView({ block: 'center' });
  }
  function closeBook() { $('book').hidden = true; if (cur < 0) openPicture(ORDER[0]); }
  $('bkClose').addEventListener('click', closeBook);
  function renderChips() {
    const ch = $('chips'); ch.innerHTML = '';
    CATS.forEach(([id, nm]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = nm; b.dataset.cat = id; b.setAttribute('aria-pressed', set.cat === id ? 'true' : 'false'); ch.append(b); });
    const done = PICS.filter((p, i) => rec(i).d).length; $('bkStat').textContent = `已完成 ${done} / ${PICS.length} 張`;
  }
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; set.cat = b.dataset.cat; saveSet(); renderChips(); renderGrid(); $('book').scrollTop = 0; });
  const TIERN = CB.TIERS.map(t => t.name);
  function renderGrid() {
    grid.innerHTML = ''; if (io) io.disconnect();
    io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); drawThumb(en.target); } }), { root: $('book'), rootMargin: '200px' }) : null;
    const list = ORDER.filter(i => set.cat === 'all' || (set.cat === 'wip' ? (rec(i).f > 0 && !rec(i).d) : PICS[i].cat === set.cat));
    if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = set.cat === 'wip' ? '還沒有塗到一半的畫。\n挑一張開始吧！' : '這裡還沒有畫'; grid.append(e); return; }
    list.forEach(i => {
      const r = rec(i), n = COUNTS[i], tier = CB.tierOf(n), b = document.createElement('button');
      b.type = 'button'; b.className = 'card' + (i === cur ? ' cur' : ''); b.dataset.i = i;
      const pct = r.d ? 100 : Math.round(r.f / (r.n || n) * 100);
      b.setAttribute('aria-label', `No.${NO[i]} ${NAMES[i]}，${TIERN[tier]}，${n} 塊，${r.d ? '已完成' : pct ? '完成 ' + pct + '%' : '還沒開始'}`);
      b.innerHTML = `<div class="th"></div><div class="meta"><div class="nm"><small>${NO[i]}</small>${NAMES[i]}</div><div class="tg"><span class="dots">${[0, 1, 2, 3].map(k => `<i class="${k <= tier ? 'on' : ''}"></i>`).join('')}</span>${TIERN[tier]} · ${n} 塊</div></div>` +
        (r.d ? '<span class="ok"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' : pct ? `<div class="bar2"><i style="width:${pct}%"></i></div>` : '');
      grid.append(b);
      if (io) io.observe(b); else drawThumb(b);
    });
  }
  function drawThumb(card) {
    const i = +card.dataset.i, th = card.querySelector('.th'), nm = NAMES[i];
    let url = thumbs[nm] || store.get('th:' + nm); if (typeof url !== 'string' || !url.startsWith('data:image/')) url = null;
    if (url && (rec(i).f || rec(i).d)) { thumbs[nm] = url; const im = new Image(); im.alt = ''; im.src = url; th.append(im); return; }
    const w = Math.max(80, th.clientWidth || 160), c = mkCanvas(Math.round(w * Math.min(2, dpr)), Math.round(w * Math.min(2, dpr))), x = c.getContext('2d'), k = c.width / 1000;
    x.fillStyle = PAPER; x.fillRect(0, 0, c.width, c.height);
    replay(x, opsOf(i), 'pale', k, '#7a7280', PAPER, Math.max(1, 1 / k));
    th.append(c);
  }
  grid.addEventListener('click', e => { const b = e.target.closest('.card'); if (!b) return; const i = +b.dataset.i; $('book').hidden = true; if (i !== cur || !P) openPicture(i); });

  // ---- keyboard ----
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'z' || e.key === 'Z' || e.key === 'y')) {
      if (mode !== 'free' || !P || [...document.querySelectorAll('.sheet')].some(s => !s.hidden) || !$('book').hidden) return;
      e.preventDefault(); if (e.key === 'y' || e.shiftKey) freeStep(freeFut, freeHist); else freeStep(freeHist, freeFut); return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const open = [...document.querySelectorAll('.sheet')].find(s => !s.hidden);
    if (e.key === 'Escape') { if (open) closeSheet(open.id); else if (!$('book').hidden) closeBook(); return; }
    if (open || !$('book').hidden || !P) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) { const c = k === '0' ? 10 : +k; if (mode === 'free') { if (c <= FREE.length) select(c); } else select(c); }
    else if (k === '+' || k === '=') zoomBy(1.5);
    else if (k === '-' || k === '_') zoomBy(1 / 1.5);
    else if (k === 'f' || k === 'F') setView(fitView(), true);
    else if (k === 'h' || k === 'H') hint();
    else if (k === 'b' || k === 'B') openBook();
    else if (k === 'm' || k === 'M') $('bMenu').click();
    else if (k.startsWith('Arrow')) { const d = 0.18 * Math.min(vw, vh), b = viewAnim ? viewAnim.b : view; setView({ s: b.s, tx: b.tx + (k === 'ArrowLeft' ? d : k === 'ArrowRight' ? -d : 0), ty: b.ty + (k === 'ArrowUp' ? d : k === 'ArrowDown' ? -d : 0) }, 160); }
    else return;
    e.preventDefault();
  });

  // ---- test hooks (read-only, plus opening a picture) ----
  window.__cb = {
    ready: () => !!P && !building,
    state: () => P ? { i: cur, no: NO[cur], name: NAMES[cur], cat: PICS[cur].cat, n: total, filled: nFilled, sel, pal: P.pal.slice(), remain: Array.from(remain), mode, complete, view: { ...view }, sFit, sMax, rec: { ...rec(cur) }, anims: anims.length, fsel } : null,
    regions: () => { const o = []; for (let k = 1; k <= P.n; k++) o.push({ k, x: P.px[k], y: P.py[k], r: P.pr[k], c: P.col[k], f: filled[k], fc: freeCol[k] }); return o; },
    regionAt: (x, y) => CB.regionAt(P, x, y),
    toScreen: (x, y) => { const r = cv.getBoundingClientRect(); const [a, b] = toScreen(x, y); return [a + r.left, b + r.top]; },
    order: () => ORDER.map(i => ({ i, no: NO[i], name: NAMES[i], cat: PICS[i].cat, n: COUNTS[i] })),
    open: (i, free) => openPicture(i, { free }),
    pixel: (x, y) => { const v = d32[Math.round(y) * 1000 + Math.round(x)]; return [v & 255, v >> 8 & 255, v >> 16 & 255]; },
    fx: () => ({ reveal: !!fx.reveal, replay: !!fx.replay, confetti: fx.confetti.length, pulse: !!fx.pulse, lineAlpha }),
    compose: () => { const c = composePng(); return c.toDataURL('image/png').length; },
    composePixel: (x, y) => { const d = composePng().getContext('2d').getImageData(60 + Math.round(x * 1.08), 60 + Math.round(y * 1.08), 1, 1).data; return [d[0], d[1], d[2]]; },
    hist: () => ({ undo: freeHist.length, redo: freeFut.length }),
  };

  // ---- start ----
  readColours(); applyTheme();
  new ResizeObserver(resize).observe(stage); resize();
  requestAnimationFrame(loop);
  const start = set.last ? NAMES.indexOf(set.last) : -1;
  openPicture(start >= 0 ? start : ORDER[0], { free: start >= 0 && !!set.free });
})();
</script>
