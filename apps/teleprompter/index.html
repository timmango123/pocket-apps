<title>提詞機</title>
<style>
/* Studio console: graphite neutrals, tally-light red for the go button, cue-yellow emphasis */
:root {

}

    --bg: #101113; --surface: #191b1f; --surface-2: #202328; --ink: #eceef1; --ink-2: #c5c9d0; --muted: #969ca6;
    --line: #2b2f35; --line-strong: #474c55; --tally: #ff5a52; --tally-ink: #1a0605; --accent: #e6e8eb; --accent-ink: #15171a;
    --cue: #f2c230; --danger: #ff7b72; --overlay: rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101113; --surface: #191b1f; --surface-2: #202328; --ink: #eceef1; --ink-2: #c5c9d0; --muted: #969ca6;
  --line: #2b2f35; --line-strong: #474c55; --tally: #ff5a52; --tally-ink: #1a0605; --accent: #e6e8eb; --accent-ink: #15171a;
  --cue: #f2c230; --danger: #ff7b72; --overlay: rgba(0,0,0,.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(12px, env(safe-area-inset-top)) calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 1120px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 800; font-size: 19px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.brand .rec { width: 10px; height: 10px; border-radius: 50%; background: var(--tally); flex-shrink: 0; }
.btn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.icon { width: 44px; padding: 0; }
.btn svg { width: 20px; height: 20px; }
.btn.danger { color: var(--danger); }
@media (hover: hover) { .btn:hover { border-color: var(--ink-2); } }

.cols { display: grid; gap: 16px; margin-top: 12px; }
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
.titlein { width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid var(--line-strong); background: transparent; font-size: 18px; font-weight: 700; padding: 0 2px; border-radius: 0; }
textarea#body { width: 100%; height: min(45vh, 520px); min-height: 200px; margin-top: 10px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: 12px 14px; font-size: 16px; line-height: 1.7; resize: vertical; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
.stats b { color: var(--ink); }
.syntax { font-size: 12px; color: var(--muted); margin-top: 4px; }
.syntax code { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--ink-2); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.panel h2 { font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 12px 0 4px; font-weight: 700; }
.ctl { display: grid; grid-template-columns: 72px 1fr 76px; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }

.ctl output { white-space: nowrap; }
input[type=range] { width: 100%; height: 40px; accent-color: var(--tally); margin: 0; }

.seg button::after { content: ""; position: absolute; inset: -2px 0; }

.toggles { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.tg { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px; cursor: pointer; }
.tg input { width: 18px; height: 18px; accent-color: var(--tally); margin: 0; }

.sw::after { content: ""; position: absolute; inset: -2px 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--tally); outline-offset: 1px; }
.colorin { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.colorin input { width: 40px; height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 2px; background: var(--surface); }

.preview { display: none; }
@media (min-width: 960px) {
  .preview { display: block; position: sticky; top: 12px; border-radius: 14px; overflow: hidden; height: 300px; border: 1px solid var(--line); }
  .preview .stage { position: absolute; }
}
.preview-wrap h2 { font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 700; display: none; }
@media (min-width: 960px) { .preview-wrap h2 { display: block; } }

.gobar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.gobar .in { max-width: 1120px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.go { flex: 1; min-height: 56px; border-radius: 14px; border: 0; background: var(--tally); color: var(--tally-ink); font-size: 17px; font-weight: 800; letter-spacing: .08em; display: flex; align-items: center; justify-content: center; gap: 10px; }
.go:disabled { opacity: .4; cursor: not-allowed; }
.go svg { width: 22px; height: 22px; }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: var(--p-bg, #000); color: var(--p-fg, #fff); touch-action: none; user-select: none; -webkit-user-select: none; }
.stage { inset: 0; overflow: hidden; }
.player .stage { position: absolute; }
.text { position: absolute; left: 0; right: 0; will-change: transform; font-weight: 600; -webkit-font-smoothing: antialiased; padding-bottom: 0; }
.text p { margin: 0 0 1em; }
.text p:last-child { margin-bottom: 0; }
.text mark { background: none; color: var(--cue); }
.text .pz { display: inline-block; font-size: .42em; font-weight: 700; letter-spacing: .1em; vertical-align: middle; border: 1px solid currentColor; border-radius: 4px; padding: 0 .4em; opacity: .55; margin: 0 .2em; line-height: 1.5; }
.guide { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.guide::before { content: ""; position: absolute; left: 0; right: 0; top: -.15em; height: 1.6em; background: color-mix(in srgb, var(--p-fg, #fff) 9%, transparent); border-top: 1px solid color-mix(in srgb, var(--p-fg, #fff) 22%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--p-fg, #fff) 22%, transparent); }
.guide::after { content: ""; position: absolute; left: 4px; top: .25em; border: .4em solid transparent; border-left: .55em solid var(--tally); }
.hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(transparent, rgba(0,0,0,.78) 30%); color: #fff; }
.hud.hide { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .hud { transition: opacity .3s; } }
.hud .prog { height: 4px; background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.hud .prog i { display: block; height: 100%; width: 0; background: var(--tally); }
.hud .row { display: flex; align-items: center; gap: 6px; justify-content: center; }
.hud .info { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.8); margin-bottom: 6px; }
.hb { min-width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; padding: 0 8px; }
.hb svg { width: 22px; height: 22px; }
.hb.main { background: #fff; color: #000; min-width: 64px; }
.cd { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(40vw, 40vh); font-weight: 200; pointer-events: none; }
.endcard { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; }
.endcard .box { text-align: center; display: grid; gap: 14px; }
.endcard b { font-size: 40px; font-weight: 300; letter-spacing: .2em; }
.endcard .row { display: flex; gap: 10px; }
.pausedflag { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); background: var(--tally); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .1em; padding: 4px 10px; border-radius: 6px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 12px; }
@media (min-width: 700px) { .scrim { align-items: center; } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow-y: auto; } }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 16px; padding: 16px; max-height: calc(100% - 8px); display: flex; flex-direction: column; margin-bottom: env(safe-area-inset-bottom); }
@media (max-height: 600px) { .sheet { max-height: none; } }
.sheet h3 { margin: 0 0 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.slist { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--line); }
.slist li { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.slist .open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; min-height: 52px; padding: 6px 4px; }
.slist .open b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slist .open span { font-size: 12px; color: var(--muted); }
.slist li.cur .open b::before { content: "● "; color: var(--tally); }
.confirm { border: 1px solid var(--danger); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 14px; }
.confirm .r { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.player ~ .toast { bottom: calc(150px + env(safe-area-inset-bottom)); }
</style>

<div class="app" id="editor">
  <header class="top">
    <div class="brand"><span class="rec"></span>提詞機</div>
    <button class="btn" id="btnList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>講稿</button>
    <button class="btn icon" id="btnTheme" aria-label="切換深淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
  </header>
  <div class="cols">
    <div>
      <input class="titlein" id="title" maxlength="60" aria-label="講稿標題" placeholder="講稿標題">
      <textarea id="body" aria-label="講稿內容" placeholder="在這裡貼上或輸入講稿。空一行代表新段落。"></textarea>
      <div class="stats"><span><b class="num" id="stCount">0</b> 字（中文每字、英文每詞各算 1）</span><span>預估 <b class="num" id="stTime">0:00</b></span></div>
      <div class="syntax">標記：<code>**重點**</code> 黃色強調　<code>[停頓]</code> 到導引線時暫停 2 秒　空行＝段落（←→ 跳段）</div>
    </div>
    <div class="preview-wrap">
      <h2>預覽</h2>
      <div class="preview" id="preview"></div>
      <div class="panel" style="margin-top:12px">
        <h2>速度</h2>
        <div class="ctl wide"><span class="lab">模式</span><div class="seg" id="segMode"><button data-v="wpm">字/分</button><button data-v="pxs">px/秒</button></div></div>
        <div class="ctl"><label for="speed">速度</label><input type="range" id="speed"><output class="num" id="oSpeed"></output></div>
        <h2>版面</h2>
        <div class="ctl"><label for="size">字級</label><input type="range" id="size" min="24" max="120" step="2"><output class="num" id="oSize"></output></div>
        <div class="ctl"><label for="lh">行距</label><input type="range" id="lh" min="1.2" max="2.2" step="0.1"><output class="num" id="oLh"></output></div>
        <div class="ctl"><label for="margin">左右邊距</label><input type="range" id="margin" min="0" max="25" step="1"><output class="num" id="oMargin"></output></div>
        <div class="ctl"><label for="guide">導引線</label><input type="range" id="guide" min="20" max="60" step="1"><output class="num" id="oGuide"></output></div>
        <div class="ctl wide"><span class="lab">配色</span>
          <div class="swatches" id="swatches">
            <button class="sw" data-fg="#ffffff" data-bg="#000000" style="background:#000;color:#fff">白/黑</button>
            <button class="sw" data-fg="#ffe14d" data-bg="#000000" style="background:#000;color:#ffe14d">黃/黑</button>
            <button class="sw" data-fg="#111111" data-bg="#ffffff" style="background:#fff;color:#111">黑/白</button>
            <label class="colorin">字<input type="color" id="fg" aria-label="文字顏色"></label>
            <label class="colorin">底<input type="color" id="bg" aria-label="背景顏色"></label>
          </div>
        </div>
        <h2>播放</h2>
        <div class="ctl wide"><span class="lab">倒數</span><div class="seg" id="segCd"><button data-v="0">無</button><button data-v="3">3 秒</button><button data-v="5">5 秒</button></div></div>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="mx">水平鏡像</label>
          <label class="tg"><input type="checkbox" id="my">垂直鏡像</label>
          <label class="tg"><input type="checkbox" id="pz">[停頓] 自動暫停</label>
        </div>
      </div>
      <p class="syntax" style="margin-top:10px">播放中：點一下暫停／繼續；上下拖曳調整位置；左右滑動調速度；雙指縮放字級。鍵盤：空白鍵暫停、↑↓ 調速、←→ 或 PageUp/PageDown 跳段落、Esc 結束。</p>
    </div>
  </div>
</div>

<div class="gobar"><div class="in">
  <button class="go" id="btnGo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>開始</button>
</div></div>

<div class="player" id="player" hidden>
  <div class="stage" id="stage">
    <div class="guide" id="guideLine"></div>
    <div class="text" id="text"></div>
  </div>
  <div class="cd" id="cd" hidden></div>
  <div class="pausedflag" id="pflag" hidden>暫停</div>

      <button class="hb" id="hSlow" aria-label="減速">−10</button>
      <button class="hb main" id="hPlay" aria-label="暫停或繼續"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="hb" id="hFast" aria-label="加速">+10</button>
      <button class="hb" id="hExit" aria-label="結束播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

<div class="scrim" id="dlgList" hidden>

    <ul class="slist" id="slist"></ul>
    <div class="confirm" id="delBox" hidden><span id="delMsg"></span><div class="r"><button class="btn" id="delNo">取消</button><button class="btn danger" id="delYes">刪除</button></div></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'teleprompter:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => { const a = new Uint32Array(2); crypto.getRandomValues(a); return a[0].toString(36) + a[1].toString(36); };

const BASE_CFG = { mode: 'wpm', wpm: 180, pxs: 60, size: 56, lh: 1.5, margin: 6, fg: '#ffffff', bg: '#000000', mx: false, my: false, guide: 35, cd: 3, pz: true };
const SAMPLE = `【範例講稿】大家好，歡迎收看本週的產品更新。今天我想用三分鐘，跟大家分享我們這一季最重要的三件事。

第一件事，是**速度**。我們重新設計了資料同步的方式，打開 App 到看見內容的時間，從原本的四秒縮短到一秒以內。[停頓] 這代表你每天打開十次，就省下了半分鐘。

第二件事，是**離線也能用**。不管你在捷運上、山上，或是在飛機上，所有筆記都可以照常編輯，連上網路之後再自動合併。

第三件事，是我們終於支援 Dark Mode 了。這是大家敲碗最久的功能，謝謝每一位回報意見的使用者。[停頓]

最後，新版本今天晚上就會上架。如果你有任何想法，歡迎在留言區告訴我們。我們下週見！`;

let defaults = Object.assign({}, BASE_CFG, store.get('defaults', {}));
let scripts = store.get('scripts', null);
if (!Array.isArray(scripts) || !scripts.length) scripts = [{ id: uid(), title: '範例：產品更新開場', body: SAMPLE, cfg: Object.assign({}, defaults), updated: Date.now() }];
scripts.forEach(s => { s.cfg = Object.assign({}, BASE_CFG, s.cfg || {}); s.body = String(s.body || ''); s.title = String(s.title || '未命名講稿'); });
let curId = store.get('current', scripts[0].id);
if (!scripts.some(s => s.id === curId)) curId = scripts[0].id;
const cur = () => scripts.find(s => s.id === curId);
let saveT = 0;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveNow, 500); }
function saveNow() { clearTimeout(saveT); if (!store.set('scripts', scripts)) toast('瀏覽器儲存空間不可用，講稿只保留在這個分頁'); store.set('current', curId); store.set('defaults', defaults); }
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

// theme
let theme = store.get('theme', 'auto');
function applyTheme() { const r = document.documentElement; if (theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', theme); }
applyTheme();
$('#btnTheme').addEventListener('click', () => {
  const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  theme = dark ? 'light' : 'dark'; store.set('theme', theme); applyTheme();
});

// ---------- text model ----------
const CJK = /[㐀-鿿豈-﫿぀-ヿ가-힯\u{20000}-\u{2fa1f}]/gu;
function countWords(src) {
  const t = src.replace(/\[停頓\]/g, ' ').replace(/\*\*/g, '');
  const cjk = (t.match(CJK) || []).length;
  const latin = (t.replace(CJK, ' ').match(/[A-Za-z0-9À-ɏ]+(?:['’.\-][A-Za-z0-9À-ɏ]+)*/g) || []).length;
  return cjk + latin;
}
const countPauses = (src) => (src.match(/\[停頓\]/g) || []).length;
function toHTML(src) {
  const paras = src.replace(/\r\n?/g, '\n').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paras.map(p => '<p>' + esc(p)
    .replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>')
    .replace(/\[停頓\]/g, '<span class="pz">停頓</span>')
    .replace(/\n/g, '<br>') + '</p>').join('');
}
const fmt = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); };

// ---------- editor ----------
function loadEditor() {
  const s = cur();
  $('#title').value = s.title; $('#body').value = s.body;
  syncCfg(); updateStats(); renderPreview();
}
function updateStats() {
  const s = cur(); const n = countWords(s.body); const pz = s.cfg.pz ? countPauses(s.body) * 2 : 0;
  $('#stCount').textContent = n;
  $('#stTime').textContent = s.cfg.mode === 'wpm' ? fmt(n / s.cfg.wpm * 60 + pz) : '依版面計算';
  $('#btnGo').disabled = !s.body.trim();
}
function speedRange(c) { return c.mode === 'wpm' ? [60, 400, 10, c.wpm] : [10, 300, 5, c.pxs]; }
function syncCfg() {
  const c = cur().cfg;
  document.querySelectorAll('#segMode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === c.mode)));
  document.querySelectorAll('#segCd button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === c.cd)));
  const [mn, mx, st, v] = speedRange(c); const sp = $('#speed'); sp.min = mn; sp.max = mx; sp.step = st; sp.value = v;
  $('#oSpeed').textContent = c.mode === 'wpm' ? v + ' 字/分' : v + ' px/s';
  $('#size').value = c.size; $('#oSize').textContent = c.size + 'px';
  $('#lh').value = c.lh; $('#oLh').textContent = Number(c.lh).toFixed(1);
  $('#margin').value = c.margin; $('#oMargin').textContent = c.margin + '%';
  $('#guide').value = c.guide; $('#oGuide').textContent = c.guide + '%';
  $('#fg').value = c.fg; $('#bg').value = c.bg;
  document.querySelectorAll('#swatches .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fg === c.fg && b.dataset.bg === c.bg)));
  $('#mx').checked = c.mx; $('#my').checked = c.my; $('#pz').checked = c.pz;
}
function setCfg(k, v) { const c = cur().cfg; c[k] = v; defaults[k] = v; cur().updated = Date.now(); saveSoon(); syncCfg(); updateStats(); renderPreview(); }
$('#title').addEventListener('input', (e) => { cur().title = e.target.value || '未命名講稿'; cur().updated = Date.now(); saveSoon(); });
$('#body').addEventListener('input', (e) => { cur().body = e.target.value; cur().updated = Date.now(); saveSoon(); updateStats(); renderPreviewSoon(); });
$('#segMode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setCfg('mode', b.dataset.v); });
$('#segCd').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setCfg('cd', +b.dataset.v); });
$('#speed').addEventListener('input', (e) => setCfg(cur().cfg.mode === 'wpm' ? 'wpm' : 'pxs', +e.target.value));
$('#size').addEventListener('input', (e) => setCfg('size', +e.target.value));
$('#lh').addEventListener('input', (e) => setCfg('lh', +e.target.value));
$('#margin').addEventListener('input', (e) => setCfg('margin', +e.target.value));
$('#guide').addEventListener('input', (e) => setCfg('guide', +e.target.value));
$('#fg').addEventListener('input', (e) => setCfg('fg', e.target.value));
$('#bg').addEventListener('input', (e) => setCfg('bg', e.target.value));
$('#swatches').addEventListener('click', (e) => { const b = e.target.closest('.sw'); if (!b) return; const c = cur().cfg; c.fg = b.dataset.fg; setCfg('bg', b.dataset.bg); defaults.fg = c.fg; });
['mx', 'my', 'pz'].forEach(k => $('#' + k).addEventListener('change', (e) => setCfg(k, e.target.checked)));

// preview (desktop): static frame at the start position
let pvT = 0;
function renderPreviewSoon() { clearTimeout(pvT); pvT = setTimeout(renderPreview, 250); }
function renderPreview() {
  const pv = $('#preview'); if (getComputedStyle(pv).display === 'none') return;
  const c = cur().cfg; const scale = .5;
  pv.style.background = c.bg; pv.style.color = c.fg;
  pv.innerHTML = `<div class="stage" style="transform:${mirrorTf(c)}"><div class="guide" style="top:${c.guide}%;font-size:${c.size * scale}px;--p-fg:${c.fg}"></div><div class="text" style="top:${c.guide}%;font-size:${c.size * scale}px;line-height:${c.lh};padding-inline:${c.margin}%">${toHTML(cur().body)}</div></div>`;
}
const mirrorTf = (c) => `scale(${c.mx ? -1 : 1}, ${c.my ? -1 : 1})`;
window.addEventListener('resize', renderPreviewSoon);

// ---------- scripts list ----------
function renderList() {
  const list = scripts.slice().sort((a, b) => b.updated - a.updated);
  $('#slist').innerHTML = list.map(s => `<li class="${s.id === curId ? 'cur' : ''}"><button class="open" data-open="${s.id}"><b>${esc(s.title)}</b><span>${countWords(s.body)} 字 · ${new Date(s.updated).toLocaleDateString('zh-TW')}</span></button><button class="btn icon danger" data-del="${s.id}" aria-label="刪除 ${esc(s.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></li>`).join('');
}
let pendingDel = null;
$('#btnList').addEventListener('click', () => { renderList(); $('#delBox').hidden = true; $('#dlgList').hidden = false; setTimeout(() => $('#btnNew').focus(), 30); });
$('#dlgList').addEventListener('click', (e) => {
  if (e.target.id === 'dlgList' || e.target.closest('[data-close]')) { $('#dlgList').hidden = true; return; }
  const o = e.target.closest('[data-open]'); if (o) { saveNow(); curId = o.dataset.open; saveNow(); loadEditor(); $('#dlgList').hidden = true; return; }
  const d = e.target.closest('[data-del]'); if (d) { pendingDel = d.dataset.del; const s = scripts.find(x => x.id === pendingDel); $('#delMsg').textContent = `確定刪除「${s.title}」？刪除後無法復原。`; $('#delBox').hidden = false; $('#delYes').focus(); }
});
$('#delNo').addEventListener('click', () => { $('#delBox').hidden = true; pendingDel = null; });
$('#delYes').addEventListener('click', () => {
  scripts = scripts.filter(s => s.id !== pendingDel);
  if (!scripts.length) scripts.push({ id: uid(), title: '未命名講稿', body: '', cfg: Object.assign({}, defaults), updated: Date.now() });
  if (!scripts.some(s => s.id === curId)) curId = scripts[0].id;
  pendingDel = null; $('#delBox').hidden = true; saveNow(); renderList(); loadEditor();
});
$('#btnNew').addEventListener('click', () => {
  if (scripts.length >= 100) { toast('最多 100 份講稿，請先刪除舊的'); return; }
  const s = { id: uid(), title: '新講稿', body: '', cfg: Object.assign({}, defaults), updated: Date.now() };
  scripts.push(s); curId = s.id; saveNow(); loadEditor(); $('#dlgList').hidden = true; $('#title').select(); $('#body').focus();
});

// ---------- player engine ----------
const P = { on: false, playing: false, y: 0, H: 1, v: 0, last: 0, holdUntil: 0, marks: [], paras: [], passed: new Set(), ended: false, cdUntil: 0, raf: 0, cfg: null };
const player = $('#player'), textEl = $('#text'), stage = $('#stage');
function measure() {
  const c = P.cfg; const oldH = P.H, ratio = oldH > 1 ? P.y / oldH : 0;
  P.H = Math.max(1, textEl.offsetHeight);
  const top = textEl.getBoundingClientRect().top;
  P.marks = [...textEl.querySelectorAll('.pz')].map(el => el.offsetTop + el.offsetHeight / 2 - 0);
  P.paras = [...textEl.querySelectorAll('p')].map(el => el.offsetTop);
  if (c.mode === 'wpm') { const n = Math.max(1, countWords(cur().body)); P.v = P.H / (n / c.wpm * 60); }
  else P.v = c.pxs;
  if (oldH > 1 && oldH !== P.H) P.y = ratio * P.H;
}
function layoutPlayer() {
  const c = P.cfg;
  player.style.setProperty('--p-bg', c.bg); player.style.setProperty('--p-fg', c.fg);
  stage.style.transform = mirrorTf(c);
  textEl.style.top = c.guide + '%'; textEl.style.fontSize = c.size + 'px'; textEl.style.lineHeight = c.lh; textEl.style.paddingInline = `max(${c.margin}%, 12px)`;
  $('#guideLine').style.top = c.guide + '%'; $('#guideLine').style.fontSize = c.size + 'px';
  measure(); draw();
}
const ro = new ResizeObserver(() => { if (P.on) { measure(); draw(); } });
ro.observe(textEl);
function remaining() { const rest = P.marks.filter((m, i) => !P.passed.has(i) && m > P.y).length * (P.cfg.pz ? 2 : 0); return (P.H - P.y) / P.v + rest + Math.max(0, (P.holdUntil - performance.now()) / 1000); }
function draw() {
  textEl.style.transform = `translate3d(0, ${-P.y}px, 0)`;
  $('#hProg').style.width = Math.min(100, P.y / P.H * 100) + '%';
  const c = P.cfg;
  $('#hSpeed').textContent = c.mode === 'wpm' ? `${c.wpm} 字/分` : `${c.pxs} px/秒`;
  $('#hLeft').textContent = '剩餘 ' + fmt(remaining());
  $('#pflag').hidden = P.playing || P.ended || !!P.cdUntil;
  $('#hPlay').innerHTML = P.playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
}
function loop(t) {
  P.raf = 0; if (!P.on) return;
  const dt = Math.min(0.25, Math.max(0, (t - P.last) / 1000)); P.last = t;
  if (P.cdUntil) {
    const left = Math.ceil((P.cdUntil - t) / 1000);
    if (left > 0) { $('#cd').textContent = left; }
    else { P.cdUntil = 0; $('#cd').hidden = true; draw(); }
  } else if (P.playing && t >= P.holdUntil) {
    P.y += P.v * dt;
    if (P.cfg.pz) {
      for (let i = 0; i < P.marks.length; i++) if (!P.passed.has(i) && P.y >= P.marks[i]) { P.passed.add(i); P.y = P.marks[i]; P.holdUntil = t + 2000; break; }
    }
    if (P.y >= P.H) { P.y = P.H; P.playing = false; P.ended = true; $('#endcard').hidden = false; showHud(true); setTimeout(() => $('#eAgain').focus(), 30); }
    draw();
  } else if (P.playing) draw();
  if (P.playing || P.cdUntil) P.raf = requestAnimationFrame(loop);
}
function kick() { if (!P.raf) { P.last = performance.now(); P.raf = requestAnimationFrame(loop); } }
function play() {
  if (P.ended) restart();
  P.playing = true; kick(); draw(); hudAutoHide(); lockScreen();
}
function pause() { P.playing = false; P.holdUntil = 0; draw(); showHud(true); }
function toggle() { P.playing ? pause() : play(); }
function restart() { P.y = 0; P.passed.clear(); P.holdUntil = 0; P.ended = false; $('#endcard').hidden = true; draw(); }
function seekBy(dy) { P.y = Math.max(0, Math.min(P.H - 1, P.y + dy)); P.passed = new Set([...P.passed].filter(i => P.marks[i] < P.y)); P.marks.forEach((m, i) => { if (m < P.y) P.passed.add(i); }); P.ended = false; $('#endcard').hidden = true; draw(); }
function jumpPara(dir) {
  if (!P.paras.length) return;
  let target;
  if (dir > 0) target = P.paras.find(o => o > P.y + 2); else { const prev = P.paras.filter(o => o < P.y - P.cfg.size * 0.8); target = prev.length ? prev[prev.length - 1] : 0; }
  if (target == null) return;
  seekBy(target - P.y);
}
function changeSpeed(d) {
  const c = P.cfg;
  if (c.mode === 'wpm') c.wpm = Math.max(60, Math.min(400, c.wpm + d)); else c.pxs = Math.max(10, Math.min(300, c.pxs + d / 2));
  defaults.wpm = c.wpm; defaults.pxs = c.pxs; saveSoon(); measure(); draw(); syncCfg(); updateStats();
}
function setSize(px) { const c = P.cfg; c.size = Math.round(Math.max(24, Math.min(120, px))); defaults.size = c.size; textEl.style.fontSize = c.size + 'px'; $('#guideLine').style.fontSize = c.size + 'px'; saveSoon(); }

async function openPlayer() {
  const s = cur(); if (!s.body.trim()) return;
  saveNow();
  P.cfg = s.cfg; P.on = true; P.y = 0; P.H = 1; P.passed = new Set(); P.ended = false; P.holdUntil = 0;
  textEl.innerHTML = toHTML(s.body);
  player.hidden = false; $('#endcard').hidden = true; document.body.style.overflow = 'hidden';
  layoutPlayer();
  try { if (player.requestFullscreen && !document.fullscreenElement) await player.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  measure(); draw();
  if (s.cfg.cd > 0) { P.cdUntil = performance.now() + s.cfg.cd * 1000; $('#cd').hidden = false; $('#cd').textContent = s.cfg.cd; }
  else { P.cdUntil = 0; $('#cd').hidden = true; }
  P.playing = true; kick(); draw(); hudAutoHide(); lockScreen();
  setTimeout(() => $('#hPlay').focus({ preventScroll: true }), 30);
}
function closePlayer() {
  P.on = false; P.playing = false; cancelAnimationFrame(P.raf); P.raf = 0;
  player.hidden = true; document.body.style.overflow = '';
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  unlockScreen(); syncCfg(); updateStats(); renderPreview(); $('#btnGo').focus();
}
$('#btnGo').addEventListener('click', openPlayer);
$('#hPlay').addEventListener('click', (e) => { e.stopPropagation(); if (P.cdUntil) { P.cdUntil = 0; $('#cd').hidden = true; } toggle(); });
$('#hSlow').addEventListener('click', (e) => { e.stopPropagation(); changeSpeed(-10); hudAutoHide(); });
$('#hFast').addEventListener('click', (e) => { e.stopPropagation(); changeSpeed(10); hudAutoHide(); });
$('#hRestart').addEventListener('click', (e) => { e.stopPropagation(); restart(); hudAutoHide(); });
$('#hExit').addEventListener('click', (e) => { e.stopPropagation(); closePlayer(); });
$('#eAgain').addEventListener('click', (e) => { e.stopPropagation(); restart(); play(); });
$('#eEdit').addEventListener('click', (e) => { e.stopPropagation(); closePlayer(); });
document.addEventListener('fullscreenchange', () => { if (P.on) { measure(); draw(); } });

// HUD auto hide
let hudT = 0;
function showHud(stay) { $('#hud').classList.remove('hide'); clearTimeout(hudT); if (!stay) hudAutoHide(); }
function hudAutoHide() { $('#hud').classList.remove('hide'); clearTimeout(hudT); hudT = setTimeout(() => { if (P.playing) $('#hud').classList.add('hide'); }, 3000); }

// gestures on stage
const ptrs = new Map(); let g = null;
player.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.hud:not(.hide) button, .endcard button')) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { player.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 1) g = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, mode: null, acc: 0, wasPlaying: P.playing };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; g = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: P.cfg.size }; }
});
player.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId) || !g) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (g.mode === 'pinch' && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (g.d0 > 10) setSize(g.s0 * d / g.d0); return; }
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.mode) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) g.mode = 'drag'; else if (Math.abs(dx) > 14) g.mode = 'swipe'; else return; }
  if (g.mode === 'drag') { const sy = P.cfg.my ? -1 : 1; seekBy(-(e.clientY - g.ly) * sy); P.holdUntil = 0; }
  else if (g.mode === 'swipe') { const sx = P.cfg.mx ? -1 : 1; g.acc += (e.clientX - g.lx) * sx; while (Math.abs(g.acc) >= 40) { changeSpeed(g.acc > 0 ? 10 : -10); g.acc -= Math.sign(g.acc) * 40; showHud(); } }
  g.lx = e.clientX; g.ly = e.clientY;
});
const endPtr = (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (g && !g.mode && e.type === 'pointerup' && ptrs.size === 0) {
    if (P.ended) return;
    if (P.cdUntil) { P.cdUntil = 0; $('#cd').hidden = true; }
    toggle();
  }
  if (ptrs.size === 0) g = null;
};
player.addEventListener('pointerup', endPtr); player.addEventListener('pointercancel', endPtr);
player.addEventListener('mousemove', () => { if (P.on) hudAutoHide(); });

document.addEventListener('keydown', (e) => {
  if (!P.on) { if (e.key === 'Escape') document.querySelectorAll('.scrim').forEach(d => d.hidden = true); return; }
  const k = e.key;
  if (k === ' ' || k === 'k') { e.preventDefault(); if (e.target.closest && e.target.closest('button')) e.target.blur(); toggle(); }
  else if (k === 'ArrowUp') { e.preventDefault(); changeSpeed(10); showHud(); }
  else if (k === 'ArrowDown') { e.preventDefault(); changeSpeed(-10); showHud(); }
  else if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); jumpPara(1); showHud(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); jumpPara(-1); showHud(); }
  else if (k === 'Home') { e.preventDefault(); restart(); }
  else if (k === 'Escape') { e.preventDefault(); closePlayer(); }
  else if (k === '+' || k === '=') setSize(P.cfg.size + 4);
  else if (k === '-') setSize(P.cfg.size - 4);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.on && P.playing) pause(); });

// wake lock
let wake = null, warned = false;
async function lockScreen() {
  if (wake) return;
  try { if ('wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } else throw 0; }
  catch (e) { if (!warned) { warned = true; toast('無法保持螢幕常亮，請暫時關閉自動鎖定'); } }
}
function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

window.__tp = { countWords, P, open: openPlayer, close: closePlayer, setBody(t) { $('#body').value = t; $('#body').dispatchEvent(new Event('input')); }, setCfg, cur };
loadEditor();
})();
</script>
