<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

  else { audio.resume(); schedule(); }
});
window.addEventListener('pagehide', saveNow);
window.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k = e.key.toLowerCase();
  if (k === 'escape') { $('menu').hidden = true; $('help').hidden = true; $('snap').hidden = true; return; }
  if (k >= '1' && k <= '6') { setMode('rake'); setRake(+k); }
  else if (k === 'r') setMode('rake');
  else if (k === 'p') setMode('place');
  else if (k === 'f') smoothAll(false);
  else if (k === 's') audio.toggle();
  else if (k === 'd') toggleTheme();
  else if (k === 'm') $('menu').hidden = !$('menu').hidden;
  else return;
  e.preventDefault();
});

layout(false);
setThemeIcon();
var sample = false;
if (!loadGarden()) { buildSample(); sample = true; }
(function () {
  var r = +store.get('rake'); if (r >= 1 && r <= 6) rakeId = r; setRake(rakeId);
  var it = store.get('item'); if (ITEM_NAMES[it]) itemType = it; setItemType(itemType);
  setMode('rake');
  if (sample) showHint(coarse ? '範例庭園・用手指耙沙，線條會繞過石頭' : '範例庭園・拖曳滑鼠耙沙，線條會繞過石頭');
  if (store.get('sound') === '1') { $('bSound').setAttribute('aria-pressed', 'true'); audio.on = true; audio.pendingStart = true; }
})();
// a saved "sound on" starts after the first gesture (autoplay rules)
if (audio.on) { var startAudio = function () { document.removeEventListener('pointerdown', startAudio, true); document.removeEventListener('keydown', startAudio, true); if (audio.on && !audio.ctx) { audio.on = false; audio.set(true); } }; document.addEventListener('pointerdown', startAudio, true); document.addEventListener('keydown', startAudio, true); }
render();
schedule();

window.__zen = {
  ZS: ZS,
  field: function () { return field; }, items: function () { return items; }, mode: function () { return mode; }, rake: function () { return rakeId; },
  size: function () { return { W: W, H: H, cols: cols, rows: rows, cellPx: cellPx }; },
  maxAbs: function () { return ZS.maxAbs(field); },
  heightAt: function (x, y) { return field.h[Math.round(y / cellPx) * cols + Math.round(x / cellPx)]; },
  isDark: isDark, audio: audio, saveNow: saveNow, smoothing: function () { return !!smoothing; },
  sample: function () { return sample; }, render: render
};
})();
</script>
