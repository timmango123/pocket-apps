<title>科學計算機</title>
<style>

    --key: #2a2f34; --key-ink: #eef1f4; --fn: #202428; --fn-ink: #c3ccd5; --op: #4d6680; --op-ink: #ffffff; --eq: #e3a72b; --eq-ink: #231a05;
    --mem: #1c2024; --mem-ink: #b5c0ca; --line: #30363c; --shadow: 0 2px 0 #0b0c0d; --on: #6aa8eb; --on-ink: #0c1a2a; --err: #ff9184;
    --sheet: #1e2226; --sheet-ink: #eef1f4; --muted: #9aa6b1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --body: #181b1e; --lcd: #1c2620; --lcd-ink: #d2e4cc; --lcd-dim: #7f9884; --lcd-edge: #2c3a31;
  --key: #2a2f34; --key-ink: #eef1f4; --fn: #202428; --fn-ink: #c3ccd5; --op: #4d6680; --op-ink: #ffffff; --eq: #e3a72b; --eq-ink: #231a05;

.btn { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); font-weight: 700; font-size: 14px; color: var(--sheet-ink); }
.btn.armed { background: var(--err); border-color: var(--err); color: var(--sheet); }
.menu { position: fixed; z-index: 21; top: calc(max(10px, env(safe-area-inset-top)) + 50px); right: max(16px, env(safe-area-inset-right)); background: var(--sheet); color: var(--sheet-ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 6px; width: 230px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }

/* short phone screens (Safari toolbars, inside the lobby): every key keeps 44 px. 600–700 px: with fx on the memory

  .lcd .res { font-size: 30px; min-height: 34px; } .lcd .res.dim { font-size: 26px; } .lcd .expr { font-size: 18px; min-height: 24px; }
  .k { font-size: 19px; } .k.f { font-size: 14px; } .pad { gap: 5px; } .pads { gap: 6px; }

<script>
(() => {
'use strict';
const KEY = 'sci-calc:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ================= 解析與求值（tokenizer → Shunting-yard → RPN，不使用 eval） ================= */
class CalcError extends Error { constructor(code, msg) { super(code); this.code = code; this.msg = msg || ''; } }
const MSG = {
  incomplete: '算式不完整：最後少了數字',
  noOp: '兩個數字之間少了運算子',
  opFirst: '運算子前面少了數字',
  postFirst: '% ! ² ³ ⁻¹ 前面要先有數字',
  parens: '括號沒有配對：請檢查 ( 和 )',
  badExp: '指數 E 後面要接整數，例如 1E5',
  badChar: '算式裡有無法計算的符號',
  div0: '無法除以 0：請把除數改成不是 0 的數',
  inv0: '0 沒有倒數（x⁻¹ 就是 1÷x）',
  mod0: 'mod 的除數不能是 0',
  pow0: '0 的負次方等於除以 0，無法計算',
  sqrt: '負數不能開平方根：√ 裡要 ≥ 0（負數可用 ∛）',
  ln: 'ln 裡的數要大於 0',
  log: 'log 裡的數要大於 0',
  asin: 'sin⁻¹ 只接受 −1 到 1 之間的數',
  acos: 'cos⁻¹ 只接受 −1 到 1 之間的數',
  tan: 'tan 在 90°、270°… 沒有值：請避開 90 的奇數倍',
  factNeg: '負整數沒有階乘：n! 要用 0 以上的數',
  factBig: '太大了：n! 最大只能算到 170!',
  powNeg: '負數的小數次方沒有實數解：可改用 ∛ 或正的底數',
  domain: '超出定義域：請檢查函數裡的數',
  overflow: '結果太大（超過約 1.8E+308）：請改小一點的數'
};
const FN_NAMES = ['sin⁻¹', 'cos⁻¹', 'tan⁻¹', 'sin', 'cos', 'tan', 'ln', 'log', 'abs', '√', '∛'];
const POSTFIX = ['%', '!', '²', '³', '⁻¹'];
const BIN = { '+': [1, 'L'], '−': [1, 'L'], '×': [2, 'L'], '÷': [2, 'L'], 'mod': [2, 'L'], '^': [4, 'R'] };
const NEG_PREC = 3, FN_PREC = 5;
// lead: the result of the last "=" ({ s: shown text, v: full value }). While the expression still starts with that
// text, the full value is used, so 1÷3 = × 3 = gives 1, not 0.999999999999999.
function tokenize(src, lead) {
  const s = src.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
  const out = []; let i = 0;
  if (lead && lead.s && s.startsWith(lead.s) && !/^[\d.E]/.test(s.slice(lead.s.length))) { out.push({ t: 'num', v: lead.v, p: 0 }); i = lead.s.length; }
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ') { i++; continue; }
    const num = /^(\d+\.?\d*|\.\d+)(E[−+]?\d+)?/.exec(s.slice(i));
    if (num) {
      if (/E$/.test(num[0]) || (s[i + num[0].length] === 'E')) throw new CalcError('syntax', MSG.badExp);
      out.push({ t: 'num', v: Number(num[0].replace('−', '-')), p: i }); i += num[0].length; continue;
    }
    const p = i;
    if (s.startsWith('Ans', i)) { out.push({ t: 'const', v: 'Ans', p }); i += 3; continue; }
    if (s.startsWith('mod', i)) { out.push({ t: 'bin', v: 'mod', p }); i += 3; continue; }
    const fn = FN_NAMES.find(f => s.startsWith(f, i));

    st.prevLine = full + ' ='; st.expr = r; st.lead = { s: r, v }; st.lastOp = op; st.justEq = true; st.errMsg = ''; st.sample = false;
  } catch (err) {
    st.errMsg = err.msg || ERR_TEXT[err.code] || MSG.incomplete;
    // a digit after "算式不完整" finishes the expression; after any other error it starts a new one
    st.errFresh = !(err.code === 'syntax' && (BIN_TAIL.test(st.expr) || /[(E−+]$/.test(st.expr)));
  }
}
function currentValue() { if (st.justEq) return st.ans; try { return calc(st.expr); } catch (e) { return null; } }
function memory(act) {
  if (act === 'MC') { st.memory = 0; }
  else if (act === 'MR') { startFresh(); if (st.sample) { st.expr = ''; st.sample = false; } const r = formatNum(st.memory); if (VALUE_TAIL.test(st.expr)) st.expr += '×'; st.expr += r.startsWith('−') ? '(' + r + ')' : r; }
  else { const v = currentValue(); if (v == null) { toast('目前算式無法計算'); return; } st.memory += act === 'M+' ? v : -v; toast('記憶 = ' + groupDisplay(formatNum(st.memory))); }
  store.set('memory', st.memory);
}

/* ================= 畫面 ================= */
// the result line never clips: shrink the font to fit (down to 20 px), then fall back to fewer digits in E notation
const MIN_RES_PX = 20;
function fitRes(res, num) {
  res.style.fontSize = '';
  const fits = () => res.scrollWidth <= res.clientWidth + 0.5;
  if (res.classList.contains('err') || fits()) return;
  const base = parseFloat(getComputedStyle(res).fontSize) || 30;
  let fs = Math.max(MIN_RES_PX, Math.floor(base * res.clientWidth / res.scrollWidth));
  res.style.fontSize = fs + 'px';
  while (!fits() && fs > MIN_RES_PX) res.style.fontSize = --fs + 'px';
  if (fits() || num == null || !Number.isFinite(num)) return;
  for (let d = 13; d >= 0; d--) { res.textContent = sciStr(num, d); if (fits()) return; }
}
function render() {
  const ex = $('#expr'), res = $('#res');
  if (st.justEq) {
    // after "=": the line above shows what was computed, the big line the result (not the result twice)
    ex.textContent = st.prevLine; ex.classList.add('done');
  } else {
    const ghost = openParens(st.expr);
    ex.innerHTML = esc(st.expr) + (ghost ? '<span class="ghost">' + ')'.repeat(ghost) + '</span>' : '') + '<span class="caret" aria-hidden="true"></span>';
    ex.classList.remove('done');
  }
  ex.scrollLeft = ex.scrollWidth;
  ex.classList.toggle('more-left', ex.scrollWidth > ex.clientWidth + 1);
  $('#prev').textContent = st.justEq ? '' : st.prevLine;
  res.className = 'res';
  let num = null;
  if (st.errMsg) { res.textContent = st.errMsg; res.classList.add('err'); }
  else if (st.justEq) { res.textContent = groupDisplay(st.expr); num = st.ans; }
  else {
    let txt = '';
    try { if (st.expr) { num = calc(st.expr); txt = groupDisplay(formatNum(num)); } } catch (e) { txt = ''; num = null; }
    res.textContent = txt || (st.expr ? '' : '0'); res.classList.add('dim');
  }
  fitRes(res, num);
  res.scrollLeft = res.scrollWidth;
  $('#flag-angle').textContent = settings.angle.toUpperCase();
  $('#flag-2nd').className = st.second ? 'on' : ''; $('#flag-2nd').style.visibility = st.second ? 'visible' : 'hidden';
  $('#flag-m').style.visibility = st.memory ? 'visible' : 'hidden';
  $('#flag-sample').style.visibility = st.sample ? 'visible' : 'hidden';
  $('#btn-angle').textContent = settings.angle.toUpperCase(); $('#btn-angle').setAttribute('aria-label', '角度單位，目前為' + (settings.angle === 'deg' ? '度' : '弧度'));
  $('#btn-second').setAttribute('aria-pressed', String(st.second));
  const page = PAGE_MQ.matches, showSci = page ? st.sciPage : settings.sci;
  $('#btn-fx').setAttribute('aria-pressed', String(showSci));
  $('#pads').classList.toggle('no-sci', !showSci);
  $('#pads').classList.toggle('page', page);
  saveExpr();
}
let toastT = 0, toastFn = null, toastShownAt = 0;
function toast(m, actLabel, fn) {
  const t = $('#toast'), b = $('#toast-act');
  $('#toast-msg').textContent = m;
  toastFn = fn || null; b.hidden = !fn; b.textContent = fn ? actLabel : '';
  t.classList.add('show'); toastShownAt = performance.now();
  clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove('show'); toastFn = null; b.hidden = true; b.textContent = ''; }, fn ? 5000 : 1800);
}
$('#toast-act').addEventListener('click', () => { const fn = toastFn; toastFn = null; clearTimeout(toastT); $('#toast').classList.remove('show'); $('#toast-act').hidden = true; $('#toast-act').textContent = ''; if (fn) fn(); });
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製 ' + text); }
  catch (e) { const el = $('#res'); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('無法自動複製，已選取結果'); }
}
function resultText() { if (st.justEq) return st.expr; const v = currentValue(); return v == null ? '' : formatNum(v); }

/* ================= 按鍵事件 ================= */
function press(act, fromSci) {
  if (settings.vibrate && navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
  if (act === 'AC') clearAll();
  else if (act === 'BS') backspace();
  else if (act === '=') equals();
  else if (act === 'MC' || act === 'MR' || act === 'M+' || act === 'M-') memory(act);
  else { insert(act); if (st.second && SECOND_ACTS.has(act)) { st.second = false; renderKeys(); } }
  // short screen: a key on the scientific page goes back to the digits
  if (fromSci && PAGE_MQ.matches) st.sciPage = false;
  render();
}
const SECOND_ACTS = new Set(Object.values(SECOND).map(x => x[1]));

/* ---------- 觸控層 ----------
   Calculator keys act on pointerdown (fast typing; two thumbs keep the order they pressed in) and nothing else happens
   when that finger lifts. Every other button (top bar, drawer, menu, history, toast) acts on pointerup of the same
   pointerId, if it moved < 10 px or was released within 16 px of the button, through el.click() under `firing`; that also
   works while another finger rests on the screen (Chromium sends no click then). pointerdown is preventDefault'ed, so no
   compatibility mousedown/focus lands on a screen that just changed. The browser's own click that follows (Chromium 141:
   detail 0, no pointerType) is swallowed in the capture phase: any click within 800 ms of lastTapUp, unless Enter/Space
   came after it (lastKey > lastTapUp). A lone detail-0 click (keyboard, screen reader) runs once. */
const downs = new Map();
let firing = false, lastTapUp = -1e9, lastKey = -1e9;
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') lastKey = performance.now(); }, true);
addEventListener('keyup', e => { if (e.key === ' ') lastKey = performance.now(); }, true);
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target instanceof Element ? e.target : null; if (!t) return;
  const k = t.closest('.pads .k');
  if (k) {
    e.preventDefault();
    downs.set(e.pointerId, { key: true });
    k.classList.add('pressed'); setTimeout(() => k.classList.remove('pressed'), 110);
    press(k.dataset.act, !!k.closest('#pad-sci'));
    return;
  }
  const el = t.closest('button, .scrim');
  if (!el || el.disabled) return;
  e.preventDefault();
  downs.set(e.pointerId, { el, x: e.clientX, y: e.clientY, t: performance.now() });
});
document.addEventListener('pointerup', e => {
  const d = downs.get(e.pointerId); if (!d) return;
  downs.delete(e.pointerId);
  lastTapUp = performance.now();
  if (d.key) return;
  const el = d.el;
  if (!el.isConnected || el.disabled || !el.getClientRects().length || el.closest('[hidden]')) return;
  if (el.id === 'toast-act' && (d.t < toastShownAt || !$('#toast').classList.contains('show'))) return;   // only a finger that came down after the toast appeared
  const r = el.getBoundingClientRect(), m = 16;
  const still = Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10;
  const inBox = e.clientX >= r.left - m && e.clientX <= r.right + m && e.clientY >= r.top - m && e.clientY <= r.bottom + m;
  if (!still && !inBox) return;
  firing = true; try { el.click(); } finally { firing = false; }
});
document.addEventListener('pointercancel', e => { if (downs.delete(e.pointerId)) lastTapUp = performance.now(); });
addEventListener('click', e => {
  if (firing) return;
  const recentTap = performance.now() - lastTapUp < 800 && !(lastKey > lastTapUp);
  if (recentTap || (e.isTrusted && (e.detail > 0 || e.pointerType))) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
document.addEventListener('contextmenu', e => { if (e.target instanceof Element && e.target.closest('button')) e.preventDefault(); });

const pads = $('#pads');
pads.addEventListener('click', e => { const k = e.target.closest('.k'); if (!k) return; press(k.dataset.act, !!k.closest('#pad-sci')); });   // keyboard only: pointer clicks never get here
pads.addEventListener('contextmenu', e => e.preventDefault());

$('#btn-angle').addEventListener('click', () => { settings.angle = settings.angle === 'deg' ? 'rad' : 'deg'; saveSettings(); render(); });
$('#btn-second').addEventListener('click', () => { st.second = !st.second; if (st.second && PAGE_MQ.matches) st.sciPage = true; renderKeys(); render(); });
$('#btn-fx').addEventListener('click', () => { if (PAGE_MQ.matches) st.sciPage = !st.sciPage; else { settings.sci = !settings.sci; saveSettings(); } render(); });
addEventListener('resize', () => render());

/* 顯示窗手勢：左滑刪一字、長按複製 */
(() => {
  const lcd = $('#lcd'); let sx = 0, sy = 0, t0 = 0, lp = 0, moved = false;
  lcd.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; t0 = Date.now(); moved = false; clearTimeout(lp); lp = setTimeout(() => { if (!moved) { const t = resultText(); if (t) copyText(t); } }, 600); });
  lcd.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) { moved = true; clearTimeout(lp); } });
  lcd.addEventListener('pointerup', e => { clearTimeout(lp); const dx = e.clientX - sx, dy = e.clientY - sy; if (dx < -40 && Math.abs(dy) < 40 && Date.now() - t0 < 800) { backspace(); render(); } });
  lcd.addEventListener('pointercancel', () => clearTimeout(lp));
  lcd.addEventListener('contextmenu', e => e.preventDefault());
})();

/* 歷史抽屜 */
function renderHistory() {
  const ul = $('#hist');
  if (!history.length) { ul.innerHTML = '<li class="empty">還沒有紀錄。按「=」後會出現在這裡。</li>'; return; }
  ul.innerHTML = history.slice().reverse().map((h, i) => { const idx = history.length - 1 - i; return '<li><button type="button" class="use" data-h="' + idx + '" id="hist-use-' + idx + '"><span>' + (h.sample ? '（範例）' : '') + esc(h.expr) + ' =</span><b>' + esc(groupDisplay(h.result)) + '</b></button><button type="button" class="cp" data-cp="' + idx + '" aria-label="複製 ' + esc(h.result) + '">複製</button></li>'; }).join('');
}
// focus moves into / back out of the drawer only for keyboard use; after a touch nothing gets a focus ring
function openDrawer(open) {
  const wasOpen = !$('#drawer').hidden, kb = !firing;
  $('#drawer').hidden = !open; $('#scrim').hidden = !open && $('#menu').hidden;
  if (open) { renderHistory(); if (kb) $('#hist-close').focus(); }
  else if (wasOpen) { if (kb) $('#btn-history').focus(); else if (document.activeElement && document.activeElement.closest('#drawer')) document.activeElement.blur(); }
}
$('#btn-history').addEventListener('click', () => { openMenu(false); openDrawer(true); });
$('#hist-close').addEventListener('click', () => openDrawer(false));
$('#scrim').addEventListener('click', () => { openDrawer(false); openMenu(false); });
let hlp = 0, hLong = false;
$('#hist').addEventListener('pointerdown', e => { const b = e.target.closest('[data-h]'); if (!b) return; hLong = false; clearTimeout(hlp); hlp = setTimeout(() => { hLong = true; copyText(history[+b.dataset.h].result); }, 550); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('#hist').addEventListener(ev, () => clearTimeout(hlp)));
$('#hist').addEventListener('click', e => {
  const cp = e.target.closest('[data-cp]'); if (cp) { copyText(history[+cp.dataset.cp].result); return; }
  const b = e.target.closest('[data-h]'); if (!b) return;
  if (hLong) { hLong = false; return; }
  const r = history[+b.dataset.h].result;
  startFresh(); if (st.sample) st.expr = ''; st.errMsg = ''; st.sample = false;
  if (VALUE_TAIL.test(st.expr)) st.expr += '×';
  st.expr += r.startsWith('−') && st.expr ? '(' + r + ')' : r;
  openDrawer(false); render();
});
$('#hist-clear').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!history.length) { toast('沒有紀錄可以清除'); return; }
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = '確定清除？'; setTimeout(() => { b.classList.remove('armed'); b.textContent = '清除'; }, 3000); return; }
  const saved = history.slice();
  history = []; store.set('history', history); b.classList.remove('armed'); b.textContent = '清除'; renderHistory();
  toast('已清除 ' + saved.length + ' 筆紀錄', '復原', () => {
    history = saved.concat(history).slice(-100); store.set('history', history);
    if (!$('#drawer').hidden) renderHistory();
    toast('已復原 ' + saved.length + ' 筆紀錄');
  });
});

/* 設定選單 */
function applyTheme() { if (settings.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', settings.theme); $('#menu-theme').textContent = '主題：' + TL[settings.theme]; $('#menu-vibrate').textContent = '按鍵震動：' + (settings.vibrate ? '開' : '關'); }
function openMenu(open) { $('#menu').hidden = !open; $('#btn-menu').setAttribute('aria-expanded', String(open)); if (open) $('#scrim').hidden = false; else if ($('#drawer').hidden) $('#scrim').hidden = true; }
$('#btn-menu').addEventListener('click', () => openMenu($('#menu').hidden));
$('#menu-theme').addEventListener('click', () => { settings.theme = THEMES[(THEMES.indexOf(settings.theme) + 1) % 3]; saveSettings(); applyTheme(); });
$('#menu-vibrate').addEventListener('click', () => { settings.vibrate = !settings.vibrate; saveSettings(); applyTheme(); });
$('#menu-copy').addEventListener('click', () => { const t = resultText(); openMenu(false); if (t) copyText(t); else toast('目前沒有結果'); });

/* 實體鍵盤 */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { if (!$('#drawer').hidden || !$('#menu').hidden) { openDrawer(false); openMenu(false); return; } press('AC'); e.preventDefault(); return; }
  if (!$('#drawer').hidden || !$('#menu').hidden) return;
  const map = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', '^': '^', '(': '(', ')': ')', '%': '%', '!': 'fact', '.': '.', ',': '.', 'p': 'π', 'e': 'e', 'Enter': '=', '=': '=', 'Backspace': 'BS', 'Delete': 'AC' };
  let act = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (!act) return;
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.closest('.k, .tb') && document.activeElement.matches(':focus-visible')) return; // 讓按鈕自己處理
  e.preventDefault(); press(act);
});

/* ================= 自我測試（30 組） ================= */
function selfTest() {
  const cases = [
    ['2+3×4', '14'], ['2^3^2', '512'], ['−2^2', '−4'], ['0.1+0.2', '0.3'], ['sin(30)', '0.5', 'deg'], ['sin(π÷6)', '0.5', 'rad'],
    ['(1+2)(3+4)', '21'], ['2π', '6.28318530717959'], ['3(4+5)', '27'], ['50+10%', '55'], ['10%', '0.1'], ['200−25%', '150'],
    ['50×10%', '5'], ['5!', '120'], ['0!', '1'], ['170!', '7.25741561530799E+306'], ['171!', 'E:overflow'], ['1÷0', 'E:div0'],
    ['√(−1)', 'E:domain'], ['log(0)', 'E:domain'], ['ln(e)', '1'], ['log(1000)', '3'], ['√(16)+∛(27)', '7'], ['sin(180)', '0', 'deg'],
    ['cos(90)', '0', 'deg'], ['tan(45)', '1', 'deg'], ['tan(90)', 'E:domain', 'deg'], ['(2+3', '5'], ['2×(3+(4−1', '12'], ['0.5!', '0.88622692545276'],
    ['10 mod 3', '1'], ['2^−1', '0.5'], ['−3²', '−9'], ['abs(−7)', '7'], ['4⁻¹', '0.25'], ['1.5E3+1', '1501'], ['2+', 'E:syntax'], ['sin⁻¹(1)', '90', 'deg']
  ];
  const fails = [];
  cases.forEach(([ex, want, ang]) => {
    let got;
    try { got = formatNum(evaluate(ex, { angle: ang || 'deg', ans: 0 })); } catch (e) { got = 'E:' + e.code; }
    if (got !== want) fails.push(ex + ' → ' + got + '（應為 ' + want + '）');
  });
  return { total: cases.length, fails };
}

renderKeys(); applyTheme(); render();
window.__sciCalc = { formatNum, evaluate: (s, angle) => { try { return formatNum(evaluate(s, { angle: angle || 'deg', ans: st.ans })); } catch (e) { return 'E:' + e.code; } }, selfTest, state: st };
})();
</script>
