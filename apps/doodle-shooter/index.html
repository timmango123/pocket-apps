<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
(() => {

const LW = 360;
let LH = 640, SC = 1, DPR = 1;
const HAND = '"Caveat", "LXGW WenKai TC", "Kaiti TC", cursive';
const KAI = '"LXGW WenKai TC", "Kaiti TC", "BiauKai", serif';
const C = { paper: '#fbf8ef', rule: '#a9c4e6', margin: '#e58a8a', ink: '#1d3fa8', pencil: '#2a2a2e', red: '#d23b3b', hole: '#e9e3d4' };

const store = {
  get(k, d) { try { const v = localStorage.getItem('doodleShooter.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('doodleShooter.' + k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('best', 0) | 0;

/* ================= audio ================= */
let ac = null, noiseBuf = null, muted = !!store.get('muted', false);
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}

  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + d);
}
let shotTick = 0;
const sfx = {
  shoot() { if ((shotTick++ & 1) === 0) tone(1300, .045, 'triangle', .012, 700); },
  hit() { tone(260, .03, 'square', .015); },
  boom() { noise(.28, 1600, .18); },
  big() { noise(.9, 2400, .32); tone(90, .7, 'sawtooth', .06, 40); },

  warn() { for (let i = 0; i < 4; i++) tone(i & 1 ? 330 : 440, .22, 'square', .04, 0, i * .25); },

const muteBtn = $('#muteBtn');

  muteBtn.setAttribute('aria-pressed', String(muted));
  $('#icoSnd').innerHTML = muted ? '<path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>' : '<path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="M16.5 8.5c1.6 2 1.6 5 0 7M19 6c3 3.3 3 8.7 0 12"/>';
}

syncMute();

/* ================= wobbly pen ================= */
let boil = 0;
function hash(n) {
  n = (n << 13) ^ n;
  n = (Math.imul(n, (Math.imul(Math.imul(n, n), 15731) + 789221) | 0) + 1376312589) | 0;
  return (n & 0x7fffffff) / 1073741823.5 - 1;

const CLOSED = 1, SMOOTH = 2;
const buf = new Float32Array(128);
function pen(pts, x, y, sx, sy, rot, flags, seed, amp) {
  const n = pts.length >> 1, c = Math.cos(rot), s = Math.sin(rot);

  }
  ctx.beginPath();
  if (flags & SMOOTH) {
    if (flags & CLOSED) {
      ctx.moveTo((buf[n * 2 - 2] + buf[0]) / 2, (buf[n * 2 - 1] + buf[1]) / 2);
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        ctx.quadraticCurveTo(buf[i * 2], buf[i * 2 + 1], (buf[i * 2] + buf[j * 2]) / 2, (buf[i * 2 + 1] + buf[j * 2 + 1]) / 2);

    } else {
      ctx.moveTo(buf[0], buf[1]);
      for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(buf[i * 2], buf[i * 2 + 1], (buf[i * 2] + buf[i * 2 + 2]) / 2, (buf[i * 2 + 1] + buf[i * 2 + 3]) / 2);
      ctx.lineTo(buf[n * 2 - 2], buf[n * 2 - 1]);
    }
  } else {
    ctx.moveTo(buf[0], buf[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(buf[i * 2], buf[i * 2 + 1]);
    if (flags & CLOSED) ctx.closePath();
  }

function sketch(pts, x, y, sx, sy, rot, flags, seed, fill, ink, lw, twice) {
  pen(pts, x, y, sx, sy, rot, flags, seed, 1.1);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.stroke();
  if (twice) {
    pen(pts, x + 0.6, y - 0.4, sx * 1.02, sy * 1.02, rot + 0.02, flags, seed + 17, 1.8);
    ctx.globalAlpha = 0.45; ctx.lineWidth = lw * 0.6; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function line(pts, x, y, sx, sy, ink, lw, seed, flags = 0) {
  pen(pts, x, y, sx, sy, 0, flags, seed, 0.8); ctx.strokeStyle = ink; ctx.lineWidth = lw; ctx.stroke();
}
function dot(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = col; ctx.fill(); }

/* shapes, unit sized */
function ring(n, wob, over, start) {
  const a = [], tot = Math.PI * 2 + over;
  for (let i = 0; i < n; i++) { const t = start + i / (n - 1) * tot, r = 1 + Math.sin(i * 2.3) * wob; a.push(Math.cos(t) * r, Math.sin(t) * r); }
  return a;
}
const HANDCIRC = ring(16, 0.04, 0.55, -2.2);
const CIRC = ring(11, 0, -Math.PI * 2 / 11, 0);
const ROCKET = [0, -1.35, .38, -.75, .45, .45, .9, 1.0, .42, .85, -.42, .85, -.9, 1.0, -.45, .45, -.38, -.75];
const BAT = [-1.25, -.35, -.75, -.55, -.55, -.05, -.25, -.3, 0, .1, .25, -.3, .55, -.05, .75, -.55, 1.25, -.35, .8, .35, .45, .2, 0, .55, -.45, .2, -.8, .35];
const STAR = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i & 1 ? .45 : 1; STAR.push(Math.cos(a) * r, Math.sin(a) * r); }
const CLOUD = []; for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, r = 1 + 0.13 * Math.abs(Math.sin(a * 3.5)); CLOUD.push(Math.cos(a) * r, Math.sin(a) * r * 0.82); }
const DOME = [-1, .05, -.95, -.5, -.62, -.92, 0, -1.08, .62, -.92, .95, -.5, 1, .05, .6, .18, 0, .1, -.6, .18];
const RECT = [-1, -1, 1, -1, 1, 1, -1, 1];
const HEART = [0, -.35, .45, -.95, 1.05, -.5, .75, .25, 0, .95, -.75, .25, -1.05, -.5, -.45, -.95];
const ZIG = [-1, 0, -.6, -.5, -.2, .2, .2, -.5, .6, .2, 1, -.3];
const BROW_L = [-1, -.35, -.2, 0], BROW_R = [1, -.35, .2, 0];

const WORDS = ['砰！', '啪！', '嘣！', '咻！', '轟！'];

function update(dt) {

  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }

  if (state === 'play') {
    // move
    const kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    const ky = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    if (kx || ky) { P.x += kx * 280 * dt; P.y += ky * 280 * dt; clampP(); }
    if (P.inv > 0) P.inv -= dt;
    // fire
    P.fireT -= dt;
    if (P.fireT <= 0 && phase !== 'clear') {
      P.fireT = 0.11; const y = P.y - 18, x = P.x;
      if (P.power === 1) pShot(x, y, 0);
      else if (P.power === 2) { pShot(x - 6, y, 0); pShot(x + 6, y, 0); }
      else if (P.power === 3) { pShot(x, y, 0); pShot(x - 6, y, -0.15); pShot(x + 6, y, 0.15); }
      else { pShot(x - 6, y, 0); pShot(x + 6, y, 0); pShot(x - 9, y, -0.2); pShot(x + 9, y, 0.2); }
      sfx.shoot();

    phaseT += dt;

function drawHud() {
  const top = Math.max(0, safeTop / SC);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = '700 30px ' + HAND; ctx.fillStyle = C.ink;
  ctx.fillText(String(score), 48, top + 34);
  for (let i = 0; i < P.lives; i++) sketch(HEART, 56 + i * 20, top + 50, 7, 7, 0, CLOSED | SMOOTH, 40 + i, '#ff9aa8', C.red, 1.6, false);
  ctx.font = '700 15px ' + KAI; ctx.fillStyle = C.pencil;
  ctx.fillText('火力 ' + '★'.repeat(P.power) + '☆'.repeat(4 - P.power) + '　第 ' + stage + ' / ' + MAX_STAGE + ' 關', 48, LH - 12);
}
function drawBanner() {
  if (!banner) return;
  const t = banner.t, a = Math.min(1, t * 4, (banner.dur - t) * 3);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  const y = LH * 0.42, rot = -0.05;
  ctx.save(); ctx.translate(LW / 2, y); ctx.rotate(rot);
  ctx.font = '700 44px ' + KAI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = C.paper; ctx.strokeText(banner.a, 0, 0);
  ctx.fillStyle = banner.warn ? C.red : C.ink; ctx.fillText(banner.a, 0, 0);
  ctx.font = '700 20px ' + KAI; ctx.lineWidth = 6; ctx.strokeText(banner.b, 0, 40); ctx.fillStyle = C.pencil; ctx.fillText(banner.b, 0, 40);
  if (banner.c) { ctx.font = '700 22px ' + HAND; ctx.strokeText(banner.c, 0, 70); ctx.fillStyle = C.red; ctx.fillText(banner.c, 0, 70); }
  ctx.restore();
  // scribble underline
  line(ZIG, LW / 2, y + (banner.c ? 94 : 66), 90, 5, banner.warn ? C.red : C.ink, 2.2, 61, SMOOTH);
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  ctx.lineJoin = 'round';
  if (shakeA > 0) ctx.translate((Math.random() - .5) * shakeA, (Math.random() - .5) * shakeA);
  drawPaper();
  if (state === 'title') { drawTitleDemo(); return; }
  drawPicks();
  for (const e of ens) if (e.on) drawEnemy(e);
  if (boss) drawBoss(boss);
  drawBullets();
  drawPlayer();
  drawParts();
  if (boss && phase === 'boss') drawBossBar(boss);
  drawHud();
  drawBanner();
}
function drawTitleDemo() {
  const t = time;
  sketch(ROCKET, LW / 2 + Math.sin(t) * 40, LH * 0.82, 16, 16, Math.sin(t) * 0.1, CLOSED, 1, '#fff', C.ink, 2.4, true);
  sketch(HANDCIRC, LW * 0.25, LH * 0.15 + Math.sin(t * 1.3) * 8, 15, 14, 0, SMOOTH, 4, '#b4efbf', C.pencil, 2, false); face(LW * 0.25, LH * 0.15 + Math.sin(t * 1.3) * 8 + 1, 12, 4, true);
  sketch(STAR, LW * 0.75, LH * 0.13, 18, 18, t, CLOSED, 6, '#ffd66e', C.pencil, 2, true); face(LW * 0.75, LH * 0.13 + 1, 9, 6, true);
}

/* ================= sizing & loop ================= */
let safeTop = 0;
function resize() {
  const vw = innerWidth, vh = page.parentElement.clientHeight || innerHeight;
  const w = Math.min(vw, Math.round(vh * 0.62), 560);
  page.style.width = w + 'px';
  const r = page.getBoundingClientRect();
  SC = r.width / LW; LH = r.height / SC;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  const probe = getComputedStyle(document.querySelector('.tools')).top;
  safeTop = Math.max(0, (parseFloat(probe) || 10) - 10);
  clampP();
}
addEventListener('resize', resize);
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(document.body);
resize();
P.x = LW / 2; P.y = LH - 90;

let last = performance.now(), running = true;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!reduce) boil = (now / 125) | 0;
  if (state === 'title') time += dt;
  else if (!paused && state !== 'over') update(dt);
  render();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (state === 'play' && !paused) setPause(true); }
  else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
});
requestAnimationFrame(frame);
})();
</script>
