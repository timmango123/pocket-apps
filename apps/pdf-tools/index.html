<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>PDF 工具箱</title>
<style>
:root{
  --bg:#ebe6da; --surface:#fffdf8; --surface-2:#f4efe4; --ink:#27241d; --ink-2:#5c574b; --ink-3:#7f796b;
  --line:#d8d0bf; --line-strong:#b6ad9b;
  --accent:#b5301d; --accent-ink:#ffffff; --accent-soft:#f8e1da;
  --paper:#ffffff; --paper-line:#cfc7b6; --paper-ink:#2a2720; --shade:rgba(39,36,29,.14);
  --ok:#2a6f4e; --ok-soft:#dcefe4; --warn:#8a5a00; --warn-soft:#f7ebcc;
  --focus:#1c5fd1; --scrim:rgba(30,26,18,.5); --shadow:0 1px 0 rgba(40,30,10,.05), 0 8px 22px -12px rgba(40,30,10,.35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --surface:#211e17; --surface-2:#2a261d; --ink:#ece6d8; --ink-2:#b5ad9b; --ink-3:#8e8777;
    --line:#3a3529; --line-strong:#57503f;
    --accent:#ff7f61; --accent-ink:#2b0e06; --accent-soft:#4a2017;
    --paper:#efe9db; --paper-line:#c9c0ac; --paper-ink:#2a2720; --shade:rgba(0,0,0,.45);
    --ok:#6cc79a; --ok-soft:#1f3a2d; --warn:#f0c060; --warn-soft:#3d2e0e;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --surface:#211e17; --surface-2:#2a261d; --ink:#ece6d8; --ink-2:#b5ad9b; --ink-3:#8e8777;
  --line:#3a3529; --line-strong:#57503f;
  --accent:#ff7f61; --accent-ink:#2b0e06; --accent-soft:#4a2017;
  --paper:#efe9db; --paper-line:#c9c0ac; --paper-ink:#2a2720; --shade:rgba(0,0,0,.45);
  --ok:#6cc79a; --ok-soft:#1f3a2d; --warn:#f0c060; --warn-soft:#3d2e0e;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100%;
  padding:10px 16px calc(84px + env(safe-area-inset-bottom));
  background-image:radial-gradient(rgba(0,0,0,.06) 0.6px, transparent 0.7px);background-size:14px 14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{flex:none;width:44px;height:44px;position:relative}
.mark svg{width:44px;height:44px;display:block}
.brand h1{margin:0;font-size:18px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.brand h1 small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;min-width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.danger{color:var(--accent)}

/* add zone */
.add{display:flex;align-items:center;gap:10px;min-height:52px;padding:5px 10px 5px 6px;margin-bottom:8px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface);cursor:pointer;user-select:none;-webkit-user-select:none}
.add:hover,.add.over{border-color:var(--accent);background:var(--accent-soft)}
.add .plus{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.add .plus svg{width:22px;height:22px}
.add strong{display:block;font-size:14.5px;line-height:1.25}
.add span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.privacy{font-size:12px;color:var(--ink-3);margin:6px 2px 10px;display:flex;align-items:center;gap:6px}
.privacy svg{width:14px;height:14px;flex:none}

/* sample banner */
.sample{display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.35;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--line-strong);border-radius:12px;padding:4px 4px 4px 12px;margin-bottom:10px}
.sample span{flex:1;min-width:0}
.sample button{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;color:var(--ink);white-space:nowrap}

/* sources */
.srcs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;margin-bottom:4px}
.srcs:empty{display:none}
.src{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:min(78vw,320px)}
.src .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.src .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.src .pc{flex:none;color:var(--ink-3);font-size:12px}
.src .rm{flex:none;width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.src .rm:hover{background:var(--surface-2);color:var(--accent)}
.src .rm svg{width:16px;height:16px}

/* section head */
.sechead{display:flex;align-items:center;gap:8px;margin:2px 2px 4px}
.sechead h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.sechead .meta{font-size:12px;color:var(--ink-3)}
.sechead h2{white-space:nowrap}
.lnk{flex:none;min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13.5px;border-radius:9px}
.lnk:disabled{color:var(--ink-3);font-weight:500}
.sechead .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* grid of page cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:359px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 6px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .15s;cursor:pointer}
.card.sel{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--surface) 70%)}
.card.dragging{opacity:.35}
.card .handle{position:absolute;left:0;top:0;width:44px;height:44px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;border-radius:14px 0 12px 0;touch-action:none;cursor:grab}
.card .handle svg{width:18px;height:18px}
.card .check{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:var(--accent-ink)}
.card.sel .check{background:var(--accent);border-color:var(--accent)}
.card .check svg{width:14px;height:14px;opacity:0}
.card.sel .check svg{opacity:1}
.card .idx{position:absolute;left:44px;top:10px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.sheetwrap{height:96px;display:grid;place-items:center;margin:14px 0 4px}
.sheet{position:relative;background:var(--paper);border:1px solid var(--paper-line);box-shadow:0 2px 6px -2px var(--shade);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;color:var(--paper-ink);overflow:hidden;transition:transform .25s}
.sheet::before{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;background:linear-gradient(225deg,var(--surface) 50%,var(--paper-line) 50%,var(--paper) 54%)}
.sheet.img::before{display:none}
.sheet .pno{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1}
.sheet.land .pno{font-size:18px}
.sheet .rules{position:absolute;left:14%;right:14%;top:16%;height:4px;border-top:1.5px solid var(--paper-line);box-shadow:0 6px 0 -0.5px var(--paper-line),0 12px 0 -0.5px var(--paper-line)}
.sheet.land .rules{top:14%;box-shadow:0 6px 0 -0.5px var(--paper-line)}
.sheet.img{padding:0}
.sheet img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0;padding:0 2px}
.card .meta .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.card .meta .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.card .size{font-size:11.5px;color:var(--ink-3);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rotbadge{display:inline-block;margin-left:4px;padding:0 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:10.5px}
.card .acts{display:flex;gap:4px;margin-top:6px}
.card .acts button{flex:1;min-width:0;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.card .acts button:disabled{opacity:.35;cursor:default}
.card .acts button svg{width:19px;height:19px}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;transform:rotate(2deg);box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}

.empty{border:1.5px dashed var(--line-strong);border-radius:14px;padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px;background:var(--surface)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* settings */
details.set{margin:14px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.set summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:4px 12px 4px 14px;font-weight:700;font-size:14px;cursor:pointer}
details.set summary::-webkit-details-marker{display:none}
details.set summary .sum{font-weight:500;font-size:12px;color:var(--ink-3);margin-left:8px}
details.set summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.set[open] summary svg{transform:rotate(180deg)}
.setbody{padding:4px 12px 12px;display:grid;gap:12px}
.field .lab{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:0 4px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.field input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface-2);font-size:16px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -14px rgba(0,0,0,.4)}
.bar .in{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center}
.primary{flex:1;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:disabled{opacity:.45}
.primary svg{width:20px;height:20px}
.selbar{display:flex;gap:4px;width:100%}
.selbar button{flex:1;min-width:0;height:52px;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:0 2px}
.selbar button svg{width:20px;height:20px}
.selbar button:disabled{opacity:.35}
.selbar button.danger{color:var(--accent)}
.selbar .cnt{flex:0 0 auto;display:flex;align-items:center;font-size:13px;font-weight:700;padding:0 8px;color:var(--ink)}

/* sheet (export) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media (min-width:640px){.scrim{align-items:center}.panel{border-radius:18px}}
.panel h3{margin:0 0 4px;font-size:17px}
.panel p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.panel .row{display:flex;gap:8px;margin-top:8px}
.panel .row button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.panel .row button.primary{border:0;background:var(--accent);color:var(--accent-ink)}
.panel .row button svg{width:19px;height:19px}
.fileline{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.fileline svg{width:28px;height:28px;flex:none;color:var(--accent)}
.fileline .fn{min-width:0;flex:1}
.fileline .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileline .fn span{font-size:12.5px;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.toast button{min-height:36px;padding:0 12px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:inherit;font-weight:700}
.busy{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.busy{animation:none;border-top-color:rgba(255,255,255,.35)}}
@media (min-width:700px){body{padding-left:24px;padding-right:24px}.sheetwrap{height:110px}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><rect x="2" y="2" width="40" height="40" rx="10" fill="var(--accent)"/><path d="M14 9h11l7 7v19a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z" fill="#fff"/><path d="M25 9v7h7" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/><text x="22" y="31" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="10" fill="var(--accent)">PDF</text></svg>
      </div>
      <h1>PDF 工具箱<small>合併・抽頁・旋轉・圖片轉 PDF</small></h1>
    </div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="切換主題"></button>
    <button class="iconbtn danger" id="clearBtn" type="button" hidden aria-label="清空全部頁面" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </header>

  <label class="add" id="drop" for="fileInput" role="button" tabindex="0">
    <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span><strong>加入 PDF 或圖片</strong><span>可多選或拖放；JPG／PNG 各成一頁。全程在你的裝置上處理，不會上傳。</span></span>
  </label>
  <input type="file" id="fileInput" accept=".pdf,application/pdf,image/*" multiple>

  <div class="sample" id="sampleBar" hidden><span>這是 2 份程式產生的<b>範例</b>文件，可直接試用；加入自己的檔案後會自動移除。</span><button type="button" id="dropSamples">移除範例</button></div>

  <div class="srcs" id="srcs"></div>

  <div class="sechead">
    <h2>頁面 <span class="meta num" id="pageCount">0</span></h2>
    <span class="meta hint">以頁碼與紙張大小表示，不產生縮圖；點卡片選取</span>
    <button class="lnk" type="button" id="selAll">全選</button>
  </div>

  <div class="grid" id="grid" role="list"></div>
  <div class="empty" id="empty" hidden><strong>還沒有頁面</strong>加入 PDF 或圖片後，所有頁面會以卡片排在這裡，可以拖曳排序。</div>

  <details class="set" id="setCard">
    <summary><span>圖片頁面與輸出設定<span class="sum" id="setSummary"></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="setbody">
      <div class="field">
        <div class="lab">圖片頁面大小<span id="sizeNote"></span></div>
        <div class="seg" id="sizeSeg" role="group" aria-label="圖片頁面大小">
          <button type="button" data-v="a4">A4</button>
          <button type="button" data-v="letter">Letter</button>
          <button type="button" data-v="fit">依圖片比例</button>
        </div>
      </div>
      <div class="field">
        <div class="lab">邊界</div>
        <div class="seg" id="marginSeg" role="group" aria-label="邊界">
          <button type="button" data-v="0">無</button>
          <button type="button" data-v="5">5 mm</button>
          <button type="button" data-v="10">10 mm</button>
          <button type="button" data-v="20">20 mm</button>
        </div>
      </div>
      <div class="field">
        <div class="lab"><label for="outName">輸出檔名</label></div>
        <input type="text" id="outName" placeholder="合併" autocomplete="off" maxlength="80">
      </div>
    </div>
  </details>
</div>

<div class="bar">
  <div class="in" id="barIn">
    <button class="primary" type="button" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="exportLabel">匯出 PDF</span></button>
  </div>
  <div class="in selbar" id="selBar" hidden>
    <span class="cnt" id="selCnt"></span>
    <button type="button" id="selRotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>旋轉</button>
    <button type="button" id="selKeep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h7l5 5v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M9 14l2 2 4-4"/></svg>只留所選</button>
    <button type="button" class="danger" id="selDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>刪除</button>
    <button type="button" id="selClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>取消</button>
  </div>

function move(i, j) { if (j < 0 || j >= items.length || i === j) return; const [x] = items.splice(i, 1); items.splice(j, 0, x); render(); }
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const i = items.findIndex(it => it.uid === +card.dataset.uid); if (i < 0) return;
  const b = e.target.closest('button[data-act]');
  if (b) { e.stopPropagation(); if (b.dataset.act === 'rot') { items[i].rot = (items[i].rot + 90) % 360; render(); } else if (b.dataset.act === 'up') move(i, i - 1); else if (b.dataset.act === 'down') move(i, i + 1); return; }
  if (e.target.closest('.handle')) return;
  items[i].sel = !items[i].sel; render();
});
$('#grid').addEventListener('keydown', e => {
  const card = e.target.closest('.card'); if (!card || e.target !== card) return;
  const i = items.findIndex(it => it.uid === +card.dataset.uid); if (i < 0) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); items[i].sel = !items[i].sel; render(); focusCard(items[i].uid); }
  else if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); move(i, i - 1); focusCard(items[Math.max(0, i - 1)].uid); }
  else if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); move(i, i + 1); focusCard(items[Math.min(items.length - 1, i + 1)].uid); }
  else if (e.key === 'r' || e.key === 'R') { items[i].rot = (items[i].rot + 90) % 360; render(); focusCard(items[i].uid); }
});
function focusCard(uid) { const el = $(`.card[data-uid="${uid}"]`); if (el) el.focus(); }
$('#selAll').addEventListener('click', () => { const all = items.length && items.every(i => i.sel); items.forEach(i => i.sel = !all); render(); });
$('#selClear').addEventListener('click', () => { items.forEach(i => i.sel = false); render(); });
$('#selRotate').addEventListener('click', () => { items.forEach(i => { if (i.sel) i.rot = (i.rot + 90) % 360; }); render(); });
$('#selDelete').addEventListener('click', () => { const n = items.filter(i => i.sel).length; snapshot(); items = items.filter(i => !i.sel); render(); toast('已刪除 ' + n + ' 頁', 6000, { label: '復原', fn: undo }); });
$('#selKeep').addEventListener('click', () => { const n = items.length - items.filter(i => i.sel).length; snapshot(); items = items.filter(i => i.sel); items.forEach(i => i.sel = false); render(); toast('只保留所選，移除了 ' + n + ' 頁', 6000, { label: '復原', fn: undo }); });
$('#srcs').addEventListener('click', e => {
  const b = e.target.closest('.rm'); if (!b) return; const id = +b.dataset.doc, d = docById(id); if (!d) return;
  snapshot(); items = items.filter(i => i.docId !== id); docs = docs.filter(x => x.id !== id); if (d.sample && !docs.some(x => x.sample)) store.set('seen', true); render();
  toast('已移除「' + d.name + '」', 6000, { label: '復原', fn: undo });
});
$('#clearBtn').addEventListener('click', () => { snapshot(); items = []; docs = []; store.set('seen', true); render(); toast('已清空', 6000, { label: '復原', fn: undo }); });
$('#dropSamples').addEventListener('click', () => removeSamples());
$('#sizeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.size = b.dataset.v; store.set('settings', settings); render(); });
$('#marginSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.margin = +b.dataset.v; store.set('settings', settings); render(); });
$('#outName').value = settings.name || '';
$('#outName').addEventListener('input', () => { settings.name = $('#outName').value.trim(); store.set('settings', settings); });

// file input / drop / paste
$('#fileInput').addEventListener('change', e => { const fs = e.target.files; addFiles(fs); e.target.value = ''; });
$('#drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#fileInput').click(); } });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement) $('#drop').classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
document.addEventListener('paste', e => { const fs = e.clipboardData && e.clipboardData.files; if (fs && fs.length) addFiles(fs); });

// ---------- drag to reorder ----------
let drag = null;
$('#grid').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h || drag) return;
  const card = h.closest('.card'); e.preventDefault();
  const r = card.getBoundingClientRect(); const ghost = card.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  document.body.appendChild(ghost); card.classList.add('dragging');
  drag = { card, ghost, id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
  try { h.setPointerCapture(e.pointerId); } catch (err) { }
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return; e.preventDefault();
  drag.moved = true; drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  if (e.clientY < 70) scrollBy(0, -12); else if (e.clientY > innerHeight - 90) scrollBy(0, 12);
  const over = document.elementFromPoint(e.clientX, e.clientY); const tgt = over && over.closest('.card:not(.ghost)');
  if (tgt && tgt !== drag.card) {
    const after = !!(drag.card.compareDocumentPosition(tgt) & Node.DOCUMENT_POSITION_FOLLOWING);
    if (after) tgt.after(drag.card); else tgt.before(drag.card);
  }
}, { passive: false });
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  drag.ghost.remove(); drag.card.classList.remove('dragging');
  const order = [...$('#grid').querySelectorAll('.card')].map(c => +c.dataset.uid);
  const map = new Map(items.map(i => [i.uid, i])); const next = order.map(u => map.get(u)).filter(Boolean);
  const changed = next.some((it, i) => it !== items[i]);
  drag = null; if (changed) { items = next; render(); }
}
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);

// ---------- export ----------
async function exportPdf() {
  if (!items.length || busy) return null;
  busy = true; render();
  try {
    await new Promise(r => setTimeout(r, 20));
    const list = items.map(it => it.kind === 'pdf' ? { kind: 'pdf', doc: docById(it.docId).doc, page: it.page, rot: it.rot } : { kind: 'image', img: it.img, rot: it.rot });
    const bytes = PDF.buildPdf(list, settings);
    let name = (settings.name || defaultName()).replace(/[\\/:*?"<>|]/g, '').trim() || '合併'; if (!/\.pdf$/i.test(name)) name += '.pdf';
    lastExport = { bytes, name, blob: new Blob([bytes], { type: 'application/pdf' }), pages: items.length };
    return lastExport;
  } catch (e) { console.warn(e); toast('產生 PDF 時發生錯誤：' + (e && e.message || e), 6000); return null; }
  finally { busy = false; render(); }
}
$('#exportBtn').addEventListener('click', async () => {
  const r = await exportPdf(); if (!r) return;
  $('#exName').textContent = r.name; $('#exInfo').textContent = r.pages + ' 頁・' + fmtSize(r.bytes.length);
  let canShare = false; try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([r.blob], r.name, { type: 'application/pdf' })] })); } catch (e) { }
  $('#exShare').hidden = !canShare;
  hideToast(); $('#exportSheet').hidden = false; $('#exDownload').focus();
});
function fmtSize(n) { return n < 1024 * 1024 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
async function save(r) {
  if (dl) { try { await dl.save({ filename: r.name, data: r.bytes }); toast('已送出儲存：' + r.name); return; } catch (e) { if (/declin|cancel|denied|abort/i.test(String(e && (e.message || e.name)))) return; } }
  try { const u = URL.createObjectURL(r.blob); const a = document.createElement('a'); a.href = u; a.download = r.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); toast('已開始下載 ' + r.name); }
  catch (e) { toast('此環境無法下載'); }
}
$('#exDownload').addEventListener('click', () => { if (lastExport) save(lastExport); });
$('#exShare').addEventListener('click', async () => {
  if (!lastExport) return; const file = new File([lastExport.blob], lastExport.name, { type: 'application/pdf' });
  try { await navigator.share({ files: [file], title: lastExport.name }); } catch (e) { if (e && e.name !== 'AbortError') toast('無法分享：' + (e.message || e)); }
});
$('#exClose').addEventListener('click', () => { $('#exportSheet').hidden = true; });
$('#exportSheet').addEventListener('click', e => { if (e.target === $('#exportSheet')) $('#exportSheet').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#exportSheet').hidden) $('#exportSheet').hidden = true; });

// ---------- toast ----------
function toast(msg, ms, action) {
  hideToast(); const t = document.createElement('div'); t.className = 'toast'; t.id = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); hideToast(); });
  document.body.appendChild(t); toastTimer = setTimeout(hideToast, ms || 2600);
}
function hideToast() { clearTimeout(toastTimer); const t = $('#toast'); if (t) t.remove(); }

// ---------- boot ----------
if (!store.get('seen', false)) { try { loadSamples(); } catch (e) { console.warn(e); } }
render();
window.__pdfTools = { PDF, addFiles, exportPdf, get items() { return items; }, get docs() { return docs; }, get settings() { return settings; }, render, loadSamples, removeSamples };
})();
</script>
