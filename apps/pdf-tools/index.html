<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>PDF 工具箱</title>
<style>
:root{
  --bg:#ece7dc; --bg-2:#e4ddcf; --surface:#fffdf8; --surface-2:#f5f0e6; --ink:#25221b; --ink-2:#575246; --ink-3:#7a7466;
  --line:#ddd5c4; --line-strong:#b9af9c;
  --accent:#b3301c; --accent-2:#d4472f; --accent-ink:#ffffff; --accent-soft:#f8e2db; --accent-line:#e9b3a6;
  --paper:#ffffff; --paper-edge:rgba(40,30,15,.16); --shade:rgba(50,35,15,.22);
  --ok:#24704d; --ok-soft:#dcefe4; --warn:#855600; --warn-soft:#f8ecd0; --bad:#a62a1a; --bad-soft:#fae3dd;
  --focus:#1c5fd1; --scrim:rgba(30,26,18,.5);
  --shadow-1:0 1px 0 rgba(60,40,10,.05),0 1px 3px rgba(60,40,10,.08);
  --shadow-2:0 1px 0 rgba(60,40,10,.05),0 10px 26px -14px rgba(60,40,10,.45);
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans: system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --bg-2:#1b1813; --surface:#211e18; --surface-2:#2a261f; --ink:#efe9dc; --ink-2:#bcb3a1; --ink-3:#958d7c;
    --line:#38332a; --line-strong:#585141;
    --accent:#ff7d5f; --accent-2:#ff9a80; --accent-ink:#2a0d05; --accent-soft:#40201a; --accent-line:#7a3a2c;
    --paper:#f4efe4; --paper-edge:rgba(0,0,0,.5); --shade:rgba(0,0,0,.55);
    --ok:#70c99d; --ok-soft:#1d3729; --warn:#f0c15f; --warn-soft:#3a2c10; --bad:#ff9077; --bad-soft:#41201a;
    --focus:#80b2ff; --scrim:rgba(0,0,0,.66);
    --shadow-1:0 1px 0 rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.3);
    --shadow-2:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --bg-2:#1b1813; --surface:#211e18; --surface-2:#2a261f; --ink:#efe9dc; --ink-2:#bcb3a1; --ink-3:#958d7c;
  --line:#38332a; --line-strong:#585141;
  --accent:#ff7d5f; --accent-2:#ff9a80; --accent-ink:#2a0d05; --accent-soft:#40201a; --accent-line:#7a3a2c;
  --paper:#f4efe4; --paper-edge:rgba(0,0,0,.5); --shade:rgba(0,0,0,.55);
  --ok:#70c99d; --ok-soft:#1d3729; --warn:#f0c15f; --warn-soft:#3a2c10; --bad:#ff9077; --bad-soft:#41201a;
  --focus:#80b2ff; --scrim:rgba(0,0,0,.66);
  --shadow-1:0 1px 0 rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.3);
  --shadow-2:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;
  padding:12px 16px calc(92px + env(safe-area-inset-bottom));overflow-x:hidden;
  background-image:radial-gradient(rgba(90,70,30,.07) .7px,transparent .8px),linear-gradient(180deg,var(--bg-2),var(--bg) 340px);background-size:12px 12px,100% 100%}
body.empty{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.mark{flex:none;width:42px;height:42px;filter:drop-shadow(0 4px 8px rgba(150,40,20,.25))}
.mark svg{width:42px;height:42px}
.brand h1{margin:0;font-size:19px;line-height:1.15;font-weight:800;letter-spacing:.02em}
.brand h1 small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow-1);transition:transform .12s var(--ease),background .15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}

/* empty hero */
.hero{display:grid;gap:14px;animation:rise .45s var(--ease) both}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 18px 22px;border-radius:22px;border:1.5px dashed var(--line-strong);background:var(--surface);box-shadow:var(--shadow-2);cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.drop:active{transform:scale(.985)}
.drop.over,.drop:hover{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.drop .art{width:148px;height:104px;margin-bottom:4px}
.drop strong{font-size:18px;font-weight:800;letter-spacing:.02em}
.drop .sub{font-size:13px;color:var(--ink-3)}
.drop .cta{margin-top:10px;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15.5px;box-shadow:0 8px 18px -10px var(--accent)}
.drop .cta svg{width:20px;height:20px}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px 9px;text-align:center;font-size:12px;color:var(--ink-2);font-weight:600;box-shadow:var(--shadow-1)}
.feat svg{width:26px;height:26px;margin:0 auto 5px;color:var(--accent)}
.feat span{display:block;font-weight:500;color:var(--ink-3);font-size:11px;margin-top:1px}
@media (max-width:370px){.feats{grid-template-columns:repeat(2,1fr)}}
.tryrow{display:flex;justify-content:center}
.textbtn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-1)}
.textbtn svg{width:18px;height:18px;color:var(--accent)}
.privacy{font-size:12px;color:var(--ink-3);margin:2px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.privacy svg{width:14px;height:14px;flex:none}

/* workspace toolbar */
.work{animation:rise .35s var(--ease) both}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.addbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px 0 10px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 14px -9px var(--accent);user-select:none;-webkit-user-select:none;transition:transform .12s var(--ease)}
.addbtn:active{transform:scale(.95)}
.addbtn.over{outline:3px solid var(--accent-line)}
.addbtn svg{width:20px;height:20px}
.srcs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.srcs::-webkit-scrollbar{display:none}
.src{flex:none;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 0 0 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:210px;box-shadow:var(--shadow-1)}
.src .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent)}
.src .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.src .pc{flex:none;color:var(--ink-3);font-size:11.5px}
.src .rm{flex:none;width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.src .rm:hover{color:var(--accent)}
.src .rm svg{width:15px;height:15px}

/* notices */
.notes{display:grid;gap:8px;margin-bottom:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 4px 10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.45;box-shadow:var(--shadow-1);animation:rise .3s var(--ease) both}
.note .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.note .ic svg{width:14px;height:14px}
.note.bad .ic{background:var(--bad-soft);color:var(--bad)}
.note.warn .ic{background:var(--warn-soft);color:var(--warn)}
.note.info .ic{background:var(--ok-soft);color:var(--ok)}
.note .tx{flex:1;min-width:0}
.note .tx b{display:block;font-size:13.5px;overflow-wrap:anywhere}
.note .tx span{color:var(--ink-2);white-space:pre-line}
.note .x{flex:none;width:44px;height:44px;margin:-10px 0 -10px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.note .x svg{width:15px;height:15px}
.note .act{display:inline-block;margin-top:6px;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:700;font-size:13.5px}

/* section head */
.sechead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.sechead h2{flex:none;margin:0 2px 0 2px;font-size:13px;letter-spacing:.12em;color:var(--ink-2);font-weight:800;white-space:nowrap}
.sechead h2 b{font-family:var(--mono);color:var(--ink);letter-spacing:0;margin-left:3px}
.range{flex:1;min-width:0;max-width:460px;position:relative}
.range+.lnk{margin-left:auto}
.range input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 34px 0 36px;background:var(--surface);font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.range input::placeholder{color:var(--ink-3)}
.range input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.range .lead{position:absolute;left:11px;top:12px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.range .clr{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;border-radius:10px}
.range .clr svg{width:14px;height:14px}
.lnk{flex:none;min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--accent);font-weight:800;font-size:14px;border-radius:10px}
.lnk:disabled{color:var(--ink-3);font-weight:500}
.rmsg{margin:-4px 4px 10px;font-size:12.5px;color:var(--ink-3);min-height:0}
.rmsg.bad{color:var(--bad)}
.rmsg.ok{color:var(--ok)}

/* page grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;position:relative}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow-1);user-select:none;-webkit-user-select:none;transition:border-color .18s,box-shadow .18s,background .18s;-webkit-touch-callout:none}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.card.dragging{opacity:.25}
.card.enter{animation:pop .32s var(--ease) both}
.thumb{position:relative;aspect-ratio:5/6;border-radius:14px 14px 8px 8px;cursor:pointer;overflow:hidden}
.pg{position:absolute;left:50%;top:50%;background:var(--paper);box-shadow:0 0 0 1px var(--paper-edge),0 6px 12px -6px var(--shade);transform:translate(-50%,-50%) rotate(var(--a,0deg));transition:transform .36s var(--ease),width .36s var(--ease),height .36s var(--ease);border-radius:2px;overflow:hidden}
.pg img,.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.pg .sk{position:absolute;inset:16% 14% auto;height:4px;border-radius:2px;background:#e8e3d8;box-shadow:0 9px 0 #eee9df,0 18px 0 #eee9df,0 27px 0 #eee9df}
.pg.done .sk{display:none}
.pg .fail{position:absolute;inset:0;display:grid;place-items:center;color:#a79f8f;font-size:11px;text-align:center;padding:6px}
.handle{position:absolute;left:0;top:0;width:44px;height:44px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;touch-action:none;cursor:grab;z-index:2}
.handle i{display:grid;place-items:center;width:20px;height:26px;border-radius:7px;background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:0 0 0 1px var(--line)}
.handle svg{width:16px;height:16px}
.check{position:absolute;right:0;top:0;width:44px;height:44px;display:grid;place-items:center;z-index:2;border:0;padding:0;background:transparent}
.check i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);background:color-mix(in srgb,var(--surface) 92%,transparent);display:grid;place-items:center;color:var(--accent-ink);transition:background .15s,border-color .15s,transform .2s var(--ease)}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s var(--ease)}
.card.sel .check i{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.card.sel .check svg{opacity:1;transform:none}
.no{position:absolute;left:6px;bottom:6px;z-index:2;min-width:22px;height:20px;padding:0 5px;border-radius:6px;background:var(--ink);color:var(--bg);font:700 11.5px/20px var(--mono);text-align:center;pointer-events:none;opacity:.82}
.foot{display:flex;align-items:center;gap:5px;height:45px;padding-left:9px;border-top:1px solid var(--line)}
.foot .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.foot .lab{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .lab b{font-weight:700;color:var(--ink)}
.foot .lab span{color:var(--ink-3)}
@media (max-width:420px){.foot .lab span{display:none}}
.foot .rot{flex:none;width:44px;height:44px;border:0;background:transparent;border-radius:0 0 14px 0;display:grid;place-items:center;color:var(--ink-2)}
.foot .rot svg{width:19px;height:19px;transition:transform .3s var(--ease)}
.foot .rot:active svg{transform:rotate(60deg)}
.card .rb{position:absolute;right:6px;bottom:6px;z-index:2;padding:1px 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/16px var(--mono);pointer-events:none}
.ghost{position:fixed;z-index:80;pointer-events:none;margin:0;transform:scale(1.06) rotate(-2deg);box-shadow:0 22px 40px -14px rgba(0,0,0,.55);opacity:.96;transition:none}
.dropmark{outline:2px dashed var(--accent);outline-offset:3px}

/* settings */
details.set{margin:16px 0 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-1)}
details.set summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 12px 4px 14px;font-weight:700;font-size:14px;cursor:pointer}
details.set summary::-webkit-details-marker{display:none}
details.set summary .t{flex:1;min-width:0}
details.set summary .sum{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
details.set summary>svg{width:18px;height:18px;flex:none;transition:transform .25s var(--ease);color:var(--ink-3)}
details.set summary .lead{width:20px;height:20px;color:var(--accent)}
details.set[open] summary>svg:last-child{transform:rotate(180deg)}
.setbody{padding:2px 12px 14px;display:grid;gap:14px}
.field .lab{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2);padding:0 4px;border-radius:9px;transition:background .18s,color .18s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -10px 24px -18px rgba(0,0,0,.45)}
.bar .in{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center}
.primary{flex:1;min-height:50px;border-radius:14px;border:0;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);font-weight:800;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 20px -12px var(--accent),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s var(--ease),opacity .2s}
.primary:active:not(:disabled){transform:scale(.98)}
.primary:disabled{opacity:.5}
.primary svg{width:20px;height:20px}
.primary small{font-weight:600;opacity:.85;font-size:13px}
.selbar{display:flex;gap:2px;width:100%;animation:rise .22s var(--ease) both}
.selbar .cnt{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:52px;padding:0 4px;font-size:11px;color:var(--ink-3);font-weight:600;line-height:1.1}
.selbar .cnt b{font:800 20px/1 var(--mono);color:var(--accent)}
.selbar button{flex:1;min-width:0;height:52px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:0 2px;white-space:nowrap}
.selbar button:active{background:var(--surface-2)}
.selbar button svg{width:21px;height:21px}
.selbar button.hot{color:var(--accent)}
.selbar button.danger{color:var(--bad)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
.panel{width:100%;max-width:520px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px -16px rgba(0,0,0,.5);animation:up .32s var(--ease) both}
.panel .grab{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:2px auto 12px}
@media (min-width:640px){.scrim{align-items:center}.panel{border-radius:22px;padding-bottom:18px}.panel .grab{display:none}}
.panel h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.panel .okic{width:30px;height:30px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.panel .okic svg{width:18px;height:18px}
.panel .okic path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .1s var(--ease) forwards}
.panel .lede{margin:6px 0 14px;font-size:13.5px;color:var(--ink-2)}
.namebox{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.namebox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.namebox svg{width:22px;height:22px;flex:none;margin-left:11px;color:var(--accent)}
.namebox input{flex:1;min-width:0;height:48px;border:0;background:transparent;padding:0 4px 0 9px;font-size:16px;font-weight:650;outline:none}
.namebox .ext{flex:none;padding:0 12px 0 2px;color:var(--ink-3);font:600 14px var(--mono)}
.panel .info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3);margin:10px 2px 4px}

/* preview */
.pv{position:fixed;inset:0;z-index:65;background:rgba(18,16,12,.94);display:flex;flex-direction:column;color:#f1ece1;animation:fade .2s ease both}
.pv .pvtop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 16px}
.pv .pvtop .t{flex:1;min-width:0}

.pv .pvtop span{font-size:12px;color:#b8b0a0}
.pv .pvbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:inherit;display:grid;place-items:center}

.pv .stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px 12px;position:relative;touch-action:pan-y}

.pv .stage canvas,.pv .stage img{display:block;width:100%;height:100%}
.pv .stage .spin{position:absolute;left:50%;top:50%;margin:-14px 0 0 -14px;width:28px;height:28px;border:3px solid rgba(0,0,0,.12);border-top-color:#b3301c;border-radius:50%;animation:spin .8s linear infinite}

.pv .pvbar button{min-width:64px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;padding:0 8px}
.pv .pvbar button svg{width:20px;height:20px}

/* busy + toast */
.busyov{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:var(--scrim);animation:fade .2s ease both}

.busyov span{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;min-height:46px;border-radius:14px;font-size:14px;z-index:70;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:toastIn .3s var(--ease) both}

.toast span{padding:6px 0}
.toast button{flex:none;min-height:36px;padding:0 14px;border-radius:9px;border:0;background:color-mix(in srgb,var(--bg) 22%,transparent);color:inherit;font-weight:800}
.busy{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}
.dragcover{position:fixed;inset:10px;z-index:90;border:2.5px dashed var(--accent);border-radius:24px;background:color-mix(in srgb,var(--accent-soft) 80%,transparent);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--accent);pointer-events:none;animation:fade .15s ease both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
