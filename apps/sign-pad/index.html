<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }

<title>手寫簽名板</title>
<style>
/* Notary desk: sage-gray blotter, white signing sheet with an engraved signature line, ink-blue controls, serif display type */
:root{
  --bg:#e3e7e2; --surface:#f7f8f6; --sunk:#edf0ec; --ink:#1a2233; --muted:#576070; --faint:#8a929d;
  --line:#cdd3cc; --line-strong:#adb5ac; --accent:#1d3461; --accent-ink:#ffffff; --accent-soft:#dbe3f2;
  --paper:#ffffff; --paper-edge:#d6dbd4; --guide:#c4c9d2; --guide-ink:#a2a9b5; --danger:#a12a2a; --danger-soft:#f6dede;
  --check-a:#eceeea; --check-b:#ffffff;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 26px -12px rgba(30,40,30,.35);
  --pop:0 14px 40px rgba(20,28,24,.25);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",ui-serif,Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141814; --surface:#1d221e; --sunk:#181c19; --ink:#e4e8e3; --muted:#a1aaa1; --faint:#737c74;
  --line:#2e352f; --line-strong:#434c44; --accent:#a9bff0; --accent-ink:#0f1a33; --accent-soft:#25304a;
  --paper:#f4f4f1; --paper-edge:#3a423b; --guide:#c4c9d2; --guide-ink:#9aa1ad; --danger:#ff9c94; --danger-soft:#3e1f1d;
  --check-a:#262c27; --check-b:#1d221e;
  --shadow:0 12px 30px -12px rgba(0,0,0,.7); --pop:0 14px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1d221e; --sunk:#181c19; --ink:#e4e8e3; --muted:#a1aaa1; --faint:#737c74;
  --line:#2e352f; --line-strong:#434c44; --accent:#a9bff0; --accent-ink:#0f1a33; --accent-soft:#25304a;
  --paper:#f4f4f1; --paper-edge:#3a423b; --guide:#c4c9d2; --guide-ink:#9aa1ad; --danger:#ff9c94; --danger-soft:#3e1f1d;
  --check-a:#262c27; --check-b:#1d221e;
  --shadow:0 12px 30px -12px rgba(0,0,0,.7); --pop:0 14px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:0 calc(28px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;min-height:60px}
h1{flex:1;margin:0;font:700 22px/1.2 var(--serif);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;flex:none}
.ib svg{width:19px;height:19px;flex:none}
/* signing sheet */
.stage{position:relative}
.sheet{position:relative;width:min(100%,calc(62vh * 5 / 3));aspect-ratio:1000/600;margin:0 auto;background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px;box-shadow:var(--shadow);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sheet .guide{position:absolute;left:7%;right:7%;top:75%;border-top:1.5px solid var(--guide);pointer-events:none}
.sheet .cross{position:absolute;left:7%;top:75%;transform:translate(0,-118%);font:600 20px var(--serif);color:var(--guide-ink);pointer-events:none}
.sheet .ph{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font:400 clamp(18px,5vw,30px) var(--serif);letter-spacing:.3em;color:var(--guide);pointer-events:none;transition:opacity .2s}
.privacy{display:flex;justify-content:space-between;gap:8px;margin:6px 2px 0;font-size:12px;color:var(--faint)}
/* controls */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.row.ink{flex-wrap:nowrap;align-items:flex-start}
.row.ink .lab{line-height:44px;flex:none}
.sws{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.lab{font:700 11px var(--sans);letter-spacing:.16em;color:var(--muted);min-width:2.6em}
.sw{width:44px;height:44px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.sw i{width:22px;height:22px;border-radius:11px;display:block}
.sw[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:22px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;min-width:50px;padding:0 12px;border:0;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .dot{display:inline-block;background:currentColor;border-radius:4px}
.tg{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px;user-select:none}
.tg input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;margin:0;cursor:pointer;transition:background .15s}
.tg input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:var(--paper);transition:transform .15s}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{transform:translateX(18px)}
.tg input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;padding:0 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tools .btn{padding:0 6px}
.tools .btn span{white-space:nowrap}
fieldset{border:0;border-top:1px solid var(--line-strong);margin:22px 0 0;padding:12px 0 0;min-width:0}
legend{font:700 16px var(--serif);letter-spacing:.1em;padding:0 10px 0 0}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (min-width:640px){.outs{grid-template-columns:repeat(4,1fr)}}
.hint{font-size:12px;color:var(--faint);margin:8px 2px 0}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(380px,100%);height:100%;background:var(--surface);box-shadow:var(--pop);display:flex;flex-direction:column;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.drawer header h2{flex:1;margin:0;font:700 18px var(--serif);letter-spacing:.08em}
.list{flex:1;overflow:auto;margin:0 -4px;padding:0 4px;display:grid;gap:10px;align-content:start}
.item{border:1px solid var(--line);border-radius:4px;background:var(--sunk);display:grid;grid-template-columns:1fr auto;gap:0}
.item img{grid-column:1/-1;width:100%;aspect-ratio:1000/600;object-fit:contain;background:var(--paper);border-bottom:1px solid var(--line);border-radius:4px 4px 0 0;display:block}
.item .meta{padding:6px 10px;font-size:13px;min-width:0}
.item .meta b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta span{color:var(--faint);font-size:12px}
.item .acts{display:flex;align-items:center;gap:4px;padding:4px}
.item .meta input{width:100%;min-height:40px;margin:2px 0;border:1px solid var(--accent);border-radius:4px;background:var(--surface);padding:0 8px;font-weight:700}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.empty{color:var(--faint);font-size:14px;padding:20px 4px}
.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger-soft);border-color:var(--danger)}
/* big landscape canvas */
.big-on{overflow:hidden}
.stage.big{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:row;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px}
.stage.big .sheet{max-height:none;flex:none}
.bigbar{display:none;gap:8px;flex:none}
.stage.big .bigbar{display:flex;flex-direction:column}
.bigbar .btn{min-width:76px}
/* portrait: the whole big stage is turned 90° so the phone is held sideways (no fullscreen / orientation lock needed) */
.stage.big.r90{inset:auto;left:0;top:0;transform-origin:0 0}
/* preview */
.pv{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pv .box{background:var(--surface);border-radius:6px;box-shadow:var(--pop);padding:14px;max-width:min(640px,100%);max-height:100%;overflow:auto;display:grid;gap:10px}
.pv img{max-width:100%;height:auto;background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/16px 16px;border:1px solid var(--line);justify-self:center;-webkit-touch-callout:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:22px;font-size:14px;box-shadow:var(--pop);max-width:calc(100vw - 32px);width:max-content;display:flex;align-items:center;gap:10px}
.toast button{flex:none;min-height:44px;min-width:44px;margin:-10px -10px -10px 0;padding:0 16px;border:0;border-radius:22px;background:rgba(127,127,127,.28);color:inherit;font-weight:700;font-size:14px;cursor:pointer}
@media (hover:hover){.ib:hover,.btn:hover:not(:disabled),.sw:hover{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1>手寫簽名板</h1>
  <button class="ib" id="themeBtn" aria-label="切換深淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
  <button class="ib" id="savedBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>我的簽名</button>
</header>

<div class="stage" id="stage">
    <div class="sheet" id="sheet">
    <div class="guide"></div><div class="cross" aria-hidden="true">✕</div>
    <div class="ph" id="ph">請在此簽名</div>
    <canvas id="cv" aria-label="簽名區，用手指、觸控筆或滑鼠書寫"></canvas>
      </div>
  <div class="bigbar">
    <button class="btn" id="bUndo">復原</button><button class="btn" id="bRedo">重做</button><button class="btn" id="bClear">清空</button><button class="btn pri" id="bDone">完成</button>
  </div>
</div>
<div class="privacy"><span>書寫中的簽名自動保存在這台裝置，不會上傳。</span><span id="cnt">0 筆畫</span></div>

<div class="row ink" role="group" aria-label="墨水顏色">
  <span class="lab">墨色</span>
  <div class="sws">
  <button class="sw" id="c-black" data-c="#111111" aria-label="黑色"><i style="background:#111111"></i></button>
  <button class="sw" id="c-navy" data-c="#1b2a5e" aria-label="深藍"><i style="background:#1b2a5e"></i></button>
  <button class="sw" id="c-blue" data-c="#1f5fd1" aria-label="藍色"><i style="background:#1f5fd1"></i></button>
  <button class="sw" id="c-red" data-c="#c62828" aria-label="紅色"><i style="background:#c62828"></i></button>
  <span class="sw" id="c-custom-wrap" aria-pressed="false" title="自訂顏色"><i id="customDot" style="background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)"></i><input type="color" id="c-custom" value="#2e7d32" aria-label="自訂顏色"></span>
  <button class="btn" id="recolorBtn" disabled>全部換成此色</button>
  </div>
</div>
<div class="row">
  <span class="lab">粗細</span>
  <div class="seg" role="group" aria-label="筆畫粗細">
    <button id="w-thin" data-w="1.5" aria-pressed="false"><span class="dot" style="width:4px;height:4px"></span>細</button><button id="w-mid" data-w="2.5" aria-pressed="true"><span class="dot" style="width:6px;height:6px"></span>中</button><button id="w-bold" data-w="4" aria-pressed="false"><span class="dot" style="width:9px;height:9px"></span>粗</button>
  </div>
  <label class="tg"><input type="checkbox" id="pressure" checked>筆壓（速度模擬）</label>

<div class="tools">
  <button class="btn" id="undoBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>復原</span></button>
  <button class="btn" id="redoBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span>重做</span></button>
  <button class="btn" id="clearBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>清空</span></button>
  <button class="btn" id="bigBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="1.5"/><path d="M7 14c2-3 3 1 5-2s3 1 5-1"/></svg><span>大畫布</span></button>

  <legend>輸出</legend>

    </div>
  </div>
  <div class="outs">
    <button class="btn pri" id="pngBtn" disabled>下載 PNG</button>
    <button class="btn" id="svgBtn" disabled>下載 SVG</button>

</div>

<div class="scrim" id="drawer" hidden>

    <p class="hint" style="margin:0 0 10px">最多存 10 個，存的是筆跡資料，載入後可換顏色、換尺寸重新輸出。只存在這台裝置。</p>
    <div class="list" id="list"></div>

<div class="pv" id="pv" hidden><div class="box" role="dialog" aria-modal="true" aria-label="簽名圖片"><img id="pvImg" alt="簽名圖片（透明背景）"><p class="hint" style="margin:0;text-align:center">長按或按右鍵即可儲存／拷貝圖片</p><button class="btn" id="pvClose">關閉</button></div></div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = "sign-pad:v1:";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
};
// toast(message[, {label, fn}]) – an optional action button (e.g. 復原) keeps the toast up longer
function toast(m, act) {
  const t = $("toast"), b = $("toastAct"); $("toastMsg").textContent = m; t.hidden = false;
  b.hidden = !act; b.textContent = act ? act.label : ""; b.onclick = act ? () => { t.hidden = true; act.fn(); } : null;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, act ? 6000 : 2600);
}

/* ---- board geometry: strokes live in a fixed 1000×600 board, stored normalised 0–1 ---- */
const BW = 1000, BH = 600, U = 2.5;           // U: board units per reference CSS px (board ≈ 400 px wide)
const CFG = { minF: 0.5, maxF: 1.6, k: 1.2, alpha: 0.7, maxStep: 0.10, minDist: 1.2, pxPerUnit1x: 0.6 };

let theme = LS.get("theme", "auto");
function applyTheme() { if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; }
applyTheme();
$("themeBtn").addEventListener("click", () => {
  const sys = matchMedia("(prefers-color-scheme: dark)").matches, now = theme === "dark" || (theme === "auto" && sys);
  theme = now ? "light" : "dark"; if ((theme === "dark") === sys) theme = "auto"; applyTheme(); LS.set("theme", theme);
});

let prefs = Object.assign({ color: "#1b2a5e", bw: 2.5, pressure: true, crop: true, margin: true, scale: 2, custom: "#2e7d32" }, LS.get("prefs", {}));
const savePrefs = () => LS.set("prefs", prefs);

/* ---- stored data is validated before use (a broken entry is dropped, never crashes the page) ---- */
const HEX = /^#[0-9a-f]{3,8}$/i, num = (v, lo, hi) => typeof v === "number" && Number.isFinite(v) && v >= lo && v <= hi;
function cleanStroke(s) {
  if (!s || typeof s !== "object" || !Array.isArray(s.points)) return null;
  const pts = [];
  for (const p of s.points) if (p && num(p.x, -20, 21) && num(p.y, -20, 21) && num(p.w, 0.01, 500)) pts.push({ x: p.x, y: p.y, t: num(p.t, -1e15, 1e15) ? p.t : 0, p: num(p.p, 0, 1) ? p.p : 0, w: p.w });
  if (!pts.length) return null;
  return { color: typeof s.color === "string" && HEX.test(s.color) ? s.color : "#111111", bw: num(s.bw, 0.1, 50) ? s.bw : 2.5, points: pts };
}
const cleanList = a => Array.isArray(a) ? a.map(cleanStroke).filter(Boolean) : [];
function cleanSaved(arr) {
  const list = []; let bad = 0;
  for (const e of Array.isArray(arr) ? arr : []) {
    const st = e && typeof e === "object" ? cleanList(e.strokes) : [];
    if (!st.length) { bad++; continue; }
    list.push({ id: typeof e.id === "string" && e.id ? e.id.slice(0, 40) : Math.random().toString(36).slice(2), name: typeof e.name === "string" && e.name.trim() ? e.name.trim().slice(0, 40) : "簽名", at: num(e.at, 0, 1e14) ? e.at : Date.now(), strokes: st });
  }
  return { list, bad };
}

/* ---- current signature + undo history, kept in localStorage (sign-pad:v1:draft) after every change ---- */
let strokes = [];            // [{color, bw, points:[{x,y,t,p,w}]}]  x,y normalised; w in board units
let undoStack = [], redoStack = [];
const DRAFT_STEPS = 40;
let draftWarned = false;

  if (f.size > 10 * 1024 * 1024) { toast("檔案太大（超過 10MB），不是簽名備份"); return; }
  let data; try { data = JSON.parse(await f.text()); } catch { toast(BAD); return; }
