<title>呼吸放鬆引導</title>
<style>
/* Quiet tinted field: one hue per scene (night / forest / amber), soft luminous orb, light-weight type */
:root {
  --hue: 222;
  --bg: hsl(var(--hue) 32% 95%);
  --bg-2: hsl(var(--hue) 30% 90%);
  --surface: hsl(var(--hue) 40% 99%);
  --ink: hsl(var(--hue) 35% 14%);
  --ink-2: hsl(var(--hue) 18% 32%);
  --muted: hsl(var(--hue) 12% 40%);
  --line: hsl(var(--hue) 22% 84%);
  --accent: hsl(var(--hue) 55% 42%);
  --accent-ink: hsl(var(--hue) 40% 98%);
  --orb-1: hsl(var(--hue) 80% 90%);
  --orb-2: hsl(var(--hue) 55% 70%);
  --orb-glow: hsl(var(--hue) 70% 60% / .45);
  --ring: hsl(var(--hue) 30% 70%);
  --warn: hsl(28 80% 34%);
  --warn-bg: hsl(40 90% 92%);
  --overlay: hsl(var(--hue) 40% 10% / .45);
  --seg-on: var(--surface);
  --seg-on-ring: transparent;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
:root[data-scene="forest"] { --hue: 152; }
:root[data-scene="amber"] { --hue: 36; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(var(--hue) 38% 9%); --bg-2: hsl(var(--hue) 32% 13%); --surface: hsl(var(--hue) 30% 14%);
    --ink: hsl(var(--hue) 30% 92%); --ink-2: hsl(var(--hue) 18% 76%); --muted: hsl(var(--hue) 12% 62%);
    --line: hsl(var(--hue) 22% 22%); --accent: hsl(var(--hue) 65% 72%); --accent-ink: hsl(var(--hue) 45% 10%);
    --orb-1: hsl(var(--hue) 55% 58%); --orb-2: hsl(var(--hue) 50% 28%); --orb-glow: hsl(var(--hue) 80% 62% / .35);
    --ring: hsl(var(--hue) 25% 30%); --warn: hsl(38 90% 70%); --warn-bg: hsl(38 40% 16%); --overlay: hsl(var(--hue) 40% 3% / .65);
    --seg-on: hsl(var(--hue) 32% 27%); --seg-on-ring: var(--accent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(var(--hue) 38% 9%); --bg-2: hsl(var(--hue) 32% 13%); --surface: hsl(var(--hue) 30% 14%);
  --ink: hsl(var(--hue) 30% 92%); --ink-2: hsl(var(--hue) 18% 76%); --muted: hsl(var(--hue) 12% 62%);
  --line: hsl(var(--hue) 22% 22%); --accent: hsl(var(--hue) 65% 72%); --accent-ink: hsl(var(--hue) 45% 10%);
  --orb-1: hsl(var(--hue) 55% 58%); --orb-2: hsl(var(--hue) 50% 28%); --orb-glow: hsl(var(--hue) 80% 62% / .35);
  --ring: hsl(var(--hue) 25% 30%); --warn: hsl(38 90% 70%); --warn-bg: hsl(38 40% 16%); --overlay: hsl(var(--hue) 40% 3% / .65);
  --seg-on: hsl(var(--hue) 32% 27%); --seg-on-ring: var(--accent);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 980px; margin: 0 auto; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; }
.bar { display: flex; align-items: center; gap: 8px; }
.modes { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
.modes::-webkit-scrollbar { display: none; }
.modes.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.chip { flex-shrink: 0; min-height: 44px; min-width: 44px; padding: 0 9px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.iconbtn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
@media (hover: hover) { .chip:hover, .iconbtn:hover { border-color: var(--accent); } }
.desc { font-size: 13px; color: var(--muted); text-align: center; min-height: 20px; }
.desc b { color: var(--ink-2); font-weight: 600; }

.stage { position: relative; min-height: 0; display: grid; place-items: center; }
.orbbox { position: relative; width: var(--d, 280px); height: var(--d, 280px); }
.guide { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--ring); }
.guide.inner { inset: 30%; border-style: solid; opacity: .6; }
.orb {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, var(--orb-1), var(--orb-2) 72%);
  transform: scale(.4); will-change: transform, opacity;
  box-shadow: 0 0 calc(var(--d, 280px) * .12) var(--orb-glow);
}
.orb.glow { box-shadow: 0 0 calc(var(--d, 280px) * .22) calc(var(--d, 280px) * .03) var(--orb-glow); }
.square { position: absolute; inset: -6%; border: 1.5px solid var(--ring); border-radius: 6px; }
.dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--orb-glow); left: 0; top: 100%; }
.label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.label .ph { font-size: 22px; font-weight: 600; letter-spacing: .12em; color: var(--ink); }
.label .sec { font-size: 44px; font-weight: 200; line-height: 1.1; color: var(--ink); }
.label .idle { font-size: 14px; color: var(--ink); max-width: 70%; font-weight: 500; text-wrap: balance; }
.label .idle span { display: inline-block; }
.orbwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.progress { min-height: 20px; text-align: center; font-size: 13px; color: var(--muted); }
.tapcatch { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 16px; }
body.running.calm .tapcatch { position: fixed; inset: 0; z-index: 10; border-radius: 0; }
.calmhint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 13px; color: var(--muted); opacity: 0; pointer-events: none; }

.controls { position: relative; display: grid; gap: 10px; padding-bottom: 2px; }
.durrow { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 12px; padding: 3px; }
.seg button { min-height: 40px; min-width: 46px; border: 0; background: transparent; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0 10px; position: relative; }
.seg button::after { content: ""; position: absolute; inset: -2px 0; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: inset 0 0 0 1px var(--seg-on-ring), 0 1px 3px hsl(var(--hue) 30% 20% / .18); }
.stepper { display: inline-flex; align-items: center; background: var(--bg-2); border-radius: 12px; padding: 3px; gap: 2px; }
.stepper button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px; font-size: 20px; position: relative; }
.stepper button::after { content: ""; position: absolute; inset: -2px; }
.stepper output { min-width: 64px; text-align: center; font-weight: 600; font-size: 14px; }
.stepper.on { outline: 2px solid var(--accent); outline-offset: -1px; }
.custom { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.custom label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); text-align: center; }
.custom .inp { position: relative; display: block; }
.custom input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: center; font-size: 16px; padding: 0 18px 0 4px; }
.custom .u { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
.warn { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; text-align: center; }
.start { min-height: 56px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; letter-spacing: .1em; }

.run-ctrl { display: flex; gap: 10px; justify-content: center; }
.run-ctrl button { min-height: 56px; min-width: 120px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; }
.run-ctrl button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }

body.running .bar, body.running .setup, body.running .foot { visibility: hidden; }
body.running .bar { pointer-events: none; }
body.running.calm .run-ctrl { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .run-ctrl, .calmhint { transition: opacity .4s; } }

/* end screen / sheets */
.scrim { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .scrim { align-items: center; } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow-y: auto; } }
.sheet { background: var(--surface); width: 100%; max-width: 440px; border-radius: 20px; padding: 18px; max-height: 100%; overflow-y: auto; }
@media (max-height: 600px) { .sheet { max-height: none; overflow: visible; } }
.sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
.set { display: grid; gap: 6px; margin-bottom: 14px; }
.set .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.sw { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 10px; font-size: 15px; }
.sw input { width: 22px; height: 22px; accent-color: var(--accent); }
input[type=range] { width: 100%; height: 36px; accent-color: var(--accent); }
.scenes { display: flex; gap: 8px; }
.scenes button { flex: 1; min-height: 52px; border-radius: 12px; border: 2px solid transparent; font-size: 13px; font-weight: 600; color: #fff; }
.scenes button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.done-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 16px; }
.done-stats div { background: var(--bg-2); border-radius: 14px; padding: 12px; text-align: center; }
.done-stats b { display: block; font-size: 28px; font-weight: 300; }
.done-stats span { font-size: 12px; color: var(--muted); }
.done p { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }
.btnrow { display: flex; gap: 10px; }
.btnrow button { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.btnrow button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.logs li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.logs li span:last-child { color: var(--muted); white-space: nowrap; }
.logs .empty { color: var(--muted); border: 0; }
.logbtns { display: flex; gap: 8px; }
.logbtns button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 14px; }
#logText { width: 100%; min-height: 90px; font: 12px/1.4 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); padding: 8px; }
.toast { pointer-events: none; position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

@media (orientation: landscape) and (max-height: 540px) {
  .app { grid-template-columns: 1fr minmax(300px, 380px); grid-template-rows: auto 1fr auto; column-gap: 20px; }
  .bar { grid-column: 1 / -1; }
  .desc { grid-column: 2; grid-row: 2; align-self: start; }

  .foot { display: none; }
  .label .sec { font-size: 32px; }
  .label .ph { font-size: 18px; }
}
</style>

<script>
(() => {
'use strict';
const KEY = 'breath-guide:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = (s) => document.querySelector(s);

const MODES = [
  { id: '478', name: '4-7-8', phases: [['inhale', 4], ['hold', 7], ['exhale', 8]] },
  { id: 'box', name: '方塊', phases: [['inhale', 4], ['hold', 4], ['exhale', 4], ['holdOut', 4]] },
  { id: 'res', name: '共振', phases: [['inhale', 5.5], ['exhale', 5.5]] },
  { id: 'relax', name: '放鬆', phases: [['inhale', 4], ['exhale', 6]] },
  { id: 'custom', name: '自訂', phases: null }
];
const PH_NAME = { inhale: '吸氣', hold: '閉氣', exhale: '吐氣', holdOut: '閉氣' };
const DEF = { mode: '478', durType: 'cycles', minutes: 3, cycles: 4, tone: 'hum', vol: 60, vib: true, vibSec: false, scene: 'night', theme: 'auto', durTouched: false };
const clampSec = (v) => { v = Math.round(Number(v) * 2) / 2; return Number.isFinite(v) ? Math.max(0, Math.min(20, v)) : 0; };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
// Validate everything read from storage so a stale or hand-edited value can never break the page.
function loadSettings() {
  const raw = store.get('settings', {}), o = Object.assign({}, DEF);
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return o;
  const pick = (k, ok) => { if (ok(raw[k])) o[k] = raw[k]; };
  pick('mode', v => MODES.some(m => m.id === v));
  pick('durType', v => v === 'cycles' || v === 'minutes');
  pick('minutes', v => [1, 3, 5, 10].includes(v));
  pick('cycles', v => Number.isInteger(v) && v >= 1 && v <= 60);
  pick('tone', v => ['hum', 'bell', 'off'].includes(v));
  pick('vol', v => Number.isFinite(v) && v >= 0 && v <= 100);
  pick('vib', v => typeof v === 'boolean');

$('#dlgSet').addEventListener('click', (e) => { if (e.target.id === 'dlgSet' || e.target.closest('[data-close]')) { $('#dlgSet').hidden = true; $('#btnSet').focus(); } });
$('#toneSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.tone = b.dataset.v; saveS(); syncSet(); if (S.tone !== 'off') { ensureAudio(); playPhase(S.tone === 'hum' ? 'inhale' : 'inhale', 1.2); } });
$('#vol').addEventListener('change', (e) => { S.vol = +e.target.value; saveS(); ensureAudio(); playPhase('exhale', 1); });
$('#vib').addEventListener('change', (e) => { S.vib = e.target.checked; saveS(); });
$('#vibSec').addEventListener('change', (e) => { S.vibSec = e.target.checked; saveS(); });
$('#sceneSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.scene = b.dataset.v; saveS(); applyLook(); syncSet(); });
$('#themeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.v; saveS(); applyLook(); syncSet(); });

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

window.__breath = { phasesOf, cycleLen, planCycles, state: () => run && stateAt(run, now()), get S() { return S; }, get voices() { return voices.length; } };
renderModes(); renderSetup(); layout();
})();
</script>
