<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>SVG 動畫工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* A motion-design bench: dark graphite workspace, lime "keyframe" accent, live SVG stage, code tray */
:root {
  color-scheme: dark;
  --bg: #121417;
  --panel: #1a1d22;
  --panel-2: #22262d;
  --line: #2d323b;
  --ink: #eef0f2;
  --muted: #929aa6;
  --lime: #c6f45d;
  --lime-ink: #18200a;
  --coral: #ff7a59;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body);
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; background: rgba(18,20,23,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo h1 { margin: 0; font-size: 1.08rem; font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
.logo h1 small { display: block; font: 600 .62rem/1 var(--mono); color: var(--muted); letter-spacing: .14em; margin-top: 3px; }
.acts { display: flex; gap: 6px; }
.chip { height: 40px; min-width: 44px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .86rem; font-weight: 500; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; flex: none; }
@media (hover: hover) { .chip:hover { border-color: #444b57; } }
.chip.go { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); font-weight: 700; }
@media (max-width: 420px) { .chip .lbl { display: none; } .chip { padding: 0 10px; } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 920px) {
  .wrap { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; padding-top: 20px; gap: 18px; }
  .stagecol { grid-column: 1; grid-row: 1; }
  .panel { grid-column: 2; grid-row: 1 / span 2; position: sticky; top: 76px; }
  .codecol { grid-column: 1; grid-row: 2; }
}

.tpls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.tpl { min-height: 64px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); padding: 8px 4px 7px;
  display: grid; justify-items: center; gap: 4px; font-size: .78rem; color: var(--muted); transition: border-color .2s, color .2s, background .2s; }
.tpl svg { width: 26px; height: 26px; }
.tpl[aria-selected="true"] { color: var(--ink); border-color: var(--lime); background: #20251a; }
.tpl[aria-selected="true"] svg { color: var(--lime); }

.frame { position: relative; border-radius: var(--r); padding: 10px; background:
  radial-gradient(circle, #2a2f37 1px, transparent 1.4px) 0 0 / 14px 14px, var(--panel); border: 1px solid var(--line); }
#stage { border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; width: 100%; display: grid; place-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: background .3s; }
#stage svg { width: 100%; height: 100%; display: block; }
#stage.paused * { animation-play-state: paused !important; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font: 500 .74rem var(--mono); color: var(--muted); }
.meta b { color: var(--lime); font-weight: 600; }
.hint { margin: 10px 2px 0; color: var(--muted); font-size: .84rem; }

.panel, .codecol { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; gap: 8px; }
.ph h2 { margin: 0; font: 800 .8rem var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.ph h2 span { color: var(--ink); font-family: var(--body); letter-spacing: .04em; font-size: .95rem; margin-left: 6px; text-transform: none; }
.link { color: var(--muted); font-size: .82rem; padding: 8px 6px; border-radius: 8px; min-height: 44px; }
@media (hover: hover) { .link:hover { color: var(--ink); } }

.ctrls { display: grid; gap: 12px; }
.f { display: grid; gap: 6px; }
.f > label, .f > .lab { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.f output { font: 600 .8rem var(--mono); color: var(--lime); }
.f input[type=text] { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; width: 100%; }
.f input[type=text]:focus { border-color: var(--lime); outline: none; }
.colors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sw { display: grid; gap: 4px; font-size: .76rem; color: var(--muted); }
.sw .well { position: relative; height: 44px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: flex-end; }
.sw input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw .hex { position: relative; pointer-events: none; font: 600 .7rem var(--mono); background: rgba(0,0,0,.45); color: #fff; padding: 1px 6px; border-top-right-radius: 6px; }
.sw .well:focus-within { outline: 2px solid var(--lime); outline-offset: 2px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--lime) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9px; background: var(--ink); border: 4px solid var(--lime); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--lime); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 4px solid var(--lime); }

.ease { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
.ease select { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 15px; width: 100%; }
.curve { width: 64px; height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); overflow: visible; }
.curve .gd { stroke: var(--line); }
.curve .cv { stroke: var(--lime); stroke-width: 2.4; fill: none; }
.curve .hd { stroke: var(--coral); stroke-width: 1; }
.curve circle { fill: var(--coral); }

.tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; font-size: .9rem; cursor: pointer; }
.tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tog .sl { width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.tog .sl::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.tog input:checked + .sl { background: var(--lime); }
.tog input:checked + .sl::after { transform: translateX(20px); background: var(--lime-ink); }
.tog input:focus-visible + .sl { outline: 2px solid var(--lime); outline-offset: 2px; }

#code { width: 100%; height: 240px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: #0d0f12; color: #cfe3a0;
  font: 400 12px/1.6 var(--mono); padding: 10px 12px; white-space: pre; overflow: auto; tab-size: 2; }
.copyrow { display: flex; gap: 8px; margin-top: 10px; }
.big { flex: 1; height: 52px; border-radius: 12px; background: var(--lime); color: var(--lime-ink); font-weight: 900; font-size: 1rem; letter-spacing: .08em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.big svg { width: 20px; height: 20px; }
.big:active { transform: scale(.98); }
.size { font: 600 .74rem var(--mono); color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .9rem; pointer-events: none;
  transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); text-align: center; z-index: 10; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .tpl, #toast, .tog .sl, .tog .sl::after { transition: none; } }
</style>

<header class="bar">
  <div class="logo">
    <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="#22262d" stroke="#2d323b"/><path d="M8 24 C 12 8, 22 8, 26 24" fill="none" stroke="#c6f45d" stroke-width="2.6" stroke-linecap="round"/><circle cx="8" cy="24" r="2.6" fill="#ff7a59"/><circle cx="26" cy="24" r="2.6" fill="#ff7a59"/><rect x="14.5" y="9" width="5" height="5" rx="1" fill="#eef0f2" transform="rotate(45 17 11.5)"/></svg>
    <h1>SVG 動畫工坊<small>CSS · SMIL · 單一 HTML</small></h1>
  </div>
  <div class="acts">
    <button class="chip" id="replay" aria-label="重播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">重播</span></button>
    <button class="chip" id="pause" aria-pressed="false" aria-label="暫停"><svg id="pauseIco" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span class="lbl" id="pauseLbl">暫停</span></button>
    <button class="chip go" id="copyTop" aria-label="複製程式碼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg><span class="lbl">複製</span></button>
  </div>
</header>

<main class="wrap">
  <section class="stagecol" aria-label="預覽">
    <div class="tpls" role="tablist" aria-label="動畫範本" id="tpls"></div>
    <div class="frame">
      <div id="stage" role="img" aria-label="動畫即時預覽"></div>
      <div class="meta"><span id="metaL">400 × 300</span><span id="metaR"></span></div>
    </div>
    <p class="hint">選一個範本、調整文字、顏色、時間與緩動，預覽即時更新。按「複製程式碼」就能得到一個可以直接存成 .html 的完整檔案。</p>
  </section>

  <section class="panel" aria-label="參數">
    <div class="ph"><h2>參數<span id="tplName"></span></h2><button class="link" id="reset">重設範本</button></div>
    <div class="ctrls" id="controls"></div>
  </section>

  <section class="codecol" aria-label="輸出程式碼">
    <div class="ph"><h2>輸出<span>單一 HTML 檔</span></h2><span class="size" id="size"></span></div>
    <textarea id="code" readonly spellcheck="false" aria-label="產生的 HTML 程式碼"></textarea>
    <div class="copyrow">
      <button class="big" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>複製程式碼</button>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var FONT = 'system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  var W = 400, H = 300;

  var EASES = [
    ['ease', '平滑 ease', [.25, .1, .25, 1]],
    ['ease-in-out', '緩入緩出', [.42, 0, .58, 1]],
    ['cubic-bezier(.65,0,.35,1)', '強烈緩入緩出', [.65, 0, .35, 1]],
    ['cubic-bezier(.22,1,.36,1)', '急出慢停', [.22, 1, .36, 1]],
    ['cubic-bezier(.34,1.56,.64,1)', '回彈過衝', [.34, 1.56, .64, 1]],
    ['cubic-bezier(.68,-.6,.32,1.6)', '彈簧', [.68, -.6, .32, 1.6]],
    ['linear', '等速 linear', [0, 0, 1, 1]]
  ];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function n2(v) { return Math.round(v * 100) / 100; }
  var mctx = document.createElement('canvas').getContext('2d');
  function measure(txt, weight, size) { mctx.font = weight + ' ' + size + 'px ' + FONT; return mctx.measureText(txt).width; }
  function chars(s) { return Array.from(s); }

  /* ================= templates ================= */
  var TPL = {
    logo: {
      name: '描邊 Logo',
      icon: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="10" r="7" stroke-dasharray="30 14"/><path d="M5 22h16"/></svg>',
      defaults: { text: 'NOVA', sub: '海 浪 設 計 工 作 室', c1: '#ff5b36', c2: '#1d2340', bg: '#fbf5ea', dur: 2.2, stag: 0.3, ease: 'cubic-bezier(.65,0,.35,1)', loop: false },
      controls: [
        ['text', 'text', '品牌文字', { max: 14 }], ['sub', 'text', '標語', { max: 24 }],
        ['colors', [['c1', '線條'], ['c2', '文字'], ['bg', '背景']]],
        ['dur', 'range', '描繪時間', { min: 0.4, max: 5, step: 0.1, unit: ' 秒' }],
        ['stag', 'range', '元素間隔', { min: 0, max: 1.2, step: 0.05, unit: ' 秒' }],
        ['ease', 'ease', '緩動曲線'], ['loop', 'toggle', '循環播放（畫上再擦掉）']
      ],
      build: function (p) {
        var d = p.dur, s = p.stag, E = p.ease;
        var rep = p.loop ? ' infinite alternate' : '';
        var txt = p.text || ' ';
        var fs = Math.min(66, Math.floor(66 * 330 / Math.max(1, measure(txt, 900, 66) + chars(txt).length * 4)));
        var parts = [
          '<circle class="sa-d" cx="200" cy="98" r="54" pathLength="1" style="animation-delay:0s"/>',
          '<path class="sa-d" d="M178 84a22 22 0 0 1 44 0" pathLength="1" style="animation-delay:' + n2(s) + 's"/>',
          '<path class="sa-d sa-w" d="M158 104c14-14 28-14 42 0s28 14 42 0" pathLength="1" style="animation-delay:' + n2(s * 2) + 's"/>',
          '<path class="sa-d sa-w" d="M164 122c12-11 24-11 36 0s24 11 36 0" pathLength="1" style="animation-delay:' + n2(s * 3) + 's"/>'
        ];
        var tDelay = n2(s * 4), fDelay = n2(s * 4 + d * 0.6), uDelay = n2(s * 5 + d * 0.5), sDelay = n2(s * 5 + d * 0.8);
        var svg = '<g>\n    ' + parts.join('\n    ') + '\n  </g>\n' +
          '  <text class="sa-t" x="200" y="' + (196 + fs * 0.35 | 0) + '" text-anchor="middle" font-size="' + fs + '">' + esc(txt) + '</text>\n' +
          '  <path class="sa-d sa-u" d="M150 ' + (214 + fs * 0.35 | 0) + 'h100" pathLength="1" style="animation-delay:' + uDelay + 's"/>\n' +
          '  <text class="sa-s" x="200" y="' + (246 + fs * 0.35 | 0) + '" text-anchor="middle">' + esc(p.sub) + '</text>';
        var css = [
          '#sa-anim .sa-d { fill: none; stroke: ' + p.c1 + '; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;',
          '  stroke-dasharray: 1; stroke-dashoffset: 1; animation: sa-draw ' + d + 's ' + E + ' both' + rep + '; }',
          '#sa-anim .sa-w { stroke: ' + p.c2 + '; }',
          '#sa-anim .sa-t { font-weight: 900; letter-spacing: 4px; fill: ' + p.c2 + '; fill-opacity: 0; stroke: ' + p.c2 + '; stroke-width: 1.5;',
          '  stroke-dasharray: 260; stroke-dashoffset: 260;',
          '  animation: sa-tdraw ' + d + 's ' + E + ' ' + tDelay + 's both' + rep + ', sa-fill ' + n2(d * 0.6) + 's ease ' + fDelay + 's both' + rep + '; }',
          '#sa-anim .sa-s { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: ' + p.c1 + ';',
          '  animation: sa-rise ' + n2(Math.max(0.4, d * 0.4)) + 's ' + E + ' ' + sDelay + 's both' + rep + '; }',
          '@keyframes sa-draw { to { stroke-dashoffset: 0; } }',
          '@keyframes sa-tdraw { to { stroke-dashoffset: 0; } }',
          '@keyframes sa-fill { to { fill-opacity: 1; } }',
          '@keyframes sa-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }'
        ].join('\n');
        return { svg: svg, css: css, total: n2(s * 5 + d * 0.8 + Math.max(0.4, d * 0.4)) };
      }
    },

    bounce: {
      name: '彈跳文字',
      icon: '<svg viewBox="0 0 26 26" fill="currentColor"><rect x="3" y="12" width="5" height="9" rx="1"/><rect x="10.5" y="5" width="5" height="9" rx="1"/><rect x="18" y="12" width="5" height="9" rx="1"/><rect x="3" y="23" width="20" height="1.6" rx=".8"/></svg>',
      defaults: { text: '跳跳跳 HELLO!', c1: '#2952ff', c2: '#ffb020', bg: '#fff6dc', dur: 0.9, stag: 0.08, amp: 44, ease: 'ease-in-out', loop: true },
      controls: [
        ['text', 'text', '文字', { max: 16 }],
        ['colors', [['c1', '文字'], ['c2', '影子'], ['bg', '背景']]],
        ['dur', 'range', '單次彈跳', { min: 0.3, max: 2.5, step: 0.05, unit: ' 秒' }],
        ['stag', 'range', '字元錯開', { min: 0, max: 0.3, step: 0.01, unit: ' 秒' }],
        ['amp', 'range', '彈跳高度', { min: 8, max: 90, step: 1, unit: ' px' }],
        ['ease', 'ease', '緩動曲線'], ['loop', 'toggle', '無限循環']
      ],
      build: function (p) {
        var cs = chars(p.text || ' ').slice(0, 16);
        var fs = 54, gap = 2;
        var ws = cs.map(function (c) { return c === ' ' ? fs * 0.32 : measure(c, 800, fs); });
        var total = ws.reduce(function (a, b) { return a + b + gap; }, -gap);
        if (total > 350) { var k = 350 / total; fs = Math.floor(fs * k); ws = ws.map(function (w) { return w * k; }); total = 350; }
        var x = (W - total) / 2, base = 190, out = [], sh = [], idx = 0;
        cs.forEach(function (c, i) {
          var cx = x + ws[i] / 2; x += ws[i] + gap;
          if (c === ' ') return;
          var dl = n2(idx * p.stag); idx++;
          sh.push('<ellipse class="sa-sh" cx="' + n2(cx) + '" cy="' + (base + 14) + '" rx="' + n2(ws[i] * 0.42) + '" ry="5" style="animation-delay:' + dl + 's"/>');
          out.push('<text class="sa-l" x="' + n2(cx) + '" y="' + base + '" style="animation-delay:' + dl + 's">' + esc(c) + '</text>');
        });
        var it = p.loop ? 'infinite' : '2';
        var A = p.amp;
        var svg = '<g>\n    ' + sh.join('\n    ') + '\n  </g>\n  <g font-size="' + fs + '">\n    ' + out.join('\n    ') + '\n  </g>';
        var css = [
          '#sa-anim .sa-l { font-weight: 800; text-anchor: middle; fill: ' + p.c1 + ';',
          '  transform-box: fill-box; transform-origin: 50% 100%;',
          '  animation: sa-bounce ' + p.dur + 's ' + p.ease + ' ' + it + ' both; }',
          '#sa-anim .sa-sh { fill: ' + p.c2 + '; opacity: .45; transform-box: fill-box; transform-origin: 50% 50%;',
          '  animation: sa-shadow ' + p.dur + 's ' + p.ease + ' ' + it + ' both; }',
          '@keyframes sa-bounce {',
          '  0%, 100% { transform: translateY(0) scale(1.12, .86); }',
          '  20% { transform: translateY(0) scale(.95, 1.06); }',
          '  50% { transform: translateY(-' + A + 'px) scale(1, 1); }',
          '  80% { transform: translateY(0) scale(.98, 1.03); }',
          '}',
          '@keyframes sa-shadow {',
          '  0%, 100% { transform: scale(1.15, 1); opacity: .5; }',
          '  50% { transform: scale(.55, .8); opacity: .18; }',
          '}'
        ].join('\n');
        return { svg: svg, css: css, total: n2(p.dur * (p.loop ? 1 : 2) + (idx - 1) * p.stag) };
      }
    },

    bars: {
      name: '成長長條圖',
      icon: '<svg viewBox="0 0 26 26" fill="currentColor"><rect x="3" y="14" width="4.5" height="9" rx="1"/><rect x="10.5" y="8" width="4.5" height="15" rx="1"/><rect x="18" y="3" width="4.5" height="20" rx="1"/></svg>',
      defaults: { title: '每月營收（萬元）', data: '32, 58, 44, 81, 67', labels: '一月, 二月, 三月, 四月, 五月', c1: '#15a37f', c2: '#1f2a33', bg: '#f2f6f3', dur: 1.2, stag: 0.15, ease: 'cubic-bezier(.34,1.56,.64,1)', loop: false },
      controls: [
        ['title', 'text', '圖表標題', { max: 24 }],
        ['data', 'text', '數值（以逗號分隔，最多 8 筆）', { max: 60 }],
        ['labels', 'text', '標籤（以逗號分隔）', { max: 80 }],
        ['colors', [['c1', '長條'], ['c2', '文字'], ['bg', '背景']]],
        ['dur', 'range', '成長時間', { min: 0.3, max: 4, step: 0.1, unit: ' 秒' }],
        ['stag', 'range', '長條間隔', { min: 0, max: 0.6, step: 0.01, unit: ' 秒' }],
        ['ease', 'ease', '緩動曲線'], ['loop', 'toggle', '循環播放（長出再收回）']
      ],
      build: function (p) {
        var nums = String(p.data).split(/[,，、\s]+/).map(parseFloat).filter(function (v) { return isFinite(v) && v >= 0; }).slice(0, 8);
        if (!nums.length) nums = [10];
        var labs = String(p.labels).split(/[,，、]+/).map(function (s) { return s.trim(); });
        var mx = Math.max.apply(null, nums) || 1;
        var stepRaw = mx / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).filter(function (v) { return v >= stepRaw; })[0];
        var top = step * 4;
        var x0 = 52, x1 = 376, y0 = 74, yb = 248, n = nums.length, slot = (x1 - x0) / n, bw = Math.min(46, slot * 0.62);
        var rep = p.loop ? ' infinite alternate' : '';
        var g = [], bars = [], vals = [], labsOut = [];
        for (var i = 0; i <= 4; i++) {
          var y = n2(yb - (yb - y0) * i / 4), v = step * i;
          g.push('<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" class="sa-g"/><text x="' + (x0 - 8) + '" y="' + n2(y + 4) + '" class="sa-ax">' + (Math.round(v * 100) / 100) + '</text>');
        }
        nums.forEach(function (v, i) {
          var h = n2((yb - y0) * v / top), x = n2(x0 + slot * i + (slot - bw) / 2), dl = n2(i * p.stag);
          var isMax = v === mx;
          bars.push('<rect class="sa-bar" x="' + x + '" y="' + n2(yb - h) + '" width="' + n2(bw) + '" height="' + Math.max(h, 0.01) + '" rx="4"' + (isMax ? '' : ' fill-opacity=".62"') + ' style="animation-delay:' + dl + 's"/>');
          vals.push('<text class="sa-v" x="' + n2(x + bw / 2) + '" y="' + n2(yb - h - 8) + '" style="animation-delay:' + n2(i * p.stag + p.dur * 0.7) + 's">' + (Math.round(v * 100) / 100) + '</text>');
          labsOut.push('<text class="sa-lb" x="' + n2(x + bw / 2) + '" y="' + (yb + 22) + '">' + esc(labs[i] || '') + '</text>');
        });
        var svg = '<text class="sa-title" x="24" y="42">' + esc(p.title) + '</text>\n  <g>\n    ' + g.join('\n    ') + '\n  </g>\n  <g>\n    ' + bars.join('\n    ') +
          '\n  </g>\n  <g>\n    ' + vals.join('\n    ') + '\n  </g>\n  <g>\n    ' + labsOut.join('\n    ') + '\n  </g>\n  <line x1="' + x0 + '" x2="' + x1 + '" y1="' + yb + '" y2="' + yb + '" class="sa-base"/>';
        var css = [
          '#sa-anim .sa-title { font-size: 19px; font-weight: 800; fill: ' + p.c2 + '; animation: sa-pop .6s ease both; }',
          '#sa-anim .sa-g { stroke: ' + p.c2 + '; stroke-opacity: .12; stroke-dasharray: 3 4; }',
          '#sa-anim .sa-base { stroke: ' + p.c2 + '; stroke-width: 2; stroke-linecap: round; }',
          '#sa-anim .sa-ax { font-size: 11px; text-anchor: end; fill: ' + p.c2 + '; fill-opacity: .55; }',
          '#sa-anim .sa-lb { font-size: 13px; font-weight: 500; text-anchor: middle; fill: ' + p.c2 + '; fill-opacity: .8; }',
          '#sa-anim .sa-bar { fill: ' + p.c1 + '; transform-box: fill-box; transform-origin: 50% 100%;',
          '  animation: sa-grow ' + p.dur + 's ' + p.ease + ' both' + rep + '; }',
          '#sa-anim .sa-v { font-size: 13px; font-weight: 800; text-anchor: middle; fill: ' + p.c2 + ';',
          '  animation: sa-pop .5s ease both' + rep + '; }',
          '@keyframes sa-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }',
          '@keyframes sa-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }'
        ].join('\n');
        return { svg: svg, css: css, total: n2((n - 1) * p.stag + p.dur * 0.7 + 0.5) };
      }
    },

    wave: {
      name: '揮手角色',
      icon: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="15" r="7"/><path d="M17 12l4-5"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="13" cy="14" r=".6" fill="currentColor"/></svg>',
      defaults: { say: '嗨！歡迎光臨～', c1: '#ffb03b', c2: '#ff5d73', bg: '#e6f2ff', dur: 0.6, ease: 'ease-in-out', loop: true },
      controls: [
        ['say', 'text', '對話框文字', { max: 14 }],
        ['colors', [['c1', '身體'], ['c2', '腮紅與腳'], ['bg', '背景']]],
        ['dur', 'range', '揮手速度（單趟）', { min: 0.2, max: 2, step: 0.05, unit: ' 秒' }],
        ['ease', 'ease', '緩動曲線'], ['loop', 'toggle', '一直揮手']
      ],
      build: function (p) {
        var say = p.say || ' ';
        var tw = Math.min(220, measure(say, 700, 18)), bwid = Math.max(84, tw + 36), bx = Math.max(12, 150 - bwid + 30);
        var it = p.loop ? 'infinite' : '6';
        var svg = [
          '<ellipse class="sa-shadow" cx="200" cy="272" rx="72" ry="9"/>',
          '<ellipse cx="170" cy="264" rx="20" ry="10" fill="' + p.c2 + '"/>',
          '<ellipse cx="230" cy="264" rx="20" ry="10" fill="' + p.c2 + '"/>',
          '<g class="sa-body">',
          '    <path d="M146 182q-22 14-26 36" class="sa-limb"/>',
          '    <g class="sa-arm">',
          '      <path d="M256 176q26-12 34-46" class="sa-limb"/>',
          '      <circle cx="291" cy="124" r="13" fill="' + p.c1 + '"/>',
          '    </g>',
          '    <path d="M200 96c50 0 80 40 80 92 0 44-30 70-80 70s-80-26-80-70c0-52 30-92 80-92z" fill="' + p.c1 + '"/>',
          '    <ellipse cx="200" cy="212" rx="42" ry="32" fill="#fff" fill-opacity=".32"/>',
          '    <ellipse cx="180" cy="160" rx="7" ry="9" fill="#26201c">',
          '      <animate attributeName="ry" values="9;9;1;9" keyTimes="0;.9;.95;1" dur="3.4s" repeatCount="indefinite"/>',
          '    </ellipse>',
          '    <ellipse cx="220" cy="160" rx="7" ry="9" fill="#26201c">',
          '      <animate attributeName="ry" values="9;9;1;9" keyTimes="0;.9;.95;1" dur="3.4s" repeatCount="indefinite"/>',
          '    </ellipse>',
          '    <circle cx="164" cy="180" r="9" fill="' + p.c2 + '" fill-opacity=".55"/>',
          '    <circle cx="236" cy="180" r="9" fill="' + p.c2 + '" fill-opacity=".55"/>',
          '    <path d="M189 182q11 12 22 0" fill="none" stroke="#26201c" stroke-width="4" stroke-linecap="round"/>',
          '  </g>',
          '<g class="sa-bubble">',
          '    <rect x="' + n2(bx) + '" y="26" width="' + n2(bwid) + '" height="46" rx="23" fill="#fff" stroke="#26201c" stroke-width="3"/>',
          '    <path d="M' + n2(Math.min(bx + bwid - 34, 142)) + ' 70l18 22 4-22" fill="#fff" stroke="#26201c" stroke-width="3" stroke-linejoin="round"/>',
          '    <rect x="' + n2(Math.min(bx + bwid - 36, 140)) + '" y="64" width="28" height="6" fill="#fff"/>',
          '    <text x="' + n2(bx + bwid / 2) + '" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#26201c">' + esc(say) + '</text>',
          '  </g>'
        ].join('\n  ');
        var css = [
          '#sa-anim .sa-limb { fill: none; stroke: ' + p.c1 + '; stroke-width: 16; stroke-linecap: round; }',
          '#sa-anim .sa-arm { transform-origin: 256px 178px; animation: sa-wave ' + p.dur + 's ' + p.ease + ' ' + it + ' alternate both; }',
          '#sa-anim .sa-body { animation: sa-bob ' + n2(p.dur * 2) + 's ease-in-out infinite alternate; }',
          '#sa-anim .sa-shadow { fill: #000; opacity: .12; transform-origin: 200px 272px; animation: sa-squash ' + n2(p.dur * 2) + 's ease-in-out infinite alternate; }',
          '#sa-anim .sa-bubble { transform-origin: 150px 94px; animation: sa-popin .6s ' + p.ease + ' .3s both; }',
          '@keyframes sa-wave { from { transform: rotate(-14deg); } to { transform: rotate(24deg); } }',
          '@keyframes sa-bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }',
          '@keyframes sa-squash { from { transform: scale(1); } to { transform: scale(.88); } }',
          '@keyframes sa-popin { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }'
        ].join('\n');
        return { svg: svg, css: css, total: p.loop ? null : n2(p.dur * 6) };
      }
    }
  };
  var ORDER = ['logo', 'bounce', 'bars', 'wave'];

  /* ================= state ================= */
  function load() { try { return JSON.parse(localStorage.getItem('svg-anim-studio') || 'null'); } catch (e) { return null; } }
  function save() { try { localStorage.setItem('svg-anim-studio', JSON.stringify({ cur: cur, params: params })); } catch (e) {} }
  var saved = load();
  var params = {};
  ORDER.forEach(function (k) { params[k] = Object.assign({}, TPL[k].defaults, saved && saved.params && saved.params[k] || {}); });
  var cur = saved && TPL[saved.cur] ? saved.cur : 'logo';

  /* ================= template tabs ================= */
  var tplsEl = $('tpls');
  ORDER.forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'tpl'; b.setAttribute('role', 'tab'); b.dataset.k = k; b.id = 'tab-' + k;
    b.innerHTML = TPL[k].icon + '<span>' + TPL[k].name + '</span>';
    b.addEventListener('click', function () { if (cur !== k) { cur = k; save(); renderControls(); render(); } });
    tplsEl.appendChild(b);
  });
  tplsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = ORDER.indexOf(cur) + (e.key === 'ArrowRight' ? 1 : -1);
    i = (i + ORDER.length) % ORDER.length;
    $('tab-' + ORDER[i]).click(); $('tab-' + ORDER[i]).focus(); e.preventDefault();
  });

  /* ================= controls ================= */
  var ctrlEl = $('controls');
  function curvePath(b) {
    var x = function (v) { return n2(4 + v * 56); }, y = function (v) { return n2(40 - v * 36); };
    return { d: 'M' + x(0) + ' ' + y(0) + 'C' + x(b[0]) + ' ' + y(b[1]) + ' ' + x(b[2]) + ' ' + y(b[3]) + ' ' + x(1) + ' ' + y(1),
      h: [x(0), y(0), x(b[0]), y(b[1]), x(1), y(1), x(b[2]), y(b[3])] };
  }
  function setCurve(svg, val) {
    var e = EASES.filter(function (q) { return q[0] === val; })[0] || EASES[0];
    var c = curvePath(e[2]);
    svg.innerHTML = '<line class="gd" x1="4" y1="40" x2="60" y2="40"/><line class="gd" x1="4" y1="4" x2="60" y2="4"/>' +
      '<line class="hd" x1="' + c.h[0] + '" y1="' + c.h[1] + '" x2="' + c.h[2] + '" y2="' + c.h[3] + '"/><line class="hd" x1="' + c.h[4] + '" y1="' + c.h[5] + '" x2="' + c.h[6] + '" y2="' + c.h[7] + '"/>' +
      '<circle cx="' + c.h[2] + '" cy="' + c.h[3] + '" r="2.5"/><circle cx="' + c.h[6] + '" cy="' + c.h[7] + '" r="2.5"/><path class="cv" d="' + c.d + '"/>';
  }
  function rangeFill(inp) { var p = (inp.value - inp.min) / (inp.max - inp.min) * 100; inp.style.setProperty('--p', p + '%'); }
  function fmt(v, step) { return step < 0.1 ? Number(v).toFixed(2) : step < 1 ? Number(v).toFixed(1) : String(v); }

  function renderControls() {
    var t = TPL[cur], P = params[cur];
    $('tplName').textContent = t.name;
    Array.prototype.forEach.call(tplsEl.children, function (b) {
      var on = b.dataset.k === cur; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
    });
    ctrlEl.innerHTML = '';
    t.controls.forEach(function (c, ci) {
      var key = c[0], type = c[1], id = 'ctl-' + key + '-' + ci;
      var f = document.createElement('div'); f.className = 'f';
      if (key === 'colors') {
        f.innerHTML = '<div class="lab">顏色</div>';
        var row = document.createElement('div'); row.className = 'colors';
        type.forEach(function (cc) {
          var w = document.createElement('label'); w.className = 'sw';
          w.innerHTML = '<span>' + cc[1] + '</span><span class="well" style="background:' + P[cc[0]] + '"><input type="color" value="' + P[cc[0]] + '" aria-label="' + cc[1] + '顏色"><span class="hex">' + P[cc[0]].toUpperCase() + '</span></span>';
          var inp = w.querySelector('input'), well = w.querySelector('.well'), hex = w.querySelector('.hex');
          inp.addEventListener('input', function () { P[cc[0]] = inp.value; well.style.background = inp.value; hex.textContent = inp.value.toUpperCase(); schedule(); });
          row.appendChild(w);
        });
        f.appendChild(row);
      } else if (type === 'text') {
        f.innerHTML = '<label for="' + id + '">' + c[2] + '</label><input type="text" id="' + id + '" maxlength="' + c[3].max + '" autocomplete="off">';
        var ti = f.querySelector('input'); ti.value = P[key];
        ti.addEventListener('input', function () { P[key] = ti.value; schedule(); });
      } else if (type === 'range') {
        var o = c[3];
        f.innerHTML = '<label for="' + id + '"><span>' + c[2] + '</span><output id="' + id + '-o"></output></label><input type="range" id="' + id + '" min="' + o.min + '" max="' + o.max + '" step="' + o.step + '">';
        var ri = f.querySelector('input'), out = f.querySelector('output');
        ri.value = P[key]; out.textContent = fmt(P[key], o.step) + o.unit; rangeFill(ri);
        ri.addEventListener('input', function () { P[key] = parseFloat(ri.value); out.textContent = fmt(ri.value, o.step) + o.unit; rangeFill(ri); schedule(); });
      } else if (type === 'ease') {
        f.innerHTML = '<label for="' + id + '">' + c[2] + '</label><div class="ease"><select id="' + id + '"></select><svg class="curve" viewBox="0 0 64 44" aria-hidden="true"></svg></div>';
        var sel = f.querySelector('select'), cv = f.querySelector('svg');
        EASES.forEach(function (e) { var op = document.createElement('option'); op.value = e[0]; op.textContent = e[1]; sel.appendChild(op); });
        sel.value = P[key]; if (!sel.value) { sel.value = 'ease'; P[key] = 'ease'; }
        setCurve(cv, P[key]);
        sel.addEventListener('change', function () { P[key] = sel.value; setCurve(cv, sel.value); schedule(); });
      } else if (type === 'toggle') {
        f.innerHTML = '<label class="tog"><span>' + c[2] + '</span><input type="checkbox" id="' + id + '"><span class="sl" aria-hidden="true"></span></label>';
        var cb = f.querySelector('input'); cb.checked = !!P[key];
        cb.addEventListener('change', function () { P[key] = cb.checked; schedule(); });
      }
      ctrlEl.appendChild(f);
    });
  }

  /* ================= render ================= */
  var stage = $('stage'), codeEl = $('code'), paused = false, pending = 0;
  function buildDoc(t, P, r) {
    var svgOpen = '<svg id="sa-anim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t.name) + '">';
    return [
      '<!doctype html>',
      '<html lang="zh-Hant">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>' + esc(t.name) + '｜SVG 動畫</title>',
      '<style>',
      'html, body { height: 100%; margin: 0; }',
      'body { display: grid; place-items: center; background: ' + P.bg + '; }',
      '#sa-anim { width: min(92vw, 720px); height: auto; overflow: visible; }',
      '#sa-anim text { font-family: ' + FONT + '; }',
      r.css,
      '/* 尊重「減少動態效果」設定：直接顯示最終畫面 */',
      '@media (prefers-reduced-motion: reduce) {',
      '  #sa-anim * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }',
      '}',
      '</style>',
      '</head>',
      '<body>',
      svgOpen,
      '  ' + r.svg,
      '</svg>',
      '</body>',
      '</html>',
      ''
    ].join('\n');
  }
  function render() {
    pending = 0;
    var t = TPL[cur], P = params[cur], r = t.build(P);
    stage.style.background = P.bg;
    stage.innerHTML = '<style>#sa-anim text{font-family:' + FONT + '}\n' + r.css + '</style>' +
      '<svg id="sa-anim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + r.svg + '</svg>';
    var code = buildDoc(t, P, r);
    codeEl.value = code;
    $('size').textContent = (new Blob([code]).size / 1024).toFixed(1) + ' KB';
    $('metaR').innerHTML = r.total ? '時長 <b>' + r.total + ' 秒</b>' + (P.loop ? ' · 循環' : '') : '<b>循環播放</b>';
    setPaused(false);
  }
  function schedule() { save(); if (!pending) pending = requestAnimationFrame(render); }

  function setPaused(v) {
    paused = v;
    stage.classList.toggle('paused', v);
    var svg = stage.querySelector('svg');
    if (svg && svg.pauseAnimations) { try { v ? svg.pauseAnimations() : svg.unpauseAnimations(); } catch (e) {} }
    var b = $('pause'); b.setAttribute('aria-pressed', String(v)); b.setAttribute('aria-label', v ? '繼續播放' : '暫停');
    $('pauseLbl').textContent = v ? '播放' : '暫停';
    $('pauseIco').innerHTML = v ? '<path d="M7 5l12 7-12 7z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  }
  $('pause').addEventListener('click', function () { setPaused(!paused); });
  $('replay').addEventListener('click', render);
  $('reset').addEventListener('click', function () {
    params[cur] = Object.assign({}, TPL[cur].defaults); save(); renderControls(); render(); toast('已重設為範例');
  });

  /* ================= copy ================= */
  var tt = 0;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 2400);
  }
  function fallbackCopy() {
    codeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    codeEl.focus({ preventScroll: true });
    codeEl.select(); codeEl.setSelectionRange(0, codeEl.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    toast(ok ? '已複製！存成 .html 檔即可播放' : '已選取全部程式碼，請按 Ctrl／⌘ + C 複製');
  }
  function copyCode() {
    var code = codeEl.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () { toast('已複製！存成 .html 檔即可播放'); }, fallbackCopy);
    } else fallbackCopy();
  }
  $('copy').addEventListener('click', copyCode);
  $('copyTop').addEventListener('click', copyCode);

  document.addEventListener('visibilitychange', function () {
    var svg = stage.querySelector('svg');
    if (!svg || paused) return;
    stage.classList.toggle('paused', document.hidden);
    try { document.hidden ? svg.pauseAnimations() : svg.unpauseAnimations(); } catch (e) {}
  });

  renderControls();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { /* re-measure text once webfonts settle */ render(); });
})();
</script>
