<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>SVG 動畫工坊</title>
<style>
/* A motion-design bench: graphite (dark) or paper (light) workspace, lime "keyframe" accent, live SVG stage, code tray.
   System fonts only: the page makes no network requests. */
:root {
  color-scheme: dark;
  --bg: #121417;
  --panel: #1a1d22;
  --panel-2: #22262d;
  --line: #2d323b;
  --line-2: #444b57;
  --ink: #eef0f2;
  --muted: #929aa6;
  --lime: #c6f45d;
  --lime-ink: #18200a;
  --acc: #c6f45d;
  --fill: #c6f45d;
  --fill-ink: #18200a;
  --coral: #ff7a59;
  --bar: rgba(18,20,23,.92);
  --sel: #20251a;
  --dot: #2a2f37;
  --code-bg: #0d0f12;
  --code-ink: #cfe3a0;
  --err: #ff9482;
  --err-bg: rgba(255,90,60,.12);
  --shade: rgba(0,0,0,.35);
  --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --body: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --r: 14px;
  --hh: 65px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f3f4f0;
    --panel: #ffffff;
    --panel-2: #eceee8;
    --line: #d6dad0;
    --line-2: #aeb5a6;
    --ink: #17191c;
    --muted: #59616b;
    --acc: #437008;
    --fill: #5a8a10;
    --fill-ink: #ffffff;
    --coral: #dc4f2b;
    --bar: rgba(243,244,240,.93);
    --sel: #f0f9dc;
    --dot: #e0e3db;
    --code-bg: #f8f9f5;
    --code-ink: #2c4609;
    --err: #b42a12;
    --err-bg: rgba(220,60,30,.08);
    --shade: rgba(40,50,30,.16);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body);
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; background: var(--bar); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo h1 { margin: 0; min-width: 0; font-size: 1.08rem; font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
.logo h1 small { display: block; font: 600 .62rem/1 var(--mono); color: var(--muted); letter-spacing: .14em; margin-top: 3px; }
.acts { display: flex; gap: 6px; flex: none; }
.chip { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .86rem; font-weight: 500; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; flex: none; }
@media (hover: hover) { .chip:hover { border-color: var(--line-2); } }
.chip:active { filter: brightness(1.15); }
.chip.go { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); font-weight: 700; }
@media (max-width: 600px) { .chip .lbl { display: none; } .chip { padding: 0 10px; } }
@media (max-width: 400px) { .logo h1 small { display: none; } }
@media (max-width: 360px) { .bar { padding: 10px 12px; gap: 8px; } .acts { gap: 4px; } .logo { gap: 8px; } .logo svg { width: 28px; height: 28px; } .logo h1 { font-size: 1rem; } }
@media (max-width: 340px) { .logo svg { display: none; } }

/* Phones (one column): the preview frame stays pinned under the header while the settings scroll beneath it. */
.wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 104px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.stagecol { display: contents; }
.frame { position: sticky; top: var(--hh); z-index: 4; padding: 6px; }
#stage { width: min(100%, calc((33vh - 40px) * 4 / 3)); margin: 0 auto; }
/* tall enough: the template tabs stay pinned too (compact, text only), so switching never needs scrolling back up */
@media (min-height: 560px) {
  .tpls { position: sticky; top: var(--hh); z-index: 4; background: var(--bg); padding: 6px 0; margin: -6px 0; }
  .tpls .tpl { min-height: 44px; padding: 4px 2px; align-content: center; }
  .tpls .tpl svg { display: none; }
  .frame { top: calc(var(--hh) + 56px); }
  #stage { width: min(100%, calc(min(33vh - 40px, 50vh - 171px) * 4 / 3)); }
}
.meta { margin-top: 4px; }
.hint { margin: 0 2px; }
/* Wide screens and phones held sideways: preview column on the left (pinned, sized to fit the screen), settings and code on the right. */
@media (min-width: 920px), (orientation: landscape) and (min-width: 560px) {
  .wrap { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 18px; }
  .stagecol { display: block; grid-column: 1; grid-row: 1 / span 2; position: sticky; top: calc(var(--hh) + 14px); }
  .panel { grid-column: 2; grid-row: 1; }
  .codecol { grid-column: 2; grid-row: 2; }
  .frame { position: relative; top: auto; z-index: auto; padding: 10px; }
  #stage { width: min(100%, calc((100vh - var(--hh) - 200px) * 4 / 3)); }
  .meta { margin-top: 8px; }
  .hint { margin: 10px 2px 0; }
  .tpls { margin: 0 0 10px; position: static; padding: 0; background: none; }
  .tpls .tpl { min-height: 64px; padding: 8px 4px 7px; }
  .tpls .tpl svg { display: block; }
}

.tpls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tpl { min-height: 64px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); padding: 8px 4px 7px;
  display: grid; justify-items: center; gap: 4px; font-size: .78rem; color: var(--muted); transition: border-color .2s, color .2s, background .2s; }
.tpl svg { width: 26px; height: 26px; }
.tpl[aria-selected="true"] { color: var(--ink); border-color: var(--fill); box-shadow: inset 0 0 0 1px var(--fill); background: var(--sel); }
.tpl[aria-selected="true"] svg { color: var(--acc); }

.frame { border-radius: var(--r); background:
  radial-gradient(circle, var(--dot) 1px, transparent 1.4px) 0 0 / 14px 14px, var(--panel); border: 1px solid var(--line); }
#stage { border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; display: grid; place-items: center;
  box-shadow: 0 10px 30px var(--shade); transition: background .3s; }
#stage svg { width: 100%; height: 100%; display: block; }
#stage.paused * { animation-play-state: paused !important; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 .74rem var(--mono); color: var(--muted); }
.meta b { color: var(--acc); font-weight: 600; }
.hint { color: var(--muted); font-size: .84rem; }

.panel, .codecol { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; gap: 8px; }
.ph h2 { margin: 0; font: 800 .8rem var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.ph h2 span { color: var(--ink); font-family: var(--body); letter-spacing: .04em; font-size: .95rem; margin-left: 6px; text-transform: none; }
.link { color: var(--muted); font-size: .82rem; padding: 8px 6px; border-radius: 8px; min-height: 44px; }
@media (hover: hover) { .link:hover { color: var(--ink); } }

.ctrls { display: grid; gap: 12px; }
.f { display: grid; gap: 6px; }
.f > label, .f > .lab { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.f output { font: 600 .8rem var(--mono); color: var(--acc); }
.f input[type=text] { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; width: 100%; }
.f input[type=text]:focus { border-color: var(--acc); outline: none; }
.f input[type=text][aria-invalid="true"] { border-color: var(--err); }
.ferr { margin: 0; padding: 6px 10px; border-radius: 8px; font-size: .8rem; line-height: 1.45; color: var(--err); background: var(--err-bg); }
.fnote { margin: 0; font-size: .78rem; color: var(--muted); }
.colors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sw { display: grid; gap: 4px; font-size: .76rem; color: var(--muted); }
.sw .well { position: relative; height: 44px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: flex-end; }
.sw input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw .hex { position: relative; pointer-events: none; font: 600 .7rem var(--mono); background: rgba(0,0,0,.45); color: #fff; padding: 1px 6px; border-top-right-radius: 6px; }
.sw .well:focus-within { outline: 2px solid var(--acc); outline-offset: 2px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--fill) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9px; background: var(--ink); border: 4px solid var(--fill); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--fill); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 4px solid var(--fill); }

.ease { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
.ease select { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 15px; width: 100%; }
.curve { width: 64px; height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); overflow: visible; }
.curve .gd { stroke: var(--line); }
.curve .cv { stroke: var(--acc); stroke-width: 2.4; fill: none; }
.curve .hd { stroke: var(--coral); stroke-width: 1; }
.curve circle { fill: var(--coral); }

.tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; font-size: .9rem; cursor: pointer; }
.tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tog .sl { width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.tog .sl::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.tog input:checked + .sl { background: var(--fill); }
.tog input:checked + .sl::after { transform: translateX(20px); background: var(--fill-ink); }
.tog input:focus-visible + .sl { outline: 2px solid var(--acc); outline-offset: 2px; }

#code { width: 100%; height: 240px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--code-bg); color: var(--code-ink);
  font: 400 12px/1.6 var(--mono); padding: 10px 12px; white-space: pre; overflow: auto; tab-size: 2; }
.copyrow { display: flex; gap: 8px; margin-top: 10px; }
.big { flex: 1 1 0; min-width: 0; height: 52px; padding: 0 10px; border-radius: 12px; background: var(--lime); color: var(--lime-ink); font-weight: 900; font-size: 1rem; letter-spacing: .04em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; border: 1px solid var(--lime); }
.big.alt { background: var(--panel-2); color: var(--ink); border-color: var(--line); font-weight: 700; }
.big svg { width: 20px; height: 20px; flex: none; }
.big:active { filter: brightness(1.12); }
.size { font: 600 .74rem var(--mono); color: var(--muted); }

/* short landscape phones: compact tabs so the whole preview column fits the screen */
@media (orientation: landscape) and (min-width: 560px) and (max-height: 620px) {
  .hint { display: none; }
  .tpls .tpl { min-height: 44px; padding: 4px; align-content: center; }
  .tpls .tpl svg { display: none; }
  #stage { width: min(100%, calc((100vh - var(--hh) - 125px) * 4 / 3)); }
}
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .9rem; pointer-events: none;
  transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); text-align: center; z-index: 10;
  display: flex; align-items: center; gap: 12px; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.on.act { pointer-events: auto; }
#toast button { min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--lime); color: var(--lime-ink); font-weight: 800; white-space: nowrap; }
#toast:not(.act) button { display: none; }
@media (prefers-reduced-motion: reduce) { .tpl, #toast, .tog .sl, .tog .sl::after { transition: none; } }
</style>
