<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>銅管水坊</title>
<style>
:root{
  --bg:#12302a; --bg2:#0c231e; --gridc:rgba(227,168,105,.05);
  --ink:#f5e7cc; --ink2:#b9c8b4; --mute:#7f9a8e;
  --panel:rgba(20,52,45,.88); --panelb:rgba(227,168,105,.28);
  --card:#173d35; --cardb:#2c5a4d;
  --cu1:#b87333; --cu2:#e3a869; --cuD:#4e2a10; --groove:#24150a;
  --plate:#18392f; --plate2:#1d4438; --hole:#0b1f1a; --steel:#2b4a44; --frame:#8a5a2b;
  --water:#39c6e0; --red:#ff5a5f; --blue:#4a7dff; --mix:#a14bff; --gold:#ffcf5a; --leak:#ff4d4d;
  --btn1:#e9b071; --btn2:#b87333; --btnsh:#6b3d17; --btnink:#2a1606;
  --sec:#22493f; --secsh:#102822;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"]{
  --bg:#efe6d2; --bg2:#e6dabf; --gridc:rgba(120,72,30,.07);
  --ink:#3a2512; --ink2:#6e5537; --mute:#9a8466;
  --panel:rgba(255,249,236,.9); --panelb:rgba(154,90,36,.3);
  --card:#fbf4e4; --cardb:#e2cfa8;
  --cu1:#9a5a24; --cu2:#cf8f50; --cuD:#3f210b; --groove:#2c1808;
  --plate:#e3d6b6; --plate2:#d9c9a3; --hole:#c4b28c; --steel:#b9b3a3; --frame:#9a5a24;
  --water:#1aa7c4; --red:#e8434a; --blue:#3a68e8; --mix:#8e3ae6; --gold:#e6a300; --leak:#e0302f;
  --btn1:#d18f4f; --btn2:#9a5a24; --btnsh:#5e3412; --btnink:#fff8ec;
  --sec:#ece0c5; --secsh:#cdb88f;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg:#efe6d2; --bg2:#e6dabf; --gridc:rgba(120,72,30,.07);
    --ink:#3a2512; --ink2:#6e5537; --mute:#9a8466;
    --panel:rgba(255,249,236,.9); --panelb:rgba(154,90,36,.3);
    --card:#fbf4e4; --cardb:#e2cfa8;
    --cu1:#9a5a24; --cu2:#cf8f50; --cuD:#3f210b; --groove:#2c1808;
    --plate:#e3d6b6; --plate2:#d9c9a3; --hole:#c4b28c; --steel:#b9b3a3; --frame:#9a5a24;
    --water:#1aa7c4; --red:#e8434a; --blue:#3a68e8; --mix:#8e3ae6; --gold:#e6a300; --leak:#e0302f;
    --btn1:#d18f4f; --btn2:#9a5a24; --btnsh:#5e3412; --btnink:#fff8ec;
    --sec:#ece0c5; --secsh:#cdb88f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);
  display:flex;align-items:center;gap:6px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:13px;background:var(--panel);border:1px solid var(--panelb);
  display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.ibtn[disabled]{opacity:.4}
.hmid{flex:1;min-width:0;background:var(--panel);border:1px solid var(--panelb);border-radius:13px;height:44px;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.15}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.drops{display:inline-flex;gap:1px}
.drops i{width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--mute);opacity:.35;display:block}
.drops i.on{background:var(--water);opacity:1}
.stat{font-size:11px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.2}
.stat b{color:var(--ink);font-size:15px}
.stat b.over{color:var(--leak)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);
  display:flex;justify-content:center;align-items:center;gap:8px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:48px;min-width:48px;padding:0 14px;border-radius:24px;background:var(--panel);border:1px solid var(--panelb);
  display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;box-shadow:0 3px 12px rgba(0,0,0,.18);white-space:nowrap}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.4}
.pill .cnt{background:var(--gold);color:#2a1606;border-radius:10px;font-size:12px;padding:1px 6px;font-weight:800}
.thr{flex:0 1 auto;min-width:0;height:48px;padding:0 12px;border-radius:24px;background:var(--panel);border:1px solid var(--panelb);
  display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.thr span{display:flex;align-items:center;gap:3px}
.thr em{font-style:normal;color:var(--gold);letter-spacing:-1px;font-size:13px}
.thr b{color:var(--ink);font-size:13px}
.thr span.dim{opacity:.4}
@media (max-width:380px){ .thr span:last-child{display:none} .pill{padding:0 12px} }
@media (orientation:landscape) and (max-height:500px){
  .bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--sat) + 60px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) 6px}
  .thr{flex-direction:column;height:auto;padding:8px 10px;gap:4px;border-radius:16px}
}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:rgba(6,20,17,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
:root[data-theme="light"] .ov{background:rgba(120,90,50,.35)}
@media (prefers-color-scheme: light){ :root:not([data-theme]) .ov{background:rgba(120,90,50,.35)} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:2px solid var(--cardb);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
  padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);position:relative;margin:auto}
.card::before,.card::after{content:"";position:absolute;top:10px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--cu2),var(--cu1) 60%,var(--cuD));}
.card::before{left:10px}.card::after{right:10px}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:16px;margin-top:12px;font-weight:800;font-size:17px;letter-spacing:1px;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--btnink);box-shadow:0 5px 0 var(--btnsh),0 8px 18px rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh)}
.btn.sec:active{box-shadow:0 1px 0 var(--secsh)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--mute);opacity:.9}
.stars span{display:inline-block}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #a86f00,0 0 18px rgba(255,207,90,.5);animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{text-align:center;margin-top:6vh}
.ttl h1{font-size:50px;margin:0;letter-spacing:8px;font-weight:900;
  background:linear-gradient(180deg,#ffe1b0 0%,#e3a869 45%,#a5602a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1e08) drop-shadow(0 10px 20px rgba(0,0,0,.45))}
:root[data-theme="light"] .ttl h1{filter:drop-shadow(0 3px 0 #5e3412) drop-shadow(0 8px 14px rgba(90,50,10,.25))}
.ttl .sub{color:var(--ink);font-weight:600;margin-top:10px;font-size:15px;letter-spacing:2px;opacity:.9;
  background:var(--panel);display:inline-block;padding:6px 14px;border-radius:20px;border:1px solid var(--panelb)}
.tbtns{width:100%;max-width:330px;display:flex;flex-direction:column;gap:0;padding-bottom:4px}
.tsmall{display:flex;gap:8px;margin-top:12px}
.tsmall button{flex:1;min-width:0;height:46px;padding:0 4px;white-space:nowrap;border-radius:14px;background:var(--panel);border:1px solid var(--panelb);font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
.tsmall button:active{transform:scale(.96)}
.daily-tag{font-size:12px;font-weight:700;color:var(--gold);margin-left:6px}
/* level select */
#select{padding:0;background:var(--bg);align-items:stretch;backdrop-filter:none;-webkit-backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px;white-space:nowrap}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--mute);opacity:.85;position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--water);opacity:1}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 calc(var(--sar) + 16px) 6px calc(var(--sal) + 16px);font-size:13px;color:var(--ink2)}
.lvscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 24px) calc(var(--sal) + 12px);touch-action:pan-y}
.chap{margin:14px 2px 8px;display:flex;align-items:baseline;gap:8px}
.chap b{font-size:15px;color:var(--cu2)}
:root[data-theme="light"] .chap b{color:var(--cu1)}
.chap span{font-size:12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (min-width:600px){.grid{grid-template-columns:repeat(10,1fr)}}
.lt{min-height:62px;border-radius:14px;background:var(--panel);border:1px solid var(--panelb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:5px 2px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:0;color:var(--mute);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1;display:flex;align-items:center;gap:3px}
.lt .drops i{width:5px;height:7px}
.lt.done{border-color:var(--cu2)}
.lt.cur{outline:3px solid var(--water);outline-offset:-1px}
.lt.lock{opacity:.5}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:8;background:rgba(10,26,22,.92);color:#f5e7cc;border:1px solid rgba(227,168,105,.4);
  padding:9px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--sec);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:64px;height:64px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.55}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:min(56vh,460px);overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;text-align:left;margin:10px 4px;font-size:15px;color:var(--ink2)}
.kv b{color:var(--ink);text-align:right}
.setrow{display:flex;gap:10px;margin-top:12px}
.setrow button{flex:1;height:46px;border-radius:14px;background:var(--sec);font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--secsh)}
@media (max-height:600px){ .ov{align-items:flex-start} .ttl{margin-top:2vh} .ttl h1{font-size:40px} }
@media (orientation:landscape) and (max-height:500px){ #title{flex-direction:row;align-items:center;justify-content:space-evenly} #title .ttl{margin-top:0} #title .tbtns{max-width:340px} }
@media (hover:hover){ .btn:hover{filter:brightness(1.06)} .lt:hover{filter:brightness(1.08)} .ibtn:hover,.pill:hover{filter:brightness(1.1)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
<script>
(function(){ try { var t = localStorage.getItem('pipeflow.theme'); t = t && JSON.parse(t); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="drops" id="hDrops"></span></div>
    </div>
    <div class="stat">步數 <b id="hMoves">0</b><br>最少 <span id="hPar">3</span></div>
  </div>
  <button class="ibtn" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="ibtn" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z"/></svg>提示<span class="cnt" id="hintCnt">3</span></button>
  <div class="thr" id="thr"></div>
  <button class="pill hidden" id="bZoom" aria-label="縮放"><svg viewBox="0 0 24 24" id="zoomIcon"></svg></button>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>銅管水坊</h1>
    <div class="sub">轉動銅管・讓水流到每個出口</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <div class="row2"><button class="btn sec" id="tSelect">選擇關卡</button><button class="btn sec" id="tDaily">每日挑戰</button></div>
    <div class="tsmall">
      <button id="tHelp">玩法</button>
      <button id="tStats">統計</button>
      <button id="tSound" aria-label="音效">音效：開</button>
      <button id="tTheme" aria-label="主題">主題：自動</button>
    </div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="lvscroll" id="lvscroll"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSelect">關卡選擇</button><button class="btn sec" id="pHome">主畫面</button></div>
  <div class="setrow"><button id="pSound">音效：開</button><button id="pTheme">主題：自動</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">通水成功！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>最少<b id="wPar">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
  <button class="btn sec" id="wShare">分享成績</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>水坊統計</h2>
  <div class="kv" id="statBody"></div>

cv.addEventListener('pointercancel', function(e){ clearTimeout(longTimer); endPtr(e); });
cv.addEventListener('wheel', function(e){ if (!zoomable()) return; e.preventDefault(); zoomAt(view.z * (e.deltaY < 0 ? 1.12 : 1/1.12), e.clientX, e.clientY); }, {passive:false});
document.addEventListener('keydown', function(e){
  if (status !== 'play') { if (e.key === 'Escape' && !$('pause').classList.contains('hidden')) resume(); return; }
  var k = e.key, used = true;
  if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight'){
    if (cursor.on){ if (k === 'ArrowUp') cursor.y = Math.max(0, cursor.y-1); if (k === 'ArrowDown') cursor.y = Math.min(Lv.h-1, cursor.y+1); if (k === 'ArrowLeft') cursor.x = Math.max(0, cursor.x-1); if (k === 'ArrowRight') cursor.x = Math.min(Lv.w-1, cursor.x+1); }
    cursor.on = true;
    if (view.z > 1.01){ var s = cs(), px = view.ox + (cursor.x+0.5)*s, py = view.oy + (cursor.y+0.5)*s; if (px < area.l + s || px > area.r - s || py < area.t + s || py > area.b - s){ view.ox += (area.l + area.r)/2 - px; view.oy += (area.t + area.b)/2 - py; clampView(false); } }
  } else if (k === ' ' || k === 'Enter'){ cursor.on = true; rotateCell(cursor.y*Lv.w + cursor.x, e.shiftKey ? -1 : 1); }
  else if (k === 'z' || k === 'Z') undo();
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'h' || k === 'H') hint();
  else if (k === 'Escape') openPause();
  else used = false;
  if (used) e.preventDefault();
});

/* ---------------- screens ---------------- */
var OVS = ['title','select','pause','win','help','intro','stats'];
function showOnly(id){ OVS.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); }); }
var toastTimer = 0;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.remove('hidden'); el.style.opacity = '1'; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.style.opacity = '0'; toastTimer = setTimeout(function(){ el.classList.add('hidden'); }, 400); }, 1900); }
function goTitle(){
  status = 'title'; Lv = null; $('hud').classList.add('hidden'); $('bottom').classList.add('hidden');
  var n = nextPlayable();
  $('tPlay').textContent = Object.keys(progress).length ? (Object.keys(progress).length >= NL ? '再玩第 ' + NL + ' 關' : '繼續第 ' + n + ' 關') : '開始遊戲';
  var dk = todayKey(), dd = dailyMap[dk];
  $('tDaily').innerHTML = '每日挑戰' + (dd ? '<span class="daily-tag">' + '★★★'.slice(0, dd.s) + '</span>' : '');
  showOnly('title'); layout();
}
function openSelect(){
  status = 'select'; Lv = null; $('hud').classList.add('hidden'); $('bottom').classList.add('hidden');
  buildSelect(); showOnly('select');
  var cur = document.querySelector('.lt.cur'); if (cur) { var sc = $('lvscroll'); sc.scrollTop = Math.max(0, cur.offsetTop - sc.offsetTop - 120); }
}
function buildSelect(){
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
  var done = 0, st = 0, h = '', cur = nextPlayable();
  for (var n=1;n<=NL;n++){ if (isDone(n)) done++; st += starsMap[n] || 0; }
  $('selSum').textContent = '已完成 ' + done + ' / ' + NL + ' 關・★ ' + st + ' / ' + (NL*3);
  for (var ch=0; ch<10; ch++){
    h += '<div class="chap"><b>第 ' + (ch+1) + ' 章・' + CHAPTERS[ch] + '</b><span>' + (ch*10+1) + '–' + (ch*10+10) + ' 關</span></div><div class="grid">';
    for (n=ch*10+1; n<=ch*10+10; n++){
      var e = LEVELS[n-1], ok = unlocked(n), s = starsMap[n] || 0, cls = 'lt' + (isDone(n) ? ' done' : '') + (!ok ? ' lock' : '') + (n === cur && !isDone(n) ? ' cur' : '');
      h += '<button class="' + cls + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + e[2] + (ok ? '' : '，未解鎖') + '">';
      if (ok){ h += '<span class="n">' + n + '</span><span class="st">'; for (var i=0;i<3;i++) h += '<span class="' + (i<s ? 'on' : '') + '">★</span>'; h += '</span><span class="dn"><span class="drops">' + dropsHtml(dropsFor(e[2])) + '</span>' + e[2] + '</span>'; }
      else h += '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="dn">' + n + '</span>';
      h += '</button>';
    }
    h += '</div>';
  }
  $('lvscroll').innerHTML = h;
}
$('lvscroll').addEventListener('click', function(e){
  var t = e.target.closest('.lt'); if (!t) return; audio();
  var n = +t.getAttribute('data-n');
  if (!unlocked(n)) { SFX.locked(); toast('先完成第 ' + (n-1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.ui(); startLevel(n);
});
$('unlockSw').addEventListener('click', function(){ audio(); SFX.ui(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); var sc = $('lvscroll').scrollTop; buildSelect(); $('lvscroll').scrollTop = sc; });
function openPause(){
  if (status !== 'play') return;
  status = 'paused';
  $('pInfo').textContent = (mode === 'daily' ? '每日挑戰 ' + dailyKey : '第 ' + levelN + ' 關') + '・步數 ' + moves + '・最少 ' + Lv.par;
  showOnly('pause');
}
function resume(){ if (status === 'paused'){ status = 'play'; showOnly(null); } }
function showIntro(m){
  status = 'paused';
  $('iTitle').textContent = '新機關：' + m.name;
  $('iBody').innerHTML = '<div class="mech"><canvas width="128" height="128" id="iCv"></canvas><div>' + m.desc + '</div></div>';
  showOnly('intro'); drawMini($('iCv'), m.icon);
}
function drawMini(c, icon){
  var g = c.getContext('2d'), s = c.width;
  g.setTransform(1,0,0,1,0,0); g.fillStyle = PAL.plate; g.fillRect(0, 0, s, s);
  g.save(); g.scale(s, s);
  var oldCtx = ctx; ctx = g;
  if (icon === 'lock'){ drawPipeBody(g, 5, true); g.restore(); g.save(); ctx = g; bolt(s*0.16, s*0.16, s*0.07); bolt(s*0.84, s*0.16, s*0.07); bolt(s*0.16, s*0.84, s*0.07); bolt(s*0.84, s*0.84, s*0.07); }
  else if (icon === 'leak'){ drawPipeBody(g, 3, true); g.beginPath(); arcPath(g, 0, 1); strokeWater(g, 1, 1, 0, 1, 0.785); g.restore(); g.save(); ctx = g; drop(s*0.5, s*0.12, s*0.07, PAL.leak); drop(s*0.88, s*0.48, s*0.06, PAL.leak); }
  else if (icon === 'color'){ drawPipeBody(g, 10, true); g.beginPath(); g.moveTo(0, 0.5); g.lineTo(0.5, 0.5); strokeWater(g, 2, 1, 0, 1, 0.5); g.beginPath(); g.moveTo(0.5, 0.5); g.lineTo(1, 0.5); strokeWater(g, 4, 1, 0, 1, 0.5); }
  else if (icon === 'X'){ drawPipeBody(g, 5, true); g.beginPath(); g.moveTo(0.5, 0); g.lineTo(0.5, 1); strokeWater(g, 2, 1, 0, 1, 1); drawPipeBody(g, 10, true, {shadow:true}); g.beginPath(); g.moveTo(0, 0.5); g.lineTo(1, 0.5); strokeWater(g, 4, 1, 0, 1, 1); }
  else if (icon === 'V'){ drawPipeBody(g, 5, true); g.beginPath(); g.moveTo(0.5, 1); g.lineTo(0.5, 0); strokeWater(g, 1, 1, 0, 1, 1); drawValveCap(g, true); g.beginPath(); g.moveTo(0.5, 0.385); g.lineTo(0.585, 0.55); g.lineTo(0.5, 0.515); g.lineTo(0.415, 0.55); g.closePath(); g.fillStyle = PAL.water; g.fill(); }
  else { var m = icon === 'T' ? 7 : icon === '+' ? 15 : 3; drawPipeBody(g, m, true); }
  ctx = oldCtx; g.restore();
}
function helpHtml(){
  var h = '<p style="text-align:left">點一下管子順時針轉 90°，讓水從<b>水箱</b>流到每一座<b>水車</b>。每轉一下水就會重新灌一次，只有接通的管子會亮起來。</p>';
  MECH.forEach(function(m, i){ h += '<div class="mech"><canvas width="128" height="128" data-icon="' + m.icon + '"></canvas><div><b>' + m.name + '</b>（第 ' + m.lv + ' 關起）<br>' + m.desc + '</div></div>'; });
  h += '<p style="text-align:left"><b>計分</b>：步數 ≤ 最少步數得 ★★★、≤ 1.5 倍得 ★★，完成即得 ★。每關有 3 次提示。<br><b>手勢</b>：長按逆轉；大盤面可雙指縮放、單指拖曳。<br><b>鍵盤</b>：方向鍵移動游標、空白鍵旋轉（Shift 逆轉）、Z 悔棋、R 重來、H 提示。</p>';
  return h;
}
var helpReturn = 'title';
function openHelp(from){
  helpReturn = from; if (status === 'play') status = 'paused';
  $('helpBody').innerHTML = helpHtml(); showOnly('help');
  [].forEach.call(document.querySelectorAll('#helpBody canvas'), function(c){ drawMini(c, c.getAttribute('data-icon')); });
}
function openStats(){
  var done = 0, st = 0, three = 0; for (var n=1;n<=NL;n++){ if (isDone(n)) done++; st += starsMap[n] || 0; if (starsMap[n] === 3) three++; }
  var dn = Object.keys(dailyMap).length;
  var rows = [['已通關', done + ' / ' + NL], ['三星關卡', three], ['總星數', st + ' / ' + NL*3], ['總旋轉次數', stats.rot], ['總灌水格數', stats.wet], ['平均每關秒數', stats.wins ? Math.round(stats.secs / stats.wins) + ' 秒' : '—'], ['每日挑戰完成', dn + ' 天'], ['使用提示', stats.hints + ' 次']];
  $('statBody').innerHTML = rows.map(function(r){ return '<span>' + r[0] + '</span><b>' + r[1] + '</b>'; }).join('');
  showOnly('stats');
}
function click(id, fn){ $(id).addEventListener('click', function(e){ audio(); SFX.ui(); fn(e); }); }
click('tPlay', function(){ startLevel(nextPlayable()); });
click('tSelect', openSelect);
click('tDaily', function(){ startLevel(0, true); });
click('tHelp', function(){ openHelp('title'); });
click('tStats', openStats);
click('stOk', goTitle);
function toggleSound(){ soundOn = !soundOn; sset('sound', soundOn); setSoundLbl(); if (soundOn) SFX.ui(); }
function cycleTheme(){ themePref = themePref === 'auto' ? 'dark' : themePref === 'dark' ? 'light' : 'auto'; sset('theme', themePref); applyTheme(); }
click('tSound', toggleSound); click('pSound', toggleSound);
click('tTheme', cycleTheme); click('pTheme', cycleTheme);
click('sBack', goTitle);
click('bMenu', openPause);
click('bUndo', undo);
click('bRestart', restart);
click('bHint', hint);
click('bZoom', function(){ if (view.z > 1.01) fitView(); else { var s = cursor.on ? [view.ox + (cursor.x+0.5)*cs(), view.oy + (cursor.y+0.5)*cs()] : [(area.l+area.r)/2, (area.t+area.b)/2]; zoomAt(Math.min(zMax(), 46/baseCs), s[0], s[1]); } });
click('pResume', resume);
click('pRestart', function(){ status = 'play'; showOnly(null); restart(); });
click('pHelp', function(){ openHelp('pause'); });
click('pSelect', openSelect);
click('pHome', goTitle);
click('hOk', function(){ if (helpReturn === 'pause'){ showOnly('pause'); } else goTitle(); });
click('iOk', function(){ status = 'play'; showOnly(null); });
click('wNext', function(){ startLevel(Math.min(NL, levelN + 1)); });
click('wRetry', function(){ startLevel(levelN, mode === 'daily'); });
click('wSelect', function(){ if (mode === 'daily') goTitle(); else openSelect(); });
click('wShare', function(){ copyText(shareText()); });

document.addEventListener('visibilitychange', function(){
  if (document.hidden){ running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; clearTimeout(longTimer); gest = null; ptrs = {}; }
  else { running = true; lastFrame = 0; if (!rafId) rafId = requestAnimationFrame(frame); }
});

/* ---------------- boot ---------------- */
applyTheme(); setSoundLbl(); buildDemo(); goTitle();
rafId = requestAnimationFrame(frame);

window.__game = {
  state: function(){ return {status:status, mode:mode, level:levelN, moves:moves, par:Lv ? Lv.par : 0, win:!!(ev && ev.win), w:Lv ? Lv.w : 0, h:Lv ? Lv.h : 0, attempt:Lv ? Lv.attempt : -1, leaks:ev ? ev.leaks.length/2 : 0, outOk:ev ? ev.outOk : 0, outN:ev ? ev.outN : 0}; },
  fps: function(){ return fps.v; },
  cellCenter: function(c){ var p = cellCenter(c); return {x:p[0], y:p[1], cs:cs()}; },
  rots: function(){ return rots ? rots.slice() : null; },
  view: function(){ return {z:view.z, ox:view.ox, oy:view.oy, baseCs:baseCs, area:area}; },
  zoom: function(z){ zoomAt(z, (area.l+area.r)/2, (area.t+area.b)/2); }
};
})();
</script>
