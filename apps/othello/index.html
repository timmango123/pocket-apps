<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>黑白棋</title>
<style>
:root{
  --bg:#08130e; --bg2:#123224; --ink:#f3ecd8; --ink2:#b7c2b0; --card:#132a20f0; --card2:#1b3a2c; --line:#ffffff1a;
  --felt:#0f5c3a; --brass:#d8b45e; --brass2:#a37b33; --accent:#e9c46a; --hot:#ff8a5c; --good:#7fd69b;
  --btn:#1d4433; --btnInk:#f3ecd8; --shadow:#00000066; --dot:#ffffff40;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --bs:300px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5efe0; --bg2:#e7dcc2; --ink:#2c2a20; --ink2:#6d6956; --card:#fffaf0f2; --card2:#f1e8d4; --line:#2c2a2018;
  --felt:#3f7d4f; --brass:#c9a24a; --brass2:#8e6a24; --accent:#b8862b; --hot:#d9603a; --good:#2f8a4f;
  --btn:#ffffff; --btnInk:#2c2a20; --shadow:#5a4a2040; --dot:#ffffff55; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f5efe0; --bg2:#e7dcc2; --ink:#2c2a20; --ink2:#6d6956; --card:#fffaf0f2; --card2:#f1e8d4; --line:#2c2a2018;
  --felt:#3f7d4f; --brass:#c9a24a; --brass2:#8e6a24; --accent:#b8862b; --hot:#d9603a; --good:#2f8a4f;
  --btn:#ffffff; --btnInk:#2c2a20; --shadow:#5a4a2040; --dot:#ffffff55; color-scheme:light; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:var(--bg);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 80% at 50% 35%,var(--bg2),var(--bg) 70%) fixed var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none !important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"top" "status" "eval" "board" "tools";
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);gap:6px;max-width:640px;margin:0 auto}
body.land #app{max-width:none;grid-template-columns:var(--bs) minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;
  grid-template-areas:"board top" "board status" "board eval" "board log" "board tools";column-gap:16px}
.top{grid-area:top;display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn:active{transform:scale(.93)}
.score{flex:1;min-width:0;height:52px;border-radius:16px;background:var(--card);box-shadow:0 3px 12px var(--shadow);position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 12px 6px;overflow:hidden}
.side{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 6px;border-radius:10px;transition:background .25s}
.side.on{background:var(--line)}
.side b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1;display:inline-block;min-width:1.2em;text-align:center}
.side b.bump{animation:bump .22s ease}
@keyframes bump{0%{transform:translateY(-35%);opacity:.3}100%{transform:none;opacity:1}}
.who{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.pc{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:0 2px 0 #0006}
.pc.k{background:radial-gradient(circle at 35% 30%,#6b6b72,#1a1a1d 55%,#000)}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,#efe9dc 55%,#c7bfad)}
.ratio{position:absolute;left:12px;right:12px;bottom:6px;height:4px;border-radius:2px;background:#efe9dc;overflow:hidden}
.ratio i{display:block;height:100%;width:50%;background:#1a1a1d;transition:width .3s ease;border-right:1px solid var(--brass)}
.ratio{box-shadow:0 0 0 1px #0003}
.status{grid-area:status;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;padding:0 4px;font-size:15px}
.st{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--accent);animation:dd 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dd{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.lvl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:5px;height:11px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--accent)}
.evalbar{grid-area:eval;position:relative;height:16px;border-radius:8px;background:#efe9dc;overflow:hidden;box-shadow:inset 0 0 0 1px #0003}
.evalbar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#333,#111);transition:width .5s cubic-bezier(.3,.9,.3,1)}
.evalbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;mix-blend-mode:difference}
.evalbar:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--brass)}
.mlog{display:none}
body.land .mlog{grid-area:log;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;overflow-y:auto;min-height:0;padding:8px;border-radius:14px;background:var(--card);font-size:12px;font-variant-numeric:tabular-nums}
.mlog span{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:8px;background:var(--line)}
.mlog span i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mlog span i.k{background:#111;box-shadow:0 0 0 1px #fff5}.mlog span i.w{background:#f2ede2}
.mlog span.last{outline:1px solid var(--accent)}
#boardWrap{grid-area:board;display:grid;place-items:center;min-height:0;min-width:0;position:relative}
#cv{display:block;touch-action:none;border-radius:16px;box-shadow:0 14px 34px var(--shadow),0 0 0 1px #0004}
.tools{grid-area:tools;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{height:56px;border-radius:16px;background:var(--btn);color:var(--btnInk);box-shadow:0 3px 0 var(--shadow),0 6px 14px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.tbtn[disabled]{opacity:.4;pointer-events:none}
.review{grid-template-columns:56px 1fr 56px 72px}
.revinfo{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:13px;line-height:1.35;background:var(--card);border-radius:16px;padding:4px 8px;min-width:0}
.revinfo b{font-size:15px}
.revinfo small{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);z-index:40;background:#000c;color:#fff;padding:12px 20px;border-radius:16px;font-weight:700;font-size:16px;pointer-events:none;transition:opacity .3s;white-space:nowrap;box-shadow:0 8px 30px #0006}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:#02080599;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:none;opacity:1}}
.card{background:var(--card);color:var(--ink);border-radius:24px;box-shadow:0 20px 60px #0008,inset 0 0 0 1px var(--line);padding:20px 18px;width:min(380px,100%);animation:pop .32s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:0 0 10px;font-size:22px;text-align:center;letter-spacing:1px}
.card h3{margin:14px 0 6px;font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:1px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:16px;color:#2a1d05;background:linear-gradient(180deg,#f2d27e,#d4a845);box-shadow:0 4px 0 #9b7426,0 8px 18px #0004}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b7426}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
.row2{display:flex;gap:10px}.row2>.btn{flex:1}
.btn[hidden]{display:none}.btn small{font-size:12px;font-weight:600;opacity:.75}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:44px;min-height:44px;border-radius:12px;background:var(--card2);font-size:14px;font-weight:700;padding:4px 6px;line-height:1.2;box-shadow:inset 0 0 0 1px var(--line)}
.seg button small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#24190a;box-shadow:0 2px 0 var(--brass2)}
.seg button.on small{color:#3d2c0e}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
.sw small{display:block;font-size:12px;color:var(--ink2)}
.sw .knob{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s;box-shadow:inset 0 0 0 1px var(--line)}
.sw .knob:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0005;transition:transform .2s}
.sw[aria-checked="true"] .knob{background:var(--good)}
.sw[aria-checked="true"] .knob:after{transform:translateX(18px)}
/* title */
.logo{display:flex;justify-content:center;gap:14px;margin:6px 0 14px;perspective:600px}
.coin{width:62px;height:62px;position:relative;transform-style:preserve-3d;animation:spin 3.2s cubic-bezier(.6,0,.3,1) infinite}
.coin:nth-child(2){animation-delay:.4s}.coin:nth-child(3){animation-delay:.8s}
.coin i{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.coin i:first-child{background:radial-gradient(circle at 35% 30%,#76767e,#1c1c1f 55%,#000);box-shadow:0 0 0 3px #3a3a3f inset}
.coin i:last-child{background:radial-gradient(circle at 35% 30%,#fff,#f0eadc 55%,#c4bca8);transform:rotateY(180deg);box-shadow:0 0 0 3px #d9d0bd inset}
@keyframes spin{0%,30%{transform:rotateY(0)}50%,80%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.ttl{text-align:center;font-size:34px;font-weight:900;letter-spacing:8px;margin:0;background:linear-gradient(180deg,var(--accent),var(--brass2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--ink2);font-size:13px;margin:4px 0 8px;letter-spacing:2px}
.big{font-size:44px;font-weight:900;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:12px}
.big .pc{width:30px;height:30px}
.res-t{font-size:36px;font-weight:900;text-align:center;margin:0;letter-spacing:4px}
.res-t.win{color:var(--accent)}.res-t.lose{color:var(--hot)}
.ach{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.ach span{font-size:12px;padding:6px 10px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.ach span.got{background:var(--accent);color:#24190a;font-weight:800}
table.stt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.stt th,table.stt td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.stt th{color:var(--ink2);font-weight:700;font-size:12px}
textarea{width:100%;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:none;-webkit-user-select:text;user-select:text}
.share-img{max-width:100%;border-radius:12px;margin-top:10px}
.x{position:absolute;right:10px;top:10px}
.card{position:relative}
@media (hover:hover){.tbtn:hover,.ibtn:hover{filter:brightness(1.08)}.btn:hover{filter:brightness(1.05)}}
body.land .tools{grid-template-columns:repeat(2,1fr)}
body.land .review{grid-template-columns:56px 1fr 56px;grid-template-rows:auto auto}
body.land .review .revinfo{grid-column:1/4;grid-row:1;min-height:52px}
body.land .review #rvEnd{grid-column:1/4}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ibtn" id="bMenu" aria-label="選單"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="score">
      <div class="side" id="sB"><i class="pc k"></i><b id="nB">2</b><span class="who" id="wB">你</span></div>
      <div class="side" id="sW"><span class="who" id="wW">電腦</span><b id="nW">2</b><i class="pc w"></i></div>
      <div class="ratio"><i id="rB"></i></div>
    </div>
    <button class="ibtn" id="bMute" aria-label="音效"><svg class="i" viewBox="0 0 24 24" id="muteIco"></svg></button>
  </div>
  <div class="status"><div class="st" id="stText">輪到你</div><div class="lvl" id="lvBadge"></div></div>
  <div class="evalbar" id="evalBar" title="電腦評估（黑｜白）"><i id="evalFill"></i><span id="evalTxt">均勢</span></div>
  <div class="mlog" id="mLog" aria-label="棋譜"></div>
  <div id="boardWrap"><canvas id="cv" aria-label="黑白棋棋盤"></canvas></div>
  <div class="tools" id="toolBar">
    <button class="tbtn" id="bUndo" aria-label="悔棋"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
    <button class="tbtn" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
    <button class="tbtn" id="bNew" aria-label="新局"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>新局</button>
    <button class="tbtn" id="bSet" aria-label="設定"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>設定</button>
  </div>
  <div class="tools review hidden" id="revBar">
    <button class="tbtn" id="rvPrev" aria-label="上一手"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="revinfo" id="rvInfo"></div>
    <button class="tbtn" id="rvNext" aria-label="下一手"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tbtn" id="rvEnd">結束覆盤</button>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<div class="ov" id="ovTitle">
  <div class="card">
    <div class="logo"><div class="coin"><i></i><i></i></div><div class="coin"><i></i><i></i></div><div class="coin"><i></i><i></i></div></div>
    <h1 class="ttl">黑白棋</h1>
    <div class="sub">翡翠賭桌 · 夾住就翻面</div>
    <button class="btn" id="tCont">繼續對局</button>
    <button class="btn" id="tNew">新對局</button>
    <button class="btn sec" id="tNet" hidden>連線對戰 <small id="tNetInfo"></small></button>
    <div class="row2"><button class="btn sec" id="tDaily">每日開局</button><button class="btn sec" id="tRules">玩法</button></div>
    <div class="row2"><button class="btn sec" id="tStats">統計與成就</button><button class="btn sec" id="tSet">設定</button></div>
  </div>
</div>

<div class="ov hidden" id="ovSetup">
  <div class="card">
    <button class="ibtn x" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>新對局</h2>
    <h3>對手</h3>
    <div class="seg" id="sgMode"><button data-v="ai">對電腦</button><button data-v="2p">同機雙人</button></div>
    <div id="aiOpts">
      <h3>電腦難度</h3>
      <div class="seg" id="sgLevel"></div>
      <h3>執子</h3>
      <div class="seg" id="sgColor"><button data-v="0">黑<small>先手</small></button><button data-v="1">白<small>後手</small></button><button data-v="r">隨機</button></div>
      <h3>讓子（電腦讓你角落）</h3>
      <div class="seg" id="sgHand"><button data-v="0">無</button><button data-v="1">1 角</button><button data-v="2">2 角</button><button data-v="3">3 角</button><button data-v="4">4 角</button></div>
    </div>
    <h3>開局</h3>
    <div class="seg" id="sgOpen"><button data-v="std">標準</button><button data-v="rand">隨機<small>4–8 手</small></button><button data-v="daily">每日<small>全球同題</small></button></div>
    <button class="btn" id="sStart">開始對局</button>
  </div>
</div>

<div class="ov hidden" id="ovSettings">
  <div class="card">
    <button class="ibtn x" data-close aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>設定</h2>
    <div id="swList"></div>
    <h3>外觀</h3>
    <div class="seg" id="sgTheme"><button data-v="auto">跟隨系統</button><button data-v="light">亮</button><button data-v="dark">暗</button></div>
