        </div>
      </div>
    </div>
  </div>
</div>

  { id: "b64url", label: "Base64URL", opts: [],
    enc(s) { return { text: bytesToB64(utf8(s)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") }; },
    dec(s) { return decodeBytesOrHex(b64ToBytes(s)); } },
  { id: "url", label: "URL", opts: [{ id: "mode", type: "choice", label: "範圍", def: "component", choices: [["component", "僅元件"], ["full", "整段網址"]] }, { id: "plus", type: "bool", label: "+ 視為空白", def: false }],
    enc(s, o) { let r = o.mode === "full" ? encodeURI(s) : encodeURIComponent(s); if (o.plus) r = r.replace(/%20/g, "+"); return { text: r }; },
    dec(s, o) {
      const src = o.plus ? s.replace(/\+/g, " ") : s;
      try { return { text: o.mode === "full" ? decodeURI(src) : decodeURIComponent(src) }; }
      catch { fail(urlErr(src)); }
    } },
  { id: "html", label: "HTML 實體", opts: [{ id: "mode", type: "choice", label: "範圍", def: "min", choices: [["min", "僅必要字元"], ["all", "全部非 ASCII"]] }],
    enc(s, o) {
      let r = s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      if (o.mode === "all") r = r.replace(/[^\x00-\x7F]/gu, c => "&#x" + c.codePointAt(0).toString(16).toUpperCase() + ";");
      return { text: r };
    },
    dec(s) {
      let unknown = 0;
      const text = s.replace(/&(#[xX][0-9a-fA-F]+|#[0-9]+|[A-Za-z][A-Za-z0-9]*);/g, (m, e) => {
        if (e[0] === "#") { const cp = e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10); if (cp > 0x10FFFF || (cp >= 0xD800 && cp <= 0xDFFF) || cp === 0) { unknown++; return m; } return String.fromCodePoint(cp); }
        if (Object.prototype.hasOwnProperty.call(ENT, e)) return String.fromCodePoint(ENT[e]);
        unknown++; return m;
      });
      return { text, note: unknown ? `有 ${unknown} 個實體無法辨識，已保留原文。` : "" };
    } },
  { id: "uni", label: "Unicode 跳脫", opts: [{ id: "style", type: "choice", label: "格式", def: "u", choices: [["u", "\\uXXXX"], ["brace", "\\u{XXXXX}"], ["uplus", "U+XXXX"]] }, { id: "nonascii", type: "bool", label: "只跳脫非 ASCII", def: true }],
    enc(s, o) {
      const h4 = n => n.toString(16).toUpperCase().padStart(4, "0");
      if (o.style === "uplus") return { text: Array.from(s, c => "U+" + h4(c.codePointAt(0))).join(" ") };

      for (const c of s) {
        const cp = c.codePointAt(0);

    },
    dec(s) {

      return { text: s.replace(/\\u\{([0-9a-fA-F]{1,6})\}|\\u([0-9a-fA-F]{4})|\\x([0-9a-fA-F]{2})|U\+([0-9A-Fa-f]{4,6}) ?/g, (m, a, b, c, d) => {
        const cp = parseInt(a || b || c || d, 16);
        if (b) return String.fromCharCode(cp);
        if (cp > 0x10FFFF) fail("碼位 " + m.trim() + " 超出 Unicode 範圍");
        return String.fromCodePoint(cp);
      }) };
    } },
  { id: "hex", label: "Hex", opts: [{ id: "upper", type: "bool", label: "大寫", def: false }, { id: "sep", type: "bool", label: "以空白分隔", def: true }],
    enc(s, o) { return { text: bytesToHex(utf8(s), o.upper, o.sep ? " " : "") }; },
    dec(s) {
      const clean = s.replace(/0x/gi, "").replace(/\\x/gi, "");
      const bad = /[^0-9a-fA-F\s,:]/.exec(clean);

      const h = clean.replace(/[\s,:]/g, "");
      if (h.length % 2) fail(`長度為奇數（${h.length} 個十六進位數字），每個位元組需要 2 個數字`);
      const b = new Uint8Array(h.length / 2); for (let i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16);
      const r = bytesToText(b);

    } },
  { id: "bin", label: "二進位", opts: [],
    enc(s) { return { text: Array.from(utf8(s), b => b.toString(2).padStart(8, "0")).join(" ") }; },
    dec(s) {
      const bad = /[^01\s]/.exec(s); if (bad) fail(`第 ${bad.index + 1} 個字元「${bad[0]}」不是 0 或 1`);
      const h = s.replace(/\s+/g, ""); if (h.length % 8) fail(`位元數 ${h.length} 不是 8 的倍數`);
      const b = new Uint8Array(h.length / 8); for (let i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 8, 8), 2);
      const r = bytesToText(b); if (r) return r;
      return { text: new TextDecoder("utf-8").decode(b), note: "位元組不是合法的 UTF-8，無法解讀的部分以 \uFFFD 顯示。" };
    } },
  { id: "puny", label: "Punycode", opts: [],
    enc(s) { return { text: mapHosts(s, l => /[^\x00-\x7F]/.test(l) ? "xn--" + punyEncode(l.toLowerCase()) : l) }; },
    dec(s) { return { text: mapHosts(s, l => /^xn--/i.test(l) ? punyDecode(l.slice(4).toLowerCase()) : l) }; } },
  { id: "jwt", label: "JWT 解析", opts: [], decodeOnly: true,
    dec(s) { return jwtDecode(s); } },
];
const BY = Object.fromEntries(CODECS.map(c => [c.id, c]));

function urlErr(s) {
  const bad = /%(?![0-9a-fA-F]{2})/.exec(s);
  if (bad) return `第 ${bad.index + 1} 個字元的「${s.slice(bad.index, bad.index + 3)}」不是合法的百分比編碼（% 後面要接兩位十六進位數字）`;
  const re = /(?:%[0-9a-fA-F]{2})+/g; let m;
  while ((m = re.exec(s))) {
    const bytes = m[0].slice(1).split("%").map(h => parseInt(h, 16));
    try { new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes)); }
    catch { return `第 ${m.index + 1} 個字元起的「${m[0].length > 24 ? m[0].slice(0, 24) + "…" : m[0]}」不是完整的 UTF-8 序列`; }
  }
  return "URL 解碼失敗";
}

let jwtView = null;
function jwtDecode(s) {
  const t = s.trim().replace(/^Bearer\s+/i, "");
  const parts = t.split(".");
  if (parts.length < 2 || parts.length > 3) fail(`JWT 應由「.」分成 3 段，目前是 ${parts.length} 段`);
  const seg = (p, name) => {
    let b; try { b = b64ToBytes(p); } catch (e) { fail(name + " 不是合法的 Base64URL：" + e.message); }
    const r = bytesToText(b); if (!r) fail(name + " 解碼後不是 UTF-8 文字");
    try { return JSON.parse(r.text); } catch { fail(name + " 解碼後不是合法的 JSON"); }
  };
  const header = seg(parts[0], "Header"), payload = seg(parts[1], "Payload");
  jwtView = { header, payload, sig: parts[2] || "" };
  return { text: "// HEADER\n" + JSON.stringify(header, null, 2) + "\n\n// PAYLOAD\n" + JSON.stringify(payload, null, 2) + "\n\n// SIGNATURE（未驗證）\n" + (parts[2] || "（無）") };
}
function fmtTime(sec) {
  const d = new Date(sec * 1000); if (isNaN(d)) return "（無效時間）";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function rel(sec) {
  const diff = Math.round(sec - Date.now() / 1000), a = Math.abs(diff);
  const s = a < 60 ? a + " 秒" : a < 3600 ? Math.round(a / 60) + " 分鐘" : a < 86400 ? Math.round(a / 3600) + " 小時" : Math.round(a / 86400) + " 天";
  return diff >= 0 ? s + "後" : s + "前";
}
function renderJwt() {
  const box = $("jwt"); box.textContent = "";
  if (!jwtView) { box.hidden = true; out.hidden = false; return; }
  box.hidden = false; out.hidden = true;
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const secH = mk("section"); const h1 = mk("h3", null, "HEADER"); secH.append(h1, mk("pre", null, JSON.stringify(jwtView.header, null, 2)));
  const p = jwtView.payload;
  const secC = mk("section"); secC.appendChild(mk("h3", null, "時間欄位"));
  const tbl = mk("table", "claims"); const now = Date.now() / 1000; let any = false;
  for (const k of ["exp", "iat", "nbf"]) {
    if (typeof p[k] !== "number") continue; any = true;
    const tr = mk("tr"); tr.appendChild(mk("td", null, k));
    const td = mk("td", null, fmtTime(p[k]) + "（" + rel(p[k]) + "）");
    if (k === "exp") td.appendChild(p[k] < now ? mk("span", "st bad", "已過期") : mk("span", "st ok", "未過期"));
    if (k === "nbf" && p[k] > now) td.appendChild(mk("span", "st bad", "尚未生效"));
    tr.appendChild(td); tbl.appendChild(tr);
  }
  if (any) { secC.appendChild(tbl); }
  const secP = mk("section"); secP.append(mk("h3", null, "PAYLOAD"), mk("pre", null, JSON.stringify(p, null, 2)));
  box.append(secH); if (any) box.append(secC); box.append(secP, mk("div", "warn-sig", "只解碼內容，不驗證簽章（" + (jwtView.header.alg || "未知演算法") + "）。請勿把正式環境的 Token 貼到不信任的網站。"));
}

/* ---------- auto detect ---------- */
function detect(s) {
  const t = s.trim(); if (!t) return null;
  const parts = t.replace(/^Bearer\s+/i, "").split(".");
  if (parts.length === 3 && parts.every((p, i) => i === 2 || /^[A-Za-z0-9_-]+$/.test(p))) { try { jwtDecode(t); return "jwt"; } catch {} }
  if (/%[0-9A-Fa-f]{2}/.test(t)) return "url";
  if (/&[A-Za-z]+;|&#/.test(t)) return "html";
  if (/\\u[0-9a-fA-F{]|U\+[0-9A-Fa-f]{4}/.test(t)) return "uni";
  if (/(^|[.\s/])xn--/i.test(t)) return "puny";
  if (/^[01]{8}(\s+[01]{8})*$/.test(t)) return "bin";
  if (/^(0x)?[0-9a-fA-F]{2}(\s*(0x)?[0-9a-fA-F]{2})*$/.test(t) && /\s/.test(t)) return "hex";
  const b = t.replace(/\s+/g, "");
  if (/^[A-Za-z0-9+/]+={0,2}$/.test(b) && b.length % 4 === 0 && b.length >= 4) return "b64";
  if (/^[A-Za-z0-9_-]+$/.test(b) && b.length % 4 !== 1 && b.length >= 8 && /[_-]/.test(b)) return "b64url";
  if (/^[0-9a-fA-F]+$/.test(b) && b.length % 2 === 0 && b.length >= 4) return "hex";
  return null;
}

/* ---------- state + UI ---------- */
let state = { codec: "b64", dir: "enc", opts: {} };
const st0 = LS.get("state", null);
if (st0 && BY[st0.codec]) state = { codec: st0.codec, dir: st0.dir === "dec" ? "dec" : "enc", opts: st0.opts || {} };
const inp = $("in"), out = $("out");
const SAMPLE = "你好 😀 Hello, 世界";
let isSample = false;
function optsFor(c) { const o = {}; const saved = state.opts[c.id] || {}; for (const d of c.opts) o[d.id] = saved[d.id] !== undefined ? saved[d.id] : d.def; return o; }
function save() { LS.set("state", state); }

function renderCodecs() {
  const nav = $("codecs"); nav.textContent = "";
  for (const c of CODECS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "codec"; b.id = "codec-" + c.id; b.textContent = c.label;
    b.setAttribute("aria-pressed", c.id === state.codec);
    b.addEventListener("click", () => selectCodec(c.id, true));
    nav.appendChild(b);
  }
}
function selectCodec(id, scroll) {
  state.codec = id; const c = BY[id];
  if (c.decodeOnly) state.dir = "dec";
  document.querySelectorAll(".codec").forEach(b => b.setAttribute("aria-pressed", b.id === "codec-" + id));
  if (scroll) { const b = $("codec-" + id); b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  renderDir(); renderOpts(); save(); run();
}
function renderDir() {
  const c = BY[state.codec];
  $("dirEnc").disabled = !!c.decodeOnly;
  $("dirEnc").setAttribute("aria-pressed", state.dir === "enc"); $("dirDec").setAttribute("aria-pressed", state.dir === "dec");
  $("swapBtn").disabled = !!c.decodeOnly; $("useBtn").disabled = false;
}
function renderOpts() {
  const c = BY[state.codec], box = $("opts"); box.textContent = "";
  const o = optsFor(c);
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "OPTIONS"; box.appendChild(lbl);
  if (!c.opts.length) { const s = document.createElement("span"); s.style.cssText = "font-size:13px;color:var(--faint)"; s.textContent = c.decodeOnly ? "僅解碼，不驗證簽章" : "此編碼沒有選項"; box.appendChild(s); return; }
  for (const d of c.opts) {
    const id = `opt-${c.id}-${d.id}`;
    if (d.type === "bool") {
      const l = document.createElement("label"); l.className = "tog"; l.htmlFor = id;
      const i = document.createElement("input"); i.type = "checkbox"; i.id = id; i.checked = !!o[d.id];
      i.addEventListener("change", () => setOpt(c.id, d.id, i.checked));
      l.append(i, d.label); box.appendChild(l);
    } else {
      const l = document.createElement("label"); l.className = "optsel"; l.htmlFor = id; l.append(d.label);
      const sel = document.createElement("select"); sel.id = id;
      for (const [v, t] of d.choices) { const op = document.createElement("option"); op.value = v; op.textContent = t; sel.appendChild(op); }
      sel.value = o[d.id]; sel.addEventListener("change", () => setOpt(c.id, d.id, sel.value));
      l.appendChild(sel); box.appendChild(l);
    }
  }
}
function setOpt(cid, oid, v) { (state.opts[cid] = state.opts[cid] || {})[oid] = v; save(); run(); }
function setDir(d) { if (BY[state.codec].decodeOnly && d === "enc") return; state.dir = d; renderDir(); save(); run(); }
$("dirEnc").addEventListener("click", () => setDir("enc"));
$("dirDec").addEventListener("click", () => setDir("dec"));

function stats(s) {
  let cps = 0; for (const _ of s) cps++;
  const bytes = s.length > 6e6 ? "—" : utf8(s).length.toLocaleString();
  return `${cps.toLocaleString()} 字・${bytes} 位元組`;
}
const BIGLIM = 5 * 1048576;
function run(manual) {
  const s = inp.value;
  $("inMeta").textContent = stats(s);
  const big = s.length > BIGLIM; $("bigBar").hidden = !big;
  if (big && !manual) { return; }
  const c = BY[state.codec], o = optsFor(c);
  $("err").hidden = true; $("note").hidden = true; jwtView = null;
  let r = { text: "" };
  if (s.length) {
    try { r = state.dir === "enc" ? c.enc(s, o) : c.dec(s, o); }
    catch (e) {
      if (!(e instanceof CodecError) && !(e instanceof RangeError)) console.warn(e);
      out.value = ""; $("outMeta").textContent = "";
      $("err").textContent = (state.dir === "enc" ? "編碼失敗：" : "解碼失敗：") + (e.message || "格式不正確");
      $("err").hidden = false; renderJwt(); return;
    }
  }
  out.value = r.text; $("outMeta").textContent = r.text ? stats(r.text) : "";
  if (r.note) { $("note").textContent = r.note; $("note").hidden = false; }
  renderJwt();
  if ($("remChk").checked && !isSample) { if (s.length <= 100000) LS.set("input", s); }
}
let inT;
inp.addEventListener("input", () => { if (isSample) { isSample = false; $("sampleChip").hidden = true; } clearTimeout(inT); inT = setTimeout(run, 150); });
$("runBtn").addEventListener("click", () => run(true));
function setInput(v, sample) { inp.value = v; isSample = !!sample; $("sampleChip").hidden = !sample; run(); }

function swap() {
  if (BY[state.codec].decodeOnly) { toast("JWT 只能解碼，無法交換"); return; }
  if (!$("note").hidden && /Hex 顯示/.test($("note").textContent)) { toast("輸出是二進位資料的 Hex，無法直接交換"); return; }
  const o = out.value; state.dir = state.dir === "enc" ? "dec" : "enc"; renderDir(); save(); setInput(o); toast("已交換輸入與輸出");
}
$("swapBtn").addEventListener("click", swap);
$("useBtn").addEventListener("click", () => { if (!out.value) { toast("沒有結果可用"); return; } setInput(out.value); toast("結果已移到輸入，可選下一種轉換"); });
let sw = null;
out.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") sw = { x: e.clientX, y: e.clientY }; });
out.addEventListener("pointerup", e => { if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null; if (dx < -70 && Math.abs(dy) < 40) swap(); });
out.addEventListener("pointercancel", () => { sw = null; });
$("copyBtn").addEventListener("click", async () => {
  const t = out.value; if (!t) { toast("沒有內容可以複製"); return; }
  try { await navigator.clipboard.writeText(t); toast("已複製"); return; } catch {}
  try { out.focus(); out.select(); if (document.execCommand("copy")) { toast("已複製"); return; } } catch {}
  out.focus(); out.select(); toast("請長按選取的文字手動複製");
});
$("clearBtn").addEventListener("click", () => { setInput(""); LS.del("input"); inp.focus(); });
$("pasteBtn").addEventListener("click", async () => {
  try { const t = await navigator.clipboard.readText(); setInput(t); toast("已貼上"); } catch { inp.focus(); toast("無法讀取剪貼簿，請長按輸入框貼上"); }
});
$("detectBtn").addEventListener("click", () => {
  const id = detect(inp.value);
  if (!id) { toast(inp.value.trim() ? "無法判斷是哪種編碼" : "請先輸入內容"); return; }
  state.dir = "dec"; selectCodec(id, true);
  toast("判斷為 " + BY[id].label + "，已套用解碼");
});
$("remChk").addEventListener("change", () => {
  LS.set("remember", $("remChk").checked);
  if ($("remChk").checked) { if (!isSample) LS.set("input", inp.value); toast("會在這台裝置記住輸入內容"); } else { LS.del("input"); toast("已停止記住，並清除儲存的輸入"); }
});

/* init */
renderCodecs(); renderDir(); renderOpts();
$("remChk").checked = !!LS.get("remember", false);
const savedIn = $("remChk").checked ? LS.get("input", null) : null;
if (typeof savedIn === "string" && savedIn) setInput(savedIn); else setInput(SAMPLE, true);
window.__eb = { CODECS: BY, detect, punyEncode, punyDecode, optsFor, setInput, selectCodec, setDir };
window.__ebReady = true;
})();
</script>
