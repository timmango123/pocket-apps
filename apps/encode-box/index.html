<style>
/* Patch bay: stone panel, ochre signal lamp for the active codec, punched-tape output strip */
:root{

  padding-block:0 calc(28px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

.tog:has(input:disabled){opacity:.45;cursor:default}
.opts select{min-height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 8px;font-size:13.5px}
.optsel{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}

.box:has(#err:not([hidden])) #out{height:72px;min-height:72px}
.note{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:8px 10px;font-size:13px;font-weight:600;margin-top:8px}
.big{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.jwt{display:grid;gap:10px;margin-top:10px}
.jwt section{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.jwt h3{margin:0;font:700 11px var(--mono);letter-spacing:.16em;padding:6px 10px;background:var(--sunk);color:var(--muted);display:flex;gap:8px;align-items:center}

.claims{width:100%;border-collapse:collapse;font-size:13px}

.claims td:first-child{font:600 12.5px var(--mono);white-space:nowrap;color:var(--muted);width:1%}

.st.bad{background:var(--bad-soft);color:var(--bad)} .st.ok{background:var(--ok-soft);color:var(--ok)}
.warn-sig{font-size:12.5px;color:var(--muted);padding:0 2px}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.toast{position:fixed;left:50%;top:calc(9px + env(safe-area-inset-top));pointer-events:none;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
.toast button{pointer-events:auto;min-height:44px;min-width:64px;border:1px solid var(--surface);background:transparent;color:var(--surface);border-radius:6px;font-weight:700;cursor:pointer;margin:-6px -8px -6px 0}
.outwrap{position:relative}
.busy{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:4px 4px 4px 12px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}

.rem{font-size:13px;color:var(--muted)}
@media (max-width:430px) and (min-height:700px){

}
@media (max-height:500px) and (orientation:landscape){ textarea{height:150px;min-height:110px} }
.io{display:grid;gap:12px}
@media (min-width:640px) and (max-width:899px){ .io{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="wrap">

          <div class="big" id="bigBar" hidden><span id="bigMsg">輸入超過 5MB，改為手動轉換。</span><button class="btn pri" id="runBtn" type="button">轉換</button></div>
          <div class="ctl" style="margin-top:6px">
            <button class="btn" id="clearBtn" type="button">清除</button>
            <button class="btn" id="pasteBtn" type="button">貼上</button>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "encode-box:v1:";
const mkStore = name => ({
  get(k, d) { try { const v = window[name].getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { window[name].setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { window[name].removeItem(KEY + k); } catch {} }
});
const LS = mkStore("localStorage"), SS = mkStore("sessionStorage");
let toastT, toastOff = null;
function closeToast() { clearTimeout(toastT); $("toastHost").innerHTML = ""; if (toastOff) { document.removeEventListener("pointerdown", toastOff, true); toastOff = null; } }
function toast(msg, action) {
  closeToast();
  const h = $("toastHost"); const d = document.createElement("div"); d.className = "toast";
  const t = document.createElement("span"); t.textContent = msg; d.appendChild(t);
  if (action) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = action.label; b.addEventListener("click", () => { closeToast(); action.fn(); }); d.appendChild(b);
    // the next tap anywhere else closes it, so the 復原 button never lingers over other controls
    toastOff = e => { if (!d.contains(e.target)) closeToast(); };
    document.addEventListener("pointerdown", toastOff, true);
  }
  h.appendChild(d); toastT = setTimeout(closeToast, action ? 5000 : 2000);
}

/* ---------- core: pure codecs, also run inside a Worker for large inputs (must not use anything outside this function) ---------- */
function makeCore() {
"use strict";
class CodecError extends Error {}
const fail = m => { throw new CodecError(m); };

/* ---------- byte helpers ---------- */
const te = new TextEncoder(), asciiDec = new TextDecoder();
const utf8 = s => te.encode(s);
const H2 = Array.from({ length: 256 }, (_, i) => (i < 16 ? "0" : "") + i.toString(16).toUpperCase());
function bytesToText(b) {
  try { return { text: new TextDecoder("utf-8", { fatal: true }).decode(b) }; }
  catch { return null; }
}
const HL = Uint8Array.from("0123456789abcdef", c => c.charCodeAt(0)), HU = Uint8Array.from("0123456789ABCDEF", c => c.charCodeAt(0));
function bytesToHex(b, upper, sep) {
  const n = b.length; if (!n) return "";
  const D = upper ? HU : HL, sp = sep ? sep.charCodeAt(0) : 0, step = sp ? 3 : 2;
  const o = new Uint8Array(n * step - (sp ? 1 : 0));
  for (let i = 0, j = 0; i < n; i++) { const v = b[i]; o[j] = D[v >> 4]; o[j + 1] = D[v & 15]; j += 2; if (sp && j < o.length) o[j++] = sp; }
  return asciiDec.decode(o);
}
function bytesToBin(b) {
  const n = b.length; if (!n) return "";
  const o = new Uint8Array(n * 9 - 1);
  for (let i = 0, j = 0; i < n; i++) { const v = b[i]; for (let k = 7; k >= 0; k--) o[j++] = 48 + ((v >> k) & 1); if (j < o.length) o[j++] = 32; }
  return asciiDec.decode(o);
}
function decodeBytesOrHex(bytes) {
  const r = bytesToText(bytes);
  if (r) return r;
  return { text: bytesToHex(bytes, true, " "), binary: true, note: "內容不是合法的 UTF-8 文字，判斷為二進位資料，改以 Hex 顯示（共 " + bytes.length + " 位元組）。" };
}
function bytesToB64(b) { let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(str) {
  const bad = /[^A-Za-z0-9+/=\s_-]/.exec(str);
  if (bad) fail(`第 ${bad.index + 1} 個字元「${bad[0]}」不是 Base64 字元`);
  let s = str.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  const body = s.replace(/=+$/, "");
  if (body.includes("=")) fail("「=」只能出現在結尾");
  if (body.length % 4 === 1) fail(`長度不正確：去掉補位後有 ${body.length} 個字元，Base64 不可能是這個長度（可能少複製或多複製了字元）`);
  s = body + "===".slice(0, (4 - body.length % 4) % 4);
  let bin; try { bin = atob(s); } catch { fail("Base64 內容不正確"); }
  const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
// lone (unpaired) UTF-16 surrogates: UTF-8 cannot represent them
function lone(s) {
  if (typeof s.isWellFormed === "function" && s.isWellFormed()) return null;
  let count = 0, first = -1, cp = 0, firstCp = 0, code = 0;
  for (let i = 0; i < s.length; i++, cp++) {
    const c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF) { const d = s.charCodeAt(i + 1); if (d >= 0xDC00 && d <= 0xDFFF) { i++; continue; } }
    else if (!(c >= 0xDC00 && c <= 0xDFFF)) continue;
    if (!count) { first = i; firstCp = cp + 1; code = c; } count++;
  }
  return count ? { count, at: firstCp, code: code.toString(16).toUpperCase() } : null;
}
const loneNote = L => L ? `輸入有 ${L.count} 個孤立的代理字元（第一個在第 ${L.at} 個字元，U+${L.code}），UTF-8 無法表示，已換成 U+FFFD（�）。` : "";
const utf8Enc = (s, f) => { const r = { text: f(utf8(s)) }; const n = loneNote(lone(s)); if (n) r.note = n; return r; };

    worker.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); workerOK = false; killWorker(); const j = wjob; wjob = null; if (j) j.done(convert(j.codec, j.dir, j.s, j.o)); };
  } catch { workerOK = false; worker = null; }
  return worker;
}
function killWorker() { if (worker) { try { worker.terminate(); } catch {} worker = null; } }

/* ---------- JWT view ---------- */
function fmtTime(sec) {
  const d = new Date(sec * 1000); if (isNaN(d)) return null;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function rel(sec) {
  const diff = Math.round(sec - Date.now() / 1000), a = Math.abs(diff);
  const s = a < 60 ? a + " 秒" : a < 3600 ? Math.round(a / 60) + " 分鐘" : a < 86400 ? Math.round(a / 3600) + " 小時" : Math.round(a / 86400) + " 天";
  return diff >= 0 ? s + "後" : s + "前";
}
function renderJwt(v) {
  const box = $("jwt"); box.textContent = "";
  if (!v) { box.hidden = true; out.hidden = false; return; }
  box.hidden = false; out.hidden = true;
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const secH = mk("section"); secH.append(mk("h3", null, "HEADER"), mk("pre", null, JSON.stringify(v.header, null, 2)));
  const p = v.payload;
  const secC = mk("section"); secC.appendChild(mk("h3", null, "時間欄位"));
  const tbl = mk("table", "claims"); const now = Date.now() / 1000; let any = false;
  for (const k of ["exp", "iat", "nbf"]) {
    if (typeof p[k] !== "number") continue; any = true;
    const tr = mk("tr"); tr.appendChild(mk("td", null, k));
    const f = fmtTime(p[k]);
    const td = mk("td", null, f ? f + "（" + rel(p[k]) + "）" : "（無效時間：" + p[k] + " 不是可用的秒數）");
    if (f && k === "exp") td.appendChild(p[k] < now ? mk("span", "st bad", "已過期") : mk("span", "st ok", "未過期"));
    if (f && k === "nbf" && p[k] > now) td.appendChild(mk("span", "st bad", "尚未生效"));
    tr.appendChild(td); tbl.appendChild(tr);
  }
  if (any) secC.appendChild(tbl);
  const secP = mk("section"); secP.append(mk("h3", null, "PAYLOAD"), mk("pre", null, JSON.stringify(p, null, 2)));
  const alg = typeof v.header.alg === "string" && v.header.alg ? v.header.alg : "未知演算法";
  box.append(secH); if (any) box.append(secC); box.append(secP, mk("div", "warn-sig", "只解碼內容，不驗證簽章（" + alg + "）。請勿把正式環境的 Token 貼到不信任的網站。"));
}

/* ---------- state + UI ---------- */
let state = { codec: "b64", dir: "enc", opts: {} };
const st0 = LS.get("state", null);
if (st0 && typeof st0 === "object" && BY[st0.codec]) state = { codec: st0.codec, dir: st0.dir === "dec" ? "dec" : "enc", opts: st0.opts && typeof st0.opts === "object" ? st0.opts : {} };
const inp = $("in"), out = $("out");
const SAMPLE = "你好 😀 Hello, 世界";
let isSample = false;
let result = null; // last full result { text, binary } shown in the output (may be longer than the preview)
function optsFor(c) {
  const o = {}; const saved = state.opts[c.id] && typeof state.opts[c.id] === "object" ? state.opts[c.id] : {};
  for (const d of c.opts) { let v = saved[d.id] !== undefined ? saved[d.id] : d.def; if (d.type === "choice" && !d.choices.some(ch => ch[0] === v)) v = d.def; if (d.type === "bool") v = !!v; o[d.id] = v; }
  return o;
}
function save() { LS.set("state", state); }

const cwrap = $("cwrap"), nav = $("codecs");
function updFade() { const max = nav.scrollWidth - nav.clientWidth; cwrap.classList.toggle("more-r", nav.scrollLeft < max - 2); cwrap.classList.toggle("more-l", nav.scrollLeft > 2); }
nav.addEventListener("scroll", updFade, { passive: true });
window.addEventListener("resize", updFade);
function renderCodecs() {
  nav.textContent = "";
  for (const c of CODECS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "codec"; b.id = "codec-" + c.id; b.textContent = c.label;
    b.setAttribute("aria-pressed", c.id === state.codec);
    // scroll the row only for keyboard activation (detail 0); a tap must not move the chips under the finger
    b.addEventListener("click", e => selectCodec(c.id, e.detail === 0));
    nav.appendChild(b);
  }
  updFade();
}
function selectCodec(id, scroll) {
  state.codec = id; const c = BY[id];
  if (c.decodeOnly) state.dir = "dec";
  document.querySelectorAll(".codec").forEach(b => b.setAttribute("aria-pressed", b.id === "codec-" + id));
  if (scroll) { const b = $("codec-" + id); b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
  renderDir(); renderOpts(); save(); run();
}
function renderDir() {
  const c = BY[state.codec];
  $("dirEnc").disabled = !!c.decodeOnly;
  $("dirEnc").setAttribute("aria-pressed", state.dir === "enc"); $("dirDec").setAttribute("aria-pressed", state.dir === "dec");
}
function syncOptState(c, o) {
  for (const d of c.opts) if (d.off) { const el = $(`opt-${c.id}-${d.id}`); if (el) { el.disabled = d.off(o); el.closest("label").title = el.disabled ? "U+XXXX 格式一律轉換每個字元，這個選項不適用" : ""; } }
}
function renderOpts() {
  const c = BY[state.codec], box = $("opts"); box.textContent = "";
  const o = optsFor(c);
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "OPTIONS"; box.appendChild(lbl);
  if (!c.opts.length) { const s = document.createElement("span"); s.style.cssText = "font-size:13px;color:var(--faint)"; s.textContent = c.decodeOnly ? "僅解碼，不驗證簽章" : "此編碼沒有選項"; box.appendChild(s); return; }
  for (const d of c.opts) {
    const id = `opt-${c.id}-${d.id}`;
    if (d.type === "bool") {
      const l = document.createElement("label"); l.className = "tog"; l.htmlFor = id;
      const i = document.createElement("input"); i.type = "checkbox"; i.id = id; i.checked = !!o[d.id];
      i.addEventListener("change", () => setOpt(c.id, d.id, i.checked));
      l.append(i, d.label); box.appendChild(l);
    } else {
      const l = document.createElement("label"); l.className = "optsel"; l.htmlFor = id; l.append(d.label);
      const sel = document.createElement("select"); sel.id = id;
      for (const [v, t] of d.choices) { const op = document.createElement("option"); op.value = v; op.textContent = t; sel.appendChild(op); }
      sel.value = o[d.id]; sel.addEventListener("change", () => setOpt(c.id, d.id, sel.value));
      l.appendChild(sel); box.appendChild(l);
    }
  }
  syncOptState(c, o);
}
function setOpt(cid, oid, v) { (state.opts[cid] = state.opts[cid] && typeof state.opts[cid] === "object" ? state.opts[cid] : {})[oid] = v; syncOptState(BY[cid], optsFor(BY[cid])); save(); run(); }
function setDir(d) { if (BY[state.codec].decodeOnly && d === "enc") return; state.dir = d; renderDir(); save(); run(); }
$("dirEnc").addEventListener("click", () => setDir("enc"));
$("dirDec").addEventListener("click", () => setDir("dec"));

function stats(s) {
  let cps = 0, bytes = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i); cps++;
    if (c < 0x80) bytes++; else if (c < 0x800) bytes += 2;
    else if (c >= 0xD800 && c <= 0xDBFF && (s.charCodeAt(i + 1) & 0xFC00) === 0xDC00) { bytes += 4; i++; }
    else bytes += 3;
  }
  return `${cps.toLocaleString()} 字・${bytes.toLocaleString()} 位元組`;
}

/* ---------- saving the input (sessionStorage by default, localStorage when 記住輸入 is on) ---------- */
const SAVELIM = 5000000;
function persist() {
  clearTimeout(saveT); saveT = 0;
  if (isSample) return;
  const s = inp.value, rem = $("remChk").checked, store = rem ? LS : SS;
  const ok = s.length <= SAVELIM && store.set("input", s);
  if (!ok) store.del("input"); // never leave an older copy behind that would come back on refresh
  if (rem) SS.del("input");
  const w = $("saveWarn");
  if (ok) { w.hidden = true; return; }
  // a store that cannot take even one byte is switched off by the browser (site data blocked), not full
  const blocked = !store.set("probe", 1); store.del("probe");
  if (blocked) { if (!noStore) { noStore = true; w.textContent = "這個瀏覽器不允許網站儲存資料，重新整理後輸入會消失。"; } }
  else { noStore = false; w.textContent = `內容太大（${s.length.toLocaleString()} 字），裝置空間放不下，${rem ? "不會記住" : "重新整理後不會保留"}；舊的存檔已清除。`; }
  w.hidden = false;
}
let noStore = false;
let saveT = 0;
function persistSoon() { clearTimeout(saveT); if (inp.value.length < 20000) persist(); else saveT = setTimeout(persist, 300); }
// write the latest text when the page goes away, even if a debounced conversion or save is still pending
addEventListener("pagehide", persist);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") persist(); });

/* ---------- running a conversion ---------- */
const BIGLIM = 5 * 1048576, PREVIEW = 100000; // a textarea holding megabytes takes seconds to lay out
let busyT = 0, busyTick = 0, busyStart = 0, jobId = 0;
// keep a new error on screen: line heights differ between devices, so the box can end just below the fold
function showErr() { requestAnimationFrame(() => { const e = $("err"); if (e.hidden) return; const r = e.getBoundingClientRect(); if (r.top < 0) scrollBy(0, r.top - 8); else if (r.bottom > innerHeight) scrollBy(0, Math.min(r.top - 8, r.bottom - innerHeight + 8)); }); }
function setBusy(on) {
  clearTimeout(busyT); clearInterval(busyTick); busyT = busyTick = 0;
  if (!on) { $("busy").hidden = true; return; }
  busyStart = performance.now();
  busyT = setTimeout(() => {
    $("busy").hidden = false; $("busyMsg").textContent = "轉換中…";
    busyTick = setInterval(() => { $("busyMsg").textContent = "轉換中… " + Math.floor((performance.now() - busyStart) / 1000) + " 秒"; }, 1000);
  }, 120);
}
function setActions(enabled) {
  $("copyBtn").disabled = !enabled; $("useBtn").disabled = !enabled;
  $("swapBtn").disabled = !enabled || !!BY[state.codec].decodeOnly;
}
function clearOutput(meta) {
  result = null; out.value = ""; $("outMeta").textContent = meta || "";
  $("err").hidden = true; $("note").hidden = true; renderJwt(null); setActions(false);
}
function show(r) {
  setBusy(false); $("err").hidden = true; $("note").hidden = true;
  if (r.error) {
    clearOutput(""); $("err").textContent = (state.dir === "enc" ? "編碼失敗：" : "解碼失敗：") + r.error; $("err").hidden = false; showErr();
    $("swapBtn").disabled = true; return;
  }
  const text = r.text || "";
  result = { text, binary: !!r.binary };
  let prev = text;
  if (text.length > PREVIEW) { let k = PREVIEW; const c = text.charCodeAt(k - 1); if (c >= 0xD800 && c <= 0xDBFF) k--; prev = text.slice(0, k); }
  out.value = prev; $("outMeta").textContent = text ? stats(text) : "";
  const notes = [];
  if (r.note) notes.push(r.note);
  if (prev !== text) notes.push(`結果很長，輸出框只顯示前 ${prev.length.toLocaleString()} 字；「複製結果」和「結果當輸入」會用完整的 ${text.length.toLocaleString()} 字。`);
  if (notes.length) { $("note").textContent = notes.join("\n"); $("note").hidden = false; }
  renderJwt(r.jwt || null);
  setActions(!!text);
  if (!text) $("swapBtn").disabled = !!BY[state.codec].decodeOnly;
}
function run(manual) {
  const s = inp.value, my = ++jobId;
  if (wjob) { wjob = null; killWorker(); } // drop a conversion that is still running for older input
  setBusy(false);
  $("inMeta").textContent = stats(s);
  const big = s.length > BIGLIM;
  $("bigMsg").textContent = "輸入超過 5MB，改為手動轉換。"; $("bigBar").hidden = !big;
  persistSoon();
  if (big && !manual) { clearOutput("按「轉換」產生結果"); return; }
  const c = BY[state.codec], o = optsFor(c), dir = state.dir;
  if (!s.length) { show({ text: "" }); return; }
  // fast codecs finish 1MB in tens of ms, so only very large input for them goes to the worker (posting it costs more)
  if (s.length > (ASYNC_AT[c.id] || 200000) && workerOK && getWorker()) {
    setActions(false); setBusy(true);
    wjob = { id: my, codec: c.id, dir, s, o, done: r => { if (my === jobId) show(r); } };
    worker.postMessage({ id: my, codec: c.id, dir, s, o });
    return;
  }
  show(convert(c.id, dir, s, o));
}
$("cancelBtn").addEventListener("click", () => {
  if (!wjob) return;
  wjob = null; killWorker(); jobId++; setBusy(false);
  clearOutput("已取消");
  $("bigMsg").textContent = "已取消轉換。"; $("bigBar").hidden = false;
});
let inT;
inp.addEventListener("input", () => {
  if (isSample) { isSample = false; $("sampleChip").hidden = true; }
  clearTimeout(inT);
  // short input converts at once (and >5MB just clears the output at once); only large input waits for typing to pause
  const n = inp.value.length;
  if (n < 20000 || n > BIGLIM) run();
  else { setActions(false); inT = setTimeout(run, 80); } // the old result must not be copied while it is stale
});
$("runBtn").addEventListener("click", () => run(true));
function setInput(v, sample) { clearTimeout(inT); inp.value = v; isSample = !!sample; $("sampleChip").hidden = !sample; run(); }

function swap() {
  if (BY[state.codec].decodeOnly) { toast("JWT 只能解碼，無法交換"); return; }
  if (!result) { toast("沒有結果可以交換"); return; }
  if (result.binary) { toast("輸出是二進位資料的 Hex，無法直接交換"); return; }
  const o = result.text; state.dir = state.dir === "enc" ? "dec" : "enc"; renderDir(); save(); setInput(o); toast("已交換輸入與輸出");
}
$("swapBtn").addEventListener("click", swap);
$("useBtn").addEventListener("click", () => { if (!result || !result.text) { toast("沒有結果可用"); return; } setInput(result.text); toast("結果已移到輸入（方向不變），可選下一種轉換"); });
let sw = null;
out.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
out.addEventListener("pointerup", e => { if (!sw || e.pointerId !== sw.id) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null; if (dx < -70 && Math.abs(dy) < 40) swap(); });
out.addEventListener("pointercancel", () => { sw = null; });
$("copyBtn").addEventListener("click", async () => {
  const t = result ? result.text : ""; if (!t) { toast("沒有內容可以複製"); return; }
  try { await navigator.clipboard.writeText(t); toast("已複製"); return; } catch {}
  try {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    if (ok) { toast("已複製"); return; }
  } catch {}
  out.focus(); out.select(); toast("請長按選取的文字手動複製");
});
$("clearBtn").addEventListener("click", () => {
  const prev = inp.value, wasSample = isSample;
  setInput(""); persist(); inp.focus();
  if (prev) toast("已清除輸入", { label: "復原", fn: () => { setInput(prev, wasSample); persist(); } });
});
$("pasteBtn").addEventListener("click", async () => {
  try { const t = await navigator.clipboard.readText(); setInput(t); toast("已貼上"); } catch { inp.focus(); toast("無法讀取剪貼簿，請長按輸入框貼上"); }
});
$("detectBtn").addEventListener("click", () => {
  const id = detect(inp.value);
  if (!id) { toast(inp.value.trim() ? "無法判斷是哪種編碼" : "請先輸入內容"); return; }
  state.dir = "dec"; selectCodec(id, true);
  toast("判斷為 " + BY[id].label + "，已套用解碼");
});
$("remChk").addEventListener("change", () => {
  const on = $("remChk").checked;
  LS.set("remember", on);
  if (!on) LS.del("input");
  persist();
  toast(on ? "會在這台裝置記住輸入內容" : "已停止記住並清除裝置上的存檔；關閉分頁前重新整理仍會保留");
});

/* init */
renderCodecs(); renderDir(); renderOpts();
$("remChk").checked = !!LS.get("remember", false);
const savedIn = $("remChk").checked ? LS.get("input", null) : SS.get("input", null);
if (typeof savedIn === "string" && savedIn) setInput(savedIn); else setInput(SAMPLE, true);
requestAnimationFrame(updFade);
window.__eb = { CODECS: BY, detect, convert, punyEncode: CORE.punyEncode, punyDecode: CORE.punyDecode, optsFor, setInput, selectCodec, setDir, result: () => result };
window.__ebReady = true;
})();
</script>
