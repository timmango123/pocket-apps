<title>正規表示式測試</title>
<style>
/* Proofreader's desk: crisp white galley, editor's crimson for marks, alternating highlighter strips */
:root{
  --bg:#f1f2f4; --surface:#ffffff; --sunk:#f6f7f9; --ink:#17181c; --muted:#585c66; --faint:#878b95;
  --line:#dcdee3; --line-strong:#bfc3cb; --accent:#a8123f; --accent-ink:#ffffff; --accent-soft:#fbe4ea;
  --m0:#ffe27a; --m1:#b9e2ff; --m-ink:#17181c; --grp:#a8123f; --flash:#ff9f43;
  --bad:#b0221a; --bad-soft:#fbe3df; --ok:#22693a; --warn:#8a5600; --warn-soft:#fdf0d5;
  --shadow:0 14px 36px rgba(20,22,30,.2);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317; --surface:#1a1c21; --sunk:#16171b; --ink:#e7e8ec; --muted:#a2a6b0; --faint:#757a85;
  --line:#2a2d34; --line-strong:#3e424b; --accent:#ff6f93; --accent-ink:#2a0410; --accent-soft:#3c1622;
  --m0:#6b5512; --m1:#174766; --m-ink:#f4f5f7; --grp:#ff8fab; --flash:#c56a10;
  --bad:#ff8a7c; --bad-soft:#3d1a17; --ok:#7fd49a; --warn:#f3c05c; --warn-soft:#3a2d10;
  --shadow:0 14px 36px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1a1c21; --sunk:#16171b; --ink:#e7e8ec; --muted:#a2a6b0; --faint:#757a85;
  --line:#2a2d34; --line-strong:#3e424b; --accent:#ff6f93; --accent-ink:#2a0410; --accent-soft:#3c1622;
  --m0:#6b5512; --m1:#174766; --m-ink:#f4f5f7; --grp:#ff8fab; --flash:#c56a10;
  --bad:#ff8a7c; --bad-soft:#3d1a17; --ok:#7fd49a; --warn:#f3c05c; --warn-soft:#3a2d10;
  --shadow:0 14px 36px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 calc(28px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:62px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:19px;font-weight:760;white-space:nowrap}
.brand .glyph{font:700 18px var(--mono);color:var(--accent)}
.btn{min-height:44px;min-width:44px;padding:0 13px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--accent)}}
.pat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.prow{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:6px;background:var(--sunk);min-height:48px}
.prow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slash{font:600 20px var(--mono);color:var(--accent);padding:0 6px;flex:none}
#pattern{flex:1;min-width:0;border:0;background:transparent;font:15px var(--mono);min-height:44px;outline:none;padding:0}
#flagEcho{font:600 15px var(--mono);color:var(--accent);padding-right:10px;flex:none;min-width:12px}
.flags{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
.flag{width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font:700 15px var(--mono);cursor:pointer;color:var(--faint);flex:none}
.flag[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flags .sp{flex:1}
.flaghelp{font-size:12px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:13.5px}
.err b{display:block;font-weight:700}
.err code{font:12px var(--mono);opacity:.85}
.warn{background:var(--warn-soft);color:var(--warn)}
.sec{margin-top:12px}
.lab{display:flex;align-items:center;gap:8px;min-height:32px;font:700 11px var(--mono);letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.lab .sp{flex:1}
.lab .chip{font:700 11px var(--sans);letter-spacing:0;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.editor{position:relative;max-height:38svh;min-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);overscroll-behavior:contain}
.hl,#text{font:14px/1.65 var(--mono);padding:12px;margin:0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;tab-size:4;letter-spacing:0;font-variant-ligatures:none;border:0}
.inner{position:relative}
@media (pointer:coarse){.hl{font-size:max(16px,1rem)}}
.hl{color:var(--ink);min-height:150px;pointer-events:none}
#text{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--ink);overflow:hidden;outline:none}
#text::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:transparent}
.editor:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
mark{color:var(--m-ink);border-radius:2px;padding:0}
mark.m0{background:var(--m0)} mark.m1{background:var(--m1)}
mark.z{display:inline;background:none;box-shadow:-1px 0 0 1px var(--accent)}
mark.flash{background:var(--flash)}
.g{text-decoration:underline 2px var(--grp);text-underline-offset:3px}
.stat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--muted)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat .sp{flex:1}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-strong);margin-top:14px;overflow-x:auto}
.tabs button{min-height:44px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-weight:650;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:10px;min-height:140px}
.ml{list-style:none;margin:0;padding:0}
.ml li{border-bottom:1px solid var(--line)}
.ml button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 6px;cursor:pointer;min-height:44px}
.ml button:focus-visible{outline:2px solid var(--accent)}
@media (hover:hover){.ml button:hover{background:var(--sunk)}}
.mh{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--faint);font-family:var(--mono)}
.mh .n{color:var(--accent);font-weight:700}
.mt{font:14px/1.4 var(--mono);word-break:break-all;margin-top:2px}
.mt .ws{color:var(--faint)}
.gl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:4px;font:12.5px var(--mono)}
.gl dt{color:var(--muted)} .gl dd{margin:0;word-break:break-all}
.empty{color:var(--faint);font-size:14px;padding:16px 4px;text-align:center}
.fld{display:block;width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--sunk);font:14px var(--mono)}
pre.res{font:13.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--sunk);border-radius:6px;padding:10px;margin:8px 0 0;max-height:40svh;overflow:auto}
.ex{display:grid;gap:0}
.tok{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.tok code{font:600 13px var(--mono);background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;word-break:break-all;justify-self:start}
.tok span{font-size:13.5px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:86%;overflow:auto;overscroll-behavior:contain}
.sheet header{display:flex;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--surface);padding:4px 0 8px;z-index:1}
.sheet h2{margin:0;font-size:17px;flex:1}
.sheet h3{font:700 11px var(--mono);letter-spacing:.14em;color:var(--muted);margin:14px 0 4px}
.lib{display:grid;gap:0}
.libi{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.libi>button.pick{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:8px 4px;min-height:48px;cursor:pointer}
.libi>button.pick:focus-visible{outline:2px solid var(--accent)}
.libi .nm{font-weight:650;font-size:14.5px}
.libi .pt{font:12.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.libi>button.pick:hover{background:var(--sunk)}}
.cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cs button{min-height:48px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;text-align:left;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cs code{font:700 13.5px var(--mono);color:var(--accent)}
.cs small{font-size:12px;color:var(--muted)}
@media (hover:hover){.cs button:hover{border-color:var(--accent)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.layout{display:grid;gap:0}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .editor{max-height:calc(100svh - 300px);min-height:320px}
  .right .tabs{margin-top:12px}
  .panel{max-height:calc(100svh - 200px);overflow:auto}
}
@media (max-height:500px) and (orientation:landscape){ .editor{max-height:220px;min-height:120px} .hl{min-height:120px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="glyph" aria-hidden="true">/.*/</span><h1>正規表示式測試</h1></div>
    <button class="btn" id="libBtn" type="button">範例庫</button>
    <button class="btn" id="csBtn" type="button">速查表</button>
  </header>

  <section class="pat" aria-label="模式">

    </div>
    <div class="flags" role="group" aria-label="旗標">

      <button class="flag" type="button" id="flag-u" data-f="u" title="u：Unicode 模式">u</button>
      <button class="flag" type="button" id="flag-y" data-f="y" title="y：黏著，從 lastIndex 開始">y</button>
      <span class="sp"></span>
    </div>
    <div class="flaghelp" id="flagHelp"></div>
    <div id="err" class="err" role="alert" hidden></div>
  </section>

  <div class="layout">
    <div class="left">
      <div class="sec">
        <div class="lab">TEST TEXT<span class="chip" id="sampleChip" hidden>範例</span><span class="sp"></span><button class="btn" id="runBtn" type="button" hidden>執行</button></div>
        <div class="editor" id="editor"><div class="inner">
          <div class="hl" id="hl" aria-hidden="true"></div>
          <textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="測試文字"></textarea>
        </div></div>
        <div class="stat" role="status" aria-live="polite"><span id="stat">—</span><span class="sp"></span><button class="btn" id="saveBtn" type="button">收藏模式</button></div>
      </div>
    </div>
    <div class="right">
      <div class="tabs" role="tablist">
        <button role="tab" type="button" id="tab-list" aria-selected="true">匹配清單</button>
        <button role="tab" type="button" id="tab-repl" aria-selected="false">取代</button>
        <button role="tab" type="button" id="tab-split" aria-selected="false">分割</button>
        <button role="tab" type="button" id="tab-explain" aria-selected="false">說明</button>
      </div>
      <div class="panel" id="pane-list" role="tabpanel"><ol class="ml" id="mlist"></ol></div>
      <div class="panel" id="pane-repl" role="tabpanel" hidden>
        <label for="repl" style="font-size:13px;color:var(--muted)">取代為（支援 $1、$&lt;name&gt;、$&amp;、$$）</label>
        <input id="repl" class="fld" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" style="margin-top:4px">
        <pre class="res" id="replOut"></pre>
        <div style="margin-top:8px"><button class="btn pri" id="copyRepl" type="button">複製結果</button></div>
      </div>
      <div class="panel" id="pane-split" role="tabpanel" hidden><pre class="res" id="splitOut" style="margin:0"></pre></div>
      <div class="panel" id="pane-explain" role="tabpanel" hidden><div class="ex" id="explain"></div></div>
    </div>
  </div>
</div>

<div class="sheet-bg" id="libSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="libTitle">
  <header><h2 id="libTitle">範例庫</h2><button class="btn" type="button" data-close>關閉</button></header>

</div></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "regex-lab:v1:";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let HAS_D = false; try { new RegExp("", "d"); HAS_D = true; } catch {}

/* ---------- engine (runs inside a Blob Worker; same function is the no-worker fallback) ---------- */
function engine(d) {
  const t0 = performance.now();
  let re; try { re = new RegExp(d.pattern, d.flags + (d.hasD ? "d" : "")); } catch (e) { return { id: d.id, error: e.message }; }
  const text = d.text, names = d.names, LIMIT = 10000, out = [];
  const g = d.flags.includes("g"), uni = d.flags.includes("u") || d.flags.includes("v");
  const push = m => {
    const groups = [];
    for (let k = 1; k < m.length; k++) {
      const ix = m.indices && m.indices[k];
      groups.push({ n: k, name: names[k - 1] || null, s: ix ? ix[0] : -1, e: ix ? ix[1] : -1, t: m[k] === undefined ? null : (m[k].length > 300 ? m[k].slice(0, 300) + "…" : m[k]) });
    }
    out.push({ i: m.index, e: m.index + m[0].length, t: m[0].length > 300 ? m[0].slice(0, 300) + "…" : m[0], g: groups });
  };
  let truncated = false;
  if (g) {
    re.lastIndex = 0; let m;
    while ((m = re.exec(text))) {
      push(m);
      if (m[0] === "") { let li = re.lastIndex; const c = text.charCodeAt(li); re.lastIndex = uni && c >= 0xD800 && c <= 0xDBFF && li + 1 < text.length ? li + 2 : li + 1; if (li >= text.length) break; }

/* ---------- state ---------- */
const pat = $("pattern"), ta = $("text"), hl = $("hl");
let flags = new Set(["g"]);

const SAMPLES = [
  { name: "日期 YYYY-MM-DD（具名群組）", p: "(?<year>\\d{4})-(?<month>0[1-9]|1[0-2])-(?<day>0[1-9]|[12]\\d|3[01])", f: "g", r: "$<day>/$<month>/$<year>", s: "訂單 A-1024 於 2026-10-12 成立，預計 2026-10-15 出貨。\n無效日期：2026-13-01、2026-02-32\n退貨期限 2026-11-01。" },
  { name: "Email", p: "[\\w.+-]+@[\\w-]+(?:\\.[\\w-]+)+", f: "g", r: "<$&>", s: "聯絡窗口：amy.lin@example.com.tw、service+tw@shop-demo.io\n錯誤格式：bob@、@example.com\n副本 ken_chen@mail.example.org" },
  { name: "台灣手機", p: "^09\\d{8}$", f: "gm", r: "$&", s: "0912345678\n0987654321\n091234567\n02-23456789\n0900000000" },
  { name: "市話", p: "^0\\d{1,2}-?\\d{6,8}$", f: "gm", r: "$&", s: "02-23456789\n07-7654321\n049-2345678\n0912345678\n2-1234567" },

let lastPatSel = null;
