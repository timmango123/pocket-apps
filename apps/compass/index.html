<title>指南針</title>
<style>

    --face: #0d141c; --face-2: #070b10; --bezel: #1d2833; --bezel-2: #33424f; --tick: #bdf3d6; --tick-soft: rgba(189, 243, 214, .4);

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070b10; --card: #10161e; --line: rgba(190, 240, 215, .1); --line-2: rgba(190, 240, 215, .24);

* { box-sizing: border-box; }

.btn { min-height: 52px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.btn svg { width: 20px; height: 20px; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

.go { min-height: 56px; border-radius: 14px; border: 0; background: var(--on); color: var(--on-ink); font-size: 17px; font-weight: 800; letter-spacing: .04em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

      S.trueNorth = sv.trueNorth === true;
      if (typeof sv.declination === 'number' && isFinite(sv.declination) && Math.abs(sv.declination) <= 30) S.declination = Math.round(sv.declination * 10) / 10;
      if (typeof sv.target === 'number' && isFinite(sv.target)) S.target = norm360(sv.target);
      if (sv.mode === '16pt') S.mode = '16pt';
      if (['auto', 'light', 'dark'].indexOf(sv.theme) >= 0) S.theme = sv.theme;
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var ICON = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
  };
  function applyTheme() {
    if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
    $('#themeBtn').innerHTML = ICON[S.theme];
    $('#themeBtn').setAttribute('aria-label', '主題：' + { auto: '跟隨系統', light: '淺色', dark: '深色' }[S.theme] + '（點擊切換）');
  }
  $('#themeBtn').addEventListener('click', function () { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); save(); });
  applyTheme();
  var toastT;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2000); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- rose ----------
  (function drawRose() {
    var h = '', c = 150;
    function pt(r, a) { var t = a / DEG; return [(c + r * Math.sin(t)).toFixed(2), (c - r * Math.cos(t)).toFixed(2)]; }
    for (var d = 0; d < 360; d += 5) {
      var M = d % 30 === 0, m = d % 10 === 0, len = M ? 15 : m ? 10 : 6, p1 = pt(137, d), p2 = pt(137 - len, d);
      h += '<line class="tk' + (d === 0 ? ' N' : M ? ' M' : m ? ' m' : '') + '" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>';
      if (M && d % 90) { var q = pt(112, d); h += '<text class="num" x="' + q[0] + '" y="' + q[1] + '" dy="4" transform="rotate(' + d + ' ' + q[0] + ' ' + q[1] + ')">' + d + '</text>'; }
    }
    [['北', 0, 'card n'], ['東', 90, 'card'], ['南', 180, 'card'], ['西', 270, 'card'], ['東北', 45, 'icard'], ['東南', 135, 'icard'], ['西南', 225, 'icard'], ['西北', 315, 'icard']].forEach(function (L) {
      var q = pt(L[2] === 'icard' ? 94 : 103, L[1]);
      h += '<text class="' + L[2] + '" x="' + q[0] + '" y="' + q[1] + '" dy="' + (L[2] === 'icard' ? 4 : 8) + '" transform="rotate(' + L[1] + ' ' + q[0] + ' ' + q[1] + ')">' + L[0] + '</text>';
    });
    // north pointer and a small south tail inside the hub ring
    h += '<path class="northpt" d="M150 70 L158 120 L142 120 Z"/><path class="southpt" d="M150 230 L158 180 L142 180 Z"/>';
    $('#ticks').innerHTML = h;
  })();

  // ---------- state ----------
  var R = {
    running: false, got: false, any: false, relOnly: false, src: null, absSeen: false,
    raw: null, cur: null, acc: null, beta: 0, gamma: 0, hist: [], calibUntil: 0,
    timer: 0, raf: 0, forceAngle: null, onTarget: false,
    lastT: 0, lastEvt: 0, iosUncal: false, shownDeg: null, shownDir: null, ariaT: 0, ariaTxt: '', live: { t: 0, key: '' }
  };
  function curScr() {
    if (R.forceAngle != null) return R.forceAngle;
    var so; try { so = screen.orientation && screen.orientation.angle; } catch (e) {}
    return screenAngle(so, window.orientation);
  }
  function feed(h, acc) {
    var now = performance.now();
    R.raw = h; R.acc = acc; R.lastEvt = now;
    R.cur = smoothAngle(R.cur, h, R.lastT ? smoothK(angleDiff(h, R.cur || 0), (now - R.lastT) / 1000) : 1);
    R.lastT = now;
    R.hist.push([now, angleDiff(h, norm360(R.cur))]);
    while (R.hist.length && now - R.hist[0][0] > 2000) R.hist.shift();
    if (!R.got) { R.got = true; clearTimeout(R.timer); $('#gate').hidden = true; $('#tgtBtn').hidden = false; }
  }
  function onAbs(e) {
    if (e.alpha == null) return;
    R.any = true; R.absSeen = true; R.src = 'abs';
    R.beta = e.beta || 0; R.gamma = e.gamma || 0;
    feed(headingFromEuler(e.alpha, e.beta, e.gamma, curScr()), null);
  }
  function onRel(e) {
    if (e.alpha == null && e.beta == null && e.webkitCompassHeading == null) return;
    R.any = true;
    if (e.beta != null) { R.beta = e.beta; R.gamma = e.gamma || 0; }
    var w = e.webkitCompassHeading;
    // iOS reports -1 while the compass is uncalibrated (or unavailable): keep the dial, flag calibration
    if (typeof w === 'number' && w < 0) { R.src = 'ios'; R.iosUncal = true; R.acc = -1; R.lastEvt = performance.now(); return; }
    if (typeof w === 'number' && isFinite(w) && w >= 0) { R.src = 'ios'; R.iosUncal = false; feed(headingFromWebkit(w, curScr()), typeof e.webkitCompassAccuracy === 'number' ? e.webkitCompassAccuracy : null); return; }
    if (R.absSeen) return;
    if (e.absolute === true && e.alpha != null) { R.src = 'abs'; feed(headingFromEuler(e.alpha, e.beta, e.gamma, curScr()), null); return; }
    if (e.alpha != null) R.relOnly = true;
  }
  function onCal() { R.calibUntil = performance.now() + 6000; }
  var listening = false;
  function listen(on) {
    if (on === listening) return; listening = on;
    var f = on ? 'addEventListener' : 'removeEventListener';
    window[f]('deviceorientationabsolute', onAbs); window[f]('deviceorientation', onRel); window[f]('compassneedscalibration', onCal);
  }

  // ---------- messages ----------
  var SITE = 'https://timmango123.github.io/pocket-apps/tools/#compass';
  function onSite() {
    var h = '';
    try { h = location.hostname || ''; } catch (e) {}
    try { if (!h && window.top) h = window.top.location.hostname; } catch (e) {}
    return /(^|\.)github\.io$/.test(h);
  }
  function showMsg(title, body, retry, noLink) {
    var link = onSite() || noLink ? '' : '<br>在 claude.ai 上感測器通常被封鎖，請用手機開啟網站版：<br><a href="' + SITE + '" target="_blank" rel="noopener">' + SITE.replace('https://', '') + '</a>';
    $('#gateMsg').innerHTML = '<div class="msg"><strong>' + title + '</strong>' + body + link + '</div>';
    $('#gateMsg').hidden = false;
    $('#goBtn').disabled = false; $('#goBtn').lastChild.nodeValue = retry ? '再試一次' : '啟用指南針';
    $('#gate').hidden = false; $('#tgtBtn').hidden = true; $('#turn').hidden = true;
    setAcc('', '未啟用');
  }
  function timeout() {
    if (R.got) return;
    var rel = R.relOnly;
    stop();
    if (R.iosUncal) showMsg('指南針需要校正', 'iPhone 回報方位尚未校正。請離開金屬物品或磁鐵，以 8 字形揮動手機幾次後再試；也請確認「設定 > 隱私權與安全性 > 定位服務 > 系統服務」中的「指南針校正」已開啟。', true, true);
    else if (rel) showMsg('此裝置不提供絕對方位', '瀏覽器只給相對角度，無法判斷哪裡是北方。請改用 Chrome（Android）或 Safari（iPhone）。', true, true);
    else showMsg('這台裝置沒有感測器或瀏覽器不提供', '3 秒內沒有收到方位資料。請用有磁力計的手機開啟。', true);
  }

  // ---------- start / stop ----------
  var wake = null;
  function lockWake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); } catch (e) {} }
  function start() {
    $('#gateMsg').hidden = true;
    if (window.isSecureContext === false) { showMsg('需要 HTTPS 安全連線', '瀏覽器只在 HTTPS 網頁提供方位感測器，這個網址不是安全連線。', false); return; }
    if (typeof DeviceOrientationEvent === 'undefined') { timeout(); return; }
    var p = null;
    try { if (typeof DeviceOrientationEvent.requestPermission === 'function') p = DeviceOrientationEvent.requestPermission(); } catch (e) { p = Promise.reject(e); }
    $('#goBtn').disabled = true;
    Promise.resolve(p).then(function (r) { return r; }, function (e) { return 'error:' + (e && e.name || 'Error'); }).then(function (r) {
      if (r === 'denied') {
        var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        showMsg('方向取用被拒絕', apple ? 'iPhone／iPad：關閉這個分頁重新開啟再點一次並選「允許」；若仍無效，到「設定 > Safari」開啟「動作與方向取用」。'
          : '請在瀏覽器的網站設定（網址列左側的圖示）允許「動作感應器」，再點一次。', true, true);
        return;
      }
      if (typeof r === 'string' && r.indexOf('error:') === 0) { showMsg('無法取得感測器權限', '瀏覽器拒絕了請求（' + r.slice(6) + '）。這通常是內嵌頁面被限制。', true); return; }
      R.running = true; R.got = false; R.relOnly = false; R.any = false; R.iosUncal = false; R.lastT = 0;
      listen(true); lockWake(); loop();
      setAcc('', '等待方位資料…');
      clearTimeout(R.timer); R.timer = setTimeout(timeout, 3000);
    });
  }
  function stop() { R.running = false; listen(false); cancelAnimationFrame(R.raf); clearTimeout(R.timer); try { if (wake) wake.release(); } catch (e) {} wake = null; }
  $('#goBtn').addEventListener('click', start);
  document.addEventListener('visibilitychange', function () {
    if (!R.running) return;
    if (document.visibilityState === 'hidden') { listen(false); cancelAnimationFrame(R.raf); }
    else { R.lastEvt = R.lastT = 0; R.stallFrom = performance.now(); listen(true); lockWake(); loop(); }
  });

  // ---------- settings ----------
  function decl() { return S.trueNorth ? S.declination : 0; }
  function renderRef() {
    $('#magBtn').setAttribute('aria-pressed', String(!S.trueNorth));
    $('#trueBtn').setAttribute('aria-pressed', String(S.trueNorth));
    $('#refChip').textContent = S.trueNorth ? '真北（' + (S.declination > 0 ? '+' : '') + S.declination + '°）' : '磁北';
    if (document.activeElement !== $('#declIn')) $('#declIn').value = S.declination;
  }
  $('#magBtn').addEventListener('click', function () { S.trueNorth = false; save(); renderRef(); draw(); });
  $('#trueBtn').addEventListener('click', function () { S.trueNorth = true; save(); renderRef(); draw(); });
  function setDecl(v) { v = Math.round(v * 10) / 10; if (!isFinite(v)) return; S.declination = Math.max(-30, Math.min(30, v)); save(); renderRef(); draw(); }
  $('#declIn').addEventListener('change', function () { var v = parseDecl(this.value); if (isFinite(v)) setDecl(v); else toast('請輸入 −30 到 30 之間的數字'); this.value = S.declination; });
  $('#declIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('#declSign').addEventListener('click', function () { var t = $('#declIn'); if (document.activeElement === t && isFinite(parseDecl(t.value))) { setDecl(-parseDecl(t.value)); t.value = S.declination; } else setDecl(-S.declination); toast('磁偏角 ' + S.declination + '°（' + (S.declination < 0 ? '偏西' : S.declination > 0 ? '偏東' : '無偏角') + '）'); });
  $('#declMinus').addEventListener('click', function () { setDecl(S.declination - 0.5); });
  $('#declPlus').addEventListener('click', function () { setDecl(S.declination + 0.5); });
  $('#hubBtn').addEventListener('click', function () { S.mode = S.mode === 'deg' ? '16pt' : 'deg'; save(); draw(); toast(S.mode === 'deg' ? '以度數為主' : '以 16 方位為主'); });

  // ---------- target ----------
  function renderTarget() {
    var on = S.target != null;
    $('#tgtBtn').setAttribute('aria-pressed', String(on));
    $('#tgtLbl').textContent = on ? '清除目標（' + fmtHeading(toTrue(S.target, decl())) + '）' : '鎖定此方向';
    if (on) $('#tgt').removeAttribute('hidden'); else $('#tgt').setAttribute('hidden', '');
    if (on) $('#tgt').setAttribute('transform', 'rotate(' + toTrue(S.target, decl()).toFixed(2) + ' 150 150)');
    $('#turn').hidden = !on || !R.got;
  }
  $('#tgtBtn').addEventListener('click', function () {
    if (S.target != null) { S.target = null; R.onTarget = false; R.live.key = ''; say('已清除目標'); }
    else if (R.cur != null) { S.target = norm360(R.cur); R.onTarget = true; R.live.key = 'ok'; buzz(20); toast('已鎖定 ' + fmtHeading(toTrue(S.target, decl()))); }
    save(); draw();
  });

  // ---------- copy (long press) ----------
  var lp = 0;
  function text() { if (R.cur == null || R.shownDeg == null) return ''; return R.shownDeg + '° ' + DIR16[R.shownDir] + '（' + (S.trueNorth ? '真北' : '磁北') + '）'; }
  function copy() {
    var t = text(); if (!t) return;
    var done = function () { toast('已複製：' + t); buzz(15); };
    try { navigator.clipboard.writeText(t).then(done, function () { toast(t); }); } catch (e) { toast(t); }
  }
  var ro = $('#readout');
  ro.addEventListener('pointerdown', function () { clearTimeout(lp); lp = setTimeout(copy, 550); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { ro.addEventListener(ev, function () { clearTimeout(lp); }); });
  ro.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ro.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); } });
  // screen readers activate with a synthetic click (detail 0); a finger tap (detail 1) does nothing, long press copies
  ro.addEventListener('click', function (e) { if (e.detail === 0) copy(); });

  // ---------- drawing ----------
  function setAcc(kind, t) { var c = $('#accChip'); c.className = 'chip' + (kind ? ' ' + kind : ''); if ($('#accText').textContent !== t) $('#accText').textContent = t; }
  var ARROW = {
    r: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
    l: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  // Screen readers: one polite region, spoken only when something meaningful changes (never per degree).
  var liveT = 0;
  function say(t) { var el = $('#live'); clearTimeout(liveT); el.textContent = ''; liveT = setTimeout(function () { el.textContent = t; }, 60); }
  function draw() {
    renderRef(); renderTarget();
    var ro = $('#readout');
    ro.classList.toggle('alt', S.mode === '16pt');
    if (R.cur == null) return;
    var now = performance.now();
    var dispUnwrapped = R.cur + decl(), h = norm360(dispUnwrapped);
    $('#rose').setAttribute('transform', 'rotate(' + (-dispUnwrapped).toFixed(2) + ' 150 150)');
    if (R.shownDecl !== decl()) { R.shownDecl = decl(); R.shownDeg = R.shownDir = null; } // a settings jump is exact, not held
    R.shownDeg = holdDeg(R.shownDeg, h); R.shownDir = holdDir(R.shownDir, h);
    var degT = R.shownDeg + '°', dirT = DIR16[R.shownDir];
    if ($('#hDeg').textContent !== degT) $('#hDeg').textContent = degT;
    if ($('#hName').textContent !== dirT) $('#hName').textContent = dirT;
    // the readout's accessible name carries the heading, refreshed at most once a second
    var aria = '目前方位 ' + degT + ' ' + dirT + '（' + (S.trueNorth ? '真北' : '磁北') + '），按兩下複製';
    if (aria !== R.ariaTxt && now - R.ariaT > 1000) { R.ariaTxt = aria; R.ariaT = now; ro.setAttribute('aria-label', aria); }
    // tilt bubble in the hub: the dot drifts toward the high side (device axes turned to the screen's)
    var sa = curScr() / DEG, gx = -R.gamma, gy = -R.beta;
    var bx = (gx * Math.cos(sa) + gy * Math.sin(sa)) / 30 * 22, by = (-gx * Math.sin(sa) + gy * Math.cos(sa)) / 30 * 22;
    var bd = Math.hypot(bx, by); if (bd > 22) { bx *= 22 / bd; by *= 22 / bd; }
    $('#tiltDot').setAttribute('transform', 'translate(' + bx.toFixed(1) + ' ' + by.toFixed(1) + ')');
    // sensor stalled (no event for 3 s while visible): dim the number instead of showing a frozen reading as live
    var since = now - (R.lastEvt || R.stallFrom || now), stale = R.running && since > 3000;
    ro.classList.toggle('stale', stale);
    // accuracy / tilt
    var jitter = circStd(R.hist.map(function (x) { return x[1]; }));
    if (stale) setAcc('warn', '感測器沒有回應');
    else if (now < R.calibUntil || needsCalibration(R.acc, jitter)) setAcc('warn', '需要校正：以 8 字形揮動手機');
    else if (sideTilt(R.beta, R.gamma, curScr()) > 60 || tiltOf(R.beta, R.gamma) > 120) setAcc('warn', '請拿正手機，螢幕朝上');
    else setAcc('ok', '精度良好');
    if (S.target != null) {
      var t = turnHint(S.target, norm360(R.cur), R.onTarget), tu = $('#turn');
      tu.className = 'turn' + (t.ok ? ' ok' : '');
      var html = t.ok ? ARROW.ok + t.text : t.d > 0 ? t.text + ARROW.r : ARROW.l + t.text;
      if (tu.dataset.h !== html) { tu.innerHTML = html; tu.dataset.h = html; }
      if (t.ok && !R.onTarget) buzz(40);
      R.onTarget = t.ok;
      // announce reaching the target at once; otherwise the side and a 10° bucket, at most every 3 s
      var key = t.ok ? 'ok' : (t.d > 0 ? 'r' : 'l') + Math.round(Math.abs(t.d) / 10);
      if (key !== R.live.key && (t.ok || now - R.live.t > 3000)) { R.live.key = key; R.live.t = now; say(t.text); }
    }
  }
  function loop() {
    cancelAnimationFrame(R.raf);
    var f = function () { if (!R.running || document.visibilityState === 'hidden') return; draw(); R.raf = requestAnimationFrame(f); };
    R.raf = requestAnimationFrame(f);
  }
  window.addEventListener('orientationchange', function () { R.lastT = 0; });
  draw();
  window.__compass = { R: R, S: S, setForceAngle: function (a) { R.forceAngle = a; }, draw: draw };
})();
</script>
