<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>真心話大冒險</title>
<style>
:root{
  --bg:#f5eee6; --bg-dot:rgba(59,31,78,.06); --surface:#fffaf4; --surface-2:#f0e6da; --ink:#241a2e; --ink-2:#5a4e65; --ink-3:#7f7488;
  --line:#e2d5c6; --line-strong:#c4b4a2;
  --plum:#3a1f4f; --plum-2:#56306f; --plum-ink:#fff3e4;
  --truth:#0b7f86; --truth-2:#12a3a5; --truth-soft:#d6efec; --truth-ink:#ffffff;
  --dare:#d9482a; --dare-2:#f06a3c; --dare-soft:#fde2d7; --dare-ink:#ffffff;
  --gold:#e79a10; --good:#2c7a4b; --good-soft:#dcefe2; --bad:#b4302c; --bad-soft:#f8dedb; --warn:#8a5a00;
  --focus:#1c5fd1; --scrim:rgba(24,14,32,.5);
  --shadow:0 1px 0 rgba(58,31,79,.06), 0 10px 26px -14px rgba(58,31,79,.45);
  --shadow-lg:0 2px 0 rgba(58,31,79,.06), 0 22px 44px -18px rgba(58,31,79,.55);
  --seg-on:#fffaf4; --wm:.07;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140e1c; --bg-dot:rgba(255,255,255,.035); --seg-on:#3e3150; --wm:.045; --surface:#1f1729; --surface-2:#2a2035; --ink:#f4ecf6; --ink-2:#c6b9cf; --ink-3:#998ca3;
    --line:#3a2e47; --line-strong:#56476a;
    --plum:#ffb03b; --plum-2:#ffc76b; --plum-ink:#2a1500;
    --truth:#2fc3bd; --truth-2:#5fdcd3; --truth-soft:#123536; --truth-ink:#04201f;
    --dare:#ff7650; --dare-2:#ff9b72; --dare-soft:#41201a; --dare-ink:#2b0a02;
    --gold:#ffc14d; --good:#6fd093; --good-soft:#173123; --bad:#ff7c78; --bad-soft:#3f1c1f; --warn:#f2c260;
    --focus:#8ab6ff; --scrim:rgba(0,0,0,.66);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 0 rgba(0,0,0,.3), 0 24px 44px -18px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140e1c; --bg-dot:rgba(255,255,255,.035); --seg-on:#3e3150; --wm:.045; --surface:#1f1729; --surface-2:#2a2035; --ink:#f4ecf6; --ink-2:#c6b9cf; --ink-3:#998ca3;
  --line:#3a2e47; --line-strong:#56476a;
  --plum:#ffb03b; --plum-2:#ffc76b; --plum-ink:#2a1500;
  --truth:#2fc3bd; --truth-2:#5fdcd3; --truth-soft:#123536; --truth-ink:#04201f;
  --dare:#ff7650; --dare-2:#ff9b72; --dare-soft:#41201a; --dare-ink:#2b0a02;
  --gold:#ffc14d; --good:#6fd093; --good-soft:#173123; --bad:#ff7c78; --bad-soft:#3f1c1f; --warn:#f2c260;
  --focus:#8ab6ff; --scrim:rgba(0,0,0,.66);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 26px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 0 rgba(0,0,0,.3), 0 24px 44px -18px rgba(0,0,0,.9);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;min-height:100dvh;
  background-image:radial-gradient(var(--bg-dot) 1.2px, transparent 1.4px), radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--dare) 14%, transparent), transparent 55%), radial-gradient(ellipse at 0% 100%, color-mix(in srgb, var(--truth) 13%, transparent), transparent 55%);
  background-size:16px 16px, 100% 100%, 100% 100%;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom));padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Header ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"mark ttl icons" "tabs tabs tabs";align-items:center;column-gap:10px;row-gap:8px;margin-bottom:10px}
.mark{grid-area:mark;width:44px;height:44px;display:block}
.ttl{grid-area:ttl;min-width:0}
.ttl h1{margin:0;font-size:18px;line-height:1.15;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1 .t{color:var(--truth)} .ttl h1 .d{color:var(--dare)}
.ttl .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.icons{grid-area:icons;display:flex;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);padding:0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.iconbtn:active{transform:scale(.94)}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px}
.tabs button{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;white-space:nowrap;transition:background .18s,color .18s}
.tabs button svg{width:17px;height:17px}
.tabs button[aria-selected="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow)}
.tabs .badge{min-width:18px;height:18px;border-radius:9px;background:var(--dare);color:var(--dare-ink);font-size:11px;line-height:18px;padding:0 5px;font-weight:800}

/* ---------- Common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.card h2 .meta{font-weight:600;letter-spacing:0;color:var(--ink-3);font-size:12px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 2px 0;line-height:1.5}
.sample{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--warn);border:1px dashed var(--line-strong);border-radius:999px;padding:1px 8px;font-weight:800;letter-spacing:.04em}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;padding:0 16px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s, box-shadow .15s, background .15s}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px;border-radius:12px}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--plum-ink);box-shadow:var(--shadow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%, var(--line))}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
input[type=text],input[type=search],textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 12px;font-size:16px;min-width:0}
textarea{padding:10px 12px;min-height:96px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--focus) 60%,transparent);outline-offset:0;background:var(--surface)}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:6px 2px 0;min-height:0}
.ok-msg{color:var(--good);font-size:13px;font-weight:700;margin:6px 2px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:800;cursor:pointer;color:var(--ink-3);font-size:14px;padding:0 6px;line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;color:var(--ink-3);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.chip.t[aria-pressed="true"]{background:var(--truth);border-color:var(--truth);color:var(--truth-ink)}
.chip.d[aria-pressed="true"]{background:var(--dare);border-color:var(--dare);color:var(--dare-ink)}
.lv{display:inline-flex;gap:2px;vertical-align:middle}
.lv i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}
.lv i.on{opacity:1}
.setrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .lbl{flex:1;min-width:0;font-weight:700}
.setrow .lbl small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);line-height:1.4}
.setblock{padding:8px 0;border-top:1px solid var(--line)}
.setblock:first-of-type{border-top:0;padding-top:0}
.setblock .lbl{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.setblock .lbl small{font-weight:500;font-size:12px;color:var(--ink-3)}
.switch{position:relative;flex:none;width:52px;height:44px;display:inline-flex;align-items:center;cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch .tog{pointer-events:none;width:52px;height:30px;border-radius:15px;background:var(--line-strong);position:relative;transition:background .18s}
.switch .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.3,1.4,.6,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .tog{background:var(--good)}
.switch input:checked + .tog::after{transform:translateX(22px)}
.switch input:focus-visible + .tog{outline:2px solid var(--focus);outline-offset:2px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden;flex:none}
.step button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:44px;text-align:center;font-weight:900;font-size:17px}
.empty{text-align:center;color:var(--ink-3);padding:22px 10px;font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ---------- Game ---------- */
.game{display:grid;grid-template-columns:1fr;gap:10px}
.stage{position:relative;height:280px;display:flex;align-items:center;justify-content:center}
.wheel-wrap{position:relative;width:260px;height:260px;transition:transform .45s cubic-bezier(.2,.9,.25,1.08), opacity .3s;transform-origin:50% 50%}
.wheel-wrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.wheel-wrap canvas:active{cursor:grabbing}
.who{position:absolute;left:0;right:0;top:0;text-align:center;pointer-events:none;opacity:0;transform:translateY(-8px) scale(.96);transition:opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1)}
.who.on{opacity:1;transform:none}
.who .k{font-size:12px;letter-spacing:.3em;color:var(--ink-3);font-weight:800}
.who .n{font-size:30px;font-weight:900;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;padding:0 8px}
.who .n .ex{color:var(--dare)}
.spin-hint{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12px;color:var(--ink-3);font-weight:600;pointer-events:none;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.spin-hint b{color:var(--ink-2)}
.docks{display:grid;min-height:116px}
.docks > .dock{grid-area:1/1;display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.dock .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock .trio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtn{min-height:64px;border-radius:18px;border:0;font-weight:900;font-size:21px;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .08s, filter .15s}
.bigbtn:active:not(:disabled){transform:translateY(2px) scale(.985)}
.bigbtn:disabled{opacity:.4;cursor:not-allowed}
.bigbtn,.minor .btn{transition:transform .08s, filter .15s, opacity .2s}
.arming{opacity:.5 !important;filter:saturate(.5);transition:none !important}
.bigbtn .g{font-size:13px;font-weight:800;opacity:.85;letter-spacing:0}
.bigbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.bigbtn.spin{background:var(--plum);color:var(--plum-ink);font-size:20px}
.bigbtn.t{background:linear-gradient(135deg,var(--truth),var(--truth-2));color:var(--truth-ink)}
.bigbtn.d{background:linear-gradient(135deg,var(--dare),var(--dare-2));color:var(--dare-ink)}
.bigbtn.done{background:var(--good);color:#fff;min-height:58px}
:root[data-theme="dark"] .bigbtn.done{color:#06200f}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bigbtn.done{color:#06200f} }
.minor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.minor .btn{min-height:44px;font-size:14px;color:var(--ink-2);border-radius:12px}
.minor .btn .c{font-size:12px;color:var(--ink-3);font-weight:700}
.mini-tog{width:30px;height:18px;border-radius:9px;background:var(--line-strong);position:relative;flex:none;transition:background .18s}
.mini-tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .18s}
#fam-quick[aria-pressed="true"] .mini-tog{background:var(--good)}
#fam-quick[aria-pressed="true"] .mini-tog::after{transform:translateX(12px)}
.spin-info{font-size:13px;color:var(--ink-3);text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.spin-info b{color:var(--ink-2)}
.empty-pool{font-size:12px;color:var(--bad);text-align:center;font-weight:700}

/* Question card */
.cardzone{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;perspective:1200px}
.qcard{position:relative;width:100%;max-width:440px;max-height:460px;align-self:center;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.5,1)}
.qcard.back{transform:rotateY(180deg)}
.qcard .face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow-lg)}
.qcard .front{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.qcard .rear{pointer-events:none;transform:rotateY(180deg);background:var(--plum);display:grid;place-items:center}
.qcard .rear svg{width:60%;height:60%;opacity:.95}
.qhead{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:12px 14px;color:#fff;font-weight:900;letter-spacing:.08em;font-size:14px}
.qcard.T .qhead{background:linear-gradient(135deg,var(--truth),var(--truth-2));color:var(--truth-ink)}
.qcard.D .qhead{background:linear-gradient(135deg,var(--dare),var(--dare-2));color:var(--dare-ink)}
.qhead .lvtag{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.qhead .heart{font-size:12px;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:999px;letter-spacing:0}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 20px;position:relative;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.qbody.scroll{justify-content:flex-start;padding-bottom:22px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.qbody.scroll.end{-webkit-mask-image:none;mask-image:none}
.qmore{color:var(--truth);font-weight:900}
.qcard.D .qmore{color:var(--dare)}
.front .wm{position:absolute;right:-8px;bottom:-34px;font-size:124px;font-weight:900;line-height:1;opacity:var(--wm);pointer-events:none}
.qcard.T .wm{color:var(--truth)} .qcard.D .wm{color:var(--dare)}
.qtext{font-size:22px;font-weight:800;line-height:1.5;text-align:center;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere;position:relative}
.qtext .p{color:var(--dare);background:var(--dare-soft);border-radius:6px;padding:0 4px;white-space:nowrap}
.qcard.T .qtext .p{color:var(--truth);background:var(--truth-soft)}
.qfoot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 12px;font-size:12px;color:var(--ink-3);font-weight:700}
.qfoot .pl{color:var(--ink);font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.timer{min-height:44px;margin:-6px -4px -6px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:900;display:inline-flex;align-items:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--ink-2);font-size:14px;flex:none}
.timer.run{background:var(--gold);border-color:var(--gold);color:#2b1a00}
.timer.end{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- Players ---------- */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;min-height:50px;padding:3px 3px 3px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.plist .dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.plist input{flex:1;background:transparent;border-color:transparent;font-weight:800;padding:0 6px}
.plist input:focus{background:var(--surface)}
.plist .x{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center;flex:none}
.plist .x:active{background:var(--bad-soft);color:var(--bad)}

/* ---------- Bank ---------- */
.bankbar{display:grid;gap:8px;margin-bottom:10px}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist .tg{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;margin-top:6px}
.qlist .tg.T{background:var(--truth-soft);color:var(--truth)} .qlist .tg.D{background:var(--dare-soft);color:var(--dare)}
.qlist .tx{flex:1;min-width:0;padding-top:4px}
.qlist .tx .q{font-weight:700;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.qlist .tx .m{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.qlist li.off .q{opacity:.45;text-decoration:line-through}
.qlist .acts{display:flex;flex:none}
.qlist .acts button{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.qlist .acts button:active{background:var(--surface-2)}
.qlist .acts button.on{color:var(--good)}
.tagc{font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;background:var(--surface-2);color:var(--ink-2)}
.tagc.mine{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--warn)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.counts div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.counts b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.counts span{font-size:12px;color:var(--ink-3);font-weight:700}

/* ---------- Stats ---------- */
.pstats{display:grid;gap:8px}
.ps{border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface-2)}
.ps .hd{display:flex;align-items:center;gap:8px}
.ps .hd b{font-size:16px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .hd .cnt{font-size:12px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.ps .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:5px 0 4px}
.ps .bar .t{background:var(--truth)} .ps .bar .d{background:var(--dare)}
.ps .nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);font-weight:700}
.ps .nums .t{color:var(--truth)} .ps .nums .d{color:var(--dare)}
.award{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--warn);white-space:nowrap}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.log li:first-child{border-top:0}
.log .r{flex:none;font-size:11px;color:var(--ink-3);font-weight:800;width:30px;padding-top:3px}
.log .b{flex:1;min-width:0}
.log .b .h{font-weight:800}
.log .b .q{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.res{font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;margin-left:4px}
.res.done{background:var(--good-soft);color:var(--good)} .res.quit{background:var(--bad-soft);color:var(--bad)} .res.skip{background:var(--surface-2);color:var(--ink-3)}

/* ---------- Toast & modal ---------- */
.toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%, -20px);opacity:0;z-index:30;max-width:min(92vw,520px);width:max-content;background:var(--ink);color:var(--bg);border-radius:14px;padding:4px 4px 4px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);font-weight:700;font-size:14px;transition:opacity .2s, transform .25s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .msg{padding:8px 0;min-width:0}
.toast button{min-height:44px;min-width:64px;border:0;border-radius:10px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--gold);font-weight:900;cursor:pointer;padding:0 12px}
.toast.nobtn{padding-right:14px}
.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:10px;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:calc(100% - 10px);overflow:auto;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.2,1.1,.4,1)}
.sheet h3{margin:0 0 10px;font-size:18px;font-weight:900}
.sheet .actions{display:flex;gap:8px;margin-top:14px}
.sheet .actions .btn{flex:1}
.sheet label.fl{display:block;font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.08em;margin:10px 0 6px}
.sheet .fmt{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:10px;padding:8px 10px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
@media (min-height:560px) and (min-width:600px){ .modal{align-items:center} }
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25}

  // ---------- built-in bank: one question per line. ♥ = 感情／曖昧（闔家模式排除）. {某人} = 隨機一位其他玩家 ----------
  var RAW = {
T1: `你手機裡最常打開的 App 是哪一個？
你最近一次笑到停不下來是因為什麼？
如果可以馬上學會一種技能，你想學什麼？

逛夜市你一定會買的三樣東西是什麼？
如果中了威力彩頭獎，你第一件事做什麼？
你最不敢吃的食物是什麼？
你洗澡的時候會唱歌嗎？最常唱哪一首？
你最近一次熬夜是在做什麼？
你的手機桌布現在是什麼？為什麼選它？
你覺得自己最像哪一種動物？為什麼？
你最喜歡的卡通人物是誰？
你最常說的口頭禪是什麼？
你寧願一輩子不能喝珍奶，還是一輩子不能吃鹹酥雞？

$('export-btn').addEventListener('click', function () {
  var hid = Object.keys(hidden), any = custom.length || hid.length;
  var desc = !any ? '還沒有自訂題目或停用的題目。新增、匯入或停用題目後，就能在這裡備份。'
    : (custom.length ? '共 ' + custom.length + ' 題自訂題目' : '沒有自訂題目') + (hid.length ? '，以及 ' + hid.length + ' 題停用設定' : '') + '。「下載檔案」是完整備份，匯入就能還原' + (custom.length ? '；「複製文字」只含題目，方便傳給朋友。' : '。');
  openModal('<h3>匯出題庫</h3><p class="hint" style="margin-top:0">' + desc + '</p>' +
    (custom.length ? '<textarea id="e-text" readonly style="min-height:140px">' + esc(TD.exportText(custom)) + '</textarea>' : '') +
    '<div class="actions" style="flex-wrap:wrap"><button class="btn" type="button" id="e-close">關閉</button>' + (custom.length ? '<button class="btn" type="button" id="e-copy">複製文字</button>' : '') + (any ? '<button class="btn primary" type="button" id="e-json">下載檔案</button>' : '') + '</div>', function () {
    $('e-close').addEventListener('click', closeModal);
    if (custom.length) $('e-copy').addEventListener('click', function () { copyText($('e-text').value, '已複製 ' + custom.length + ' 題，可以貼給朋友'); });
    if (any) $('e-json').addEventListener('click', function () {
      try {
        var blob = new Blob([TD.exportJSON(custom, hid)], { type: 'application/json' }), a = document.createElement('a');
        var d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        a.href = URL.createObjectURL(blob); a.download = 'truth-dare-bank-' + stamp + '.json'; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('已下載題庫檔');
      } catch (e) { toast('這個瀏覽器不能下載，請改用「複製文字」'); }
    });
  });
});
function copyText(t, msg) {
  function fallback() { try { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); toast(ok ? msg : '複製失敗，請長按文字手動複製'); } catch (e) { toast('複製失敗，請長按文字手動複製'); } }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { toast(msg); }, fallback); return; } } catch (e) {}
  fallback();
}

/* ---------- stats view ---------- */
function renderStats() {
  var box = $('pstats'), aw = TD.awards(players, G.stats), any = G.log.length > 0;
  var played = G.log.filter(function (l) { return l.res !== 'skip'; }).length;
  $('st-meta').textContent = '已玩 ' + played + ' 回合';
  box.innerHTML = '';
  var rows = players.map(function (p, i) { return { p: p, i: i, s: G.stats[p.id] || TD.emptyStat() }; });
  rows.sort(function (a, b) { return (b.s.done - a.s.done) || (b.s.picked - a.s.picked) || (a.i - b.i); });
  rows.forEach(function (r) {
    var s = r.s, tot = s.T + s.D, div = document.createElement('div'); div.className = 'ps';
    div.innerHTML = '<div class="hd"><span class="dot" style="width:12px;height:12px;border-radius:50%;flex:none;background:' + colorFor(r.i, players.length) + '"></span><b>' + esc(r.p.name) + '</b>' + (aw[r.p.id] || []).map(function (a) { return '<span class="award">' + a + '</span>'; }).join('') + '<span class="cnt num">被選中 ' + s.picked + ' 次</span></div>' +
      '<div class="bar" aria-hidden="true">' + (tot ? '<span class="t" style="width:' + (s.T / tot * 100) + '%"></span><span class="d" style="width:' + (s.D / tot * 100) + '%"></span>' : '') + '</div>' +
      '<div class="nums num"><span class="t">真心話 ' + s.T + '</span><span class="d">大冒險 ' + s.D + '</span><span>完成 ' + s.done + '</span><span>換題 ' + s.skip + '</span><span>放棄 ' + s.quit + '</span></div>';
    box.appendChild(div);
  });
  var ul = $('log'); ul.innerHTML = '';
  $('log-meta').textContent = any ? '最新的在上面' : '';
  if (!any) { ul.innerHTML = '<li class="empty" style="display:block"><b>還沒有紀錄</b>回到「遊戲」轉一下，第一回合就從現在開始。</li>'; return; }
  var RES = { done: '完成', quit: '放棄', skip: '換題' };
  G.log.slice(-120).reverse().forEach(function (l) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="r num">#' + l.round + '</span><div class="b"><div class="h">' + esc(l.name) + ' · <span style="color:var(--' + (l.t === 'T' ? 'truth' : 'dare') + ')">' + TD.TYPE_NAME[l.t] + '</span><span class="res ' + l.res + '">' + RES[l.res] + '</span></div><div class="q">' + esc(l.q) + '</div></div>';
    ul.appendChild(li);
  });
}
$('copy-stats').addEventListener('click', function () {
  var lines = ['真心話大冒險 戰績（' + G.log.filter(function (l) { return l.res !== 'skip'; }).length + ' 回合）'];
  players.forEach(function (p) { var s = G.stats[p.id] || TD.emptyStat(); lines.push(p.name + '：被選中 ' + s.picked + '、真心話 ' + s.T + '、大冒險 ' + s.D + '、完成 ' + s.done + '、換題 ' + s.skip + '、放棄 ' + s.quit); });
  copyText(lines.join('\n'), '已複製戰績');
});

/* ---------- boot ---------- */
applyTheme(); renderSnd();
if (G.phase === 'choose' && G.cur) hi = players.findIndex(function (p) { return p.id === G.cur.pid; });
renderGame();
if (G.phase === 'card') showCard(false);
fit();
setTimeout(fit, 60);
window.__td = { get G() { return G; }, get players() { return players; }, get S() { return S; }, get custom() { return custom; }, get hidden() { return hidden; }, TD: TD, finishSpinNow: finishSpinNow, get spinning() { return spinning; }, get guarded() { return isGuarded(); }, fit: fit };
})();
</script>
