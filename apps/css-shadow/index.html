<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>陰影與圓角</title>
<style>
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f4f5f7; --ink:#14171c; --ink-2:#3a4048; --muted:#5f6670; --line:#d3d7dd; --line-2:#e3e6ea;
  --acc:#24375a; --acc-ink:#ffffff; --lamp:#f0a400; --lamp-ring:#7a5200; --danger:#b3261e; --warn-bg:#fff4d6; --warn-ink:#6b4d00;
  --chk-a:#ffffff; --chk-b:#dfe2e6; --code:#f7f8fa; --toast:#14171c; --toast-ink:#fff;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1a1d21; --surface-2:#22262b; --ink:#e9ebee; --ink-2:#c3c8cf; --muted:#99a0a9; --line:#343941; --line-2:#272b31;
  --acc:#a9c1ec; --acc-ink:#0f1520; --lamp:#ffc233; --lamp-ring:#ffe39a; --danger:#ff8a80; --warn-bg:#3a2f12; --warn-ink:#ffe08a;
  --chk-a:#2a2d31; --chk-b:#1f2225; --code:#16181b; --toast:#e9ebee; --toast-ink:#121417; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --surface-2:#22262b; --ink:#e9ebee; --ink-2:#c3c8cf; --muted:#99a0a9; --line:#343941; --line-2:#272b31;
  --acc:#a9c1ec; --acc-ink:#0f1520; --lamp:#ffc233; --lamp-ring:#ffe39a; --danger:#ff8a80; --warn-bg:#3a2f12; --warn-ink:#ffe08a;
  --chk-a:#2a2d31; --chk-b:#1f2225; --code:#16181b; --toast:#e9ebee; --toast-ink:#121417; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap}
header h1{flex:1;min-width:0;margin:0;font-size:18px;font-weight:750;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
header h1 .mark{width:20px;height:20px;border-radius:5px;background:var(--surface);box-shadow:3px 3px 0 var(--ink-2);border:1.5px solid var(--ink);flex:none}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.solid{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:650}
.btn svg{width:18px;height:18px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;min-width:44px;padding:0 12px;border:0;background:transparent;cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:650}
#modeSeg{width:100%}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:6px}
.stagecol{min-width:0}
.stage{position:relative;height:40vh;min-height:280px;max-height:520px;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.checker{background-color:var(--chk-a);background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.stage.cover{background-size:cover;background-position:center}
#box{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;display:grid;place-items:center;font-weight:700;font-size:20px;letter-spacing:.04em;transition:none;z-index:1}
#box span{pointer-events:none;opacity:.8}
#lamp{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:transparent;cursor:grab;touch-action:none;display:grid;place-items:center;z-index:3}
#lamp::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--lamp-ring),0 0 18px 6px color-mix(in srgb,var(--lamp) 45%,transparent)}
#lampLine{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.rh{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:transparent;cursor:grab;touch-action:none;display:grid;place-items:center;z-index:3}
.rh::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.stagebar .seg button{padding:0 10px;font-size:13.5px}
.tag{position:absolute;left:8px;top:8px;font-size:12px;padding:3px 8px;border-radius:4px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);z-index:4;pointer-events:none}
.stagenote{position:absolute;left:8px;right:8px;bottom:8px;font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);z-index:4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel+.panel{margin-top:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.ph h2{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0;font-weight:700}
.layers{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 4px 0 0;background:var(--surface-2)}
.lrow[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.lrow .pick{flex:1;min-width:0;min-height:44px;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.lrow .pick b{font-family:var(--sans);font-size:13px;color:var(--ink);flex:none}
.lrow .pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sw{width:18px;height:18px;border-radius:3px;flex:none;border:1px solid var(--line);position:relative;overflow:hidden;background-color:var(--chk-a);background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.lrow .sw i{position:absolute;inset:0}
.lrow.faded .pick{opacity:.45}
.lrow.off .pick span{text-decoration:line-through}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2);font-size:12px;font-weight:700}
.ib svg{width:18px;height:18px}
.ib[aria-pressed="true"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ctl{display:grid;grid-template-columns:3.6em 44px minmax(0,1fr) 44px 3.4em;align-items:center;gap:2px 4px;margin-top:4px}
.ctl label{font-size:13.5px;color:var(--ink-2)}
.ctl output{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ctl .pm{min-width:44px;min-height:44px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2);user-select:none;-webkit-user-select:none;touch-action:none}
input[type=range]{width:100%;min-width:0;height:44px;margin:0;accent-color:var(--acc);cursor:pointer;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row>label{font-size:13.5px;color:var(--ink-2)}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--surface);cursor:pointer}
input[type=text],textarea,select{min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 10px;font-size:15px;min-width:0}
textarea{padding:8px 10px;font-family:var(--mono);font-size:13.5px;width:100%;resize:vertical;min-height:64px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.small{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.warn{font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:6px 10px;margin:8px 0 0}
.errlist{margin:8px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:12.5px}
.errlist li{padding:4px 8px;border-radius:4px;margin-top:4px;border-left:3px solid var(--acc);background:var(--surface-2);overflow-wrap:anywhere}
.errlist li.bad{border-left-color:var(--danger);color:var(--danger)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pre{min-height:76px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 4px;font-size:12.5px;color:var(--ink-2);position:relative}
.pre i{width:30px;height:30px;display:block;background:var(--surface)}
.mine .pre .x{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;color:var(--danger);font-size:18px;cursor:pointer;display:none}
.mine.editing .pre .x{display:block}
pre.code{margin:0;background:var(--code);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.radgrid{display:grid;grid-template-columns:1fr;gap:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
@media (hover:hover){.btn:hover,.pre:hover{border-color:var(--ink-2)} .ib:hover{background:var(--surface-2)} .seg button:not([aria-pressed="true"]):hover{background:var(--surface-2)}}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
  .stagecol{position:sticky;top:8px}
  .stage{height:62vh;max-height:640px}
}
@media (min-width:640px){ #modeSeg{width:auto;min-width:300px} header h1{flex:1 1 auto} #themeBtn{order:3} }
@media (min-width:640px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .stagecol{position:sticky;top:8px}
}
@media (max-height:500px) and (orientation:landscape){ .stage{height:calc(100vh - 150px);min-height:200px} header{min-height:48px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1><span class="mark" aria-hidden="true"></span>陰影與圓角產生器</h1>
  <button class="btn" type="button" id="themeBtn" aria-label="切換主題"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/></svg></button>
  <div class="seg" id="modeSeg" role="group" aria-label="模式">
    <button type="button" id="mShadow" data-mode="shadow">陰影</button>
    <button type="button" id="mRadius" data-mode="radius">圓角</button>
    <button type="button" id="mGlass" data-mode="glass">玻璃</button>
  </div>
</header>

<div class="layout">
  <div class="stagecol">
    <div class="stage" id="stage">
      <span class="tag" id="sampleTag">範例設定</span>
      <svg id="lampLine" aria-hidden="true"><line id="lampL" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/></svg>
      <div id="box"><span id="boxText">Card</span></div>
      <button type="button" id="lamp" aria-label="光源：拖曳改變陰影方向"></button>
      <button type="button" class="rh" id="rh0" aria-label="左上圓角把手"></button>
      <button type="button" class="rh" id="rh1" aria-label="右上圓角把手"></button>
      <button type="button" class="rh" id="rh2" aria-label="右下圓角把手"></button>
      <button type="button" class="rh" id="rh3" aria-label="左下圓角把手"></button>
      <div class="stagenote" id="stageNote" hidden></div>
    </div>
    <div class="stagebar">
      <div class="seg" id="bgSeg" role="group" aria-label="舞台背景">
        <button type="button" id="bgSolid" data-bg="solid">純色</button>
        <button type="button" id="bgChecker" data-bg="checker">棋盤</button>
        <button type="button" id="bgGrad" data-bg="gradient">漸層</button>
        <button type="button" id="bgPhoto" data-bg="photo">照片</button>
      </div>
      <input type="color" id="bgColor" aria-label="舞台背景色" value="#e8ebef">
      <button class="btn" type="button" id="bgFileBtn">本機照片</button>
      <input type="file" id="bgFile" accept="image/*" hidden>
      <label class="chk"><input type="checkbox" id="showText" checked>文字</label>
    </div>
    <p class="small">拖動黃色光源改變陰影方向；雙擊方塊重設為預設值。</p>
  </div>

  <div class="ctrlcol">
    <!-- shadow -->
    <section class="panel" id="pShadow">
      <div class="ph"><h2>陰影層</h2><button class="btn" type="button" id="addLayer">＋ 新增一層</button></div>
      <div class="layers" id="layers"></div>
      <div id="layerCtl"></div>
      <div class="row">
        <label for="lColor">顏色</label><input type="color" id="lColor">
        <label class="chk"><input type="checkbox" id="lInset">inset（內陰影）</label>
      </div>
      <div class="row"><label for="boxBg">方塊顏色</label><input type="color" id="boxBg"></div>
      <details style="margin-top:10px">
        <summary class="chk" style="font-weight:600">匯入 box-shadow 字串</summary>
        <textarea id="importTxt" rows="3" spellcheck="false" placeholder="0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24)">0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24)</textarea>
        <div class="row"><button class="btn solid" type="button" id="importBtn">解析並套用</button></div>
        <ul class="errlist" id="importRes"></ul>
      </details>
    </section>

    <!-- radius -->
    <section class="panel" id="pRadius" hidden>
      <div class="ph"><h2>圓角</h2>
        <div class="seg" id="unitSeg" role="group" aria-label="單位"><button type="button" id="uPx" data-u="px">px</button><button type="button" id="uPct" data-u="%">%</button></div>
      </div>
      <div class="row" style="margin-top:0">
        <label class="chk"><input type="checkbox" id="rLinked" checked>四角連動</label>
        <label class="chk"><input type="checkbox" id="rAdv">橢圓（8 值）</label>
      </div>
      <div id="radCtl"></div>
      <div class="row">
        <input type="text" id="radTxt" spellcheck="false" style="flex:1;font-family:var(--mono)" aria-label="貼上 border-radius 值" placeholder="30% 70% 70% 30% / 30% 30% 70% 70%">
        <button class="btn" type="button" id="radApply">套用</button>
      </div>
      <p class="small">可貼上 border-radius 的值回填滑桿；方塊四角的藍色把手可直接拖曳。</p>
    </section>

    <!-- glass -->
    <section class="panel" id="pGlass" hidden>
      <div class="ph"><h2>玻璃擬態</h2></div>
      <div id="glassCtl"></div>
      <div class="row"><label for="gColor">玻璃顏色</label><input type="color" id="gColor" value="#ffffff"></div>
      <p class="warn" id="noBackdrop" hidden>這個瀏覽器不支援 backdrop-filter，預覽以半透明背景近似，實際效果請在支援的瀏覽器確認。</p>
    </section>

    <section class="panel">
      <div class="ph"><h2>預設風格</h2></div>
      <div class="presets" id="presets"></div>
      <div class="ph" style="margin-top:14px"><h2>我的樣式</h2>
        <div class="row" style="margin:0"><button class="btn" type="button" id="saveMine">存成我的樣式</button><button class="btn" type="button" id="editMine" aria-pressed="false">管理</button></div>
      </div>
      <div class="presets mine" id="mine"></div>
      <p class="small" id="mineEmpty">尚未儲存。最多可存 30 個（包含陰影、圓角、玻璃三種設定）。</p>
    </section>

    <section class="panel">
      <div class="ph"><h2>輸出 CSS</h2><button class="btn solid" type="button" id="copyBtn">複製</button></div>
      <pre class="code" id="cssOut" tabindex="0"></pre>
      <div class="row">
        <label class="chk"><input type="checkbox" id="optPrefix">含 -webkit- 前綴</label>
        <label class="chk"><input type="checkbox" id="optTw">輸出成 Tailwind 任意值</label>
      </div>
    </section>
  </div>
</div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='css-shadow:v1:';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));return true;}catch(e){return false;}}};
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200);}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const BOX=160;

/* ---------- color helpers ---------- */
const probe=document.createElement('canvas').getContext('2d');
function parseColor(str){
  probe.fillStyle='#010203'; probe.fillStyle=str; const a=probe.fillStyle;
  probe.fillStyle='#030201'; probe.fillStyle=str; const b=probe.fillStyle;
  if(a!==b) return null; // invalid
  if(a[0]==='#') return {r:parseInt(a.slice(1,3),16),g:parseInt(a.slice(3,5),16),b:parseInt(a.slice(5,7),16),a:1};
  const m=a.match(/rgba?\(([^)]+)\)/); if(!m) return null; const p=m[1].split(',').map(Number);
  return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1};
}
const hex2=n=>Math.round(n).toString(16).padStart(2,'0');
const toHex=c=>'#'+hex2(c.r)+hex2(c.g)+hex2(c.b);
const fmtA=a=>String(Math.round(a*1000)/1000);
function colorStr(c,tw){ if(c.a>=1) return toHex(c); return tw?`rgba(${c.r},${c.g},${c.b},${fmtA(c.a)})`:`rgba(${c.r}, ${c.g}, ${c.b}, ${fmtA(c.a)})`; }
function rgb2hsl(c){const r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return {h,s:s*100,l:l*100};}
function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return {r:Math.round(f(0)*255),g:Math.round(f(8)*255),b:Math.round(f(4)*255),a:1};}

/* ---------- state ---------- */
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
function defaults(){

    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); el.style.cursor=''; };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); });
}
dragify($('#lamp'),applyLamp);
$('#lamp').addEventListener('keydown',e=>{ const fo=firstOuter(); if(fo<0) return; const st=$('#stage'),W=st.clientWidth,H=st.clientHeight,l=S.layers[fo];
  let x=W/2-l.x/0.15,y=H/2-l.y/0.15; const d=e.shiftKey?40:10; if(e.key==='ArrowLeft') x-=d; else if(e.key==='ArrowRight') x+=d; else if(e.key==='ArrowUp') y-=d; else if(e.key==='ArrowDown') y+=d; else return; e.preventDefault(); applyLamp({x,y,W,H}); render(); });
for(let i=0;i<4;i++) dragify($('#rh'+i),p=>{ const R=S.radius, cx=p.W/2, cy=p.H/2, ox=i===0||i===3?cx-80:cx+80, oy=i<2?cy-80:cy+80;
  const dx=clamp(Math.abs(p.x-ox),0,BOX/2), dy=clamp(Math.abs(p.y-oy),0,BOX/2), inside=(i===0||i===3?p.x>=ox:p.x<=ox)||(i<2?p.y>=oy:p.y<=oy);
  let h=inside?Math.round(dx):0, v=inside?Math.round(dy):0; if(!R.adv){ const m=Math.round((h+v)/2); h=v=m; }
  if(R.linked){ R.h=[h,h,h,h]; R.v=R.adv?[v,v,v,v]:[h,h,h,h]; } else { R.h[i]=h; R.v[i]=R.adv?v:h; } });

/* ---------- import ---------- */
function splitTop(s,ch){ const out=[]; let d=0,b=''; for(const c of s){ if(c==='(') d++; else if(c===')') d--; if(c===ch&&d===0){ out.push(b); b=''; } else b+=c; } out.push(b); return out.map(x=>x.trim()).filter(x=>x.length); }
function parseLayer(str){
  const toks=[]; { let d=0,b=''; for(const c of str.trim()){ if(c==='(') d++; else if(c===')') d--; if(/\s/.test(c)&&d===0){ if(b) toks.push(b); b=''; } else b+=c; } if(b) toks.push(b); }
  let inset=false, nums=[], color=null;
  for(const t of toks){
    if(t.toLowerCase()==='inset'){ if(inset) return null; inset=true; continue; }
    const m=t.match(/^(-?\d*\.?\d+)(px|rem|em)?$/i);
    if(m){ if(color&&nums.length&&nums.length<2) return null; const n=+m[1]; if(n!==0&&!m[2]) return null; const u=(m[2]||'px').toLowerCase(); nums.push(u==='px'?n:n*16); continue; }
    if(color) return null; color=parseColor(t); if(!color) return null;
  }
  if(nums.length<2||nums.length>4) return null; if(nums[2]!=null&&nums[2]<0) return null;
  return {x:nums[0],y:nums[1],blur:Math.max(0,nums[2]||0),spread:nums[3]||0,color:color||{r:0,g:0,b:0,a:1},inset,visible:true};
}
function importShadow(str){
  str=String(str).replace(/^\s*box-shadow\s*:/i,'').replace(/;\s*$/,'').trim();
  const parts=splitTop(str,','); const res=parts.map(p=>({src:p,layer:parseLayer(p)}));
  return res;
}
$('#importBtn').onclick=()=>{
  const res=importShadow($('#importTxt').value), host=$('#importRes'); host.innerHTML='';
  if(!res.length){ toast('請先貼上 box-shadow 字串'); return; }
  res.forEach((r,i)=>{ const li=document.createElement('li'); li.className=r.layer?'':'bad'; li.textContent=(r.layer?`第 ${i+1} 層 ✓ `:`第 ${i+1} 層無法解析：`)+r.src; host.appendChild(li); });
  const ok=res.filter(r=>r.layer).map(r=>r.layer).slice(0,6);
  if(ok.length){ S.layers=ok; S.sel=0; S.neuWarn=''; render(); toast(`已匯入 ${ok.length} 層`+(res.length>ok.length?`，${res.length-ok.length} 層失敗`:'')+(res.filter(r=>r.layer).length>6?'（只保留前 6 層）':'')); }
  else toast('沒有可解析的層');
};

/* ---------- presets ---------- */
const C=(r,g,b,a)=>({r,g,b,a});
const L=(x,y,blur,spread,c,inset)=>({x,y,blur,spread,color:c,inset:!!inset,visible:true});
function neumorph(){
  if(S.bg.type!=='solid') S.bg.type='solid';
  const c=parseColor(S.bg.color)||C(232,235,239,1), h=rgb2hsl(c);
  const lt=hsl2rgb(h.h,h.s,Math.min(100,h.l+12)), dk=hsl2rgb(h.h,h.s,Math.max(0,h.l-12));
  S.boxBg=S.bg.color; S.neuWarn=h.l<15?'背景色太深（亮度 < 15%），Neumorphism 效果不明顯。':h.l>95?'背景色太淺（亮度 > 95%），Neumorphism 效果不明顯。':'';
  return [L(-8,-8,16,0,lt),L(8,8,16,0,dk)];
}
function material(n){ return [L(0,n*2,n*4,0,C(0,0,0,.14)),L(0,n,n*2,0,C(0,0,0,.12))]; }
const PRESETS=[
  ['柔和',()=>[L(0,10,30,-12,C(0,0,0,.25))]],
  ['懸浮',()=>[L(0,20,25,-5,C(0,0,0,.1)),L(0,8,10,-6,C(0,0,0,.1))]],
  ['分層柔和',()=>[L(0,1,2,0,C(0,0,0,.12)),L(0,2,4,0,C(0,0,0,.06)),L(0,4,8,0,C(0,0,0,.04)),L(0,8,16,0,C(0,0,0,.03))]],
  ['Neumorphism',neumorph],
  ['Material 1',()=>material(1)],['Material 2',()=>material(2)],['Material 3',()=>material(3)],['Material 4',()=>material(4)],['Material 5',()=>material(5)],
  ['內凹',()=>[L(0,2,6,0,C(0,0,0,.28),1),L(0,-1,0,0,C(255,255,255,.5),1)]],
  ['銳利投影',()=>[L(6,6,0,0,C(20,23,28,1))]],
  ['外光暈',()=>[L(0,0,0,4,C(59,130,246,.35)),L(0,0,24,0,C(59,130,246,.45))]],
];
const scaleShadow=(layers,k)=>layers.filter(l=>l.visible).map(l=>layerStr({...l,x:l.x*k,y:l.y*k,blur:l.blur*k,spread:l.spread*k})).join(', ')||'none';
PRESETS.forEach(([name,fn],i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='pre'; b.id='preset'+i;
  const sample=name==='Neumorphism'?[L(-3,-3,6,0,C(255,255,255,1)),L(3,3,6,0,C(0,0,0,.18))]:fn();
  b.innerHTML=`<i style="box-shadow:${scaleShadow(sample,.45)};border-radius:6px${name==='Neumorphism'?';background:var(--surface-2)':''}"></i>${name}`;
  b.onclick=()=>{ S.neuWarn=''; const ls=fn(); S.layers=ls; S.sel=0; if(S.mode!=='shadow'&&S.mode!=='glass') S.mode='shadow'; render(); toast('已套用「'+name+'」'); };
  $('#presets').appendChild(b);
});

/* ---------- my styles ---------- */
let mine=store.get('mine',[]); if(!Array.isArray(mine)) mine=[];
function renderMine(){
  const host=$('#mine'); host.innerHTML='';
  mine.forEach((m,i)=>{ const s=sanitize(m.s); const b=document.createElement('div'); b.className='pre'; b.setAttribute('role','button'); b.tabIndex=0; b.id='mine'+i;
    const r=s.radius.h.map(v=>v*.2+'px').join(' ')+' / '+(s.radius.adv?s.radius.v:s.radius.h).map(v=>v*.2+'px').join(' ');
    b.innerHTML=`<i style="box-shadow:${scaleShadow(s.layers,.45)};border-radius:${r};background:${s.mode==='glass'?'linear-gradient(135deg,#ff7a59,#4a5bdc)':s.boxBg}"></i>${m.name}<button type="button" class="x" aria-label="刪除 ${m.name}">×</button>`;
    const load=()=>{ if($('#mine').classList.contains('editing')) return; const keepBg=S.bg; S=sanitize(JSON.parse(JSON.stringify(m.s))); S.bg=keepBg.type==='photo'&&localPhoto?keepBg:S.bg; render(); toast('已載入「'+m.name+'」'); };
    b.addEventListener('click',e=>{ if(e.target.classList.contains('x')){ mine.splice(i,1); store.set('mine',mine); renderMine(); toast('已刪除'); return; } load(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target===b) load(); });
    host.appendChild(b); });
  $('#mineEmpty').hidden=mine.length>0; $('#editMine').hidden=!mine.length;
  if(!mine.length){ host.classList.remove('editing'); $('#editMine').setAttribute('aria-pressed','false'); $('#editMine').textContent='管理'; }
}
$('#saveMine').onclick=()=>{ if(mine.length>=30){ toast('已達 30 個上限，請先刪除'); return; }
  let n=1; while(mine.some(m=>m.name==='樣式 '+n)) n++;
  const s=JSON.parse(JSON.stringify(S)); delete s.neuWarn; mine.push({name:'樣式 '+n,s}); if(!store.set('mine',mine)) toast('瀏覽器無法儲存，重新整理後會遺失'); else toast('已存成「樣式 '+n+'」'); renderMine(); };
$('#editMine').onclick=()=>{ const on=!$('#mine').classList.contains('editing'); $('#mine').classList.toggle('editing',on); $('#editMine').setAttribute('aria-pressed',on); $('#editMine').textContent=on?'完成':'管理'; };

/* ---------- copy ---------- */
$('#copyBtn').onclick=()=>{ const txt=cssText();
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents($('#cssOut')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('無法自動複製，已選取文字，請手動複製'); };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('已複製 CSS'),fallback); else fallback(); }catch(e){ fallback(); } };

/* ---------- theme ---------- */
const themes=['auto','light','dark'], tName={auto:'跟隨系統',light:'淺色',dark:'深色'}; let theme=store.get('theme','auto'); if(!themes.includes(theme)) theme='auto';
function applyTheme(){ if(theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',theme); $('#themeBtn').title='主題：'+tName[theme]; }
$('#themeBtn').onclick=()=>{ theme=themes[(themes.indexOf(theme)+1)%3]; store.set('theme',theme); applyTheme(); toast('主題：'+tName[theme]); };
applyTheme(); if(!saved) S=defaults();
$('#sampleTag').hidden=!!saved;
document.addEventListener('pointerdown',()=>{ $('#sampleTag').hidden=true; },{once:true});
addEventListener('resize',render);
renderMine(); draw();
window.__cs={get S(){return S;},set S(v){S=sanitize(v);render();},cssText,shadowStr,radiusStr,importShadow,parseRadius,draw,PRESETS};
})();
</script>
