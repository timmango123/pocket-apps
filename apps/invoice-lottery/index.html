<style id="mobile-shim">

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<meta name="description" content="統一發票對獎：輸入末 3 碼立即對獎，可貼上公告文字自動填入號碼，完全離線。">
<style>
:root{
  --bg:#efe7da; --bg-2:#e7ddcc; --surface:#fffdf8; --surface-2:#f6efe3; --ink:#2b2420; --ink-2:#5f554d; --ink-3:#83786e;
  --line:#e0d5c3; --line-strong:#c4b6a0;
  --accent:#c4322b; --accent-2:#a8261f; --accent-ink:#ffffff; --accent-soft:#f9e0dc;
  --gold:#9a620e; --gold-soft:#fbecc9; --win:#17754a; --win-soft:#dcf0e3; --miss:#6f655c;
  --focus:#1c5fd1; --scrim:rgba(30,22,16,.5);
  --shadow:0 1px 0 rgba(40,28,16,.05), 0 10px 24px -16px rgba(40,28,16,.45);
  --key-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 0 rgba(60,40,20,.10), 0 6px 14px -10px rgba(60,40,20,.35);
  --paper:repeating-linear-gradient(0deg, transparent 0 23px, rgba(160,130,90,.07) 23px 24px);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15110d; --bg-2:#1b1611; --surface:#221c16; --surface-2:#2b241d; --ink:#f3ebde; --ink-2:#c6b9aa; --ink-3:#998c7e;
    --line:#3a322a; --line-strong:#574c40;
    --accent:#ff7468; --accent-2:#ff8f84; --accent-ink:#2a0c09; --accent-soft:#4a221e;
    --gold:#f2c15c; --gold-soft:#3d2e12; --win:#5fd6a5; --win-soft:#163a2a; --miss:#a39787;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
    --key-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 0 rgba(0,0,0,.35), 0 6px 14px -10px rgba(0,0,0,.6);
    --paper:repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,240,220,.03) 23px 24px);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15110d; --bg-2:#1b1611; --surface:#221c16; --surface-2:#2b241d; --ink:#f3ebde; --ink-2:#c6b9aa; --ink-3:#998c7e;
  --line:#3a322a; --line-strong:#574c40;
  --accent:#ff7468; --accent-2:#ff8f84; --accent-ink:#2a0c09; --accent-soft:#4a221e;
  --gold:#f2c15c; --gold-soft:#3d2e12; --win:#5fd6a5; --win-soft:#163a2a; --miss:#a39787;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
  --key-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 0 rgba(0,0,0,.35), 0 6px 14px -10px rgba(0,0,0,.6);
  --paper:repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,240,220,.03) 23px 24px);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(120% 60% at 50% 0%, var(--bg-2), transparent 70%) no-repeat;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 16px;padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:8px 0 6px;flex:none;padding-top:max(8px, env(safe-area-inset-top))}
.mark{flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 14px -8px var(--accent)}
.mark svg{width:26px;height:26px}
.psel{flex:1;min-width:0;position:relative}
.psel label{position:absolute;left:12px;top:4px;font-size:10.5px;color:var(--ink-3);letter-spacing:.12em;pointer-events:none}
.psel select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:15px 30px 2px 11px;font-weight:800;font-size:15px;appearance:none;-webkit-appearance:none;text-overflow:ellipsis;cursor:pointer;box-shadow:var(--shadow)}
.psel::after{content:"";position:absolute;right:13px;top:18px;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);pointer-events:none}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow);transition:transform .12s var(--ease)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="false"]{color:var(--ink-3)}

/* tabs */
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none;margin-bottom:8px}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:9px;background:var(--ink);transition:transform .28s var(--ease);box-shadow:0 4px 10px -6px rgba(0,0,0,.5)}
.tabs button{position:relative;z-index:1;min-height:40px;border:0;background:transparent;cursor:pointer;font-weight:800;color:var(--ink-2);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--bg)}
.tabs .cnt{font-family:var(--mono);font-size:11px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--surface);display:inline-grid;place-items:center}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view.enter{animation:fadein .22s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.check{display:flex;flex-direction:column;gap:8px;overflow:hidden;padding-bottom:calc(8px + env(safe-area-inset-bottom))}

/* sample banner */
.sample{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--gold);background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:7px 10px;line-height:1.4}
.sample svg{flex:none;width:16px;height:16px}
.sample b{font-weight:800}
.sample.inline{flex:none;padding:0 4px 0 10px;min-height:32px;font-size:12px;white-space:nowrap}
.sample.inline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sample.inline button{flex:none;border:0;background:transparent;color:var(--gold);font-weight:800;font-size:12px;min-height:32px;padding:0 8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ticket */
.ticket{flex:none;background:var(--surface) var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 12px 13px;position:relative;box-shadow:var(--shadow);overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);opacity:.85}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:7px;background:radial-gradient(circle at 6px 7px, var(--bg) 4px, transparent 4.5px) 0 0/12px 7px repeat-x}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;gap:2px 10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.tk-head #tkLabel{font-weight:700;color:var(--ink-2)}
.tally{color:var(--ink-3);white-space:nowrap}
.tally b{font-family:var(--mono);color:var(--ink);font-weight:800}
.tally .nd b{color:var(--gold)}
.tally .w b{color:var(--win)}
.slots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.slot{width:38px;height:50px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:29px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 3px rgba(60,40,20,.08);transition:background .2s,border-color .2s,color .2s,opacity .2s}
.slot.in{animation:digit .16s var(--ease)}
@keyframes digit{from{transform:translateY(-6px) scale(.9);opacity:.2}to{transform:none;opacity:1}}
.slot.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.cur::after{content:"";width:2px;height:55%;background:var(--accent);border-radius:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.slot.fixed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slot.dim{opacity:.5}
.slot.hit{background:var(--win-soft);border-color:var(--win);color:var(--win);opacity:1}
.slot.hit.top{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slots.wide .slot{width:31px;height:44px;font-size:24px;border-radius:7px}
.slots .gap{width:5px;align-self:center;height:2px;background:var(--line-strong);border-radius:1px}
.slots.shake{animation:shake .32s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:none}}

/* result */
.result{flex:none;border-radius:14px;padding:8px 12px;min-height:62px;display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface-2);transition:background .2s,border-color .2s}
.seal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-3);border:1.5px solid var(--line-strong)}
.seal svg{width:22px;height:22px}
.seal.txt{font-weight:900;font-size:17px;letter-spacing:0;font-family:var(--sans)}
.result .rt{flex:1;min-width:0}
.result .big{font-size:19px;font-weight:800;line-height:1.25;display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap}
.result .sub{font-size:12.5px;color:var(--ink-2);margin-top:1px;line-height:1.4}
.result .big + .sub{margin-top:2px}
.result .sub .num{white-space:nowrap}
.result .sub em{font-style:normal;font-weight:800;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.result .sub .warn{color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--mono);font-weight:800;font-size:13px;padding:1px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.result .amt{font-family:var(--mono);font-size:21px;font-weight:800;white-space:nowrap;margin-left:auto}
.result .act{flex:none;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:800;font-size:13px}
.result .act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.result.idle .big{font-size:15px;color:var(--ink-2)}
.result.miss{background:var(--surface);border-color:var(--line-strong)}
.result.miss .big{color:var(--miss)}
.result.maybe{background:var(--gold-soft);border-color:var(--gold)}
.result.maybe .big{color:var(--gold)}
.result.maybe .seal{color:var(--gold);border-color:var(--gold);background:var(--surface)}
.result.empty{background:var(--accent-soft);border-color:var(--accent)}
.result.empty .big{color:var(--accent)}
.result.empty .seal{color:var(--accent);border-color:var(--accent)}
.result.win{background:var(--win-soft);border-color:var(--win)}
.result.win .big,.result.win .amt{color:var(--win)}
.result.win .seal{background:var(--win);border-color:var(--win);color:var(--surface)}
.result.win.top{background:var(--accent-soft);border-color:var(--accent)}
.result.win.top .big,.result.win.top .amt{color:var(--accent)}
.result.win.top .seal{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.result.pop{animation:pop .32s var(--ease)}
.result.win .seal,.result.maybe .seal{animation:stamp .42s var(--ease)}
@keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.015)}100%{transform:none}}
@keyframes stamp{0%{transform:scale(2.1) rotate(-25deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:rotate(-8deg)}}

/* keypad */
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(44px,96px));gap:8px;align-content:end}
.pad button{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:27px;font-weight:700;cursor:pointer;box-shadow:var(--key-shadow);-webkit-touch-callout:none;transition:transform .08s,background .12s;display:grid;place-items:center}
.pad button.down,.pad button:active{background:var(--surface-2);transform:translateY(1px) scale(.97);box-shadow:none}
.pad button.fn{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--ink-2);background:var(--surface-2)}
.pad button.fn svg{width:26px;height:26px}
.pad button.fn.clr{color:var(--accent)}

/* nums view */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:.01em}
.badge{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.04em}
.badge.open{background:var(--win-soft);color:var(--win)}
.badge.closed{background:var(--surface-2);color:var(--ink-3)}
.badge.pending,.badge.wait{background:var(--accent-soft);color:var(--accent)}
.dates{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--ink-2);margin:8px 0 4px}
.dates dt{color:var(--ink-3)} .dates dd{margin:0;font-family:var(--mono);font-weight:700;color:var(--ink)}
.countdown{font-size:13px;font-weight:700;color:var(--win);margin:0 0 8px}
.countdown.warn{color:var(--accent)} .countdown.mute{color:var(--ink-3)}
.ngrid{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:6px}
.nrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .k{font-size:13px;font-weight:800;color:var(--ink-2)}
.nrow .k small{display:block;font-weight:600;color:var(--ink-3);font-size:11px}
.nrow .v{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 14px}
.nrow .v em{font-style:normal;color:var(--accent)}
.nrow .v .none{color:var(--ink-3);font-weight:600;font-size:14px;letter-spacing:0;font-family:var(--sans)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:44px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:800;padding:0 14px;cursor:pointer;flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -9px var(--accent)}
.btn.danger{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn.icon{flex:0 0 44px;width:44px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nextdraw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:2px 2px 10px}
.nextdraw svg{width:16px;height:16px;color:var(--ink-3)}
.nextdraw b{font-family:var(--mono);color:var(--ink)}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.rules summary{min-height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;cursor:pointer;list-style:none;color:var(--ink-2)}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s}
details.rules[open] summary::after{transform:rotate(-135deg)}
.rtable{width:calc(100% - 28px);margin:0 14px 6px;border-collapse:collapse;font-size:13px}
.rtable td{padding:6px 0;border-top:1px dashed var(--line)}
.rtable td:last-child{text-align:right;font-family:var(--mono);font-weight:800}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:4px 14px 12px}

/* history */
.stats{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px;text-align:center;box-shadow:var(--shadow)}
.stat small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.win b{color:var(--win)}
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px;min-height:48px}
.hrow.w{border-color:var(--win);background:linear-gradient(90deg,var(--win-soft),var(--surface) 70%)}
.hrow.pend{border-color:var(--gold);border-style:dashed}
.hrow .n{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.04em;flex:1;min-width:0;color:var(--ink-3);white-space:nowrap}
.hrow .n em{font-style:normal;color:var(--ink)}
.hrow .p{font-weight:800;font-size:13px;white-space:nowrap;text-align:right}
.hrow .p small{display:block;font-size:11px;font-weight:600;color:var(--ink-3)}
.hrow .p.win{color:var(--win)} .hrow .p.miss{color:var(--ink-3)} .hrow .p.maybe{color:var(--gold)}
.hrow .resume{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:13px;min-height:36px;border-radius:9px;padding:0 10px;cursor:pointer;margin:4px 0;white-space:nowrap}
.hrow .del{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--ink-3);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.hrow .del svg{width:16px;height:16px}
.hrow.out{animation:out .2s var(--ease) forwards}
@keyframes out{to{opacity:0;transform:translateX(30px)}}
.empty{border:1.5px dashed var(--line-strong);border-radius:14px;padding:26px 16px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.6}
.empty svg{width:44px;height:44px;margin:0 auto 8px;color:var(--line-strong)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .26s var(--ease);overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.field{margin-bottom:10px}
.field label,.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:4px}
.field label .c{font-family:var(--mono);font-weight:700;color:var(--ink-3);font-size:12px}

<script>
/*CORE-START*/
const IL = (() => {
  const TIERS = [
    ['special', '特別獎', 10000000], ['grand', '特獎', 2000000], ['first', '頭獎', 200000],
    ['second', '二獎', 40000], ['third', '三獎', 10000], ['fourth', '四獎', 4000],
    ['fifth', '五獎', 1000], ['sixth', '六獎', 200], ['extra', '增開六獎', 200]];
  const TIER = {}; TIERS.forEach(([key, name, amt], rank) => { TIER[key] = { key, name, amt, rank }; });
  const BY_LEN = { 8: 'first', 7: 'second', 6: 'third', 5: 'fourth', 4: 'fifth', 3: 'sixth' };
  const d8 = s => typeof s === 'string' && /^\d{8}$/.test(s);
  const d3 = s => typeof s === 'string' && /^\d{3}$/.test(s);
  // Full-width digits (０-９) count as digits everywhere.
  const half = s => String(s == null ? '' : s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const digits = s => half(s).replace(/\D/g, '');
  const START_MONTHS = [1, 3, 5, 7, 9, 11];

  // Normalise a period object; invalid numbers become '' (ignored while checking).
  function normPeriod(p) {
    p = p && typeof p === 'object' ? p : {};
    const year = Number.isInteger(+p.year) && +p.year >= 1900 && +p.year <= 2200 ? +p.year : 2026;
    const m = START_MONTHS.includes(+p.m) ? +p.m : 1;
    const n8 = s => { s = digits(s); return s.length === 8 ? s : ''; };
    const first = Array.isArray(p.first) ? p.first.slice(0, 3).map(n8) : [];
    while (first.length < 3) first.push('');
    const extra = Array.isArray(p.extra) ? p.extra.map(digits).filter(d3) : [];
    return { id: typeof p.id === 'string' ? p.id : year + '-' + m, year, m, special: n8(p.special), grand: n8(p.grand), first, extra: [...new Set(extra)], sample: !!p.sample };
  }
  const hasNumbers = p => !!(p.special || p.grand || p.first.some(Boolean) || p.extra.length);
  // Names of the prize slots that are still empty (增開六獎 is optional: most periods have none).
  function missing(p) {
    const out = [];
    if (!p.special) out.push('特別獎'); if (!p.grand) out.push('特獎');
    const nf = p.first.filter(Boolean).length; if (nf < 3) out.push('頭獎' + (nf ? '（只有 ' + nf + ' 組）' : ''));
    return out;
  }
  function tailMatch(n, f) { for (let L = 8; L >= 3; L--) if (n.slice(-L) === f.slice(-L)) return L; return 0; }
  // Best prize for an 8-digit number with what it matched: {tier, kind, num, len}. Highest tier wins. null when nothing matches.
  function bestMatch(p, n) {
    n = digits(n); if (n.length !== 8) return null;
    if (d8(p.special) && n === p.special) return { tier: TIER.special, kind: 'special', num: p.special, len: 8 };
    if (d8(p.grand) && n === p.grand) return { tier: TIER.grand, kind: 'grand', num: p.grand, len: 8 };
    let best = null;
    for (const f of p.first) {
      if (!d8(f)) continue;
      const L = tailMatch(n, f);
      if (L && (!best || L > best.len)) best = { tier: TIER[BY_LEN[L]], kind: 'first', num: f, len: L };
    }
    if (best) return best;
    if (p.extra.includes(n.slice(-3))) return { tier: TIER.extra, kind: 'extra', num: n.slice(-3), len: 3 };
    return null;
  }
  function checkFull(p, n) { const r = bestMatch(p, n); return r ? r.tier : null; }
  // Quick check of the last 3 digits: which announced numbers end this way, the lowest prize already secured,
  // and `final` when the 3 digits already decide the prize (only 增開六獎 matches: no need to type more).
  function checkTail(p, t) {
    t = digits(t); if (t.length !== 3) return { possible: false, hits: [], floor: null, final: null };
    const hits = [];
    if (d8(p.special) && p.special.slice(-3) === t) hits.push({ kind: 'special', num: p.special });
    if (d8(p.grand) && p.grand.slice(-3) === t) hits.push({ kind: 'grand', num: p.grand });
    p.first.forEach(f => { if (d8(f) && f.slice(-3) === t) hits.push({ kind: 'first', num: f }); });
    if (p.extra.includes(t)) hits.push({ kind: 'extra', num: t });
    let floor = null;
    if (hits.some(h => h.kind === 'first')) floor = TIER.sixth; else if (hits.some(h => h.kind === 'extra')) floor = TIER.extra;
    const final = hits.length && hits.every(h => h.kind === 'extra') ? TIER.extra : null;
    return { possible: hits.length > 0, hits, floor, final };
  }
  const fmtMoney = n => 'NT$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  // ---- dates (plain {y,mo,d}; mo is 1–12) ----
  const key = o => o.y * 10000 + o.mo * 100 + o.d;
  const fromDate = d => d instanceof Date ? { y: d.getFullYear(), mo: d.getMonth() + 1, d: d.getDate() } : d;
  const addMonths = (y, mo, k) => { const t = (y * 12 + mo - 1) + k; return { y: Math.floor(t / 12), mo: t % 12 + 1 }; };
  function drawDate(year, m) { const a = addMonths(year, m, 2); return { y: a.y, mo: a.mo, d: 25 }; }
  function claimWindow(year, m) {
    const s = addMonths(year, m, 3), e = addMonths(year, m, 6);
    return { from: { y: s.y, mo: s.mo, d: 6 }, to: { y: e.y, mo: e.mo, d: 5 } };
  }
  function periodOf(date) { const o = fromDate(date); return { year: o.y, m: o.mo % 2 ? o.mo : o.mo - 1 }; }
  const prevPeriod = (year, m) => m === 1 ? { year: year - 1, m: 11 } : { year, m: m - 2 };
  const nextPeriod = (year, m) => m === 11 ? { year: year + 1, m: 1 } : { year, m: m + 2 };
  // The first draw on or after `date`.
  function nextDraw(date) {
    const o = fromDate(date);
    let p = prevPeriod(periodOf(o).year, periodOf(o).m);
    for (let i = 0; i < 4; i++) { const d = drawDate(p.year, p.m); if (key(d) >= key(o)) return { ...p, date: d }; p = nextPeriod(p.year, p.m); }
    return null;
  }
  // The most recent period whose numbers are already out.
  function latestDrawn(date) {
    const o = fromDate(date);
    let p = periodOf(o);
    for (let i = 0; i < 4; i++) { if (key(drawDate(p.year, p.m)) <= key(o)) return p; p = prevPeriod(p.year, p.m); }
    return p;
  }
  function claimStatus(year, m, date) {
    const o = key(fromDate(date));
    if (o < key(drawDate(year, m))) return 'pending';
    const w = claimWindow(year, m);
    if (o < key(w.from)) return 'wait';
    if (o <= key(w.to)) return 'open';
    return 'closed';
  }
  const dayNo = o => Date.UTC(o.y, o.mo - 1, o.d) / 864e5;
  // Days from `date` to the next milestone: pending → draw day, wait → first claim day, open → last claim day (0 = today is the last day).
  function claimDays(year, m, date) {
    const o = fromDate(date), st = claimStatus(year, m, o), w = claimWindow(year, m);
    const target = st === 'pending' ? drawDate(year, m) : st === 'wait' ? w.from : st === 'open' ? w.to : null;
    return { status: st, days: target ? dayNo(target) - dayNo(o) : null };
  }
  const roc = y => y - 1911;
  const periodLabel = (year, m) => roc(year) + '年' + m + '–' + (m + 1) + '月';
  const fmtD = o => roc(o.y) + '/' + o.mo + '/' + o.d;

  // ---- text export / import ----
  function exportText(p) {
    const L = ['統一發票 ' + periodLabel(p.year, p.m)];
    L.push('特別獎 ' + (p.special || '—'));
    L.push('特獎 ' + (p.grand || '—'));
    L.push('頭獎 ' + p.first.map(f => f || '—').join(' '));
    L.push('增開六獎 ' + (p.extra.length ? p.extra.join(' ') : '無'));
    return L.join('\n');
  }
  // Period like 115年7–8月 / 民國115年07-08月 / 2026年7月、8月 / 115年 9~10月.
  function parsePeriod(s) {
    const ym = s.match(/(\d{2,4})\s*年\s*0?(\d{1,2})\s*月?\s*(?:[–—\-‐‑−－﹣~～至、,，/／]|到)\s*0?(\d{1,2})\s*月/);
    if (!ym) return null;
    let year = +ym[1]; if (year < 1000) year += 1911;
    const m = +ym[2], m2 = +ym[3];
    if (!START_MONTHS.includes(m) || m2 !== m + 1) return { error: '期別要是單月開始的兩個月（1–2、3–4…11–12 月），讀到的是 ' + m + '–' + m2 + ' 月' };
    if (year < 1990 || year > 2200) return { error: '期別年份看起來不對：' + ym[1] + ' 年' };
    return { year, m };
  }
  // Pull the winning numbers out of any pasted text: the official announcement, a news article, this app's export,
  // or just numbers typed in order. Labels decide where a number goes; amounts, dates and 雲端發票 lists are skipped.
  function parseNumbers(s) {
    s = half(s);
    const labels = []; const lre = /雲端發票[^\d\s]{0,12}|增開六獎|特別獎|特獎|頭獎|[二三四五六]獎/g; let mm;
    while ((mm = lre.exec(s))) {
      const t = mm[0];
      const sec = t.startsWith('雲端') ? 'skip' : t === '增開六獎' ? 'extra' : t === '特別獎' ? 'special' : t === '特獎' ? 'grand' : t === '頭獎' ? 'first' : 'skip';
      labels.push({ at: mm.index + t.length, sec });
    }
    const nums = []; const nre = /\d+/g;
    while ((mm = nre.exec(s))) {
      const v = mm[0], a = mm.index, b = a + v.length;
      const after = s.slice(b).replace(/^[ \t]+/, '').charAt(0);
      if (/[年月日元萬千百位碼張]/.test(after)) continue; // 115年, 25日, 200元, 末7位…
      if (/^[,.:：\/]\d/.test(s.slice(b)) || /\d[,.:：\/]$/.test(s.slice(0, a))) continue; // 1,000 / 3.5 / 12:30 / 115/9/25
      let sec = null; for (const l of labels) { if (l.at <= a) sec = l.sec; else break; }
      nums.push({ v, sec });
    }
    const out = { special: '', grand: '', first: [], extra: [], notes: [] };
    const push8 = (arr, v) => { if (!arr.includes(v)) arr.push(v); };
    if (labels.some(l => l.sec !== 'skip')) {
      const sp = [], gr = [], fi = [], ex = [];
      nums.forEach(({ v, sec }) => {
        if (v.length === 8 && sec === 'special') push8(sp, v);
        else if (v.length === 8 && sec === 'grand') push8(gr, v);
        else if (v.length === 8 && sec === 'first') push8(fi, v);
        else if (v.length === 3 && sec === 'extra') push8(ex, v);
      });
      out.special = sp[0] || ''; out.grand = gr[0] || ''; out.first = fi.slice(0, 3); out.extra = ex;
      if (sp.length > 1 || gr.length > 1) out.notes.push('特別獎或特獎讀到不只一組，只取第一組');
      if (fi.length > 3) out.notes.push('頭獎讀到 ' + fi.length + ' 組，只取前 3 組');
    } else {
      // No prize names: 8-digit numbers in announcement order 特別獎 → 特獎 → 頭獎 ×3.
      const e8 = []; nums.forEach(({ v }) => { if (v.length === 8) push8(e8, v); });
      out.special = e8[0] || ''; out.grand = e8[1] || ''; out.first = e8.slice(2, 5);
      if (e8.length) { out.ordered = true; out.notes.push('沒有獎別名稱，依公告順序填入：特別獎、特獎、頭獎'); }
      if (e8.length > 5) out.notes.push('讀到 ' + e8.length + ' 組 8 碼，只取前 5 組');
    }
    out.count = (out.special ? 1 : 0) + (out.grand ? 1 : 0) + out.first.length + out.extra.length;
    return out;
  }
  // Text → period. `fallback` ({year, m}) is used when the text names no period.
  function importText(s, fallback) {
    s = half(String(s || ''));
    let per = parsePeriod(s);
    if (per && per.error) return { error: per.error };
    if (!per) { if (fallback) per = fallback; else return { error: '找不到期別（例：115年7–8月）' }; }
    const r = parseNumbers(s);
    if (!r.count) return { error: '沒有讀到任何號碼' };
    return { period: normPeriod({ year: per.year, m: per.m, special: r.special, grand: r.grand, first: r.first, extra: r.extra }), notes: r.notes, foundPeriod: !!parsePeriod(s) };
  }
  return { TIER, TIERS, normPeriod, hasNumbers, missing, bestMatch, checkFull, checkTail, fmtMoney, drawDate, claimWindow, periodOf, prevPeriod, nextPeriod, nextDraw, latestDrawn, claimStatus, claimDays, periodLabel, fmtD, roc, exportText, importText, parsePeriod, parseNumbers, digits, START_MONTHS };
})();
/*CORE-END*/
</script>

(() => {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MAX_HIST = 400, MAX_PERIODS = 30;

}
function press(k) {

    // Back out of the first-5 entry: delete the last of the 3 tail digits, like any backspace.
    if ((stage === 'full' || stage === 'maybe') && !buf) { const t = tail; setStage('tail'); buf = t.slice(0, 2); tail = ''; last = null; shown = null; renderCheck(); feedback('tap'); return; }

  if (stage === 'maybe') stage = 'full';
  buf += k; anim = 'in'; feedback('tap');

const KIND_NAME = { special: '特別獎', grand: '特獎', first: '頭獎', extra: '增開六獎' };

  idle: `<div class="seal" aria-hidden="true">${ICON.keys}</div>`,
  miss: `<div class="seal" aria-hidden="true">${ICON.x}</div>`,
  maybe: `<div class="seal" aria-hidden="true">${ICON.search}</div>`,
  empty: `<div class="seal" aria-hidden="true">${ICON.alert}</div>`,
  win: `<div class="seal txt" aria-hidden="true">中</div>`

function emptyResult() {
  return { cls: 'empty', html: `${SEAL.empty}<div class="rt"><div class="big">這一期還沒有中獎號碼</div><div class="sub">先輸入或貼上 ${esc(IL.periodLabel(cur().year, cur().m))} 的號碼才能對獎。</div></div><button type="button" class="act primary" data-act="edit">輸入號碼</button>` };
}
function claimNote(p) {
  const c = IL.claimDays(p.year, p.m, today()), w = IL.claimWindow(p.year, p.m);
  const span = `${IL.fmtD(w.from)}–${IL.fmtD(w.to)}`;
  if (c.status === 'closed') return `<span class="warn">已超過領獎期限（${IL.fmtD(w.to)} 截止）</span>`;
  if (c.status === 'open') return `領獎至 ${IL.fmtD(w.to)}・${c.days ? '還有 ' + c.days + ' 天' : '今天最後一天'}`;
  return `領獎期間 ${span}`;
}
function evalTail() {
  const p = cur(), r = IL.checkTail(p, buf);
  if (!r.possible) {
    logHist(buf, null, 'miss'); feedback('miss');
    last = { cls: 'miss', html: `${SEAL.miss}<div class="rt"><div class="big">沒中</div><div class="sub">末 3 碼 <span class="num">${esc(buf)}</span> 不在本期號碼裡，直接輸入下一張。</div></div>` };
    shown = { d: buf, hit: 0 }; stage = 'done'; renderCheck(); return;
  }
  if (r.final) { // only 增開六獎 ends this way: the 3 digits already decide
    logHist(buf, r.final, 'win'); feedback('win');
    last = { cls: 'win', html: `${SEAL.win}<div class="rt"><div class="big"><span>${r.final.name}</span><span class="amt">${IL.fmtMoney(r.final.amt)}</span></div><div class="sub">末 3 碼 <span class="num"><em>${esc(buf)}</em></span> 對中增開六獎，不必再對前碼</div><div class="sub">${claimNote(p)}</div></div>` };
    shown = { d: buf, hit: 3 }; stage = 'done'; renderCheck(); return;
  }

  const hits = r.hits.map(h => `${KIND_NAME[h.kind]} <span class="num">${h.num.length === 8 ? esc(h.num.slice(0, 5)) + '<em>' + esc(h.num.slice(5)) + '</em>' : '<em>' + esc(h.num) + '</em>'}</span>`).join('、');

  last = { cls: 'maybe', html: `${SEAL.maybe}<div class="rt"><div class="big">可能中獎！</div><div class="sub">${floor}，請輸入前 5 碼核對</div><div class="sub">符合 ${hits}</div></div><button type="button" class="act" data-act="later">稍後核對</button>` };

function renderSlots() {

  if (stage === 'tail') {
    S.className = 'slots';
    for (let i = 0; i < 3; i++) html += cell(buf[i] || '', i === buf.length ? ' cur' : '', anim && i === buf.length - 1);
    $('#tkLabel').textContent = buf.length ? '再輸入 ' + (3 - buf.length) + ' 碼' : '輸入發票末 3 碼';
  } else if (stage === 'maybe' || stage === 'full') {
    S.className = 'slots wide';
    for (let i = 0; i < 5; i++) html += cell(buf[i] || '', i === buf.length ? ' cur' : '', anim && i === buf.length - 1);
    html += '<div class="gap"></div>';
    for (let i = 0; i < 3; i++) html += cell(tail[i], ' fixed');

}

        closeSheet(); confirmSheet(`「${IL.periodLabel(year, m)}」已經有號碼，要用新的號碼覆蓋嗎？對獎紀錄會保留。`, '覆蓋', commit); return;
      }
      commit();
    };
    if (focusPaste) $('#fPaste').focus(); else $(isNew ? '#fYear' : '#fSp').focus();
  });
}
function editSheet(p) { if (p.sample) return newSheet(true); periodForm(p, '編輯 ' + IL.periodLabel(p.year, p.m), false); }
function newSheet(focusPaste) {
  const ld = IL.latestDrawn(today());
  // Default to the latest drawn period the user hasn't filled in yet.
  let n = ld;
  for (let i = 0; i < 6 && periods.some(x => !x.sample && x.year === n.year && x.m === n.m); i++) n = IL.prevPeriod(n.year, n.m);
  if (periods.some(x => !x.sample && x.year === n.year && x.m === n.m)) n = ld;
  periodForm(IL.normPeriod({ year: n.year, m: n.m }), focusPaste ? '貼上公告號碼' : '新增期別', true, focusPaste);
}
function exportSheet(p) {
  const txt = IL.exportText(p) + (p.sample ? '\n（範例號碼，非真實開獎）' : '');
  const canShare = !!navigator.share;
  openSheet(`<h2 id="sheetTitle">分享號碼</h2><div class="field"><textarea id="exTxt" class="mono" readonly aria-label="匯出內容"></textarea></div>
    <p class="note" style="margin:0 2px 8px">對方在「貼上公告」貼上這段文字，就能直接匯入。</p>
    <div class="sheetact"><button class="btn ghost" type="button" id="exClose">關閉</button>${canShare ? `<button class="btn" type="button" id="exShare">${ICON.share}分享</button>` : ''}<button class="btn primary" type="button" id="exCopy" style="flex:1">${ICON.copy}複製</button></div>`, () => {
    $('#exTxt').value = txt; $('#exClose').onclick = closeSheet;
    $('#exCopy').onclick = async () => { const ok = await copyText(txt); if (!ok) { $('#exTxt').select(); } toast(ok ? '已複製' : '無法自動複製，文字已選取，請手動複製'); if (ok) closeSheet(); };
    if (canShare) $('#exShare').onclick = () => { navigator.share({ text: txt }).then(closeSheet).catch(() => {}); };
  });
}

/* ---------- tabs / toast / boot ---------- */
let activeTab = 'check';
const TABS = ['check', 'nums', 'hist'];
function showTab(t) {
  fxStop();
  const changed = t !== activeTab; activeTab = t;
  document.querySelectorAll('.tabs [role=tab]').forEach(b => { const on = b.dataset.tab === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  $('.tabs .ind').style.transform = `translateX(${TABS.indexOf(t) * 100}%)`;
  TABS.forEach(x => { const v = $('#tab-' + x); v.hidden = x !== t; if (x === t && changed) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); } });
  if (t === 'nums') renderNums(); if (t === 'hist') renderHist();
  if (t === 'check') renderCheck();
}
$('.tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) showTab(b.dataset.tab); });
$('.tabs').addEventListener('keydown', e => { const i = TABS.indexOf(activeTab); if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; showTab(n); $('#t-' + n).focus(); e.preventDefault(); } });
let toastT = null;
function toast(m, actLabel, act) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(m)}</span>` + (actLabel ? `<button type="button">${esc(actLabel)}</button>` : '');
  t.classList.toggle('act', !!actLabel); t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  if (actLabel) t.querySelector('button').onclick = () => { t.hidden = true; clearTimeout(toastT); act(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, actLabel ? 5000 : 2200);
}
function renderAll() { renderSelect(); renderCheck(); if (activeTab === 'nums') renderNums(); if (activeTab === 'hist') renderHist(); }
applyTheme(); applySound(); renderAll(); showTab('check');
window.__invoiceLottery = { press, showTab, flush, get state() { return { stage, buf, tail, curId, periods, hist }; } };
})();
