<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>發票對獎</title>
<style>
:root{
  --bg:#efe7da; --surface:#fffdf8; --surface-2:#f5eee2; --ink:#2b2420; --ink-2:#5f554d; --ink-3:#8c8177;
  --line:#dfd4c2; --line-strong:#bfb19c;
  --accent:#c4322b; --accent-ink:#ffffff; --accent-soft:#f8dedb;
  --gold:#a86b12; --gold-soft:#fbecc9; --win:#1d7a4b; --win-soft:#d9efe1; --miss:#6f655c;
  --focus:#1c5fd1; --scrim:rgba(30,22,16,.5); --shadow:0 1px 0 rgba(40,28,16,.06), 0 8px 20px -12px rgba(40,28,16,.35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16120e; --surface:#211b16; --surface-2:#2b241d; --ink:#f1e9dc; --ink-2:#c0b3a4; --ink-3:#8f8375;
    --line:#3a322a; --line-strong:#544a3e;
    --accent:#ff6f62; --accent-ink:#2a0c09; --accent-soft:#4a221e;
    --gold:#f2c15c; --gold-soft:#3f2f12; --win:#5bd3a2; --win-soft:#173b2b; --miss:#9b9084;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120e; --surface:#211b16; --surface-2:#2b241d; --ink:#f1e9dc; --ink-2:#c0b3a4; --ink-3:#8f8375;
  --line:#3a322a; --line-strong:#544a3e;
  --accent:#ff6f62; --accent-ink:#2a0c09; --accent-soft:#4a221e;
  --gold:#f2c15c; --gold-soft:#3f2f12; --win:#5bd3a2; --win-soft:#173b2b; --miss:#9b9084;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.62); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:8px 0 6px;flex:none}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;line-height:1;letter-spacing:.06em}
.mark small{font-size:9px;font-weight:700;letter-spacing:.14em;opacity:.85;margin-top:3px}
.psel{flex:1;min-width:0;position:relative}
.psel label{position:absolute;left:10px;top:3px;font-size:10px;color:var(--ink-3);letter-spacing:.1em;pointer-events:none}
.psel select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 30px 2px 10px;font-weight:700;font-size:15px;appearance:none;-webkit-appearance:none;text-overflow:ellipsis;cursor:pointer}
.psel::after{content:"";position:absolute;right:12px;top:19px;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);pointer-events:none}
.iconbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;flex:none;margin-bottom:8px}
.tabs button{min-height:40px;border:0;background:var(--surface);cursor:pointer;font-weight:700;border-left:1px solid var(--line);color:var(--ink-2)}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.view.check{display:flex;flex-direction:column;gap:8px;overflow:hidden;padding-bottom:calc(8px + env(safe-area-inset-bottom))}

/* check view */
.ticket{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;position:relative;box-shadow:var(--shadow)}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:7px;background:radial-gradient(circle at 6px 7px, var(--bg) 4px, transparent 4.5px) 0 0/12px 7px repeat-x}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.tally{color:var(--ink-2);white-space:nowrap}
.tally b{font-family:var(--mono);color:var(--ink);font-weight:800}
.tally .nd b{color:var(--gold)}
.slots{display:flex;justify-content:center;gap:5px;margin-top:4px}
.slot{width:36px;height:46px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:28px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.slot.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot.fixed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slot.dim{opacity:.55}
.slots.wide .slot{width:30px;height:42px;font-size:24px;border-radius:6px}
.slots .gap{width:4px}
.result{flex:none;border-radius:12px;padding:8px 12px;min-height:58px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);transition:background .2s,border-color .2s}
.result .rt{flex:1;min-width:0}
.result .big{font-size:20px;font-weight:800;line-height:1.2;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.result .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.result .sub .num{word-break:break-all}
.result .amt{font-family:var(--mono);font-size:21px;font-weight:800;white-space:nowrap;margin-left:auto}
.result button{flex:none;min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px}
.result.idle .big{font-size:15px;color:var(--ink-2);font-weight:700}
.result.miss{background:var(--surface);border-color:var(--line-strong)}
.result.miss .big{color:var(--miss)}
.result.maybe{background:var(--gold-soft);border-color:var(--gold)}
.result.maybe .big{color:var(--gold)}
.result.win{background:var(--win-soft);border-color:var(--win)}
.result.win .big,.result.win .amt{color:var(--win)}
.result.win.top{background:var(--accent-soft);border-color:var(--accent)}
.result.win.top .big,.result.win.top .amt{color:var(--accent)}
.result.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.02)}100%{transform:none}}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(44px,78px));gap:6px;align-content:start}
.pad button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.06);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad button:active{background:var(--surface-2);transform:translateY(1px)}
.pad button.fn{font-family:var(--sans);font-size:17px;color:var(--ink-2);background:var(--surface-2)}
.pad button.fn.clr{color:var(--accent)}

/* nums view */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.06em}
.badge.open{background:var(--win-soft);color:var(--win)}
.badge.closed{background:var(--surface-2);color:var(--ink-3)}
.badge.pending{background:var(--accent-soft);color:var(--accent)}
.dates{font-size:13px;color:var(--ink-2);margin:6px 0 10px;line-height:1.5}
.dates span{white-space:nowrap}
.ngrid{display:flex;flex-direction:column;gap:5px}
.nrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-top:1px dotted var(--line)}
.nrow:first-child{border-top:0}
.nrow .k{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.nrow .k small{display:block;font-weight:500;color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.nrow .v{font-family:var(--mono);font-size:19px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 12px}
.nrow .v em{font-style:normal;color:var(--accent)}
.nrow .v .none{color:var(--ink-3);font-weight:500;font-size:14px;letter-spacing:0;font-family:var(--sans)}
.nrow.hi .v{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:700;padding:0 14px;cursor:pointer;flex:1 1 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:4px 2px 12px}
.sample{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--gold);background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:6px 10px;line-height:1.35}
.sample.inline{flex:none;padding:3px 10px;font-size:12px;white-space:nowrap;overflow:hidden}
.sample.inline span{overflow:hidden;text-overflow:ellipsis}
.nextdraw{font-size:13px;color:var(--ink-2);margin:0 2px 10px}
.nextdraw b{font-family:var(--mono);color:var(--ink)}

/* history */
.stats{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.stat.win b{color:var(--win)}
.hlist{display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-height:44px}
.hrow .n{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.04em;flex:1;color:var(--ink-2)}
.hrow .n em{font-style:normal;color:var(--ink)}
.hrow .p{font-weight:700;font-size:13px;white-space:nowrap}
.hrow .p.win{color:var(--win)} .hrow .p.miss{color:var(--ink-3)} .hrow .p.maybe{color:var(--gold)}
.hrow .t{font-size:11px;color:var(--ink-3);white-space:nowrap}
.empty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:20px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);padding:8px 10px;font-size:16px}
.field input.num{font-family:var(--mono);letter-spacing:.14em;font-size:18px}
.field input.bad{border-color:var(--accent)}
.field textarea{font-family:var(--mono);font-size:14px;min-height:150px;letter-spacing:.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--accent);font-size:13px;min-height:1.2em;margin:-4px 0 8px}
.sheetact{display:flex;gap:8px;margin-top:4px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.sheetact .btn.danger{flex:0 0 auto}
.dlgmsg{margin:0 0 16px;color:var(--ink-2)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px;pointer-events:none}

@media (hover:hover){
  .iconbtn:hover,.btn:hover,.pad button:hover{border-color:var(--ink-3)}
  .btn.primary:hover{filter:brightness(1.07)}
}
@media (max-height:540px){
  .top{padding:6px 0 4px}
  .tabs{margin-bottom:6px}
  .view.check{gap:6px}
  .ticket{padding:6px 12px 8px}
  .slot{height:38px;font-size:23px}
  .slots.wide .slot{height:36px;font-size:21px}
  .result{min-height:50px;padding:5px 10px}
  .result .big{font-size:18px}
  .result .amt{font-size:19px}
}
@media (orientation:landscape) and (max-height:480px){
  .app{max-width:none;padding:0 20px}
  .view.check{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:6px 14px}
  .view.check .sample.inline{grid-column:1} .view.check .ticket{grid-column:1} .view.check .result{grid-column:1;align-self:start}
  .view.check .pad{grid-column:2;grid-row:1/4}
}
@media (min-width:900px){
  .app{padding:0 32px}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:86%}
  .sheet .grab{display:none}
}
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true">發票<small>對獎</small></div>
    <div class="psel"><label for="periodSel">期別</label><select id="periodSel" aria-label="選擇期別"></select></div>
    <button class="iconbtn" id="sndBtn" type="button" aria-pressed="true" aria-label="音效與震動：開（點擊切換）"></button>

  <main>
    <section class="view check" id="tab-check" role="tabpanel">
      <div class="sample inline" id="sampleNote" hidden><span>範例號碼，非真實開獎；請到「號碼」頁輸入真實號碼。</span></div>

      </div>
    </section>
    <section class="view" id="tab-nums" role="tabpanel" hidden></section>
    <section class="view" id="tab-hist" role="tabpanel" hidden></section>
  </main>
</div>

<script>
/*CORE-START*/
const IL = (() => {
  const TIERS = [
    ['special', '特別獎', 10000000], ['grand', '特獎', 2000000], ['first', '頭獎', 200000],
    ['second', '二獎', 40000], ['third', '三獎', 10000], ['fourth', '四獎', 4000],
    ['fifth', '五獎', 1000], ['sixth', '六獎', 200], ['extra', '增開六獎', 200]];
  const TIER = {}; TIERS.forEach(([key, name, amt], rank) => { TIER[key] = { key, name, amt, rank }; });
  const BY_LEN = { 8: 'first', 7: 'second', 6: 'third', 5: 'fourth', 4: 'fifth', 3: 'sixth' };
  const d8 = s => typeof s === 'string' && /^\d{8}$/.test(s);
  const d3 = s => typeof s === 'string' && /^\d{3}$/.test(s);
  const digits = s => String(s == null ? '' : s).replace(/\D/g, '');
  const START_MONTHS = [1, 3, 5, 7, 9, 11];

  // Normalise a period object; invalid numbers become '' (ignored while checking).
  function normPeriod(p) {
    p = p && typeof p === 'object' ? p : {};
    const year = Number.isInteger(+p.year) && +p.year >= 1900 && +p.year <= 2200 ? +p.year : 2026;
    const m = START_MONTHS.includes(+p.m) ? +p.m : 1;
    const n8 = s => { s = digits(s); return s.length === 8 ? s : ''; };
    const first = Array.isArray(p.first) ? p.first.slice(0, 3).map(n8) : [];
    while (first.length < 3) first.push('');
    const extra = Array.isArray(p.extra) ? p.extra.map(digits).filter(d3) : [];
    return { id: typeof p.id === 'string' ? p.id : year + '-' + m, year, m, special: n8(p.special), grand: n8(p.grand), first, extra: [...new Set(extra)], sample: !!p.sample };
  }
  function tailMatch(n, f) { for (let L = 8; L >= 3; L--) if (n.slice(-L) === f.slice(-L)) return L; return 0; }
  // Exact prize for an 8-digit number: highest tier wins. null when nothing matches.
  function checkFull(p, n) {
    n = digits(n); if (n.length !== 8) return null;
    if (d8(p.special) && n === p.special) return TIER.special;
    if (d8(p.grand) && n === p.grand) return TIER.grand;
    let best = null;
    for (const f of p.first) {
      if (!d8(f)) continue;
      const L = tailMatch(n, f); if (!L) continue;
      const t = TIER[BY_LEN[L]]; if (!best || t.rank < best.rank) best = t;
    }
    if (best) return best;
    if (p.extra.includes(n.slice(-3))) return TIER.extra;
    return null;
  }
  // Quick check of the last 3 digits: which announced numbers end this way, and the lowest prize already secured.
  function checkTail(p, t) {
    t = digits(t); if (t.length !== 3) return { possible: false, hits: [], floor: null };
    const hits = [];
    if (d8(p.special) && p.special.slice(-3) === t) hits.push({ kind: 'special', num: p.special });
    if (d8(p.grand) && p.grand.slice(-3) === t) hits.push({ kind: 'grand', num: p.grand });
    p.first.forEach(f => { if (d8(f) && f.slice(-3) === t) hits.push({ kind: 'first', num: f }); });
    if (p.extra.includes(t)) hits.push({ kind: 'extra', num: t });
    let floor = null;

  const rows = h.map(x => {
    const n = x.n.length === 8 ? esc(x.n.slice(0, 5)) + '<em>' + esc(x.n.slice(5)) + '</em>' : '･････<em>' + esc(x.n) + '</em>';
    const p = x.a > 0 ? `<span class="p win">${IL.TIER[x.k] ? IL.TIER[x.k].name : ''} ${IL.fmtMoney(x.a)}</span>` : x.s === 'maybe' ? '<span class="p maybe">待核對</span>' : '<span class="p miss">沒中</span>';
    return `<div class="hrow"><span class="n">${n}</span>${p}<span class="t">${tm(x.t)}</span></div>`;
  }).join('');
  V.innerHTML = `
    <div class="stats"><div class="stat"><small>已對</small><b>${h.length}</b></div><div class="stat win"><small>中獎</small><b>${wins.length}</b></div><div class="stat win"><small>獎金</small><b>${IL.fmtMoney(sum)}</b></div></div>
    ${h.length ? '<div class="hlist">' + rows + '</div>' : '<div class="empty">還沒有對獎紀錄，到「對獎」頁輸入發票末 3 碼開始。</div>'}
    <div class="acts" style="margin-top:12px"><button class="btn danger" type="button" id="clearHist" ${h.length ? '' : 'disabled'}>清除本期紀錄</button></div>`;
  $('#clearHist').onclick = () => confirmSheet('清除本期全部對獎紀錄？', () => { delete hist[curId]; save(); reset(); renderAll(); toast('紀錄已清除'); });
}

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(html, onMount) {
  lastFocus = document.activeElement;
  const L = $('#layer');
  L.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  $('#scrim').addEventListener('click', ev => { if (ev.target.id === 'scrim') closeSheet(); });
  L.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
  if (onMount) onMount();
}
function closeSheet() { $('#layer').innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
function confirmSheet(msg, yes) {
  openSheet(`<h2 id="sheetTitle">確認</h2><p class="dlgmsg">${esc(msg)}</p><div class="sheetact"><button class="btn ghost" type="button" id="cNo">取消</button><button class="btn danger" type="button" id="cYes" style="flex:1">確定</button></div>`, () => {
    $('#cNo').onclick = closeSheet; $('#cYes').onclick = () => { closeSheet(); yes(); }; $('#cYes').focus();
  });
}
const monthOpts = m => IL.START_MONTHS.map(x => `<option value="${x}"${x === m ? ' selected' : ''}>${x}–${x + 1} 月</option>`).join('');
function periodForm(p, title, isNew) {
  const f = (id, label, val, max, ph) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="num" inputmode="numeric" pattern="[0-9]*" maxlength="${max}" autocomplete="off" value="${esc(val)}" placeholder="${ph || ''}"></div>`;
  openSheet(`<h2 id="sheetTitle">${title}</h2>
    <div class="row2">
      <div class="field"><label for="fYear">民國年</label><input id="fYear" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="${IL.roc(p.year)}"${isNew ? '' : ' disabled'}></div>
      <div class="field"><label for="fM">月份</label><select id="fM"${isNew ? '' : ' disabled'}>${monthOpts(p.m)}</select></div>
    </div>
    ${f('fSp', '特別獎（8 碼）', p.special, 8, '00000000')}
    ${f('fGr', '特獎（8 碼）', p.grand, 8, '00000000')}
    ${f('fF1', '頭獎 1', p.first[0], 8, '00000000')}${f('fF2', '頭獎 2', p.first[1], 8, '00000000')}${f('fF3', '頭獎 3', p.first[2], 8, '00000000')}
    <div class="field"><label for="fEx">增開六獎（3 碼，可多組，用空白或逗號分開；沒有就留空）</label><input id="fEx" class="num" inputmode="numeric" autocomplete="off" value="${esc(p.extra.join(' '))}" placeholder="例：123 456"></div>
    <div class="err" id="fErr" aria-live="polite"></div>
    <div class="sheetact"><button class="btn ghost" type="button" id="fCancel">取消</button><button class="btn primary" type="button" id="fSave" style="flex:1">儲存</button></div>`, () => {
    $('#fCancel').onclick = closeSheet;
    $('#fSave').onclick = () => {
      const val = id => $('#' + id).value.replace(/\D/g, '');
      const n8s = ['fSp', 'fGr', 'fF1', 'fF2', 'fF3'].map(val);
      const bad = n8s.findIndex(v => v && v.length !== 8);
      document.querySelectorAll('.field input').forEach(i => i.classList.remove('bad'));
      if (bad >= 0) { $('#fErr').textContent = '號碼要剛好 8 碼（還沒公布可留空）'; $('#' + ['fSp', 'fGr', 'fF1', 'fF2', 'fF3'][bad]).classList.add('bad'); return; }
      const exRaw = $('#fEx').value.split(/[^\d]+/).filter(Boolean);
      if (exRaw.some(x => x.length !== 3)) { $('#fErr').textContent = '增開六獎每組要剛好 3 碼'; $('#fEx').classList.add('bad'); return; }
      let year = p.year, m = p.m;
      if (isNew) {
        const ry = +$('#fYear').value; m = +$('#fM').value;
        if (!(ry >= 90 && ry <= 200)) { $('#fErr').textContent = '民國年請填 90–200'; $('#fYear').classList.add('bad'); return; }
        year = ry + 1911;
        if (periods.some(x => x.year === year && x.m === m)) { $('#fErr').textContent = '這一期已經存在，請直接編輯'; return; }
        if (periods.length >= MAX_PERIODS) { $('#fErr').textContent = '最多保存 ' + MAX_PERIODS + ' 期，請先刪除舊的'; return; }
      }
      const np = IL.normPeriod({ id: isNew ? year + '-' + m + '-' + Date.now().toString(36) : p.id, year, m, special: n8s[0], grand: n8s[1], first: n8s.slice(2), extra: exRaw, sample: false });
      if (isNew) periods.push(np); else periods[periods.findIndex(x => x.id === p.id)] = np;
      curId = np.id; save(); closeSheet(); reset(); renderAll(); toast(isNew ? '已新增期別' : '號碼已更新');
    };
    $(isNew ? '#fYear' : '#fSp').focus();
  });
}
function editSheet(p) { periodForm(p, '編輯 ' + IL.periodLabel(p.year, p.m) + ' 號碼', false); }
function newSheet() {
  const latest = periods[0], ld = IL.latestDrawn(today());
  let n = latest ? IL.nextPeriod(latest.year, latest.m) : ld;
  if ((n.year * 12 + n.m) > (ld.year * 12 + ld.m) + 2) n = ld; // don't run far into the future
  if (periods.some(x => x.year === n.year && x.m === n.m)) n = IL.nextPeriod(n.year, n.m);
  periodForm(IL.normPeriod({ year: n.year, m: n.m }), '新增期別', true);
}
function exportSheet(p) {
  const txt = IL.exportText(p);
  openSheet(`<h2 id="sheetTitle">匯出號碼</h2><div class="field"><textarea id="exTxt" readonly aria-label="匯出內容"></textarea></div>
    <div class="sheetact"><button class="btn ghost" type="button" id="exClose">關閉</button><button class="btn primary" type="button" id="exCopy" style="flex:1">複製</button></div>`, () => {
    $('#exTxt').value = txt; $('#exClose').onclick = closeSheet;
    $('#exCopy').onclick = async () => {
      let ok = false; try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
      if (!ok) { try { $('#exTxt').select(); ok = document.execCommand('copy'); } catch (e) {} }
      toast(ok ? '已複製' : '無法複製，請手動選取'); if (ok) closeSheet();
    };
  });
}
function importSheet() {
  openSheet(`<h2 id="sheetTitle">匯入號碼</h2><p class="dlgmsg" style="margin-bottom:8px">貼上匯出的文字，或照下面格式自己打：</p>
    <div class="field"><textarea id="imTxt" aria-label="匯入內容" placeholder="統一發票 115年7–8月&#10;特別獎 12345678&#10;特獎 87654321&#10;頭獎 11111111 22222222 33333333&#10;增開六獎 000 999"></textarea></div>
    <div class="err" id="imErr" aria-live="polite"></div>
    <div class="sheetact"><button class="btn ghost" type="button" id="imCancel">取消</button><button class="btn primary" type="button" id="imOk" style="flex:1">匯入</button></div>`, () => {
    $('#imCancel').onclick = closeSheet;
    $('#imOk').onclick = () => {
      const r = IL.importText($('#imTxt').value);
      if (r.error) { $('#imErr').textContent = r.error; return; }
      const np = r.period, ex = periods.find(x => x.year === np.year && x.m === np.m);
      const apply = () => {
        if (ex) { np.id = ex.id; periods[periods.indexOf(ex)] = np; } else { if (periods.length >= MAX_PERIODS) { toast('最多保存 ' + MAX_PERIODS + ' 期'); return; } np.id = np.year + '-' + np.m + '-' + Date.now().toString(36); periods.push(np); }
        curId = np.id; save(); reset(); renderAll(); toast('已匯入 ' + IL.periodLabel(np.year, np.m));
      };
      closeSheet();
      if (ex) confirmSheet(`「${IL.periodLabel(np.year, np.m)}」已存在，要覆蓋號碼嗎？對獎紀錄會保留。`, apply); else apply();
    };
    $('#imTxt').focus();
  });
}

/* ---------- tabs / toast / boot ---------- */
let activeTab = 'check';
function showTab(t) {
  activeTab = t;
  document.querySelectorAll('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['check', 'nums', 'hist'].forEach(x => { $('#tab-' + x).hidden = x !== t; });
  if (t === 'nums') renderNums(); if (t === 'hist') renderHist();
}
$('.tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) showTab(b.dataset.tab); });
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }
function renderAll() { renderSelect(); renderCheck(); if (activeTab === 'nums') renderNums(); if (activeTab === 'hist') renderHist(); }
applyTheme(); applySound(); renderAll();
window.__invoiceLottery = { press, showTab, get state() { return { stage, buf, tail, curId, periods, hist }; } };
})();
</script>
