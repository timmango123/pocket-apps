// ---------- Hash library (shared with the Web Worker via toString) ----------
function hashLib(){
  function md(blockSize, bigEndian, init, compress, out){
    return function(){
      const st = init(), buf = new Uint8Array(blockSize), dv = new DataView(buf.buffer);
      let bl = 0, total = 0;
      return {
        update(data){
          total += data.length; let i = 0;
          if (bl){ const n = Math.min(blockSize - bl, data.length); buf.set(data.subarray(0, n), bl); bl += n; i = n; if (bl === blockSize){ compress(st, dv, 0); bl = 0; } }

            const ddv = new DataView(data.buffer, data.byteOffset, data.byteLength);
            for (; i + blockSize <= data.length; i += blockSize) compress(st, ddv, i);
            if (i < data.length){ buf.set(data.subarray(i), 0); bl = data.length - i; }
          }
          return this;

        digest(){
          const bits = total * 8; buf[bl++] = 0x80;
          if (bl > blockSize - 8){ buf.fill(0, bl); compress(st, dv, 0); bl = 0; }
          buf.fill(0, bl);
          const hi = Math.floor(bits / 4294967296), lo = bits >>> 0;
          if (bigEndian){ dv.setUint32(blockSize - 8, hi); dv.setUint32(blockSize - 4, lo); }
          else { dv.setUint32(blockSize - 8, lo, true); dv.setUint32(blockSize - 4, hi, true); }
          compress(st, dv, 0); return out(st);

  const MK = new Int32Array(64); for (let i = 0; i < 64; i++) MK[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;

  function md5c(h, dv, o){
    let a = h[0], b = h[1], c = h[2], d = h[3];

      else if (i < 32){ f = (d & b) | (~d & c); g = (5 * i + 1) & 15; }
      else if (i < 48){ f = b ^ c ^ d; g = (3 * i + 5) & 15; }
