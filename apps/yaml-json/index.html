<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>

<style>
/* Relay desk: warm paper, ink rules, one colour per format (YAML ember, JSON brass, TOML teal) */
:root{
  --bg:#efebe3; --paper:#fffdf9; --sunk:#f7f4ee; --ink:#1d1a16; --ink2:#47423a; --muted:#6c665c; --faint:#8f897e;
  --line:#ddd6ca; --line2:#c9c0b1; --gut:#a39c90;
  --yaml:#bf3f12; --json:#8a6200; --toml:#0d7466;
  --yaml-soft:#fbe6dc; --json-soft:#f6ebcd; --toml-soft:#d8efe9;
  --ok:#1f6b3a; --ok-soft:#dff0e3; --bad:#b0261c; --bad-soft:#fbe3df; --warn:#8a5a00; --warn-soft:#f8ecd0; --info-soft:#ece7de;
  --k:#9a3412; --s:#3f6212; --n:#1d4ed8; --b:#7e22ce; --z:#6b7280; --p:#8a8377; --c:#8f897e; --h:#0d7466; --a:#b45309;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(60,45,20,.06),0 8px 24px -12px rgba(60,45,20,.18);
  --pop:0 18px 50px -12px rgba(30,20,5,.35);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
  --fs:13.5px; --lh:21px;
  color-scheme:light;
}
@media (pointer:coarse){:root{--fs:16px;--lh:24px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130f; --paper:#1c1b17; --sunk:#181713; --ink:#ece7dc; --ink2:#cdc6b8; --muted:#a39b8c; --faint:#7d766a;
  --line:#2f2c25; --line2:#433f36; --gut:#6b655a;
  --yaml:#ff8a5c; --json:#f1c24b; --toml:#3fd0b8;
  --yaml-soft:#3a2117; --json-soft:#352a10; --toml-soft:#123029;
  --ok:#7ad69a; --ok-soft:#173222; --bad:#ff8f84; --bad-soft:#3c1b18; --warn:#f2c35c; --warn-soft:#352a11; --info-soft:#24221d;
  --k:#ffab7e; --s:#b5dc8a; --n:#8ab4ff; --b:#d8a8ff; --z:#a6a196; --p:#8d877b; --c:#7d766a; --h:#3fd0b8; --a:#f2b35c;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  --pop:0 18px 50px -10px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130f; --paper:#1c1b17; --sunk:#181713; --ink:#ece7dc; --ink2:#cdc6b8; --muted:#a39b8c; --faint:#7d766a;
  --line:#2f2c25; --line2:#433f36; --gut:#6b655a;
  --yaml:#ff8a5c; --json:#f1c24b; --toml:#3fd0b8;
  --yaml-soft:#3a2117; --json-soft:#352a10; --toml-soft:#123029;
  --ok:#7ad69a; --ok-soft:#173222; --bad:#ff8f84; --bad-soft:#3c1b18; --warn:#f2c35c; --warn-soft:#352a11; --info-soft:#24221d;
  --k:#ffab7e; --s:#b5dc8a; --n:#8ab4ff; --b:#d8a8ff; --z:#a6a196; --p:#8d877b; --c:#7d766a; --h:#3fd0b8; --a:#f2b35c;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  --pop:0 18px 50px -10px rgba(0,0,0,.75); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(rgba(120,100,60,.07) 1px,transparent 1.2px);background-size:14px 14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
svg{display:block}
/* header */
.top{display:flex;align-items:center;gap:10px;min-height:58px}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:#1d1a16;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:19px;font-weight:760;letter-spacing:.02em;line-height:1.15;white-space:nowrap}
.title small{display:block;font:600 10.5px/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small i{font-style:normal}
.title small .y{color:var(--yaml)} .title small .j{color:var(--json)} .title small .t{color:var(--toml)}
.ib{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow);transition:transform .12s}
.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px}
/* route bar */
.route{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1.55fr);gap:8px;align-items:center;margin:2px 0 12px}
.src{width:100%;min-height:48px;border:1.5px solid var(--fc);border-radius:12px;background:var(--paper);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0;--fc:var(--line2)}
.src .fmt{font:750 15px/1 var(--mono);color:var(--fc);letter-spacing:.04em}
.src .sub{font-size:11px;color:var(--muted);line-height:1.2;display:block;font-weight:600}
.src .lbl{flex:1;min-width:0}
.src .lbl b{display:block;font-size:11px;color:var(--muted);font-weight:600;line-height:1.1;margin-bottom:3px}
.src svg{width:14px;height:14px;color:var(--muted);flex:none}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--paper);display:grid;place-items:center;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.swap svg{width:20px;height:20px}
.swap.spin{transform:rotate(180deg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);border-radius:12px;background:var(--paper);padding:2px;gap:2px;box-shadow:var(--shadow);min-width:0}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;font:700 13.5px/1 var(--mono);letter-spacing:.03em;color:var(--muted);padding:0 2px;transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--fc);color:var(--paper)}
.seg button[data-f="yaml"]{--fc:var(--yaml)} .seg button[data-f="json"]{--fc:var(--json)} .seg button[data-f="toml"]{--fc:var(--toml)}
.cap{font-size:11px;color:var(--muted);font-weight:600;margin:0 0 4px 2px;display:flex;justify-content:space-between}
/* panes */
.panes{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.route{grid-template-columns:minmax(0,220px) 44px minmax(0,360px);justify-content:start;gap:12px}}
@media (min-width:640px){.panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"in out" "st out";align-items:start}#inCard{grid-area:in}#status{grid-area:st;margin:0}#outCard{grid-area:out}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fc,var(--line2));transition:background .25s}
.chead{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;min-height:54px;border-bottom:1px solid var(--line)}
.chead h2{margin:0;font-size:14px;font-weight:720;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.tag{font:700 10.5px/1 var(--mono);letter-spacing:.08em;padding:4px 6px;border-radius:6px;background:var(--fs-soft,var(--info-soft));color:var(--fc,var(--muted))}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;background:var(--json-soft);color:var(--json);white-space:nowrap}
.meta .wd{display:none}@media (min-width:600px){.meta .wd{display:inline}}
.meta{font:11.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.sp{flex:1;min-width:4px}
.tb{min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:650;padding:0 8px;transition:background .15s,transform .1s}
.tb svg{width:19px;height:19px;flex:none}
.tb:active{transform:scale(.94)}
@media (hover:hover){.tb:hover{background:var(--sunk)}}
.tb.pri{background:var(--ink);color:var(--paper);padding:0 13px}
.tb.pri.done{background:var(--ok)}
.tb .t{display:none}
@media (min-width:430px){.tb.lab .t{display:inline}}
/* editor */
.ed{position:relative;display:flex;height:var(--edh);background:var(--sunk)}
.panes{--edh:clamp(150px,34vh,560px)}
@media (max-height:700px) and (max-width:639px){.panes{--edh:clamp(112px,24vh,300px)}#inCard{--edh:clamp(100px,18vh,220px)}.cap{display:none}.route{margin-top:0}.chead{min-height:48px;padding-top:2px;padding-bottom:2px}}
@media (min-width:640px){.panes{--edh:clamp(170px,calc(100vh - 320px),900px)}}
.gut{flex:none;width:var(--gw,38px);overflow:hidden;position:relative;border-right:1px solid var(--line);background:var(--paper)}
.gut pre{margin:0;padding:10px 7px 40px 0;font:var(--fs)/var(--lh) var(--mono);color:var(--gut);text-align:right;white-space:pre;will-change:transform}
.gut .eline{position:absolute;left:0;right:0;height:var(--lh);background:var(--bad);opacity:.9;pointer-events:none}
.edb{position:relative;flex:1;min-width:0}
.band{position:absolute;left:0;right:0;height:var(--lh);background:var(--bad-soft);pointer-events:none;border-left:2px solid var(--bad)}
textarea#src{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;margin:0;background:transparent;padding:10px 12px 40px;font:var(--fs)/var(--lh) var(--mono);white-space:pre;overflow:auto;tab-size:2;color:var(--ink);outline:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
textarea#src::placeholder{color:var(--faint);font-family:var(--sans)}
.hl{position:absolute;inset:0;margin:0;overflow:hidden;pointer-events:none;font:var(--fs)/var(--lh) var(--mono);tab-size:2;color:var(--ink)}
.hl .b,.hl .h{font-weight:inherit}.hl .c,.hl .z{font-style:normal}
.hl code{display:block;padding:10px 12px 40px;white-space:pre;font:inherit;will-change:transform}
textarea#src.hlon{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink)}
textarea#src.hlon::placeholder{-webkit-text-fill-color:var(--faint);color:var(--faint)}
textarea#src::selection{background:color-mix(in srgb,var(--n) 28%,transparent)}
.ed:focus-within{box-shadow:inset 0 0 0 2px var(--fc,var(--ink))}
.ed.big .gut,.ed.big .band,.ed.big .hl,.ed.big textarea#src{display:none}
.out.bigv{position:absolute;inset:0;height:auto}
.bigbar{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 14px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;line-height:1.45;border-bottom:1px solid var(--line);font-weight:600}
.bigbar span{flex:1;min-width:0}
.bigbar .ab{flex:none;font-size:13px;padding:0 12px;color:var(--ink)}
.bigbar .ab:disabled{opacity:.6}
.drop{position:absolute;inset:6px;border:2px dashed var(--fc);border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 85%,transparent);font-weight:700;color:var(--ink2);pointer-events:none}
/* output */
.out{height:var(--edh);overflow:auto;background:var(--sunk);font:var(--fs)/var(--lh) var(--mono);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.out .rows{padding:10px 0 40px;min-width:max-content;transition:opacity .18s}
.out.wrapon .rows{min-width:0}
.out .r{display:flex;min-height:var(--lh)}
.out .n{position:sticky;left:0;flex:none;width:var(--gw,38px);padding-right:7px;text-align:right;color:var(--gut);background:var(--paper);border-right:1px solid var(--line);user-select:none;-webkit-user-select:none}
.out .x{padding:0 14px 0 12px;white-space:pre;tab-size:2}
.out.wrapon .x{white-space:pre-wrap;word-break:break-all;min-width:0;flex:1}
.out .r.cur{background:var(--bad-soft);box-shadow:inset 2px 0 0 var(--bad)}
.out .n.fold{color:var(--line2)}
.out .more{padding:10px 14px;font-family:var(--sans);font-size:13px;color:var(--muted)}
.out.fresh .rows{animation:fresh .35s ease-out}
@keyframes fresh{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.emp{height:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-family:var(--sans);font-size:14px;line-height:1.6}
.emp svg{width:40px;height:40px;margin:0 auto 6px;color:var(--line2)}
.busy{position:absolute;right:10px;top:10px;font:600 12px var(--sans);color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
/* syntax */
.k{color:var(--k)} .s{color:var(--s)} .nm{color:var(--n)} .b{color:var(--b);font-weight:600} .z{color:var(--z);font-style:italic} .p{color:var(--p)} .c{color:var(--c);font-style:italic} .h{color:var(--h);font-weight:700} .an{color:var(--a)} .bl{color:var(--s)} .dt{color:var(--n)}
/* status */
.status{margin:10px 0 0;display:grid;gap:8px}
.st{border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;border:1px solid transparent;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.st svg{width:18px;height:18px;flex:none;margin-top:1px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.ok b{font-weight:720}
.st.idle{background:var(--info-soft);color:var(--muted)}
.st.bad{background:var(--bad-soft);color:var(--ink);border-color:color-mix(in srgb,var(--bad) 30%,transparent);flex-direction:column;gap:6px;padding:11px 12px}
.st.bad .eh{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-weight:720}
.st.bad .et{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;min-width:0;flex:1}
.st.bad .et>span:last-child{min-width:0;flex:1 1 12em}
.st.bad .where{font:700 12px var(--sans);background:var(--bad);color:var(--paper);border-radius:6px;padding:2px 6px;white-space:nowrap;flex:none}
.st.bad .hint{color:var(--ink2);line-height:1.55;white-space:pre-line}
.ctx{align-self:stretch;margin:2px 0 0;font:12.5px/1.6 var(--mono);background:var(--paper);border-radius:8px;padding:6px 0;overflow-x:auto;white-space:pre;border:1px solid var(--line)}
.ctx .cl{display:block;padding:0 10px 0 0} .ctx .cn{display:inline-block;width:34px;text-align:right;color:var(--gut);margin-right:10px;user-select:none}
.ctx .cur{background:var(--bad-soft)} .ctx .car{color:var(--bad);font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.ab{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--paper);padding:0 14px;font-weight:680;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ab.pri{background:var(--bad);border-color:var(--bad);color:#fff}
.st.warn{background:var(--warn-soft);color:var(--warn);flex-direction:column;gap:2px;padding:4px 12px}
.st.warn summary,.st.warn ul,.st.warn .wmore{align-self:stretch}
.st.warn summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;list-style:none}
.st.warn summary::-webkit-details-marker{display:none}
.st.warn summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.st.warn[open] summary::after{transform:rotate(-135deg)}
.st.warn ul{margin:0 0 6px;padding:0;list-style:none;color:var(--ink2);display:grid;gap:0}
.st.warn li{display:flex;gap:6px;line-height:1.5;align-items:flex-start}
.st.warn li>span{padding-top:11px;padding-bottom:4px;min-width:0}
.st.warn li button{all:unset;cursor:pointer;flex:none;min-width:44px;height:44px;display:grid;place-items:center;margin-left:-8px;border-radius:8px}
.st.warn li button i{font:700 11.5px/22px var(--mono);font-style:normal;color:var(--warn);background:var(--paper);border-radius:5px;padding:0 6px;height:22px;display:block}
.st.warn li button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.st.warn .wmore{font-size:12.5px;color:var(--muted);padding:0 0 8px}
.notes{padding:8px 14px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:3px;line-height:1.5}
.notes div::before{content:"• ";color:var(--faint)}
/* options */
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.opts::-webkit-scrollbar{display:none}
.op{flex:none;min-height:36px;border:1px solid var(--line2);border-radius:99px;background:var(--paper);padding:0 12px;font-size:13px;font-weight:650;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;position:relative}
.op::after{content:"";position:absolute;inset:-4px 0}
.op[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.op:disabled{opacity:.4;cursor:default}
.op b{font:700 12px var(--mono)}
/* sheet & menu */
.scrim{position:fixed;inset:0;background:rgba(20,15,5,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet:focus{outline:none}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--pop);max-height:86vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 10px}
.sheet h3{margin:0 0 10px;font-size:16px}
.mi{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 12px;margin-bottom:8px;cursor:pointer;text-align:left}
.mi[aria-pressed="true"]{border-color:var(--fc,var(--ink));box-shadow:inset 0 0 0 1px var(--fc,var(--ink));background:var(--paper)}
.mi .bdg{flex:none;width:52px;height:30px;border-radius:7px;display:grid;place-items:center;font:750 12px var(--mono);background:var(--fsoft,var(--info-soft));color:var(--fc,var(--ink2))}
.mi .tx{flex:1;min-width:0} .mi .tx b{display:block;font-size:14.5px} .mi .tx span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.f-yaml{--fc:var(--yaml);--fsoft:var(--yaml-soft)} .f-json{--fc:var(--json);--fsoft:var(--json-soft)} .f-toml{--fc:var(--toml);--fsoft:var(--toml-soft)} .f-auto{--fc:var(--ink);--fsoft:var(--info-soft)}
.close{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--paper);font-weight:700;cursor:pointer;margin-top:4px}
/* option sheet */
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.orow:last-of-type{border-bottom:0}
.orow .ol b{display:block;font-size:14.5px} .orow .ol span{display:block;font-size:12.5px;color:var(--muted)}
.mseg{display:flex;border:1px solid var(--line2);border-radius:10px;padding:2px;gap:2px;flex:none}
.mseg button{min-width:52px;min-height:44px;border:0;border-radius:8px;background:transparent;font:700 13px var(--mono);cursor:pointer;color:var(--muted)}

<script id="yj-core">/*CORE-START*/
const YJ = (() => {

/* ---------- value model ----------

   TFloat (a float whose value happens to be integral, e.g. 1.0), TDate (dates/times),
   Array, Map (keeps key order exactly). */
class TFloat { constructor(v) { this.v = v; } }
class TDate { constructor(kind, raw, norm) { this.kind = kind; this.raw = raw; this.norm = norm || raw; } }
class PErr { constructor(msg, at, hint) { this.msg = msg; this.at = at; this.hint = hint || ''; } }
class CErr { constructor(msg, path, at, hint, fix) { this.msg = msg; this.path = path; this.at = at; this.hint = hint || ''; this.fix = fix || null; } }
const POS = new WeakMap();
function setPos(c, k, at) { let m = POS.get(c); if (!m) { m = new Map(); POS.set(c, m); } m.set(k, at); }
function posOf(c, k) { const m = c && POS.get(c); return m ? m.get(k) : undefined; }
const MAXD = 400;
const LIMIT = 3000000;
const DEEP = '括號或縮排一層包一層超過 400 層，通常是少了右括號、多了左括號，或資料自己參照自己。請檢查這附近的括號是否成對；真的這麼深的資料請先拆成幾份再轉換。';

  return { line, col, lineStart: ls };
}

function showCh(s, i) { const cp = s.codePointAt(i); if (cp === undefined) return ''; if (cp === 9) return 'Tab'; if (cp < 32) return 'U+' + cp.toString(16).toUpperCase().padStart(4, '0'); return String.fromCodePoint(cp); }

  if (Object.is(v, -0)) return '-0.0';
  let s = String(v);
  if (/e/.test(s)) { if (!s.includes('.')) s = s.replace('e', '.0e'); }

function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function okDate(y, m, d) { if (m < 1 || m > 12 || d < 1) return false; const dm = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; return d <= dm; }
function okTime(h, mi, s) { return h <= 23 && mi <= 59 && s <= 60; }
const p2 = x => String(x).padStart(2, '0');

/* YAML 1.1-style timestamp (resolved by most real-world YAML loaders). */
function yamlTimestamp(t) {
  let m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(t);
  if (m) return okDate(+m[1], +m[2], +m[3]) ? new TDate('ld', t, t) : null;
  m = /^(\d{4})-(\d\d?)-(\d\d?)(?:[Tt]|[ \t]+)(\d\d?):(\d\d):(\d\d)(\.\d*)?(?:[ \t]*(Z|[-+]\d\d?(?::?\d\d)?))?$/.exec(t);
  if (!m) return null;
  const [, Y, Mo, D, H, Mi, S, F, Z] = m;
  if (!okDate(+Y, +Mo, +D) || !okTime(+H, +Mi, +S)) return null;
  let norm = `${Y}-${p2(Mo)}-${p2(D)}T${p2(H)}:${Mi}:${S}${F && F.length > 1 ? F : ''}`;
  if (!Z) return new TDate('ldt', t, norm);
  if (Z === 'Z') norm += 'Z';
  else { const z = /^([-+])(\d\d?)(?::?(\d\d))?$/.exec(Z); if (+z[2] > 23 || +(z[3] || 0) > 59) return null; norm += z[1] + p2(z[2]) + ':' + (z[3] || '00'); }

/* YAML 1.2 core schema resolution of a plain scalar (no warnings). Returns {v} */
const YNULL = new Set(['', '~', 'null', 'Null', 'NULL']);
function mkInt(t, base) {
  let b;
  if (base === 10) b = BigInt(t.replace(/^\+/, ''));
  else b = BigInt((base === 16 ? '0x' : base === 8 ? '0o' : '0b') + t);

}
function mkFloat(v) { return Number.isInteger(v) ? new TFloat(v) : v; }
function yamlResolve(t) {
  if (YNULL.has(t)) return null;
  if (t === 'true' || t === 'True' || t === 'TRUE') return true;
  if (t === 'false' || t === 'False' || t === 'FALSE') return false;
  const c = t[0];
  if ((c >= '0' && c <= '9') || c === '-' || c === '+' || c === '.') {
    if (/^[-+]?[0-9]+$/.test(t)) return mkInt(t, 10);
    if (/^0o[0-7]+$/.test(t)) return mkInt(t.slice(2), 8);
    if (/^0x[0-9a-fA-F]+$/.test(t)) return mkInt(t.slice(2), 16);
    if (/^[-+]?(\.[0-9]+|[0-9]+(\.[0-9]*)?)([eE][-+]?[0-9]+)?$/.test(t)) return mkFloat(Number(t));

/* ======================= JSON ======================= */
function parseJSON(src) {
  const s = src, n = s.length; let i = 0, dups = 0; const warns = [];

  const lineOf = at => lineCol(s, at).line;
  function ws() {
    for (;;) {
      const c = s.charCodeAt(i);
      if (c === 32 || c === 10 || c === 13 || c === 9) { i++; continue; }

      if (c === 0xA0 || c === 0x3000) fail(c === 0x3000 ? '這裡有全形空白' : '這裡有不換行空白（NBSP）', i, 'JSON 只接受一般的半形空白，請把它刪掉或換成一般空白。');

    }
  }
  function word() { const m = /^[A-Za-z_$\u00c0-\uffff][\w$\u00c0-\uffff]*/.exec(s.slice(i, i + 40)); return m ? m[0] : ''; }
  function value(d) {
    ws();
    if (i >= n) fail('內容在這裡就結束了，少了一個值', i, '這個位置需要一個值：物件 { }、陣列 [ ]、字串、數字、true、false 或 null。');
    const c = s[i];
    if (c === '{') return obj(d);
    if (c === '[') return arr(d);
    if (c === '"') return str();
    if (c === '-' || (c >= '0' && c <= '9')) return num();
    if (s.startsWith('true', i) && !/[\w$]/.test(s[i + 4] || '')) { i += 4; return true; }
    if (s.startsWith('false', i) && !/[\w$]/.test(s[i + 5] || '')) { i += 5; return false; }
    if (s.startsWith('null', i) && !/[\w$]/.test(s[i + 4] || '')) { i += 4; return null; }
    if (c === "'" || c === '‘' || c === '’') fail('JSON 字串要用雙引號', i, '請把單引號改成半形雙引號 "。');
    if (c === '“' || c === '”') fail('這是全形（彎）引號', i, 'JSON 只認得半形的直引號 "，請把 “ ” 換掉。');

      if (/^(False|FALSE)$/.test(w)) fail(`「${w}」要寫成小寫的 false`, i, 'JSON 的布林值只有小寫的 true 和 false。');
      if (/^(None|NULL|Null|nil|undefined)$/.test(w)) fail(`「${w}」要寫成 null`, i, 'JSON 的空值只能寫成小寫的 null。');
      fail(`看不懂「${w}」`, i, `文字要用雙引號包起來，例如 "${w}"。`);
    }
    if (c === '.') fail('數字不能以小數點開頭', i, '請在前面補 0，例如 0.5。');
    if (c === '+') fail('JSON 的數字前面不能加 +', i, '正數直接寫數字即可，例如 5。');
    fail(`這裡不該出現「${showCh(s, i)}」`, i, '這個位置需要一個值：物件 { }、陣列 [ ]、字串、數字、true、false 或 null。');
  }
  function obj(d) {
    if (d > MAXD) fail(`巢狀太深（超過 ${MAXD} 層）`, i, DEEP);
    const open = i; i++; const m = new Map(); let lastComma = -1;
    ws(); if (s[i] === '}') { i++; return m; }
    for (;;) {
      ws();
      if (i >= n) fail('物件沒有結束，少了右大括號 }', n, `第 ${lineOf(open)} 行的 { 沒有對應的 }，請在最後補上。`);
      if (s[i] === '}' && lastComma >= 0) fail('最後一個項目後面多了逗號', lastComma, 'JSON 不允許尾逗號，請刪掉這個逗號。');

        if (s[i] === "'") fail('鍵名要用雙引號', i, '請把單引號改成雙引號 "。');

      ws();
      if (s[i] !== ':') fail('鍵名後面少了冒號 :', i, `請寫成 "${k}": 值。`);

        } else if (dups === 101) warns.push({ msg: '還有更多重複的鍵，只列出前 100 個；每個重複的鍵都只會保留後面的值', at: kAt });

      m.set(k, v);
      const end = i; ws();
      if (s[i] === ',') { lastComma = i; i++; continue; }
      if (s[i] === '}') { i++; return m; }
      if (i >= n) fail('物件沒有結束，少了右大括號 }', n, `第 ${lineOf(open)} 行的 { 沒有對應的 }，請在最後補上。`);
      if (s[i] === ']') fail('括號不成對：這裡應該用 } 結束物件', i, `第 ${lineOf(open)} 行是用 { 開始的，所以要用 } 結束。`);
      fail('兩個項目之間少了逗號', end, '請在這個值後面加上逗號「,」，或者用 } 結束物件。');
    }
  }
  function arr(d) {
    if (d > MAXD) fail(`巢狀太深（超過 ${MAXD} 層）`, i, DEEP);
    const open = i; i++; const a = []; let lastComma = -1;
    ws(); if (s[i] === ']') { i++; return a; }
    for (;;) {

  if (/\u0000/.test(text.slice(0, 4096))) { toast('這看起來不是文字檔'); return; }
  const prev = getText();
  fileBase = file.name.replace(/\.[^.]*$/, '') || 'converted'; LS.set('name', fileBase);
  const g = guessFmt(file.name);
  // Detection on the main thread only looks at the start of a big file; the worker checks the whole thing.
  if (g) { from = YJ.detect(text.length > 200000 ? text.slice(0, 50000) : text) === g ? 'auto' : g; LS.set('from', from); }
  if (g && g === to) { to = g === 'json' ? 'yaml' : 'json'; LS.set('to', to); }
  setText(text);
  toast(`已開啟 ${file.name}`, prev.trim() ? '復原' : null, () => setText(prev));
}
$('openBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { openFile(e.target.files[0]); e.target.value = ''; };
const ed = $('ed');
ed.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); $('drop').hidden = false; } });
ed.addEventListener('dragleave', e => { if (!ed.contains(e.relatedTarget)) $('drop').hidden = true; });
ed.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); $('drop').hidden = true; openFile(e.dataTransfer.files[0]); } });

/* ---------- swap / copy / share / download ---------- */
$('swapBtn').onclick = () => {
  if (!res || !res.ok || !res.out) { toast(res && res.error ? '先修正錯誤才能對調' : '目前沒有可對調的結果'); return; }
  const prev = getText(), prevFrom = from, prevTo = to, actual = res.from;
  const sb = $('swapBtn'); sb.classList.toggle('spin');
  from = to; to = actual && actual !== from ? actual : FMTS.find(f => f !== from);
  LS.set('from', from); LS.set('to', to);
  setText(res.out);
  toast(`已對調：${UP[from]} → ${UP[to]}`, '復原', () => { from = prevFrom; to = prevTo; LS.set('from', from); LS.set('to', to); setText(prev); });
};
function outText() { return res && res.ok && res.out ? res.out : ''; }
let copyT;
$('copyBtn').onclick = async () => {
  const t = outText();
  if (!t) { toast(res && res.error ? '有錯誤，還沒有結果可以複製' : '目前沒有可複製的結果'); return; }
  const ok = await copyText(t);
  const b = $('copyBtn');
  if (ok) {
    buzz(); b.classList.add('done'); b.querySelector('.t').textContent = '已複製';
    clearTimeout(copyT); copyT = setTimeout(() => { b.classList.remove('done'); b.querySelector('.t').textContent = '複製'; }, 1400);
    toast(`已複製 ${UP[to]}（${bytes(res.outBytes != null ? res.outBytes : u8len(t))}）`);
  } else toast('無法自動複製，請改用下載');
};
const fname = () => (fileBase || 'converted') + EXT[to];
$('shareBtn').onclick = async () => {
  const t = outText();
  if (!t) { toast('目前沒有可分享的結果'); return; }
  try {
    if (navigator.share) {
      const file = typeof File === 'function' ? new File([t], fname(), { type: 'text/plain' }) : null;
      if (t.length > 20000 && file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: fname() });
      else await navigator.share({ title: fname(), text: t });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const ok = await copyText(t);
  toast(ok ? '這裡無法直接分享，已改為複製到剪貼簿' : '無法分享，請改用下載');
};
let DL = null;
(async () => { try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { DL = null; } })();
$('dlBtn').onclick = async () => {
  const t = outText();
  if (!t) { toast('目前沒有可下載的結果'); return; }
  const name = fname();
  if (DL) {
    try { await DL.save({ filename: name, data: t }); toast('已下載 ' + name); }
    catch (e) { const m = String(e && (e.message || e.name)); toast(/declin|cancel|denied|abort/i.test(m) ? '已取消下載' : '下載失敗，請改用複製'); }
    return;
  }
  try {
    const u = URL.createObjectURL(new Blob([t], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    toast('已下載 ' + name);
  } catch (e) { toast('下載失敗，請改用複製'); }
};

/* ---------- init ---------- */
// First visit shows a sample; after that the last input comes back exactly, including an empty editor.
const saved = LS.get('src', null);
if (typeof saved === 'string') {
  applyText(saved); isSample = !!saved && !!LS.get('sample', false);
  syncGutter(); paintMeta(); paintHL(); paintRoute(); run(true);
  if (!saved && LS.get('lost', false)) toast('上次的內容超過 2.5 MB，沒有自動保存；請重新開啟檔案', null, null, 4000);
} else loadSample(0);
window.addEventListener('resize', () => { measureLH(); hlFrom = -1; syncScroll(); outV.from = -1; outV.paint(); inV.from = -1; if (bigMode) inV.paint(); });
window.__yj = { get res() { return res; }, get big() { return bigMode; }, text: getText, run: () => run(true), YJ };
window.__yjReady = true;
})();
</script>
