<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>番茄專注板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: kitchen-timer dial on the left, task ledger on the right; stacks to one column on phones */
:root {
  --bg: #f3f1ee;
  --surface: #fffdfa;
  --ink: #2b2522;
  --muted: #7a6f69;
  --line: #e4ddd6;
  --focus: #d2492f;
  --break: #3f8a6e;
  --long: #3d6fa8;
  --mode: var(--focus);
  --mode-soft: color-mix(in srgb, var(--mode) 13%, var(--surface));
  --display: "Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --leaf: #4f8a3a;
  --pot: #b8714d;
  --wilt: #a8977f;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1817; --surface: #252120; --ink: #f1ebe6; --muted: #a59a93; --line: #3a3431;
    --focus: #f0694d; --break: #5fb592; --long: #6c9bd6; color-scheme: dark;
    --leaf: #7fbf68; --pot: #b0704f; --wilt: #8a7d6c;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1817; --surface: #252120; --ink: #f1ebe6; --muted: #a59a93; --line: #3a3431;
  --focus: #f0694d; --break: #5fb592; --long: #6c9bd6; color-scheme: dark;
  --leaf: #7fbf68; --pot: #b0704f; --wilt: #8a7d6c;
}
body[data-mode="short"] { --mode: var(--break); }
body[data-mode="long"] { --mode: var(--long); }
body { --mode-soft: color-mix(in srgb, var(--mode) 13%, var(--surface)); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--body);
  padding-inline: 16px; padding-block: 20px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--mode); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .wrap { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } }

header.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--mode); display: inline-block; transition: background .4s; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
@media (hover: hover) { .iconbtn:hover { background: var(--line); color: var(--ink); } }

/* Timer panel */
.timer { grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px 24px; display: grid; gap: 18px; justify-items: center; }
.modes { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 999px; width: 100%; max-width: 360px; }
.modes button { flex: 1; padding: 8px 0; border-radius: 999px; font-size: .9rem; color: var(--muted); font-weight: 500; transition: background .25s, color .25s; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--mode); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }

.dial { position: relative; width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { stroke: var(--line); }
.dial .ticks line { stroke: var(--muted); opacity: .35; }
.dial .prog { stroke: var(--mode); transition: stroke .4s; }
.dial .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.time { font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 15vw, 4.4rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.phase { font-size: .82rem; color: var(--muted); letter-spacing: .08em; }
.current { font-size: .9rem; max-width: 190px; margin: 6px auto 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.current:empty { display: none; }

.rounds { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .8rem; }
.rounds span.d { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--mode); transition: background .3s; }
.rounds span.d.on { background: var(--mode); }

.controls { display: flex; gap: 14px; align-items: center; }
.main-btn { min-width: 150px; height: 56px; border-radius: 999px; background: var(--mode); color: #fff; font-size: 1.1rem; font-weight: 700; letter-spacing: .1em; box-shadow: 0 6px 18px color-mix(in srgb, var(--mode) 35%, transparent); transition: transform .12s, background .4s; }
.main-btn:active { transform: scale(.97); }
.side-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
@media (hover: hover) { .side-btn:hover { color: var(--ink); } }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; border-top: 1px solid var(--line); padding-top: 14px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: .76rem; letter-spacing: .06em; }

/* Tasks */
.tasks { grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.tasks h2 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tasks h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
form.add { display: flex; gap: 8px; }
form.add input[type=text] { flex: 1; min-width: 0; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px; font: inherit; font-size: 16px; }
.est { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.est button { width: 30px; height: 44px; color: var(--muted); font-size: 1.1rem; }
.est output { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
form.add .go { height: 46px; padding: 0 16px; border-radius: 10px; background: var(--ink); color: var(--surface); font-weight: 500; white-space: nowrap; }

ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 8px 10px 10px; border-radius: 10px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
@media (hover: hover) { li.task:hover { background: var(--bg); } }
li.task.active { border-color: var(--mode); background: var(--mode-soft); }
.chk { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; }
li.task.done .chk { background: var(--break); border-color: var(--break); color: #fff; }
.body { min-width: 0; text-align: left; padding: 2px 0; }
.body .t { display: block; overflow-wrap: anywhere; }
li.task.done .t { text-decoration: line-through; color: var(--muted); }
.pips { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; align-items: center; font-size: .72rem; color: var(--muted); }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--focus); }
.pips i.f { background: var(--focus); }
.pips em { font-style: normal; margin-left: 4px; }
.tag { font-size: .68rem; padding: 1px 6px; border-radius: 4px; background: var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.del { width: 34px; height: 34px; border-radius: 8px; color: var(--muted); opacity: .6; display: grid; place-items: center; }
@media (hover: hover) { .del:hover { opacity: 1; background: var(--line); } }
/* Touch: lift small controls to ~44px hit areas (Apple HIG / Material); the check circle keeps its look and gets an invisible ring. */
@media (pointer: coarse) {
  .modes button { min-height: 44px; }
  .sound button { min-height: 40px; }
  .est button { width: 40px; }
  .chk { position: relative; }
  .chk::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
  .del { width: 44px; height: 44px; opacity: .75; }
}
.empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }
.footer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.linkbtn { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.hint { font-size: .78rem; color: var(--muted); margin: 0; }

/* Settings sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; align-items: end; justify-items: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 440px; border-radius: 18px 18px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0; font-size: 1.05rem; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row label { font-size: .95rem; }
.row input[type=number] { width: 76px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; font: inherit; font-size: 16px; }
.row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--mode); }
.sheet .done-btn { height: 46px; border-radius: 10px; background: var(--mode); color: #fff; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); text-align: center; }

/* Plant growing in the dial during focus */
.plant { width: 52px; height: 52px; margin: 0 auto 2px; }
.plant:empty { display: none; }
.plant svg, .trees svg { width: 100%; height: 100%; display: block; overflow: visible; }
svg .pot { fill: var(--pot); }
svg .stem { stroke: var(--leaf); stroke-width: 2.4; stroke-linecap: round; fill: none; }
svg .leaf { fill: var(--leaf); }
svg .fruit { fill: var(--focus); }
svg.dead .stem { stroke: var(--wilt); }
svg.dead .leaf { fill: var(--wilt); }

/* Ambient sound row */
.sound { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; width: 100%; }
.sound .sl { font-size: .8rem; color: var(--muted); letter-spacing: .06em; }
.sound button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.sound button[aria-pressed="true"] { border-color: var(--mode); color: var(--mode); background: var(--mode-soft); font-weight: 500; }
.sound input[type=range] { width: 110px; accent-color: var(--mode); }

/* Right column: tasks + history */
.col { display: grid; gap: 20px; min-width: 0; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.hist h2 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hist h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--focus); opacity: .38; }
.chart .bar.today { opacity: 1; }
.chart .grid { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart text.v { fill: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.forest { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.fh { font-size: .9rem; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.fh small { color: var(--muted); font-weight: 400; font-size: .8rem; }
.trees { display: flex; flex-wrap: wrap; gap: 4px; min-height: 34px; align-items: end; }
.trees span { width: 30px; height: 30px; }
.trees p { margin: 0; color: var(--muted); font-size: .85rem; }
.flash { animation: flash 1s ease 3; }
@keyframes flash { 50% { background: var(--mode-soft); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>番茄專注板</div>
    <button class="iconbtn" id="openSettings" aria-label="設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

<script>
(() => {
  const KEY = 'pomodoro-todo-v1';
  const $ = id => document.getElementById(id);
  const LABEL = { focus: '專注中', short: '短休息', long: '長休息' };
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = () => dayKey(new Date());

  const defaults = {
    cfg: { focus: 25, short: 5, long: 15, every: 4, auto: false, sound: true, plant: true, noise: true },
    noise: 'off', vol: 50, history: {}, forest: { day: today(), items: [] }, plantDead: false, leftAt: null,
    mode: 'focus', round: 0, remaining: 25 * 60, endAt: null,
    activeId: null,
    stats: { day: today(), pomos: 0, mins: 0, done: 0 },
    tasks: [
      { id: 'ex1', text: '範例：整理本週工作重點', est: 2, done: 0, ok: false, ex: true },
      { id: 'ex2', text: '範例：讀完一章書', est: 3, done: 1, ok: false, ex: true },
      { id: 'ex3', text: '範例：回覆重要信件', est: 1, done: 1, ok: true, ex: true }
    ]
  };

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.cfg) S = structuredClone(defaults);
  S.cfg = Object.assign({}, defaults.cfg, S.cfg);
  for (const k of ['noise', 'vol', 'history', 'forest', 'plantDead', 'leftAt']) if (S[k] === undefined) S[k] = structuredClone(defaults[k]);
  // Carry today's count from before history existed
  if (S.stats.day === today() && S.stats.pomos && !S.history[today()]) S.history[today()] = { p: S.stats.pomos, m: S.stats.mins };
  function rollDay() {
    if (S.stats.day !== today()) S.stats = { day: today(), pomos: 0, mins: 0, done: 0 };
    if (S.forest.day !== today()) S.forest = { day: today(), items: [] };
  }
  rollDay();
  if (!S.activeId && S.tasks.length) S.activeId = (S.tasks.find(t => !t.ok) || {}).id || null;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const dur = m => S.cfg[m] * 60;

  // Dial ticks: one per minute of the current mode (capped), like a kitchen timer face
  const R = 88, C = 2 * Math.PI * R;
  const prog = $('prog');
  prog.style.strokeDasharray = C;
  function drawTicks() {
    const n = Math.min(S.cfg[S.mode], 60), g = $('ticks');
    g.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 2 * Math.PI, big = i % 5 === 0;
      const r1 = 74, r2 = big ? 66 : 70;
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', 100 + r1 * Math.cos(a)); l.setAttribute('y1', 100 + r1 * Math.sin(a));
      l.setAttribute('x2', 100 + r2 * Math.cos(a)); l.setAttribute('y2', 100 + r2 * Math.sin(a));
      l.setAttribute('stroke-width', big ? 2 : 1);
      g.appendChild(l);
    }
  }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const left = () => S.endAt ? (S.endAt - Date.now()) / 1000 : S.remaining;

  // Tomato seedling: stem grows with progress, leaves unfold, a tomato appears when the session completes
  function plantSVG(p, dead) {
    const h = 6 + p * 28, top = 44 - h, bend = dead ? 9 : 0;
    let s = `<svg viewBox="0 0 60 60" aria-hidden="true"${dead ? ' class="dead"' : ''}>`;
    s += `<path class="stem" d="M30 44 Q ${30 + bend * 0.3} ${44 - h / 2} ${30 + bend} ${top + (dead ? 4 : 0)}"/>`;
    [[0.15, 0.3], [0.4, 0.55], [0.65, 0.8]].forEach(([t, f]) => {
      if (p < t) return;
      const y = 44 - h * f, x = 30 + bend * f * f, rx = Math.min(7, 3 + (p - t) * 14), dr = dead ? 35 : 0;
      s += `<ellipse class="leaf" cx="${x - rx}" cy="${y}" rx="${rx}" ry="${rx * 0.42}" transform="rotate(${-22 + dr} ${x} ${y})"/>`;
      s += `<ellipse class="leaf" cx="${x + rx}" cy="${y}" rx="${rx}" ry="${rx * 0.42}" transform="rotate(${22 + dr} ${x} ${y})"/>`;
    });
    if (!dead && p >= 1) s += `<circle class="fruit" cx="30" cy="${top - 4}" r="7"/><path class="leaf" d="M26 ${top - 10} l4 2.5 4-2.5-2 3.5h-4z"/>`;
    else if (!dead && p > 0.85) s += `<circle class="leaf" cx="30" cy="${top - 1}" r="2.6"/>`;
    s += `<path class="pot" d="M19 47h22l-3 11H22z"/><rect class="pot" x="17" y="43" width="26" height="5" rx="1.5"/></svg>`;
    return s;
  }
  let plantKey = '';
  function renderPlant(l, total) {
    const show = S.cfg.plant && S.mode === 'focus';
    const p = show ? Math.round(Math.max(0, Math.min(1, 1 - l / total)) * 40) / 40 : -1;
    const key = show ? p + (S.plantDead ? 'd' : '') : '';
    if (key === plantKey) return;
    plantKey = key;
    $('plant').innerHTML = show ? plantSVG(p, S.plantDead) : '';
  }

  function renderTimer() {
    const l = left(), total = dur(S.mode);
    renderPlant(l, total);
    $('time').textContent = fmt(l);
    prog.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, l / total)));
    document.title = S.endAt ? `${fmt(l)} · ${LABEL[S.mode]}` : '番茄專注板';
  }

  function renderMode() {
    document.body.dataset.mode = S.mode;
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
    $('phase').textContent = S.endAt ? LABEL[S.mode] : (S.remaining < dur(S.mode) ? '已暫停' : LABEL[S.mode]);
    $('toggle').textContent = S.endAt ? '暫停' : (S.remaining < dur(S.mode) ? '繼續' : '開始');
    document.body.classList.toggle('running', !!S.endAt);
    const t = S.tasks.find(t => t.id === S.activeId);
    $('current').textContent = S.mode === 'focus' && t && !t.ok ? t.text.replace(/^範例：/, '') : '';
    const r = $('rounds'); r.innerHTML = '';
    for (let i = 0; i < S.cfg.every; i++) { const d = document.createElement('span'); d.className = 'd' + (i < S.round ? ' on' : ''); r.appendChild(d); }
    const lbl = document.createElement('span'); lbl.textContent = `第 ${Math.min(S.round + 1, S.cfg.every)} / ${S.cfg.every} 輪`; r.appendChild(lbl);
    drawTicks(); renderTimer();
  }

  function renderStats() {
    $('sPomo').textContent = S.stats.pomos;
    $('sMin').textContent = S.stats.mins;
    $('sDone').textContent = S.stats.done;
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderTasks() {
    const ul = $('list');
    const open = S.tasks.filter(t => !t.ok), shown = [...open, ...S.tasks.filter(t => t.ok)];
    if (!shown.length) { ul.innerHTML = '<li class="empty">還沒有任務。在上方輸入一件事，按「新增」開始。</li>'; }
    else ul.innerHTML = shown.map(t => {
      const pips = Array.from({ length: Math.max(t.est, t.done) }, (_, i) => `<i class="${i < t.done ? 'f' : ''}"></i>`).join('');
      const text = t.ex ? esc(t.text.replace(/^範例：/, '')) + '<span class="tag">範例</span>' : esc(t.text);
      return `<li class="task${t.ok ? ' done' : ''}${t.id === S.activeId && !t.ok ? ' active' : ''}" data-id="${t.id}">
        <button class="chk" data-act="check" aria-label="${t.ok ? '標為未完成' : '標為完成'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
        <button class="body" data-act="select"><span class="t">${text}</span><span class="pips">${pips}<em>${t.done}/${t.est}</em></span></button>
        <button class="del" data-act="del" aria-label="刪除任務"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </li>`;
    }).join('');
    const remainPomos = open.reduce((a, t) => a + Math.max(0, t.est - t.done), 0);
    $('remain').textContent = open.length ? `${open.length} 項未完成` : '';
    if (remainPomos) {
      const mins = remainPomos * (S.cfg.focus + S.cfg.short);
      const end = new Date(Date.now() + mins * 60000);
      $('eta').textContent = `剩 ${remainPomos} 個番茄，約 ${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')} 完成`;
    } else $('eta').textContent = '';
    $('clearDone').hidden = !S.tasks.some(t => t.ok);
    renderMode();
  }

  // Sound: short three-note chime via WebAudio, unlocked by the first tap
  let ac;
  function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function chime() {
    if (!S.cfg.sound || !ac) return;
    [0, .22, .44].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = [880, 1046.5, 1318.5][i];
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.6);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.65);
    });
  }

  // Ambient sound, synthesized from a looping white-noise buffer through filters (no audio files to download)
  let noise = null;
  function stopNoise() {
    if (!noise) return;
    const n = noise; noise = null;
    try { n.master.gain.setTargetAtTime(0, ac.currentTime, 0.15); setTimeout(() => n.stops.forEach(x => { try { x.stop(); } catch (e) {} }), 600); } catch (e) {}
  }
  function startNoise(kind) {
    stopNoise();
    if (!ac || kind === 'off') return;
    const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const stops = [src];
    const lfo = (freq, depth, param) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = freq; g.gain.value = depth; o.connect(g).connect(param); o.start(); stops.push(o); };
    const bq = (type, f, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; return b; };
    const base = ac.createGain();
    if (kind === 'rain') {
      const hp = bq('highpass', 900), lp = bq('lowpass', 7000);
      base.gain.value = 0.35; lfo(0.23, 0.05, base.gain);
      src.connect(hp).connect(lp).connect(base);
    } else if (kind === 'waves') {
      const lp = bq('lowpass', 600);
      lfo(0.09, 420, lp.frequency);
      base.gain.value = 0.55; lfo(0.09, 0.4, base.gain);
      src.connect(lp).connect(base);
    } else {
      const lp = bq('lowpass', 160), lp2 = bq('lowpass', 400);
      base.gain.value = 2.2;
      src.connect(lp).connect(lp2).connect(base);
    }
    base.connect(master);
    src.start();
    noise = { kind, master, stops };
    setVol();
  }
  function setVol() {
    if (noise) noise.master.gain.setTargetAtTime(Math.pow(S.vol / 100, 2) * 0.9, ac.currentTime, 0.3);
  }
  let preview = 0;
  function syncNoise() {
    const want = S.noise !== 'off' && (preview > Date.now() || !S.cfg.noise || (S.endAt && S.mode === 'focus')) ? S.noise : 'off';
    if ((noise ? noise.kind : 'off') !== want) startNoise(want);
  }
  function renderNoise() {
    document.querySelectorAll('.sound button').forEach(b => b.setAttribute('aria-pressed', b.dataset.snd === S.noise));
    $('vol').value = S.vol; $('vol').hidden = S.noise === 'off';
  }
  document.querySelectorAll('.sound button').forEach(b => b.onclick = () => {
    unlockAudio(); S.noise = b.dataset.snd; save(); renderNoise();
    // Let the sound play for a few seconds as a preview even when the timer is stopped
    preview = Date.now() + 4000; syncNoise(); setTimeout(syncNoise, 4100);
  });
  $('vol').oninput = () => { S.vol = +$('vol').value; setVol(); };
  $('vol').onchange = () => save();
  document.addEventListener('pointerdown', () => { if (!ac) { unlockAudio(); syncNoise(); } }, { once: true });

  let wake = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
      if (!on && wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; }
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
  }

  function setMode(m, keepRunning) {
    S.mode = m; S.remaining = dur(m); S.plantDead = false; S.leftAt = null;
    S.endAt = keepRunning ? Date.now() + S.remaining * 1000 : null;
    save(); renderMode(); syncNoise();
  }

  function start() { unlockAudio(); S.endAt = Date.now() + S.remaining * 1000; keepAwake(true); save(); renderMode(); syncNoise(); }
  function pause() { S.remaining = Math.max(0, left()); S.endAt = null; keepAwake(false); save(); renderMode(); syncNoise(); }

  function finish(skipped) {
    const was = S.mode;
    if (was === 'focus' && !skipped) {
      rollDay();
      S.stats.pomos++; S.stats.mins += S.cfg.focus;
      const t = S.tasks.find(t => t.id === S.activeId && !t.ok);
      if (t) t.done++;
      S.round++;
      const h = S.history[today()] || (S.history[today()] = { p: 0, m: 0 });
      h.p++; h.m += S.cfg.focus;
      if (S.cfg.plant) S.forest.items.push(S.plantDead ? 0 : 1);
      // Keep about a year of history
      const keys = Object.keys(S.history).sort();
      while (keys.length > 400) delete S.history[keys.shift()];
    }
    let next;
    if (was === 'focus') next = S.round >= S.cfg.every ? 'long' : 'short';
    else { next = 'focus'; if (was === 'long') S.round = 0; }
    if (!skipped) {
      chime();
      try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
      $('timerPanel').classList.remove('flash'); void $('timerPanel').offsetWidth; $('timerPanel').classList.add('flash');
      toast(was === 'focus' ? '完成一個番茄！休息一下吧' : '休息結束，回來專注');
    }
    setMode(next, S.cfg.auto && !skipped);
    if (!S.endAt) keepAwake(false);
    renderStats(); renderTasks(); renderHist();
  }

  function tick() {
    if (S.endAt && left() <= 0) finish(false);
    else if (S.endAt) renderTimer();
  }
  setInterval(tick, 250);
  // Leaving the page mid-focus for more than 15 s withers the seedling (the timer itself keeps going)
  const focusing = () => S.endAt && S.mode === 'focus' && S.cfg.plant;
  function checkWither() {
    if (S.leftAt && focusing() && !S.plantDead && Date.now() - S.leftAt > 15000) {
      S.plantDead = true; toast('離開太久，番茄苗枯萎了');
    }
    S.leftAt = null; save();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (focusing()) { S.leftAt = Date.now(); save(); } return; }
    checkWither(); tick(); if (S.endAt) keepAwake(true);
  });

  // 7-day bar chart + today's tomato patch
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  function renderHist() {
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ d, v: S.history[dayKey(d)] || { p: 0, m: 0 } }); }
    const max = Math.max(4, ...days.map(x => x.v.p));
    const W = 320, H = 150, top = 18, bottom = 124, bw = 26, step = W / 7;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 7 天每日番茄數">`;
    svg += `<line class="grid" x1="0" x2="${W}" y1="${bottom}" y2="${bottom}"/><line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}" stroke-dasharray="3 4"/>`;
    svg += `<text x="${W}" y="${top - 5}" text-anchor="end">${max}</text>`;
    days.forEach((x, i) => {
      const cx = step * i + step / 2, h = (x.v.p / max) * (bottom - top), isToday = i === 6;
      if (x.v.p) svg += `<rect class="bar${isToday ? ' today' : ''}" x="${cx - bw / 2}" y="${bottom - h}" width="${bw}" height="${h}" rx="4"/>`;
      if (x.v.p) svg += `<text class="v" x="${cx}" y="${bottom - h - 5}" text-anchor="middle">${x.v.p}</text>`;
      svg += `<text x="${cx}" y="${bottom + 18}" text-anchor="middle"${isToday ? ' class="v"' : ''}>${isToday ? '今天' : WD[x.d.getDay()]}</text>`;
    });
    $('chart').innerHTML = svg + '</svg>';
    const tp = days.reduce((a, x) => a + x.v.p, 0), tm = days.reduce((a, x) => a + x.v.m, 0);
    let streak = 0;
    for (let i = 6; i >= 0; i--) { if (days[i].v.p) streak++; else if (i !== 6) break; }
    $('weekSum').textContent = tp ? `共 ${tp} 個番茄・${tm >= 60 ? Math.floor(tm / 60) + ' 小時 ' : ''}${tm % 60} 分` + (streak > 1 ? `・連續 ${streak} 天` : '') : '完成第一個番茄後開始累積';
    const items = S.forest.day === today() ? S.forest.items : [];
    const ok = items.filter(Boolean).length, dead = items.length - ok;
    $('trees').innerHTML = items.length ? items.map(v => `<span title="${v ? '完成的番茄' : '枯萎的番茄苗'}">${v ? plantSVG(1, false) : plantSVG(0.55, true)}</span>`).join('')
      : '<p>' + (S.cfg.plant ? '今天還沒種下番茄。專注完成一次，這裡就會長出一株。' : '番茄苗已在設定中關閉。') + '</p>';
    $('forestNote').textContent = items.length ? `收成 ${ok} 顆${dead ? `・枯萎 ${dead} 株` : ''}` : '';
  }

  // Controls
  $('toggle').onclick = () => S.endAt ? pause() : start();
  $('reset').onclick = () => { S.endAt = null; S.remaining = dur(S.mode); S.plantDead = false; keepAwake(false); save(); renderMode(); syncNoise(); };
  $('skip').onclick = () => finish(true);
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { if (b.dataset.mode !== S.mode) { keepAwake(false); setMode(b.dataset.mode, false); } });

  // Tasks
  let est = 1;
  const setEst = v => { est = Math.max(1, Math.min(10, v)); $('estVal').textContent = est; };
  $('estMinus').onclick = () => setEst(est - 1);
  $('estPlus').onclick = () => setEst(est + 1);
  $('addForm').onsubmit = e => {
    e.preventDefault();
    const v = $('newTask').value.trim(); if (!v) { $('newTask').focus(); return; }
    // First real task clears the example rows
    if (S.tasks.length && S.tasks.every(t => t.ex)) S.tasks = [];
    const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: v, est, done: 0, ok: false };
    S.tasks.push(t);
    if (!S.activeId || !S.tasks.find(x => x.id === S.activeId && !x.ok)) S.activeId = t.id;
    $('newTask').value = ''; setEst(1); save(); renderTasks();
  };
  $('list').onclick = e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const id = btn.closest('li').dataset.id, t = S.tasks.find(t => t.id === id); if (!t) return;
    if (btn.dataset.act === 'check') {
      t.ok = !t.ok; S.stats.done += t.ok ? 1 : -1; S.stats.done = Math.max(0, S.stats.done);
      if (t.ok && S.activeId === id) S.activeId = (S.tasks.find(x => !x.ok) || {}).id || null;
    } else if (btn.dataset.act === 'select') { if (!t.ok) S.activeId = id; }
    else if (btn.dataset.act === 'del') {
      S.tasks = S.tasks.filter(x => x.id !== id);
      if (S.activeId === id) S.activeId = (S.tasks.find(x => !x.ok) || {}).id || null;
    }
    save(); renderTasks(); renderStats();
  };
  $('clearDone').onclick = () => { S.tasks = S.tasks.filter(t => !t.ok); save(); renderTasks(); };

  // Settings
  const fields = { cFocus: 'focus', cShort: 'short', cLong: 'long', cEvery: 'every' };
  $('openSettings').onclick = () => {
    for (const [id, k] of Object.entries(fields)) $(id).value = S.cfg[k];
    $('cAuto').checked = S.cfg.auto; $('cSound').checked = S.cfg.sound; $('cPlant').checked = S.cfg.plant; $('cNoise').checked = S.cfg.noise;
    $('sheet').hidden = false;
  };
  function closeSettings() {
    const oldDur = dur(S.mode);
    for (const [id, k] of Object.entries(fields)) {
      const el = $(id), v = parseInt(el.value, 10);
      if (v >= +el.min && v <= +el.max) S.cfg[k] = v;
    }
    S.cfg.auto = $('cAuto').checked; S.cfg.sound = $('cSound').checked; S.cfg.plant = $('cPlant').checked; S.cfg.noise = $('cNoise').checked;
    if (S.cfg.sound) unlockAudio();
    if (!S.endAt && (S.remaining === oldDur || dur(S.mode) !== oldDur)) S.remaining = dur(S.mode);
    S.round = Math.min(S.round, S.cfg.every);
    $('sheet').hidden = true; save(); renderTasks(); renderHist(); syncNoise();
  }
  $('closeSettings').onclick = closeSettings;
  $('sheet').onclick = e => { if (e.target === $('sheet')) closeSettings(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('sheet').hidden) closeSettings();
    if (e.code === 'Space' && $('sheet').hidden && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); $('toggle').click(); }
  });

  // A timer that ended while the page was closed
  checkWither();
  if (S.endAt && left() <= 0) finish(false);
  if (S.endAt) keepAwake(true);
  renderStats(); renderTasks(); renderHist(); renderNoise();
})();
</script>
