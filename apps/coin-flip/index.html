<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>猜拳與硬幣</title>
<style>
:root{
  --bg:#e4e9e3; --felt:#d3ddd2; --surface:#f7f9f6; --ink:#1c2620; --muted:#55635a; --line:#bccabd; --line-strong:#83958a;
  --accent:#2c5a43; --accent-ink:#ffffff; --accent-soft:#d5e5da;
  --coin-hi:#f3d98a; --coin-mid:#d4a945; --coin-lo:#9c7322; --coin-rim:#86621c; --coin-ink:#6b4c12; --coin-glint:rgba(255,255,255,.55);
  --win:#1e7a4a; --lose:#b2332a; --draw:#7a6a2a; --p2:#3a5a8c; --p1:#9a4a2a;
  --focus:#2c5a43; --shadow:0 18px 26px -18px rgba(28,38,32,.55);
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121714; --felt:#18201b; --surface:#1d2520; --ink:#e3ebe5; --muted:#9aaba0; --line:#2d3a32; --line-strong:#4f6357;
  --accent:#8fd0ab; --accent-ink:#0d2318; --accent-soft:#213328;
  --coin-hi:#f0d483; --coin-mid:#c99c3a; --coin-lo:#8a641c; --coin-rim:#6f5014; --coin-ink:#5c400d; --coin-glint:rgba(255,255,255,.45);
  --win:#7fe0a7; --lose:#ff9086; --draw:#e3cf7a; --p2:#9bb8ff; --p1:#ffb08a;
  --focus:#8fd0ab; --shadow:0 18px 26px -18px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121714; --felt:#18201b; --surface:#1d2520; --ink:#e3ebe5; --muted:#9aaba0; --line:#2d3a32; --line-strong:#4f6357;
  --accent:#8fd0ab; --accent-ink:#0d2318; --accent-soft:#213328;
  --coin-hi:#f0d483; --coin-mid:#c99c3a; --coin-lo:#8a641c; --coin-rim:#6f5014; --coin-ink:#5c400d; --coin-glint:rgba(255,255,255,.45);
  --win:#7fe0a7; --lose:#ff9086; --draw:#e3cf7a; --p2:#9bb8ff; --p1:#ffb08a;
  --focus:#8fd0ab; --shadow:0 18px 26px -18px rgba(0,0,0,.9); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.top h1{font-size:18px;margin:0 auto 0 0;letter-spacing:.06em}
.tabs{display:inline-flex;background:var(--felt);border-radius:22px;padding:3px}
.tabs button{min-height:40px;min-width:62px;border:0;background:transparent;border-radius:19px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.icon-btn{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:22px;cursor:pointer;display:inline-grid;place-items:center;padding:0 10px}
.icon-btn svg{width:20px;height:20px}
.panes{display:grid;gap:16px}
@media (min-width:920px){.panes{grid-template-columns:1fr 1fr;align-items:start}.panes .pane{display:block!important}.top .tabs{display:none}}
.pane{background:var(--felt);border-radius:18px;padding:14px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;min-width:52px;padding:0 12px;border:0;border-left:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar .lab{font-size:13px;color:var(--muted)}
/* coin */
.stage{position:relative;height:min(78vw,330px,62vh);min-height:200px;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;align-content:flex-end;gap:8px 12px;padding-bottom:22px;perspective:900px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.stage::after{content:"";position:absolute;left:50%;bottom:12px;width:min(62vw,250px);height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.25),transparent);pointer-events:none}
.coin{--d:min(58vw,230px,40vh);width:var(--d);height:var(--d);position:relative;transform-style:preserve-3d}
.stage.n3 .coin{--d:min(25vw,104px)}
.stage.n5 .coin{--d:min(23vw,88px)}
.spin{position:absolute;inset:0;transform-style:preserve-3d}
.face,.slice{position:absolute;inset:0;border-radius:50%}
.slice{background:var(--coin-rim)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,var(--coin-glint),transparent 34%),radial-gradient(circle at 50% 50%,var(--coin-hi) 0 52%,var(--coin-mid) 53% 63%,var(--coin-hi) 64% 70%,var(--coin-mid) 71% 88%,var(--coin-lo) 89% 100%);
  box-shadow:inset 0 0 0 calc(var(--d)*.02) var(--coin-lo)}
.face span{font-family:var(--serif);font-weight:900;font-size:calc(var(--d)*.34);color:var(--coin-ink);text-shadow:0 1px 0 var(--coin-glint),0 -1px 0 rgba(0,0,0,.25);line-height:1;max-width:80%;text-align:center;word-break:break-all}
.face span.long{font-size:calc(var(--d)*.2)}
.face.back{transform:rotateX(180deg) translateZ(calc(var(--d)*.035))}
.face.front{transform:translateZ(calc(var(--d)*.035))}
.result{font-size:36px;font-weight:800;text-align:center;min-height:54px;margin:4px 0 0;font-family:var(--serif);letter-spacing:.06em}
.major{text-align:center;font-size:15px;color:var(--muted);min-height:22px;margin:0}
.flip-btn{display:block;width:100%;min-height:58px;margin-top:10px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;letter-spacing:.2em;cursor:pointer}
.flip-btn:disabled{opacity:.6}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 0}
.stats{background:var(--surface);border-radius:12px;padding:12px;margin-top:12px}
.stats h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.nums div{background:var(--felt);border-radius:8px;padding:6px 2px}
.nums b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.nums small{font-size:12px;color:var(--muted)}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:24px}
.seq i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--coin-mid);color:var(--coin-ink)}
.seq i.t{background:transparent;border:1.5px solid var(--coin-lo);color:var(--ink)}
.seq i.e{background:var(--lose);color:#fff}
.link-btn{min-height:44px;border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:0 6px;font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--felt);font-size:13px;font-weight:600}
.confirm span{flex:1;min-width:9em}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:600}
.btn.danger{border-color:var(--lose);color:var(--lose)}
details.set{margin-top:12px;background:var(--surface);border-radius:12px}
details.set summary{min-height:48px;padding:0 12px;display:flex;align-items:center;cursor:pointer;font-weight:700;font-size:14px}
.set-body{padding:0 12px 12px;display:grid;gap:8px}
.set-body label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-height:44px}
.set-body input[type=text]{width:7em;min-height:44px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;background:var(--bg);text-align:center}
.set-body input[type=checkbox],.sw input{width:22px;height:22px;accent-color:var(--accent)}
/* rps */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 4px;text-align:center}
.hand{width:min(30vw,128px);height:min(30vw,128px);margin:0 auto;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:min(15vw,64px);box-shadow:var(--shadow);border:3px solid transparent;transition:border-color .2s}
.hand.win{border-color:var(--win)}.hand.lose{border-color:var(--lose)}.hand.draw{border-color:var(--draw)}
.who{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.vs .x{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--muted)}
.shake{animation:shake .33s ease-in-out}
@keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px) rotate(-8deg)}}
.call{text-align:center;font-family:var(--serif);font-size:28px;font-weight:900;min-height:44px;margin:8px 0 0;letter-spacing:.1em}
.call.win{color:var(--win)}.call.lose{color:var(--lose)}.call.draw{color:var(--draw)}
.picks{display:flex;justify-content:center;gap:12px;margin-top:10px}
.pick{width:84px;height:84px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);font-size:38px;cursor:pointer;display:grid;place-items:center;position:relative;line-height:1}
.pick small{position:absolute;bottom:-20px;left:0;right:0;font-size:12px;color:var(--muted);font-weight:600}
.pick:disabled{opacity:.5;cursor:default}
.pick.sel{border-color:var(--accent);border-width:3px}
.score{display:flex;justify-content:center;gap:10px;align-items:baseline;margin-top:26px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);flex-wrap:wrap}
.score b{font-size:24px;color:var(--ink)}
.match-msg{text-align:center;font-weight:800;color:var(--accent);min-height:24px;margin:4px 0 0}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px}
.opts select,#best-of{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 10px}
.sw{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.duo{display:grid;grid-template-rows:1fr auto 1fr;gap:6px;min-height:min(560px,calc(100dvh - 190px))}
.half{background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.half.p1{transform:rotate(180deg)}
.half .tag{font-size:13px;font-weight:800}
.half.p1 .tag{color:var(--p1)}.half.p2 .tag{color:var(--p2)}
.half .picks{margin-top:0}
.half .pick small{display:none}
.half .cover{font-size:46px;font-weight:900;font-family:var(--serif);min-height:64px;display:grid;place-items:center}
.mid{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;min-height:44px;font-variant-numeric:tabular-nums}
.mid .msg{font-family:var(--serif);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (hover:hover){.pick:not(:disabled):hover{border-color:var(--accent)}.btn:hover,.icon-btn:hover{border-color:var(--accent)}}
@media (max-height:500px){.stage{height:min(58vh,230px)}.coin{--d:min(40vh,170px)}.result{font-size:28px;min-height:40px}}
@media (max-width:370px){.pick{width:76px;height:76px;font-size:34px}.tabs button{min-width:54px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none!important}}
</style>

<div class="app">
<header class="top">
  <h1>猜拳與硬幣</h1>
  <div class="tabs" role="tablist" aria-label="分頁">
    <button id="tab-coin" role="tab" aria-selected="true" type="button">硬幣</button>
    <button id="tab-rps" role="tab" aria-selected="false" type="button">猜拳</button>
  </div>
  <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" aria-label="音效開關"></button>
  <button class="icon-btn" id="btn-theme" type="button" aria-label="切換主題（自動）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</header>

<div class="panes">
<section class="pane" id="pane-coin" aria-label="硬幣">
  <div class="bar"><span class="lab" id="cnt-lbl">一次擲</span>
    <div class="seg" role="group" aria-labelledby="cnt-lbl"><button type="button" id="cnt-1" data-n="1" aria-pressed="true">1 枚</button><button type="button" id="cnt-3" data-n="3" aria-pressed="false">3 枚</button><button type="button" id="cnt-5" data-n="5" aria-pressed="false">5 枚</button></div>
  </div>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="硬幣：點一下或往上滑擲出"></div>
  <p class="result" id="coin-result" aria-live="polite">準備好了</p>
  <p class="major" id="coin-major"></p>
  <button class="flip-btn" id="btn-flip" type="button">擲硬幣</button>
  <p class="hint">也可以在硬幣上往上滑：滑得越快，飛得越高。鍵盤按空白鍵。</p>
  <div class="stats">
    <h3><span>本次</span></h3>
    <div class="nums"><div><b id="s-h">0</b><small id="s-h-l">正</small></div><div><b id="s-t">0</b><small id="s-t-l">反</small></div><div><b id="s-streak">0</b><small>目前連續</small></div></div>
    <div class="seq" id="seq" aria-label="最近 20 次"></div>
    <h3 style="margin-top:12px"><span>累計（保存在這台裝置）</span><button class="link-btn" id="btn-reset-coin" type="button">重設</button></h3>
    <div class="nums"><div><b id="a-h">0</b><small>正</small></div><div><b id="a-t">0</b><small>反</small></div><div><b id="a-best">0</b><small>最長連續</small></div></div>
    <p class="hint" id="a-ratio" style="text-align:left"></p>
    <div class="confirm" id="confirm-coin" hidden><span>確定把硬幣累計歸零？</span><button class="btn danger" id="yes-coin" type="button">歸零</button><button class="btn" id="no-coin" type="button">取消</button></div>
  </div>
  <details class="set"><summary>硬幣設定</summary>
    <div class="set-body">
      <label for="face-h">正面文字<input type="text" id="face-h" maxlength="12" placeholder="正"></label>
      <label for="face-t">反面文字<input type="text" id="face-t" maxlength="12" placeholder="反"></label>
      <p class="hint" style="text-align:left;margin:0">各 1–4 個字或 1 個 emoji，空白時回復預設。</p>
      <label for="edge-egg">彩蛋：1/6000 機率硬幣立起來<input type="checkbox" id="edge-egg"></label>
    </div>
  </details>
</section>

<section class="pane" id="pane-rps" aria-label="猜拳" hidden>
  <div class="bar">
    <div class="seg" role="group" aria-label="模式"><button type="button" id="mode-cpu" aria-pressed="true">對電腦</button><button type="button" id="mode-duo" aria-pressed="false">雙人同機</button></div>
    <select id="best-of" aria-label="賽制"><option value="1">單局</option><option value="3">三戰兩勝</option><option value="5">五戰三勝</option></select>
  </div>

  <div id="cpu-area">
    <div class="vs">
      <div><div class="hand" id="hand-cpu" aria-live="polite">✊</div><div class="who" id="who-cpu">電腦</div></div>
      <div class="x">VS</div>
      <div><div class="hand" id="hand-me">✊</div><div class="who">你</div></div>
    </div>
    <p class="call" id="call" aria-live="polite">出拳吧！</p>
    <div class="picks" role="group" aria-label="出拳">
      <button class="pick" type="button" id="pick-0" data-m="0" aria-label="剪刀（1）">✌️<small>剪刀 1</small></button>
      <button class="pick" type="button" id="pick-1" data-m="1" aria-label="石頭（2）">✊<small>石頭 2</small></button>
      <button class="pick" type="button" id="pick-2" data-m="2" aria-label="布（3）">✋<small>布 3</small></button>
    </div>
    <div class="score"><span>勝 <b id="r-win">0</b></span><span>負 <b id="r-lose">0</b></span><span>平 <b id="r-draw">0</b></span><span>連勝 <b id="r-cur">0</b></span><span>最佳 <b id="r-best">0</b></span></div>
    <p class="match-msg" id="match-msg"></p>
    <div class="opts">
      <label class="sw" for="learn"><input type="checkbox" id="learn">挑戰模式（電腦學你的出拳習慣）</label>
      <button class="link-btn" id="btn-reset-rps" type="button">重設戰績</button>
    </div>
    <div class="confirm" id="confirm-rps" hidden><span>確定把猜拳戰績歸零？</span><button class="btn danger" id="yes-rps" type="button">歸零</button><button class="btn" id="no-rps" type="button">取消</button></div>
  </div>

  <div id="duo-area" hidden>
    <div class="duo">
      <div class="half p1"><div class="tag">玩家一</div><div class="cover" id="cover-1">請出拳</div>
        <div class="picks"><button class="pick" type="button" data-p="1" data-m="0" aria-label="玩家一 剪刀">✌️</button><button class="pick" type="button" data-p="1" data-m="1" aria-label="玩家一 石頭">✊</button><button class="pick" type="button" data-p="1" data-m="2" aria-label="玩家一 布">✋</button></div></div>
      <div class="mid"><span style="color:var(--p1)" id="duo-s1">0</span><span class="msg" id="duo-msg">各自出拳</span><span style="color:var(--p2)" id="duo-s2">0</span></div>
      <div class="half p2"><div class="tag">玩家二</div><div class="cover" id="cover-2">請出拳</div>
        <div class="picks"><button class="pick" type="button" data-p="2" data-m="0" aria-label="玩家二 剪刀">✌️</button><button class="pick" type="button" data-p="2" data-m="1" aria-label="玩家二 石頭">✊</button><button class="pick" type="button" data-p="2" data-m="2" aria-label="玩家二 布">✋</button></div></div>
    </div>
    <button class="btn" id="duo-reset" type="button" style="width:100%;margin-top:8px">重新開始</button>
  </div>
</section>
</div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = k => 'coin-flip:v1:' + k;
const store = {
  get(k, d) { let raw = null; try { raw = localStorage.getItem(KEY(k)); } catch { return d; } if (raw == null) return d; try { return JSON.parse(raw); } catch { try { localStorage.setItem(KEY('corrupt'), raw); } catch {} return d; } },
  set(k, v) { try { localStorage.setItem(KEY(k), JSON.stringify(v)); } catch {} }
};
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function randInt(n) {
  if (n <= 1) return 0;
  if (!(window.crypto && crypto.getRandomValues)) return Math.floor(Math.random() * n);
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* ---------- settings / theme / sound ---------- */
const settings = Object.assign({ faces: { h: '', t: '' }, sound: true, learnMode: false, bestOf: 1, edge: false, theme: 'auto', count: 1, mode: 'cpu' }, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);
const THEMES = ['auto', 'light', 'dark'], TL = { auto: '自動', light: '淺色', dark: '深色' };

const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function renderSound() { $('btn-sound').innerHTML = settings.sound ? ICON_ON : ICON_OFF; $('btn-sound').setAttribute('aria-pressed', settings.sound); $('btn-sound').title = settings.sound ? '音效：開' : '音效：關'; }

let actx = null;
function ensureAudio() { if (!settings.sound) return null; try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch { actx = null; } return actx; }

const beep = (hi) => tone(hi ? 880 : 520, .12, 'triangle', .14);

/* ---------- tabs ---------- */
function setTab(t) { $('tab-coin').setAttribute('aria-selected', t === 'coin'); $('tab-rps').setAttribute('aria-selected', t === 'rps'); $('pane-coin').hidden = t !== 'coin'; $('pane-rps').hidden = t !== 'rps'; activeTab = t; }

$('tab-coin').addEventListener('click', () => setTab('coin'));
$('tab-rps').addEventListener('click', () => setTab('rps'));

/* =============== COIN =============== */
const stats = Object.assign({ coin: { heads: 0, tails: 0, streak: 0, best: 0, last: '' }, rps: { win: 0, lose: 0, draw: 0, best: 0, cur: 0 } }, store.get('stats', {}));
const session = { h: 0, t: 0, streak: 0, last: '', seq: [] };
let coins = [], flipping = false;
const graphemes = s => { try { return [...new Intl.Segmenter('zh-Hant', { granularity: 'grapheme' }).segment(s)].map(x => x.segment); } catch { return [...s]; } };

}
function buildCoins(n) {

  for (let k = 0; k < n; k++) {
    const coin = document.createElement('div'); coin.className = 'coin';
    const spin = document.createElement('div'); spin.className = 'spin';
    for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'slice'; s.style.transform = `translateZ(calc(var(--d) * ${(-.033 + i * .0073).toFixed(4)}))`; spin.append(s); }
    for (const side of ['h', 't']) {
      const f = document.createElement('div'); f.className = 'face ' + (side === 'h' ? 'front' : 'back');
      const sp = document.createElement('span'); sp.textContent = faceText(side); if (graphemes(sp.textContent).length > 2) sp.className = 'long';
      f.append(sp); spin.append(f);

    coin.append(spin); st.append(coin);

}
function updateFaces() { document.querySelectorAll('.face.front span').forEach(s => { s.textContent = faceText('h'); s.className = graphemes(s.textContent).length > 2 ? 'long' : ''; }); document.querySelectorAll('.face.back span').forEach(s => { s.textContent = faceText('t'); s.className = graphemes(s.textContent).length > 2 ? 'long' : ''; }); renderCoinStats(); }

function decideFace() {
  if (settings.edge && randInt(6000) === 0) return 'e';
  return randInt(2) ? 't' : 'h';
}
// returns final angle so that the requested face shows: heads = 0 (mod 360), tails = 180, edge = 90
function planSpin(a0, face, force) {
  let n = 4 + Math.round(force * 8);                    // 4–12 half turns
  const base = Math.floor(a0 / 180) * 180, startT = ((base / 180) % 2 + 2) % 2;  // 0 heads, 1 tails
  const want = face === 't' ? 1 : 0;

  return base + n * 180 + (face === 'e' ? 90 : 0);
}
function animateCoin(c, face, force, delay = 0) {
  const a0 = c.angle, a1 = planSpin(a0, face, force);
  const finalNorm = ((a1 % 360) + 360) % 360;
  if (RM()) {
    c.spin.style.transform = `rotateX(${finalNorm}deg)`; c.angle = finalNorm;
    return c.coin.animate([{ opacity: .2 }, { opacity: 1 }], { duration: 300 }).finished;
  }
  const dur = 800 + force * 800, d = getComputedStyle(c.coin).width, h = parseFloat(d) * (1.2 + force * 1.6);
  const spinAnim = c.spin.animate([{ transform: `rotateX(${a0}deg)` }, { transform: `rotateX(${a1}deg)` }], { duration: dur * .78, delay, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'forwards' });
  const toss = c.coin.animate([
    { transform: 'translateY(0) scale(1)', offset: 0, easing: 'cubic-bezier(.2,.7,.4,1)' },
    { transform: `translateY(${-h}px) scale(1.18)`, offset: .4, easing: 'cubic-bezier(.6,0,.85,.5)' },
    { transform: 'translateY(0) scale(1)', offset: .78, easing: 'ease-out' },
    { transform: `translateY(${-h * .08}px) scale(1.01)`, offset: .87, easing: 'ease-in' },
    { transform: 'translateY(0) scale(1)', offset: .93, easing: 'ease-out' },
    { transform: `translateY(${-h * .025}px)`, offset: .965, easing: 'ease-in' },
    { transform: 'translateY(0) scale(1)', offset: 1 }], { duration: dur, delay });
  setTimeout(() => thud(), delay + dur * .78);
  return Promise.all([spinAnim.finished, toss.finished]).then(() => { c.spin.style.transform = `rotateX(${finalNorm}deg)`; spinAnim.cancel(); c.angle = finalNorm; });
}
async function flip(force = .55) {
  if (flipping) return;
  flipping = true; $('btn-flip').disabled = true;
  ensureAudio(); ping(); vibrate(15);
  force = Math.max(0, Math.min(1, force));
  const faces = coins.map(() => decideFace());
  $('coin-result').textContent = '…'; $('coin-major').textContent = '';
  await Promise.all(coins.map((c, k) => animateCoin(c, faces[k], Math.max(0, Math.min(1, force + (k ? (randInt(21) - 10) / 50 : 0))), k * 60)));
  lastFaces = faces;
  for (const f of faces) record(f);
  showCoinResult(faces);
  vibrate([20, 40, 20]);
  flipping = false; $('btn-flip').disabled = false;
}
let lastFaces = [];
function label(f) { return f === 'e' ? '立起來了！' : faceText(f); }
function showCoinResult(faces) {
  if (faces.length === 1) { $('coin-result').textContent = label(faces[0]); $('coin-major').textContent = faces[0] === 'e' ? '六千分之一的奇蹟' : ''; return; }
  const h = faces.filter(f => f === 'h').length, t = faces.filter(f => f === 't').length;
  $('coin-result').textContent = faces.map(f => f === 'e' ? '立' : faceText(f)).join(' ');
  $('coin-major').textContent = `${faceText('h')} ${h}：${faceText('t')} ${t} → ` + (h > t ? `${faceText('h')}方勝` : t > h ? `${faceText('t')}方勝` : '平手');
}
function record(f) {
  const c = stats.coin;
  if (f === 'h') { session.h++; c.heads++; } else if (f === 't') { session.t++; c.tails++; }
  session.streak = f !== 'e' && f === session.last ? session.streak + 1 : (f === 'e' ? 0 : 1); session.last = f;
  c.streak = f !== 'e' && f === c.last ? c.streak + 1 : (f === 'e' ? 0 : 1); c.last = f; c.best = Math.max(c.best, c.streak);
  session.seq.push(f); if (session.seq.length > 20) session.seq.shift();
  store.set('stats', stats); renderCoinStats();
}
function renderCoinStats() {
  $('s-h').textContent = session.h; $('s-t').textContent = session.t; $('s-streak').textContent = session.streak;
  $('s-h-l').textContent = faceText('h'); $('s-t-l').textContent = faceText('t');
  $('a-h').textContent = stats.coin.heads; $('a-t').textContent = stats.coin.tails; $('a-best').textContent = stats.coin.best;
  const tot = stats.coin.heads + stats.coin.tails;
  $('a-ratio').textContent = tot ? `共 ${tot} 次，${faceText('h')} ${(stats.coin.heads / tot * 100).toFixed(1)}%` : '還沒有紀錄';
  const sq = $('seq'); sq.textContent = '';
  for (const f of session.seq) { const i = document.createElement('i'); i.className = f; i.textContent = f === 'e' ? '立' : graphemes(faceText(f))[0]; sq.append(i); }
}
// count selector
document.querySelectorAll('#pane-coin .seg button').forEach(b => b.addEventListener('click', () => {
  if (flipping) return;
  settings.count = +b.dataset.n; saveSettings();
  document.querySelectorAll('#pane-coin .seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  buildCoins(settings.count); $('coin-result').textContent = '準備好了'; $('coin-major').textContent = '';
}));
$('btn-flip').addEventListener('click', () => flip(.45 + randInt(21) / 100));
// swipe-up / tap on the stage
{ let y0 = 0, t0 = 0, id = null; const st = $('stage');
  st.addEventListener('pointerdown', e => { y0 = e.clientY; t0 = performance.now(); id = e.pointerId; try { st.setPointerCapture(id); } catch {} });
  st.addEventListener('pointerup', e => {
    if (id !== e.pointerId) return; id = null;
    const dy = y0 - e.clientY, dt = Math.max(16, performance.now() - t0);
    if (dy > 30) flip(Math.min(1, Math.max(0, (dy / dt - .2) / 1.8)));
    else if (Math.abs(dy) < 12 && dt < 500) flip(.5);
  });
  st.addEventListener('pointercancel', () => { id = null; });
  st.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); flip(); } });
}
$('btn-reset-coin').addEventListener('click', () => { $('confirm-coin').hidden = false; });
$('no-coin').addEventListener('click', () => { $('confirm-coin').hidden = true; });
$('yes-coin').addEventListener('click', () => { stats.coin = { heads: 0, tails: 0, streak: 0, best: 0, last: '' }; store.set('stats', stats); $('confirm-coin').hidden = true; renderCoinStats(); toast('硬幣累計已歸零'); });
$('face-h').value = settings.faces.h || ''; $('face-t').value = settings.faces.t || '';
for (const s of ['h', 't']) $('face-' + s).addEventListener('input', e => { settings.faces[s] = e.target.value; saveSettings(); updateFaces(); });
$('edge-egg').checked = !!settings.edge;
$('edge-egg').addEventListener('change', e => { settings.edge = e.target.checked; saveSettings(); });

/* =============== RPS =============== */
const MOVES = ['✌️', '✊', '✋'], NAMES = ['剪刀', '石頭', '布'];
const beats = (a, b) => (a - b + 3) % 3 === 1;     // a wins over b
const counter = m => (m + 1) % 3;
let rpsHist = store.get('rpsHistory', []); if (!Array.isArray(rpsHist)) rpsHist = [];
let busy = false, match = { me: 0, cpu: 0, over: false };
function predictCpu(hist) {
  if (hist.length < 2) return null;
  const prev = hist[hist.length - 1], cnt = [0, 0, 0];
  for (let i = 1; i < hist.length; i++) if (hist[i - 1] === prev) cnt[hist[i]]++;
  const max = Math.max(...cnt); if (!max) return null;
  const best = [0, 1, 2].filter(m => cnt[m] === max);
  return counter(best[randInt(best.length)]);
}
function cpuMove() { if (settings.learnMode) { const p = predictCpu(rpsHist); if (p != null) return p; } return randInt(3); }
function judge(me, cpu) { return me === cpu ? 'draw' : beats(me, cpu) ? 'win' : 'lose'; }
function renderRps() {
  const r = stats.rps; $('r-win').textContent = r.win; $('r-lose').textContent = r.lose; $('r-draw').textContent = r.draw; $('r-cur').textContent = r.cur; $('r-best').textContent = r.best;
  $('who-cpu').textContent = settings.learnMode ? '電腦・挑戰模式' : '電腦';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function play(me) {
  if (busy) return; busy = true;
  ensureAudio();
  if (match.over) { match = { me: 0, cpu: 0, over: false }; $('match-msg').textContent = ''; }
  const cpu = cpuMove();   // decided before reveal, never from the current pick (unless challenge mode uses past history)
  document.querySelectorAll('#cpu-area .pick').forEach(b => { b.disabled = true; b.classList.toggle('sel', +b.dataset.m === me); });
  const hc = $('hand-cpu'), hm = $('hand-me'); hc.className = hm.className = 'hand'; hc.textContent = hm.textContent = '✊';
  const call = $('call'); call.className = 'call';
  if (!RM()) {
    for (const [k, w] of ['剪刀', '石頭', '布！'].entries()) {
      call.textContent = ['剪刀、', '剪刀、石頭、', '剪刀、石頭、布！'][k];
      beep(k === 2); hc.classList.remove('shake'); hm.classList.remove('shake'); void hc.offsetWidth; hc.classList.add('shake'); hm.classList.add('shake');
      await sleep(340);
    }
  }
  hc.textContent = MOVES[cpu]; hm.textContent = MOVES[me];
  const res = judge(me, cpu), r = stats.rps;
  r[res]++; if (res === 'win') { r.cur++; r.best = Math.max(r.best, r.cur); } else if (res === 'lose') r.cur = 0;
  hc.classList.add(res === 'win' ? 'lose' : res === 'lose' ? 'win' : 'draw'); hm.classList.add(res);
  call.className = 'call ' + res; call.textContent = { win: '你贏了！', lose: '你輸了', draw: '平手' }[res];
  tone(res === 'win' ? 1046 : res === 'lose' ? 220 : 520, .25, res === 'lose' ? 'square' : 'sine', .1);
  rpsHist.push(me); if (rpsHist.length > 50) rpsHist = rpsHist.slice(-50);
  store.set('rpsHistory', rpsHist); store.set('stats', stats);
  // match
  const need = Math.ceil(settings.bestOf / 2);
  if (settings.bestOf > 1) {
    if (res === 'win') match.me++; else if (res === 'lose') match.cpu++;
    $('match-msg').textContent = `本場 ${match.me}：${match.cpu}（${settings.bestOf === 3 ? '三戰兩勝' : '五戰三勝'}）`;
    if (match.me >= need || match.cpu >= need) { match.over = true; $('match-msg').textContent = match.me > match.cpu ? `你以 ${match.me}：${match.cpu} 贏得這場！` : `電腦以 ${match.cpu}：${match.me} 贏得這場`; }
  } else $('match-msg').textContent = '';
  renderRps();
  document.querySelectorAll('#cpu-area .pick').forEach(b => { b.disabled = false; });
  busy = false;
  return res;
}
document.querySelectorAll('#cpu-area .pick').forEach(b => b.addEventListener('click', () => play(+b.dataset.m)));
$('learn').checked = !!settings.learnMode;
$('learn').addEventListener('change', e => { settings.learnMode = e.target.checked; saveSettings(); renderRps(); toast(settings.learnMode ? '挑戰模式：電腦會依你的出拳習慣預測' : '一般模式：電腦完全隨機'); });
$('best-of').value = String(settings.bestOf);
$('best-of').addEventListener('change', e => { settings.bestOf = +e.target.value; saveSettings(); match = { me: 0, cpu: 0, over: false }; duo.s1 = duo.s2 = 0; duo.over = false; renderDuo(); $('match-msg').textContent = settings.bestOf > 1 ? '新的一場開始' : ''; });
$('btn-reset-rps').addEventListener('click', () => { $('confirm-rps').hidden = false; });
$('no-rps').addEventListener('click', () => { $('confirm-rps').hidden = true; });
$('yes-rps').addEventListener('click', () => { stats.rps = { win: 0, lose: 0, draw: 0, best: 0, cur: 0 }; rpsHist = []; store.set('rpsHistory', rpsHist); store.set('stats', stats); $('confirm-rps').hidden = true; renderRps(); toast('猜拳戰績已歸零'); });

// two players on one phone
const duo = { p1: null, p2: null, s1: 0, s2: 0, over: false, lock: false };
function setMode(m) {
  settings.mode = m; saveSettings();
  $('mode-cpu').setAttribute('aria-pressed', m === 'cpu'); $('mode-duo').setAttribute('aria-pressed', m === 'duo');
  $('cpu-area').hidden = m !== 'cpu'; $('duo-area').hidden = m !== 'duo';
}
$('mode-cpu').addEventListener('click', () => setMode('cpu'));
$('mode-duo').addEventListener('click', () => setMode('duo'));
function renderDuo(msg) {
  $('duo-s1').textContent = duo.s1; $('duo-s2').textContent = duo.s2;
  for (const p of [1, 2]) {
    const pick = duo['p' + p];
    $('cover-' + p).textContent = pick == null ? '請出拳' : '？';
    document.querySelectorAll(`#duo-area .pick[data-p="${p}"]`).forEach(b => { b.disabled = pick != null || duo.lock; b.classList.remove('sel'); });
  }
  if (msg) $('duo-msg').textContent = msg;
}
async function duoPick(p, m) {
  if (duo.lock || duo['p' + p] != null) return;
  ensureAudio(); beep(false);
  if (duo.over) { duo.s1 = duo.s2 = 0; duo.over = false; }
  duo['p' + p] = m; renderDuo(duo.p1 == null || duo.p2 == null ? (duo.p1 == null ? '等玩家一' : '等玩家二') : '');
  if (duo.p1 != null && duo.p2 != null) {
    duo.lock = true; renderDuo('揭曉！');
    $('cover-1').textContent = MOVES[duo.p1]; $('cover-2').textContent = MOVES[duo.p2];
    const r = judge(duo.p1, duo.p2), need = Math.ceil(settings.bestOf / 2);
    if (r === 'draw') { $('duo-msg').textContent = '平手，再來！'; tone(520, .2); await sleep(RM() ? 700 : 1300); }
    else {
      if (r === 'win') duo.s1++; else duo.s2++;
      const who = r === 'win' ? '玩家一' : '玩家二';
      tone(1046, .25);
      $('duo-s1').textContent = duo.s1; $('duo-s2').textContent = duo.s2;
      if (duo.s1 >= need || duo.s2 >= need) { duo.over = true; $('duo-msg').textContent = `${who}獲勝！`; }
      else $('duo-msg').textContent = `${who}贏這局`;
      await sleep(RM() ? 900 : 1600);
    }
    duo.p1 = duo.p2 = null; duo.lock = false; renderDuo(duo.over ? $('duo-msg').textContent + '（出拳開始新的一場）' : '各自出拳');
  }
}
document.querySelectorAll('#duo-area .pick').forEach(b => b.addEventListener('click', () => duoPick(+b.dataset.p, +b.dataset.m)));
$('duo-reset').addEventListener('click', () => { Object.assign(duo, { p1: null, p2: null, s1: 0, s2: 0, over: false, lock: false }); renderDuo('各自出拳'); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const wide = matchMedia('(min-width:920px)').matches;
  if (e.key === ' ' && (activeTab === 'coin' || wide) && !e.target.closest('button')) { e.preventDefault(); flip(); }
  if (['1', '2', '3'].includes(e.key) && (activeTab === 'rps' || wide) && settings.mode === 'cpu') play(+e.key - 1);
});

/* ---------- boot ---------- */
if (![1, 3, 5].includes(settings.count)) settings.count = 1;
document.querySelectorAll('#pane-coin .seg button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.n === settings.count));
buildCoins(settings.count); renderCoinStats(); renderRps(); setMode(settings.mode === 'duo' ? 'duo' : 'cpu'); renderDuo();
</script>
