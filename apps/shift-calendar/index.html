<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>輪班行事曆</title>
<style>
:root{
  --bg:#eef0f3; --paper:#ffffff; --ink:#151b26; --muted:#4f5867; --faint:#7d8594; --line:#cfd4dc; --rule:#e2e5ea;
  --accent:#1f3a68; --accent-ink:#ffffff; --accent-soft:#dde4f0; --today:#d6452f;
  --out:#f5f6f8; --danger:#b3261e; --danger-soft:#f9e2e0; --warn-bg:#fff2cf; --warn-ink:#614500;
  --shadow:0 10px 40px rgba(16,24,40,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --paper:#171b23; --ink:#e3e7ee; --muted:#a3abb8; --faint:#7a8290; --line:#2c323d; --rule:#222833;
  --accent:#9db7e6; --accent-ink:#0d1626; --accent-soft:#1d2738; --today:#ff8a73;
  --out:#13161d; --danger:#f2b8b5; --danger-soft:#3a1d1b; --warn-bg:#352a0e; --warn-ink:#f3d68b;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --paper:#171b23; --ink:#e3e7ee; --muted:#a3abb8; --faint:#7a8290; --line:#2c323d; --rule:#222833;
  --accent:#9db7e6; --accent-ink:#0d1626; --accent-soft:#1d2738; --today:#ff8a73;
  --out:#13161d; --danger:#f2b8b5; --danger-soft:#3a1d1b; --warn-bg:#352a0e; --warn-ink:#f3d68b;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}

.top{display:flex;align-items:center;gap:6px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px;border-bottom:3px double var(--ink);margin-bottom:10px}
.top h1{margin:0;flex:1;min-width:0;text-align:center;font-size:20px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.top h1 small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.2em;overflow:hidden;text-overflow:ellipsis}
.top h1 #ym{display:block;overflow:hidden;text-overflow:ellipsis}
h3[tabindex]:focus{outline:none}
.ib{min-width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;cursor:pointer;padding:0 10px;font-weight:600}
.ib svg{width:20px;height:20px}
.ib.ghost{border-color:transparent;background:transparent}
.sample{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--warn-bg);color:var(--warn-ink);border-radius:4px;padding:1px 6px;vertical-align:2px}

.main{display:block}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wk{display:grid;grid-template-columns:repeat(7,1fr);background:var(--ink);color:var(--bg)}
.wk span{text-align:center;font-size:12px;font-weight:700;padding:5px 0;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{position:relative;min-height:60px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:transparent;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--out)}
.cell.out .d,.cell.out .chips{opacity:.45}
.cell .d{font-size:13px;font-weight:700;line-height:18px;font-variant-numeric:tabular-nums}
.cell.wkend .d{color:var(--today)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cell.sel{background:var(--accent-soft)}
.chips{display:flex;gap:2px;justify-content:center;width:100%}
.chip{flex:0 1 auto;min-width:24px;height:26px;border-radius:4px;display:grid;place-items:center;font-size:14px;font-weight:800;white-space:nowrap;padding:0 3px;letter-spacing:0}
.two .chip{min-width:0;flex:1 1 0;max-width:24px;font-size:12.5px;height:22px;padding:0}
.chip.p2{background:var(--paper)!important;color:var(--ink)!important;border:2px solid var(--c)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.p2{background:color-mix(in srgb,var(--c) 22%,var(--paper))!important;border-color:color-mix(in srgb,var(--c) 55%,#fff)}}
:root[data-theme="dark"] .chip.p2{background:color-mix(in srgb,var(--c) 22%,var(--paper))!important;border-color:color-mix(in srgb,var(--c) 55%,#fff)}
.ov{position:absolute;top:0;right:0;width:0;height:0;border-top:10px solid var(--today);border-left:10px solid transparent}
.star{position:absolute;top:2px;left:3px;font-size:11px;line-height:1;color:var(--today);font-weight:800}
.note-dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
@media (hover:hover){.cell:hover{background:var(--accent-soft)} .ib:hover{border-color:var(--muted)}}

.guide{padding:18px;text-align:center;color:var(--muted)}
.intro{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 10px 8px 12px;margin-bottom:10px}
.intro p{margin:0;flex:1 1 200px;font-size:13.5px}
.intro b{color:inherit}
.steps{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:10px 0 2px;font-size:13.5px}
.steps ol{margin:4px 0 0;padding-left:20px}
.ymbtn{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;border-radius:6px;min-height:44px;-webkit-tap-highlight-color:transparent}
.ymbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mgrid button{height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.mgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ystep{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.ystep b{font-size:20px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.stats{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stats h2{margin:0 0 8px;font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.srow{display:flex;flex-wrap:wrap;gap:6px 14px}
.sitem{display:flex;align-items:center;gap:6px;font-size:14px}
.sitem .chip{min-width:24px;height:24px;font-size:13px}
.tot{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--rule);margin-top:10px;padding-top:8px;flex-wrap:wrap}
.tot b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tot .cmp{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.06)}}
.legend-p{font-size:12.5px;color:var(--muted);margin-top:8px}

.side{display:none}
.side .stats{margin-top:0}

dialog{border:0;padding:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);max-width:100vw}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog.sheet{width:100%;max-width:560px;margin:auto auto 0;border-radius:14px 14px 0 0;max-height:88%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
dialog.full{width:100%;max-width:640px;height:100%;max-height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
dialog.full:not([open]){display:none}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dh h3{margin:0;flex:1;font-size:18px}
.dh h3 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px;display:block}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-width:56px;height:48px;border-radius:8px;border:2px solid transparent;font-weight:800;font-size:16px;cursor:pointer;padding:0 10px}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
textarea,input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:15px}
textarea{resize:vertical;min-height:72px}
.info{font-size:14px;color:var(--muted)}
.info b{color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}

.fhead{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
.tabs button{flex:1;height:44px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 8px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fbody{flex:1;overflow:auto;padding:8px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.ffoot{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:1px solid var(--line)}
.ffoot .err{flex:1;color:var(--danger);font-size:13px;min-width:0}
.srow-e{display:grid;grid-template-columns:48px 1fr 44px;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.srow-e .times{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px}
.srow-e .times input{min-width:0;max-width:100%;padding-left:6px;padding-right:4px}
.srow-e .times label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-e .times .brk{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.srow-e .times .brk input{width:96px;flex:none}
.srow-e > *{min-width:0}
.srow-e .times label{font-size:11px;color:var(--muted)}
.srow-e .names{display:grid;grid-template-columns:60px 1fr;gap:6px}
input[type=color]{width:48px;height:44px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);padding:0 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;gap:4px;min-height:48px;padding:6px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.seq button{width:44px;height:44px;border-radius:6px;border:0;font-weight:800;cursor:pointer;position:relative}
.seq button::after{content:attr(data-n);position:absolute;bottom:-1px;right:2px;font-size:9px;font-weight:600;opacity:.8}
.seq .empty{color:var(--faint);font-size:13px;align-self:center;padding:0 6px}
.weekly{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekly label{font-size:12px;text-align:center;color:var(--muted)}
.weekly select{padding:4px 2px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;width:max-content}
.toast .tbtn{min-height:44px;min-width:56px;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;font-weight:700;padding:0 12px;cursor:pointer;margin:-6px -8px -6px 0}
.btn,.ib,.pick button,.seg button,.seq button,.tabs button,.cell{-webkit-tap-highlight-color:transparent}
.expimg{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;-webkit-touch-callout:default}

@media (min-width:900px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
  .intro{grid-column:1/-1;margin-bottom:0}
  .side{display:block;position:sticky;top:12px}
  .mstats{display:none}
  .cell{min-height:92px}
  .chip{height:30px;min-width:34px;font-size:15px}
  .two .chip{max-width:34px;height:26px}
}
@media (max-height:600px) and (orientation:landscape){
  .cell{min-height:47px;padding:3px 2px 4px;gap:3px}
  .cell .d{line-height:16px}
  .chip,.two .chip{height:21px}
  .top{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px;margin-bottom:6px}
  dialog.sheet{max-height:100%;margin-top:0;border-radius:0}
}
@media (max-height:600px) and (orientation:landscape) and (min-width:700px) and (max-width:899.98px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto 1fr;gap:8px 12px;align-items:start}
  .calcol{grid-column:1;grid-row:1/span 2}
  .intro{grid-column:2;grid-row:1;margin:0;padding:6px 8px}
  .intro p{font-size:12.5px;flex-basis:100%}
  .side{grid-column:2;grid-row:2}
  .side{display:block;position:sticky;top:8px}
  .mstats{display:none}
  .legend-p{margin-top:4px}
}
@media (prefers-reduced-motion:no-preference){.grid.slide{animation:sl .22s ease-out}@keyframes sl{from{opacity:.4;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <button class="ib" id="prev" aria-label="上個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title"><button class="ymbtn" id="ymBtn" type="button" title="跳到指定月份"><small id="who">我的班表</small><span id="ym">2026 年 10 月</span></button></h1>
    <button class="ib" id="next" aria-label="下個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ib" id="today">今天</button>
    <button class="ib" id="openSettings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div class="main">
    <div class="intro" id="intro" hidden><p>目前顯示的是<b>範例班表</b>。選一個輪班範本、填上第一天上班的日期，就變成你的班表。</p><button class="btn pri" id="startSetup" type="button">設定我的班表</button></div>
    <div class="calcol">
      <section class="cal" id="cal" aria-label="月曆">
        <div class="wk" id="wk"></div>
        <div class="grid" id="grid" role="grid"></div>
      </section>
      <p class="legend-p" id="legendNote"></p>
      <div class="mstats" id="mstats"></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>

<dialog class="sheet" id="dayDlg" aria-labelledby="dayTitle">
  <div class="dh"><h3 id="dayTitle" tabindex="-1"></h3><button class="ib ghost" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="info" id="dayInfo"></div>
  <span class="lbl">改班（換班、請假、加班）</span>
  <div class="pick" id="dayPick"></div>
  <label class="lbl" for="dayNote">備註</label>
  <p class="hint" id="dayDraftHint" hidden>已帶入上次未儲存的草稿，按「儲存」才會套用。</p>
  <textarea id="dayNote" maxlength="200" placeholder="例如：和小王換班、請特休"></textarea>
  <div class="actions">
    <button class="btn pri" id="daySave">儲存</button>
    <button class="btn" id="dayRestore">恢復規則班</button>
  </div>
</dialog>

<dialog class="full" id="setDlg" aria-labelledby="setTitle">
  <div class="fhead">
    <div class="dh" style="margin:0"><h3 id="setTitle" tabindex="-1">班表設定</h3><button class="ib ghost" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-rule" aria-selected="true" data-tab="rule">循環規則</button>
      <button role="tab" id="tab-shift" aria-selected="false" data-tab="shift">班別</button>
      <button role="tab" id="tab-p2" aria-selected="false" data-tab="p2">第二成員</button>
      <button role="tab" id="tab-gen" aria-selected="false" data-tab="gen">一般</button>
    </div>
  </div>
  <div class="fbody" id="setBody"></div>
  <div class="ffoot"><span class="err" id="setErr" role="alert"></span><button class="btn" data-close>取消</button><button class="btn pri" id="setSave">儲存設定</button></div>
</dialog>

<dialog class="sheet" id="monDlg" aria-labelledby="monTitle">
  <div class="dh"><h3 id="monTitle" tabindex="-1">跳到月份</h3><button class="ib ghost" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ystep"><button class="ib" id="monPrevY" type="button" aria-label="前一年"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button><b id="monY">2026</b><button class="ib" id="monNextY" type="button" aria-label="後一年"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="mgrid" id="monGrid"></div>
</dialog>

<dialog class="sheet" id="expDlg" aria-labelledby="expTitle">
  <div class="dh"><h3 id="expTitle" tabindex="-1">班表圖片</h3><button class="ib ghost" data-close aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="info" id="expMsg">長按圖片即可儲存或分享。</p>
  <img class="expimg" id="expImg" alt="整月班表圖片">
</dialog>

<input type="file" id="impFile" accept=".json,application/json" hidden>

<dialog class="sheet" id="cfmDlg" aria-labelledby="cfmTitle">
  <div class="dh"><h3 id="cfmTitle" tabindex="-1">確定嗎？</h3></div>
  <p class="info" id="cfmMsg"></p>
  <div class="actions"><button class="btn dan" id="cfmYes">確定</button><button class="btn" data-close>取消</button></div>
</dialog>

<script>
(() => {
'use strict';
const P = 'shift-calendar:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]); } for (const c of kids) if (c != null) n.append(c); return n; };
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- date helpers (day numbers via UTC) ---------- */
const dnOf = s => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const dsOf = n => { const t = new Date(n * 86400000); return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0'); };
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const mod = (a, n) => ((a % n) + n) % n;
const dow = n => mod(n + 4, 7); // 1970-01-01 was Thursday (4)
const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && dsOf(dnOf(s)) === s;

/* ---------- data ---------- */
const TEMPLATES = [
  { name: '四班二輪', type: 'cycle', seq: ['e', 'e', 'l', 'l', 'o', 'o', 'o', 'o'] },
  { name: '做二休二', type: 'cycle', seq: ['e', 'e', 'o', 'o'] },
  { name: '做五休二', type: 'weekly', seq: ['e', 'e', 'e', 'e', 'e', 'o', 'o'] },
  { name: '三班制', type: 'cycle', seq: ['e', 'e', 'm', 'm', 'n', 'n', 'o', 'o'] },
];
function sampleData() {
  return {
    sample: true, name: '我的班表', weekStart: 1,
    shifts: [
      { id: 'e', name: '早班', short: '早', color: '#22814a', start: '07:00', end: '15:00', brk: 0 },
      { id: 'm', name: '中班', short: '中', color: '#2563b0', start: '15:00', end: '23:00', brk: 0 },
      { id: 'l', name: '晚班', short: '晚', color: '#a84c0b', start: '19:00', end: '07:00', brk: 1 },
      { id: 'n', name: '夜班', short: '夜', color: '#6c43b5', start: '23:00', end: '07:00', brk: 0 },
      { id: 'o', name: '休假', short: '休', color: '#6e747e', start: '', end: '', brk: 0 },
    ],
    rules: [{ from: '2026-10-01', type: 'cycle', sequence: ['e', 'e', 'l', 'l', 'o', 'o', 'o', 'o'] }],
    overrides: { '2026-10-15': { shiftId: 'm', note: '範例：和同事換成中班' } },
    people: [{ name: '家人', on: false, rules: [{ from: '2026-10-05', type: 'weekly', sequence: ['e', 'e', 'e', 'e', 'e', 'o', 'o'] }] }],
  };
}
const tmOf = v => { const m = /^(\d{1,2}):(\d{2})$/.exec(typeof v === 'string' ? v : ''); if (!m) return null; const h = +m[1], mi = +m[2]; return h < 24 && mi < 60 ? h * 60 + mi : null; };
function sanitize(d) {
  try {
    if (!d || typeof d !== 'object' || !Array.isArray(d.shifts) || !Array.isArray(d.rules)) return null;
    const seen = new Set();
    d.shifts = d.shifts.filter(s => s && typeof s === 'object' && s.id && typeof s.id === 'string' && s.short && !seen.has(s.id) && seen.add(s.id)).slice(0, 10);
    if (!d.shifts.length) return null;
    for (const s of d.shifts) {
      s.short = String(s.short).slice(0, 2); s.name = String(s.name || s.short).slice(0, 10);
      if (!/^#[\da-f]{6}$/i.test(s.color || '')) s.color = '#6e747e';
      // 壞的上下班時間：當成休假（工時 0），不會算出非數值
      if (tmOf(s.start) == null || tmOf(s.end) == null) { s.start = ''; s.end = ''; }
      s.brk = Math.max(0, Math.min(6, Number(s.brk) || 0));
    }
    const ids = new Set(d.shifts.map(s => s.id));
    const okRule = r => r && validDate(r.from) && (r.type === 'cycle' || r.type === 'weekly') && Array.isArray(r.sequence) && r.sequence.length && r.sequence.every(x => ids.has(x)) && (r.type === 'cycle' || r.sequence.length === 7);
    const dedupe = rs => { const f = new Set(); return rs.filter(okRule).filter(r => !f.has(r.from) && f.add(r.from)); };
    const defRule = () => [{ from: todayStr(), type: 'cycle', sequence: [d.shifts[0].id] }];
    // 至少保留一條有效規則：全部壞掉時補一條，月曆與設定都能開
    d.rules = dedupe(d.rules); if (!d.rules.length) d.rules = defRule();
    if (!d.overrides || typeof d.overrides !== 'object' || Array.isArray(d.overrides)) d.overrides = {};
    for (const k in d.overrides) { const o = d.overrides[k]; if (!validDate(k) || !o || typeof o !== 'object' || !ids.has(o.shiftId)) delete d.overrides[k]; else o.note = typeof o.note === 'string' ? o.note.slice(0, 200) : ''; }
    if (!Array.isArray(d.people) || !d.people[0] || typeof d.people[0] !== 'object') d.people = sampleData().people;
    d.people = [d.people[0]];
    const p = d.people[0]; p.on = !!p.on; p.name = String(p.name || '成員二').slice(0, 8);
    p.rules = dedupe(Array.isArray(p.rules) ? p.rules : []);
    if (!p.rules.length) p.rules = defRule();
    d.weekStart = d.weekStart === 0 ? 0 : 1;
    d.name = String(d.name || '我的班表').slice(0, 20);
    return d;
  } catch (e) { return null; }
}
const clone = o => JSON.parse(JSON.stringify(o));
const rawData = () => { try { return localStorage.getItem(P + 'data'); } catch (e) { return null; } };
const parseData = raw => { try { return raw == null ? null : sanitize(JSON.parse(raw)); } catch (e) { return null; } };
let data = parseData(rawData()) || sampleData();
// 多分頁：base＝上次和儲存區同步的內容。存檔前若別的分頁已寫入，就把「我這次改的」套在別人的版本上（三方合併），不整份覆蓋。
let base = clone(data), baseRaw = rawData();
function merge3(b, o, t) {
  const r = {}, J = JSON.stringify;
  for (const k of new Set([...Object.keys(o), ...Object.keys(t)])) if (k !== 'overrides') r[k] = J(o[k]) !== J(b[k]) ? o[k] : t[k];
  const bo = b.overrides || {}, oo = o.overrides || {}, to = t.overrides || {}; r.overrides = {};
  for (const ds of new Set([...Object.keys(bo), ...Object.keys(oo), ...Object.keys(to)])) { const v = J(oo[ds]) !== J(bo[ds]) ? oo[ds] : to[ds]; if (v) r.overrides[ds] = v; }
  return r;
}
const view = store.get('view', null) || {};
let theme = store.get('theme', 'auto');
let curY, curM; // month (1-12)
{ const t = todayStr().split('-').map(Number); curY = Number(view.y) || t[0]; curM = Number(view.m) || t[1]; if (curM < 1 || curM > 12) curM = t[1]; }
function save() {
  const raw = rawData();
  if (raw !== baseRaw) { const t = parseData(raw); if (t) data = sanitize(merge3(base, clone(data), t)) || data; }
  store.set('data', data); base = clone(data); baseRaw = rawData();
}
addEventListener('storage', e => {
  if (e.key !== P + 'data' || e.newValue == null) return;
  const t = parseData(e.newValue); if (!t) return;
  data = sanitize(merge3(base, clone(data), t)) || t; base = clone(t); baseRaw = e.newValue;
  render();
});
const saveView = () => store.set('view', { y: curY, m: curM });
function applyTheme() { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); }
applyTheme();

const shiftById = id => data.shifts.find(s => s.id === id);
const isRest = s => !s || tmOf(s.start) == null || tmOf(s.end) == null;
function hoursOf(s) {
  if (isRest(s)) return 0;
  let mins = tmOf(s.end) - tmOf(s.start);
  if (mins <= 0) mins += 1440; // cross-midnight: ends next day
  const h = mins / 60 - (Number(s.brk) || 0);
  return Number.isFinite(h) ? Math.max(0, h) : 0;
}
function ruleShift(rules, ds) {
  if (!rules || !rules.length) return null;
  const n = dnOf(ds);
  const sorted = rules.slice().sort((a, b) => a.from < b.from ? -1 : 1);
  let r = sorted[0];
  for (const x of sorted) if (dnOf(x.from) <= n) r = x;
  if (r.type === 'weekly') return r.sequence[mod(dow(n) - 1, 7)]; // seq[0]=Mon
  return r.sequence[mod(n - dnOf(r.from), r.sequence.length)];
}
function shiftOn(ds, p = 0) {
  const rules = p === 0 ? data.rules : (data.people[0] && data.people[0].rules);
  if (p === 0 && data.overrides[ds]) return data.overrides[ds].shiftId;
  return ruleShift(rules, ds);
}
function textOn(hex) {
  const m = /^#?([\da-f]{6})$/i.exec(hex || ''); if (!m) return '#fff';
  const v = parseInt(m[1], 16), r = v >> 16 & 255, g = v >> 8 & 255, b = v & 255;
  const L = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  const lum = .2126 * L(r) + .7152 * L(g) + .0722 * L(b);
  return (lum + .05) / .05 > 1.05 / (lum + .05) ? '#111' : '#fff';
}
function monthStats(y, m) {
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const counts = {}; let hours = 0;
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const id = shiftOn(ds); if (!id) continue;
    counts[id] = (counts[id] || 0) + 1; hours += hoursOf(shiftById(id));
  }
  return { counts, hours, days };
}
const fmtH = h => (Number.isFinite(h) ? Math.round(h * 10) / 10 : 0).toLocaleString('zh-TW');

/* ---------- render calendar ---------- */
const grid = $('#grid');
let selDs = null;
function chip(s, extra) {
  const c = el('span', { class: 'chip' + (extra ? ' ' + extra : ''), text: s ? s.short : '?' });
  if (s) { c.style.background = s.color; c.style.color = textOn(s.color); c.style.setProperty('--c', s.color); }
  return c;
}
function render(dir) {
  const p2 = data.people[0] && data.people[0].on;
  $('#ym').textContent = `${curY} 年 ${curM} 月`; fitTitle();
  const who = $('#who'); who.textContent = data.name + (p2 ? '＋' + data.people[0].name : '');
  if (data.sample) who.append(' ', el('span', { class: 'sample', text: '範例' }));
  $('#intro').hidden = !data.sample;
  const wk = $('#wk'); wk.textContent = '';
  for (let i = 0; i < 7; i++) wk.append(el('span', { text: WD[(i + data.weekStart) % 7] }));
  grid.textContent = '';
  grid.classList.toggle('two', !!p2);
  const first = dnOf(`${curY}-${String(curM).padStart(2, '0')}-01`);
  const lead = mod(dow(first) - data.weekStart, 7);
  const start = first - lead, tdy = todayStr();
  for (let i = 0; i < 42; i++) {
    const n = start + i, ds = dsOf(n), [y, m, d] = ds.split('-').map(Number);
    const s1 = shiftById(shiftOn(ds));
    const w = dow(n);
    const cls = 'cell' + (m !== curM ? ' out' : '') + (ds === tdy ? ' today' : '') + (w === 0 || w === 6 ? ' wkend' : '') + (ds === selDs ? ' sel' : '');
    const label = `${m}月${d}日 星期${WD[w]} ${s1 ? s1.name : ''}`;
    const b = el('button', { class: cls, 'data-ds': ds, 'aria-label': label, type: 'button' }, el('span', { class: 'd', text: d }));
    const chips = el('span', { class: 'chips' });
    if (s1) chips.append(chip(s1));
    if (p2) {
      const s2 = shiftById(shiftOn(ds, 1)); if (s2) chips.append(chip(s2, 'p2'));
      if (isRest(s1) && isRest(s2)) b.append(el('span', { class: 'star', text: '★', 'aria-hidden': 'true' }));
    }
    b.append(chips);
    if (data.overrides[ds]) { b.append(el('span', { class: 'ov', 'aria-hidden': 'true' })); if (data.overrides[ds].note) b.append(el('span', { class: 'note-dot', 'aria-hidden': 'true' })); }
    grid.append(b);
  }
  if (dir && !matchMedia('(prefers-reduced-motion: reduce)').matches) { grid.style.setProperty('--dx', dir > 0 ? '30px' : '-30px'); grid.classList.remove('slide'); void grid.offsetWidth; grid.classList.add('slide'); }
  $('#legendNote').textContent = '紅色三角＝手動改班' + (p2 ? '；外框＝' + data.people[0].name + '；★＝共同休假' : '') + '。左右滑動月曆可切換月份。';
  renderStats();
}
function statsBox() {
  const st = monthStats(curY, curM);
  const pm = curM === 1 ? [curY - 1, 12] : [curY, curM - 1];
  const prev = monthStats(pm[0], pm[1]);
  const box = el('section', { class: 'stats', 'aria-label': '本月統計' }, el('h2', { text: `${curM} 月統計` }));
  const row = el('div', { class: 'srow' });
  for (const s of data.shifts) {
    const c = st.counts[s.id] || 0; if (!c) continue;
    row.append(el('span', { class: 'sitem' }, chip(s), el('span', { class: 'num', text: `${s.name} ${c} 天` })));
  }
  box.append(row);
  const diff = st.hours - prev.hours;
  box.append(el('div', { class: 'tot' }, el('span', { text: '總工時' }), el('b', { text: fmtH(st.hours) + ' h', id: 'totHours' }),
    el('span', { class: 'cmp num', text: diff === 0 ? '與上月相同' : `較上月 ${diff > 0 ? '+' : '−'}${fmtH(Math.abs(diff))} h` })));
  const acts = el('div', { class: 'actions' }, el('button', { class: 'btn pri', id: 'exportBtn', type: 'button', onclick: exportPng, text: '匯出班表圖片' }));
  box.append(acts);
  return box;
}
function renderStats() {
  const ms = $('#mstats'); ms.textContent = ''; ms.append(statsBox());
  const side = $('#side'); side.textContent = ''; side.append(statsBox());
  side.querySelector('#exportBtn').id = 'exportBtn2'; side.querySelector('#totHours').id = 'totHours2';
  if (selDs) side.append(dayPanel(selDs));
}
function dayPanel(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  const s = shiftById(shiftOn(ds)), ov = data.overrides[ds];
  const box = el('section', { class: 'stats', style: 'margin-top:12px' }, el('h2', { text: `${m} 月 ${d} 日 星期${WD[dow(dnOf(ds))]}` }));
  box.append(el('div', { class: 'sitem' }, chip(s), el('span', { text: s ? `${s.name}${isRest(s) ? '' : ' ' + s.start + '–' + s.end}` : '' })));
  if (ov && ov.note) box.append(el('p', { class: 'info', text: ov.note }));
  box.append(el('div', { class: 'actions' }, el('button', { class: 'btn', type: 'button', text: '改班／備註', onclick: () => openDay(ds) })));
  return box;
}

// 標題放不下時縮小字級（窄螢幕、較寬的字型），再不夠就去掉空白；h1 本身 overflow hidden，不會蓋到按鈕
function fitTitle() {
  const ym = $('#ym'); ym.style.fontSize = ''; ym.textContent = ym.textContent.replace(/(\d)年(\d+)月/, '$1 年 $2 月');
  let f = 20; const over = () => ym.scrollWidth > ym.clientWidth + 0.5;
  while (over() && f > 15) ym.style.fontSize = (--f) + 'px';
  if (over()) ym.textContent = `${curY}年${curM}月`;
  while (over() && f > 11) ym.style.fontSize = (--f) + 'px';
}
addEventListener('resize', fitTitle);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

/* ---------- navigation ---------- */
let monY = 0;
function renderMon() {
  $('#monY').textContent = monY + ' 年'; const g = $('#monGrid'); g.textContent = '';
  for (let m = 1; m <= 12; m++) g.append(el('button', { type: 'button', id: 'mon-' + m, 'aria-pressed': String(monY === curY && m === curM), text: m + ' 月', onclick: () => { curY = monY; curM = m; saveView(); $('#monDlg').close(); render(); } }));
}
$('#ymBtn').onclick = () => { monY = curY; renderMon(); openDlg($('#monDlg')); };
$('#monPrevY').onclick = () => { if (monY > 1900) monY--; renderMon(); };
$('#monNextY').onclick = () => { if (monY < 2200) monY++; renderMon(); };
function go(delta) { curM += delta; if (curM > 12) { curM = 1; curY++; } if (curM < 1) { curM = 12; curY--; } saveView(); render(delta); }
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#today').onclick = () => { const t = todayStr().split('-').map(Number); curY = t[0]; curM = t[1]; saveView(); render(); };
document.addEventListener('keydown', e => { if (document.querySelector('dialog[open]') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowLeft' && e.altKey) go(-1); if (e.key === 'ArrowRight' && e.altKey) go(1); });
let sw = null, swipedPid = null, screenAt = 0;
$('#cal').addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; swipedPid = null; });
$('#cal').addEventListener('pointerup', e => {
  if (!sw || sw.id !== e.pointerId) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { swipedPid = e.pointerId; go(dx < 0 ? 1 : -1); }
});
$('#cal').addEventListener('pointercancel', () => { sw = null; });
function openCell(ds) {
  selDs = ds;
  if (matchMedia('(min-width:900px)').matches) { const [y, m] = ds.split('-').map(Number); if (y !== curY || m !== curM) { curY = y; curM = m; saveView(); } render(); } else openDay(ds);
}
grid.addEventListener('click', e => { const c = e.target.closest('.cell'); if (c) openCell(c.dataset.ds); });

/* ---------- touch: act on pointerup ----------
   每個 pointerId 各自記下按到的控制項，在同一個控制項上放開（移動 < 10px，或在外擴 16px 的框內）才用 el.click() 執行一次，
   所以另一根手指放在畫面上時也點得到（那時瀏覽器不產生 click）。pointerdown 擋掉預設動作：按鈕不搶焦點，新畫面的輸入框不會被聚焦。
   瀏覽器之後補送的 click（CI 的 Chromium 141 是 detail 0、沒有 pointerType）在捕獲階段吞掉：
   放開後 800ms 內的 click 一律吞掉，除非之後按過 Enter／空白鍵；觸控層自己的 el.click() 用 firing 放行。
   沒有點按在前、單獨來的 detail 0 click（鍵盤、輔助科技）照常執行一次。 */
const TAP_SEL = 'button, label, input[type=checkbox], input[type=radio]';
const NATIVE_SEL = 'input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea';
const downs = new Map();
let firing = false, lastTapUp = -1e9, lastKey = -1e9;
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') lastKey = performance.now(); }, true);
addEventListener('keyup', e => { if (e.key === ' ') lastKey = performance.now(); }, true);
const outside = (d, x, y) => { const r = d.getBoundingClientRect(); return x < r.left || x > r.right || y < r.top || y > r.bottom; };
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target; if (!(t instanceof Element)) return;
  const now = performance.now();
  if (t.tagName === 'DIALOG' && t.open && outside(t, e.clientX, e.clientY)) { downs.set(e.pointerId, { el: t, backdrop: true, x: e.clientX, y: e.clientY, t: now }); e.preventDefault(); return; }
  const nat = t.closest(NATIVE_SEL);
  if (nat) { downs.set(e.pointerId, { el: nat, native: true, x: e.clientX, y: e.clientY, t: now }); return; } // 原生欄位照常聚焦、開選單
  const el = t.closest(TAP_SEL);
  if (!el || el.disabled) return;
  downs.set(e.pointerId, { el, x: e.clientX, y: e.clientY, t: now });
  e.preventDefault();
});
document.addEventListener('pointerup', e => {
  const d = downs.get(e.pointerId); if (!d) return;
  downs.delete(e.pointerId);
  let el = d.el; const still = Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10;
  if (d.native) {
    // 另一指放在畫面上時，瀏覽器不會替這一指聚焦：自己補上
    if (still && !el.disabled) setTimeout(() => { if (el.isConnected && document.activeElement !== el) { el.focus(); if (el.tagName === 'SELECT' || /^(date|time|color)$/.test(el.type)) try { el.showPicker(); } catch (er) {} } }, 80);
    return;
  }
  if (swipedPid === e.pointerId) { swipedPid = null; return; }

    [[1, '週一'], [0, '週日']].forEach(([v, t]) => ws.append(el('button', { type: 'button', id: 'ws-' + v, 'aria-pressed': String(draft.weekStart === v), text: t, onclick: () => { draft.weekStart = v; renderSettings(); } })));
    body.append(ws);
    body.append(el('span', { class: 'lbl', text: '外觀' }));
    const th = el('div', { class: 'seg' });
    [['auto', '跟隨系統'], ['light', '淺色'], ['dark', '深色']].forEach(([v, t]) => th.append(el('button', { type: 'button', id: 'theme-' + v, 'aria-pressed': String(theme === v), text: t, onclick: () => { theme = v; store.set('theme', v); applyTheme(); renderSettings(); } })));
    body.append(th);
    body.append(el('span', { class: 'lbl', text: '資料' }));
    body.append(el('div', { class: 'actions' },
      el('button', { type: 'button', class: 'btn', id: 'backup-export', text: '匯出備份（JSON）', onclick: exportBackup }),
      el('button', { type: 'button', class: 'btn', id: 'backup-import', text: '匯入備份', onclick: () => $('#impFile').click() })));
    body.append(el('div', { class: 'actions' },
      el('button', { type: 'button', class: 'btn', id: 'clear-ov', text: `清除所有手動改班（${Object.keys(draft.overrides).length}）`, onclick: async () => { if (await confirmBox('會刪除所有手動改班與備註，規則不受影響。', '清除')) { draft.overrides = {}; renderSettings(); } } }),
      el('button', { type: 'button', class: 'btn dan', id: 'reset-all', text: '還原範例資料', onclick: async () => { if (await confirmBox('會清除你所有的班別、規則與改班，回到範例。', '還原')) { draft = sampleData(); segIdx = 0; renderSettings(); } } })));
    body.append(el('p', { class: 'hint', text: '資料只存在這台裝置的瀏覽器中。換手機或清除瀏覽器前，先匯出備份。' }));
  }
}
$('#setSave').onclick = () => {
  const err = m => { $('#setErr').textContent = m; };
  if (draft.shifts.some(s => !s.short || !s.name)) return err('每個班別都需要名稱與簡稱。');
  if (draft.shifts.some(s => (s.start && !s.end) || (!s.start && s.end))) return err('上下班時間要同時填寫，或同時留空（休假）。');
  const all = [...draft.rules, ...(draft.people[0].on ? draft.people[0].rules : [])];
  if (all.some(r => !r.sequence.length)) return err('循環序列是空的，至少要有 1 天。');
  if (all.some(r => !validDate(r.from))) return err('請填寫規則的起始日。');
  const dupFrom = rs => new Set(rs.map(r => r.from)).size !== rs.length;
  if (dupFrom(draft.rules)) return err('兩段規則的起始日相同，請修改。');
  if (draft.people[0].on && dupFrom(draft.people[0].rules)) return err(`${draft.people[0].name}有兩段規則的起始日相同，請修改。`);
  if (!draft.people[0].rules.length) draft.people[0].rules = [{ from: todayStr(), type: 'cycle', sequence: [draft.shifts[0].id] }];
  draft.sample = false;
  // 只把這次在設定裡改過的部分套到最新資料上（期間別的分頁改的單日班別不會被蓋掉）
  data = sanitize(merge3(draftBase, draft, clone(data))) || draft; save(); draft = null; $('#setDlg').close(); render(); toast('設定已儲存');
};

/* ---------- backup (JSON) ---------- */
async function exportBackup() {
  const txt = JSON.stringify({ app: 'shift-calendar', version: 1, exportedAt: new Date().toISOString(), data }, null, 1);
  const fname = `班表備份-${todayStr()}.json`, blob = new Blob([txt], { type: 'application/json' });
  if (dl) { try { await dl.save({ filename: fname, data: blob }); toast('已匯出 ' + fname); return; } catch (e) { if (String(e && (e.message || e)).toLowerCase().includes('declin')) return; } }
  const a = el('a', { href: URL.createObjectURL(blob), download: fname }); document.body.append(a);
  const f0 = firing; firing = true; try { a.click(); } finally { firing = f0; } a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已匯出 ' + fname);
}
$('#impFile').addEventListener('change', async () => {
  const f = $('#impFile').files[0]; $('#impFile').value = ''; if (!f) return;
  let d = null;
  try { const j = JSON.parse(await f.text()); d = sanitize(j && j.data && j.app === 'shift-calendar' ? j.data : j); } catch (e) { d = null; }
  if (!d) { toast('檔案不是班表備份，未匯入'); return; }
  const n = Object.keys(d.overrides).length;
  if (!(await confirmBox(`會用備份取代目前的班別、規則與 ${n} 筆改班。`, '匯入'))) return;
  const prev = clone(data); d.sample = false;
  data = d; save(); draft = null; if ($('#setDlg').open) $('#setDlg').close(); render();
  toast('已匯入備份', { label: '復原', fn: () => { data = prev; save(); render(); toast('已復原匯入前的資料'); } });
});

/* ---------- export PNG ---------- */
let dl = null;
(async () => { try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; } })();
function drawPng() {
  const W = 1080, pad = 56, cw = (W - pad * 2) / 7, ch = 132, p2 = data.people[0] && data.people[0].on;
  const H = 210 + 56 + ch * 6 + 260;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const F = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#151b26'; g.font = `800 64px ${F}`; g.textBaseline = 'alphabetic';
  g.fillText(`${curY} 年 ${curM} 月`, pad, 120);
  g.font = `600 32px ${F}`; g.fillStyle = '#4f5867'; g.fillText(data.name + (p2 ? '＋' + data.people[0].name : ''), pad, 170);
  g.fillStyle = '#151b26'; g.fillRect(pad, 196, W - pad * 2, 4);
  const top = 210;
  g.fillRect(pad, top, W - pad * 2, 56);
  g.fillStyle = '#ffffff'; g.font = `700 28px ${F}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 7; i++) g.fillText(WD[(i + data.weekStart) % 7], pad + cw * i + cw / 2, top + 28);
  const first = dnOf(`${curY}-${String(curM).padStart(2, '0')}-01`), start = first - mod(dow(first) - data.weekStart, 7);
  const y0 = top + 56;
  for (let i = 0; i < 42; i++) {
    const n = start + i, ds = dsOf(n), m = Number(ds.slice(5, 7)), d = Number(ds.slice(8));
    const x = pad + (i % 7) * cw, y = y0 + Math.floor(i / 7) * ch, out = m !== curM;
    g.fillStyle = out ? '#f3f4f6' : '#ffffff'; g.fillRect(x, y, cw, ch);
    g.strokeStyle = '#d5d9e0'; g.lineWidth = 2; g.strokeRect(x, y, cw, ch);
    g.globalAlpha = out ? .4 : 1;
    const w = dow(n); g.fillStyle = (w === 0 || w === 6) ? '#c63d28' : '#151b26';
    g.font = `700 28px ${F}`; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(String(d), x + 12, y + 10);
    const ids = [shiftOn(ds)]; if (p2) ids.push(shiftOn(ds, 1));
    const bw = p2 ? (cw - 30) / 2 : cw - 24, bh = 62;
    ids.forEach((id, k) => {
      const s = shiftById(id); if (!s) return;
      const bx = x + 12 + k * (bw + 6), by = y + 54;
      if (k === 1) { g.fillStyle = '#ffffff'; roundRect(g, bx + 2, by + 2, bw - 4, bh - 4, 9); g.fill(); g.strokeStyle = s.color; g.lineWidth = 4; g.stroke(); }
      else { g.fillStyle = s.color; roundRect(g, bx, by, bw, bh, 10); g.fill(); }
      g.fillStyle = k === 1 ? '#151b26' : textOn(s.color); g.font = `800 ${p2 ? 34 : 40}px ${F}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(s.short, bx + bw / 2, by + bh / 2 + 2);
    });
    if (data.overrides[ds]) { g.fillStyle = '#d6452f'; g.beginPath(); g.moveTo(x + cw - 26, y + 2); g.lineTo(x + cw - 2, y + 2); g.lineTo(x + cw - 2, y + 26); g.fill(); }
    if (p2 && isRest(shiftById(ids[0])) && isRest(shiftById(ids[1]))) { g.fillStyle = '#d6452f'; g.font = `800 26px ${F}`; g.textAlign = 'right'; g.textBaseline = 'top'; g.fillText('★', x + cw - 12, y + 10); }
    g.globalAlpha = 1;
  }
  // legend + stats
  const st = monthStats(curY, curM);
  let ly = y0 + ch * 6 + 50, lx = pad;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  for (const s of data.shifts) {
    const label = `${s.name}${isRest(s) ? '' : ' ' + s.start + '–' + s.end}  ${st.counts[s.id] || 0} 天`;
    g.font = `500 26px ${F}`; const tw = g.measureText(label).width;
    if (lx + 52 + tw > W - pad) { lx = pad; ly += 56; }
    g.fillStyle = s.color; roundRect(g, lx, ly - 20, 40, 40, 7); g.fill();
    g.fillStyle = textOn(s.color); g.font = `800 24px ${F}`; g.textAlign = 'center'; g.fillText(s.short, lx + 20, ly + 1);
    g.fillStyle = '#151b26'; g.font = `500 26px ${F}`; g.textAlign = 'left'; g.fillText(label, lx + 52, ly);
    lx += 52 + tw + 34;
  }
  ly += 70;
  g.fillStyle = '#151b26'; g.font = `800 40px ${F}`; g.fillText(`總工時 ${fmtH(st.hours)} 小時`, pad, ly);
  g.font = `500 24px ${F}`; g.fillStyle = '#6b7280'; g.textAlign = 'right';
  g.fillText((p2 ? '★ 共同休假　' : '') + '紅色三角＝手動改班', W - pad, ly);
  return c;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function exportPng() {
  const c = drawPng();
  const fname = `班表-${curY}-${String(curM).padStart(2, '0')}.png`;
  if (dl) {
    try {
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await dl.save({ filename: fname, data: blob }); toast('已匯出 ' + fname); return;
    } catch (e) { if (String(e && (e.message || e)).toLowerCase().includes('declin')) return; }
  }
  $('#expImg').src = c.toDataURL('image/png');
  $('#expMsg').textContent = '長按（或右鍵）圖片即可儲存或分享給家人。';
  openDlg($('#expDlg'));
}

window.__sc = { ruleShift, shiftOn, hoursOf, monthStats, dnOf, dsOf, get data() { return data; }, drawPng, sanitize, get draft() { return draft; } };
render();
})();
</script>
