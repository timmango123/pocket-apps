<title>水平儀</title>
<style>
/* A machinist's spirit level: brushed-aluminium body, lime vial fluid, a white bubble. Turns green when level. */
:root {
  --bg: #e6e7e3; --bg-level: #cfeccf;
  --panel: #f5f5f2; --line: rgba(22, 26, 30, .14); --line-2: rgba(22, 26, 30, .26);
  --ink: #1a1e22; --ink-2: #394048; --muted: #5a6168;
  --metal-1: #fbfbf9; --metal-2: #cdcfcb; --metal-3: #a3a7a7;
  --fluid-1: #f1f9b4; --fluid-2: #cfe45e; --fluid-3: #9fbb2c;
  --mark: rgba(36, 48, 8, .62); --mark-soft: rgba(36, 48, 8, .3);
  --bubble: rgba(255, 255, 255, .93); --bubble-rim: rgba(70, 90, 20, .45);
  --needle: #d2422a; --ok: #1f7f43; --ok-ink: #ffffff; --warn: #8a4b00; --warn-bg: #fff0d4;
  --on: #1a1e22; --on-ink: #ffffff; --focus: #1b56d6;
  --scrim: rgba(12, 14, 16, .55);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --bg-level: #0c2a18;
    --panel: #1b1e21; --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .22);
    --ink: #eceff1; --ink-2: #c4c9ce; --muted: #8e959c;
    --metal-1: #484d53; --metal-2: #2a2e32; --metal-3: #16181a;
    --fluid-1: #cfe868; --fluid-2: #93ba28; --fluid-3: #3f580c;
    --mark: rgba(12, 22, 0, .7); --mark-soft: rgba(12, 22, 0, .35);
    --bubble: rgba(250, 255, 235, .92); --bubble-rim: rgba(40, 60, 0, .5);
    --needle: #ff7b55; --ok: #46d07f; --ok-ink: #062012; --warn: #ffc06e; --warn-bg: #2d2010;
    --on: #eceff1; --on-ink: #111315; --focus: #8fb2ff; --scrim: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --bg-level: #0c2a18;
  --panel: #1b1e21; --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .22);
  --ink: #eceff1; --ink-2: #c4c9ce; --muted: #8e959c;
  --metal-1: #484d53; --metal-2: #2a2e32; --metal-3: #16181a;
  --fluid-1: #cfe868; --fluid-2: #93ba28; --fluid-3: #3f580c;
  --mark: rgba(12, 22, 0, .7); --mark-soft: rgba(12, 22, 0, .35);
  --bubble: rgba(250, 255, 235, .92); --bubble-rim: rgba(40, 60, 0, .5);
  --needle: #ff7b55; --ok: #46d07f; --ok-ink: #062012; --warn: #ffc06e; --warn-bg: #2d2010;
  --on: #eceff1; --on-ink: #111315; --focus: #8fb2ff; --scrim: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4;
  min-height: 100vh; min-height: 100dvh; overflow-x: hidden; transition: background-color .35s ease;
  -webkit-tap-highlight-color: transparent;
}
body.is-level { background: var(--bg-level); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 460px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 12px; }

.top { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.top h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .04em; flex: 1; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.top h1 small { font: 600 11px var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.tbtn { min-width: 44px; min-height: 44px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; cursor: pointer; font-size: 14px; font-weight: 600; }
.tbtn svg { width: 20px; height: 20px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { min-height: 44px; border: 0; border-radius: 11px; background: transparent; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button svg { width: 20px; height: 20px; flex: none; }
.seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }

/* ---------- instrument stage ---------- */
.stage { position: relative; min-height: 318px; display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.metal {
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,.035) 1px 3px),
    linear-gradient(160deg, var(--metal-1), var(--metal-2) 55%, var(--metal-3));
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 -1px 0 rgba(0,0,0,.12) inset, 0 10px 26px rgba(0,0,0,.16), 0 2px 4px rgba(0,0,0,.12);
}
.fluid {
  background: radial-gradient(circle at 50% 42%, var(--fluid-1), var(--fluid-2) 58%, var(--fluid-3));
  box-shadow: inset 0 6px 14px rgba(0,0,0,.28), inset 0 -3px 8px rgba(255,255,255,.25);
}
.bubble {
  position: absolute; left: 50%; top: 50%; border-radius: 50%; will-change: transform; pointer-events: none;
  background: radial-gradient(circle at 38% 32%, #fff 0 18%, var(--bubble) 42%, rgba(255,255,255,.55) 72%, rgba(255,255,255,.25));
  box-shadow: 0 0 0 1px var(--bubble-rim), 0 2px 6px rgba(0,0,0,.18) inset, 0 1px 2px rgba(255,255,255,.4);
}
/* flat: bullseye vial */
.vial { position: relative; width: min(280px, calc(100vw - 64px)); aspect-ratio: 1; border-radius: 50%; }
.vial .fluid { position: absolute; inset: 3.6%; border-radius: 50%; overflow: hidden; }
.vial svg.marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.marks .ring { fill: none; stroke: var(--mark); stroke-width: 1.6; }
.marks .ring.soft { stroke: var(--mark-soft); stroke-dasharray: 3 4; }
.marks .cross { stroke: var(--mark-soft); stroke-width: 1.2; }
.marks text { fill: var(--mark); font: 600 9px var(--mono); }
body.is-level .marks .ring:not(.soft) { stroke: var(--ok); stroke-width: 2.4; }
#fBubble { width: 15.7%; height: 15.7%; margin: -7.85% 0 0 -7.85%; }

/* edge: tubular vial */
.tube-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.tube { position: relative; width: 100%; height: 80px; border-radius: 40px; padding: 9px; }
.tube .fluid { position: relative; width: 100%; height: 100%; border-radius: 31px; overflow: hidden; background: linear-gradient(180deg, var(--fluid-1), var(--fluid-2) 45%, var(--fluid-3)); }
.tube svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tube svg line { stroke: var(--mark); stroke-width: 1.5; }
.tube svg line.minor { stroke: var(--mark-soft); }
.tube svg line.zero { stroke-width: 2.4; }
body.is-level .tube svg line.zero { stroke: var(--ok); }
#eBubble { width: 72px; height: 40px; margin: -20px 0 0 -36px; border-radius: 20px; }
.bigdeg { font: 700 64px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 2px; }
.bigdeg small { font-size: 30px; font-weight: 600; color: var(--muted); }
.subline { font-size: 14px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.subline b { color: var(--ink-2); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ref-tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--panel); }

/* protractor */
.prot { width: 100%; max-width: 360px; }
.prot svg { width: 100%; height: auto; display: block; }
.prot .face { fill: url(#metalGrad); stroke: var(--line-2); stroke-width: 1; }
.prot .tick { stroke: var(--ink-2); stroke-width: 1; }
.prot .tick.mid { stroke-width: 1.4; }
.prot .tick.maj { stroke-width: 2; stroke: var(--ink); }
.prot .num { fill: var(--ink-2); font: 600 11px var(--mono); }
.prot .sweep { fill: var(--needle); opacity: .16; }
.prot .needle { stroke: var(--needle); stroke-width: 3; stroke-linecap: round; }
.prot .hub { fill: var(--needle); }
.prot .base { stroke: var(--ink); stroke-width: 2; }

/* ---------- readouts ---------- */
.reads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.read { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px 9px; min-width: 0; }
.read span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.read b { display: block; font: 700 26px/1.15 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.02em; }
.read b small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 1px; }
body.is-level .read.key b { color: var(--ok); }

.status { min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--ink-2); text-align: center; }
.status .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; background: var(--panel); border: 1px solid var(--line); }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.status.level .pill { background: var(--ok); color: var(--ok-ink); border-color: transparent; }
.status.level .dot { background: var(--ok-ink); }
.status.warn .pill { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.status.warn .dot { background: var(--warn); }
.status button.link { border: 0; background: none; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; min-height: 32px; padding: 0 2px; }

/* ---------- controls ---------- */
.ctrls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cbtn { min-height: 56px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--ink); }
.cbtn svg { width: 20px; height: 20px; flex: none; }
.cbtn[aria-pressed="true"] { background: var(--on); color: var(--on-ink); border-color: var(--on); }
@media (hover: hover) { .cbtn:hover, .tbtn:hover, .seg button:not([aria-pressed="true"]):hover { border-color: var(--ink-2); } }
.lockmark { display: none; }
body.is-locked .lockmark { display: inline-flex; color: var(--needle); }
.lockmark svg { width: 18px; height: 18px; }

/* ---------- gate ---------- */
.gate { background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.gate p { margin: 0; color: var(--ink-2); font-size: 14px; }
.go { min-height: 56px; border-radius: 14px; border: 0; background: var(--on); color: var(--on-ink); font-size: 17px; font-weight: 800; letter-spacing: .04em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.go svg { width: 22px; height: 22px; }
.go:disabled { opacity: .5; cursor: default; }
.msg { border-radius: 12px; padding: 10px 12px; background: var(--warn-bg); color: var(--ink); font-size: 14px; border: 1px solid var(--line); }
.msg strong { display: block; color: var(--warn); margin-bottom: 2px; font-size: 15px; }
.msg a { color: var(--focus); font-weight: 700; word-break: break-all; }
.fine { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

/* ---------- calibration sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet { background: var(--panel); color: var(--ink); width: 100%; max-width: 420px; border-radius: 18px; padding: 18px; border: 1px solid var(--line-2); box-shadow: 0 20px 60px rgba(0,0,0,.35); max-height: calc(100% - 16px); overflow: auto; margin-bottom: env(safe-area-inset-bottom); }
.sheet h2 { margin: 0 0 6px; font-size: 19px; }
.sheet p { margin: 6px 0; font-size: 14px; color: var(--ink-2); }
.steps { display: grid; gap: 8px; margin: 12px 0; }
.stepc { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 14px; }
.stepc i { font-style: normal; flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 1.5px solid var(--line-2); font-size: 13px; }
.stepc.on { border-color: var(--on); }
.stepc.done i { background: var(--ok); color: var(--ok-ink); border-color: transparent; }
.stepc b { display: block; }
.countdown { font: 700 15px var(--mono); color: var(--needle); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink); }
.btn.primary { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.btn:disabled { opacity: .45; cursor: default; }

#toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: var(--on); color: var(--on-ink); padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

@media (min-width: 720px) and (min-height: 600px) { .wrap { padding-top: 24px; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

  });
  $('#pClear').addEventListener('click', function () { R.ref = null; R.p = null; $('#pRef').textContent = '基準：水平面'; this.hidden = true; });
  $('#calCancel').addEventListener('click', function () { $('#calDlg').hidden = true; R.capture = null; });
  $('#calReset').addEventListener('click', function () {
    if (cal.mode === 'edge') S.offset.edge = 0; else { S.offset.x = 0; S.offset.y = 0; }
    save(); calRender(); toast('已清除校正');
  });
  $('#calStep').addEventListener('click', function () {
    var btn = this;
    if (cal.step >= 2) { $('#calDlg').hidden = true; return; }
    if (!R.got) { toast('還沒有感測器資料'); return; }
    btn.disabled = true;
    var cd = cal.step === 0 ? $('#cd1') : $('#cd2');
    countdown(cd, cal.step === 1 && cal.mode === 'edge' ? 4 : 2, function () {
      sample(600, function (r) {
        btn.disabled = false;
        if (!r) { cd.textContent = '沒有資料'; return; }
        cd.textContent = '✓'; buzz(30);
        if (cal.step === 0) { cal.r1 = r; cal.step = 1; }
        else {
          if (cal.mode === 'edge') S.offset.edge = calibOffsetAngle(cal.r1.edge, r.edge);
          else { S.offset.x = calibOffset(cal.r1.x, r.x); S.offset.y = calibOffset(cal.r1.y, r.y); }
          if (Math.abs(S.offset.x) > 8 || Math.abs(S.offset.y) > 8 || Math.abs(S.offset.edge) > 8) {
            S.offset = { x: 0, y: 0, edge: 0 }; cd.textContent = '偏差過大，請確認兩次放在同一位置'; cal.step = 0; calRender(); return;
          }
          save(); cal.step = 2; toast('校正完成');
        }
        calRender();
      });
    });
  });

  // ---------- drawing ----------
  var hint = null;
  function setStatus(kind, text, action) {
    var el = $('#status');
    el.className = 'status' + (kind ? ' ' + kind : '');
    var key = kind + '|' + text + '|' + (action ? action.label : '');
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    $('#statusText').textContent = text;
    var old = el.querySelector('button.link'); if (old) old.remove();
    if (action) { var b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = action.label; b.addEventListener('click', action.fn); el.querySelector('.pill').appendChild(b); }
  }
  function readings() {
    if (R.x == null) return null;
    var o = S.offset, x = R.x - o.x, y = R.y - o.y, e = norm180(R.e - o.edge), ed = edgeDeviation(e);
    return { x: x, y: y, e: e, dev: ed.dev, ref: ed.ref, p: R.p, gz: R.g ? R.g[2] : 9.81,
      sx: stdev(R.hx), sy: stdev(R.hy), se: stdev(R.he), sp: stdev(R.hp) };
  }
  var shown = null;
  function draw(force) {
    var r = readings();
    if (R.locked && !force) return;
    if (R.locked && shown) r = shown;
    if (!r) return;
    shown = r;
    var vial = $('#vial'), m, unsteady;
    if (S.mode === 'flat') {
      var w = vial.offsetWidth || 280, k = w / 280, off = bubbleOffset(r.x, r.y, 10, 108 * k);
      $('#fBubble').style.transform = 'translate(' + off[0].toFixed(2) + 'px,' + off[1].toFixed(2) + 'px)';
      $('#r1').innerHTML = fmt(r.x) + '<small>°</small>';
      $('#r2').innerHTML = fmt(r.y) + '<small>°</small>';
      var tot = Math.hypot(r.x, r.y);
      $('#r3').innerHTML = (tot > 60 ? '—' : slopePct(tot).toFixed(1)) + '<small>%</small>';
      m = Math.max(Math.abs(r.x), Math.abs(r.y)); unsteady = Math.max(r.sx, r.sy) > 0.5;
    } else if (S.mode === 'edge') {
      var fl = $('#tube .fluid'), half = (fl.offsetWidth || 340) / 2 - 40;
      $('#eBubble').style.transform = 'translateX(' + tubeOffset(r.dev, 5, half).toFixed(2) + 'px)';
      $('#eBig').innerHTML = fmt(r.dev) + '<small>°</small>';
      $('#eRef').textContent = r.ref === 'plumb' ? '以垂直為準' : '以水平為準';
      $('#eSlope').textContent = slopePct(Math.abs(r.dev)).toFixed(1) + '%';
      $('#eRaw').textContent = fmt(r.e) + '°';
      $('#r1').innerHTML = fmt(r.dev) + '<small>°</small>';
      $('#r2').innerHTML = slopePct(Math.abs(r.dev)).toFixed(1) + '<small>%</small>';
      $('#r3').innerHTML = fmt(r.e) + '<small>°</small>';
      m = r.dev; unsteady = r.se > 0.5;
    } else {
      var a = Math.max(0, Math.min(180, r.p || 0)), rad = a / DEG, cx = 160, cy = 172, Rr = 118;
      $('#pNeedle').setAttribute('transform', 'rotate(' + (-a).toFixed(2) + ' 160 172)');
      $('#pSweep').setAttribute('d', a < 0.05 ? '' : 'M160 172 L' + (cx + Rr) + ' 172 A' + Rr + ' ' + Rr + ' 0 0 0 ' + (cx + Math.cos(rad) * Rr).toFixed(2) + ' ' + (cy - Math.sin(rad) * Rr).toFixed(2) + ' Z');
      $('#pBig').innerHTML = fmt(a) + '<small>°</small>';
      $('#r1').innerHTML = fmt(a) + '<small>°</small>';
      $('#r2').innerHTML = (a > 80 ? '—' : slopePct(a).toFixed(1)) + '<small>%</small>';
      var flat = R.g ? tilt(R.g[0], R.g[1], R.g[2], 0).total : 0;
      $('#r3').innerHTML = fmt(flat) + '<small>°</small>';
      m = a; unsteady = r.sp > 0.5;
    }
    if (R.locked) { setStatus('', '讀數已鎖定，再按一次解除'); return; }
    var lv = levelState(R.level, m, 0.3, 0.4);
    if (lv && !R.level) buzz(40);
    R.level = lv;
    document.body.classList.toggle('is-level', lv);
    if (S.mode === 'flat' && Math.abs(r.gz) < 2) setStatus('warn', '手機接近直立，平面模式不準', { label: '改用邊緣', fn: function () { setMode('edge'); } });
    else if (unsteady) setStatus('warn', '請保持穩定');
    else if (lv) setStatus('level', S.mode === 'prot' ? '與基準相同' : S.mode === 'edge' && r.ref === 'plumb' ? '已垂直' : '已水平');
    else setStatus('', S.mode === 'prot' ? '相對角度' : '偏離 ' + fmt(Math.abs(m)) + '°');
    // sound
    if (S.sound && AC && document.visibilityState === 'visible') {
      var iv = beepInterval(m);
      if (iv === 0) tone(true);
      else { tone(false); var now = performance.now(); if (iv != null && now >= nextBeep) { beep(); nextBeep = now + iv; } }
    }
  }
  function loop() {
    cancelAnimationFrame(R.raf);
    var f = function () { if (!R.running || document.visibilityState === 'hidden') return; draw(); R.raf = requestAnimationFrame(f); };
    R.raf = requestAnimationFrame(f);
  }

  setMode(S.mode);
  // for demo/verify.js
  window.__level = { R: R, S: S, readings: readings, setForceAngle: function (a) { R.forceAngle = a; }, draw: draw };
})();
</script>
