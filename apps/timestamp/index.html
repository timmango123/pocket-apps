<title>時間戳轉換</title>
<style>

  --tick:#4a6182; --live-bg:#17243a; --live-ink:#e3e9f2; --warn:#f3bb62; --warn-soft:#33260f; --bad:#ff8a7e; --bad-soft:#3a1916; --ok:#7fd6a3;

:root[data-theme="dark"]{

  --tick:#4a6182; --live-bg:#17243a; --live-ink:#e3e9f2; --warn:#f3bb62; --warn-soft:#33260f; --bad:#ff8a7e; --bad-soft:#3a1916; --ok:#7fd6a3;

.refline{font-size:13px;color:var(--muted);margin:0 0 8px}

<div class="wrap">
<header class="top"><h1>時間戳轉換</h1><span>UNIX EPOCH · 本機計算</span></header>

<section class="live" aria-label="目前時間戳">
  <button class="val" id="liveCopy" aria-label="複製目前秒數"><span class="cap">NOW · UNIX 秒</span><span class="sec" id="liveSec">0</span><span class="ms" id="liveMs">0 ms</span></button>
  <span class="sp"></span>
  <button class="btn" id="livePause">暫停</button>
  <i class="sweep" id="sweep"></i>
</section>

<div class="grid">
  <div class="col">
    <section class="panel" aria-labelledby="h-ts">
      <h2 id="h-ts">時間戳 → 日期 <span class="tag" id="tsSample">範例</span></h2>
      <div class="row">
        <div class="grow"><label class="fl" for="tsIn">時間戳或日期字串</label><input type="text" id="tsIn" class="big" value="1700000000" inputmode="text" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="grow"><label class="fl" for="unit">單位</label>
          <select id="unit"><option value="auto">自動判斷</option><option value="s">秒</option><option value="ms">毫秒</option><option value="us">微秒</option><option value="ns">奈秒</option></select></div>
        <div style="align-self:flex-end"><button class="btn" id="tsNow">現在</button></div>
      </div>
      <div id="tsOut"></div>
    </section>
    <section class="panel" aria-labelledby="h-dt">
      <h2 id="h-dt">日期 → 時間戳</h2>
      <div class="row">
        <div class="grow" style="min-width:190px"><label class="fl" for="dtIn">日期與時間</label><input type="datetime-local" id="dtIn"></div>
        <div style="width:92px"><label class="fl" for="dtSec">秒</label><input type="number" id="dtSec" min="0" max="59" value="0" inputmode="numeric"></div>
      </div>
      <div style="margin-top:8px"><label class="fl" for="dtZone">時區</label><select id="dtZone"></select></div>
      <div id="dtOut"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel" aria-labelledby="h-z">
      <h2 id="h-z">多時區對照</h2>
      <p class="refline" id="zoneRef"></p>
      <label class="row chk" id="zoneLiveLbl" style="min-height:44px;font-size:14px;margin-bottom:8px;cursor:pointer"><input type="checkbox" id="zoneLive" style="width:20px;height:20px;accent-color:var(--accent)"> 改用現在時間（每秒更新）</label>
      <ul class="zones" id="zones"></ul>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="fl" for="zoneAdd">加入時區</label><select id="zoneAdd"></select></div>
        <div style="align-self:flex-end"><button class="btn pri" id="zoneAddBtn">＋ 加入</button></div>
      </div>
      <p class="refline" style="margin:8px 0 0">點時間可複製；在列上向左滑或按 × 可刪除。</p>
    </section>
    <section class="panel">
      <details id="batch">
        <summary>批次轉換</summary>
        <label class="fl" for="batchIn" style="margin-top:6px">每行一個時間戳或日期（範例資料，可直接替換；內容會保存在本機）</label>
        <textarea id="batchIn" spellcheck="false">0
1700000000
1700000000123
1700000000123456789
-86400
1700000000.5
2024/02/29 12:00:00
hello</textarea>
        <div class="bt" id="batchOut"></div>
        <div class="row" style="margin-top:10px"><span style="flex:1;font-size:13px;color:var(--muted)" id="batchMeta"></span><button class="btn" id="batchCopy">複製表格（TSV）</button></div>
      </details>
    </section>
  </div>
</div>
</div>
<div id="toastHost" aria-live="polite"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("timestamp:v1:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

let toastT;

[["Asia/Calcutta", "加爾各答"], ["Asia/Saigon", "胡志明市"], ["Asia/Rangoon", "仰光"], ["Asia/Katmandu", "加德滿都"]].forEach(([k, v]) => CITY.set(k, v));
const cityOf = z => CITY.get(z) || z.split("/").pop().replace(/_/g, " ");

const fdiv = (a, b) => Math.floor(a / b);
function daysFromCivil(y, m, d){ y -= m <= 2 ? 1 : 0; const era = fdiv(y, 400), yoe = y - era * 400, doy = fdiv(153 * (m + (m > 2 ? -3 : 9)) + 2, 5) + d - 1, doe = yoe * 365 + fdiv(yoe, 4) - fdiv(yoe, 100) + doy; return era * 146097 + doe - 719468; }

   The browser's own click afterwards (Chromium 141: detail 0, no pointerType) is swallowed in the capture phase: any click
