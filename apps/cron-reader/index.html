<title>Cron 解讀器</title>
<style>
/* Station timetable: lichen-grey board, moss signal for the active field, mustard departure markers */
:root{
  --bg:#e9ebe3; --surface:#f8f9f4; --sunk:#eff1ea; --ink:#1a1e15; --muted:#4f5646; --faint:#636a56;

  --shadow:0 12px 30px rgba(26,30,21,.16);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130e; --surface:#191c15; --sunk:#141611; --ink:#e4e8da; --muted:#a6ad97; --faint:#8d947f;
  --line:#2a2f23; --line-strong:#3f4636; --accent:#a3d063; --accent-ink:#152005; --accent-soft:#25331a;
  --mark:#f0c04a; --mark-soft:#3a2f10; --bad:#ff8c80; --bad-soft:#3a1a16; --warn:#f2bf66; --warn-soft:#352812;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11130e; --surface:#191c15; --sunk:#141611; --ink:#e4e8da; --muted:#a6ad97; --faint:#8d947f;
  --line:#2a2f23; --line-strong:#3f4636; --accent:#a3d063; --accent-ink:#152005; --accent-soft:#25331a;
  --mark:#f0c04a; --mark-soft:#3a2f10; --bad:#ff8c80; --bad-soft:#3a1a16; --warn:#f2bf66; --warn-soft:#352812;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 calc(32px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
header.top h1{margin:0;font-size:20px;font-weight:800;flex:1;min-width:140px;letter-spacing:.02em}

.seg button{min-height:44px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

@media (hover:hover){.btn:hover,.chip:hover{border-color:var(--accent)}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.expr{width:100%;min-height:58px;font:700 24px var(--mono);letter-spacing:.06em;padding:8px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--sunk)}
.expr:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.errbox{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:2px;font-size:14px}

.lblrow{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.lblrow .fl{flex:1;margin:0;align-self:center}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:440px}
.keys button{flex:1 1 0;min-width:44px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;font:700 18px var(--mono);cursor:pointer;color:var(--ink);padding:0}
.keys button.sp{flex:2 1 0;font:650 14px var(--sans)}
.fields .f.x{border-style:dashed}
.say .warn{display:block;font-size:13.5px;font-weight:650;color:var(--warn);margin-top:6px}
.chips.hist{padding-top:6px;align-items:center}
.chips .lab{flex:none;font-size:12.5px;color:var(--muted);padding-right:2px}
.chip.mono{font:650 13.5px var(--mono)}
.chip.mono small{font:600 11px var(--sans);color:var(--muted);margin-left:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:650;white-space:nowrap}
.grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.panel h2{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.fl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
select,input[type=number]{min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:6px 10px;font-size:14px;width:100%}
select:focus,input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.runs{list-style:none;margin:0;padding:0;counter-reset:r}
.runs li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line-strong);counter-increment:r}
.runs li::before{content:counter(r);font:700 12px var(--mono);color:var(--faint);text-align:right}
.runs li:first-child .tm{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark)}
.runs .tm{font:700 16px var(--mono);font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:2px;overflow-wrap:anywhere}
.runs .tm em{font-style:normal;font-family:var(--sans);font-weight:700;color:var(--accent);margin:0 6px}
.runs .rel{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.runs .dup{display:block;font:500 12px var(--sans);color:var(--warn);overflow-wrap:anywhere}
.runs li.gap .tm{text-decoration:line-through;text-decoration-thickness:1.5px}
.runs li.gap .tm .dup{text-decoration:none;display:block}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
details.ve summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:800;font-size:15px;list-style:none;gap:8px}
details.ve summary::-webkit-details-marker{display:none}
details.ve summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
details.ve[open] summary::before{transform:rotate(45deg)}
.vtabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.vtabs button{flex:1;min-width:44px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;font-weight:700;cursor:pointer;color:var(--muted)}
.vtabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.vmodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.vmodes button{min-height:44px;border:0;background:var(--sunk);font-weight:650;font-size:14px;cursor:pointer;color:var(--muted)}
.vmodes button+button{border-left:1px solid var(--line-strong)}
.vmodes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.vbody{margin-top:10px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cells button{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;font:700 14px var(--mono);cursor:pointer;color:var(--ink);padding:0}
.cells button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cells.wide{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
.vnote{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:400px){.runs .tm{font-size:14px}.runs .tm em{margin:0 4px}.runs li{gap:8px;grid-template-columns:22px minmax(0,1fr) auto}.say{font-size:19px}.expr{font-size:21px}.seg button{padding:0 9px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("cron-reader:v1:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("cron-reader:v1:" + k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(msg){ const h = $("toastHost"); h.innerHTML = ""; const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, 2000); }
const pad = n => String(n).padStart(2, "0");
const WD = ["日", "一", "二", "三", "四", "五", "六"];

// ---------- field definitions ----------
const DEF = {
  sec: { name: "秒", min: 0, max: 59 }, min: { name: "分", min: 0, max: 59 }, hour: { name: "時", min: 0, max: 23 },
  dom: { name: "日", min: 1, max: 31 }, mon: { name: "月", min: 1, max: 12 }, dow: { name: "週", min: 0, max: 6 }, year: { name: "年", min: 1970, max: 2099 }
};
const ORDER = { "5": ["min", "hour", "dom", "mon", "dow"], "6": ["sec", "min", "hour", "dom", "mon", "dow"], "q": ["sec", "min", "hour", "dom", "mon", "dow", "year"] };
const MONN = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const DOWN = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
const MACRO5 = { "@yearly": "0 0 1 1 *", "@annually": "0 0 1 1 *", "@monthly": "0 0 1 * *", "@weekly": "0 0 * * 0", "@daily": "0 0 * * *", "@midnight": "0 0 * * *", "@hourly": "0 * * * *" };
const MACROQ = { "@yearly": "0 0 0 1 1 ?", "@annually": "0 0 0 1 1 ?", "@monthly": "0 0 0 1 * ?", "@weekly": "0 0 0 ? * SUN", "@daily": "0 0 0 * * ?", "@midnight": "0 0 0 * * ?", "@hourly": "0 0 * * * ?" };

class CronError extends Error { constructor(msg, idx, fix){ super(msg); this.idx = idx; this.fix = fix; } }
// phone keyboards: full-width digits/symbols (NFKC), 、 and ， as commas, dashes and minus signs as "-", any run of spaces as one
function normExpr(src){
  let s = String(src == null ? "" : src);
  try { s = s.normalize("NFKC"); } catch (e) {}
  return s.replace(/[、､，]/g, ",").replace(/[\u2010-\u2015\u2212\uFE58\uFE63]/g, "-").replace(/\s+/g, " ").trim();
}

// value token → number in the field's raw numbering
function num(tok, key, mode, label, pos){
  const u = tok.toUpperCase();
  if (key === "mon" && u in MONN) return MONN[u];
  if (key === "dow" && u in DOWN) return mode === "q" ? DOWN[u] + 1 : DOWN[u];
  if (!/^\d+$/.test(tok)){
    const hint = key === "mon" ? "（月份可寫 1–12 或 JAN–DEC）" : key === "dow" ? "（星期可寫數字或 SUN–SAT）" : /^[A-Z]{3}$/.test(u) && (u in MONN || u in DOWN) ? `（英文名稱只能用在${u in MONN ? "月" : "週"}欄）` : "";
    throw new CronError(`${label}：無法辨識「${tok}」${hint}`, pos);
  }
  return +tok;
}
function parseField(tok, key, mode, pos){
  const d = DEF[key], label = `第 ${pos + 1} 欄（${d.name}）`;
  // raw numbering limits
  let lo = d.min, hi = d.max;
  if (key === "dow"){ if (mode === "q"){ lo = 1; hi = 7; } else { lo = 0; hi = 7; } }
  const toInt = v => key === "dow" ? (mode === "q" ? v - 1 : v % 7) : v;
  const f = { key, raw: tok, set: new Array(d.max + 1).fill(false), star: tok[0] === "*" || tok === "?", q: tok === "?", sp: [], parts: [] };
  const chk = (v, t) => { if (v < lo || v > hi) throw new CronError(`${label}：${t} 超過 ${lo}–${hi}${key === "dow" && mode === "q" && v === 0 ? "（Quartz 的週日是 1 或 SUN，週六是 7）" : ""}`, pos); return v; };
  const nm = t => num(t, key, mode, label, pos);
  if (tok === "?"){
    if (key !== "dom" && key !== "dow") throw new CronError(`${label}：「?」只能用在日或週欄位`, pos);
    for (let v = d.min; v <= d.max; v++) f.set[v] = true; f.parts.push({ t: "all" }); return f;
  }
  for (const part of tok.split(",")){
    if (part === "") throw new CronError(`${label}：逗號前後缺少數值`, pos);
    const P = part.toUpperCase();
    let m;
    if (key === "dom" && P === "L"){ f.sp.push({ L: 0 }); f.parts.push({ t: "L", n: 0 }); continue; }
    if (key === "dom" && (m = /^L-(\d+)$/.exec(P))){ if (+m[1] > 30) throw new CronError(`${label}：L-${m[1]} 超過 30`, pos); f.sp.push({ L: +m[1] }); f.parts.push({ t: "L", n: +m[1] }); continue; }
    if (key === "dom" && P === "LW"){ f.sp.push({ LW: 1 }); f.parts.push({ t: "LW" }); continue; }
    if (key === "dom" && (m = /^(\d+)W$/.exec(P))){ chk(+m[1], m[1]); f.sp.push({ W: +m[1] }); f.parts.push({ t: "W", n: +m[1] }); continue; }
    if (key === "dow" && P === "L" && mode === "q"){ f.set[6] = true; f.parts.push({ t: "val", a: 6 }); continue; }
    if (key === "dow" && (m = /^(\w+)L$/.exec(P))){ const v = toInt(chk(nm(m[1]), m[1])); f.sp.push({ lastDow: v }); f.parts.push({ t: "lastDow", a: v }); continue; }
    if (key === "dow" && (m = /^(\w+)#(\d+)$/.exec(P))){ const v = toInt(chk(nm(m[1]), m[1])); const k = +m[2]; if (k < 1 || k > 5) throw new CronError(`${label}：# 後面應為 1–5`, pos); f.sp.push({ nth: [v, k] }); f.parts.push({ t: "nth", a: v, k }); continue; }
    m = /^(\*|[A-Z0-9]+)(?:-([A-Z0-9]+))?(?:\/(\d+))?$/.exec(P);
    if (!m) throw new CronError(`${label}：無法辨識「${part}」`, pos);
    let a, b, step = m[3] != null ? +m[3] : null;
    if (step === 0) throw new CronError(`${label}：間隔不能為 0`, pos);
    if (m[1] === "*"){ if (m[2]) throw new CronError(`${label}：「*」後面不能接範圍`, pos); a = lo; b = hi; if (key === "dow") b = mode === "q" ? 7 : 6; }
    else {
      a = chk(nm(m[1]), m[1]);
      b = m[2] != null ? chk(nm(m[2]), m[2]) : (step != null ? (key === "dow" ? (mode === "q" ? 7 : 6) : hi) : a);
      if (b < a) throw new CronError(`${label}：範圍 ${m[1]}-${m[2]} 起點大於終點` + (key === "dow" ? (mode === "q" ? "（不能從週六跨到週日，請拆開寫，例如 FRI-SAT,SUN）" : "（週日也可寫成 7，例如 5-7 是週五至週日）") : `（不能跨過 ${hi}，請拆開寫：${m[1]}-${hi},${lo}-${m[2]}）`), pos);
    }
    if (step != null && step > (hi - lo + 1)) throw new CronError(`${label}：間隔 ${step} 超過欄位範圍`, pos);
    for (let v = a; v <= b; v += (step || 1)) f.set[toInt(v)] = true;
    f.parts.push(m[1] === "*" ? (step ? { t: "step", a: null, step } : { t: "all" }) : step ? { t: "step", a: toInt(a), b: m[2] != null ? toInt(b) : null, step } : m[2] != null ? { t: "range", a: toInt(a), b: toInt(b) } : { t: "val", a: toInt(a) });
  }
  return f;
}
const MODE_NAME = { "5": "標準 5 欄", "6": "含秒 6 欄", "q": "Quartz 7 欄" };
function parse(src, mode){
  let expr = normExpr(src);
  if (!expr) throw new CronError("請輸入 cron 表達式，或點下方範例。");
  const out = { mode, src: expr };
  if (expr[0] === "@"){
    const k = expr.toLowerCase();

function convertExpr(src, from, to){
  let c; try { c = parse(src, from); } catch (e) { return DEFAULT[to]; }
  if (c.reboot) return "@reboot";
  if (c.macro) return c.macro;
  let t = c.toks.slice();
  if (from === "5") t.unshift("0");
  if (from === "q") t = t.slice(0, 6);
  // t: sec min hour dom mon dow
  if (to === "q" && from !== "q"){
    t[5] = t[5].replace(/(^|[,\-])(\d+)/g, (_, p, n) => p + ((+n % 7) + 1));
    if (t[5] === "*" || t[5] === "?") t[5] = "?"; else if (t[3] === "*" || t[3] === "?") t[3] = "?";

    if (t[3] === "?" && t[5] === "?") t[3] = "*";
  }
  if (from === "q" && to !== "q"){
    t[5] = t[5].replace(/(^|[,\-])(\d+)/g, (_, p, n) => p + (+n - 1));
    t = t.map(x => x === "?" ? "*" : x);
    if (/[LW#]/i.test(t[3] + t[5])) return DEFAULT[to];

}

// "2 天 9 小時後": two units, rounded down, so 08:59 tomorrow never reads as 1 天後 at 09:00 today
function rel(ms){
  const sec = Math.max(0, Math.floor((ms - Date.now()) / 1000));
  if (sec < 60) return "不到 1 分鐘";
  const min = Math.floor(sec / 60), h = Math.floor(min / 60), d = Math.floor(h / 24);
  if (min < 60) return `${min} 分鐘後`;
  if (h < 24) return `${h} 小時${min % 60 ? ` ${min % 60} 分` : ""}後`;
  if (d < 7) return `${d} 天${h % 24 ? ` ${h % 24} 小時` : ""}後`;
  if (d < 60) return `${d} 天後`;
  if (d < 730) return `約 ${Math.floor(d / 30.4375)} 個月後`;
  return `約 ${Math.floor(d / 365.25)} 年後`;
}

    });

  }
}
