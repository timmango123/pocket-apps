<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>EXIF 檢視與清除</title>
<style>
:root{
  --bg:#efedf5; --bg-2:#e6e2f0; --surface:#ffffff; --surface-2:#f6f4fb; --ink:#1b1730; --muted:#5f5a74; --faint:#8a849f; --line:#d6d0e6; --line-2:#e9e5f2;
  --accent:#5b2fb8; --accent-2:#7a4ce0; --accent-ink:#ffffff; --accent-soft:#ebe3fb;
  --ok:#17683f; --ok-2:#1f8a55; --ok-soft:#dcf1e4; --warn:#8a4b00; --warn-soft:#fbead2; --err:#b3261e; --err-soft:#fbe0dd;
  --chk-a:#ffffff; --chk-b:#dcd8e6; --dot:rgba(91,47,184,.07);
  --shadow:0 1px 2px rgba(27,23,48,.06),0 6px 18px -8px rgba(27,23,48,.18);
  --shadow-lg:0 2px 4px rgba(27,23,48,.06),0 16px 32px -12px rgba(27,23,48,.28);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100e19; --bg-2:#151221; --surface:#1b1828; --surface-2:#231f34; --ink:#ece8f6; --muted:#a8a2bf; --faint:#7d7796; --line:#363050; --line-2:#2a2541;
  --accent:#b79cff; --accent-2:#9b7cf2; --accent-ink:#1d0f45; --accent-soft:#2c2347;
  --ok:#73d9a0; --ok-2:#4fc285; --ok-soft:#163224; --warn:#f2bb66; --warn-soft:#3a2a12; --err:#ff9089; --err-soft:#401c1a;
  --chk-a:#2a2540; --chk-b:#1f1b30; --dot:rgba(183,156,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 36px -14px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100e19; --bg-2:#151221; --surface:#1b1828; --surface-2:#231f34; --ink:#ece8f6; --muted:#a8a2bf; --faint:#7d7796; --line:#363050; --line-2:#2a2541;
  --accent:#b79cff; --accent-2:#9b7cf2; --accent-ink:#1d0f45; --accent-soft:#2c2347;
  --ok:#73d9a0; --ok-2:#4fc285; --ok-soft:#163224; --warn:#f2bb66; --warn-soft:#3a2a12; --err:#ff9089; --err-soft:#401c1a;
  --chk-a:#2a2540; --chk-b:#1f1b30; --dot:rgba(183,156,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 36px -14px rgba(0,0,0,.75); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:14px 14px;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding:10px 16px calc(84px + env(safe-area-inset-bottom));min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .mark{flex:none;filter:drop-shadow(0 3px 6px rgba(91,47,184,.35))}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.01em;line-height:1.15;white-space:nowrap;display:flex;align-items:baseline;gap:7px}
.brand h1 i{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--faint)}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.brand small b{color:var(--ok);font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s var(--ease),border-color .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn:disabled{opacity:.4;cursor:default;box-shadow:none}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.layout{grid-template-columns:minmax(280px,340px) minmax(0,1fr);align-items:start}.side{position:sticky;top:10px}}
main,.side{min-width:0}
/* drop zone */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:148px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:18px;background:var(--surface);cursor:pointer;text-align:center;padding:14px 14px;transition:border-color .2s,background .2s,transform .12s var(--ease);box-shadow:var(--shadow)}
.drop:active{transform:scale(.985)}
.drop .ill{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);display:grid;place-items:center;margin-bottom:4px;box-shadow:0 8px 18px -8px var(--accent)}
.drop .ill svg.i{width:28px;height:28px}
.drop strong{font-size:16.5px;font-weight:750}
.drop span{color:var(--muted);font-size:12.5px;max-width:30em}
.drop.compact{min-height:52px;flex-direction:row;gap:10px;padding:4px 14px;border-radius:14px}
.drop.compact .ill{width:30px;height:30px;border-radius:9px;margin:0;box-shadow:none}
.drop.compact .ill svg.i{width:18px;height:18px}
.drop.compact strong{font-size:15px}
.drop.compact span{display:none}
.drop.over{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* options */
.opts{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.opts>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-weight:700;font-size:14.5px}
.opts>summary::-webkit-details-marker{display:none}
.opts>summary svg.i{color:var(--accent);width:18px;height:18px}
.opts>summary .sumline{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.chev{flex:none;transition:transform .2s var(--ease)}
.opts[open]>summary .chev{transform:rotate(180deg)}
.opts[open]>summary{border-bottom:1px solid var(--line-2)}
.opts[open]{padding-bottom:12px}
.opts .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;cursor:pointer}
.opts .t{font-size:14px;font-weight:650}
.opts .t small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tg{position:relative;flex:none;width:50px;height:30px}
.tg input{position:absolute;inset:-7px;width:64px;height:44px;opacity:0;margin:0;cursor:pointer;z-index:1}
.tg .tr{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.tg .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.tg input:checked+.tr{background:var(--accent)}
.tg input:checked+.tr::after{transform:translateX(20px)}
.tg input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.lab{font-size:12px;color:var(--muted);letter-spacing:.04em;margin:8px 0 6px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:650;font-size:13.5px;padding:2px 4px;line-height:1.2;transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px -2px var(--accent)}
.seg button small{display:block;font-size:10.5px;font-weight:500;opacity:.8}
.orinote{font-size:12px;color:var(--muted);margin:8px 2px 0}
/* banners */
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:6px 6px 6px 12px;margin-bottom:10px;font-size:13px;background:var(--accent-soft);color:var(--ink)}
.banner svg.i{color:var(--accent);width:18px;height:18px}
.banner p{margin:0;flex:1;min-width:0}
.banner b{color:var(--accent)}
.banner button{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);cursor:pointer;font-size:13px;font-weight:650;flex:none}
.empty{text-align:center;padding:22px 8px 8px}
.empty h2{font-size:16px;margin:0 0 12px;font-weight:750}
.steps{list-style:none;margin:0 auto;padding:0;display:grid;gap:8px;max-width:420px;text-align:left}
.steps li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.steps li b{color:var(--ink);display:block;font-size:14px}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--mono)}
.empty .again{margin-top:12px;min-height:44px;border:0;background:none;color:var(--accent);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.count{font-size:12px;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.count .r{font-weight:700}
.count .r.high{color:var(--err)} .count .r.ok{color:var(--ok)}
/* cards */
.items{list-style:none;margin:0;padding:0}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);animation:cardIn .35s var(--ease) both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.card.r-high::before{background:linear-gradient(90deg,var(--err),color-mix(in srgb,var(--err) 40%,var(--warn)))}
.card.r-mid::before{background:var(--warn)} .card.r-low::before{background:var(--accent)}
.card.r-clean::before,.card.r-done::before{background:linear-gradient(90deg,var(--ok-2),var(--ok))}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .head{display:flex;gap:12px;padding:14px 12px 10px;align-items:center}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;flex:none;background:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,var(--chk-a) 25%,var(--chk-a) 75%,var(--chk-b) 75%);background-size:14px 14px;background-position:0 0,7px 7px;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.o3{transform:rotate(180deg)} .thumb img.o6{transform:rotate(90deg)} .thumb img.o8{transform:rotate(-90deg)}
.thumb img.o2{transform:scaleX(-1)} .thumb img.o4{transform:scaleY(-1)} .thumb img.o5{transform:rotate(90deg) scaleY(-1)} .thumb img.o7{transform:rotate(-90deg) scaleY(-1)}
.thumb .ok{position:absolute;right:3px;bottom:3px;width:22px;height:22px;border-radius:50%;background:var(--ok-2);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.thumb .ok svg.i{width:14px;height:14px;stroke-width:3}
.ttl{flex:1;min-width:0}
.fname{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.fmeta{font-size:11.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.risk{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:12px;font-weight:750;padding:2px 9px 2px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);transition:background .3s,color .3s}
.risk svg.i{width:14px;height:14px;stroke-width:2.4}
.risk.high{background:var(--err-soft);color:var(--err);border-color:transparent}
.risk.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.risk.low{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.risk.clean,.risk.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rm{color:var(--muted);box-shadow:none;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);line-height:1.4}
.chip svg.i{width:13px;height:13px;stroke-width:2.4}
.chip.high{background:var(--err-soft);color:var(--err);border-color:transparent;font-weight:750}
.chip.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:650}
.chip.good{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:650}
.sum{margin:0;border-top:1px solid var(--line-2)}
.sum .row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:14px;align-items:start}
.sum .row:last-child{border-bottom:0}
.sum dt{color:var(--muted);font-size:12.5px;padding-top:2px;margin:0;font-weight:500}
.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sum .tok{display:inline-block;white-space:nowrap;margin-right:12px;font-variant-numeric:tabular-nums}
.sum .sub{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.sum .row.danger{background:var(--err-soft)} .sum .row.danger dt{color:var(--err);font-weight:750}
.sum .row.danger dd{font-weight:650}
.sum .row.warn dt{color:var(--warn);font-weight:700}
.sum .row.warn{background:color-mix(in srgb,var(--warn-soft) 60%,transparent)}
.sum .row.note dt{color:var(--ink)}
.maplinks{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:2px}
.maplinks a,.maplinks button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0 6px;white-space:nowrap;border-radius:10px;border:1px solid color-mix(in srgb,var(--err) 45%,transparent);color:var(--err);text-decoration:none;font-size:13px;font-weight:650;background:var(--surface);cursor:pointer}
.maplinks svg.i{width:16px;height:16px}
details.tags>summary,details.before>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 12px;cursor:pointer;font-size:13.5px;font-weight:650;color:var(--muted);border-top:1px solid var(--line-2)}
details.tags>summary span,details.before>summary span{flex:1}
details.tags>summary::-webkit-details-marker,details.before>summary::-webkit-details-marker{display:none}
details.tags[open]>summary .chev,details.before[open]>summary .chev{transform:rotate(180deg)}
.tagwrap{max-height:360px;overflow:auto;border-top:1px solid var(--line-2);overscroll-behavior:contain}
table.tagt{width:100%;border-collapse:collapse;font-size:12.5px}
table.tagt th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--accent);padding:8px 12px 4px;background:var(--surface-2);position:sticky;top:0}
table.tagt td{padding:4px 6px 4px 12px;vertical-align:top;border-top:1px solid var(--line-2)}
table.tagt td.n{font-family:var(--mono);color:var(--muted);white-space:nowrap;width:1%;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.tagt td.v{padding-right:12px;overflow-wrap:anywhere;font-family:var(--mono)}
.tagt .hx{opacity:.6;font-size:10.5px}
.acts{display:flex;gap:8px;padding:12px;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.btn{position:relative;min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1;transition:transform .12s var(--ease),background .2s,box-shadow .2s;color:var(--ink)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -8px var(--accent)}
.btn.go{background:linear-gradient(180deg,var(--ok-2),var(--ok));color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px var(--ok)}
:root[data-theme="dark"] .btn.go{color:#0b2416}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#0b2416}}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.sq{flex:0 0 48px;padding:0}
.btn.dl{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--surface)}
.result{margin:0 12px 12px;padding:14px;border-radius:14px;background:var(--ok-soft);color:var(--ink);font-size:13.5px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start}
.result .badge{grid-row:span 3;width:44px;height:44px;border-radius:50%;background:var(--ok-2);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--ok)}
.result .badge svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.result.warn{background:var(--warn-soft)} .result.warn .badge{background:var(--warn);box-shadow:none;color:var(--surface)}
.result b{font-size:16px;font-weight:800;color:var(--ok);line-height:1.3}
.result.warn b{color:var(--warn)}
.result .l{display:block;color:var(--muted);font-size:12.5px;min-width:0}
.result .gone{color:var(--ink);font-size:13px}
.result .gone s{text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--err) 70%,transparent);color:var(--muted)}
.result .stat{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card.justdone .result{animation:pop .5s var(--ease) both}
.card.justdone .result .badge path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .15s var(--ease) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.94)}60%{opacity:1;transform:scale(1.015)}100%{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.card.scanning::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--accent) 18%,transparent) 50%,transparent 100%);animation:scan 1.1s linear infinite;pointer-events:none;will-change:transform}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(230%)}}
.unsupported{margin:0 12px 12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.loadrow{display:flex;align-items:center;gap:8px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:20}
.dock .in{max-width:1180px;margin:0 auto;display:flex;gap:8px}
.dock .btn{min-height:50px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;min-height:44px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);animation:toastIn .25s var(--ease)}
.toast:not(.act){padding-right:16px}
.toast button{min-height:40px;min-width:44px;padding:0 12px;border:0;border-radius:9px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:750;cursor:pointer;flex:none}

const EXT = { jpeg:'jpg', png:'png', webp:'webp', heic:'heic', avif:'avif' };
function outName(it){ const base = it.name.replace(/\.[^.]+$/, '') || 'photo'; return `${base}-clean.${EXT[it.info.format]}`; }
async function bakeRotate(it){
  // decode with the orientation applied, redraw upright, re-encode; null when the browser can't (e.g. iPhone canvas size cap)
  const bm = await createImageBitmap(it.file, { imageOrientation:'from-image' });
  try{
    const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
    const g = c.getContext('2d'); if(!g) return null;
    g.drawImage(bm, 0, 0);
    const px = g.getImageData(bm.width >> 1, bm.height >> 1, 1, 1).data;
    if(it.info.format==='jpeg' && px[3]===0) return null; // canvas silently failed (too large)
    const mime = MIME[it.info.format];
    const blob = await new Promise(res => c.toBlob(res, mime, 0.95));
    c.width = c.height = 1;
    if(!blob || blob.type !== mime) return null;
    return { bytes: new Uint8Array(await blob.arrayBuffer()), w: bm.width, h: bm.height };
  } finally { bm.close && bm.close(); }
}
async function stripItem(it){

  const src = await readBytes(it);

  if(opts.ori==='bake' && ori!==1 && !it.info.heif){
    try{ baked = await bakeRotate(it); }catch(e){ baked = null; }
    if(!baked) note = '照片太大，這個瀏覽器無法轉正，改為保留方向標記（無損）';
  }
  if(baked){
    const r = EX.strip(baked.bytes, { keepIcc: opts.keepIcc, orientation: 0 }); bytes = r.bytes;
    removed = it.info.meta.filter(m=>!m.empty).map(m => ({ kind:m.kind, label: m.label.replace(/（.*$/,''), bytes: m.bytes })); reencoded = true;
    note = `像素已轉正（${baked.w}×${baked.h}）`;
  } else {
    const keepOri = (opts.ori==='keep' || (opts.ori==='bake' && !it.info.heif)) ? ori : 0;
    const r = EX.strip(src, { keepIcc: opts.keepIcc, orientation: keepOri });
    bytes = r.bytes; removed = r.removed;
  }
  const after = EX.parse(bytes);
  const keptOri = !reencoded && after.summary.orientation !== 1 && after.summary.count === 1;
  const iccOk = m => m.kind==='icc' && (opts.keepIcc || it.info.heif);
  const leftover = after.meta.filter(m => !m.empty && !iccOk(m) && !(m.kind==='exif' && keptOri));
  let check = leftover.length ? `仍有 ${leftover.map(m=>m.label).join('、')}` : keptOri ? '只剩方向標記，沒有其他中繼資料' : '沒有任何中繼資料';
  if(after.icc && !leftover.some(m=>m.kind==='icc')) check += '（ICC 色彩描述檔已保留）';
  if(it.info.cutTail) check += '（原檔結尾不完整，已補上結束標記）';

}
async function runOne(it){

  if(li) li.classList.add('scanning');
  let ok = true;
  try{ await stripItem(it); }catch(e){ ok = false; toast('清除失敗：' + (e.message || e) + '。檔案可能已損壞，請重新匯出後再試。', 4000); }
  renderItem(it, ok); renderDock();

}
async function runAll(){
  if(running) return;
  const list = items.filter(i=>i.status==='ready' && canStrip(i) && !i.out);
  if(!list.length) return;
  running = true; renderDock();
  let fails = 0;
  for(const it of list){
    const li = document.querySelector(`li[data-id="${it.id}"]`); if(li) li.classList.add('scanning');
    try{ await stripItem(it); renderItem(it, true); }catch(e){ fails++; renderItem(it); }
    await new Promise(r => setTimeout(r, 0));
  }
  running = false; renderDock(); buzz(fails ? [20,60,20] : 18);
  toast(fails ? `${list.length-fails} 張完成，${fails} 張失敗（檔案可能損壞）` : list.length > 1 ? `${list.length} 張已清除，可以下載了` : '已清除，可以下載了', 2600);
}
async function save(it){

  if(it.out.url) URL.revokeObjectURL(it.out.url);
  it.out.url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = it.out.url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  toast('已下載：'+name);
}

function drawScene(c){
  const g = c.getContext('2d'), W = c.width, H = c.height, hz = H*0.6; let sd = 7; const rnd = () => { sd = (sd*16807) % 2147483647; return sd/2147483647; };

  const sea = g.createLinearGradient(0,hz,0,H); sea.addColorStop(0,'#f2a06a'); sea.addColorStop(.25,'#6a5a8f'); sea.addColorStop(1,'#1a2246');
  g.fillStyle = sea; g.fillRect(0,hz,W,H-hz);
  for(let i=0;i<26;i++){ const y = hz + 6 + i*((H-hz)/26); const w = sr*(1.2+rnd()*2.5)*(1+i/8); g.fillStyle = `rgba(255,225,170,${0.5-i*0.017})`; g.fillRect(sx-w/2+(rnd()-.5)*sr, y, w, 2+i*0.12); }
  const hill = (y0, amp, col, seed) => { g.fillStyle = col; g.beginPath(); g.moveTo(0,H); g.lineTo(0,y0); for(let x=0;x<=W;x+=8){ const y = y0 - amp*(0.6*Math.sin(x/W*Math.PI*2.3+seed)+0.4*Math.sin(x/W*Math.PI*7.1+seed*2)); g.lineTo(x,y); } g.lineTo(W,H); g.closePath(); g.fill(); };
  hill(hz*0.92, hz*0.16, '#5b3f6e', 1.2); hill(hz*1.0, hz*0.12, '#3b2a4f', 2.4); hill(hz*1.07, hz*0.09, '#241a35', 4.1);
  for(let i=0;i<22;i++){ const x = W*(0.05+rnd()*0.5), y = hz*(0.96+rnd()*0.16); const r = 2+rnd()*2.5; const lg = g.createRadialGradient(x,y,0,x,y,r*4); lg.addColorStop(0,'rgba(255,170,90,.9)'); lg.addColorStop(1,'rgba(255,120,60,0)'); g.fillStyle = lg; g.fillRect(x-r*4,y-r*4,r*8,r*8); g.fillStyle = '#ffd9a0'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
}
