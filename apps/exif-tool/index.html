<title>EXIF 檢視與清除</title>
<style>
:root{
  --bg:#eceaf3; --surface:#ffffff; --surface-2:#f5f3fa; --ink:#1b1730; --muted:#5f5a74; --line:#cfc9e0; --line-2:#e3dfee;
  --accent:#5b2fb8; --accent-ink:#ffffff; --accent-soft:#e8e0f8;
  --ok:#1b6e45; --ok-soft:#dcf1e4; --warn:#8a4b00; --warn-soft:#fbe9cf; --err:#b3261e; --err-soft:#fadcd9;
  --chk-a:#ffffff; --chk-b:#dcd8e6; --shade:rgba(20,14,40,.5);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f1b; --surface:#1a1727; --surface-2:#221e33; --ink:#ebe7f5; --muted:#a39dba; --line:#352f4a; --line-2:#2a2540;
  --accent:#b79cff; --accent-ink:#1d0f45; --accent-soft:#2c2347;
  --ok:#6fd39a; --ok-soft:#173326; --warn:#f0b760; --warn-soft:#3a2a12; --err:#ff8f86; --err-soft:#3f1b19;
  --chk-a:#2a2540; --chk-b:#1f1b30; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f1b; --surface:#1a1727; --surface-2:#221e33; --ink:#ebe7f5; --muted:#a39dba; --line:#352f4a; --line-2:#2a2540;
  --accent:#b79cff; --accent-ink:#1d0f45; --accent-soft:#2c2347;
  --ok:#6fd39a; --ok-soft:#173326; --warn:#f0b760; --warn-soft:#3a2a12; --err:#ff8f86; --err-soft:#3f1b19;
  --chk-a:#2a2540; --chk-b:#1f1b30; --shade:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding:10px 16px calc(84px + env(safe-area-inset-bottom));min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;font-weight:750;letter-spacing:.01em;line-height:1.15;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;padding:0 10px;font-size:14px;flex:none}
.iconbtn.danger{color:var(--err)}
.iconbtn.armed{background:var(--err);color:#fff;border-color:var(--err)}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.layout{grid-template-columns:minmax(280px,340px) minmax(0,1fr);align-items:start}.side{position:sticky;top:10px}}
main,.side{min-width:0}
/* drop zone */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:112px;border:2px dashed var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:center;padding:10px 12px;transition:border-color .15s,background .15s}
.drop strong{font-size:16px}
.drop span{color:var(--muted);font-size:12.5px}
.drop.compact{min-height:52px;flex-direction:row;gap:10px;padding:4px 12px}
.drop.compact span{display:none}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* options */
.opts{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.opts>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-weight:650;font-size:14.5px}
.opts>summary::-webkit-details-marker{display:none}
.opts>summary .sumline{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.opts>summary .chev{flex:none;transition:transform .15s}
.opts[open]>summary .chev{transform:rotate(180deg)}
.opts[open]>summary{border-bottom:1px solid var(--line-2)}
.opts[open]{padding-bottom:10px}
.opts .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;cursor:pointer}
.opts .switch input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.opts .t{font-size:14px;font-weight:600}
.opts .t small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.lab{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:6px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{min-height:44px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13.5px;border-left:1px solid var(--line-2);padding:0 4px;line-height:1.15}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button small{display:block;font-size:10.5px;font-weight:500;opacity:.8}
.orinote{font-size:12px;color:var(--muted);margin:6px 0 0}
/* banners */
.banner{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:10px;font-size:13px;background:var(--surface)}
.banner p{margin:0;flex:1}
.banner b{color:var(--warn)}
.banner button{min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.count{font-size:12px;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between}
/* cards */
.items{list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card.sample{border-color:var(--accent)}
.card .head{display:flex;gap:10px;padding:10px 12px;align-items:center}
.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,var(--chk-a) 25%,var(--chk-a) 75%,var(--chk-b) 75%);background-size:14px 14px;background-position:0 0,7px 7px;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{flex:1;min-width:0}
.fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.fmeta{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.risk.high{background:var(--err-soft);color:var(--err);border-color:transparent}
.risk.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.risk.clean{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);line-height:1.4}
.chip.high{background:var(--err-soft);color:var(--err);border-color:transparent;font-weight:700}
.chip.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.sum{margin:0;border-top:1px solid var(--line-2)}
.sum .row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-2);font-size:14px;align-items:start}
.sum dt{color:var(--muted);font-size:12.5px;padding-top:2px;margin:0}
.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sum .row.danger{background:var(--err-soft)} .sum .row.danger dt{color:var(--err);font-weight:700}
.sum .row.warn{background:var(--warn-soft)} .sum .row.warn dt{color:var(--warn);font-weight:700}
.sum .row.note dt{color:var(--ink)}
.maplinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.maplinks a{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--err);color:var(--err);text-decoration:none;font-size:13px;font-weight:600;background:var(--surface)}
.card details.tags>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:4px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line-2)}
.card details.tags>summary::-webkit-details-marker{display:none}
.card details.tags>summary .chev{transition:transform .15s}
.card details.tags[open]>summary .chev{transform:rotate(180deg)}
.tagwrap{max-height:360px;overflow:auto;border-bottom:1px solid var(--line-2)}
table.tagt{width:100%;border-collapse:collapse;font-size:12.5px}
table.tagt th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--accent);padding:8px 12px 3px;background:var(--surface-2);position:sticky;top:0}
table.tagt td{padding:3px 6px 3px 12px;vertical-align:top;border-top:1px solid var(--line-2)}
table.tagt td.n{font-family:var(--mono);color:var(--muted);white-space:nowrap;width:1%;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.tagt td.v{padding-right:12px;overflow-wrap:anywhere;font-family:var(--mono)}
.tagt .hx{opacity:.6;font-size:10.5px}
.acts{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.btn{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-weight:650;font-size:14.5px;cursor:pointer;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{flex:0 0 auto}
.result{margin:0 12px 12px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ink);font-size:13.5px}
.result b{color:var(--ok)}
.result .l{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.result.warn{background:var(--warn-soft)} .result.warn b{color:var(--warn)}
.unsupported{margin:0 12px 12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:20}
.dock .in{max-width:1180px;margin:0 auto;display:flex;gap:8px}
.dock .btn{min-height:48px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--accent)}.iconbtn:hover{border-color:var(--accent)}.drop:hover{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.spin{animation:none;border-top-color:currentColor}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="9" fill="var(--accent)"/><path d="M18 8l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-7z" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18" cy="18" r="3.2" fill="none" stroke="var(--accent-ink)" stroke-width="2.2"/><path d="M12.5 18c1.6-2.4 3.4-3.6 5.5-3.6s3.9 1.2 5.5 3.6c-1.6 2.4-3.4 3.6-5.5 3.6s-3.9-1.2-5.5-3.6z" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/></svg>
      <h1>EXIF 檢視與清除<small>看清照片藏了什麼，再抹乾淨</small></h1>
    </div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="切換主題" title="切換主題"></button>
    <button class="iconbtn danger" id="clearBtn" type="button" aria-label="清空清單">清空</button>
  </header>

  <div class="layout">
    <aside class="side">
      <label class="drop" id="drop" for="fileInput" role="button" tabindex="0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 15l-5-4-7 6"/></svg>
        <strong id="dropText">點此選照片或拖放</strong>
        <span>JPG、PNG、WebP 可檢視並清除；HEIC 只能偵測。檔案不會離開你的裝置。</span>
      </label>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple>

      <details class="opts" id="opts">
        <summary><span>清除設定</span><span class="sumline" id="optSummary"></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <label class="switch" for="keepIcc"><span class="t">保留 ICC 色彩描述檔<small>只描述色彩，沒有個資；移除可能讓顏色跑掉</small></span><input type="checkbox" id="keepIcc" checked></label>
        <div class="lab">照片有旋轉標記時（方向 ≠ 1）</div>
        <div class="seg" id="oriSeg" role="group" aria-label="方向標記處理">
          <button type="button" data-ori="keep" aria-pressed="true">保留方向標記<small>無損</small></button>
          <button type="button" data-ori="drop" aria-pressed="false">全部移除<small>無損，可能躺著</small></button>
          <button type="button" data-ori="bake" aria-pressed="false">轉正後輸出<small>重新編碼</small></button>
        </div>
        <p class="orinote" id="oriNote">只留一個 Orientation 標籤，其他全部清掉；像素原封不動。</p>
      </details>
    </aside>

    <main>
      <div class="banner" id="sampleBanner" hidden>
        <p><b>範例照片</b>：資料全是虛構的；加入自己的照片後會自動移除。</p>
        <button type="button" id="dropSample">移除範例</button>
      </div>
      <div class="count" id="countLine" hidden><span id="countText"></span><span id="countRisk"></span></div>
      <ul class="items" id="list"></ul>
      <div class="empty" id="empty" hidden>還沒有照片。點上方虛線框選取，或直接拖放。</div>
    </main>
  </div>
</div>

<div class="dock">
  <div class="in">
    <button class="btn primary" id="stripAllBtn" type="button" disabled>清除全部中繼資料</button>
    <button class="btn" id="dlAllBtn" type="button" hidden>全部下載</button>
    <button class="btn sm" id="shareAllBtn" type="button" hidden>分享</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

}
async function runOne(it){
  const btn = document.querySelector(`li[data-id="${it.id}"] [data-act="strip"]`); if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>處理中…'; }
  try{ await stripItem(it); }catch(e){ toast('清除失敗：'+(e.message||e)); }
  renderItem(it); renderDock();
}
async function runAll(){
  if(running) return; running = true; renderDock();
  const list = items.filter(i=>i.status==='ready' && canStrip(i) && !i.out);
  let fails = 0;
  for(const it of list){ try{ await stripItem(it); }catch(e){ fails++; } renderItem(it); }
  running = false; renderDock();
  toast(fails ? `${list.length-fails} 張完成，${fails} 張失敗` : `${list.length} 張已清除`);
}
async function save(it){
  const name = it.out.name, blob = new Blob([it.out.bytes], { type: it.out.mime });
  if(dl){ try{ await dl.save({ filename:name, data:blob }); toast('已送出儲存：'+name); return; }catch(e){ const m = String(e&&e.message||e); toast(/declin|denied|cancel/i.test(m) ? '已取消儲存' : '儲存失敗：'+m); return; } }
  if(it.out.url) URL.revokeObjectURL(it.out.url);
  it.out.url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = it.out.url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  toast('下載：'+name);
}
async function share(list){
  const files = list.map(outFile);
  try{ await navigator.share({ files, title:'已清除中繼資料的照片' }); }catch(e){ if(e && e.name!=='AbortError') toast('無法分享：'+(e.message||e)); }
}
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const id = +b.closest('li').dataset.id; const it = items.find(i=>i.id===id); if(!it) return;
  const act = b.dataset.act;
  if(act==='rm') removeItem(it);

  else if(act==='dl') save(it);
  else if(act==='share') share([it]);
});

$('#dlAllBtn').addEventListener('click', async () => {
  const done = items.filter(i=>i.out); let k = 0;

let clearArm = 0;
$('#clearBtn').addEventListener('click', () => {
  const b = $('#clearBtn');
  if(!items.length){ toast('清單已是空的'); return; }
  if(Date.now()-clearArm > 3000){ clearArm = Date.now(); b.classList.add('armed'); b.textContent = '確認清空'; setTimeout(()=>{ b.classList.remove('armed'); b.textContent = '清空'; }, 3000); return; }
  clearArm = 0; b.classList.remove('armed'); b.textContent = '清空';

/* ---------- input ---------- */
$('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

  const hill = (y0, amp, col, seed) => { g.fillStyle = col; g.beginPath(); g.moveTo(0,H); g.lineTo(0,y0); for(let x=0;x<=W;x+=8){ const y = y0 - amp*(0.6*Math.sin(x/W*Math.PI*2.3+seed)+0.4*Math.sin(x/W*Math.PI*7.1+seed*2)); g.lineTo(x,y); } g.lineTo(W,H); g.closePath(); g.fill(); };
  hill(hz*0.92, hz*0.16, '#5b3f6e', 1.2); hill(hz*1.0, hz*0.12, '#3b2a4f', 2.4); hill(hz*1.07, hz*0.09, '#241a35', 4.1);
  for(let i=0;i<22;i++){ const x = W*(0.05+rnd()*0.5), y = hz*(0.96+rnd()*0.16); const r = 2+rnd()*2.5; const lg = g.createRadialGradient(x,y,0,x,y,r*4); lg.addColorStop(0,'rgba(255,170,90,.9)'); lg.addColorStop(1,'rgba(255,120,60,0)'); g.fillStyle = lg; g.fillRect(x-r*4,y-r*4,r*8,r*8); g.fillStyle = '#ffd9a0'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
}
