<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>

  const tier = v => skin.tiers[Math.min(Math.max(Math.log2(v || 2), 1), 12) - 1];
  const tierName = v => tier(v)[0];

  let mode, N, grid, stones = [], score, best, undosLeft, history, won, keepGoing, over, timeLeft, stepsLeft, started, seed, nextId = 1;
  let cleanup = [];
  const canUndoMode = () => !mode.time && !mode.steps && !mode.daily;
  const today = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  const bestKey = () => "kiln2048-best-" + mode.id + (mode.daily ? "-" + today() : "");

  // seeded random for 每日一窯 so everyone gets the same spawns on the same day
  function rand() {
    if (!mode.daily) return Math.random();
    seed = (seed + 0x6D2B79F5) | 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  MODES.forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.dataset.mode = m.id;
    b.innerHTML = `${m.name}<small>${m.tag}</small>`;
    b.addEventListener("click", () => switchMode(m.id));
    modesEl.appendChild(b);
  });
  Object.entries(SKINS).forEach(([id, s]) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.skin = id;
    b.innerHTML = `<i style="--a:${s.tiers[2][1]};--b:${s.tiers[6][1]};--c2:${s.tiers[10][1]}"></i>${s.name}`;
    b.addEventListener("click", () => setSkin(id));
    skinsEl.appendChild(b);
  });
  for (let i = 0; i < 12; i++) ladder.appendChild(document.createElement("span"));

  function setSkin(id) {
    const key = SKINS[id] ? id : "kiln";
    skin = SKINS[key];
    document.documentElement.dataset.skin = key;
    store.set("kiln2048-skin", key);
    $("skinName").firstChild.textContent = skin.name;
    $("skinSub").textContent = skin.sub;
    [...skinsEl.querySelectorAll("button")].forEach(b => b.setAttribute("aria-pressed", b.dataset.skin === key));
    [...ladder.children].forEach((s, i) => { s.style.setProperty("--tb", skin.tiers[i][1]); s.title = skin.tiers[i][0] + " " + 2 ** (i + 1); });
    $("capLow").textContent = skin.tiers[0][0] + " 2";
    $("capHigh").textContent = skin.tiers[11][0] + " 4096";
    if (grid) { grid.forEach(row => row.forEach(t => t && paint(t))); render(); }
  }

  function setMode(id) {
    mode = MODES.find(m => m.id === id) || MODES[0];
    N = mode.n;
    board.style.setProperty("--n", N);
    board.classList.toggle("blind", !!mode.blind);
    slots.innerHTML = "";
    for (let i = 0; i < N * N; i++) slots.appendChild(document.createElement("i"));
    [...modesEl.children].forEach(b => b.setAttribute("aria-selected", b.dataset.mode === mode.id));
    best = +store.get(bestKey()) || 0;
    $("bestLabel").textContent = mode.daily ? "今日最佳" : "最佳";
    undoBtn.hidden = !canUndoMode();
    store.set("kiln2048-mode", mode.id);
  }

  function makeTile(v, r, c, cls) {
    const el = document.createElement("div");
    el.className = "tile" + (cls ? " " + cls : "");
    el.innerHTML = '<div class="face"><b></b><em></em></div>';
    const t = { id: nextId++, v, r, c, el };
    if (v) paint(t);
    place(t);
    board.appendChild(el);
    return t;
  }
  function paint(t) {
    const [name, bg, fg, fx] = tier(t.v);
    t.el.style.setProperty("--tb", bg);
    t.el.style.setProperty("--tf", fg);
    t.el.className = t.el.className.replace(/\bfx-\w+/g, "").trim();
    if (fx) t.el.classList.add("fx-" + fx);
    const digits = String(t.v).length;
    t.el.style.setProperty("--fs", ["2.6em", "2.6em", "2.3em", "1.9em", "1.55em", "1.3em"][Math.min(digits, 5)]);
    t.el.querySelector("b").textContent = t.v;
    t.el.querySelector("em").textContent = name;
  }
  function place(t) { t.el.style.setProperty("--c", t.c); t.el.style.setProperty("--r0", t.r); }

  const isStone = (r, c) => stones.some(([sr, sc]) => sr === r && sc === c);
  function empties() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c] && !isStone(r, c)) out.push([r, c]);
    return out;
  }
  function spawn() {
    const e = empties();
    if (!e.length) return;
    const [r, c] = e[Math.floor(rand() * e.length)];
    grid[r][c] = makeTile(rand() < 0.9 ? 2 : 4, r, c, "new");
  }
  function flush() { cleanup.forEach(f => f()); cleanup = []; }
  function clearBoard() {
    flush();
    board.querySelectorAll(".tile, .overlay").forEach(n => n.remove());
    grid = Array.from({ length: N }, () => Array(N).fill(null));
  }
  function drawStones() {
    stones.forEach(([r, c]) => {
      const t = makeTile(0, r, c, "stone");
      t.el.setAttribute("aria-label", "石塊");
    });
  }
  function load(values) {
    clearBoard();
    drawStones();
    values.forEach((row, r) => row.forEach((v, c) => { if (v) grid[r][c] = makeTile(v, r, c); }));
  }
  const snapshot = () => grid.map(row => row.map(t => (t ? t.v : 0)));
  const topValue = () => Math.max(2, ...snapshot().flat());

  function placeStones() {
    stones = [];
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) cells.push([r, c]);
    for (let k = 0; k < (mode.stones || 0); k++) stones.push(cells.splice(Math.floor(Math.random() * cells.length), 1)[0]);
  }

  function newGame() {
    seed = mode.daily ? today() * 7919 : 0;
    placeStones();
    clearBoard();
    drawStones();
    score = 0; undosLeft = UNDOS; history = []; won = false; keepGoing = false; over = false;
    timeLeft = mode.time || 0; stepsLeft = mode.steps || 0; started = false;
    spawn(); spawn();
    render();
    persist();
  }

  const fmt = s => { s = Math.ceil(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function renderGoal() {
    const t = mode.target, tgt = t ? `<b>${t} ${tierName(t)}</b>` : "";
    if (mode.time) {
      goalEl.innerHTML = started
        ? `剩 <b class="${timeLeft <= 15 ? "warn" : ""}">${fmt(timeLeft)}</b>，時間到前拿高分。`
        : `限時 <b>${fmt(timeLeft)}</b>，第一步開始計時。`;
    } else if (mode.steps) {
      goalEl.innerHTML = `剩 <b class="${stepsLeft <= 10 ? "warn" : ""}">${stepsLeft} 步</b>，用完前拿最高分。`;
    } else if (mode.daily) {
      const d = String(today());
      goalEl.innerHTML = `<b>${+d.slice(4, 6)}/${+d.slice(6)}</b> 的盤面人人相同，比比看誰分數高。`;
    } else if (won && keepGoing) {
      goalEl.innerHTML = `已合成 ${tgt}，繼續往上。`;
    } else if (mode.blind) {
      goalEl.innerHTML = `數字藏起來了，只靠顏色合成 ${tgt}。`;
    } else if (mode.stones) {
      goalEl.innerHTML = `石塊擋路不會動，繞開它合成 ${tgt}。`;
    } else if (mode.spawn) {
      goalEl.innerHTML = `每步冒出兩塊，合成 ${tgt}。`;
    } else {
      goalEl.innerHTML = `合併相同的方塊，合成 ${tgt}。`;
    }
  }

  function render(gain) {
    scoreEl.textContent = score;
    if (score > best) { best = score; store.set(bestKey(), best); }
    bestEl.textContent = best;
    undoBtn.textContent = skin.undo + " " + undosLeft;
    undoBtn.disabled = !undosLeft || !history.length;
    const top = topValue();
    [...ladder.children].forEach((s, i) => s.classList.toggle("on", 2 ** (i + 1) <= top));
    $("topGlaze").textContent = "目前最高：" + tierName(top);
    renderGoal();
    if (gain) {
      const p = document.createElement("div");
      p.className = "plus"; p.textContent = "+" + gain;
      $("scoreBox").appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  function move(dir) {
    if (over || (won && !keepGoing)) return;
    flush();
    const [dr, dc] = DIRS[dir];
    const before = { cells: snapshot(), score, won, keepGoing };
    let moved = false, gain = 0;
    const next = Array.from({ length: N }, () => Array(N).fill(null));
    const merges = [];
    for (let i = 0; i < N; i++) {
      // cells of this line ordered from the side we move toward, split into runs between stones
      const line = [];
      for (let k = 0; k < N; k++) {
        const j = (dr || dc) > 0 ? N - 1 - k : k;
        line.push(dr ? [j, i] : [i, j]);
      }
      const runs = [[]];
      line.forEach(([r, c]) => (isStone(r, c) ? runs.push([]) : runs[runs.length - 1].push([r, c])));
      for (const run of runs) {
        let slot = 0, last = null, lastMerged = false;
        for (const [r, c] of run) {
          const t = grid[r][c];
          if (!t) continue;
          if (last && last.v === t.v && !lastMerged) {
            t.r = last.r; t.c = last.c; place(t);
            t.el.classList.add("dying");
            last.v *= 2; gain += last.v; lastMerged = true;
            merges.push([last, t]);
            moved = true;
            continue;
          }
          const [nr, nc] = run[slot++];
          if (nr !== r || nc !== c) moved = true;
          t.r = nr; t.c = nc; place(t);
          next[nr][nc] = t; last = t; lastMerged = false;
        }
      }
    }
    if (!moved) { board.animate?.([{ transform: "translateX(0)" }, { transform: `translate(${dc * 4}px, ${dr * 4}px)` }, { transform: "translateX(0)" }], { duration: 140 }); return; }
    if (canUndoMode()) history = [before]; // single-step undo
    if (!started) { started = true; lastTick = performance.now(); }
    if (mode.steps) stepsLeft--;
    grid = next; score += gain;
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      merges.forEach(([keep, gone]) => {
        gone.el.remove(); paint(keep);
        keep.el.classList.remove("pop"); void keep.el.offsetWidth; keep.el.classList.add("pop");
      });
    };
    cleanup.push(finish);
    setTimeout(() => { finish(); cleanup = cleanup.filter(f => f !== finish); }, 115);
    for (let k = 0; k < (mode.spawn || 1); k++) spawn();
    render(gain);
    if (mode.target && !won && merges.some(([k]) => k.v >= mode.target)) { won = true; showOverlay("win"); } // card shown at once (it fades in) so no swipe is silently swallowed
    else if (mode.steps && stepsLeft <= 0) end("steps", 420);
    else if (!canMove()) end("over", 420);
  }

  function end(kind, delay) { over = true; persist(); setTimeout(() => showOverlay(kind), delay); }

  function canMove() {
    if (empties().length) return true;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) continue;
      if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
      if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function undo() {
    if (!canUndoMode() || !undosLeft || !history.length) return;
    const h = history.pop();
    undosLeft--; over = false;
    if ("won" in h) { won = h.won; keepGoing = h.keepGoing; } // undoing the winning merge un-wins it
    load(h.cells); score = h.score;
    render();
  }

  function showOverlay(kind) {
    board.querySelector(".overlay")?.remove();
    const o = document.createElement("div");
    o.className = "overlay";
    const record = score > 0 && score >= best ? "，創下這個模式的新紀錄" : "";
    const summary = `本局 ${score} 分${record}，最高合成到「${tierName(topValue())}」。`;
    if (kind === "win") {
      o.innerHTML = `<h2>${tierName(mode.target)}已成</h2><p>你合成了 ${mode.target}。可以繼續往上，看能走多遠。</p><div><button type="button" data-a="go">繼續</button><button type="button" class="ghost" data-a="new">新局</button></div>`;
    } else {
      const title = { over: skin.full, time: "時間到", steps: "步數用完" }[kind];
      const canUndo = kind === "over" && canUndoMode() && undosLeft && history.length;
      const again = mode.daily ? "重玩今日盤面" : skin.again;
      o.innerHTML = `<h2>${title}</h2><p>${summary}</p><div>${canUndo ? `<button type="button" class="ghost" data-a="undo">${skin.undo}一步（剩 ${undosLeft}）</button>` : ""}<button type="button" data-a="new">${again}</button></div>`;
    }
    o.addEventListener("click", e => {
      const a = e.target.closest("button")?.dataset.a;
      if (a === "go") { keepGoing = true; o.remove(); renderGoal(); board.focus(); if (mode.steps && stepsLeft <= 0) end("steps", 0); else if (!canMove()) end("over", 0); }
      if (a === "new") newGame();
      if (a === "undo") undo();
    });
    board.appendChild(o);
    o.querySelector("button")?.focus();
  }

  // countdown for 急火; pauses while the page is hidden
  let lastTick = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = (now - lastTick) / 1000;
    lastTick = now;
    if (!mode || !mode.time || !started || over || document.hidden) return;
    const shown = Math.ceil(timeLeft);
    timeLeft = Math.max(0, timeLeft - dt);
    if (Math.ceil(timeLeft) !== shown) renderGoal();
    if (timeLeft <= 0) { flush(); end("time", 0); }
  }, 200);

  const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KEYS[e.key]) { e.preventDefault(); move(KEYS[e.key]); }
    else if (e.key === "z" || e.key === "Z") undo();
  });

  // swipe (pointer events cover touch, pen and mouse drag)
  let start = null;
  board.addEventListener("pointerdown", e => {
    if (e.target.closest(".overlay")) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  addEventListener("pointerup", e => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  addEventListener("pointercancel", () => { start = null; });
  document.addEventListener("touchmove", e => { if (start) e.preventDefault(); }, { passive: false });

  $("newGame").addEventListener("click", newGame);
  undoBtn.addEventListener("click", undo);

  // each mode keeps its own game, so switching modes never loses progress
  const save = () => ({ mode: mode.id, skin: document.documentElement.dataset.skin, cells: snapshot(), stones, seed, day: mode.daily ? today() : 0,
    score, undosLeft, history, won, keepGoing, timeLeft, stepsLeft, started, over });
  function persist() { if (mode && grid) store.set("kiln2048-game-" + mode.id, JSON.stringify(save())); }
  addEventListener("pagehide", persist);
  document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });

  function resume(s) {
    const ok = s && Array.isArray(s.cells) && s.cells.length === N && s.cells.flat().some(Boolean) && (!mode.daily || s.day === today());
    if (!ok) return newGame();
    stones = Array.isArray(s.stones) ? s.stones : [];
    seed = s.seed || 0;
    load(s.cells); score = s.score || 0; undosLeft = s.undosLeft ?? UNDOS; history = s.history || [];
    won = !!s.won; keepGoing = !!s.keepGoing; started = !!s.started;
    timeLeft = s.timeLeft ?? (mode.time || 0); stepsLeft = s.stepsLeft ?? (mode.steps || 0);
    over = !!s.over || !canMove() || (mode.time && timeLeft <= 0) || (mode.steps && stepsLeft <= 0);
    render();
    if (over) showOverlay(mode.time && timeLeft <= 0 ? "time" : mode.steps && stepsLeft <= 0 ? "steps" : "over");
    else if (won && !keepGoing) showOverlay("win");
  }
  const savedGame = id => { try { return JSON.parse(store.get("kiln2048-game-" + id) || "null"); } catch { return null; } };

  function switchMode(id) {
    if (mode && id === mode.id) return;
    persist();
    flush();
    board.querySelectorAll(".tile, .overlay").forEach(n => n.remove());
    grid = null;
    setMode(id);
    resume(savedGame(id));
  }

  function start0(data) {
    setSkin((data && data.skin) || store.get("kiln2048-skin") || "kiln");
    setMode((data && data.mode) || store.get("kiln2048-mode") || "classic");
    if (data && data.cells) return resume(data);
    let s = savedGame(mode.id);
    if (!s && mode.id === "classic") { try { s = JSON.parse(store.get("kiln2048-game") || "null"); } catch {} }
    resume(s);
  }
  window.claude?.hot?.snapshot?.(save);
  window.claude?.hot?.ready ? window.claude.hot.ready(start0) : start0(window.claude?.hot?.data ?? {});
})();
</script>
