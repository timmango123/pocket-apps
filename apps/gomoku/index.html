<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>五子棋</title>
<style>
:root{
  --bg:#dfe3ef; --bg2:#c9cfe2; --ink:#2a2620; --ink2:#6a6255; --card:#fbf6ecf2; --card2:#f1e7d3; --line:#e2d6bd;
  --gold:#c9962e; --gold2:#e7b852; --red:#c8432f; --ok:#4f9a6a; --accent:#3f5b8c;
  --btn:linear-gradient(180deg,#e7b852,#c9962e); --btnInk:#2a1d06; --btnSh:#9b7020;
  --moon:#fff8e0; --shadow:0 6px 22px #3a3f5a2a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1424; --bg2:#070a14; --ink:#efe6d2; --ink2:#a49b8a; --card:#1c2233f2; --card2:#262d42; --line:#333b52;
  --gold:#d9ad55; --gold2:#ecc673; --red:#e2705e; --ok:#6cc08f; --accent:#9fb3dc;
  --btn:linear-gradient(180deg,#ecc673,#c99a3f); --btnInk:#1d1505; --btnSh:#8a6522;
  --moon:#fff3c4; --shadow:0 6px 22px #000a; --moonfx:.22;
}}
:root[data-theme="dark"]{
  --bg:#0f1424; --bg2:#070a14; --ink:#efe6d2; --ink2:#a49b8a; --card:#1c2233f2; --card2:#262d42; --line:#333b52;
  --gold:#d9ad55; --gold2:#ecc673; --red:#e2705e; --ok:#6cc08f; --accent:#9fb3dc;
  --btn:linear-gradient(180deg,#ecc673,#c99a3f); --btnInk:#1d1505; --btnSh:#8a6522; --moon:#fff3c4; --shadow:0 6px 22px #000a; --moonfx:.22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 70% at 88% -8%,color-mix(in srgb,var(--moon) 38%,transparent) 0,transparent 55%),linear-gradient(170deg,var(--bg),var(--bg2));background-color:var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
/* moonlight window lattice */
#moonfx{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--moonfx,.55);
  background:repeating-linear-gradient(118deg,transparent 0 46px,color-mix(in srgb,var(--moon) 9%,transparent) 46px 120px,transparent 120px 190px)}
.scr{position:fixed;inset:0;z-index:1}
/* ---------- title ---------- */
#scrTitle{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 4vh) 20px calc(var(--sab) + 18px);overflow-y:auto}
.ttl{text-align:center}
.ttl h1{margin:0;font-size:58px;letter-spacing:10px;font-weight:900;color:var(--ink);text-shadow:0 3px 0 color-mix(in srgb,var(--gold) 40%,transparent),0 10px 30px #0003}
.ttl .sub{margin-top:6px;color:var(--ink2);font-size:15px;letter-spacing:4px}
#tBoard{width:min(250px,62vw);height:min(250px,62vw);margin:2vh auto;display:block;border-radius:10px;box-shadow:0 18px 40px #0004}
.tbtns{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;font-weight:800;font-size:17px;
  background:var(--btn);color:var(--btnInk);box-shadow:0 4px 0 var(--btnSh),0 8px 18px #0002;letter-spacing:1px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnSh)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line),0 6px 14px #0001}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn small{font-weight:600;font-size:12px;opacity:.75}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{min-height:46px;font-size:15px}
/* ---------- game ---------- */
#scrGame{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:100%;grid-template-areas:"top" "board" "tools"}
.top{grid-area:top;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;flex-direction:column;gap:6px;min-width:0}
.pbar{display:flex;gap:8px;align-items:stretch}
.pchip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);border:2px solid transparent;min-height:52px;transition:border-color .2s}
.pchip.on{border-color:var(--gold)}
.pchip .st{width:26px;height:26px;border-radius:50%;flex:none}
.st.b{background:radial-gradient(circle at 35% 30%,#777 0,#222 45%,#000 100%);box-shadow:1px 2px 2px #0006}
.st.w{background:radial-gradient(circle at 35% 30%,#fff 0,#eef1f4 55%,#c3c9d2 100%);box-shadow:1px 2px 2px #0005}
.pchip .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .sb{font-size:11px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:4px}
.pchip .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.pips{display:inline-flex;gap:2px}.pips i{width:4px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--ink2) 30%,transparent)}.pips i.on{background:var(--gold)}
.think i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--gold);margin:0 1px;animation:dot 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.pzbar{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg,.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pzmid{flex:1;min-width:0;background:var(--card);border-radius:14px;min-height:48px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:4px 12px;gap:6px}
.pzmid b{font-size:16px;white-space:nowrap}
.pzmid .sb{font-size:11px;color:var(--ink2);display:flex;gap:5px;align-items:center;white-space:nowrap}
.left{text-align:right;font-size:12px;color:var(--ink2);white-space:nowrap;line-height:1.1}
.left b{display:block;font-size:20px;color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;min-height:44px}
.status #stTxt{flex:1;min-width:0;font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status #stTxt b{color:var(--ink)}
.chip{min-height:36px;padding:0 12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;position:relative}
.chip::after{content:"";position:absolute;inset:-5px}
.chip[aria-checked="true"]{background:var(--gold);color:var(--btnInk)}
#boardWrap{grid-area:board;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;min-width:0;padding:4px 8px}
#binfo{font-size:12px;color:var(--ink2);letter-spacing:1px;min-height:16px;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%}
#cv{display:block;touch-action:none;border-radius:6px;box-shadow:0 14px 34px #0004,0 2px 0 #0002}
#mag{position:fixed;width:140px;height:140px;border-radius:50%;pointer-events:none;z-index:6;box-shadow:0 10px 24px #0006,0 0 0 3px var(--gold);display:none}
.tools{grid-area:tools;display:flex;justify-content:center;gap:6px;padding:6px calc(var(--sar) + 8px) calc(var(--sab) + 10px) calc(var(--sal) + 8px)}
.tool{flex:1;max-width:84px;min-height:56px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.tool:active{transform:scale(.95)}
.tool[disabled]{opacity:.4;pointer-events:none}
.tool.place{max-width:110px;flex:1.4;background:var(--btn);color:var(--btnInk);box-shadow:0 4px 0 var(--btnSh)}
.tool.place[disabled]{opacity:1;background:var(--card);color:var(--ink2);box-shadow:var(--shadow)}
.tool.place .st{width:20px;height:20px;border-radius:50%}
#rtools{align-items:center}
#rSlider{flex:3;min-width:60px;height:44px;accent-color:var(--gold)}
#rNum{min-width:54px;text-align:center;font-weight:800;font-size:14px}
.tool.sq{max-width:52px;flex:none;width:48px}
/* landscape */
@media (orientation:landscape) and (max-height:560px){
  #scrTitle{display:grid;grid-template-columns:auto minmax(0,360px);grid-template-areas:"board ttl" "board btns";justify-content:center;align-content:center;column-gap:36px;row-gap:14px;padding:calc(var(--sat) + 12px) calc(var(--sar) + 20px) calc(var(--sab) + 12px) calc(var(--sal) + 20px)}
  #tBoard{grid-area:board;width:min(300px,70vh);height:min(300px,70vh);margin:0;align-self:center}
  .ttl{grid-area:ttl;align-self:end}.ttl h1{font-size:44px}
  .tbtns{grid-area:btns;align-self:start}
}
@media (orientation:landscape) and (max-height:560px){
  #scrGame{grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"top board tools" "top board tools"}
  .top{padding:calc(var(--sat) + 8px) 6px 8px calc(var(--sal) + 10px);justify-content:center}
  .pbar{flex-direction:column}
  .tools{flex-direction:column;justify-content:center;padding:8px calc(var(--sar) + 10px) 8px 6px;align-items:stretch;min-width:140px}
  .tool{max-width:none;flex:none;min-height:48px;flex-direction:row;gap:8px}
  .tool.place{max-width:none;flex:none}
  #rtools{flex-direction:column}
  #rSlider{flex:none;width:100%}
  #boardWrap{padding:6px 2px}
  #binfo{display:none}
}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);
  background:color-mix(in srgb,var(--bg2) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:0 20px 50px #0005;padding:20px 18px;width:min(380px,100%);max-height:100%;overflow-y:auto;text-align:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.2);touch-action:pan-y}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.card .btn{margin-top:10px}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{max-height:none} }
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{flex:1;min-width:0;min-height:46px;border-radius:12px;background:var(--card2);font-weight:700;font-size:14px;padding:4px 2px;line-height:1.15;border:2px solid transparent}
.seg button small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--card2))}
.lbl{text-align:left;font-size:13px;font-weight:800;color:var(--ink2);margin-top:6px;letter-spacing:1px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.setrow small{display:block;color:var(--ink2);font-size:12px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;flex:none}
.sw .trk{width:48px;height:28px;border-radius:14px;background:color-mix(in srgb,var(--ink2) 35%,transparent);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--ok)}
.sw[aria-checked="true"] .trk::after{transform:translateX(20px)}
.desc{font-size:13px;color:var(--ink2);min-height:20px;margin-top:-4px}
.res{display:flex;justify-content:center;gap:22px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink)}
.big{font-size:52px;line-height:1;margin:6px 0 2px}
.helpbody{text-align:left;font-size:14px;line-height:1.65;color:var(--ink2)}
.helpbody h4{margin:12px 0 2px;color:var(--ink);font-size:15px}
.helpbody b{color:var(--ink)}
textarea.code{width:100%;height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:none;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#1d1a14ee;color:#fbeed2;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .35s}
.achv{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.achv .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);font-weight:900;color:var(--ink2);flex:none}
.achv.got .ic{background:var(--btn);color:var(--btnInk)}
.achv div{font-size:14px}.achv small{display:block;color:var(--ink2);font-size:12px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.statgrid div{background:var(--card2);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--ink2)}
.statgrid b{display:block;font-size:20px;color:var(--ink)}
/* ---------- puzzle select ---------- */
#scrSelect{display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.selbar{display:flex;gap:8px;padding:0 14px 8px;align-items:center;flex-wrap:wrap}
.selbar .chip{min-height:40px}
.selsum{flex:1;font-size:13px;color:var(--ink2);min-width:120px}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
.gh{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--ink2);margin:8px 2px 0;display:flex;align-items:center;gap:6px}
.gh i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lt{height:66px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px;min-height:44px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt .db{width:70%;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink2) 22%,transparent);overflow:hidden}
.lt .db i{display:block;height:100%}
.lt.done::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--card)}
.lt.cur{outline:3px solid var(--gold)}
.lt.lock{opacity:.5}
.lt.lock .n{font-size:15px}
.lt.miss{box-shadow:0 3px 0 var(--red)}
.lt:active{transform:scale(.95)}
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .tool:hover,.lt:hover{filter:brightness(1.04)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="moonfx"></div>

<section class="scr" id="scrTitle">
  <div class="ttl"><h1 class="serif">五子棋</h1><div class="sub">月夜榧木・連五為勝</div></div>
  <canvas id="tBoard" aria-hidden="true"></canvas>
  <div class="tbtns">
    <button class="btn hidden" id="tResume">繼續對局 <small id="tResumeInfo"></small></button>
    <button class="btn" id="tAI">對戰電腦</button>
    <button class="btn sec" id="tNet" hidden>連線對戰 <small id="tNetInfo"></small></button>
    <div class="row"><button class="btn sec" id="tPz">殘局挑戰 <small id="tPzInfo"></small></button><button class="btn sec" id="tDaily">每日殘局</button></div>
    <div class="row"><button class="btn sec mini" id="tPvp">雙人對戰</button><button class="btn sec mini" id="tStats">統計</button><button class="btn sec mini" id="tSet">設定</button><button class="btn sec mini" id="tHelp">說明</button></div>
  </div>
</section>

<section class="scr hidden" id="scrGame">
  <div class="top">
    <div class="pbar" id="pbar">
      <div class="pchip" id="chipB"><span class="st b"></span><div style="min-width:0"><div class="nm" id="nmB">你</div><div class="sb" id="sbB">黑方・先手</div></div><span class="tm" id="tmB">0:00</span></div>
      <div class="pchip" id="chipW"><span class="st w"></span><div style="min-width:0"><div class="nm" id="nmW">電腦</div><div class="sb" id="sbW"></div></div><span class="tm" id="tmW">0:00</span></div>
    </div>
    <div class="pzbar hidden" id="pzbar">
      <button class="ibtn" id="pzBack" aria-label="返回關卡"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pzmid"><div style="min-width:0"><b id="pzTitle">第 1 關</b><div class="sb">難度 <span id="pzDiff">0</span><span class="pips" id="pzPips"></span></div></div><div class="left">剩餘<b id="pzLeft">2</b></div></div>
    </div>
    <div class="status"><span id="stTxt"></span><button class="chip" id="bThreat" role="switch" aria-checked="false" aria-label="威脅標示">威脅標示</button></div>
  </div>
  <div id="boardWrap"><canvas id="cv" aria-label="棋盤"></canvas><div id="binfo"></div></div>
  <div class="tools" id="tools">
    <button class="tool" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
    <button class="tool" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>

  $('setList').innerHTML = SET_ROWS.map(function (r) { return '<div class="setrow"><span>' + r[1] + (r[2] ? '<small>' + r[2] + '</small>' : '') + '</span><button class="sw" role="switch" data-k="' + r[0] + '" aria-checked="' + !!SET[r[0]] + '" aria-label="' + r[1] + '"><span class="trk"></span></button></div>'; }).join('');
  show('ovSet');
}
$('setList').addEventListener('click', function (e) {
  var b = e.target.closest('.sw'); if (!b) return; var k = b.dataset.k; SET[k] = !SET[k]; b.setAttribute('aria-checked', String(SET[k])); sset('settings', SET); SND.ui();
  if (k === 'fbMark') computeFb(); kick();
});
$('setOk').addEventListener('click', function () { hide('ovSet'); kick(); });
function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }
function openStats() {
  var h = '<div class="statgrid"><div>對局<b>' + STATS.games + '</b></div><div>勝率<b>' + pct(STATS.wins, STATS.games) + '</b></div><div>平均手數<b>' + (STATS.games ? Math.round(STATS.plies / STATS.games) : '—') + '</b></div>' +
    '<div>執黑勝率<b>' + pct(STATS.bW, STATS.bG) + '</b></div><div>執白勝率<b>' + pct(STATS.wW, STATS.wG) + '</b></div><div>最長連勝<b>' + STATS.best + '</b></div></div>';
  h += '<div class="lbl">各等級戰績</div><div class="statgrid">';
  for (var i = 1; i <= 5; i++) { var L = STATS.lv[i] || { g: 0, w: 0 }; h += '<div>' + LVN[i] + '<b>' + L.w + '/' + L.g + '</b></div>'; }
  h += '<div>殘局<b>' + Object.keys(PROG.done).length + '/' + NPZ + '</b></div></div><div class="lbl">成就</div>';
  ACH_LIST.forEach(function (a) { h += '<div class="achv' + (ACH[a[0]] ? ' got' : '') + '"><span class="ic">' + (ACH[a[0]] ? '✓' : '?') + '</span><div>' + a[1] + '<small>' + a[2] + '</small></div></div>'; });
  $('statBody').innerHTML = h; show('ovStats');
}
$('statOk').addEventListener('click', function () { hide('ovStats'); });
var HELP = '<h4>勝負</h4>黑白輪流在交叉點落子，黑先。橫、直、斜任一方向連成五子就贏；盤面下滿算和局。' +
  '<h4>三種規則</h4><b>自由</b>：五子以上（長連）都算贏。<b>標準</b>：恰好五子才贏，長連不算。<b>連珠</b>：黑方禁止<b>三三</b>（同時兩個活三）、<b>四四</b>、<b>長連</b>，下了直接判負；但同一手若成五，五連優先。白方沒有禁手，長連也算贏。活三要「再下一子能成活四、而且那一點本身不是禁手」才算。' +
  '<h4>落子手感</h4>點一下出現預覽子與十字準線，再點同一點或按「落子」確認；按住拖動可微調，上方放大鏡顯示手指下的位置。雙指可縮放、平移棋盤。設定可改成單擊即落。桌機滑鼠直接點擊即可，U 悔棋、H 提示、N 新局。' +
  '<h4>電腦五級</h4>初學、入門、中級、高級、專家。等級越高越少失誤、算得越深；高級以上會找連續衝四（VCF）與活三攻擊（VCT）。' +
  '<h4>交換</h4>連珠規則可開啟簡化交換：黑方下滿三手後，白方可以選擇換色。' +
  '<h4>威脅標示</h4>打開後以色帶標出雙方的活三（淡）與四（深）：黑方紅橙、白方藍。' +
  '<h4>殘局挑戰</h4>100 關限步連五，每一手都必須是衝四或活三；對手以引擎最佳防守應對。失敗的關卡會收進錯題本。';
function openHelp(title, body) { $('hTitle').textContent = title || '玩法說明'; $('hBody').innerHTML = body || HELP; show('ovHelp'); }
$('hOk').addEventListener('click', function () { hide('ovHelp'); });

/* ================= buttons ================= */
$('tAI').addEventListener('click', function () { audio(); SND.ui(); openNew('ai'); });
$('tPvp').addEventListener('click', function () { audio(); SND.ui(); openNew('pvp'); });
$('tNet').addEventListener('click', function () { audio(); SND.ui(); NET.open(); });
$('tResume').addEventListener('click', function () { audio(); SND.ui(); resumeGame(); });
$('tPz').addEventListener('click', function () { audio(); SND.ui(); openSelect(); });
$('tDaily').addEventListener('click', function () { audio(); SND.ui(); startPuzzle(dailyLevel(), true); });
$('tStats').addEventListener('click', function () { SND.ui(); openStats(); });
$('tSet').addEventListener('click', function () { SND.ui(); openSettings(); });
$('tHelp').addEventListener('click', function () { SND.ui(); openHelp(); });
$('bUndo').addEventListener('click', undo);
$('bHint').addEventListener('click', hint);
$('bRules').addEventListener('click', function () {
  if (G.mode === 'pz') openHelp('殘局規則', (G.pz.att === 1 ? '你執<b>黑</b>' : '你執<b>白</b>') + '，要在 <b>' + G.pz.N + ' 手</b>內連成五子（目前剩 ' + G.pz.left + ' 手）。<h4>連續進攻</h4>每一手都要是衝四或活三；對手被迫應對，否則他會化解攻勢。對手已衝四時，必須先擋。<h4>本關規則</h4>' + RULEN[G.rule] + (G.rule === 2 ? '：黑方禁止三三、四四、長連（五連優先）。' : '：五子以上連線即勝。') + (INTROS[G.pz.n] ? '<h4>' + INTROS[G.pz.n][0] + '</h4>' + INTROS[G.pz.n][1] : ''));
  else openHelp(RULEN[G.rule], HELP.split('<h4>落子手感</h4>')[0]);
});
$('bMenu').addEventListener('click', function () {
  if (G.mode === 'pz') { openSelect(); return; }
  if (G.mode === 'net') { NET.open(); return; }
  $('mInfo').textContent = (G.mode === 'ai' ? '對手：' + LVN[G.lv] + '・' : '雙人・') + RULEN[G.rule] + '・' + G.size + ' 路・第 ' + (G.moves.length + 1) + ' 手';
  $('mResign').disabled = G.over; show('ovMenu');
});
$('pzBack').addEventListener('click', function () { openSelect(); });
$('mResume').addEventListener('click', function () { hide('ovMenu'); });
$('mNew').addEventListener('click', function () { hide('ovMenu'); openNew(G.mode === 'pvp' ? 'pvp' : 'ai'); });
$('mReplay').addEventListener('click', function () { hide('ovMenu'); startReplay({ moves: G.moves.slice(0), size: G.size, rule: G.rule, saved: snapshot() }); });
$('mShare').addEventListener('click', function () { hide('ovMenu'); shareGame(); });
$('mResign').addEventListener('click', function () {
  hide('ovMenu'); if (G.over) return; G.token++; wCancel();
  var loser = G.mode === 'ai' ? G.human : G.toMove; finish(3 - loser, colName(loser) + '方認輸');
});
$('mSet').addEventListener('click', function () { hide('ovMenu'); openSettings(); });
$('mHome').addEventListener('click', function () { G.token++; wCancel(); saveGame(); G.mode = 'none'; showScreen('scrTitle'); });
$('rAgain').addEventListener('click', function () {
  hide('ovResult');
  if (G.mode === 'net') { NET.rematch(); return; }
  if (G.mode === 'ai') startGame({ mode: 'ai', size: G.size, rule: G.rule, lv: G.lv, human: LAST.col || (Math.random() < 0.5 ? 1 : 2), tengen: G.tengen, swap: G.swap });
  else startGame({ mode: 'pvp', size: G.size, rule: G.rule, tengen: G.tengen });
});
$('rReplay').addEventListener('click', function () { hide('ovResult'); startReplay({ moves: G.moves.slice(0), size: G.size, rule: G.rule, saved: snapshot() }); });
$('rShare').addEventListener('click', function () { hide('ovResult'); shareGame(); });
$('rBoard').addEventListener('click', function () { hide('ovResult'); });
$('rHome').addEventListener('click', function () { if (G.mode === 'net') { NET.leave(); return; } G.mode = 'none'; showScreen('scrTitle'); });
$('pwNext').addEventListener('click', function () { if (G.pz && G.pz.n < NPZ) startPuzzle(G.pz.n + 1, false); });
$('pwRetry').addEventListener('click', function () { startPuzzle(G.pz.n, G.pz.daily); });
$('pwSelect').addEventListener('click', openSelect);
$('pfRetry').addEventListener('click', function () { startPuzzle(G.pz.n, G.pz.daily); });
$('pfUndo').addEventListener('click', function () { hide('ovPzFail'); undo(); });
$('pfSelect').addEventListener('click', openSelect);
$('iOk').addEventListener('click', function () { hide('ovIntro'); });
$('swYes').addEventListener('click', function () { hide('ovSwap'); G.swapPending = false; G.human = 1; G.swapped = true; labelChips(); toast('已交換：你改執黑'); saveGame(); nextTurn(); });
$('swNo').addEventListener('click', function () { hide('ovSwap'); G.swapPending = false; saveGame(); nextTurn(); });
$('bThreat').addEventListener('click', function () { threatOn = !threatOn; $('bThreat').setAttribute('aria-checked', String(threatOn)); SND.ui(); computeThreats(); kick(); });
$('shCopy').addEventListener('click', function () {
  var t = $('shCode'); t.select();
  var done = function () { toast('已複製棋譜連結'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) { toast('請長按文字框複製'); } });
  else { try { document.execCommand('copy'); done(); } catch (e) { toast('請長按文字框複製'); } }
});
$('shSys').addEventListener('click', function () { if (navigator.share) navigator.share({ title: '五子棋棋譜', text: '來看看這盤五子棋：', url: $('shCode').value }).catch(function () {}); });
$('shOk').addEventListener('click', function () { hide('ovShare'); });
$('rSlider').addEventListener('input', function () { stopAuto(); setReplayIdx(+$('rSlider').value); });
$('rStart').addEventListener('click', function () { stopAuto(); setReplayIdx(0); });
$('rPrev').addEventListener('click', function () { stopAuto(); setReplayIdx(RP.idx - 1); SND.stone(true); });
$('rNext').addEventListener('click', function () { stopAuto(); setReplayIdx(RP.idx + 1); SND.stone(true); });
$('rPlay').addEventListener('click', function () {
  if (rpTimer) { stopAuto(); return; }
  if (RP.idx >= RP.list.length) setReplayIdx(0);
  $('rPlayIc').innerHTML = '<path d="M8 5v14M16 5v14"/>';
  rpTimer = setInterval(function () { if (!RP || RP.idx >= RP.list.length) { stopAuto(); return; } setReplayIdx(RP.idx + 1); SND.stone(true); }, 650);
});
$('rExit').addEventListener('click', exitReplay);
document.addEventListener('keydown', function (e) {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  var k = e.key.toLowerCase();
  if ($('scrGame').classList.contains('hidden')) return;
  if (G.mode === 'replay') { if (k === 'arrowleft') setReplayIdx(RP.idx - 1); else if (k === 'arrowright') setReplayIdx(RP.idx + 1); else if (k === 'escape') exitReplay(); return; }
  if (k === 'u') undo(); else if (k === 'h') hint();
  else if (k === 'n') { if (G.mode === 'net') return; if (G.mode === 'pz') startPuzzle(G.pz.n, G.pz.daily); else openNew(G.mode === 'pvp' ? 'pvp' : 'ai'); }
  else if ((k === 'enter' || k === ' ') && preview >= 0) { e.preventDefault(); tryPlace(preview, false); }
  else if (k === 'escape') $('bMenu').click();
});
window.addEventListener('resize', function () { if (!$('scrGame').classList.contains('hidden')) layout(); if (!$('scrTitle').classList.contains('hidden')) drawTitleBoard(); kick(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (!G.over && (G.mode === 'ai' || G.mode === 'pvp')) { G.clock[G.toMove] += Math.max(0, now() - G.turnT0); saveGame(); } }
  else { G.turnT0 = now(); kick(); }
});
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { wood = null; kick(); refreshTitle(); }); } catch (e) {}

/* ================= online play ================= */
var NETST = '';
function netReplay(mv) { // silent replay of a received move list; returns how many were legal
  for (var i = 0; i < mv.length; i++) {
    var p = mv[i], c = G.toMove;
    if (G.over || typeof p !== 'number' || p !== (p | 0) || p < 0 || p >= NN || B[p]) return i;
    var forb = G.rule === 2 && c === 1 && !isFive(p, 1) && isForbidden(p), ftype = forb ? fbType(p) : '';
    play(p, c); G.moves.push([p, c]); G.toMove = 3 - c;
    var wl = winLine(p);
    if (wl) { G.wl = wl; winT = now() - 5000; G.over = true; G.result = { winner: c, reason: '連成五子' }; }
    else if (forb) { G.over = true; G.result = { winner: 3 - c, reason: '黑方禁手（' + ftype + '）' }; }
    else if (STONES >= NN) { G.over = true; G.result = { winner: 0, reason: '棋盤下滿' }; }
  }
  return mv.length;
}
NET.init({
  game: 'gomoku', title: '五子棋', sides: ['黑', '白'], button: $('tNet'),
  choices: [{ key: 'rule', label: '規則', def: 0, items: [[0, '自由'], [1, '標準'], [2, '連珠']] }, { key: 'size', label: '盤面', def: 15, items: [[9, '9 路'], [15, '15 路'], [19, '19 路']] }],
  start: function (o, side, mv) {
    hideAllOv();
    startGame({ mode: 'net', size: o.size, rule: o.rule, tengen: false });
    var n = netReplay(mv);
    computeFb(); computeThreats(); labelChips(); updateUI(); kick();
    if (G.over) setTimeout(function () { if (G.mode === 'net' && G.over) showResult(); }, 400);
    return n;
  },
  play: function (p) {
    if (G.mode !== 'net' || G.over || typeof p !== 'number' || p !== (p | 0) || p < 0 || p >= NN || B[p]) return false;
    preview = -1; hover = -1; hideMag();
    doMove(p, G.toMove, false); return true;
  },
  toMove: function () { return G.mode !== 'net' || G.over ? -1 : G.toMove - 1; },
  resigned: function (side) { if (G.mode !== 'net' || G.over) return; G.token++; finish(2 - side, colName(side + 1) + '方認輸'); },
  exit: function () { G.mode = 'none'; showScreen('scrTitle'); },
  names: function (a, b) { G.netNames = [a, b]; if (G.mode === 'net') labelChips(); },
  onStatus: function (t) { NETST = t; if (G.mode === 'net') updateStatus(); },
  resumeHint: function (code) { $('tNetInfo').textContent = '房間 ' + code; },
  snapshot: function () { return G.size + ':' + G.moves.map(function (m) { return m[0]; }).join(',') + '|' + (G.over && G.result ? G.result.winner : '-'); },
  randomMove: function () {
    var c = G.toMove, ok = [];
    for (var q = 0; q < NN; q++) if (!B[q] && legal(q, c)) ok.push(q);
    if (!ok.length) return false;
    tryPlace(ok[(Math.random() * ok.length) | 0], false); return true;
  }
});

/* ================= boot ================= */
setup(15, 2);
window.__gomoku = {
  state: function () { return { mode: G.mode, toMove: G.toMove, human: G.human, over: G.over, result: G.result, moves: G.moves.slice(0), base: G.base.slice(0), thinking: G.thinking, size: G.size, rule: G.rule, lv: G.lv, pz: G.pz ? Object.assign({}, G.pz) : null, preview: preview, swapPending: G.swapPending }; },
  cellXY: function (p) { return clientOf(p); },
  thinkLog: function () { return THINKLOG.slice(0); },
  puzzles: function () { return PUZ.length; }
};
var hm = /#g=([0-9a-z.]+)/.exec(location.hash || '');
var shared = hm ? decodeGame(hm[1]) : null;
if (shared) { startReplay({ moves: shared.moves, size: shared.size, rule: shared.rule }); toast('已載入分享的棋譜'); }
else showScreen('scrTitle');
})();

</script>
