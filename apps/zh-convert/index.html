<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>簡繁轉換</title>
<style>
/* Proofreader's desk: warm paper, ink text, vermilion (朱筆) marks on every changed word. */
:root {
  --bg: #f3ede1;
  --bg-2: #ebe3d3;
  --paper: #fffdf8;
  --paper-2: #f8f2e6;
  --ink: #221c14;
  --ink-2: #4a4033;
  --muted: #7a6d5a;
  --line: #e4dac7;
  --line-strong: #cbbda2;
  --accent: #b5321f;
  --accent-2: #9c2a19;
  --accent-ink: #ffffff;
  --accent-soft: #fbe6df;
  --mark: rgba(232, 96, 62, .16);
  --mark-line: #d9513a;
  --one: rgba(232, 96, 62, .055);
  --one-line: rgba(217, 81, 58, .35);
  --one-sw: rgba(217, 81, 58, .6);
  --tw: rgba(31, 138, 102, .14);
  --tw-line: #1f8a66;
  --tw-ink: #12614a;
  --cus: rgba(106, 79, 208, .14);
  --cus-line: #6a4fd0;
  --cus-ink: #4b35a8;
  --ok: #1f7a4d;
  --shadow: 0 1px 1px rgba(60, 40, 10, .05), 0 2px 6px rgba(60, 40, 10, .05), 0 10px 24px -8px rgba(60, 40, 10, .12);
  --shadow-sm: 0 1px 2px rgba(60, 40, 10, .1);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --serif: "Songti TC", "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110d; --bg-2: #1b1712; --paper: #1f1a14; --paper-2: #28221a; --ink: #f0e8d9; --ink-2: #cfc4b0; --muted: #a59882; --line: #383028; --line-strong: #54493c;
    --accent: #ec7563; --accent-2: #f28b7a; --accent-ink: #1f0b07; --accent-soft: #42221c; --mark: rgba(240, 120, 98, .2); --mark-line: #f08a78; --one: rgba(240, 120, 98, .07); --one-line: rgba(240, 138, 120, .4); --one-sw: rgba(240, 138, 120, .75);
    --tw: rgba(79, 207, 156, .17); --tw-line: #4fcf9c; --tw-ink: #9be7c8; --cus: rgba(160, 143, 245, .2); --cus-line: #a08ff5; --cus-ink: #cbbfff; --ok: #6ad39a;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 24px -10px rgba(0, 0, 0, .6); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110d; --bg-2: #1b1712; --paper: #1f1a14; --paper-2: #28221a; --ink: #f0e8d9; --ink-2: #cfc4b0; --muted: #a59882; --line: #383028; --line-strong: #54493c;
  --accent: #ec7563; --accent-2: #f28b7a; --accent-ink: #1f0b07; --accent-soft: #42221c; --mark: rgba(240, 120, 98, .2); --mark-line: #f08a78; --one: rgba(240, 120, 98, .07); --one-line: rgba(240, 138, 120, .4); --one-sw: rgba(240, 138, 120, .75);
  --tw: rgba(79, 207, 156, .17); --tw-line: #4fcf9c; --tw-ink: #9be7c8; --cus: rgba(160, 143, 245, .2); --cus-line: #a08ff5; --cus-ink: #cbbfff; --ok: #6ad39a;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 24px -10px rgba(0, 0, 0, .6); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  background-image: radial-gradient(120% 60% at 50% -10%, var(--paper-2), transparent 70%);
  background-attachment: fixed;
  padding-block: max(10px, env(safe-area-inset-top)) calc(24px + env(safe-area-inset-bottom));
  padding-inline: max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right));
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: 0 0 auto; }
.wrap { max-width: 1040px; margin: 0 auto; }

header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.brand .stamp { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--serif); font-weight: 800; font-size: 19px; box-shadow: var(--shadow-sm), inset 0 0 0 2px rgba(255,255,255,.18); transform: rotate(-4deg); flex: 0 0 auto; }
.brand h1 { font-family: var(--serif); font-size: 21px; font-weight: 800; letter-spacing: .08em; margin: 0; line-height: 1.15; white-space: nowrap; }
.brand .sub { display: block; font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .06em; color: var(--muted); margin-top: 1px; white-space: nowrap; }
.icon-btn {
  min-width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow-sm);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 11px; font-size: 13px; color: var(--ink-2);
  transition: transform .12s var(--ease), background .15s;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }

/* direction */
.dir { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
.seg { flex: 1; position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 3px; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 11px; background: var(--paper); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); transition: transform .28s var(--ease); }
.seg[data-dir="t2s"] .thumb { transform: translateX(100%); }
.seg button { position: relative; min-height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; padding: 0 6px; transition: color .2s; letter-spacing: .04em; }
.seg button svg { width: 14px; height: 14px; opacity: .5; transition: opacity .2s; }
.seg button[aria-pressed="true"] { color: var(--accent); }
.seg button[aria-pressed="true"] svg { opacity: 1; }
#swap { flex: 0 0 auto; width: 52px; color: var(--accent); }
#swap svg { width: 20px; height: 20px; transition: transform .35s var(--ease); }
#swap.spin svg { transform: rotate(180deg); }

/* panes */
.cols { display: grid; gap: 10px; }
@media (min-width: 820px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }
.pane { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.pane .bar { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 14px; border-bottom: 1px solid var(--line); min-height: 50px; }
.pane .bar .cap { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.pane .bar .cap .lbl { flex: 0 0 auto; }
.pane .bar .cap .meta { font-weight: 500; letter-spacing: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; min-width: 0; }
.chip { flex: 0 0 auto; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.tbtn { min-width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); font-size: 14px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: 0 0 auto; transition: background .15s, transform .12s var(--ease), color .15s; white-space: nowrap; }
.tbtn:hover { background: var(--paper-2); }
.tbtn:active { transform: scale(.93); background: var(--paper-2); }
.tbtn svg { width: 18px; height: 18px; }
.tbtn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 14px; margin-left: 4px; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 2px 6px -1px rgba(156, 42, 25, .45); }
.tbtn.primary:hover { background: var(--accent-2); }
.tbtn.primary.done { background: var(--ok); }
.tbtn.primary:disabled { opacity: .45; box-shadow: none; cursor: default; }
#src {
  display: block; width: 100%; min-height: 104px; max-height: 50vh; resize: none; border: 0; background: transparent; padding: 12px 16px 10px;
  font-size: 17px; line-height: 1.75; font-family: var(--sans); overflow-wrap: anywhere; color: var(--ink);
}
#src::placeholder { color: var(--muted); opacity: .8; }
#src:focus-visible { outline: none; }
.pane.in:focus-within { border-color: var(--line-strong); box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
body.drag .pane.in { border: 2px dashed var(--accent); }
.drop-hint { position: absolute; inset: 0; display: none; place-items: center; background: color-mix(in srgb, var(--paper) 88%, transparent); color: var(--accent); font-weight: 700; font-size: 16px; z-index: 2; pointer-events: none; }
body.drag .drop-hint { display: grid; }

/* result */
.out-wrap { position: relative; }
#out { padding: 12px 16px 14px; font-size: 17px; line-height: 1.95; min-height: 104px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow-y: auto; overscroll-behavior: contain; }
#out .more { color: var(--muted); font-size: 14px; padding-top: 6px; }
body.bigmode #src { color: var(--muted); font-size: 14px; }
#out .p { min-height: 1lh; }
#out .m { border-radius: 3px; padding: 2px 0; cursor: pointer; white-space: nowrap; background: var(--mark); box-decoration-break: clone; -webkit-box-decoration-break: clone; text-decoration: underline; text-decoration-color: var(--mark-line); text-decoration-thickness: 1.5px; text-underline-offset: 4px; transition: background .15s; }
#out .m:hover { background: color-mix(in srgb, var(--mark-line) 26%, transparent); }
#out .m { margin: 0 1px; }
#out .m.one { background: var(--one); text-decoration-color: var(--one-line); text-decoration-thickness: 1px; }
#out .m.picked { background: var(--accent-soft); text-decoration-style: double; }
#out .m.tw { background: var(--tw); text-decoration-color: var(--tw-line); color: var(--tw-ink); }
#out .m.cus { background: var(--cus); text-decoration-color: var(--cus-line); color: var(--cus-ink); }
#out .m.pick { outline: 2px solid var(--accent); outline-offset: 1px; }
#out .m.flash { animation: flash .6s var(--ease); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 45%, transparent); } 100% { } }
#out.plain .m { background: none; text-decoration: none; color: inherit; padding: 0; margin: 0; }
.out-wrap.busy::after { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 40%; background: var(--accent); animation: busy 1s linear infinite; }
@keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.empty { padding: 18px 16px 20px; text-align: center; }
.empty .ill { width: 64px; height: 48px; margin: 2px auto 8px; color: var(--line-strong); }
.empty p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.empty .acts button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-2); padding: 0 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); transition: transform .12s var(--ease); }
.empty .acts button:active { transform: scale(.95); }
.empty .acts button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.empty .acts svg { width: 17px; height: 17px; }

/* options */
.opts { display: flex; flex-wrap: wrap; gap: 0 14px; padding: 2px 12px; border-top: 1px solid var(--line); background: var(--paper-2); }
.opt { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 14px; user-select: none; -webkit-user-select: none; color: var(--ink-2); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .sw { width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .2s; flex: 0 0 auto; }
.opt .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .22s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.opt input:checked + .sw { background: var(--tw-line); }
.opt input:checked + .sw::after { transform: translateX(16px); }
.opt input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .hint { color: var(--muted); font-size: 12px; }
@media (max-width: 419px) { #opt-tai-wrap .hint { display: none; } }
.legend { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; min-height: 44px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.legend .ks { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding-block: 6px; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--mark); border-bottom: 2px solid var(--mark-line); }
.legend i.one { background: var(--one); border: 1.5px solid var(--one-sw); border-bottom-width: 2px; }
.legend i.tw { background: var(--tw); border-color: var(--tw-line); }
.legend i.cus { background: var(--cus); border-color: var(--cus-line); }
.legend .tip { white-space: nowrap; }
.legend .opt { flex: 0 0 auto; font-size: 12px; gap: 7px; color: var(--muted); }
.legend .opt .sw { width: 34px; height: 20px; }
.legend .opt .sw::after { width: 14px; height: 14px; }
.legend .opt input:checked + .sw::after { transform: translateX(14px); }
.legend .opt input:checked + .sw { background: var(--accent); }

/* custom dictionary */
details.dict { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
details.dict summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
details.dict summary::-webkit-details-marker { display: none; }
details.dict summary .ic { width: 18px; height: 18px; color: var(--cus-line); }
details.dict summary .n { color: var(--muted); font-weight: 500; font-size: 13px; }
details.dict summary .chev { margin-left: auto; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .22s var(--ease); }
details.dict[open] summary .chev { transform: rotate(-135deg); }
.dict-body { padding: 0 14px 14px; }
.dict-body .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.dict-add { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.dict-add input { min-height: 44px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; background: var(--paper-2); font-size: 16px; width: 100%; min-width: 0; }
.dict-add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dict-add .arr { color: var(--muted); }
.dict-row2 { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.dict-row2 .segs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dict-row2 .segs button { min-height: 44px; border: 0; background: transparent; padding: 0 14px; font-size: 13px; color: var(--muted); }
.dict-row2 .segs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.dict-row2 .add { margin-left: auto; min-width: 76px; height: 44px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 16px; transition: transform .12s var(--ease); }
.dict-row2 .add:active { transform: scale(.95); }
.dict-io { display: flex; gap: 8px; margin-top: 8px; }
.dict-io button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.dict-io svg { width: 16px; height: 16px; }
.dict-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.dict-list li { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 0 0 12px; background: var(--paper-2); border-radius: 10px; font-size: 15px; animation: rowin .25s var(--ease); }
@keyframes rowin { from { opacity: 0; transform: translateY(-4px); } }
.dict-list li .w { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dict-list li .w b { font-weight: 600; color: var(--cus-ink); }
.dict-list li .w .a { color: var(--muted); margin: 0 6px; }
.dict-list li .d { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.dict-list li .del { min-width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.dict-list li .del svg { width: 16px; height: 16px; }
.dict-list li .del:hover { color: var(--accent); }
.dict-empty { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

footer.note { color: var(--muted); font-size: 12px; margin: 14px 2px 0; line-height: 1.65; display: flex; gap: 8px; }
footer.note svg { width: 15px; height: 15px; margin-top: 2px; color: var(--ok); }

/* alternatives sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(20, 12, 4, .38); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-radius: 20px 20px 0 0; padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .3s var(--ease); box-shadow: 0 -10px 34px rgba(0,0,0,.2); max-height: 78vh; overflow: auto; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
@media (min-width: 820px) { .sheet { left: 50%; right: auto; width: 460px; transform: translate(-50%, 105%); } .sheet.on { transform: translate(-50%, 0); } }
.sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 10px; }
.sheet h2 { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.sheet h2 i { width: 10px; height: 10px; border-radius: 3px; background: var(--mark); border-bottom: 2px solid var(--mark-line); }
.sheet h2 i.tw { background: var(--tw); border-color: var(--tw-line); }
.sheet h2 i.cus { background: var(--cus); border-color: var(--cus-line); }
.sheet .word { font-family: var(--serif); font-size: 26px; font-weight: 800; color: var(--ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sheet .word .from { font-size: 15px; color: var(--muted); font-family: var(--sans); font-weight: 500; }
.alts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.alts button { min-height: 46px; min-width: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--paper-2); font-size: 19px; font-family: var(--serif); transition: transform .12s var(--ease), background .15s; }
.alts button:active { transform: scale(.94); }
.alts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 800; box-shadow: 0 0 0 1px var(--accent) inset; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row button { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); padding: 0 14px; font-size: 14px; flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sheet .row button svg { width: 16px; height: 16px; }
.sheet .row button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.sheet .tip { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  const stillWorking = () => { if (pending && big !== null) { toast('還在轉換大檔（' + $('out-meta').textContent.replace(/\D+/g, '') + '%），完成後再複製或下載'); return true; } return false; };
  $('copy').addEventListener('click', () => { if (!stillWorking()) copyText(result()); });
  $('save').addEventListener('click', () => {
    if (stillWorking()) return;
    const t = result(); if (!t) { toast('沒有可下載的內容'); return; }
    const name = (fileName || '簡繁轉換') + (dir === 's2t' ? '（繁體）' : '（简体）') + '.txt';
    download(name, fileCRLF ? t.replace(/\r?\n/g, '\r\n') : t);
    toast('已下載 ' + name + (fileCRLF ? '（保留 Windows 換行）' : '')); buzz(10);
  });
  if (navigator.share) {
    $('share').hidden = false;
    $('share').addEventListener('click', async () => {
      const t = result(); if (!t) return;
      try { await navigator.share({ text: t }); } catch (e) { if (e && e.name !== 'AbortError') toast('無法分享，請改用複製'); }
    });
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (!stillWorking()) copyText(result()); }
  });

  /* ---------- alternatives sheet ---------- */
  let lastFocus = null;
  function openSheet(el) {
    const u = unitOf.get(el.parentNode), i = +el.dataset.i, sg = u && u.segs[i]; if (!sg) return;
    picked = { u, i, el }; lastFocus = el;
    out.querySelectorAll('.m.pick').forEach(b => b.classList.remove('pick'));
    el.classList.add('pick');
    const list = ZC.alts(sg, { dir, tai: optTai });
    $('sheet-kind').textContent = sg.k === 2 ? '台灣用語' : sg.k === 3 ? '自訂詞典' : '字形變更';
    $('sheet-dot').className = sg.k === 2 ? 'tw' : sg.k === 3 ? 'cus' : '';
    $('sheet-word').textContent = sg.o;
    $('sheet-from').textContent = '原文：' + sg.s;
    const box = $('sheet-alts'); box.textContent = '';
    for (const v of list) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v; b.setAttribute('aria-pressed', String(v === sg.o));
      b.addEventListener('click', () => choose(v));
      box.appendChild(b);
    }
    $('sheet-tip').textContent = list.length > 1 ? '選的寫法只套用在這一個位置（前後加字、改別行都會跟著它），重新整理後也會記住；要讓所有相同的詞都這樣轉，按「以後都這樣轉」。' : '這個詞沒有其他常見寫法；可以加入自訂詞典改成你要的寫法。';
    $('sheet').classList.add('on'); $('sheet-bg').classList.add('on');
    buzz(6);
    setTimeout(() => { const f = box.querySelector('[aria-pressed="true"]') || $('sheet-close'); f.focus({ preventScroll: true }); }, 60);
  }
  function choose(v) {
    if (!picked) return;
    const u = picked.u, sg = u.segs[picked.i];
    if (sg.def === undefined) sg.def = sg.o;
    const q = addPick(u, picked.i), text = pickText !== null ? pickText : text_();
    if (sg.rec) { const k = picks.indexOf(sg.rec); if (k >= 0) picks.splice(k, 1); if (u.applied) u.applied = u.applied.filter(r => r !== sg.rec); sg.rec = null; }
    if (v === sg.def) sg.picked = false;
    else {
      const r = { d: dir, s: sg.s, v, b: text.slice(Math.max(0, q - CTX), q), a: text.slice(q + sg.s.length, q + sg.s.length + CTX), p: q, ok: true };
      picks.push(r); sg.rec = r; sg.picked = true; (u.applied || (u.applied = [])).push(r);
    }
    // the unit's signature now differs from what render placed, so the next render re-places choices in this line
    u.sig = '\u0000';
    savePicks(true);
    picked.el.classList.toggle('picked', !!sg.picked);
    sg.o = v;
    picked.el.textContent = v; picked.el.title = sg.s + ' → ' + v;
    picked.el.classList.remove('flash'); void picked.el.offsetWidth; picked.el.classList.add('flash');
    $('sheet-word').textContent = v;
    $('sheet-alts').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent === v)));
    buzz(8);
  }
  function closeSheet() {
    $('sheet').classList.remove('on'); $('sheet-bg').classList.remove('on');
    out.querySelectorAll('.m.pick').forEach(b => b.classList.remove('pick'));
    picked = null;
    if (lastFocus && lastFocus.isConnected && document.activeElement && $('sheet').contains(document.activeElement)) lastFocus.focus({ preventScroll: true });
  }
  // a tap that lands just beside a small mark (one character is about 17 px wide) still opens it
  function nearMark(x, y) {
    for (const [dx, dy] of [[0, 0], [0, -9], [0, 9], [-7, 0], [7, 0], [-7, -9], [7, -9], [-7, 9], [7, 9], [-12, 0], [12, 0]]) {
      const el = document.elementFromPoint(x + dx, y + dy); const m = el && el.closest && el.closest('#out .m'); if (m) return m;
    }
    return null;
  }
  out.addEventListener('click', e => {
    if (!optMarks || plain) return;
    const b = e.target.closest('.m') || (getSelection().isCollapsed ? nearMark(e.clientX, e.clientY) : null);
    if (b) openSheet(b);
  });
  out.addEventListener('keydown', e => { const b = e.target.closest && e.target.closest('.m'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSheet(b); } });
  $('sheet-close').addEventListener('click', closeSheet);
  $('sheet-bg').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('on')) closeSheet(); });
  $('sheet-dict').addEventListener('click', () => {
    if (!picked) return; const sg = picked.u.segs[picked.i];
    if (sg.rec) { const k = picks.indexOf(sg.rec); if (k >= 0) { picks.splice(k, 1); savePicks(true); } sg.rec = null; }   // the dictionary now decides this word everywhere
    const s = sg.s, o = sg.o; closeSheet(); addEntry(s, o, dir);
  });

  /* ---------- custom dictionary ---------- */
  function syncDictDir() {
    $('dict-dir-s2t').setAttribute('aria-pressed', String(dictDir === 's2t'));
    $('dict-dir-t2s').setAttribute('aria-pressed', String(dictDir === 't2s'));
  }
  $('dict-dir-s2t').addEventListener('click', () => { dictDir = 's2t'; syncDictDir(); });
  $('dict-dir-t2s').addEventListener('click', () => { dictDir = 't2s'; syncDictDir(); });
  function addEntry(from, to, d) {
    from = ZC.cleanEntry(from || ''); to = ZC.cleanEntry(to || '');
    if (!from) { toast('請先填左邊的「原文」'); $('dict-from').focus(); return false; }
    if (!to) { toast('請填右邊要「轉成」的寫法'); $('dict-to').focus(); return false; }
    if (from === to && d === dir) { /* keeping a word unchanged is a valid entry */ }
    custom = custom.filter(e => !(e.from === from && e.dir === d));
    custom.unshift({ from, to, dir: d });
    if (custom.length > 2000) custom.length = 2000;
    store.set('dict', custom); renderDict(); render(); buzz(10);
    toast('已加入詞典：' + from + ' → ' + to);
    return true;
  }
  const DEL_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
  function renderDict() {
    const ul = $('dict-list'); ul.textContent = '';
    $('dict-n').textContent = custom.length + ' 筆';
    $('dict-empty').hidden = custom.length > 0;
    custom.forEach((e, i) => {
      const li = document.createElement('li');
      const w = document.createElement('span'); w.className = 'w';
      const f = document.createElement('span'); f.textContent = e.from;
      const ar = document.createElement('span'); ar.className = 'a'; ar.textContent = '→';
      const t = document.createElement('b'); t.textContent = e.to || '（刪除）';
      w.append(f, ar, t);
      const d = document.createElement('span'); d.className = 'd'; d.textContent = e.dir === 's2t' ? '簡→繁' : '繁→簡';
      const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.innerHTML = DEL_IC; del.setAttribute('aria-label', '刪除 ' + e.from + ' → ' + e.to);
      del.addEventListener('click', () => {
        const gone = custom.splice(i, 1)[0]; store.set('dict', custom); renderDict(); render();
        toast('已刪除：' + gone.from, { label: '復原', fn: () => { custom.splice(Math.min(i, custom.length), 0, gone); store.set('dict', custom); renderDict(); render(); } });
      });
      li.append(w, d, del); ul.appendChild(li);
    });
  }
  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  $('dict-export').addEventListener('click', () => {
    if (!custom.length) { toast('詞典是空的，先新增幾個詞再匯出'); return; }
    download('簡繁轉換-自訂詞典.txt', ZC.dictText(custom));
    toast('已匯出 ' + custom.length + ' 筆'); buzz(10);
  });
  $('dict-import').addEventListener('click', () => $('dict-file').click());
  $('dict-file').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('詞典檔太大（上限 2 MB）'); return; }
    let text = ''; try { text = decode(await f.arrayBuffer()); } catch (err) { toast('無法讀取這個檔案'); return; }
    const { out, bad } = ZC.parseDict(text);
    if (!out.length) { toast('沒有讀到詞條；每行請寫「原文<Tab>轉成<Tab>簡→繁」'); return; }
    const before = custom.slice(); let added = 0, changed = 0;
    for (const e of out) { const i = custom.findIndex(x => x.from === e.from && x.dir === e.dir); if (i < 0) { custom.push(e); added++; } else if (custom[i].to !== e.to) { custom[i] = e; changed++; } }
    if (custom.length > 2000) custom.length = 2000;
    store.set('dict', custom); renderDict(); render(); buzz(10);
    toast('匯入 ' + added + ' 筆新詞' + (changed ? '、更新 ' + changed + ' 筆' : '') + (bad ? '，略過 ' + bad + ' 行格式不對' : ''), { label: '復原', fn: () => { custom = before; store.set('dict', custom); renderDict(); render(); } });
  });
  $('dict-add').addEventListener('click', () => {
    if (addEntry($('dict-from').value, $('dict-to').value, dictDir)) { $('dict-from').value = ''; $('dict-to').value = ''; $('dict-from').focus(); }
  });
  $('dict-to').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('dict-add').click(); } });
  $('dict-from').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('dict-to').focus(); } });

  /* ---------- go ---------- */
  syncDictDir(); renderDict(); autosize(); render();
  requestAnimationFrame(autosize);
  window.__zc = { result, flush, units: () => units };
})();
</script>
