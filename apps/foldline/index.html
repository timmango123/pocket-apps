/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;

<script>

  { g: ['....r', '.r-7|', '.|.||', '-J.LJ'], s: 3, e: 0, name: '山坡迴旋' },
  { g: ['.....', '..r7.', '--+Jr', '..L-J', '.....'], s: 2, e: 2, name: '十字橋', fold: [[1, 2], [1, 3], [3, 2]] },

  { g: ['---7...', '...|...', '.r-+-7.', '.L-J.|.', '...r-J.', '...L---'], s: 0, e: 5, name: '摺頁終曲', fold: [[0, 3], [2, 1], [3, 3], [4, 3], [5, 3]], lock: [[2, 3], [1, 3]] }

// 第 11–100 關：以固定種子產生（每次載入都一樣），保證有解；難度逐關陡升

LEVELS.forEach((L, i) => { L.src = i; });
{ const ORDER = [83,95,58,10,44,56,32,17,37,31,87,20,12,35,67,98,24,82,23,46,28,75,79,47,70,71,94,76,11,13,96,97,36,78,61,66,29,39,40,41,68,42,27,72,81,88,34,99,59,63,55,89,85,54,30,48,18,38,64,74,91,49,52,90,22,84,14,86,93,45,51,15,16,80,19,25,50,33,21,92,53,43,73,26,77,69,57,65,62,60]; const gen = LEVELS.splice(10); ORDER.forEach(k => LEVELS.push(gen[k - 10])); }

  t.cv = null; t.anim = reduceMotion ? 0 : 1; t.animType = t.kind === 'rot' ? 1 : 2; t.flash = 1.2;
  moves++; hud(); paperSfx(0);
  $('hint').textContent = '提示：已幫你擺好一張紙片（最高兩顆星）';
  const ok = recompute(); drawStaff(); if (ok) { solved = true; timerOn = false; setTimeout(startWalk, 320); } else if (moves >= limit) fail('步數用完了');
}
function undoMove() { // 復原：紙片轉回上一個樣子，並把這一步還給玩家
  if (solved || walking || failed || !undoStack.length) return;
  const u = undoStack.pop(), t = tiles[u.i];
  t.mask = u.mask; t.axis = u.axis; t.cv = null; t.anim = reduceMotion ? 0 : 1; t.animType = t.kind === 'rot' ? 3 : 4;
  moves = Math.max(0, moves - 1); hud(); paperSfx(t.kind === 'fold');
  recompute(); drawStaff();
}
function maskOk(t) { return t.sol === 15 || t.mask === t.sol || ((t.sol === 5 || t.sol === 10) && t.mask === t.sol); }

// ---------- 旅人 ----------
function startWalk() {
  if (!solved || walking) return;
  const L = LEVELS[lvIdx]; const route = [];
  // 入口短路
  route.push({ x: ox - T * 0.27, y: oy + (L.s + 0.5) * T, tile: -1 });
  connected.forEach((seg, i) => {
    const pts = segPts(seg.from, seg.exit, 10);
    pts.forEach((p, j) => { if (j === 0) return; route.push({ x: ox + (seg.t.c + p[0]) * T, y: oy + (seg.t.r + p[1]) * T, tile: i }); });
  });
  route.push({ x: ox + cols * T + T * 0.24, y: oy + (L.e + 0.5) * T, tile: -2 });
  // 累積距離
  let acc = 0; route[0].d = 0;
  for (let i = 1; i < route.length; i++) { acc += Math.hypot(route[i].x - route[i - 1].x, route[i].y - route[i - 1].y); route[i].d = acc; }
  walking = { route, dist: 0, total: acc, lastTile: -1, idx: 0, done: false };
  notesPlayed = 0;
}
function updateWalk(dt) {
  const w = walking; if (!w || w.done) return;
  w.dist += dt * T * (reduceMotion ? 4 : 2.6);
  while (w.idx < w.route.length - 2 && w.route[w.idx + 1].d < w.dist) w.idx++;
  const a = w.route[w.idx], b = w.route[w.idx + 1];
  const tile = b.tile;
  if (tile >= 0 && tile > w.lastTile) {
    w.lastTile = tile; const t = connected[tile].t;
    tone(midiOf(noteFor(t)), 0, 0.7, 0.24); t.flash = 1; notesPlayed = tile + 1; drawStaff();
  }
  if (w.dist >= w.total) { w.done = true; finish(); }
}
function travelerPos() {
  const w = walking; if (!w) return null;
  const a = w.route[w.idx], b = w.route[Math.min(w.idx + 1, w.route.length - 1)];
  const k = b.d > a.d ? Math.min(1, Math.max(0, (w.dist - a.d) / (b.d - a.d))) : 1;
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, dir: Math.sign(b.x - a.x) || 1 };
}
function finish() {
  const L = LEVELS[lvIdx];
  // 終和弦
  const root = midiOf(noteFor(connected[connected.length - 1].t));
  [0, 4, 7, 12].forEach((iv, i) => tone(root - 12 + iv, 0.15 + i * 0.07, 1.6, 0.14, 'sine'));
  let stars = moves <= par + 2 ? 3 : moves <= Math.ceil(par * 1.6) + 3 ? 2 : 1;
  if (hintsUsed) stars = Math.min(stars, 2);
  const prev = best[lvIdx] || 0; if (stars > prev) { best[lvIdx] = stars; store.set('best', best); }
  // 真實進度：只有破了目前最前面那一關才往後解鎖（「解鎖全部」開著時跳關不會改寫）
  if (lvIdx + 1 === unlocked || (!unlockAll && lvIdx + 2 > unlocked)) { unlocked = Math.min(LEVELS.length, lvIdx + 2); store.set('unlocked', unlocked); }
  setTimeout(() => {
    winMode = 'win'; $('replayBtn').textContent = '再聽一次';
    $('winStars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('');
    const last = lvIdx === LEVELS.length - 1;
    $('winT').textContent = last ? '整本摺頁唱完了' : '旋律完成';
    $('winMsg').textContent = `「${L.name}」用了 ${moves} 步（參考解 ${par} 步）` + (timeMax ? `，剩 ${Math.ceil(timeLeft)} 秒` : '') + `，譜出 ${connected.length} 個音。` + (last ? ' 全部關卡完成！' : '');
    $('nextBtn').textContent = last ? '回到第一關' : '下一關';
    $('winOv').hidden = false; $('nextBtn').focus();
  }, 700);
}
function replayMelody() {
  ensureAudio(); if (!ac) return;
  connected.forEach((seg, i) => tone(midiOf(noteFor(seg.t)), i * 0.26, 0.6, 0.22));
  let i = 0; const tick = () => { notesPlayed = ++i; drawStaff(); if (i < connected.length) setTimeout(tick, 260); };
  notesPlayed = 0; tick();
}

// ---------- 五線譜 ----------
function drawStaff() {
  const c = sctx, w = staff.width, h = staff.height, d = DPR;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
  c.scale(d, d); const W2 = w / d, gap = 9, top = 18;
  c.strokeStyle = 'rgba(31,53,80,.45)'; c.lineWidth = 1;
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(6, top + i * gap + .5); c.lineTo(W2 - 6, top + i * gap + .5); c.stroke(); }
  c.fillStyle = 'rgba(31,53,80,.75)'; c.font = '40px serif'; c.textBaseline = 'alphabetic'; c.fillText('𝄞', 6, top + 4 * gap + 8);
  // 所有路徑音（以解答為準顯示虛影，接通的部分實心）
  const L = LEVELS[lvIdx];
  const total = Math.max(connected.length, tiles.filter(t => t.path).length);
  const x0 = 44, step = Math.min(30, (W2 - x0 - 12) / Math.max(1, total));
  for (let i = 0; i < total; i++) {
    const x = x0 + step * (i + 0.5);
    if (i < connected.length) {
      const idx = noteFor(connected[i].t), m = midiOf(idx);
      const pos = staffPos(m), y = top + 4 * gap - pos * gap / 2 + 9;
      const playing = walking || solved ? i < notesPlayed : true;
      c.fillStyle = (solved && i < notesPlayed) ? '#c8506a' : playing ? 'rgba(31,53,80,.85)' : 'rgba(31,53,80,.3)';
      if (!solved) c.fillStyle = 'rgba(63,127,166,.85)';
      // 加線
      c.strokeStyle = 'rgba(31,53,80,.45)';
      for (let p = -2; p >= pos - 1 && p >= -8; p -= 2) { const yy = top + 4 * gap - p * gap / 2 + 9; c.beginPath(); c.moveTo(x - 7, yy); c.lineTo(x + 7, yy); c.stroke(); }
      for (let p = 10; p <= pos && p < 20; p += 2) { const yy = top + 4 * gap - p * gap / 2 + 9; c.beginPath(); c.moveTo(x - 7, yy); c.lineTo(x + 7, yy); c.stroke(); }
      const nk = Math.min(1, step / 13); c.beginPath(); c.ellipse(x, y, 5.2 * nk, 4 * nk, -0.35, 0, 7); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = 1.3; c.beginPath();
      if (pos < 4) { c.moveTo(x + 4.6 * nk, y - 1); c.lineTo(x + 4.6 * nk, y - 24 * nk); } else { c.moveTo(x - 4.6 * nk, y + 1); c.lineTo(x - 4.6 * nk, y + 24 * nk); }
      c.stroke(); c.lineWidth = 1;
    } else {
      c.fillStyle = 'rgba(31,53,80,.14)'; c.beginPath(); c.arc(x, top + 2 * gap, 2.4, 0, 7); c.fill();
    }
  }
}
function staffPos(m) { // E4 = 0（第一線），以白鍵算位置
  const pcs = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
  const oct = Math.floor(m / 12) - 1, step = oct * 7 + pcs[m % 12];
  return step - (4 * 7 + 2);
}

// ---------- 繪製 ----------
let last = performance.now(), running = true, time = 0, rafId = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  for (const t of tiles) { if (t.anim > 0) t.anim = Math.max(0, t.anim - dt * 5.5); if (t.flash > 0) t.flash = Math.max(0, t.flash - dt * 1.6); }
  if (walking) updateWalk(dt);
  if (timerOn && !solved && !failed && $('menuOv').hidden && $('winOv').hidden) {
    const before = Math.ceil(timeLeft); timeLeft -= dt;
    if (Math.ceil(timeLeft) !== before) hud();
    if (timeLeft <= 0) fail('時間到了');
  }
  draw();
  rafId = requestAnimationFrame(frame);
}
function draw() {
  const c = bctx, L = LEVELS[lvIdx];
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, bw, bh);
  // 紙張陰影
  c.fillStyle = 'rgba(31,53,80,.10)'; c.fillRect(ox + 3, oy + 5, cols * T, rows * T);
  // 入口與出口的小路
  const sy = oy + (L.s + .5) * T, ey = oy + (L.e + .5) * T;
  c.lineCap = 'round'; c.strokeStyle = 'rgba(63,127,166,.35)'; c.lineWidth = T * 0.28;
  c.beginPath(); c.moveTo(ox - T * .4, sy); c.lineTo(ox, sy); c.stroke();
  c.strokeStyle = solved ? 'rgba(200,80,106,.4)' : 'rgba(63,127,166,.35)';
  c.beginPath(); c.moveTo(ox + cols * T, ey); c.lineTo(ox + cols * T + T * .4, ey); c.stroke();
  drawFlag(c, ox - T * .3, sy, T);
  drawHouse(c, ox + cols * T + T * .19, ey, T);
  // 紙片
  for (const t of tiles) {
    if (!t.cv) t.cv = tileCanvas(t);
    const x = ox + t.c * T, y = oy + t.r * T;
    c.save(); c.translate(x + T / 2, y + T / 2);
    const e = t.anim * t.anim * (3 - 2 * t.anim);
    if (t.anim > 0 && t.animType === 1) c.rotate(-e * Math.PI / 2);
    if (t.anim > 0 && t.animType === 3) c.rotate(e * Math.PI / 2);
    let shade = 0;
    if (t.anim > 0 && (t.animType === 2 || t.animType === 4)) { const s = 1 - 2 * e; const axis = t.animType === 4 ? t.axis : t.axis ^ 1; if (axis === 0) c.scale(s, 1); else c.scale(1, s); shade = 1 - Math.abs(s); }
    if (t.flash > 0 && t.kind === 'lock') c.translate(Math.sin(time * 60) * 2 * t.flash, 0);
    c.drawImage(t.cv, -T / 2, -T / 2, T, T);
    if (shade > 0) { c.fillStyle = `rgba(31,53,80,${shade * .35})`; c.fillRect(-T / 2, -T / 2, T, T); }
    c.restore();
  }
  // 接通的路：玫瑰金水彩覆色
  if (connected.length) {
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = solved ? 'rgba(200,80,106,.42)' : 'rgba(217,164,58,.40)'; c.lineWidth = T * 0.16;
    c.beginPath(); c.moveTo(ox - T * .4, sy);
    for (const seg of connected) { if (seg.t.anim > 0) break; const pts = segPts(seg.from, seg.exit, 8); for (const p of pts) c.lineTo(ox + (seg.t.c + p[0]) * T, oy + (seg.t.r + p[1]) * T); }
    c.stroke(); c.restore();
  }
  // 閃光（音符觸發）
  for (const t of tiles) if (t.flash > 0 && t.kind !== 'lock') {
    const x = ox + (t.c + .5) * T, y = oy + (t.r + .5) * T;
    c.fillStyle = `rgba(200,80,106,${t.flash * 0.18})`; c.beginPath(); c.arc(x, y, T * (0.6 - t.flash * 0.2), 0, 7); c.fill();
  }
  // 鍵盤游標
  if (kbUsed && cursor && document.activeElement === board) {
    c.strokeStyle = '#c8506a'; c.lineWidth = 3; c.setLineDash([6, 4]);
    c.strokeRect(ox + cursor.c * T + 3, oy + cursor.r * T + 3, T - 6, T - 6); c.setLineDash([]);
  }
  // 小旅人
  const p = walking ? travelerPos() : { x: ox - T * 0.27, y: sy, dir: 1 };
  drawTraveler(c, p.x, p.y, T, p.dir, !!walking && !walking.done);
}
function drawFlag(c, x, y, T) {
  c.strokeStyle = '#1f3550'; c.lineWidth = Math.max(1.5, T * .035);
  c.beginPath(); c.moveTo(x, y - T * .05); c.lineTo(x, y - T * .48); c.stroke();
  c.fillStyle = 'rgba(200,80,106,.85)'; c.beginPath(); c.moveTo(x, y - T * .48); c.lineTo(x + T * .22, y - T * .4); c.lineTo(x, y - T * .32); c.fill();
}
function drawHouse(c, x, y, T) {
  const s = T * .3;
  c.fillStyle = 'rgba(217,164,58,.75)'; c.fillRect(x - s * .5, y - s * .55, s, s * .8);
  c.fillStyle = 'rgba(200,80,106,.85)'; c.beginPath(); c.moveTo(x - s * .7, y - s * .5); c.lineTo(x, y - s * 1.2); c.lineTo(x + s * .7, y - s * .5); c.fill();
  c.fillStyle = '#1f3550'; c.fillRect(x - s * .12, y - s * .1, s * .24, s * .35);
}
function drawTraveler(c, x, y, T, dir, moving) {
  const bob = moving && !reduceMotion ? Math.abs(Math.sin(time * 12)) * T * .05 : 0, s = T * .17;
  c.save(); c.translate(x, y - bob);
  c.fillStyle = 'rgba(31,53,80,.18)'; c.beginPath(); c.ellipse(0, s * .9 + bob, s * .9, s * .3, 0, 0, 7); c.fill();
  c.fillStyle = '#1f3550'; c.beginPath(); c.ellipse(0, 0, s * .7, s * .95, 0, 0, 7); c.fill();
  c.fillStyle = '#f6f5f0'; c.beginPath(); c.arc(dir * s * .15, -s * .55, s * .55, 0, 7); c.fill();
  c.fillStyle = '#1f3550'; c.beginPath(); c.arc(dir * s * .32, -s * .6, s * .09, 0, 7); c.fill();
  c.fillStyle = '#c8506a'; c.fillRect(-s * .7, -s * .1, s * 1.4, s * .25); c.fillRect(-dir * s * .7, -s * .1, -dir * s * .45, s * .5);
  c.fillStyle = '#d9a43a'; c.beginPath(); c.moveTo(-s * .6, -s * .9); c.lineTo(dir * s * .2, -s * 1.6); c.lineTo(s * .7, -s * .9); c.fill();
  c.restore();
}

// ---------- UI ----------
let menuPage = 0; const PER = 20;
function buildMenu() {
  const box = $('levels'); box.innerHTML = '';
  const pages = Math.ceil(LEVELS.length / PER);
  $('pageLbl').textContent = `${menuPage * PER + 1}–${Math.min(LEVELS.length, (menuPage + 1) * PER)}`;
  $('prevPage').disabled = menuPage === 0; $('nextPage').disabled = menuPage >= pages - 1;
  const total = Object.values(best).reduce((a, b) => a + b, 0);
  $('starTotal').textContent = `已解鎖 ${unlocked} / ${LEVELS.length} 關．共 ${total} 顆星`;
  $('allSw').setAttribute('aria-checked', String(unlockAll));
  for (let i = menuPage * PER; i < Math.min(LEVELS.length, (menuPage + 1) * PER); i++) {
    const L = LEVELS[i], b = document.createElement('button'); const st = best[i] || 0;
    const locked = !unlockAll && i >= unlocked;
    b.innerHTML = `${i + 1}<small>${locked ? '鎖' : '★'.repeat(st) + '<i>' + '★'.repeat(3 - st) + '</i>'}</small><em>難 ${L.diff}</em>`;
    b.setAttribute('aria-label', locked ? `第 ${i + 1} 關，難度 ${L.diff}，尚未解鎖` : `第 ${i + 1} 關 ${L.name}，難度 ${L.diff}，${st} 顆星`);
    if (locked) b.disabled = true; if (i === lvIdx) b.classList.add('cur');
    b.onclick = () => { $('menuOv').hidden = true; loadLevel(i); board.focus(); };
    box.appendChild(b);
  }
}
$('allSw').onclick = () => { unlockAll = !unlockAll; store.set('unlockAll', unlockAll); buildMenu(); };
$('prevPage').onclick = () => { menuPage = Math.max(0, menuPage - 1); buildMenu(); };
$('nextPage').onclick = () => { menuPage = Math.min(Math.ceil(LEVELS.length / PER) - 1, menuPage + 1); buildMenu(); };
$('menuBtn').onclick = () => { menuPage = Math.floor(lvIdx / PER); buildMenu(); $('menuOv').hidden = false; $('closeMenu').focus(); };
$('closeMenu').onclick = () => { $('menuOv').hidden = true; };
$('resetBtn').onclick = () => { ensureAudio(); $('winOv').hidden = true; loadLevel(lvIdx); };
$('hintBtn').onclick = useHint;
$('undoBtn').onclick = undoMove;
$('playBtn').onclick = () => { if (connected.length) replayMelody(); };
$('replayBtn').onclick = () => { if (winMode === 'fail') { $('winOv').hidden = true; $('menuBtn').click(); } else replayMelody(); };
$('nextBtn').onclick = () => { $('winOv').hidden = true; loadLevel(winMode === 'fail' ? lvIdx : (lvIdx + 1) % LEVELS.length); board.focus(); };
function setMute() { $('muteBtn').textContent = muted ? '✕' : '♪'; $('muteBtn').setAttribute('aria-pressed', String(muted)); if (master) master.gain.value = muted ? 0 : 0.5; }
$('muteBtn').onclick = () => { muted = !muted; store.set('muted', muted); ensureAudio(); setMute(); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { $('menuOv').hidden = true; } });
setMute();

let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; cancelAnimationFrame(rafId); if (ac) ac.suspend(); }
  else { running = true; last = performance.now(); if (ac && !muted) ac.resume(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); }
});

// 公開給測試
window.__foldline = { act, needTaps, geom: () => ({ T, ox, oy }), info: () => ({ par, limit, timeMax, failed, hints: LEVELS[lvIdx].hints, diff: LEVELS[lvIdx].diff }), state: () => ({ lvIdx, moves, solved, failed, connected: connected.length, walking: !!walking, tiles: tiles.length }), load: loadLevel, levels: LEVELS, trace, tiles: () => tiles, CH, solveAll: () => { tiles.forEach(t => { t.mask = t.sol; t.cv = null; }); return recompute(); } };

loadLevel(Math.min(store.get('last', 0), unlockAll ? LEVELS.length - 1 : unlocked - 1, LEVELS.length - 1));
rafId = requestAnimationFrame(frame);
})();
</script>
