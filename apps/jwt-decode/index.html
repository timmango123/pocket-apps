<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>JWT 與網址解析</title>
<style>
/* Inspection bench: cool graph paper, one ink colour per token part (header vermilion, payload violet, signature teal) */
:root{
  --bg:#e8ecf1; --paper:#fbfcfe; --sunk:#f1f4f8; --ink:#111821; --ink2:#36404d; --muted:#586374; --faint:#848e9c;
  --line:#d5dce5; --line2:#bac4d0; --grid:rgba(38,72,120,.055);
  --hd:#c2382a; --pl:#7a3dc4; --sg:#0a7a88; --x1:#a36400; --x2:#2c5cc0; --x3:#5b6675;
  --hd-soft:#fbe5e1; --pl-soft:#efe6fb; --sg-soft:#d9eff1; --x1-soft:#f7ead0; --x2-soft:#e1e9f9;
  --ok:#157346; --ok-soft:#dbf0e4; --bad:#b3241a; --bad-soft:#fce3df; --warn:#875400; --warn-soft:#faedd3; --info:#36588a; --info-soft:#e4ebf5;
  --jk:#24529c; --js:#2b6a1d; --jn:#b04500; --jb:#7a3dc4; --jz:#6a7380;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(20,40,70,.06),0 10px 26px -14px rgba(20,40,70,.22);
  --pop:0 18px 50px -12px rgba(10,20,40,.4);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
  --fs:14px; --lh:22px; color-scheme:light;
}
@media (pointer:coarse){:root{--fs:16px;--lh:24px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --paper:#141a22; --sunk:#10151c; --ink:#e5eaf0; --ink2:#c2cad4; --muted:#97a2b0; --faint:#6c7786;
  --line:#222a35; --line2:#313b48; --grid:rgba(140,170,220,.045);
  --hd:#ff8a7a; --pl:#c6a0ff; --sg:#4fd0dc; --x1:#f0b54c; --x2:#88a9ff; --x3:#a3adba;
  --hd-soft:#3a1c18; --pl-soft:#291f3c; --sg-soft:#0f2f37; --x1-soft:#33270f; --x2-soft:#18233d;
  --ok:#6fd59b; --ok-soft:#112f1f; --bad:#ff8f85; --bad-soft:#3a1715; --warn:#f1bf62; --warn-soft:#33270f; --info:#9fbbe8; --info-soft:#18233a;
  --jk:#8fb5ff; --js:#a7d98a; --jn:#ffab70; --jb:#c6a0ff; --jz:#9aa3ad;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.75);
  --pop:0 18px 50px -10px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --paper:#141a22; --sunk:#10151c; --ink:#e5eaf0; --ink2:#c2cad4; --muted:#97a2b0; --faint:#6c7786;
  --line:#222a35; --line2:#313b48; --grid:rgba(140,170,220,.045);
  --hd:#ff8a7a; --pl:#c6a0ff; --sg:#4fd0dc; --x1:#f0b54c; --x2:#88a9ff; --x3:#a3adba;
  --hd-soft:#3a1c18; --pl-soft:#291f3c; --sg-soft:#0f2f37; --x1-soft:#33270f; --x2-soft:#18233d;
  --ok:#6fd59b; --ok-soft:#112f1f; --bad:#ff8f85; --bad-soft:#3a1715; --warn:#f1bf62; --warn-soft:#33270f; --info:#9fbbe8; --info-soft:#18233a;
  --jk:#8fb5ff; --js:#a7d98a; --jn:#ffab70; --jb:#c6a0ff; --jz:#9aa3ad;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.75);
  --pop:0 18px 50px -10px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding:0 max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block;flex:none}
.wrap{max-width:1180px;margin:0 auto}
code,.mono{font-family:var(--mono)}
/* header */
.top{display:flex;align-items:center;gap:10px;min-height:60px}
.mark{width:36px;height:36px;flex:none;border-radius:10px;background:#141b25;outline:1px solid var(--line2);outline-offset:-1px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.07)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:19px;font-weight:780;letter-spacing:.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font:600 11px/1.35 var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small i{font-style:normal;font-weight:700}
.title .h{color:var(--hd)} .title .p{color:var(--pl)} .title .s{color:var(--sg)}
.ib{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
.ib svg{width:21px;height:21px}
.ib:active{transform:scale(.94)}
@media (hover:hover){.ib:hover,.tb:hover{border-color:var(--line2);color:var(--ink)}}
/* crumb */
.crumb{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:4px 4px 4px 4px;border-radius:12px;background:var(--paper);border:1px dashed var(--line2);min-width:0}
.crumb button{min-height:44px;display:flex;align-items:center;gap:6px;border:0;background:var(--sunk);border-radius:9px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer;flex:none;color:var(--ink)}
.crumb button svg{width:18px;height:18px}
.crumb span{font:12.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* layout */
.main{display:flex;flex-direction:column;gap:14px}
.col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}
@media (min-width:900px){
  .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:16px}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .ed textarea,.ed .hl{max-height:none}
}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;scroll-margin-top:12px}
.chead{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.chead h2{margin:0;font-size:15.5px;font-weight:760;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.chead .dot{width:10px;height:10px;border-radius:3px;flex:none}
.chead .meta{font:12px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chead .sp{flex:1}
.tb{width:44px;height:44px;flex:none;border:1px solid transparent;background:transparent;border-radius:11px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:background .15s,transform .12s}
.tb svg{width:20px;height:20px}
.tb:active{transform:scale(.92);background:var(--sunk)}
.tb.lab{width:auto;display:flex;gap:6px;padding:0 12px;font-weight:700;font-size:14px}
.tb.done{color:var(--ok)}
.chip{font:700 11.5px/1 var(--sans);letter-spacing:.04em;padding:5px 8px;border-radius:7px;background:var(--x1-soft);color:var(--x1);white-space:nowrap}
.kind{font:700 12px/1 var(--mono);padding:6px 8px;border-radius:7px;background:var(--sunk);color:var(--ink2);white-space:nowrap;border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;min-width:0}
.kind.jwt{background:var(--pl-soft);color:var(--pl);border-color:transparent}
.kind.jwe{background:var(--x1-soft);color:var(--x1);border-color:transparent}
.kind.url{background:var(--x2-soft);color:var(--x2);border-color:transparent}
.kind.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
/* editor with colour overlay */
.ed{position:relative;background:var(--sunk)}
.ed textarea,.ed .hl{margin:0;border:0;padding:12px 14px;font:var(--fs)/var(--lh) var(--mono);white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;tab-size:2;letter-spacing:0}
.ed textarea{position:relative;z-index:1;display:block;width:100%;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none;min-height:calc(var(--lh) * 3 + 24px);max-height:clamp(120px,32vh,340px);overflow-y:auto;scrollbar-width:none}
.ed textarea::-webkit-scrollbar{display:none}
.ed textarea::placeholder{color:var(--faint)}
.ed textarea::selection{background:color-mix(in srgb,var(--x2) 30%,transparent);color:transparent}
.ed .hl{position:absolute;inset:0;overflow:hidden;color:var(--ink2);pointer-events:none}
.ed .hl code{display:block;font:inherit}
.ed.focus{box-shadow:inset 0 0 0 2px var(--x2)}
.ed.plain textarea{color:var(--ink)} .ed.plain .hl{display:none}
.ed .more{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(transparent,var(--sunk));pointer-events:none;z-index:2;opacity:0;transition:opacity .2s}
.ed .more.on{opacity:1}
.hl .h{color:var(--hd)} .hl .p{color:var(--pl)} .hl .s{color:var(--sg)} .hl .k{color:var(--x1)} .hl .v{color:var(--x2)}
.hl .dt{color:var(--ink);font-weight:800} .hl .dim{color:var(--faint)}
.hl .u-sc{color:var(--x3)} .hl .u-us{color:var(--x1)} .hl .u-ho{color:var(--hd)} .hl .u-po{color:var(--x1)} .hl .u-pa{color:var(--x2)} .hl .u-qu{color:var(--pl)} .hl .u-fr{color:var(--sg)}
.hl .u-qk{color:var(--pl);font-weight:700}
.hl mark{background:color-mix(in srgb,var(--x1) 28%,transparent);color:inherit;border-radius:2px}
.hl .flash{animation:flash .8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--pl) 30%,transparent)}to{background:transparent}}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line);align-items:center}
.lg{flex:1 1 0;justify-content:center;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;min-width:0;border-radius:11px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink)}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg small{font:11.5px var(--mono);color:var(--faint)}
.lg.wide{flex-basis:100%}
.lg:active{transform:scale(.97)}
.lnote{flex-basis:100%;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.lnote svg{width:15px;height:15px;margin-top:2px;color:var(--ok)}
/* verdict */
.verdict{display:flex;flex-direction:column;gap:10px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:11px 12px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.tile .th{display:flex;align-items:center;gap:8px;min-width:0}
.tile .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.tile .ic svg{width:16px;height:16px}
.tile b{display:block;font-size:16.5px;font-weight:780;line-height:1.3;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile>span{display:block;font-size:13px;color:var(--muted);line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.tile.ok{background:var(--ok-soft);border-color:transparent}.tile.ok .ic{background:var(--ok);color:var(--paper)}.tile.ok b{color:var(--ok)}
.tile.bad{background:var(--bad-soft);border-color:transparent}.tile.bad .ic{background:var(--bad);color:var(--paper)}.tile.bad b{color:var(--bad)}
.tile.warn{background:var(--warn-soft);border-color:transparent}.tile.warn .ic{background:var(--warn);color:var(--paper)}.tile.warn b{color:var(--warn)}
.tile.lock{background:var(--x1-soft);border-color:transparent}.tile.lock .ic{background:var(--x1);color:var(--paper)}.tile.lock b{color:var(--x1)}
.tile.pend .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tile.pop{animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.tile button.tilebtn{all:unset;position:absolute;inset:0;cursor:pointer;border-radius:14px}
.tile button.tilebtn:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.issues{list-style:none;margin:0;padding:4px 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.issues li{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.issues li+li{border-top:1px dashed var(--line)}
.issues li svg{width:17px;height:17px;margin-top:2px}
.issues .bad svg{color:var(--bad)} .issues .warn svg{color:var(--warn)} .issues .info svg{color:var(--info)}
.issues .bad{color:var(--ink)} .issues .bad b{color:var(--bad)}
.errcard{padding:16px;border-radius:16px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.errcard h3{margin:0 0 6px;font-size:16px;color:var(--bad);display:flex;gap:8px;align-items:center}
.errcard h3 svg{width:20px;height:20px}
.errcard p{margin:0;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.errcard ul{margin:10px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink2)}
/* guide (empty / unknown) */
.guide{padding:18px 16px}
.guide h3{margin:0 0 4px;font-size:17px}
.guide p{margin:0 0 12px;color:var(--muted);font-size:14px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0 0 14px;padding:0;list-style:none}
.gl li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:13.5px;line-height:1.45}
.gl li b{display:block;font-size:14px}
.gl li code{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.gl li i{width:8px;height:8px;border-radius:3px;margin-top:6px;flex:none}
.gbtns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--paper);font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:active{transform:scale(.97)}
/* rows (claims, structure) */
.rows{padding:2px 0}
.row{display:grid;grid-template-columns:minmax(78px,30%) minmax(0,1fr);gap:4px 12px;padding:10px 14px;align-items:start;cursor:pointer;position:relative;transition:background .15s;min-height:44px;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.row+.row{border-top:1px solid var(--line)}
.row:active,.row.copied{background:var(--sunk)}
.row .lb{min-width:0}
.row .lb b{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.35}
.row .lb code{display:block;font-size:12px;color:var(--faint);overflow-wrap:anywhere;line-height:1.35;margin-top:1px}
.row .lb i{display:inline-block;width:8px;height:8px;border-radius:2.5px;margin-right:6px;vertical-align:1px}
.row .val{min-width:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}
.row .val.m{font-family:var(--mono);font-size:14px}
.row .val small{word-break:break-all;display:block;}
.row .val small .nw{white-space:nowrap}
.row .val small{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.row .val .alt{display:block;font:13px var(--mono);color:var(--muted);margin-top:3px}
.row .val .seg{display:inline-block;font:12.5px var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:3px 4px 0 0}
.pill{word-break:keep-all;text-wrap:balance;display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;border-radius:999px;font:700 12.5px/1.35 var(--sans);background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill svg{width:13px;height:13px}
.rowsub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.cpy{position:absolute;right:10px;top:10px;font:700 11.5px var(--sans);color:var(--ok);opacity:0;transition:opacity .2s;background:var(--paper);padding:2px 6px;border-radius:6px;pointer-events:none}
.row.copied .cpy{opacity:1}
.sub-h{padding:12px 14px 4px;font-size:12px;font-weight:750;color:var(--faint);letter-spacing:.08em}
/* JSON */
.json{margin:0;padding:12px 14px 14px;font:13.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;background:var(--sunk);max-height:520px;overflow:auto}
@media (pointer:coarse){.json{font-size:14px}}
.jk{color:var(--jk)} .js{color:var(--js)} .jn{color:var(--jn)} .jb{color:var(--jb)} .jz{color:var(--jz)}
.algline{padding:10px 14px;font-size:14px;line-height:1.5;border-bottom:1px solid var(--line)}
.algline b{font-family:var(--mono);font-size:14.5px}
.algline span{color:var(--muted)}
/* verify */
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.fl{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.fl em{font-style:normal;font-weight:500;color:var(--faint)}
.irow{display:flex;gap:6px;align-items:stretch}
.inp{flex:1;min-width:0;min-height:46px;border:1px solid var(--line2);background:var(--sunk);border-radius:11px;padding:10px 12px;font:14px var(--mono);outline:none}
.inp:focus{border-color:var(--sg);box-shadow:0 0 0 3px color-mix(in srgb,var(--sg) 22%,transparent)}
textarea.inp{resize:vertical;min-height:110px;max-height:240px;line-height:1.45;white-space:pre-wrap;word-break:break-all;overflow:auto}
.inp.masked{-webkit-text-security:disc}
.irow .tb{border:1px solid var(--line2);background:var(--paper);height:auto;min-height:46px}
.segc{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--sunk);max-width:100%}
.segc button{min-height:44px;min-width:58px;padding:0 12px;border:0;background:transparent;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.segc button+button{border-left:1px solid var(--line2)}
.segc button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 -3px 0 var(--sg)}
.vres{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);font-size:14px;line-height:1.5}
.vres svg{width:20px;height:20px;margin-top:1px}
.vres.ok{background:var(--ok-soft)} .vres.ok svg,.vres.ok b{color:var(--ok)}
.vres.bad{background:var(--bad-soft)} .vres.bad svg,.vres.bad b{color:var(--bad)}
.vres.error{background:var(--warn-soft)} .vres.error svg,.vres.error b{color:var(--warn)}
.vres ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}
.vres .btn{margin-top:8px;min-height:44px;font-size:13.5px}
.vbtns{display:flex;flex-wrap:wrap;gap:8px}

let toastT;
function toast(msg, action, fn, ms) {
  const h = $('toastHost'); h.innerHTML = '';
  const d = document.createElement('div'); d.className = 'toast' + (action ? '' : ' solo');
  const sp = document.createElement('span'); sp.textContent = msg; d.appendChild(sp);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action; b.onclick = () => { h.innerHTML = ''; fn(); }; d.appendChild(b); }
  h.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ''; }, ms || (action ? 5000 : 2000));
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) { /* no haptics */ } };
async function copyText(text) {

  try {
    const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0;height:1px';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  } catch (e) { return false; }
}
async function doCopy(text, what, el) {

}

  const si = b64j(header) + '.' + b64j(payload);

  const k = await subtle.importKey('raw', J.te.encode(key), { name: 'HMAC', hash: 'SHA-' + header.alg.slice(2) }, false, ['sign']);

/* ---------- editor overlay ---------- */
const BIG = 100000; // above this the coloured mirror is skipped so layout never blocks the page
function autosize() {
  if (ta.value.length > BIG) { ta.style.height = '340px'; $('more').classList.add('on'); return; }
  ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; moreHint();
}
function syncScroll() { if (ta.value.length > BIG) return; hlc.style.transform = `translateY(${-ta.scrollTop}px)`; moreHint(); }
function moreHint() { if (ta.value.length > BIG) return; $('more').classList.toggle('on', ta.scrollHeight - ta.clientHeight - ta.scrollTop > 4); }
ta.addEventListener('scroll', syncScroll, { passive: true });
ta.addEventListener('focus', () => $('ed').classList.add('focus'));
ta.addEventListener('blur', () => $('ed').classList.remove('focus'));
// colours the text behind the box; skipped for very long text, and per-key colours only up to 2000 parameters
function paintOverlay(flash) {
  const t = ta.value;
  $('ed').classList.toggle('plain', hugeText != null || t.length > BIG);
  if (hugeText != null || t.length > BIG) { hlc.textContent = ''; return; }
  const cls = new Array(t.length).fill('');
  const fill = (a, b, c) => { for (let k = Math.max(0, a); k < Math.min(b, t.length); k++) cls[k] = c; };
  if (det.kind === 'jwt' && det.start >= 0) {
    fill(0, t.length, 'dim');
    const names = an && an.kind === 'jwe' ? ['h', 'k', 'v', 'p', 's'] : ['h', 'p', 's'];
    let part = 0;
    for (let k = det.start; k < det.end; k++) { const c = t[k]; if (c === '.') { cls[k] = 'dt'; part++; } else cls[k] = /\s/.test(c) ? '' : (names[part] || 'dim'); }
  } else if (det.kind === 'url' && url) {
    const o = det.start, f = url.off;
    if (f.scheme) fill(o + f.scheme[0], o + f.scheme[1], 'u-sc');
    if (url.host != null && f.scheme && t.slice(o + f.scheme[1], o + f.scheme[1] + 2) === '//') fill(o + f.scheme[1], o + f.scheme[1] + 2, 'u-sc');
    if (f.user) fill(o + f.user[0], o + f.user[1], 'u-us');
    if (f.host) fill(o + f.host[0], o + f.host[1], 'u-ho');
    if (f.port) fill(o + f.port[0], o + f.port[1], 'u-po');
    if (f.path) fill(o + f.path[0], o + f.path[1], 'u-pa');
    if (f.query) { fill(o + f.query[0], o + f.query[1], 'u-qu'); if (url.params.length <= 2000) url.params.forEach(p => { if (!p.empty) fill(o + p.start, o + p.start + p.rawK.length, 'u-qk'); }); }
    if (f.fragment) { fill(o + f.fragment[0], o + f.fragment[1], 'u-fr'); if ((url.fragParams || []).length <= 2000) (url.fragParams || []).forEach(p => { if (!p.empty) fill(o + p.start, o + p.start + p.rawK.length, 'u-qk'); }); }
  }
  let html = '', k = 0;
  while (k < t.length) {
    const c = cls[k]; let e = k + 1; while (e < t.length && cls[e] === c) e++;
    const seg = esc(t.slice(k, e));
    html += c ? `<span class="${c}">${seg}</span>` : seg; k = e;
  }
  if (flash) html = `<span class="flash">${html}</span>`;
  hlc.innerHTML = html + '\n';
}

/* ---------- analysis + render ---------- */
function update(full) {
  const text = srcText();
  det = J.detect(text);
  an = det.kind === 'jwt' ? J.analyzeJWT(det.token) : null;
  url = det.kind === 'url' ? J.parseURL(text.slice(det.start, det.end), det.queryOnly) : null;
  tstat = an && !an.error && an.kind === 'jws' ? J.timeStatus(an, nowSec()) : null;
  $('sampleChip').hidden = !isSample;
  paintOverlay(false); paintKind(); paintLegend(); paintCrumb();
  if (full) { qRows = url ? url.params.map(p => ({ ...p })) : null; fRows = url && url.fragParams ? url.fragParams.map(p => ({ ...p })) : null; }
  if (!an || det.token !== lastTok) vres = null;
  lastTok = det.kind === 'jwt' ? det.token : null;
  paintVerdict();
  if (full) paintView();
  runVerify();
}
function paintKind() {
  const k = $('kindTag'); let t = '', c = '';
  if (det.kind === 'jwt') { if (an.error) { t = 'JWT · 格式錯誤'; c = 'bad'; } else if (an.kind === 'jwe') { t = 'JWE · ' + (an.header.obj.enc || '加密'); c = 'jwe'; } else { t = 'JWT · ' + (an.alg || '無 alg'); c = 'jwt'; } }
  else if (det.kind === 'url') { t = url.queryOnly ? '查詢字串' : url.scheme ? '網址 · ' + url.scheme.toLowerCase() : url.host != null ? '網址' : '相對網址'; c = 'url'; }
  else if (det.kind === 'unknown') { t = '無法辨識'; c = 'bad'; }
  k.hidden = !t; k.textContent = t; k.className = 'kind ' + c;
}
function paintCrumb() {
  $('crumb').hidden = !stack.length;
  if (stack.length) { const top = stack[stack.length - 1]; $('crumbTxt').textContent = short(top.label || top.text, 80); }
}
function paintLegend() {
  const L = $('legend'); let h = '';

  if (det.kind === 'jwt' && an && !an.error) {
    if (an.kind === 'jws') {
      h += chip('--hd', '標頭', bytesLabel(an.header.bytes.length), 'sec-head') + chip('--pl', '內容', bytesLabel(an.payload.bytes.length), 'sec-claims') + chip('--sg', '簽章', bytesLabel(an.sig.bytes.length), 'sec-sig');
    } else h += chip('--hd', '標頭', bytesLabel(an.header.bytes.length), 'sec-head') + chip('--x1', '加密內容', '4 段', 'sec-jwe');
  } else if (det.kind === 'url' && url) {
    const has = [[url.scheme, '--x3', '協定'], [url.host, '--hd', '主機'], [url.path, '--x2', '路徑'], [url.query, '--pl', '參數'], [url.fragment, '--sg', '片段']].filter(x => x[0] != null && x[0] !== '');
    h += has.map(([, c, l]) => chip(c, l, null, l === '參數' ? 'sec-q' : l === '片段' && url.fragParams ? 'sec-f' : 'sec-url')).join('');
  }
  const notes = det.notes || [];
  if (notes.length) h += `<div class="lnote">${I.check}<span>${esc(notes.join('；'))}。</span></div>`;
  if (det.kind === 'jwt' && (notes.length || det.fromJson)) h += `<button class="lg wide" type="button" data-act="copy-token">${I.copy.replace('<svg', '<svg width="16" height="16"')}複製整理後的權杖</button>`;
  L.hidden = !h; L.innerHTML = h;
}
function tile(tone, icon, big, sub, act) {
  return `<div class="tile ${tone}" data-tone="${tone}"><div class="th"><span class="ic">${icon}</span><b>${esc(big)}</b></div><span>${esc(sub)}</span>${act ? `<button class="tilebtn" type="button" data-go="${act}" aria-label="${esc(big)}：${esc(sub)}"></button>` : ''}</div>`;
}
function sigTile() {
  if (an.kind === 'jwe') return tile('lock', I.lock, '已加密', [an.header.obj.alg, an.header.obj.enc].filter(Boolean).join(' · ') || 'JWE', 'sec-jwe');
  const alg = an.alg, A = alg && J.ALG[alg];
  if (!alg) return tile('bad', I.shX, '無法驗證', '標頭缺少 alg', 'sec-head');
  if (alg.toLowerCase() === 'none') return tile('bad', I.shX, '沒有簽章', 'alg: none，可被任意偽造', 'sec-sig');
  if (!A) return tile('warn', I.shQ, '無法驗證', `不支援 ${alg}`, 'sec-sig');
  if (!vres) return tile('', I.shQ, '驗證中…', alg, 'sec-sig');
  const fam = A.fam;
  if (vres.state === 'ok') return tile('ok', I.shOk, '簽章正確', `${alg} · ${fam === 'HS' ? '密鑰相符' : '公鑰驗證通過'}`, 'sec-sig');
  if (vres.state === 'bad') return tile('bad', I.shX, '簽章不符', `${alg} · ${vres.hint ? '密鑰編碼不對' : fam === 'HS' ? '密鑰不對或內容被改' : '金鑰不對或內容被改'}`, 'sec-sig');
  if (vres.state === 'need') return tile('', I.shQ, '尚未驗證', fam === 'HS' ? '輸入密鑰就會驗證' : '貼上公鑰就會驗證', 'sec-sig');

}
function timeTile() {
  if (an.kind === 'jwe') return tile('', I.clock, '看不到時效', '內容加密，需要金鑰解開', 'sec-jwe');
  if (!an.payload || an.payload.kind !== 'json') return tile('', I.clock, '沒有時效資訊', '內容不是 JSON', 'sec-claims');

  if (s.state === 'early') return tile('warn', I.clock, '尚未生效', s.nbf.text, 'sec-claims');
  if (s.state === 'valid') return tile(s.exp.tone === 'warn' ? 'warn' : 'ok', I.clock, '有效中', s.exp.text, 'sec-claims');
  if (exp && exp.badTime) return tile('bad', I.clock, '時間格式錯', exp.badWhy === 'range' ? 'exp 超出日期範圍' : 'exp 不是數字', 'sec-claims');

}
function issuesHTML(list) {
  if (!list.length) return '';

  const sorted = list.map((x, i) => [x, i]).sort((a, b) => rank[a[0].lv] - rank[b[0].lv] || a[1] - b[1]).map(x => x[0]);
  return `<ul class="issues">${sorted.map(x => `<li class="${x.lv}">${LVI[x.lv]}<span>${esc(x.msg)}</span></li>`).join('')}</ul>`;
}
let lastVerdict = '';
function paintVerdict() {
  const V = $('verdict'); let h = '';
  if (det.kind === 'jwt' && an.error) {
    h = `<div class="errcard"><h3>${I.bad}這個 JWT 讀不出來</h3><p>${esc(an.error)}</p><ul><li>JWT 長這樣：<code>xxxxx.yyyyy.zzzzz</code>，三段都是 base64url，以「.」分隔。</li><li>常見原因：複製時漏了一段、多複製到引號或逗號、被換成全形字元。</li></ul></div>`;
  } else if (det.kind === 'jwt') {
    h = `<div class="tiles">${sigTile()}${timeTile()}</div>` + issuesHTML(an.issues.concat(tstat ? tstat.issues : []));
  } else if (det.kind === 'url') {
    const sch = (url.scheme || url.assumed || '').toLowerCase();
    let t1;
    if (url.queryOnly) t1 = tile('', I.list, '查詢字串', '沒有主機與路徑', 'sec-q');
    else if (url.host == null) t1 = url.scheme ? tile('', I.globe, url.scheme + ':', '非階層式網址', 'sec-url') : tile('', I.globe, '相對路徑', '沒有協定與主機', 'sec-url');
    else if (sch === 'https' || sch === 'wss') t1 = tile('ok', I.lock, '加密連線', url.hostUnicode || '（沒有主機）', 'sec-url');
    else if (sch === 'http' || sch === 'ws') t1 = tile('warn', I.globe, '未加密', url.hostUnicode || '（沒有主機）', 'sec-url');
    else t1 = tile('', I.globe, sch + '://', url.hostUnicode || '（沒有主機）', 'sec-url');

    const rows = url.params.concat(url.fragParams || []).filter(p => !p.empty);

    const bad = rows.some(p => (p.dv && p.dv.errs.length) || p.dk.errs.length);
    const sub = [n && fn ? `片段另有 ${fn} 個` : '', bad ? '有編碼錯誤' : '', ml > 1 ? `最多編碼 ${ml} 次` : '', rows.some(p => (p.dv && p.dv.big5) || p.dk.big5) ? '含 Big5' : ''].filter(Boolean).join(' · ') || (n || fn ? '都已解碼' : url.query == null ? '網址沒有「?」' : '「?」後面是空的');

  }

  V.innerHTML = h; lastVerdict = h;

const cbtn = (act, label) => `<button class="tb" type="button" data-act="${act}" aria-label="${label}" title="${label}">${I.copy}</button>`;

function verifyCard() {

  } else {

      <textarea id="pubkey" class="inp" rows="5" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="-----BEGIN PUBLIC KEY-----&#10;MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA…&#10;-----END PUBLIC KEY-----">${esc(pubKey)}</textarea>

}

function pushUndo() { undo.push({ text: srcText(), sample: isSample ? sampleId : null }); if (undo.length > 30) undo.shift(); }
function undoToast(msg) { toast(msg, '復原', doUndo); }
function doUndo() {
  const s = undo.pop(); if (!s) return;
  setText(s.text, { sample: s.sample });
  if (undo.length) toast(`已復原，還可以再復原 ${undo.length} 步`, '復原', doUndo); else toast('已復原');
}
function goTo(id) {
  const el = $(id); if (!el) return;
  el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  if (id === 'sec-sig') { const f = $('secret') || $('pubkey'); if (f && !f.value) setTimeout(() => f.focus({ preventScroll: true }), reduced() ? 0 : 350); }
}
document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]'); if (go) { goTo(go.dataset.go); return; }
  const encB = e.target.closest('[data-enc]'); if (encB) { setEnc(encB.dataset.enc); return; }
  const row = e.target.closest('.row[data-ci]'); if (row) { doCopy(REG[+row.dataset.ci], ` ${row.dataset.cl}`, row); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'copy-token') doCopy(det.token, '權杖', b);
  else if (act === 'copy-sig') doCopy(an.parts[2], '簽章', b);
  else if (act === 'copy-head') doCopy(J.pretty(an.header.node), '標頭 JSON', b);
  else if (act === 'copy-pay') doCopy(an.payload.kind === 'json' ? J.pretty(an.payload.node) : an.payload.text, '內容', b);
  else if (act === 'copy-report') doCopy(reportText(), '解析摘要', b);
  else if (act === 'copy-url') doCopy(srcText().slice(det.start, det.end), '網址', b);
  else if (act === 'copy-read') doCopy(J.readable(url), '可讀版網址', b);
  else if (act === 'copy-ascii') doCopy(url.raw.slice(0, url.off.host[0]) + url.hostASCII + url.raw.slice(url.off.host[1]), 'Punycode 版網址', b);
  else if (act === 'copy-val') doCopy(REG[+b.dataset.ci], '值', b);
  else if (act === 'copy-qs') {
    const rows = (b.dataset.w === 'q' ? qRows : fRows).filter(r => !r.empty), o = {};
    for (const r of rows) { const v = r.dv ? r.dv.layers[0] : r.v; if (r.k in o) o[r.k] = [].concat(o[r.k], v); else o[r.k] = v; }
    doCopy(JSON.stringify(o, null, 2), '參數 JSON', b);
  }
  else if (act === 'open') openNested(REG[+b.dataset.ci], b.dataset.label);
  else if (act === 'paste') pasteInto();
  else if (act === 'sample') loadSample(b.dataset.sid, true);
  else if (act === 'trim-secret') { secret = secret.trim(); const s = $('secret'); if (s) s.value = secret; runVerify(); }
  else if (act === 'paste-key') {
    let t = null; try { t = await navigator.clipboard.readText(); } catch (err) { t = null; }
    const k = $('pubkey'); if (t == null) { k.focus(); toast('無法直接讀取剪貼簿，請在框內長按並選「貼上」', null, null, 3500); return; }
    pubKey = t; k.value = t; saveKey(); runVerify(); paintView();
  }
  else if (act === 'clear-key') { const prev = pubKey; pubKey = ''; saveKey(); paintView(); runVerify(); toast('已清除公鑰', '復原', () => { pubKey = prev; saveKey(); paintView(); runVerify(); }); }
  else if (act === 'use-x5c') { const c = an.header.obj.x5c[0]; pubKey = '-----BEGIN CERTIFICATE-----\n' + String(c).replace(/(.{64})/g, '$1\n').trim() + '\n-----END CERTIFICATE-----'; saveKey(); paintView(); runVerify(); toast('已填入標頭的憑證；請確認它來自可信任的來源', null, null, 3500); }
  else if (act === 'use-jwk') { pubKey = JSON.stringify(an.header.obj.jwk, null, 2); saveKey(); paintView(); runVerify(); toast('已填入標頭的 jwk；權杖自帶的金鑰不能證明身分', null, null, 3500); }
  else if (act === 'del') {
    const w = b.dataset.w, i = +b.dataset.i, rows = w === 'q' ? qRows : fRows; const r = rows[i]; if (!r) return;
    const blank = r.edited && r.k === '' && (r.v == null || r.v === '');
    if (!blank) pushUndo();
    rows.splice(i, 1);
    rebuildFromTable(!blank); update(true); autosize();
    if (!blank) undoToast(`已刪除參數「${short(r.k || '（無名稱）', 16)}」`);
  }
  else if (act === 'add') {
    const w = b.dataset.w, rows = w === 'q' ? qRows : fRows, list = $('plist-' + w);
    // only one blank row at a time: more taps just return to it, and the page never scrolls under the finger
    let idx = rows.findIndex(r => r.edited && !r.empty && r.k === '' && (r.v == null || r.v === ''));
    if (idx < 0) { rows.push({ k: '', v: '', eq: true, edited: true, raw: '', dv: null, dk: null }); idx = rows.length - 1; list.innerHTML = paramRowsHTML(w); }
    const inp = list.querySelector(`.prow[data-i="${idx}"] .pk`); if (inp) inp.focus({ preventScroll: true });
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row[data-ci]')) { e.preventDefault(); e.target.click(); }
});

/* ---------- boot ---------- */
window.__jd = { J, get det() { return det; }, get an() { return an; }, get url() { return url; }, get vres() { return vres; }, get tstat() { return tstat; }, get qRows() { return qRows; }, setText, loadSample, runVerify };
(async () => {
  const saved = LS.get('text', null), sid = LS.get('sample', null);
  if (typeof saved === 'string') { setBox(saved); isSample = false; update(true); }
  else await loadSample(SAMPLES.some(s => s.id === sid) ? sid : 'login', false);
  autosize();
  window.__jdReady = true;
})();
window.addEventListener('resize', () => { autosize(); syncScroll(); });
})();
</script>
