<title>進位轉換</title>
<style>
/* Register panel: anodised aluminium faceplate, red indicator LEDs for set bits, engraved labels */
:root{
  --bg:#e2e5e8; --surface:#f7f8f9; --sunk:#eceef1; --ink:#15191e; --muted:#4e5661; --faint:#7b838e;
  --line:#cdd2d8; --line-strong:#a7aeb8; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --led:#d42a20; --led-ink:#ffffff; --led-glow:rgba(212,42,32,.35); --off:#e6e8eb; --off-ink:#8a919b;
  --sgn:#8b3fb0; --exp:#1f7a52; --man:#1f5f8b;
  --warn:#8f4f00; --warn-soft:#fbe8cc; --bad:#b4231a; --bad-soft:#f8dfdb; --ok:#1d6b3f;
  --shadow:0 12px 30px rgba(21,25,30,.16);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --surface:#171a1f; --sunk:#121418; --ink:#e3e6ea; --muted:#a2aab4; --faint:#747c87;
  --line:#262a31; --line-strong:#3a4049; --accent:#7cb8e6; --accent-ink:#0a1a26; --accent-soft:#16283a;
  --led:#ff5a4a; --led-ink:#1c0503; --led-glow:rgba(255,90,74,.45); --off:#1d2026; --off-ink:#5d6570;
  --sgn:#d79bf2; --exp:#6fd6a3; --man:#7cb8e6;
  --warn:#f4b862; --warn-soft:#33250f; --bad:#ff8b80; --bad-soft:#3a1916; --ok:#7fd6a3;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --sunk:#121418; --ink:#e3e6ea; --muted:#a2aab4; --faint:#747c87;
  --line:#262a31; --line-strong:#3a4049; --accent:#7cb8e6; --accent-ink:#0a1a26; --accent-soft:#16283a;
  --led:#ff5a4a; --led-ink:#1c0503; --led-glow:rgba(255,90,74,.45); --off:#1d2026; --off-ink:#5d6570;
  --sgn:#d79bf2; --exp:#6fd6a3; --man:#7cb8e6;
  --warn:#f4b862; --warn-soft:#33250f; --bad:#ff8b80; --bad-soft:#3a1916; --ok:#7fd6a3;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 calc(32px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
header.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.03em;flex:1;min-width:120px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{min-height:44px;min-width:44px;padding:0 10px;border:0;background:var(--surface);cursor:pointer;font:700 14px var(--mono);color:var(--muted)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.zh button{font-family:var(--sans)}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;cursor:pointer;font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.grid{display:grid;gap:14px}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.panel h2{margin:0 0 10px;font:800 11.5px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .tag{letter-spacing:.08em;color:var(--accent);border:1px solid currentColor;padding:0 5px;border-radius:2px}
.field{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:start;margin-bottom:8px}
.field .k{font:800 12px var(--mono);letter-spacing:.08em;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--surface);border-radius:3px}
.field textarea,.field select{resize:none;overflow:hidden;line-height:1.5;display:block;width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:8px 10px;font:600 16px var(--mono);letter-spacing:.02em}
.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.field .hint{grid-column:2/4;font-size:12.5px;color:var(--bad);margin-top:-2px}
.field .cp{width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.custom{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:6px}
.custom select{font:600 14px var(--sans)!important;padding:6px 4px 6px 8px!important}
.status{margin:4px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-size:13.5px;border-radius:2px}
.opts{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.bytes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 14px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.byte .bl{font:600 11px var(--mono);color:var(--faint);display:flex;justify-content:space-between;margin-bottom:2px}
.byte .cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.byte .cells button:nth-child(4){margin-right:4px}
.bit{min-height:44px;min-width:32px;border:1px solid var(--line-strong);background:var(--off);color:var(--off-ink);border-radius:3px;font:800 15px var(--mono);cursor:pointer;padding:0;transition:background .08s}
.bit[aria-pressed="true"]{background:var(--led);border-color:var(--led);color:var(--led-ink);box-shadow:0 0 0 2px var(--led-glow)}
.bit.s{outline:2px solid var(--sgn);outline-offset:-4px}
.bit.e{outline:2px solid var(--exp);outline-offset:-4px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:10px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.ops{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px}
.ops select,.ops input,.panel select,.panel input[type=text],.panel input[type=number]{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:8px 10px;font:600 15px var(--mono)}
.fl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
.res{margin-top:10px;border:1px solid var(--line);border-radius:3px}
.res button{display:grid;grid-template-columns:40px minmax(0,1fr);width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;min-height:44px;padding:8px 10px;cursor:pointer;font:600 14px var(--mono);color:var(--ink)}
.res button:last-child{border-bottom:0}
.res button b{color:var(--muted);font-size:12px;letter-spacing:.08em;padding-top:1px}
.res button span{overflow-wrap:anywhere}
@media (hover:hover){.res button:hover{background:var(--accent-soft)}}
.ieee{font:700 14px var(--mono);overflow-wrap:anywhere;line-height:1.7;margin:4px 0 8px}
.ieee .s{color:var(--sgn)} .ieee .e{color:var(--exp)} .ieee .m{color:var(--man)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.swatch{height:84px;border-radius:4px;border:1px solid var(--line-strong);position:relative;overflow:hidden;
  background-image:linear-gradient(45deg,var(--off) 25%,transparent 25%,transparent 75%,var(--off) 75%),linear-gradient(45deg,var(--off) 25%,transparent 25%,transparent 75%,var(--off) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.swatch i{position:absolute;inset:0}
.rgba{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:400px){.seg button{padding:0 8px;min-width:40px}.bytes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <h1>進位轉換</h1>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="位元寬度">
      <button id="w-8">8</button><button id="w-16">16</button><button id="w-32">32</button><button id="w-64">64</button><button id="w-0" style="font-family:var(--sans)">任意</button>
    </div>
    <div class="seg zh" role="group" aria-label="有號或無號">
      <button id="sign-u">無號</button><button id="sign-s">有號</button>
    </div>
  </div>
</header>

<div class="grid">
  <div class="col">
    <section class="panel" aria-label="數值">
      <h2>數值 <span class="tag" id="sampleTag">範例</span></h2>
      <div class="field"><label class="k" for="f-bin">BIN</label><textarea id="f-bin" class="num" rows="1" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-bin" aria-label="複製二進位">複製</button><div class="hint" id="h-bin" hidden></div></div>
      <div class="field"><label class="k" for="f-oct">OCT</label><textarea id="f-oct" class="num" rows="1" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-oct" aria-label="複製八進位">複製</button><div class="hint" id="h-oct" hidden></div></div>
      <div class="field"><label class="k" for="f-dec">DEC</label><textarea id="f-dec" class="num" rows="1" inputmode="text" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-dec" aria-label="複製十進位">複製</button><div class="hint" id="h-dec" hidden></div></div>
      <div class="field"><label class="k" for="f-hex">HEX</label><textarea id="f-hex" class="num" rows="1" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-hex" aria-label="複製十六進位">複製</button><div class="hint" id="h-hex" hidden></div></div>
      <div class="field custom"><select id="cbase" aria-label="自訂進位"></select><input id="f-cus" autocomplete="off" spellcheck="false" aria-label="自訂進位數值" style="width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:8px 10px;font:600 16px var(--mono)"><button class="cp" id="cp-cus" aria-label="複製自訂進位">複製</button><div class="hint" id="h-cus" hidden></div></div>
      <p class="status" id="status" hidden></p>
      <div class="opts">
        <label class="check"><input type="checkbox" id="fmtBin" checked> BIN 每 4 位空格</label>
        <label class="check"><input type="checkbox" id="fmtHex" checked> HEX 每 2 位空格</label>
        <label class="check"><input type="checkbox" id="fmtDec"> DEC 千分位</label>
      </div>
    </section>
    <section class="panel" aria-label="位元格">
      <h2>位元格 <span style="letter-spacing:0;text-transform:none;font-weight:500;font-family:var(--sans)">點選切換，左右拖曳可連續設定</span></h2>
      <div class="bytes" id="bits"></div>
      <p class="note" id="bitsNote" hidden></p>
      <dl class="info" id="info"></dl>
    </section>
  </div>
  <div class="col">
    <section class="panel" aria-label="位元運算">
      <h2>位元運算</h2>
      <div class="ops">
        <div><label class="fl" for="op">A（目前值） 運算子</label>
          <select id="op"><option value="and">AND &amp;</option><option value="or">OR |</option><option value="xor">XOR ^</option><option value="not">NOT ~A</option><option value="shl">&lt;&lt; 左移</option><option value="shr">&gt;&gt; 右移（算術）</option><option value="ushr">&gt;&gt;&gt; 邏輯右移</option><option value="add">+ 加</option><option value="sub">− 減</option><option value="mul">× 乘</option></select></div>
        <div><label class="fl" for="opB">B</label><input type="text" id="opB" value="0x0F" autocomplete="off" spellcheck="false"></div>
      </div>
      <p class="note" id="opNote" hidden></p>
      <div class="res" id="opRes"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn pri" id="opApply">結果設為目前值</button></div>
    </section>
    <section class="panel" id="ieeeBox" aria-label="IEEE 754">
      <h2>IEEE 754 浮點檢視</h2>
      <div class="ieee" id="ieeeBits"></div>
      <div class="legend"><span><i style="background:var(--sgn)"></i>符號</span><span><i style="background:var(--exp)"></i>指數</span><span><i style="background:var(--man)"></i>尾數</span></div>
      <dl class="info" id="ieeeInfo"></dl>
      <div style="margin-top:8px"><label class="fl" for="floatIn">輸入浮點數寫入位元</label><input type="text" id="floatIn" inputmode="decimal" autocomplete="off" placeholder="例如 3.14 或 -0.5"></div>
    </section>
    <section class="panel" aria-label="色碼">
      <h2>色碼</h2>
      <label class="fl" for="color">HEX、rgb() 或 hsl()</label>
      <input type="text" id="color" value="#FF8800" autocomplete="off" spellcheck="false">
      <p class="note" id="colorErr" hidden style="color:var(--bad)"></p>
      <div class="swatch" style="margin-top:8px"><i id="swatch"></i></div>
      <div class="rgba">
        <div><label class="fl" for="cr">R</label><input type="number" id="cr" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="cg">G</label><input type="number" id="cg" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="cb">B</label><input type="number" id="cb" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="ca">A %</label><input type="number" id="ca" min="0" max="100" inputmode="numeric"></div>
      </div>
      <div class="res" id="colorRes"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" id="colorToValue">整數值送到上方</button></div>
    </section>
  </div>
</div>
</div>
<div id="toastHost" aria-live="polite"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("base-convert:v1:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("base-convert:v1:" + k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(msg){ const h = $("toastHost"); h.innerHTML = ""; const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, 2000); }
function copyText(text, el){
  const fallback = () => {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok){ toast("已複製"); return; } } catch (e) {}
    if (el){ if (el.select) el.select(); else { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
    toast("無法自動複製，已選取文字，請長按手動複製");
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("已複製"), fallback); else fallback(); } catch (e) { fallback(); }
}

// ---------- state ----------
const saved = store.get("state", null);
const S = { value: 255n, width: 16, signed: false };
try { if (saved){ S.value = BigInt(saved.v); S.width = [0, 8, 16, 32, 64].includes(saved.width) ? saved.width : 16; S.signed = !!saved.signed; } } catch (e) {}
const F = Object.assign({ bin: true, hex: true, dec: false }, store.get("fmt", {}));
let editing = null; // field id being typed in
const save = () => store.set("state", { v: S.value.toString(), width: S.width, signed: S.signed });

const minOf = () => S.signed ? -(1n << BigInt(S.width - 1)) : 0n;
const maxOf = () => S.signed ? (1n << BigInt(S.width - 1)) - 1n : (1n << BigInt(S.width)) - 1n;
const norm = v => S.width ? (S.signed ? BigInt.asIntN(S.width, v) : BigInt.asUintN(S.width, v)) : v;
const raw = v => S.width ? BigInt.asUintN(S.width, v) : v; // bit pattern (two's complement for fixed width)

// ---------- parsing ----------
const BASES = { bin: 2, oct: 8, dec: 10, hex: 16 };
const DIGITS = "0123456789abcdefghijklmnopqrstuvwxyz";
function allowedMsg(b){ return b === 2 ? "僅允許 0/1" : b === 8 ? "僅允許 0–7" : b === 10 ? "僅允許 0–9 與負號" : b === 16 ? "僅允許 0–9、A–F" : `僅允許 0–9、A–${DIGITS[b - 1].toUpperCase()}`; }
function parseIn(str, base, anyPrefix){
  let s = str.replace(/[\s_]/g, "");
  if (base === 10) s = s.replace(/,/g, "");
  if (!s) return { empty: true };
  let neg = false;
  if (s[0] === "-" || s[0] === "+"){ neg = s[0] === "-"; s = s.slice(1); }
  const pm = /^0([bxo])/i.exec(s);
  if (pm){
    const pb = { b: 2, o: 8, x: 16 }[pm[1].toLowerCase()];
    if (pb === base || anyPrefix){ base = pb; s = s.slice(2); }
    else if (!DIGITS.slice(0, base).includes(pm[1].toLowerCase())) return { err: allowedMsg(base) }; // b/o/x can be plain digits in larger bases
  }
  if (!s) return { err: allowedMsg(base) };
  const valid = DIGITS.slice(0, base);
  for (const ch of s.toLowerCase()) if (!valid.includes(ch)) return { err: allowedMsg(base) };
  let v = 0n; const B = BigInt(base);
  if (base === 2 || base === 8 || base === 16) v = BigInt("0" + "box"[[2, 8, 16].indexOf(base)] + s);
  else if (base === 10) v = BigInt(s);
  else for (const ch of s.toLowerCase()) v = v * B + BigInt(valid.indexOf(ch));
  return { v: neg ? -v : v };
}
// value typed into one of the radix fields → state value, with overflow / two's-complement notes
function setFromInput(n, base){
  let note = "";
  if (S.width){
    if (base === 10){
      if (!S.signed && n < 0n){ note = "無號模式不能表示負數，已換成二補數：" + BigInt.asUintN(S.width, n); }
      else if (n < minOf() || n > maxOf()) note = `溢位，已截斷到 ${S.width} 位元`;
    } else {
      if (n < 0n){ if (!S.signed && n < 0n) note = "無號模式不能表示負數，已換成二補數"; else if (n < minOf()) note = `溢位，已截斷到 ${S.width} 位元`; }
      else if (n >= (1n << BigInt(S.width))) note = `溢位，已截斷到 ${S.width} 位元`;
    }
  }
  S.value = norm(n); // for BIN/OCT/HEX a pattern ≥ 2^(w-1) becomes negative in signed mode (two's complement)
  status(note); save();
}

// ---------- formatting ----------
function group(s, n){ const out = []; for (let i = s.length; i > 0; i -= n) out.unshift(s.slice(Math.max(0, i - n), i)); return out.join(" "); }
function fmtBase(v, base, grouped){
  const neg = !S.width && v < 0n; let r = (S.width ? raw(v) : (neg ? -v : v)).toString(base);
  if (base === 16) r = r.toUpperCase();
  if (S.width && base === 2) r = r.padStart(S.width, "0");
  if (S.width && base === 16) r = r.padStart(S.width / 4, "0");
  if (grouped && base === 2) r = group(r, 4);
  if (grouped && base === 16) r = group(r, 2);

const shown = { bin: v => fmtBase(v, 2, F.bin), oct: v => fmtBase(v, 8, false), dec: v => fmtDec(v, F.dec), hex: v => fmtBase(v, 16, F.hex) };

function status(msg){ const s = $("status"); s.hidden = !msg; s.textContent = msg || ""; }

// ---------- render ----------

function bitCount(){

function renderInfo(){

// ---------- bit ops ----------
let opResult = null;
function renderOps(){
  const op = $("op").value, host = $("opRes"), note = $("opNote");

  host.innerHTML = ""; opResult = null;

    const p = parseIn($("opB").value, 10, true);
    if (p.empty || p.err){ note.hidden = false; note.textContent = "B 請輸入數值（可用 0x、0b、0o 前綴）。"; note.style.color = "var(--bad)"; return; }

    if (B > 4096n){ note.hidden = false; note.textContent = "位移量過大（上限 4096）。"; note.style.color = "var(--bad)"; return; }

$("op").addEventListener("change", renderOps); $("opB").addEventListener("input", renderOps);
$("opApply").onclick = () => { if (opResult == null) return; S.value = opResult; status(""); save(); render(); toast("已套用結果"); };

// ---------- IEEE 754 ----------
function renderIeee(){
  const box = $("ieeeBox"); box.hidden = !(S.width === 32 || S.width === 64);

  let f;
  if (w === 32){ dv.setUint32(0, Number(r)); f = dv.getFloat32(0); }
  else { dv.setBigUint64(0, r); f = dv.getFloat64(0); }

  const sB = bits[0], eS = bits.slice(1, 1 + eb), mS = bits.slice(1 + eb);

$("floatIn").addEventListener("change", () => {
  const t = $("floatIn").value.trim(); if (!t) return;

  if (S.width === 32){ dv.setFloat32(0, f); r = BigInt(dv.getUint32(0)); } else { dv.setFloat64(0, f); r = dv.getBigUint64(0); }

// ---------- color ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

let colorInt = null;
const hx = n => n.toString(16).padStart(2, "0").toUpperCase();
function renderColor(c, fromRgb){
  const host = $("colorRes"); host.innerHTML = "";

$("color").addEventListener("input", () => renderColor(parseColor($("color").value)));
["cr", "cg", "cb", "ca"].forEach(id => $(id).addEventListener("input", () => {

$("colorToValue").onclick = () => {

  S.value = norm(colorInt); status(colorInt > maxOf() && S.width ? `溢位，已截斷到 ${S.width} 位元` : ""); save(); render(); toast("已送到上方數值");

// ---------- field events ----------
for (const k of ["bin", "oct", "dec", "hex", "cus"]){
  const el = $("f-" + k);
  el.addEventListener("focus", () => { editing = "f-" + k; });

  el.addEventListener("input", () => {
    editing = "f-" + k; if (k !== "cus") autosize();

}
(() => { const sel = $("cbase"); for (let b = 2; b <= 36; b++){ const o = document.createElement("option"); o.value = b; o.textContent = b + " 進位"; sel.appendChild(o); } sel.value = store.get("cbase", 36); if (!sel.value) sel.value = 36; })();

$("sign-s").onclick = () => { S.signed = true; S.value = norm(S.value); status(""); save(); render(); };
$("fmtBin").checked = F.bin; $("fmtHex").checked = F.hex; $("fmtDec").checked = F.dec;

S.value = norm(S.value);
addEventListener("resize", autosize);
render(); renderColor(parseColor($("color").value));
window.__bc = { S, parseIn, parseColor, toHsl, render };
window.__bcReady = true;
