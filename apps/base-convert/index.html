<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>進位轉換</title>
<style>
/* Register panel: anodised aluminium faceplate, red indicator LEDs for set bits, engraved labels */
:root{
  --bg:#e2e5e8; --surface:#f7f8f9; --sunk:#eceef1; --ink:#15191e; --muted:#4e5661; --faint:#7b838e;
  --line:#cdd2d8; --line-strong:#a7aeb8; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --led:#d42a20; --led-ink:#ffffff; --led-glow:rgba(212,42,32,.35); --off:#e6e8eb; --off-ink:#8a919b;
  --sgn:#8b3fb0; --exp:#1f7a52; --man:#1f5f8b;
  --warn:#8f4f00; --warn-soft:#fbe8cc; --bad:#b4231a; --bad-soft:#f8dfdb; --ok:#1d6b3f;
  --shadow:0 12px 30px rgba(21,25,30,.16);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --surface:#171a1f; --sunk:#121418; --ink:#e3e6ea; --muted:#a2aab4; --faint:#747c87;
  --line:#262a31; --line-strong:#3a4049; --accent:#7cb8e6; --accent-ink:#0a1a26; --accent-soft:#16283a;
  --led:#ff5a4a; --led-ink:#1c0503; --led-glow:rgba(255,90,74,.45); --off:#1d2026; --off-ink:#5d6570;
  --sgn:#d79bf2; --exp:#6fd6a3; --man:#7cb8e6;
  --warn:#f4b862; --warn-soft:#33250f; --bad:#ff8b80; --bad-soft:#3a1916; --ok:#7fd6a3;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --sunk:#121418; --ink:#e3e6ea; --muted:#a2aab4; --faint:#747c87;
  --line:#262a31; --line-strong:#3a4049; --accent:#7cb8e6; --accent-ink:#0a1a26; --accent-soft:#16283a;
  --led:#ff5a4a; --led-ink:#1c0503; --led-glow:rgba(255,90,74,.45); --off:#1d2026; --off-ink:#5d6570;
  --sgn:#d79bf2; --exp:#6fd6a3; --man:#7cb8e6;
  --warn:#f4b862; --warn-soft:#33250f; --bad:#ff8b80; --bad-soft:#3a1916; --ok:#7fd6a3;
  --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);overflow-anchor:none} /* the page keeps the tapped control in place itself (anchored()) */
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 calc(32px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
header.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.03em;flex:1;min-width:120px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{min-height:44px;min-width:44px;padding:0 10px;border:0;background:var(--surface);cursor:pointer;font:700 14px var(--mono);color:var(--muted)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.zh button{font-family:var(--sans)}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;cursor:pointer;font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.grid{display:grid;gap:14px}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.col{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.panel h2{margin:0 0 10px;font:800 11.5px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .tag{letter-spacing:.08em;color:var(--accent);border:1px solid currentColor;padding:0 5px;border-radius:2px}
.field{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center;margin-bottom:8px}
.field.dec{grid-template-columns:44px minmax(0,1fr) 44px 44px}
.field.dec .hint{grid-column:2/5}
.field .k{font:800 12px var(--mono);letter-spacing:.08em;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--surface);border-radius:3px}
.field textarea,.field select,.field input.cin{resize:none;overflow:hidden;display:block;width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:9px 10px;font:600 16px/24px var(--mono);letter-spacing:.02em}
.field input.cin{height:44px}
#f-hex,#f-bin{letter-spacing:0}
.field textarea:focus,.field input.cin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea.bad,.field input.cin.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.field .hint{grid-column:2/4;font-size:12.5px;color:var(--bad);margin-top:-2px}
.field .pm{font-size:19px!important;color:var(--ink)!important}
.field .cp,.field .pm{width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.custom{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:6px}
.custom select{font:600 14px var(--sans)!important;padding:6px 4px 6px 8px!important}
.status{margin:4px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-size:13.5px;border-radius:2px}
.opts{display:flex;gap:0 14px;flex-wrap:wrap;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px;line-height:1.25}
.check b{font:700 13px var(--mono)}
@media (max-width:480px){.opts{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:0 8px}.check{gap:6px;font-size:12.5px}.check b{display:block}}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.bytes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(370px,100%),1fr));gap:8px 14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;container-type:inline-size}
.byte{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"bl bset" "cells cells";column-gap:6px}
.byte .bl{grid-area:bl;align-self:end;font:600 11px var(--mono);color:var(--faint);display:flex;justify-content:space-between;margin-bottom:2px}
.byte .cells{grid-area:cells}
.byte .cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 0 repeat(4,minmax(0,1fr));gap:3px 2px}
.byte .cells button:nth-child(5){grid-column:6}
/* 8 cells need 8×44 + gaps = 370px; narrower panels (phones in portrait) show a nibble per row so every cell stays ≥ 44px wide */
.bset{grid-area:bset;display:flex;gap:6px;margin-bottom:3px}
.bset button{min-width:56px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;font:700 13px var(--mono);color:var(--muted);cursor:pointer;padding:0 8px}
@container (max-width:369.98px){.byte .cells{grid-template-columns:repeat(4,minmax(0,1fr))}.byte .cells button:nth-child(5){grid-column:auto}
  /* phones: the 00/FF buttons stand beside the byte's two rows of cells instead of taking a row of their own */
  .byte{grid-template-areas:"bl bl" "cells bset"}.bset{flex-direction:column;gap:3px;margin:0}}
.bit{min-height:44px;min-width:0;border:1px solid var(--line-strong);background:var(--off);color:var(--off-ink);border-radius:3px;font:800 15px var(--mono);cursor:pointer;padding:0;transition:background .08s}
.bit[aria-pressed="true"]{background:var(--led);border-color:var(--led);color:var(--led-ink);box-shadow:0 0 0 2px var(--led-glow)}
.bit.s{outline:2px solid var(--sgn);outline-offset:-4px}
.bit.e{outline:2px solid var(--exp);outline-offset:-4px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:10px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.ops{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px}
.ops select,.ops input,.panel select,.panel input[type=text],.panel input[type=number]{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:3px;padding:8px 10px;font:600 15px var(--mono)}
.fl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
.res{margin-top:10px;border:1px solid var(--line);border-radius:3px}
.res button{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;min-height:44px;padding:8px 10px;cursor:pointer;font:600 14px var(--mono);color:var(--ink)}
.res button:last-child{border-bottom:0}
.res button b{color:var(--muted);font-size:12px;letter-spacing:.08em}
.res button:disabled{cursor:default}
#opNote{min-height:1.45em}
#opRes.off button{visibility:hidden}
.res button span{overflow-wrap:anywhere}
@media (hover:hover){.res button:hover{background:var(--accent-soft)}}
.ieee{font:700 14px var(--mono);overflow-wrap:anywhere;line-height:1.7;margin:4px 0 8px}
.ieee .s{color:var(--sgn)} .ieee .e{color:var(--exp)} .ieee .m{color:var(--man)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 44px auto;gap:6px}
.jump{display:none}
@media (max-width:759px){.jump{display:flex;gap:6px;margin:0 0 12px}.jump button{flex:1 1 0;min-width:0;padding:0 4px;font-size:13.5px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.swatch{height:84px;border-radius:4px;border:1px solid var(--line-strong);position:relative;overflow:hidden;
  background-image:linear-gradient(45deg,var(--off) 25%,transparent 25%,transparent 75%,var(--off) 75%),linear-gradient(45deg,var(--off) 25%,transparent 25%,transparent 75%,var(--off) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.swatch i{position:absolute;inset:0}
.rgba{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;min-height:44px;border-radius:4px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast:not(:has(button)){padding-right:16px}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
.toast.fresh button{pointer-events:none}
.toast button{pointer-events:auto;flex-shrink:0;min-height:44px;min-width:44px;padding:0 12px;border:1px solid currentColor;border-radius:3px;background:transparent;color:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.panel h2 .undo{margin-left:auto;font:650 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
@media (max-width:400px){.seg button{padding:0 8px;min-width:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <h1>進位轉換</h1>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="位元寬度">
      <button id="w-8">8</button><button id="w-16">16</button><button id="w-32">32</button><button id="w-64">64</button><button id="w-0" style="font-family:var(--sans)">任意</button>
    </div>
    <div class="seg zh" role="group" aria-label="有號或無號">
      <button id="sign-u">無號</button><button id="sign-s">有號</button>
    </div>
  </div>
</header>
<nav class="jump" aria-label="跳到">
  <button class="btn" type="button" data-to="bitsPanel">位元格</button><button class="btn" type="button" data-to="opsPanel">位元運算</button><button class="btn" type="button" data-to="ieeeBox" id="j-ieee">浮點</button><button class="btn" type="button" data-to="colorPanel">色碼</button>
</nav>

<div class="grid">
  <div class="col">
    <section class="panel" aria-label="數值">
      <h2>數值 <span class="tag" id="sampleTag">範例</span><button class="btn undo" type="button" id="undo" disabled aria-label="復原上一步數值變更">復原</button></h2>
      <div class="field"><label class="k" for="f-bin">BIN</label><textarea id="f-bin" class="num" rows="1" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-bin" aria-label="複製二進位">複製</button><div class="hint" id="h-bin" hidden></div></div>
      <div class="field"><label class="k" for="f-oct">OCT</label><textarea id="f-oct" class="num" rows="1" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-oct" aria-label="複製八進位">複製</button><div class="hint" id="h-oct" hidden></div></div>
      <div class="field dec"><label class="k" for="f-dec">DEC</label><textarea id="f-dec" class="num" rows="1" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea><button class="pm" type="button" id="pm-dec" aria-label="切換正負號">±</button><button class="cp" id="cp-dec" aria-label="複製十進位">複製</button><div class="hint" id="h-dec" hidden></div></div>
      <div class="field"><label class="k" for="f-hex">HEX</label><textarea id="f-hex" class="num" rows="1" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea><button class="cp" id="cp-hex" aria-label="複製十六進位">複製</button><div class="hint" id="h-hex" hidden></div></div>
      <div class="field custom"><select id="cbase" aria-label="自訂進位"></select><input id="f-cus" class="cin" autocomplete="off" spellcheck="false" aria-label="自訂進位數值"><button class="cp" id="cp-cus" aria-label="複製自訂進位">複製</button><div class="hint" id="h-cus" hidden></div></div>
      <p class="status" id="status" hidden></p>
      <div class="opts">
        <label class="check"><input type="checkbox" id="fmtBin" checked><span><b>BIN</b> 每 4 位空格</span></label>
        <label class="check"><input type="checkbox" id="fmtHex" checked><span><b>HEX</b> 每 2 位空格</span></label>
        <label class="check"><input type="checkbox" id="fmtDec"><span><b>DEC</b> 千分位</span></label>
      </div>
    </section>
    <section class="panel" id="bitsPanel" aria-label="位元格">
      <h2>位元格 <span style="letter-spacing:0;text-transform:none;font-weight:500;font-family:var(--sans)">點選切換，左右拖曳可連續設定</span></h2>
      <div class="bytes" id="bits"></div>
      <p class="note" id="bitsNote" hidden></p>
      <dl class="info" id="info"></dl>
    </section>
  </div>
  <div class="col">
    <section class="panel" id="opsPanel" aria-label="位元運算">
      <h2>位元運算</h2>
      <div class="ops">
        <div><label class="fl" for="op">A（目前值） 運算子</label>
          <select id="op"><option value="and">AND &amp;</option><option value="or">OR |</option><option value="xor">XOR ^</option><option value="not">NOT ~A</option><option value="shl">&lt;&lt; 左移</option><option value="shr">&gt;&gt; 右移（算術）</option><option value="ushr">&gt;&gt;&gt; 邏輯右移</option><option value="add">+ 加</option><option value="sub">− 減</option><option value="mul">× 乘</option></select></div>
        <div><label class="fl" for="opB">B</label><input type="text" id="opB" value="0x0F" autocomplete="off" spellcheck="false"></div>
      </div>
      <p class="note" id="opNote" style="visibility:hidden"></p>
      <div class="res" id="opRes"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn pri" id="opApply">結果設為目前值</button></div>
    </section>
    <section class="panel" id="ieeeBox" aria-label="IEEE 754">
      <h2>IEEE 754 浮點檢視</h2>
      <div class="ieee" id="ieeeBits"></div>
      <div class="legend"><span><i style="background:var(--sgn)"></i>符號</span><span><i style="background:var(--exp)"></i>指數</span><span><i style="background:var(--man)"></i>尾數</span></div>
      <dl class="info" id="ieeeInfo"></dl>
      <div style="margin-top:8px"><label class="fl" for="floatIn">輸入浮點數寫入位元</label><div class="frow"><input type="text" id="floatIn" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="例如 3.14 或 -0.5"><button class="btn" type="button" id="floatNeg" aria-label="切換浮點數正負號">±</button><button class="btn pri" type="button" id="floatGo">寫入</button></div></div>
    </section>
    <section class="panel" id="colorPanel" aria-label="色碼">
      <h2>色碼</h2>
      <label class="fl" for="color">HEX、rgb() 或 hsl()</label>
      <input type="text" id="color" value="#FF8800" autocomplete="off" spellcheck="false">
      <p class="note" id="colorErr" hidden style="color:var(--bad)"></p>
      <div class="swatch" style="margin-top:8px"><i id="swatch"></i></div>
      <div class="rgba">
        <div><label class="fl" for="cr">R</label><input type="number" id="cr" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="cg">G</label><input type="number" id="cg" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="cb">B</label><input type="number" id="cb" min="0" max="255" inputmode="numeric"></div>
        <div><label class="fl" for="ca">A %</label><input type="number" id="ca" min="0" max="100" inputmode="numeric"></div>
      </div>
      <div class="res" id="colorRes"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" id="colorToValue">整數值送到上方</button></div>
    </section>
  </div>
</div>
</div>
<div id="toastHost" aria-live="polite"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("base-convert:v1:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("base-convert:v1:" + k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(msg, withUndo){
  const h = $("toastHost"); h.innerHTML = ""; const d = document.createElement("div"); d.className = "toast";
  const t = document.createElement("span"); t.textContent = msg; d.appendChild(t);
  if (withUndo){ const b = document.createElement("button"); b.type = "button"; b.textContent = "復原"; b.onclick = () => undo(); d.appendChild(b); }
  h.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, withUndo ? 5000 : 2000);
  // never over the control just tapped: if it is in the toast's band at the bottom, show the toast at the top instead
  const a = currentAnchor();
  if (a){ const r = a.getBoundingClientRect(), q = d.getBoundingClientRect(); if (r.bottom > q.top - 8 && r.top < q.bottom + 8) d.classList.add("top"); }
  // and a quick second tap meant for something else is never taken as 復原
  if (withUndo){ d.classList.add("fresh"); setTimeout(() => d.classList.remove("fresh"), 500); }
  toastGuard();
}
// The toast's 復原 button must never lie over a control: where it would (now, or after the page scrolls under it),
// the button is dropped and the toast keeps only its text, pointing to the 復原 button in the 數值 panel.
function toastGuard(){
  const d = document.querySelector(".toast"), b = d && d.querySelector("button"); if (!b) return;
  const q = b.getBoundingClientRect();
  for (const e of document.querySelectorAll("button, input, select, textarea, label.check")){
    if (d.contains(e) || !e.getClientRects().length) continue;
    const r = e.getBoundingClientRect();
    if (r.left < q.right + 4 && r.right > q.left - 4 && r.top < q.bottom + 4 && r.bottom > q.top - 4){
      b.remove(); d.firstChild.textContent += "（可按數值區的「復原」還原）"; return;
    }
  }
}
let guardQ = 0;

// ---------- bit ops ----------

// ---------- IEEE 754 ----------

// ---------- color ----------

$("color").addEventListener("input", () => { UI.color = $("color").value; saveUi(); renderColor(parseColor($("color").value)); });

$("colorToValue").onclick = () => {

// ---------- field events ----------
for (const k of ["bin", "oct", "dec", "hex", "cus"]){
  const el = $("f-" + k);

  el.addEventListener("focus", () => { editing = "f-" + k; snapped = false; });
  // leaving the field: apply now; after a very long value, redraw the other fields a moment later so the tap that
  // left the field is handled first
  el.addEventListener("blur", () => { flush(); editing = null; if (el.value.length > 200) setTimeout(render, 0); else render(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); el.blur(); } });
  // very long input (pasting thousands of digits): update the other fields 120 ms after typing stops
  let pending = 0;
  const flush = () => { if (pending){ clearTimeout(pending); pending = 0; apply(true); } }; // blur renders right after
  el.addEventListener("input", () => {

    el.classList.remove("bad"); h.hidden = true;
    if (p.empty){ for (const o of ["bin", "oct", "dec", "hex", "cus"]) if (o !== k) $("f-" + o).value = ""; return; }

}
