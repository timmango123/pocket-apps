<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>幾何霓虹磚</title>
<style>
:root{
--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
--bg:#07070d; --panel:#12121ccc; --panel2:#1a1a28; --line:#2a2a3e; --ink:#eef0ff; --ink2:#9a9cc0; --cy:#00e5ff; --vi:#7c4dff; --pk:#ff4081; --am:#ffab00; --ok:#38e8a0;
--btn:linear-gradient(180deg,#ff5c97,#ff2f78); --btnsh:#b8165a; --sec:#1d1d2c; --secsh:#0c0c14; --ov:#05050bcc; --card:#11111bf2;
}
:root[data-theme="light"]{
--bg:#f4f4f8; --panel:#ffffffd9; --panel2:#ececf4; --line:#d9d9e6; --ink:#1d1d2c; --ink2:#62648a; --ok:#11a96a;
--sec:#ffffff; --secsh:#cfd0e0; --ov:#e9e9f2cc; --card:#fffffff5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ibtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;height:44px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:.5px}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.hstats{display:flex;gap:10px;font-size:11px;color:var(--ink2);white-space:nowrap;text-align:center;line-height:1.1}
.hstats b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);display:flex;justify-content:center;align-items:center;gap:10px;z-index:5;pointer-events:none;min-height:62px}
.bottom>*{pointer-events:auto}
.pill{white-space:nowrap;height:48px;min-width:96px;padding:0 16px;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.35}
.pill.ff{color:var(--cy);border-color:#00e5ff66}.pill.ff.on{background:#00e5ff22;box-shadow:0 0 14px #00e5ff55}
.pill.rc{color:var(--am);border-color:#ffab0066}
.hint{font-size:13px;color:var(--ink2);text-align:center;pointer-events:none}
.landscape .bottom{left:auto;top:0;width:calc(var(--sar) + 128px);flex-direction:column;padding:calc(var(--sat) + 64px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) 6px}
.landscape .bottom .pill{min-width:110px}
.landscape .hud{right:auto;width:min(560px,70vw)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0008,0 0 0 1px #ffffff08 inset;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:14px}
.btn{display:block;width:100%;height:50px;border-radius:16px;margin-top:11px;font-weight:800;font-size:16px;background:var(--btn);color:#fff;box-shadow:0 4px 0 var(--btnsh),0 8px 22px #ff408144;letter-spacing:1px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnsh)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh);border:1px solid var(--line)}
.btn.cy{background:linear-gradient(180deg,#38f0ff,#00b8d4);color:#04121a;box-shadow:0 4px 0 #00839a,0 8px 22px #00e5ff33}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.row3{display:flex;gap:8px}.row3 .btn{flex:1;font-size:14px;letter-spacing:0}
.stars{font-size:42px;letter-spacing:6px;margin:4px 0;color:var(--line)}
.stars .on{color:#ffc93d;text-shadow:0 0 16px #ffab00aa;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:18px;margin:6px 0;font-size:12px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 7vh) 20px calc(var(--sab) + 22px)}
.ttl{text-align:center}
.ttl h1{font-size:46px;margin:0;letter-spacing:5px;font-weight:900;color:#fff;text-shadow:0 0 8px #ff4081,0 0 22px #ff4081,0 0 44px #7c4dff}
:root[data-theme="light"] .ttl h1{color:#1d1d2c;text-shadow:0 3px 0 #ff408155,0 0 20px #7c4dff44}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:10px;font-size:15px;letter-spacing:2px}
.tbtns{width:100%;max-width:330px;display:flex;flex-direction:column}
.tbtns .btn{margin-top:10px}
.cont small{display:block;font-size:11px;font-weight:600;opacity:.75;letter-spacing:0;margin-top:-2px}
.btn.cont{display:flex;flex-direction:column;justify-content:center;line-height:1.2}
/* select */
#select{align-items:stretch;padding:0;background:var(--bg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 8px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--pk)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
.lt{aspect-ratio:1/1.1;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:#ffc93d}
.lt .dp{display:flex;gap:2px}.lt .dp i{width:5px;height:5px;border-radius:1.5px;background:var(--line)}
.lt .dn{font-size:9.5px;color:var(--ink2);line-height:1}
.lt.done{border-color:#38e8a066}
.lt.cur{border-color:var(--pk);box-shadow:0 0 0 2px #ff408155,0 0 16px #ff408144}
.lt.lock{opacity:.5}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:30;background:#1d1d2cee;color:#fff;border:1px solid #ffffff22;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .35s}
.helpscroll{max-height:58vh;overflow-y:auto;margin:4px -6px;padding:0 6px;text-align:left;touch-action:pan-y}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:9px 0;background:var(--panel2);border-radius:14px;padding:9px}
.mech canvas{flex:none;width:52px;height:52px;border-radius:10px;background:var(--bg)}
.mech div{font-size:13px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;text-align:left;font-size:14px;font-weight:700}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:38px;min-width:44px;padding:0 9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--pk);color:#fff}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stgrid div{background:var(--panel2);border-radius:14px;padding:10px 6px;font-size:12px;color:var(--ink2)}
.stgrid b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-height:600px){ .ov{align-items:flex-start} #title{padding-top:calc(var(--sat) + 14px)} .ttl h1{font-size:34px} .tbtns .btn{height:44px;margin-top:7px} }
@media (hover:hover){ .btn:hover{filter:brightness(1.08)} .lt:hover{border-color:var(--ink2)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
const stop = e => e.preventDefault();
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
const live = new Set();
const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
Tracked.prototype = AC.prototype;
window.AudioContext = Tracked;
if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
document.addEventListener('visibilitychange', wake);
['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
<button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
<div class="hmid">
<div>
<div class="lvname" id="hLevel">第 1 關</div>
<div class="diff" id="hDiffW">難度 <span class="pips" id="hPips"></span><span id="hDiff">1</span></div>
</div>
<div class="hstats">
<div>回合<b id="hTurn">1</b></div>
<div>彈珠<b id="hBalls">5</b></div>
<div id="hResW">後援<b id="hRes">0</b></div>
</div>
</div>
</div>

<div class="bottom hidden" id="bottom">
<button class="pill" id="bUndo" aria-label="悔一回合"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔一回合</button>
<div class="hint" id="aimHint">按住拖曳瞄準・放開發射</div>
<button class="pill ff hidden" id="bFF" aria-label="快進"><svg viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg>快進</button>
<button class="pill rc hidden" id="bRecall" aria-label="收回彈珠"><svg viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>收回</button>
</div>

<div class="ov" id="title">
<div class="ttl"><h1>幾何霓虹磚</h1><div class="sub">瞄準・連發・打碎所有磚塊</div></div>
<div class="tbtns">
<button class="btn cont hidden" id="tCont"></button>
<button class="btn" id="tPlay">開始遊戲</button>
<div class="row2"><button class="btn sec" id="tSelect">選擇關卡</button><button class="btn sec" id="tEndless">無盡模式</button></div>
<div class="row3"><button class="btn sec" id="tHelp">說明</button><button class="btn sec" id="tStats">統計</button><button class="btn sec" id="tSet">設定</button></div>
</div>
</div>

<div class="ov hidden" id="select">
<div class="selwrap">
<div class="selhead">
<button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<h2>選擇關卡</h2>
<button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
</div>
<div class="selsum" id="selSum"></div>
<div class="grid" id="grid"></div>
</div>
</div>

<div class="ov hidden" id="pause"><div class="card">
<h2>暫停</h2>
<p id="pInfo"></p>
<button class="btn" id="pResume">繼續</button>
<div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pSet">設定</button></div>
<div class="row2"><button class="btn sec" id="pHelp">說明</button><button class="btn sec" id="pHome">主選單</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
<h2 id="wTitle">過關！</h2>
<div class="stars" id="wStars"></div>
<div class="res"><div>回合<b id="wTurns">0</b></div><div>最低餘裕<b id="wMargin">0</b></div><div>總傷害<b id="wDmg">0</b></div></div>
<p id="wMsg"></p>
<button class="btn" id="wNext">下一關</button>
<div class="row3"><button class="btn sec" id="wRetry">再玩</button><button class="btn sec" id="wShare">分享</button><button class="btn sec" id="wSelect">選關</button></div>
</div></div>

<div class="ov hidden" id="lose"><div class="card">
<h2 id="lTitle">磚塊壓線了！</h2>
<p id="lMsg"></p>
<div class="res" id="lRes"></div>
<button class="btn cy" id="lUndo">悔一回合</button>
<div class="row2"><button class="btn" id="lRetry">重來</button><button class="btn sec" id="lSelect">選關</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
<h2>玩法說明</h2>
<div class="helpscroll" id="helpBody"></div>
<button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
<h2 id="iTitle">新機制</h2>
<div id="iBody"></div>
<button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
<h2>設定</h2>
<div id="setBody"></div>
<button class="btn" id="sOk">完成</button>
</div></div>

<div class="ov hidden" id="statsOv"><div class="card">
<h2>統計</h2>
<div class="stgrid" id="stBody"></div>
<button class="btn" id="stOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
var BB = (function () {
var W = 390, COLS = 7, ROWS = 10, C = W / COLS, GAP = 2, R = 7, V = 900, FLOOR = 10 * C + 26;
var LAUNCH_GAP = 0.06, DT = 1 / 120, MAXT = 60, MINA = 8, MAXA = 172;
var SIN_MIN = Math.sin(MINA * Math.PI / 180), COS_MIN = Math.cos(MINA * Math.PI / 180);
var ITEM_R = 15, MAX_BALLS = 120;
// brick kinds: 0 square, 1 triangle(o 0..3), specials via flags
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- shapes ----------
var shapeCache = {};
function shape(cell, tri) { // tri: -1 square, 0..3 right-angle corner BL,BR,TR,TL
var key = cell * 5 + tri + 1, s = shapeCache[key]; if (s) return s;
var c = cell % COLS, r = (cell / COLS) | 0;
var x0 = c * C + GAP, x1 = (c + 1) * C - GAP, y0 = r * C + GAP, y1 = (r + 1) * C - GAP, P;
if (tri < 0) P = [x0, y0, x1, y0, x1, y1, x0, y1];
else if (tri === 0) P = [x0, y0, x1, y1, x0, y1];
else if (tri === 1) P = [x1, y0, x1, y1, x0, y1];
else if (tri === 2) P = [x0, y0, x1, y0, x1, y1];
else P = [x0, y0, x1, y0, x0, y1];
var n = P.length / 2, cx = 0, cy = 0, i;
for (i = 0; i < n; i++) { cx += P[2 * i]; cy += P[2 * i + 1]; } cx /= n; cy /= n;
var E = [];
for (i = 0; i < n; i++) {
var ax = P[2 * i], ay = P[2 * i + 1], bx = P[(2 * i + 2) % (2 * n)], by = P[(2 * i + 3) % (2 * n)];
var ex = bx - ax, ey = by - ay, len = Math.sqrt(ex * ex + ey * ey), nx = ey / len, ny = -ex / len;
if ((cx - ax) * nx + (cy - ay) * ny > 0) { nx = -nx; ny = -ny; }
E.push({ ax: ax, ay: ay, ex: ex, ey: ey, l2: ex * ex + ey * ey, nx: nx, ny: ny });
}
s = { P: P, E: E, n: n, x0: x0, x1: x1, y0: y0, y1: y1 }; shapeCache[key] = s; return s;
}
// earliest hit of moving circle (radius R) from (px,py) along unit (dx,dy) within dist; out={t,nx,ny}
function hitShape(s, px, py, dx, dy, dist, out) {
var best = out.t, found = false, i, e, dn, t, hx, hy, u;
for (i = 0; i < s.n; i++) {
e = s.E[i]; dn = dx * e.nx + dy * e.ny; if (dn >= 0) continue;
var d0 = (px - e.ax) * e.nx + (py - e.ay) * e.ny;
t = (R - d0) / dn; if (t < -0.5) continue; if (t < 0) t = 0;
if (t >= best) continue;
hx = px + dx * t; hy = py + dy * t; u = ((hx - e.ax) * e.ex + (hy - e.ay) * e.ey) / e.l2;
if (u < 0 || u > 1) continue;
best = t; out.nx = e.nx; out.ny = e.ny; found = true;
}
for (i = 0; i < s.n; i++) {
var fx = px - s.P[2 * i], fy = py - s.P[2 * i + 1], b = fx * dx + fy * dy; if (b >= 0) continue;
var cc = fx * fx + fy * fy - R * R, disc = b * b - cc; if (disc < 0) continue;
t = -b - Math.sqrt(disc); if (t < -0.5) continue; if (t < 0) t = 0;
if (t >= best) continue;
hx = px + dx * t - s.P[2 * i]; hy = py + dy * t - s.P[2 * i + 1]; var hl = Math.sqrt(hx * hx + hy * hy) || 1;
best = t; out.nx = hx / hl; out.ny = hy / hl; found = true;
}
if (found) out.t = best;
return found;

$('tEndless').textContent = ST.endless ? '無盡・最高 ' + ST.endless : '無盡模式';
}
function isDone(n){ return !!prog[n]; }
function unlocked(n){ return unlockAll || n === 1 || isDone(n - 1) || isDone(n); }
function highestUnlocked(){ for (var n = 1; n <= NL; n++){ if (!isDone(n)) return unlocked(n) ? n : Math.max(1, n - 1); } return NL; }
var LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
function buildGrid(){
var g = $('grid'), html = '', done = 0, stars = 0, hu = highestUnlocked();
for (var n = 1; n <= NL; n++){
var p = prog[n], s = starsS[n] || 0, lv = LV[n - 1]; if (p){ done++; stars += s; }
var lk = !unlocked(n), cls = 'lt' + (p ? ' done' : '') + (lk ? ' lock' : '') + (n === hu && !p ? ' cur' : '');
var st = ''; for (var i = 0; i < 3; i++) st += '<span class="' + (i < s ? 'on' : '') + '">★</span>';
html += '<button class="' + cls + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + fmtD(lv.diffV) + (lk ? '（未解鎖）' : '') + '">'
+ (lk ? LOCK : '<span class="n">' + n + '</span>') + '<span class="st">' + st + '</span>'
+ '<span class="dp">' + pipsHtml(lv.pips, diffCol(lv.diffV)) + '</span><span class="dn">難度 ' + fmtD(lv.diffV) + '</span></button>';
}
g.innerHTML = html;
$('selSum').textContent = '已過 ' + done + ' / ' + NL + ' 關・星星 ' + stars + ' / ' + NL * 3;
$('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
function goSelect(){
G.paused = false; $('hud').classList.add('hidden'); $('bottom').classList.add('hidden');
if (G.mode !== 'demo') startDemo();
buildGrid(); showOnly('select');
var cur = document.querySelector('.lt.cur'); if (cur){ try{ cur.scrollIntoView({ block: 'center' }); }catch(e){} }
}
$('grid').addEventListener('click', function(e){
var b = e.target.closest('.lt'); if (!b) return; var n = +b.dataset.n; audio();
if (!unlocked(n)){ toast('先通過第 ' + (n - 1) + ' 關，或開啟「解鎖全部關卡」'); return; }
SFX.click(); var sv = sget('save', null);
if (sv && sv.mode === 'level' && sv.n === n) startLevel(n, sv); else startLevel(n);
});
$('unlockSw').addEventListener('click', function(){ audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
$('sBack').addEventListener('click', function(){ SFX.click(); goTitle(); });
$('tPlay').addEventListener('click', function(){ audio(); SFX.click(); startLevel(highestUnlocked()); });
$('tCont').addEventListener('click', function(){ audio(); SFX.click(); var sv = sget('save', null); if (!sv) return refreshTitle(); if (sv.mode === 'endless') startEndless(sv); else startLevel(sv.n, sv); });
$('tSelect').addEventListener('click', function(){ audio(); SFX.click(); goSelect(); });
$('tEndless').addEventListener('click', function(){ audio(); SFX.click(); var sv = sget('save', null); if (sv && sv.mode === 'endless') startEndless(sv); else startEndless(); });
$('bPause').addEventListener('click', function(){ SFX.click(); openPause(); });
$('pResume').addEventListener('click', function(){ SFX.click(); resume(); });
$('pRestart').addEventListener('click', function(){ SFX.click(); sdel('save'); if (G.mode === 'endless') startEndless(); else startLevel(G.n); });
$('pHome').addEventListener('click', function(){ SFX.click(); goTitle(); });
$('bUndo').addEventListener('click', function(){ doUndo(); });
$('bFF').addEventListener('click', function(){ toggleFF(); });
$('bRecall').addEventListener('click', function(){ recallNow(); });
$('wNext').addEventListener('click', function(){ SFX.click(); if (G.n < NL) startLevel(G.n + 1); });
$('wRetry').addEventListener('click', function(){ SFX.click(); startLevel(G.n); });
$('wSelect').addEventListener('click', function(){ SFX.click(); goSelect(); });
$('wShare').addEventListener('click', function(){
SFX.click(); var st = starsS[G.n] || 1, cur = G.S.minMargin >= 4 ? 3 : G.S.minMargin >= 2 ? 2 : 1;
var txt = '幾何霓虹磚 第 ' + G.n + ' 關 ' + '★★★'.slice(0, cur) + ' 最低餘裕 ' + Math.min(9, G.S.minMargin) + ' 列・' + G.S.turn + ' 回合過關！'; void st;
if (navigator.share){ navigator.share({ text: txt }).catch(function(){}); return; }
try{ navigator.clipboard.writeText(txt).then(function(){ toast('已複製：' + txt); }, function(){ toast(txt); }); }catch(e){ toast(txt); }
});
$('lUndo').addEventListener('click', function(){ doUndo(); });
$('lRetry').addEventListener('click', function(){ SFX.click(); if (G.mode === 'endless') startEndless(); else startLevel(G.n); });
$('lSelect').addEventListener('click', function(){ SFX.click(); if (G.mode === 'endless') goTitle(); else goSelect(); });

/* help / intro */
var MECHS = {
1: ['基本玩法', 'base', '拖曳瞄準，放開後整串彈珠依序射出。碰一下扣 1 點，數字歸零磚就碎。每回合結束磚塊下降一列，壓到<b>底線</b>就失敗。'],
11: ['縱向雷射', 'vl', '彈珠穿過時，<b>整欄</b>磚塊各扣 1 點。每經過一次觸發一次，回合結束後消失。'],
21: ['橫向雷射', 'hl', '彈珠穿過時，<b>整排</b>磚塊各扣 1 點。'],
41: ['三角磚', 'tri', '斜邊會讓彈珠轉向 90°，善用它把彈珠送進磚縫。'],
51: ['堅固磚', 'solid', '鐵框包住上方與兩側，<b>只有從下方擊中</b>才會扣血。'],
61: ['分裂', 'split', '彈珠穿過時一分為二，額外的彈珠只在本回合存在。'],
71: ['移動磚', 'move', '每回合結束時往箭頭方向漂移一格，撞到東西就掉頭。'],
81: ['再生磚', 'regen', '綠色＋號的磚每回合回 1 點血，<b>被擊中一次</b>後就不再再生。'],
91: ['全要素', 'all', '所有機制同時登場，出現頻率更高。祝好運！']
};
function mechAt(n){ return MECHS[n] && n > 1 ? MECHS[n] : null; }
function iconCanvas(kind){
var c = document.createElement('canvas'), d = Math.min(2, window.devicePixelRatio || 1); c.width = 52 * d; c.height = 52 * d;
var x = c.getContext('2d'); x.scale(d * 52 / C, d * 52 / C);
var save = ctx; ctx = x;
var fake = { id: -1, c: 0, r: 0, hp: 12, max: 12, tri: -1, solid: 0, mv: 0, regen: 0, elite: 0, flash: 0 }, oldPrev = G.prev, oldPh = G.phase; G.phase = 'idle';
if (kind === 'tri') fake.tri = 0; if (kind === 'solid') fake.solid = 1; if (kind === 'move') fake.mv = 1; if (kind === 'regen') fake.regen = 1;
if (kind === 'vl' || kind === 'hl' || kind === 'split') drawItem({ id: 1, c: 0, r: 0, k: kind, used: 0 }, 0);
else if (kind === 'all'){ x.save(); x.scale(0.5, 0.5); fake.tri = 2; drawBrick(fake, 0); x.translate(C, 0); fake.tri = -1; fake.solid = 1; drawBrick(fake, 0); x.translate(-C, C); fake.solid = 0; fake.regen = 1; drawBrick(fake, 0); x.translate(C, 0); drawItem({ id: 1, c: 0, r: 0, k: 'split', used: 0 }, 0); x.restore(); }
else if (kind === 'base'){ fake.hp = 3; drawBrick(fake, 0); }
else drawBrick(fake, 0);
ctx = save; G.prev = oldPrev; G.phase = oldPh; return c;
}
function mechRow(m){ var d = document.createElement('div'); d.className = 'mech'; d.appendChild(iconCanvas(m[1])); var t = document.createElement('div'); t.innerHTML = '<b>' + m[0] + '</b><br>' + m[2]; d.appendChild(t); return d; }
function showIntro(m){
$('iTitle').textContent = '新機制：' + m[0]; var b = $('iBody'); b.innerHTML = ''; b.appendChild(mechRow(m)); showOnly('intro');
}
$('iOk').addEventListener('click', function(){ SFX.click(); showOnly(null); });
var helpReturn = 'title';
function showHelp(ret){
helpReturn = ret; var b = $('helpBody'); b.innerHTML = '<p>在畫面任一處<b>按住拖曳</b>決定方向（預設：往哪拖就往哪射；設定可改成彈弓式向後拉），放開即發射。拖回起點 30px 內放開可取消；瞄準時用另一指點左右半邊可微調 ±0.5°。</p><p>電腦：滑鼠指向瞄準、點擊發射；←→ 微調、空白鍵發射、F 快進。</p><p>發射 3 秒後可<b>快進</b>，10 秒後可<b>收回</b>彈珠。每關可<b>悔一回合</b>一次。</p><p>星級看磚塊離底線的最低餘裕：始終保持 ≥4 列得 ★★★，≥2 列得 ★★。</p>';
[1, 11, 21, 41, 51, 61, 71, 81].forEach(function(n){ var m = MECHS[n]; var r = mechRow(m); if (n > 1) r.querySelector('b').textContent = m[0] + '（第 ' + n + ' 關起）'; b.appendChild(r); });
b.appendChild(mechRow(['+1 彈珠', 'ball', '吃到後下回合彈珠 +1。']));
showOnly('help');
}
$('tHelp').addEventListener('click', function(){ audio(); SFX.click(); showHelp('title'); });
$('pHelp').addEventListener('click', function(){ SFX.click(); showHelp('pause'); });
$('hOk').addEventListener('click', function(){ SFX.click(); showOnly(helpReturn); });

/* settings */
var setReturn = 'title';
var SETDEF = [
['aim', '瞄準方式', [['point', '指向'], ['sling', '彈弓']]],
['assist', '反彈預覽', [[0, '自動'], [1, '1 次'], [2, '2 次'], [3, '3 次']]],
['theme', '外觀', [['auto', '自動'], ['dark', '深色'], ['light', '淺色']]],
['fx', '發光特效', [[1, '開'], [0, '關']]],
['sound', '音效', [[1, '開'], [0, '關']]],
['vib', '震動', [[1, '開'], [0, '關']]]
];
function buildSettings(){
var h = '';
SETDEF.forEach(function(r){
h += '<div class="setrow"><span>' + r[1] + '</span><div class="seg">';
r[2].forEach(function(o){ h += '<button data-k="' + r[0] + '" data-v="' + o[0] + '" aria-pressed="' + (String(SET[r[0]]) === String(o[0])) + '">' + o[1] + '</button>'; });
h += '</div></div>';
});
$('setBody').innerHTML = h;
}
$('setBody').addEventListener('click', function(e){
var b = e.target.closest('button'); if (!b) return; var k = b.dataset.k, v = b.dataset.v;
SET[k] = (k === 'aim' || k === 'theme') ? v : +v; sset('settings', SET); audio(); SFX.click();
if (k === 'theme') applyTheme(); if (k === 'fx' && SET.fx) glowOK = true;
buildSettings(); updateBottom();
});
function showSettings(ret){ setReturn = ret; buildSettings(); showOnly('settings'); }
$('tSet').addEventListener('click', function(){ audio(); SFX.click(); showSettings('title'); });
$('pSet').addEventListener('click', function(){ SFX.click(); showSettings('pause'); });
$('sOk').addEventListener('click', function(){ SFX.click(); showOnly(setReturn); });
$('tStats').addEventListener('click', function(){
audio(); SFX.click();
var done = 0, stars = 0; for (var n = 1; n <= NL; n++){ if (prog[n]){ done++; stars += starsS[n] || 0; } }
var items = [['過關數', done + ' / ' + NL], ['星星', stars + ' / ' + NL * 3], ['總碰撞次數', ST.hits], ['最佳單回合傷害', ST.best], ['擊碎磚塊', ST.broke], ['發射次數', ST.shots], ['最多彈珠', ST.balls], ['無盡最高回合', ST.endless]];
$('stBody').innerHTML = items.map(function(i){ return '<div>' + i[0] + '<b>' + i[1] + '</b></div>'; }).join('');
showOnly('statsOv');
});
$('stOk').addEventListener('click', function(){ SFX.click(); showOnly('title'); });

/* ---------------- test hooks ---------------- */
window.__bb = {
state: function(){ return { mode: G.mode, n: G.n, phase: G.phase, turn: G.S && G.S.turn, status: G.S && G.S.status, balls: G.S && G.S.balls, aim: G.aimA, aimValid: G.aimValid, runT: G.runT, speed: G.speed, minMargin: G.S && G.S.minMargin, paused: !!G.paused }; },
snapshot: function(){ return ser(G.S); },
field: function(){ return { fx: FX, fy: FY, sc: SC, launchX: G.S.launchX, floor: FLOOR, R: R }; },
autoShot: function(){ if (G.phase === 'aim') fire(BB.bestAngle(G.S, 1, 1).angle); }
};

applyTheme(); layout(); startDemo(); refreshTitle(); startLoop();
})();
