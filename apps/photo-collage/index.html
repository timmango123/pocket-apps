<title>照片拼貼</title>
<style>
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f5f6f9; --ink:#17181c; --muted:#5a5f6d; --line:#d2d5dd; --line-2:#e3e5eb;
  --accent:#b8235a; --accent-ink:#ffffff; --accent-soft:#f6dde6; --stage:#dcdfe6; --stage-line:#c6cad3;
  --shade:rgba(12,13,18,.55); --ok:#1f6d45; --err:#b3261e;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111216; --surface:#1a1c22; --surface-2:#20232a; --ink:#e8e9ee; --muted:#9ca1b0; --line:#323642; --line-2:#272a33;
  --accent:#ff6f9d; --accent-ink:#2b0614; --accent-soft:#3e1726; --stage:#0b0c0f; --stage-line:#2a2d36;
  --shade:rgba(0,0,0,.72); --ok:#6fd39a; --err:#ff8f86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#1a1c22; --surface-2:#20232a; --ink:#e8e9ee; --muted:#9ca1b0; --line:#323642; --line-2:#272a33;
  --accent:#ff6f9d; --accent-ink:#2b0614; --accent-soft:#3e1726; --stage:#0b0c0f; --stage-line:#2a2d36;
  --shade:rgba(0,0,0,.72); --ok:#6fd39a; --err:#ff8f86; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1200px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:50px;margin-bottom:6px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.04em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-left:3px solid var(--accent);padding:6px 10px;border-radius:4px;font-size:13px;margin-bottom:8px}
.note b{font-weight:700}
.note .btn{min-height:44px;font-size:13px}
.work{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stageCol{min-width:0}
.ratios{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.ratios::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;min-width:56px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:14px;font-weight:600}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;display:flex;justify-content:center;align-items:center;background:var(--stage);border-radius:6px;padding:10px;
  background-image:linear-gradient(45deg,var(--stage-line) 25%,transparent 25%,transparent 75%,var(--stage-line) 75%),linear-gradient(45deg,var(--stage-line) 25%,transparent 25%,transparent 75%,var(--stage-line) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
#cv{display:block;touch-action:none;box-shadow:0 1px 0 var(--stage-line),0 6px 24px rgba(0,0,0,.18);cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#emptyHint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:700;color:var(--muted)}
.cellbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.cellbar .lbl{font-size:13px;font-weight:700;padding:0 6px;font-family:var(--mono)}
.cellbar .btn{min-height:44px;padding:0 10px;font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.panes{min-height:176px}
.pane{padding:12px;display:none}
.pane.on{display:block}
.pane h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.tab{min-height:56px;border:0;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
.countRow{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.countRow .chip{min-width:44px;padding:0 10px;font-size:13px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lay{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);cursor:pointer;padding:5px;min-height:56px}
.lay[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lay i{position:absolute;background:var(--muted);opacity:.55;border-radius:1px}
.lay[aria-pressed="true"] i{background:var(--accent);opacity:.8}
.lay .free{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;font-size:11px;font-style:normal;padding:0 4px;border-radius:3px;color:var(--ink);background:var(--surface);opacity:1;width:auto;height:auto;line-height:1.4}
.lay[aria-pressed="true"] .free{background:var(--surface);opacity:1}
.plist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ph{position:relative;flex:none;width:76px;height:76px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph .tag{position:absolute;left:3px;top:3px;font-size:11px;font-family:var(--mono);background:var(--ink);color:var(--bg);padding:0 5px;border-radius:3px;font-weight:700}
.ph .rm{position:absolute;right:0;top:0;width:30px;height:30px;border:0;background:var(--shade);color:#fff;cursor:pointer;font-size:16px;line-height:1;border-bottom-left-radius:6px}
.ph .rm::after{content:"";position:absolute;inset:-7px -0px -7px -7px}
.ph.pool{outline:2px dashed var(--accent);outline-offset:-4px}
.addph{flex:none;width:76px;height:76px;border:1.5px dashed var(--line);border-radius:6px;background:none;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;min-height:44px}
.row label{font-size:14px}
.row output{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:44px;margin:0}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw button{aspect-ratio:1;min-height:36px;border-radius:50%;border:1px solid var(--line);cursor:pointer;position:relative}
.sw button::after{content:"";position:absolute;inset:-4px}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw label.custom{position:relative;aspect-ratio:1;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;font-size:11px;cursor:pointer;overflow:hidden}
.sw label.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px}
.sheet h3{margin:0 0 10px;font-size:17px}
.seg{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.outimg{display:block;max-width:100%;max-height:50vh;margin:10px auto 6px;border:1px solid var(--line)}
.sheetBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:480px){.brand small{display:none}}
@media (hover:hover){.btn:hover{border-color:var(--ink)}.btn.primary:hover{filter:brightness(1.08)}.chip:hover,.lay:hover{border-color:var(--ink)}.tab:hover{color:var(--ink)}}
@media (min-width:900px){
  .work{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .tabs{display:none}
  .pane{display:block;border-bottom:1px solid var(--line-2)}
  .pane:last-child{border-bottom:0}
  .panes{min-height:0}
}
@media (orientation:landscape) and (max-height:500px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="5" width="11" height="20" fill="var(--accent)"/><rect x="18" y="5" width="7" height="9" fill="currentColor"/><rect x="18" y="16" width="7" height="9" fill="currentColor" opacity=".45"/></svg>
      <h1>照片拼貼<small>選版型、拖進照片、輸出一張圖</small></h1>
    </div>
    <button class="btn" id="addTop" type="button">加入照片</button>
    <button class="btn primary" id="exportBtn" type="button">匯出</button>
  </header>
  <div class="note" id="sampleBar" hidden><span><b>範例</b>：目前的照片是程式產生的示範圖，加入你的照片後會自動取代。</span></div>
  <div class="work">
    <section class="stageCol">
      <div class="ratios" role="radiogroup" aria-label="畫布比例" id="ratioRow"></div>
      <div class="stage" id="stage"><canvas id="cv" aria-label="拼貼預覽"></canvas><div id="emptyHint" hidden>先加入照片</div></div>
      <div class="cellbar" id="cellBar" hidden>
        <span class="lbl" id="cellLbl">第 1 格</span>
        <button class="btn" type="button" id="cReplace">換照片</button>
        <button class="btn" type="button" id="cRotate">旋轉 90°</button>
        <button class="btn" type="button" id="cFlip">水平翻轉</button>
        <button class="btn" type="button" id="cClear">清空</button>
        <button class="btn" type="button" id="cDone">完成</button>
      </div>
      <p class="hint">點格子顯示工具列；格內拖曳平移、雙指或滾輪縮放；長按後拖到另一格可互換。</p>
    </section>
    <aside class="panel">
      <div class="panes">
        <div class="pane on" data-pane="layout" role="tabpanel" id="pane-layout">
          <h2>版型</h2>
          <div class="countRow" id="countRow" aria-label="格數"></div>
          <div class="lgrid" id="layoutGrid"></div>
        </div>
        <div class="pane" data-pane="photos" role="tabpanel" id="pane-photos">
          <h2>照片 <span class="small" id="photoCount"></span></h2>
          <div class="plist" id="photoList"></div>
          <p class="small" id="poolHint">點縮圖放進目前選取的格子；虛線框表示尚未放入版型。</p>
        </div>
        <div class="pane" data-pane="frame" role="tabpanel" id="pane-frame">
          <h2>邊框</h2>
          <div class="row"><label for="border">外框</label><input type="range" id="border" min="0" max="80" step="1"><output id="borderOut"></output></div>
          <div class="row"><label for="gap">內間距</label><input type="range" id="gap" min="0" max="60" step="1"><output id="gapOut"></output></div>
          <div class="row"><label for="radius">圓角</label><input type="range" id="radius" min="0" max="50" step="1"><output id="radiusOut"></output></div>
          <p class="small">寬度以 1080px 寬為基準，輸出其他尺寸時等比換算。</p>
        </div>
        <div class="pane" data-pane="bg" role="tabpanel" id="pane-bg">
          <h2>背景</h2>
          <div class="sw" id="swatches"></div>
          <label class="check" for="blurBg"><input type="checkbox" id="blurBg"> 用第一張照片做模糊背景</label>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="設定分頁">
        <button class="tab" role="tab" type="button" data-tab="layout" aria-selected="true" aria-controls="pane-layout" id="tab-layout">版型</button>
        <button class="tab" role="tab" type="button" data-tab="photos" aria-selected="false" aria-controls="pane-photos" id="tab-photos">照片</button>
        <button class="tab" role="tab" type="button" data-tab="frame" aria-selected="false" aria-controls="pane-frame" id="tab-frame">邊框</button>
        <button class="tab" role="tab" type="button" data-tab="bg" aria-selected="false" aria-controls="pane-bg" id="tab-bg">背景</button>
      </nav>
    </aside>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple aria-label="選擇照片">

<div class="ov" id="exportOv" hidden role="dialog" aria-modal="true" aria-labelledby="exTitle">
  <div class="sheet">
    <h3 id="exTitle">匯出拼貼</h3>
    <div class="small">寬度</div>
    <div class="seg" id="outWSeg" role="radiogroup" aria-label="輸出寬度"></div>
    <div class="small">格式</div>
    <div class="seg" id="fmtSeg" role="radiogroup" aria-label="輸出格式"></div>
    <div class="small" id="exInfo"></div>
    <img class="outimg" id="outImg" alt="匯出結果" hidden>
    <p class="small" id="outImgHint" hidden>此環境無法直接下載：請長按（或右鍵）圖片另存。</p>
    <div class="sheetBtns">
      <button class="btn" type="button" id="exClose">關閉</button>
      <button class="btn primary" type="button" id="exGo">下載</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='photo-collage:v1:settings';
const RATIOS=[['1:1',1,1],['4:5',4,5],['9:16',9,16],['3:4',3,4],['16:9',16,9]];
const SWATCHES=['#ffffff','#f3efe7','#e9ecef','#1b1b1f','#000000','#d9c4a3','#c9d8cf','#b9cde0','#f2c4ce','#f6d26b','#7a1f3d','#24405e'];

/* ---------- layouts ---------- */
const R=(counts,sizes)=>{sizes=sizes||counts.map(()=>1);const tot=sizes.reduce((a,b)=>a+b,0);let y=0;const out=[];
  counts.forEach((c,i)=>{const h=sizes[i]/tot;for(let j=0;j<c;j++)out.push({x:j/c,y,w:1/c,h});y+=h;});return out;};
const C=(counts,sizes)=>R(counts,sizes).map(c=>({x:c.y,y:c.x,w:c.h,h:c.w}));
const t3=1/3;
const big3=[{x:0,y:0,w:2*t3,h:2*t3},{x:2*t3,y:0,w:t3,h:t3},{x:2*t3,y:t3,w:t3,h:t3},{x:0,y:2*t3,w:t3,h:t3},{x:t3,y:2*t3,w:t3,h:t3},{x:2*t3,y:2*t3,w:t3,h:t3}];
const bigLeft4=[{x:0,y:0,w:.5,h:1},{x:.5,y:0,w:.25,h:.5},{x:.75,y:0,w:.25,h:.5},{x:.5,y:.5,w:.25,h:.5},{x:.75,y:.5,w:.25,h:.5}];
const bigLeft8=[{x:0,y:0,w:.5,h:1}].concat(R([2,2,2,2]).map(c=>({x:.5+c.x/2,y:c.y,w:c.w/2,h:c.h})));
const LAYOUTS=[
  ['1a',R([1])],
  ['2a',C([1,1])],['2b',R([1,1])],['2c',C([1,1],[2,1])],['2d',R([1,1],[2,1])],
  ['3a',C([1,1,1])],['3b',R([1,1,1])],['3c',C([1,2])],['3d',R([1,2])],['3e',C([2,1])],['3f',R([2,1])],
  ['4a',R([2,2])],['4b',C([1,3],[2,1])],['4c',R([1,3],[2,1])],['4d',R([1,1,1,1])],['4e',C([1,1,1,1])],['4f',C([3,1],[1,2])],
  ['5a',R([2,3])],['5b',R([3,2])],['5c',bigLeft4],['5d',R([1,4],[3,2])],
  ['6a',R([3,3])],['6b',R([2,2,2])],['6c',big3],['6d',R([1,2,3],[2,1.2,1])],
  ['7a',R([3,4])],['7b',R([2,3,2])],['7c',R([1,3,3],[1.4,1,1])],
  ['8a',R([4,4])],['8b',R([3,2,3])],['8c',R([2,2,2,2])],
  ['9a',R([3,3,3])],['9b',R([4,1,4],[1,1.4,1])],['9c',bigLeft8],
].map(([id,cells])=>({id,cells}));
function freeGrid(n){n=Math.max(1,n);const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);const counts=[];let left=n;
  for(let r=0;r<rows;r++){const c=Math.min(cols,left);counts.push(c);left-=c;}return {id:'free'+n,cells:R(counts),free:true};}
function getLayout(id){ if(/^free\d+$/.test(id)) return freeGrid(+id.slice(4)); return LAYOUTS.find(l=>l.id===id)||LAYOUTS[0]; }
function firstLayoutFor(n){ n=Math.min(9,Math.max(1,n)); return LAYOUTS.find(l=>l.cells.length===n)||freeGrid(n); }

/* ---------- state ---------- */
const st={ratio:'4:5',layoutId:'4a',border:24,gap:16,radius:0,bg:'#ffffff',blurBg:false,outW:2160,fmt:'jpg',
  cells:[], photos:[], sel:-1, browseN:0};
let pidSeq=1;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object'){
  for(const k of ['ratio','layoutId','border','gap','radius','bg','blurBg','outW','fmt']) if(k in s) st[k]=s[k];
  if(!RATIOS.some(r=>r[0]===st.ratio)) st.ratio='4:5';
  if(![1080,2160,3240].includes(st.outW)) st.outW=2160; if(!['jpg','png'].includes(st.fmt)) st.fmt='jpg';
  if(!/^#[0-9a-f]{6}$/i.test(st.bg)) st.bg='#ffffff';
}}catch(e){}
let saveT=0;
function saveSettings(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({ratio:st.ratio,layoutId:st.layoutId,border:st.border,gap:st.gap,radius:st.radius,bg:st.bg,blurBg:st.blurBg,outW:st.outW,fmt:st.fmt}));}catch(e){}},250);}

const ratioOf=()=>{const r=RATIOS.find(r=>r[0]===st.ratio)||RATIOS[1];return r[2]/r[1];}; // H/W
const layout=()=>getLayout(st.layoutId);
const photoById=id=>st.photos.find(p=>p.id===id);
const newCell=()=>({pid:null,ox:0,oy:0,s:1,rot:0,flip:false});
function syncCells(){ const n=layout().cells.length; while(st.cells.length<n) st.cells.push(newCell()); if(st.cells.length>n) st.cells.length=n;
  st.cells.forEach(c=>{ if(c.pid!=null && !photoById(c.pid)) Object.assign(c,newCell()); }); if(st.sel>=n) st.sel=-1; }
function placedIds(){ return new Set(st.cells.map(c=>c.pid).filter(v=>v!=null)); }
function fillEmpty(){ const used=placedIds(); const pool=st.photos.filter(p=>!used.has(p.id));
  for(const c of st.cells){ if(c.pid==null && pool.length){ Object.assign(c,newCell(),{pid:pool.shift().id}); } } }

/* ---------- geometry ---------- */
function cellRects(W,H,cells){
  const k=W/1080, b=st.border*k, g=st.gap*k, cw=W-2*b, ch=H-2*b, e=1e-6;
  return cells.map(c=>{ let x0=b+c.x*cw, y0=b+c.y*ch, x1=b+(c.x+c.w)*cw, y1=b+(c.y+c.h)*ch;
    if(c.x>e) x0+=g/2; if(c.y>e) y0+=g/2; if(c.x+c.w<1-e) x1-=g/2; if(c.y+c.h<1-e) y1-=g/2;
    return {x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)}; });
}
function fitInfo(cell,ph,r){ // drawn size of photo in cell rect
  const odd=cell.rot%2!==0, iw=odd?ph.h:ph.w, ih=odd?ph.w:ph.h;
  const base=Math.max(r.w/iw,r.h/ih), k=base*cell.s; return {k,dw:iw*k,dh:ih*k}; }
function clampCell(cell,r){ const ph=photoById(cell.pid); if(!ph) return; const f=fitInfo(cell,ph,r);
  const mx=Math.abs(f.dw-r.w)/2/r.w, my=Math.abs(f.dh-r.h)/2/r.h;
  cell.ox=Math.max(-mx,Math.min(mx,cell.ox)); cell.oy=Math.max(-my,Math.min(my,cell.oy)); }
function rrPath(ctx,x,y,w,h,rad){ ctx.beginPath(); rad=Math.max(0,Math.min(rad,w/2,h/2));
  if(!rad){ctx.rect(x,y,w,h);return;}
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,rad);return;}
  ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath(); }
const hasFilter=(()=>{try{const c=document.createElement('canvas').getContext('2d');return 'filter' in c;}catch(e){return false;}})();

function render(ctx,W,H,opt){
  opt=opt||{}; const L=layout(), rects=cellRects(W,H,L.cells), k=W/1080;
  ctx.save(); ctx.setTransform(opt.scale||1,0,0,opt.scale||1,0,0);
  ctx.fillStyle=st.bg; ctx.fillRect(0,0,W,H);
  const first=st.cells.map(c=>photoById(c.pid)).find(Boolean)||st.photos[0];
  if(st.blurBg && first){
    const img=first.bmp, sc=Math.max(W/first.w,H/first.h)*1.15, dw=first.w*sc, dh=first.h*sc;
    if(hasFilter){ ctx.save(); ctx.filter=`blur(${Math.round(40*k)}px)`; ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh); ctx.restore(); }
    else { const t=document.createElement('canvas'); t.width=Math.max(1,Math.round(W/16)); t.height=Math.max(1,Math.round(H/16));
      const tx=t.getContext('2d'); tx.drawImage(img,(t.width-dw/16)/2,(t.height-dh/16)/2,dw/16,dh/16); ctx.imageSmoothingQuality='high'; ctx.drawImage(t,0,0,W,H); }
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(0,0,W,H);
  }
  rects.forEach((r,i)=>{
    const cell=st.cells[i]; const ph=cell&&photoById(cell.pid);
    const rad=Math.min(r.w,r.h)*st.radius/100;
    if(ph){
      const f=fitInfo(cell,ph,r);
      ctx.save(); rrPath(ctx,r.x,r.y,r.w,r.h,rad); ctx.clip();
      ctx.translate(r.x+r.w/2+cell.ox*r.w, r.y+r.h/2+cell.oy*r.h);
      ctx.rotate(cell.rot*Math.PI/2); if(cell.flip) ctx.scale(-1,1);
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      ctx.drawImage(ph.bmp,-ph.w*f.k/2,-ph.h*f.k/2,ph.w*f.k,ph.h*f.k);
      ctx.restore();
    } else if(opt.preview){
      ctx.save(); rrPath(ctx,r.x,r.y,r.w,r.h,rad); ctx.fillStyle='rgba(128,128,128,.14)'; ctx.fill();
      ctx.setLineDash([8*k,6*k]); ctx.lineWidth=2*k; ctx.strokeStyle='rgba(110,110,120,.8)';
      rrPath(ctx,r.x+k,r.y+k,r.w-2*k,r.h-2*k,rad); ctx.stroke(); ctx.setLineDash([]);
      const s=Math.min(r.w,r.h)*.18; ctx.lineWidth=Math.max(2,4*k); ctx.beginPath(); const cx=r.x+r.w/2, cy=r.y+r.h/2;
      ctx.moveTo(cx-s/2,cy);ctx.lineTo(cx+s/2,cy);ctx.moveTo(cx,cy-s/2);ctx.lineTo(cx,cy+s/2);ctx.stroke(); ctx.restore();
    }
    if(opt.preview && (i===opt.sel || i===opt.target)){
      ctx.save(); ctx.lineWidth=Math.max(3,5*k); ctx.strokeStyle=i===opt.target?'#ffd400':'#ff3d7f';
      rrPath(ctx,r.x+ctx.lineWidth/2,r.y+ctx.lineWidth/2,r.w-ctx.lineWidth,r.h-ctx.lineWidth,rad); ctx.stroke(); ctx.restore();
    }
  });
  ctx.restore();
  return rects;
}

/* ---------- preview canvas ---------- */
const cv=$('#cv'), cx=cv.getContext('2d'), stage=$('#stage');
let pv={cssW:300,cssH:375,dpr:1,W:300,H:375};
function sizeCanvas(){
  const avail=stage.clientWidth-20; const wide=matchMedia('(min-width:900px)').matches;
  const landscape=innerWidth>innerHeight && innerHeight<500;
  const maxH=Math.max(160,innerHeight*(wide?0.78:landscape?0.72:0.55));
  const r=ratioOf(); let w=avail, h=w*r; if(h>maxH){h=maxH;w=h/r;}
  const dpr=Math.min(3,window.devicePixelRatio||1);
  pv={cssW:Math.round(w),cssH:Math.round(h),dpr,W:Math.round(w*dpr),H:Math.round(w*dpr*r)};
  cv.style.width=pv.cssW+'px'; cv.style.height=pv.cssH+'px'; cv.width=pv.W; cv.height=pv.H; draw();
}
let raf=0, swapState=null;
function draw(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; render(cx,pv.W,pv.H,{preview:true,sel:st.sel,target:swapState&&swapState.target});
  $('#emptyHint').hidden=st.photos.length>0; }); }

/* ---------- photos ---------- */
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status'); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
async function decodeFile(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){}
  const url=URL.createObjectURL(file);
  try{ const img=new Image(); img.src=url; await img.decode(); const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); return c; }
  finally{ URL.revokeObjectURL(url); }
}
function shrink(src,maxEdge){ const w=src.width,h=src.height,sc=Math.min(1,maxEdge/Math.max(w,h)); if(sc>=1) return src;
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close(); return c; }
function thumbOf(src){ const c=document.createElement('canvas'),s=152/Math.min(src.width,src.height); c.width=152;c.height=152;
  const x=c.getContext('2d'); x.drawImage(src,(152-src.width*s)/2,(152-src.height*s)/2,src.width*s,src.height*s); return c.toDataURL('image/jpeg',.8); }
function addPhotoObj(src,sample){ const p={id:pidSeq++,bmp:src,w:src.width,h:src.height,thumb:thumbOf(src),sample:!!sample}; st.photos.push(p); return p; }

async function importFiles(files){
  files=[...files].filter(f=>f && (/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i.test(f.name)));
  if(!files.length) return;
  if(st.photos.some(p=>p.sample)){ st.photos=st.photos.filter(p=>!p.sample); st.cells.forEach(c=>Object.assign(c,newCell())); st.sel=-1; }
  const target=pendingCell; pendingCell=-1; let ok=0, shrunk=false;
  for(const f of files){
    try{ let b=await decodeFile(f); if(Math.max(b.width,b.height)>3000){ shrunk=shrunk||Math.max(b.width,b.height)>8192; b=shrink(b,3000);} const p=addPhotoObj(b,false); ok++;
      if(target>=0 && ok===1 && st.cells[target]){ Object.assign(st.cells[target],newCell(),{pid:p.id}); }
    }catch(e){ toast(/heic|heif/i.test(f.name)?'此格式無法解碼，請先轉成 JPG':'無法讀取：'+f.name); }
  }
  if(!ok) return;
  if(target<0){ const n=st.photos.length; if(n<=9 && layout().cells.length!==n){ setLayout(firstLayoutFor(n).id,true); } }
  syncCells(); fillEmpty(); st.browseN=0;
  if(shrunk) toast('超大照片已縮小以免記憶體不足');
  refreshAll();
}
let pendingCell=-1;
function pickFiles(cellIdx){ pendingCell=cellIdx??-1; const fi=$('#fileInput'); fi.value=''; fi.click(); }
$('#fileInput').addEventListener('change',e=>importFiles(e.target.files));
$('#addTop').addEventListener('click',()=>pickFiles(-1));
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',e=>{e.preventDefault(); if(e.dataTransfer&&e.dataTransfer.files.length){ pendingCell=-1; importFiles(e.dataTransfer.files); }});
document.addEventListener('paste',e=>{const fs=e.clipboardData&&e.clipboardData.files; if(fs&&fs.length){ pendingCell=-1; importFiles(fs); }});

function makeSamples(){
  const scenes=[
    ['#f6b26b','#e0567a','#3a2a5a','海邊夕陽'],['#bfe3f2','#5aa6c9','#24506e','藍色港口'],
    ['#d9ecc4','#7fb069','#2f5d3a','山間步道'],['#fbe3c4','#d99058','#6b3b2a','老街午後'],
  ];
  scenes.forEach((s,i)=>{
    const c=document.createElement('canvas'); const land=i%2===0; c.width=land?1500:1100; c.height=land?1100:1500; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,c.height); g.addColorStop(0,s[0]); g.addColorStop(.62,s[1]); g.addColorStop(1,s[2]); x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='rgba(255,255,255,.75)'; x.beginPath(); x.arc(c.width*(.3+.12*i),c.height*.32,c.width*.08,0,7); x.fill();
    x.fillStyle=s[2]; x.beginPath(); x.moveTo(0,c.height*.75);
    for(let k=0;k<=12;k++){ x.lineTo(c.width*k/12, c.height*(.68+.08*Math.sin(k*1.3+i*2)+.04*Math.cos(k*3.1))); }
    x.lineTo(c.width,c.height); x.lineTo(0,c.height); x.closePath(); x.fill();
    x.font='700 60px system-ui, sans-serif'; x.textBaseline='middle'; x.textAlign='center';
    const label='範例 '+(i+1)+'・'+s[3], tw=x.measureText(label).width+56, ly=c.height*.5;
    x.fillStyle='rgba(0,0,0,.5)'; x.fillRect((c.width-tw)/2,ly-50,tw,100); x.fillStyle='#fff'; x.fillText(label,c.width/2,ly);
    addPhotoObj(c,true);
  });
}

/* ---------- UI builders ---------- */
function buildRatios(){ const row=$('#ratioRow'); row.innerHTML='';
  RATIOS.forEach(([id])=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.id='ratio-'+id.replace(':','x'); b.setAttribute('role','radio'); b.textContent=id; b.dataset.r=id;
    b.setAttribute('aria-checked',String(id===st.ratio)); row.appendChild(b); }); }
$('#ratioRow').addEventListener('click',e=>{const b=e.target.closest('[data-r]'); if(!b) return; st.ratio=b.dataset.r; buildRatios(); saveSettings(); sizeCanvas(); });
function layoutThumb(L,pressed){ const b=document.createElement('button'); b.type='button'; b.className='lay'; b.dataset.id=L.id; b.id='lay-'+L.id; b.setAttribute('aria-pressed',String(pressed));
  b.setAttribute('aria-label',(L.free?'自由網格 ':'版型 ')+L.cells.length+' 格');
  L.cells.forEach(c=>{ const i=document.createElement('i'); i.style.left=`calc(5px + ${c.x} * (100% - 10px) + 1.5px)`; i.style.top=`calc(5px + ${c.y} * (100% - 10px) + 1.5px)`;
    i.style.width=`calc(${c.w} * (100% - 10px) - 3px)`; i.style.height=`calc(${c.h} * (100% - 10px) - 3px)`; b.appendChild(i); });
  if(L.free){ const t=document.createElement('i'); t.className='free'; t.textContent='自由'; b.appendChild(t); }
  return b; }
function buildLayouts(){
  const n=st.browseN||Math.min(9,Math.max(1,st.photos.length||layout().cells.length));
  const cr=$('#countRow'); cr.innerHTML='';
  for(let i=1;i<=9;i++){ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.id='cnt-'+i; b.textContent=i+' 格'; b.dataset.n=i; b.setAttribute('aria-pressed',String(i===n)); cr.appendChild(b); }
  const g=$('#layoutGrid'); g.innerHTML='';
  LAYOUTS.filter(l=>l.cells.length===n).forEach(L=>g.appendChild(layoutThumb(L,L.id===st.layoutId)));
  const f=freeGrid(n); if(n>2) g.appendChild(layoutThumb(f,f.id===st.layoutId));
}
$('#countRow').addEventListener('click',e=>{const b=e.target.closest('[data-n]'); if(!b) return; st.browseN=+b.dataset.n; buildLayouts();});
$('#layoutGrid').addEventListener('click',e=>{const b=e.target.closest('[data-id]'); if(!b) return; setLayout(b.dataset.id); });
function setLayout(id,quiet){ st.layoutId=id; syncCells(); fillEmpty(); saveSettings(); if(!quiet) refreshAll(); }

function buildPhotos(){
  const used=new Map(); st.cells.forEach((c,i)=>{ if(c.pid!=null) used.set(c.pid,i+1); });
  const L=$('#photoList'); L.innerHTML='';
  st.photos.forEach(p=>{ const b=document.createElement('div'); b.className='ph'+(used.has(p.id)?'':' pool'); b.setAttribute('role','button'); b.tabIndex=0; b.dataset.pid=p.id; b.id='ph-'+p.id;
    b.setAttribute('aria-label',(used.has(p.id)?'第 '+used.get(p.id)+' 格的照片':'未放入的照片')+(st.sel>=0?'，點一下放進第 '+(st.sel+1)+' 格':''));
    const im=document.createElement('img'); im.src=p.thumb; im.alt=''; b.appendChild(im);
    if(used.has(p.id)){ const t=document.createElement('span'); t.className='tag'; t.textContent=used.get(p.id); b.appendChild(t); }
    const rm=document.createElement('button'); rm.type='button'; rm.className='rm'; rm.textContent='×'; rm.dataset.rm=p.id; rm.setAttribute('aria-label','移除這張照片'); b.appendChild(rm);
    L.appendChild(b); });
  const add=document.createElement('button'); add.type='button'; add.className='addph'; add.id='addPhoto'; add.textContent='＋ 加入'; L.appendChild(add);
  const pool=st.photos.length-used.size;
  $('#photoCount').textContent=st.photos.length+' 張'+(pool>0?`（${pool} 張待用）`:'');
}
$('#photoList').addEventListener('click',e=>{
  if(e.target.closest('#addPhoto')){ pickFiles(-1); return; }
  const rm=e.target.closest('[data-rm]');
  if(rm){ const id=+rm.dataset.rm; const p=photoById(id); st.photos=st.photos.filter(q=>q.id!==id); st.cells.forEach(c=>{if(c.pid===id) Object.assign(c,newCell());});
    if(p&&p.bmp.close) try{p.bmp.close();}catch(_){} fillEmpty(); refreshAll(); return; }
  const ph=e.target.closest('[data-pid]'); if(!ph) return; placePhoto(+ph.dataset.pid);
});
$('#photoList').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset.pid){ e.preventDefault(); placePhoto(+e.target.dataset.pid);} });
function placePhoto(pid){
  let idx=st.sel; if(idx<0) idx=st.cells.findIndex(c=>c.pid==null);
  if(idx<0){ toast('先點選要放入的格子'); return; }
  const from=st.cells.findIndex(c=>c.pid===pid);
  if(from===idx){ return; }
  if(from>=0){ const a=st.cells[from], b=st.cells[idx]; st.cells[from]=b; st.cells[idx]=a; }
  else Object.assign(st.cells[idx],newCell(),{pid});
  refreshAll();
}
function buildSwatches(){ const w=$('#swatches'); w.innerHTML='';
  SWATCHES.forEach((c,i)=>{ const b=document.createElement('button'); b.type='button'; b.style.background=c; b.dataset.c=c; b.id='sw-'+i; b.setAttribute('aria-label','背景色 '+c); b.setAttribute('aria-pressed',String(!st.blurBg&&st.bg.toLowerCase()===c)); w.appendChild(b); });
  const l=document.createElement('label'); l.className='custom'; l.htmlFor='bgCustom'; l.style.background=SWATCHES.includes(st.bg.toLowerCase())?'':st.bg;
  l.innerHTML='自訂<input type="color" id="bgCustom" aria-label="自訂背景色">'; l.querySelector('input').value=st.bg; w.appendChild(l);
  $('#blurBg').checked=st.blurBg; }
$('#swatches').addEventListener('click',e=>{const b=e.target.closest('[data-c]'); if(!b) return; st.bg=b.dataset.c; st.blurBg=false; buildSwatches(); saveSettings(); draw();});
$('#swatches').addEventListener('input',e=>{ if(e.target.id!=='bgCustom') return; st.bg=e.target.value; st.blurBg=false; $('#blurBg').checked=false;
  e.target.parentNode.style.background=st.bg; $('#swatches').querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed','false')); saveSettings(); draw(); });
$('#blurBg').addEventListener('change',e=>{ st.blurBg=e.target.checked; buildSwatches(); saveSettings(); draw(); });
for(const [id,fmt] of [['border',v=>v+'px'],['gap',v=>v+'px'],['radius',v=>v+'%']]){
  const el=$('#'+id); el.value=st[id]; $('#'+id+'Out').textContent=fmt(st[id]);
  el.addEventListener('input',()=>{ st[id]=+el.value; $('#'+id+'Out').textContent=fmt(st[id]); clampAll(); saveSettings(); draw(); });
}
function clampAll(){ const rects=cellRects(1080,1080*ratioOf(),layout().cells); st.cells.forEach((c,i)=>clampCell(c,rects[i])); }
document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]'); if(t) showTab(t.dataset.tab);});
function showTab(name){ document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===name)));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===name)); }

/* ---------- cell toolbar ---------- */
function selectCell(i){ st.sel=i; const bar=$('#cellBar'); bar.hidden=i<0; if(i>=0){ $('#cellLbl').textContent='第 '+(i+1)+' 格'; const has=st.cells[i]&&st.cells[i].pid!=null;
  ['cRotate','cFlip','cClear'].forEach(id=>$('#'+id).disabled=!has); $('#cReplace').textContent=has?'換照片':'加入照片'; }
  buildPhotos(); draw(); }
$('#cReplace').addEventListener('click',()=>{ if(st.sel<0) return; const pool=st.photos.filter(p=>!placedIds().has(p.id));
  if(pool.length && !st.photos.some(p=>p.sample)){ showTab('photos'); toast('點下方照片放進第 '+(st.sel+1)+' 格，或從「＋ 加入」選新照片'); } else pickFiles(st.sel); });
$('#cRotate').addEventListener('click',()=>{ const c=st.cells[st.sel]; if(!c||c.pid==null) return; c.rot=(c.rot+1)%4; c.ox=c.oy=0; clampAll(); draw(); });
$('#cFlip').addEventListener('click',()=>{ const c=st.cells[st.sel]; if(!c||c.pid==null) return; c.flip=!c.flip; c.ox=-c.ox; draw(); });
$('#cClear').addEventListener('click',()=>{ const c=st.cells[st.sel]; if(!c) return; Object.assign(c,newCell()); selectCell(st.sel); });
$('#cDone').addEventListener('click',()=>selectCell(-1));

/* ---------- gestures ---------- */
const pts=new Map(); let g=null;
function toOut(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*1080, y:(e.clientY-r.top)/r.height*1080*ratioOf()}; }
function hit(p){ const rects=cellRects(1080,1080*ratioOf(),layout().cells); return {idx:rects.findIndex(r=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h),rects}; }
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ const p=toOut(e), h=hit(p); g={mode:'tap',idx:h.idx,start:{x:e.clientX,y:e.clientY},last:{x:e.clientX,y:e.clientY},rects:h.rects};
    if(h.idx>=0 && st.cells[h.idx].pid!=null){ g.lp=setTimeout(()=>{ if(g&&g.mode==='tap'){ g.mode='swap'; swapState={from:g.idx,target:-1}; st.sel=g.idx; navigator.vibrate?.(8); draw(); } },400); }
  } else if(pts.size===2 && g){ clearTimeout(g.lp); const [a,b]=[...pts.values()]; const c=st.cells[g.idx];
    if(g.idx>=0&&c&&c.pid!=null){ g.mode='pinch'; g.d0=Math.hypot(a.x-b.x,a.y-b.y)||1; g.s0=c.s; } swapState=null; }
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.mode==='pinch' && pts.size>=2){ const [a,b]=[...pts.values()]; const c=st.cells[g.idx]; c.s=Math.max(.5,Math.min(5,g.s0*Math.hypot(a.x-b.x,a.y-b.y)/g.d0)); clampCell(c,g.rects[g.idx]); draw(); return; }
  if(g.mode==='tap' && Math.hypot(e.clientX-g.start.x,e.clientY-g.start.y)>6){ clearTimeout(g.lp); g.mode=(g.idx>=0&&st.cells[g.idx].pid!=null)?'pan':'none'; }
  if(g.mode==='pan'){ const r=cv.getBoundingClientRect(), k=1080/r.width, c=st.cells[g.idx], rc=g.rects[g.idx];
    c.ox+=(e.clientX-g.last.x)*k/rc.w; c.oy+=(e.clientY-g.last.y)*k/rc.h; clampCell(c,rc); draw(); }
  if(g.mode==='swap'){ const h=hit(toOut(e)); swapState.target=(h.idx>=0&&h.idx!==g.idx)?h.idx:-1; draw(); }
  g.last={x:e.clientX,y:e.clientY};
});
function endPointer(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if(!g) return;
  if(pts.size>0){ if(g.mode==='pinch'){ g.mode='none'; } return; }
  clearTimeout(g.lp);
  if(g.mode==='tap' && e.type==='pointerup'){ if(g.idx>=0){ if(st.cells[g.idx].pid==null && !st.photos.some(p=>!placedIds().has(p.id))) { selectCell(g.idx); pickFiles(g.idx); } else selectCell(st.sel===g.idx?-1:g.idx); } else selectCell(-1); }
  if(g.mode==='swap'){ const t=swapState&&swapState.target; if(t>=0){ const a=st.cells[g.idx]; st.cells[g.idx]=st.cells[t]; st.cells[t]=a; st.sel=t; clampAll(); toast('已互換第 '+(g.idx+1)+' 與第 '+(t+1)+' 格'); }
    swapState=null; selectCell(st.sel); }
  g=null; draw();
}
cv.addEventListener('pointerup',endPointer); cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ const h=hit(toOut(e)); if(h.idx<0) return; const c=st.cells[h.idx]; if(c.pid==null) return; e.preventDefault();
  c.s=Math.max(.5,Math.min(5,c.s*Math.exp(-e.deltaY*0.0015))); clampCell(c,h.rects[h.idx]); draw(); },{passive:false});

/* ---------- export ---------- */
let dl=null;
(async()=>{ try{ dl=await window.claude?.use?.('downloads')||null; }catch(e){ dl=null; } $('#exGo').textContent=dl?'下載':'產生圖片'; })();
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;};
function exportCanvas(){ const W=st.outW, H=Math.round(W*ratioOf()); const c=document.createElement('canvas'); c.width=W; c.height=H; render(c.getContext('2d'),W,H,{}); return c; }
function exportBlob(){ const c=exportCanvas(); return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),st.fmt==='png'?'image/png':'image/jpeg',.92)); }
function buildExport(){
  const ws=$('#outWSeg'); ws.innerHTML=''; [1080,2160,3240].forEach(w=>{const b=document.createElement('button'); b.type='button'; b.className='chip'; b.id='outw-'+w; b.dataset.w=w; b.textContent=w; b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(st.outW===w)); ws.appendChild(b);});
  const fs=$('#fmtSeg'); fs.innerHTML=''; [['jpg','JPG 92%'],['png','PNG']].forEach(([f,t])=>{const b=document.createElement('button'); b.type='button'; b.className='chip'; b.id='fmt-'+f; b.dataset.f=f; b.textContent=t; b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(st.fmt===f)); fs.appendChild(b);});
  $('#exInfo').textContent=`輸出尺寸 ${st.outW} × ${Math.round(st.outW*ratioOf())} px`+(st.cells.some(c=>c.pid==null)?'，空格以背景色填滿':'');
}
$('#outWSeg').addEventListener('click',e=>{const b=e.target.closest('[data-w]'); if(!b) return; st.outW=+b.dataset.w; saveSettings(); buildExport(); hideOut();});
$('#fmtSeg').addEventListener('click',e=>{const b=e.target.closest('[data-f]'); if(!b) return; st.fmt=b.dataset.f; saveSettings(); buildExport(); hideOut();});
let outURL=null; function hideOut(){ $('#outImg').hidden=true; $('#outImgHint').hidden=true; if(outURL){URL.revokeObjectURL(outURL); outURL=null;} }
$('#exportBtn').addEventListener('click',()=>{ if(!st.photos.length){ toast('先加入照片'); return; } buildExport(); hideOut(); $('#exportOv').hidden=false; $('#exGo').focus(); });
$('#exClose').addEventListener('click',()=>{ $('#exportOv').hidden=true; hideOut(); $('#exportBtn').focus(); });
$('#exportOv').addEventListener('click',e=>{ if(e.target.id==='exportOv') $('#exClose').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#exportOv').hidden) $('#exClose').click(); });
$('#exGo').addEventListener('click',async()=>{
  const btn=$('#exGo'); btn.disabled=true; const old=btn.textContent; btn.textContent='處理中…';
  try{ const blob=await exportBlob(); const name=`collage-${stamp()}.${st.fmt}`; window.__lastExport={name,size:blob.size,blob};
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast('已送出儲存：'+name); }
      catch(err){ const m=String(err&&err.message||err); toast(/declin|denied|cancel/i.test(m)?'已取消儲存':'儲存失敗：'+m); } }
    else { hideOut(); outURL=URL.createObjectURL(blob); const im=$('#outImg'); im.src=outURL; im.hidden=false; $('#outImgHint').hidden=false; }
  }catch(err){ toast('匯出失敗，請改用較小寬度'); }
  finally{ btn.disabled=false; btn.textContent=old; }
});

/* ---------- init ---------- */
function refreshAll(){ $('#sampleBar').hidden=!st.photos.some(p=>p.sample); buildLayouts(); buildPhotos(); selectCell(st.sel); clampAll(); draw(); }
buildRatios(); buildSwatches(); makeSamples();
if(!LAYOUTS.some(l=>l.id===st.layoutId)&&!/^free\d$/.test(st.layoutId)) st.layoutId='4a';
if(layout().cells.length!==st.photos.length) st.layoutId=firstLayoutFor(st.photos.length).id;
syncCells(); fillEmpty();
refreshAll(); sizeCanvas();
let rt=0; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(sizeCanvas,80);});
if(window.ResizeObserver) new ResizeObserver(()=>{clearTimeout(rt); rt=setTimeout(sizeCanvas,60);}).observe(stage);
window.__pc={st,LAYOUTS,cellRects,render,layout,exportBlob,ratioOf,setLayout:id=>setLayout(id)};
})();
</script>
