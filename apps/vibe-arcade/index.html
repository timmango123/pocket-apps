<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<style>
/* One-screen arcade cabinet: marquee, bezel with HUD + CRT screen, control deck. Committed dark look. */
:root {
  color-scheme: dark;
  --bg: #08080a;
  --cab: #18181c;
  --cab-hi: #26262c;
  --edge: #34343c;
  --screen: #05050a;
  --ink: #f5f1e6;
  --muted: #a39e94;
  --red: #ff3b3b;
  --amber: #ffb400;
  --yellow: #ffe94a;
  --cyan: #22e4f0;
  --green: #3dff8b;
  --pink: #ff4fa3;
  --px: "Press Start 2P", "Noto Sans TC", ui-monospace, monospace;
  --tc: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 0%, #1d1b14 0%, var(--bg) 60%);
  color: var(--ink); font: 15px/1.5 var(--tc);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.cab {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  gap: 8px;
}
/* marquee */
.marquee {
  flex: none; position: relative; height: 62px; border-radius: 12px 12px 6px 6px; overflow: hidden;
  background: #120c06; border: 2px solid var(--edge);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 24px rgb(255 180 0 / .18), inset 0 0 18px rgb(255 120 0 / .25);
}
.marquee::before {
  content: ""; position: absolute; inset: auto 0 0 0; height: 14px;
  background: linear-gradient(var(--red) 0 33%, var(--amber) 33% 66%, var(--yellow) 66%);
  opacity: .9;
}
.marquee h1 {
  margin: 0 0 10px; font: 400 clamp(15px, 5vw, 22px)/1 var(--px); letter-spacing: 2px;
  color: var(--yellow); text-shadow: 0 0 8px rgb(255 200 0 / .8), 3px 3px 0 var(--red);
  animation: buzz 4s infinite steps(1);
}
@keyframes buzz { 0%, 91%, 95%, 100% { opacity: 1 } 92%, 94% { opacity: .55 } }

/* bezel */
.bezel {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(180deg, var(--cab-hi), var(--cab));
  border: 2px solid var(--edge); border-radius: 10px; padding: 8px;
}
.hud { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-family: var(--px); font-size: 10px; }
.hud .cell { display: flex; flex-direction: column; gap: 4px; }
.hud .cell.r { align-items: flex-end; }
.hud .lab { color: var(--muted); font-family: var(--tc); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.hud .val { color: var(--green); text-shadow: 0 0 6px rgb(61 255 139 / .6); font-size: 12px; min-height: 12px; white-space: nowrap; }
.hud .cell.r .val { color: var(--amber); text-shadow: 0 0 6px rgb(255 180 0 / .6); }
.hud .gname { font-family: var(--tc); font-weight: 900; font-size: 14px; color: var(--ink); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }

.screen {
  flex: 1; min-height: 0; position: relative; overflow: hidden; border-radius: 16px;
  background: var(--screen); border: 3px solid #000;
  box-shadow: inset 0 0 0 2px #2b2b30, 0 0 0 4px #0c0c0e;
}
#scr { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.crt {
  position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: 13px;
  background:
    repeating-linear-gradient(0deg, rgb(0 0 0 / .22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .55) 100%);
}

/* overlays inside screen */
.ov {
  position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 18px 16px; gap: 12px; text-align: center; overflow-y: auto;
  background: rgb(5 5 10 / .62);
}
.ov h2 { margin: 0; font: 900 22px/1.3 var(--tc); color: var(--ink); letter-spacing: .06em; }
.ov .eyebrow { font: 400 10px/1.4 var(--px); color: var(--amber); letter-spacing: 2px; }
.ov p { margin: 0; max-width: 30ch; color: #d9d4c8; font-size: 14px; line-height: 1.65; }
.carts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; }
.cart {
  --c: var(--cyan);
  position: relative; text-align: left; padding: 12px 12px 12px; min-height: 112px; border-radius: 8px;
  background: #101014; border: 2px solid var(--c);
  box-shadow: 0 0 0 3px #000 inset, 0 0 14px color-mix(in srgb, var(--c) 35%, transparent);
  display: flex; flex-direction: column; gap: 6px; transition: transform .12s;
}
.cart:active { transform: scale(.97); }
.cart .no { font: 400 10px/1 var(--px); color: var(--c); }
.cart .nm { font: 900 17px/1.2 var(--tc); color: var(--ink); }
.cart .ds { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; }
.cart .bs { font: 400 9px/1.3 var(--px); color: var(--c); }
.cart .bs b { font-family: var(--tc); font-weight: 700; font-size: 11px; color: var(--muted); margin-right: 4px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pbtn {
  min-width: 120px; min-height: 48px; padding: 10px 18px; border-radius: 6px;
  font: 900 16px/1 var(--tc); letter-spacing: .1em; color: #120c00;
  background: var(--yellow); box-shadow: 0 5px 0 #a3780a, 0 0 18px rgb(255 233 74 / .35);
}
.pbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a3780a; }
.pbtn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--edge); box-shadow: none; }
#over { background: rgb(5 5 10 / .86); }
.big { font: 400 clamp(22px, 8vw, 34px)/1.2 var(--px); color: var(--green); text-shadow: 0 0 10px rgb(61 255 139 / .7); }
.newbest { font: 400 11px/1 var(--px); color: var(--pink); animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2 } }
.small { font-size: 13px; color: var(--muted); }
.small b { color: var(--amber); font-family: var(--px); font-weight: 400; font-size: 11px; }

/* control deck */
.deck {
  flex: none; height: 84px; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 14px; border-radius: 6px 6px 14px 14px;
  background: linear-gradient(180deg, #2a2a31, #141417); border: 2px solid var(--edge);
}
.stick { width: 54px; height: 54px; position: relative; flex: none; }
.stick::before { content: ""; position: absolute; left: 50%; bottom: 6px; width: 46px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: #050506; box-shadow: inset 0 2px 3px #000; }
.stick::after { content: ""; position: absolute; left: 50%; top: 4px; width: 26px; height: 26px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, var(--red) 55%, #8a0f0f); box-shadow: 0 10px 0 -7px #555; }
.sbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; min-width: 52px; min-height: 52px; justify-content: center; }
.sbtn i { width: 30px; height: 14px; border-radius: 4px; background: #3a3a42; box-shadow: 0 3px 0 #0e0e10; display: block; }
.sbtn:active i { transform: translateY(2px); box-shadow: 0 1px 0 #0e0e10; }
.sbtn[aria-pressed="true"] i { background: var(--red); }
.abtn {
  width: 66px; height: 66px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 38% 32%, #fff59e, var(--yellow) 45%, #b08a00);
  box-shadow: 0 6px 0 #6b5400, 0 0 18px rgb(255 233 74 / .35);
  font: 900 18px/1 var(--tc); color: #2a1d00;
}
.abtn:active, .abtn.down { transform: translateY(4px); box-shadow: 0 2px 0 #6b5400, 0 0 24px rgb(255 233 74 / .6); }
.deck .mid { display: flex; gap: 6px; }

@media (prefers-reduced-motion: reduce) {
  .marquee h1, .newbest { animation: none; }
  .cart, .pbtn { transition: none; }
}
@media (max-height: 620px) {
  .marquee { height: 44px; } .marquee::before { height: 8px; } .marquee h1 { margin-bottom: 6px; font-size: 14px; }
  .deck { height: 66px; } .abtn { width: 52px; height: 52px; } .stick { display: none; }
  .cart { min-height: 84px; } .cart .ds { display: none; }
}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cvs = $('#scr'), ctx = cvs.getContext('2d');
const screenEl = $('#screen');
let W = 300, H = 300, DPR = 1;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PX = '"Press Start 2P", "Noto Sans TC", ui-monospace, monospace';
const TC = '"Noto Sans TC", system-ui, sans-serif';

const store = {
  get(k, d) { try { const v = localStorage.getItem('vibeArcade.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vibeArcade.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- audio ---------- */
let ac = null, muted = !!store.get('muted', false);
function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
}
function jingle(notes, step = 0.09) {
  if (muted) return;
  notes.forEach((f, i) => setTimeout(() => beep(f, step * 1.4, 'square', 0.05), i * step * 1000));
}
const muteBtn = $('#muteBtn');
function syncMute() { muteBtn.setAttribute('aria-pressed', String(muted)); }
function toggleMute() { muted = !muted; store.set('muted', muted); syncMute(); if (!muted) beep(880, .05); }
syncMute();

/* ---------- helpers ---------- */
let shakeA = 0;
function shake(a) { if (!reduce) shakeA = Math.max(shakeA, a); }
function txt(s, x, y, size, color, align = 'center', font = PX) {
  ctx.font = size + 'px ' + font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function glowTxt(s, x, y, size, color, font = PX) {
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14; txt(s, x, y, size, color, 'center', font); ctx.restore();
  txt(s, x, y, size, color, 'center', font);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const hudScore = $('#hudScore'), hudBest = $('#hudBest'), hudName = $('#hudName');
function hud(s) { hudScore.textContent = s; }

/* ================= GAME 1: reaction ================= */
const react = (() => {
  const N = 5; let i = 0, phase = 'wait', t = 0, delay = 1, times = [], goAt = 0, last = 0;
  function next() { phase = 'wait'; t = 0; delay = 1.1 + Math.random() * 2.4; }
  function rating(ms) { return ms < 200 ? '閃電之手！' : ms < 250 ? '超快！' : ms < 320 ? '不錯喔' : ms < 420 ? '再專注一點' : '還在暖機？'; }
  return {
    id: 'react', no: '01', name: '閃電反應', color: '#3dff8b', primary: true, lower: true,
    desc: '綠燈一亮，立刻出手。',
    how: '畫面從紅色變成綠色的瞬間，點擊螢幕（或按「按」鈕、空白鍵）。共 5 回合，取平均反應時間；太早出手要重來那一回合。',
    fmt: v => v + 'ms',
    start() { i = 0; times = []; next(); hud('0/' + N); },
    onHide() { if (phase === 'wait' || phase === 'go') next(); },
    update(dt, now) {
      t += dt;
      if (phase === 'wait' && t >= delay) { phase = 'go'; goAt = now; beep(988, .1, 'square', .06); }
      else if (phase === 'early' && t > 1.1) next();
      else if (phase === 'shown' && t > 0.95) {
        if (i >= N) { const avg = Math.round(times.reduce((a, b) => a + b, 0) / N); finish(avg, rating(avg)); phase = 'done'; }
        else next();
      }
    },
    tap() {
      const now = performance.now();
      if (phase === 'wait') { phase = 'early'; t = 0; beep(150, .3, 'sawtooth', .06, 70); shake(7); }
      else if (phase === 'go') {
        last = Math.max(1, Math.round(now - goAt)); times.push(last); i++; phase = 'shown'; t = 0;
        beep(1320, .07, 'square', .05); hud(i + '/' + N);
      }
    },
    draw() {
      const bg = phase === 'go' ? '#0d9e4b' : phase === 'early' ? '#d97a00' : (phase === 'shown' || phase === 'done') ? '#0a1430' : '#9e1022';
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // pixel checker texture
      ctx.fillStyle = 'rgba(0,0,0,.12)';
      const c = 16;
      for (let y = 0; y < H; y += c) for (let x = ((y / c) & 1) * c; x < W; x += c * 2) ctx.fillRect(x, y, c, c);
      // round pips
      const pw = 18, gap = 10, tot = N * pw + (N - 1) * gap; let px = (W - tot) / 2;
      for (let k = 0; k < N; k++) {
        ctx.fillStyle = k < i ? '#ffe94a' : 'rgba(255,255,255,.25)';
        ctx.fillRect(px + k * (pw + gap), 22, pw, 10);
      }
      const cy = H / 2, s = Math.min(W, H);
      if (phase === 'wait') { glowTxt('等待綠燈', W / 2, cy - 10, Math.round(s * 0.09), '#fff', TC); txt('別急⋯', W / 2, cy + s * 0.1, Math.round(s * 0.045), 'rgba(255,255,255,.7)', 'center', TC); }
      else if (phase === 'go') { glowTxt('點！', W / 2, cy, Math.round(s * 0.24), '#fff', TC); }
      else if (phase === 'early') { glowTxt('太早了！', W / 2, cy - 10, Math.round(s * 0.1), '#fff', TC); txt('這回合重來', W / 2, cy + s * 0.11, Math.round(s * 0.045), '#fff', 'center', TC); }
      else { glowTxt(last + 'ms', W / 2, cy - 10, Math.round(s * 0.09), '#3dff8b'); txt(rating(last), W / 2, cy + s * 0.11, Math.round(s * 0.05), '#ffe94a', 'center', TC); }
    }
  };
})();

/* ================= GAME 2: stacker ================= */
const stack = (() => {
  let blocks = [], cur = null, dir = 1, speed = 150, cam = 0, debris = [], score = 0, combo = 0;
  let bh = 20, baseW = 200, ground = 280, fx = 0, ending = -1, lastW = 0;
  function geo() { bh = Math.round(Math.max(16, Math.min(30, H / 22))); baseW = Math.min(W * 0.62, 260); ground = H - Math.max(22, H * 0.1); }
  function spawn() {
    const top = blocks[blocks.length - 1]; const lvl = blocks.length;
    dir = lvl % 2 ? 1 : -1;
    cur = { x: dir > 0 ? -top.w * 0.5 : W - top.w * 0.5, w: top.w, lvl };
  }
  function color(l, a = 1) { return 'hsla(' + ((190 + l * 11) % 360) + ',95%,58%,' + a + ')'; }
  function sy(wy) { return ground - wy - bh + cam; }
  function drawBlock(x, wy, w, l) {
    const y = sy(wy);
    ctx.fillStyle = color(l); ctx.fillRect(x, y, w, bh - 2);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x, y + bh - 6, w, 4);
  }
  return {
    id: 'stack', no: '02', name: '霓虹疊塔', color: '#22e4f0', primary: true,
    desc: '抓準時機，越疊越高。',
    how: '方塊會左右滑動，點擊螢幕（或按「按」鈕、空白鍵）讓它落下。超出底下的部分會被切掉；完美對齊連續 3 次，方塊會變寬。',
    fmt: v => v + '層',
    start() {
      geo(); lastW = W;
      blocks = [{ x: (W - baseW) / 2, w: baseW, lvl: 0 }];
      debris.length = 0; score = 0; combo = 0; speed = 150; cam = 0; fx = 0; ending = -1; spawn(); hud(0);
    },
    resize() {
      if (!blocks.length) return;
      const k = W / (lastW || W); lastW = W; geo();
      for (const b of blocks) { b.x *= k; b.w *= k; }
      if (cur) { cur.x *= k; cur.w *= k; }
    },
    update(dt) {
      if (cur) {
        cur.x += dir * speed * dt;
        const lo = -cur.w * 0.5, hi = W - cur.w * 0.5;
        if (cur.x > hi) { cur.x = hi; dir = -1; } else if (cur.x < lo) { cur.x = lo; dir = 1; }
      }
      const target = Math.max(0, (blocks.length + 1) * bh - (ground - H * 0.45));
      cam += (target - cam) * Math.min(1, dt * 6);
      for (let k = debris.length - 1; k >= 0; k--) {
        const d = debris[k]; d.vy += 1100 * dt; d.wy -= d.vy * dt; d.x += d.vx * dt;
        if (sy(d.wy) > H + 60) debris.splice(k, 1);
      }
      if (fx > 0) fx -= dt;
      if (ending >= 0) { ending -= dt; if (ending < 0) { ending = -1; finish(score, score >= 20 ? '高塔建築師！' : score >= 10 ? '穩穩的手' : '再試一次'); } }
    },
    tap() {
      if (!cur) return;
      const top = blocks[blocks.length - 1];
      const L = Math.max(cur.x, top.x), R = Math.min(cur.x + cur.w, top.x + top.w), ov = R - L;
      if (ov <= 0) {
        debris.push({ x: cur.x, w: cur.w, wy: cur.lvl * bh, vy: 0, vx: dir * 40, lvl: cur.lvl });
        cur = null; beep(140, .45, 'sawtooth', .07, 50); shake(9); ending = 0.8; return;
      }
      if (Math.abs(cur.x - top.x) <= Math.max(3, cur.w * 0.03)) {
        cur.x = top.x; combo++; fx = 0.45;
        if (combo >= 3 && cur.w < baseW) { const nw = Math.min(baseW, cur.w + bh * 0.8); cur.x -= (nw - cur.w) / 2; cur.w = nw; }
        beep(523 * Math.pow(1.0595, Math.min(combo, 14) * 2), .12, 'square', .05);
      } else {
        combo = 0;
        if (cur.x < top.x) debris.push({ x: cur.x, w: top.x - cur.x, wy: cur.lvl * bh, vy: 0, vx: -60, lvl: cur.lvl });
        else debris.push({ x: R, w: cur.x + cur.w - R, wy: cur.lvl * bh, vy: 0, vx: 60, lvl: cur.lvl });
        cur.x = L; cur.w = ov; beep(300, .06, 'square', .05);
      }
      blocks.push({ x: cur.x, w: cur.w, lvl: cur.lvl });
      score++; hud(score); speed = score <= 35 ? 150 + score * 8 : Math.min(720, 430 + (score - 35) * 3); spawn(); // keeps speeding up past layer 35
    },
    draw() {
      ctx.fillStyle = '#06070f'; ctx.fillRect(0, 0, W, H);
      // parallax pixel columns
      ctx.fillStyle = 'rgba(34,228,240,.07)';
      const off = (cam * 0.3) % 40;
      for (let y = -40 + off; y < H; y += 40) ctx.fillRect(0, y, W, 1);
      for (let x = 20; x < W; x += 40) ctx.fillRect(x, 0, 1, H);
      // big faded score
      txt(String(score), W / 2, H * 0.22, Math.round(Math.min(W, H) * 0.2), 'rgba(255,255,255,.08)');
      // ground
      ctx.fillStyle = '#22e4f0'; ctx.fillRect(0, sy(-bh) + 0, W, 2);
      for (let k = blocks.length - 1; k >= 0; k--) {
        const b = blocks[k]; const y = sy(b.lvl * bh);
        if (y > H) break;
        if (y < -bh) continue;
        drawBlock(b.x, b.lvl * bh, b.w, b.lvl);
      }
      if (fx > 0 && blocks.length > 1) {
        const b = blocks[blocks.length - 1], y = sy(b.lvl * bh), g = (0.45 - fx) * 40;
        ctx.strokeStyle = 'rgba(255,255,255,' + (fx / 0.45) + ')'; ctx.lineWidth = 2;
        ctx.strokeRect(b.x - g, y - g, b.w + g * 2, bh - 2 + g * 2);
        txt('完美！', W / 2, y - 30, 16, '#ffe94a', 'center', TC);
      }
      for (const d of debris) drawBlock(d.x, d.wy, d.w, d.lvl);
      if (cur) drawBlock(cur.x, cur.lvl * bh, cur.w, cur.lvl);
    }
  };
})();

/* ================= GAME 3: memory sequence ================= */
const simon = (() => {
  const C = ['#ff3b3b', '#22e4f0', '#ffe94a', '#3dff8b'], F = [329.6, 440, 554.4, 659.3];
  const R = [{}, {}, {}, {}];
  let seq = [], phase = 'pause', idx = 0, t = 0, lit = -1, litT = 0, step = 0, score = 0, flashOk = 0;
  function geo() {
    const s = Math.min(W * 0.86, H * 0.7), g = s * 0.05, c = (s - g) / 2, ox = (W - s) / 2, oy = (H - s) / 2 + Math.min(20, H * 0.04);
    for (let i = 0; i < 4; i++) { R[i].x = ox + (i % 2) * (c + g); R[i].y = oy + ((i / 2) | 0) * (c + g); R[i].s = c; }
  }
  const r4 = () => (Math.random() * 4) | 0;
  function light(p, d) { lit = p; litT = d; beep(F[p], d, 'square', .05); }
  function press(p) {
    if (phase !== 'input') return;
    if (seq[idx] !== p) {
      phase = 'wrong'; t = 0; lit = p; litT = 1; beep(110, .6, 'sawtooth', .07, 55); shake(7); return;
    }
    light(p, 0.18); idx++;
    if (idx >= seq.length) { score = seq.length; hud(score); seq.push(r4()); phase = 'pause'; t = 0; flashOk = 0.5; }
  }
  return {
    id: 'simon', no: '03', name: '霓虹記憶', color: '#ffe94a',
    desc: '記住閃光順序，照著按。',
    how: '四個燈板會依序閃爍，看完後照同樣順序點擊。每過一關就多一步。鍵盤可用 1–4 或 Q W A S。',
    fmt: v => v + '步',
    start() { geo(); seq = [r4()]; phase = 'pause'; t = 0; score = 0; lit = -1; litT = 0; flashOk = 0; hud(0); },
    resize: geo,
    update(dt) {
      t += dt;
      if (litT > 0) { litT -= dt; if (litT <= 0) lit = -1; }
      if (flashOk > 0) flashOk -= dt;
      const on = Math.max(0.2, 0.48 - seq.length * 0.02), gap = Math.max(0.08, 0.18 - seq.length * 0.006);
      if (phase === 'pause' && t > 0.75) { phase = 'show'; step = 0; t = 0; light(seq[0], on); }
      else if (phase === 'show' && (t > on + gap || (step === seq.length - 1 && t > on))) { // input opens as soon as the last light goes out
        step++; t = 0;
        if (step >= seq.length) { phase = 'input'; idx = 0; } else light(seq[step], on);
      } else if (phase === 'wrong' && t > 1) { phase = 'done'; finish(score, score >= 12 ? '過目不忘！' : score >= 7 ? '記性很好' : '再挑戰看看'); }
    },
    tap(x, y) {
      if (phase !== 'input') return;
      for (let i = 0; i < 4; i++) { const r = R[i]; if (x >= r.x && x <= r.x + r.s && y >= r.y && y <= r.y + r.s) { press(i); return; } }
    },
    key(k) {
      const m = { '1': 0, '2': 1, '3': 2, '4': 3, q: 0, w: 1, a: 2, s: 3 }[k.toLowerCase()];
      if (m === undefined) return false; press(m); return true;
    },
    draw() {
      ctx.fillStyle = '#07060c'; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 4; i++) {
        const r = R[i], on = lit === i;
        rrect(r.x, r.y, r.s, r.s, r.s * 0.12);
        if (on) {
          ctx.save(); ctx.shadowColor = C[i]; ctx.shadowBlur = 30; ctx.fillStyle = C[i]; ctx.fill(); ctx.restore();
        } else {
          ctx.fillStyle = C[i]; ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1;
          ctx.strokeStyle = C[i]; ctx.lineWidth = 2; ctx.stroke();
        }
        txt(String(i + 1), r.x + r.s / 2, r.y + r.s / 2, Math.round(r.s * 0.18), on ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.25)');
      }
      const ty = Math.max(18, R[0].y - 22);
      let msg = '準備⋯', col = '#a39e94';
      if (phase === 'show') { msg = '看好順序'; col = '#22e4f0'; }
      else if (phase === 'input') { msg = '換你！ ' + idx + ' / ' + seq.length; col = '#3dff8b'; }
      else if (phase === 'wrong' || phase === 'done') { msg = '按錯了！'; col = '#ff3b3b'; }
      else if (flashOk > 0) { msg = '正確！'; col = '#ffe94a'; }
      txt(msg, W / 2, ty, 16, col, 'center', TC);
    }
  };
})();

/* ================= GAME 4: sliding puzzle ================= */
const slide = (() => {
  const tiles = new Array(9), dp = [], COLS = ['#ff3b3b', '#ffb400', '#ffe94a', '#3dff8b', '#22e4f0', '#4f8bff', '#ff4fa3', '#f5f1e6'];
  for (let i = 0; i < 9; i++) dp.push({ x: 0, y: 0 });
  let moves = 0, time = 0, started = false, done = false, doneT = 0, ox = 0, oy = 0, cell = 60;
  function geo() { const s = Math.min(W * 0.9, H * 0.72); cell = s / 3; ox = (W - s) / 2; oy = (H - s) / 2 + Math.min(16, H * 0.03); }
  const solved = () => { for (let i = 0; i < 8; i++) if (tiles[i] !== i + 1) return false; return tiles[8] === 0; };
  const adj = (a, b) => (Math.abs(a - b) === 3) || (Math.abs(a - b) === 1 && ((a / 3) | 0) === ((b / 3) | 0));
  function snap() { for (let i = 0; i < 9; i++) { const v = tiles[i]; dp[v].x = i % 3; dp[v].y = (i / 3) | 0; } }
  function tryMove(i) {
    if (done || i < 0 || i > 8) return;
    const b = tiles.indexOf(0);
    if (!adj(i, b)) { beep(170, .05, 'square', .03); return; }
    tiles[b] = tiles[i]; tiles[i] = 0; moves++; started = true; beep(620 + Math.random() * 80, .04, 'square', .04);
    if (solved()) { done = true; doneT = 0; jingle([523, 659, 784, 1047]); }
  }
  return {
    id: 'slide', no: '04', name: '像素拼盤', color: '#ff4fa3', lower: true,
    desc: '把 1 到 8 滑回原位。',
    how: '點擊空格旁的方塊把它滑過去，排成 1 到 8（右下角空著）。第一步開始計時，越快越好。鍵盤可用方向鍵。',
    fmt: v => v.toFixed(1) + 's',
    start() {
      geo();
      for (let i = 0; i < 8; i++) tiles[i] = i + 1; tiles[8] = 0;
      let blank = 8, prev = -1, n = 0;
      const nb = [];
      while (n < 120 || solved()) {
        nb.length = 0;
        for (const q of [blank - 3, blank + 3, blank - 1, blank + 1]) if (q >= 0 && q < 9 && q !== prev && adj(q, blank)) nb.push(q);
        const q = nb[(Math.random() * nb.length) | 0];
        tiles[blank] = tiles[q]; tiles[q] = 0; prev = blank; blank = q; n++;
      }
      snap(); moves = 0; time = 0; started = false; done = false; doneT = 0; hud('0.0s');
    },
    resize: geo,
    update(dt) {
      if (started && !done) { time += dt; hud(time.toFixed(1) + 's'); }
      const k = reduce ? 1 : Math.min(1, dt * 18);
      for (let i = 0; i < 9; i++) { const v = tiles[i]; const d = dp[v]; d.x += (i % 3 - d.x) * k; d.y += (((i / 3) | 0) - d.y) * k; }
      if (done) { doneT += dt; if (doneT > 1.1 && doneT < 50) { doneT = 99; finish(Math.round(time * 10) / 10, moves + ' 步完成'); } }
    },
    tap(x, y) {
      const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
      if (c < 0 || c > 2 || r < 0 || r > 2) return;
      tryMove(r * 3 + c);
    },
    key(k) {
      const b = tiles.indexOf(0);
      if (k === 'ArrowUp' && b < 6) tryMove(b + 3);
      else if (k === 'ArrowDown' && b > 2) tryMove(b - 3);
      else if (k === 'ArrowLeft' && b % 3 < 2) tryMove(b + 1);
      else if (k === 'ArrowRight' && b % 3 > 0) tryMove(b - 1);
      else return false;
      return true;
    },
    draw() {
      ctx.fillStyle = '#0a0710'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,79,163,.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(ox - 6, oy - 6, cell * 3 + 12, cell * 3 + 12);
      // slot grid
      ctx.fillStyle = 'rgba(255,255,255,.04)';
      for (let i = 0; i < 9; i++) ctx.fillRect(ox + (i % 3) * cell + 3, oy + ((i / 3) | 0) * cell + 3, cell - 6, cell - 6);
      const pad = Math.max(3, cell * 0.05);
      for (let v = 1; v <= 8; v++) {
        const d = dp[v], x = ox + d.x * cell + pad, y = oy + d.y * cell + pad, s = cell - pad * 2;
        const home = tiles[v - 1] === v;
        ctx.fillStyle = '#15111c'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = COLS[v - 1];
        ctx.fillRect(x, y, s, 4); ctx.fillRect(x, y + s - 4, s, 4); ctx.fillRect(x, y, 4, s); ctx.fillRect(x + s - 4, y, 4, s);
        if (home || done) { ctx.globalAlpha = 0.2; ctx.fillRect(x + 4, y + 4, s - 8, s - 8); ctx.globalAlpha = 1; }
        txt(String(v), x + s / 2, y + s / 2 + 2, Math.round(s * 0.36), COLS[v - 1]);
      }
      txt(done ? '完成！' : '步數 ' + moves, W / 2, Math.max(16, oy - 24), 15, done ? '#ffe94a' : '#a39e94', 'center', TC);
    }
  };
})();

const GAMES = [react, stack, simon, slide];

/* ---------- attract mode (menu background) ---------- */
const stars = [];
for (let i = 0; i < 60; i++) stars.push({ x: Math.random(), y: Math.random() * 0.5, s: Math.random() < 0.2 ? 2 : 1, p: Math.random() * 6 });
let at = 0;
function attract(dt) {
  at += reduce ? 0 : dt;
  ctx.fillStyle = '#07050d'; ctx.fillRect(0, 0, W, H);
  const hz = H * 0.55;
  for (const s of stars) { ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(at * 2 + s.p)) + ')'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  // striped sun
  const r = Math.min(W, H) * 0.24, cx = W / 2;
  const g = ctx.createLinearGradient(0, hz - r, 0, hz);
  g.addColorStop(0, '#ffe94a'); g.addColorStop(1, '#ff3b6b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, hz, r, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#07050d';
  for (let k = 0; k < 6; k++) { const h = 2 + k * 1.6; ctx.fillRect(cx - r, hz - r * 0.5 + k * r * 0.09, r * 2, h); }
  // grid floor
  ctx.fillStyle = '#0a0414'; ctx.fillRect(0, hz, W, H - hz);
  ctx.strokeStyle = 'rgba(255,79,163,.55)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let k = -12; k <= 12; k++) { ctx.moveTo(cx + k * 8, hz); ctx.lineTo(cx + k * W * 0.18, H); }
  const ph = (at * 0.6) % 1;
  for (let k = 0; k < 12; k++) { const z = (k + ph) / 12; const y = hz + (H - hz) * z * z; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.fillStyle = '#ff4fa3'; ctx.fillRect(0, hz, W, 2);
}

/* ---------- flow ---------- */
let mode = 'menu', cur = null;
const menuEl = $('#menu'), introEl = $('#intro'), overEl = $('#over');
function best(g) { return store.get('best.' + g.id, null); }
function bestTxt(g) { const b = best(g); return b === null ? '—' : g.fmt(b); }
function show(el) { for (const e of [menuEl, introEl, overEl]) e.hidden = e !== el; }

const cartsEl = $('#carts');
function buildMenu() {
  cartsEl.textContent = '';
  for (const g of GAMES) {
    const b = document.createElement('button');
    b.className = 'cart'; b.style.setProperty('--c', g.color);
    b.innerHTML = '<span class="no">GAME ' + g.no + '</span><span class="nm"></span><span class="ds"></span><span class="bs"><b>最佳</b><span></span></span>';
    b.querySelector('.nm').textContent = g.name; b.querySelector('.ds').textContent = g.desc;
    b.querySelector('.bs span').textContent = bestTxt(g);
    b.addEventListener('click', () => openIntro(g));
    cartsEl.appendChild(b);
  }
}
function toMenu() {
  mode = 'menu'; cur = null; buildMenu(); show(menuEl);
  hudName.textContent = '選擇機台'; hud('—'); hudBest.textContent = '—';
  const f = cartsEl.querySelector('button'); if (f && document.activeElement && document.activeElement !== document.body) f.focus();
}
function openIntro(g) {
  cur = g; mode = 'intro'; show(introEl);
  $('#inNo').textContent = 'GAME ' + g.no; $('#inName').textContent = g.name; $('#inHow').textContent = g.how; $('#inBest').textContent = bestTxt(g);
  hudName.textContent = g.name; hudBest.textContent = bestTxt(g); hud('—');
  beep(660, .06); $('#goBtn').focus();
}
function startGame() {
  if (!cur) return;
  show(null); mode = 'play'; cur.start(); hudBest.textContent = bestTxt(cur);
  cvs.focus({ preventScroll: true });
  beep(880, .05); setTimeout(() => beep(1175, .07), 70);
}
function finish(score, note) {
  if (mode !== 'play') return;
  const g = cur, b = best(g);
  const isBest = b === null || (g.lower ? score < b : score > b);
  if (isBest) store.set('best.' + g.id, score);
  mode = 'over';
  $('#ovTitle').textContent = isBest ? '刷新紀錄！' : '遊戲結束';
  $('#ovScore').textContent = g.fmt(score);
  $('#ovNew').hidden = !isBest;
  $('#ovNote').textContent = note || '';
  $('#ovBest').textContent = bestTxt(g);
  hudBest.textContent = bestTxt(g);
  show(overEl);
  if (isBest) jingle([784, 988, 1175, 1568], 0.08);
  $('#againBtn').focus({ preventScroll: true });
}
$('#goBtn').addEventListener('click', startGame);
$('#backBtn').addEventListener('click', toMenu);
$('#againBtn').addEventListener('click', startGame);
$('#menuBtn2').addEventListener('click', toMenu);
$('#menuBtn').addEventListener('click', toMenu);
muteBtn.addEventListener('click', toggleMute);

function primary() {
  if (mode === 'play') { if (cur.primary) cur.tap(W / 2, H / 2); }
  else if (mode === 'intro' || mode === 'over') startGame();
  else if (mode === 'menu') { const f = cartsEl.querySelector('button'); if (f) f.focus(); }
}
const abtn = $('#abtn');
abtn.addEventListener('pointerdown', e => { e.preventDefault(); abtn.classList.add('down'); primary(); });
const up = () => abtn.classList.remove('down');
abtn.addEventListener('pointerup', up); abtn.addEventListener('pointerleave', up); abtn.addEventListener('pointercancel', up);
abtn.addEventListener('click', e => { if (e.detail === 0) primary(); }); // keyboard activation

cvs.addEventListener('pointerdown', e => {
  if (mode !== 'play') return;
  e.preventDefault();
  const r = cvs.getBoundingClientRect();
  cur.tap(e.clientX - r.left, e.clientY - r.top);
});
cvs.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (mode !== 'menu') { toMenu(); e.preventDefault(); } return; }
  if (e.key === 'm' || e.key === 'M') { if (!(mode === 'play' && cur.key && cur.id === 'simon')) { toggleMute(); return; } }
  if (mode === 'play') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat && cur.primary) cur.tap(W / 2, H / 2); return; }
    if (cur.key && cur.key(e.key)) e.preventDefault();
  }
});

/* ---------- sizing & loop ---------- */
function resize() {
  const r = screenEl.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (cur && cur.resize && (mode === 'play' || mode === 'over')) cur.resize();
}
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(screenEl); else addEventListener('resize', resize);
resize();

let lastT = performance.now(), running = true, rafId = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (mode === 'play') cur.update(dt, now);
  ctx.save();
  if (shakeA > 0) { ctx.translate((Math.random() - 0.5) * shakeA, (Math.random() - 0.5) * shakeA); shakeA = Math.max(0, shakeA - dt * 40); }
  if ((mode === 'play' || mode === 'over') && cur) cur.draw(); else attract(dt);
  ctx.restore();
  rafId = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; cancelAnimationFrame(rafId); if (mode === 'play' && cur.onHide) cur.onHide(); }
  else if (!running) { running = true; lastT = performance.now(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); }
});
toMenu();
rafId = requestAnimationFrame(frame);
})();
</script>
