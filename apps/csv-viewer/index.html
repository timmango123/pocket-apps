<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }

<title>CSV 表格檢視</title>
<style>
/* Ledger book: ruled sage paper, bottle-green ink for headers and selection, tabular figures right-aligned */
:root{
  --bg:#e9eee9; --surface:#ffffff; --sunk:#f3f6f3; --zebra:#f6f9f6; --ink:#16201a; --muted:#536057; --faint:#66716a;
  --line:#d4ddd6; --rule:#e3eae4; --line-strong:#b4c0b7; --accent:#1c5e3c; --accent-ink:#ffffff; --accent-soft:#dbece1;
  --head:#f0f4f1; --sel:#e3f1e8; --hit:#fff1a6; --hit-ink:#2a2200;
  --bad:#a8291f; --bad-soft:#f9e2de; --warn:#835400; --warn-soft:#fbefd2;
  --shadow:0 14px 36px rgba(16,30,22,.2);
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;
  --fs:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --sunk:#141b17; --zebra:#1b241e; --ink:#e3ebe5; --muted:#9daca2; --faint:#8a978f;
  --line:#28332c; --rule:#222c25; --line-strong:#3b4840; --accent:#7cc79a; --accent-ink:#0b1f13; --accent-soft:#1d3527;
  --head:#1d2720; --sel:#1f3327; --hit:#4d4413; --hit-ink:#fff8d6;
  --bad:#ff8c7e; --bad-soft:#3d1b17; --warn:#f0bf5c; --warn-soft:#3a2d10;
  --shadow:0 14px 36px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --sunk:#141b17; --zebra:#1b241e; --ink:#e3ebe5; --muted:#9daca2; --faint:#8a978f;
  --line:#28332c; --rule:#222c25; --line-strong:#3b4840; --accent:#7cc79a; --accent-ink:#0b1f13; --accent-soft:#1d3527;
  --head:#1d2720; --sel:#1f3327; --hit:#4d4413; --hit-ink:#fff8d6;
  --bad:#ff8c7e; --bad-soft:#3d1b17; --warn:#f0bf5c; --warn-soft:#3a2d10;
  --shadow:0 14px 36px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 calc(80px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;min-height:60px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.brand h1{margin:0;font-size:19px;font-weight:760;white-space:nowrap}
.ico{width:26px;height:26px;flex:none;border:2px solid var(--accent);border-radius:4px;background:linear-gradient(var(--accent),var(--accent)) 0 7px/100% 2px no-repeat,linear-gradient(var(--accent),var(--accent)) 8px 0/2px 100% no-repeat}
.btn{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{border-color:var(--accent)}}
.info{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);padding:2px 0 8px}
.info .fn{font-weight:700;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.info .dim{font:600 12.5px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
.info label{display:inline-flex;align-items:center;gap:4px}
.info select{min-height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 6px;font-size:13px}
.info .tog{display:inline-flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}
.info .tog input{width:20px;height:20px;accent-color:var(--accent)}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:700}
.chip.s{background:var(--accent-soft);color:var(--accent)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fbar input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line-strong);border-radius:6px;padding:0 10px;background:var(--surface);font-size:14px}
.fcount{font:600 11px var(--sans);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 6px}
.main{display:grid;gap:12px}
.tablebox{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;min-width:0}
.scroller{position:relative;overflow:auto;height:max(260px,calc(100svh - 420px));-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;font-size:var(--fs)}
.hd{position:sticky;top:0;z-index:3;display:flex;box-sizing:content-box;background:var(--head);border-bottom:1.5px solid var(--accent);height:var(--hh)}
.body{position:relative}
.rows{position:absolute;left:0;top:0}
.r{display:flex;height:var(--rh);border-bottom:1px solid var(--rule)}
.r:nth-child(even) .c,.r:nth-child(even) .fx{background:var(--zebra)}
.c{flex:none;padding:0 10px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border-right:1px solid var(--rule);background:var(--surface);cursor:pointer;min-width:0}
.c>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.c.num{justify-content:flex-end;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.95em}
.c.empty{color:var(--faint)}
.c.sel{background:var(--sel)!important}
.c.hit>span{background:var(--hit);color:var(--hit-ink);border-radius:2px}
.fx{position:sticky;left:0;z-index:2;display:flex;flex:none;box-shadow:1px 0 0 var(--line-strong)}
.rn{flex:none;width:var(--rnw);padding:0 8px 0 0;display:flex;align-items:center;justify-content:flex-end;font:11.5px var(--mono);color:var(--faint);background:var(--sunk);border-right:1px solid var(--rule)}
.hd .c,.hd .rn{background:var(--head);cursor:pointer;font-weight:700;font-size:.93em;gap:4px;color:var(--ink)}
.hd .c{justify-content:space-between;position:relative;padding-right:16px}
.grip{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:col-resize;touch-action:none}
.grip::after{content:"";position:absolute;right:4px;top:28%;bottom:28%;width:2px;border-radius:1px;background:var(--line-strong)}
@media (hover:hover){.grip:hover::after{background:var(--accent)}}
.hd .c .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .c .meta{display:inline-flex;align-items:center;gap:3px;flex:none}
.ty{font:700 10.5px var(--mono);color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:0 3px;line-height:15px}
.ar{font-size:12px;color:var(--accent);width:12px;text-align:center}
.hd .c.sel{box-shadow:inset 0 -3px 0 var(--accent)}
.hd .rn{background:var(--head)}
.nodata{padding:40px 16px;text-align:center;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--sunk)}
.stats select{min-height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 6px;font-size:13px;max-width:46vw}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.stats .kv{white-space:nowrap}
#statVals{display:flex;flex-wrap:wrap;gap:2px 14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dock .in{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:86%;overflow:auto;overscroll-behavior:contain}
.sheet>header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet h2{margin:0;font-size:17px;flex:1}
.sheet h3{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:700;letter-spacing:.04em}
.sheet p.hint{margin:0 0 6px;font-size:13px;color:var(--muted)}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.cond select,.cond input{min-height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--sunk);padding:0 8px;font-size:14px;min-width:0;width:100%}
.cond .vals{grid-column:1/-1;display:flex;gap:6px}
.cond .vals input{flex:1}
.cond .del{grid-column:1/-1;justify-self:end}
.colrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:48px}
.colrow label{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;min-width:0}
.colrow label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bubble pre{font:13.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:6px;padding:10px;margin:6px 0 0;max-height:45svh;overflow:auto}
.bubble .where{font-size:12.5px;color:var(--muted)}
textarea#pasteIn{width:100%;height:36svh;min-height:180px;border:1px solid var(--line-strong);border-radius:6px;background:var(--sunk);padding:10px;font:13px/1.5 var(--mono);resize:vertical}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.prog.ind i{width:30%!important;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog2{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px}
.tog2 input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.drop{outline:2px dashed var(--accent);outline-offset:-4px}
/* desktop: filter panel docked on the right */
@media (min-width:1000px){
  .main.withf{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  #filterBg.docked{position:static;background:none;display:block;z-index:auto}
  #filterBg.docked .sheet{border-radius:8px;border:1px solid var(--line);box-shadow:none;max-height:calc(100svh - 200px);position:sticky;top:8px;padding:12px}
  #filterBg.docked [data-close]{display:none}
  .scroller{height:calc(100svh - 280px)}
}
@media (max-height:500px) and (orientation:landscape){
  body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .scroller{height:max(240px,calc(100svh - 120px))}
  .dock{position:static;background:transparent;border:0;padding:10px 0 0}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="ico" aria-hidden="true"></span><h1>CSV 表格檢視</h1></div>
    <button class="btn pri" id="openBtn" type="button">開啟</button>
    <input type="file" id="fileIn" accept=".csv,.tsv,.tab,.txt,.psv,text/csv,text/plain,text/tab-separated-values" hidden>
    <button class="btn" id="pasteBtn" type="button">貼上</button>
    <button class="btn" id="sampleBtn" type="button">範例</button>
  </header>

  <div class="info" id="info">
    <span class="fn" id="fname">—</span>
    <span class="dim" id="dims">0 × 0</span>
    <span class="chip s" id="sampleChip" hidden>範例資料</span>
    <label for="delimSel">分隔符
      <select id="delimSel"><option value="auto">自動</option><option value=",">逗號 ,</option><option value=";">分號 ;</option><option value="tab">Tab</option><option value="|">直線 |</option></select>
    </label>
    <label for="encSel">編碼
      <select id="encSel"><option value="auto">自動</option><option value="utf-8">UTF-8</option><option value="big5">Big5</option><option value="gb18030">GB18030</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option></select>
    </label>
    <label class="tog" for="hdrChk"><input type="checkbox" id="hdrChk" checked>首列為標題</label>
    <span class="chip w" id="warnChip" hidden></span>
  </div>
  <div class="prog" id="prog" hidden><i id="progBar"></i></div>

  <div class="fbar">
    <input id="q" type="search" placeholder="搜尋任一欄位" aria-label="全域搜尋" autocomplete="off">
    <button class="btn" id="filterBtn" type="button">欄位篩選 <span class="fcount" id="fcount" hidden>0</span></button>
  </div>

  <div class="main" id="main">
    <div class="tablebox">
      <div class="scroller" id="sc" tabindex="0" aria-label="資料表格">
        <div class="hd" id="hd"></div>
        <div class="body" id="bd"><div class="rows" id="rows"></div></div>
      </div>
      <div class="stats" id="stats" aria-live="polite">
        <label for="statCol">統計欄位</label>
        <select id="statCol"></select>
        <span id="statVals"></span>
      </div>
    </div>
    <div id="filterBg" class="sheet-bg" hidden>
      <div class="sheet" role="dialog" aria-labelledby="fTitle">
        <header><h2 id="fTitle">欄位篩選</h2><button class="btn" type="button" data-close>完成</button></header>
        <p class="hint">所有條件需同時成立（AND）。</p>
        <div id="conds"></div>
        <div class="grid2" style="margin-top:10px">
          <button class="btn" id="addCond" type="button">新增條件</button>
          <button class="btn" id="clearCond" type="button">清除全部</button>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="dock" aria-label="工具列"><div class="in">
  <button class="btn" id="exportBtn" type="button">匯出</button>
  <button class="btn" id="colsBtn" type="button">欄位</button>
  <button class="btn" id="copyBtn" type="button">複製</button>
</div></nav>

<div class="sheet-bg" id="exportBg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="eTitle">
  <header><h2 id="eTitle">匯出目前檢視</h2><button class="btn" type="button" data-close>關閉</button></header>
  <p class="hint" id="eHint"></p>
  <label class="tog2" for="guardChk"><input type="checkbox" id="guardChk">CSV／TSV 公式防護</label>
  <p class="hint" id="guardHint">開啟時，以 = + − @ 開頭的文字前面加 '，在 Excel／試算表打開不會被當成公式執行；關閉則逐字輸出、可原樣讀回。</p>
  <div id="exportList"></div>
</div></div>
<div class="sheet-bg" id="colsBg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <header><h2 id="cTitle">欄位</h2><button class="btn" type="button" data-close>完成</button></header>
  <h3>字級</h3>
  <div class="grid2"><button class="btn" id="fsDown" type="button">A−　縮小</button><button class="btn" id="fsUp" type="button">A＋　放大</button></div>
  <p class="hint" style="margin-top:6px">手機上也可以在表格上用兩指縮放字級（12–20px）。</p>
  <h3>顯示與順序</h3>
  <div class="grid2" style="margin-bottom:6px"><button class="btn" id="showAll" type="button">全部顯示</button><button class="btn" id="resetOrder" type="button">恢復原始順序</button></div>
  <div id="colList"></div>
</div></div>
<div class="sheet-bg" id="cellBg" hidden><div class="sheet bubble" role="dialog" aria-modal="true" aria-labelledby="cellTitle">
  <header><h2 id="cellTitle">儲存格</h2><button class="btn" type="button" data-close>關閉</button></header>
  <div class="where" id="cellWhere"></div>
  <pre id="cellVal"></pre>
  <div class="grid3" style="margin-top:10px"><button class="btn pri" id="cellCopy" type="button">複製內容</button><button class="btn" id="rowCopy" type="button">複製整列</button><button class="btn" id="cellStat" type="button">統計此欄</button></div>
</div></div>
<div class="sheet-bg" id="pasteBg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <header><h2 id="pTitle">貼上 CSV</h2><button class="btn" type="button" data-close>取消</button></header>
  <textarea id="pasteIn" spellcheck="false" placeholder="把 CSV 或從試算表複製的內容貼在這裡"></textarea>
  <div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn pri" id="pasteGo" type="button">載入表格</button></div>
</div></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "csv-viewer:v1:";
const LS = {
  get(k) { try { const v = localStorage.getItem(KEY + k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch { return false; } }
};
let toastT;
function toast(msg, ms) { const h = $("toastHost"); h.innerHTML = ""; const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, ms || 2000); }
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
async function copyText(text, ok) {
  try { await navigator.clipboard.writeText(text); toast(ok || "已複製"); return true; } catch {}
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select(); const r = document.execCommand("copy"); ta.remove(); if (r) { toast(ok || "已複製"); return true; } } catch {}
  toast("無法自動複製，請改用匯出"); return false;
}
// yield to the event loop between slices of long work (MessageChannel: no 4 ms timer clamp)
const yq = [], ych = new MessageChannel();
ych.port1.onmessage = () => { const f = yq.shift(); if (f) f(); };
const yieldTask = () => new Promise(r => { yq.push(r); ych.port2.postMessage(0); });

/* ================= engine: decoding, parsing, typing, ranking =================
   Self-contained so the same code runs in a Blob Worker (big inputs) and on the main thread (small ones / no Worker). */
function engine() {
  const EMPTY = 268435455; // rank for empty / non-numeric cells: always sorted last
  const coll = new Intl.Collator("zh-Hant", { numeric: true, sensitivity: "base" });
  const NUM_RE = /^[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)?(?:\.\d+)?%?$/;
  const DATE_RE = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/;
  function toNum(s) {
    let t = s.trim(); if (!t) return NaN;
    if (t.indexOf("$") >= 0) t = t.replace(/^([+-]?)(?:NT)?\$\s?/, "$1");
    if (!NUM_RE.test(t) || !/\d/.test(t)) return NaN;
    return parseFloat(t.replace(/[,%]/g, ""));
  }
  function toDate(s) {
    const t = s.trim(), m = DATE_RE.exec(t);
    if (!m) { const v = Date.parse(t); return /^\d{4}-\d{2}-\d{2}T/.test(t) && !isNaN(v) ? v : NaN; }
    const d = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    return d.getMonth() === +m[2] - 1 ? d.getTime() : NaN;

/* ================= filter drawer ================= */

/* ================= export ================= */
function exportCols() { return order.filter(i => columns[i].visible); }
// formula guard: text that a spreadsheet would run (= + - @, tab/CR) gets a leading '; plain numbers like -5 are left alone

  const lines = [];
  if (rawHead) lines.push(line(cols.map(i => q(rawHead[i]))));
  for (let j = 0; j < view.length; j++) { const row = rows[view[j]]; lines.push(line(cols.map(i => q(row[i])))); }

}
const toCSV = guard => toDelimited(",", guard), toTSV = guard => toDelimited("\t", guard);
function toJSON() {

  for (let j = 0; j < view.length; j++) {
    const row = rows[view[j]], o = {};
    for (const i of cols) { const col = columns[i]; if (col.type === "number") { const x = col.key[view[j]]; o[col.name] = x === x ? x : (row[i].trim() ? row[i] : null); } else o[col.name] = row[i]; }
    out[j] = o;

}
function toMarkdown() {
  const cols = exportCols(), e = v => v.replace(/\\/g, "\\\\").replace(/\|/g, "\\|").replace(/\r?\n|\r/g, "<br>");
  const lines = ["| " + cols.map(i => e(columns[i].name)).join(" | ") + " |", "| " + cols.map(i => columns[i].type === "number" ? "---:" : "---").join(" | ") + " |"];
  for (let j = 0; j < view.length; j++) { const row = rows[view[j]]; lines.push("| " + cols.map(i => e(row[i])).join(" | ") + " |"); }

}
// [id, label, make, ext, mime, bom]: CSV/TSV files get a UTF-8 BOM so Excel shows Chinese correctly
const FORMATS = [["csv", "CSV", () => toCSV(), "csv", "text/csv", true], ["tsv", "TSV（貼到試算表）", () => toTSV(), "tsv", "text/tab-separated-values", true],
  ["json", "JSON", toJSON, "json", "application/json", false], ["md", "Markdown 表格", toMarkdown, "md", "text/markdown", false]];
let DL = null;
(async () => { try { DL = await window.claude?.use?.("downloads") || null; } catch { DL = null; } })();
function baseName() { return (src.name || "data").replace(/\.[^.]+$/, "").replace(/^範例：/, "").replace(/[\\/:*?"<>|\s]+/g, "_") || "data"; }
async function saveFile(name, data, mime) {
  if (DL) {
    try { await DL.save({ filename: name, data }); toast("已送出下載"); return; }
    catch (e) { if (/declin|cancel|denied|abort/i.test(String(e && (e.message || e.name)))) return; }
  }
  try {
    const u = URL.createObjectURL(new Blob([data], { type: mime + ";charset=utf-8" })), a = Object.assign(document.createElement("a"), { href: u, download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
    toast("已下載 " + name);

}
function renderExport() {
  $("eHint").textContent = `只匯出目前篩選、排序後的 ${view.length.toLocaleString()} 列與 ${exportCols().length} 個可見欄位。`;
  $("guardChk").checked = prefs.guard;
  const box = $("exportList"); box.textContent = "";
  for (const [id, label, fn, ext, mime, bom] of FORMATS) {

    const g = el("div", "grid2");

$("guardChk").addEventListener("change", () => { prefs.guard = $("guardChk").checked; savePrefs(); });
$("exportBtn").addEventListener("click", () => { if (!columns.length) { toast("沒有資料可以匯出"); return; } renderExport(); openSheet("exportBg"); });
$("copyBtn").addEventListener("click", () => { if (!columns.length) { toast("沒有資料可以複製"); return; } copyText(toTSV(), `已複製 ${view.length.toLocaleString()} 列（Tab 分隔，可貼到試算表）`); });

/* ================= persistence ================= */
// prefs + view state in localStorage (validated on read, flushed on pagehide); the last file (≤ 20 MB) in IndexedDB
const MAX_SAVE = 20 * 1048576;
function savePrefs() { LS.set("prefs", { fs: prefs.fs, header: prefs.header, guard: prefs.guard }); }
function sig() { return [src.name, rows.length, columns.length, columns.map(c => c.name).join("\u0001").slice(0, 3000)].join("|"); }
function saveView() {
  if (!loaded || !columns.length) return;
  const cut = s => String(s).slice(0, 500);
  LS.set("view", { sig: sig(), sort, conds: conds.slice(0, 20).map(c => ({ col: c.col, op: c.op, a: cut(c.a), b: cut(c.b) })), q: cut($("q").value),
    hidden: columns.filter(c => !c.visible).map(c => c.idx), order, widths: columns.map(c => Math.round(c.w)), selCol,
    st: Math.round(sc.scrollTop), sl: Math.round(sc.scrollLeft), fo: filterOpen });
}
let svT = 0; function queueSaveView() { clearTimeout(svT); svT = setTimeout(saveView, 400); }
function restoreView(v) {
  if (!v || typeof v !== "object" || v.sig !== sig()) return null;
  const N = columns.length, okCol = c => Number.isInteger(c) && c >= 0 && c < N, num = x => Number.isFinite(x) && x >= 0 ? x : 0;
  if (Array.isArray(v.order) && v.order.length === N && v.order.every(okCol) && new Set(v.order).size === N) order = v.order.slice();

  if (Array.isArray(v.widths) && v.widths.length === N) v.widths.forEach((w, i) => { if (Number.isFinite(w)) columns[i].w = Math.max(40, Math.min(800, w)); });
  if (v.sort && okCol(v.sort.col) && (v.sort.dir === 1 || v.sort.dir === -1)) sort = { col: v.sort.col, dir: v.sort.dir };
  if (Array.isArray(v.conds)) conds = v.conds.filter(c => c && okCol(c.col) && OPS[columns[c.col].type].some(o => o[0] === c.op)).slice(0, 20)
    .map(c => ({ col: c.col, op: c.op, a: typeof c.a === "string" ? c.a.slice(0, 500) : "", b: typeof c.b === "string" ? c.b.slice(0, 500) : "" }));

function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open("csv-viewer", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
let lastSaved = Promise.resolve();
function saveLast() {
  const size = src.bytes ? src.bytes.byteLength : (src.text || "").length * 2, t = Date.now();
  const rec = src.sample ? { sample: true, t } : size > MAX_SAVE ? { tooBig: true, name: src.name, size, t }

    try {
      const db = await idb(), tx = db.transaction("files", "readwrite");

      await new Promise(r => { tx.oncomplete = tx.onerror = tx.onabort = r; }); db.close();
    } catch {}

}
async function loadLast() {
  try {
    const db = await idb();
    const v = await new Promise(res => { const g = db.transaction("files").objectStore("files").get("lastFile"); g.onsuccess = () => res(g.result); g.onerror = () => res(null); });
    db.close();

    const name = typeof v.name === "string" ? v.name.slice(0, 200) : "上次的檔案";
    if (v.sample === true) return { sample: true };

    const bytes = v.bytes instanceof ArrayBuffer && v.bytes.byteLength <= MAX_SAVE ? v.bytes : null;

addEventListener("pagehide", () => { saveView(); savePrefs(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveView(); });

/* init */
$("hdrChk").checked = prefs.header;
applyFs();
const ready = (async () => {
  const last = await loadLast();
  let ok = false;
  if (last && (last.bytes || last.text)) {
    $("delimSel").value = last.delim; $("encSel").value = last.enc;
    ok = await load(last.bytes ? { bytes: last.bytes } : { text: last.text }, { name: last.name }, { restore: LS.get("view"), noSave: true });
  }
  if (!ok && last && last.tooBig) {
    emptyMsg = `上次開啟的「${last.name}」（${(last.size / 1048576).toFixed(1)} MB）超過 20 MB，沒有存在手機裡。請按「開啟」重新選擇檔案。`;
    $("fname").textContent = last.name; renderAll(); renderConds();
  } else if (!ok) await loadSample({ restore: LS.get("view"), noSave: true });
  window.__cvReady = true;
})();
window.__cv = { E, parseCSV: (t, d) => E.parseCSV(t, d).rows, detectDelim: E.detectDelim, decodeBytes: E.decodeBytes, loadText, loadBytes, openFile, toJSON, toMarkdown, toCSV, toTSV,
  get view() { return view; }, get columns() { return columns; }, get rows() { return rows; }, get sort() { return sort; }, get src() { return src; },
  cycleSort, recompute, setConds: c => { conds = c; renderConds(); return recompute(); }, selectCol, toNum: E.toNum, saveView, saved: () => lastSaved, ready };
})();
