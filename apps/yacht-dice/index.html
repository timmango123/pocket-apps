<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>快艇骰子</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --navy:#1b3358; --ink:#1b3358; --ink2:#4f6588; --ink3:#8090a8; --sail:#f3ead7; --card:#fbf6ea; --cell:#fffaf0; --red:#d2433a; --red2:#b8352d;
  --gold:#e0a526; --deck:#a0703f; --teal:#1f9b8f; --line:#1b335824; --bg1:#d7e6f1; --bg2:#a9c6dc; --sea:#5d8fb8; --shadow:0 4px 14px #1b335826;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="dark"]{
  --ink:#e8eef8; --ink2:#a3b4cd; --ink3:#6f819c; --sail:#15253d; --card:#13233a; --cell:#1a2d48; --red:#e5594f; --red2:#c94a41;
  --gold:#f0bb45; --deck:#6c4826; --teal:#3cc2b3; --line:#c9d8ee1f; --bg1:#0b1626; --bg2:#0b1626; --sea:#20406a; --shadow:0 4px 16px #0006;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef8; --ink2:#a3b4cd; --ink3:#6f819c; --sail:#15253d; --card:#13233a; --cell:#1a2d48; --red:#e5594f; --red2:#c94a41;
    --gold:#f0bb45; --deck:#6c4826; --teal:#3cc2b3; --line:#c9d8ee1f; --bg1:#0b1626; --bg2:#0b1626; --sea:#20406a; --shadow:0 4px 16px #0006;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
#beam{position:fixed;inset:-50%;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s}
.night #beam{opacity:1;background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,#ffe9a812 8deg,#ffe9a826 14deg,#ffe9a812 20deg,transparent 30deg,transparent 360deg);animation:sweep 14s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.night #beam{animation:none}}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px);gap:8px;overflow-y:auto;overflow-x:hidden}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;flex:none}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.ibtn[disabled]{opacity:.4}
.ibtn.lit{background:var(--gold)} .ibtn.lit svg{stroke:#1b3358}
.hmid{flex:1;min-width:0;height:44px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.hl1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;white-space:nowrap}
.hl1 b{font-size:16px} .hl1 .mt{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.hl2{position:relative;height:12px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);white-space:nowrap}
.bar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--sea),var(--teal));width:0;transition:width .5s}
.bar .ship{position:absolute;top:-9px;width:18px;height:16px;left:0;transition:left .6s cubic-bezier(.3,1.4,.5,1),transform .6s}
.bar .flag{position:absolute;right:-2px;top:-7px;width:3px;height:12px;background:var(--red);border-radius:1px}
.bar .flag::after{content:"";position:absolute;left:3px;top:0;border-left:7px solid var(--red);border-top:3px solid transparent;border-bottom:3px solid transparent}
.vsl{display:flex;gap:10px;align-items:baseline}
.vsl .ai{color:var(--red)}
/* tray */
#trayWrap{position:relative;flex:1 1 auto;min-height:196px;max-height:340px;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;touch-action:none}
#tray{position:absolute;inset:0;width:100%;height:100%;display:block}
#trayMsg{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:14px;font-weight:700;color:#fff8e6;text-shadow:0 1px 3px #0008;pointer-events:none;transition:opacity .3s}
#trayTag{position:absolute;left:14px;top:8px;font-size:11px;font-weight:700;color:#fff3d6cc;letter-spacing:.1em;pointer-events:none}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:38px;font-weight:900;color:#ffe08a;-webkit-text-stroke:2px #1b3358;paint-order:stroke fill;
  text-shadow:0 4px 0 #1b3358,0 8px 18px #0009;pointer-events:none;white-space:nowrap;letter-spacing:.06em}
#banner.show{animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
/* controls */
.ctl{display:flex;gap:8px;align-items:stretch;flex:none}
#bRoll{flex:1;height:56px;border-radius:18px;background:linear-gradient(180deg,#e15349,var(--red2));color:#fff;font-size:20px;font-weight:800;letter-spacing:.12em;
  box-shadow:0 4px 0 #8f2620,0 8px 18px #d2433a55;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;transition:transform .08s,box-shadow .08s,filter .2s}
#bRoll:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #8f2620,0 3px 8px #d2433a55}
#bRoll[disabled]{filter:grayscale(.7) brightness(.9);opacity:.6;cursor:default}
#bRoll .dots{display:flex;gap:5px} #bRoll .dots i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #ffffff55}
#bRoll .dots i.off{background:transparent;box-shadow:inset 0 0 0 2px #ffffff88}
.sbtn{min-width:56px;height:56px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 8px}
.sbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbtn[disabled]{opacity:.4}
.sbtn.tk{background:var(--gold);color:#1b3358} .sbtn.tk svg{stroke:#1b3358}
/* sheet */
#sheet{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--sail);border-radius:16px;box-shadow:var(--shadow);padding:6px;position:relative;
  background-image:repeating-linear-gradient(0deg,#0000 0 3px,#00000008 3px 4px),repeating-linear-gradient(90deg,#0000 0 3px,#00000006 3px 4px)}
.ch{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.12em;padding:2px 6px 4px;display:flex;justify-content:space-between}
.row{width:100%;height:44px;border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 8px;text-align:left;position:relative;transition:background .15s,box-shadow .15s}
.row + .row{margin-top:2px}
.row .nm{flex:1;min-width:0;line-height:1.1}
.row .nm b{display:block;font-size:15px;font-weight:700}
.row .nm small{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{min-width:30px;text-align:right;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.row .v.pv{color:var(--ink3);font-weight:600}
.row .v.pv.good{color:var(--teal)}
.row .av{min-width:30px;height:24px;border-radius:7px;background:#d2433a1c;color:var(--red);font-size:13px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.row.done .nm b{color:var(--ink2)}
.row.done{background:#1b33580a}
.row.open:not(.na){background:var(--cell);box-shadow:0 1px 0 var(--line)}
.row.na{opacity:.45}
.row.sel{background:var(--cell);box-shadow:0 0 0 2.5px var(--red),0 4px 12px #d2433a33;z-index:1}
.row.sel .v{color:var(--red)}
.row.sel::after{content:"再點一下確認";position:absolute;right:8px;top:-9px;font-size:11px;font-weight:700;background:var(--red);color:#fff;padding:1px 6px;border-radius:6px}
.row.hint{box-shadow:0 0 0 2.5px var(--teal),0 0 16px #1f9b8f55}
.row.aiflash{animation:aif 1s}
@keyframes aif{0%,60%{box-shadow:0 0 0 3px var(--red)}100%{box-shadow:none}}
.row.just .v{animation:jv .6s}
@keyframes jv{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.bonus{height:44px;margin-top:2px;padding:4px 8px;border-radius:10px;background:#1b33580d;display:flex;flex-direction:column;justify-content:center;gap:4px}
.bonus .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink2)}
.bonus .t b{color:var(--ink)}
.bonus .bar i{background:linear-gradient(90deg,var(--gold),#f3d27a)}
.bonus.got{background:linear-gradient(90deg,#e0a52633,#e0a52611)}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;height:28px;padding:0 8px;font-size:12px;color:var(--ink2);font-weight:700}
.tot b{font-size:15px;color:var(--ink)}
@media (hover:hover){ .row.open:not(.na):hover{box-shadow:0 0 0 2px var(--line)} .sbtn:hover,.ibtn:hover{filter:brightness(1.05)} }
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:#0b162680;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.ov.solid{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.panel{width:100%;max-width:400px;background:var(--card);border-radius:22px;box-shadow:0 18px 50px #0005;padding:18px 16px;margin:auto;position:relative;animation:pin .3s cubic-bezier(.2,1.3,.5,1)}
@keyframes pin{from{transform:translateY(20px) scale(.96);opacity:0}}
@media (max-height:600px){ .ov{align-items:flex-start} }
.ttl{font-size:22px;font-weight:900;text-align:center;margin:2px 0 4px}
.sub{font-size:13px;color:var(--ink2);text-align:center;margin-bottom:12px;line-height:1.5}
.logo{display:block;margin:0 auto 4px;width:120px;height:84px}
.mode{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border-radius:16px;background:var(--cell);box-shadow:0 1px 0 var(--line),0 2px 8px #1b335812;text-align:left;margin-top:8px}
.mode:active{transform:scale(.985)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--navy);color:#fff}
.mode .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font-size:16px} .mode small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.mode.primary{background:linear-gradient(180deg,#e15349,var(--red2));color:#fff} .mode.primary small{color:#ffe1dc} .mode.primary .ic{background:#fff3}
.chips{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;height:44px;border-radius:12px;background:var(--cell);box-shadow:0 1px 0 var(--line);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip small{font-size:11px;font-weight:600;color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff} .chip[aria-pressed="true"] small{color:#c9d6ea}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:6px;height:44px;padding:0 10px;border-radius:12px;background:var(--cell);font-size:13px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.sw .trk{width:34px;height:20px;border-radius:10px;background:#8090a855;position:relative;flex:none;transition:background .2s}
.sw .trk::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:left .2s}
.sw[aria-checked="true"] .trk{background:var(--teal)} .sw[aria-checked="true"] .trk::after{left:16px}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:48px;border-radius:14px;background:var(--cell);box-shadow:0 1px 0 var(--line),0 2px 8px #1b335812;font-weight:800;font-size:15px}
.btn.pri{background:linear-gradient(180deg,#e15349,var(--red2));color:#fff;box-shadow:0 3px 0 #8f2620}
.btn:active{transform:translateY(2px)}
.big{font-size:56px;font-weight:900;text-align:center;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--red)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:12px 4px 0;padding:10px 12px;border-radius:12px;background:var(--cell)}
.brk span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.tags{display:flex;width:100%;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--gold);color:#1b3358}
.tag.alt{background:#1b335818;color:var(--ink2)}
.tag.ach{background:var(--teal);color:#fff}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--cell);margin-top:8px}
.stat span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.achl{display:grid;gap:6px;margin-top:8px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--cell);font-size:13px}
.ach i{width:28px;height:28px;border-radius:50%;background:#8090a840;flex:none;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
.ach.on i{background:var(--gold);color:#1b3358}
.ach b{display:block;font-size:14px} .ach small{color:var(--ink2)}
.ach:not(.on){opacity:.65}
.share{width:100%;min-height:120px;font:13px/1.5 inherit;font-family:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--cell);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,20px);opacity:0;background:#1b3358f0;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:40;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.fly{position:fixed;z-index:31;pointer-events:none;font-weight:900;font-size:22px;color:var(--red);text-shadow:0 2px 0 #fff8,0 2px 8px #0003;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* landscape */
@media (orientation: landscape) and (max-height: 520px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:auto 1fr auto;column-gap:12px;row-gap:6px;overflow:hidden}
  .hud{grid-column:1;grid-row:1}
  #trayWrap{grid-column:1;grid-row:2;min-height:0;max-height:none}
  .ctl{grid-column:1;grid-row:3}
  #bRoll,.sbtn{height:50px}
  #sheet{grid-column:2;grid-row:1/4;overflow-y:auto;align-content:start;padding-bottom:4px}
}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="beam"></div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="boat" viewBox="0 0 24 20"><path d="M11 1v13M11 2l8 11h-8z" fill="#f3ead7" stroke="#1b3358" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 4L4 13h6z" fill="#d2433a"/><path d="M2 15h20l-3 4H5z" fill="#1b3358"/></symbol>
</svg>
<div id="app">
  <header class="hud">
    <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="hmid">
      <div class="hl1"><span id="hTurn">第 <b>1</b>/13 回合</span><span class="mt" id="hMode">單局</span><span>本表 <b id="hScore">0</b></span></div>
      <div class="hl2" id="hLine2"></div>
    </div>
    <button class="ibtn" id="bHint" aria-label="提示燈"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>
  </header>
  <div id="trayWrap">
    <canvas id="tray"></canvas>
    <div id="trayTag">保留列</div>
    <div id="trayMsg">按「擲骰」或在甲板上往上滑</div>
    <div id="banner">快艇！</div>
  </div>
  <div class="ctl">
    <button class="sbtn" id="bUndo" hidden aria-label="悔回一擲"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>悔擲</button>
    <button id="bRoll"><span id="rollTxt">擲骰</span><span class="dots" id="rollDots"><i></i><i></i><i></i></span></button>
    <button class="sbtn tk" id="bTicket" hidden aria-label="使用重擲券"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 1 0-4V4H3z"/><path d="M12 6v8"/></svg><span id="tkN">券 ×1</span></button>
  </div>
  <div id="sheet">
    <div class="col" id="colU"><div class="ch"><span>上半區</span><span id="uLbl"></span></div></div>
    <div class="col" id="colL"><div class="ch"><span>下半區</span><span id="lLbl"></span></div></div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="toast"></div>

<div class="ov solid" id="ovMenu" hidden>
  <div class="panel">
    <svg class="logo" viewBox="0 0 120 84" aria-hidden="true">
      <circle cx="96" cy="18" r="10" fill="#e0a526"/>
      <path d="M58 6v52" stroke="#1b3358" stroke-width="3"/>
      <path d="M60 8l30 44H60z" fill="#f3ead7" stroke="#1b3358" stroke-width="2" stroke-linejoin="round"/>
      <path d="M56 14L32 52h24z" fill="#d2433a"/>

// ------------------------------------------------------------------ main loop

var lastShake = 0;
