<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>西洋棋</title>
<style>
:root{
  --bg:#e9e5dc; --bg2:#d9d3c6; --panel:#f8f6f1; --panel2:#efebe2; --ink:#1f2a36; --ink2:#5b6b7a; --line:#d5cfc2;
  --gold:#b8892c; --gold2:#d9ac4a; --brass:#a8853a; --accent:#2f4a63; --danger:#b8473d; --ok:#3f8a5f;
  --shadow:0 4px 14px #1f2a3622; --btn:#2f4a63; --btnInk:#fff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161c; --bg2:#0c0f13; --panel:#1b222c; --panel2:#232c38; --ink:#e8e4da; --ink2:#9aa3ad; --line:#2c3644;
  --gold:#d9b25a; --gold2:#e8c773; --brass:#b89a5c; --accent:#9fb6cc; --danger:#e07a6e; --ok:#6cc08f;
  --shadow:0 4px 18px #0008; --btn:#c9a24a; --btnInk:#15181d;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --bg2:#0c0f13; --panel:#1b222c; --panel2:#232c38; --ink:#e8e4da; --ink2:#9aa3ad; --line:#2c3644;
  --gold:#d9b25a; --gold2:#e8c773; --brass:#b89a5c; --accent:#9fb6cc; --danger:#e07a6e; --ok:#6cc08f;
  --shadow:0 4px 18px #0008; --btn:#c9a24a; --btnInk:#15181d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(180deg,var(--bg) 35%,var(--bg2));background-color:var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg{display:block}
.hidden{display:none !important}
/* ---------- game layout ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 6px) calc(var(--sar) + 0px) calc(var(--sab) + 6px) calc(var(--sal) + 0px)}
.col{width:100%;max-width:560px;display:flex;flex-direction:column;flex:1;min-height:0}
.side{display:contents}
.top{order:0} #oppBar,#pzInfo{order:1;margin-top:auto} .strip{margin-top:auto} .mid{order:2} #meBar{order:3} .strip{order:4} .tools{order:5}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;height:48px;flex:none}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.tmid{flex:1;min-width:0;height:44px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.tname{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dbar{width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block}
.dbar i{display:block;height:100%;border-radius:3px}
.mid{flex:none;display:flex;flex-direction:column;justify-content:center}
.pbar{display:flex;align-items:center;gap:10px;padding:6px 12px;height:52px;flex:none}
.ava{width:38px;height:38px;border-radius:12px;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--brass) inset}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pname .lv{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 5px;line-height:16px}
.think{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.caps{display:flex;align-items:center;min-height:18px;font-size:12px;color:var(--ink2);gap:0;flex-wrap:nowrap;overflow:hidden}
.caps svg{width:17px;height:17px;margin-right:-5px}
.caps .adv{margin-left:9px;font-weight:700;color:var(--ink2)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:6px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);min-width:72px;text-align:center}
.clock.on{background:var(--btn);color:var(--btnInk)}
.clock.low{color:#fff;background:var(--danger)}
#boardWrap{position:relative;flex:none;align-self:center;touch-action:none}
#board{display:block;width:100%;height:100%;touch-action:none;border-radius:6px}
.pzinfo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;height:52px;flex:none}
.turn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.turn .dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px var(--brass)}
.mpips{display:flex;gap:5px}
.mpips i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.mpips i.on{background:var(--gold)}
.strip{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;overflow:hidden;cursor:pointer;touch-action:none}
.strip .grab{width:36px;height:5px;border-radius:3px;background:var(--line);flex:none}
.strip .mv{font-size:14px;white-space:nowrap;color:var(--ink2);font-variant-numeric:tabular-nums}
.strip .mv b{color:var(--ink)}
.strip .last{flex:1;min-width:0;overflow:hidden;display:flex;gap:10px;justify-content:flex-end;mask-image:linear-gradient(90deg,transparent,#000 20%)}
.tools{display:flex;gap:6px;padding:4px 10px 0;flex:none}
.tb{flex:1;height:56px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink2);min-width:0}
.tb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb:active{transform:scale(.95)}
.tb[disabled]{opacity:.4;pointer-events:none}
/* landscape: board left, panel right */
@media (orientation: landscape) and (max-height: 560px){
  #app{flex-direction:row;justify-content:center;align-items:stretch;gap:12px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px)}
  .col{max-width:none;width:auto;flex:none;flex-direction:row;gap:12px}
  .mid{justify-content:center}
  .side{order:3;display:flex;flex-direction:column;width:min(340px,40vw);min-width:0;gap:4px;justify-content:center}
  .top{padding:0}
  #oppBar,#pzInfo,.strip{margin-top:0}
  .pbar,.pzinfo{padding:4px 2px;height:48px}
  .tools{padding:4px 0 0}
  .strip{padding:0 2px}
}
/* sheet (move list) */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#sheet.open{transform:none;pointer-events:auto}
#sheet:not(.open) .sheetIn{box-shadow:none}
.sheetIn{width:100%;max-width:560px;max-height:62vh;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #0004;display:flex;flex-direction:column;padding:8px 14px calc(var(--sab) + 12px)}
.sheetHead{display:flex;align-items:center;gap:10px;min-height:44px}
.sheetHead h3{flex:1;margin:0;font-size:17px}
.mlist{overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:36px 1fr 1fr;gap:2px 6px;padding:4px 0 8px;font-variant-numeric:tabular-nums}
.mlist .no{color:var(--ink2);font-size:13px;line-height:36px;text-align:right}
.mlist button{text-align:left;font-size:15px;padding:0 8px;height:36px;border-radius:8px;font-weight:600}
.mlist button.cur{background:var(--btn);color:var(--btnInk)}
.sbtns{display:flex;gap:8px;padding-top:6px}
.sbtns .btn{margin:0;height:48px;font-size:15px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:#0c0f1488;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.card{background:var(--panel);border-radius:24px;box-shadow:0 18px 50px #0006;padding:22px 20px;width:min(380px,100%);text-align:center;animation:pop .32s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto;touch-action:pan-y;border:1px solid var(--line)}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;background:var(--btn);color:var(--btnInk);box-shadow:0 4px 0 #0003}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0003}
.btn.sec{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1408}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.seg{display:flex;background:var(--panel2);border-radius:14px;padding:4px;gap:4px;margin:6px 0 10px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2);padding:2px 4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}
.lbl{text-align:left;font-size:13px;font-weight:700;color:var(--ink2);margin-top:6px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 4px}
.lvls button{min-height:64px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.lvls button svg{width:30px;height:30px}
.lvls button span{font-size:12px;font-weight:700}
.lvls button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold) inset;background:var(--panel)}
.lvdesc{font-size:13px;color:var(--ink2);min-height:20px}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:center;gap:0;padding-top:calc(var(--sat) + 10px)}
#title{overflow:hidden}
#title::before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/72px 72px;opacity:.3;transform:rotate(-14deg);-webkit-mask-image:radial-gradient(closest-side,#000 10%,transparent);mask-image:radial-gradient(closest-side,#000 10%,transparent);pointer-events:none}
#title > *{position:relative}
#title .hero{width:150px;height:150px;margin-bottom:4px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
#title h1{margin:0;font-size:46px;letter-spacing:10px;text-indent:10px;font-weight:900;background:linear-gradient(180deg,var(--ink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{color:var(--ink2);font-size:14px;letter-spacing:4px;margin:6px 0 18px}
.tbtns{width:min(340px,100%);display:flex;flex-direction:column}
.tbtns .btn{margin-top:9px}
.tbtns .small{display:flex;gap:9px}.tbtns .small .btn{flex:1;font-size:15px}
@media (orientation: landscape) and (max-height: 560px){
  #title{flex-direction:row;gap:28px;align-items:center}
  .toast{top:calc(var(--sat) + 10px);bottom:auto}
  #title .brand{display:flex;flex-direction:column;align-items:center}
  #title .hero{width:110px;height:110px}
  #title h1{font-size:38px}
  .tbtns .btn{height:46px;margin-top:7px}
}
/* level select */
#select{align-items:stretch;padding:0;background:var(--bg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 8px) 12px 6px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--ok)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));grid-auto-rows:auto;gap:8px;align-content:start;touch-action:pan-y}
.sect{grid-column:1/-1;font-weight:800;font-size:14px;color:var(--gold);padding:10px 2px 2px;display:flex;gap:8px;align-items:baseline}
.sect small{color:var(--ink2);font-weight:600;font-size:12px}
.lt{height:72px;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:56px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .db{width:70%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt .ck{position:absolute;top:4px;right:5px;width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:3}
.lt .st{position:absolute;top:4px;left:5px;width:12px;height:12px;fill:var(--gold)}
.lt.done{background:var(--panel2)}
.lt.cur{box-shadow:0 0 0 2px var(--gold) inset,0 3px 0 var(--line)}
.lt.lock{opacity:.55}
.lt.lock svg.lk{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2.2}
.lt:active{transform:scale(.95)}
/* promotion */
#promo{background:#0c0f1455}
.prow{display:flex;gap:8px;justify-content:center;margin-top:6px}
.prow button{width:68px;height:76px;border-radius:16px;background:var(--panel2);display:grid;place-items:center}
.prow button:first-child{box-shadow:0 0 0 2px var(--gold) inset}
.prow svg{width:56px;height:56px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 112px);transform:translateX(-50%);z-index:30;background:#1b222cee;color:#f3efe6;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .35s;border:1px solid #d9b25a55}
.res{display:flex;justify-content:center;gap:22px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink)}
.bigico{width:84px;height:84px;margin:0 auto 4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:600}
.setrow:last-child{border-bottom:0}
.setrow .sw{padding:0}
.helpscroll{text-align:left;font-size:14px;line-height:1.65;color:var(--ink2)}
.helpscroll b{color:var(--ink)}
.helpscroll h4{margin:12px 0 2px;color:var(--ink);font-size:15px}
textarea.out{width:100%;height:130px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:none;-webkit-user-select:text;user-select:text}
.ach{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}
.ach .ai svg{width:22px;height:22px;stroke:var(--ink2);fill:none;stroke-width:2}
.ach.got .ai{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.ach.got .ai svg{stroke:#1b1408}
.ach div b{display:block;font-size:14px;color:var(--ink)}
.ach div span{font-size:12px;color:var(--ink2)}
.stt{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.stt td,.stt th{padding:7px 4px;border-bottom:1px solid var(--line)}
.stt th{color:var(--ink2);font-weight:600;font-size:12px}
@media (hover:hover){ .tb:hover,.ibtn:hover{filter:brightness(1.06)} .lt:hover{filter:brightness(1.04)} }
@media (max-height: 600px){ .ov{align-items:flex-start;overflow-y:auto} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app" class="hidden">
  <div class="col">
    <div class="mid">
      <div id="boardWrap"><canvas id="board" aria-label="棋盤"></canvas></div>
    </div>
    <div class="side" id="side">
      <div class="top">
        <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="tmid"><div style="min-width:0"><div class="tname" id="tName">對戰電腦</div></div><div class="tsub" id="tSub"></div></div>
        <button class="ibtn" id="bSound" aria-label="音效"><svg viewBox="0 0 24 24" id="sndIco"></svg></button>
      </div>
      <div class="pbar" id="oppBar">
        <div class="ava" id="oppAva"></div>
        <div class="pinfo"><div class="pname"><span id="oppName">電腦</span><span class="lv" id="oppLv"></span><span class="think hidden" id="thinking"></span></div><div class="caps" id="oppCaps"></div></div>
        <div class="clock hidden" id="oppClock">10:00</div>
      </div>
      <div class="pzinfo hidden" id="pzInfo">
        <div class="turn"><span class="dot" id="pzDot"></span><span id="pzTurn">白方走</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;color:var(--ink2);font-weight:700" id="pzLeft"></span><div class="mpips" id="pzPips"></div></div>
      </div>
      <div class="pbar" id="meBar">
        <div class="ava" id="meAva"></div>
        <div class="pinfo"><div class="pname"><span id="meName">你</span></div><div class="caps" id="meCaps"></div></div>
        <div class="clock hidden" id="meClock">10:00</div>
      </div>
      <div class="strip" id="strip" aria-label="棋譜（上滑展開）"><span class="grab"></span><span class="mv" id="stripCount">棋譜</span><div class="last" id="stripLast"></div></div>
      <div class="tools" id="tools"></div>
    </div>
  </div>
</div>

<div id="sheet"><div class="sheetIn">
  <div class="sheetHead"><h3>棋譜</h3><button class="ibtn" id="shClose" aria-label="收起"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>

function dailyIndex() { var k = todayKey(), h = 2166136261; for (var i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); } return 21 + ((h >>> 0) % 50); }
/* ----- sheet gestures ----- */
(function () {
  var sy = null;
  $('strip').addEventListener('pointerdown', function (e) { sy = e.clientY; });
  $('strip').addEventListener('pointerup', function (e) { if (sy == null) return; var dy = e.clientY - sy; sy = null; if (dy < -20 || Math.abs(dy) < 8) openSheet(true); });
  $('shClose').onclick = function () { openSheet(false); };
  var ty = null; $('sheet').addEventListener('pointerdown', function (e) { if (e.target.closest('.sheetHead')) ty = e.clientY; });
  $('sheet').addEventListener('pointerup', function (e) { if (ty != null && e.clientY - ty > 30) openSheet(false); ty = null; });
  $('mlist').onclick = function (e) { var b = e.target.closest('button'); if (b) browse(+b.dataset.i); };
  $('shPrev').onclick = function () { browse((G.view >= 0 ? G.view : G.snaps.length - 1) - 1); };
  $('shNext').onclick = function () { browse((G.view >= 0 ? G.view : G.snaps.length - 1) + 1); };
  $('shLive').onclick = function () { browse(G.snaps.length - 1); openSheet(false); };
})();
/* ----- keyboard ----- */
document.addEventListener('keydown', function (e) {
  if (e.target.closest && e.target.closest('textarea,input')) return;
  if (!G || $('app').classList.contains('hidden')) return;
  var k = e.key.toLowerCase();
  if (k === 'arrowleft') { browse((G.view >= 0 ? G.view : G.snaps.length - 1) - 1); e.preventDefault(); }
  else if (k === 'arrowright') { browse((G.view >= 0 ? G.view : G.snaps.length - 1) + 1); e.preventDefault(); }
  else if (k === 'u') { if (G.pz) restartPuzzle(); else doUndo(); }
  else if (k === 'h') doHint();
  else if (k === 'f') doFlip();
  else if (k === 'escape') { if (sel >= 0) { sel = -1; targets = []; } else $('bMenu').click(); }
});
/* ----- lifecycle ----- */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { running = false; if (G && G.clock && G.clock.started && !G.over) { G.clock.t[side] -= performance.now() - G.clock.mark; paused = true; } saveGame(); }
  else { running = true; if (G && G.clock && paused) { G.clock.mark = performance.now(); } paused = false; }
});
window.addEventListener('resize', function () { if (!$('app').classList.contains('hidden')) layout(); });
window.addEventListener('pagehide', saveGame);
/* ----- test hook (used by the verification bot) ----- */
window.__game = {
  state: function () { return G ? { mode: G.mode, fen: getFen(), over: G.over, busy: busy, anim: !!anim, n: G.pz ? G.pz.n : 0, N: G.pz ? G.pz.N : 0, k: G.pz ? G.pz.k : 0, side: side, attacker: G.pz ? G.pz.attacker : -1, moves: G.sans.slice(), result: $('result').classList.contains('hidden') ? '' : $('rTitle').textContent } : null; },
  sqCenter: function (name) { var s = sqParse(name), p = sqXY(s), r = cv.getBoundingClientRect(); return { x: r.left + (p[0] + SQ / 2) * r.width / BS, y: r.top + (p[1] + SQ / 2) * r.height / BS }; }
};
/* ----- boot ----- */
applyTheme(); setSoundIcon(); wInit();
(function () {
  var m = location.hash.match(/fen=([^&]+)/);
  if (m) { var f = decodeURIComponent(m[1]); if (validFen(f)) { setTimeout(function () { importText(f); }, 50); } }
})();
$('tResume').classList.toggle('hidden', !canResume());
requestAnimationFrame(loop);
</script>
</body>
