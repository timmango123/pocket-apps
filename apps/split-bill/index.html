<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>分帳小幫手</title>
<style>
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#16202a; --ink-2:#4a5866; --ink-3:#66737f;
  --line:#d3dae1; --line-strong:#aeb9c4;
  --accent:#0a6b57; --accent-ink:#ffffff; --accent-soft:#d8eee7;
  --credit:#0a6b57; --debt:#ad2c36; --debt-soft:#f8e1e3; --warn:#8a5a00;
  --focus:#1c5fd1; --scrim:rgba(14,20,26,.45); --shadow:0 1px 0 rgba(16,24,32,.06), 0 6px 18px -10px rgba(16,24,32,.25);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --surface:#161e26; --surface-2:#1d2731; --ink:#e5ebf0; --ink-2:#a3b2bf; --ink-3:#8796a4;
    --line:#2a3743; --line-strong:#3e4d5b;
    --accent:#4cc2a0; --accent-ink:#04231b; --accent-soft:#163a31;
    --credit:#5ad0ad; --debt:#ff8c92; --debt-soft:#3a1e22; --warn:#f0c060;
    --focus:#7fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161e26; --surface-2:#1d2731; --ink:#e5ebf0; --ink-2:#a3b2bf; --ink-3:#8796a4;
  --line:#2a3743; --line-strong:#3e4d5b;
  --accent:#4cc2a0; --accent-ink:#04231b; --accent-soft:#163a31;
  --credit:#5ad0ad; --debt:#ff8c92; --debt-soft:#3a1e22; --warn:#f0c060;
  --focus:#7fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding:12px 16px calc(96px + env(safe-area-inset-bottom));min-height:100%;}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* Header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;
  background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1}
.mark small{font-size:9px;font-weight:600;letter-spacing:.12em;opacity:.75;margin-top:3px}
.evname{flex:1;min-width:0;position:relative}
.evname label{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.evname input{width:100%;border:0;border-bottom:1.5px dashed var(--line-strong);background:transparent;padding:2px 0 4px;font-size:18px;font-weight:700;border-radius:0}
.evname input:focus{outline:none;border-bottom-color:var(--accent)}
.iconbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.menu{position:absolute;right:0;top:50px;z-index:30;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu button{display:block;width:100%;min-height:44px;text-align:left;padding:0 12px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.menu button.danger{color:var(--debt)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.topright{position:relative}

.sample{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:12px}
.sample span{flex:1}
.sample button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px}

/* Sections */
.sec{margin-bottom:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sechead h2{margin:0;font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.sechead .meta{font-size:12px;color:var(--ink-3)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px}
.chip{flex:none;max-width:100%;min-width:0;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-weight:600}
.chip .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700}
.hint{font-size:13px;color:var(--ink-2);margin:2px 2px 0}

/* Expense list */
.list{display:flex;flex-direction:column;gap:8px}
.item{position:relative;border-radius:12px}
.item .del{position:absolute;right:0;top:0;bottom:0;width:120px;border:0;border-radius:12px;padding-left:32px;background:var(--debt);color:var(--surface);font-weight:700;cursor:pointer;visibility:hidden}
.item.reveal .del{visibility:visible}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;touch-action:pan-y;transition:transform .2s ease;width:100%;text-align:left}
.card.drag{transition:none}
.card .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .a{overflow-wrap:anywhere;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right}
.card .s{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--ink-3);text-align:right}
.empty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* Receipt result */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px 16px;position:relative;box-shadow:var(--shadow)}
.receipt::before,.receipt::after{content:"";position:absolute;left:-1px;right:-1px;height:8px;
  background:radial-gradient(circle at 6px 0, var(--bg) 4.5px, transparent 5px) 0 0/12px 8px repeat-x}
.receipt::before{top:-1px}
.receipt::after{bottom:-1px;transform:rotate(180deg)}
.rhead{text-align:center;border-bottom:1.5px dashed var(--line-strong);padding-bottom:10px;margin-bottom:10px}
.rhead .ttl{font-weight:800;font-size:16px;letter-spacing:.04em;word-break:break-all}
.rhead .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.rhead .total{overflow-wrap:anywhere;font-family:var(--mono);font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;color:var(--ink-3);text-align:right;padding:4px 0;letter-spacing:.06em}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-top:1px dotted var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--sans);font-weight:600;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pos{color:var(--credit);font-weight:700}
td.neg{color:var(--debt);font-weight:700}
.xfers{margin-top:12px;border-top:1.5px dashed var(--line-strong);padding-top:10px}
.xfers h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 0;border-bottom:1px dotted var(--line)}
.xf .amt{margin-left:auto}
.xf .who{max-width:38%}
.xf .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xf .from{color:var(--debt)} .xf .to{color:var(--credit)}
.xf .arr{color:var(--ink-3);font-size:13px}
.xf .amt{font-family:var(--mono);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.xf .note{flex-basis:100%;font-size:12px;color:var(--ink-3);margin-top:-4px}
.done{padding:10px 0;text-align:center;color:var(--ink-2);font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--debt);color:var(--debt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions .btn{flex:1}
.manual{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-family:var(--mono);font-size:14px}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .btn{width:100%;max-width:560px;display:block;margin:0 auto;min-height:56px;font-size:17px;border-radius:14px;box-shadow:var(--shadow)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.txt{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px}
.txt:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.txt.amt{font-family:var(--mono);font-size:20px;font-weight:700}
.err{color:var(--debt);font-size:13px;margin-top:4px;min-height:0}
.okmsg{color:var(--credit);font-size:13px;margin-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface);cursor:pointer;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center}
.prow span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .preview{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:right}
.prow3{grid-template-columns:minmax(0,1fr) 90px 90px}
.sheetact{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.sheetact .btn{flex:1}
.sheetact .btn.danger{flex:0 0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;gap:6px;align-items:stretch}
.hrow .go{flex:1;min-height:52px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;cursor:pointer;min-width:0}
.hrow .go b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .go small{color:var(--ink-3);font-size:12px}
.hrow .go[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hrow .x{width:48px;border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--debt);cursor:pointer}
.dlgmsg{margin:0 0 16px;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px;min-width:64px;padding:0 10px;margin:-10px 0 -10px 4px;border-radius:8px;font-size:13px}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.added{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.added span{font-size:13px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:2px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}
.toast button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--bg);font-weight:800;cursor:pointer;text-decoration:underline}
.toast.plain{padding:12px 16px}

@media (hover:hover){
  .chip:hover,.iconbtn:hover,.btn:hover,.pick button:hover,.hrow .go:hover{border-color:var(--ink-3)}
  .menu button:hover{background:var(--surface-2)}
  .btn.primary:hover{filter:brightness(1.07)}
  .card:hover{border-color:var(--line-strong)}
}
@media (min-width:900px){
  body{padding:24px 32px 32px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
  .right{position:sticky;top:24px}
  .bar{position:static;padding:0;background:none;margin-top:10px}
  .bar .btn{max-width:none}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:86%}
  .sheet .grab{display:none}
  .toast{bottom:24px}
}
/* short landscape: the add button gets its own right-hand gutter, so it never sits on top of a card */
@media (max-height:500px) and (min-width:600px){ body{padding-right:calc(176px + env(safe-area-inset-right));padding-bottom:calc(24px + env(safe-area-inset-bottom))} .bar{left:auto;width:calc(168px + env(safe-area-inset-right));background:none;padding:0 calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 0} .bar .btn{min-height:56px;font-size:16px;padding:0 10px} }
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">分帳<small>SPLIT</small></div>
    <div class="evname">
      <label for="eventName">活動名稱</label>
      <input id="eventName" type="text" maxlength="40" autocomplete="off" placeholder="未命名活動">
    </div>
    <div class="topright">
      <button class="iconbtn" id="menuBtn" aria-label="更多選項" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" id="mNew">新活動</button>
        <button role="menuitem" id="mHist">歷史活動</button>
        <button role="menuitem" id="mSet">幣別與進位</button>
        <hr>
        <button role="menuitem" id="mExport">匯出備份（JSON）</button>
        <button role="menuitem" id="mImport">匯入備份</button>

        <button role="menuitem" id="mClear" class="danger">清除此活動的費用</button>
      </div>
    </div>
  </header>

  <div class="sample" id="sampleBar" hidden>
    <span>這是範例活動，可直接修改或開新活動。</span>

  <div class="layout">

      <section class="sec" aria-labelledby="hMembers">

      <section class="sec" aria-labelledby="hExp">

    </div>
    <aside class="right sec" aria-labelledby="hRes">
      <div class="sechead"><h2 id="hRes">結算</h2><span class="meta" id="resMeta"></span></div>
      <div class="receipt" id="receipt"></div>
    </aside>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const KEY_EVENTS = 'split-bill:v1:events', KEY_CUR = 'split-bill:v1:current';
const MAX_MEMBERS = 30, MAX_EVENTS = 50, MAX_CENTS = 999999900;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); };

/* ---------- storage ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }

const cut = (v, n) => [...String(v)].slice(0, n).join('');
// ids go into attributes unescaped, so a loaded or imported id must be short and markup-free
const okId = v => typeof v === 'string' && /^[^\s<>"'&`\\]{1,40}$/.test(v);
function sanitizeEvent(e){
  if (!e || typeof e !== 'object' || !okId(e.id)) return null;
  const seen = new Set();
  const members = (Array.isArray(e.members) ? e.members : []).filter(m => m && okId(m.id) && typeof m.name==='string')
    .map(m => ({id:m.id, name: cut(m.name.trim(), 20) || '?'}))
    .filter(m => !seen.has(m.id) && (seen.add(m.id), true)).slice(0,MAX_MEMBERS);
  const ids = new Set(members.map(m=>m.id));
  const expenses = (Array.isArray(e.expenses)?e.expenses:[]).filter(x => x && okId(x.id) && Number.isInteger(x.amountCents) && x.amountCents>0 && x.amountCents<=MAX_CENTS && ids.has(x.payerId) && ['equal','amount','ratio'].includes(x.mode) && x.shares && typeof x.shares==='object')
    .map(x => { const sh = {}; for (const k in x.shares) if (ids.has(k) && Number.isFinite(+x.shares[k]) && +x.shares[k] > 0) sh[k] = Math.round(+x.shares[k]);
      if (x.mode === 'equal') for (const k in sh) sh[k] = 1;
      if (x.mode === 'ratio') for (const k in sh) sh[k] = Math.max(1, Math.min(9999, sh[k]));
      return {id:x.id, title:cut(String(x.title||'費用'), 40), amountCents:x.amountCents, payerId:x.payerId, mode:x.mode, shares:sh}; })
    .filter(x => Object.keys(x.shares).length && (x.mode!=='amount' || Object.values(x.shares).reduce((a,b)=>a+b,0)===x.amountCents));
  return { id:e.id, name:cut(String(e.name||'未命名活動'), 40), members, expenses,
    currency: typeof e.currency==='string' ? cut(e.currency, 4) : '$', roundInt: !!e.roundInt, sample: !!e.sample,
    updatedAt: Number(e.updatedAt)||Date.now() };
}
function load(){

/* ---------- money ---------- */
function parseAmount(str){
  const s = String(str).trim().replace(/,/g,'');
  if (!s) return {err:'請輸入金額'};
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return {err: /^-/.test(s) ? '金額不可為負數' : '請輸入數字，最多兩位小數'};
  const [i,f=''] = s.split('.');
  if (i.length > 9) return {err:'金額上限 9,999,999'};
  const c = parseInt(i,10)*100 + parseInt((f+'00').slice(0,2),10);
  if (c <= 0) return {err:'金額必須大於 0'};
  if (c > MAX_CENTS) return {err:'金額上限 9,999,999'};
  return {cents:c};
}
function fmt(c, sym){
  const e = cur(); sym = sym ?? (e ? e.currency : '$');
  const neg = c < 0; c = Math.abs(c);
  const i = Math.floor(c/100), f = c%100;
  return (neg?'−':'') + sym + i.toLocaleString('en-US') + (f ? '.' + String(f).padStart(2,'0') : '');
}
function centsToInput(c){ const f=c%100; return Math.floor(c/100) + (f? '.'+String(f).padStart(2,'0') : ''); }

/* allocation: returns {memberId: cents} for one expense. Leftover cents go by largest remainder (ties: member order). */
function allocate(exp, members){
  const order = members.map(m=>m.id).filter(id => exp.shares[id] > 0);
  const out = {}; const total = exp.amountCents;
  if (!order.length) return out;
  if (exp.mode === 'amount'){ order.forEach(id => out[id] = exp.shares[id]); return out; }
  const w = order.map(id => exp.mode==='ratio' ? exp.shares[id] : 1);
  const W = w.reduce((a,b)=>a+b,0);
  let used = 0; const rem = [];
  // total ≤ 999,999,900 and w ≤ 9999·30, so total·w stays far below 2^53
  order.forEach((id,i) => { const p = total * w[i]; out[id] = Math.floor(p / W); rem.push([p - out[id]*W, i]); used += out[id]; });
  let left = total - used;
  rem.sort((a,b) => b[0]-a[0] || a[1]-b[1]);
  for (let k = 0; k < left; k++) out[order[rem[k][1]]]++;
  return out;
}
function computeNets(e){
  const paid = {}, owed = {};
  e.members.forEach(m => { paid[m.id]=0; owed[m.id]=0; });
  for (const x of e.expenses){
    paid[x.payerId] += x.amountCents;
    const a = allocate(x, e.members);
    for (const k in a) owed[k] += a[k];
  }
  return e.members.map(m => ({id:m.id, name:m.name, paid:paid[m.id], owed:owed[m.id], net:paid[m.id]-owed[m.id]}));
}
/* Fewest transfers: a group of k people whose balances sum to 0 settles in k−1 transfers, so the minimum is
   (people with a balance) − (most disjoint zero-sum groups). Equal and opposite pairs are always an optimal group;
   the rest is split exactly by a DP over subsets (up to 18 people left), otherwise largest-first greedy. */
const DP_MAX = 18;
function zeroGroups(v){
  const n = v.length, N = 1 << n;
  const sum = new Float64Array(N), dp = new Uint8Array(N);
  for (let m = 1; m < N; m++){
    const lb = 31 - Math.clz32(m & -m);
    sum[m] = sum[m ^ (1<<lb)] + v[lb];
    let best = 0;
    for (let i = 0, b = 1; i < n; i++, b <<= 1) if ((m & b) && dp[m ^ b] > best) best = dp[m ^ b];
    dp[m] = best + (sum[m] === 0 ? 1 : 0);
  }
  // walk back: the removed elements, reversed, form an order whose zero-sum prefixes split the groups
  const seq = []; let m = N - 1;
  while (m){
    const want = dp[m] - (sum[m] === 0 ? 1 : 0);
    for (let i = 0, b = 1; i < n; i++, b <<= 1) if ((m & b) && dp[m ^ b] === want){ seq.push(i); m ^= b; break; }
  }
  seq.reverse();
  const groups = []; let g = [], s = 0;
  for (const i of seq){ g.push(i); s += v[i]; if (s === 0){ groups.push(g); g = []; } }
  if (g.length) groups.push(g);
  return groups;
}
function greedy(list, out){
  const cred = list.filter(r=>r.v>0).map(r=>({...r})), debt = list.filter(r=>r.v<0).map(r=>({id:r.id, v:-r.v, o:r.o}));
  for (;;){
    const cs = cred.filter(x=>x.v>0).sort((a,b)=>b.v-a.v || a.o-b.o), ds = debt.filter(x=>x.v>0).sort((a,b)=>b.v-a.v || a.o-b.o);
    if (!cs.length || !ds.length) break;
    const t = Math.min(cs[0].v, ds[0].v);
    out.push({from:ds[0].id, to:cs[0].id, c:t}); cs[0].v -= t; ds[0].v -= t;
  }
}
function settle(rows){
  const ppl = rows.map((r,o)=>({id:r.id, v:r.net, o})).filter(r=>r.v!==0);
  const out = [], done = new Set();
  for (const d of ppl){
    if (d.v >= 0 || done.has(d.o)) continue;
    const c = ppl.find(c => c.v === -d.v && !done.has(c.o));
    if (c){ out.push({from:d.id, to:c.id, c:c.v}); done.add(d.o); done.add(c.o); }
  }
  const rest = ppl.filter(r=>!done.has(r.o));
  if (rest.length && rest.length <= DP_MAX){
    for (const g of zeroGroups(rest.map(r=>r.v))) greedy(g.map(i=>rest[i]), out);
  } else greedy(rest, out);
  const pos = Object.fromEntries(rows.map((r,i)=>[r.id,i]));
  return out.sort((a,b)=>pos[a.from]-pos[b.from] || pos[a.to]-pos[b.to]);
}
const xfCache = new Map();
function finalTransfers(e){
  const rows = computeNets(e);
  const key = (e.roundInt?'r':'') + rows.map(r=>r.id+':'+r.net).join(',');
  let hit = xfCache.get(key);
  if (!hit){
    let xs = settle(rows), note = null, dropped = 0;
    if (e.roundInt && xs.length){
      // each transfer is rounded on its own (half up), so two people owing the same amount always pay the same
      const exact = xs.reduce((a,x)=>a+x.c,0);
      xs = xs.map(x => ({...x, exact:x.c, c: Math.floor((x.c + 50)/100)*100}));
      dropped = xs.filter(x=>x.c===0).length;
      xs = xs.filter(x=>x.c>0);
      const diff = xs.reduce((a,x)=>a+x.c,0) - exact;
      if (diff) note = diff;
    }
    hit = {xs, note, dropped};
    if (xfCache.size > 50) xfCache.clear();
    xfCache.set(key, hit);
  }
  return {rows, xs: hit.xs.map(x=>({...x})), note: hit.note, dropped: hit.dropped};
}
window.__splitBill = { allocate, computeNets, settle, finalTransfers, parseAmount, sanitizeEvent, zeroGroups, get events(){ return events; } };

      : `<div class="done">${dropped ? `每筆轉帳都不到 ${fmt(50)}，四捨五入到整數後不用轉帳。` : e.expenses.length ? '大家已經互不相欠。' : '新增費用後會自動算出轉帳。'}</div>`}

}
/* expense list: one node per expense, rebuilt only when that expense changed, so adding one to a long list stays fast */
const modeName = {equal:'均分', amount:'自訂金額', ratio:'比例'};
const cardCache = new Map();
function renderList(e){
  const L = $('#list');
  if (!e.expenses.length){ cardCache.clear(); L.innerHTML = `<div class="empty">還沒有費用。按下方「＋ 新增費用」記下第一筆。</div>`; return; }
  const sym = e.currency, live = new Set();
  const nodes = e.expenses.map(x => {
    const n = Object.keys(x.shares).length, payer = nameOf(e,x.payerId);
    const key = [e.id, sym, x.title, x.amountCents, payer, n, x.mode].join('\u0001');
    live.add(x.id);
    let c = cardCache.get(x.id);
    if (!c || c.key !== key){
      const d = document.createElement('div'); d.className = 'item'; d.dataset.xid = x.id;
      d.innerHTML = `<button class="del" tabindex="-1" data-del="${x.id}" id="del-${x.id}">刪除</button>
      <button class="card" data-edit="${x.id}" id="card-${x.id}"><span class="t">${esc(x.title)}</span><span class="a">${fmt(x.amountCents)}</span>
      <span class="s">${esc(payer)} 先付</span><span class="m">${n} 人${modeName[x.mode]}</span></button>`;
      c = {key, node:d}; cardCache.set(x.id, c);
    }
    return c.node;
  });
  for (const k of [...cardCache.keys()]) if (!live.has(k)) cardCache.delete(k);
  const kids = L.children;
  if (kids.length && !kids[0].classList.contains('item')) L.innerHTML = '';
  for (let i = 0; i < nodes.length; i++) if (kids[i] !== nodes[i]) L.insertBefore(nodes[i], kids[i] || null);
  while (kids.length > nodes.length) L.lastElementChild.remove();
}
function resultText(){
  const e = cur(); const {xs, note} = finalTransfers(e);
  const total = e.expenses.reduce((a,x)=>a+x.amountCents,0);
  const lines = [`【${e.name}】分帳結果（共 ${fmt(total)}，${e.members.length} 人）`];
  xs.forEach(x => lines.push(`${nameOf(e,x.from)} → ${nameOf(e,x.to)} ${fmt(x.c)}`));
  if (note) lines.push(`（每筆轉帳已四捨五入到整數元，合計差額 ${note>0?'+':''}${fmt(note)}）`);
  return lines.join('\n');
}

/* ---------- toast ---------- */

/* ---------- sheets ---------- */
let lastFocus = null, onClose = null;
function openSheet(html, onMount){
  if ($('#layer').innerHTML) closeSheet(true);
  lastFocus = document.activeElement;
  const L = $('#layer');
  L.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  const scrim = $('#scrim'), shown = performance.now();
  // the scrim closes the sheet only for a press that started on it after it appeared (never the finger that opened it)
  const presses = new Map();
  scrim.addEventListener('pointerdown', ev => { if (ev.target === scrim){ ev.preventDefault(); if (ev.timeStamp >= shown) presses.set(ev.pointerId, 1); } });
  scrim.addEventListener('pointerup', ev => { const ok = presses.delete(ev.pointerId); if (ok && ev.target === scrim) closeSheet(); });
  scrim.addEventListener('pointercancel', ev => presses.delete(ev.pointerId));
  onMount && onMount(L.querySelector('.sheet'));
  // only a field that asks for it (adding something new) gets focus; otherwise the dialog itself does, so no keyboard pops up
  const f = L.querySelector('[autofocus]') || L.querySelector('.sheet');
  f && setTimeout(()=>{ if (document.contains(f)) f.focus({preventScroll: f.classList.contains('sheet')}); }, 30);
}
function closeSheet(quiet){
  const cb = onClose; onClose = null; cb && cb();
  $('#layer').innerHTML=''; if (!quiet && lastFocus && document.contains(lastFocus) && lastFocus !== document.body) lastFocus.focus({preventScroll:true});
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape'){ if ($('#layer').innerHTML) closeSheet(); else closeMenu(); } });

function confirmDlg(title, msg, okLabel='確定', danger=true){
  return new Promise(res => {
    const prev = $('#layer').innerHTML ? null : 1;
    const holder = document.createElement('div');
    holder.innerHTML = `<div class="scrim" style="z-index:50;align-items:center"><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cfT" style="border-radius:16px;max-width:420px;margin:16px"><h2 id="cfT">${esc(title)}</h2><p class="dlgmsg">${esc(msg)}</p>
      <div class="sheetact" style="position:static"><button class="btn ghost" id="cfNo">取消</button>${okLabel?`<button class="btn ${danger?'danger':'primary'}" id="cfOk" style="flex:1">${esc(okLabel)}</button>`:''}</div></div></div>`;
    document.body.appendChild(holder);
    const done = v => { holder.remove(); res(v); };
    holder.querySelector('#cfNo').onclick = () => done(false);
    const ok = holder.querySelector('#cfOk'); if (ok) ok.onclick = () => done(true);
    if (!okLabel) holder.querySelector('#cfNo').textContent = '知道了';
    (ok || holder.querySelector('#cfNo')).focus();
  });
}

/* member sheet: adding keeps the sheet open for the next name; commas add several at once */
function memberSheet(mid){
  const e = cur(); const m = mid ? e.members.find(x=>x.id===mid) : null;
  openSheet(`<h2 id="sheetTitle">${m?'編輯成員':'加入成員'}</h2>
    <div class="field"><label for="mName">${m?'名稱（1～20 字）':'名稱（1～20 字，可用逗號一次加多人）'}</label><input class="txt" id="mName" maxlength="${m?20:200}" autocomplete="off" enterkeyhint="${m?'done':'next'}" value="${m?esc(m.name):''}" ${m?'':'autofocus'}><div class="err" id="mErr"></div><div class="added" id="mAdded" aria-live="polite"></div></div>
    <div class="sheetact">${m?'<button class="btn danger" id="mDel">刪除</button><button class="btn ghost" id="mCancel">取消</button>':'<button class="btn ghost" id="mCancel">完成</button>'}<button class="btn primary" id="mSave">${m?'儲存':'加入'}</button></div>`, sh => {
    const inp = sh.querySelector('#mName');
    const submit = () => {
      const raw = inp.value;
      const names = m ? [raw.trim()] : raw.split(/[,，、;；\n]/).map(t=>t.trim()).filter(Boolean);
      const taken = new Set(e.members.filter(x => x.id !== mid).map(x => x.name.trim()));
      let err = '';
      if (!names.length || !names[0]) err = '請輸入名稱';
      else for (const n of names){
        if ([...n].length > 20){ err = `「${cut(n,8)}…」超過 20 字`; break; }
        if (taken.has(n)){ err = `已有同名成員「${n}」`; break; }
        taken.add(n);
      }
      if (!err && !m && e.members.length + names.length > MAX_MEMBERS) err = `最多 ${MAX_MEMBERS} 人（還能加 ${MAX_MEMBERS - e.members.length} 人）`;
      sh.querySelector('#mErr').textContent = err;
      if (err) { inp.focus(); return; }
      if (m){ m.name = names[0]; closeSheet(); touch(); return; }
      names.forEach(n => e.members.push({id:uid(), name:n}));
      touch();
      sh.querySelector('#mAdded').insertAdjacentHTML('beforeend', names.map(n=>`<span>✓ ${esc(n)}</span>`).join(''));
      inp.value = ''; inp.focus();
      if (e.members.length >= MAX_MEMBERS){ closeSheet(); toast(`已達 ${MAX_MEMBERS} 人上限`); }
    };
    sh.querySelector('#mSave').onclick = submit;
    inp.addEventListener('keydown', ev => { if (ev.key==='Enter' && !ev.isComposing){ ev.preventDefault(); submit(); } });
    sh.querySelector('#mCancel').onclick = () => {
      // 完成 with a typed but unsaved name: add it rather than lose it
      if (!m && inp.value.trim()){ submit(); if (sh.querySelector('#mErr').textContent) return; }
      closeSheet();
    };
    const del = sh.querySelector('#mDel');
    if (del) del.onclick = async () => {
      const payN = e.expenses.filter(x=>x.payerId===mid).length;
      if (payN){ await confirmDlg('無法刪除', `${m.name} 是 ${payN} 筆費用的付款人，請先把那些費用改成其他人付款。`, null); return; }
      const shareN = e.expenses.filter(x=>x.shares[mid]).length;
      if (shareN && !(await confirmDlg(`刪除 ${m.name}？`, `${m.name} 參與了 ${shareN} 筆費用的分攤，刪除後會從這些分攤中移除，由其餘的人重新分攤。`, '刪除'))) return;
      removeMember(e, mid); closeSheet(); touch(); toast(`已刪除 ${m.name}`);
    };
  });
}
function removeMember(e, mid){
  e.members = e.members.filter(x=>x.id!==mid);
  e.expenses.forEach(x => {
    if (!x.shares[mid]) return;
    delete x.shares[mid];
    if (x.mode === 'amount'){ const ids = Object.keys(x.shares); x.mode = 'equal'; x.shares = {}; ids.forEach(i => x.shares[i]=1); }
    if (!Object.keys(x.shares).length) e.members.forEach(mm => x.shares[mm.id]=1);
  });
}

      sel: Array.isArray(d.sel) ? d.sel.filter(i=>ids.has(i)) : [...ids], amt: obj(d.amt), ratio: obj(d.ratio) };
  } catch(err){ return null; }
}
function expenseSheet(xid, draft){

    q('#xWho').addEventListener('click', ev => { const b = ev.target.closest('[data-w]'); if (!b) return; const id=b.dataset.w; st.sel.has(id)?st.sel.delete(id):st.sel.add(id); drawPickers(); drawRows(); keep(); });
    q('#xAll').addEventListener('click', () => { if (st.sel.size===e.members.length) st.sel.clear(); else e.members.forEach(m=>st.sel.add(m.id)); drawPickers(); drawRows(); keep(); });
    q('#xMode').addEventListener('click', ev => { const b = ev.target.closest('[data-mode]'); if (!b) return; st.mode = b.dataset.mode; drawPickers(); drawRows(); keep(); });
    q('#xRows').addEventListener('input', ev => { const t = ev.target; if (t.dataset.a) st.amt[t.dataset.a] = t.value; if (t.dataset.r) st.ratio[t.dataset.r] = t.value; validate(); });
    q('#xCancel').onclick = closeSheet;
    q('#xSave').onclick = () => {
      q('#xAmount').dataset.touched = 1;
      const cents = validate(); if (cents == null) return;
      const ids = e.members.filter(m=>st.sel.has(m.id)).map(m=>m.id);
      const shares = {};
      if (st.mode === 'equal') ids.forEach(i => shares[i]=1);
      else if (st.mode === 'ratio') ids.forEach(i => shares[i]=+st.ratio[i]);
      else ids.forEach(i => { const v = String(st.amt[i]).trim(); if (v) { const c = parseAmount(v).cents; if (c) shares[i]=c; } });
      const rec = {id: x0 ? x0.id : uid(), title: q('#xTitle').value.trim() || '未命名費用', amountCents:cents, payerId:st.payer, mode:st.mode, shares};
      if (x0) Object.assign(x0, rec); else e.expenses.push(rec);
      closeSheet(); touch(); toast(x0 ? '已更新' : `已新增 ${rec.title}`);
    };
    const d = q('#xDel'); if (d) d.onclick = () => { closeSheet(); deleteExpense(x0.id); };
  });
}
function deleteExpense(id){
  const e = cur(); const idx = e.expenses.findIndex(x=>x.id===id); if (idx<0) return;
  const [x] = e.expenses.splice(idx,1); touch();
  toast(`已刪除 ${x.title}`, () => { const ev = events.find(v=>v.id===e.id); if (ev){ ev.expenses.splice(Math.min(idx, ev.expenses.length),0,x); touch(); } });
}

function blank(){ return {id:uid(), name:'未命名活動', members:[], expenses:[], currency: (cur()||{}).currency || '$', roundInt:false, sample:false, updatedAt:Date.now()}; }
async function newEvent(){
  if (events.length >= MAX_EVENTS){
    const old = events.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[events.length-1];
    if (!(await confirmDlg('活動已達 50 個上限', `開新活動會刪除最久沒更新的「${old.name}」（${old.expenses.length} 筆費用）。想保留的話，先用選單的「匯出備份」存一份。`, '刪除並開新'))) return;
    events = events.filter(v => v.id !== old.id);
  }
  const n = blank(); events.unshift(n); curId = n.id;
  save(); render(); toast('已開新活動，先加入成員吧');
}

/* backup: export every event as a JSON file, import merges it back (same id → replaced by the file's copy) */
function exportBackup(){
  const data = JSON.stringify({app:'split-bill', version:1, exportedAt:new Date().toISOString(), events}, null, 1);
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const name = `split-bill-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  try {
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`已匯出 ${events.length} 個活動`);
  } catch(err){ toast('無法匯出，請稍後再試'); }
}
async function importBackup(text){
  let raw; try { raw = JSON.parse(text); } catch(err){ await confirmDlg('無法匯入', '這不是分帳小幫手的備份檔（JSON 格式錯誤）。', null); return; }
  const list = Array.isArray(raw) ? raw : raw && Array.isArray(raw.events) ? raw.events : null;
  const got = list ? list.slice(0, 500).map(sanitizeEvent).filter(Boolean) : [];
  if (!got.length){ await confirmDlg('無法匯入', '檔案裡沒有可用的活動。', null); return; }
  const byId = new Map(); got.forEach(v => byId.set(v.id, v));
  const fresh = [...byId.values()];
  const replaced = fresh.filter(v => events.some(x=>x.id===v.id)).length;
  const total = events.length + fresh.length - replaced;
  if (total > MAX_EVENTS){ await confirmDlg('無法匯入', `匯入後會有 ${total} 個活動，超過 ${MAX_EVENTS} 個上限。請先在「歷史活動」刪除一些。`, null); return; }
  if (!(await confirmDlg(`匯入 ${fresh.length} 個活動？`, replaced ? `其中 ${replaced} 個和現有活動相同，會被備份檔的版本取代。` : '會加到歷史活動裡，現有的活動不受影響。', '匯入', false))) return;
  events = events.filter(x => !byId.has(x.id)).concat(fresh);
  curId = fresh.slice().sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
  save(); render(); toast(`已匯入 ${fresh.length} 個活動`);
}

/* list: tap to edit, swipe-left to reveal delete */
let sw = null, openCard = null;
function hideDel(card){ setTimeout(() => { if (card.style.transform === '') card.parentElement.classList.remove('reveal'); }, 220); }
function closeOpen(except){ if (openCard && openCard !== except){ openCard.style.transform=''; hideDel(openCard); openCard=null; } }
$('#list').addEventListener('pointerdown', ev => {
  const card = ev.target.closest('.card'); if (!card) return;
  closeOpen(card);
  sw = {card, x:ev.clientX, y:ev.clientY, base: card === openCard ? -88 : 0, dx:0, moved:false, id:ev.pointerId};
});
$('#list').addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.id) return;
  const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y;
  if (!sw.moved){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.moved = true; sw.card.classList.add('drag'); sw.card.parentElement.classList.add('reveal'); try{sw.card.setPointerCapture(ev.pointerId)}catch(e){} } else if (Math.abs(dy) > 10){ sw = null; return; } else return; }
  sw.dx = dx; const t = Math.max(-120, Math.min(0, sw.base + dx));
  sw.card.style.transform = `translateX(${t}px)`;
});
function endSwipe(){
  if (!sw) return; const s = sw; sw = null;
  s.card.classList.remove('drag');
  if (!s.moved) return;
  s.card.dataset.swiped = '1';
  const t = s.base + s.dx;
  if (t < -50){ s.card.style.transform = 'translateX(-88px)'; openCard = s.card; s.card.parentElement.querySelector('.del').tabIndex = 0; }
  else { s.card.style.transform = ''; hideDel(s.card); if (openCard === s.card) openCard = null; }
}
$('#list').addEventListener('pointerup', endSwipe);
$('#list').addEventListener('pointercancel', endSwipe);
$('#list').addEventListener('click', ev => {

  const c = ev.target.closest('[data-edit]'); if (!c) return;

/* copy / share */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); if (ok) return true;
  } catch(e){}
  return false;
}

  }
  if (ev.target.closest('#shareBtn')){
    try { await navigator.share({text: resultText()}); } catch(e){ if (e && e.name !== 'AbortError') toast('分享未完成'); }
  }
});

/* ---------- touch: act on release ----------
   Each pointerId remembers the control it went down on; releasing on that control (moved < 10 px, or inside its box grown
   by 16 px) runs it once with el.click() under `firing`, so a tap works while another finger rests on the page (Chrome makes
   no click then) and two overlapping taps both act. A rebuilt control (same id) is found again at release.
   pointerdown's default is prevented, so the compatibility mousedown/focus never lands on a new screen. The browser's own click
   afterwards (Chromium 141: detail 0, no pointerType) is swallowed in the capture phase: any click within 800 ms of lastTapUp,
   unless Enter/Space was pressed after that tap. A lone detail-0 click (keyboard, screen reader) runs once. */
const TAP_SEL = 'button, label';
const downs = new Map();
let firing = false, lastTapUp = -1e9, lastKey = -1e9, claimedUp = -1e9, claimedEl = null;
function claimPointer(id){ const d = downs.get(id); if (d) d.claimed = true; }
addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') lastKey = performance.now(); }, true);
addEventListener('keyup', ev => { if (ev.key === ' ') lastKey = performance.now(); }, true);
document.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const el = ev.target.closest && ev.target.closest(TAP_SEL);
  if (!el || el.disabled) return;
  downs.set(ev.pointerId, {el, id: el.id, x: ev.clientX, y: ev.clientY});
  ev.preventDefault();
});
document.addEventListener('pointerup', ev => {
  const d = downs.get(ev.pointerId); if (!d) return;
  downs.delete(ev.pointerId);
  // a long press already acted: its release only swallows the browser's own click on that control
  if (d.claimed){ claimedUp = performance.now(); claimedEl = d.el; return; }
  lastTapUp = performance.now();
  let el = d.el;
  if (!el.isConnected && d.id) el = document.getElementById(d.id) || el;
  if (!el.isConnected || el.disabled || !el.getClientRects().length) return;
  const r = el.getBoundingClientRect(), m = 16;
  const still = Math.hypot(ev.clientX - d.x, ev.clientY - d.y) < 10;
  const inBox = ev.clientX >= r.left - m && ev.clientX <= r.right + m && ev.clientY >= r.top - m && ev.clientY <= r.bottom + m;
  if (!still && !inBox) return;
  const a = document.activeElement;
  if (a && a !== el && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) a.blur();
  if (a !== el && el.tagName === 'BUTTON') try { el.focus({preventScroll: true}); } catch(err){}
  firing = true; try { el.click(); } finally { firing = false; }
});
document.addEventListener('pointercancel', ev => downs.delete(ev.pointerId));
addEventListener('click', ev => {
  if (firing) return;
  const t = ev.target;
  // text boxes and selects: their click only places the caret / opens the list, never runs an action twice
  if (t instanceof Element && t.closest('textarea, select, option, input:not([type=checkbox]):not([type=radio])')) return;
  // the hidden file input and download links are clicked from code
  if (t instanceof Element && (t.id === 'importFile' || t.matches('a[download]'))) return;
  const recentTap = performance.now() - lastTapUp < 800 && !(lastKey > lastTapUp);
  if (performance.now() - claimedUp < 800 && claimedEl && t instanceof Node && claimedEl.contains(t)){ ev.preventDefault(); ev.stopImmediatePropagation(); return; }
  if (recentTap || (ev.isTrusted && (ev.detail > 0 || ev.pointerType))){ ev.preventDefault(); ev.stopImmediatePropagation(); }
}, true);

render();
{ const dr = readDraft(); if (dr) expenseSheet(dr.xid, dr); else { try { localStorage.removeItem(KEY_DRAFT); } catch(err){} } }
})();
