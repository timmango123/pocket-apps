<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

/* ---------------- picking & commands ---------------- */
function screenTile(sx, sy, lift) {

}

    const fx = OX + (f.x - f.y) * 32 * Z, fy = OY + (f.x + f.y) * 16 * Z - 10 * Z;
    const d = Math.hypot(fx - sx, fy - sy);

}
function pickTile(sx, sy) {

  return screenTile(sx, sy, 0);
}

  refreshUnitCard(); updateRosterSel();
}

function command(f, t) {
  const kind = tile[t];
  const say = (msg, col) => { toast(f.name + ' → ' + msg); sfx.cmd(); addMarker(t, col || '#74e06b'); refreshUnitCard(); };
  const fail = (msg) => { toast(msg, true); sfx.err(); };
  if (f.act > 0) return fail(f.name + ' 正在裝卸，請稍候');
  if (f.carry === 1) {
    if (kind === T_OUT) {
      const d = outDocks[outAt[t]];
      if (d.truck !== 'docked') return fail(d.name + ' 正在換車');
      if (f.job.dock !== d) { if (f.job.dock) f.job.dock.incoming = Math.max(0, f.job.dock.incoming - 1); d.incoming++; f.job.dock = d; }
      f.state = 'toDock'; routeTo(f);
      return say('送貨至 ' + d.name, '#e9b949');
    }
    if (kind === T_RACK) { // 點到貨架：自動改送最近可用的出貨碼頭，不必再點一次
      const d = (f.job.dock && f.job.dock.truck === 'docked' && f.job.dock.load + f.job.dock.incoming < TRUCK_CAP) ? f.job.dock : chooseOutDock(f);
      if (d) {
        if (f.job.dock !== d) { if (f.job.dock) f.job.dock.incoming = Math.max(0, f.job.dock.incoming - 1); d.incoming++; f.job.dock = d; }
        f.state = 'toDock'; routeTo(f);
        return say('載有訂單貨品，改送 ' + d.name, '#e9b949');
      }
    }
    return fail(f.name + ' 載有訂單貨品，請指派出貨碼頭');
  }
  if (f.carry === 2) {
    if (kind === T_RACK) {
      const r = racks[rackAt[t]];
      if (r.stock >= RACK_CAP) return fail(r.name + ' 已滿');
      if (r !== f.job.rack) { if (r.restocking) return fail(r.name + ' 已有補貨任務'); f.job.rack.restocking = false; r.restocking = true; f.job.rack = r; }
      f.state = 'toRack'; routeTo(f);

    }
    return fail(f.name + ' 載有補貨棧板，請指派貨架');

  if (!dropJob(f)) return fail('無法取消目前任務');

    if (o) { if (startPick(f, o)) return say('揀貨 ' + r.name); return fail('無法抵達 ' + r.name); }

const pointers = new Map();

    const [a, b] = [...pointers.values()];
    gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };

    if (gesture.moved > 10 || gesture.type === 'pan') {

  if (e.key === 'Escape') { select(null); inspect = null; refreshUnitCard(); closeOps(); return; }
  if (/^[1-9]$/.test(e.key)) { const f = forklifts.find(q => q.id === +e.key); if (f) select(f, true); return; }
  if (e.key === '+' || e.key === '=') zoomAt(vw / 2, topH + (vh - topH - botH) / 2, 1.2);
  if (e.key === '-') zoomAt(vw / 2, topH + (vh - topH - botH) / 2, 1 / 1.2);
});
window.addEventListener('keyup', (e) => keys.delete(e.key));
window.addEventListener('blur', () => keys.clear());

/* ---------------- UI ---------------- */
const $ = (id) => document.getElementById(id);
let toastT = 0;
function toast(msg, bad) {
  const el = $('toast'); el.textContent = msg; el.classList.toggle('bad', !!bad); el.classList.add('show');
  toastT = 2.2;
}
let hintTimer = setTimeout(() => $('hint').hidden = true, 14000);
function hideHintSoon() { clearTimeout(hintTimer); hintTimer = setTimeout(() => $('hint').hidden = true, 5000); }
$('hintClose').addEventListener('click', () => { $('hint').hidden = true; ensureAudio(); });

function togglePause() {
  paused = !paused;
  $('bPause').setAttribute('aria-pressed', paused); $('bPause').setAttribute('aria-label', paused ? '繼續' : '暫停');
  $('pauseIco').setAttribute('d', paused ? 'M4 2.5 13 8l-9 5.5z' : 'M4 3h3v10H4zM9 3h3v10H9z');
}
$('bPause').addEventListener('click', () => { ensureAudio(); togglePause(); });
$('bSpeed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('bSpeed').textContent = speed + '×'; });
$('alertToggle').addEventListener('click', () => {
  const a = $('alerts'); a.classList.toggle('collapsed'); $('alertToggle').setAttribute('aria-expanded', !a.classList.contains('collapsed'));
});
if (window.innerWidth < 641) { $('alerts').classList.add('collapsed'); $('alertToggle').setAttribute('aria-expanded', 'false'); }
$('alertList').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-key]'); if (!b) return;
  const a = alerts.get(b.dataset.key); if (!a) return;
  if (a.unit && forklifts.includes(a.unit)) select(a.unit, true);
  else if (a.tile >= 0) { focusTile(a.tile % W, (a.tile / W) | 0); inspectTile(a.tile); }
});
$('zIn').addEventListener('click', () => zoomAt(vw / 2, topH + (vh - topH - botH) / 2, 1.25));
$('zOut').addEventListener('click', () => zoomAt(vw / 2, topH + (vh - topH - botH) / 2, 1 / 1.25));
$('zFit').addEventListener('click', () => fitView(true));

const rateEl = $('rate');
rateEl.value = rate; $('rateOut').textContent = rate + ' 張/時';
rateEl.addEventListener('input', () => { rate = +rateEl.value; $('rateOut').textContent = rate + ' 張/時'; nextOrderIn = Math.min(nextOrderIn, expo()); store.set('wc-rate', rate); });
$('addF').addEventListener('click', () => { ensureAudio(); addForklift(false); });
$('remF').addEventListener('click', () => { ensureAudio(); removeForklift(); });
$('allAuto').addEventListener('click', () => { for (const f of forklifts) f.auto = true; toast('全部堆高機改為自動接單'); sfx.cmd(); rebuildRoster(); refreshUnitCard(); });
$('heatBtn').addEventListener('click', () => { heat = !heat; $('heatBtn').setAttribute('aria-pressed', heat); });
function setMute(m) { muted = m; $('muteBtn').setAttribute('aria-pressed', m); $('muteBtn').textContent = m ? '音效：關' : '音效：開'; store.set('wc-muted', m); }
setMute(muted);
$('muteBtn').addEventListener('click', () => { ensureAudio(); setMute(!muted); });
// 重置要再按一次頁內的「確定重置」（不用 confirm()）；確認鈕出現後 0.4 秒才可按，避免連點直接清空
let resetAskT = 0, resetArmT = 0;
function hideResetAsk() { clearTimeout(resetAskT); clearTimeout(resetArmT); $('resetAsk').hidden = true; $('resetAsk').classList.remove('arming'); }
$('resetBtn').addEventListener('click', () => {
  const a = $('resetAsk'); if (!a.hidden) return;
  a.hidden = false; a.classList.add('arming');
  resetArmT = setTimeout(() => a.classList.remove('arming'), 400);
  resetAskT = setTimeout(hideResetAsk, 6000);
});
$('resetNo').addEventListener('click', hideResetAsk);
$('resetYes').addEventListener('click', () => { if ($('resetAsk').classList.contains('arming')) return; hideResetAsk(); reset(); toast('模擬已重置'); closeOps(); });
let opsOpenT = 0;
$('ops').addEventListener('transitionend', e => { if (e.target === $('ops') && e.propertyName === 'transform') { clearTimeout(opsOpenT); $('ops').classList.remove('opening'); } });
function closeOps() { $('ops').classList.remove('open', 'opening'); clearTimeout(opsOpenT); hideResetAsk(); $('opsBtn').textContent = '調度 ▴'; }
$('opsBtn').addEventListener('click', () => {
  const o = $('ops'); o.classList.toggle('open'); const open = o.classList.contains('open');
  $('opsBtn').textContent = open ? '調度 ▾' : '調度 ▴';
  clearTimeout(opsOpenT); o.classList.remove('opening');
  if (open) { // 面板滑入期間按鈕位置一直在動，等動畫結束才接受點擊
    const ms = parseFloat(getComputedStyle(o).transitionDuration) * 1000 || 0;
    if (ms > 0) { o.classList.add('opening'); opsOpenT = setTimeout(() => o.classList.remove('opening'), ms + 120); }
  } else hideResetAsk();
});
$('opsClose').addEventListener('click', closeOps);

$('bAuto').addEventListener('click', () => {
  if (!selected) return;
  selected.auto = !selected.auto; sfx.cmd();
  toast(selected.name + (selected.auto ? ' 自動接單' : ' 改為手動待命'));
  rebuildRoster(); refreshUnitCard();
});
$('bCharge').addEventListener('click', () => {
  const f = selected; if (!f) return;
  if (f.carry) { toast(f.name + ' 需先卸貨', true); sfx.err(); return; }
  const c = freeCharger(f); if (!c) { toast('充電座皆使用中', true); sfx.err(); return; }
  dropJob(f); startCharge(f, c); toast(f.name + ' → 充電 ' + c.name); sfx.cmd(); addMarker(c.i, '#48d6c4'); refreshUnitCard();
});
$('bStop').addEventListener('click', () => {
  const f = selected; if (!f) return;
  if (!dropJob(f)) { toast(f.name + ' 載貨中無法停止', true); sfx.err(); return; }
  f.auto = false; toast(f.name + ' 停止並轉為手動'); sfx.cmd(); rebuildRoster(); refreshUnitCard();
});
$('bFocus').addEventListener('click', () => { if (selected) focusTile(selected.x, selected.y); else fitView(true); });

const STATE_TXT = { idle: '待命', toPick: '前往揀貨', picking: '揀貨中', toDock: '送往出貨', waitDock: '等待碼頭', waitTruck: '等待貨車', unloading: '裝車中',
  toIn: '前往進貨', waitIn: '等待棧板', loading: '取棧板', toRack: '補貨上架', stocking: '上架中', toCharge: '前往充電', charging: '充電中', moving: '移動中' };
function stateText(f) {
  let s = STATE_TXT[f.state] || f.state;
  if (f.wait > 1.2) s = '塞車等待';
  return s;
}
function jobText(f) {
  const j = f.job; if (!j) return f.auto ? '自動接單中' : '等待指令';
  if (j.type === 'pick') return '訂單 #' + j.order.id + ' · ' + j.rack.name + (j.dock ? ' → ' + j.dock.name : '');
  if (j.type === 'restock') return '補貨 ' + j.src.name + ' → ' + j.rack.name;
  if (j.type === 'charge') return j.ch.name;
  if (j.type === 'goRack') return j.rack.name;
  return '';
}
const rosterEl = $('roster');
function rebuildRoster() {
  rosterEl.textContent = '';
  for (const f of forklifts) {
    const b = document.createElement('button');
    b.className = 'unit' + (f.auto ? '' : ' manual'); b.dataset.id = f.id;
    b.innerHTML = '<b>' + f.name + '</b><em></em><span class="bat"><i></i></span>';
    b.setAttribute('aria-pressed', f === selected);
    b.addEventListener('click', () => { ensureAudio(); if (selected === f) focusTile(f.x, f.y); else select(f, true); });
    rosterEl.appendChild(b);
  }
  if (forklifts.length < 12) {
    const a = document.createElement('button'); a.className = 'unit addu'; a.textContent = '＋ 部署';
    a.setAttribute('aria-label', '新增堆高機');
    a.addEventListener('click', () => { ensureAudio(); addForklift(false); });
    rosterEl.appendChild(a);
  }
  updateRoster();
}
function updateRosterSel() { for (const b of rosterEl.children) if (b.dataset.id) b.setAttribute('aria-pressed', selected && +b.dataset.id === selected.id); }
function updateRoster() {
  for (const b of rosterEl.children) {
    if (!b.dataset.id) continue;
    const f = forklifts.find(q => q.id === +b.dataset.id); if (!f) continue;
    b.children[1].textContent = stateText(f);
    const i = b.children[2].firstChild;
    i.style.width = Math.max(0, f.battery).toFixed(0) + '%';
    i.style.background = f.battery > 50 ? '#74e06b' : f.battery > 20 ? '#e9b949' : '#ff5b4e';
  }
}
function refreshUnitCard() {
  const t = $('uTitle'), s = $('uSub');
  const btns = $('uBtns');
  if (selected && !forklifts.includes(selected)) selected = null;
  if (selected) {
    const f = selected;
    t.innerHTML = f.name + '<span>' + stateText(f) + ' · 電量 ' + Math.round(f.battery) + '%</span>';
    s.textContent = jobText(f);
    btns.hidden = false;
    $('bAuto').setAttribute('aria-pressed', f.auto); $('bAuto').textContent = f.auto ? '自動接單：開' : '自動接單：關';
  } else if (inspect) {
    btns.hidden = true;
    const r = inspect.ref;
    if (inspect.kind === 'rack') {
      const wait = Math.max(0, r.demand);
      t.innerHTML = '貨架 ' + r.name + '<span>庫存 ' + r.stock + '/' + RACK_CAP + '</span>';
      s.textContent = '待揀訂單 ' + wait + (r.restocking ? ' · 補貨中' : '') + ' · 累計揀貨 ' + r.picks + (r.demand > r.stock ? ' · 缺貨！' : '');
    } else if (inspect.kind === 'in') {
      t.innerHTML = '進貨碼頭 ' + r.name + '<span>' + (r.truck === 'none' ? '無貨車' : '貨車卸貨中') + '</span>';
      s.textContent = '暫存棧板 ' + r.staging + '/' + STAGE_CAP + '（已預約 ' + r.reserved + '）';
    } else if (inspect.kind === 'out') {
      t.innerHTML = '出貨碼頭 ' + r.name + '<span>' + (r.truck === 'docked' ? '貨車裝載中' : '換車中') + '</span>';
      s.textContent = r.truck === 'docked' ? '裝載 ' + r.load + '/' + TRUCK_CAP + ' · 途中 ' + r.incoming : '新貨車即將抵達';
    } else {
      t.innerHTML = '充電座 ' + r.name + '<span>' + (r.by ? '使用中：' + r.by.name : '空閒') + '</span>';
      s.textContent = '選取堆高機後點此處即可派去充電';
    }
  } else {
    btns.hidden = true;
    let idle = 0; for (const f of forklifts) if (!f.job) idle++;
    t.innerHTML = '未選取<span>點一下堆高機以下達指令</span>';
    s.textContent = '共 ' + forklifts.length + ' 台堆高機 · ' + idle + ' 台待命 · 已出貨 ' + shippedTotal + ' 張';
  }
  const nb = cmdEl.getBoundingClientRect().height;
  if (Math.abs(nb - botH) > 1) resize();
}
let shownVer = -1;
function renderAlerts() {
  if (shownVer === alertVer) return;
  shownVer = alertVer;
  const list = [...alerts.values()].sort((a, b) => lvl(b.level) - lvl(a.level) || b.t - a.t);
  const el = $('alertList');
  const cnt = $('alertCount');
  const serious = list.filter(a => a.level !== 'info').length;
  cnt.textContent = list.length; cnt.classList.toggle('zero', serious === 0);
  if (!list.length) { el.innerHTML = '<li class="none">目前無瓶頸，作業順暢</li>'; return; }
  el.innerHTML = list.slice(0, 5).map(a => '<li><button class="' + a.level + '" data-key="' + a.key + '"><span>' + esc(a.text) + '</span><time>' + clockStr(a.t) + '</time></button></li>').join('');
}
function lvl(l) { return l === 'crit' ? 2 : l === 'warn' ? 1 : 0; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function clockStr(t) { const m = Math.floor(8 * 60 + t / 60); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function setKpi(id, cls) { const el = $(id); el.classList.remove('warn', 'crit', 'good'); if (cls) el.classList.add(cls); }
let uiT = 0, miniT = 0;
function uiTick(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  for (let k = markers.length - 1; k >= 0; k--) { markers[k].life -= dt * 1.4; if (markers[k].life <= 0) markers.splice(k, 1); }
  miniT -= dt; if (miniT <= 0) { miniT = 0.2; renderMini(); }
  uiT -= dt; if (uiT > 0) return; uiT = 0.25;
  const k = kpis();
  $('vThr').innerHTML = k.thr + '<small>/時</small>';
  $('vFill').innerHTML = k.fill + '<small>%</small>';
  $('vBack').textContent = k.back;
  $('vDock').innerHTML = k.dock + '<small>%</small>';
  setKpi('kFill', k.fill < 85 ? 'crit' : k.fill < 95 ? 'warn' : 'good');
  setKpi('kBack', k.back >= 28 ? 'crit' : k.back >= 14 ? 'warn' : null);
  setKpi('kDock', k.dock > 90 ? 'crit' : k.dock > 75 ? 'warn' : null);
  $('vClock').textContent = clockStr(simT);
  if (simT > 1800 && k.thr > bestThr) { bestThr = k.thr; store.set('wc-best-thr', bestThr); }
  $('bestOut').textContent = bestThr ? bestThr + ' 張/時' : '—';
  renderAlerts(); updateRoster(); refreshUnitCard();
  renderPortrait(performance.now() / 1000);
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    let rem = dt * speed;
    while (rem > 1e-6) { const s = Math.min(rem, 0.05); update(s); rem -= s; }
  }
  updateCamera(dt);
  render(now / 1000);
  uiTick(dt);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });
window.addEventListener('resize', () => { resize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); fitView(false); }, 200));

reset();
resize();
fitView(false);
buildSprites();
requestAnimationFrame(frame);
window.__wc = { get forklifts() { return forklifts; }, get orders() { return orders; }, get selected() { return selected; }, get simT() { return simT; }, get shipped() { return shippedTotal; }, cam, tileScreen(i) { const x = i % W, y = (i / W) | 0; return [OX + (x - y) * 32 * Z, OY + (x + y) * 16 * Z]; }, racks, outDocks, W };
})();
</script>
