<title>存錢計畫</title>
<style>

}

  --bg: #0e1715; --surface: #15211e; --surface-2: #1b2a26; --ink: #e3ece9; --muted: #98aaa4; --line: #2a3b36; --line-2: #3a4e48;
  --principal: #7fb0cc; --principal-soft: #2c4d5f; --gain: #58c690; --gain-soft: #1f5a40; --loss: #f0877c; --loss-soft: #5e2a25;
  --target: #e6a94a; --focus: #7ab4ff; --on-accent: #0e1715; --accent: #6fd0a7; color-scheme: dark; } }

  --principal: #7fb0cc; --principal-soft: #2c4d5f; --gain: #58c690; --gain-soft: #1f5a40; --loss: #f0877c; --loss-soft: #5e2a25;
  --target: #e6a94a; --focus: #7ab4ff; --on-accent: #0e1715; --accent: #6fd0a7; color-scheme: dark; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }

.inp .unit { position: absolute; right: 12px; color: var(--muted); font-size: 14px; pointer-events: none; }
input[type="range"] { width: 100%; height: 44px; margin: 0 0 -8px; accent-color: var(--accent); background: transparent; }
.row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.row2:has(> [hidden]) > .field { grid-column: 1 / -1; }

.err { font-size: 13px; color: var(--loss); margin: 4px 0 0; font-weight: 600; }

.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.res { padding: 12px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.res:nth-child(odd) { border-right: 1px solid var(--line); }
.res.hero { grid-column: 1 / -1; border-right: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent); }

<div class="wrap">
  <header>
    <h1>複利與存錢計畫<small>定期定額 · 目標反推 · 年度成長表</small></h1>

    <button class="icon-btn" id="theme" type="button" aria-label="切換深淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3z"/></svg></button>
  </header>

  <div class="grid">
    <section class="panel inputs" aria-label="輸入">
      <div class="seg" role="group" aria-label="計算模式">
        <button type="button" id="mode-fv" data-mode="fv" aria-pressed="true">算終值</button>
        <button type="button" id="mode-pmt" data-mode="pmt" aria-pressed="false">算每月需存</button>

      <div class="row2">
      <div class="field"><label for="principal">初始本金</label><div class="inp"><input id="principal" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">元</span></div></div>
      <div class="field" id="f-monthly"><label for="monthly">每月投入</label><div class="inp"><input id="monthly" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">元</span></div></div>
      </div>
      <div class="field" id="f-target"><label for="target">目標金額<span id="target-opt">（選填，畫目標線）</span></label><div class="inp"><input id="target" inputmode="decimal" autocomplete="off"><span class="unit">元</span></div></div>

      </div>
      </div>
      <div class="field"><span class="lab">複利頻率</span>

      <div class="opt">

        </div>

      <p class="foot">試算以逐月模擬，結果僅供規劃參考；實際投資報酬會波動，非保證收益。</p>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const K = 'savings-plan:v1:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(K + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) {} }
};
const DEF = { principal: '100000', monthly: '10000', target: '4000000', rate: '6', years: '20', freq: 'm', timing: 'end', growth: '', inflation: '2' };
const FREQS = ['y', 'm', 'd'], TIMINGS = ['begin', 'end'];
let S = Object.assign({}, DEF);
const saved = store.get('inputs', null);
let isExample = true;
if (saved && typeof saved === 'object' && !Array.isArray(saved)) { for (const k in DEF) if (typeof saved[k] === 'string') S[k] = saved[k]; isExample = !!saved.__example; }
if (!FREQS.includes(S.freq)) S.freq = DEF.freq;          // 存檔壞掉時回到預設，按鈕也照實顯示
if (!TIMINGS.includes(S.timing)) S.timing = DEF.timing;
let mode = store.get('mode', 'fv'); if (!['fv', 'pmt', 'years'].includes(mode)) mode = 'fv';

/* theme */
const themeSaved = store.get('theme', null);
if (themeSaved === 'light' || themeSaved === 'dark') document.documentElement.dataset.theme = themeSaved;
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next); requestAnimationFrame(draw);
});

/* ---------- 純函式 ---------- */
/* 全形英數符號 → 半形 */
const half = s => String(s == null ? '' : s).replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
/* 金額：接受千分位逗號、全形數字、「萬／千／百／億」（10萬、1.5萬、1萬5000、5千），其他（abc、0x10、1e3）回傳 bad */
const UNIT = { '億': 1e8, '亿': 1e8, '萬': 1e4, '万': 1e4, '千': 1e3, '仟': 1e3, '百': 1e2, '佰': 1e2 };
function parseAmount(s) {
  let t = half(s).replace(/[,\s，、_]/g, '').replace(/元$/, '');
  if (t === '') return { empty: true, v: 0 };
  let neg = false;
  if (/^[-−–]/.test(t)) { neg = true; t = t.slice(1); } else if (t[0] === '+') t = t.slice(1);
  const re = /(\d+(?:\.\d+)?|\.\d+)([億亿萬万千仟百佰]?)/y;
  let total = 0, lastU = Infinity, i = 0;
  if (t === '') return { bad: true };
  while (i < t.length) {
    re.lastIndex = i; const m = re.exec(t);
    if (!m) return { bad: true };
    const u = m[2] ? UNIT[m[2]] : 1;
    if (u >= lastU) return { bad: true };
    total += Number(m[1]) * u; lastU = u; i = re.lastIndex;
  }
  if (!isFinite(total)) return { bad: true };
  return { v: neg ? -total : total };
}
/* 百分比與年數：接受全形、結尾「%／年」、負號 − – -，以及前面的 + */
function parseNum(s, suffix) {
  let t = half(s).replace(/[,\s，]/g, '').replace(suffix, '');
  if (t === '') return { empty: true, v: 0 };
  t = t.replace(/^[−–]/, '-');
  if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(t)) return { bad: true };
  return { v: Number(t) };
}
const pct = s => parseNum(s, /[%％]$/), yrsOf = s => parseNum(s, /年$/);
const toCents = yuan => Math.round(yuan * 100);
function monthlyRate(R, freq) {
  if (freq === 'y') return Math.pow(1 + R, 1 / 12) - 1;
  if (freq === 'd') return Math.pow(1 + R / 365, 365 / 12) - 1;
  return R / 12;
}
/* 逐月模擬；金額以「分」為整數。回傳 [{month, contributed, balance}]（month 0 = 起點） */
function simulate(p) {
  const r = monthlyRate(p.rate, p.freq), out = [{ month: 0, contributed: p.principal, balance: p.principal }];
  let bal = p.principal, contrib = p.principal, reach = p.target > 0 && bal >= p.target ? 0 : -1;
  const maxM = p.months;
  for (let m = 1; m <= maxM; m++) {
    const pay = Math.round(p.monthly * Math.pow(1 + p.growth, Math.floor((m - 1) / 12)));
    if (p.timing === 'begin') { bal += pay; bal = Math.round(bal * (1 + r)); }
    else { bal = Math.round(bal * (1 + r)); bal += pay; }
    contrib += pay;
    out.push({ month: m, contributed: contrib, balance: bal, pay });
    if (reach < 0 && p.target > 0 && bal >= p.target) { reach = m; if (p.stopAtTarget) break; }
  }

}
/* 二分搜尋每月需存（以元為精度，回傳分） */

  if (fvOf(0) >= p.target) return { cents: 0, already: true };
  if (fvOf(hi) < p.target) { // 極端負報酬時擴大上限
    let tries = 0; while (fvOf(hi) < p.target && tries < 20) { hi *= 4; tries++; }
    if (fvOf(hi) < p.target) return null;
  }
  for (let i = 0; i < 60 && hi - lo > 1; i++) { const mid = Math.floor((lo + hi) / 2); if (fvOf(mid) >= p.target) hi = mid; else lo = mid; }

}
const NF = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 1 });

/* 縮寫：萬（最多一位小數，不留 .0）、億、兆；Intl 不會出現 e+ 記號 */

  const y = c / 100, a = Math.abs(y), s = y < 0 ? '−' : '';

  if (a >= 1e8) return s + NF2.format(a / 1e8) + sep + '億';

}

function blank() {

/* 每年一列；最後一年不滿 12 個月時（算需要幾年），只算到達標當月並標示 */

/* canvas */
const cv = $('#chart'), tip = $('#tip');

document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
function userEdit() { if (isExample) { isExample = false; $('#example-note').hidden = true; } }
function syncRange(k) {
  if (k === 'rate') { const r = pct(S.rate); if (r.v != null && !r.empty) $('#rate-range').value = r.v; }
  if (k === 'years') { const r = yrsOf(S.years); if (r.v != null && !r.empty) $('#years-range').value = r.v; }
}
ids.forEach(k => $('#' + k).addEventListener('input', e => { S[k] = e.target.value; userEdit(); syncRange(k); changed(); }));
$('#rate-range').addEventListener('input', e => { S.rate = e.target.value; $('#rate').value = S.rate; userEdit(); changed(); });
$('#years-range').addEventListener('input', e => { S.years = e.target.value; $('#years').value = S.years; userEdit(); changed(); });
/* ±：iOS 數字鍵盤沒有負號，用按鈕切換正負 */
function flipSign(k) {
  const inp = $('#' + k), v = inp.value.trim();
  inp.value = /^[-−–]/.test(v) ? v.replace(/^[-−–]\s*/, '') : '-' + v.replace(/^\+/, '');
  inp.dispatchEvent(new Event('input', { bubbles: true }));
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { mode = b.dataset.mode; fill(); changed(true); }
  else if (b.dataset.freq) { S.freq = b.dataset.freq; userEdit(); fill(); changed(true); }
  else if (b.dataset.timing) { S.timing = b.dataset.timing; userEdit(); fill(); changed(true); }
  else if (b.dataset.pm) flipSign(b.dataset.pm);
});

let toastT = 0, toastAct = null, toastShownAt = -1e9;
function toast(t, act, fn) {
  const el = $('#toast'), a = $('#toast-act');
  $('#toast-t').textContent = t; el.hidden = false; toastShownAt = performance.now();
  toastAct = act ? fn : null; a.hidden = !act; if (act) a.textContent = act; el.classList.toggle('has-act', !!act);
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; toastAct = null; }, act ? 6000 : 2200);
}
$('#toast-act').addEventListener('click', () => { const f = toastAct; toastAct = null; $('#toast').hidden = true; clearTimeout(toastT); if (f) f(); });
/* 回到範例：立即還原並存檔，6 秒內可按「復原」找回原本的數字 */
const sameAsDef = () => Object.keys(DEF).every(k => S[k] === DEF[k]);
$('#reset').addEventListener('click', () => {
  if (sameAsDef()) { isExample = true; fill(); changed(true); toast('已經是範例數值'); return; }
  const snap = { S: Object.assign({}, S), isExample };
  S = Object.assign({}, DEF); isExample = true; fill(); changed(true);
  toast('已還原範例數值', '復原', () => { S = snap.S; isExample = snap.isExample; fill(); changed(true); toast('已找回你的數字'); });
});
$('#copy').addEventListener('click', () => {
  if (!last) return;
  const rows = yearRows(); let tc = 0, tg = 0;
  const lines = ['年\t年底累積\t當年投入\t當年收益'];
  rows.forEach(r => { tc += r.contrib; tg += r.gain; lines.push([r.y + (r.part ? '（前' + r.part + '個月）' : ''), Math.round(r.bal / 100), Math.round(r.contrib / 100), Math.round(r.gain / 100)].join('\t')); });
  lines.push(['合計', Math.round((rows.length ? rows[rows.length - 1].bal : last.p.principal) / 100), Math.round((tc + last.p.principal) / 100), Math.round(tg / 100)].join('\t'));
  const text = lines.join('\n');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#table')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取表格，請手動複製'); };
  try { navigator.clipboard.writeText(text).then(() => toast('已複製 ' + rows.length + ' 年資料（Tab 分隔）'), fallback); } catch (e) { fallback(); }
});

/* ---------- 觸控：放開時才執行 ----------
   每個 pointerId 記住按下的按鈕；在同一個按鈕上放開（移動 < 10 px，或在按鈕外框 16 px 內）就用 el.click() 在 `firing`
   旗標下執行一次，所以另一根手指按著頁面時也能點（Chrome 那時不產生 click）。pointerdown 取消預設：不會有相容的
   mousedown／focus，畫面換掉後新按鈕不會被點到、輸入框不會被聚焦。按按鈕時先讓輸入框失焦（± 例外：保留鍵盤）。
   之後瀏覽器自己的 click（Chromium 141：detail 0、沒有 pointerType）在捕獲階段吞掉：lastTapUp 後 800 ms 內的任何 click，
   除非之後按了 Enter／空白鍵（lastKey > lastTapUp）。單獨的 detail 0 click（鍵盤、讀屏）照常執行一次。 */
const downs = new Map();
let firing = false, lastTapUp = -1e9, lastKey = -1e9;
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') lastKey = performance.now(); }, true);
addEventListener('keyup', e => { if (e.key === ' ') lastKey = performance.now(); }, true);
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.target.closest && e.target.closest('button');
  if (!el || el.disabled) return;
  e.preventDefault();
  if (el.id === 'toast-act' && performance.now() < toastShownAt) return;   // 只接受提示出現之後才按下的手指
  downs.set(e.pointerId, { el, x: e.clientX, y: e.clientY, t: performance.now() });
});
document.addEventListener('pointerup', e => {
  const d = downs.get(e.pointerId); if (!d) return;
  downs.delete(e.pointerId);
  lastTapUp = performance.now();
  const el = d.el;
  if (!el.isConnected || el.disabled || !el.getClientRects().length || el.closest('[hidden]')) return;
  if (el.id === 'toast-act' && d.t < toastShownAt) return;
  const r = el.getBoundingClientRect(), m = 16;
  const still = Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10;
  const inBox = e.clientX >= r.left - m && e.clientX <= r.right + m && e.clientY >= r.top - m && e.clientY <= r.bottom + m;
  if (!still && !inBox) return;
  if (!el.classList.contains('pm')) {
    const a = document.activeElement;
    if (a && a !== el && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) a.blur();
    if (a !== el) try { el.focus({ preventScroll: true }); } catch (_) {}
  }
  firing = true; try { el.click(); } finally { firing = false; }
});
document.addEventListener('pointercancel', e => downs.delete(e.pointerId));
addEventListener('click', e => {
  if (firing) return;
  const t = e.target;
  if (t instanceof Element && t.matches('input, select, textarea, option, label')) return;
  const recentTap = performance.now() - lastTapUp < 800 && !(lastKey > lastTapUp);
  if (recentTap || (e.isTrusted && (e.detail > 0 || e.pointerType))) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('button')) e.preventDefault(); });

fill(); compute();
window.__savings = { simulate, solveMonthly, monthlyRate, parseAmount, short, get last() { return last; } };
