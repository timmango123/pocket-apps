<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8fd3ff">
<title>平台跳躍</title>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
<style>
/* 平台跳躍：小麻糬的百關冒險。紙膠帶般的暖色 UI，五個世界各有自己的天空與地面。 */
:root {
  color-scheme: light;
  --ink: #3b2d2a; --ink2: #7a645c; --line: rgba(80, 50, 30, .14);
  --card: #fffaf3; --card2: #f6ecdf; --chip: #efe2d1;
  --acc: #ff8a5b; --acc2: #e8663a; --acc-ink: #fff;
  --gold: #ffc23d; --gold2: #e29b12; --good: #3fae6a;
  --deck: #f4e9da; --deck2: #e9dac6; --key: #fffaf2; --key2: #e3d1bb; --keyink: #6b5246;
  --veil: rgba(255, 246, 232, .72);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
:root.dark {
  color-scheme: dark;
  --ink: #f6eadf; --ink2: #c4ad9f; --line: rgba(255, 230, 200, .14);
  --card: #2b2433; --card2: #352c3f; --chip: #3d3348;
  --acc: #ff9466; --acc2: #e8703f; --acc-ink: #fff;
  --gold: #ffcb52; --gold2: #d99a1c; --good: #5fd08a;
  --deck: #221c2a; --deck2: #2c2436; --key: #3a3046; --key2: #1a1520; --keyink: #e9d9cc;
  --veil: rgba(24, 18, 30, .7);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deck); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px); pointer-events: none; }
#hud > * { pointer-events: auto; }
.ib { width: 44px; height: 44px; border-radius: 14px; background: var(--card); display: grid; place-items: center; flex: none;
  box-shadow: 0 3px 0 var(--key2), 0 6px 14px rgba(60, 30, 10, .14); transition: transform .08s; }
.ib:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key2); }
.ib svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hp { height: 44px; border-radius: 14px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 12px;
  box-shadow: 0 3px 0 var(--key2), 0 6px 14px rgba(60, 30, 10, .12); white-space: nowrap; min-width: 0; }
.hp.lv { flex: 1 1 auto; overflow: hidden; max-width: 260px; margin-right: auto; }
.hp.lv b { font-size: 16px; font-variant-numeric: tabular-nums; }
.hp.lv span { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.gems { display: flex; gap: 3px; }
.gems i { width: 16px; height: 16px; display: block; background: currentColor; color: var(--chip);
  clip-path: polygon(50% 0, 63% 33%, 98% 36%, 71% 59%, 80% 95%, 50% 76%, 20% 95%, 29% 59%, 2% 36%, 37% 33%); transition: color .2s; }
.gems i.on { color: var(--gold); animation: gpop .45s cubic-bezier(.2, .9, .3, 1.6); }
@keyframes gpop { 0% { transform: scale(.2) rotate(-60deg); } 100% { transform: scale(1); } }
.hp.st { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; gap: 10px; flex: none; }
.hp.st .dz { color: var(--ink2); font-weight: 600; display: flex; align-items: center; gap: 3px; }
.hp.st .dz svg { width: 14px; height: 14px; fill: var(--ink2); }

/* ---------- touch deck ---------- */
#deck { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; touch-action: none;
  background: linear-gradient(180deg, var(--deck), var(--deck2)); border-top: 1px solid var(--line); }
#deck::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(40, 20, 10, .10)); }
.keys { position: absolute; inset: 0; padding: 0 calc(var(--sar) + 18px) calc(var(--sab) + 6px) calc(var(--sal) + 18px); display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.dirs { display: flex; gap: 12px; }
.key { width: var(--ks, 84px); height: var(--ks, 84px); border-radius: 26px; background: var(--key); display: grid; place-items: center; position: relative;
  box-shadow: 0 6px 0 var(--key2), 0 10px 18px rgba(60, 30, 10, .16); transition: transform .05s, box-shadow .05s, background .05s; }
.key svg { width: 40%; height: 40%; fill: var(--keyink); }
.key.on { transform: translateY(5px); box-shadow: 0 1px 0 var(--key2), 0 3px 6px rgba(60, 30, 10, .16); background: var(--card2); }
.key.jump { width: var(--kj, 100px); height: var(--kj, 100px); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb08a, var(--acc) 60%, var(--acc2));
  box-shadow: 0 7px 0 #c4522a, 0 12px 22px rgba(200, 80, 40, .32); }
.key.jump svg { fill: #fff; width: 44%; height: 44%; }
.key.jump.on { box-shadow: 0 1px 0 #c4522a, 0 3px 8px rgba(200, 80, 40, .3); background: radial-gradient(circle at 35% 30%, #ff9c70, var(--acc2) 70%); }
.key .lab { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--ink2); letter-spacing: 2px; font-weight: 700; }
/* thumbs that land a little above the panel still count */
#deck::after { content: ""; position: absolute; left: 0; right: 0; top: -32px; height: 32px; }
#deck.float::after { display: none; }
#deck.float { background: none; border: 0; top: 0; z-index: 3; }
#deck.float::before { display: none; }
#deck.float .keys { align-items: flex-end; padding-bottom: calc(var(--sab) + 18px); }
#deck.float .key { background: rgba(255, 250, 242, .42); box-shadow: 0 4px 0 rgba(80, 50, 30, .22); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
#deck.float .key.on { background: rgba(255, 250, 242, .7); }
#deck.float .key.jump { background: rgba(255, 138, 91, .62); box-shadow: 0 4px 0 rgba(196, 82, 42, .5); }
#deck.float .key.jump.on { background: rgba(255, 138, 91, .9); }
#deck.float .key .lab { display: none; }
#deck.nokeys .keys { display: none; }
#deck.side .keys { padding: 0 calc(var(--sar) + 14px) calc(var(--sab) + 20px) calc(var(--sal) + 14px); }
#deck.side .dirs { gap: 10px; }
#deck.side .key { background: var(--key); box-shadow: 0 5px 0 var(--key2), 0 8px 14px rgba(60, 30, 10, .14); backdrop-filter: none; -webkit-backdrop-filter: none; }
#deck.side .key.on { background: var(--card2); box-shadow: 0 1px 0 var(--key2); }
#deck.side .key.jump { background: radial-gradient(circle at 35% 30%, #ffb08a, var(--acc) 60%, var(--acc2)); box-shadow: 0 6px 0 #c4522a, 0 10px 18px rgba(200, 80, 40, .28); }
#deck.side .key.jump.on { box-shadow: 0 1px 0 #c4522a; background: radial-gradient(circle at 35% 30%, #ff9c70, var(--acc2) 70%); }
.khint { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 10px); text-align: center; font-size: 13px; color: var(--ink2); pointer-events: none; }
#deck.float .khint { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }

/* ---------- overlays ---------- */
.ov { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
  background: var(--veil); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { transform: translateY(14px) scale(.96); opacity: 0; } 100% { transform: none; opacity: 1; } }
.card { background: var(--card); border-radius: 26px; width: min(360px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 20px 20px; text-align: center;
  box-shadow: 0 6px 0 var(--key2), 0 22px 50px rgba(60, 30, 10, .22); animation: pop .3s cubic-bezier(.2, .9, .3, 1.15); }
.card h2 { margin: 2px 0 6px; font-size: 24px; letter-spacing: 1px; }
.card p { margin: 6px 0; color: var(--ink2); font-size: 15px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 16px; margin-top: 10px; font-weight: 800; font-size: 17px;
  background: linear-gradient(180deg, #ffa57d, var(--acc)); color: var(--acc-ink); box-shadow: 0 5px 0 #c4522a, 0 8px 16px rgba(200, 80, 40, .22); transition: transform .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c4522a; }
.btn.sec { background: var(--card2); color: var(--ink); box-shadow: 0 4px 0 var(--key2); }
.btn.sec:active { box-shadow: 0 1px 0 var(--key2); }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.row2 { display: flex; gap: 10px; } .row2 .btn { flex: 1; min-width: 0; }
.stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.stars i { width: 52px; height: 52px; display: block; background: var(--chip);
  clip-path: polygon(50% 0, 63% 33%, 98% 36%, 71% 59%, 80% 95%, 50% 76%, 20% 95%, 29% 59%, 2% 36%, 37% 33%); }
.stars i.on { background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, var(--gold2)); animation: spop .5s cubic-bezier(.2, .9, .3, 1.6) both; }
.stars i:nth-child(2) { transform: translateY(-8px); width: 60px; height: 60px; }
.stars i:nth-child(2).on { animation-name: spop2; }
@keyframes spop { from { transform: scale(0) rotate(-50deg); } }
@keyframes spop2 { from { transform: translateY(-8px) scale(0) rotate(-50deg); } to { transform: translateY(-8px); } }
.res { display: flex; justify-content: center; gap: 8px; margin: 8px 0 2px; }
.res div { flex: 1; background: var(--card2); border-radius: 14px; padding: 6px 4px; font-size: 12px; color: var(--ink2); }
.res b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.res .nb { color: var(--good); font-size: 11px; font-weight: 800; display: block; height: 14px; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 62px); transform: translateX(-50%); z-index: 8; background: rgba(50, 35, 30, .88); color: #fff;
  padding: 9px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; max-width: 88vw; text-align: center; pointer-events: none; transition: opacity .35s; white-space: nowrap; }

/* title */
#title { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; flex-direction: column; justify-content: space-between; }
.logo { margin-top: max(6vh, 12px); text-align: center; }
.logo h1 { margin: 0; font-size: clamp(40px, 12vw, 58px); line-height: 1.05; letter-spacing: 6px; color: #fff;
  -webkit-text-stroke: 0; text-shadow: 0 3px 0 #e8663a, 0 6px 0 #b8492a, 0 12px 24px rgba(120, 40, 10, .35); }
.logo .sub { display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 999px; background: rgba(255, 250, 243, .88); color: #7a4a34; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
.tmenu { width: min(340px, 100%); display: flex; flex-direction: column; }
.tmenu .btn { margin-top: 10px; }
.tmenu .meta { align-self: center; text-align: center; font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); margin-top: 10px; min-height: 18px; padding: 3px 12px; border-radius: 999px; background: rgba(50, 30, 20, .32); }
.tmenu .meta:empty { visibility: hidden; }
.ticons { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }

/* level select */
#select { padding: 0; align-items: stretch; background: var(--deck); backdrop-filter: none; -webkit-backdrop-filter: none; }
.sel { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }
.selhead { display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 10px) calc(var(--sar) + 14px) 6px calc(var(--sal) + 14px); }
.selhead h2 { flex: 1; margin: 0; font-size: 21px; }
.selhead .tot { display: flex; align-items: center; gap: 5px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--card); padding: 0 12px; height: 44px; border-radius: 14px; box-shadow: 0 3px 0 var(--key2); }
.selhead .tot i { width: 18px; height: 18px; background: var(--gold); clip-path: polygon(50% 0, 63% 33%, 98% 36%, 71% 59%, 80% 95%, 50% 76%, 20% 95%, 29% 59%, 2% 36%, 37% 33%); }
.tabs { display: flex; gap: 6px; padding: 6px calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px); }
.tab { flex: 1; min-width: 0; min-height: 48px; border-radius: 14px; background: var(--card2); font-size: 12px; font-weight: 700; color: var(--ink2); line-height: 1.15; padding: 4px 2px; position: relative; }
.tab b { display: block; font-size: 15px; color: var(--ink); }
.tab[aria-selected="true"] { background: var(--wc, var(--acc)); color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.tab[aria-selected="true"] b { color: #fff; }
.tab.lockd { opacity: .55; }
.wbanner { margin: 0 calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px); border-radius: 18px; height: 64px; position: relative; overflow: hidden; flex: none; display: flex; align-items: center; padding: 0 16px; color: #fff; }
.wbanner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.wbanner .wt { position: relative; font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.wbanner .wt small { display: block; font-size: 12px; font-weight: 600; opacity: .95; }
.grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; align-content: start;
  padding: 2px calc(var(--sar) + 14px) calc(var(--sab) + 18px) calc(var(--sal) + 14px); }
.lt { aspect-ratio: 1 / 1.08; min-height: 48px; border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 var(--key2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; }
.lt .n { font-size: 20px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.lt .s { display: flex; gap: 1px; }
.lt .s i { width: 11px; height: 11px; background: var(--chip); clip-path: polygon(50% 0, 63% 33%, 98% 36%, 71% 59%, 80% 95%, 50% 76%, 20% 95%, 29% 59%, 2% 36%, 37% 33%); }
.lt .s i.on { background: var(--gold); }
.lt.done { background: var(--card); }
.lt.cur { box-shadow: 0 4px 0 var(--acc2), 0 0 0 3px var(--acc) inset; }
.lt.lock { background: var(--card2); color: var(--ink2); box-shadow: none; opacity: .75; }
.lt.lock svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.lt .new { position: absolute; top: -5px; right: -4px; background: var(--acc); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 8px; }
.lt:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--key2); }

/* help & intro */
.hl { text-align: left; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.hl .r { display: flex; gap: 12px; align-items: center; background: var(--card2); border-radius: 14px; padding: 8px 10px; font-size: 14px; color: var(--ink2); line-height: 1.45; }
.hl .r b { color: var(--ink); }
.hl canvas, .hl .ic { flex: none; width: 52px; height: 52px; border-radius: 12px; }
.hl .ic { display: grid; place-items: center; background: var(--card); }
.hl .ic svg { width: 28px; height: 28px; fill: var(--keyink); }
.mechart { width: 100%; height: 120px; border-radius: 16px; display: block; margin: 8px 0 4px; }
.set { text-align: left; margin-top: 8px; }
.srow { display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid var(--line); gap: 10px; font-size: 15px; }
.srow:last-child { border-bottom: 0; }
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-width: 50px; min-height: 44px; padding: 0 8px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--key2); }
.sw { width: 58px; height: 44px; position: relative; flex: none; }
.sw::before { content: ""; position: absolute; left: 4px; right: 4px; top: 8px; height: 28px; border-radius: 14px; background: var(--chip); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 7px; top: 11px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.sw[aria-checked="true"]::before { background: var(--good); }
.sw[aria-checked="true"]::after { transform: translateX(22px); }
@media (orientation: landscape) and (max-height: 520px) {
  #title { flex-direction: row; align-items: center; justify-content: space-evenly; padding-bottom: 70px; }
  .logo { margin-top: 0; }
  .logo h1 { font-size: 46px; letter-spacing: 4px; }
  .tmenu { width: min(320px, 46vw); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <button class="ib" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hp lv"><b id="hLv">1-1</b><span id="hWorld">晨光草原</span></div>
  <div class="hp gems" id="hGems" aria-label="星星"><i></i><i></i><i></i></div>
  <div class="hp st"><span id="hTime">0:00</span><span class="dz" aria-label="失敗次數"><svg viewBox="0 0 16 16"><path d="M8 1.5a5.5 5.5 0 00-5.5 5.5c0 1.8.8 3 2 3.8V13.5h7v-2.7c1.2-.8 2-2 2-3.8A5.5 5.5 0 008 1.5zM5.8 8.6a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4zm4.4 0a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4z"/></svg><span id="hDeaths">0</span></span></div>
</div>

<div id="deck" hidden>
  <div class="keys" id="keys">
    <div class="dirs"><div class="key" id="kL"><svg viewBox="0 0 24 24"><path d="M15.5 4.5L7 12l8.5 7.5z"/></svg><span class="lab">左</span></div><div class="key" id="kR"><svg viewBox="0 0 24 24"><path d="M8.5 4.5L17 12l-8.5 7.5z"/></svg><span class="lab">右</span></div></div>
    <div class="key jump" id="kJ"><svg viewBox="0 0 24 24"><path d="M12 3.5l8 9h-5v8H9v-8H4z"/></svg><span class="lab">跳躍</span></div>
  </div>
  <div class="khint" id="khint" hidden>← → 或 A D 移動　空白鍵、↑ 或 Z 跳躍　Esc 暫停</div>
</div>

<div class="ov" id="title">
  <div class="logo"><h1>平台跳躍</h1><div class="sub">小麻糬的百關冒險</div></div>
  <div class="tmenu">
    <button class="btn" id="tPlay"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></svg><span id="tPlayLab">開始冒險</span></button>

  [].forEach.call($('setTheme').children, function (b) { b.setAttribute('aria-pressed', b.dataset.v === set.theme ? 'true' : 'false'); });
  var icon = set.snd ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>' : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
  [].forEach.call(document.querySelectorAll('svg.snd'), function (el) { el.innerHTML = icon; });
}
var settingsBack = null;
function openSettings(from) { settingsBack = from; syncSettings(); showOnly('settings'); }
function openHelp(from) { helpBack = from; buildHelp(); showOnly('help'); }
var helpBack = null;

$('bPause').onclick = function () { sfx('tap'); pause(); };
$('pResume').onclick = function () { sfx('tap'); resume(); };
$('pRestart').onclick = function () { sfx('tap'); drop('run'); restartLevel(); };
$('pHelp').onclick = function () { sfx('tap'); openHelp('pause'); };
$('pSelect').onclick = function () { sfx('tap'); openSelect(); };
$('pSet').onclick = function () { sfx('tap'); openSettings('pause'); };
$('wNext').onclick = function () { sfx('tap'); startLevel(Math.min(NL, lvN + 1)); };
$('wRetry').onclick = function () { sfx('tap'); startLevel(lvN); };
$('wSelect').onclick = function () { sfx('tap'); scene = 'menu'; openSelect(Math.floor((Math.min(NL, lvN + 1) - 1) / 20)); };
$('iOk').onclick = function () { sfx('tap'); var m = PJ.introAt(lvN); if (m) { save.seen[m.key] = 1; saveSave(); } introPending = false; resume(); };
$('hOk').onclick = function () { sfx('tap'); showOnly(helpBack); };
$('setOk').onclick = function () { sfx('tap'); showOnly(settingsBack); if (settingsBack === 'title') refreshTitle(); };
$('setSnd').onclick = function () { set.snd = !set.snd; saveSet(); syncSettings(); sfx('tap'); };
$('setVib').onclick = function () { set.vib = !set.vib; saveSet(); syncSettings(); buzz(20); };
$('setSwap').onclick = function () { set.swap = !set.swap; saveSet(); syncSettings(); layout(); };
[].forEach.call($('setTheme').children, function (b) { b.onclick = function () { set.theme = b.dataset.v; saveSet(); applyTheme(); syncSettings(); }; });
$('sBack').onclick = function () { sfx('tap'); if (backTo === 'pause' && L && scene === 'play') showOnly('pause'); else goTitle(); };
$('tPlay').onclick = function () {
  sfx('tap');
  var run = load('run', null);
  if (run && run.n >= 1 && run.n <= NL && unlocked(run.n)) startLevel(run.n, run);
  else startLevel(Math.min(NL, save.max + 1));
};
$('tSelect').onclick = function () { sfx('tap'); openSelect(); };
$('tHelp').onclick = function () { sfx('tap'); openHelp('title'); };
$('tSound').onclick = function () { set.snd = !set.snd; saveSet(); syncSettings(); sfx('tap'); };
$('tSet').onclick = function () { sfx('tap'); openSettings('title'); };

function refreshTitle() {
  var run = load('run', null), next = Math.min(NL, save.max + 1);
  if (run && run.n >= 1 && run.n <= NL && unlocked(run.n)) $('tPlayLab').textContent = '繼續 第 ' + run.n + ' 關' + (run.cp >= 0 ? '（中途旗）' : '');
  else $('tPlayLab').textContent = save.max ? '繼續 第 ' + next + ' 關' : '開始冒險';
  $('tMeta').textContent = save.max ? '已過 ' + save.max + ' 關・星星 ' + totalStars() + ' / 300' : '100 關・5 個世界';
  syncSettings();
}
function goTitle() {
  scene = 'title'; paused = false; if (side) layout(); $('hud').hidden = true; deck.hidden = true; clearInput();
  var w = Math.max(0, Math.min(4, Math.floor(((save.last || 1) - 1) / 20)));
  startDemo(w * 20 + 1);
  refreshTitle(); showOnly('title');
}

/* title attract mode: the hero hops through the first stage of the current world on its own */
function startDemo(n) {
  L = PJ.genLevel(n); s = PJ.newRun(L); lvN = n; parts = []; sprAnim = {}; deathT = 0; winT = 0;
  demo = { i: 0, held: false, wait: 0 };
  camX = 0; prevX = s.x; prevY = s.y; invalidateArt(); makeSigns(); signs = [];
}
function demoTick() {
  tick++;
  if (demo.wait > 0) { demo.wait--; stepFx(); if (demo.wait === 0) startDemo(lvN); return; }
  prevX = s.x; prevY = s.y;
  // simple autopilot: run right, jump at edges and walls
  var ahead = Math.floor(s.x + C.PW + 0.6), feet = Math.floor(s.y + C.PH + 0.1);
  var gapAhead = PJ.tileAt(L, ahead, feet) === T.E && PJ.tileAt(L, ahead, feet + 1) === T.E;
  var wall = PJ.tileAt(L, ahead, feet - 1) !== T.E;
  var want = s.ground && (gapAhead || wall);
  var held = want || (demo.held && s.vy < 0);
  ev.length = 0;
  PJ.step(L, s, { h: 1, j: held, jp: want && !demo.held }, ev);
  demo.held = held;
  for (var i = 0; i < ev.length; i++) {
    var e = ev[i];
    if (e[0] === 'jump') { hero.sq = -0.28; dust(s.x + C.PW / 2, s.y + C.PH, 4, 1); }
    else if (e[0] === 'land' && e[1] > 6) { hero.sq = Math.min(0.42, e[1] * 0.022); dust(s.x + C.PW / 2, s.y + C.PH, 4, 1); }
    else if (e[0] === 'gem') { var g = L.gems[e[1]]; sparkle(g[0], g[1], 12); }
  }
  hero.face = 1; if (s.ground) hero.runT += Math.abs(s.vx) * 0.025;
  stepFx();
  var target = s.x - viewW * 0.3; camX += (clampCam(target) - camX) * 0.1;
  if (s.dead || s.won || s.x > L.goal[0] - 2 || s.ticks > 3600) demo.wait = 40;
}

/* ---------------- lifecycle ---------------- */
document.addEventListener('visibilitychange', function () { if (document.hidden) { if (scene === 'play' && !paused) pause(); saveRun(); } });
window.addEventListener('pagehide', saveRun);
window.addEventListener('resize', function () { layout(); if (L && scene === 'play') camX = clampCam(camX); if (!$('select').hidden) drawBanner(); });

/* ---------------- test hooks (read-only + level start) ---------------- */
window.PJ = PJ;
window.__game = {
  levelCount: NL,
  get scene() { return scene; }, get paused() { return paused; }, get level() { return lvN; },
  startLevel: function (n, opts) { if (opts && opts.skipIntro) { var m = PJ.introAt(n); if (m) save.seen[m.key] = 1; } startLevel(n); },
  state: function () {
    if (!s) return null;
    return { scene: scene, paused: paused, n: lvN, x: s.x, y: s.y, vx: s.vx, vy: s.vy, ground: s.ground, wall: s.wall, t: s.t, ticks: s.ticks, dead: s.dead || deathT > 0, deathT: deathT, won: s.won, winT: winT,
      gems: s.gems, cp: s.cp, deaths: s.deaths, held: s.held, buf: s.buf, coyote: s.coyote, jumping: s.jumping, cut: s.cut, cr: Array.from(s.cr), mover: s.mover, gtile: s.gtile, lock: s.lock, face: s.face, spring: s.spring, wallCoy: s.wallCoy, wallDir: s.wallDir, lockDir: s.lockDir };
  },
  run: function () { if (!s) return null; var o = {}; for (var k in s) o[k] = k === 'cr' ? Array.from(s.cr) : s[k]; o.deathT = deathT; o.winT = winT; return o; },
  input: function () { return { presses: input.presses, used: input.used, jumps: input.jumps, h: curH(), held: heldJ() }; },
  view: function () { return { S: S, camX: camX, oy: oy, ox: ox, VW: VW, side: side, CW: CW, CH: CH, deckH: deckH, float: floatPad }; },
  keyRects: function () { var f = function (el) { var r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }; return { L: f(keyEls.L), R: f(keyEls.R), J: f(keyEls.J) }; },
  save: function () { return JSON.parse(JSON.stringify(save)); },
  // screenshot helper: drop the hero onto the ground at column x (used by demo/verify.js for the cover only)
  _teleport: function (x) {
    if (!L || !s) return;
    var y = 0; while (y < H && PJ.tileAt(L, x, y) === T.E) y++;
    s.x = x + 0.5 - C.PW / 2; s.y = Math.min(H, y) - C.PH - 0.01; s.vx = 0; s.vy = 0; prevX = s.x; prevY = s.y;
    camX = clampCam(s.x - viewW * 0.38);
  }
};

applyTheme();
layout();
syncSettings();
goTitle();
requestAnimationFrame(frame);
})();
</script>
