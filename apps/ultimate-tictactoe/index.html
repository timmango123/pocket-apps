<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>九宮井字</title>
<style>
:root {
  --bg: #e7ebf0; --ink: #1d2a44; --sub: #5d6b82; --card: #ffffff; --card2: #f1f4f8; --line: rgba(29, 42, 68, .14);
  --x: #e0263a; --o: #1f5fd6; --accent: #1f5fd6; --accent-ink: #fff; --shadow: 0 4px 14px rgba(30, 45, 70, .12); --chip: #edf1f6;
  --tex: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e22; --ink: #f1ede4; --sub: #a3a8ae; --card: rgba(255, 255, 255, .055); --card2: rgba(255, 255, 255, .1); --line: rgba(241, 237, 228, .16);
    --x: #ff3d9a; --o: #2de2e6; --accent: #2de2e6; --accent-ink: #10181a; --shadow: 0 4px 16px rgba(0, 0, 0, .35); --chip: rgba(255, 255, 255, .07);
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e22; --ink: #f1ede4; --sub: #a3a8ae; --card: rgba(255, 255, 255, .055); --card2: rgba(255, 255, 255, .1); --line: rgba(241, 237, 228, .16);
  --x: #ff3d9a; --o: #2de2e6; --accent: #2de2e6; --accent-ink: #10181a; --shadow: 0 4px 16px rgba(0, 0, 0, .35); --chip: rgba(255, 255, 255, .07);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); background-image: var(--tex); color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; max-width: 560px; margin: 0 auto; display: grid; grid-template-rows: auto auto 1fr auto auto auto 1fr auto;
  grid-template-areas: "top" "score" "sp1" "stage" "strip" "panel" "sp2" "tools"; gap: 6px;
  padding: env(safe-area-inset-top) max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
.top { grid-area: top; display: flex; align-items: center; gap: 6px; height: 50px; }
.top h1 { flex: 1; margin: 0; text-align: center; font-size: 21px; letter-spacing: 4px; font-weight: 900; white-space: nowrap;
  text-shadow: -1.5px 0 0 var(--x), 1.5px 0 0 var(--o); }
.ibtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; flex: 0 0 44px; }
.ibtn svg, .tb svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.score { grid-area: score; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 6px 8px; box-shadow: var(--shadow); }
.side { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 8px; border-radius: 12px; transition: box-shadow .25s, background .25s; }
.side.r { flex-direction: row-reverse; text-align: right; }
.side.on.sx { box-shadow: inset 0 0 0 2px var(--x), 0 0 14px -2px var(--x); }
.side.on.so { box-shadow: inset 0 0 0 2px var(--o), 0 0 14px -2px var(--o); }
.sym { width: 30px; height: 30px; flex: 0 0 30px; }
.sym path, .sym circle { fill: none; stroke-width: 3.2; stroke-linecap: round; }
.sx .sym path, .sx .sym circle { stroke: var(--x); } .so .sym path, .so .sym circle { stroke: var(--o); }
.side.on .sym { animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg); } }
.who { min-width: 0; }
.who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-size: 12px; color: var(--sub); white-space: nowrap; }
.who small i { font-style: normal; font-weight: 800; color: var(--ink); font-size: 14px; }
.mid { text-align: center; font-size: 12px; color: var(--sub); line-height: 1.3; min-width: 72px; }
.mid .vs { font-weight: 900; font-size: 15px; color: var(--ink); white-space: nowrap; }
.lvl { display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--ink); font-size: 11px; font-weight: 700; white-space: nowrap; }
.stars { color: #f5b301; letter-spacing: -1px; }
.stage { grid-area: stage; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
#cv { display: block; touch-action: none; border-radius: 14px; }
.strip { grid-area: strip; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 12px; border-radius: 14px;
  background: var(--card); border: 1px dashed var(--line); font-size: 14px; font-weight: 700; text-align: center; line-height: 1.3; }
.strip .k { color: var(--x); } .strip .q { color: var(--o); }
.strip .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin: 0 1.5px; animation: dot 1s infinite; }
.strip .dots i:nth-child(2) { animation-delay: .15s; } .strip .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4; } }
.strip.flash { animation: sflash .45s; }
@keyframes sflash { 30% { background: var(--card2); transform: scale(1.03); } }
.tools { grid-area: tools; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 0 8px; }
.tb { height: 52px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; }
.tb:disabled { opacity: .38; }
@media (hover: hover) { .tb:not(:disabled):hover, .ibtn:hover, .btn:hover, .chip:hover { filter: brightness(1.08); } }
.tb:active, .ibtn:active, .btn:active, .chip:active { transform: scale(.96); }
@media (orientation: landscape) and (max-height: 560px) {
  #app { max-width: none; grid-template-columns: auto minmax(260px, 420px); grid-template-rows: auto auto 1fr auto auto; justify-content: center; column-gap: 14px;
    grid-template-areas: "stage top" "stage score" "stage panel" "stage strip" "stage tools"; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .stage { width: calc(100dvh - 12px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); max-width: 56vw; }
  .panel { display: flex !important; }
  .tools { padding: 0; }
}
.panel { grid-area: panel; display: none; align-items: center; justify-content: center; gap: 12px; min-height: 0; overflow: hidden; padding: 2px 6px; }
.panel.on { display: flex; }
@media not ((orientation: landscape) and (max-height: 560px)) { .panel canvas { width: 72px; height: 72px; flex-basis: 72px; } }
.panel canvas { width: 84px; height: 84px; flex: 0 0 84px; }
.panel .info { font-size: 13px; color: var(--sub); line-height: 1.6; min-width: 0; }
.panel .info b { color: var(--ink); }
.toast { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -10px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px;
  font-weight: 800; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; white-space: nowrap; }
.toast.show { opacity: .95; transform: translate(-50%, 0); }
/* overlays */
.ov { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 14px;
  background: rgba(10, 12, 16, .5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); overflow-y: auto; }
.sheet { width: 100%; max-width: 430px; background: var(--bg); background-image: var(--tex); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  padding: 16px 16px 16px; animation: pop .32s cubic-bezier(.2, 1.4, .4, 1); margin: auto; }
@keyframes pop { from { transform: scale(.88) translateY(16px); opacity: 0; } }
@media (max-height: 600px) { .ov { align-items: flex-start; } }
.sheet h2 { margin: 0 0 6px; font-size: 21px; text-align: center; letter-spacing: 2px; }
.logo { text-align: center; margin: 0 0 6px; }
.logo canvas { width: 96px; height: 96px; display: block; margin: 0 auto 2px; }
.logo .big { font-size: 32px; font-weight: 900; letter-spacing: 8px; text-shadow: -2px 0 0 var(--x), 2px 0 0 var(--o); }
.logo .tag { font-size: 13px; color: var(--sub); margin-top: 4px; }
.sec { margin-top: 12px; }
.sec > .lab { display: block; font-size: 12px; font-weight: 800; color: var(--sub); margin: 0 2px 6px; letter-spacing: 1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { flex: 1 1 0; min-height: 44px; min-width: 0; border: 1px solid var(--line); border-radius: 13px; background: var(--card); padding: 4px 4px; font-size: 14px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.chip small { font-size: 11px; color: var(--sub); font-weight: 600; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 14px -3px var(--accent); }
.chip.on small { color: inherit; opacity: .85; }
.lvdesc { font-size: 12px; color: var(--sub); margin: 6px 2px 0; min-height: 16px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 2px 2px; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
.row .t small { display: block; font-size: 12px; color: var(--sub); font-weight: 500; margin-top: 1px; }
.sw { position: relative; width: 52px; height: 32px; flex: 0 0 52px; border-radius: 99px; border: 0; background: var(--chip); box-shadow: inset 0 0 0 1px var(--line); }
.sw::before { content: ""; position: absolute; inset: -6px; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); font-size: 16px; font-weight: 800; margin-top: 10px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 18px -6px var(--accent); }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btns .btn { font-size: 14px; min-height: 46px; }
.res-title { text-align: center; font-size: 34px; font-weight: 900; letter-spacing: 4px; margin: 6px 0 2px; }
.res-sub { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--sub); }
.kv b { display: block; font-size: 20px; color: var(--ink); }
.ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-top: 8px; font-size: 14px; font-weight: 700; }
.ach i { font-style: normal; width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-size: 17px; }
.ach small { display: block; color: var(--sub); font-weight: 500; font-size: 12px; }
.ach.lock { opacity: .45; } .ach.new { box-shadow: 0 0 0 2px var(--accent), 0 0 16px -4px var(--accent); }
table.st { width: 100%; border-collapse: collapse; font-size: 13px; }
table.st th, table.st td { padding: 7px 4px; text-align: center; border-bottom: 1px dashed var(--line); }
table.st th { color: var(--sub); font-weight: 700; font-size: 12px; }
.tut-cv { display: block; margin: 6px auto; touch-action: none; border-radius: 12px; }
.tut-txt { font-size: 15px; line-height: 1.55; min-height: 70px; margin: 4px 2px 0; }
.tut-txt b { color: var(--accent); }
.steps { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
.steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .steps i.on { background: var(--accent); }
.sharebox { white-space: pre; font-size: 22px; line-height: 1.25; text-align: center; padding: 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); user-select: text; -webkit-user-select: text; }
.hidden { display: none !important; }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>九宮井字</h1>
    <button class="ibtn" id="bSound" aria-label="音效"><svg viewBox="0 0 24 24" id="sndIcon"></svg></button>
  </header>
  <div class="score">
    <div class="side sx" id="sideX"><svg class="sym" viewBox="0 0 30 30"><path d="M7 7L23 23M23 7L7 23"/></svg><div class="who"><b id="nX">你</b><small>小盤 <i id="cX">0</i></small></div></div>
    <div class="mid"><div class="vs" id="turnTxt">輪到你</div><span class="lvl" id="lvlTag"></span></div>
    <div class="side so r" id="sideO"><svg class="sym" viewBox="0 0 30 30"><circle cx="15" cy="15" r="9"/></svg><div class="who"><b id="nO">電腦</b><small>小盤 <i id="cO">0</i></small></div></div>
  </div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="九宮井字棋盤"></canvas></div>
  <div class="strip" id="strip">&nbsp;</div>
  <div class="panel" id="panel"><canvas id="mapCv" width="168" height="168"></canvas><div class="info" id="pInfo"></div></div>
  <nav class="tools">
    <button class="tb" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
    <button class="tb" id="bHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
    <button class="tb" id="bNew"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/></svg>重新開局</button>
    <button class="tb" id="bRules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.3M12 17h.01"/></svg>規則</button>
  </nav>
</div>

<div class="ov hidden" id="menu"><div class="sheet">
  <div class="logo"><canvas id="logoCv" width="192" height="192"></canvas><div class="big">九宮井字</div><div class="tag">下在哪一格，就把對手送到哪一盤</div></div>
  <button class="btn pri hidden" id="mResume">繼續上一局</button>
  <div class="sec"><span class="lab">模式</span><div class="chips" id="cMode"><button class="chip" data-v="ai">對電腦</button><button class="chip" data-v="pvp">同機雙人</button></div></div>
  <div class="sec" id="secAI"><span class="lab">電腦等級（難度）</span><div class="chips" id="cLevel"></div><div class="lvdesc" id="lvDesc"></div>
    <div class="sec"><span class="lab">先手（X 先下）</span><div class="chips" id="cFirst"><button class="chip" data-v="me">我先 ✕</button><button class="chip" data-v="ai">電腦先</button><button class="chip" data-v="rnd">隨機</button></div></div></div>
  <div class="sec"><span class="lab">規則變體</span>
    <div class="row"><div class="t">多數決<small>大盤無連線時，贏得小盤多者勝</small></div><button class="sw" role="switch" aria-checked="false" data-var="1" aria-label="多數決"></button></div>
    <div class="row"><div class="t">已贏小盤仍可下<small>小盤贏了不關閉，下滿才關閉</small></div><button class="sw" role="switch" aria-checked="false" data-var="2" aria-label="已贏小盤仍可下"></button></div>
    <div class="row"><div class="t">和小盤雙方共有<small>和局小盤在大盤上同時算給雙方</small></div><button class="sw" role="switch" aria-checked="false" data-var="4" aria-label="和小盤雙方共有"></button></div>
  </div>
  <button class="btn pri" id="mStart">開始新局</button>
  <button class="btn" id="mDaily">📅 每日開局 <small id="dailyTag" style="font-weight:600;color:var(--sub)"></small></button>
  <div class="btns"><button class="btn" id="mTut">互動教學</button><button class="btn" id="mStats">戰績成就</button><button class="btn" id="mSet">設定</button></div>
</div></div>

<div class="ov hidden" id="settings"><div class="sheet">
  <h2>設定</h2>
  <div class="row"><div class="t">音效<small>粉筆沙沙聲、勝利和弦</small></div><button class="sw" role="switch" id="sSound" aria-label="音效"></button></div>
  <div class="row"><div class="t">震動<small>贏小盤、任選一盤時輕震</small></div><button class="sw" role="switch" id="sVib" aria-label="震動"></button></div>
  <div class="row"><div class="t">預覽確認<small>先點一下預覽，再點同一格才落子</small></div><button class="sw" role="switch" id="sConfirm" aria-label="預覽確認"></button></div>
  <div class="row"><div class="t">送盤箭頭<small>落子後箭頭飛向被送去的小盤</small></div><button class="sw" role="switch" id="sArrow" aria-label="送盤箭頭"></button></div>
  <div class="sec"><span class="lab">外觀</span><div class="chips" id="cTheme"><button class="chip" data-v="auto">跟隨系統</button><button class="chip" data-v="dark">黑板</button><button class="chip" data-v="light">白板</button></div></div>
  <button class="btn pri" data-close="settings">完成</button>
</div></div>

<div class="ov hidden" id="stats"><div class="sheet">
  <h2>戰績與成就</h2>
  <div class="kv" id="stTop"></div>
  <table class="st" id="stTable" style="margin-top:10px"></table>
  <div id="achList"></div>
  <button class="btn pri" data-close="stats">關閉</button>
</div></div>

<div class="ov hidden" id="tut"><div class="sheet">
  <h2>送盤規則 <span id="tutStep" style="font-size:14px;color:var(--sub)"></span></h2>
  <canvas class="tut-cv" id="tutCv"></canvas>
  <div class="tut-txt" id="tutTxt"></div>
  <div class="steps" id="tutDots"><i></i><i></i><i></i></div>
  <div class="btns" style="grid-template-columns:1fr 2fr"><button class="btn" id="tutSkip">略過</button><button class="btn pri" id="tutNext">下一步</button></div>
</div></div>

<div class="ov hidden" id="result"><div class="sheet">
  <canvas id="resCv" width="320" height="200" style="display:block;margin:-10px auto -14px;width:160px;height:100px"></canvas>
  <div class="res-title" id="rTitle">你贏了</div>
  <div class="res-sub" id="rSub"></div>
  <div class="kv" id="rKv"></div>
  <div id="rAch"></div>
  <button class="btn pri" id="rAgain">再來一局</button>
  <div class="btns"><button class="btn" id="rView">看盤面</button><button class="btn" id="rShare">分享</button><button class="btn" id="rMenu">選單</button></div>
</div></div>

<div class="ov hidden" id="shareOv"><div class="sheet">
  <h2>分享終局</h2>
  <div class="sharebox" id="shareBox"></div>
  <div class="res-sub" style="margin-top:8px">長按或選取上方文字即可複製</div>

    const s = UT.newState(0); s[0] = 1 | 16 | 256; s[9] = 2 | 8; s[12] = 1; s[11] = 4; s[3] = 64; s[BX] = 1; s[CL] = 1; s[TN] = 1; s[NX] = -1; s[LMV] = 27; s[UT.PL] = 6; TV.s = s; tutP.dirty = true;
    $('tutTxt').innerHTML = '小盤裡<b>三連線</b>就贏下該盤，蓋上大符號、不能再下。O 剛把你送到<b>已結束的左上盤</b>，所以你可以<b>任選一盤</b>！點任一發光盤。';
  }
}
$('tutCv').addEventListener('pointerdown', e => {
  e.preventDefault(); if (!tut || tut.done) return; const m = tutP.hit(...evXY(tutP, e)), s = TV.s;
  if (tut.step === 0 && m !== 38) { TV.flash = now(); sfx.buzz(); return; }
  if (!UT.isLegal(s, m) || s[TN] !== 1) { TV.flash = now(); sfx.buzz(); return; }
  const ev = UT.play(s, m); tutP.animMove(m, 1, ev); sfx.chalk(1); TV.hint = -1; TV.focus = null; tut.done = true; $('tutNext').disabled = false;
  const to = s[NX];
  $('tutTxt').innerHTML = tut.step === 0 ? '看箭頭！你下在小盤的<b>右上</b>格，所以對手 O 被<b>送到大盤右上</b>那一盤，只能在那裡下。'
    : tut.step === 1 ? `你下在<b>${NAMES[m % 9]}</b>格 → 對手被送到<b>${NAMES[to]}盤</b>。記住：<b>你下的位置 ＝ 對手要去的盤</b>。`
    : '大盤上<b>三個小盤連成一線</b>就獲勝！現在你懂得「送盤」了，去操縱對手吧。';
});
$('tutNext').onclick = () => { sfx.click(); if (tut.step < 2) { tut.step++; tutStep(); } else tutEnd(); };
$('tutSkip').onclick = () => { sfx.click(); tutEnd(); };
function tutEnd() { closeOv('tut'); tut = null; if (!settings.tut) { settings.tut = true; saveSettings(); } if (!G) openMenu(); }
// ---------- logo ----------
function drawLogo() {
  const c = $('logoCv'); if (!c || !PAL) return; const x = c.getContext('2d'); x.clearRect(0, 0, 192, 192);
  const L = { mark: Painter.prototype.mark, dpr: 2 }, col = PAL.dark ? 'rgba(242,236,222,.85)' : '#1d3a6b';
  x.strokeStyle = col; x.lineWidth = 6; x.lineCap = 'round';
  for (const k of [70, 122]) { x.beginPath(); x.moveTo(k, 22); x.lineTo(k, 170); x.stroke(); x.beginPath(); x.moveTo(22, k); x.lineTo(170, k); x.stroke(); }
  [[0, 1], [4, 1], [8, 1], [2, 2], [6, 2], [5, 2]].forEach(([i, p], k) => L.mark(x, p, 44 + (i % 3) * 52, 44 + ((i / 3) | 0) * 52, 16, 1, k, 10, 6));
  x.strokeStyle = PAL.x; x.lineWidth = 5; x.globalAlpha = .9; x.beginPath(); x.moveTo(30, 30); x.lineTo(162, 162); x.stroke(); x.globalAlpha = 1;
}
// ---------- layout + loop ----------
const landMQ = matchMedia('(orientation: landscape) and (max-height: 560px)');
function layout() {
  const app = $('app'), st = $('stage'), cs = getComputedStyle(app), padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  let S;
  if (landMQ.matches) { st.style.height = ''; S = Math.min(st.clientWidth, app.clientHeight - padV); }
  else {
    const used = ['.top', '.score', '#strip', '.tools'].reduce((a, q) => a + document.querySelector(q).offsetHeight, 0) + 36;
    const pn = $('panel'); pn.classList.remove('on');
    const avail = app.clientHeight - padV - used; S = Math.min(app.clientWidth - padH, avail);
    if (avail - S > 100) { pn.classList.add('on'); S = Math.min(S, avail - pn.offsetHeight - 6); }
    st.style.height = Math.floor(S) + 'px';
  }
  main.resize(S);
}
function drawPanel() {
  if (!G || !(landMQ.matches || $('panel').classList.contains('on'))) return;
  const c = $('mapCv'), x = c.getContext('2d'), s = G.s, al = s[RS] < 0 ? UT.allowed(s) : [], k = 56;
  x.clearRect(0, 0, 168, 168);
  const tmp = { dpr: 2, mark: Painter.prototype.mark };
  for (let b = 0; b < 9; b++) {
    const bx = (b % 3) * k, by = ((b / 3) | 0) * k, o = UT.owner(s, b);
    x.fillStyle = al.includes(b) ? (s[TN] === 1 ? PAL.x : PAL.o) : PAL.dark ? 'rgba(255,255,255,.06)' : 'rgba(29,42,68,.06)';
    x.globalAlpha = al.includes(b) ? 0.25 : 1; x.fillRect(bx + 3, by + 3, k - 6, k - 6); x.globalAlpha = 1;
    if (o === 3) { x.strokeStyle = PAL.slash; x.lineWidth = 5; x.beginPath(); x.moveTo(bx + 14, by + k - 14); x.lineTo(bx + k - 14, by + 14); x.stroke(); }
    else if (o) tmp.mark(x, o, bx + k / 2, by + k / 2, 15, 1, b, 8, 6);
  }
  const t = lastThink, tl = t && G.mode === 'ai' ? `${LEVELS[G.level - 1].name}上一手：<b>${t.ms < 1000 ? t.ms + '</b> 毫秒' : (t.ms / 1000).toFixed(2) + '</b> 秒'}${t.sims ? `・模擬 <b>${t.sims.toLocaleString()}</b> 次` : t.depth ? `・搜尋 <b>${t.depth}</b> 層` : ''}` : '';
  $('pInfo').innerHTML = `大盤概況・第 <b>${G.moves.length}</b> 手<br>小盤 <b style="color:var(--x)">✕ ${pc(s[BX])}</b>　<b style="color:var(--o)">◯ ${pc(s[BO])}</b>　和 <b>${pc(s[BD])}</b><br>${tl}`;
}
new ResizeObserver(layout).observe($('stage'));
addEventListener('resize', layout); landMQ.addEventListener && landMQ.addEventListener('change', () => { layout(); drawPanel(); });
let raf = 0;
function frame(t) { raf = 0; if (document.hidden) return; main.render(t); if (tut) tutP.render(t); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) raf = requestAnimationFrame(frame); });
// ---------- boot ----------
applyTheme(); sndIcon(); layout();
(function boot() {
  const sg = store.get('game', null);
  if (sg && !sg.over && sg.moves) { try { startGame(sg); } catch (e) { G = null; } }
  if (!G) startGame({ mode: settings.mode, level: settings.level, human: 1, vf: settings.vf });
  if (!settings.tut) tutStart(); else if (!sg || sg.over) openMenu();
  raf = requestAnimationFrame(frame);
})();
// test hook for demo/verify.js
window.__game = {
  state: () => ({ moves: G.moves.slice(), vf: G.vf, over: G.s[RS] >= 0, rs: G.s[RS], human: G.human, turn: G.s[TN], level: G.level, thinking: G.thinking,
    inputOK: humanTurn() && !G.thinking && !overlayOpen(), resultVisible: !$('result').classList.contains('hidden'), think: lastThink, aiTimes: aiTimes.slice() }),
  cellToClient: m => { const r = main.cv.getBoundingClientRect(), [x, y] = main.cxy(m); return [r.left + x, r.top + y]; }
};
