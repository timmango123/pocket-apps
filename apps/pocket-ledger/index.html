<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>記帳本</title>
<style>
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f5f6f9; --ink:#151a25; --ink-2:#485164; --ink-3:#646d80;
  --line:#dcdfe6; --line-strong:#b6bcc8; --rule:#e9ecf2;
  --navy:#1b2b52; --on-navy:#f4f6fc; --on-navy-2:#b8c3de; --bar-track:rgba(255,255,255,.18);
  --bar-ok:#7fd1a8; --bar-warn:#ffb54d; --bar-over:#ff7a7f;
  --accent:#2646a6; --accent-ink:#ffffff; --accent-soft:#e2e8f8;
  --income:#1b7f4e; --expense:#b8323b; --warn:#a85a00;
  --focus:#2f6bff; --scrim:rgba(12,16,26,.45); --shadow:0 1px 0 rgba(20,26,40,.05),0 10px 24px -14px rgba(20,26,40,.35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e7eaf1; --ink-2:#a8b0c1; --ink-3:#8a92a4;
    --line:#2a303c; --line-strong:#3f4757; --rule:#222834;
    --navy:#1c2a4f; --on-navy:#eef2fb; --on-navy-2:#aab7d8; --bar-track:rgba(255,255,255,.14);
    --bar-ok:#6fcf9f; --bar-warn:#ffb54d; --bar-over:#ff7a7f;
    --accent:#8fa8ff; --accent-ink:#0a1433; --accent-soft:#1f2a4c;
    --income:#62d39c; --expense:#ff8d93; --warn:#ffb257;
    --focus:#8fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e7eaf1; --ink-2:#a8b0c1; --ink-3:#8a92a4;
  --line:#2a303c; --line-strong:#3f4757; --rule:#222834;
  --navy:#1c2a4f; --on-navy:#eef2fb; --on-navy-2:#aab7d8; --bar-track:rgba(255,255,255,.14);
  --bar-ok:#6fcf9f; --bar-warn:#ffb54d; --bar-over:#ff7a7f;
  --accent:#8fa8ff; --accent-ink:#0a1433; --accent-soft:#1f2a4c;
  --income:#62d39c; --expense:#ff8d93; --warn:#ffb257;
  --focus:#8fb0ff; --scrim:rgba(0,0,0,.6); --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:12px 16px calc(24px + env(safe-area-inset-bottom));min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand{flex:1;display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:19px;letter-spacing:.06em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.2em}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

.sample{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:12px}
.sample span{flex:1}
.sample button{min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px}

/* Summary passbook */
.sum{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:12px 14px 16px;position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sum::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.04) 23px 24px)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px}
.mnav button{width:44px;height:44px;border:0;background:transparent;color:var(--on-navy);border-radius:10px;cursor:pointer;font-size:22px;line-height:1}
.mnav .mlabel{width:auto;font-weight:700;letter-spacing:.06em;font-size:15px;border:0;background:transparent;color:var(--on-navy);min-height:44px;cursor:pointer;padding:0 8px;border-radius:10px}
.sum .lbl{font-size:12px;color:var(--on-navy-2);letter-spacing:.12em}
.sum .big{font-family:var(--mono);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0 10px;word-break:break-all}
.sum .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
.sum .row b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.budget{margin-top:12px}
.track{height:8px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--bar-ok);transition:width .3s}
.fill.warn{background:var(--bar-warn)} .fill.over{background:var(--bar-over)}
.budget .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--on-navy-2);margin-top:6px;flex-wrap:wrap}

/* Quick entry */
.quick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.amtrow{display:flex;gap:8px;align-items:stretch}
.amtwrap{flex:1;position:relative;min-width:0}
.amtwrap input{width:100%;height:56px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface-2);font-family:var(--mono);font-size:24px;font-weight:700;padding:0 12px;font-variant-numeric:tabular-nums}
.amtwrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.typetog{display:flex;flex-direction:column;width:56px;border:1.5px solid var(--line-strong);border-radius:12px;overflow:hidden;flex:none}
.typetog button{flex:1;border:0;background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;min-height:27px}
.typetog button[aria-pressed="true"].out{background:var(--expense);color:var(--surface)}
.typetog button[aria-pressed="true"].in{background:var(--income);color:var(--surface)}
.amthint{min-height:20px;font-size:13px;color:var(--ink-3);margin:4px 2px 6px;font-family:var(--mono)}
.amthint.err{color:var(--expense);font-family:var(--sans)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 2px;font-size:13px;font-weight:600}
.cat .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.cat:disabled{opacity:.42;cursor:not-allowed}
.cat.add{border-style:dashed;color:var(--accent)}
.cat.add .ic{background:transparent;color:var(--accent);border:1.5px dashed currentColor}
.cat span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
details.more{margin-top:10px}
details.more summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.morebox{display:grid;grid-template-columns:1fr 150px;gap:8px}
.txt{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px}
.txt:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}

/* Tabs & panes */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:16px 0 12px}
.tabs button{min-height:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pane h2{font-size:12px;letter-spacing:.14em;color:var(--ink-2);margin:0 2px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.filter{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 4px 0 12px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;letter-spacing:0}
.filter button{width:36px;height:36px;border:0;background:transparent;color:inherit;cursor:pointer;border-radius:50%;font-size:15px}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.dayhead:first-child{border-top:0}
.dayhead .dsub{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.erow{position:relative;border-top:1px solid var(--rule)}
.dayhead + .erow{border-top:0}
.erow .del{position:absolute;right:0;top:0;bottom:0;width:120px;padding-left:32px;border:0;background:var(--expense);color:var(--surface);font-weight:700;cursor:pointer;visibility:hidden}
.erow.reveal .del{visibility:visible}
.entry{position:relative;width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;min-height:56px;border:0;background:var(--surface);text-align:left;cursor:pointer;touch-action:pan-y;transition:transform .2s ease}
.entry.drag{transition:none}
.entry .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.entry .tx{min-width:0}
.entry .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .tx small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .am{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.entry .am.in{color:var(--income)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);margin-left:6px;vertical-align:1px}
.emptyst{text-align:center;padding:26px 16px 22px;color:var(--ink-3)}
.emptyst svg{width:84px;height:64px;color:var(--line-strong);margin-bottom:6px}
.emptyst p{margin:0 0 12px}
.btn{min-height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--expense);color:var(--expense)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.donutwrap{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:0 auto}
.donutwrap canvas{width:100%;height:100%;display:block;cursor:pointer}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dcenter small{font-size:12px;color:var(--ink-3)}
.dcenter b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.legend{list-style:none;margin:14px 0 0;padding:0}
.legend li button{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto 52px;gap:10px;align-items:center;min-height:44px;border:0;border-top:1px solid var(--rule);background:transparent;cursor:pointer;text-align:left;padding:4px 2px}
.legend li:first-child button{border-top:0}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.legend .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.legend .nm small.over{color:var(--expense)}
.legend .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.legend .p{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:right}
.legend button[aria-pressed="true"]{background:var(--accent-soft)}
.barwrap{position:relative;height:200px}
.barwrap canvas{width:100%;height:100%;display:block;cursor:pointer}
.bartip{font-size:13px;color:var(--ink-2);min-height:22px;margin-top:6px;font-family:var(--mono)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet h3{margin:18px 0 8px;font-size:13px;letter-spacing:.1em;color:var(--ink-2)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.field{margin-bottom:12px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--expense);font-size:13px;margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface);cursor:pointer;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:44px;padding:0 12px 0 6px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pick button .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.sheetact{display:flex;gap:8px;margin-top:8px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px}
.sheetact .btn{flex:1}
.sheetact .btn.danger{flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:6px 12px;cursor:pointer;text-align:left}
.lrow .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.lrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{color:var(--ink-3);font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 140px}
.note{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.expout{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-family:var(--mono);font-size:13px}
.dlgmsg{margin:0 0 14px;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}
.toast button{white-space:nowrap;flex:none;min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--bg);font-weight:800;cursor:pointer;text-decoration:underline}
.toast.plain{padding:12px 16px}

@media (hover:hover){
  .cat:not(:disabled):hover,.iconbtn:hover,.btn:hover,.lrow:hover,.pick button:hover{border-color:var(--ink-3)}
  .entry:hover{background:var(--surface-2)}
  .legend li button:hover{background:var(--surface-2)}
  .mnav button:hover{background:rgba(255,255,255,.1)}
}
@media (min-width:900px){
  body{padding:22px 28px 28px}
  .layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
  .leftcol{position:sticky;top:22px}
  .tabs{display:none}
  .panes{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .pane[hidden]{display:block !important}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:86%}
  .sheet .grab{display:none}
}
@media (min-width:1200px){ .panes{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)} }
@media (max-height:600px){ .scrim{align-items:flex-start} .sheet{max-height:100%;border-radius:0 0 18px 18px} }
@media (min-width:640px) and (max-width:899px) and (orientation:portrait){ .cats{grid-template-columns:repeat(8,1fr)} }
@media (min-width:640px) and (max-width:899px) and (orientation:landscape){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .rightcol .tabs{margin-top:0}
  .sum{padding:6px 12px 12px} .sum .big{font-size:26px;margin-bottom:6px} .mnav{margin-bottom:0}
  .cat{min-height:56px}
  .leftcol{display:flex;flex-direction:column-reverse}
  .quick{margin:0 0 12px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>記帳本</h1><span>POCKET LEDGER</span></div>
    <button class="iconbtn" id="openSettings" aria-label="設定、分類與匯出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div class="sample" id="sampleBar" hidden><span>目前顯示的是範例資料，記下自己的帳後可一鍵清除。</span><button id="clearSample">清除範例</button></div>

  <div class="layout">
    <div class="leftcol">
      <section class="sum" id="summary" aria-label="本月摘要">
        <div class="mnav">
          <button id="prevMonth" aria-label="上個月">‹</button>
          <button class="mlabel" id="monthLabel" aria-label="回到本月"></button>
          <button id="nextMonth" aria-label="下個月">›</button>
        </div>
        <div class="lbl">本月支出</div>
        <div class="big" id="sumOut"></div>
        <div class="row">
          <div><span class="lbl">收入</span><b id="sumIn"></b></div>
          <div><span class="lbl">結餘</span><b id="sumBal"></b></div>
        </div>
        <div class="budget" id="budgetBox" hidden>
          <div class="track" role="progressbar" aria-label="預算使用率" aria-valuemin="0" aria-valuemax="100" id="budgetBar"><div class="fill" id="budgetFill"></div></div>
          <div class="meta"><span id="budgetText"></span><span id="budgetDaily"></span></div>
        </div>
      </section>

      <section class="quick" aria-label="快速記帳">
        <div class="amtrow">
          <div class="typetog" role="group" aria-label="收支類型">
            <button id="typeOut" class="out" aria-pressed="true">支</button>
            <button id="typeIn" class="in" aria-pressed="false">收</button>
          </div>
          <div class="amtwrap"><input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="金額（可算 120+45）" aria-label="金額" aria-describedby="amountHint"></div>
        </div>
        <div class="amthint" id="amountHint" aria-live="polite"></div>
        <div class="cats" id="cats"></div>
        <details class="more" id="moreBox">
          <summary>＋備註/日期</summary>
          <div class="morebox">
            <input class="txt" id="note" maxlength="60" placeholder="備註（選填）" aria-label="備註">
            <input class="txt" id="date" type="date" aria-label="日期">
          </div>
        </details>
      </section>
    </div>

    <div class="rightcol">
      <div class="tabs" role="tablist" aria-label="檢視">
        <button role="tab" id="tabList" aria-controls="paneList" aria-selected="true">明細</button>
        <button role="tab" id="tabChart" aria-controls="paneChart" aria-selected="false">圖表</button>
      </div>
      <div class="panes">
        <section class="pane" id="paneList" role="tabpanel" aria-labelledby="tabList">
          <h2><span>明細</span><span id="filterSlot"></span></h2>
          <div class="ledger" id="ledger"></div>
        </section>
        <section class="pane" id="paneChart" role="tabpanel" aria-labelledby="tabChart" hidden>
          <h2><span>分類支出</span></h2>
          <div class="chartcard">
            <div class="donutwrap"><canvas id="donut" aria-label="本月分類支出環形圖" role="img"></canvas><div class="dcenter"><small>本月支出</small><b id="donutTotal"></b></div></div>
            <ul class="legend" id="legend"></ul>
          </div>
          <h2><span>近 12 個月支出</span></h2>
          <div class="chartcard">
            <div class="barwrap"><canvas id="bars" role="img" aria-label="近 12 個月支出長條圖"></canvas></div>
            <div class="bartip" id="barTip" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".csv,.json,text/csv,application/json" hidden>
<div id="layer"></div>
<div id="toastLayer" aria-live="polite"></div>

<script>
(() => {
'use strict';
const APP = 'pocket-ledger';
const K = { cats: APP+':v1:categories', settings: APP+':v1:settings', entries: APP+':v1:entries', tab: APP+':v1:tab' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e){ return false; } };
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const addMonth = (m, k) => { let [y,mo] = m.split('-').map(Number); mo += k; while (mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return `${y}-${pad(mo)}`; };
const MAX_CENTS = 9999999999, MAX_CATS = 20, LS_LIMIT = 5000;
const PALETTE = ['#d9822b','#3b7fc4','#c2477a','#8a63d2','#2a9a8b','#d1495b','#77808f','#2f8f5b','#b08a1a','#5a6fd6','#a0522d','#1f8fb0'];

/* ---------- money ---------- */
function numToCents(t){
  if (!/^\d+(\.\d{1,2})?$|^\.\d{1,2}$/.test(t)) return null;
  const [i='0',f=''] = t.split('.');
  if (i.length > 10) return null;
  return parseInt(i||'0',10)*100 + parseInt((f+'00').slice(0,2),10);
}
/* tiny expression parser: numbers, + and - only. No eval. */
function parseExpr(str){
  let s = String(str).replace(/[\s,]/g,'').replace(/＋/g,'+').replace(/[－−]/g,'-').replace(/．/g,'.').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  if (!s) return {empty:true};
  if (!/^[\d.+\-]+$/.test(s)) return {err:'只能輸入數字與 + -'};
  const toks = s.match(/[+\-]|[\d.]+/g);
  let total = 0, sign = 1, expectNum = true, terms = 0;
  for (const t of toks){
    if (t === '+' || t === '-'){
      if (expectNum){ if (terms === 0 && t === '-') return {err:'金額不可為負數'}; return {err:'算式不完整'}; }
      sign = t === '+' ? 1 : -1; expectNum = true;
    } else {
      if (!expectNum) return {err:'算式不完整'};
      const c = numToCents(t); if (c == null) return {err:'最多兩位小數'};
      total += sign*c; expectNum = false; terms++;
    }
  }
  if (expectNum) return {err:'算式不完整', partial:true};
  if (total <= 0) return {err: total === 0 ? '金額必須大於 0' : '結果不可為負數'};
  if (total > MAX_CENTS) return {err:'金額上限 99,999,999'};
  return {cents: total, isExpr: terms > 1};
}

/* ---------- state ---------- */
const defaultCats = () => [
  ['餐飲','out',0],['交通','out',1],['購物','out',2],['娛樂','out',3],['居家','out',4],['醫療','out',5],['其他','out',6],
  ['薪資','in',7],['獎金','in',8],['其他','in',9]
].map(([name,type,ci]) => ({id:uid(), name, type, icon:name[0], color:PALETTE[ci], budget:0}));
function loadCats(){
  try {
    const a = JSON.parse(lsGet(K.cats));
    if (Array.isArray(a)){
      const ok = a.filter(c => c && typeof c.id==='string' && typeof c.name==='string' && (c.type==='out'||c.type==='in')).slice(0,MAX_CATS)
        .map(c => ({id:c.id, name:c.name.slice(0,8), type:c.type, icon:String(c.icon||c.name[0]||'?').slice(0,2), color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:PALETTE[6], budget:Number.isInteger(c.budget)&&c.budget>0?c.budget:0}));
      if (ok.some(c=>c.type==='out') && ok.some(c=>c.type==='in')) return ok;
    }
  } catch(e){}
  return defaultCats();
}
function loadSettings(){
  let s = {};
  try { const x = JSON.parse(lsGet(K.settings)); if (x && typeof x === 'object') s = x; } catch(e){}
  return { currency: ['TWD','USD','JPY','EUR','HKD','CNY','KRW','GBP'].includes(s.currency) ? s.currency : 'TWD',
    budget: Number.isInteger(s.budget) && s.budget > 0 ? s.budget : 0, seeded: !!s.seeded };
}
let cats = loadCats(), settings = loadSettings();
const saveCats = () => lsSet(K.cats, JSON.stringify(cats));
const saveSettings = () => lsSet(K.settings, JSON.stringify(settings));
let entries = [];
const st = { month: todayStr().slice(0,7), type:'out', tab: lsGet(K.tab) === 'chart' ? 'chart' : 'list', filter: null, barSel: null };

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const store = {
  db: null, mode: 'ls',
  init(){
    return new Promise(res => {
      let done = false; const fin = () => { if (!done){ done = true; res(); } };
      try {
        if (!window.indexedDB) return fin();
        const rq = indexedDB.open(APP, 1);
        rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('entries')){ const os = db.createObjectStore('entries', {keyPath:'id'}); os.createIndex('month','month'); os.createIndex('date','date'); } };
        rq.onsuccess = () => { this.db = rq.result; this.mode = 'idb'; fin(); };
        rq.onerror = () => fin(); rq.onblocked = () => fin();
        setTimeout(fin, 2500);
      } catch(e){ fin(); }
    });
  },
  tx(mode, fn){
    return new Promise((res, rej) => {
      try { const t = this.db.transaction('entries', mode); const os = t.objectStore('entries'); const r = fn(os); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }
      catch(e){ rej(e); }
    });
  },
  async all(){
    if (this.mode === 'idb'){ try { return await this.tx('readonly', os => os.getAll()) || []; } catch(e){ this.mode = 'ls'; } }
    try { const a = JSON.parse(lsGet(K.entries) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; }
  },
  async byMonth(m){
    if (this.mode === 'idb'){ try { return await this.tx('readonly', os => os.index('month').getAll(m)); } catch(e){} }
    return entries.filter(e => e.month === m);
  },
  lsFlush(){ if (this.mode === 'ls'){ if (entries.length > LS_LIMIT) entries = entries.slice(-LS_LIMIT); lsSet(K.entries, JSON.stringify(entries)); } },
  async put(list){ if (this.mode === 'idb'){ try { await this.tx('readwrite', os => { list.forEach(e => os.put(e)); }); return; } catch(e){ this.mode='ls'; } } this.lsFlush(); },
  async del(ids){ if (this.mode === 'idb'){ try { await this.tx('readwrite', os => { ids.forEach(id => os.delete(id)); }); return; } catch(e){ this.mode='ls'; } } this.lsFlush(); }
};
function cleanEntry(e){
  if (!e || typeof e.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !Number.isInteger(e.cents) || e.cents <= 0 || (e.type!=='out'&&e.type!=='in')) return null;
  return { id:e.id, date:e.date, month:e.date.slice(0,7), type:e.type, catId:String(e.catId||''), cents:e.cents, note:String(e.note||'').slice(0,60), sample:!!e.sample, createdAt:Number(e.createdAt)||0 };
}
function fixCat(e){ if (!cats.some(c => c.id === e.catId && c.type === e.type)){ const c = cats.filter(c=>c.type===e.type); e.catId = (c.find(x=>x.name==='其他')||c[c.length-1]).id; } return e; }
async function addEntries(list){ entries.push(...list); await store.put(list); }
async function updateEntries(list){ await store.put(list); }
async function removeEntries(ids){ const set = new Set(ids); entries = entries.filter(e => !set.has(e.id)); await store.del(ids); }

/* ---------- formatting ---------- */
let nf;
function makeNF(){ try { nf = new Intl.NumberFormat('zh-TW', {style:'currency', currency:settings.currency, minimumFractionDigits:0, maximumFractionDigits:2}); } catch(e){ nf = {format: v => '$' + v.toFixed(2)}; } }
makeNF();
const money = c => nf.format(c/100);
const catOf = id => cats.find(c => c.id === id) || {name:'未分類', icon:'?', color:'#77808f', type:'out'};
const icon = c => `<span class="ic" style="background:${c.color}" aria-hidden="true">${esc(c.icon||c.name[0])}</span>`;
const WD = ['日','一','二','三','四','五','六'];

/* ---------- sample data ---------- */
function seedSample(){
  const out = [], now = new Date(), T = todayStr();
  const byName = (n,t='out') => cats.find(c=>c.name===n && c.type===t) || cats.find(c=>c.type===t);
  const tpl = [
    ['餐飲',8500,'早午餐'],['餐飲',12000,'午餐便當'],['交通',3000,'捷運'],['餐飲',6500,'手搖飲'],['購物',89000,'運動鞋'],['居家',45000,'電費, 水費'],
    ['娛樂',32000,'電影「沙丘」兩張'],['餐飲',38000,'朋友聚餐'],['交通',18000,'計程車'],['醫療',35000,'牙科回診'],['其他',20000,'禮金'],['餐飲',15000,'晚餐']
  ];
  for (let k = 5; k >= 0; k--){
    const base = new Date(now.getFullYear(), now.getMonth()-k, 1);
    const ym = `${base.getFullYear()}-${pad(base.getMonth()+1)}`;
    const dim = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    const lastDay = k === 0 ? now.getDate() : dim;
    const push = (day, cat, cents, note, type='out') => { const d = `${ym}-${pad(Math.min(day, dim))}`; if (k === 0 && d > T) return; out.push({id:uid(), date:d, month:ym, type, catId:byName(cat,type).id, cents, note, sample:true, createdAt:Date.now()}); };
    push(5, '薪資', 4800000, '十月薪資'.replace('十', String(base.getMonth()+1)), 'in');
    if (k % 3 === 1) push(20, '獎金', 600000, '專案獎金', 'in');
    tpl.forEach((t, i) => {
      const day = 1 + Math.round((i * (lastDay-1)) / tpl.length) + ((k+i)%2);
      const f = 0.7 + ((k*7 + i*3) % 9) / 10;
      if ((i + k) % 5 === 4 && t[0] !== '餐飲') return;
      push(day, t[0], Math.round(t[1]*f/100)*100, t[2]);
    });
  }
  return out;
}

/* ---------- rendering ---------- */
function monthEntries(m){ return entries.filter(e => e.month === m); }
function totals(list){ let o=0,i=0; for (const e of list){ if (e.type==='out') o+=e.cents; else i+=e.cents; } return {o,i}; }

function renderSummary(){
  const [y,m] = st.month.split('-');
  $('#monthLabel').textContent = `${y} 年 ${+m} 月`;
  const list = monthEntries(st.month), t = totals(list);
  $('#sumOut').textContent = money(t.o);
  $('#sumIn').textContent = money(t.i);
  $('#sumBal').textContent = (t.i - t.o < 0 ? '−' : '') + money(Math.abs(t.i - t.o));
  const b = settings.budget, box = $('#budgetBox');
  box.hidden = !b;
  if (b){
    const pct = t.o / b * 100;
    const f = $('#budgetFill'); f.style.width = Math.min(100, pct) + '%';
    f.className = 'fill' + (pct > 100 ? ' over' : pct > 80 ? ' warn' : '');
    $('#budgetBar').setAttribute('aria-valuenow', Math.round(Math.min(100,pct)));
    $('#budgetText').textContent = `預算 ${money(b)} · 已用 ${Math.round(pct)}%`;
    const T = todayStr(), cm = T.slice(0,7);
    let daily = '';
    if (st.month === cm){
      const d = new Date(), dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), left = dim - d.getDate() + 1;
      const rem = b - t.o;
      daily = rem > 0 ? `剩 ${left} 天，日均可用 ${money(Math.floor(rem/left))}` : `已超出 ${money(-rem)}`;
    } else if (st.month < cm) daily = t.o > b ? `超出 ${money(t.o-b)}` : `結餘 ${money(b-t.o)}`;
    $('#budgetDaily').textContent = daily;
  }
}
function renderCats(){
  const parsed = parseExpr($('#amount').value);
  const ok = !!parsed.cents;
  const list = cats.filter(c => c.type === st.type);
  $('#cats').innerHTML = list.map(c => `<button class="cat" id="cat-${c.id}" data-cat="${c.id}" ${ok?'':'disabled'} aria-label="記到${esc(c.name)}">${icon(c)}<span class="n">${esc(c.name)}</span></button>`).join('')
    + (cats.length < MAX_CATS ? `<button class="cat add" id="catAdd" aria-label="新增自訂分類"><span class="ic" aria-hidden="true">＋</span><span class="n">自訂</span></button>` : '');
}
function renderHint(){
  const v = $('#amount').value, p = parseExpr(v), h = $('#amountHint');
  h.className = 'amthint';
  if (p.empty) h.textContent = '輸入金額後，點分類即完成記帳';
  else if (p.err){ if (p.partial){ h.textContent = '…'; } else { h.className = 'amthint err'; h.textContent = p.err; } }
  else h.textContent = (p.isExpr ? '= ' : '') + money(p.cents) + ` · ${st.type==='out'?'支出':'收入'}`;
  document.querySelectorAll('#cats [data-cat]').forEach(b => b.disabled = !p.cents);
}
const emptySVG = `<svg viewBox="0 0 84 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="14" y="6" width="56" height="52" rx="5"/><path d="M24 6v52M32 20h28M32 30h28M32 40h18" stroke-linecap="round"/></svg>`;
function renderLedger(){
  let list = monthEntries(st.month);
  if (st.filter) list = list.filter(e => e.catId === st.filter);
  list.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt - a.createdAt));
  const fc = st.filter ? catOf(st.filter) : null;
  $('#filterSlot').innerHTML = fc ? `<span class="filter">篩選：${esc(fc.name)}<button id="clearFilter" aria-label="取消篩選">✕</button></span>` : '';
  if (!list.length){
    $('#ledger').innerHTML = `<div class="emptyst">${emptySVG}<p>${fc ? '這個分類本月沒有紀錄' : '這個月還沒有紀錄'}</p>${fc?'':'<button class="btn primary" id="firstEntry">記下第一筆</button>'}</div>`;
    return;
  }
  const T = todayStr();
  let html = '', cur = null;
  const groups = {};
  list.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
  for (const d of Object.keys(groups)){
    const g = groups[d], t = totals(g);
    const dt = new Date(d + 'T00:00:00');
    const sub = [t.o ? `支 ${money(t.o)}` : '', t.i ? `收 ${money(t.i)}` : ''].filter(Boolean).join(' · ');
    html += `<div class="dayhead"><span>${dt.getMonth()+1} 月 ${dt.getDate()} 日（${WD[dt.getDay()]}）${d===T?' · 今天':''}${d > T ? '<span class="tag">預定</span>':''}</span><span class="dsub">${sub}</span></div>`;
    html += g.map(e => { const c = catOf(e.catId); return `<div class="erow" data-row="${e.id}"><button class="del" tabindex="-1" data-del="${e.id}">刪除</button><button class="entry" data-edit="${e.id}" aria-label="${esc(c.name)} ${money(e.cents)} ${esc(e.note)}，點擊編輯">${icon(c)}<span class="tx"><b>${esc(e.note || c.name)}</b><small>${esc(c.name)}${e.sample?' · 範例':''}</small></span><span class="am ${e.type}">${e.type==='in'?'+':'−'}${money(e.cents)}</span></button></div>`; }).join('');
  }
  $('#ledger').innerHTML = html;
}

/* ---------- charts ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setupCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  return {ctx, w:r.width, h:r.height};
}
let donutSegs = [];
function pieData(){
  const list = monthEntries(st.month).filter(e => e.type === 'out');
  const by = {};
  list.forEach(e => by[e.catId] = (by[e.catId]||0) + e.cents);
  const total = list.reduce((a,e)=>a+e.cents,0);
  const rows = Object.entries(by).map(([id,v]) => ({id, v, c:catOf(id)})).sort((a,b)=>b.v-a.v);
  return {rows, total};
}
function drawDonut(){
  const cv = $('#donut'); if (!cv.offsetParent) return;
  const {ctx, w, h} = setupCanvas(cv);
  const {rows, total} = pieData();
  $('#donutTotal').textContent = money(total);
  const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 4, r = R*0.62;
  donutSegs = [];
  if (!total){
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.arc(cx,cy,r,0,Math.PI*2,true); ctx.fillStyle = cssVar('--surface-2'); ctx.fill('evenodd');
    ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1; ctx.stroke();
  } else {
    const big = rows.filter(x => x.v/total >= 0.03), small = rows.filter(x => x.v/total < 0.03);
    const segs = big.map(x => ({id:x.id, v:x.v, color:x.c.color}));
    if (small.length) segs.push({id:null, v:small.reduce((a,x)=>a+x.v,0), color:cssVar('--line-strong'), merged:small.map(x=>x.id)});
    let a = -Math.PI/2;
    const gap = segs.length > 1 ? 0.012 : 0;
    segs.forEach(s => {
      const da = s.v/total*Math.PI*2, a0 = a + gap, a1 = a + da - gap;
      ctx.beginPath(); ctx.arc(cx,cy,R,a0,Math.max(a0,a1)); ctx.arc(cx,cy,r,Math.max(a0,a1),a0,true); ctx.closePath();
      ctx.globalAlpha = st.filter && st.filter !== s.id ? 0.3 : 1;
      ctx.fillStyle = s.color; ctx.fill();
      donutSegs.push({...s, a0:a, a1:a+da}); a += da;
    });
    ctx.globalAlpha = 1;
  }
  $('#legend').innerHTML = rows.length ? rows.map(x => {
    const pct = x.v/total*100, b = x.c.budget;
    const bud = b ? `<small class="${x.v>b?'over':''}">預算 ${money(b)}${x.v>b?' · 超出':''}</small>` : (pct < 3 ? '<small>圓餅中併入「其他」</small>' : '');
    return `<li><button data-fcat="${x.id}" aria-pressed="${st.filter===x.id}"><span class="sw" style="background:${x.c.color}"></span><span class="nm">${esc(x.c.name)}${bud}</span><span class="v">${money(x.v)}</span><span class="p">${pct.toFixed(1)}%</span></button></li>`;
  }).join('') : `<li class="emptyst" style="padding:12px">本月還沒有支出</li>`;
}
let barGeo = null;
function trendData(){
  const months = []; for (let k = 11; k >= 0; k--) months.push(addMonth(st.month, -k));
  const sums = Object.fromEntries(months.map(m=>[m,0]));
  for (const e of entries) if (e.type === 'out' && e.month in sums) sums[e.month] += e.cents;
  return months.map(m => ({m, v:sums[m]}));
}
function drawBars(){
  const cv = $('#bars'); if (!cv.offsetParent) return;
  const {ctx, w, h} = setupCanvas(cv);
  const data = trendData(), max = Math.max(1, ...data.map(d=>d.v));
  const avg = Math.round(data.reduce((a,d)=>a+d.v,0)/data.length);
  const top = 16, bottom = 22, ph = h - top - bottom, n = data.length, slot = w/n, bw = Math.min(26, slot*0.62);
  ctx.font = `11px ${cssVar('--sans') || 'sans-serif'}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, top+ph+.5); ctx.lineTo(w, top+ph+.5); ctx.stroke();
  barGeo = {slot, data};
  data.forEach((d,i) => {
    const bh = d.v/max*ph, x = i*slot + (slot-bw)/2, y = top + ph - bh;
    const isCur = d.m === st.month, sel = st.barSel === i;
    ctx.fillStyle = isCur || sel ? cssVar('--accent') : cssVar('--line-strong');
    if (bh > 0){ const rr = Math.min(4, bw/2, bh); ctx.beginPath(); ctx.moveTo(x, y+bh); ctx.lineTo(x, y+rr); ctx.quadraticCurveTo(x, y, x+rr, y); ctx.lineTo(x+bw-rr, y); ctx.quadraticCurveTo(x+bw, y, x+bw, y+rr); ctx.lineTo(x+bw, y+bh); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = isCur ? cssVar('--ink') : cssVar('--ink-3');
    const mm = +d.m.slice(5);
    ctx.fillText(mm === 1 ? `${d.m.slice(2,4)}/1` : String(mm), i*slot + slot/2, h - 6);
  });
  if (avg > 0){
    const y = Math.round(top + ph - avg/max*ph) + .5;
    ctx.setLineDash([5,4]); ctx.strokeStyle = cssVar('--expense'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `600 11px ${cssVar('--sans')}`; ctx.textAlign = 'left';
    const lw = ctx.measureText('平均').width + 8, ly = Math.max(0, Math.min(h - bottom - 16, y - 8));
    ctx.fillStyle = cssVar('--surface'); ctx.fillRect(0, ly, lw, 16);
    ctx.fillStyle = cssVar('--expense'); ctx.textBaseline = 'middle'; ctx.fillText('平均', 4, ly + 8); ctx.textBaseline = 'alphabetic';
  }
  const s = st.barSel != null ? data[st.barSel] : null;
  $('#barTip').textContent = s ? `${s.m.replace('-',' 年 ').replace(/ 0?(\d+)$/,' $1')} 月：${money(s.v)}（平均 ${money(avg)}）` : `12 個月平均 ${money(avg)} · 點長條看金額`;
}

const csvCell = v => { v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function toCSV(list){
  const rows = [['日期','類型','分類','金額','備註']];
  list.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt).forEach(e => rows.push([e.date, e.type==='out'?'支出':'收入', catOf(e.catId).name, (e.cents/100).toFixed(2), e.note]));
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const rows = []; let row = [], cell = '', q = false, i = 0;
  while (i < text.length){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i += 2; continue; } q = false; i++; continue; } cell += ch; i++; continue; }
    if (ch === '"' && cell === ''){ q = true; i++; continue; }
    if (ch === ','){ row.push(cell); cell = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += ch; i++;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function importCSV(text){
  const rows = parseCSV(text); const add = [], skipped = [];
  rows.forEach((r, idx) => {
    const line = idx + 1;
    if (r.length === 1 && r[0].trim() === '') return;
    if (idx === 0 && r[0].trim() === '日期') return;
    const [d0, t0, c0, a0, n0=''] = r.map(x => (x||'').trim());
    const dm = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(d0 || '');
    const type = t0 === '支出' || /^out|expense$/i.test(t0||'') ? 'out' : t0 === '收入' || /^in|income$/i.test(t0||'') ? 'in' : null;
    const cents = a0 != null ? numToCents(a0.replace(/,/g,'')) : null;
    if (!dm || !type || !cents || cents > MAX_CENTS || +dm[2] < 1 || +dm[2] > 12 || +dm[3] < 1 || +dm[3] > 31){ skipped.push(line); return; }
    const date = `${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`;
    let cat = cats.find(c => c.type === type && c.name === (c0||''));
    if (!cat && c0 && cats.length < MAX_CATS){ cat = {id:uid(), name:c0.slice(0,8), type, icon:[...c0][0], color:PALETTE[cats.length % PALETTE.length], budget:0}; cats.push(cat); }
    if (!cat) cat = cats.find(c => c.type === type && c.name === '其他') || cats.find(c=>c.type===type);
    add.push({id:uid(), date, month:date.slice(0,7), type, catId:cat.id, cents, note:n0.slice(0,60), sample:false, createdAt:Date.now()+idx});
  });
  return {add, skipped};
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let text = ''; try { text = await f.text(); } catch(e){ toast('無法讀取檔案'); return; }
  const msgEl = document.querySelector('#impMsg');
  let msg = '';
  if (/\.json$/i.test(f.name) || /^\s*\{/.test(text)){
    try {
      const j = JSON.parse(text);
      if (Array.isArray(j.categories)){ for (const c of j.categories){ if (c && c.id && !cats.some(x=>x.id===c.id) && cats.length < MAX_CATS && (c.type==='out'||c.type==='in')) cats.push({id:c.id, name:String(c.name).slice(0,8), type:c.type, icon:String(c.icon||c.name[0]).slice(0,2), color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:PALETTE[6], budget:Number.isInteger(c.budget)?c.budget:0}); } saveCats(); }
      const have = new Set(entries.map(e=>e.id));
      const list = (Array.isArray(j.entries)?j.entries:[]).map(cleanEntry).filter(e => e && !have.has(e.id)).map(fixCat);
      await addEntries(list); msg = `從備份匯入 ${list.length} 筆。`;
    } catch(e){ msg = '這不是有效的 JSON 備份檔。'; }
  } else {
    const {add, skipped} = importCSV(text);
    saveCats(); await addEntries(add);
    msg = `匯入 ${add.length} 筆` + (skipped.length ? `，略過 ${skipped.length} 筆（第 ${skipped.slice(0,12).join('、')}${skipped.length>12?'…':''} 列）` : '') + '。';
  }
  if (msgEl) msgEl.textContent = msg; toast(msg); render();
});

  const p = parseExpr($('#amount').value); if (!p.cents) return;
  const date = /^\d{4}-\d{2}-\d{2}$/.test($('#date').value) ? $('#date').value : todayStr();
  const e = {id:uid(), date, month:date.slice(0,7), type:st.type, catId:b.dataset.cat, cents:p.cents, note:$('#note').value.trim().slice(0,60), sample:false, createdAt:Date.now()};
  await addEntries([e]);
  $('#amount').value = ''; $('#note').value = ''; $('#date').value = todayStr(); $('#moreBox').open = false;
  if (e.month !== st.month && date === todayStr()) st.month = e.month;
  render();
  const c = catOf(e.catId);
  toast(`已記下 ${c.name} ${money(e.cents)}${e.month !== st.month ? `（${e.date}）` : ''}${date > todayStr() ? '・預定' : ''}`, async () => { await removeEntries([e.id]); render(); });
});
const goMonth = k => { st.month = k === 0 ? todayStr().slice(0,7) : addMonth(st.month, k); st.filter = null; st.barSel = null; render(); };
$('#prevMonth').onclick = () => goMonth(-1);
$('#nextMonth').onclick = () => goMonth(1);
$('#monthLabel').onclick = () => goMonth(0);
// swipe on summary card
(() => { let sx = null, sy = 0; const el = $('#summary');
  el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; });
  el.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5) goMonth(dx < 0 ? 1 : -1); });
  el.addEventListener('pointercancel', () => sx = null);
})();
$('#tabList').onclick = () => { st.tab = 'list'; lsSet(K.tab,'list'); renderTabs(); };
$('#tabChart').onclick = () => { st.tab = 'chart'; lsSet(K.tab,'chart'); renderTabs(); requestAnimationFrame(drawCharts); };
document.querySelector('.tabs').addEventListener('keydown', ev => { if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft'){ const t = st.tab === 'list' ? $('#tabChart') : $('#tabList'); t.click(); t.focus(); } });
$('#openSettings').onclick = settingsSheet;
$('#clearSample').onclick = async () => {
  const ids = entries.filter(e => e.sample).map(e => e.id);
  if (!(await confirmDlg('清除範例資料？', `會移除 ${ids.length} 筆範例紀錄，你自己記的帳不受影響。`, '清除'))) return;
  await removeEntries(ids); render(); toast('已清除範例資料');
};
function setFilter(id){
  st.filter = st.filter === id ? null : id;
  if (st.filter && !matchMedia('(min-width:900px)').matches){ st.tab = 'list'; }
  render();
  if (st.filter) toast(`只顯示 ${catOf(id).name}`);
}
$('#legend').addEventListener('click', ev => { const b = ev.target.closest('[data-fcat]'); if (b) setFilter(b.dataset.fcat); });
$('#donut').addEventListener('click', ev => {
  const r = ev.currentTarget.getBoundingClientRect(), x = ev.clientX - r.left - r.width/2, y = ev.clientY - r.top - r.height/2;
  const R = Math.min(r.width, r.height)/2 - 4, d = Math.hypot(x,y);
  if (d < R*0.62 || d > R){ if (st.filter){ st.filter = null; render(); } return; }
  let a = Math.atan2(y,x); if (a < -Math.PI/2) a += Math.PI*2;
  const s = donutSegs.find(s => a >= s.a0 && a < s.a1);
  if (s && s.id) setFilter(s.id); else if (s) toast('這一塊是小於 3% 的分類合併，請從下方清單點選');
});
$('#bars').addEventListener('click', ev => {
  if (!barGeo) return; const r = ev.currentTarget.getBoundingClientRect();
  const i = Math.max(0, Math.min(11, Math.floor((ev.clientX - r.left)/barGeo.slot)));
  st.barSel = st.barSel === i ? null : i; drawBars();
});
$('#filterSlot').addEventListener('click', ev => { if (ev.target.closest('#clearFilter')){ st.filter = null; render(); } });

// ledger: tap to edit, swipe to delete
let sw = null, openRow = null;
const hideDel = card => setTimeout(() => { if (!card.style.transform) card.parentElement && card.parentElement.classList.remove('reveal'); }, 220);
function closeOpen(ex){ if (openRow && openRow !== ex){ openRow.style.transform = ''; hideDel(openRow); openRow = null; } }
const L = $('#ledger');
L.addEventListener('pointerdown', ev => { const c = ev.target.closest('.entry'); if (!c) return; delete c.dataset.swiped; closeOpen(c); sw = {c, x:ev.clientX, y:ev.clientY, base: c === openRow ? -88 : 0, dx:0, moved:false, id:ev.pointerId}; });
L.addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.id) return;
  const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y;
  if (!sw.moved){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.moved = true; sw.c.classList.add('drag'); sw.c.parentElement.classList.add('reveal'); try{sw.c.setPointerCapture(ev.pointerId)}catch(e){} } else if (Math.abs(dy) > 10){ sw = null; return; } else return; }
  sw.dx = dx; sw.c.style.transform = `translateX(${Math.max(-120, Math.min(0, sw.base + dx))}px)`;
});
const endSw = () => { if (!sw) return; const s = sw; sw = null; s.c.classList.remove('drag'); if (!s.moved) return; s.c.dataset.swiped = '1';
  if (s.base + s.dx < -50){ s.c.style.transform = 'translateX(-88px)'; openRow = s.c; s.c.parentElement.querySelector('.del').tabIndex = 0; }
  else { s.c.style.transform = ''; hideDel(s.c); if (openRow === s.c) openRow = null; } };
L.addEventListener('pointerup', endSw); L.addEventListener('pointercancel', endSw);
L.addEventListener('click', ev => {
  if (ev.target.closest('#firstEntry')){ $('#amount').focus(); $('#amount').scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); return; }
  const d = ev.target.closest('[data-del]'); if (d){ openRow = null; deleteEntry(d.dataset.del); return; }
  const c = ev.target.closest('[data-edit]'); if (!c) return;
  if (c.dataset.swiped){ delete c.dataset.swiped; return; }
  if (openRow === c){ closeOpen(); return; }
  entrySheet(c.dataset.edit);
});
L.addEventListener('keydown', ev => { const c = ev.target.closest('[data-edit]'); if (c && ev.key === 'Delete'){ ev.preventDefault(); deleteEntry(c.dataset.edit); } });

// redraw charts on resize / theme change
try { new ResizeObserver(() => requestAnimationFrame(drawCharts)).observe($('#paneChart')); } catch(e){ addEventListener('resize', drawCharts); }
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => requestAnimationFrame(drawCharts)); } catch(e){}
try { new MutationObserver(() => requestAnimationFrame(drawCharts)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']}); } catch(e){}

window.__ledger = { parseExpr, toCSV, parseCSV, importCSV, get entries(){ return entries; }, get cats(){ return cats; }, store, render, addEntries, st };

/* ---------- boot ---------- */
(async () => {
  render();
  await store.init();
  entries = (await store.all()).map(cleanEntry).filter(Boolean).map(fixCat);
  if (!entries.length && !settings.seeded){
    const s = seedSample(); await addEntries(s);
    settings.seeded = true; if (!settings.budget) settings.budget = 2500000; saveSettings();
  }
  if (store.mode === 'ls' && !entries.length) store.lsFlush();
  render();
  document.documentElement.dataset.ready = '1';
  try { downloads = await window.claude?.use?.('downloads') || null; } catch(e){ downloads = null; }
})();
})();
</script>
