  ctx2d.drawImage(tmpCv, 0, 0);
  ctx2d.drawImage(dropsCv, 0, 0, vw, vh);
  if (flash > 0) { ctx2d.fillStyle = 'rgba(210,220,255,' + (flash * 0.3).toFixed(3) + ')'; ctx2d.fillRect(0, 0, vw, vh); }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    cancelAnimationFrame(rafId);
    if (actx && actx.state === 'running') actx.suspend().catch(() => {});
  } else if (!running) {
    running = true; last = performance.now();
    if (actx && soundOn) actx.resume().catch(() => {});
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }
});
// the system may take the GPU back (background tab, low memory): rebuild shaders and textures when it returns
if (gl) {
  view.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true; });
  view.addEventListener('webglcontextrestored', () => {
    try { G = setupGL(); glLost = false; uploadBackground(); }
    catch (err) { console.warn(err); toast('畫面重建失敗，請重新整理頁面', 6000); }
  });
}

/* ---------- start ---------- */
resize(true);
subEl.textContent = scene().name + '・霧・玻璃';
syncTraceBtn();
initCars();
updateCars(0);
writeInFog('雨');
for (let i = 0; i < 26; i++) newDrop(Math.random() * W, Math.random() * H * 0.9, (3.5 + Math.random() * 5) * sizeK);
sprinkleMist(380);
window.__rainglass = {
  get drops() { return drops.length; },
  get clearSum() { let s = 0; for (let i = 0; i < clear.length; i++) s += clear[i]; return s; },
  get sound() { return soundOn; }, get intensity() { return intensity; }, get gl() { return !!G && !glLost; },
  get counts() { return Object.assign({}, counts); }, get frames() { return frames; }, get glDraws() { return glDraws; },
  get cell() { return CELL; }, get mist() { return mist; }, get scene() { return scene().id; }, get wipeTarget() { return wipeTarget; }, takeWipePeak() { const v = wipePeak; wipePeak = 0; return v; },
  get audio() { return actx ? actx.state : 'none'; },
  get trace() { return { on: traceOn, ch: traceChar, cov: traceCov, spill: traceSpill, log: Object.assign({}, traceLog) }; },
  clearAt(x, y) { const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL); return cx >= 0 && cy >= 0 && cx < Wf && cy < Hf ? clear[cy * Wf + cx] : -1; },
  // cleared-cell bounding box (clear >= th) inside a css-px window
  clearBox(x0, y0, x1, y1, th) {
    let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
    for (let y = Math.max(0, Math.floor(y0 / CELL)); y < Math.min(Hf, Math.ceil(y1 / CELL)); y++) for (let x = Math.max(0, Math.floor(x0 / CELL)); x < Math.min(Wf, Math.ceil(x1 / CELL)); x++)
      if (clear[y * Wf + x] >= th) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); }
    return c < 0 ? null : { x0: a * CELL, y0: b * CELL, x1: (c + 1) * CELL, y1: (d + 1) * CELL };
  },
  // horizontal runs of the trace guide every `step` css px: [[x0, x1, y], ...]
  guideRuns(step) {
    const out = [], sy = Math.max(1, Math.round(step / CELL));
    for (let y = 0; y < Hf; y += sy) { let s = -1; for (let x = 0; x <= Wf; x++) { const g = x < Wf && guide[y * Wf + x]; if (g && s < 0) s = x; if (!g && s >= 0) { out.push([s * CELL, x * CELL, (y + 0.5) * CELL]); s = -1; } } }
    return out;
  },
  logPath(on) { const p = pathLog; pathLog = on ? [] : null; return p; }
};
rafId = requestAnimationFrame(frame);
})();
