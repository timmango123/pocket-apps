<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
(function () {
'use strict';
let view = document.getElementById('view');
const hintEl = document.getElementById('hint');
const bSound = document.getElementById('bSound');
const bFog = document.getElementById('bFog');
const rng = document.getElementById('rng');
const rngOut = document.getElementById('rngOut');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = window.matchMedia('(pointer: coarse)').matches;

/* ---------- settings ---------- */
let intensity = 0.5;

function syncSlider() {
  const p = Math.round(intensity * 100);
  rng.value = String(p); rngOut.textContent = String(p);

}

let gl = null;

/* ---------- sizes ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const FOGCELL = 4;           // css px per fog cell
let W = 1, H = 1, ds = 1, viewScale = 1, sizeK = 1;
let Wf = 1, Hf = 1;
let clear = new Float32Array(1), regrow = new Float32Array(1), fogBytes = new Uint8Array(1);

const sharpCv = document.createElement('canvas');
const blurCv = document.createElement('canvas');

const staticCv = document.createElement('canvas');
const dctx = dropsCv.getContext('2d');
const sctx = staticCv.getContext('2d');

/* seeded rng so the city looks the same in both blur levels */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PALETTE = [
  [255, 176, 92], [255, 150, 60], [255, 214, 150], [255, 236, 210], // warm street & windows
  [255, 64, 70], [255, 92, 60],                                     // tail lights
  [70, 225, 230], [255, 80, 170], [120, 255, 160], [140, 150, 255]  // neon, traffic
];
function paintCity(cv) {
  const w = cv.width, h = cv.height, g = cv.getContext('2d');
  const R = mulberry(20241007);
  const m = Math.min(w, h);
  const hz = h * 0.64;
  let gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#060818'); gr.addColorStop(0.42, '#141433'); gr.addColorStop(0.6, '#2a1c3c');
  gr.addColorStop(0.68, '#1a1328'); gr.addColorStop(1, '#0a0812');
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = gr; g.fillRect(0, 0, w, h);

  const hg = g.createRadialGradient(w * 0.55, hz, 0, w * 0.55, hz, w * 0.9);
  hg.addColorStop(0, 'rgba(255,140,90,0.22)'); hg.addColorStop(1, 'rgba(255,140,90,0)');
  g.fillStyle = hg; g.fillRect(0, 0, w, h);
  // building silhouettes with windows
  let x = -R() * 30;
  while (x < w) {
    const bw = m * (0.08 + R() * 0.14);
    const bh = h * (0.12 + Math.pow(R(), 1.6) * 0.42);
    const top = hz - bh;
    g.fillStyle = R() < 0.5 ? '#0e0d22' : '#141029';
    g.fillRect(x, top, bw, bh + 2);
    const cols = Math.max(2, Math.floor(bw / (m * 0.022)));
    const rows = Math.max(2, Math.floor(bh / (m * 0.03)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (R() > 0.32) continue;
      const cc = R() < 0.8 ? PALETTE[(R() * 4) | 0] : PALETTE[6 + ((R() * 4) | 0)];
      g.fillStyle = 'rgba(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ',' + (0.35 + R() * 0.5).toFixed(2) + ')';
      g.fillRect(x + (c + 0.25) * bw / cols, top + (r + 0.3) * bh / rows, bw / cols * 0.5, bh / rows * 0.4);
    }

  }

  gr = g.createLinearGradient(0, hz, 0, h);
  gr.addColorStop(0, 'rgba(30,20,40,0.9)'); gr.addColorStop(1, 'rgba(8,6,14,1)');
  g.fillStyle = gr; g.fillRect(0, hz, w, h - hz);
  g.globalCompositeOperation = 'lighter';
  function disc(cx, cy, r, c, a) {
    const gg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    const s = c[0] + ',' + c[1] + ',' + c[2] + ',';
    gg.addColorStop(0, 'rgba(' + s + (a * 0.7).toFixed(3) + ')');
    gg.addColorStop(0.78, 'rgba(' + s + (a * 0.82).toFixed(3) + ')');
    gg.addColorStop(0.92, 'rgba(' + s + a.toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(' + s + '0)');
    g.fillStyle = gg;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  // tiny far lights
  for (let i = 0; i < 160; i++) {
    const c = PALETTE[(R() * 4) | 0];
    disc(R() * w, hz - R() * h * 0.35 + h * 0.03, m * (0.004 + R() * 0.008), c, 0.35 + R() * 0.4);
  }
  // big bokeh
  for (let i = 0; i < 64; i++) {
    const t = R();
    let c, y;
    if (t < 0.45) { c = PALETTE[(R() * 4) | 0]; y = h * (0.2 + R() * 0.55); }
    else if (t < 0.65) { c = PALETTE[4 + ((R() * 2) | 0)]; y = hz + h * (0.04 + R() * 0.12); }
    else { c = PALETTE[6 + ((R() * 4) | 0)]; y = h * (0.15 + R() * 0.6); }
    const r = m * (0.025 + Math.pow(R(), 2.2) * 0.1);
    const cx = R() * w;
    disc(cx, y, r, c, 0.16 + R() * 0.32);
    if (y < hz && R() < 0.5) { // reflection on the wet street
      const rg = g.createLinearGradient(0, hz, 0, h);
      rg.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.12)');
      rg.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
      g.fillStyle = rg; g.fillRect(cx - r * 0.35, hz, r * 0.7, h - hz);

const rawCv = document.createElement('canvas');
function shrinkGrow(src, dst, factor) {
  const t1 = document.createElement('canvas');
  t1.width = Math.max(2, Math.round(src.width / factor)); t1.height = Math.max(2, Math.round(src.height / factor));
  const c1 = t1.getContext('2d'); c1.imageSmoothingEnabled = true; c1.imageSmoothingQuality = 'high';
  c1.drawImage(src, 0, 0, t1.width, t1.height);
  let cur = t1;
  while (cur.width * 2 < dst.width) {
    const t = document.createElement('canvas');
    t.width = cur.width * 2; t.height = cur.height * 2;
    const c = t.getContext('2d'); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(cur, 0, 0, t.width, t.height);
    cur = t;
  }
  const cd = dst.getContext('2d'); cd.imageSmoothingEnabled = true; cd.imageSmoothingQuality = 'high';
  cd.clearRect(0, 0, dst.width, dst.height);
  cd.drawImage(cur, 0, 0, dst.width, dst.height);
}
function buildBackground() {
  const bs = Math.min(0.75, 900 / Math.max(W, H));
  rawCv.width = Math.max(2, Math.round(W * bs)); rawCv.height = Math.max(2, Math.round(H * bs));
  paintCity(rawCv);
  // the glass is in focus, the city never is: a mild blur behind clear glass, a heavy one behind fog
  sharpCv.width = rawCv.width; sharpCv.height = rawCv.height;
  shrinkGrow(rawCv, sharpCv, 3);
  blurCv.width = Math.max(2, Math.round(rawCv.width / 2.5)); blurCv.height = Math.max(2, Math.round(rawCv.height / 2.5));
  shrinkGrow(rawCv, blurCv, 12);
}

/* ---------- drop sprite ---------- */
const SPR = 64;
const sprite = document.createElement('canvas');
sprite.width = sprite.height = SPR;
(function makeSprite() {
  const g = sprite.getContext('2d');
  const img = g.createImageData(SPR, SPR);
  const d = img.data;
  for (let y = 0; y < SPR; y++) for (let x = 0; x < SPR; x++) {
    const dx = (x + 0.5 - SPR / 2) / (SPR / 2), dy = (y + 0.5 - SPR / 2) / (SPR / 2);
    const r = Math.sqrt(dx * dx + dy * dy);
    const i = (y * SPR + x) * 4;
    if (r >= 1) { d[i + 3] = 0; continue; }
    const edgeA = r > 0.86 ? 1 - (r - 0.86) / 0.14 : 1;
    if (G) {
      // normal-map encoded: rg = offset direction, b = thickness
      d[i] = Math.round(128 + dx * 127); d[i + 1] = Math.round(128 + dy * 127);
      d[i + 2] = Math.round(255 * Math.sqrt(1 - r * r)); d[i + 3] = Math.round(255 * edgeA);
    } else {
      // 2D fallback: a shiny bead
      const hl = Math.max(0, 1 - Math.hypot(dx + 0.35, dy + 0.4) / 0.35);
      const rim = Math.max(0, (r - 0.6) / 0.4);
      const v = Math.round(170 + 85 * hl);
      d[i] = v; d[i + 1] = v; d[i + 2] = Math.min(255, v + 15);
      d[i + 3] = Math.round(255 * edgeA * Math.min(1, 0.12 + 0.5 * rim * rim + 0.9 * hl));
    }
  }
  g.putImageData(img, 0, 0);
})();

/* ---------- fog grid ---------- */
function buildFog(keep) {
  const oW = Wf, oH = Hf, old = clear;
  Wf = Math.max(2, Math.ceil(W / FOGCELL)); Hf = Math.max(2, Math.ceil(H / FOGCELL));
  clear = new Float32Array(Wf * Hf);
  regrow = new Float32Array(Wf * Hf);
  fogBytes = new Uint8Array(Wf * Hf);
  const R = mulberry(77);
  // patchy regrowth speed: blobby value noise
  const G = 9, gw = Math.ceil(Wf / G) + 2, gh = Math.ceil(Hf / G) + 2, grid = new Float32Array(gw * gh);
  for (let i = 0; i < grid.length; i++) grid[i] = R();
  for (let y = 0; y < Hf; y++) for (let x = 0; x < Wf; x++) {
    const fx = x / G, fy = y / G, ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = grid[iy * gw + ix], b = grid[iy * gw + ix + 1], c = grid[(iy + 1) * gw + ix], d = grid[(iy + 1) * gw + ix + 1];
    const n = (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
    regrow[y * Wf + x] = (1 / 15) * (0.55 + 0.9 * n);
    if (keep && old.length > 1) {

function stamp(ax, ay, bx, by, rad, strength) {
  ax /= FOGCELL; ay /= FOGCELL; bx /= FOGCELL; by /= FOGCELL; rad /= FOGCELL;
  const soft = rad * 0.6 + 0.8;
  const ext = rad + soft;
  const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - ext)), x1 = Math.min(Wf - 1, Math.ceil(Math.max(ax, bx) + ext));
  const y0 = Math.max(0, Math.floor(Math.min(ay, by) - ext)), y1 = Math.min(Hf - 1, Math.ceil(Math.max(ay, by) + ext));
  const vx = bx - ax, vy = by - ay, vv = vx * vx + vy * vy || 1e-6;
  for (let y = y0; y <= y1; y++) {
    const row = y * Wf;
    for (let x = x0; x <= x1; x++) {
      const px = x + 0.5 - ax, py = y + 0.5 - ay;
      let t = (px * vx + py * vy) / vv; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = px - vx * t, dy = py - vy * t;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d >= ext) continue;

      if (v > clear[row + x]) clear[row + x] = v;

function writeInFog(text) {
  const c = document.createElement('canvas');
  c.width = Wf; c.height = Hf;
  const g = c.getContext('2d');
  const size = Math.min(Hf * 0.24, Wf * 0.5);
  g.font = '600 ' + Math.round(size) + 'px "Noto Serif TC", "Songti TC", serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.fillText(text, Wf * 0.5, Hf * 0.3);
  const d = g.getImageData(0, 0, Wf, Hf).data;
  for (let i = 0; i < Wf * Hf; i++) { const a = d[i * 4 + 3] / 255; if (a > clear[i]) clear[i] = a; }

/* ---------- drops ---------- */
const drops = [];
let maxActive = 260;
function newDrop(x, y, r) {
  if (drops.length >= maxActive) { paintStatic(x, y, Math.min(r, 3 * sizeK)); return; }
  drops.push({ x, y, r, vx: 0, vy: 0, stall: Math.random() * 0.6, slideAt: (5.2 + Math.random() * 2.5) * sizeK, trail: 0, ph: Math.random() * 6.28, wob: 0.6 + Math.random() * 1.6, px: x, py: y, dead: false });

function paintStatic(x, y, r) {

function eraseStatic(ax, ay, bx, by, w) {

function rainSpawn(dt) {
  const rate = intensity * intensity * 40 + intensity * 14;
  let n = rate * dt;
  while (n > 0) {
    if (n < 1 && Math.random() > n) break;

  // fog with wiped holes
  const md = maskImg.data;
  for (let i = 0; i < fogBytes.length; i++) { md[i * 4 + 3] = fogBytes[i]; }
  maskCv.getContext('2d').putImageData(maskImg, 0, 0);
  const t = tmpCv.getContext('2d');
  t.globalCompositeOperation = 'source-over';
  t.clearRect(0, 0, vw, vh);
  t.drawImage(fogLayer, 0, 0, vw, vh);
  t.globalCompositeOperation = 'destination-out';
  t.imageSmoothingEnabled = true;
  t.drawImage(maskCv, 0, 0, vw, vh);
  t.globalCompositeOperation = 'source-over';
  ctx2d.drawImage(tmpCv, 0, 0);
  ctx2d.drawImage(dropsCv, 0, 0, vw, vh);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    cancelAnimationFrame(rafId);
    if (actx && actx.state === 'running') actx.suspend();
  } else if (!running) {
    running = true; last = performance.now();
    if (actx && soundOn) actx.resume();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }
});
if (gl) view.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; hintEl.textContent = '繪圖資源被系統回收，請重新整理頁面'; hintEl.classList.remove('gone'); });

/* ---------- start ---------- */
resize(true);
initCars();
updateCars(0);
writeInFog('雨');
// a few drops already on the glass
for (let i = 0; i < 26; i++) newDrop(Math.random() * W, Math.random() * H * 0.9, (3.5 + Math.random() * 5) * sizeK);
for (let i = 0; i < 380; i++) paintStatic(Math.random() * W, Math.random() * H, (0.6 + Math.random() * 2.2) * sizeK);
window.__rainglass = { get drops() { return drops.length; }, get clearSum() { let s = 0; for (let i = 0; i < clear.length; i++) s += clear[i]; return s; }, get sound() { return soundOn; }, get intensity() { return intensity; }, gl: !!G };
rafId = requestAnimationFrame(frame);
})();
</script>
