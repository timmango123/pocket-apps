<style id="mobile-shim">
/* Mobile shim: no double-tap zoom on controls, no font boosting in landscape, 16px form fields so iOS doesn't zoom on focus. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, label, summary, select, input, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { font-size: max(16px, 1rem) !important; } }
</style>
<title>手指輪盤</title>
<style>
/* Tabletop spotlight: a deep felt-like pad, jewel-toned rings that pulse under each fingertip. */
:root {
  --bg: #e9ebf0;
  --chrome: #ffffff;
  --chrome-2: #f1f3f7;
  --ink: #171a22;
  --muted: #5b6272;
  --line: #d4d8e0;
  --line-strong: #a7aebd;
  --accent: #5b45d6;
  --accent-ink: #ffffff;
  --pad: #f7f8fb;
  --pad-edge: #d9dde6;
  --pad-ink: #2a2f3b;
  --pad-muted: #7a8293;
  --f0: #e8453c; --f1: #2f7fe0; --f2: #f0a400; --f3: #18a86b; --f4: #8c52e0;
  --f5: #e0459a; --f6: #0aa7b8; --f7: #f26b1d; --f8: #6d8f12; --f9: #4a5ad8;
  --scrim: rgba(10,12,18,.5);
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c11; --chrome: #161821; --chrome-2: #1e212c; --ink: #eceef4; --muted: #a1a8b8; --line: #2a2e3b; --line-strong: #464c5d;
    --accent: #a594ff; --accent-ink: #120b33; --pad: #12141c; --pad-edge: #262a37; --pad-ink: #e6e8f0; --pad-muted: #8890a3;
    --f0: #ff6159; --f1: #4f9bff; --f2: #ffbf2e; --f3: #2fd08a; --f4: #b083ff; --f5: #ff6cb9; --f6: #2bd2e0; --f7: #ff8a45; --f8: #a7d13a; --f9: #7c8cff;
    --scrim: rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c11; --chrome: #161821; --chrome-2: #1e212c; --ink: #eceef4; --muted: #a1a8b8; --line: #2a2e3b; --line-strong: #464c5d;
  --accent: #a594ff; --accent-ink: #120b33; --pad: #12141c; --pad-edge: #262a37; --pad-ink: #e6e8f0; --pad-muted: #8890a3;
  --f0: #ff6159; --f1: #4f9bff; --f2: #ffbf2e; --f3: #2fd08a; --f4: #b083ff; --f5: #ff6cb9; --f6: #2bd2e0; --f7: #ff8a45; --f8: #a7d13a; --f9: #7c8cff;
  --scrim: rgba(0,0,0,.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4;
  padding-block: 8px calc(12px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  overflow: hidden; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; gap: 8px; max-width: 1100px; margin: 0 auto; }
.bar { flex: none; display: grid; gap: 6px; }
@media (orientation: landscape) and (max-height: 520px) { .bar { grid-template-columns: 1fr minmax(260px, auto); } }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.seg { flex: 1; display: flex; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; padding: 3px; min-width: 0; }
.seg button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; padding: 0 4px; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ib { width: 44px; height: 44px; flex: none; border: 1px solid var(--line); border-radius: 12px; background: var(--chrome); display: grid; place-items: center; cursor: pointer; }
.ib svg { width: 22px; height: 22px; }
.kbox { display: inline-flex; align-items: center; gap: 4px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; padding: 0 0 0 12px; }
.kbox .lbl { font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.kbox button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; cursor: pointer; }
.kbox output { min-width: 1.6ch; text-align: center; font-weight: 800; font-size: 20px; font-family: var(--num); font-variant-numeric: tabular-nums; }
.detect { margin-left: auto; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.detect b { color: var(--ink); font-size: 17px; }

.stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; background: radial-gradient(120% 90% at 50% 45%, var(--pad) 0%, var(--pad) 55%, var(--pad-edge) 140%); border: 1px solid var(--pad-edge); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; cursor: crosshair; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.msg { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none; color: var(--pad-ink); display: grid; gap: 8px; justify-items: center; }
.msg .big { font-size: clamp(22px, 6.4vw, 34px); font-weight: 800; letter-spacing: .04em; }
.msg .small { font-size: 14px; color: var(--pad-muted); max-width: 28em; }
.msg.top { top: 18px; transform: none; }
.msg.top .big { font-size: 18px; }
.fingers-art { width: 120px; height: 72px; opacity: .55; }
.mouse-tag { position: absolute; left: 12px; bottom: 12px; font-size: 12px; font-weight: 700; color: var(--pad-muted); background: var(--chrome-2); border-radius: 8px; padding: 4px 10px; pointer-events: none; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 640px) { .scrim { align-items: center; } }
@media (max-height: 600px) { .scrim { align-items: flex-start; overflow: auto; } }
.sheet { background: var(--chrome); border-radius: 18px; width: 100%; max-width: 440px; max-height: 100%; overflow: auto; padding: 16px; display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 18px; display: flex; align-items: center; justify-content: space-between; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
.set > span { font-weight: 650; }
.set small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.step button { width: 44px; height: 44px; border: 0; background: var(--chrome-2); font-size: 20px; cursor: pointer; }
.step output { min-width: 3.4em; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.set input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.set select { min-height: 44px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--chrome-2); padding: 0 10px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.pbtn { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; cursor: pointer; }
@media (hover: hover) { .ib:hover, .kbox button:hover, .seg button:not([aria-pressed="true"]):hover { color: var(--ink); background: var(--chrome-2); } }
@media (max-width: 370px) { .seg button { font-size: 13px; } }
</style>

<div class="app">
  <header class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="模式">

      </div>
      <button class="ib" id="settings-btn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="row">
      <div class="kbox" id="kbox"><span class="lbl" id="k-label">選幾人</span><button id="k-minus" aria-label="減少">−</button><output id="k-val">2</output><button id="k-plus" aria-label="增加">＋</button></div>

<div class="scrim" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title">

    <div class="set"><span>穩定秒數<small>手指數維持不變多久</small></span><div class="step"><button id="st-minus" aria-label="減少穩定秒數">−</button><output id="st-val">2 秒</output><button id="st-plus" aria-label="增加穩定秒數">＋</button></div></div>
    <label class="set"><span>音效</span><input type="checkbox" id="opt-sound" checked></label>

    <button class="pbtn" id="set-done">完成</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const P = 'finger-pick:v1:';
const store = {
  get(k, d) {
    let raw = null;
    try { raw = localStorage.getItem(P + k); } catch (e) { return d; }
    if (raw == null) return d;
    try { return JSON.parse(raw); } catch (e) { try { localStorage.setItem(P + 'corrupt', raw); } catch (_) {} return d; }
  },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }
};
const hasCrypto = !!(window.crypto && crypto.getRandomValues);
function randInt(n) {
  if (n <= 1) return 0;
  if (!hasCrypto) return Math.floor(Math.random() * n);
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const defaults = { mode: 'pick1', k: 2, countdownSec: 3, stableSec: 2, sound: true, vibrate: true };
let S = Object.assign({}, defaults, store.get('settings', {}));
let theme = store.get('theme', 'auto');
function saveS() { store.set('settings', S); }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

// ---------- theme / palette ----------
let pal = [], padInk = '#fff';
function readPalette() { const cs = getComputedStyle(document.documentElement); pal = Array.from({ length: 10 }, (_, i) => cs.getPropertyValue('--f' + i).trim()); padInk = cs.getPropertyValue('--pad-ink').trim(); }
function applyTheme() { if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; readPalette(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readPalette);
applyTheme();

// ---------- touches & state machine ----------
const touches = new Map();   // id -> {x, y, c, born, late, chosen, team, rank, mouse}
let phase = 'wait';          // wait | stable | countdown | result
let tPhase = 0, lastTick = -1, releaseT = null, result = null, mouseSeq = 0;
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
const maxTP = navigator.maxTouchPoints || 0;

function minFingers() { return S.mode === 'pickk' ? S.k + 1 : S.mode === 'teams' ? Math.max(2, S.k) : 2; }
const active = () => [...touches.entries()].filter(([, t]) => !t.late);
function freeColor() { const used = new Set([...touches.values()].map(t => t.c)); for (let i = 0; i < 10; i++) if (!used.has(i)) return i; return touches.size % 10; }

function onCountChange() {
  if (phase === 'result') return;
  const n = touches.size;
  if (n >= minFingers()) { phase = 'stable'; tPhase = performance.now(); } else phase = 'wait';
  lastTick = -1; updateUI();
}
function addTouch(id, x, y, mouse) {
  if (touches.has(id)) return;
  if (touches.size >= 20) return;
  clearTimeout(releaseT); releaseT = null;
  touches.set(id, { x, y, c: freeColor(), born: performance.now(), late: phase === 'result', mouse: !!mouse });
  ensureAudio(); requestWake();
  onCountChange(); updateUI();
}
function moveTouch(id, x, y) { const t = touches.get(id); if (t) { t.x = x; t.y = y; } }
function removeTouch(id) {
  if (!touches.delete(id)) return;
  if (phase === 'result') { if (!touches.size) { releaseT = setTimeout(reset, 500); } updateUI(); return; }
  onCountChange();
}
function reset() { releaseT = null; result = null; phase = 'wait'; touches.forEach(t => { delete t.chosen; delete t.team; delete t.rank; t.late = false; }); onCountChange(); }

/** Pure decision on an id list: returns {order, chosen:Set, team:Map, rank:Map}. */
function decide(ids, mode, k) {
  const order = shuffle(ids.slice()), chosen = new Set(), team = new Map(), rank = new Map();
  if (mode === 'pick1') chosen.add(order[0]);
  else if (mode === 'pickk') order.slice(0, k).forEach(i => chosen.add(i));
  else if (mode === 'teams') order.forEach((id, i) => team.set(id, i % k));
  else order.forEach((id, i) => rank.set(id, i + 1));
  return { order, chosen, team, rank };
}
function finish() {
  const ids = active().map(([id]) => id);
  result = decide(ids, S.mode, S.k);
  touches.forEach((t, id) => { t.chosen = result.chosen.has(id); if (result.team.has(id)) t.team = result.team.get(id); if (result.rank.has(id)) t.rank = result.rank.get(id); });
  result.at = performance.now();
  phase = 'result';
  vib(200); riser();
  updateUI();
}

// ---------- input: Pointer Events, Touch Events fallback, mouse simulation ----------
const local = (cx, cy) => { const r = stage.getBoundingClientRect(); return [cx - r.left, cy - r.top]; };
if (window.PointerEvent) {
  stage.addEventListener('pointerdown', e => {
    e.preventDefault();
    const [x, y] = local(e.clientX, e.clientY);
    if (e.pointerType === 'mouse') { if (e.button === 0) mouseClick(x, y); return; }
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    addTouch('p' + e.pointerId, x, y, false);
  });
  stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') return; const [x, y] = local(e.clientX, e.clientY); moveTouch('p' + e.pointerId, x, y); });
  const up = e => { if (e.pointerType !== 'mouse') removeTouch('p' + e.pointerId); };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up); stage.addEventListener('lostpointercapture', up);
  // stop iOS scroll / zoom / callout while fingers are down
  stage.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
} else {
  const each = (e, fn) => { e.preventDefault(); for (const t of e.changedTouches) { const [x, y] = local(t.clientX, t.clientY); fn('t' + t.identifier, x, y); } };
  stage.addEventListener('touchstart', e => each(e, (id, x, y) => addTouch(id, x, y, false)), { passive: false });
  stage.addEventListener('touchmove', e => each(e, moveTouch), { passive: false });
  stage.addEventListener('touchend', e => each(e, removeTouch), { passive: false });
  stage.addEventListener('touchcancel', e => each(e, removeTouch), { passive: false });
  stage.addEventListener('mousedown', e => { const [x, y] = local(e.clientX, e.clientY); mouseClick(x, y); });
}
stage.addEventListener('contextmenu', e => e.preventDefault());
function mouseClick(x, y) {
  if (phase === 'result') { [...touches.keys()].filter(k => touches.get(k).mouse).forEach(k => touches.delete(k)); reset(); return; }
  for (const [id, t] of touches) if (t.mouse && Math.hypot(t.x - x, t.y - y) < 48) { removeTouch(id); return; }
  addTouch('m' + (++mouseSeq), x, y, true);
}
// keyboard: Space adds a simulated dot at a free spot, Backspace removes the last one
stage.tabIndex = 0;
stage.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); const r = stage.getBoundingClientRect(); const n = touches.size; mouseClick(r.width * (0.2 + 0.6 * ((n * 0.37) % 1)), r.height * (0.25 + 0.5 * ((n * 0.61) % 1))); }
  if (e.key === 'Backspace' || e.key === 'Delete') { const ks = [...touches.keys()].filter(k => touches.get(k).mouse); if (ks.length) removeTouch(ks[ks.length - 1]); }
});

// ---------- UI text ----------
const modeName = { pick1: '選 1 人', pickk: '選 K 人', teams: '分 K 隊', order: '排順序' };
function updateUI() {
  const n = touches.size, min = minFingers(), mouseOnly = n > 0 && [...touches.values()].every(t => t.mouse);
  $('#detect').innerHTML = `已偵測 <b>${n}</b> 指`;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  const kOn = S.mode === 'pickk' || S.mode === 'teams';
  $('#kbox').style.visibility = kOn ? 'visible' : 'hidden';
  $('#k-label').textContent = S.mode === 'teams' ? '分幾隊' : '選幾人';
  $('#k-val').textContent = S.k;
  $('#mouse-tag').hidden = !(maxTP === 0 || mouseOnly);
  const m = $('#msg'); m.classList.remove('top');
  let big = '', small = '';
  if (phase === 'result') {
    m.classList.add('top');
    big = S.mode === 'pick1' ? '選中了！' : S.mode === 'pickk' ? `選出 ${S.k} 人` : S.mode === 'teams' ? `分成 ${S.k} 隊` : '順序已排好';
    small = mouseOnly || (n === 0 && maxTP === 0) ? '點一下畫面重來' : '全部手指放開以重來';
  } else if (n === 0) {
    big = '把手指放上來';
    small = maxTP === 0 ? `這台裝置沒有觸控，點擊畫面可放置圓點模擬；建議在手機上使用。（${modeName[S.mode]}）` : `每人一根手指，至少 ${min} 指。（${modeName[S.mode]}）`;
  } else if (n < min) {
    big = '需要更多手指';
    small = `${modeName[S.mode]}${kOn ? `（K = ${S.k}）` : ''}至少要 ${min} 指，目前 ${n} 指`;
  } else if (phase === 'stable') { m.classList.add('top'); big = '保持不動…'; small = `${n} 指就緒`; }
  else if (phase === 'countdown') { m.classList.add('top'); big = ''; small = ''; }
  m.innerHTML = '';
  if (n === 0 && phase !== 'result') m.insertAdjacentHTML('beforeend', '<svg class="fingers-art" viewBox="0 0 120 72" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="36" r="16"/><circle cx="60" cy="30" r="16"/><circle cx="96" cy="36" r="16"/></svg>');
  if (big) { const d = document.createElement('div'); d.className = 'big'; d.textContent = big; m.appendChild(d); }
  if (small) { const d = document.createElement('div'); d.className = 'small'; d.textContent = small; m.appendChild(d); }
}

// ---------- drawing ----------
let W = 0, H = 0, dpr = 1;
function resize() {
  const r = stage.getBoundingClientRect(); dpr = Math.min(3, devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
new (window.ResizeObserver || function (cb) { addEventListener('resize', cb); this.observe = () => {}; })(resize).observe(stage);
resize();
function hexA(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const R = 45;
function frame(now) {
  requestAnimationFrame(frame);
  // phase timers
  if (phase === 'stable' && now - tPhase >= S.stableSec * 1000) { phase = 'countdown'; tPhase = now; lastTick = -1; updateUI(); }
  if (phase === 'countdown') {
    const el = now - tPhase, sec = Math.floor(el / 1000);
    if (sec !== lastTick) { lastTick = sec; if (sec < S.countdownSec) { vib(30); tick(); } }
    if (el >= S.countdownSec * 1000) finish();
  }
