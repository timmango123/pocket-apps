<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>十字繡坊</title>
<style>
:root{
  --linen:#efe6d4; --linen2:#e6dbc4; --ink:#3b3128; --ink2:#7b6a57; --card:#fbf6ec; --card2:#f3ead9; --line:#8b6f4e;
  --accent:#c4513f; --accent2:#a83f2f; --gold:#d9a23c; --ok:#4f8a5b; --shadow:#5a432a33; --dash:#c9b48f;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --linen:#1f2a3d; --linen2:#253248; --ink:#eef1f6; --ink2:#a9b4c6; --card:#2a3850; --card2:#33425c; --line:#9fb0c8;
  --accent:#ef7a63; --accent2:#d9614b; --gold:#f2c35a; --ok:#78c08a; --shadow:#00000055; --dash:#5d6f8d; } }
:root[data-theme="dark"]{ --linen:#1f2a3d; --linen2:#253248; --ink:#eef1f6; --ink2:#a9b4c6; --card:#2a3850; --card2:#33425c; --line:#9fb0c8;
  --accent:#ef7a63; --accent2:#d9614b; --gold:#f2c35a; --ok:#78c08a; --shadow:#00000055; --dash:#5d6f8d; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--linen);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;gap:7px;align-items:stretch;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:48px;border-radius:14px;background:var(--card);box-shadow:0 2px 0 var(--dash),0 6px 14px var(--shadow);display:grid;place-items:center;flex:none;position:relative;color:var(--ink)}
.ibtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--dash)}
.ibtn[disabled]{opacity:.4}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#3b2a10;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;box-shadow:0 2px 0 var(--dash),0 6px 14px var(--shadow);padding:5px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative}
.hmid::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--dash);border-radius:11px;pointer-events:none}
.hl{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;line-height:1.15}
.hl b{font-size:14px}
.hdiff{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.pips{display:inline-flex;gap:2px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--dash)}.pips i.on{background:var(--accent)}
.htime{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.hearts{font-size:13px;letter-spacing:1px;color:var(--accent)}.hearts .off{color:var(--dash)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.bottom>*{pointer-events:auto}
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 2px 0 #0002,inset 0 0 0 3px #fff7;position:relative}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.sw::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px dashed #fff9}
.brow{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;max-width:520px}
.seg{display:flex;background:var(--card);border-radius:18px;padding:4px;box-shadow:0 2px 0 var(--dash),0 6px 14px var(--shadow);flex:1;max-width:260px}
.seg button{flex:1;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:16px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 2px #fff4}
.seg button.on .sti{stroke:#fff}
.bottom .ibtn{height:56px;width:52px;border-radius:16px}
.zl{font-size:10px;font-weight:700;margin-top:-2px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:color-mix(in srgb,var(--linen) 70%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:0 18px 50px var(--shadow);padding:22px 20px;width:min(380px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);position:relative;max-height:100%;overflow-y:auto}
.card::before{content:"";position:absolute;inset:7px;border:2px dashed var(--dash);border-radius:18px;pointer-events:none}
.card h2{margin:2px 0 6px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent2);position:relative}
.btn::after{content:"";position:absolute;inset:4px;border:1.5px dashed #ffffff88;border-radius:12px;pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--dash)}
.btn.sec::after{border-color:var(--dash)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:42px;letter-spacing:6px;margin:2px 0;color:var(--dash)}
.stars .on{color:var(--gold);display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both;text-shadow:0 2px 0 #0002}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:18px;margin:2px 0 4px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:20px;color:var(--ink)}
#win{align-items:flex-end;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
#win .card{animation:rise .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;padding-top:calc(var(--sat) + 4vh)}
.ttl{text-align:center}
.ttl h1{font-size:46px;margin:0;letter-spacing:8px;color:var(--ink);text-shadow:0 3px 0 var(--card)}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:6px;font-size:15px}
.tbtns{width:min(340px,100%);display:flex;flex-direction:column;gap:0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tgrid .btn{margin:0;font-size:15px;min-height:48px}
/* level select */
#select,#gallery,#stats{align-items:stretch;padding:0;background:var(--linen)}
.pane{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.phead{padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.phead h2{flex:1;margin:0;font-size:21px;letter-spacing:1px}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 2px;text-align:left}
.tog .trk{width:46px;height:28px;border-radius:14px;background:var(--dash);position:relative;transition:background .2s;flex:none}
.tog .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.tog[aria-checked="true"] .trk{background:var(--ok)}
.tog[aria-checked="true"] .trk::after{transform:translateX(18px)}
.psum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 24px) calc(var(--sal) + 12px);touch-action:pan-y}
.chap{margin:14px 4px 8px;font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.chap span{font-weight:600;color:var(--ink2);font-size:12px}
.chap::after{content:"";flex:1;border-top:2px dashed var(--dash)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lt{aspect-ratio:1/1.18;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--dash);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:4px 2px;overflow:hidden}
.lt .n{font-size:18px;font-weight:800;line-height:1}
.lt canvas{width:58%;aspect-ratio:1;image-rendering:pixelated;border-radius:4px}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--dash);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:2px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1;white-space:nowrap}
.lt.done .n{font-size:11px;position:absolute;left:5px;top:4px;color:var(--ink2)}
.lt.cur{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--dash)}
.lt.lock{opacity:.55}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;padding-top:6px}
.gi{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);text-align:center}
.gi canvas{width:100%;aspect-ratio:1}
.gi b{color:var(--ink);font-size:13px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.stc{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 3px 0 var(--dash);font-size:13px;color:var(--ink2)}
.stc b{display:block;font-size:22px;color:var(--ink)}
.ach{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:0 3px 0 var(--dash);text-align:left}
.ach .ic{font-size:22px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2);filter:grayscale(1);opacity:.5;flex:none}
.ach.on .ic{filter:none;opacity:1;background:#f4d58a}
.ach div{font-size:13px;color:var(--ink2);line-height:1.4}.ach div b{color:var(--ink);font-size:14px}
.setl{text-align:left;margin-top:6px}
.setl .tog{width:100%;justify-content:space-between;font-size:15px;color:var(--ink);padding:4px 2px;min-height:48px}
.setl small{display:block;color:var(--ink2);font-weight:500;font-size:12px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--linen);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:min(92vw,420px);text-align:center;pointer-events:none;transition:opacity .35s;opacity:0;line-height:1.5}
.toast.show{opacity:1}
.help{text-align:left;font-size:14px;color:var(--ink2);line-height:1.6;margin:8px 0}
.help li{margin:4px 0}.help b{color:var(--ink)}
.demo{display:block;margin:4px auto;width:280px;height:150px;max-width:100%}
.hidden{display:none !important}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .ttl h1{font-size:34px;letter-spacing:5px} .ttl .sub{font-size:13px}
  #title{align-items:flex-end;justify-content:center;gap:10px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 24px) calc(var(--sab) + 10px) 16px}
  #title .ttl,#title .tbtns{width:min(48vw,400px)} .tbtns .btn{min-height:44px;font-size:15px;margin-top:8px} .tgrid{gap:8px;margin-top:8px} }
@media (orientation:landscape) and (max-height:600px){
  .bottom{left:auto;top:calc(var(--sat) + 62px);flex-direction:row;align-items:center;justify-content:center;padding:4px calc(var(--sar) + 10px) calc(var(--sab) + 8px) 6px;gap:8px}
  .brow{flex-direction:column;width:auto;gap:8px}
  .seg{flex-direction:column;flex:none;max-width:none}
  .seg button{flex:none;width:66px;height:46px;font-size:15px}
  .palette{flex-direction:column;gap:6px}
  .palette .sw{width:40px;height:40px}
  .bottom .ibtn{height:46px;width:66px}
  .hud .hmid{max-width:560px}
}
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .lt:hover{transform:translateY(-1px)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>
<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="hmid">
    <div class="hl"><b id="hLv">第 1 關</b><span class="hdiff">難度 <b id="hDiff" style="font-size:12px">1</b><span class="pips" id="hPips"></span></span></div>
    <div class="hl"><span class="htime" id="hTime">00:00</span><span class="hearts" id="hHearts"></span></div>
  </div>
  <button class="ibtn" id="bUndo" aria-label="悔棋"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="ibtn" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintN">3</span></button>
</div>
<div class="bottom hidden" id="bottom">
  <div class="palette hidden" id="palette"></div>
  <div class="brow">
    <button class="ibtn" id="bRedo" aria-label="重做"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div class="seg" role="radiogroup" aria-label="模式">
      <button id="mFill" class="on" role="radio" aria-checked="true"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" stroke="none"/></svg>繡</button>
      <button id="mCross" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M7 7l10 10M17 7L7 17"/></svg>叉</button>
    </div>
    <button class="ibtn" id="bZoom" aria-label="縮放"><svg class="i" viewBox="0 0 24 24" id="zIcon"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5M11 8.5v5"/></svg></button>
  </div>
</div>

<div class="ov" id="title">
  <div class="ttl"><h1>十字繡坊</h1><div class="sub">依數字提示，繡出藏在布裡的小圖</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始刺繡</button>
    <div class="tgrid">
      <button class="btn sec" id="tSelect">選擇關卡</button>
      <button class="btn sec" id="tDaily">每日一繡</button>
      <button class="btn sec" id="tGallery">繡片圖鑑</button>
      <button class="btn sec" id="tStats">統計成就</button>
    </div>
    <div class="row2"><button class="btn sec" id="tHelp">玩法</button><button class="btn sec" id="tSet">設定</button></div>
  </div>
</div>

<div class="ov hidden" id="select"><div class="pane">
  <div class="phead"><button class="ibtn" id="sBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>選擇關卡</h2>
    <button class="tog" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button></div>
  <div class="psum" id="sSum"></div>
  <div class="scroll" id="sScroll"></div>
</div></div>

<div class="ov hidden" id="gallery"><div class="pane">
  <div class="phead"><button class="ibtn" id="gBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>繡片圖鑑</h2><span class="psum" id="gSum" style="padding:0"></span></div>
  <div class="scroll"><div class="gal" id="gGrid"></div></div>
</div></div>

<div class="ov hidden" id="stats"><div class="pane">
  <div class="phead"><button class="ibtn" id="stBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>統計與成就</h2></div>
  <div class="scroll" id="stBody"></div>
</div></div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2><p id="pInfo"></p>
  <button class="btn" id="pResume">繼續刺繡</button>
  <div class="row2"><button class="btn sec" id="pRestart">重新開始</button><button class="btn sec" id="pSelect">選擇關卡</button></div>
  <div class="row2"><button class="btn sec" id="pHelp">玩法</button><button class="btn sec" id="pSet">設定</button></div>
  <button class="btn sec" id="pHome">回到首頁</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="setl">
    <button class="tog" role="switch" data-k="check"><span>錯誤提示<small>繡錯立即標紅並扣一顆心</small></span><span class="trk"></span></button>
    <button class="tog" role="switch" data-k="autoX"><span>自動劃叉<small>一行完成時，其餘格子自動打叉</small></span><span class="trk"></span></button>
    <button class="tog" role="switch" data-k="sound"><span>音效</span><span class="trk"></span></button>
    <button class="tog" role="switch" data-k="vib"><span>震動</span><span class="trk"></span></button>
  </div>
  <button class="btn" id="setOk">完成</button>

  var saveDPR = DPR; DPR = 1; stitchCache = {};
  var p = g.createPattern((function () { var t = document.createElement('canvas'); t.width = t.height = 160; var tg = t.getContext('2d'); tg.fillStyle = TH.cloth; tg.fillRect(0, 0, 160, 160); for (var y = 0; y < 160; y += 3) { tg.fillStyle = dark ? 'rgba(255,255,255,.03)' : 'rgba(120,90,50,.05)'; tg.fillRect(0, y, 160, 1); } return t; })(), 'repeat');
  g.fillStyle = p; g.fillRect(0, 0, S, S + 120);
  g.fillStyle = TH.board; g.beginPath(); g.arc(S / 2, S / 2 + 20, 280, 0, Math.PI * 2); g.fill();
  drawHoopAt(g, S / 2, S / 2 + 20, 280, L, 1);
  g.fillStyle = TH.ink; g.font = '800 40px system-ui,sans-serif'; g.textAlign = 'center'; g.fillText('「' + L.name + '」', S / 2, S + 60);
  g.fillStyle = TH.ink2; g.font = '600 22px system-ui,sans-serif'; g.fillText('十字繡坊・' + (L.daily ? '每日一繡' : '第 ' + L.n + ' 關') + '・' + fmt(G.time) + '・' + '★★★'.slice(0, G.stars), S / 2, S + 98);
  DPR = saveDPR; stitchCache = {};
  try { c.toBlob(function (b) { if (!b) return;
    var name = 'cross-stitch-' + (L.daily ? 'daily' : L.n) + '.png', f = null;
    try { f = new File([b], name, { type: 'image/png' }); } catch (e) {}
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: '十字繡坊' }).catch(function () { showPng(c); }); return; }
    showPng(c); }); } catch (e) { toast('無法輸出圖片'); }
}

/* ---------- daily puzzle ---------- */
function makeDaily() {
  var d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  var COLS = ['r', 'b', 'G', 'v', 'o', 't', 'm', 'n'];
  for (var tries = 0; tries < 400; tries++) {
    var rnd = mulberry(seed * 31 + tries), W = 10, cells = [], x, y;
    for (y = 0; y < W; y++) for (x = 0; x < 5; x++) cells[y * W + x] = rnd() < 0.55 ? 1 : 0;
    for (var it = 0; it < 2; it++) { var nc = cells.slice(); for (y = 0; y < W; y++) for (x = 0; x < 5; x++) { var n = 0; for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { var yy = y + dy, xx = x + dx; if (xx > 4) xx = 9 - xx; if (yy >= 0 && yy < W && xx >= 0) n += cells[yy * W + xx] || 0; } nc[y * W + x] = n >= 5 ? 1 : n <= 3 ? 0 : cells[y * W + x]; } cells = nc; }
    for (y = 0; y < W; y++) for (x = 5; x < W; x++) cells[y * W + x] = cells[y * W + (9 - x)];
    var cnt = cells.reduce(function (a, b) { return a + b; }, 0); if (cnt < 35 || cnt > 70) continue;
    var letter = COLS[Math.floor(rnd() * COLS.length)], str = '每日一繡|10|10|0|' + letter + '|' + encodeRLE(cells, letter);
    var L = decodeLevel(str); prepLevel(L); var r = solveLevel(L, { probe: false });
    if (!r.ok) continue;
    L.daily = true; L.dkey = key; L.id = 'D' + key; L.n = 0; L.diff = Math.round(clamp(1 + 99 * (Math.log(rawDifficulty(L, r)) - DIFF_NORM[0]) / (DIFF_NORM[1] - DIFF_NORM[0]), 1, 100)); L.name = '每日一繡 ' + (d.getMonth() + 1) + '/' + d.getDate();
    return L;
  }
  var L2 = getLevel(30); return L2;
}

/* ---------- help demo animation ---------- */
var helpAnimStart = 0;
function drawHelp(now) {
  var c = $('helpCv'); if (!c || $('help').classList.contains('hidden')) return; var g = c.getContext('2d'), t = ((now - helpAnimStart) / 1000) % 4;
  g.clearRect(0, 0, 560, 300); var s = 64, ox = 170, oy = 50, row = [1, 1, 1, 0, 1];
  g.fillStyle = TH.board; g.fillRect(ox, oy, s * 5, s * 2);
  g.strokeStyle = TH.grid; g.lineWidth = 1; for (var i = 0; i <= 5; i++) { g.beginPath(); g.moveTo(ox + i * s, oy); g.lineTo(ox + i * s, oy + 2 * s); g.stroke(); } for (i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(ox, oy + i * s); g.lineTo(ox + 5 * s, oy + i * s); g.stroke(); }
  g.fillStyle = TH.ink; g.font = '700 34px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('3', ox - 70, oy + s / 2); g.fillText('1', ox - 32, oy + s / 2); g.fillText('5', ox - 32, oy + s * 1.5);
  var k = Math.floor(clamp(t - 0.3, 0, 3) / 0.25), sd = DPR; DPR = 1;
  for (i = 0; i < 5; i++) { if (i < 3 && k > i) g.drawImage(stitchSprite(TH.mono, s), ox + i * s, oy, s, s); if (i === 3 && t > 1.6) { g.strokeStyle = TH.cross; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(ox + 3 * s + 20, oy + 20); g.lineTo(ox + 4 * s - 20, oy + s - 20); g.moveTo(ox + 4 * s - 20, oy + 20); g.lineTo(ox + 3 * s + 20, oy + s - 20); g.stroke(); } if (i === 4 && t > 2) g.drawImage(stitchSprite(TH.mono, s), ox + 4 * s, oy, s, s); if (t > 2.4 && (t - 2.4) / 0.12 > i) g.drawImage(stitchSprite(TH.mono, s), ox + i * s, oy + s, s, s); }
  DPR = sd;
  var fx = t < 0.3 ? ox + s / 2 : t < 1.1 ? ox + s / 2 + clamp((t - 0.3) / 0.75, 0, 1) * 2 * s : t < 2 ? ox + 3.5 * s : t < 2.4 ? ox + 4.5 * s : ox + s / 2 + clamp((t - 2.4) / 0.6, 0, 1) * 4 * s;
  var fy = t < 2.4 ? oy + s / 2 + 6 : oy + s * 1.5 + 6;
  g.fillStyle = 'rgba(196,81,63,.35)'; g.beginPath(); g.arc(fx, fy, 26, 0, Math.PI * 2); g.fill();
  g.fillStyle = TH.ink2; g.font = '700 26px system-ui,sans-serif'; g.fillText(t < 1.4 ? '拖曳連繡' : t < 2.2 ? '長按＝打叉' : '一次繡整行', 280, 270);
}

/* ---------- loop ---------- */
var lastSec = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastT = now; return; }
  var dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  if (screen === 'game' && G && G.status === 'play' && !overlayOpen()) { G.time += dt * 1000; var sec = Math.floor(G.time / 1000); if (sec !== lastSec) { lastSec = sec; $('hTime').textContent = fmt(G.time); } }
  stepParticles(dt);
  if (stroke && stroke.px != null && stroke.moved && G && G.status === 'play') { // auto-scroll a zoomed board while dragging near its edge
    var ex = 0, ey = 0, vx0 = view.ax0 + view.RW, vy0 = view.ay0 + view.CH, E = 22;
    if (stroke.px < vx0 + E) ex = 1; else if (stroke.px > view.ax1 - E) ex = -1;
    if (stroke.py < vy0 + E) ey = 1; else if (stroke.py > view.ay1 - E) ey = -1;
    if (!(ex || ey)) stroke.edgeT = 0; else if (!stroke.edgeT) stroke.edgeT = now; // dwell 350ms at the edge before scrolling
    if ((ex || ey) && now - stroke.edgeT > 350) { var ox0 = view.ox, oy0 = view.oy; view.ox += ex * 320 * dt; view.oy += ey * 320 * dt; clampPan(); if (view.ox !== ox0 || view.oy !== oy0) { strokeMove(stroke.px, stroke.py); dirty = true; } }
  }
  var anim = particles.length || screen === 'title' || (G && (G.status === 'won' || G.hintCell != null || Object.keys(G.pop).length || Object.keys(G.errMark).length || G.glow.length));
  if (G) { var k = Object.keys(G.errMark); for (var i = 0; i < k.length; i++) if (now - G.errMark[k[i]] > 1700) delete G.errMark[k[i]]; while (G.glow.length && now - G.glow[0].t > 1000) G.glow.shift(); }
  if (dirty || anim) {
    dirty = false;
    var sh = shake && now - shake < 260 ? Math.sin((now - shake) / 18) * 4 * (1 - (now - shake) / 260) : 0;
    if (sh) { ctx.save(); ctx.translate(sh, 0); }
    draw(now);
    if (sh) ctx.restore();
  }
  drawHelp(now);
}

/* ---------- wiring ---------- */
function on(id, f) { $(id).addEventListener('click', function (e) { audio(); SFX.click(); f(e); }); }
on('tPlay', function () { startLevel(clamp(progress.last || 1, 1, NL)); });
on('tSelect', function () { buildSelect(); show('select'); });
on('tDaily', startDaily);
on('tGallery', function () { buildGallery(); show('gallery'); });
on('tStats', function () { buildStats(); show('stats'); });
on('tHelp', openHelp); on('tSet', openSettings);
on('sBack', function () { if (G && G.status === 'play') { hideAll(); show('pause'); } else goTitle(); });
on('gBack', goTitle); on('stBack', goTitle);
$('sScroll').addEventListener('click', function (e) { var b = e.target.closest('.lt'); if (!b) return; audio(); var n = +b.dataset.n; if (!isUnlocked(n)) { SFX.error(); toast('先完成第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; } SFX.click(); startLevel(n); });
on('unlockSw', function () { unlockAll = !unlockAll; sset('unlockAll', unlockAll); var sc = $('sScroll').scrollTop; buildSelect(); $('sScroll').scrollTop = sc; });
on('bMenu', openPause); on('pResume', resume);
on('pRestart', function () { var L = G.L; delete inprog[L.id]; sset('inprogress', inprog); hideAll(); particles = []; newGame(L, { fresh: true }); });
on('pSelect', function () { saveInprog(); buildSelect(); show('select'); setTimeout(scrollToCur, 30); });
on('pHome', goTitle); on('pHelp', openHelp); on('pSet', openSettings);
on('helpOk', function () { if (helpFrom && helpFrom !== 'help') show(helpFrom); else hideAll(); });
on('setOk', function () { if (helpFrom && helpFrom !== 'settings') show(helpFrom); else hideAll(); if (G) updateHUD(); });
Array.prototype.forEach.call(document.querySelectorAll('#settings .tog'), function (b) { b.addEventListener('click', function () { var k = b.dataset.k; settings[k] = !settings[k]; sset('settings', settings); syncSettings(); audio(); SFX.click(); }); });
on('bUndo', undo); on('bRedo', redo); on('bHint', useHint);
on('mFill', function () { setMode('fill'); }); on('mCross', function () { setMode('cross'); });
on('bZoom', function () { if (view.z > 1.05) setZoom(1); else setZoom(Math.max(view.autoZ, Math.min(view.maxZ, 2))); });
on('oCont', function () { G.continued = true; hideAll(); updateHUD(); toast('繼續加油！這關最多 ★'); });
on('oRestart', function () { var L = G.L; delete inprog[L.id]; sset('inprogress', inprog); hideAll(); newGame(L, { fresh: true }); });
on('wNext', function () { var L = G.L; if (L.daily) { goTitle(); return; } if (L.n >= NL) { G = null; screen = 'title'; setGameUI(false); buildGallery(); show('gallery'); return; } startLevel(L.n + 1); });
on('wSelect', function () { G = null; screen = 'title'; setGameUI(false); buildSelect(); show('select'); setTimeout(scrollToCur, 30); });
on('wShare', sharePNG);
function scrollToCur() { var el = $('sScroll').querySelector('.lt.cur'); if (el) el.scrollIntoView({ block: 'center' }); }
$('tSelect').addEventListener('click', function () { setTimeout(scrollToCur, 30); });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', function () { if (document.hidden) { if (G && G.status === 'play') { finishStroke(); saveInprog(); } } lastT = 0; });
window.addEventListener('pagehide', function () { if (G && G.status === 'play') saveInprog(); });
if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); var cb = function () { readTheme(); }; if (mq.addEventListener) mq.addEventListener('change', cb); else if (mq.addListener) mq.addListener(cb); }

readTheme(); resize(); refreshTitle(); requestAnimationFrame(frame);

/* test / automation hook */
window.__game = {
  state: function () { return G ? { status: G.status, level: G.L.n, w: G.L.w, h: G.L.h, hearts: G.hearts, errors: G.errors, time: G.time, stars: G.stars || 0, multi: G.L.multi, hoop: !!G.hoop, errLog: G.errLog || [] } : { status: screen }; },
  view: function () { return { c: view.c, ox: view.ox, oy: view.oy, z: view.z, ax0: view.ax0, ay0: view.ay0, ax1: view.ax1, ay1: view.ay1, RW: view.RW, CH: view.CH }; },
  solution: function () { return G ? Array.prototype.slice.call(G.L.sol) : null; },
  board: function () { return G ? Array.prototype.slice.call(G.board) : null; },
  color: function () { return curColor; }

})();

<script>

  o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;touch-action:auto';

  im.style.cssText = 'max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto;pointer-events:auto';
  var t = document.createElement('div'); t.textContent = '長按圖片（或按右鍵）即可儲存'; t.style.cssText = 'color:#fff;font-size:15px';
  var btn = document.createElement('button'); btn.textContent = '關閉'; btn.style.cssText = 'min-width:120px;min-height:44px;border-radius:22px;border:0;font-size:16px;background:#fff;color:#333';
  btn.onclick = function () { o.remove(); }; o.onclick = function (e) { if (e.target === o) o.remove(); };
  im.addEventListener('contextmenu', function (e) { e.stopPropagation(); }, true);

</script>
