<script>
/*CORE-START*/
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 up 1 right 2 down 3 left
var W_BASIC = 1, W_CAP = 2, W_ISO = 4, W_TRIAL = 10;

function encodeLevel(w, h, cells) {
var s = '', run = 0;
for (var i = 0; i < cells.length; i++) {
var c = cells[i];
if (c === '.') { run++; if (run === 26) { s += 'z'; run = 0; } continue; }
if (run) { s += String.fromCharCode(96 + run); run = 0; }
s += c;
}
if (run) s += String.fromCharCode(96 + run);
return w + ',' + h + ',' + s;
}
function parseLevel(str) {
var p = str.split(','), w = +p[0], h = +p[1], body = p[2], N = w * h, cells = [], i, j;
for (i = 0; i < body.length; i++) {
var ch = body[i], k = ch.charCodeAt(0) - 96;
if (k >= 1 && k <= 26) { for (j = 0; j < k; j++) cells.push('.'); } else cells.push(ch);
}
while (cells.length < N) cells.push('.');
var isl = [], cellIsl = new Int16Array(N).fill(-1), mask = new Uint8Array(N);
for (i = 0; i < N; i++) {
var c = cells[i];
if (c >= '1' && c <= '8') { cellIsl[i] = isl.length; isl.push({ x: i % w, y: (i / w) | 0, n: +c, c: i }); }
else if (c === '#') mask[i] = 1;
}
var edges = [], adj = isl.map(function () { return []; }), nb = isl.map(function () { return [-1, -1, -1, -1]; });
for (i = 0; i < isl.length; i++) {
var A = isl[i];
for (var d = 1; d <= 2; d++) {
var x = A.x + DX[d], y = A.y + DY[d];
while (x < w && y < h && !mask[y * w + x]) {
var b = cellIsl[y * w + x];
if (b >= 0) {
var e = edges.length;
edges.push({ a: i, b: b, hz: d === 1, x1: A.x, y1: A.y, x2: x, y2: y, cross: [] });
adj[i].push(e); adj[b].push(e); nb[i][d] = e; nb[b][(d + 2) % 4] = e;
break;
}
x += DX[d]; y += DY[d];
}
}
}
for (i = 0; i < edges.length; i++) {
var E = edges[i]; if (!E.hz) continue;
for (j = 0; j < edges.length; j++) {
var F = edges[j]; if (F.hz) continue;
if (F.x1 > E.x1 && F.x1 < E.x2 && E.y1 > F.y1 && E.y1 < F.y2) { E.cross.push(j); F.cross.push(i); }
}
}

}
function newSt(P) {
var E = P.edges.length, lo = new Int8Array(E), hi = new Int8Array(E);

/* ---------------- lifecycle ---------------- */
document.addEventListener('visibilitychange', function(){
if (document.hidden){ running = false; cancelAnimationFrame(rafId); if (G && screen === 'play' && !G.won){ saveCur(); } sset('stats', stats); }
else if (!running){ running = true; lastTs = 0; if (G) G.lastTs = 0; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); }
});
window.addEventListener('pagehide', function(){ if (G) saveCur(); sset('stats', stats); });
window.addEventListener('resize', resize);
resize();
showScreen('title');
rafId = requestAnimationFrame(frame);
setInterval(function(){ if (G && screen === 'play' && !G.won) saveCur(); sset('stats', stats); }, 5000);
window.__game = {
state: function(){ return G ? { n: G.n, won: G.won, winShown: !$('win').classList.contains('hidden'), islands: G.P.isl.length, edges: G.P.edges.length, sat: satCount(), groups: G.groups.count, hints: G.hints, elapsed: G.elapsed, overlay: !$('intro').classList.contains('hidden') } : null; },
islandXY: function(i){ return islandXY(i); },
edges: function(){ return G.P.edges.map(function(e){ return { a: e.a, b: e.b }; }); },
cnt: function(){ return Array.from(G.cnt); },
plan: function(){
var P = G.P, S = newSt(P), out = [], seenE = {};
for (var g = 0; g < 50000; g++){
var ev = nextStep(P, S); if (!ev || ev.contra) break;
applyEv(S, ev);
for (var k = 0; k < ev.ch.length; k++){ var c = ev.ch[k]; if (c[1] > 0 && c[1] === c[2] && !seenE[c[0]]){ seenE[c[0]] = 1; out.push({ e: c[0], v: c[1], from: P.edges[c[0]].a }); } }
var all = true; for (var e = 0; e < S.lo.length; e++) if (S.lo[e] !== S.hi[e]) { all = false; break; }
if (all) break;
}
for (var e2 = 0; e2 < P.edges.length; e2++) if (G.sol[e2] > 0 && !seenE[e2]) out.push({ e: e2, v: G.sol[e2], from: P.edges[e2].a });
return out;
}
};
