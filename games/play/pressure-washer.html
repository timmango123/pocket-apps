  $('#stars').setAttribute('aria-label', '0 顆星');
  $('#statA').innerHTML = `<b>${Math.floor(pct * 100)}%</b>洗淨度`;
  $('#statB').innerHTML = `<b>${limitVal}</b>${cur.limit === 'time' ? '秒限制' : '秒水量'}`;
  $('#starHint').textContent = cur.limit === 'water' ? '提示：放開手指就不耗水，先瞄準髒的地方再噴。' : '提示：大片灰塵用寬扇，厚泥再換集中噴嘴。';
  $('#nextBtn').hidden = true;
  $('#done').hidden = false; $('#retryBtn').focus({ preventScroll: true });
}
$('#retryBtn').addEventListener('click', () => startLevel(lvl));
$('#nextBtn').addEventListener('click', () => startLevel(lvl < NLV - 1 ? lvl + 1 : 0));
$('#toMenuBtn').addEventListener('click', openMenu);
$('#menuBtn').addEventListener('click', () => { audioInit(); openMenu(); });
$('#muteBtn').addEventListener('click', () => { audioInit(); setMuted(!muted); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { sprayOn = false; ptrId = null; keySpray = false; audioUpdate(false); if (ac) ac.suspend(); } else if (ac) ac.resume(); });

// ---------- loop ----------
let wetFadeT = 0, t0 = 0, clock = 0;
const SPRAY_TICK = 1 / 60; let sprayAcc = 0, lastHit = 0; // spray at <= 60 Hz so 120 Hz screens get the same per-stamp strength (8-bit alpha would round tiny doses away)
function update(dt) {
  clock += dt;
  if (keys.ArrowLeft) tx -= 420 * dt; if (keys.ArrowRight) tx += 420 * dt; if (keys.ArrowUp) ty -= 420 * dt; if (keys.ArrowDown) ty += 420 * dt;
  tx = clamp(tx, -40, SW + 40); ty = clamp(ty, -40, SH + 40);
  let hit = 0;
  if (state === 'play') {
    if (started) elapsed += dt;
    if (sprayOn) { sprayAcc += dt; if (sprayAcc >= SPRAY_TICK - 1e-6) { lastHit = spray(sprayAcc); sprayAcc = 0; } hit = lastHit; water += dt; } else sprayAcc = 0;
    if (cur.limit === 'time' && elapsed >= limitVal) { fail('時間到！'); return; }
    if (cur.limit === 'water' && water >= limitVal) { fail('水用完了！'); return; }
    sampleT -= dt;
    if (sampleT <= 0) {
      sampleT = 0.2;
      const d = measure();
      pct = clamp(1 - d / initDirty, 0, 1);
      if (pct >= cur.target) { pct = 1; complete(); }
      updateHud();
    } else if (started) updateHud();
  } else if (state === 'reveal') {
    revealT += dt;
    if (revealT > 0.7 && revealT - dt <= 0.7) { gctx.clearRect(0, 0, SW, SH); mctx.clearRect(0, 0, SW, SH); }
    if (Math.random() < 0.6 && maskPts.length) { const i = (Math.random() * maskPts.length / 2 | 0) * 2; emit(stX + maskPts[i] * stS, stY + maskPts[i + 1] * stS, 0, -20, 0.8, 3, 6 + Math.random() * 8); }
    if (revealT > 2.1) showDone();
  }
  audioUpdate(hit);
  // wet fade
  wetFadeT -= dt;
  if (wetFadeT <= 0) { wetFadeT = 0.1; wctx.globalCompositeOperation = 'destination-out'; wctx.fillStyle = 'rgba(0,0,0,0.1)'; wctx.fillRect(0, 0, wet.width, wet.height); wctx.globalCompositeOperation = 'source-over'; }
  for (let i = 0; i < PM; i++) if (P.l[i] > 0) {
    P.l[i] -= dt; P.x[i] += P.vx[i] * dt; P.y[i] += P.vy[i] * dt;
    if (P.k[i] === 2) P.vy[i] += 120 * dt; else if (P.k[i] !== 3) P.vy[i] += 700 * dt;
  }
}

function render() {
  ctx.fillStyle = '#17191c'; ctx.fillRect(0, 0, W, H);
  const sw = SW * stS, sh = SH * stS;
  // frame
  ctx.fillStyle = '#0d0f11'; ctx.fillRect(stX - 4, stY - 4, sw + 8, sh + 8);
  ctx.drawImage(clean, stX, stY, sw, sh);
  if (state === 'reveal' && revealT < 0.7) ctx.globalAlpha = 1 - revealT / 0.7;
  ctx.drawImage(grime, stX, stY, sw, sh);
  ctx.drawImage(mud, stX, stY, sw, sh);
  ctx.globalAlpha = 1;
  ctx.drawImage(wet, stX, stY, sw, sh);
  // shine sweep
  if (state === 'reveal' || state === 'done') {
    const u = state === 'done' ? 2 : revealT;
    if (u > 0.3 && u < 1.8) {
      const p = (u - 0.3) / 1.5;
      tctx.globalCompositeOperation = 'source-over'; tctx.clearRect(0, 0, tmp.width, tmp.height);
      const gx = -200 + p * (tmp.width + 400);
      const g = tctx.createLinearGradient(gx - 90, 0, gx + 90, 60);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      tctx.fillStyle = g; tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.globalCompositeOperation = 'destination-in'; tctx.drawImage(mask, 0, 0, tmp.width, tmp.height);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6; ctx.drawImage(tmp, stX, stY, sw, sh); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }
  // particles
  const d = cur.dirt;
  for (let i = 0; i < PM; i++) {
    if (P.l[i] <= 0) continue;
    const a = P.l[i] / P.ml[i], s = P.s[i];
    if (P.k[i] === 3) { // sparkle
      ctx.fillStyle = `rgba(255,255,255,${a})`; const r = s * (1 - Math.abs(a - 0.5) * 2) + 1;
      ctx.beginPath(); ctx.moveTo(P.x[i], P.y[i] - r * 2); ctx.lineTo(P.x[i] + r * 0.4, P.y[i] - r * 0.4); ctx.lineTo(P.x[i] + r * 2, P.y[i]); ctx.lineTo(P.x[i] + r * 0.4, P.y[i] + r * 0.4);
      ctx.lineTo(P.x[i], P.y[i] + r * 2); ctx.lineTo(P.x[i] - r * 0.4, P.y[i] + r * 0.4); ctx.lineTo(P.x[i] - r * 2, P.y[i]); ctx.lineTo(P.x[i] - r * 0.4, P.y[i] - r * 0.4); ctx.closePath(); ctx.fill();
      continue;
    }
    ctx.fillStyle = P.k[i] === 0 ? `rgba(220,245,255,${a * 0.9})` : P.k[i] === 1 ? `rgba(${d[0] + 40},${d[1] + 30},${d[2] + 20},${a * 0.9})` : `rgba(${d[0]},${d[1]},${d[2]},${a * 0.7})`;
    ctx.fillRect(P.x[i] - s / 2, P.y[i] - s / 2, s, P.k[i] === 2 ? s * 2.2 : s);
  }
  // wand + stream
  if (state === 'play') drawWand();
}

function drawWand() {
  const ax = stX + tx * stS, ay = stY + ty * stS;
  const ox = W * 0.5 + (ax - W * 0.5) * 0.45, oy = toolsTop + 40;
  const ang = Math.atan2(ay - oy, ax - ox), L = Math.min(150, Math.hypot(ax - ox, ay - oy) * 0.4);
  const tipX = ox + Math.cos(ang) * L, tipY = oy + Math.sin(ang) * L;
  const n = NOZ[nozzle], rad = n.r * stS;
  if (sprayOn) {
    const nx = -Math.sin(ang), ny = Math.cos(ang);
    if (nozzle === 0) {
      const g = ctx.createLinearGradient(tipX, tipY, ax, ay); g.addColorStop(0, 'rgba(225,248,255,0.85)'); g.addColorStop(1, 'rgba(225,248,255,0.18)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(tipX + nx * 2, tipY + ny * 2); ctx.lineTo(ax + nx * rad * 0.9, ay + ny * rad * 0.9); ctx.lineTo(ax - nx * rad * 0.9, ay - ny * rad * 0.9); ctx.lineTo(tipX - nx * 2, tipY - ny * 2); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(235,250,255,0.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(ax, ay); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,220,255,0.45)'; ctx.lineWidth = 10; ctx.stroke();
    }
    // moving streaks
    if (!reduceMotion) {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([6, 18]); ctx.lineDashOffset = -clock * 600;
      ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(ax, ay); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(235,250,255,0.35)'; ctx.beginPath(); ctx.arc(ax, ay, rad * 0.8, 0, 6.283); ctx.fill();
  }
  // lance
  ctx.save(); ctx.translate(ox, oy); ctx.rotate(ang);
  ctx.fillStyle = '#2a2e33'; rr(ctx, -70, -16, 64, 32, 8); ctx.fill();
  ctx.fillStyle = '#ffcc1a'; rr(ctx, -64, -12, 46, 24, 6); ctx.fill();
  ctx.fillStyle = '#c3c8ce'; ctx.fillRect(-8, -4, L - 4, 8);
  ctx.fillStyle = nozzle ? '#e23b3b' : '#2fa84f'; rr(ctx, L - 16, -7, 18, 14, 3); ctx.fill();
  ctx.restore();
  // reticle
  if (aimOn) {
    ctx.strokeStyle = sprayOn ? 'rgba(255,204,26,0.9)' : 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, ay, Math.max(8, rad), 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax - 6, ay); ctx.lineTo(ax + 6, ay); ctx.moveTo(ax, ay - 6); ctx.lineTo(ax, ay + 6); ctx.stroke();
  }
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 1 / 60; last = t;
  update(dt); render();
}
setMuted(muted);
layout();
loadLevel(firstOpen()); state = 'menu';
renderMenu();
requestAnimationFrame(frame);
window.__pw = { dbg: () => ({ gt: cur ? cur.gtough : 1, tg: cur ? cur.tough : 1, alpha: cur ? cur.grime.alpha : 0.5, grid: Array.prototype.join.call(dirtGrid, ''), pct, target: cur ? cur.target : 1, limit: cur ? cur.limit : null, limitVal, elapsed, water, state }), info: i => { loadLevel(i); const r = { obj: cur.name, grimeAlpha: +cur.grime.alpha.toFixed(2), mudClusters: cur.mud.clusters, mudRate: +cur.tough.toFixed(2), grimeRate: +cur.gtough.toFixed(2), dirtCover: +(initDirty / (SAW * SAH)).toFixed(2), mudCover: +(mudCells / (SAW * SAH)).toFixed(2), par, limit: cur.limit, budget: limitVal, target: +(cur.target * 100).toFixed(1) }; state = 'menu'; return r; }, get pct() { return pct; }, get state() { return state; }, get lvl() { return lvl; }, get nozzle() { return nozzle; }, stage: () => ({ x: stX, y: stY, s: stS }) };
})();
</script>
