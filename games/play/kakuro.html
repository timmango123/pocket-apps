<html lang="zh-Hant">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>馬賽克數和</title>
<style>
:root{
  --wall:#f3eee6; --ink:#24324a; --ink2:#5e6b80; --card:#fffdf8; --card2:#f6efe4; --line:#e3d8c8;
  --blue:#1f4e79; --blue2:#2f6aa3; --gold:#d4a73a; --terra:#b5532f; --terra2:#cf6a43; --cream:#fbf6ee;
  --dim:.22; --shadow:0 4px 14px #5a462a22;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root.dark{
  --wall:#1b2140; --ink:#f1ebe0; --ink2:#a9b1c7; --card:#262d52; --card2:#2e3660; --line:#3b4473;
  --blue:#163a63; --blue2:#2a5d93; --gold:#e0b450; --terra:#ff9a4d; --terra2:#ffb27a; --cream:#3a3d45; --shadow:0 4px 14px #0006;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto auto;grid-template-columns:100%;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);gap:6px}
.hud{display:flex;align-items:center;gap:8px;min-width:0}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;position:relative}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--blue);color:#fff}
.hmid{flex:1;min-width:0;height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:4px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.hl1{display:flex;align-items:center;gap:8px;min-width:0}
.lvn{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{display:flex;gap:2px;align-items:center;font-size:11px;color:var(--ink2);white-space:nowrap}
.dbar i{width:6px;height:9px;border-radius:2px;background:var(--line);display:block}
.dbar i.f{background:var(--terra)} .dbar i.f.b{background:var(--blue2)}
.hl2{display:flex;gap:12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.hl2 b{color:var(--ink);font-variant-numeric:tabular-nums}
#stage{position:relative;min-height:0;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bZoom{position:absolute;right:4px;bottom:4px;opacity:.92}
#hintBox{position:absolute;left:8px;right:8px;bottom:6px;background:var(--card);border-radius:16px;box-shadow:0 8px 26px #0003;padding:10px 44px 10px 14px;font-size:14px;line-height:1.5;border-left:5px solid var(--gold);animation:pop .3s ease}
#hintBox b{color:var(--terra)}
#hintBox .x{position:absolute;right:2px;top:2px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink2)}
.combo{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:5px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.crow{display:flex;align-items:center;gap:6px;min-width:0;min-height:28px;opacity:.75}
.crow.act{opacity:1}
.crow .lb{flex:none;font-size:12px;font-weight:800;color:var(--ink2);min-width:74px;white-space:nowrap}
.crow.act .lb{color:var(--blue2)}
:root.dark .crow.act .lb{color:var(--gold)}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;min-width:0;touch-action:pan-x;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.u{background:var(--gold);color:#3a2a05}
.chip.x{opacity:.38;text-decoration:line-through}
.chip.m{font-weight:600;letter-spacing:0;color:var(--ink2)}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tb{height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);gap:1px;position:relative}
.tb svg{width:20px;height:20px}
.tb:active{transform:scale(.95)}
.tb.on{background:var(--blue);color:#fff}
.tb[disabled]{opacity:.4}
.tb .bd{position:absolute;top:3px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--terra);color:#fff;font-size:11px;line-height:17px;text-align:center;padding:0 4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.k{height:50px;border-radius:14px;font-size:26px;font-weight:800;color:var(--terra);font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 3px 0 var(--line),var(--shadow);transition:opacity .15s}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.k.dim{opacity:var(--dim)}
.pad.note .k{font-size:18px;color:var(--ink2);font-weight:700}
/* landscape */
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-columns:minmax(0,1fr) minmax(290px,42%);grid-template-rows:auto auto 1fr;column-gap:12px}
  .hud{grid-column:1/3}
  #stage{grid-column:1;grid-row:2/4}
  .combo{grid-column:2;grid-row:2}
  .ctrl{grid-column:2;grid-row:3;justify-content:flex-end}
  .k{height:44px;font-size:22px}
  .tb{height:44px}
}
@media (max-height:700px) and (orientation:portrait){ .k{height:44px;font-size:23px} .tb{height:44px} .hmid{height:46px} }
.hidden{display:none !important}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:color-mix(in srgb,var(--wall) 70%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:0 18px 50px #2a1d0a40;padding:22px 20px;width:min(380px,100%);text-align:center;animation:pop .32s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto;position:relative}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:24px 24px 0 0;
  background:repeating-linear-gradient(90deg,var(--blue) 0 14px,var(--gold) 14px 18px,var(--terra) 18px 32px,var(--gold) 32px 36px)}
.btn{display:block;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;color:#fff;
  background:linear-gradient(180deg,var(--terra2),var(--terra));box-shadow:0 4px 0 #7d3418,0 8px 18px #b5532f40}
:root.dark .btn{color:#2a1405;box-shadow:0 4px 0 #b4622a,0 8px 18px #0005}
:root.dark .btn.sec{color:var(--ink);box-shadow:0 4px 0 #161b36}
:root.dark .btn.blue{color:#fff;box-shadow:0 4px 0 #0b2038}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d3418}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.blue{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 4px 0 #10304f}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{max-height:none} }
/* title */
#title{background:var(--wall);backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;padding-top:calc(var(--sat) + 4vh)}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:relative;text-align:center;padding:16px 26px;border-radius:22px;background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:var(--shadow)}
.ttl h1{margin:0;font-size:40px;letter-spacing:6px;color:var(--blue2)}
:root.dark .ttl h1{color:var(--gold)}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:4px;font-size:15px}
.tbtns{position:relative;width:min(340px,100%);display:flex;flex-direction:column}
.tsmall{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tsmall button{height:58px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
@media (orientation:landscape) and (max-height:560px){ #title{flex-direction:row;align-items:center;justify-content:space-around;padding-top:16px} .ttl h1{font-size:34px} }
/* select */
#select{align-items:stretch;padding:0;background:var(--wall)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 8px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--terra)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{height:76px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:44px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{display:flex;gap:1px}
.lt .db i{width:4px;height:6px;border-radius:1px;background:var(--line)}
.lt .db i.f{background:var(--terra)}
.lt .sz{font-size:11px;color:var(--ink2);line-height:1}
.lt.done{background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.lt.cur{outline:3px solid var(--terra)}
.lt.lock{opacity:.5}
.lt .m{position:absolute;top:3px;right:4px;width:8px;height:8px;background:var(--blue2);transform:rotate(45deg)}
.lt:active{transform:scale(.95)}
.sect{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--ink2);padding:8px 2px 0;letter-spacing:1px}
/* win sheet */
#win{align-items:flex-end;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
#win .card{pointer-events:auto;animation:up .45s cubic-bezier(.2,.9,.3,1.1);padding:18px 18px 16px}
.stars{font-size:40px;letter-spacing:6px;margin:0;color:var(--line);line-height:1.1}
.stars .on{color:var(--gold);display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both;text-shadow:0 2px 0 #a07b1c}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.res{display:flex;justify-content:center;gap:20px;margin:4px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:21px;color:var(--ink)}
.badge{display:inline-block;margin:4px 3px 0;padding:3px 10px;border-radius:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);z-index:40;background:#24324aee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .35s}
.scroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;text-align:left;touch-action:pan-y}
.scroll h3{font-size:15px;margin:12px 0 4px}
.scroll p,.scroll li{font-size:14px;color:var(--ink2);line-height:1.6;margin:4px 0}
.scroll ul{padding-left:18px;margin:4px 0}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
.set .t{font-size:15px;font-weight:700}.set .d{font-size:12px;color:var(--ink2)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ntabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.ntabs button{min-width:44px;min-height:40px;border-radius:10px;background:var(--card2);font-weight:800}
.ntabs button.on{background:var(--blue);color:#fff}
.ctab{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:14px}
.ctab .s{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.ctab .cs{display:flex;flex-wrap:wrap;gap:4px}
.mini{display:inline-grid;gap:2px;margin:8px auto;background:var(--line);padding:2px;border-radius:6px}
.mini div{width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:17px;border-radius:3px;position:relative;background:var(--cream);color:var(--terra)}
.mini div.c{background:var(--blue);color:#fff;font-size:11px}
.mini div.c.d{background:linear-gradient(45deg,transparent 48%,var(--gold) 49% 51%,transparent 52%),var(--blue)}
.mini div.c span{position:absolute}
.mini div.c .r{top:2px;right:4px}.mini div.c .b{bottom:2px;left:4px}
.mini div.hl{background:color-mix(in srgb,var(--gold) 35%,var(--cream))}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.statg div{background:var(--card2);border-radius:14px;padding:8px}
.statg b{display:block;font-size:20px}
.statg span{font-size:12px;color:var(--ink2)}
#shareTxt{width:100%;min-height:90px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:8px;-webkit-user-select:text;user-select:text}
@media (hover:hover){ .k:hover,.tb:hover,.ib:hover{filter:brightness(1.04)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<div id="app">
  <header class="hud">
    <button class="ib" id="bPause" aria-label="選單"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <div class="hmid">
      <div class="hl1"><span class="lvn" id="hLv">第 1 關</span><span class="dbar" id="hDiff"></span></div>
      <div class="hl2"><span>時間 <b id="hTime">0:00</b></span><span>錯誤 <b id="hErr">0</b></span><span>提示 <b id="hHint">3</b></span></div>
    </div>
    <button class="ib" id="bCombo" aria-label="組合面板" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h4M7 17h7"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <button class="ib hidden" id="bZoom" aria-label="放大"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5" id="zIc"/></svg></button>
    <div id="hintBox" class="hidden"><div id="hintTxt"></div><button class="x" id="hintX" aria-label="關閉"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <section class="combo" id="combo">
    <div class="crow" id="cr0"><span class="lb" id="cl0">橫段</span><div class="chips" id="cc0"></div></div>
    <div class="crow" id="cr1"><span class="lb" id="cl1">直段</span><div class="chips" id="cc1"></div></div>
  </section>
  <section class="ctrl">
    <div class="tools">
      <button class="tb" id="tUndo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>復原</button>
      <button class="tb" id="tRedo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>重做</button>
      <button class="tb" id="tErase"><svg class="i" viewBox="0 0 24 24"><path d="M20 20H9L4 15l9-9 7 7-6 6"/><path d="M8 11l6 6"/></svg>擦除</button>
      <button class="tb" id="tNote" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>筆記</button>
      <button class="tb" id="tHint"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg>提示<span class="bd" id="hintBd">3</span></button>
    </div>
    <div class="pad" id="pad"></div>
  </section>
</div>

<div class="ov" id="title">
  <canvas id="tcv"></canvas>
  <div class="ttl"><h1>馬賽克數和</h1><div class="sub">填數字湊出每段總和，拼出地中海馬賽克</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn blue" id="tSelect">選擇關卡</button>

// ---------- title animation ----------
var tRaf = 0, tcv = $('tcv'), tctx = tcv.getContext('2d');
function showTitle() { hideAll(); show('title'); $('tPlay').textContent = nextLevel() > 1 || isDone(1) ? '繼續第 ' + nextLevel() + ' 關' : '開始遊戲'; G = null; dirty = true; kick(); if (!tRaf) tRaf = requestAnimationFrame(titleFrame); }
function stopTitle() { if (tRaf) cancelAnimationFrame(tRaf); tRaf = 0; }
function titleFrame(now) {
  tRaf = 0; if (document.hidden || $('title').classList.contains('hidden')) return;
  var w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  if (tcv.width !== Math.round(w * d)) { tcv.width = Math.round(w * d); tcv.height = Math.round(h * d); }
  var g = tctx; g.setTransform(d, 0, 0, d, 0, 0);
  g.fillStyle = TH.wall; g.fillRect(0, 0, w, h);
  var s = Math.max(34, Math.min(w, h) / 9), cols = Math.ceil(w / s) + 1, rows = Math.ceil(h / s) + 1, pic = Math.floor(now / 5000) % PICS.length, ph = (now % 5000) / 5000;
  for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) {
    for (var t = 0; t < 4; t++) {
      var cx = i * s + s / 2, cy = j * s + s / 2, u = (i + 0.5 + [0, 0.3, 0, -0.3][t]) / cols, v = (j + 0.5 + [-0.3, 0, 0.3, 0][t]) / rows;
      var col = picColor(pic, u, v), wave = Math.sin(now / 900 + i * 0.5 + j * 0.35) * 10, a = Math.min(1, Math.min(ph, 1 - ph) * 12);
      g.globalAlpha = 0.28 + 0.5 * a;
      g.fillStyle = 'rgb(' + clamp(col[0] + wave) + ',' + clamp(col[1] + wave) + ',' + clamp(col[2] + wave) + ')';
      var p0 = [[i * s + 2, j * s + 2], [i * s + s - 2, j * s + 2], [i * s + s - 2, j * s + s - 2], [i * s + 2, j * s + s - 2]], A = p0[t], B = p0[(t + 1) % 4];
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.closePath(); g.fill();
    }
  }
  g.globalAlpha = 1;
  tRaf = requestAnimationFrame(titleFrame);
}

// ---------- input ----------
var ptrs = new Map(), gest = null;
function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', function (e) {
  audio(); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  var p = pos(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) gest = { type: 'tap', sx: p.x, sy: p.y, cx: cam.x, cy: cam.y };
  else if (ptrs.size === 2) { var a = Array.from(ptrs.values()); gest = { type: 'pinch', d0: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, z0: cam.z, mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2, cx: cam.x, cy: cam.y }; camT = null; }
});
cv.addEventListener('pointermove', function (e) {
  if (!ptrs.has(e.pointerId) || !gest) return;
  var p = pos(e); ptrs.set(e.pointerId, p);
  if (gest.type === 'tap' && Math.hypot(p.x - gest.sx, p.y - gest.sy) > 8) gest.type = cam.z > 1.01 ? 'pan' : 'none';
  if (gest.type === 'pan') { cam.x = gest.cx + p.x - gest.sx; cam.y = gest.cy + p.y - gest.sy; clampCam(); dirty = true; kick(); }
  else if (gest.type === 'pinch' && ptrs.size >= 2) {
    var a = Array.from(ptrs.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
    var z = Math.max(1, Math.min(2.6, gest.z0 * d / gest.d0));
    var wx = (gest.mx - bx - gest.cx) / gest.z0, wy = (gest.my - by - gest.cy) / gest.z0;
    cam.z = z; cam.x = mx - bx - wx * z; cam.y = my - by - wy * z; clampCam(); dirty = true; kick();
  }
});
function ptrEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gest && gest.type === 'tap' && e.type === 'pointerup' && G && G.status === 'play') {
    var p = pos(e), wx = (p.x - bx - cam.x) / cam.z, wy = (p.y - by - cam.y) / cam.z, c = Math.floor(wx / cs), r = Math.floor(wy / cs);
    if (r >= 0 && c >= 0 && r < G.P.R && c < G.P.C) { var idx = r * G.P.C + c; if (G.P.sol[idx] > 0) select(idx); }
  }
  if (ptrs.size === 0) gest = null; else if (gest) gest.type = 'none';
}
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('wheel', function (e) { if (!G) return; e.preventDefault(); var p = pos(e); zoomAt(cam.z * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y); }, { passive: false });
$('pad').addEventListener('click', function (e) { var b = e.target.closest('.k'); if (b) { audio(); inputDigit(+b.dataset.d); } });
$('tUndo').onclick = function () { audio(); undo(); };
$('tRedo').onclick = function () { audio(); redo(); };
$('tErase').onclick = function () { audio(); erase(); };
$('tNote').onclick = function () { audio(); if (!G) return; G.noteMode = !G.noteMode; SFX.click(); updHud(); };
$('tHint').onclick = function () { audio(); hint(); };
$('hintX').onclick = function () { hideHint(); };
$('bZoom').onclick = toggleZoom;
$('bCombo').onclick = function () { audio(); SFX.click(); settings.panel = !settings.panel; saveSettings(); updCombo(); requestAnimationFrame(layout); };
$('bPause').onclick = function () { audio(); SFX.click(); if (!G) return; $('pInfo').textContent = G.label + '・難度 ' + (G.n ? diffOf(G.n) : G.dDiff) + '/10・' + fmt(G.time / 1000); $('pAuto').disabled = G.status !== 'play'; show('pause'); };
$('pResume').onclick = function () { SFX.click(); hide('pause'); };
$('pRestart').onclick = function () { SFX.click(); hide('pause'); if (G.n) startLevel(G.n, true); else { sdel(curKey()); var k = G; G = newGame(k.P, k.id, 0, k.label); G.daily = k.daily; G.dDiff = k.dDiff; enterGame(); } };
$('pAuto').onclick = function () { hide('pause'); autoNotes(); };
$('pSelect').onclick = function () { SFX.click(); saveCur(); showSelect(); };
$('pSet').onclick = function () { SFX.click(); hide('pause'); showSettings(); };
$('pHelp').onclick = function () { SFX.click(); hide('pause'); showHelp(); };
$('pHome').onclick = function () { SFX.click(); saveCur(); showTitle(); };
$('iOk').onclick = function () { SFX.click(); hide('info'); if (!G) show('title'); };
$('setOk').onclick = function () { SFX.click(); hide('settings'); if (!G) show('title'); };
$('shareOk').onclick = function () { hide('share'); };
document.querySelectorAll('#settings .sw').forEach(function (b) { b.onclick = function () { audio(); settings[b.dataset.k] = !settings[b.dataset.k]; saveSettings(); b.setAttribute('aria-checked', settings[b.dataset.k] ? 'true' : 'false'); SFX.click(); if (G) { recompute(true); updPad(); } dirty = true; kick(); }; });
$('themeSeg').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; settings.theme = b.dataset.v; saveSettings(); applyTheme(); showSettings(); SFX.click(); };
$('wNext').onclick = function () { SFX.click(); if (G && G.n < NL) startLevel(G.n + 1); };
$('wRetry').onclick = function () { SFX.click(); if (G.n) startLevel(G.n, true); else $('pRestart').onclick(); };
$('wSelect').onclick = function () { SFX.click(); showSelect(); };
$('wShare').onclick = function () { SFX.click(); shareResult(); };
$('tPlay').onclick = function () { audio(); SFX.click(); stopTitle(); startLevel(nextLevel()); };
$('tSelect').onclick = function () { audio(); SFX.click(); showSelect(); };
$('tDaily').onclick = function () { audio(); SFX.click(); startDaily(); };
$('tSheet').onclick = function () { audio(); SFX.click(); showSheet(); };
$('tStats').onclick = function () { audio(); SFX.click(); showStats(); };
$('tSet').onclick = function () { audio(); SFX.click(); showSettings(); };
$('sBack').onclick = function () { SFX.click(); showTitle(); };
$('unlockSw').onclick = function () { audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); };
$('grid').onclick = function (e) {
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.dataset.n;
  if (!unlocked(n)) { SFX.err(); b.animate && b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); toast('先完成第 ' + (n - 1) + ' 關，或開啟「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
};
document.addEventListener('keydown', function (e) {
  if (!G || overlayOpen()) { if (e.key === 'Escape' && !$('info').classList.contains('hidden')) $('iOk').onclick(); return; }
  var k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (/^[1-9]$/.test(k)) { audio(); inputDigit(+k); return; }
  if (k === 'ArrowUp') { e.preventDefault(); moveSel(-1, 0); } else if (k === 'ArrowDown') { e.preventDefault(); moveSel(1, 0); }
  else if (k === 'ArrowLeft') { e.preventDefault(); moveSel(0, -1); } else if (k === 'ArrowRight') { e.preventDefault(); moveSel(0, 1); }
  else if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); erase(); }
  else if (k === 'n' || k === 'N') { G.noteMode = !G.noteMode; updHud(); }
  else if (k === 'Escape') $('bPause').onclick();
});
window.addEventListener('resize', function () { requestAnimationFrame(layout); });
if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);

// test / automation hook
window.__game = {
  state: function () { return G ? { id: G.id, level: G.n, status: G.status, errors: G.errors, hints: G.hints, filled: G.P.white.filter(function (c) { return G.vals[c]; }).length, whites: G.P.white.length, zoom: cam.z, cs: cs } : null; },
  cellCenter: function (c) { var p = cellScreen(c), r = stage.getBoundingClientRect(); return { x: p.x + r.left, y: p.y + r.top, s: p.s }; },
  code: function () { return G ? (G.n ? LEVELS[G.n - 1] : null) : null; },
  sel: function () { return G ? G.sel : -1; }
};

applyTheme(); buildPad(); layout(); showTitle();
})();
</script>
</body>
