<title>飛刀神射</title>
<style>
:root{
  --red:#c8202f; --red-d:#8e1220; --cream:#fff3d6; --cream-d:#f0d9a8; --gold:#f6c445; --gold-d:#c98a12;
  --ink:#3a1408; --wood:#8a5428; --steel:#cfd8e3;
  --font: "PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","WenQuanYi Zen Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a0a0e;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px);
  display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.hbtn{width:46px;height:46px;border-radius:14px;border:3px solid #5a1a10;background:var(--cream);color:var(--red-d);
  box-shadow:0 4px 0 #5a1a10;display:grid;place-items:center;padding:0;flex:0 0 auto}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a1a10}
.hbtn svg{width:22px;height:22px;display:block}
.hmid{flex:1;min-width:0;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(30,6,8,.55);border:2px solid rgba(246,196,69,.45);border-radius:14px;padding:4px 8px;color:var(--cream)}
#hLevel{font-weight:900;font-size:16px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.diff{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;font-weight:700;color:#f3d9a6}
.diff .bar{width:clamp(36px,20vw,84px);height:7px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;display:block}
.diff .bar i{display:block;height:100%;background:linear-gradient(90deg,#7bd36a,#f6c445 50%,#e5482f);border-radius:5px}
.apple-count{display:flex;align-items:center;gap:4px;background:rgba(30,6,8,.55);border:2px solid rgba(246,196,69,.45);
  border-radius:14px;height:46px;padding:0 10px;color:var(--cream);font-weight:900;font-size:17px}
.appleIco{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#d8262c 55%,#8f1016);position:relative;display:inline-block}
.appleIco::after{content:"";position:absolute;width:8px;height:5px;background:#5cb547;border-radius:8px 0;top:-4px;left:9px;transform:rotate(-20deg)}
/* screens */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
#title{justify-content:flex-end;gap:12px;background:linear-gradient(180deg,rgba(20,4,6,0) 35%,rgba(20,4,6,.75) 70%)}
.logo{position:absolute;top:calc(var(--st) + 5vh);left:0;right:0;text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:clamp(46px,15vw,80px);font-weight:900;letter-spacing:4px;line-height:1.05;
  color:#ffd75a;text-shadow:0 0 2px #5a1a10, 2px 2px 0 #5a1a10, -2px 2px 0 #5a1a10, 2px -2px 0 #5a1a10, -2px -2px 0 #5a1a10, 0 3px 0 #5a1a10, 3px 0 0 #5a1a10, -3px 0 0 #5a1a10, 0 -3px 0 #5a1a10,0 7px 0 #5a1a10,0 12px 20px rgba(0,0,0,.6)}
.logo .sub{display:inline-block;margin-top:10px;font-size:13px;letter-spacing:6px;font-weight:800;color:var(--cream);
  background:var(--red);border:2px solid #5a1a10;border-radius:20px;padding:4px 14px 4px 18px;box-shadow:0 3px 0 #5a1a10}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
.btn{min-height:54px;border-radius:18px;border:3px solid #5a1a10;font-size:20px;font-weight:900;letter-spacing:2px;
  background:var(--cream);color:var(--red-d);box-shadow:0 5px 0 #5a1a10;padding:8px 16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a1a10}
.btn.primary{background:linear-gradient(180deg,#e8394a,#b5172a);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd970,#e9a925);color:#5a1a10}
.btn[disabled]{opacity:.45;pointer-events:none}
.stat{color:var(--cream);font-weight:700;font-size:14px;text-align:center;opacity:.9;min-height:20px}
.tinyrow{display:flex;gap:10px;justify-content:center}
/* level select */
#select{background:radial-gradient(ellipse at 50% 0%,#5b1418,#2a0a0e 70%);padding-bottom:0}
.selhead{display:flex;align-items:center;gap:10px;width:min(560px,100%);margin-bottom:10px}
.selhead h2{flex:1;margin:0;color:#ffd75a;font-size:26px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 0 #5a1a10,2px 0 0 #5a1a10,-2px 0 0 #5a1a10,0 -2px 0 #5a1a10,0 4px 0 #5a1a10}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(560px,100%);margin-bottom:10px;color:var(--cream);font-weight:700;font-size:14px}
.switch{display:flex;align-items:center;gap:8px;min-height:44px;background:rgba(0,0,0,.25);border:2px solid rgba(246,196,69,.4);
  border-radius:24px;color:var(--cream);font-weight:800;font-size:14px;padding:4px 12px 4px 6px}
.switch .knob{width:42px;height:26px;border-radius:13px;background:#6b4a40;position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] .knob{background:#4caf50}

#grid{flex:1;width:min(560px,100%);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;

.tile{position:relative;aspect-ratio:1/1.12;min-height:58px;border-radius:14px;border:3px solid #5a1a10;background:var(--cream);
  box-shadow:0 4px 0 #5a1a10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 3px;color:var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #5a1a10}
.tile .n{font-size:20px;font-weight:900;line-height:1}
.tile .st{font-size:11px;letter-spacing:-1px;color:#d9c39a;line-height:1}
.tile .st b{color:#e9a925;font-weight:400}
.tile .db{width:80%;height:5px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden}
.tile .db i{display:block;height:100%;background:linear-gradient(90deg,#7bd36a,#f6c445 50%,#e5482f)}
.tile .dl{font-size:9px;font-weight:700;color:#8a6a50;line-height:1}
.tile.boss{background:linear-gradient(180deg,#ffe08a,#f2b532)}
.tile.boss::before{content:"首領";position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:900;color:#fff;background:var(--red);
  border:2px solid #5a1a10;border-radius:8px;padding:0 4px;line-height:15px}
.tile.done{background:#fff9ea}
.tile.boss.done{background:linear-gradient(180deg,#fff0b8,#f5c95a)}
.tile.locked{background:#6b4a40;color:#c9a993;border-color:#3b1d14;box-shadow:0 4px 0 #3b1d14}
.tile.locked .n{opacity:.5}
.tile .lock{width:16px;height:16px;opacity:.8}
.tile.cur{outline:3px solid #fff;outline-offset:2px}
/* overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(20,4,6,.62);padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
.panel{width:min(360px,100%);background:var(--cream);border:4px solid #5a1a10;border-radius:24px;box-shadow:0 8px 0 #5a1a10,0 20px 50px rgba(0,0,0,.5);
  padding:20px 18px 18px;text-align:center;position:relative;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:4px 0 6px;font-size:32px;font-weight:900;color:var(--red);letter-spacing:3px;text-shadow:0 2px 0 rgba(90,26,16,.25)}
.panel p{margin:6px 0;font-size:15px;line-height:1.55;color:#5a2a14;font-weight:600}
.panel .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.panel .row{display:flex;gap:10px}
.panel .row .btn{flex:1;font-size:17px}
.ribbon{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:900;font-size:14px;
  letter-spacing:2px;padding:5px 16px;border:3px solid #5a1a10;border-radius:12px;white-space:nowrap}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px;font-size:44px;line-height:1}
.stars span{color:#d9c39a;-webkit-text-stroke:2px #5a1a10;transform:scale(.4);opacity:0;animation:starIn .45s cubic-bezier(.2,1.8,.4,1) forwards}
.stars span.on{color:var(--gold)}
.stars span:nth-child(2){animation-delay:.15s;font-size:54px}
.stars span:nth-child(3){animation-delay:.3s}
@keyframes starIn{to{transform:scale(1);opacity:1}}
.help ol{text-align:left;margin:8px 0 0;padding-left:22px;color:#5a2a14;font-size:15px;line-height:1.6;font-weight:600}
.help li{margin-bottom:4px}
.kbd{display:inline-block;border:2px solid #5a1a10;border-radius:6px;padding:0 5px;font-size:12px;background:#fff;line-height:18px}
</style>

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<div id="app">
  <canvas id="cv" aria-label="飛刀神射遊戲畫面"></canvas>

  <div id="hud" class="hidden">

    <div class="hmid"><div id="hLevel">第 1 關</div><div class="diff"><span>難度</span><span class="bar"><i id="hDiffBar"></i></span><b id="hDiff">1</b></div></div>

      <button class="btn primary" id="btnPlay">開始遊戲</button>

      </div>
    </div>
  </div>

  <div id="select" class="screen hidden">
    <div class="selhead">
      <button class="hbtn" id="btnSelBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>選擇關卡</h2>

  <div id="pause" class="overlay hidden">

        <button class="btn" id="btnMute3" aria-label="音效開關"></button>

  <div id="help" class="overlay hidden">
    <div class="panel help">
      <div class="ribbon">玩法說明</div>
      <h2>怎麼玩</h2>

        <li>點擊畫面任何地方（或按 <span class="kbd">空白鍵</span>）把飛刀往上射。</li>
        <li>飛刀會插進旋轉的木靶，並跟著一起轉。</li>

      <div class="btns"><button class="btn primary" id="btnHelpOk">知道了</button></div>

  </div>
</div>
<script>
/*CORE-START*/
var KT = (function () {
  'use strict';
  var TAU = Math.PI * 2;
  var COLLIDE = 0.13;      // rad: min separation between two knives
  var APPLE_HIT = 0.17;    // rad: knife within this of an apple slices it
  var FLIGHT = 0.10;       // s: knife flight time
  var LAUNCH = Math.PI / 2; // world angle where knives land (bottom of target)
  var STEP = 1 / 240;      // fixed simulation step
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function norm(a) { a %= TAU; return a < 0 ? a + TAU : a; }
  function angDiff(a, b) { var d = norm(a - b); return d > Math.PI ? d - TAU : d; }
  var BOSSES = [
    { id: 'cheese', name: '起司巨輪' }, { id: 'shield', name: '鋼鐵圓盾' },
    { id: 'helm', name: '海盜舵輪' }, { id: 'pumpkin', name: '南瓜大王' },
    { id: 'clock', name: '瘋狂時鐘' }, { id: 'pizza', name: '披薩轉盤' },
    { id: 'gear', name: '蒸汽齒輪' }, { id: 'drum', name: '馬戲大鼓' },
    { id: 'sun', name: '烈日圖騰' }, { id: 'ring', name: '黃金標靶' }
  ];
  var TYPES = ['const', 'speed', 'reverse', 'stopgo', 'erratic'];
  var TYPE_NAMES = { const: '等速旋轉', speed: '忽快忽慢', reverse: '來回反轉', stopgo: '走走停停', erratic: '狂亂失控' };
  function typeIndexFor(L) {
    if (L <= 8) return 0;
    if (L <= 20) return 1;
    if (L <= 35) return 2;
    if (L <= 50) return 3;
    return 4;
  }
  function levelConfig(L) {
    var rng = mulberry32((L * 2654435761) ^ 0x5bd1e995);
    var boss = L % 5 === 0;
    var ti = typeIndexFor(L);
    if (boss) ti = Math.min(4, ti + 1);
    var type = TYPES[ti];
    // compounding key parameters
    var w0 = 1.25 * Math.pow(1.0135, L - 1);           // base angular speed rad/s
    var knives = 5 + Math.floor((L - 1) / 12) + (boss ? 1 : 0);
    var preN = Math.min(5, Math.floor((L + 5) / 13)); // regular levels: cap pre-placed knives (no wall before L99)
    var pre = [];
    var bossInfo = null;
    if (boss) {
      bossInfo = BOSSES[((L / 5) - 1) % BOSSES.length];
      var k = Math.max(2, Math.min(5, 2 + Math.floor(L / 20))); // at most 5 pre-placed knives on bosses too (L80+ had 6)
      if (L >= 50) k = Math.min(7, k + 0);
      var off = rng() * TAU;
      for (var i = 0; i < k; i++) pre.push(norm(off + i * TAU / k));
    } else {
      var guard = 0;
      while (pre.length < preN && guard++ < 500) {
        var a = rng() * TAU, ok = true;
        for (var j = 0; j < pre.length; j++) if (Math.abs(angDiff(a, pre[j])) < 0.5) ok = false;
        if (ok) pre.push(a);
      }
    }
    var appleN = 1 + Math.floor(rng() * 2) + (boss ? 1 : 0) + (L > 40 ? 1 : 0);
    var apples = [], g2 = 0;
    while (apples.length < appleN && g2++ < 500) {
      var b = rng() * TAU, ok2 = true;
      for (var m = 0; m < pre.length; m++) if (Math.abs(angDiff(b, pre[m])) < 0.32) ok2 = false;
      for (var n = 0; n < apples.length; n++) if (Math.abs(angDiff(b, apples[n])) < 0.5) ok2 = false;
      if (ok2) apples.push(b);
    }
    var dir = rng() < 0.5 ? 1 : -1;
    var motion = {
      type: type, w0: w0, dir: dir, L: L,
      seed: (L * 7919 + 1013) >>> 0,
      theta0: rng() * TAU
    };
    var hue = rng();
    return {
      L: L, boss: boss, bossInfo: bossInfo, knives: knives, pre: pre, apples: apples,
      motion: motion, type: type, typeName: TYPE_NAMES[type], hue: hue
    };
  }
  function ease(kind, x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    switch (kind) {
      case 0: return 0.5 - 0.5 * Math.cos(Math.PI * x);              // sine in-out
      case 1: return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; // cubic in-out
      case 2: return 1 - (1 - x) * (1 - x);                             // quad out
      default: return x;
    }
  }
  function Motion(m) {

      throwT: G.lastThrowT, applesHit: r ? r.applesHit : 0,
      resultShown: !$('result').classList.contains('hidden'),
      tap: { x: W / 2, y: Math.min(H - 40, restTipY + KL * 0.4) }
    };
  },
  throwKnife: requestThrow,
  title: goTitle, select: goSelect,
  setUnlockAll: function (v) { unlockAll = !!v; sset('unlockAll', unlockAll); if (G.screen === 'select') buildGrid(); }
};

resize(); refreshMute(); goTitle(); startLoop();
})();

</script>
</body>
</html>
