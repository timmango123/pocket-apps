<title>糖果連連看</title>
<style>
:root{--ink:#5a2a3c;--ink2:#94606f;--card:#fffaf3f0;--line:#f3cdd4;--acc:#ff6f9c;--acc2:#ff9f6b;--gold:#ffbf3c;--sw:#e8cfd5;--swon:#ff7aa5;--ov:#fde2e4b0;--tile:#fffaf0;

@media (prefers-color-scheme:dark){:root{--ink:#ffe6f4;--ink2:#c9a0c0;--card:#2b1438f0;--line:#5a2f63;--acc:#ff4fb0;--acc2:#b56cff;--gold:#ffd25a;--sw:#4a2a55;--swon:#ff4fb0;--ov:#1a0a22b8;--tile:#2d1840}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fde2e4;color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme:dark){html,body{background:#240f2e}}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none!important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #c0607a22;display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active,.item:active,.btn:active,.lt:active{transform:scale(.95)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 10px #c0607a22;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:6px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:4px;height:9px;border-radius:2px;background:var(--line)}
.score{font-size:11px;color:var(--ink2);text-align:right;white-space:nowrap;line-height:1.1}.score b{display:block;font-size:17px;color:var(--ink)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bottom>*{pointer-events:auto}
.item{position:relative;height:50px;min-width:88px;padding:0 14px;border-radius:25px;background:var(--card);box-shadow:0 4px 12px #c0607a26;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.item svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.item .ct{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.item[disabled]{opacity:.4}.item.on{background:var(--acc);color:#fff}.item.on svg{stroke:#fff}
@media (orientation:landscape) and (max-height:600px){.bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:0 calc(var(--sar) + 10px) 0 0;width:auto}.item{min-width:70px;padding:0 10px;height:46px;font-size:13px}.item span.lb{display:none}}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ov);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease;overflow-y:auto}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px #a0405a33;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:4px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:18px;margin-top:11px;font-weight:800;font-size:17px;background:linear-gradient(180deg,#ff8fb5,#ff6f9c);color:#fff;box-shadow:0 5px 0 #d94f7c,0 8px 18px #d94f7c44}
.btn.sec{background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.warm{background:linear-gradient(180deg,#ffbe7a,#ff9a5a);box-shadow:0 5px 0 #d9733a,0 8px 18px #d9733a44}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--line)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #e0a420;display:inline-block;animation:sp .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes sp{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:18px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}.res b{display:block;font-size:22px;color:var(--ink)}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between}
.ttl{margin-top:6vh;text-align:center}
.ttl h1{font-size:50px;margin:0;letter-spacing:5px;color:#e0507e;text-shadow:0 4px 0 #fff,0 10px 24px #e0507e55}
@media (prefers-color-scheme:dark){.ttl h1{color:#ff7ccf;text-shadow:0 0 12px #ff4fb0,0 0 30px #b56cff}}
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:8px;font-size:15px}
.tb{width:min(320px,100%);padding-bottom:4px}
.tb .row2 .btn{font-size:15px}
.sws{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 6px}
.sw .trk{width:44px;height:26px;border-radius:13px;background:var(--sw);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--swon)}.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
#select{align-items:stretch;padding:0}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}

.lt{aspect-ratio:1/1.1;border-radius:16px;background:var(--tile);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}.lt .st .on{color:var(--gold)}
.lt .db{width:66%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.lt .db i{display:block;height:100%}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--acc)}
.lt.lock{opacity:.5}.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 86px);transform:translateX(-50%);z-index:8;background:#5a2a3cee;color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.helpscroll{max-height:58vh;overflow-y:auto;text-align:left;font-size:14px;line-height:1.65;color:var(--ink2);touch-action:pan-y;margin:0 -4px;padding:0 4px}
.helpscroll b{color:var(--ink)}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--tile);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:64px;height:64px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.55}
.al{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.al i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none;font-weight:800;color:#fff}
.al.ok i{background:var(--gold)}.al b{color:var(--ink);display:block;font-size:14px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stg div{background:var(--tile);border-radius:12px;padding:8px;font-size:12px;color:var(--ink2)}.stg b{display:block;font-size:18px;color:var(--ink)}

/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<div class="ov" id="title">

  <div class="selhead"><button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>選擇關卡</h2>

<script>
/*CORE-START*/
// Board: padded grid W2=(C+2) x H2=(R+2); outer ring always empty (walkable). cell code: 0 empty, else (type+1) | 32 frozen | (group+1)<<6 chain
function mkRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tOf(c) { return (c & 31) - 1; }
function grpOf(c) { return (c >> 6) - 1; }
var SIZES = [[10, 6, 8], [25, 7, 10], [50, 8, 12], [75, 9, 14], [100, 10, 16]];
var ROT_EVERY = 12;
var GNAMES = ['', '下', '上', '左', '右', '向中心', '向外'];
function levelParams(L) {
  var s = SIZES[0]; for (var i = 0; i < SIZES.length; i++) if (L <= SIZES[i][0]) { s = SIZES[i]; break; }
  var C = s[1], R = s[2], pairs = C * R / 2, K = Math.min(8 + Math.floor(L / 5), 24);
  var ppt = 3.6 * Math.pow(0.985, L);
  var r = mkRng(L * 9973 + 5)();
  var grav = L < 30 ? 0 : L < 45 ? 1 : L >= 80 ? 1 + Math.floor(r * 4) : 1 + Math.floor(r * 6);
  return {
    L: L, C: C, R: R, W2: C + 2, H2: R + 2, pairs: pairs, K: K, ppt: ppt, time: Math.round(pairs * ppt),
    ice: L >= 15 ? Math.min(Math.round(C * R * 0.2), 3 + Math.floor((L - 15) * 0.45)) : 0,
    chains: L >= 60 ? Math.min(5, 1 + Math.floor((L - 60) / 8)) : 0,
    grav: grav, rot: L >= 80, bombs: L >= 40 ? (L >= 80 ? 2 : 1) : 0, hints: 2, shuffles: L >= 50 ? 2 : 1,
    D: pairs * (K / 24) / ppt
  };
}
var D1 = levelParams(1).D, D100 = levelParams(100).D;
function diffOf(L) { return 1 + 9 * Math.log(levelParams(L).D / D1) / Math.log(D100 / D1); }
// gravity cycle used by board rotation: down -> left -> up -> right
function rotGrav(g) { return g === 1 ? 3 : g === 3 ? 2 : g === 2 ? 4 : g === 4 ? 1 : g; }

var _vis = new Int32Array(400), _hit = new Int32Array(400), _par = new Int16Array(400), _hf = new Int16Array(400), _stamp = 0;
var DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
// scan up to 2 turns from cell a; cb(hitCell) for every occupied cell reachable
function scan(g, W2, H2, a, cb) {
  _stamp++; var st = _stamp, layer = [a], t, i, d, o, x, y, c, next;
  _vis[a] = st;
  for (t = 0; t < 3; t++) {
    next = [];
    for (i = 0; i < layer.length; i++) {
      o = layer[i];
      for (d = 0; d < 4; d++) {
        x = o % W2 + DX[d]; y = (o / W2 | 0) + DY[d];
        while (x >= 0 && y >= 0 && x < W2 && y < H2) {
          c = y * W2 + x;
          if (g[c] !== 0) { if (c !== a && _hit[c] !== st) { _hit[c] = st; _hf[c] = o; cb(c); } break; }
          if (_vis[c] !== st) { _vis[c] = st; _par[c] = o; next.push(c); }
          x += DX[d]; y += DY[d];
        }
      }
    }
    layer = next;
  }
}
// path corners from a to b (cells), or null
function findPath(g, W2, H2, a, b) {
  var ok = false; scan(g, W2, H2, a, function (c) { if (c === b) ok = true; });
  if (!ok) return null;
  var pts = [b], p = _hf[b], n = 0;
  while (p !== a && n++ < 5) { pts.push(p); p = _par[p]; }
  pts.push(a); return pts.reverse();
}
function canPair(g, ca, cb) { // same tile type, unfrozen, same chain group
  var A = g[ca], B = g[cb];
  return A && B && ca !== cb && !(A & 32) && !(B & 32) && (A & 31) === (B & 31) && (A >> 6) === (B >> 6);
}
// all legal moves: [a,b] or chain [a,b,c,d]
function listMoves(g, W2, H2, firstOnly) {
  var out = [], gp = {}, n = W2 * H2, a;
  for (a = 0; a < n; a++) {
    var A = g[a]; if (!A || (A & 32)) continue;
    scan(g, W2, H2, a, function (b) {
      if (b > a && canPair(g, a, b)) {
        var gr = A >> 6;
        if (!gr) out.push([a, b]);
        else { var k = gr + ':' + (A & 31); if (!gp[gr]) gp[gr] = {}; gp[gr][A & 31] = [a, b]; }
      }
    });
    if (firstOnly && out.length) return out;
  }
  for (var gr in gp) { var ks = Object.keys(gp[gr]); if (ks.length === 2) out.push(gp[gr][ks[0]].concat(gp[gr][ks[1]])); }
  return out;
}
function countTiles(g) { var n = 0; for (var i = 0; i < g.length; i++) if (g[i]) n++; return n; }
// gravity "lines": cell lists ordered from the side tiles settle toward
