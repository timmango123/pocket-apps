<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>菇菇守城</title>
<style>
:root{
  --bg:#a7c957; --ink:#2f3b1f; --ink2:#5d6b45; --card:#fffdf4ee; --card2:#f6f1de; --line:#e2dcc2; --accent:#e76f51; --accent2:#f4a261; --gold:#f2b632; --good:#5a9e3a;
  --btn1:#8cc152; --btn2:#6aa33a; --btnsh:#4f7f28; --dim:#2f3b1f99; --ovbg:#f4f1dccc; --heart:#e5484d; --spore:#c77dff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2a1f; --ink:#eef3dc; --ink2:#b5c49c; --card:#22342aee; --card2:#2b4034; --line:#3c5444; --accent:#ff8a6b; --accent2:#f4a261; --gold:#ffcf4d; --good:#7ccf5a;
    --btn1:#6fae45; --btn2:#4f8f2f; --btnsh:#2f5e1a; --dim:#eef3dc99; --ovbg:#0f1a12cc; --heart:#ff6b6b; --spore:#d9a6ff;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2a1f; --ink:#eef3dc; --ink2:#b5c49c; --card:#22342aee; --card2:#2b4034; --line:#3c5444; --accent:#ff8a6b; --accent2:#f4a261; --gold:#ffcf4d; --good:#7ccf5a;
  --btn1:#6fae45; --btn2:#4f8f2f; --btnsh:#2f5e1a; --dim:#eef3dc99; --ovbg:#0f1a12cc; --heart:#ff6b6b; --spore:#d9a6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.ibtn{width:46px;height:46px;border-radius:15px;background:var(--card);box-shadow:0 3px 10px #0002;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.ibtn.on{background:var(--accent2);color:#fff}
.hcard{flex:1;min-width:0;height:52px;border-radius:16px;background:var(--card);box-shadow:0 3px 10px #0002;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.hl1{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.dchip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;color:#fff;white-space:nowrap}
.hl2{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.hl2 b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.hl2 .it{display:flex;align-items:center;gap:3px}
.hl2 svg{width:14px;height:14px;flex:none}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);display:flex;gap:8px;z-index:5;pointer-events:none}
.bar > *{pointer-events:auto}
.prev{flex:1;min-width:0;height:56px;border-radius:16px;background:var(--card);box-shadow:0 3px 10px #0002;display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden}
.prev .lb{font-size:12px;color:var(--ink2);line-height:1.2;flex:none}
.prev .lb b{display:block;color:var(--ink);font-size:14px}
.picons{display:flex;gap:6px;align-items:center;overflow:hidden}
.pic{position:relative;display:flex;align-items:center;gap:1px;font-size:12px;font-weight:700;flex:none}
.pic canvas{width:30px;height:30px}
.pic .bd{position:absolute;left:-2px;top:-3px;font-size:10px;line-height:1;padding:1px 3px;border-radius:5px;background:#5b3fa0;color:#fff}
.pic .bd.ch{background:#c0392b;left:auto;right:10px}
.tinfo{font-size:12px;color:var(--ink2);line-height:1.35;min-width:0}
.tinfo b{color:var(--ink);font-size:14px}
.nextb{height:56px;min-width:108px;padding:0 14px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(180deg,var(--btn1),var(--btn2));box-shadow:0 4px 0 var(--btnsh),0 6px 14px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.nextb small{font-size:11px;font-weight:700;opacity:.92}
.nextb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnsh)}
.nextb[disabled]{filter:grayscale(.8);opacity:.6}
.nextb.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
/* landscape: side columns */
body.land .hud{right:auto;bottom:0;width:calc(var(--sal) + 186px);flex-direction:column;align-items:stretch;padding:calc(var(--sat) + 8px) 0 8px calc(var(--sal) + 8px)}
body.land .hud .hrow{display:flex;gap:8px}
body.land .hcard{flex:none;height:auto;padding:8px 10px}
body.land .hl2{flex-wrap:wrap;row-gap:2px}
body.land .bar{left:auto;top:0;width:calc(var(--sar) + 186px);flex-direction:column;justify-content:flex-end;padding:8px calc(var(--sar) + 8px) calc(var(--sab) + 8px) 0}
body.land .prev{flex:none;height:auto;min-height:56px;flex-wrap:wrap;padding:8px 10px}
.hrow{display:contents}
#bPause{order:0}.hcard{order:1}#bSpeed{order:2}
body.land #bPause,body.land #bSpeed{order:0}
/* radial menu */
#radial{position:fixed;inset:0;z-index:7;pointer-events:none}
.rb{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--card);box-shadow:0 3px 10px #0004,inset 0 0 0 2px var(--line);pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:rpop .18s cubic-bezier(.2,.9,.3,1.4) both}
.rb canvas{width:30px;height:30px;margin-top:-3px}
.rb .c{font-size:11px;font-weight:800;line-height:1;margin-top:-2px;color:var(--ink)}
.rb .c.no{color:#c0392b}
.rb.dis{filter:grayscale(1);opacity:.55}
.rb.lock canvas{opacity:.3}
.rb .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink2)}
.rb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rb.warn{background:#e5484d;box-shadow:0 3px 10px #0004}
.rb.warn .c,.rb.warn svg{color:#fff;stroke:#fff}
.rb:active{transform:scale(.92)}
@keyframes rpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ovbg);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px #0004;padding:22px 20px;width:min(380px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(180deg,var(--btn1),var(--btn2));box-shadow:0 5px 0 var(--btnsh),0 8px 18px #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.warm{background:linear-gradient(180deg,#f4a261,#e76f51);box-shadow:0 5px 0 #b4502f,0 8px 18px #b4502f44}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:#d8d2b8}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c88a10;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:18px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink)}
.stat{display:flex;gap:12px;align-items:center;margin:10px 0 2px;text-align:left}
.stat canvas{width:96px;height:96px;flex:none}
.legend{font-size:12px;color:var(--ink2);line-height:1.6;flex:1;min-width:0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* title */
#title{background:linear-gradient(180deg,#0000 30%,var(--ovbg));backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{margin-top:5vh;text-align:center}
.ttl h1{font-size:50px;margin:0;letter-spacing:6px;color:#fff;text-shadow:0 3px 0 #6a3d1f,0 6px 0 #4a2a12,0 12px 24px #0006}
.ttl .sub{color:#fff;font-weight:700;margin-top:10px;font-size:15px;text-shadow:0 2px 6px #000a;background:#2f3b1f66;display:inline-block;padding:4px 12px;border-radius:12px}
.tbtns{width:100%;max-width:330px;display:flex;flex-direction:column;gap:0;margin-bottom:6px}
.tbtns .row2 .btn{font-size:15px}
.tmini{display:flex;gap:10px;justify-content:center;margin-top:12px}
.tmini .ibtn{width:auto;padding:0 14px;height:46px;font-size:14px;gap:6px;display:flex}
/* select */
#select{align-items:stretch;padding:0;background:var(--bg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);min-height:46px;padding:0 10px;border-radius:14px;background:var(--card)}
.sw .trk{width:46px;height:28px;border-radius:14px;background:#b9b49c;position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--good)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:2px 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
.lt{border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 14px #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;padding:9px 2px 8px;min-height:64px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:#cfc8ab;line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:74%;height:5px;border-radius:3px;background:#0001;overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1;white-space:nowrap}
.lt.done{background:var(--card2)}
.lt.cur{outline:3px solid var(--accent2)}
.lt.lock{opacity:.55}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt .nb{position:absolute;top:-4px;right:-4px;font-size:10px;background:var(--accent);color:#fff;border-radius:8px;padding:1px 5px;font-weight:800}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#2f3b1fee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:56px;height:56px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.helpscroll h3{margin:12px 0 4px;font-size:16px}
.helpscroll p{font-size:14px;margin:4px 0}
.ach{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:14px;background:var(--card2);margin:6px 0;font-size:14px}
.ach .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0001;font-size:18px;flex:none}
.ach.got .ic{background:var(--gold)}
.ach small{display:block;color:var(--ink2);font-size:12px}
.banner{position:fixed;left:0;right:0;top:40%;z-index:6;text-align:center;pointer-events:none;font-size:30px;font-weight:900;letter-spacing:4px;color:#fff;text-shadow:0 3px 0 #0006,0 0 24px #000a;transition:opacity .4s, transform .4s}
@media (max-height:600px){ .ov{align-items:flex-start} .card{padding:16px} .stars{font-size:36px} }
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .lt:hover{filter:brightness(1.03)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <div class="hrow">
    <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="ibtn" id="bSpeed" aria-label="速度">1×</button>
  </div>
  <div class="hcard">
    <div class="hl1"><span id="hLevel">第 1 關</span><span class="dchip" id="hDiff">難度 1</span></div>
    <div class="hl2">
      <span class="it" aria-label="生命"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.7-8 11-8 11z" fill="var(--heart)"/></svg><b id="hLives">20</b></span>
      <span class="it" aria-label="孢子"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="var(--spore)"/><circle cx="9.5" cy="10" r="2" fill="#fff8"/></svg><b id="hSpores">0</b></span>
      <span class="it">波 <b id="hWave">0/8</b></span>
    </div>
  </div>
</div>

<div class="bar hidden" id="bar">
  <div class="prev" id="prev"></div>
  <button class="nextb" id="bNext"><span id="nextT">開戰</span><small id="nextS">+30 孢子</small></button>
</div>

<div id="radial"></div>
<div class="banner hidden" id="banner"></div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>菇菇守城</h1>
    <div class="sub">種下蘑菇塔・擋住害蟲大軍・守護蘑菇村</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2"><button class="btn sec" id="tDaily">每日地圖</button><button class="btn sec" id="tEndless">無盡模式</button></div>
    <div class="tmini"><button class="ibtn" id="tHelp">玩法說明</button><button class="ibtn" id="tAch">成就</button><button class="ibtn" id="tMute" aria-label="音效">音效 開</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重新開始</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pMute">音效 開</button><button class="btn sec" id="pSelect">離開</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">守住了！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>剩餘生命<b id="wLives">20</b></div><div>擊倒<b id="wKills">0</b></div><div>難度<b id="wD">0</b></div></div>
  <div class="stat"><canvas id="wPie" width="192" height="192"></canvas><div class="legend" id="wLeg"></div></div>
  <p id="wMsg"></p>
  <button class="btn warm" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="lose"><div class="card">
  <h2 id="lTitle">蘑菇村失守了…</h2>
  <p id="lMsg"></p>
  <div class="stat"><canvas id="lPie" width="192" height="192"></canvas><div class="legend" id="lLeg"></div></div>
  <button class="btn" id="lRetry">再試一次</button>
  <button class="btn sec" id="lSelect">離開</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="achv"><div class="card">
  <h2>成就</h2>
  <div class="helpscroll" id="achBody"></div>

var lastT = 0, demo = null;
function frame(ts){
  requestAnimationFrame(frame);

  if (screen === 'game' && S && S.phase !== 'won' && S.phase !== 'lost'){
    acc += dt*speed; var n = 0;
    // the between-wave countdown waits while a build/tower menu is open, so choosing never costs time
    if (S.phase === 'build' && radialCell >= 0) acc = 0;
    while (acc >= C.DT && n < 10){ C.step(S); acc -= C.DT; n++; handleEvents(); if (S.phase === 'won' || S.phase === 'lost') break; }
    if (n >= 10) acc = 0;
    gameT += dt*speed;
    updHud(); updBar();
    if (radialCell >= 0 && radialKind === 'build' && (frame.k = (frame.k || 0) + 1) % 15 === 0) refreshAfford();
  } else if (screen === 'title' && demo){
    acc += dt; var m = 0;
    while (acc >= C.DT && m < 4){ demoStep(); acc -= C.DT; m++; }
    gameT += dt;
  } else if (S && (screen === 'game')) { gameT += dt*.2; }

}

$('wNext').addEventListener('click', function(){ SFX.click(); startLevel(Math.min(NL, levelN+1)); });
$('wRetry').addEventListener('click', function(){ SFX.click(); restart(); });
$('wSelect').addEventListener('click', function(){ SFX.click(); if (mode === 'level') goSelect(); else goTitle(); });
$('lRetry').addEventListener('click', function(){ SFX.click(); restart(); });
$('lSelect').addEventListener('click', function(){ SFX.click(); if (mode === 'level') goSelect(); else goTitle(); });
$('bSpeed').addEventListener('click', function(){ audio(); SFX.tick(); speed = speed >= 3 ? 1 : speed + 1; updSpeed(); });
$('bNext').addEventListener('click', function(){ if (!S || S.phase !== 'build' || screen !== 'game') return; audio(); closeRadial(); C.callWave(S, true); handleEvents(); updBar(true); });
document.addEventListener('pointerdown', function(e){ if (radialCell >= 0 && e.target !== cv && !e.target.closest('#radial')) closeRadial(); }, true);

document.addEventListener('keydown', function(e){
  var k = e.key;
  if (screen === 'game'){
    if (k >= '1' && k <= '5' && radialKind === 'build'){ doBuild(C.TORDER[+k - 1]); return; }
    if ((k === 'u' || k === 'U') && radialKind === 'tower'){ towerAction('up'); return; }
    if ((k === 's' || k === 'S') && radialKind === 'tower'){ towerAction('sell'); return; }
    if ((k === 't' || k === 'T') && radialKind === 'tower'){ towerAction('tgt'); return; }
    if (k === ' '){ e.preventDefault(); $('bNext').click(); return; }
    if (k === 'f' || k === 'F'){ $('bSpeed').click(); return; }
    if (k === 'p' || k === 'P' || k === 'Escape'){ if (radialCell >= 0 && k === 'Escape') closeRadial(); else openPause(); return; }
  } else if (screen === 'paused' && (k === 'Escape' || k === 'p' || k === 'P')) resume();
  else if (screen === 'won' && (k === 'Enter' || k === ' ')){ e.preventDefault(); if (mode === 'level' && levelN < NL) startLevel(levelN+1); }
  else if (screen === 'intro' && (k === 'Enter' || k === ' ')){ e.preventDefault(); $('iOk').click(); }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden && screen === 'game') openPause(); });
window.addEventListener('blur', function(){ if (screen === 'game' && document.hidden) openPause(); });

/* test hook (read-only state + coordinates) used by demo/verify.js */
window.__game = {
  state: function(){ return S ? {screen:screen, phase:S.phase, wave:S.wave, nW:S.nW, lives:S.lives, spores:S.spores, towers:S.towers.length, speed:speed, cd:S.cd, menu:radialKind, menuCell:radialCell, level:levelN, D:L.D, kills:S.kills} : {screen:screen}; },
  cellPoint: function(c){ return cellCenter(c); },
  cell: function(c){ return S ? {grid:L.grid[c], tower:S.tmap[c] >= 0 ? S.towers[S.tmap[c]].t + S.towers[S.tmap[c]].lv : null, spores:S.spores, towers:S.towers.map(function(t){ return t.c + t.t[0] + t.lv; }).join(' ')} : null; }
};

layout(); setMuteLabels(); demoInit(); requestAnimationFrame(frame);
})();
</script>
</body>
