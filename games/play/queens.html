<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>花園女王</title>
<style>
:root{
  --bg:#f6f0df; --bg2:#ece3c8; --ink:#2f4a35; --ink2:#647a62; --card:#fffdf6f2; --line:#2f5d3a;
  --gold:#e8b23a; --accent:#5f9e6e; --accent2:#4b8a5b; --warm:#e8798f; --chip:#ffffffcc; --shadow:#3d5a3a26;
  --leaf:#d9e2bf; --tipb:#3f7a4e; --tile:#fffdf6; --tilesh:#d9cfae; --lock:#ebe4cf; --track:#cfc8b0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10282c; --bg2:#0b1f23; --ink:#e3eedf; --ink2:#9fb8a8; --card:#173539f2; --line:#0b1a14;
    --gold:#f0c45a; --accent:#5aa77a; --accent2:#3f8b5f; --warm:#e88aa0; --chip:#1b3c40cc; --shadow:#00000055;
    --leaf:#1a3a3c; --tipb:#8fdcaa; --tile:#1b3d41; --tilesh:#0c2326; --lock:#152f33; --track:#2f4c50; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:var(--bg)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);
  display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:44px;box-shadow:0 3px 10px var(--shadow);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.crowns{display:inline-flex;gap:1px}
.crowns i{width:7px;height:9px;background:var(--track);clip-path:polygon(0 100%,0 15%,25% 55%,50% 0,75% 55%,100% 15%,100% 100%)}
.crowns i.on{background:var(--gold)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;white-space:nowrap}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:52px;min-width:96px;padding:0 16px;border-radius:26px;background:var(--card);box-shadow:0 4px 14px var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:15px;position:relative}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.42}
.badge{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--warm);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
body.land .bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--sat) + 60px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) 8px}
body.land .pill{min-width:118px}
.hidden{display:none !important}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px var(--shadow);padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:4px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;
  background:linear-gradient(180deg,#7dbb88,#5f9e6e);color:#fff;box-shadow:0 5px 0 #3f7a4e,0 8px 18px #3f7a4e44}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3f7a4e}
.btn.sec{background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--tilesh)}
.btn.warm{background:linear-gradient(180deg,#f3a0b2,#e8798f);box-shadow:0 5px 0 #c25a70,0 8px 18px #c25a7044}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0;color:var(--track)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c58d1a;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;padding-top:calc(var(--sat) + 7vh)}
.ttl{text-align:center;width:100%}
.ttl h1{font-size:50px;margin:0;letter-spacing:6px;color:var(--ink);text-shadow:0 4px 0 var(--bg),0 10px 24px var(--shadow)}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:8px;font-size:16px}
.tbtns{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px;padding:0 8px}
.tbtns .row2{width:100%}
#select{align-items:stretch;padding:0;background:var(--bg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--track);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.gridwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--sab) + 20px);touch-action:pan-y}
.sec-h{font-size:13px;font-weight:800;color:var(--ink2);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.sec-h b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lt{overflow:hidden;aspect-ratio:1/1.1;min-height:52px;border-radius:16px;background:var(--tile);box-shadow:0 3px 0 var(--tilesh),0 6px 14px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--track);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .crowns{gap:0}.lt .crowns i{width:4px;height:6px;margin:0 .5px}
.lt.done{background:color-mix(in srgb,var(--tile) 80%,#9fe0bf)}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--lock);box-shadow:0 3px 0 var(--tilesh);color:var(--ink2)}
.lt.lock svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;background:#24392bf0;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:min(92vw,420px);text-align:center;pointer-events:none;transition:opacity .35s;line-height:1.5;top:calc(var(--sat) + 62px)}
.tip{position:fixed;z-index:6;left:50%;transform:translateX(-50%);max-width:min(92vw,420px);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.5;box-shadow:0 4px 14px var(--shadow);text-align:center;pointer-events:none}
.tip b{color:var(--tipb)}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 6px;font-size:14px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:1px solid color-mix(in srgb,var(--ink2) 20%,transparent);text-align:left}
.setrow:last-of-type{border-bottom:0}
.setrow .lab{font-weight:700;font-size:15px}
.setrow .lab small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.helpscroll p{font-size:14px;margin:8px 0}
.helpscroll canvas{display:block;margin:6px auto;border-radius:12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sizes .btn{margin:0;height:56px;font-size:17px}
.sizes .btn small{font-size:11px;font-weight:600;opacity:.8;margin-left:2px}
.mini{font-size:12px;color:var(--ink2);margin-top:8px}
#win{background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--bg) 75%,transparent));backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end}
#win .card{margin:0 auto}
body.land #win{align-items:center;justify-content:flex-end}
body.land #win .card{margin:0;width:min(320px,100%)}
@media (max-height:600px){ .ov{align-items:flex-start} #title{padding-top:calc(var(--sat) + 14px)} .ttl h1{font-size:38px} }
@media (hover:hover){ .btn:hover{filter:brightness(1.04)} .lt:hover{filter:brightness(1.03)} }
</style>

<script>
/*CORE-START*/
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function popc(x) { x = x - ((x >> 1) & 0x55555555); x = (x & 0x33333333) + ((x >> 2) & 0x33333333); return (((x + (x >> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; }
var TECH_W = [0, 1, 2, 5, 12];
var SEARCH_TECH = 3;
var TECH_NAME = ['排除', '唯一位置', '鄰域排除', '鎖定推理', '矛盾試探'];
function makePuzzle(N, K, reg) {
var NN = N * N, i, j;
var P = { N: N, K: K, reg: reg, NN: NN, units: [], unitsOf: [], nb: [] };
for (i = 0; i < 3 * N; i++) P.units.push([]);
for (i = 0; i < NN; i++) {
var r = (i / N) | 0, c = i % N;
P.units[r].push(i); P.units[N + c].push(i); P.units[2 * N + reg[i]].push(i);
P.unitsOf.push([r, N + c, 2 * N + reg[i]]);
var nb = [];
for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
if (!dx && !dy) continue; var y = r + dy, x = c + dx;
if (y >= 0 && x >= 0 && y < N && x < N) nb.push(y * N + x);
}
P.nb.push(nb);
}
return P;
}
function adj(P, a, b) { var N = P.N; return Math.abs(((a / N) | 0) - ((b / N) | 0)) <= 1 && Math.abs(a % N - b % N) <= 1; }
function unitLabel(P, u) {

else if (kind === 'two') { [0, 3, 10, 13].forEach(function (q) { drawCrown(c, ox + (q % N + 0.5) * s, oy + (((q / N) | 0) + 0.5) * s, s, false, false); }); }
else { drawCrown(c, ox + 1.5 * s, oy + 0.5 * s, s, false, false); }
}
/* ---------------- level select ---------------- */
var SECTIONS = [[1, 8], [9, 20], [21, 35], [36, 50], [51, 69], [70, 84], [85, 94], [95, 100]];
function buildGrid() {
var wrap = $('gridwrap'), h = '', done = 0, stars = 0;
for (var n = 1; n <= NL; n++) if (prog[n]) { done++; stars += prog[n].s; }
$('selSum').textContent = '已完成 ' + done + ' / ' + NL + ' 關・★ ' + stars + ' / ' + NL * 3;
var cur = firstOpen();
SECTIONS.forEach(function (sec) {
var N = lvSize(sec[0]), K = lvK(sec[0]);
h += '<div class="sec-h"><b>' + N + '×' + N + '</b>' + (K === 2 ? '雙星花園（每處 2 位）' : '花園') + '・第 ' + sec[0] + '–' + sec[1] + ' 關</div><div class="grid">';
for (var n = sec[0]; n <= sec[1]; n++) {
var p = prog[n], un = isUnlocked(n), cls = 'lt' + (p ? ' done' : '') + (!un ? ' lock' : '') + (n === cur && un ? ' cur' : '');
h += '<button class="' + cls + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + lvD(n) + (un ? '' : '，未解鎖') + '">';
h += '<span class="n">' + n + '</span>';
if (un) { var st = ''; for (var s = 1; s <= 3; s++) st += p && s <= p.s ? '<span class="on">★</span>' : '★'; h += '<span class="st">' + st + '</span>'; }
else h += '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
h += '<span class="crowns">' + crownsHTML(lvD(n)) + '</span></button>';
}
h += '</div>';
});
wrap.innerHTML = h;
$('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
$('gridwrap').addEventListener('click', function (e) {
var b = e.target.closest('.lt'); if (!b) return;
audio(); var n = +b.getAttribute('data-n');
if (!isUnlocked(n)) { SFX.bad(); toast('先完成前一關，或打開「解鎖全部關卡」'); return; }
SFX.click(); startLevel(n);
});
$('unlockSw').addEventListener('click', function () { audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
function openSelect() { hideAll(); setGameUI(false); screen = 'select'; G = null; buildGrid(); show('select');
var cur = document.querySelector('.lt.cur'); if (cur) cur.scrollIntoView({ block: 'center' }); }
/* ---------------- daily & custom ---------------- */
function todayKey() { var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function generate(N, K, seed) {
var best = null;
for (var a = 0; a < 40; a++) {
var r = genCandidate(N, K, seed * 131 + a * 7919 + 17, a % 3 === 2 ? 1 : 0, 4);
if (r) { best = r; break; }
}
return best;
}
function startDaily() {
var key = todayKey();
toast('正在種花…', 900);
setTimeout(function () {
var r = generate(8, 1, key);
if (!r) { toast('生成失敗，再試一次'); return; }
var dstr = String(key).replace(/(\d{4})(\d\d)(\d\d)/, '$2/$3');
newGame('daily', { N: 8, K: 1, reg: r.reg, sol: r.sol, d: diffFromScore(r.score), label: '每日花園 ' + dstr, dateKey: key });
enterGame();
var dd = sget('daily', {}); if (dd && dd[key]) toast('今天最佳：' + fmt(dd[key]));
}, 30);
}
function buildSizes() {
var h = '';
[5, 6, 7, 8, 9].forEach(function (n) { h += '<button class="btn sec" data-n="' + n + '">' + n + '×' + n + '</button>'; });
h += '<button class="btn sec" data-n="10" data-k="2">10×10<small>雙星</small></button>';
$('sizes').innerHTML = h;
}
$('sizes').addEventListener('click', function (e) {
var b = e.target.closest('[data-n]'); if (!b) return; audio(); SFX.click();
var n = +b.getAttribute('data-n'), k = +(b.getAttribute('data-k') || 1);
$('cMsg').textContent = '正在種花…'; customSize = [n, k];
setTimeout(function () { startCustom(n, k); }, 30);
});
var customSize = [7, 1];
function startCustom(n, k) {
var seed = (Date.now() % 1000000) + 1, r = null;
for (var tries = 0; tries < 4 && !r; tries++) r = generate(n, k, seed + tries * 1000);
$('cMsg').textContent = '每座都保證唯一解、可用邏輯推出。';
if (!r) { toast('生成失敗，再試一次'); return; }
newGame('custom', { N: n, K: k, reg: r.reg, sol: r.sol, d: diffFromScore(r.score), label: '隨機 ' + n + '×' + n + (k === 2 ? ' 雙星' : '') });
enterGame();
}
/* ---------------- share ---------------- */
function shareText() {
var st = ''; for (var i = 1; i <= 3; i++) st += i <= G.stars ? '★' : '☆';
return '花園女王 ' + G.label + '（' + G.N + '×' + G.N + '）\n' + st + '　用時 ' + fmt(G.time) + (G.hintsUsed ? '　提示 ' + G.hintsUsed + ' 次' : '　零提示') + '\n每列每行每塊花圃一位女王，來挑戰吧！';
}
function doShare() {
var txt = shareText();
if (navigator.share) { navigator.share({ text: txt, title: '花園女王' }).catch(function () {}); return; }
try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {}); } catch (e) {}
$('shareText').textContent = txt; show('shareOv');
}
/* ---------------- help ---------------- */
function buildHelp() {
$('helpBody').innerHTML =
'<p><b>目標：</b>在每一<b>橫列</b>、每一<b>直行</b>、每一塊彩色<b>花圃</b>各放剛好一位女王（第 70 關起是兩位）。</p>' +
'<p><b>不相鄰：</b>任兩位女王不能貼在一起，斜角也不行。</p>' +
'<p><b>操作：</b>點一下格子打 ×，再點一下放女王，再點一下清空。按住拖曳可以連續打 ×（從 × 開始拖則是擦掉）。</p>' +
'<p><b>電腦：</b>右鍵直接放女王；方向鍵移動、空白鍵切換、Q 放女王、X 打叉、Ctrl+Z 悔棋、H 提示。</p>' +
'<p><b>違規：</b>衝突的女王會變紅並晃動，但不會阻止你放。</p>' +
'<p><b>評星：</b>不用提示且在目標時間（格數 × 1.5 秒）內完成得 3 星；不用提示得 2 星；其他 1 星。每關有 3 次提示。</p>' +
'<p><b>難度：</b>王冠越多越難，由電腦邏輯解題器實際推理計分。每關都比上一關更難，而且保證唯一解、不必瞎猜。</p>';
}
/* ---------------- settings ---------------- */
function syncSettings() {
$('sAuto').setAttribute('aria-checked', settings.auto ? 'true' : 'false');
$('sCb').setAttribute('aria-checked', settings.cb ? 'true' : 'false');
$('sSnd').setAttribute('aria-checked', settings.snd ? 'true' : 'false');
$('sVib').setAttribute('aria-checked', settings.vib ? 'true' : 'false');
}
function toggleSet(k) { audio(); settings[k] = !settings[k]; sset('settings', settings); syncSettings(); SFX.click(); if (k === 'cb') { buildBase(); titleKey = ''; } }
$('sAuto').onclick = function () { toggleSet('auto'); };
$('sCb').onclick = function () { toggleSet('cb'); };
$('sSnd').onclick = function () { toggleSet('snd'); };
$('sVib').onclick = function () { toggleSet('vib'); };
var setFrom = null;
function openSettings(from) { setFrom = from; syncSettings(); show('settings'); }
$('setOk').onclick = function () { audio(); SFX.click(); hide('settings'); };
/* ---------------- pause ---------------- */
function openPause() {
if (!G) return;
$('pInfo').textContent = G.label + '・' + G.N + '×' + G.N + '・用時 ' + fmt(G.time) + '・提示剩 ' + G.hints + ' 次';
$('pSelect').classList.toggle('hidden', G.mode !== 'level');
show('pause');
}
/* ---------------- wiring ---------------- */
function goHome() { hideAll(); setGameUI(false); G = null; screen = 'title'; show('title'); }
$('tPlay').onclick = function () { audio(); SFX.click(); var l = sget('last', 0); startLevel(l && !prog[l] ? l : firstOpen()); };
$('tSelect').onclick = function () { audio(); SFX.click(); openSelect(); };
$('tDaily').onclick = function () { audio(); SFX.click(); startDaily(); };
$('tCustom').onclick = function () { audio(); SFX.click(); buildSizes(); show('custom'); };
$('cBack').onclick = function () { audio(); SFX.click(); hide('custom'); };
$('tHelp').onclick = function () { audio(); SFX.click(); buildHelp(); show('help'); };
$('tSet').onclick = function () { audio(); SFX.click(); openSettings('title'); };
$('hOk').onclick = function () { audio(); SFX.click(); hide('help'); };
$('sBack').onclick = function () { audio(); SFX.click(); goHome(); };
$('bMenu').onclick = function () { audio(); SFX.click(); openPause(); };
$('bSet').onclick = function () { audio(); SFX.click(); openSettings('game'); };
$('bUndo').onclick = function () { audio(); doUndo(); };
$('bHint').onclick = function () { audio(); doHint(); };
$('bClear').onclick = function () { audio(); doClear(); };
$('pResume').onclick = function () { audio(); SFX.click(); hide('pause'); };
$('pRestart').onclick = function () {
audio(); SFX.click(); hide('pause');
if (G.mode === 'level') startLevel(G.level);
else { var o = { N: G.N, K: G.K, reg: G.P.reg, sol: G.sol, d: G.d, label: G.label, dateKey: G.dateKey }; newGame(G.mode, o); enterGame(); }
};
$('pHelp').onclick = function () { audio(); SFX.click(); buildHelp(); show('help'); };
$('pSelect').onclick = function () { audio(); SFX.click(); openSelect(); };
$('pHome').onclick = function () { audio(); SFX.click(); goHome(); };
$('iOk').onclick = function () { audio(); SFX.click(); hide('intro'); };
$('wNext').onclick = function () {
audio(); SFX.click();
if (G.mode === 'level') { if (G.level < NL) startLevel(G.level + 1); else openSelect(); }
else if (G.mode === 'custom') { hide('win'); startCustom(customSize[0], customSize[1]); }
else goHome();
};
$('wSelect').onclick = function () { audio(); SFX.click(); if (G.mode === 'level') openSelect(); else goHome(); };
$('wShare').onclick = function () { audio(); SFX.click(); doShare(); };
$('shareOk').onclick = function () { audio(); SFX.click(); hide('shareOv'); };
document.addEventListener('visibilitychange', function () {
if (document.hidden) { running = false; if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) {} } }
else { running = true; last = 0; if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} } }
});
var titleImg = null, titleKey = '';
function buildTitleGarden() {
var key = W + 'x' + H + (dark ? 'd' : 'l') + (settings.cb ? 'c' : '');
if (titleKey === key && titleImg) return; titleKey = key;
var saved = [G, BX, BY, CS, BS];
var o = levelOpts(9), g = newGame('demo', o);
for (var i = 0; i < g.sol.length; i++) g.st[g.sol[i]] = 2;
var avail = Math.min(W - 60, H * 0.36, 300);
CS = Math.floor(avail / (g.N + 0.5)); BS = CS * g.N;
var pad = padOf(); buildBase();
titleImg = document.createElement('canvas'); titleImg.width = base.width; titleImg.height = base.height;
var c = titleImg.getContext('2d'); c.drawImage(base, 0, 0); c.setTransform(DPR, 0, 0, DPR, 0, 0);
for (i = 0; i < g.P.NN; i++) {
var x = pad + (i % g.N) * CS, y = pad + ((i / g.N) | 0) * CS, r = g.P.reg[i];
if (g.st[i] === 2) drawCrown(c, x + CS / 2, y + CS / 2, CS, false, false);
else flower(c, x + CS * 0.5, y + CS * 0.5, CS * 0.17, rgb(regionCol(g.colors[r], 1)), dark ? '#f4e6a8' : '#fff4c2');
}
titleImg._cs = CS; titleImg._n = g.N; titleImg._colors = g.colors; titleImg._reg = g.P.reg;
G = saved[0]; BX = saved[1]; BY = saved[2]; CS = saved[3]; BS = saved[4];
if (G) buildBase();
}
function drawTitle(t) {
buildTitleGarden();
var w = titleImg.width / DPR, h = titleImg.height / DPR;
var ttl = document.querySelector('.ttl'), btns = document.querySelector('.tbtns');
var y0 = ttl.getBoundingClientRect().bottom + 10, y1 = btns.getBoundingClientRect().top - 10;
if (y1 - y0 < 120) return;
var sc = Math.min(1, (y1 - y0) / h), bob = Math.sin(t / 900) * 4;
var x = (W - w * sc) / 2, y = y0 + (y1 - y0 - h * sc) / 2 + bob;
ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
ctx.translate(x + w * sc / 2, y + h * sc / 2); ctx.rotate(Math.sin(t / 1700) * 0.025); ctx.translate(-w * sc / 2, -h * sc / 2);
ctx.shadowColor = dark ? 'rgba(0,0,0,.5)' : 'rgba(47,72,40,.28)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
ctx.drawImage(titleImg, 0, 0, w * sc, h * sc);
ctx.restore();
if (Math.random() < 0.06) {
var ci = (Math.random() * titleImg._n) | 0, col = regionCol(titleImg._colors[ci], 2), saveCS = CS; CS = titleImg._cs * sc;
petals(x + Math.random() * w * sc, y + Math.random() * h * sc, col, 1, 2); CS = saveCS;
}
}
/* ---------------- test hooks ---------------- */
window.__game = {
state: function () { return G ? { mode: G.mode, level: G.level, N: G.N, K: G.K, status: G.status, moves: G.moves, time: G.time, hints: G.hints, queens: Array.prototype.filter.call(G.st, function (v) { return v === 2; }).length, screen: screen } : { screen: screen }; },
rect: function () { return G ? { x: BX, y: BY, cs: CS, n: G.N } : null; },
grid: function () { return G ? Array.prototype.slice.call(G.st) : null; }
};
layout();
buildHelp();
frame(0);
})();
