<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>螢火迷宮</title>
<style>
:root{
  --bg:#0b1320; --ink:#eef3e6; --ink2:#a9b8a6; --card:#14213aee; --card2:#1b2b47; --line:#ffffff1a; --accent:#ffe66d; --accent2:#7ee0a0; --warm:#ffb347;
  --btn1:#ffe66d; --btn2:#f2c94c; --btnsh:#b8902a; --btnink:#2a2410; --sec:#22355a; --secsh:#152440; --hedge:#1f4d3a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f1ead8; --ink:#2f3a2a; --ink2:#6b7563; --card:#fffaf0f0; --card2:#f5ecd7; --line:#00000014; --accent:#f08a24; --accent2:#3f8a52;
    --btn1:#ffb347; --btn2:#f08a24; --btnsh:#b85f12; --btnink:#fff; --sec:#e9dfc6; --secsh:#cfc2a2; --hedge:#6aa66e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 12px #0003;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:48px;box-shadow:0 3px 12px #0003;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 12px;gap:4px}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between;white-space:nowrap}
.lvname{font-weight:800;font-size:15px}
.dchip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--card2);color:var(--ink2)}
.dchip b{color:var(--accent)}
.score{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin-left:auto}
.lives{display:flex;gap:3px}
.lives i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--accent) 0 35%,transparent 70%);box-shadow:0 0 6px var(--accent)}
.lives i.off{background:var(--line);box-shadow:none}
.pbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width .2s}
.pct{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
#pad{position:fixed;left:50%;bottom:calc(var(--sab) + 8px);transform:translateX(-50%);width:174px;height:174px;z-index:5;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
#pad button{border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 10px #0003;display:grid;place-items:center;touch-action:none}
#pad button svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#pad button.on{background:var(--accent);}
#pad button.on svg{stroke:var(--btnink)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:#050a14a8;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease}
@media (prefers-color-scheme: light){ .ov{background:#e8dcc0a8} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #0006;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);max-height:100%;overflow-y:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--btnink);box-shadow:0 5px 0 var(--btnsh),0 8px 20px #0004}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0;color:var(--line);line-height:1.1}
.stars .on{color:var(--accent);text-shadow:0 0 14px var(--accent);display:inline-block;animation:starpop .55s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;flex-direction:column;justify-content:space-between}
.ttl{margin-top:8vh;text-align:center}
.ttl h1{font-size:52px;margin:0;letter-spacing:8px;color:#fff6c2;text-shadow:0 0 18px #ffe66daa,0 0 40px #ffcf4d66}
.ttl .sub{color:#cfe3c4;font-weight:600;margin-top:10px;font-size:16px;letter-spacing:2px;text-shadow:0 2px 8px #000a}
@media (prefers-color-scheme: light){ .ttl h1{color:#3d5a2e;text-shadow:0 0 18px #fff,0 4px 0 #fff8} .ttl .sub{color:#4c6a3f;text-shadow:0 1px 0 #fff} }
.tbtns{display:flex;flex-direction:column;align-items:center;padding:0 24px calc(12px);width:100%}
.tbtns .btn{max-width:320px}
.tbtns .row2{width:100%;max-width:320px}
.tbtns .btn small{font-size:12px;font-weight:600;opacity:.8}
/* level select */
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 14px 6px;display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw .trk::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--accent2)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-content:start;touch-action:pan-y}
.lt{aspect-ratio:1/1.15;border-radius:15px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;min-height:56px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--accent)}
.lt .db{width:72%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:2px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1;white-space:nowrap}
.lt .dn em{font-style:normal}
.lt .mk{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warm);box-shadow:0 0 6px var(--warm)}
.lt.done{background:var(--card2)}
.lt.cur{outline:2px solid var(--accent);box-shadow:0 0 14px #ffe66d55}
.lt.lock{opacity:.45}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#000c;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.helpscroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;text-align:left;touch-action:pan-y;font-size:14px;line-height:1.6;color:var(--ink2)}
.helpscroll h3{color:var(--ink);font-size:15px;margin:12px 0 4px}
.helpscroll b{color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.mrow canvas{width:40px;height:40px;flex:none;border-radius:10px;background:#0b1320}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:16px;padding:12px}
.mech canvas{flex:none;width:64px;height:64px;border-radius:12px;background:#0b1320}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.setrow .sw{width:100%;justify-content:space-between;color:var(--ink);font-size:15px}
.skins{display:flex;gap:8px;margin:8px 0}
.skins button{flex:1;min-height:48px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.skins button i{width:16px;height:16px;border-radius:50%}
.skins button[aria-pressed="true"]{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stats div{background:var(--card2);border-radius:12px;padding:8px;font-size:12px;color:var(--ink2)}
.stats b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.ach{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;color:var(--ink2);text-align:left}
.ach i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line);font-style:normal;font-size:15px}
.ach.got i{background:var(--accent);color:var(--btnink);box-shadow:0 0 10px var(--accent)}
.ach.got b{color:var(--ink)}
#shareImg{max-width:100%;border-radius:14px;margin-top:8px}
.ready{position:fixed;left:50%;transform:translate(-50%,-50%);z-index:4;font-size:28px;font-weight:900;letter-spacing:6px;color:var(--accent);text-shadow:0 0 16px var(--accent),0 2px 0 #0008;pointer-events:none;white-space:nowrap}
@media (max-height:600px){ .ov{align-items:flex-start;overflow-y:auto} .card{max-height:none} .ttl{margin-top:3vh} .ttl h1{font-size:40px} .helpscroll{max-height:none} }
@media (orientation:landscape) and (max-height:500px){
  #title{flex-direction:row;align-items:center}
  .ttl{margin-top:0;flex:1}
  .tbtns{flex:1;padding-bottom:0}
  .tbtns .btn{height:46px;margin-top:8px}
  .grid{grid-template-columns:repeat(10,1fr)}
  #pad{left:auto;right:calc(var(--sar) + 12px);transform:none;bottom:calc(var(--sab) + 10px)}
  #hud{right:auto;width:236px;flex-wrap:wrap;justify-content:space-between}
  #hud .hmid{order:3;flex-basis:100%;height:auto;padding:8px 12px;gap:6px}
  #hud .hrow{flex-wrap:wrap;row-gap:6px}
}
@media (hover:hover){ .btn:hover{filter:brightness(1.06)} .lt:hover{border-color:var(--accent)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div class="hrow"><span class="lvname" id="hLevel">第 1 關</span><span class="dchip">難度 <b id="hDiff">73</b></span><span class="score" id="hScore">0</span><span class="lives" id="hLives"><i></i><i></i><i></i></span></div>
    <div class="hrow"><span class="pbar"><i id="hBar"></i></span><span class="pct" id="hPct">0%</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效開關"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div id="pad" class="hidden" aria-label="虛擬方向鍵">
  <span></span><button data-d="0" aria-label="上"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
  <button data-d="3" aria-label="左"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span></span><button data-d="1" aria-label="右"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <span></span><button data-d="2" aria-label="下"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><span></span>
</div>

<div class="ready hidden" id="ready">準備</div>

<div class="ov" id="title">
  <div class="ttl"><h1>螢火迷宮</h1><div class="sub">收集光點・甩開影蛾</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <button class="btn sec" id="tDaily">每日迷宮 <small id="tDailyInfo"></small></button>
    <div class="row2"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tSet">設定・成就</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSelect">關卡</button><button class="btn sec" id="pHome">主選單</button></div>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">過關！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>分數<b id="wScore">0</b></div><div>最佳<b id="wBest">0</b></div><div>時間<b id="wTime">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wShare">分享</button></div>
  <button class="btn sec" id="wSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="lose"><div class="card">
  <h2>光被吞沒了…</h2>
  <p id="lMsg">影蛾把螢火蟲團團圍住。<br>吃到大光球就能反擊！</p>
  <div class="res"><div>分數<b id="lScore">0</b></div><div>剩餘光點<b id="lLeft">0</b></div></div>
  <button class="btn" id="lRetry">再試一次</button>
  <div class="row2"><button class="btn sec" id="lSelect">關卡選擇</button><button class="btn sec" id="lHome">主選單</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機關</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定・成就</h2>
  <div class="helpscroll" style="max-height:60vh">
    <div class="setrow"><button class="sw" role="switch" aria-checked="true" id="swSound"><span>音效</span><span class="trk"></span></button></div>
    <div class="setrow"><button class="sw" role="switch" aria-checked="true" id="swVib"><span>震動</span><span class="trk"></span></button></div>
    <div class="setrow"><button class="sw" role="switch" aria-checked="false" id="swPad"><span>虛擬方向鍵</span><span class="trk"></span></button></div>
    <div class="setrow"><button class="sw" role="switch" aria-checked="false" id="swAssist"><span>輔助模式（影蛾速度 −15%）</span><span class="trk"></span></button></div>
    <h3>螢火蟲光色</h3>
    <div class="skins" id="skins"></div>
    <h3>統計</h3>
    <div class="stats" id="stats"></div>
    <h3>成就</h3>
    <div id="achs"></div>
  </div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="shareOv"><div class="card">
  <h2>分享成績</h2>
  <p>長按或右鍵圖片即可儲存。</p>
  <img id="shareImg" alt="成績圖片">
  <button class="btn" id="shOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>

<script>
/*CORE-START*/
// ===== 螢火迷宮 core: deterministic fixed-step simulation (60 ticks/s), maze data + generator =====
