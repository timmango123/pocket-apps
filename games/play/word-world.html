<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();

  note(a, 0, 0.18, 'triangle', 0.25, 1.2); note(b, 0.09, 0.28, 'sine', 0.22);
}
function poke(type) { if (!ac) return; note(R(600, 900), 0, 0.15, 'sine', 0.25, 1.6); }
function jingle() { if (!ac) return; [0, 2, 4, 2, 5, 4].forEach((k, i) => note(PENTA[k], i * 0.16, 0.3, 'triangle', 0.2)); }

// ================= UI =================
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 3500); }
function buildChips() {
  const box = $('chips'); box.innerHTML = '';
  const order = WORDS.filter(w => w[0] !== 'night' && w[0] !== 'ghost');
  order.push(BY_ID.night, BY_ID.ghost);
  order.forEach(w => {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.setAttribute('role', 'listitem'); b.dataset.id = w[0];
    b.style.background = w[3]; b.innerHTML = `${w[1]}<small>${w[2]}</small>`; b.setAttribute('aria-label', `${w[1]} ${w[2]}`);
    b.onclick = () => { ensureAudio(); addWord(w[0]); };
    box.appendChild(b);
  });
  updateUI();
}
function updateUI() {
  $('dexCount').textContent = found.size; $('dexTotal').textContent = WORDS.length;
  document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('found', found.has(ch.dataset.id)));
}
$('form').addEventListener('submit', ev => {
  ev.preventDefault(); ensureAudio();
  const v = $('word').value; if (!hasVisible(v)) { toast('先輸入一個字吧！例如「貓」'); return; }
  const ids = parse(v);
  if (ids.length) ids.forEach((id, i) => setTimeout(() => addWord(id), i * 250));
  else addBlob(v);
  $('word').value = '';
});
$('clearBtn').onclick = () => { ensureAudio(); ents.length = 0; parts.forEach(p => p.life = 0); snowCover = 0; puddle = 0; windT = 0; danceT = 0; seed(); toast('小世界重新開始了'); };
function setMute() { $('muteBtn').textContent = muted ? '✕' : '♪'; $('muteBtn').setAttribute('aria-pressed', String(muted)); if (master) master.gain.value = muted ? 0 : 0.35; }
$('muteBtn').onclick = () => { muted = !muted; store.set('muted', muted); ensureAudio(); setMute(); };
$('dexBtn').onclick = () => {
  const g = $('dexGrid'); g.innerHTML = '';
  WORDS.forEach(w => { const d = document.createElement('div'); const on = found.has(w[0]); d.className = on ? 'on' : ''; d.innerHTML = on ? `${w[1]}<small>${w[2]}</small>` : '？<small>???</small>'; g.appendChild(d); });
  $('dexMsg').textContent = found.size >= WORDS.length ? '全部收集完成！你是小世界的造物主' : `已發現 ${found.size} / ${WORDS.length} 個會動的字。試試看各種組合吧！`;
  $('dexOv').hidden = false; $('dexClose').focus();
};
$('dexClose').onclick = () => { $('dexOv').hidden = true; };
$('dexOv').addEventListener('click', ev => { if (ev.target === $('dexOv')) $('dexOv').hidden = true; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('dexOv').hidden = true; });

// 點擊世界裡的東西
cv.addEventListener('pointerdown', ev => {
  ensureAudio();
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, bd = U * 1.1;
  for (const e of ents) { if (e.dying || e.type === 'water' || e.type === 'mountain') continue; const ey = SKY[e.type] || FLY[e.type] || e.type === 'bird' ? e.y : e.y - U * .45; const d = Math.hypot(e.x - x, ey - y); if (d < bd) { bd = d; best = e; } }
  if (!best && pond() && inPond(x, y)) { spawnPart('ripple', x, y, 0, 0, 1.2); poke(); for (const f of all('fish')) { f.tx = x; f.ty = y; } return; }
  if (best) {
    best.jump = 1; poke(best.type); hearts(best, 2);
    const voice = { cat: '喵！', dog: '汪汪！', duck: '呱！', frog: '呱呱', bird: '啾啾', bear: '呵呵', rabbit: '嘿！', penguin: '嘎！', sun: '早安！', moon: '晚安…', blob: best.label, ghost: '噗～', fish: '咕嚕', tree: '沙沙', rock: '…zzz', snowman: '好冷～' }[best.type];
    if (voice) say(best, voice);
    if (best.type === 'ball') { best.vx = (best.x - x) * 8 + R(-100, 100); best.vz = 300; }
    if (best.type === 'cloud' || best.type === 'rain') for (let i = 0; i < 6; i++) spawnPart('drop', best.x + R(-U, U), best.y + U * .3, 0, 250, 3, groundY(Math.random()));
    if (best.type === 'tree' && best.grow > .6 && ents.filter(o => o.type === 'apple' && !o.dying && Math.abs(o.x - best.x) < U * 1.5).length < 5) { const a = make('apple'); a.x = best.x + R(-U * .4, U * .4); a.y = best.y - U * 1.6 * best.grow; a.falling = 1; a.ty = best.y + R(5, U * .5); a.vy = 0; trim(); }
  } else sparkle(x, y, 6);
});
cv.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); const live = ents.filter(e => isAnimal(e)); const e = live.length ? pick(live) : null; if (e) { e.jump = 1; hearts(e, 2); poke(); } } });

// ================= 版面 =================
function resize() {
  const r = $('stage').getBoundingClientRect();
  const oW = W, oH = H, oGY = GY;
  W = Math.max(200, r.width); H = Math.max(200, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  GY = Math.round(H * 0.5); U = clamp(Math.min(W / 9, H / 9), 30, 58);
  if (oW && ents.length) for (const e of ents) {
    const map = y => y > oGY ? GY + (y - oGY) * (H - GY) / (oH - oGY) : y * GY / oGY;
    e.x *= W / oW; e.y = map(e.y); e.tx *= W / oW; e.ty = map(e.ty);
    if (e.type === 'water') { e.rx = Math.min(W * 0.3, U * 2.8); e.ry = e.rx * 0.33; }
  }
}
function seed() {
  dayTarget = 1;
  const s = make('sun'); place(s); s.born = 1;
  const t = make('tree'); place(t); t.x = W * 0.22; t.y = groundY(0.15); t.grow = 1; t.born = 1;
  for (let i = 0; i < 3; i++) { const f = make('grass'); place(f); f.grow = 1; f.born = 1; }
  const fl = make('flower'); place(fl); fl.grow = 1; fl.born = 1;
  const cl = make('cloud'); place(cl); cl.x = W * 0.3; cl.born = 1;
  setTimeout(() => toast('也可以直接點下面的字卡喔'), 4200);
}

let last = performance.now(), running = true, loopTok = 0;
// 每次排程都帶一個代號；切回前景時換新代號，舊的、被瀏覽器暫存的回呼就不會再跑，所以永遠只有一條迴圈
function schedule() { const tok = ++loopTok; requestAnimationFrame(now => frame(now, tok)); }
function frame(now, tok) {
  if (!running || tok !== loopTok) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  schedule();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; loopTok++; if (ac) ac.suspend(); }
  else { running = true; last = performance.now(); if (ac) ac.resume(); schedule(); }
});
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 100); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});

window.__ww = { parse, addWord, addBlob, ents, state: () => ({ n: ents.length, day, snowCover, pond: !!pond(), found: found.size, types: ents.map(e => e.type + (e.state ? ':' + e.state : '')) }), step: (s) => { for (let i = 0; i < s * 30; i++) update(1 / 30); } };

resize(); buildChips(); setMute(); seed();
schedule();
})();
</script>
