<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>果嶺彈珠</title>
<style>
:root{
  --bg:#f4ecd8; --bg2:#ebe0c6; --ink:#4a3626; --ink2:#7d6650; --card:#fffaf0; --card2:#f6eedb; --line:#e3d5b8;
  --grass:#6fb36a; --wood:#b07a4a; --wood2:#8d5d34; --accent:#5e9f59; --accent2:#4b8547; --gold:#f2b632; --red:#e0604e; --shadow:#5a3e2433;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1d1a; --bg2:#222621; --ink:#efe6d2; --ink2:#b9ab92; --card:#262a24; --card2:#2e332c; --line:#3a4036;
    --grass:#2f5d3a; --wood:#5b4330; --wood2:#3f2e20; --accent:#4f9a55; --accent2:#3d7c43; --shadow:#00000066; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:grid;place-items:center;flex:none;position:relative}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:48px;box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.hole{font-weight:800;font-size:16px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap;margin-top:2px}
.dbar{width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.dbar i{display:block;height:100%;border-radius:3px}
.stat{text-align:right;font-size:12px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.stat b{color:var(--ink);font-size:16px}
.est{color:var(--gold);letter-spacing:1px;font-size:12px}.est .off{color:var(--line)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:48px;min-width:92px;padding:0 14px;border-radius:24px;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;white-space:nowrap}
.pill svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill[aria-pressed="true"]{background:var(--accent);color:#fff}.pill[aria-pressed="true"] svg{stroke:#fff}
.pill .coin{background:var(--gold);color:#5a3e10;border-radius:10px;font-size:12px;padding:1px 7px;font-weight:800}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86) rotate(-1deg);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--line),0 18px 50px var(--shadow);padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);position:relative;margin:auto}
.card::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--line);border-radius:17px;pointer-events:none}
.card h2{margin:4px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent2);position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.warm{background:#e9894e;box-shadow:0 4px 0 #b9612f}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--line);line-height:1.1}
.stars .on{color:var(--gold);text-shadow:0 3px 0 #c98a12;display:inline-block;animation:starpop .55s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-50deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;flex-direction:column;justify-content:space-between}
.ttl{text-align:center;margin-top:7vh}
.ttl h1{font-size:50px;margin:0;letter-spacing:6px;color:var(--ink);text-shadow:0 4px 0 var(--card),0 8px 0 var(--wood)}
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:14px;font-size:15px;letter-spacing:1px}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 24px 12px}
.tbtns .btn{max-width:320px}
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(var(--sab) + 20px);touch-action:pan-y}
.gsec{margin:10px 0 4px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink2)}
.gsec .dbar{width:60px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(10,1fr)}}
.lt{min-height:58px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:5px 2px}
.lt .n{font-size:17px;font-weight:800;line-height:1;display:flex;align-items:center;gap:2px}
.lt .n svg{width:12px;height:14px}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}.lt .st .on{color:var(--gold)}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.done{background:color-mix(in srgb,var(--grass) 22%,var(--card))}
.lt.cur{outline:3px solid var(--gold)}
.lt.lock{opacity:.55}
.lt.lock svg.lk{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:translateY(2px)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:8;background:#3b2a1ce8;color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:64px;height:64px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}.mech b{color:var(--ink);font-size:15px}
.scroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.kv{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:15px}.kv b{font-size:16px}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.skin{border-radius:14px;background:var(--card2);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;min-height:44px}
.skin canvas{width:40px;height:40px}
.skin.sel{outline:3px solid var(--accent)}
.skin[disabled]{opacity:.45}
.skin small{font-size:11px;color:var(--ink2);font-weight:600}
#shareImg{max-width:100%;max-height:46vh;border-radius:12px;margin-top:8px;-webkit-touch-callout:default}
@media (max-height:600px){ .ov{align-items:flex-start} .ttl{margin-top:2vh}.ttl h1{font-size:38px} }
@media (orientation:landscape) and (max-height:500px){
  .bottom{left:auto;top:0;bottom:0;flex-direction:column;justify-content:center;padding:8px calc(var(--sar) + 10px) 8px 0}
  .pill{min-width:84px}
  .hud{right:auto;width:200px;flex-wrap:wrap;justify-content:space-between}
  .hmid{order:3;flex-basis:100%;height:auto;padding:8px 12px;flex-direction:column;align-items:flex-start;gap:4px}
  .stat{text-align:left}
  .toast{left:auto;right:calc(var(--sar) + 110px);transform:none;top:calc(var(--sat) + 10px)}
  #title{flex-direction:row;align-items:center}
  .ttl{margin:0 0 30vh;flex:1}.tbtns{flex:1;padding:0 24px}
}
</style>

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">玩法</button></div>
  <div class="row2"><button class="btn sec" id="pSkin">球皮膚</button><button class="btn sec" id="pStats">統計</button></div>

</div></div>

<script>
/*CORE-START*/
// ===== 果嶺彈珠 core: world, deterministic fixed-step physics, level build, solver =====
var GW = 360, GH = 640, BR = 5, DT = 1 / 120, VMAX = 780, REST = 0.78, REST_B = 0.86, PULLMAX = 180;
var STOP_V = 4, STOP_TICKS = 30, HOLE_VMAX = 420, MAXTICKS = 2400;
var MU = [0.9, 3.2, 0.25];            // grass, sand, ice  (exponential, per second)
var RRES = [14, 30, 4];               // small constant rolling resistance so balls actually stop (px/s^2)
var FRK = MU.map(function (m) { return Math.exp(-m * DT); });
var RAS = 2, RW = GW / RAS, RH = GH / RAS, BKS = 32, BKW = Math.ceil(GW / BKS), BKH = Math.ceil(GH / BKS);
// zone types
var Z_SAND = 1, Z_ICE = 2, Z_WATER = 3, Z_SLOPE = 4, Z_RAMP = 5;

function buildLevel(d) {
  var solid = new Uint8Array(RW * RH), i, j, k, r;
  solid.fill(1);
  function fillR(r, v) {
    var x0 = Math.max(0, Math.ceil(r[0] / RAS)), x1 = Math.min(RW, Math.floor((r[0] + r[2]) / RAS));
    var y0 = Math.max(0, Math.ceil(r[1] / RAS)), y1 = Math.min(RH, Math.floor((r[1] + r[3]) / RAS));
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) solid[y * RW + x] = v;
  }
  for (i = 0; i < d.f.length; i++) fillR(d.f[i], 0);
  var blocks = d.q || [];
  for (i = 0; i < blocks.length; i++) fillR(blocks[i], 1);
  function S(x, y) { return (x < 0 || y < 0 || x >= RW || y >= RH) ? 1 : solid[y * RW + x]; }
  var segs = [];
  // horizontal edges
  for (var y = 0; y <= RH; y++) {
    var run = 0, rs = 0;
    for (var x = 0; x <= RW; x++) {
      var t = 0;
      if (x < RW) { var a = S(x, y - 1), b = S(x, y); t = (a !== b) ? (b ? -1 : 1) : 0; } // +1: floor below (normal +y)
      if (t !== run) {
        if (run) segs.push([rs * RAS, y * RAS, x * RAS, y * RAS, 0, run]);
        run = t; rs = x;
      }
    }
  }
  for (var x2 = 0; x2 <= RW; x2++) {
    var run2 = 0, rs2 = 0;
    for (var y2 = 0; y2 <= RH; y2++) {
      var t2 = 0;
      if (y2 < RH) { var a2 = S(x2 - 1, y2), b2 = S(x2, y2); t2 = (a2 !== b2) ? (b2 ? -1 : 1) : 0; }
      if (t2 !== run2) {
        if (run2) segs.push([x2 * RAS, rs2 * RAS, x2 * RAS, y2 * RAS, run2, 0]);
        run2 = t2; rs2 = y2;
      }
    }
  }

    ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(S.x, S.y, BR + 5, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = 'hsl(' + (120 - 120 * A.pow) + ',80%,55%)'; ctx.beginPath(); ctx.arc(S.x, S.y, BR + 5, -Math.PI / 2, -Math.PI / 2 + 6.283 * A.pow); ctx.stroke();
  } else if (canShoot() && !look) {
    var pulse = 0.5 + 0.5 * Math.sin(time * 4); ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.35 * pulse) + ')'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(S.x, S.y, BR + 3 + pulse * 3, 0, 6.3); ctx.stroke();
  }
  // particles
  for (i = 0; i < particles.length; i++) { var q = particles[i]; ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; if (q.sq) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot || 0); ctx.fillRect(-q.r, -q.r * 0.6, q.r * 2, q.r * 1.2); ctx.restore(); } else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.3); ctx.fill(); } }
  ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // drag UI (screen space)
  if (aim) {
    var sh = pullShot(aim.sx - aim.cx, aim.sy - aim.cy);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.cx, aim.cy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(aim.sx, aim.sy, 6, 0, 6.3); ctx.fill();
    // power badge
    ctx.font = 'bold 13px system-ui,sans-serif'; ctx.textAlign = 'center';
    var bx = aim.cx, by = aim.cy - 46; if (by < 70) by = aim.cy + 50;
    ctx.fillStyle = 'rgba(40,28,18,0.75)'; rrect(ctx, bx - 30, by - 13, 60, 22, 11); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(sh.cancel ? '取消' : Math.round(sh.pow * 100) + '%', bx, by + 3);
    var c = cancelZone(), inside = inCancel(aim.cx, aim.cy);
    ctx.fillStyle = inside ? 'rgba(224,96,78,0.9)' : 'rgba(40,28,18,0.45)'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(c.x - 8, c.y - 8); ctx.lineTo(c.x + 8, c.y + 8); ctx.moveTo(c.x + 8, c.y - 8); ctx.lineTo(c.x - 8, c.y + 8); ctx.stroke();
    ctx.fillStyle = dark ? '#efe6d2' : '#4a3626'; ctx.font = 'bold 11px system-ui,sans-serif'; ctx.fillText('取消', c.x, c.y + c.r + 13);
  }
  if (look) { ctx.fillStyle = 'rgba(40,28,18,0.6)'; ctx.font = 'bold 12px system-ui,sans-serif'; ctx.textAlign = 'center'; var ty = $('bottom').getBoundingClientRect().top - 12; ctx.fillText('觀察模式中・再按一次「觀察」回到擊球', W / 2, ty); }
}
function currentAim() {
  if (!canShoot()) return null;
  if (aim) { var sh = pullShot(aim.sx - aim.cx, aim.sy - aim.cy); if (sh.cancel) return null; return sh; }
  if (kbAim) return kbAim;
  return null;
}
function drawAimLine(ang, pow, col, isHint) {
  var pts = previewPath(L, S, ang, pow, isHint ? 900 : 300, isHint);
  if (levelN > 60 && !isHint) pts = pts.slice(0, Math.max(2, Math.ceil(pts.length * 0.4)));
  ctx.strokeStyle = col; ctx.lineWidth = isHint ? 2 : 1.8; ctx.setLineDash([3, 4]); ctx.lineDashOffset = -performance.now() / 60; ctx.lineCap = 'round';
  ctx.beginPath(); for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); ctx.setLineDash([]);
  // direction arrow
  var ax = S.x + Math.cos(ang) * (BR + 8 + 22 * pow), ay = S.y + Math.sin(ang) * (BR + 8 + 22 * pow);
  ctx.fillStyle = col; ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -4); ctx.lineTo(-3, 4); ctx.fill(); ctx.restore();
}
function drawTitleDecor(time) {
  // little paper course scene on title
  var land = W > H && H < 500, cx = land ? W * 0.25 : W / 2, cy = land ? H * 0.74 : H * 0.52, s = land ? H / 640 : Math.min(W, H) / 400;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = TH.shadow; rrect(ctx, -136, -86, 280, 180, 18); ctx.fill();
  ctx.fillStyle = TH.woodSide; rrect(ctx, -140, -92, 280, 180, 18); ctx.fill();
  ctx.fillStyle = TH.wood; rrect(ctx, -140, -96, 280, 180, 18); ctx.fill();
  ctx.fillStyle = TH.grass; rrect(ctx, -118, -74, 236, 136, 12); ctx.fill();
  ctx.fillStyle = TH.sand; rrect(ctx, -90, 10, 60, 34, 14); ctx.fill();
  ctx.fillStyle = TH.water; rrect(ctx, 30, -60, 54, 30, 12); ctx.fill();
  ctx.fillStyle = TH.hole; ctx.beginPath(); ctx.ellipse(70, 30, 9, 8, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = TH.paper; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(70, 30); ctx.lineTo(70, -12); ctx.stroke();
  ctx.fillStyle = TH.flag; ctx.beginPath(); ctx.moveTo(70, -12); ctx.lineTo(92, -5 + Math.sin(time * 4) * 2); ctx.lineTo(70, 2); ctx.fill();
  var u = (time * 0.35) % 1, bx = -80 + 150 * u, by = 40 - 60 * Math.sin(u * Math.PI) * 0.4 - 10 * u;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(-80, 40); ctx.quadraticCurveTo(0, -10, 70, 30); ctx.stroke(); ctx.setLineDash([]);
  var q = u, px = (1 - q) * (1 - q) * -80 + 2 * (1 - q) * q * 0 + q * q * 70, py = (1 - q) * (1 - q) * 40 + 2 * (1 - q) * q * -10 + q * q * 30;
  ctx.save(); ctx.translate(px, py); ctx.scale(1.8, 1.8); drawBallAt(ctx, 0, 0, skin, time * 6); ctx.restore();
  ctx.restore();
}

/* ---------------- main loop ---------------- */
var last = performance.now(), acc = 0, hidden = false;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (hidden) return;
  if (L && (status === 'play' || status === 'sinking')) {
    acc += dt; var n = 0;
    while (acc >= DT && n < 24) { physTick(); acc -= DT; n++; }
    if (n >= 24) acc = 0;
  } else acc = 0;
  if (status === 'sinking' || status === 'won') holeT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt);
  for (var i = particles.length - 1; i >= 0; i--) { var p = particles[i]; p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; if (p.g) p.vy += p.g * dt; if (p.rot != null) p.rot += dt * 8; }
  for (i = 0; i < ripples.length; i++) ripples[i].t += dt;
  draw(now);
}
document.addEventListener('visibilitychange', function () {
  hidden = document.hidden;
  if (hidden) { if (status === 'play' && !S.mv) { pause(); } if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) {} } }
  else { last = performance.now(); if (AC) { try { AC.resume(); } catch (e) {} } }
});
setMuteIcon(); layout(); requestAnimationFrame(frame);

window.__game = {
  state: function () { return S ? { x: S.x, y: S.y, vx: S.vx, vy: S.vy, t: S.t, mv: S.mv, sw: S.sw, sx: S.sx, sy: S.sy, strokes: strokes, status: status, level: levelN, par: L.d.par } : { status: status }; },
  start: function (n) { startLevel(n); if (status === 'intro') { showOnly(null); status = 'play'; } },
  view: function () { return { s: view.s, rot: view.rot }; }
};
})();

</script>
