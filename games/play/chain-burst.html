<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#021a2e">
<title>深海螢光</title>
<style>
:root{
  --bg:#021a2e; --ink:#e6fbff; --ink2:#8fb9cc; --card:#08304cdd; --card2:#0b3a5aee; --line:#7df9ff33; --acc:#7df9ff; --acc2:#ff9de2; --gold:#ffd36e; --btn:#7df9ff; --btnink:#022338; --sec:#0f4466; --pip:#1d4a66; --ov:#01101ccc;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
:root[data-theme="light"]{
  --bg:#bfe9ff; --ink:#0b3550; --ink2:#3f6a84; --card:#ffffffd9; --card2:#fffffff2; --line:#0b4a6e22; --acc:#0a8fb0; --acc2:#d94fa8; --gold:#e6a000; --btn:#0a8fb0; --btnink:#fff; --sec:#e3f4fc; --pip:#cfe3ee; --ov:#d8f1ffcc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px)}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.dots{display:inline-flex;gap:2px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--pip)}
.hstat{display:flex;gap:10px;align-items:center;white-space:nowrap}
.hs{font-size:11px;color:var(--ink2);text-align:right;line-height:1.1}
.hs b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.hs.ok b{color:var(--acc)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.bar u{position:absolute;top:-3px;bottom:0;width:2px;background:var(--gold)}
.hint{position:fixed;left:50%;bottom:calc(var(--sab) + 16px);transform:translateX(-50%);z-index:4;pointer-events:none;
  background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;
  animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:var(--ov);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.card{background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:22px 20px;width:min(360px,100%);text-align:center;
  box-shadow:0 20px 60px #0007;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:17px;background:var(--btn);color:var(--btnink);
  box-shadow:0 0 22px #7df9ff44}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0;font-size:15px}
.stars{font-size:42px;letter-spacing:6px;margin:4px 0;color:var(--pip);line-height:1.1}
.stars .on{color:var(--gold);text-shadow:0 0 16px #ffd36e99;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-50deg)}to{transform:none}}
.res{display:flex;justify-content:center;gap:20px;margin:4px 0 4px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between}
.ttl{text-align:center;margin-top:8vh}
.ttl h1{margin:0;font-size:52px;letter-spacing:8px;font-weight:900;color:var(--ink);text-shadow:0 0 18px #7df9ffaa,0 0 40px #7df9ff55}
:root[data-theme="light"] .ttl h1{text-shadow:0 3px 0 #fff,0 0 30px #0a8fb055}
.ttl .sub{margin-top:8px;font-size:15px;color:var(--ink2);font-weight:600;letter-spacing:1px}
.tbtns{width:min(320px,100%);display:flex;flex-direction:column;align-items:stretch;margin-bottom:12px}
/* select */
#select{align-items:stretch;padding:0;background:var(--ov)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;white-space:nowrap}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--pip);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--acc)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px calc(var(--sar) + 12px) calc(var(--sab) + 20px) calc(var(--sal) + 12px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
@media (min-aspect-ratio:3/2){.grid{grid-template-columns:repeat(10,1fr)}}
.lt{height:66px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--pip);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .dots i{width:5px;height:5px}
.lt.done{border-color:#7df9ff66}
.lt.cur{outline:2px solid var(--acc);box-shadow:0 0 16px #7df9ff55}
.lt.lock{opacity:.45}
.lt.lock svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.94)}
.toast{position:fixed;left:50%;width:max-content;top:calc(var(--sat) + 66px);transform:translateX(-50%);z-index:30;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s;box-shadow:0 8px 30px #0005}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--sec);border:1px solid var(--line);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:60px;height:60px;border-radius:12px;background:#021a2e}
:root[data-theme="light"] .mech canvas{background:#d6f1ff}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.scroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.setrow{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;gap:8px}
.setrow:last-child{border:0}
.seg{display:flex;background:var(--sec);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{min-height:38px;min-width:48px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;background:var(--sec);color:var(--ink2)}
.ach.on i{background:var(--gold);color:#3a2a00;box-shadow:0 0 14px #ffd36e88}
.ach div{font-size:13px;color:var(--ink2);line-height:1.35}.ach b{color:var(--ink);font-size:14px;display:block}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.stgrid div{background:var(--sec);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px;color:var(--ink2);text-align:center}
.stgrid b{display:block;font-size:20px;color:var(--ink)}
.replay{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap}
@media (max-height:600px){.ov{align-items:flex-start}#title{justify-content:center;align-items:center}.ttl{margin-top:0}.ttl h1{font-size:38px}.ttl .sub{margin-top:4px}.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;width:min(560px,100%);margin-top:8px}.tbtns .row2{display:contents}.tbtns .btn{min-height:46px;font-size:15px}}
@media (hover:hover){.lt:hover{border-color:var(--acc)}.btn:hover{filter:brightness(1.08)}}
</style>

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLv">第 1 關</div>
      <div class="diff" id="hDiff">難度 <span id="hDiffN">1</span><span class="dots" id="hDots"></span></div>
    </div>
    <div class="hstat">
      <div class="hs">目標<b id="hT">4</b></div>
      <div class="hs" id="hsC">引爆<b id="hC">0/12</b></div>
    </div>
    <div class="bar"><i id="hBar"></i><u id="hMark"></u></div>
  </div>
  <button class="ibtn" id="bRetry" aria-label="重試"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
</div>
<div class="hint hidden" id="hint"></div>
<button class="replay hidden" id="replayTag" aria-label="跳過重播">慢動作重播 0.3× ・ 點此跳過</button>

<div class="ov" id="title">
  <div class="ttl"><h1>深海螢光</h1><div class="sub">只點一下・讓水母一隻接一隻連鎖發光</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始潛水</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2"><button class="btn sec" id="tDaily">每日挑戰</button><button class="btn sec" id="tStats">紀錄・成就</button></div>
    <div class="row2"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tSet">設定</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRetry">重試</button><button class="btn sec" id="pSet">設定</button></div>
  <div class="row2"><button class="btn sec" id="pHelp">說明</button><button class="btn sec" id="pSelect">關卡選擇</button></div>
  <button class="btn sec" id="pHome">回到標題</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">連鎖成功！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>引爆<b id="wC">0</b></div><div>目標<b id="wT">0</b></div><div>最佳<b id="wB">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wReplay">慢動作重播</button></div>
  <div class="row2"><button class="btn sec" id="wShare">分享</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2 id="fTitle">光芒熄滅了</h2>
  <div class="res"><div>引爆<b id="fC">0</b></div><div>目標<b id="fT">0</b></div></div>
  <p id="fMsg"></p>
  <button class="btn" id="fRetry">再試一次</button>
  <div class="row2"><button class="btn sec" id="fReplay">慢動作重播</button><button class="btn sec" id="fSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新的水母</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="scroll" style="max-height:none">
    <div class="setrow"><span>音效</span><button class="sw" role="switch" id="sSnd" aria-checked="true" aria-label="音效"><span class="trk"></span></button></div>
    <div class="setrow"><span>震動回饋</span><button class="sw" role="switch" id="sVib" aria-checked="true" aria-label="震動回饋"><span class="trk"></span></button></div>
    <div class="setrow"><span>瞄準輔助</span><button class="sw" role="switch" id="sAim" aria-checked="true" aria-label="瞄準輔助"><span class="trk"></span></button></div>
    <div class="setrow"><span>主題</span><div class="seg" id="sTheme"><button data-v="auto">自動</button><button data-v="dark">深海</button><button data-v="light">淺海</button></div></div>
  </div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>紀錄・成就</h2>
  <div class="scroll" id="statsBody"></div>
  <button class="btn" id="stOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>

function bgInit(){ if (motes.length) return; for (var i = 0; i < 60; i++) motes.push({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.8, s: 0.008 + Math.random() * 0.02, p: Math.random() * 6.28, a: 0.25 + Math.random() * 0.5 }); }
function drawBg(t){
  screenXform();
  var g = ctx.createLinearGradient(0, 0, 0, H);
  if (LIGHT){ g.addColorStop(0, '#e9f8ff'); g.addColorStop(1, '#bfe9ff'); } else { g.addColorStop(0, '#06304d'); g.addColorStop(1, '#021a2e'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // light rays from the surface
  ctx.globalCompositeOperation = LIGHT ? 'source-over' : 'lighter';
  for (var i = 0; i < 4; i++){
    var cx = W * (0.15 + i * 0.27) + Math.sin(t * 0.15 + i * 1.7) * W * 0.08, w = W * (0.07 + 0.03 * i % 2);
    var rg = ctx.createLinearGradient(0, 0, 0, H * 0.85);
    rg.addColorStop(0, LIGHT ? 'rgba(255,255,255,0.45)' : 'rgba(125,249,255,0.07)'); rg.addColorStop(1, 'rgba(125,249,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(cx - w * 0.4, 0); ctx.lineTo(cx + w * 0.4, 0); ctx.lineTo(cx + w * 1.6 + W * 0.1, H * 0.85); ctx.lineTo(cx - w * 0.2 + W * 0.1, H * 0.85); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (i = 0; i < motes.length; i++){
    var m = motes[i], y = 1 - ((m.p * 0.16 + t * m.s) % 1.1), x = m.x + Math.sin(t * 0.4 + m.p) * 0.01;
    ctx.globalAlpha = m.a * (LIGHT ? 0.8 : 1);
    ctx.fillStyle = LIGHT ? '#ffffff' : '#9fe9ff';
    ctx.beginPath(); ctx.arc(x * W, y * H, m.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFieldFrame(){
  screenXform();
  ctx.fillStyle = LIGHT ? 'rgba(11,74,110,0.07)' : 'rgba(0,8,16,0.35)';
  ctx.fillRect(0, 0, W, FOY); ctx.fillRect(0, FOY + FHS, W, H - FOY - FHS); ctx.fillRect(0, FOY, FOX, FHS); ctx.fillRect(FOX + FWS, FOY, W - FOX - FWS, FHS);
  ctx.strokeStyle = LIGHT ? 'rgba(11,74,110,0.18)' : 'rgba(125,249,255,0.12)'; ctx.lineWidth = 1;
  rr(FOX + 0.5, FOY + 0.5, FWS - 1, FHS - 1, 14); ctx.stroke();
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- jelly drawing (logical units, ctx in field transform) ---------- */
function drawJelly(c, j, x, y, t, hi, vx, vy, scl){
  var k = j.k, col = k === K_DARK ? DARKJ : k === K_ABS ? ABS : (LIGHT ? HUES_L : HUES)[j.hue];
  var base = k === K_BIG ? 15.5 : k === K_KID ? 6.5 : 10.5;
  var r = base * (scl || 1), pul = 1 + 0.09 * Math.sin(t * 5.236 + j.ph);
  c.save(); c.translate(x, y); if (land) c.rotate(Math.PI / 2);
  var svx = land ? vy : vx;
  if (k !== K_DARK && !LIGHT){ c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.85; var gs = r * 5.2; c.drawImage(k === K_ABS ? GLOWA : GLOW[j.hue], -gs/2, -gs/2, gs, gs); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
  if (hi){ c.strokeStyle = LIGHT ? '#0b3550' : '#ffffff'; c.globalAlpha = 0.55 + 0.35 * Math.sin(t * 12); c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * 1.75, 0, 6.283); c.stroke(); c.globalAlpha = 1; }
  // tentacles
  var rx = r * pul, ry = r * (2 - pul) * 0.92, by = r * 0.28;
  c.strokeStyle = col; c.globalAlpha = 0.75; c.lineWidth = Math.max(0.8, r * 0.12); c.lineCap = 'round';
  c.beginPath();
  for (var i = 0; i < 4; i++){
    var x0 = (-0.6 + 0.4 * i) * rx, sw = Math.sin(t * 3.2 + j.ph + i * 1.3) * r * 0.22 - svx * 0.035 * (r / 10);
    c.moveTo(x0, by); c.bezierCurveTo(x0 + sw, by + r * 0.55, x0 - sw, by + r * 1.0, x0 + sw * 1.5, by + r * (1.5 + 0.12 * Math.sin(t * 5.236 + j.ph + i)));
  }
  c.stroke(); c.globalAlpha = 1;
  // bell
  c.beginPath(); c.ellipse(0, by, rx, ry * 1.15, 0, Math.PI, 0);
  for (i = 0; i < 4; i++){ var xa = rx - (i + 1) * rx / 2; c.quadraticCurveTo(xa + rx / 4, by + r * 0.24, xa, by); }
  c.closePath();
  if (k === K_ABS){ c.fillStyle = '#05030a'; c.fill(); c.strokeStyle = ABS; c.lineWidth = 2.2; c.stroke();
    c.strokeStyle = rgba('#d9b3ff', .8); c.lineWidth = 1.2; c.beginPath(); c.arc(0, by - r * 0.35, r * 0.42, t * 4, t * 4 + 2.2); c.stroke(); c.beginPath(); c.arc(0, by - r * 0.35, r * 0.42, t * 4 + 3.14, t * 4 + 5.3); c.stroke(); }
  else {
    c.fillStyle = col; c.globalAlpha = k === K_DARK ? 0.85 : (LIGHT ? 0.55 : 0.42); c.fill(); c.globalAlpha = 1;
    c.strokeStyle = k === K_DARK ? '#5d7196' : col; c.lineWidth = Math.max(1, r * 0.13); c.stroke();
    if (LIGHT && k !== K_DARK){ c.strokeStyle = 'rgba(11,53,80,0.35)'; c.lineWidth = 0.8; c.stroke(); }
    // inner organ & highlight
    c.fillStyle = k === K_DARK ? 'rgba(160,180,220,0.25)' : 'rgba(255,255,255,0.75)';
    c.beginPath(); c.ellipse(-rx * 0.32, by - ry * 0.62, rx * 0.2, ry * 0.13, -0.5, 0, 6.283); c.fill();
    if (k === K_SPLIT){ c.fillStyle = '#ffffff'; for (i = 0; i < 3; i++){ var a = i * 2.094 + t * 1.5; c.beginPath(); c.arc(Math.cos(a) * r * 0.32, by - r * 0.42 + Math.sin(a) * r * 0.25, r * 0.13, 0, 6.283); c.fill(); } }
    if (k === K_ARM){
      c.strokeStyle = LIGHT ? '#4b5d78' : '#e3ecff'; c.lineWidth = 1.3; c.globalAlpha = 0.9;
      c.beginPath(); for (i = 0; i < 6; i++){ var ha = i * 1.0472 + 0.5236, hx = Math.cos(ha) * r * 1.22, hy = by - r * 0.35 + Math.sin(ha) * r * 1.05; if (i) c.lineTo(hx, hy); else c.moveTo(hx, hy); } c.closePath(); c.stroke();
      c.beginPath(); for (i = 0; i < 3; i++){ var la = i * 2.094 + 1.57; c.moveTo(0, by - r * 0.35); c.lineTo(Math.cos(la) * r * 1.0, by - r * 0.35 + Math.sin(la) * r * 0.9); } c.stroke();
      if (j.hit && j.hit.length){ c.strokeStyle = '#ff6b6b'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(-r * 0.9, by - r * 1.0); c.lineTo(-r * 0.2, by - r * 0.4); c.lineTo(-r * 0.5, by - r * 0.1); c.lineTo(r * 0.3, by + r * 0.1); c.stroke(); }
      c.globalAlpha = 1;
    }
  }
  c.restore();
}
function drawRings(rings, t){
  var start = Math.max(0, rings.length - 80);
  for (var i = start; i < rings.length; i++){
    var g = rings[i], hue = g.hue == null ? RINGT : g.hue, r = g.r, a = 1;
    if (g.dead){ var u = Math.min(1, (g.age - g.deadAt) / 0.25); r = g.R * (1 - u) * 0.9 + 1; a = 1 - u; }
    else if (g.age > T_EXP + T_HOLD) a = Math.max(0, r / g.R);
    else if (g.age > T_EXP) a = 1 - 0.25 * (g.age - T_EXP) / T_HOLD;
    if (r <= 0.5) continue;
    if (!LIGHT){
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.8;
      ctx.drawImage(g.dead ? GLOWA : RING[hue], g.x - r, g.y - r, r * 2, r * 2);
      ctx.globalAlpha = a * 0.5; ctx.strokeStyle = g.dead ? ABS : HUES.concat(['#e8fdff'])[hue]; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, 6.283); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    } else {
      var hc = g.dead ? ABS : hue === RINGT ? '#0a8fb0' : HUES_L[hue];
      ctx.globalAlpha = a; ctx.fillStyle = rgba(hc, 0.13); ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#0b3d5c'; ctx.lineWidth = 2.4; ctx.globalAlpha = a * 0.75; ctx.stroke();
      ctx.strokeStyle = hc; ctx.lineWidth = 1.2; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(g.x, g.y, Math.max(0, r - 2.2), 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    }

}

/* ---------- particles ---------- */
function P(o){ parts.push(o); if (parts.length > 500) parts.shift(); }
function burst(x, y, hue, n, sp){
  var col = hue < 0 ? ABS : HUES[hue];
  for (var i = 0; i < n; i++){ var a = Math.random() * 6.283, s = (sp || 60) * (0.4 + Math.random()); P({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.7, max: 0.7, r: 1 + Math.random() * 2, col: col }); }
}
function updParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){ var q = parts[i]; q.life -= dt; if (q.life <= 0){ parts.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95; q.vy -= 8 * dt; }
  for (i = floats.length - 1; i >= 0; i--){ floats[i].life -= dt; if (floats[i].life <= 0) floats.splice(i, 1); }
}
function drawParts(){
  if (!LIGHT) ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < parts.length; i++){ var q = parts[i], u = q.life / q.max; ctx.globalAlpha = Math.min(1, u * 1.5); ctx.fillStyle = LIGHT ? '#0b4a6e' : q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.4 + 0.6 * u), 0, 6.283); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

/* ---------- simulation driving ---------- */
function handleEvents(sim, live){
  for (var i = 0; i < sim.ev.length; i++){
    var e = sim.ev[i];
    if (e.t === 'pop'){
      burst(e.x, e.y, e.k === K_DARK ? 0 : e.hue, e.k === K_KID ? 5 : 12, e.k === K_BIG ? 90 : 60);
      if (live){
        if (e.k !== K_KID){ SFX.pop(e.n); counterPop = 1; if (e.n % 10 === 0) vib(8); if (live === 2 && e.n >= sim.P.T && !goalHit){ goalHit = true; SFX.goal(); } }
        else SFX.pop(Math.max(1, sim.count));
        shake = Math.min(4, shake + (e.k === K_BIG ? 1.5 : 0.5));
      }
      curtainX = e.x; curtainY = e.y;
    } else if (e.t === 'absorb'){
      burst(e.x, e.y, -1, 18, 90); floats.push({ x: e.x, y: e.y, txt: '−1', life: 1, col: ABS });
      if (live){ SFX.absorb(); vib([10, 30, 10]); counterPop = 1; }
    } else if (e.t === 'crack'){ burst(e.x, e.y, 3, 5, 40); if (live) SFX.crack(); }
    else if (e.t === 'tap'){ if (live){ SFX.tap(); vib(12); } burst(e.x, e.y, 0, 14, 50); }
  }
  sim.ev.length = 0;
}
function colourRings(sim){ // assign ring hue from source jelly
  for (var i = 0; i < sim.rings.length; i++){ var g = sim.rings[i]; if (g.hue === undefined) g.hue = g.src < 0 ? RINGT : (sim.js[g.src].k === K_DARK ? RINGT : sim.js[g.src].hue); }
}

function startLevel(n){
  mode = 'level'; levelN = n; LV = getLevel(n); beginSim();
  var ms = MECH.filter(function(m){ return m.lv <= n && !introSeen[m.key] && (m.lv > 1 || n === 1); });
  if (ms.length){ ms.forEach(function(m){ introSeen[m.key] = 1; }); sset('intro', introSeen); showIntro(ms); }
  else { status = 'aim'; showHint(); }
}
function startDaily(){
  mode = 'daily'; LV = genLevel(0, dailyParams()); beginSim(); status = 'aim'; showHint();
}
function beginSim(){
  S = newSim(LV); acc = 0; parts.length = 0; floats.length = 0; aim.on = false; goalHit = false; curtain = 0; shownCount = 0; replaying = false; resultInfo = null;
  status = 'ready';
  showOnly(null); $('hud').classList.remove('hidden'); $('replayTag').classList.add('hidden');
  layout(); updateHud();
}
function showHint(){
  var h = $('hint');
  if (mode === 'level' && levelN <= 2) h.textContent = levelN === 1 ? '按住瞄準，放開引爆！對準水母群' : '每關只能點一下，挑最密的地方';
  else h.textContent = mode === 'daily' ? '每日挑戰：80 隻水母，看你能引爆幾隻' : '目標 ' + S.P.T + ' 隻・只能點一下';
  h.classList.remove('hidden');
  clearTimeout(showHint.t); showHint.t = setTimeout(function(){ if (!(mode === 'level' && levelN === 1)) h.classList.add('hidden'); }, 2600);
}
function updateHud(){
  var P = S.P;
  if (mode === 'daily'){ $('hLv').textContent = '每日挑戰'; $('hDiff').innerHTML = '今日最佳 ' + ((daily[P.key] || 0)); }
  else {
    $('hLv').textContent = '第 ' + levelN + ' 關';
    $('hDiff').innerHTML = '難度 ' + diffVal(levelN).toFixed(1) + ' <span class="dots">' + dotsHtml(diffDots(levelN), diffCol(levelN)) + '</span>';
  }
  $('hT').textContent = P.T;
  $('hC').textContent = Math.max(0, S.count) + '/' + P.nExp;
  $('hsC').classList.toggle('ok', S.count >= P.T);
  $('hBar').style.width = Math.max(0, Math.min(100, S.count / P.nExp * 100)) + '%';
  $('hMark').style.left = 'calc(' + (P.T / P.nExp * 100) + '% - 1px)';
}
function doTap(lx, ly){
  if (status !== 'aim' || S.tapped) return;
  if (lx < 0 || ly < 0 || lx > FW || ly > FH){ toast('已取消（放開在海域外）'); return; }
  audio();
  simTap(S, lx, ly); colourRings(S);
  lastRun = { frame: S.frame, x: lx, y: ly };
  status = 'chain'; aim.on = false; $('hint').classList.add('hidden');
  stats.taps++;
  handleEvents(S, 2);
}
function stepSim(dt){
  acc += dt * simSpeed;
  var n = 0;
  while (acc >= DT && n < 6){
    acc -= DT; n++;
    if (replaying && !S.tapped && S.frame >= lastRun.frame){ simTap(S, lastRun.x, lastRun.y); }
    simStep(S); colourRings(S); handleEvents(S, replaying ? 1 : 2);
    if (S.tapped && S.done){ acc = 0; onChainEnd(); return; }
  }
  if (n === 6) acc = 0;
}
function onChainEnd(){
  if (replaying){ replaying = false; simSpeed = 1; $('replayTag').classList.add('hidden'); status = 'result'; showResult(true); return; }
  status = 'result'; var P = S.P, c = S.count, won = c >= P.T, st = starsFor(c, P);
  stats.pops += Math.max(0, c); if (c > stats.best) stats.best = c;
  var wiped = c >= P.nExp;
  if (mode === 'daily'){
    var prev = daily[P.key] || 0; if (c > prev) daily[P.key] = c; sset('daily', daily); unlockAch('daily');
  } else if (won){
    var firstClear = !(stars[levelN] > 0);
    if (firstClear) stats.clears++;
    if (wiped){ var wk = sget('wipes', {}); if (typeof wk !== 'object') wk = {}; wk[levelN] = 1; sset('wipes', wk); stats.wipes = Object.keys(wk).length; }
    if (!prog[levelN] || c > prog[levelN]) prog[levelN] = c;
    if (!(stars[levelN] >= st)) stars[levelN] = st;
    sset('progress', prog); sset('stars', stars);
  }
  sset('stats', stats);
  if (c >= 1) unlockAch('first');
  if (c >= 50) unlockAch('fifty');
  if (stats.wipes >= 10) unlockAch('wipe10');
  var s3 = 0; for (var k in stars) if (stars[k] >= 3) s3++; if (s3 >= 30) unlockAch('star30');
  if (mode === 'level' && won && levelN === 100) unlockAch('king');
  resultInfo = { c: c, won: won, st: st, wiped: wiped, P: P };
  if (won || mode === 'daily'){ curtain = 0.001; SFX.win(); vib([20, 40, 30]); setTimeout(function(){ if (status === 'result') showResult(false); }, 900); }
  else { SFX.fail(); vib(40); setTimeout(function(){ if (status === 'result') showResult(false); }, 650); }
}
function showResult(again){
  var R = resultInfo; if (!R) return;
  var P = R.P;
  if (R.won || mode === 'daily'){
    $('wTitle').textContent = mode === 'daily' ? (R.c >= P.T ? '每日挑戰達標！' : '今日成績') : R.wiped ? '全滅！滿海螢光' : R.st === 3 ? '璀璨連鎖！' : '連鎖成功！';
    var h = ''; for (var i = 0; i < 3; i++) h += i < R.st ? '<span class="on" style="animation-delay:' + (again ? 0 : 0.15 + i * 0.18) + 's">★</span>' : '★';
    $('wStars').innerHTML = mode === 'daily' ? '' : h;
    if (!again && mode !== 'daily') for (i = 0; i < R.st; i++) (function(i){ setTimeout(function(){ SFX.star(i); }, 150 + i * 180); })(i);
    $('wC').textContent = R.c; $('wT').textContent = P.T;
    $('wB').textContent = mode === 'daily' ? (daily[P.key] || R.c) : (prog[levelN] || R.c);
    $('wMsg').textContent = mode === 'daily' ? '今天的海域每個人都一樣，明天換新的一片海。' : R.st < 3 ? '再多引爆 ' + Math.max(1, Math.ceil(P.T + (P.nExp - P.T) * 0.6) - R.c) + ' 隻就能拿到三星。' : '完美的一擊！';
    $('wNext').textContent = mode === 'daily' ? '回到標題' : levelN >= NL ? '回到關卡選擇' : '下一關';
    showOnly('win');
  } else {
    var miss = P.T - R.c;
    $('fC').textContent = R.c; $('fT').textContent = P.T;
    $('fMsg').textContent = '還差 ' + miss + ' 隻。' + (S.js.some(function(j){ return j.k === K_ABS && !j.alive; }) ? '小心紫邊的吸光水母！' : '試著瞄準水母最密集的地方。');
    showOnly('fail');
  }
}
function startReplay(){
  if (!lastRun) return;
  S = newSim(LV); acc = 0; parts.length = 0; floats.length = 0; goalHit = true; curtain = 0;
  while (S.frame < Math.max(0, lastRun.frame - 20)){ simStep(S); S.ev.length = 0; }
  replaying = true; status = 'replay'; simSpeed = 1;
  showOnly(null); $('replayTag').classList.remove('hidden');
}

/* ---------- input ---------- */
var activePtr = null;
function evPos(e){ return toLogical(e.clientX, e.clientY); }
cv.addEventListener('pointerdown', function(e){
  if (status === 'replay'){ endReplay(); return; }
  if (status !== 'aim') return;
  audio();
  activePtr = e.pointerId; try{ cv.setPointerCapture(e.pointerId); }catch(er){}
  var p = evPos(e); aim.on = true; aim.x = p.x; aim.y = p.y; aim.hover = false;
});
cv.addEventListener('pointermove', function(e){
  if (status !== 'aim') return;
  var p = evPos(e);
  if (activePtr === e.pointerId){ aim.x = p.x; aim.y = p.y; }
  else if (e.pointerType === 'mouse' && activePtr === null){ aim.on = p.x >= 0 && p.y >= 0 && p.x <= FW && p.y <= FH; aim.hover = true; aim.x = p.x; aim.y = p.y; }
});
cv.addEventListener('pointerup', function(e){
  if (activePtr !== e.pointerId) return; activePtr = null;
  var p = evPos(e); aim.on = false;
  doTap(p.x, p.y);
});
cv.addEventListener('pointercancel', function(e){ if (activePtr === e.pointerId){ activePtr = null; aim.on = false; } });
cv.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse' && activePtr === null) aim.on = false; });
function endReplay(){ replaying = false; simSpeed = 1; $('replayTag').classList.add('hidden'); status = 'result'; showResult(true); }
$('replayTag').addEventListener('click', endReplay);
document.addEventListener('keydown', function(e){
  if (e.key === 'r' || e.key === 'R'){ if (status === 'aim' || status === 'chain' || status === 'result' || status === 'ready') retry(); }
  else if (e.key === 'n' || e.key === 'N'){ if (mode === 'level' && levelN < NL && unlocked(levelN + 1) && (status === 'result' || status === 'aim')) { audio(); startLevel(levelN + 1); } }
  else if (e.key === 'Escape'){ if (status === 'aim' || status === 'chain') pause(); else if (status === 'paused') resume(); }
});
function retry(){ audio(); SFX.click(); if (mode === 'daily') startDaily(); else startLevel(levelN); }

/* ---------- overlays ---------- */
var OVS = ['title', 'select', 'pause', 'win', 'fail', 'help', 'intro', 'settings', 'stats'];
function showOnly(id){ OVS.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); }); }
var prevStatus = null, overlayBack = null;
function pause(){ if (status !== 'aim' && status !== 'chain' && status !== 'ready') return; prevStatus = status; status = 'paused'; aim.on = false; activePtr = null;
  $('pInfo').textContent = mode === 'daily' ? '每日挑戰・目標 ' + S.P.T : '第 ' + levelN + ' 關・目標 ' + S.P.T + ' / ' + S.P.nExp; showOnly('pause'); }
function resume(){ if (status !== 'paused') return; status = prevStatus === 'ready' ? 'aim' : prevStatus; lastT = performance.now(); showOnly(null); }
$('bMenu').onclick = function(){ SFX.click(); pause(); };
$('bRetry').onclick = function(){ if (status === 'aim' || status === 'chain' || status === 'result') retry(); };
$('pResume').onclick = function(){ SFX.click(); resume(); };
$('pRetry').onclick = retry;
$('pSelect').onclick = function(){ openSelect(); };
$('pHome').onclick = function(){ goTitle(); };
$('pHelp').onclick = function(){ openHelp('pause'); };
$('pSet').onclick = function(){ openSettings('pause'); };
$('wNext').onclick = function(){ audio(); SFX.click(); if (mode === 'daily') goTitle(); else if (levelN >= NL) openSelect(); else startLevel(levelN + 1); };
$('wRetry').onclick = retry; $('fRetry').onclick = retry;
$('wReplay').onclick = startReplay; $('fReplay').onclick = startReplay;
$('wSelect').onclick = function(){ mode === 'daily' ? goTitle() : openSelect(); }; $('fSelect').onclick = function(){ mode === 'daily' ? goTitle() : openSelect(); };
$('wShare').onclick = share;
$('tPlay').onclick = function(){ audio(); SFX.click(); startLevel(firstOpen()); };
$('tSelect').onclick = function(){ audio(); SFX.click(); openSelect(); };
$('tDaily').onclick = function(){ audio(); SFX.click(); startDaily(); };
$('tHelp').onclick = function(){ openHelp('title'); };
$('tSet').onclick = function(){ openSettings('title'); };
$('tStats').onclick = openStats;
$('sBack').onclick = goTitle;
$('hOk').onclick = function(){ showOnly(overlayBack); };
$('setOk').onclick = function(){ showOnly(overlayBack); };
$('stOk').onclick = function(){ showOnly('title'); };
$('iOk').onclick = function(){ audio(); SFX.click(); showOnly(null); status = 'aim'; lastT = performance.now(); showHint(); };
function goTitle(){ status = 'title'; mode = 'level'; S = null; $('hud').classList.add('hidden'); $('hint').classList.add('hidden'); $('replayTag').classList.add('hidden'); replaying = false; simSpeed = 1; showOnly('title'); layout(); demo = null; }
function openSelect(){
  status = 'select'; S = null; $('hud').classList.add('hidden'); $('hint').classList.add('hidden'); replaying = false; simSpeed = 1;
  renderGrid(); showOnly('select');
  var cur = document.querySelector('.lt.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
}
function renderGrid(){
  var sw = $('unlockSw'); sw.setAttribute('aria-checked', unlockAll ? 'true' : 'false');
  var h = '', done = 0, st = 0, fo = firstOpen();
  for (var n = 1; n <= NL; n++){
    var s = stars[n] || 0; if (s > 0){ done++; st += s; }
    var u = unlocked(n), cls = 'lt' + (s > 0 ? ' done' : '') + (u ? '' : ' lock') + (n === fo ? ' cur' : '');
    h += '<button class="' + cls + '" data-n="' + n + '" aria-label="第 ' + n + ' 關' + (u ? '' : '（未解鎖）') + '">';
    if (u){ h += '<span class="n">' + n + '</span><span class="st">'; for (var i = 0; i < 3; i++) h += i < s ? '<span class="on">★</span>' : '★'; h += '</span><span class="dots">' + dotsHtml(diffDots(n), diffCol(n)) + '</span>'; }
    else h += '<span class="n">' + n + '</span><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
    h += '</button>';
  }
  $('grid').innerHTML = h;
  $('selSum').textContent = '已通過 ' + done + ' / 100 關・星星 ' + st + ' / 300・光點越多越難';
}
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return; var n = +b.getAttribute('data-n');
  if (!unlocked(n)){ toast('先通過第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; }
  audio(); SFX.click(); startLevel(n);
});
$('unlockSw').onclick = function(){ unlockAll = !unlockAll; sset('unlockAll', unlockAll); SFX.click(); renderGrid(); };
function openHelp(back){
  overlayBack = back; if (back === 'title') status = 'title';
  var h = '<p>海裡漂著發光的水母。<b>每關只能點一下</b>：點下去的位置會擴散出一個光圈，碰到的水母會爆開並放出新的光圈，一路連鎖。</p>' +
    '<p>連鎖完全停止時，引爆數達到<b>目標</b>就過關。引爆越多星星越多，全部引爆就是「全滅」。</p>' +
    '<p>手指按住會顯示準星與光圈範圍，移動微調，<b>放開才引爆</b>；放開在海域外就取消。水母一直在漂，抓準時機！</p>' +
    '<p>電腦：滑鼠移動預覽、點擊引爆；R 重試、N 下一關、Esc 暫停。</p>';
  MECH.forEach(function(m){ var seen = m.lv === 1 || introSeen[m.key] || unlockAll; h += '<div class="mech"><canvas data-k="' + m.k + '" width="120" height="120"></canvas><div><b>' + (seen ? m.name : '？？？') + '</b>（第 ' + m.lv + ' 關起）<br>' + (seen ? m.desc : '在更深的海裡等著你。') + '</div></div>'; });
  $('helpBody').innerHTML = h; drawMechIcons($('helpBody')); showOnly('help');
}
function showIntro(ms){
  status = 'intro';
  $('iTitle').textContent = ms.length > 1 ? '這片海域的水母' : ms[0].lv === 1 ? '認識螢光水母' : '新的水母：' + ms[0].name;
  $('iBody').innerHTML = '<div class="scroll">' + ms.map(function(m){ return '<div class="mech"><canvas data-k="' + m.k + '" width="120" height="120"></canvas><div>' + (ms.length > 1 ? '<b>' + m.name + '</b><br>' : '') + m.desc + '</div></div>'; }).join('') + '</div>' + (ms[0].lv === 1 ? '<p>每關只能點一下，挑水母靠得最近的地方！</p>' : '');
  drawMechIcons($('iBody')); showOnly('intro');
}
function drawMechIcons(root){
  root.querySelectorAll('canvas[data-k]').forEach(function(c){
    var g = c.getContext('2d'), k = +c.getAttribute('data-k'), save = ctx, sl = land; ctx = g; land = false;
    g.setTransform(2, 0, 0, 2, 0, 0);
    drawJelly(g, { k: k, hue: k === K_BIG ? 1 : k === K_SPLIT ? 2 : 0, ph: 1, hit: [] }, 30, 26, 1.2, false, 0, 0, k === K_BIG ? 1.1 : 1.5);
    ctx = save; land = sl;
  });
}
function openSettings(back){
  overlayBack = back;
  $('sSnd').setAttribute('aria-checked', set.snd ? 'true' : 'false');
  $('sVib').setAttribute('aria-checked', set.vib ? 'true' : 'false');
  $('sAim').setAttribute('aria-checked', set.aim ? 'true' : 'false');
  $('sTheme').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-v') === set.theme ? 'true' : 'false'); });
  showOnly('settings');
}
function saveSet(){ sset('settings', set); if (master) master.gain.value = set.snd ? 0.6 : 0; openSettings(overlayBack); }
$('sSnd').onclick = function(){ set.snd = !set.snd; audio(); saveSet(); SFX.click(); };
$('sVib').onclick = function(){ set.vib = !set.vib; saveSet(); vib(15); };
$('sAim').onclick = function(){ set.aim = !set.aim; saveSet(); };
$('sTheme').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; set.theme = b.getAttribute('data-v'); applyTheme(); saveSet(); };
var ACH = [
  { id: 'first', name: '第一道光', d: '完成第一次連鎖' },
  { id: 'fifty', name: '連鎖大師', d: '一次點擊引爆 50 隻' },
  { id: 'wipe10', name: '一網打盡', d: '在 10 個關卡達成全滅' },
  { id: 'star30', name: '星光滿載', d: '30 個關卡拿到三星' },
  { id: 'daily', name: '每日潛水員', d: '完成一次每日挑戰' },
  { id: 'king', name: '深海之王', d: '通過第 100 關' }
];
function unlockAch(id){ if (ach[id]) return; ach[id] = Date.now(); sset('ach', ach); var a = ACH.filter(function(x){ return x.id === id; })[0]; setTimeout(function(){ toast('★ 成就解鎖：' + a.name); }, 1300); }
function openStats(){
  status = 'title';
  var cl = 0, s3 = 0; for (var k in stars){ if (stars[k] > 0) cl++; if (stars[k] >= 3) s3++; }
  var dk = dailyParams().key;
  var h = '<div class="stgrid"><div>最長連鎖<b>' + stats.best + '</b></div><div>總引爆數<b>' + stats.pops + '</b></div><div>通過關卡<b>' + cl + '</b></div><div>三星關卡<b>' + s3 + '</b></div><div>全滅關卡<b>' + stats.wipes + '</b></div><div>今日挑戰最佳<b>' + (daily[dk] || 0) + '</b></div></div>';
  ACH.forEach(function(a){ h += '<div class="ach' + (ach[a.id] ? ' on' : '') + '"><i>' + (ach[a.id] ? '★' : '・') + '</i><div><b>' + a.name + '</b>' + a.d + '</div></div>'; });
  $('statsBody').innerHTML = h; showOnly('stats');
}
function share(){
  var R = resultInfo; if (!R) return;
  var txt = mode === 'daily' ? '深海螢光 每日挑戰 ' + R.P.key + '：引爆 ' + R.c + '/' + R.P.nExp
    : '深海螢光 第 ' + levelN + ' 關 ' + R.c + '/' + R.P.nExp + (R.wiped ? ' 全滅' : '') + ' ' + '★★★'.slice(0, R.st);
  if (navigator.share){ navigator.share({ text: txt }).catch(function(){}); return; }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast('已複製：' + txt); }, function(){ toast(txt); }); }catch(e){ toast(txt); }
}
var toastT = 0;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.opacity = 0; setTimeout(function(){ t.classList.add('hidden'); }, 400); }, 2000); }
document.addEventListener('visibilitychange', function(){ if (document.hidden){ if (status === 'aim' || status === 'chain') pause(); if (AC && AC.state === 'running'){ try{ AC.suspend(); }catch(e){} } } else { lastT = performance.now(); if (AC){ try{ AC.resume(); }catch(e){} } } });

/* ---------- title attract mode ---------- */
function demoTick(dt){
  if (!demo){ demo = newSim(genLevel(18 + Math.floor(Math.random() * 40))); demoT = 0; }
  demoT += dt;
  if (!demo.tapped && demoT > 2.2){ var best = demo.js.filter(function(j){ return j.alive; }); var j = best[Math.floor(best.length / 2)]; if (j){ simTap(demo, j.x, j.y); colourRings(demo); } }
  var n = 0; demo.acc = (demo.acc || 0) + dt;
  while (demo.acc >= DT && n < 4){ demo.acc -= DT; n++; simStep(demo); colourRings(demo); handleEvents(demo, 0); }
  if (demo.done){ demo.endT = (demo.endT || 0) + dt; if (demo.endT > 1.6) demo = null; }
}

/* ---------- render ---------- */
function render(t, dt){
  drawBg(t);
  var sim = status === 'title' || status === 'select' ? demo : S;
  if (!sim){ return; }
  var alpha = acc / DT; if (status !== 'chain' && status !== 'aim' && status !== 'replay') alpha = 1;
  var sx = 0, sy = 0; if (shake > 0){ sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; }
  fieldXform(); ctx.translate(sx, sy);
  ctx.save(); if (sim === S){ ctx.beginPath(); ctx.rect(-4, -4, FW + 8, FH + 8); ctx.clip(); }
  drawRings(sim.rings, t);
  var showAim = aim.on && status === 'aim' && sim === S, R0 = sim.P.R;
  for (var i = 0; i < sim.js.length; i++){
    var j = sim.js[i]; if (!j.alive) continue;
    var x = j.px + (j.x - j.px) * alpha, y = j.py + (j.y - j.py) * alpha, hi = false;
    if (showAim && set.aim){ var dx = j.x - aim.x, dy = j.y - aim.y; hi = dx * dx + dy * dy <= R0 * R0 && j.k !== K_ABS; }
    drawJelly(ctx, j, x, y, t, hi, j.vx, j.vy, 1);
  }
  drawParts();
  if (showAim){
    var ax = aim.x, ay = aim.y, ok = ax >= 0 && ay >= 0 && ax <= FW && ay <= FH;
    ctx.strokeStyle = !ok ? '#ff6b6b' : LIGHT ? '#0b3550' : '#e8fdff'; ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 5]); ctx.lineDashOffset = -t * 20; ctx.beginPath(); ctx.arc(ax, ay, R0, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ax - 12, ay); ctx.lineTo(ax - 4, ay); ctx.moveTo(ax + 4, ay); ctx.lineTo(ax + 12, ay); ctx.moveTo(ax, ay - 12); ctx.lineTo(ax, ay - 4); ctx.moveTo(ax, ay + 4); ctx.lineTo(ax, ay + 12); ctx.stroke();
    ctx.globalAlpha = 0.12; ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(ax, ay, R0, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  }
  // L1 guide: pulse on the densest school before the tap
  if (sim === S && mode === 'level' && levelN === 1 && status === 'aim' && !S.tapped && !aim.on){
    var gx = 0, gy = 0, gn = 0; S.js.forEach(function(q){ if (q.alive && LV.jellies[q.id] && LV.jellies[q.id].g === 0){ gx += q.x; gy += q.y; gn++; } });
    if (gn){ gx /= gn; gy /= gn; var u = (t % 1.4) / 1.4; ctx.strokeStyle = LIGHT ? '#0b3550' : '#ffffff'; ctx.globalAlpha = 1 - u; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(gx, gy, 10 + u * 40, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  ctx.restore();
  if (sim === S) drawFieldFrame();
  // floats (screen space)
  screenXform();
  for (i = 0; i < floats.length; i++){ var f = floats[i], p = toScreen(f.x, f.y); ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.fillStyle = f.col; ctx.font = '800 20px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.txt, p.x, p.y - (1 - f.life) * 30); }
  ctx.globalAlpha = 1;
  // chain counter
  if (sim === S && S.tapped && S.count !== 0){
    counterPop = Math.max(0, counterPop - dt * 4);
    var cx = FOX + FWS / 2, cy = FOY + FHS * 0.42, sc = 1 + counterPop * 0.35, fz = Math.round(Math.min(96, FWS * 0.26) * sc);
    var met = S.count >= S.P.T;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + fz + 'px system-ui,sans-serif';
    ctx.globalAlpha = status === 'result' ? 0.35 : 0.85;
    if (!LIGHT){ ctx.shadowColor = met ? '#ffd36e' : '#7df9ff'; ctx.shadowBlur = 24; }
    ctx.fillStyle = LIGHT ? (met ? '#a86b00' : '#0b4a6e') : (met ? '#ffe9a8' : '#e8fdff');
    ctx.fillText(S.count, cx, cy);
    ctx.shadowBlur = 0;
    ctx.font = '700 ' + Math.round(fz * 0.24 + 4) + 'px system-ui,sans-serif';
    ctx.fillText(met ? '達標！' : '目標 ' + S.P.T, cx, cy + fz * 0.62);
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  }
  // win curtain
  if (curtain > 0){
    curtain += dt;
    var cp = toScreen(curtainX, curtainY), rad = Math.hypot(W, H) * Math.min(1, curtain / 0.9), ca = Math.max(0, 1 - curtain / 1.4) * 0.55;
    var gr = ctx.createRadialGradient(cp.x, cp.y, rad * 0.6, cp.x, cp.y, rad + 1);
    gr.addColorStop(0, LIGHT ? 'rgba(255,255,255,0)' : 'rgba(125,249,255,0)'); gr.addColorStop(0.85, LIGHT ? 'rgba(255,255,255,' + ca + ')' : 'rgba(125,249,255,' + ca * 0.6 + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    if (curtain > 1.5) curtain = 0;
  }
}
function frame(now){
  var dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  var t = now / 1000;
  shake = Math.max(0, shake - dt * 12);
  if (status === 'aim' || status === 'chain' || status === 'replay'){
    if (status === 'replay' && S.tapped) simSpeed = 0.3;
    stepSim(dt);
    if (S && S.count !== shownCount){ shownCount = S.count; updateHud(); }
  } else if (status === 'title' || status === 'select'){ demoTick(dt); }
  updParts(dt * (status === 'replay' && S && S.tapped ? 0.4 : 1));
  render(t, dt);
  requestAnimationFrame(frame);
}
window.__game = {
  state: function(){ return { status: status, mode: mode, level: levelN, frame: S ? S.frame : -1, tapped: S ? S.tapped : false, tapFrame: S ? S.tapFrame : -1, count: S ? S.count : 0, T: S ? S.P.T : 0, nExp: S ? S.P.nExp : 0, stars: resultInfo ? resultInfo.st : 0, won: resultInfo ? resultInfo.won : false }; },
  toScreen: toScreen
};
layout();
requestAnimationFrame(frame);
})();
</script>
