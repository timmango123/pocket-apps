<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);

button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; background: #0b0820; }

/* chunky pixel panels: stepped corners via box-shadow, no blur */
.px {
  background: var(--frame);
  box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge), inset 0 3px 0 0 var(--frame-hi), inset 0 -3px 0 0 #120b26;
}

#hud { position: fixed; top: calc(var(--sat) + 10px); left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; pointer-events: none; z-index: 2; }
.bars { padding: 8px 10px; display: grid; gap: 6px; max-width: 320px; pointer-events: auto; }

    if (!on) continue;
    const p = b.pts;

    for (let k = 0; k < p.length - 2; k += 2) line(p[k] - camX, p[k + 1], p[k + 2] - camX, p[k + 3], '#ffffff');
  }

  for (const tx of texts) drawText(tx.s, tx.x - camX, tx.y, tx.color);
  if (flash > 0) { g.fillStyle = 'rgba(240,230,255,' + (flash * 1.6).toFixed(2) + ')'; g.fillRect(-4, -4, BW + 8, BH + 8); }
  if (paused) {

    g.fillStyle = '#ffd25a';
    const cx = Math.round(BW / 2), cy = Math.round(groundY / 2);
    g.fillRect(cx - 6, cy - 7, 4, 14); g.fillRect(cx + 2, cy - 7, 4, 14);
  }
  // upscale to screen, nearest neighbour
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BW, BH, offX, offY, BW * S, BH * S);
}

/* ================= HUD ================= */
let hudT = 0, lastScore = -1;

  $('mpFill').style.width = 'calc(' + Math.max(0, wiz.mp) + '% - 4px)';
  $('hpTxt').textContent = Math.ceil(wiz.hp);
  $('mpTxt').textContent = Math.floor(wiz.mp);
  if (force || score !== lastScore) { $('scoreTxt').textContent = score; lastScore = score; }
  $('waveTxt').textContent = wave;
  $('leftTxt').textContent = waveLeft + bossLeft + wisps.reduce((c, q) => c + (q.dead ? 0 : 1), 0);
  $('bestTxt').textContent = Math.max(best, score);
  for (let i = 0; i < 4; i++) {
    cdEls[i].style.height = (cds[i] / SPELLS[i].cd * 100).toFixed(0) + '%';
    sEls[i].classList.toggle('nomp', wiz.mp < SPELLS[i].cost);
