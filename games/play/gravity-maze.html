<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);

button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none !important}

.stat{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.2}

.pill{height:44px;min-width:92px;padding:0 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;position:relative}
.pill svg.i{width:19px;height:19px}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.4}
.pill .badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#3a2a00;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.rot{position:fixed;left:0;right:0;bottom:0;padding:8px calc(var(--sar) + 10px) calc(var(--sab) + 12px) calc(var(--sal) + 10px);display:flex;gap:10px;z-index:5}
.rbtn{flex:1;height:80px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:1px;color:var(--ink);
  background:linear-gradient(180deg,var(--btnhi),var(--btn));border:1px solid var(--line);box-shadow:0 6px 0 var(--line),0 10px 24px var(--shadow);position:relative;overflow:hidden;transition:transform .08s}
.rbtn svg.i{width:34px;height:34px;stroke:var(--accent);stroke-width:2.6}
.rbtn:active,.rbtn.press{transform:translateY(4px);box-shadow:0 2px 0 var(--line),0 6px 14px var(--shadow)}
.rbtn.hint{animation:hintp .7s ease-in-out infinite alternate;border-color:var(--gold)}
.rbtn.hint svg.i{stroke:var(--gold)}

.rbtn .k{font-size:11px;color:var(--ink2);font-weight:600;letter-spacing:0;position:absolute;bottom:6px;left:0;right:0;text-align:center}
@media (hover:hover){ .rbtn:hover{filter:brightness(1.08)} .pill:hover,.ibtn:hover{filter:brightness(1.08)} }
/* landscape phones: rotate buttons become side columns */
@media (orientation:landscape) and (max-height:520px){
  .rot{top:calc(var(--sat) + 62px);bottom:calc(var(--sab) + 10px);left:0;right:0;padding:0;display:block;pointer-events:none}

<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable], .shareimg')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
/*CORE-START*/
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 up, 1 right, 2 down, 3 left (maze coords)
// tiles: 0 empty, 1 wall, 2 spike, 3 glue, 4..7 one-way door (dir = t-4), 8 portal, 10..12 exit (color t-10)
function parseLevel(str) {
  var rows = str.split('/'), n = rows.length, N = n * n;
  var tile = new Array(N).fill(0), pair = new Int16Array(N).fill(-1), balls = [], boxes = [], pp = {};
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
    var ch = rows[y][x], c = y * n + x;
    if (ch === '#') tile[c] = 1;
    else if (ch === 'x') tile[c] = 2;
    else if (ch === 'g') tile[c] = 3;
    else if ('^>v<'.indexOf(ch) >= 0) tile[c] = 4 + '^>v<'.indexOf(ch);
    else if (ch >= '1' && ch <= '4') { tile[c] = 8; if (pp[ch] !== undefined) { pair[c] = pp[ch]; pair[pp[ch]] = c; } else pp[ch] = c; }
    else if (ch === 'A' || ch === 'B' || ch === 'C') tile[c] = 10 + ch.charCodeAt(0) - 65;
    else if (ch === 'a' || ch === 'b' || ch === 'c') balls.push({ col: ch.charCodeAt(0) - 97, p: c });
    else if (ch === 'O') boxes.push(c);
  }
  balls.sort(function (a, b) { return a.col - b.col; });

    if (p.type === 'conf') { g.save(); g.translate(p.x, p.y); g.rotate(p.life*0.2); g.fillRect(-p.size, -p.size*0.5, p.size*2, p.size); g.restore(); }

    else { g.beginPath(); g.arc(p.x, p.y, p.size*k + 0.5, 0, TAU); g.fill(); } }
  g.globalAlpha = 1;
}
function drawTitleDeco(g, time){
  var land = W > H && H <= 520, R = land ? H * 0.17 : Math.min(W, H) * 0.3, x0 = W/2, y0 = land ? H * 0.47 : H * 0.5;
  g.save(); g.translate(x0, y0); g.rotate(time * 0.15);
  g.strokeStyle = TH.neon; g.globalAlpha = 0.35; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke();
  g.globalAlpha = 0.18; g.lineWidth = 10; g.beginPath(); g.arc(0, 0, R*1.08, 0, TAU); g.stroke(); g.globalAlpha = 1;
  var q = R * 0.62; g.strokeStyle = TH.neon; g.lineWidth = 2; g.globalAlpha = 0.5; g.strokeRect(-q, -q, q*2, q*2); g.globalAlpha = 1;
  g.restore();
  for (var i=0;i<3;i++){ var a = time*0.6 + i*TAU/3, s = ballSprite(COLS[i], Math.min(W, H)*0.035); g.drawImage(s.c, x0 + Math.cos(a)*R*0.45 - s.R, y0 + Math.sin(a)*R*0.45 - s.R, s.R*2, s.R*2); }
}

/* ---------- mechanic previews ---------- */
var PREV = { basic: '#.A/.a./..#', spike: 'a../.x./..#', two: 'a.A/b.B', door: 'a>A', glue: 'ag./..A', box: 'aO#', three: 'abc/ABC', portal: 'a1/#./1A' };
function drawPreview(c, key){
  var rows = PREV[key].split('/'), w = Math.max.apply(null, rows.map(function(r){ return r.length; })), h = rows.length;
  var px = 58 * 2; c.width = c.height = px; var g = c.getContext('2d'), k = px / Math.max(w, h + 0.5);
  g.fillStyle = TH.floor; g.fillRect(0, 0, px, px);
  var oy = (px - h*k)/2, ox = (px - w*k)/2;
  for (var y=0;y<h;y++) for (var x=0;x<w;x++){ var ch = rows[y][x] || '.', X = ox + x*k, Y = oy + y*k;
    if (ch === '#') { g.fillStyle = TH.wall; g.fillRect(X+1, Y+1, k-2, k-2); g.strokeStyle = TH.neon; g.strokeRect(X+1, Y+1, k-2, k-2); }
    else if ('ABC'.indexOf(ch) >= 0) drawExit(g, X+k/2, Y+k/2, k, ch.charCodeAt(0)-65, 1.3);
    else if (ch === 'x') drawSpike(g, X+k/2, Y+k/2, k, 0.3, 3);
    else if ('^>v<'.indexOf(ch) >= 0) drawDoor(g, X+k/2, Y+k/2, k, '^>v<'.indexOf(ch), 0.2);
    else if (ch === 'g') { g.fillStyle = '#5fd068'; g.beginPath(); g.arc(X+k/2, Y+k/2, k*0.38, 0, TAU); g.fill(); }
    else if (ch === '1') drawPortal(g, X+k/2, Y+k/2, k, 0.5, true);
    else if (ch === 'O') drawBox(g, X+k/2, Y+k/2, k);
    if ('abc'.indexOf(ch) >= 0) { var s = ballSprite(COLS[ch.charCodeAt(0)-97], k*0.36 / DPR * 1); g.drawImage(s.c, X+k/2 - s.R*DPR, Y+k/2 - s.R*DPR, s.R*2*DPR, s.R*2*DPR); }
  }
}
function mechHTML(m){ return '<div class="mech"><canvas data-k="' + m.key + '"></canvas><div><b>' + m.name + '</b>（第 ' + m.lv + ' 關起）<br>' + m.desc + '</div></div>'; }
function paintPreviews(root){ root.querySelectorAll('canvas[data-k]').forEach(function(c){ drawPreview(c, c.getAttribute('data-k')); }); }
function showIntro(m){ $('iTitle').textContent = m.lv === 1 ? '歡迎來到星環迷宮' : '新機關：' + m.name; $('iBody').innerHTML = mechHTML(m); paintPreviews($('iBody')); showOnly('intro'); SFX.open(); }
function showHelp(){
  var h = '<p>按下方大按鈕（或在迷宮上畫圓弧、雙指旋轉）讓艙體左轉或右轉 90°。重力永遠朝畫面下方，所有珠子與貨箱會同時直線滾到底。讓每顆能量珠進入同色出口即過關。</p>';
  h += '<p>以最少旋轉次數完成得 ★★★，多 2 次內 ★★。每關有 3 次提示，可隨時悔棋。</p>';
  h += '<p>鍵盤：← / Q 逆時針、→ / E 順時針、Z 悔棋、R 重來、H 提示。</p>';
  MECH.forEach(function(m){ h += mechHTML(m); });
  $('helpBody').innerHTML = h; paintPreviews($('helpBody')); showOnly('help', true);
}

/* ---------- overlays ---------- */
var overlays = ['title', 'select', 'pause', 'win', 'fail', 'help', 'intro', 'shareov'], helpReturn = null;
function showOnly(id, keepBack){
  if (id === 'help') helpReturn = overlays.filter(function(o){ return o !== 'help' && !$(o).classList.contains('hidden'); })[0] || null;
  overlays.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); });
}
var toastT = 0;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.opacity = 0; toastT = setTimeout(function(){ t.classList.add('hidden'); }, 400); }, 2200); }
function hideGame(){ ['hud','tools','rot'].forEach(function(id){ $(id).classList.add('hidden'); }); }
function goTitle(){ status = 'title'; replaying = null; anim = null; hideGame(); showOnly('title'); }
function goSelect(){ status = 'select'; replaying = null; anim = null; hideGame(); buildGrid(); showOnly('select');
  var cur = document.querySelector('.lt.cur'); if (cur) setTimeout(function(){ cur.scrollIntoView({ block: 'center' }); }, 30); }
function buildGrid(){
  var h = '', done = 0, st = 0, hi = highestUnlocked();
  for (var n=1;n<=NL;n++){
    var p = prog[n], d = diffOf(n), ok = unlocked(n);
    if (p) { done++; st += p.s; }
    if (!ok) { h += '<button class="lt lock" data-n="' + n + '" aria-label="第 ' + n + ' 關（未解鎖）"><span class="n">' + n + '</span><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>'; continue; }
    var s = ''; for (var i=0;i<3;i++) s += '<span class="' + (p && i < p.s ? 'on' : '') + '">★</span>';
    h += '<button class="lt' + (p ? ' done' : '') + (n === hi ? ' cur' : '') + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + d.toFixed(1) + '"><span class="n">' + n + '</span><span class="st">' + s + '</span><span class="db"><i style="width:' + (d*10) + '%;background:' + diffColor(d) + '"></i></span><span class="dn">難度 ' + d.toFixed(1) + '</span></button>';
  }
  $('grid').innerHTML = h;
  $('selSum').textContent = '已通關 ' + done + ' / ' + NL + '・★ ' + st + ' / ' + (NL*3);
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
$('grid').addEventListener('click', function(e){ var b = e.target.closest('.lt'); if (!b) return; audio(); var n = +b.getAttribute('data-n');
  if (!unlocked(n)) { toast('先完成第 ' + (n-1) + ' 關，或打開「解鎖全部關卡」'); SFX.undo(); return; } SFX.click(); startLevel(n); });
$('unlockSw').addEventListener('click', function(){ audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
$('tPlay').addEventListener('click', function(){ audio(); SFX.open(); startLevel(highestUnlocked()); });
$('tSelect').addEventListener('click', function(){ audio(); SFX.click(); goSelect(); });
$('tDaily').addEventListener('click', function(){ audio(); SFX.click(); toast('正在生成今日迷宮…');
  setTimeout(function(){ makeDaily(); startLevel(0, { daily: true }); var d = daily[dailyKey]; if (d) setTimeout(function(){ toast('今日已完成 ' + '★'.repeat(d.s) + '，最佳 ' + d.b + ' 次'); }, 2400); }, 40); });
$('tHelp').addEventListener('click', function(){ audio(); SFX.click(); showHelp(); });
$('sBack').addEventListener('click', function(){ SFX.click(); goTitle(); });
$('bPause').addEventListener('click', function(){ audio(); if (status === 'won') return; SFX.click(); openPause(); });
function openPause(){ if (status !== 'play' && status !== 'fail' && status !== 'anim') return; if (anim) return; replaying = null;
  $('pInfo').textContent = (mode === 'daily' ? '每日迷宮 ' + dailyKey : '第 ' + levelN + ' 關') + '・難度 ' + L.D.toFixed(1) + '・已旋轉 ' + hist.length + ' 次';
  pausedFrom = status; status = 'paused'; showOnly('pause'); }
var pausedFrom = 'play';
$('pResume').addEventListener('click', function(){ SFX.click(); status = pausedFrom === 'fail' ? 'fail' : 'play'; showOnly(pausedFrom === 'fail' ? 'fail' : null); });
$('pRestart').addEventListener('click', function(){ status = 'play'; showOnly(null); restart(); });
$('pHelp').addEventListener('click', function(){ SFX.click(); showHelp(); });
$('pSelect').addEventListener('click', function(){ SFX.click(); goSelect(); });
$('pHome').addEventListener('click', function(){ SFX.click(); goTitle(); });
$('hOk').addEventListener('click', function(){ SFX.click(); showOnly(helpReturn); });
$('iOk').addEventListener('click', function(){ SFX.click(); showOnly(null); toast('最少 ' + L.opt + ' 次旋轉'); });
$('swSound').addEventListener('click', function(){ muted = !muted; sset('mute', muted); setMuteIcon(); audio(); SFX.click(); });
$('swCb').addEventListener('click', function(){ cbMode = !cbMode; sset('cb', cbMode); $('swCb').setAttribute('aria-checked', cbMode ? 'true' : 'false'); SFX.click(); });
$('bMute').addEventListener('click', function(){ muted = !muted; sset('mute', muted); setMuteIcon(); audio(); SFX.click(); });
$('bCW').addEventListener('click', function(){ input(1); });
$('bCCW').addEventListener('click', function(){ input(-1); });
$('bUndo').addEventListener('click', undo);
$('bRestart').addEventListener('click', restart);
$('bHint').addEventListener('click', hint);
$('wNext').addEventListener('click', function(){ SFX.click(); if (mode === 'daily' || levelN >= NL) goTitle(); else startLevel(levelN + 1); });
$('wRetry').addEventListener('click', function(){ SFX.click(); if (mode === 'daily') startLevel(0, { daily: true }); else startLevel(levelN); });
$('wReplay').addEventListener('click', function(){ SFX.click(); startReplay(); });
$('wSelect').addEventListener('click', function(){ SFX.click(); goSelect(); });
$('wShare').addEventListener('click', function(){ SFX.click(); share(); });
$('shOk').addEventListener('click', function(){ SFX.click(); showOnly('win'); });
$('fUndo').addEventListener('click', undo);
$('fRestart').addEventListener('click', restart);

/* ---------- share (image card) ---------- */
function share(){
  var w = lastWin || { moves: hist.length, st: 1 }, c = document.createElement('canvas'); c.width = 600; c.height = 340;
  var g = c.getContext('2d'); g.fillStyle = '#070b1a'; g.fillRect(0, 0, 600, 340);
  var gr = g.createRadialGradient(150, 100, 0, 150, 100, 500); gr.addColorStop(0, '#1a1f55'); gr.addColorStop(1, '#070b1a'); g.fillStyle = gr; g.fillRect(0, 0, 600, 340);
  for (var i=0;i<90;i++){ g.fillStyle = 'rgba(207,227,255,' + (0.2 + Math.random()*0.6) + ')'; g.fillRect(Math.random()*600, Math.random()*340, 1.5, 1.5); }
  g.strokeStyle = '#4cc9f0'; g.lineWidth = 3; g.beginPath(); g.arc(470, 170, 110, 0, TAU); g.stroke();
  for (i=0;i<3;i++){ var s = ballSprite(COLS[i], 16); g.drawImage(s.c, 440 + i*30 - s.R, 170 - s.R + (i-1)*26, s.R*2, s.R*2); }
  g.fillStyle = '#e6f0ff'; g.font = '800 44px system-ui, sans-serif'; g.fillText('星環迷宮', 40, 80);
  g.font = '600 26px system-ui, sans-serif'; g.fillStyle = '#9fb1d4'; g.fillText(mode === 'daily' ? '每日迷宮 ' + dailyKey : '第 ' + levelN + ' 關・難度 ' + L.D.toFixed(1), 40, 130);
  g.fillStyle = '#ffd166'; g.font = '48px system-ui, sans-serif'; g.fillText('★'.repeat(w.st) + '☆'.repeat(3 - w.st), 40, 200);
  g.fillStyle = '#e6f0ff'; g.font = '600 26px system-ui, sans-serif'; g.fillText('旋轉 ' + w.moves + ' 次（最少 ' + L.opt + '）', 40, 260);
  var text = '星環迷宮 ' + (mode === 'daily' ? '每日迷宮 ' + dailyKey : '第 ' + levelN + ' 關') + ' ' + '★'.repeat(w.st) + ' 旋轉 ' + w.moves + ' 次（最少 ' + L.opt + '）';
  var fallback = function(){ $('shareImg').src = c.toDataURL('image/png'); showOnly('shareov'); };
  try {
    c.toBlob(function(blob){
      try {
        var f = blob && window.File ? new File([blob], 'gravity-maze.png', { type: 'image/png' }) : null;
        if (f && navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], text: text }).catch(function(e){ if (!e || e.name !== 'AbortError') fallback(); });
        else fallback();
      } catch(e){ fallback(); }
    }, 'image/png');
  } catch(e){ fallback(); }
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (e.repeat) return;
  var k = e.key;
  if (status === 'play' || status === 'anim' || status === 'fail') {
    if (k === 'ArrowLeft' || k === 'q' || k === 'Q') { input(-1); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'e' || k === 'E') { input(1); e.preventDefault(); }
    else if (k === 'z' || k === 'Z' || ((e.ctrlKey || e.metaKey) && k === 'z')) undo();
    else if (k === 'r' || k === 'R') restart();
    else if (k === 'h' || k === 'H') hint();
    else if (k === 'Escape' || k === 'p' || k === 'P') openPause();
  } else if (status === 'paused' && (k === 'Escape' || k === 'p' || k === 'P')) $('pResume').click();
  else if (status === 'won' && (k === 'Enter' || k === ' ')) $('wNext').click();
});

/* ---------- rotation gestures on the maze (one-finger arc > 40°, or two-finger twist > 30°) ---------- */
var ptrs = {}, gest = null;
function angAt(x, y){ return Math.atan2(y - cy, x - cx); }
function dAng(a, b){ var d = a - b; while (d > PI) d -= TAU; while (d < -PI) d += TAU; return d; }
cv.addEventListener('pointerdown', function(e){
  audio(); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  var ids = Object.keys(ptrs);
  if (ids.length === 1) { var r = Math.hypot(e.clientX - cx, e.clientY - cy); gest = r > 18 ? { mode: 1, ref: angAt(e.clientX, e.clientY), acc: 0 } : { mode: 0 }; }
  else if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; gest = { mode: 2, ref: Math.atan2(b.y - a.y, b.x - a.x), acc: 0 }; }
});
cv.addEventListener('pointermove', function(e){
  if (!ptrs[e.pointerId] || !gest) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(ptrs), cur;
  if (gest.mode === 1 && ids.length === 1) { if (Math.hypot(e.clientX - cx, e.clientY - cy) < 14) return; cur = angAt(e.clientX, e.clientY); }
  else if (gest.mode === 2 && ids.length >= 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; cur = Math.atan2(b.y - a.y, b.x - a.x); }
  else return;
  gest.acc += dAng(cur, gest.ref); gest.ref = cur;
  var th = (gest.mode === 2 ? 30 : 40) * PI / 180;
  if (Math.abs(gest.acc) >= th) { input(gest.acc > 0 ? 1 : -1); gest.acc = 0; }
});
function ptrEnd(e){ delete ptrs[e.pointerId]; if (!Object.keys(ptrs).length) gest = null; else if (gest && gest.mode === 2) gest = { mode: 0 }; }
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);

/* ---------- visibility ---------- */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }
  else if (!running) { running = true; last = 0; rafId = requestAnimationFrame(frame); }
});

/* ---------- test hook ---------- */
window.__game = {
  state: function(){ return { status: status, animating: !!anim || status === 'anim', moves: hist.length, level: levelN, opt: L ? L.opt : 0, replaying: !!replaying }; },
  solution: function(){ var r = L && solve(L, S, 3000000, false); return r ? r.sol : null; }
};

setTheme(); setMuteIcon(); $('swCb').setAttribute('aria-checked', cbMode ? 'true' : 'false');
layout();
rafId = requestAnimationFrame(frame);
})();
