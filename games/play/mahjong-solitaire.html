<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>麻將接龍</title>
<style>
:root{
  --bg:#dfe9d6; --ink:#21362c; --ink2:#5a7366; --card:#fbf7ecf2; --card2:#eef3e6; --line:#d4dcc8;
  --jade:#2f8a68; --jade2:#46a982; --jadeD:#1f6b4f; --gold:#e0a43a; --red:#c0392b; --veil:#dfe9d6b8;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10201a; --ink:#e4eee6; --ink2:#9db7a9; --card:#1a2e26f2; --card2:#22392f; --line:#2f4a3e;
    --jade:#3a9e78; --jade2:#4fb98f; --jadeD:#2a7a5c; --gold:#e8b24c; --red:#e05a4a; --veil:#0c1813c4; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none !important}
/* HUD */
.hud{position:fixed;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);z-index:5;display:flex;justify-content:center;pointer-events:none}
.hcard{pointer-events:auto;width:100%;max-width:640px;background:var(--card);border-radius:16px;box-shadow:0 4px 14px #29503d1f;display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:54px}
.hl{flex:1;min-width:0}
.lvn{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.dif{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap;margin-top:2px}
.pips{display:flex;gap:2px}.pips i{width:5px;height:9px;border-radius:2px;background:var(--line)}
.hs{display:flex;gap:4px}
.st{min-width:46px;text-align:center;line-height:1.1}
.st small{display:block;font-size:11px;color:var(--ink2)}
.st b{font-size:17px;font-variant-numeric:tabular-nums}
.st.warn b{color:var(--red)}
/* toolbar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:8px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);pointer-events:none}
.tb{pointer-events:auto;position:relative;flex:1;max-width:96px;height:58px;border-radius:16px;background:var(--card);box-shadow:0 4px 14px #29503d24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink)}
.tb svg.i{width:23px;height:23px;color:var(--jade)}
.tb:active{transform:scale(.94)}
.tb[disabled]{opacity:.4}
.tb .bd{position:absolute;top:4px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--jade);color:#fff;font-size:11px;line-height:18px;padding:0 4px}
.tb.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #2f8a6888}50%{box-shadow:0 0 0 8px #2f8a6800}}
.fit{position:fixed;z-index:5;right:calc(var(--sar) + 12px);height:44px;padding:0 14px;border-radius:22px;background:var(--card);box-shadow:0 3px 10px #29503d24;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
@media (orientation:landscape) and (max-height:520px){
  .hud{right:calc(var(--sar) + 96px);top:calc(var(--sat) + 6px)}
  .hcard{min-height:48px;padding:4px 10px}
  .bar{left:auto;top:0;bottom:0;width:calc(var(--sar) + 88px);flex-direction:column;padding:8px calc(var(--sar) + 8px) 8px 8px;justify-content:center}
  .tb{flex:none;width:72px;height:56px;max-width:none}
  .fit{right:auto;left:calc(var(--sal) + 12px)}
}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 14px);background:var(--veil);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:24px;box-shadow:0 18px 50px #1a3a2a33;padding:22px 20px;width:min(380px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:24px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:16px;
  background:linear-gradient(180deg,var(--jade2),var(--jade));color:#fff;box-shadow:0 4px 0 var(--jadeD),0 8px 18px #1f6b4f33}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jadeD)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:linear-gradient(180deg,#f0be5c,#d9962b);box-shadow:0 4px 0 #a86f17,0 8px 18px #a86f1733}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:42px;letter-spacing:6px;margin:2px 0;color:var(--line)}
.stars .on{color:var(--gold);display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both;text-shadow:0 2px 0 #b47b1d}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:20px;margin:6px 0;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.crit{font-size:12px;color:var(--ink2);margin:4px 0 0;line-height:1.5}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{margin-top:7vh;text-align:center}
.ttl h1{margin:0;font-size:52px;letter-spacing:8px;font-family:"Kaiti TC","STKaiti","KaiTi","BiauKai","DFKai-SB",serif;color:var(--ink);text-shadow:0 3px 0 var(--card),0 10px 30px #2f8a6844}
.ttl .sub{color:var(--ink2);font-weight:600;margin-top:6px;font-size:15px;letter-spacing:2px}
.tbtns{width:min(330px,100%);display:flex;flex-direction:column;margin-bottom:8px}
.tbtns .row3{display:flex;gap:8px}.tbtns .row3 .btn{flex:1;font-size:14px;min-height:46px}
@media (orientation:landscape) and (max-height:520px){
  #title{flex-direction:row;justify-content:space-around;align-items:center}
  .ttl{margin-top:0}
}
/* select */
#select{padding:0;align-items:stretch}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:20px;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #29503d1f;display:grid;place-items:center;flex:none}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--jade)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
@media (min-width:560px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{height:76px;border-radius:12px;background:#fbf7ec;color:#21362c;box-shadow:3px 3px 0 #2f8a68,4px 5px 8px #1f4a3a33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:3px;min-height:52px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .s{font-size:11px;letter-spacing:1px;color:#cfc8b4;line-height:1}
.lt .s .on{color:#d9962b}
.lt .db{width:72%;height:4px;border-radius:2px;background:#e7e0cc;overflow:hidden}
.lt .db i{display:block;height:100%}
.lt .dn{font-size:11px;color:#6b7d72;line-height:1}
.lt.cur{outline:3px solid var(--gold);outline-offset:1px}
.lt.lock{background:#e4e7dc;color:#9aa69d;box-shadow:3px 3px 0 #9fb5a8}
@media (prefers-color-scheme: dark){.lt{background:#e6e0cf;box-shadow:3px 3px 0 #2a7a5c,4px 5px 8px #0006}.lt.lock{background:#5d665f;color:#2e3a33;box-shadow:3px 3px 0 #2c4a3d}}
.lt:active{transform:scale(.95)}
/* misc */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);z-index:30;background:#1f3a2ee8;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .35s}
.scroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;text-align:left;touch-action:pan-y;font-size:14px;line-height:1.65;color:var(--ink2)}
.scroll b{color:var(--ink)}
.scroll h3{font-size:15px;margin:12px 0 4px;color:var(--ink)}
.tiles{display:flex;gap:6px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
.tiles canvas{width:34px;height:44px}
.tiles span{font-size:18px;color:var(--ink2)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;width:100%}
.setrow:last-child{border-bottom:0}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{min-height:40px;min-width:56px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--jade);color:#fff}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stgrid div{background:var(--card2);border-radius:14px;padding:10px 6px;font-size:12px;color:var(--ink2)}
.stgrid b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.sharebox{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px;font:inherit;font-size:16px;resize:none;-webkit-user-select:text;user-select:text}
@media (hover:hover){.btn:hover{filter:brightness(1.05)}.tb:hover{filter:brightness(1.04)}}
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud"><div class="hcard">
  <div class="hl">
    <div class="lvn" id="hLv">第 1 關</div>
    <div class="dif" id="hDifW">難度 <b id="hDif">1.0</b><span class="pips" id="hPips"></span></div>
  </div>
  <div class="hs">
    <div class="st"><small>剩餘</small><b id="hRem">0</b></div>
    <div class="st" id="hPairW"><small>可配對</small><b id="hPair">0</b></div>
    <div class="st"><small id="hTimeL">時間</small><b id="hTime">0:00</b></div>
  </div>
</div></div>

<button class="fit hidden" id="bFit" aria-label="全覽"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全覽</button>

<div class="bar hidden" id="bar">
  <button class="tb" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
  <button class="tb" id="bShuf" aria-label="洗牌"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h4M17 14l3 3-3 3M3 17h3c1.6 0 2.8-1.6 3.8-3.5M13.2 9.5C14.2 8 15.4 7 17 7h3M17 4l3 3-3 3"/></svg>洗牌<span class="bd" id="shufN">3</span></button>
  <button class="tb" id="bUndo" aria-label="悔棋"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
  <button class="tb" id="bMenu" aria-label="選單"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>選單</button>
</div>

<div class="ov" id="title">
  <div class="ttl"><h1>麻將接龍</h1><div class="sub">竹林茶室・層層拆牌山</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row3"><button class="btn sec" id="tDaily">每日牌山</button><button class="btn sec" id="tZen">禪模式</button></div>
    <div class="row3"><button class="btn sec" id="tStats">統計</button><button class="btn sec" id="tSet">設定</button><button class="btn sec" id="tHelp">說明</button></div>
  </div>
</div>

<div class="ov hidden" id="select"><div class="selwrap">
  <div class="selhead">
    <button class="ibtn" id="sBack" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>選擇關卡</h2>
    <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
  </div>
  <div class="selsum" id="selSum"></div>
  <div class="grid" id="grid"></div>
</div></div>

<div class="ov hidden" id="menu"><div class="card">
  <h2>暫停</h2>
  <p id="mInfo"></p>
  <button class="btn" id="mResume">繼續</button>
  <div class="row2"><button class="btn sec" id="mRestart">重新開始</button><button class="btn sec" id="mSet">設定</button></div>
  <div class="row2"><button class="btn sec" id="mHelp">說明</button><button class="btn sec" id="mHome" >回到首頁</button></div>
  <button class="btn sec" id="mSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">功成！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>時間<b id="wTime">0:00</b></div><div>最佳<b id="wBest">0:00</b></div><div>輔助<b id="wAids">0</b></div></div>
  <div class="crit" id="wCrit"></div>
  <p id="wMsg"></p>
  <button class="btn gold" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wShare">分享成績</button></div>
  <button class="btn sec" id="wSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2>牌山卡住了</h2>
  <p id="fMsg">已經沒有可以配對的牌，洗牌次數也用完了。</p>
  <div class="row2"><button class="btn" id="fUndo">悔棋</button><button class="btn sec" id="fRestart">重新開始</button></div>
  <button class="btn sec" id="fSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新挑戰</h2>
  <div class="tiles" id="iTiles"></div>
  <p id="iBody"></p>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="setrow"><span>顯示可配對（灰罩壓住的牌）</span><button class="sw" id="sDim" role="switch" aria-checked="true" aria-label="顯示可配對"><span class="trk"></span></button></div>
  <div class="setrow"><span>牌面風格</span><div class="seg" id="sStyle"><button data-v="0" aria-pressed="true">傳統</button><button data-v="1" aria-pressed="false">大字</button></div></div>
  <div class="setrow"><span>音效</span><button class="sw" id="sSnd" role="switch" aria-checked="true" aria-label="音效"><span class="trk"></span></button></div>
  <div class="setrow"><span>震動</span><button class="sw" id="sVib" role="switch" aria-checked="true" aria-label="震動"><span class="trk"></span></button></div>
  <div class="setrow"><span>禪模式竹林音景</span><button class="sw" id="sAmb" role="switch" aria-checked="true" aria-label="竹林音景"><span class="trk"></span></button></div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="stats"><div class="card">
  <h2>統計</h2>
  <div class="stgrid" id="stGrid"></div>
  <button class="btn" id="stOk">關閉</button>
</div></div>

<div class="ov hidden" id="share"><div class="card">
  <h2>分享成績</h2>
  <p>已複製到剪貼簿；若沒有，請長按下方文字複製。</p>
  <textarea class="sharebox" id="shareTxt" readonly></textarea>
  <button class="btn" id="shOk">好</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<script>
/*CORE-START*/
// SOLVER-BEGIN

  var n=lay.n,base=new Uint8Array(n).fill(1),c0=newCounts(lay,base),i,k,sumP=0,steps=0,stuck=0,members=[];
  for(i=0;i<NGROUP;i++)members.push([]);for(i=0;i<n;i++)members[groupOf(faces[i])].push(i);
  var gi=new Int8Array(n);for(i=0;i<n;i++)gi[i]=groupOf(faces[i]);
  for(var s=0;s<sims;s++){
    var present=base.slice(),c={ab:c0.ab.slice(),lc:c0.lc.slice(),rc:c0.rc.slice()},fr=new Uint8Array(n),fc=new Int16Array(NGROUP),rem=n;
    for(i=0;i<n;i++)if(freeOf(c,present,i)){fr[i]=1;fc[gi[i]]++;}
    while(rem>0){var P=0;for(k=0;k<NGROUP;k++)P+=fc[k]*(fc[k]-1)/2;
      if(P==0){stuck++;break;}sumP+=P;steps++;
      var x=rint(r,P),g=0;for(;g<NGROUP;g++){var q=fc[g]*(fc[g]-1)/2;if(x<q)break;x-=q;}
      var fl=[];for(k=0;k<members[g].length;k++)if(fr[members[g][k]])fl.push(members[g][k]);
      var a=fl.splice(rint(r,fl.length),1)[0],b=fl[rint(r,fl.length)];
      var aff=[];
      for(var z=0;z<2;z++){var t=z?b:a;present[t]=0;fr[t]=0;fc[gi[t]]--;cntRemove(lay,c,t,1);rem--;aff=aff.concat(lay.below[t],lay.left[t],lay.right[t]);}
      for(k=0;k<aff.length;k++){var u=aff[k];if(present[u]&&!fr[u]&&freeOf(c,present,u)){fr[u]=1;fc[gi[u]]++;}}
    }
  }
  return {avgPairs:steps?sumP/steps:0,stuck:stuck/sims};
}
function scoreS(N,L,st){return N/20+L*0.6+5/st.avgPairs+4*st.stuck;}

  particles.push({k:'leaf',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,r:Math.random()*6,vr:(Math.random()-0.5)*8,s:(5+Math.random()*6)*Math.max(0.7,TW/40),life:1.3+Math.random()*0.8,t:0,c:['#3a9e78','#6cc49a','#2f8a68','#9bd48a','#c9b458'][i%5],ph:Math.random()*6});}}
function spawnSteam(x,y,big){particles.push({k:'steam',x:x+(Math.random()-0.5)*20,y:y,vx:(Math.random()-0.5)*14,vy:-(20+Math.random()*30),s:(big?40:18)+Math.random()*30,life:2.2+Math.random()*1.5,t:-Math.random()*1.4,ph:Math.random()*6});}
function stepParticles(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.t+=dt;if(p.t>p.life){particles.splice(i,1);continue;}if(p.t<0)continue;
  if(p.k==='leaf'){p.vy+=160*dt;p.vx*=1-1.6*dt;p.vy*=1-1.2*dt;p.x+=(p.vx+Math.sin(p.t*5+p.ph)*30)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;}
  else {p.x+=(p.vx+Math.sin(p.t*1.6+p.ph)*12)*dt;p.y+=p.vy*dt;p.s+=12*dt;}}}
function drawParticles(){for(var i=0;i<particles.length;i++){var p=particles[i];if(p.t<0)continue;var a=1-p.t/p.life;
  if(p.k==='leaf'){ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.beginPath();ctx.moveTo(-p.s,0);ctx.quadraticCurveTo(0,-p.s*0.55,p.s,0);ctx.quadraticCurveTo(0,p.s*0.55,-p.s,0);ctx.fill();
    ctx.strokeStyle='rgba(20,70,45,0.5)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(-p.s,0);ctx.lineTo(p.s,0);ctx.stroke();ctx.restore();}
  else {ctx.globalAlpha=Math.min(1,p.t*2)*a*(dark?0.5:0.85);ctx.drawImage(getSteam(),p.x-p.s/2,p.y-p.s/2,p.s,p.s);ctx.globalAlpha=1;}}}

function buildBg(){bgC=mk(W*DPR,H*DPR);var g=bgC.getContext('2d');g.scale(DPR,DPR);
  var gr=g.createLinearGradient(0,0,0,H);if(dark){gr.addColorStop(0,'#132a20');gr.addColorStop(1,'#0b1712');}else{gr.addColorStop(0,'#e7efdf');gr.addColorStop(1,'#d2e1c6');}
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  var r=mulberry32(7),n=Math.max(5,Math.round(W/70));
  for(var i=0;i<n;i++){var x=(i+0.3+r()*0.5)*W/n,w=8+r()*10,col=dark?'rgba(120,210,160,0.06)':'rgba(50,100,60,0.08)';g.fillStyle=col;g.strokeStyle=col;
    var lean=(r()-0.5)*0.12;g.save();g.translate(x,H);g.rotate(lean);
    for(var y=0;y>-H*1.1;y-=60+r()*30){g.fillRect(-w/2,y-56,w,54);}
    for(var k=0;k<5;k++){var ly=-H*(0.25+r()*0.7),dir=r()<0.5?-1:1;for(var m=0;m<3;m++){g.save();g.translate(0,ly);g.rotate(dir*(0.5+m*0.35));g.beginPath();g.ellipse(dir*26,0,28,6,0,0,7);g.fill();g.restore();}}
    g.restore();}
}
function drawBg(){if(!bgC)buildBg();ctx.setTransform(1,0,0,1,0,0);var sw=Math.sin(time*0.5)*0.008;
  ctx.drawImage(bgC,0,0);ctx.save();ctx.globalAlpha=0.6;ctx.setTransform(1,0,sw,1,-sw*H*DPR,0);ctx.drawImage(bgC,0,0);ctx.restore();ctx.setTransform(DPR,0,0,DPR,0,0);}

var layerList=null;
function drawBoard(dt){
  var lay=G.lay,k=DPR*zmR,i,z,t;
  ctx.setTransform(DPR*zm,0,0,DPR*zm,DPR*(area.cx-cam.x*zm),DPR*(area.cy-cam.y*zm));
  var sw=sideSpr.width/k,sh=sideSpr.height/k,pad=PADS,lift=TW*0.07,flipS=1,showOld=false;
  if(flipT>0){flipT+=dt;var f=flipT/0.5;if(f>=1){flipT=0;}else{flipS=Math.abs(Math.cos(f*Math.PI));showOld=f<0.5;}}
  var shake=0;if(shk){shk.t+=dt;if(shk.t>0.4)shk=null;else shake=Math.sin(shk.t*60)*(1-shk.t/0.4)*TW*0.08;}
  for(z=0;z<=lay.maxZ;z++){
    for(i=0;i<lay.n;i++){t=lay.t[i];if(t[2]!==z||!G.present[i])continue;var p=tilePos(i);if(shk&&shk.i===i)p[0]+=shake;
      var ps=popT[i]!==undefined?popScale(i,dt):1;
      if(ps!==1){ctx.save();ctx.translate(p[0]+TW/2,p[1]+TH/2);ctx.scale(ps,ps);ctx.drawImage(sideSpr,-TW/2-pad,-TH/2-pad,sw,sh);ctx.restore();}
      else ctx.drawImage(sideSpr,p[0]-pad,p[1]-pad,sw,sh);}
    var selDraw=-1;
    for(i=0;i<lay.n;i++){t=lay.t[i];if(t[2]!==z||!G.present[i])continue;if(i===G.sel){selDraw=i;continue;}drawFace(i,0,flipS,showOld,shake);}
    if(selDraw>=0)drawFace(selDraw,lift,flipS,showOld,0);
  }
  // blockers + hint outlines
  if(blk){blk.t+=dt;if(blk.t>1)blk=null;else{ctx.save();ctx.globalAlpha=1-blk.t;ctx.strokeStyle='#e0533f';ctx.lineWidth=2.5/zm*1.2;ctx.setLineDash([5,4]);
    for(i=0;i<blk.list.length;i++){var q=tilePos(blk.list[i]);rr(ctx,q[0]+1,q[1]+1,TW-2,TH-2,TW*0.12);ctx.stroke();}ctx.restore();}}
  if(hintP){hintP.t+=dt;if(hintP.t>3.2||!G.present[hintP.a]||!G.present[hintP.b])hintP=null;else{var pu=0.5+0.5*Math.sin(hintP.t*7);
    ctx.save();ctx.strokeStyle='#f0b43c';ctx.shadowColor='#ffcf5a';ctx.shadowBlur=10*pu+4;ctx.lineWidth=3+pu*1.5;
    [hintP.a,hintP.b].forEach(function(j){var q=tilePos(j);rr(ctx,q[0]-1,q[1]-1,TW+2,TH+2,TW*0.14);ctx.stroke();});ctx.restore();}}
  // flyers
  for(i=flyers.length-1;i>=0;i--){var fl=flyers[i];fl.t+=dt;var u=Math.min(1,fl.t/fl.dur),e=u*u*(3-2*u);
    var cx=fl.x0+(fl.tx-fl.x0)*e,cy=fl.y0+(fl.ty-fl.y0)*e-Math.sin(u*Math.PI)*TH*0.5,sc=1-0.25*e,rot=(fl.tx>fl.x0?1:-1)*e*0.25;
    ctx.save();ctx.globalAlpha=u>0.85?(1-u)/0.15:1;ctx.translate(cx+TW/2,cy+TH/2);ctx.rotate(rot);ctx.scale(sc,sc);ctx.drawImage(sideSpr,-TW/2-pad,-TH/2-pad,sw,sh);ctx.drawImage(faceSpr[fl.f],-TW/2,-TH/2,TW,TH);ctx.restore();
    if(u>=1){flyers.splice(i,1);if(i%2===0||true){if(!fl.done){spawnLeaves(fl.tx+TW/2,fl.ty+TH/2,9);fl.done=1;}}}}
  drawParticles();
  for(i=floatTx.length-1;i>=0;i--){var ft=floatTx[i];ft.t+=dt;if(ft.t>1.2){floatTx.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=ft.t>0.8?(1.2-ft.t)/0.4:1;var s2=ft.t<0.15?0.6+ft.t/0.15*0.4:1;ctx.translate(ft.x,ft.y-ft.t*40);ctx.scale(s2,s2);
    ctx.font='900 '+Math.round(Math.max(20,TW*0.6))+'px '+SANS;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle=dark?'#0b1712':'#fffdf5';ctx.strokeText(ft.txt,0,0);ctx.fillStyle='#d9661f';ctx.fillText(ft.txt,0,0);ctx.restore();}
}
function popScale(i,dt){popT[i]+=dt;var u=popT[i]/0.25;if(u>=1){delete popT[i];return 1;}return 0.6+0.4*(1-Math.pow(1-u,3))+Math.sin(u*Math.PI)*0.08;}
function drawFace(i,lift,flipS,showOld,shake){
  var p=tilePos(i),t=G.lay.t[i],f=showOld&&oldFaces?oldFaces[i]:G.faces[i];p[0]-=lift;p[1]-=lift;if(shk&&shk.i===i)p[0]+=shake;
  var ps=popT[i]!==undefined?(0.6+0.4*Math.min(1,popT[i]/0.25)):1,sx=flipS*ps,sy=ps;
  if(sx!==1||sy!==1){ctx.save();ctx.translate(p[0]+TW/2,p[1]+TH/2);ctx.scale(Math.max(0.02,sx),sy);ctx.translate(-TW/2,-TH/2);p=[0,0];}
  ctx.drawImage(faceSpr[f],p[0],p[1],TW,TH);
  var shade=(G.lay.maxZ-t[2])*0.045;
  if(SET.dim&&!G.free[i]&&status==='play')shade+=dark?0.38:0.3;
  if(shade>0){ctx.globalAlpha=shade;ctx.drawImage(shadeSpr,p[0],p[1],TW,TH);ctx.globalAlpha=1;}
  if(SET.dim&&!G.free[i]&&status==='play'&&!dark){ctx.globalAlpha=0.12;ctx.fillStyle='#fff';rr(ctx,p[0],p[1],TW,TH,TW*0.13);ctx.fill();ctx.globalAlpha=1;}
  if(i===G.sel){var k=DPR*zmR;ctx.drawImage(selSpr,p[0]-6,p[1]-6,selSpr.width/k,selSpr.height/k);}
  if(sx!==1||sy!==1)ctx.restore();
}

function frame(now){
  rafId=0;var dt=Math.min(0.05,(now-lastT)/1000||0);lastT=now;time+=dt;

  var cells=[['已過關卡',done+' / '+NL],['總星數','★ '+stars],['遊玩局數',STATS.played],['完成局數',STATS.won],['最快 144 張',STATS.fast144?fmt(STATS.fast144):'—'],['平均洗牌／勝局',STATS.won?(STATS.shufWins/STATS.won).toFixed(2):'—'],['每日牌山完成',dk+' 天'],['每日連續',streak+' 天'],['累計配對',STATS.pairs],['禪模式局數',STATS.zen]];
  $('stGrid').innerHTML=cells.map(function(c){return '<div>'+c[0]+'<b>'+c[1]+'</b></div>';}).join('');show('stats');}
function shareText(){var s=G.mode==='level'?('第 '+G.n+' 關（難度 '+diffOf(G.n).toFixed(1)+'）'+'★★★'.slice(0,starsNow())):('每日牌山 '+String(today()).replace(/(\d{4})(\d\d)(\d\d)/,'$1/$2/$3'));
  return '🀄 麻將接龍｜'+s+'\n'+G.p.N+' 張牌山・用時 '+fmt(G.t)+'・輔助 '+aids()+' 次\n竹林茶室裡拆牌山，一起來挑戰！';}
function doShare(){var txt=shareText();
  if(navigator.share){navigator.share({text:txt}).catch(function(){});return;}
  $('shareTxt').value=txt;try{navigator.clipboard&&navigator.clipboard.writeText(txt).catch(function(){});}catch(e){}show('share');}
function back(to){if(to==='menu')show('menu');else if(to==='title')goTitle();else if(to==='play'){show(null);}else show(null);}
function openMenu(){if(!G||status!=='play')return;$('mInfo').textContent=(G.mode==='level'?'第 '+G.n+' 關・':'')+'剩 '+G.rem+' 張・'+(G.mode==='zen'?'禪模式':fmt(G.t));show('menu');}

$('tPlay').onclick=function(){audio();startGame('level',nextLevel());};
$('tSelect').onclick=function(){audio();buildSelect();show('select');};
$('tDaily').onclick=function(){audio();startGame('daily',0);};
$('tZen').onclick=function(){audio();startGame('zen',0);};
$('tStats').onclick=function(){openStats();};
$('tSet').onclick=function(){openSettings('title');};
$('tHelp').onclick=function(){openHelp('title');};
$('sBack').onclick=function(){if(G&&status==='play')show('menu');else goTitle();};
$('unlockSw').onclick=function(){unlockAll=!unlockAll;sset('unlockAll',unlockAll);buildSelect();};
$('grid').onclick=function(e){var b=e.target.closest('.lt');if(!b)return;var n=+b.dataset.n;if(!unlocked(n)){toast('先完成第 '+(n-1)+' 關，或打開「解鎖全部關卡」');return;}audio();startGame('level',n);};
$('bHint').onclick=function(){hint();};
$('bShuf').onclick=function(){audio();shuffle();};
$('bUndo').onclick=function(){audio();undo();};
$('bMenu').onclick=function(){openMenu();};
$('bFit').onclick=function(){zm=1;cam.x=area.cx;cam.y=area.cy;clampCam();if(zmR!==1){zmR=1;buildSprites();}updFit();};
$('mResume').onclick=function(){show(null);};
$('mRestart').onclick=function(){startGame(G.mode,G.n);};
$('mSet').onclick=function(){openSettings('menu');};
$('mHelp').onclick=function(){openHelp('menu');};
$('mHome').onclick=function(){goTitle();};
$('mSelect').onclick=function(){buildSelect();show('select');};
$('wNext').onclick=function(){if(G.mode==='level'){if(G.n<NL)startGame('level',G.n+1);else{buildSelect();show('select');}}else startGame(G.mode,0);};
$('wRetry').onclick=function(){startGame(G.mode,G.n);};
$('wShare').onclick=function(){doShare();};
$('wSelect').onclick=function(){goTitle();buildSelect();show('select');};
$('shOk').onclick=function(){show('win');};
$('fUndo').onclick=function(){undo();};
$('fRestart').onclick=function(){startGame(G.mode,G.n);};
$('fSelect').onclick=function(){goTitle();buildSelect();show('select');};
$('hOk').onclick=function(){back(helpBack);};
$('iOk').onclick=function(){show(null);toast('第 '+G.n+' 關・'+G.rem+' 張');};
$('setOk').onclick=function(){back(setBack);};
$('stOk').onclick=function(){goTitle();};
function swToggle(id,key,after){$(id).onclick=function(){SET[key]=!SET[key];$(id).setAttribute('aria-checked',SET[key]?'true':'false');sset('settings',SET);if(after)after();};}
swToggle('sDim','dim');swToggle('sVib','vib');
swToggle('sSnd','snd',function(){if(!SET.snd)ambStop();else if(G&&G.mode==='zen')ambStart();});
swToggle('sAmb','amb',function(){if(!SET.amb)ambStop();else if(G&&G.mode==='zen')ambStart();});
$('sStyle').onclick=function(e){var b=e.target.closest('button');if(!b)return;SET.style=+b.dataset.v;sset('settings',SET);[].forEach.call($('sStyle').children,function(x){x.setAttribute('aria-pressed',String(x===b));});buildSprites();};

/* ---------------- input ---------------- */
var ptrs={},np=0,gest=null,tap0=null;
cv.addEventListener('pointerdown',function(e){audio();if(!G||status!=='play')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};np=Object.keys(ptrs).length;
  if(np===1){tap0={x:e.clientX,y:e.clientY,moved:false,cx:cam.x,cy:cam.y};}
  else if(np===2&&zoomOK){var a=pts();gest={d:dist(a),z:zm,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,w:toWorld((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)};if(tap0)tap0.moved=true;}});
function pts(){var a=[];for(var k in ptrs)a.push(ptrs[k]);return a;}
function dist(a){return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
cv.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;e.preventDefault();ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(gest&&np>=2){var a=pts(),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;zm=Math.max(1,Math.min(2,gest.z*dist(a)/gest.d));cam.x=gest.w[0]-(mx-area.cx)/zm;cam.y=gest.w[1]-(my-area.cy)/zm;clampCam();updFit();return;}
  if(tap0&&np===1){var dx=e.clientX-tap0.x,dy=e.clientY-tap0.y;if(Math.hypot(dx,dy)>10)tap0.moved=true;
    if(tap0.moved&&zm>1.01){cam.x=tap0.cx-dx/zm;cam.y=tap0.cy-dy/zm;clampCam();}}});
function pEnd(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];np=Object.keys(ptrs).length;
  if(np===0){if(tap0&&!tap0.moved&&!gest)tapAt(tap0.x,tap0.y);if(gest&&Math.abs(zm-zmR)>0.12){zmR=zm;buildSprites();}tap0=null;gest=null;}}
cv.addEventListener('pointerup',pEnd);cv.addEventListener('pointercancel',function(e){if(ptrs[e.pointerId]){delete ptrs[e.pointerId];np=Object.keys(ptrs).length;if(!np){tap0=null;gest=null;}}});
cv.addEventListener('wheel',function(e){if(!G||status!=='play')return;e.preventDefault();setZoom(zm*Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY);},{passive:false});
document.addEventListener('touchmove',function(e){if(e.target===cv)e.preventDefault();},{passive:false});
window.addEventListener('keydown',function(e){var k=e.key;
  if(k==='Escape'){if(G&&status==='play'){if(overlayOpen())show(null);else openMenu();}return;}
  if(!G||status!=='play'||overlayOpen())return;
  if(k==='h'||k==='H'){hint();}else if(k==='s'||k==='S'){audio();shuffle();}else if(k==='z'||k==='Z'||k==='Backspace'){e.preventDefault();audio();undo();}});

/* ---------------- lifecycle ---------------- */
function resize(){W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);bgC=null;
  if(G)layoutGeom();else{faceSpr=[];}}
window.addEventListener('resize',resize);
if(mq){var onScheme=function(){dark=mq.matches;bgC=null;if(G)buildSprites();else faceSpr=[];};if(mq.addEventListener)mq.addEventListener('change',onScheme);else if(mq.addListener)mq.addListener(onScheme);}
document.addEventListener('visibilitychange',function(){running=!document.hidden;
  if(running)startLoop();else{if(G&&status==='play'&&!overlayOpen())openMenu();if(amb&&AC)try{AC.suspend();}catch(e){}}
  if(running&&amb&&AC)try{AC.resume();}catch(e){}});
resize();goTitle();startLoop();
if(!sget('helped',false)){sset('helped',true);}
window.__game={
  state:function(){return G?{status:status,mode:G.mode,n:G.n,rem:G.rem,pairs:G.pairs,sel:G.sel,t:G.t,shuf:G.shuf,hints:G.hints,flying:flyers.length,TW:TW,zm:zm,zoomOK:zoomOK,stars:status==='won'?starsNow():0}:{status:status};},
  plan:function(){return G?G.plan.map(function(p){return p.slice();}):null;},
  tileCenter:function(i){var p=tilePos(i),s=toScreen(p[0]+TW/2-(i===G.sel?TW*0.07:0),p[1]+TH/2-(i===G.sel?TW*0.07:0));return {x:s[0],y:s[1],present:!!G.present[i],free:!!G.free[i]};},
  hitTest:function(x,y){return hitTest(x,y);}
};
})();
</script>
