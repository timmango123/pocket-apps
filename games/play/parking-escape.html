<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.pills{display:flex;gap:10px;justify-content:center}

.pill[disabled]{opacity:.4}
.pill .badge{position:absolute;top:-4px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--accent2);color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px}
.pill.hintp{color:var(--gold)} .pill.hintp svg{stroke:var(--gold)}

<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<script>
/*CORE-START*/
// Board code: W*W chars ('.' empty, 'x' pillar, 'A' red car, 'B'.. other cars) + optional '|' + one-way list ("C>D^").
// 6x6 exit on row 2 (3rd row), 7x7 exit on row 3; red car 'A' is horizontal, length 2, goal = front at right edge.
function parseBoard(code) {
  var parts = code.split('|'), g = parts[0], N = g.length, W = Math.round(Math.sqrt(N));
  var walls = new Uint8Array(N), cars = [], map = {}, c, i;
  for (c = 0; c < N; c++) {
    var ch = g[c];
    if (ch === 'x') { walls[c] = 1; continue; }
    if (ch === '.') continue;
    if (map[ch] === undefined) { map[ch] = cars.length; cars.push({ id: ch, cells: [] }); }
    cars[map[ch]].cells.push(c);
  }
  cars.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
  var s = new Uint8Array(cars.length);
  for (i = 0; i < cars.length; i++) {
    var k = cars[i], c0 = k.cells[0], x = c0 % W, y = (c0 / W) | 0;
    k.len = k.cells.length; k.h = k.cells[1] - c0 === 1; k.f = k.h ? y : x; k.ow = 0; k.i = i;
    s[i] = k.h ? x : y; delete k.cells;
  }
  var ow = parts[1] || '';
  for (i = 0; i + 1 < ow.length; i += 2) {
    var car = cars.filter(function (q) { return q.id === ow[i]; })[0], d = ow[i + 1];
    if (car) car.ow = (d === '>' || d === 'v') ? 1 : -1;
  }
  return { W: W, N: N, exit: W === 7 ? 3 : 2, walls: walls, cars: cars, start: s };
}
function encodeBoard(B, s) {

    var rg = ctx.createLinearGradient(0, R.y + R.h*0.5, 0, R.y + R.h + cs*0.45);

    ctx.fillStyle = rg; ctx.fillRect(R.x + cs*0.12, R.y + R.h*0.5, R.w - cs*0.24, R.h*0.5 + cs*0.45);
    if (T.dark) {
      var ang = carFace(B, i), fx = Math.cos(ang), fy = Math.sin(ang);
      var cx = R.x + R.w/2 + fx*(R.w/2 - cs*0.1), cy = R.y + R.h/2 + fy*(R.h/2 - cs*0.1);
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cs*0.9);
      cg.addColorStop(0, 'rgba(255,244,200,.16)'); cg.addColorStop(1, 'rgba(255,244,200,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(cx - fy*cs*0.3, cy + fx*cs*0.3);
      ctx.lineTo(cx + fx*cs*0.9 - fy*cs*0.5, cy + fy*cs*0.9 + fx*cs*0.5); ctx.lineTo(cx + fx*cs*0.9 + fy*cs*0.5, cy + fy*cs*0.9 - fx*cs*0.5);
      ctx.lineTo(cx + fy*cs*0.3, cy - fx*cs*0.3); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  // hint ghost
  if (hint) {
    var hp = 0.55 + 0.45*Math.sin(hint.t*6), GR = carRect(B, hint.i, hint.to), pd = cs*0.08;
    ctx.save(); ctx.strokeStyle = T.dark ? '#ffd166' : '#c98a00'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 6]); ctx.lineDashOffset = -hint.t*30; ctx.globalAlpha = 0.6 + 0.4*hp;
    rr(ctx, GR.x + pd, GR.y + pd, GR.w - 2*pd, GR.h - 2*pd, cs*0.2); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,209,102,' + (0.08 + 0.08*hp) + ')'; ctx.fill();
    // arrow
    var CR = carRect(B, hint.i, dp[hint.i]), x1 = CR.x + CR.w/2, y1 = CR.y + CR.h/2, x2 = GR.x + GR.w/2, y2 = GR.y + GR.h/2;
    var dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1), axp = (x1 + x2)/2, ayp = (y1 + y2)/2;
    ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(axp - dx*cs*0.18 - dy*cs*0.16, ayp - dy*cs*0.18 + dx*cs*0.16); ctx.lineTo(axp + dx*cs*0.06, ayp + dy*cs*0.06); ctx.lineTo(axp - dx*cs*0.18 + dy*cs*0.16, ayp - dy*cs*0.18 - dx*cs*0.16); ctx.stroke();
    ctx.restore();
  }
  // trail (afterimages) for the red car
  if (trail.length) {
    ctx.save(); ctx.globalCompositeOperation = T.dark ? 'lighter' : 'source-over';
    for (var t=0;t<trail.length;t++) paintCar(ctx, B, 0, trail[t].x, { alpha: trail[t].life / 0.28 * 0.35, lite: true });
    ctx.restore();
  }
  // cars
  var dragI = drag ? drag.i : -1;
  for (var c=0;c<n;c++){
    if (c === dragI) continue;
    var o = {};
    if (hint && hint.i === c) o.glow = 14 + 10*Math.sin(hint.t*6);
    if (c === 0 && exitA && exitA.started) o.glow = 22;
    var pp = dp[c];
    if (bumpFx && bumpFx.i === c) pp += bumpFx.dir * 0.04 * Math.sin(bumpFx.t * 60);
    paintCar(ctx, B, c, pp, o);
    if (c === sel && status === 'play' && !(hint && hint.i === c)) {
      var SR = carRect(B, c, dp[c]); ctx.save(); ctx.strokeStyle = T.dark ? '#ffffff' : '#1f2340'; ctx.globalAlpha = 0.55 + 0.3*Math.sin(timeAcc*5); ctx.lineWidth = 2;
      rr(ctx, SR.x + cs*0.04, SR.y + cs*0.04, SR.w - cs*0.08, SR.h - cs*0.08, cs*0.24); ctx.stroke(); ctx.restore();
    }
  }
  if (dragI >= 0) paintCar(ctx, B, dragI, dp[dragI], { glow: 22, scale: 1.04 });
  // exit flash
  if (flash > 0) {
    var fx2 = ox + W*cs + fm*0.5, fy2 = oy + (B.exit + 0.5)*cs, fr = cs*(1.5 + (1 - flash)*3);
    var fg = ctx.createRadialGradient(fx2, fy2, 0, fx2, fy2, fr);
    fg.addColorStop(0, 'rgba(255,255,255,' + 0.9*flash + ')'); fg.addColorStop(0.3, 'rgba(255,59,92,' + 0.6*flash + ')'); fg.addColorStop(1, 'rgba(255,59,92,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx2, fy2, fr, 0, 7); ctx.fill();
  }
  ctx.restore();
  // particles
  for (var q=0;q<particles.length;q++){
    var P = particles[q], lf = P.life / P.max;
    if (P.ring) { ctx.strokeStyle = T.rain; ctx.globalAlpha = lf; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(P.x, P.y, (1 - lf)*9 + 1, (1 - lf)*3 + 0.5, 0, 0, 7); ctx.stroke(); }
    else if (P.col === 'smoke') { ctx.fillStyle = T.dark ? 'rgba(200,205,230,' + 0.35*lf + ')' : 'rgba(90,100,130,' + 0.3*lf + ')'; ctx.beginPath(); ctx.arc(P.x, P.y, P.r*(2 - lf), 0, 7); ctx.fill(); }
    else { ctx.globalAlpha = Math.min(1, lf*1.5); ctx.fillStyle = P.col; ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // rain streaks
  if (rain.length) {
    ctx.strokeStyle = T.rain; ctx.lineWidth = 1; ctx.beginPath();
    for (var d=0;d<rain.length;d++){ var r = rain[d], k2 = r.len / r.vy; ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx*k2, r.y - r.vy*k2); }
    ctx.stroke();
  }
}

/* ---------------- UI ---------------- */
var OVS = ['title', 'select', 'pause', 'win', 'help', 'intro', 'settings', 'stats'];
function showOnly(id){ OVS.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); }); }
var toastT = 0;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.opacity = '0'; toastT = setTimeout(function(){ t.classList.add('hidden'); }, 400); }, 2200); }
function goTitle(){
  status = 'title'; showOnly('title'); $('hud').classList.add('hidden'); $('bottom').classList.add('hidden'); $('replayBar').classList.add('hidden');
  startDemo();
}
var SECT = ['新手停車場', '卡車登場', '雙卡車塞車', '卡車大塞車', '障礙柱', '柱林迷陣', '深夜尖峰', '7×7 大停車場', '單向車', '終極停車場'];
function buildGrid(){
  var g = $('grid'), html = '', done = 0, st = 0;
  for (var n=1;n<=NL;n++){
    if ((n-1) % 10 === 0) html += '<div class="sec-h">' + n + '–' + (n+9) + '・' + SECT[(n-1)/10] + '</div>';
    var e = LEVELS[n-1], ok = unlocked(n), s = starsS[n] || 0, cls = 'lt' + (isDone(n) ? ' done' : '') + (!ok ? ' lock' : '') + (n === firstOpen() && ok ? ' cur' : '');
    if (isDone(n)) done++; st += s;
    html += '<button class="' + cls + '" data-n="' + n + '" aria-label="第 ' + n + ' 關，難度 ' + fmtD(e[4]) + (ok ? '' : '，未解鎖') + '">';
    if (ok) html += '<span class="n">' + n + '</span><span class="st">' + [0,1,2].map(function(k){ return '<span' + (k < s ? ' class="on"' : '') + '>★</span>'; }).join('') + '</span><span class="lamps">' + lampsHtml(e[4]) + '</span>';
    else html += '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="lamps">' + lampsHtml(e[4]) + '</span>';
    html += '</button>';
  }
  g.innerHTML = html;
  $('selSum').textContent = '已通過 ' + done + ' / ' + NL + ' 關・★ ' + st + ' / ' + (NL*3) + '　車燈數＝難度（1–5）';
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return;
  var n = +b.dataset.n; audio();
  if (!unlocked(n)) { SFX.bump(); vib(15); toast('先通過第 ' + (n-1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
});
$('unlockSw').addEventListener('click', function(){ audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
function openSelect(){ showOnly('select'); status = 'select'; buildGrid(); var c = document.querySelector('.lt.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
function mechCanvas(key){
  var c = document.createElement('canvas'), s = 64, d = 2; c.width = s*d; c.height = s*d;
  var x = c.getContext('2d'), T = TH(); x.scale(d, d);
  x.fillStyle = T.ground; x.fillRect(0, 0, s, s);
  x.strokeStyle = T.line; x.lineWidth = 1; for (var i=1;i<4;i++){ x.beginPath(); x.moveTo(i*16, 0); x.lineTo(i*16, s); x.stroke(); }
  if (key === 'basic') { drawCar(x, 24, 40, 28, 13, 0, T.red, { stripes: true, lite: true }); drawCar(x, 56, 32, 28, 13, Math.PI/2, NEON[0], { lite: true }); }
  if (key === 'truck') { drawCar(x, 32, 24, 44, 13, 0, shade('#7b61ff', -0.2), { truck: true, lite: true }); drawCar(x, 22, 48, 28, 13, Math.PI, NEON[1], { lite: true }); }
  if (key === 'pillar') { drawPillar(x, 24, 24, 16, T); drawCar(x, 24, 48, 28, 13, 0, NEON[3], { lite: true }); }
  if (key === 'big') { x.strokeStyle = T.frame; x.lineWidth = 2; x.strokeRect(4, 4, 56, 56); for (var a=0;a<7;a++) for (var b=0;b<7;b++) { if ((a*3 + b*5) % 4 === 0) { x.fillStyle = NEON[(a+b) % 5]; x.fillRect(5 + a*8, 5 + b*8, 7, 7); } } x.fillStyle = T.red; x.fillRect(13, 29, 15, 7); }
  if (key === 'oneway') { drawCar(x, 32, 32, 40, 16, 0, NEON[2], { oneway: true, lite: true }); }
  if (key === 'all') { drawPillar(x, 0, 0, 16, T); drawCar(x, 40, 12, 30, 12, 0, NEON[4], { oneway: true, lite: true }); drawCar(x, 30, 44, 44, 13, Math.PI, shade('#29e7cd', -0.2), { truck: true, lite: true }); }
  return c;
}
function mechBlock(m){ var w = document.createElement('div'); w.className = 'mech'; w.appendChild(mechCanvas(m.key)); var t = document.createElement('div'); t.innerHTML = '<b>' + m.name + (m.lv > 1 ? '（第 ' + m.lv + ' 關起）' : '') + '</b><br>' + m.desc; w.appendChild(t); return w; }
function showIntro(m){ $('iTitle').textContent = m.lv === 1 ? '歡迎來到霓虹夜停' : '新機制：' + m.name; var b = $('iBody'); b.innerHTML = ''; b.appendChild(mechBlock(m)); showOnly('intro'); }
function showHelp(){
  var b = $('helpBody'); b.innerHTML = '';
  MECH.forEach(function(m){ b.appendChild(mechBlock(m)); });
  var p = document.createElement('p'); p.style.textAlign = 'left'; p.style.fontSize = '14px';
  p.innerHTML = '<b>操作</b>：按住車子沿車身方向拖曳，放開會吸附到格子上（拖不到 0.4 格會彈回）。也可以先點車子、再點同一直線上的空格。<br><b>計步</b>：一次拖曳算 1 步；悔棋不會減少步數。<br><b>星級</b>：★★★ 步數 ≤ 最少步數，★★ ≤ 最少步數＋4。<br><b>提示</b>：每關 3 次，會標出下一步；用完後可在暫停選單看解答。<br><b>鍵盤</b>：Tab 選車、方向鍵移動、Z 悔棋、R 重來、H 提示、Esc 暫停。';
  b.appendChild(p);
  showOnly('help');
}
var helpReturn = null, setReturn = null;
function pauseGame(){ if (status !== 'play') return; status = 'paused'; drag = null; $('pInfo').textContent = (cur.daily ? '每日挑戰' : '第 ' + cur.n + ' 關') + '・目前 ' + moves + ' 步・最少 ' + cur.m + ' 步'; showOnly('pause'); stopRain(); }
function resume(){ showOnly(null); status = 'play'; audio(); startRain(); }
function syncSwitches(){ ['sound','rain','rainfx','vib'].forEach(function(k){ var id = { sound:'sSound', rain:'sRain', rainfx:'sRainFx', vib:'sVib' }[k]; $(id).setAttribute('aria-checked', setg[k] ? 'true' : 'false'); }); setMuteIcon(); }
[['sSound','sound'],['sRain','rain'],['sRainFx','rainfx'],['sVib','vib']].forEach(function(p){
  $(p[0]).addEventListener('click', function(){ audio(); setg[p[1]] = !setg[p[1]]; sset(p[1], setg[p[1]]); if (p[1] === 'rainfx') autoOff = false; syncSwitches(); SFX.click(); if (!setg.sound || !setg.rain) stopRain(); });
});
function openSettings(from){ setReturn = from; syncSwitches(); showOnly('settings'); }
$('setOk').addEventListener('click', function(){ SFX.click(); if (setReturn === 'pause') showOnly('pause'); else showOnly('title'); });
function openStats(){
  var c3 = 0, sm = 0, sb = 0, dn = 0, dd = 0;
  for (var n=1;n<=NL;n++) if (isDone(n)) { dn++; sm += LEVELS[n-1][1]; sb += prog[n]; if (starsS[n] === 3) c3++; }
  for (var d in daily) dd++;
  $('statKv').innerHTML = '<span>已通過關卡</span><b>' + dn + ' / ' + NL + '</b><span>三星關卡</span><b>' + c3 + '</b><span>累計移動步數</span><b>' + stats.moves + '</b><span>最佳步數比率</span><b>' + (sb ? Math.round(sm / sb * 100) + '%' : '—') + '</b><span>悔棋次數</span><b>' + stats.undos + '</b><span>使用提示</span><b>' + stats.hints + '</b><span>每日挑戰完成</span><b>' + dd + ' 天</b>';
  $('achList').innerHTML = ACH.map(function(a){ return '<div class="ach' + (ach[a.k] ? ' got' : '') + '"><span class="ic">' + (ach[a.k] ? a.ic : '?') + '</span><div><b>' + a.name + '</b><small>' + a.desc + '</small></div></div>'; }).join('');
  showOnly('stats');
}
function share(){
  var st = starsFor(moves, cur.m), txt = '霓虹夜停 ' + (cur.daily ? '每日挑戰 ' + dayStr() : '第 ' + cur.n + ' 關') + ' ' + moves + ' 步 ' + '★★★'.slice(0, st) + (moves <= cur.m ? '（最佳解）' : '');
  function done(){ toast('已複製：' + txt); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ toast(txt); });
    else if (navigator.share) navigator.share({ text: txt }).catch(function(){});
    else toast(txt);
  } catch(e){ toast(txt); }
}

$('tPlay').addEventListener('click', function(){ audio(); SFX.click(); startLevel(firstOpen()); });
$('tDaily').addEventListener('click', function(){ audio(); SFX.click(); startLevel(0, true); });
$('tSelect').addEventListener('click', function(){ audio(); SFX.click(); openSelect(); });
$('tHelp').addEventListener('click', function(){ audio(); SFX.click(); helpReturn = 'title'; showHelp(); });
$('tStats').addEventListener('click', function(){ audio(); SFX.click(); openStats(); });
$('tSet').addEventListener('click', function(){ audio(); SFX.click(); openSettings('title'); });
$('statOk').addEventListener('click', function(){ SFX.click(); showOnly('title'); });
$('sBack').addEventListener('click', function(){ SFX.click(); goTitle(); });
$('bPause').addEventListener('click', function(){ audio(); SFX.click(); if (status === 'replay') { stopReplay(); } pauseGame(); });
$('bMute').addEventListener('click', function(){ audio(); setg.sound = !setg.sound; sset('sound', setg.sound); setMuteIcon(); if (setg.sound) { SFX.click(); startRain(); } else stopRain(); });
$('bUndo').addEventListener('click', undo);
$('bRestart').addEventListener('click', restart);
$('bHint').addEventListener('click', doHint);
$('bStopReplay').addEventListener('click', function(){ SFX.click(); stopReplay(); });
$('pResume').addEventListener('click', function(){ SFX.click(); resume(); });
$('pRestart').addEventListener('click', function(){ status = 'play'; restart(); });
$('pSolve').addEventListener('click', function(){ SFX.click(); startReplay(); });
$('pHelp').addEventListener('click', function(){ SFX.click(); helpReturn = 'pause'; showHelp(); });
$('pSet').addEventListener('click', function(){ SFX.click(); openSettings('pause'); });
$('pSelect').addEventListener('click', function(){ SFX.click(); stopRain(); goTitle(); });
$('hOk').addEventListener('click', function(){ SFX.click(); if (helpReturn === 'pause') showOnly('pause'); else showOnly('title'); });
$('iOk').addEventListener('click', function(){ SFX.click(); showOnly(null); toast('第 ' + cur.n + ' 關・最少 ' + cur.m + ' 步'); });
$('wNext').addEventListener('click', function(){
  audio(); SFX.click(); var act = $('wNext').dataset.act;
  if (act === 'next') startLevel(cur.n + 1); else if (act === 'retry') { if (cur.daily) startLevel(0, true); else startLevel(cur.n); } else goTitle();
});
$('wRetry').addEventListener('click', function(){ audio(); SFX.click(); if (cur.daily) startLevel(0, true); else startLevel(cur.n); });
$('wSelect').addEventListener('click', function(){ SFX.click(); openSelect(); });
$('wShare').addEventListener('click', function(){ SFX.click(); share(); });

window.addEventListener('resize', function(){ layout(); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { running = false; cancelAnimationFrame(rafId); stopRain(); if (AC) { try{ AC.suspend(); }catch(e){} } if (status === 'play') pauseGame(); }
  else { if (!running) { running = true; last = performance.now(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); } }
});

// automation hook for the verifier (read-only snapshot + geometry)
window.__game = {
  state: function(){ return { status: status, level: cur.n, moves: moves, s: S ? Array.prototype.slice.call(S) : [], animating: animating() || status === 'exiting', W: cur.B ? cur.B.W : 0 }; },
  geom: function(){ return { ox: ox, oy: oy, cs: cs }; },
  cars: function(){ return cur.B.cars.map(function(k){ return { len: k.len, h: k.h, f: k.f, ow: k.ow }; }); },
  sol: function(){ return cur.sol; }
};

syncSwitches();
goTitle();
layout();
rafId = requestAnimationFrame(function(t){ last = t; frame(t); });
})();
</script>
