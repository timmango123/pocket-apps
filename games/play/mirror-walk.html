<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>鏡湖雙影</title>
<style>
:root{
--ink:#4a2f22; --ink2:#80604c; --card:#fff8eef2; --pill:#fff8eeec; --line:#ecd6bd; --accent:#ff9f43; --accent2:#e9783a; --gold:#ffc94d;
--tile:#fffaf2; --tile2:#fbeedd; --lock:#efe3d4; --shadow:#5a3d2b2e; --ovbg:#3a2433a8; --sw:#d9c6b2; --on:#ff9f43;
--bg:linear-gradient(180deg,#ffcf8b 0%,#f5a46f 48%,#2b3f6e 52%,#1d2b53 100%);
--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
:root{ --ink:#eef0fa; --ink2:#aab3d1; --card:#1e2546f2; --pill:#222a4feb; --line:#353f6c; --accent:#ffb35c; --accent2:#e98b3a;
--tile:#252d55; --tile2:#2b3462; --lock:#1b2244; --shadow:#0006; --ovbg:#070a1cb8; --sw:#3d4778; --on:#f0a04b;
--bg:linear-gradient(180deg,#4a3040 0%,#2c2236 48%,#141c3a 52%,#0b1128 100%); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2b53;background-image:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);
display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--pill);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg,.pill svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active,.pill:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--pill);border-radius:14px;height:44px;box-shadow:0 3px 10px var(--shadow);
display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.1}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}
.pips i{width:4px;height:9px;border-radius:2px;background:var(--line)}
.rule{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--ink);background:var(--tile2);border-radius:10px;padding:3px 7px;white-space:nowrap;height:30px}
.rule svg{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rule.pulse{animation:rpulse 1.2s ease 2}
@keyframes rpulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16);box-shadow:0 0 0 4px #ffb35c66}}
.stat{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right;line-height:1.15}
.stat b{color:var(--ink);font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
display:flex;justify-content:center;align-items:flex-end;gap:10px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pills{display:flex;gap:8px}
.pill{width:64px;height:54px;border-radius:16px;background:var(--pill);box-shadow:0 4px 12px var(--shadow);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:12px}
.pill[disabled]{opacity:.42}
.pill.on{background:var(--accent);color:#fff}.pill.on svg{stroke:#fff}
.dpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:2px}
.dpad button{border-radius:16px;background:var(--pill);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;touch-action:none}
.dpad button svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.dpad button.down{background:var(--accent);transform:scale(.94)}.dpad button.down svg{stroke:#fff}
.dpad button.hint{animation:hintk .5s ease 4}
@keyframes hintk{50%{background:#ffd27a}}
.dpad .du{grid-column:2;grid-row:1}.dpad .dl{grid-column:1;grid-row:2}.dpad .dr{grid-column:3;grid-row:2}.dpad .dd{grid-column:2;grid-row:3}
.dpad .dc{grid-column:2;grid-row:2;border-radius:50%;background:transparent;box-shadow:none;display:grid;place-items:center;pointer-events:none}
.dpad .dc i{width:12px;height:12px;border-radius:50%;background:var(--line)}
body.pad .dpad{display:grid}
body.pad .bottom{justify-content:space-between}
body.pad .pills{display:grid;grid-template-columns:repeat(2,64px);gap:8px}
body.land .bottom{top:0;padding-top:calc(var(--sat) + 60px);align-items:flex-end;justify-content:space-between}
body.land .pills{flex-direction:column;align-self:center}
body.land.pad .pills{display:flex}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
background:var(--ovbg);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px #0004;padding:22px 20px;width:min(370px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:4px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:17px;margin-top:11px;font-weight:800;font-size:17px;
background:linear-gradient(180deg,#ffb867,#ff9439);color:#fff;box-shadow:0 5px 0 #d06a24,0 8px 18px #d06a2444}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d06a24}
.btn.sec{background:var(--tile2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.cool{background:linear-gradient(180deg,#8fc0e8,#5f93cf);box-shadow:0 5px 0 #3f6ea8,0 8px 18px #3f6ea844}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;font-size:15px}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0;color:var(--line)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #e0a420;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:23px;color:var(--ink)}
#win{background:#2a1d2a45;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start;overflow:hidden}
.ttl{margin-top:calc(var(--sat) + 7vh);text-align:center;width:100%}
.ttl h1{font-size:50px;margin:0;letter-spacing:8px;color:#5a2f1c;text-shadow:0 3px 0 #ffe7c2,0 10px 26px #b0602a66}
.ttl .sub{color:#7a4a30;font-weight:700;margin-top:8px;font-size:15px;letter-spacing:1px}
.tbtns{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);display:flex;flex-direction:column;align-items:center;padding:0 24px}
.tbtns .btn{max-width:320px}
.tbtns .row2{width:100%;max-width:320px}
@media (prefers-color-scheme: dark){ .ttl h1{color:#ffe2b8;text-shadow:0 3px 0 #6a3a2a,0 10px 30px #ffb35c55} .ttl .sub{color:#f2c9a0} }
#select{align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto;background:var(--card)}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--sw);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:var(--on)}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;column-gap:12px}.selsum span{white-space:nowrap}.selsum .lg{color:var(--accent2);font-weight:700}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
@media (min-width:560px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{height:76px;border-radius:15px;background:var(--tile);box-shadow:0 3px 0 var(--line),0 6px 12px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt .md{position:absolute;top:3px;right:4px;font-size:11px;color:var(--accent2);font-weight:800}
.lt.done{background:var(--tile2)}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{background:var(--lock);box-shadow:0 3px 0 var(--line);color:var(--ink2);opacity:.8}
.lt.lock svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:8;background:#2b1d2ae6;color:#fff;padding:7px 14px;border-radius:14px;font-size:13px;white-space:nowrap;font-weight:600;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.banner{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);z-index:9;background:#2b1d2aee;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:700;white-space:nowrap}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--tile2);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:56px;height:56px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:54vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.helpscroll p{font-size:14px}
.demo{display:block;width:100%;max-width:300px;height:auto;aspect-ratio:300/230;margin:6px auto;border-radius:16px}
.ach{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:14px;background:var(--tile2);margin:7px 0}
.ach .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--line);flex:none;filter:grayscale(1);opacity:.6}
.ach.got .ic{background:linear-gradient(180deg,#ffd77a,#ffae45);filter:none;opacity:1}
.ach b{display:block;font-size:15px}.ach span{font-size:12px;color:var(--ink2)}
@media (max-height:600px){ .ov{align-items:flex-start} .ttl{margin-top:calc(var(--sat) + 3vh)} .ttl h1{font-size:38px} .tbtns{bottom:calc(var(--sab) + 8px)} .tbtns .btn{height:44px;margin-top:7px} .helpscroll{max-height:46vh} }
@media (max-height:600px) and (min-width:700px){ #title{justify-content:flex-start} .tbtns{left:auto;right:calc(var(--sar) + 24px);width:340px;bottom:auto;top:calc(var(--sat) + 30px)} .ttl{width:auto;margin-left:calc(var(--sal) + 40px);text-align:left} }
@media (hover:hover){ .btn:hover{filter:brightness(1.05)} .lt:hover{filter:brightness(1.04)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="pips" id="hPips"></span></div>
    </div>
    <div class="rule" id="hRule"></div>
    <div class="stat">步數 <b id="hMoves">0</b><br>最少 <span id="hOpt">6</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <div class="pills">
    <button class="pill" id="bUndo" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>悔棋</button>
    <button class="pill" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
    <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
    <button class="pill" id="bPad" aria-label="十字鍵" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>十字鍵</button>
  </div>
  <div class="dpad" id="dpad">
    <button class="du" data-d="0" aria-label="上"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="dl" data-d="3" aria-label="左"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="dc"><i></i></span>
    <button class="dr" data-d="1" aria-label="右"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="dd" data-d="2" aria-label="下"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>鏡湖雙影</h1>
    <div class="sub">一個指令・兩隻狐狸・左右相反</div>
  </div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始遊戲</button>
    <button class="btn sec" id="tSelect">選擇關卡</button>
    <div class="row2"><button class="btn sec" id="tHelp">玩法說明</button><button class="btn sec" id="tAch">成就</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pHelp">說明</button></div>
  <button class="btn sec" id="pSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">雙雙抵達！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>步數<b id="wMoves">0</b></div><div>最少<b id="wOpt">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wReplay">看最少解</button><button class="btn sec" id="wShare">分享成績</button></div>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2 id="fTitle">哎呀！</h2>
  <p id="fMsg"></p>
  <div class="row2"><button class="btn" id="fUndo">悔棋一步</button><button class="btn sec" id="fRestart">重來</button></div>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="helpscroll" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機關</h2>
  <div id="iBody"></div>
  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="achv"><div class="card">
  <h2>成就</h2>
  <div class="helpscroll" id="achBody"></div>
  <button class="btn" id="aOk">關閉</button>
</div></div>

<div class="banner hidden" id="banner"></div>
<div class="toast hidden" id="toast"></div>
<script>
/*CORE-START*/
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

geo: function(){ return { s: geo.s, A: geo.A, B: geo.B, horiz: geo.horiz }; },
move: function(d){ tryMove(d); },
diff: function(n){ return { D: DS[n-1], d10: d10(n) }; }
};
setMuteIcon();
layout();
startLoop();
})();
