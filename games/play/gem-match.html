<meta charset="utf-8">

<title>深海珍珠</title>
<style>
:root{
  --ink:#eaf6ff; --ink2:#9cc3dd; --card:#0b3354e6; --card2:#0e3e63; --line:#ffffff1f; --accent:#46d3e6; --gold:#ffd25e; --warm:#ff8a7a;
  --ovbg:#01142699; --btn1:#3cc8e0; --btn2:#1d93c4; --btnsh:#13698f; --sec:#174a70; --secsh:#0a2c47; --tile:#0f4268;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: light){
  :root{ --ink:#123a52; --ink2:#4b7189; --card:#ffffffd9; --card2:#eaf8fb; --line:#0b3b5a1a; --accent:#0aa5c0; --gold:#f2a900; --warm:#f06a55;
    --ovbg:#bfeaf2a8; --btn1:#38c6dc; --btn2:#1497bb; --btnsh:#0f7392; --sec:#e3f4f8; --secsh:#b9dbe4; --tile:#ffffff; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#032542;color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
@media (prefers-color-scheme: light){ html,body{background:#8fdbe6} }
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);display:flex;align-items:stretch;gap:8px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px #0003;display:grid;place-items:center;flex:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;min-height:44px;box-shadow:0 3px 10px #0003;display:flex;flex-direction:column;justify-content:center;padding:2px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvname{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}
.pips i{width:5px;height:9px;border-radius:2px;background:#ffffff26}
@media (prefers-color-scheme: light){ .pips i{background:#0b3b5a1f} }
.movebox{flex:none;min-width:64px;background:linear-gradient(180deg,#ffcf5a,#ff9d3d);color:#4a2500;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #c76a1a,0 6px 14px #0004;padding:0 8px;transition:transform .15s}
.movebox b{font-size:24px;line-height:1;font-weight:900}
.movebox span{font-size:11px;font-weight:700;line-height:1.2}
.movebox.low{animation:lowp 1s infinite}
@keyframes lowp{50%{transform:scale(1.08)}}
.movebox.bump{transform:scale(1.15)}
.goalbar{position:fixed;left:0;right:0;top:calc(var(--sat) + 60px);padding:0 calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);z-index:5;display:flex;gap:8px;pointer-events:none}
.goals{flex:1;min-width:0;display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px 8px;box-shadow:0 3px 10px #0003;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.goal{display:flex;align-items:center;gap:3px;font-weight:800;font-size:16px;min-width:0;transition:transform .2s}
.goal canvas{width:34px;height:34px;flex:none}
.goal .ck{color:#3ee08a;font-size:20px}
.goal.bump{transform:scale(1.18)}
.glab{font-size:11px;color:var(--ink2);font-weight:600;white-space:nowrap}
.scorebox{flex:none;width:118px;background:var(--card);border-radius:14px;padding:6px 10px 7px;box-shadow:0 3px 10px #0003;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scorebox .sc{font-size:17px;font-weight:900;text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}
.scorebox .sl{font-size:11px;color:var(--ink2);float:left;line-height:20px}
.starbar{position:relative;height:8px;border-radius:4px;background:#ffffff22;margin-top:6px}
@media (prefers-color-scheme: light){ .starbar{background:#0b3b5a1a} }
.starbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#ffe07a,#ffb52e);width:0;transition:width .3s}
.starbar em{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;font-style:normal;font-size:12px;line-height:12px;color:#ffffff55;text-align:center}
.starbar em.on{color:var(--gold);text-shadow:0 0 6px #ffcc33}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none}
.bottom > *{pointer-events:auto}
.pill{height:50px;min-width:108px;padding:0 16px;border-radius:25px;background:var(--card);box-shadow:0 4px 14px #0003;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.45}
.pill.on{background:linear-gradient(180deg,#ffcf5a,#ff9d3d);color:#4a2500}
.pill.on svg{stroke:#4a2500}
.pill .cnt{background:#ffffff26;border-radius:10px;padding:1px 7px;font-size:13px}
/* landscape: HUD becomes a side panel */
body.land .hud{right:auto;width:var(--pw);flex-wrap:wrap}
body.land .goalbar{right:auto;width:var(--pw);top:calc(var(--sat) + 60px);flex-direction:column}
body.land .scorebox{width:auto}
body.land .bottom{right:auto;width:var(--pw);justify-content:flex-start}
body.land .pill{min-width:0;flex:1}
body.land .pips{display:none}
.hmid{overflow:hidden}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ovbg);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s ease;overflow-y:auto}
@media (max-height:600px){ .ov{align-items:flex-start} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card2);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 50px #0006;padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:52px;border-radius:18px;margin-top:12px;font-weight:800;font-size:17px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 5px 0 var(--btnsh),0 8px 18px #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btnsh)}
.btn.sec{background:var(--sec);color:var(--ink);box-shadow:0 4px 0 var(--secsh)}
.btn.warm{background:linear-gradient(180deg,#ffbf69,#ff8a4c);box-shadow:0 5px 0 #c4602a,0 8px 18px #0003;color:#fff}
.btn[disabled]{opacity:.45}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;min-width:0}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:#ffffff30;line-height:1.1}
@media (prefers-color-scheme: light){ .stars{color:#0b3b5a22} }
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c98a00,0 0 18px #ffd25e88;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:flex;justify-content:center;gap:22px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:24px;color:var(--ink)}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{margin-top:7vh;text-align:center}
.ttl h1{font-size:52px;margin:0;letter-spacing:8px;color:#fff;text-shadow:0 3px 0 #0b6f99,0 0 30px #46d3e6aa}
@media (prefers-color-scheme: light){ .ttl h1{color:#0d5e80;text-shadow:0 3px 0 #fff,0 0 24px #ffffffcc} }
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:10px;font-size:15px;letter-spacing:1px}
.tbtns{display:flex;flex-direction:column;align-items:stretch;width:min(320px,100%);padding-bottom:8px}
.tbtns .row2 .btn{font-size:15px}
/* level select map */
#select{align-items:stretch;padding:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 6px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap;text-shadow:0 2px 8px #0005}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);min-height:44px;padding:0 10px;background:var(--card);border-radius:14px}
.sw .trk{width:44px;height:26px;border-radius:13px;background:#ffffff33;position:relative;transition:background .2s;flex:none}
@media (prefers-color-scheme: light){ .sw .trk{background:#0b3b5a33} }
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#2ecf8f}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 6px;font-size:13px;color:var(--ink2);font-weight:600}
.map{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;touch-action:pan-y;overscroll-behavior:contain}
.mapin{position:relative;width:100%}
.mapin svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#7ee8f5,#1e9cc8 60%,#0f6d99);color:#fff;box-shadow:0 4px 0 #0b5577,0 8px 16px #0005;border:2px solid #ffffff66}
.node .n{font-size:21px;font-weight:900;line-height:1;text-shadow:0 1px 2px #0006}
.node .d{font-size:11px;font-weight:700;line-height:1.1;opacity:.95}
.node .st{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:1px;white-space:nowrap;color:#ffffff40;text-shadow:0 1px 2px #0006}
@media (prefers-color-scheme: light){ .node .st{color:#0b3b5a30;text-shadow:none} }
.node .st .on{color:var(--gold)}
.node.done{background:radial-gradient(circle at 35% 30%,#ffe9a0,#f3b53a 60%,#c97d12);box-shadow:0 4px 0 #9a5d0b,0 8px 16px #0005}
.node.cur{animation:curp 1.4s ease-in-out infinite}
@keyframes curp{50%{transform:scale(1.09);box-shadow:0 4px 0 #0b5577,0 0 0 8px #46d3e655}}
.node.lock{background:radial-gradient(circle at 35% 30%,#6a8295,#3b5366 70%);box-shadow:0 4px 0 #26394a;color:#c5d3de;border-color:#ffffff22}
.node.lock svg{width:20px;height:20px;stroke:#c5d3de;fill:none;stroke-width:2.4}
.node.daily{background:radial-gradient(circle at 35% 30%,#ffb3c7,#e85d8a 60%,#a8335c);box-shadow:0 4px 0 #7d2346,0 8px 16px #0005}
.node:active{transform:scale(.94)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 132px);transform:translateX(-50%);z-index:8;background:#021a2ee6;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;width:max-content;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:#ffffff10;border-radius:16px;padding:10px}
@media (prefers-color-scheme: light){ .mech{background:#0b3b5a0d} }
.mech canvas{flex:none;width:56px;height:56px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.helpscroll{max-height:56vh;overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.dex div{background:#ffffff10;border-radius:14px;padding:6px 2px;font-size:12px;color:var(--ink2)}
@media (prefers-color-scheme: light){ .dex div{background:#0b3b5a0d} }
.dex canvas{width:44px;height:44px;display:block;margin:0 auto}
.dex b{display:block;color:var(--ink);font-size:16px}
.failgoals{display:flex;justify-content:center;gap:12px;margin:8px 0}
.shareimg{max-width:100%;border-radius:14px;margin-top:8px}
@media (max-height:500px){
  .ttl{margin-top:0}.ttl h1{font-size:36px;letter-spacing:6px}.ttl .sub{margin-top:4px;font-size:13px}
  .tbtns{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;width:min(560px,100%)}.tbtns .row2{display:contents}
  .tbtns .btn{height:46px;margin-top:10px}
}
body.land .toast{left:calc(var(--pw) / 2 + 10px);top:auto;bottom:calc(var(--sab) + 76px);max-width:calc(var(--pw) - 16px);width:auto}
@media (hover:hover){ .btn:hover{filter:brightness(1.06)} .node:hover{filter:brightness(1.08)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div class="lvname" id="hLevel">第 1 關</div>
    <div class="diff">難度 <span id="hDiffN">1</span><span class="pips" id="hPips"></span></div>
  </div>
  <div class="movebox" id="moveBox"><b id="hMoves">30</b><span>步數</span></div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>
<div class="goalbar hidden" id="goalbar">
  <div class="goals" id="goals"></div>
  <div class="scorebox"><span class="sl">分數</span><div class="sc" id="hScore">0</div><div class="starbar"><i id="sbFill"></i><em id="sb1">★</em><em id="sb2">★</em><em id="sb3">★</em></div></div>
</div>
<div class="bottom hidden" id="bottom">
  <button class="pill" id="bHammer" aria-label="鎚子"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6z"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/></svg>鎚子<span class="cnt" id="hHam">3</span></button>
  <button class="pill" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
</div>

<div class="ov" id="title">
  <div class="ttl"><h1>深海珍珠</h1><div class="sub">交換海洋寶物・三連消除・點亮珊瑚礁</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始冒險</button>
    <button class="btn sec" id="tSelect">海底地圖</button>
    <div class="row2"><button class="btn sec" id="tDaily">每日挑戰</button><button class="btn sec" id="tDex">寶物圖鑑</button></div>
    <button class="btn sec" id="tHelp">玩法說明</button>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>海底地圖</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="map" id="map"><div class="mapin" id="mapin"></div></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重新開始</button><button class="btn sec" id="pHelp">說明</button></div>
  <button class="btn sec" id="pSelect">海底地圖</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">過關！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>分數<b id="wScore">0</b></div><div>最佳<b id="wBest">0</b></div></div>

  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wShare">分享成績</button></div>
  <button class="btn sec" id="wSelect">海底地圖</button>
</div></div>

  <div class="row2"><button class="btn" id="fRetry">重新挑戰</button><button class="btn sec" id="fSelect">海底地圖</button></div>

<div class="ov hidden" id="help"><div class="card">

  <button class="btn" id="iOk">開始挑戰</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<script>

function updateHud(){
  if (!L || !VS) return;
  $('hLevel').textContent = daily ? '每日挑戰' : '第 ' + levelN + ' 關';
  $('hDiffN').textContent = L.D;
  var pips = ''; for (var i = 1; i <= 10; i++) pips += '<i' + (i <= L.D ? ' style="background:' + diffColor(L.D) + '"' : '') + '></i>'; $('hPips').innerHTML = pips;
  $('hMoves').textContent = Math.max(0, VS.moves);
  $('moveBox').classList.toggle('low', VS.moves <= 3 && status === 'play');
  L.goals.forEach(function(g, k){ var left = goalLeft(VS, g), el = goalEls[k]; if (!el) return;
    if (left <= 0) el.innerHTML = '<span class="ck">✓</span>'; else el.textContent = g.t === 'score' ? String(g.q) : String(left); });
  $('hScore').textContent = VS.score;
  var st = L.star, mx = st*2.2; $('sbFill').style.width = Math.min(100, VS.score/mx*100) + '%';
  [1, 1.5, 2.2].forEach(function(m, k){ var e = $('sb' + (k+1)); e.style.left = (m/2.2*94) + '%'; e.classList.toggle('on', VS.score >= st*m); });
  $('hHam').textContent = hammers; $('bHammer').disabled = hammers <= 0 && mode !== 'hammer'; $('bHammer').classList.toggle('on', mode === 'hammer');
}
var toastT = 0;
function toast(msg, ms){ var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.opacity = 0; toastT = setTimeout(function(){ t.classList.add('hidden'); }, 400); }, ms || 1700); }

/* ---------------- flow ---------------- */
var OVS = ['title', 'select', 'pause', 'win', 'fail', 'help', 'intro'];
function showOnly(id){ OVS.forEach(function(o){ $(o).classList.toggle('hidden', o !== id); }); }
function setPlayUI(on){ ['hud', 'goalbar', 'bottom'].forEach(function(k){ $(k).classList.toggle('hidden', !on); }); }
function startLevel(n, opts){
  opts = opts || {};
  daily = opts.daily || null;
  levelN = n; L = daily ? daily.L : getDef(n);
  attemptSeed = forcedSeed != null ? forcedSeed : daily ? daily.seed : (Math.random()*4294967296) | 0;
  forcedSeed = null;
  S = newGame(L, attemptSeed); spr = {}; parts.length = 0; fxs.length = 0; floats.length = 0; anims.length = 0;
  sel = -1; drag = null; hintPair = null; mode = ''; busy = false; idleT = now;
  status = 'play'; showOnly(null); setPlayUI(true); buildGoals(); layout(); syncSprites();
  // drop-in intro animation
  for (var id in spr) { var o = spr[id]; (function(o, ty){ o.y = ty - L.h - 1; var dl = (L.h - ty)*30 + Math.random()*60; tw(420 + dl, function(p){ var q = Math.max(0, (p*(420 + dl) - dl)/420); o.y = ty - (L.h + 1)*(1 - q*q); }); })(o, o.y); }
  busy = true; wait(700).then(function(){ if (S && !S.over) busy = false; });
  var m = null; MECH.forEach(function(x){ if (x.lv === n && !daily) m = x; });
  if (m && !introSeen[m.key]) { introSeen[m.key] = 1; sset('intro', introSeen); showIntro(m); }
  else toast(goalText());
}
function goalText(){
  return L.goals.map(function(g){ return g.t === 'score' ? '得到 ' + g.q + ' 分' : g.t === 'collect' ? '收集 ' + g.q + ' 個' + GEMN[g.c] : g.t === 'ice' ? '打破所有冰塊' : g.t === 'stone' ? '擊碎所有礁石' : '運送 ' + g.q + ' 顆金珍珠'; }).join('、') + '（' + L.moves + ' 步）';
}
function showIntro(m){
  status = 'paused';
  $('iTitle').textContent = '新玩法：' + m.name;
  $('iBody').innerHTML = '';
  var d = document.createElement('div'); d.className = 'mech'; d.appendChild(iconCanvas(m.icon, 56));
  var tx = document.createElement('div'); tx.innerHTML = '<b>' + m.name + '</b><br>' + m.desc; d.appendChild(tx); $('iBody').appendChild(d);
  var p = document.createElement('p'); p.textContent = '本關目標：' + goalText(); $('iBody').appendChild(p);
  showOnly('intro');
}
async function attempt(a, b){
  if (busy || S.over || a < 0 || b < 0) return;
  hintPair = null; idleT = now; sel = -1;
  if (!S.cell[a] || !S.cell[b]) return;
  busy = true;
  if (!validSwap(S, a, b)) {
    var oa = spr[gid(S.cell[a])], ob = spr[gid(S.cell[b])], A = cellXY(a), B = cellXY(b); SFX.bad(); buzz(12);
    await tw(220, function(p){ var q = Math.sin(p*Math.PI)*0.45; if (oa) { oa.x = A[0] + (B[0]-A[0])*q; oa.y = A[1] + (B[1]-A[1])*q; } if (ob) { ob.x = B[0] + (A[0]-B[0])*q; ob.y = B[1] + (A[1]-B[1])*q; } });
    syncSprites(); busy = false; return;
  }
  var ev = []; trySwap(S, a, b, ev); VS._last = 0;
  await playEvents(ev); syncSprites(); idleT = now;
  await afterMove();
  busy = false;
}
async function afterMove(){
  if (S.over === 'win') {
    status = 'over'; setPlayUI(true);
    if (S.moves > 0) { floatText('Bonus！', board.x + board.cs*L.w/2, board.y + board.cs*L.h*0.45, board.cs*1.2, '#ffe27a'); await wait(600);
      var ev = []; bonus(S, ev); await playEvents(ev); syncSprites(); }
    await wait(300); showWin();
  } else if (S.over) {
    status = 'over'; SFX.lose(); await wait(400); showFail();
  }
  sset('stats', stats);
}
function starCount(){ if (S.extra) return 0; var st = L.star; return S.score >= st*2.2 ? 3 : S.score >= st*1.5 ? 2 : 1; }
function showWin(){
  var stars = starCount();
  SFX.whale(); buzz([30, 60, 30]);
  for (var i = 0; i < 4; i++) setTimeout(function(){ burst(W*(0.2 + Math.random()*0.6), H*(0.2 + Math.random()*0.3), ['#ffd25e', '#46d3e6', '#ff8aa8', '#7cf0a8'][Math.floor(Math.random()*4)], 26, Math.min(W, H)*0.5, 'spark'); }, i*220);
  stats.wins++;
  var best = 0;
  if (daily) {
    var dd = sget('daily', {}); if (!dd || dd.date !== todayKey()) dd = { date: todayKey(), best: 0, s: 0 };
    dd.best = Math.max(dd.best, S.score); dd.s = Math.max(dd.s, stars); sset('daily', dd); best = dd.best;
  } else {
    var pr = prog[levelN], isNew3 = stars === 3 && (!pr || pr.s < 3);
    prog[levelN] = { s: Math.max(stars, pr ? pr.s : 0), b: Math.max(S.score, pr ? pr.b : 0) }; best = prog[levelN].b; sset('progress', prog);
    if (isNew3) { hammers++; sset('hammers', hammers); }
  }
  sset('stats', stats);
  $('wTitle').textContent = stars === 3 ? '完美通關！' : S.extra ? '驚險過關！' : '過關！';
  var sh = ''; for (var k = 0; k < 3; k++) sh += k < stars ? '<span class="on" style="animation-delay:' + (0.25 + k*0.28) + 's">★</span>' : '<span>★</span>'; $('wStars').innerHTML = sh;
  $('wScore').textContent = S.score; $('wBest').textContent = best;
  $('wMsg').textContent = S.extra ? '用了再 5 步，這次不給星。' : stars === 3 ? '三星達成！獲得 1 把鎚子。' : ('分數達到 ' + (stars === 1 ? Math.round(L.star*1.5) : Math.round(L.star*2.2)) + ' 就能多一顆星');
  $('wNext').classList.toggle('hidden', !!daily || levelN >= NL);
  showOnly('win');
}
function showFail(){
  var bomb = S.over === 'bomb';
  $('fTitle').textContent = bomb ? '水雷爆炸了！' : '步數用完了';
  $('fMsg').textContent = bomb ? '水雷倒數歸零前要把它消除。' : '還差這些目標：';
  var fg = $('fGoals'); fg.innerHTML = '';
  L.goals.forEach(function(g){ var left = goalLeft(S, g); var d = document.createElement('div'); d.className = 'goal'; d.appendChild(iconCanvas(goalIcon(g), 34)); var s = document.createElement('span'); s.innerHTML = left > 0 ? String(left) : '<span class="ck">✓</span>'; d.appendChild(s); fg.appendChild(d); });
  $('fExtra').classList.toggle('hidden', S.extra > 0 || bomb);
  showOnly('fail');
}
function showHint(manual){
  if (busy || !S || S.over) return;
  var m = aiPick(S); if (!m) return;
  hintPair = m; idleT = now - 1;
  for (var id in spr) { var o = spr[id]; o.cell = Math.round(o.y)*L.w + Math.round(o.x); }
  if (manual) toast('看看晃動的寶物！', 1200);
}

/* ---------------- input ---------------- */
function cellAt(px, py){
  var x = Math.floor((px - board.x)/board.cs), y = Math.floor((py - board.y)/board.cs);
  if (x < 0 || y < 0 || x >= L.w || y >= L.h) return -1; var i = y*L.w + x; return L.mask[i] ? i : -1;
}
function neighbor(i, dx, dy){ var x = i % L.w + dx, y = ((i / L.w) | 0) + dy; if (x < 0 || y < 0 || x >= L.w || y >= L.h) return -1; return y*L.w + x; }
cv.addEventListener('pointerdown', function(e){
  audio();
  if (status !== 'play' || busy || !L) return;
  var i = cellAt(e.clientX, e.clientY); idleT = now; hintPair = null;
  if (i < 0) { sel = -1; return; }
  if (mode === 'hammer') { useHammer(i); return; }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, i: i, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch(err) {}
});
cv.addEventListener('pointermove', function(e){
  if (!drag || drag.id !== e.pointerId || drag.moved) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < Math.min(18, board.cs*0.4)) return;
  drag.moved = true;
  var j = Math.abs(dx) > Math.abs(dy) ? neighbor(drag.i, dx > 0 ? 1 : -1, 0) : neighbor(drag.i, 0, dy > 0 ? 1 : -1);
  if (j >= 0) attempt(drag.i, j);
});
function endDrag(e){
  if (!drag || drag.id !== e.pointerId) return;
  var d = drag; drag = null;
  if (d.moved || busy) return;
  var i = d.i;
  if (sel >= 0 && sel !== i && isAdj(L, sel, i)) { var s0 = sel; sel = -1; attempt(s0, i); }
  else if (sel === i) sel = -1;
  else if (S.cell[i]) { sel = i; SFX.click(); }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', function(e){ if (drag && drag.id === e.pointerId) drag = null; });
async function useHammer(i){
  if (hammers <= 0) { mode = ''; updateHud(); return; }
  busy = true; var ev = [];
  if (!hammer(S, i, ev)) { busy = false; toast('這裡不能敲喔'); return; }
  mode = ''; hammers--; sset('hammers', hammers); VS._last = 0;
  var xy = cellXY(i); SFX.hammer(); shake = 0.6; burst(cx(xy[0]), cy(xy[1]), '#ffcf5a', 14, board.cs*3, 'spark');
  await playEvents(ev); syncSprites(); idleT = now;
  await afterMove(); busy = false;
}

/* ---------------- level select map ---------------- */
var NODE_GAP = 92;
function buildMap(){
  var inn = $('mapin'), wd = Math.min(640, W), total = NL*NODE_GAP + 80;
  inn.style.height = total + 'px'; inn.innerHTML = '';
  var pts = [];
  for (var n = 1; n <= NL; n++) pts.push([50 + Math.sin(n*0.62)*28, 50 + (n-1)*NODE_GAP]);
  var svg = '<svg viewBox="0 0 100 ' + total + '" preserveAspectRatio="none" style="height:' + total + 'px"><path d="M' + pts.map(function(p){ return p[0] + ' ' + p[1]; }).join(' L') + '" fill="none" stroke="' + (dark() ? '#7fdcf055' : '#ffffffaa') + '" stroke-width="1.6" stroke-dasharray="2 2.5" vector-effect="non-scaling-stroke" style="stroke-width:6px"/></svg>';
  inn.innerHTML = svg;
  var stars = 0, done = 0, cur = highestUnlocked();
  for (var k = 1; k <= NL; k++) {
    var b = document.createElement('button'), d = getDef(k), ok = unlocked(k), st = starsOf(k);
    b.className = 'node' + (isDone(k) ? ' done' : '') + (ok ? '' : ' lock') + (k === cur ? ' cur' : '');
    b.style.left = pts[k-1][0] + '%'; b.style.top = (pts[k-1][1] - 31) + 'px'; b.dataset.n = k;
    b.setAttribute('aria-label', '第 ' + k + ' 關，難度 ' + d.D + (ok ? '' : '，未解鎖'));
    var ss = ''; for (var q = 0; q < 3; q++) ss += q < st ? '<span class="on">★</span>' : '★';
    b.innerHTML = ok ? '<span class="n">' + k + '</span><span class="d">難度 ' + d.D + '</span><span class="st">' + ss + '</span>' : '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="d">難度 ' + d.D + '</span>';
    b.style.setProperty('--dc', diffColor(d.D));
    if (isDone(k)) { done++; stars += st; }
    inn.appendChild(b);
  }
  $('selSum').textContent = '已通過 ' + done + ' / ' + NL + ' 關・星星 ' + stars + ' / ' + (NL*3);
  $('unlockSw').setAttribute('aria-checked', unlockAll ? 'true' : 'false');
}
function openSelect(){
  status = 'select'; L = null; setPlayUI(false); showOnly('select'); buildMap();
  var cur = highestUnlocked(); $('map').scrollTop = Math.max(0, 50 + (cur-1)*NODE_GAP - $('map').clientHeight/2);
}
$('mapin').addEventListener('click', function(e){
  var b = e.target.closest('.node'); if (!b) return; var n = +b.dataset.n; audio();
  if (!unlocked(n)) { SFX.bad(); toast('先通過第 ' + (n-1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
});
$('unlockSw').addEventListener('click', function(){ audio(); SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); var st = $('map').scrollTop; buildMap(); $('map').scrollTop = st; });

/* ---------------- buttons ---------------- */
function on(id, fn){ $(id).addEventListener('click', function(e){ audio(); SFX.click(); fn(e); }); }
on('tPlay', function(){ startLevel(highestUnlocked()); });
on('tSelect', openSelect);
on('sBack', function(){ status = 'title'; setPlayUI(false); showOnly('title'); });
on('tDaily', function(){
  var dl = dailyLevel(), Ld = levelDef(dl.n, TUNE[dl.n-1][0]/100, TUNE[dl.n-1][1], TUNE[dl.n-1][3]); Ld.D = TUNE[dl.n-1][2];
  var dd = sget('daily', {}); startLevel(dl.n, { daily: { L: Ld, seed: dl.seed } });
  if (dd && dd.date === todayKey()) toast('今日最佳 ' + dd.best + ' 分・' + goalText(), 2400);
});
on('tDex', showDex);
on('tHelp', function(){ showHelp('title'); });
on('pHelp', function(){ showHelp('pause'); });
var helpBack = 'title';
function showHelp(back){
  helpBack = back; var hb = $('helpBody'); hb.innerHTML = '';
  MECH.forEach(function(m){ var d = document.createElement('div'); d.className = 'mech'; d.appendChild(iconCanvas(m.icon, 56)); var t = document.createElement('div'); t.innerHTML = '<b>' + m.name + '</b>' + (m.lv > 1 ? '（第 ' + m.lv + ' 關起）' : '') + '<br>' + m.desc; d.appendChild(t); hb.appendChild(d); });
  var p = document.createElement('p'); p.innerHTML = '特殊組合：條紋＋條紋＝十字、條紋＋漩渦＝3 行 3 列、漩渦＋漩渦＝5×5、彩虹＋特殊＝同色全部變特殊、彩虹＋彩虹＝清空全盤。<br>過關後剩餘步數會變成條紋寶物引爆加分。卡住 5 秒會自動提示。'; hb.appendChild(p);
  $('helpT').textContent = '玩法說明'; showOnly('help');
}
function showDex(){
  helpBack = 'title'; var hb = $('helpBody'); hb.innerHTML = '';
  var g = document.createElement('div'); g.className = 'dex';
  for (var c = 0; c < 6; c++) { var d = document.createElement('div'); d.appendChild(iconCanvas('g' + c, 44)); d.insertAdjacentHTML('beforeend', '<b>' + stats.c[c] + '</b>' + GEMN[c]); g.appendChild(d); }
  hb.appendChild(g);
  var p = document.createElement('p'); var tot = stats.c.reduce(function(a, b){ return a + b; }, 0);
  p.innerHTML = '累計消除 <b>' + tot + '</b> 顆寶物<br>特殊寶物引爆 ' + stats.sp + ' 次・合成彩虹珍珠 ' + stats.rb + ' 顆<br>送達金珍珠 ' + stats.pearls + ' 顆・最長連鎖 ' + stats.maxCasc + ' 層・過關 ' + stats.wins + ' 次';
  hb.appendChild(p); $('helpT').textContent = '寶物圖鑑'; showOnly('help');
}
on('hOk', function(){ showOnly(helpBack === 'pause' ? 'pause' : 'title'); });
on('iOk', function(){ showOnly(null); status = 'play'; idleT = now; toast(goalText()); });
on('bPause', function(){ if (status !== 'play') return; status = 'paused'; $('pInfo').textContent = (daily ? '每日挑戰' : '第 ' + levelN + ' 關') + '・' + goalText(); showOnly('pause'); });
on('pResume', function(){ showOnly(null); status = 'play'; idleT = now; });
on('pRestart', function(){ startLevel(levelN, { daily: daily }); });
on('pSelect', openSelect);
on('wNext', function(){ startLevel(Math.min(NL, levelN + 1)); });
on('wRetry', function(){ startLevel(levelN, { daily: daily }); });
on('wSelect', function(){ daily ? (status = 'title', setPlayUI(false), showOnly('title')) : openSelect(); });
on('fRetry', function(){ startLevel(levelN, { daily: daily }); });
on('fSelect', openSelect);
on('fExtra', function(){ S.moves += 5; S.extra = 1; S.over = ''; VS.moves = S.moves; status = 'play'; showOnly(null); updateHud(); toast('再 5 步！加油！'); if (!listMoves(S).length) shuffle(S, null), syncSprites(); });
on('bMute', function(){ muted = !muted; sset('mute', muted); setMuteIcon(); });
on('bHammer', function(){ if (status !== 'play' || busy) return; if (mode === 'hammer') mode = ''; else if (hammers > 0) { mode = 'hammer'; toast('點一顆寶物或礁石把它敲碎', 1400); } updateHud(); });
on('bHint', function(){ if (status === 'play' && !busy) showHint(true); });
on('wShare', function(){
  var st = starCount(), txt = '我在《深海珍珠》' + (daily ? '每日挑戰' : '第 ' + levelN + ' 關') + '拿到 ' + S.score + ' 分 ' + '★★★'.slice(0, st) + '☆☆☆'.slice(0, 3 - st) + '！';
  try { if (navigator.share) { navigator.share({ text: txt }).catch(function(){}); return; } } catch(e) {}
  try { navigator.clipboard.writeText(txt).then(function(){ toast('已複製成績文字'); }, function(){ toast(txt, 3000); }); } catch(e) { toast(txt, 3000); }
});

/* ---------------- lifecycle ---------------- */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { running = false; if (AC && AC.state === 'running') AC.suspend().catch(function(){}); if (status === 'play' && !busy) { status = 'paused'; $('pInfo').textContent = goalText(); showOnly('pause'); } }
  else { if (!running) { running = true; lastT = 0; requestAnimationFrame(frame); } }
});
addEventListener('resize', function(){ layout(); if (status === 'select') buildMap(); });
if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', function(){ if (status === 'select') buildMap(); });
setMuteIcon(); layout(); requestAnimationFrame(frame);
window.__game = {
  state: function(){ return { status: status, busy: busy, level: levelN, moves: S ? S.moves : 0, score: S ? S.score : 0, over: S ? S.over : '', w: L ? L.w : 0, h: L ? L.h : 0, board: board, cells: S ? Array.from(S.cell) : [], anims: anims.length }; },
  setSeed: function(s){ forcedSeed = s | 0; },
  seed: function(){ return attemptSeed; }
};
})();
</script>
