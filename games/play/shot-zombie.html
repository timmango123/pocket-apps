<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();

<script>
(()=>{
'use strict';
const ID='shot-zombie';
const store={
  get(k,d){try{const v=localStorage.getItem(ID+':'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(ID+':'+k,JSON.stringify(v));}catch(e){}}
};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- constants ---------- */
const VIS=-0.03;          // an entity counts as "on screen" once its feet pass this
const MIN_GAP=0.075;     // min distance (field heights) between consecutive zombies -> closest is never ambiguous
const LANE_SEP=0.16;     // min distance between two entities in the same lane (no sprite overlap)
const SKINS=['#93c75a','#7cae6c','#a9bd5c','#72b38e'];
const SHIRTS=['#6b4f8a','#8a4646','#46668a','#7a6a3f','#4f7a4a','#8a5a2f'];
const TUNE={d0:0.5,d1:0.022,d2:0.0001};
const RQ={n:7,near:0.97,anim:0.07,dur:30,stun:0.4,pen:0.5,grace:0.08};  // 速射: queue size, front slot, advance ease, run length, wrong-tap flash, wrong-tap time penalty
const slotY=i=>RQ.near-i*Lt.gapN;
const KEYS={'1':0,'2':1,'3':2,'4':3,'j':0,'k':1,'l':2,';':3};

/* ---------- state ---------- */
let W=0,H=0,DPR=1,ins={t:0,r:0,b:0,l:0};
const Lt={};
const bg=document.createElement('canvas');
let muted=!!store.get('mute',false);
const S={phase:'title',mode:'surv',ents:[],lanes:3,kills:0,score:0,combo:0,maxCombo:0,hearts:3,time:0,penalty:0,
  rescued:0,shots:0,hits:0,wrong:0,stun:0,started:false,tailY:0.3,spawnedZ:0,blockedLane:-1,sinceSurv:0,v:0,nid:1,announced:{},endT:0,endReason:'',demoT:0,lastHitT:0};
const parts=[],decals=[],floats=[],tracers=[],flashes=[];
const btnAnim=[0,0,0,0],btnBad=[0,0,0,0];
let shake=0,banner=null,arrow=null,redFlash=0,hurtFlash=0;

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
  }catch(e){AC=null;}
}
function noise(dur,type,freq,q,vol,t0){
  if(!AC)return;const t=AC.currentTime+(t0||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);return f;
}
function tone(type,f0,f1,dur,vol,t0){
  if(!AC)return;const t=AC.currentTime+(t0||0);
  const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
const sfx={
  shot(){noise(0.14,'bandpass',1800,0.8,0.9);tone('sine',160,40,0.16,0.7);},
  splat(){const f=noise(0.22,'lowpass',900,4,0.7,0.02);if(f)f.frequency.exponentialRampToValueAtTime(200,AC.currentTime+0.24);tone('sine',320,70,0.18,0.35,0.02);},
  clank(){tone('square',1250,900,0.12,0.18);tone('triangle',2100,1700,0.2,0.22);noise(0.08,'highpass',4000,1,0.4);},
  wrong(){tone('square',150,110,0.12,0.3);tone('square',100,70,0.2,0.3,0.12);noise(0.25,'lowpass',500,1,0.3);},
  oops(){tone('triangle',700,300,0.3,0.35);tone('sine',500,200,0.35,0.2,0.05);},
  rescue(){[660,880,1320].forEach((f,i)=>tone('sine',f,0,0.18,0.3,i*0.07));},
  dry(){tone('square',900,600,0.03,0.08);},
  over(){tone('sawtooth',220,40,1.1,0.4);noise(0.9,'lowpass',400,1,0.5);},
  win(){[523,659,784,1047].forEach((f,i)=>tone('triangle',f,0,0.25,0.3,i*0.09));},
  groan(){if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(95+rnd()*30,t);
    o.frequency.linearRampToValueAtTime(70+rnd()*20,t+0.7);const lf=AC.createOscillator();lf.frequency.value=7;const lg=AC.createGain();lg.gain.value=8;lf.connect(lg);lg.connect(o.frequency);
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.09,t+0.15);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);lf.start(t);o.stop(t+0.85);lf.stop(t+0.85);},
  click(){tone('triangle',600,900,0.05,0.15);},
  level(){tone('sawtooth',300,600,0.25,0.15);tone('sawtooth',450,900,0.25,0.12,0.12);}
};
function setMute(m){muted=m;store.set('mute',m);if(master)master.gain.value=m?0:0.55;
  $('btnMute').textContent=$('btnMute2').textContent=m?'🔇':'🔊';}

/* ---------- layout ---------- */
function readInsets(){
  try{const cs=getComputedStyle($('probe'));ins={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){}
}
function layout(){
  readInsets();
  W=Math.max(200,innerWidth);H=Math.max(300,innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  Lt.hudH=58+ins.t;
  Lt.btnH=clamp(H*0.14,78,124);
  Lt.btnTop=H-ins.b-Lt.btnH-6;
  Lt.barH=clamp(H*0.045,26,40);
  Lt.barY=Lt.btnTop-Lt.barH-4;
  Lt.fieldTop=Lt.hudH;
  Lt.fieldBot=Lt.barY+4;
  Lt.fieldH=Lt.fieldBot-Lt.fieldTop;
  Lt.playW=Math.min(W-ins.l-ins.r-12,520);
  Lt.playX=ins.l+(W-ins.l-ins.r-Lt.playW)/2;
  setLaneGeom();
}
function setLaneGeom(){
  Lt.laneW=Lt.playW/S.lanes;
  Lt.unit=Math.min(Lt.laneW*0.7,Lt.fieldH*0.14,92);
  Lt.topPad=Lt.unit*0.8*1.3;
  // 速射 draws one big zombie per row, rows overlapping like a tight queue
  Lt.rs=Math.min(Lt.laneW*0.75,Lt.fieldH/5.3);Lt.gapN=0.85*Lt.rs/(Lt.fieldH-Lt.topPad);
  if(S.mode==='rapid')for(const e of S.ents){e.y=e.fromY=e.toY=slotY(e.slot);e.tt=1;}
  buildBg();
}
const laneX=l=>Lt.playX+Lt.laneW*(l+0.5);
const yPx=y=>Lt.fieldTop+Lt.topPad+y*(Lt.fieldH-Lt.topPad);
function setLanes(n){S.lanes=n;setLaneGeom();}

/* ---------- background (cached) ---------- */
function buildBg(){
  bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
  const c=bg.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  const R=mulberry32(77);
  // sides: graveyard dirt
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c1528');g.addColorStop(1,'#120e19');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  // moon
  c.fillStyle='rgba(255,240,200,.08)';c.beginPath();c.arc(W*0.8,Lt.fieldTop+18,46,0,7);c.fill();
  c.fillStyle='#efe2b8';c.beginPath();c.arc(W*0.8,Lt.fieldTop+18,24,0,7);c.fill();
  c.fillStyle='#d6c79a';c.beginPath();c.arc(W*0.8-7,Lt.fieldTop+12,5,0,7);c.arc(W*0.8+8,Lt.fieldTop+24,3.5,0,7);c.fill();
  // road
  const x0=Lt.playX,w=Lt.playW,top=Lt.fieldTop,bot=Lt.barY+Lt.barH;
  for(let i=0;i<S.lanes;i++){
    c.fillStyle=i%2?'#2a2338':'#30283f';
    c.fillRect(x0+Lt.laneW*i,top,Lt.laneW,bot-top);
  }
  // distance stripes (subtle)
  c.fillStyle='rgba(255,255,255,.035)';
  for(let k=1;k<10;k++){c.fillRect(x0,yPx(k/10),w,2);}
  // cracks & stains
  c.strokeStyle='rgba(10,6,16,.55)';c.lineWidth=1.5;
  for(let i=0;i<26;i++){let x=x0+R()*w,y=top+R()*(bot-top);c.beginPath();c.moveTo(x,y);
    for(let j=0;j<4;j++){x+=(R()-.5)*26;y+=(R()-.5)*18;c.lineTo(x,y);}c.stroke();}
  for(let i=0;i<10;i++){c.fillStyle='rgba(20,40,10,.18)';c.beginPath();c.ellipse(x0+R()*w,top+R()*(bot-top),10+R()*24,5+R()*10,0,0,7);c.fill();}
  // lane dividers
  c.strokeStyle='rgba(230,215,160,.28)';c.lineWidth=3;c.setLineDash([18,16]);
  for(let i=1;i<S.lanes;i++){const x=x0+Lt.laneW*i;c.beginPath();c.moveTo(x,top);c.lineTo(x,Lt.barY);c.stroke();}
  c.setLineDash([]);
  // road edges
  c.fillStyle='#4a3d5c';c.fillRect(x0-5,top,5,bot-top);c.fillRect(x0+w,top,5,bot-top);
  // side graveyard decorations
  const sideW=x0-6;
  if(sideW>30){
    for(let s=0;s<2;s++){
      for(let i=0;i<6;i++){
        const cx=s?x0+w+10+R()*(sideW-30)+12:6+R()*(sideW-30)+12,cy=top+60+i*(Lt.fieldH/6)+R()*20;
        c.fillStyle='#3a3248';c.beginPath();c.moveTo(cx-12,cy);c.lineTo(cx-12,cy-22);c.arc(cx,cy-22,12,Math.PI,0);c.lineTo(cx+12,cy);c.fill();
        c.fillStyle='#4b425c';c.fillRect(cx-6,cy-24,12,3);c.fillRect(cx-1.5,cy-30,3,14);
        c.fillStyle='#2a3a1c';c.beginPath();c.ellipse(cx,cy,18,4,0,0,7);c.fill();
      }
    }
  }
  // skyline silhouettes at top of field (behind fog)
  c.fillStyle='#160f20';
  let sx=x0-40;
  while(sx<x0+w+40){const bw=24+R()*40,bh=12+R()*30;c.fillRect(sx,top,bw,bh);
    if(R()<.5){c.fillStyle='#e6c25a';c.globalAlpha=.35;c.fillRect(sx+6,top+4,5,5);c.globalAlpha=1;c.fillStyle='#160f20';}sx+=bw+4;}
  // dead tree
  c.strokeStyle='#160f20';c.lineWidth=4;c.lineCap='round';
  const tx=x0+w*0.15;c.beginPath();c.moveTo(tx,top+50);c.lineTo(tx+4,top+4);c.moveTo(tx+2,top+26);c.lineTo(tx-16,top+12);c.moveTo(tx+3,top+18);c.lineTo(tx+18,top+6);c.stroke();
  // top fog
  g=c.createLinearGradient(0,top,0,top+Lt.topPad*0.8);g.addColorStop(0,'rgba(28,20,40,1)');g.addColorStop(1,'rgba(28,20,40,0)');
  c.fillStyle=g;c.fillRect(0,top,W,Lt.topPad*0.8);
  // HUD bar
  g=c.createLinearGradient(0,0,0,Lt.hudH);g.addColorStop(0,'#0e0a15');g.addColorStop(1,'#1d1529');
  c.fillStyle=g;c.fillRect(0,0,W,Lt.hudH);
  c.fillStyle='#4a2a2a';c.fillRect(0,Lt.hudH-3,W,3);
  // button tray
  g=c.createLinearGradient(0,Lt.btnTop-4,0,H);g.addColorStop(0,'#241a2f');g.addColorStop(1,'#0f0a15');
  c.fillStyle=g;c.fillRect(0,Lt.barY+Lt.barH,W,H-(Lt.barY+Lt.barH));
  // barricade
  drawBarricade(c);
}
function drawBarricade(c){
  const x0=Lt.playX-6,w=Lt.playW+12,y=Lt.barY,h=Lt.barH;
  // sandbags behind
  c.fillStyle='#6d5b3d';
  for(let x=x0;x<x0+w;x+=34){c.beginPath();c.ellipse(x+17,y+h-4,18,9,0,0,7);c.fill();}
  // planks
  const R=mulberry32(5);
  const ph=h*0.42;
  for(let r=0;r<2;r++){
    let x=x0;
    while(x<x0+w){const pw=Math.min(60+R()*50,x0+w-x);const py=y+r*(ph+2)+(R()-.5)*3;
      c.fillStyle=R()<.5?'#8b5e34':'#7a5130';c.fillRect(x,py,pw-2,ph);
      c.fillStyle='rgba(255,220,160,.18)';c.fillRect(x,py,pw-2,2);
      c.fillStyle='rgba(0,0,0,.28)';c.fillRect(x,py+ph-2,pw-2,2);
      c.fillStyle='#2d1d10';c.fillRect(x+4,py+ph/2-1.5,3,3);c.fillRect(x+pw-9,py+ph/2-1.5,3,3);
      x+=pw;}
  }
  // cross braces
  c.strokeStyle='#5c3a1d';c.lineWidth=6;
  for(let i=0;i<S.lanes;i++){const bx=Lt.playX+Lt.laneW*i;c.beginPath();c.moveTo(bx+8,y-2);c.lineTo(bx+Lt.laneW-8,y+h);c.stroke();}
  // barbed wire
  c.strokeStyle='#9a9aa6';c.lineWidth=1.5;c.beginPath();
  for(let x=x0;x<=x0+w;x+=6){c.lineTo(x,y-3+Math.sin(x*0.4)*2.5);}c.stroke();
  c.fillStyle='#c9c9d4';for(let x=x0+8;x<x0+w;x+=22){c.fillRect(x-2,y-5,4,4);}
}

/* ---------- difficulty ---------- */
function params(){
  if(S.phase==='title')return{v:0.09,catchT:0.3,catchK:0.4,gapMin:MIN_GAP,gapAvg:0.2,armor:0.2,surv:0.12,lanes:3};
  if(S.mode==='ta')return{v:0.12,catchT:0.55,catchK:1.3,gapMin:MIN_GAP,gapAvg:0.12,armor:0.2,surv:0.1,lanes:4};
  const k=S.kills,t=S.time;
  // time-driven pressure: D = zombies per second arriving at the barricade
  const D=TUNE.d0+TUNE.d1*t+TUNE.d2*t*t;
  const gapAvg=clamp(0.24-0.0012*t,0.095,0.24);
  return{
    v:D*gapAvg,
    catchT:0.35,catchK:0.9,
    gapMin:MIN_GAP,
    gapAvg,
    armor:k<15?0:Math.min(0.32,0.14+0.003*(k-15)),
    surv:k<45?0:0.09,
    lanes:k<30?3:4
  };
}

/* ---------- entities ---------- */
function pickLane(y,n,blocked){
  const ok=[];let fb=-1,fbd=-1e9;
  for(let l=0;l<n;l++){
    if(l===blocked)continue;
    let m=9;for(const e of S.ents)if(e.lane===l&&e.y<m)m=e.y;
    const d=m-y;
    if(d>=LANE_SEP)ok.push(l);
    if(d>fbd){fbd=d;fb=l;}
  }
  return ok.length?ok[(rnd()*ok.length)|0]:fb;
}
function spawnOne(p){
  const n=p.lanes;
  if(S.blockedLane<0&&p.surv>0&&S.sinceSurv>=4&&rnd()<p.surv&&!(S.mode==='ta'&&S.phase==='play'&&S.spawnedZ>=27)){
    const y=S.tailY-0.09;
    const lane=pickLane(y,n,-1);
    S.ents.push({id:S.nid++,type:'s',lane,y,hp:1,armor:false,x:laneX(lane),t:rnd()*9,flash:0,kick:0,skin:'#f1c49b',shirt:'#f08a24'});
    S.blockedLane=lane;S.tailY=y;S.sinceSurv=0;return;
  }
  const gap=p.gapMin+rnd()*2*(p.gapAvg-p.gapMin);
  const y=S.tailY-Math.max(p.gapMin,gap);
  const lane=pickLane(y,n,S.blockedLane);
  const armor=rnd()<p.armor;
  S.ents.push({id:S.nid++,type:'z',lane,y,hp:armor?2:1,armor,x:laneX(lane),t:rnd()*9,flash:0,kick:0,
    skin:SKINS[(rnd()*SKINS.length)|0],shirt:SHIRTS[(rnd()*SHIRTS.length)|0],eye:rnd()<.5});
  S.tailY=y;S.spawnedZ++;S.sinceSurv++;
}
function closestZombie(){let Z=null;for(const e of S.ents)if(e.type==='z'&&e.y>VIS&&(!Z||e.y>Z.y))Z=e;return Z;}
function firstInLane(l){let T=null;for(const e of S.ents)if(e.lane===l&&e.y>VIS&&(!T||e.y>T.y))T=e;return T;}
function removeEnt(e){const i=S.ents.indexOf(e);if(i>=0)S.ents.splice(i,1);}
/* 速射: S.ents is the queue itself, index = slot (0 = closest to the barricade). */
function rapidLane(){
  const q=S.ents,n=q.length;
  if(n>=3){const a=q[n-1].lane;if(q[n-2].lane===a&&q[n-3].lane===a){const o=[0,1,2].filter(l=>l!==a);return o[(rnd()*o.length)|0];}}
  return (rnd()*3)|0;
}
function rapidSpawn(fromAbove){
  const slot=S.ents.length,lane=rapidLane(),ty=slotY(slot),step=Lt.gapN;
  const y=fromAbove?ty-step:ty;
  S.ents.push({id:S.nid++,type:'z',lane,y,fromY:y,toY:ty,tt:fromAbove?0:1,slot,hp:1,armor:false,x:laneX(lane),t:rnd()*9,flash:0,kick:0,
    skin:SKINS[(rnd()*SKINS.length)|0],shirt:SHIRTS[(rnd()*SHIRTS.length)|0],eye:rnd()<.5});
}
function rapidAdvance(){
  S.ents.forEach((e,i)=>{if(e.slot!==i){e.slot=i;e.fromY=e.y;e.toY=slotY(i);e.tt=0;}});
  while(S.ents.length<RQ.n)rapidSpawn(true);
}
const easeOut=t=>1-(1-t)*(1-t)*(1-t);

/* ---------- game flow ---------- */
function resetRun(mode){
  S.mode=mode;S.ents.length=0;S.kills=0;S.score=0;S.combo=0;S.maxCombo=0;S.hearts=3;S.time=0;S.penalty=0;S.rescued=0;
  S.shots=0;S.hits=0;S.wrong=0;S.stun=0;S.started=false;S.spawnedZ=0;S.blockedLane=-1;S.sinceSurv=0;S.announced={};S.endT=0;
  pendTaps.length=0;parts.length=0;decals.length=0;floats.length=0;tracers.length=0;flashes.length=0;arrow=null;banner=null;redFlash=0;hurtFlash=0;
}
function startGame(mode){
  ensureAudio();
  resetRun(mode);
  S.phase='play';
  if(mode==='rapid'){
    setLanes(3);
    while(S.ents.length<RQ.n)rapidSpawn(false);
    showOverlay(null);$('hudbtns').hidden=false;
    showBanner('速射模式','開第一槍就開始計時・30 秒');
    sfx.level();return;
  }
  S.tailY=mode==='ta'?0.52:0.3;
  setLanes(mode==='ta'?4:3);
  const p=params();while(S.tailY>-0.02)spawnOne(p);
  for(const e of S.ents)e.x=laneX(e.lane);
  showOverlay(null);$('hudbtns').hidden=false;
  showBanner(mode==='ta'?'擊倒 30 隻！':'先打最近的！',mode==='ta'?'裝甲要兩槍・別打倖存者':'點錯扣 0.5 秒');
  sfx.level();
}
function goTitle(){
  resetRun('surv');S.phase='title';S.tailY=0.4;setLanes(3);
  const p=params();while(S.tailY>-0.02)spawnOne(p);for(const e of S.ents)e.x=laneX(e.lane);
  $('hudbtns').hidden=true;refreshTitle();showOverlay('title');
}
function pauseGame(){if(S.phase!=='play')return;S.phase='pause';showOverlay('pause');}
function resumeGame(){if(S.phase!=='pause')return;S.phase='play';showOverlay(null);last=performance.now();}
function showOverlay(id){for(const o of ['title','pause','result'])$(o).hidden=o!==id;
  const el=id&&$(id).querySelector('button');if(el)try{el.focus({preventScroll:true});}catch(e){}}

function endGame(reason,who){
  if(S.phase!=='play')return;
  S.phase='ending';S.endReason=reason;S.endT=reason==='clear'?0.9:reason==='time'?1.1:1.3;
  if(reason==='time'){S.stun=0;arrow=null;sfx.win();showBanner('時間到！','擊倒 '+S.kills+' 隻');}
  else if(reason==='clear'){sfx.win();showBanner('完成！',fmtTime(S.time+S.penalty));}
  else{sfx.over();shake=18;redFlash=1;showBanner(reason==='overrun'?'被突破了！':'心碎了！','');

}
function fmtTime(t){return t.toFixed(2)+' 秒';}
function finishResults(){

        <div class="stats"><div class="stat"><span>純時間</span><b>${S.time.toFixed(2)}</b></div><div class="stat"><span>罰秒</span><b>+${S.penalty.toFixed(1)}</b></div>

let resultAt=0;
function refreshTitle(){
  const b=store.get('bestScore',0),k=store.get('bestKills',0),t=store.get('bestTime',0),r=store.get('bestRapid',0);
  $('bestRapid').textContent=r?`最佳 ${r} 隻・30 秒`:'30 秒內能射倒幾隻？';

  $('bestTA').textContent=t?`最佳 ${(+t).toFixed(2)} 秒`:'最快擊倒 30 隻';
}
function showBanner(a,b){banner={a,b:b||'',t:0,life:1.6};}

/* ---------- shooting ---------- */
function press(lane){
  ensureAudio();
  if(S.phase!=='play'||lane<0||lane>=S.lanes)return;
  if(S.mode==='rapid'){pressRapid(lane);return;}
  btnAnim[lane]=1;
  const Z=closestZombie();
  if(!Z){sfx.dry();return;}
  const T=firstInLane(lane);
  S.shots++;
  if(T===Z)hit(Z);else wrongTap(lane,T,Z);
}
function pressRapid(lane){
  btnAnim[lane]=1;
  if(!S.started)banner=null;
  S.started=true;
  const Z=S.ents[0];if(!Z)return;
  S.shots++;
  if(Z.lane===lane){hit(Z);rapidAdvance();flushPending();return;}
  // Two thumbs landing almost together can arrive in the wrong order (or in one event in id order).
  // A wrong-lane tap waits a moment: if the right lane is hit meanwhile, the waiting tap is judged
  // again against the new front zombie, so a fast cross-lane roll is never punished or lost.
  const p={lane};pendTaps.push(p);
  setTimeout(()=>{const i=pendTaps.indexOf(p);if(i<0)return;pendTaps.splice(i,1);
    if(S.phase==='play'&&S.mode==='rapid')wrongRapid(lane);},RQ.grace*1000);
}
const pendTaps=[];
function flushPending(){
  for(;;){const Z=S.ents[0];if(!Z)return;const i=pendTaps.findIndex(p=>p.lane===Z.lane);if(i<0)return;
    pendTaps.splice(i,1);btnAnim[Z.lane]=1;hit(Z);rapidAdvance();}
}
function wrongRapid(lane){
  const Z=S.ents[0];if(!Z)return;
  // wrong lane costs clock time instead of jamming input, so fast tapping never loses taps
  S.wrong++;S.combo=0;S.stun=RQ.stun;banner=null;
  if(S.started){S.time=Math.min(RQ.dur,S.time+RQ.pen);if(S.time>=RQ.dur){endGame('time');return;}}
  floats.push({x:laneX(lane),y:Lt.barY-30,text:'−'+RQ.pen+' 秒',c:'#ff6b5b',t:0.6,max:0.6,size:20});
  btnBad[lane]=1;shake=Math.max(shake,8);hurtFlash=0.35;
  sfx.wrong();
  const x=laneX(lane);
  for(let i=0;i<6;i++)parts.push({k:'smoke',x:x+(rnd()-.5)*20,y:Lt.barY-6,vx:(rnd()-.5)*40,vy:-40-rnd()*60,g:0,life:.6,max:.6,size:8+rnd()*8});
  Z.kick=1;arrow={e:Z,t:RQ.stun+0.2};
}
function muzzle(lane,toY){
  const x=laneX(lane);
  flashes.push({x,y:Lt.barY-2,t:0.09});
  tracers.push({x0:x,y0:Lt.barY-4,x1:x,y1:toY,t:0.08});
  if(S.mode!=='rapid')shake=Math.max(shake,5);
}
function hit(Z){
  const s=S.mode==='rapid'?Lt.rs:Lt.unit*(0.8+0.25*Z.y);
  const zy=yPx(Z.y);
  muzzle(Z.lane,zy-s*0.8);
  sfx.shot();S.hits++;S.lastHitT=S.time;
  if(Z.armor&&Z.hp>1){
    Z.hp--;Z.armor=false;Z.wasArmor=true;Z.flash=0.15;Z.kick=1;
    sfx.clank();
    parts.push({k:'helmet',x:Z.x,y:zy-s*1.25,vx:(rnd()-.5)*240,vy:-380,g:1100,r:0,vr:(rnd()-.5)*18,life:1,max:1,size:s*0.3});
    parts.push({k:'plate',x:Z.x,y:zy-s*0.7,vx:(rnd()-.5)*300,vy:-200,g:1100,r:0,vr:(rnd()-.5)*12,life:1,max:1,size:s*0.3});
    for(let i=0;i<10;i++)parts.push({k:'spark',x:Z.x,y:zy-s*1.1,vx:(rnd()-.5)*500,vy:(rnd()-.8)*400,g:600,life:.3,max:.3,size:2+rnd()*2,c:'#ffe28a'});
    S.score+=S.mode==='surv'?5:0;
    floats.push({x:Z.x,y:zy-s*1.6,text:'鏗！',c:'#cfd6e6',t:0.7,max:0.7,size:22});
    return;
  }
  // kill
  S.kills++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
  const mult=1+Math.floor(S.combo/10)*0.5;
  const pts=Math.round(10*mult)+(Z.hp===1&&Z.wasArmor?5:0);
  if(S.mode==='surv')S.score+=pts;
  sfx.splat();
  if(S.mode==='rapid'){
    // the front zombie just vanishes so the next one is clear the instant it slides in
    for(let i=0;i<6;i++){const a=rnd()*Math.PI*2;parts.push({k:'blob',x:Z.x,y:zy-s*0.8,vx:Math.cos(a)*260,vy:Math.sin(a)*260,g:0,life:.16,max:.16,size:3+rnd()*4,c:'#7bd23a'});}
    removeEnt(Z);S.score=S.kills;return;
  }
  splat(Z,s,zy);
  removeEnt(Z);
  if(S.mode==='surv'&&S.combo%25===0&&S.hearts<3){S.hearts++;sfx.level();floats.push({x:W/2,y:Lt.hudH+40,text:'+♥ 回復！',c:'#ff7aa8',t:1,max:1,size:24});}
  floats.push({x:Z.x,y:zy-s*1.5,text:S.mode==='surv'?'+'+pts:S.mode==='rapid'?String(S.kills):S.kills+'/30',c:'#c8f26a',t:0.6,max:0.6,size:20});
  if(S.mode==='rapid')S.score=S.kills;
  if(S.combo>0&&S.combo%10===0)floats.push({x:Z.x,y:zy-s*2.1,text:S.combo+' 連擊！',c:'#ffcf3f',t:0.9,max:0.9,size:26});
  if(S.mode==='ta'&&S.kills>=30){endGame('clear');return;}
  if(S.mode==='surv')announce();
  if(rnd()<0.12)sfx.groan();
}
function splat(Z,s,zy){
  const cx=Z.x,cy=zy-s*0.8;
  for(let i=0;i<16;i++){const a=rnd()*Math.PI*2,sp=120+rnd()*360;
    parts.push({k:'blob',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,g:900,life:.5+rnd()*.4,max:.9,size:3+rnd()*6*s/60,c:rnd()<.7?'#7bd23a':'#4f8f22'});}
  for(let i=0;i<4;i++)parts.push({k:'chunk',x:cx,y:cy,vx:(rnd()-.5)*420,vy:-200-rnd()*300,g:1200,r:0,vr:(rnd()-.5)*20,life:.8,max:.8,size:s*0.12+rnd()*s*0.08,c:i%2?Z.skin:Z.shirt});
  parts.push({k:'head',x:cx,y:zy-s*1.2,vx:(rnd()-.5)*260,vy:-460,g:1300,r:0,vr:(rnd()-.5)*14,life:.9,max:.9,size:s*0.25,c:Z.skin});

  decals.push({x:cx+(rnd()-.5)*10,y:zy-2,r:s*0.35*(0.8+rnd()*.5),a:0.55,seed:(rnd()*1000)|0});
  if(decals.length>28)decals.shift();
}
const SURV_GRACE=15;
function wrongTap(lane,T,Z){
  S.wrong++;S.combo=0;
  btnBad[lane]=1;shake=Math.max(shake,8);hurtFlash=0.35;
  const x=laneX(lane);

    parts.push({k:'faint',x:T.x,y:ty,life:.8,max:.8,size:s,skin:T.skin,shirt:T.shirt});
    removeEnt(T);if(S.blockedLane===lane)S.blockedLane=-1;

  }else{
    sfx.wrong();
    for(let i=0;i<6;i++)parts.push({k:'smoke',x:x+(rnd()-.5)*20,y:Lt.barY-6,vx:(rnd()-.5)*40,vy:-40-rnd()*60,g:0,life:.6,max:.6,size:8+rnd()*8});
    floats.push({x,y:Lt.barY-30,text:(T||S.ents.some(e=>e.lane===lane&&e.y>-0.2))?'不是最近的！':'空槍！',c:'#ff6b5b',t:0.8,max:0.8,size:20});
  }
  // closest zombie lurches forward

  }else if(S.mode==='surv'){

  }else{S.penalty+=1;floats.push({x:W/2,y:Lt.hudH+40,text:'+1 秒',c:'#ff6b5b',t:0.8,max:0.8,size:24});}
}
function announce(){
  const k=S.kills,a=S.announced;
  if(k>=15&&!a.armor){a.armor=1;showBanner('裝甲殭屍！','戴頭盔的要打兩槍');sfx.level();}
  if(k>=30&&!a.lanes){a.lanes=1;showBanner('第四條路！','鍵盤：4 或 ;');sfx.level();}

/* ---------- update ---------- */
function update(dt){
  // fx
  shake=Math.max(0,shake-dt*60);redFlash=Math.max(0,redFlash-dt*1.2);hurtFlash=Math.max(0,hurtFlash-dt);
  for(let i=0;i<4;i++){btnAnim[i]=Math.max(0,btnAnim[i]-dt*7);btnBad[i]=Math.max(0,btnBad[i]-dt*3);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.vx!==undefined){p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.r+=p.vr*dt;}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;f.y-=30*dt;if(f.t<=0)floats.splice(i,1);}
  for(let i=tracers.length-1;i>=0;i--){tracers[i].t-=dt;if(tracers[i].t<=0)tracers.splice(i,1);}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t-=dt;if(flashes[i].t<=0)flashes.splice(i,1);}
  for(const d of decals)d.a=Math.max(0,d.a-dt*0.02);
  if(banner){banner.t+=dt;if(banner.t>banner.life)banner=null;}
  if(arrow){arrow.t-=dt;if(arrow.t<=0||S.ents.indexOf(arrow.e)<0)arrow=null;}
  if(S.phase!=='pause')S.stun=Math.max(0,S.stun-dt);
  for(const e of S.ents){e.flash=Math.max(0,e.flash-dt);e.kick=Math.max(0,e.kick-dt*5);if(e.lunge)e.lunge=Math.max(0,e.lunge-dt);
    const tx=laneX(e.lane);e.x+=(tx-e.x)*Math.min(1,dt*10);
    if(e.tt!==undefined&&e.tt<1){e.tt=Math.min(1,e.tt+dt/RQ.anim);e.y=e.fromY+(e.toY-e.fromY)*easeOut(e.tt);}}

  if(S.phase==='ending'){
    S.endT-=dt;
    for(const e of S.ents)e.t+=dt*3;
    if(S.endT<=0)finishResults();
    return;
  }
  if(S.phase!=='play'&&S.phase!=='title')return;
  if(S.mode==='rapid'&&S.phase==='play'){
    // zombies shuffle in place; nobody walks forward on their own in this mode
    for(const e of S.ents)e.t+=dt*0.8;
    if(S.started){S.time+=dt;if(S.time>=RQ.dur){S.time=RQ.dur;endGame('time');}}
    return;
  }
  const p=params();
  if(S.phase==='play'&&p.lanes!==S.lanes)setLanes(p.lanes);
  let front=-0.2;for(const e of S.ents)if(e.type==='z'&&e.y>front)front=e.y;
  const v=p.v+p.catchK*Math.max(0,p.catchT-front);
  S.v=v;
  for(const e of S.ents){e.y+=v*dt;e.t+=dt*(1+v*6);}
  S.tailY+=v*dt;
  while(S.tailY>-0.02&&(S.mode!=='ta'||S.phase==='title'||S.spawnedZ<30))spawnOne(p);
  if(S.phase==='play')S.time+=dt;
  for(let i=S.ents.length-1;i>=0;i--){
    const e=S.ents[i];if(e.y<1)continue;
    if(e.type==='s'){
      removeEnt(e);if(S.blockedLane===e.lane)S.blockedLane=-1;
      if(S.phase==='play'){S.rescued++;if(S.mode==='surv')S.score+=50;sfx.rescue();
        floats.push({x:e.x,y:Lt.barY-40,text:S.mode==='surv'?'救出！+50':'救出！',c:'#7fe3ff',t:1,max:1,size:22});}
    }else if(S.phase==='play'){e.y=1;endGame('overrun',e);return;}
  }
  // title attract: auto gunner
  if(S.phase==='title'){
    S.demoT-=dt;
    const Z=closestZombie();
    if(Z&&Z.y>0.55&&S.demoT<=0){
      const s=Lt.unit*(0.8+0.25*Z.y),zy=yPx(Z.y);muzzle(Z.lane,zy-s*0.8);btnAnim[Z.lane]=1;
      if(Z.armor&&Z.hp>1){Z.hp--;Z.armor=false;Z.kick=1;parts.push({k:'helmet',x:Z.x,y:zy-s*1.25,vx:(rnd()-.5)*240,vy:-380,g:1100,r:0,vr:9,life:1,max:1,size:s*0.3});}
      else{splat(Z,s,zy);removeEnt(Z);}
      S.demoT=0.35+rnd()*0.5;
    }
  }
}

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawZombie(c,e,x,y,s){
  const t=e.t,step=Math.sin(t*4.2),bob=Math.abs(Math.cos(t*4.2))*s*0.04;
  const surv=e.type==='s';
  c.save();c.translate(x,y);
  // shadow
  c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(0,0,s*0.34,s*0.09,0,0,7);c.fill();
  if(e.kick)c.translate(0,-e.kick*s*0.08);
  if(e.lunge)c.translate(0,Math.sin(e.lunge/0.35*Math.PI)*s*0.12);
  // legs
  c.fillStyle=surv?'#3d5f9e':'#3a3150';
  rr(c,-s*0.19,-s*0.46+step*s*0.03,s*0.15,s*0.44-step*s*0.03,s*0.05);c.fill();
  rr(c,s*0.04,-s*0.46-step*s*0.03,s*0.15,s*0.44+step*s*0.03,s*0.05);c.fill();
  c.fillStyle='#1d1622';
  c.beginPath();c.ellipse(-s*0.12,-s*0.02+step*s*0.02,s*0.1,s*0.05,0,0,7);c.ellipse(s*0.12,-s*0.02-step*s*0.02,s*0.1,s*0.05,0,0,7);c.fill();
  c.translate(0,-bob);
  const tilt=surv?Math.sin(t*6)*0.05:Math.sin(t*2.1)*0.1;
  c.rotate(tilt*0.5);
  // arms
  c.lineCap='round';c.lineWidth=s*0.13;c.strokeStyle=surv?e.shirt:e.shirt;
  if(surv){
    const w=Math.sin(t*9)*s*0.08;
    c.beginPath();c.moveTo(-s*0.24,-s*0.88);c.lineTo(-s*0.4+w,-s*1.35);c.moveTo(s*0.24,-s*0.88);c.lineTo(s*0.4-w,-s*1.35);c.stroke();
    c.fillStyle=e.skin;c.beginPath();c.arc(-s*0.4+w,-s*1.4,s*0.075,0,7);c.arc(s*0.4-w,-s*1.4,s*0.075,0,7);c.fill();
  }else{
    const sw=Math.sin(t*4.2)*s*0.05;
    c.beginPath();c.moveTo(-s*0.24,-s*0.88);c.lineTo(-s*0.44,-s*0.6+sw);c.moveTo(s*0.24,-s*0.88);c.lineTo(s*0.44,-s*0.6-sw);c.stroke();
    c.strokeStyle=e.skin;c.lineWidth=s*0.1;
    c.beginPath();c.moveTo(-s*0.38,-s*0.68+sw);c.lineTo(-s*0.44,-s*0.56+sw);c.moveTo(s*0.38,-s*0.68-sw);c.lineTo(s*0.44,-s*0.56-sw);c.stroke();
    c.fillStyle=e.skin;c.beginPath();c.arc(-s*0.45,-s*0.52+sw,s*0.07,0,7);c.arc(s*0.45,-s*0.52-sw,s*0.07,0,7);c.fill();
    c.strokeStyle=e.skin;c.lineWidth=s*0.03;c.beginPath();
    for(const d of [-1,1]){const hx=d*s*0.45,hy=-s*0.52-d*sw;c.moveTo(hx-s*0.04,hy+s*0.04);c.lineTo(hx-s*0.05,hy+s*0.11);c.moveTo(hx+s*0.03,hy+s*0.05);c.lineTo(hx+s*0.04,hy+s*0.12);}
    c.stroke();
  }
  // torso
  c.fillStyle=e.shirt;rr(c,-s*0.27,-s*1.0,s*0.54,s*0.58,s*0.12);c.fill();
  if(!surv){ // torn hem + wound
    c.fillStyle='#3a3150';c.beginPath();c.moveTo(-s*0.27,-s*0.46);
    for(let i=0;i<=6;i++)c.lineTo(-s*0.27+i*s*0.09,-s*(i%2?0.5:0.43));c.lineTo(s*0.27,-s*0.42);c.lineTo(-s*0.27,-s*0.42);c.fill();
    c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(s*0.08,-s*0.72,s*0.08,s*0.05,0.5,0,7);c.fill();
    c.fillStyle='#b23a2a';c.beginPath();c.ellipse(-s*0.1,-s*0.8,s*0.04,s*0.025,0,0,7);c.fill();
  }else{
    c.fillStyle='rgba(255,255,255,.25)';c.fillRect(-s*0.27,-s*0.86,s*0.54,s*0.06);
  }
  if(e.armor){
    c.fillStyle='#8d97a8';rr(c,-s*0.25,-s*0.98,s*0.5,s*0.42,s*0.08);c.fill();
    c.fillStyle='#b8c1cf';c.fillRect(-s*0.21,-s*0.94,s*0.42,s*0.05);
    c.fillStyle='#5b6372';for(const px of [-0.17,0.17])for(const py of [-0.9,-0.64]){c.beginPath();c.arc(px*s,py*s,s*0.025,0,7);c.fill();}
  }
  // head
  const hy=-s*1.2;
  c.save();c.translate(0,hy);c.rotate(surv?0:Math.sin(t*1.7)*0.18);
  c.fillStyle=e.skin;c.beginPath();c.arc(0,0,s*0.25,0,7);c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=Math.max(1.5,s*0.025);c.stroke();
  if(surv){
    c.fillStyle='#5a3a22';c.beginPath();c.arc(0,-s*0.06,s*0.25,Math.PI*1.05,Math.PI*1.95);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(-s*0.09,0,s*0.06,0,7);c.arc(s*0.09,0,s*0.06,0,7);c.fill();
    c.fillStyle='#222';c.beginPath();c.arc(-s*0.09,s*0.01,s*0.03,0,7);c.arc(s*0.09,s*0.01,s*0.03,0,7);c.fill();
    c.strokeStyle='#5a3a22';c.lineWidth=s*0.025;c.beginPath();c.moveTo(-s*0.15,-s*0.1);c.lineTo(-s*0.04,-s*0.07);c.moveTo(s*0.15,-s*0.1);c.lineTo(s*0.04,-s*0.07);c.stroke();
    c.fillStyle='#5a1a1a';c.beginPath();c.ellipse(0,s*0.12,s*0.05,s*0.065,0,0,7);c.fill();
  }else{
    // stitches
    c.strokeStyle='rgba(30,40,20,.7)';c.lineWidth=Math.max(1,s*0.02);c.beginPath();c.moveTo(-s*0.18,-s*0.12);c.lineTo(-s*0.02,-s*0.2);
    for(let i=0;i<3;i++){const px=-s*0.15+i*s*0.05,py=-s*0.13-i*s*0.025;c.moveTo(px,py-s*0.03);c.lineTo(px+s*0.01,py+s*0.03);}c.stroke();
    // eyes
    c.fillStyle='#fff8d8';c.beginPath();c.arc(-s*0.09,-s*0.02,s*(e.eye?0.085:0.07),0,7);c.fill();
    c.fillStyle='#d42b1e';c.beginPath();c.arc(-s*0.08+Math.sin(t*3)*s*0.02,-s*0.02,s*0.03,0,7);c.fill();
    c.fillStyle='#2a1a2a';c.beginPath();c.arc(s*0.1,-s*0.01,s*0.055,0,7);c.fill();
    c.fillStyle='#ff5a3c';c.beginPath();c.arc(s*0.1,-s*0.01,s*0.018,0,7);c.fill();
    // mouth
    c.fillStyle='#2a0f12';rr(c,-s*0.12,s*0.08,s*0.24,s*0.09,s*0.03);c.fill();
    c.fillStyle='#f3ead0';c.beginPath();
    for(let i=0;i<4;i++){const mx=-s*0.1+i*s*0.06;c.moveTo(mx,s*0.08);c.lineTo(mx+s*0.025,s*0.12);c.lineTo(mx+s*0.05,s*0.08);}c.fill();
    // hair tuft
    c.strokeStyle='#2a2238';c.lineWidth=Math.max(1.5,s*0.03);c.beginPath();c.moveTo(0,-s*0.24);c.lineTo(-s*0.05,-s*0.34);c.moveTo(s*0.04,-s*0.24);c.lineTo(s*0.08,-s*0.32);c.stroke();
  }
  if(e.armor){
    c.fillStyle='#7f8a9c';c.beginPath();c.arc(0,-s*0.04,s*0.28,Math.PI,0);c.lineTo(s*0.31,-s*0.02);c.lineTo(-s*0.31,-s*0.02);c.closePath();c.fill();
    c.fillStyle='#aeb8c8';c.beginPath();c.arc(-s*0.08,-s*0.18,s*0.07,0,7);c.fill();
    c.fillStyle='#5b6372';c.fillRect(-s*0.31,-s*0.06,s*0.62,s*0.05);
    for(const px of [-0.2,0,0.2]){c.beginPath();c.arc(px*s,-s*0.035,s*0.02,0,7);c.fillStyle='#d6dde8';c.fill();}
  }
  if(e.flash>0){c.fillStyle='rgba(255,255,255,'+(e.flash*5).toFixed(2)+')';c.beginPath();c.arc(0,0,s*0.3,0,7);c.fill();}
  c.restore();
  if(surv){ // speech bubble
    const bw=s*0.95,bh=s*0.36,bx=s*0.12,by=-s*1.9;
    c.fillStyle='#fffbe8';rr(c,bx,by,bw,bh,bh*0.4);c.fill();
    c.beginPath();c.moveTo(bx+s*0.08,by+bh-1);c.lineTo(bx-s*0.02,by+bh+s*0.14);c.lineTo(bx+s*0.24,by+bh-1);c.fill();
    c.strokeStyle='#2a1d10';c.lineWidth=2;rr(c,bx,by,bw,bh,bh*0.4);c.stroke();
    c.fillStyle='#d42b1e';c.font='900 '+Math.round(bh*0.62)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
    c.fillText('救命！',bx+bw/2,by+bh/2+1);
  }

}
const FONT='system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

function drawButtons(c){

    c.moveTo(cx,cy-r*1.45);c.lineTo(cx,cy-r*0.45);c.moveTo(cx,cy+r*0.45);c.lineTo(cx,cy+r*1.45);c.stroke();
    if(bad){c.strokeStyle='#ff4a3a';c.lineWidth=6;c.beginPath();c.moveTo(cx-r,cy-r);c.lineTo(cx+r,cy+r);c.moveTo(cx+r,cy-r);c.lineTo(cx-r,cy+r);c.stroke();}

function drawHUD(c){

    c.textAlign='center';c.fillStyle='#b9aacb';c.font='700 11px '+FONT;c.fillText(S.started?'剩餘時間':'開槍開始計時',W/2,top);
    c.fillStyle=low?(Math.sin(performance.now()/80)>0?'#ff6b5b':'#f4ecd8'):'#f4ecd8';c.font='900 26px '+FONT;c.fillText(left.toFixed(1),W/2,top+13);
    // time bar along the bottom edge of the HUD
    const f=left/RQ.dur;c.fillStyle='#2a1f36';c.fillRect(0,Lt.hudH-4,W,4);
    c.fillStyle=low?'#e2412f':'#ffcf3f';c.fillRect(0,Lt.hudH-4,W*f,4);
  }else if(S.mode==='surv'){
    c.textAlign='left';c.fillStyle='#b9aacb';c.font='700 11px '+FONT;c.fillText('分數',ins.l+12,top);
    c.fillStyle='#f4ecd8';c.font='900 26px '+FONT;c.fillText(String(S.score),ins.l+12,top+13);
    // hearts
    const hx=W/2-48;
    for(let i=0;i<3;i++)drawHeart(c,hx+i*34+16,top+20,13,i<S.hearts,hurtFlash>0&&i===S.hearts);
    c.textAlign='center';c.fillStyle='#b9aacb';c.font='700 11px '+FONT;
    const msg=S.combo>=3?S.combo+' 連擊':S.kills+' 隻';c.fillText(msg,W/2,top+38);
  }else{
    c.textAlign='left';c.fillStyle='#b9aacb';c.font='700 11px '+FONT;c.fillText('擊倒',ins.l+12,top);
    c.fillStyle='#c8f26a';c.font='900 26px '+FONT;c.fillText(S.kills+'/30',ins.l+12,top+13);
    c.textAlign='center';c.fillStyle='#b9aacb';c.font='700 11px '+FONT;c.fillText('時間'+(S.penalty?'（含罰 +'+S.penalty.toFixed(0)+'）':''),W/2,top);
    c.fillStyle='#f4ecd8';c.font='900 26px '+FONT;c.fillText((S.time+S.penalty).toFixed(2),W/2,top+13);
  }
}
function drawHeart(c,x,y,r,full,breaking){
  c.save();c.translate(x,y);if(breaking)c.translate((rnd()-.5)*4,0);
  c.beginPath();c.moveTo(0,r*0.9);c.bezierCurveTo(-r*1.4,-r*0.1,-r*0.7,-r*1.1,0,-r*0.4);c.bezierCurveTo(r*0.7,-r*1.1,r*1.4,-r*0.1,0,r*0.9);
  c.fillStyle=full?'#e2412f':'#3a2d48';c.fill();c.lineWidth=2;c.strokeStyle=full?'#5a0f08':'#56466a';c.stroke();
  if(full){c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.arc(-r*0.4,-r*0.35,r*0.18,0,7);c.fill();}
  c.restore();
}

let sortBuf=[];
function draw(){
  const c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);
  const sx=shake?(rnd()-.5)*shake:0,sy=shake?(rnd()-.5)*shake:0;
  c.save();c.translate(sx,sy);
  c.drawImage(bg,0,0,W,H);
  // decals
  for(const d of decals){if(d.a<=0)continue;c.globalAlpha=d.a;c.fillStyle='#4f8f22';const R=mulberry32(d.seed);
    c.beginPath();c.ellipse(d.x,d.y,d.r,d.r*0.4,0,0,7);c.fill();
    for(let i=0;i<5;i++){c.beginPath();c.arc(d.x+(R()-.5)*d.r*2.4,d.y+(R()-.5)*d.r*0.8,2+R()*d.r*0.2,0,7);c.fill();}}
  c.globalAlpha=1;
  // danger glow
  let front=-1;for(const e of S.ents)if(e.type==='z'&&e.y>front)front=e.y;
  if(front>0.72&&S.mode!=='rapid'&&(S.phase==='play'||S.phase==='ending')){
    const a=(front-0.72)/0.28*(0.5+0.5*Math.sin(performance.now()/90));
    const g=c.createLinearGradient(0,Lt.barY-Lt.fieldH*0.3,0,Lt.barY);g.addColorStop(0,'rgba(226,40,30,0)');g.addColorStop(1,'rgba(226,40,30,'+(a*0.45).toFixed(3)+')');
    c.fillStyle=g;c.fillRect(Lt.playX,Lt.barY-Lt.fieldH*0.3,Lt.playW,Lt.fieldH*0.3);
  }
  // entities (back to front)
  c.save();c.beginPath();c.rect(0,Lt.fieldTop,W,Lt.barY+Lt.barH-Lt.fieldTop);c.clip();
  sortBuf.length=0;for(const e of S.ents)sortBuf.push(e);sortBuf.sort((a,b)=>a.y-b.y);
  for(const e of sortBuf){const s=S.mode==='rapid'?Lt.rs:Lt.unit*(0.8+0.25*clamp(e.y,0,1.1));drawZombie(c,e,e.x,yPx(e.y),s);}
  // top fog over sprites
  const fg=c.createLinearGradient(0,Lt.fieldTop,0,Lt.fieldTop+Lt.topPad*0.55);fg.addColorStop(0,'rgba(28,20,40,1)');fg.addColorStop(1,'rgba(28,20,40,0)');
  c.fillStyle=fg;c.fillRect(0,Lt.fieldTop,W,Lt.topPad*0.55);
  c.restore();
  c.save();c.beginPath();c.rect(0,Lt.fieldTop,W,H-Lt.fieldTop);c.clip();
  // tracers
  for(const t of tracers){c.strokeStyle='rgba(255,236,150,'+(t.t/0.08).toFixed(2)+')';c.lineWidth=4;c.beginPath();c.moveTo(t.x0,t.y0);c.lineTo(t.x1,t.y1);c.stroke();
    c.strokeStyle='rgba(255,255,255,'+(t.t/0.08).toFixed(2)+')';c.lineWidth=1.5;c.stroke();}
  // particles
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    switch(p.k){
      case 'blob':c.globalAlpha=a;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.size,0,7);c.fill();break;
      case 'spark':c.globalAlpha=a;c.fillStyle=p.c;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;
      case 'chunk':c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66);c.restore();break;
      case 'head':c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.arc(0,0,p.size,0,7);c.fill();
        c.strokeStyle='#2a0f12';c.lineWidth=2.5;c.beginPath();const q=p.size*0.3;
        for(const ex of [-0.4,0.4]){c.moveTo(ex*p.size-q*0.5,-q*0.5);c.lineTo(ex*p.size+q*0.5,q*0.5);c.moveTo(ex*p.size+q*0.5,-q*0.5);c.lineTo(ex*p.size-q*0.5,q*0.5);}
        c.stroke();c.fillStyle='#2a0f12';c.fillRect(-p.size*0.3,p.size*0.35,p.size*0.6,p.size*0.15);c.restore();break;
      case 'helmet':c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle='#7f8a9c';c.beginPath();c.arc(0,0,p.size,Math.PI,0);c.closePath();c.fill();
        c.fillStyle='#5b6372';c.fillRect(-p.size*1.05,-2,p.size*2.1,5);c.restore();break;
      case 'plate':c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle='#8d97a8';c.fillRect(-p.size,-p.size*0.6,p.size*2,p.size*1.2);c.restore();break;
      case 'ring':c.globalAlpha=a;c.strokeStyle='#d8ff9a';c.lineWidth=4*a;c.beginPath();c.arc(p.x,p.y,p.size*(1.2-a),0,7);c.stroke();break;
      case 'smoke':c.globalAlpha=a*0.6;c.fillStyle='#8a8094';c.beginPath();c.arc(p.x,p.y,p.size*(1.6-a),0,7);c.fill();break;
      case 'star':c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle='#ffe066';c.beginPath();
        for(let i=0;i<10;i++){const rr2=i%2?p.size*0.45:p.size;const an=i*Math.PI/5;c.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}c.fill();c.restore();break;
      case 'faint':{c.globalAlpha=a;c.save();c.translate(p.x,p.y);c.rotate((1-a)*1.4);c.translate(-p.x,-p.y);
        drawZombie(c,{type:'s',t:0,skin:p.skin,shirt:p.shirt,flash:0,kick:0,lunge:0,armor:false},p.x,p.y,p.size);c.restore();break;}
    }
  }
  c.globalAlpha=1;
  // muzzle flashes
  for(const f of flashes){const a=f.t/0.09;c.save();c.translate(f.x,f.y);c.fillStyle='rgba(255,220,90,'+a.toFixed(2)+')';c.beginPath();
    for(let i=0;i<14;i++){const r=i%2?10:26+rnd()*10;const an=-Math.PI/2+(i-7)*0.22;c.lineTo(Math.cos(an)*r,Math.sin(an)*r);}c.fill();
    c.fillStyle='rgba(255,255,240,'+a.toFixed(2)+')';c.beginPath();c.arc(0,-4,9,0,7);c.fill();c.restore();}
  // arrow pointing at the one you should have shot
  if(arrow){const e=arrow.e,s=Lt.unit*(0.8+0.25*e.y),ay=yPx(e.y)-s*1.6-10+Math.sin(performance.now()/60)*4;
    c.fillStyle='#ffcf3f';c.strokeStyle='#3a2400';c.lineWidth=3;c.beginPath();c.moveTo(e.x,ay+16);c.lineTo(e.x-14,ay);c.lineTo(e.x-6,ay);c.lineTo(e.x-6,ay-16);c.lineTo(e.x+6,ay-16);c.lineTo(e.x+6,ay);c.lineTo(e.x+14,ay);c.closePath();c.fill();c.stroke();}
  // floats
  c.textAlign='center';c.textBaseline='middle';
  for(const f of floats){const a=clamp(f.t/f.max*1.5,0,1);c.globalAlpha=a;c.font='900 '+f.size+'px '+FONT;
    c.lineWidth=4;c.strokeStyle='rgba(10,5,15,.85)';c.strokeText(f.text,f.x,f.y);c.fillStyle=f.c;c.fillText(f.text,f.x,f.y);}
  c.globalAlpha=1;
  c.restore();
  if(S.phase!=='title')drawButtons(c);
  c.restore();
  if(S.phase!=='title')drawHUD(c);
  // 速射 stun indicator
  if(S.stun>0&&S.phase==='play'){
    const k=S.stun/RQ.stun,pop=k>0.85?1+(k-0.85)*2:1;
    c.save();c.translate(W/2,Lt.fieldTop+52);c.scale(pop*0.7,pop*0.7);c.rotate(-0.04);c.globalAlpha=Math.min(1,k*2);
    c.fillStyle='rgba(60,6,4,.85)';rr(c,-120,-38,240,76,16);c.fill();
    c.strokeStyle='#e2412f';c.lineWidth=3;rr(c,-120,-38,240,76,16);c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.font='900 34px '+FONT;c.lineWidth=6;c.strokeStyle='#3b0c08';
    c.strokeText('打錯了！',0,-8);c.fillStyle='#ff6b5b';c.fillText('打錯了！',0,-8);
    c.fillStyle='rgba(255,255,255,.15)';rr(c,-90,20,180,8,4);c.fill();
    c.fillStyle='#ffcf3f';rr(c,-90,20,Math.max(8,180*k),8,4);c.fill();
    c.restore();
  }
  // banner
  if(banner&&S.phase!=='title'){
    const t=banner.t,life=banner.life;const inA=Math.min(1,t/0.15),outA=Math.min(1,(life-t)/0.3);const a=Math.min(inA,outA);
    const sc=t<0.15?0.6+0.4*(t/0.15)+0.1*Math.sin(t/0.15*Math.PI):1;
    c.save();c.globalAlpha=a;c.translate(W/2,Lt.fieldTop+Lt.fieldH*0.38);c.scale(sc,sc);c.rotate(-0.04);
    c.fillStyle='rgba(15,8,20,.78)';rr(c,-170,-44,340,banner.b?88:64,16);c.fill();
    c.textAlign='center';c.textBaseline='middle';c.font='900 34px '+FONT;c.lineWidth=6;c.strokeStyle='#3b0c08';
    c.strokeText(banner.a,0,banner.b?-16:-12);c.fillStyle='#ffcf3f';c.fillText(banner.a,0,banner.b?-16:-12);
    if(banner.b){c.font='700 16px '+FONT;c.fillStyle='#f4ecd8';c.fillText(banner.b,0,22);}
    c.restore();
  }
  if(redFlash>0){c.fillStyle='rgba(200,20,10,'+(redFlash*0.45).toFixed(3)+')';c.fillRect(0,0,W,H);}
  if(hurtFlash>0){c.strokeStyle='rgba(230,40,30,'+(hurtFlash*1.6).toFixed(3)+')';c.lineWidth=14;c.strokeRect(0,0,W,H);}
}

/* ---------- loop ---------- */
let last=performance.now(),raf=0;
function frame(now){
  raf=0;
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S.phase!=='pause'&&S.phase!=='over')update(dt);
  draw();
  if(!document.hidden)raf=requestAnimationFrame(frame);
}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();if(raf){cancelAnimationFrame(raf);raf=0;}}else kick();});

/* ---------- input ---------- */
function tapAt(x,y){
  if(S.phase!=='play')return;
  if(y<Lt.fieldTop)return;
  if(x<Lt.playX-Lt.laneW*0.5||x>Lt.playX+Lt.playW+Lt.laneW*0.5)return;
  // taps that land in the side margins count for the outer lanes
  press(clamp(Math.floor((x-Lt.playX)/Lt.laneW),0,S.lanes-1));
}
// Touch: handle every new finger from touchstart directly (each changedTouch is one shot), so fast
// alternating thumbs and overlapping touches all register. Pointer events are only used for mouse/pen.
// Some mobile browsers swallow the touchstart of a very quick repeat tap (double-tap detection), so a
// touch that ends without a touchstart we saw is still counted once, on its touchend.
// Many touchscreens also merge a finger lifting in one lane with another finger landing in the next lane
// into one contact that "jumps" (a touchmove, no new touchstart). A jump into another lane in a single
// event is a new tap; a slow slide across lanes is not.
const liveTouch=new Map();
const laneOf=x=>clamp(Math.floor((x-Lt.playX)/Lt.laneW),0,S.lanes-1);
function jumpTap(t,ts){
  const o=liveTouch.get(t.identifier);if(!o)return false;
  const d=Math.hypot(t.clientX-o.x,t.clientY-o.y),dt=Math.max(1,ts-o.t);
  // some screens spread the jump over two or three reports, so a very fast move also counts
  const jump=laneOf(t.clientX)!==o.lane&&(d>Lt.laneW*0.5||d/dt>2);
  o.x=t.clientX;o.y=t.clientY;o.t=ts;
  if(jump){o.lane=laneOf(t.clientX);tapAt(t.clientX,t.clientY);}
  return jump;
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();ensureAudio();
  for(const t of e.changedTouches){liveTouch.set(t.identifier,{x:t.clientX,y:t.clientY,t:e.timeStamp,lane:laneOf(t.clientX)});tapAt(t.clientX,t.clientY);}
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)jumpTap(t,e.timeStamp);
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(liveTouch.has(t.identifier))jumpTap(t,e.timeStamp);else tapAt(t.clientX,t.clientY);liveTouch.delete(t.identifier);}
},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)liveTouch.delete(t.identifier);});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return;
  e.preventDefault();ensureAudio();
  tapAt(e.clientX,e.clientY);
},{passive:false});
['touchstart','touchmove','gesturestart','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.overlay,button'))return;e.preventDefault();},{passive:false}));
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(S.phase==='play'&&k in KEYS){e.preventDefault();if(!e.repeat)press(KEYS[k]);return;}
  if(k==='m'){setMute(!muted);return;}
  if(S.phase==='play'&&(k==='p'||k==='escape')){pauseGame();return;}
  if(S.phase==='pause'&&(k==='p'||k==='escape'||k===' ')){e.preventDefault();resumeGame();return;}
  if(S.phase==='over'&&(k===' '||k==='r'||k==='enter')&&performance.now()-resultAt>700){e.preventDefault();startGame(S.mode);return;}
  if(S.phase==='title'&&(k==='1'||k===' '||k==='enter')&&document.activeElement===document.body){e.preventDefault();startGame('rapid');}
});
$('mRapid').onclick=()=>{startGame('rapid');};
$('mSurv').onclick=()=>{startGame('surv');};
$('mTA').onclick=()=>{startGame('ta');};
$('btnPause').onclick=()=>{sfx.click();pauseGame();};
$('btnMute').onclick=$('btnMute2').onclick=()=>{ensureAudio();setMute(!muted);};
$('pResume').onclick=()=>{sfx.click();resumeGame();};
$('pRestart').onclick=()=>{sfx.click();startGame(S.mode);};
$('pHome').onclick=()=>{sfx.click();goTitle();};
const relayout=()=>{layout();for(const e of S.ents)e.x=laneX(e.lane);};
window.addEventListener('resize',relayout);
window.visualViewport&&visualViewport.addEventListener('resize',relayout);
window.addEventListener('orientationchange',()=>setTimeout(relayout,300));

/* ---------- test hook ---------- */
window.__game={
  start:m=>startGame(m||'surv'),
  press,
  state:()=>({phase:S.phase,screen:S.phase==='title'?'title':S.phase==='over'?'result':S.phase==='pause'?'pause':'game',mode:S.mode,
    slots:S.mode==='rapid'?S.ents.map(e=>e.lane):null,slotIdx:S.mode==='rapid'?S.ents.map(e=>e.slot):null,stun:S.stun,started:S.started,timeLeft:S.mode==='rapid'?Math.max(0,RQ.dur-S.time):null,lanes:S.lanes,kills:S.kills,score:S.score,hearts:S.hearts,time:S.time,penalty:S.penalty,wrong:S.wrong,rescued:S.rescued,v:S.v,
    ents:S.ents.map(e=>({id:e.id,type:e.type,lane:e.lane,y:e.y,hp:e.hp,armor:e.armor}))}),
  layout:()=>({...Lt,W,H}),
  VIS,MIN_GAP,TUNE,RQ
};

setMute(muted);
layout();
goTitle();
kick();
})();
</script>
</body>
