<style>
/* Walkable sunset Atlantis: full-screen WebGL view, bronze/orichalcum HUD over it */
:root {
  color-scheme: dark;
  --dusk: #1d1626;
  --panel: rgba(16, 30, 38, .74);
  --panel-strong: rgba(14, 24, 31, .9);
  --line: rgba(233, 186, 112, .38);
  --gold: #eabd73;
  --ori: #e0874a;
  --teal: #6fd0c4;
  --ink: #f7eedf;
  --muted: #cdbba0;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--dusk); }
body {
  color: var(--ink); font: 15px/1.6 var(--sans);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#view { position: fixed; inset: 0; touch-action: none; overflow: hidden;
  background: linear-gradient(#2c3460 0%, #9a5e6e 48%, #f2a576 62%, #17384a 63%, #0c2833 100%); }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }

/* HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.brand { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px 8px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.brand b { display: block; font: 700 1.05rem/1.2 var(--serif); letter-spacing: .14em; color: var(--gold); }
.brand span { font-size: .78rem; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.tools { display: flex; gap: 8px; pointer-events: auto; }
.icon { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--gold); font: 700 1.1rem var(--serif);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.icon:active { transform: scale(.95); }
.icon svg { width: 22px; height: 22px; }
#guide { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: .78rem; color: var(--ink); letter-spacing: .04em; }
#guide em { font-style: normal; white-space: nowrap; font-variant-numeric: tabular-nums; }
#gArrow { width: 14px; height: 14px; flex: none; display: block; background: var(--gold);
  clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%); filter: drop-shadow(0 0 3px rgba(224,135,74,.8)); }
#map { width: 96px; height: 96px; border-radius: 50%; border: 1px solid var(--line);
  box-shadow: 0 4px 16px rgba(0,0,0,.35); }

#caption { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 148px);
  width: min(calc(100vw - 32px), 420px); transform: translate(-50%, -8px); opacity: 0;
  transition: opacity .45s, transform .45s; pointer-events: none;
  background: var(--panel-strong); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#caption.on { opacity: 1; transform: translate(-50%, 0); }
#caption h2 { margin: 0 0 4px; font: 700 1.08rem/1.3 var(--serif); color: var(--gold); letter-spacing: .1em;
  display: flex; align-items: center; gap: 8px; }
#caption h2::before { content: ""; width: 9px; height: 9px; transform: rotate(45deg); background: var(--ori); flex: none; }
#caption p { margin: 0; font-size: .9rem; color: var(--ink); line-height: 1.65; }
#caption small { display: block; margin-top: 6px; color: var(--teal); font-size: .78rem; letter-spacing: .05em; }
@media (min-width: 700px) { #caption { top: auto; bottom: calc(env(safe-area-inset-bottom) + 28px); } }

/* touch joystick */
#joy { position: fixed; left: 0; top: 0; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
  border: 2px solid rgba(234,189,115,.55); background: radial-gradient(rgba(16,30,38,.25), rgba(16,30,38,.55));
  pointer-events: none; opacity: 0; transition: opacity .15s; }
#joy.on { opacity: 1; }
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe2a8, var(--ori)); box-shadow: 0 3px 10px rgba(0,0,0,.4); }
.ghost { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 26px); pointer-events: none;
  color: rgba(247,238,223,.8); font-size: .8rem; letter-spacing: .1em; text-shadow: 0 1px 4px rgba(0,0,0,.6);
  transition: opacity .6s; display: grid; justify-items: center; gap: 6px; }
.ghost i { display: block; width: 84px; height: 84px; border-radius: 50%; border: 2px dashed rgba(234,189,115,.5); }
#joyGhost { left: calc(env(safe-area-inset-left) + 22px); }
#lookGhost { right: calc(env(safe-area-inset-right) + 22px); }
#lookGhost i { border-style: solid; border-color: transparent; position: relative; }
#lookGhost i::before { content: "⟷"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 2rem; color: rgba(234,189,115,.7); }
.ghost.fade { opacity: 0; }
@media (pointer: fine) { .ghost { display: none; } }

/* intro */
#intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
  padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
  background: linear-gradient(180deg, rgba(20,16,30,.35), rgba(10,22,30,.75)); overflow-y: auto; }
.card { width: min(100%, 440px); background: var(--panel-strong); border: 1px solid var(--line); border-radius: 18px;
  padding: 24px 22px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); position: relative; }
.card::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(233,186,112,.15); border-radius: 13px; pointer-events: none; }
.eyebrow { margin: 0; color: var(--ori); font-size: .78rem; letter-spacing: .32em; }
h1 { margin: 6px 0 4px; font: 900 2.5rem/1.15 var(--serif); letter-spacing: .3em; padding-left: .3em; color: var(--gold);
  text-shadow: 0 2px 18px rgba(224,135,74,.45); }
.rule { width: 120px; height: 10px; margin: 6px auto 12px; display: block; }
.lede { margin: 0 0 14px; color: var(--ink); font-size: .95rem; }
.how { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 6px; text-align: left; font-size: .86rem; color: var(--muted); }
.how li { background: rgba(255,255,255,.04); border-radius: 10px; padding: 8px 12px; }
.how b { color: var(--gold); font-weight: 700; margin-right: 6px; }
.go { width: 100%; height: 54px; border-radius: 14px; font: 700 1.1rem var(--serif); letter-spacing: .3em; color: #2a1a10;
  background: linear-gradient(180deg, #f6d08e, #e09454); box-shadow: 0 6px 20px rgba(224,135,74,.35); }
.go:disabled { opacity: .55; cursor: progress; }
.go:not(:disabled):active { transform: scale(.98); }
#status { margin: 10px 0 0; min-height: 1.4em; font-size: .82rem; color: var(--muted); }
#status.err { color: #ffb39a; }
#retry { margin-top: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); color: var(--gold); }
@media (max-height: 560px) { h1 { font-size: 1.8rem; } .card { padding: 16px; } .lede { display: none; } }
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var startBtn = $('start'), statusEl = $('status'), retryBtn = $('retry');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var loading = false;

  function setStatus(msg, err) { statusEl.textContent = msg; statusEl.classList.toggle('err', !!err); }
  function fail(msg) {
    loading = false;
    setStatus(msg, true);
    startBtn.disabled = true; startBtn.textContent = '無法進入';
    retryBtn.hidden = false;
  }
  function loadThree() {
    if (loading) return;
    retryBtn.hidden = true; startBtn.textContent = '載入中…'; startBtn.disabled = true;
    setStatus('正在載入 3D 引擎…');
    if (window.THREE) { boot(); return; }
    loading = true;
    var done = false;
    var s = document.createElement('script');
    s.src = THREE_URL; s.async = true;
    var to = setTimeout(function () {
      if (done) return; done = true; s.remove(); fail('載入逾時。請確認網路連線後按「重新載入」。');
    }, 20000);
    s.onload = function () {
      if (done) return; done = true; clearTimeout(to);
      if (window.THREE) boot(); else fail('3D 引擎載入不完整，請重新載入。');
    };
    s.onerror = function () {
      if (done) return; done = true; clearTimeout(to); s.remove();
      fail('無法載入 3D 引擎（three.js）。請確認網路連線後按「重新載入」。');
    };
    document.head.appendChild(s);
  }
  retryBtn.addEventListener('click', loadThree);

  function boot() {
    loading = false;
    setStatus('正在建造城市…');
    // let the status paint before the synchronous build
    requestAnimationFrame(function () {
      setTimeout(function () {
        var ok = false;
        try { ok = buildApp(); } catch (e) { ok = false; }
        if (!ok) { fail('你的瀏覽器或裝置似乎不支援 WebGL，無法顯示 3D 城市。'); return; }
        setStatus('');
        startBtn.disabled = false; startBtn.textContent = '踏上島嶼';
      }, 30);
    });
  }

  function hasWebGL() {
    try { var c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }
    catch (e) { return false; }
  }

  function store(k, v) { try { localStorage.setItem('poseidia.' + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem('poseidia.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

  /* ================================================================ */
  function buildApp() {
    if (!hasWebGL()) return false;
    var T = window.THREE;
    var view = $('view');
    var DPR_CAP = 1.5;
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    var renderer;
    try {
      renderer = new T.WebGLRenderer({ antialias: dpr < 1.3, powerPreference: 'high-performance' });
    } catch (e) { return false; }
    if (!renderer.getContext()) return false;
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    view.appendChild(renderer.domElement);

    var rnd = (function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(91011);
    function rr(a, b) { return a + (b - a) * rnd(); }
    function pick(arr) { return arr[(rnd() * arr.length) | 0]; }

    /* ---------- world constants ---------- */
    var L = 0.8;                                   // land height
    var LAND = [[0, 30], [40, 66], [76, 104], [116, 140]];
    var WATER = [[30, 40], [66, 76], [104, 116]];
    var ROADS = [0, 53, 90, 128];                  // ring road radii (0 = none)
    var BRIDGE = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
    var BW = 3.2;                                  // bridge half width
    var ARCH = 1.0;
    var EDGE_M = 1.3;                              // walkable margin from quay edge
    var PR = 0.35;                                 // player radius
    var SUN = new T.Vector3(-0.74, 0.17, -0.65).normalize();
    var FOG = new T.Color(0xf2a679);

    var scene = new T.Scene();
    scene.fog = new T.Fog(FOG, 55, 640);
    renderer.setClearColor(FOG);
    var camera = new T.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.2, 1100);
    camera.rotation.order = 'YXZ';

    scene.add(new T.HemisphereLight(0xffd6b0, 0x3a4766, 0.72));
    var sunLight = new T.DirectionalLight(0xffb27a, 0.95);
    sunLight.position.copy(SUN).multiplyScalar(100);
    scene.add(sunLight);

    /* ---------- sky ---------- */
    var skyMat = new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, fog: false,
      uniforms: { uSun: { value: SUN }, uHor: { value: FOG }, uTime: { value: 0 } },
      vertexShader: 'varying vec3 vD; void main(){ vD = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p; }',
      fragmentShader: [
        'uniform vec3 uSun; uniform vec3 uHor; uniform float uTime; varying vec3 vD;',
        'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }',
        'float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x), mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x), f.y); }',
        'void main(){',
        '  vec3 d = normalize(vD); float y = d.y;',
        '  vec3 zen = vec3(0.16,0.2,0.4); vec3 mid = vec3(0.74,0.46,0.52);',
        '  vec3 col = mix(uHor, mid, smoothstep(0.02, 0.28, y));',
        '  col = mix(col, zen, smoothstep(0.22, 0.85, y));',
        '  col = mix(col, uHor * 0.92, smoothstep(0.0, -0.2, y));',
        '  float s = max(dot(d, uSun), 0.0);',
        '  col += vec3(1.0,0.62,0.32) * (pow(s, 6.0) * 0.32 + pow(s, 48.0) * 0.45);',
        '  vec2 uv = d.xz / (max(y, 0.0) + 0.12) * 1.5 + vec2(uTime * 0.008, 0.0);',
        '  float c = n(uv) * 0.6 + n(uv * 2.4 + 3.1) * 0.4;',
        '  c = smoothstep(0.56, 0.86, c) * smoothstep(0.01, 0.07, y) * (1.0 - smoothstep(0.3, 0.6, y));',
        '  vec3 cc = mix(vec3(0.52,0.33,0.45), vec3(1.0,0.74,0.52), pow(s, 2.5));',
        '  col = mix(col, cc, c * 0.75);',
        '  col += vec3(1.0,0.92,0.75) * smoothstep(0.9988, 0.9994, s) * 1.2;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'].join('\n')
    });
    var sky = new T.Mesh(new T.SphereGeometry(900, 24, 14), skyMat);
    sky.renderOrder = -1; sky.frustumCulled = false;
    scene.add(sky);

    /* ---------- water ---------- */
    var waterGeo = new T.PlaneGeometry(1700, 1700, 110, 110);
    waterGeo.rotateX(-Math.PI / 2);
    var waterMat = new T.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uSun: { value: SUN }, uFog: { value: FOG },
        uDeep: { value: new T.Color(0x0d3a48) }, uRefl: { value: new T.Color(0xd99a86) },
        uNear: { value: 55 }, uFar: { value: 640 }
      },
      vertexShader: [
        'uniform float uTime; varying vec3 vW;',
        'void main(){',
        '  vec4 w = modelMatrix * vec4(position, 1.0);',
        '  w.y += sin(w.x*0.05 + uTime*0.6)*0.14 + sin(w.z*0.07 - uTime*0.8)*0.11 + sin((w.x+w.z)*0.09 + uTime*1.1)*0.06;',
        '  vW = w.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * w;',
        '}'].join('\n'),
      fragmentShader: [
        'uniform float uTime; uniform vec3 uSun; uniform vec3 uFog; uniform vec3 uDeep; uniform vec3 uRefl; uniform float uNear; uniform float uFar;',
        'varying vec3 vW;',
        'void main(){',
        '  vec2 p = vW.xz; float t = uTime;',
        '  vec2 g = vec2(0.05,0.0)*cos(p.x*0.05+t*0.6)*0.14 + vec2(0.0,0.07)*cos(p.y*0.07-t*0.8)*0.11;',
        '  g += vec2(0.09)*cos((p.x+p.y)*0.09+t*1.1)*0.06;',
        '  g += vec2(0.9,0.4)*cos(dot(p,vec2(0.9,0.4))+t*2.1)*0.05;',
        '  g += vec2(-0.5,1.1)*cos(dot(p,vec2(-0.5,1.1))+t*2.7)*0.045;',
        '  g += vec2(1.7,-1.3)*cos(dot(p,vec2(1.7,-1.3))+t*3.3)*0.025;',
