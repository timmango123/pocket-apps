<style>
:root{--bg:#fbf1e6;--bg2:#f1dfcd;--ink:#2b2230;--ink2:#7a6470;--acc:#e8a3b5;--acc2:#b3243f;--red:#c8325a;--gold:#c9a25a;--panel:rgba(255,250,243,.84);--line:rgba(80,40,60,.16);--btn:#fffaf3;--btnsh:#e3c9bd;--card:#fffaf3;--b1:#d8506f;--b2:#b3243f;--b3:#7d1830;--red2:#c8325a;

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

#top{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);pointer-events:none}

.ib{width:44px;height:44px;border-radius:14px;background:var(--panel);box-shadow:0 2px 8px rgba(80,30,50,.14);display:grid;place-items:center;flex:none;position:relative}

#ttl{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--panel);box-shadow:0 2px 8px rgba(80,30,50,.14);display:flex;align-items:center;gap:8px;padding:0 10px;pointer-events:none}
#ttl .tx{min-width:0;flex:1;line-height:1.2}
#ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px}
#ttl span{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brk{width:26px;height:26px;flex:none}

.pp{position:fixed;z-index:2;pointer-events:none;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:16px;background:var(--panel);box-shadow:0 2px 10px rgba(80,30,50,.14);border:2px solid transparent;transition:border-color .25s,box-shadow .25s,transform .25s}
.pp.side{flex-direction:column;gap:2px;padding:6px 4px;width:68px;text-align:center}
.pp.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,90,.25),0 4px 16px rgba(201,162,90,.4)}
.pp.hit{animation:hit .5s}

.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.18)}
.av::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.pi{line-height:1.15;min-width:0}
.pi b{display:block;font-size:13px;white-space:nowrap}

.sc{font-family:var(--hand);font-style:italic;font-weight:700;font-size:19px;line-height:1}
.rp{font-size:11px;color:var(--red2);font-weight:700;white-space:nowrap;min-height:13px}
.dots{display:none}.pp.think .dots{display:inline}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-left:2px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.parr{position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#fff;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.parr svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pp.pass .parr{display:grid}

#pp2{padding-right:14px}
#pp0 .pi small{font-size:12px}#pp0 .sc{font-size:20px}
#act,#msg{position:fixed;z-index:3;height:44px;border-radius:22px;padding:0 18px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;white-space:nowrap;transform:translateX(-50%)}
#act{background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;box-shadow:0 4px 0 var(--b3),0 8px 18px rgba(0,0,0,.2);letter-spacing:1px}

#msg{background:var(--panel);color:var(--ink2);font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(80,30,50,.12);pointer-events:none;transition:opacity .25s}
#msg.me{color:var(--acc2);font-weight:800}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);background:rgba(40,16,30,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .22s ease;overflow-y:auto}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.88) rotate(-1deg);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:16px;margin-top:10px;font-weight:800;font-size:16px;letter-spacing:1px;

.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b3)}
.btn.sec{background:var(--btn);color:var(--ink);box-shadow:0 4px 0 var(--btnsh)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;background:var(--btn);box-shadow:0 2px 0 var(--btnsh);font-size:14px;font-weight:700;padding:4px;line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;box-shadow:0 2px 0 var(--b3)}
.desc{font-size:12px;color:var(--ink2);margin:6px 2px 0;min-height:16px;line-height:1.5}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}

.sw .k{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw .k::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}

.rk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}

.ach small{display:block;font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:rgba(232,163,181,.14);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:11px;color:var(--ink2)}
.stat b{font-family:var(--hand);font-style:italic;font-size:22px}
.rec{display:flex;align-items:center;gap:4px;margin:6px 0}
.rec svg.su{width:20px;height:20px;flex:none}
.rec span{flex:1;min-width:0;height:28px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card)}

.red{fill:var(--red2);color:var(--red2)}.blk{fill:var(--ink);color:var(--ink)}
#tip{position:fixed;z-index:15;left:0;right:0;margin:0 auto;width:min(360px,calc(100% - 24px));background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6;

#tip b{color:var(--acc2)}

#toast{position:fixed;z-index:30;left:0;right:0;margin:0 auto;width:fit-content;top:calc(var(--sat) + 62px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;pointer-events:none;animation:pop .3s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.pg{min-height:150px}
.pg svg.big{display:block;margin:4px auto;width:100%;height:90px}
.dots2{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots2 i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots2 i.on{background:var(--acc2)}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}.ib:hover{filter:brightness(1.04)}}

<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }

</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
const stop = e => e.preventDefault();
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
const live = new Set();
const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
Tracked.prototype = AC.prototype;
window.AudioContext = Tracked;
if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
document.addEventListener('visibilitychange', wake);
['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
