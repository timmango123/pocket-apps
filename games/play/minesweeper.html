<style>
:root{
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --bg:#0b1a2e; --ink:#e8f2fb; --ink2:#9fbad6; --card:rgba(16,38,66,.86); --card2:rgba(24,52,88,.92); --line:rgba(140,200,255,.18);
  --acc:#4fd6ff; --acc2:#3a8dff; --gold:#ffd25c; --warm:#ff7a6b; --ovbg:rgba(6,16,30,.55); --tile:#1b3a5e; --shadow:0 6px 20px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#dceefc; --ink:#173254; --ink2:#55708f; --card:rgba(255,255,255,.9); --card2:#fff; --line:rgba(40,90,150,.16);
  --acc:#0b9fd6; --acc2:#2f7be0; --gold:#f2b519; --warm:#f0614f; --ovbg:rgba(190,220,245,.55); --tile:#eef6fd; --shadow:0 6px 18px rgba(40,90,150,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hidden{display:none !important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px)}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line)}
.ibtn:active{transform:scale(.93)}
.hmid{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:0 10px}
.hl{flex:1;min-width:0;line-height:1.1}
.lvname{font-weight:800;font-size:15px;white-space:nowrap}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pips{display:flex;gap:2px}.pips i{width:4px;height:9px;border-radius:2px;background:var(--line)}
.hs{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hs svg{width:17px;height:17px}
.hs.t{min-width:52px;justify-content:flex-end;color:var(--ink2);font-weight:700}
.hs.m svg{color:var(--warm)}
/* bottom controls */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:18px;pointer-events:none;
  padding:6px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px)}
.bottom > *{pointer-events:auto}
.pill{height:50px;min-width:86px;padding:0 14px;border-radius:25px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.pill:active{transform:scale(.95)}
.pill[disabled]{opacity:.45}
.pill b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#04203a;font-size:12px;padding:0 5px}
.mode{width:76px;height:76px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:13px;
  color:#fff;background:radial-gradient(circle at 35% 30%,#7fe6ff,#2c8fe8 70%);box-shadow:0 6px 0 #1d63a8,0 10px 24px rgba(30,110,200,.45);transition:background .2s}
.mode svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.mode.flag{background:radial-gradient(circle at 35% 30%,#ff9d8a,#e2463b 70%);box-shadow:0 6px 0 #a3271f,0 10px 24px rgba(220,60,50,.45)}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 #1d63a8}
.mode.flag:active{box-shadow:0 3px 0 #a3271f}
@media (orientation:landscape) and (max-height:520px){
  .bottom{left:auto;top:0;flex-direction:column;justify-content:center;gap:12px;width:auto;padding:calc(var(--sat) + 60px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) 6px}
  .pill{min-width:84px;height:46px}
  .mode{width:68px;height:68px}
}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:var(--ovbg);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s ease}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card2);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:22px 20px;width:min(360px,100%);
  text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;height:50px;border-radius:16px;margin-top:11px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(180deg,#5fd4ff,#2f8be6);box-shadow:0 5px 0 #1d63a8,0 8px 18px rgba(30,110,200,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d63a8}
.btn.sec{background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.warm{background:linear-gradient(180deg,#ff9d7e,#ef5f4a);box-shadow:0 5px 0 #b13e2f,0 8px 18px rgba(200,70,50,.3)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--line)}
.stars span{display:inline-block}
.stars .on{color:var(--gold);text-shadow:0 0 18px rgba(255,210,92,.6);animation:starpop .55s cubic-bezier(.2,.9,.3,1.6) both}

.res{display:flex;justify-content:center;gap:18px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 2px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;background:rgba(255,210,92,.16);color:var(--gold);border:1px solid rgba(255,210,92,.4)}
.badge.new{animation:pop .5s .6s both}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;flex-direction:column;justify-content:space-between;align-items:center}
.ttl{margin-top:8vh;text-align:center}
.ttl h1{margin:0;font-size:52px;letter-spacing:8px;font-weight:900;background:linear-gradient(180deg,#ffffff,#9fe6ff 60%,#5fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(80,200,255,.55))}
[data-theme="light"] .ttl h1{background:linear-gradient(180deg,#2a6fc0,#1a4c8c);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #fff)}
.ttl .sub{color:var(--ink2);font-weight:700;margin-top:10px;font-size:15px;letter-spacing:1px}
.tbtns{width:100%;max-width:320px;padding-bottom:calc(var(--sab) + 18px)}
.tsmall{display:flex;gap:10px}.tsmall .btn{flex:1}
/* level select */
#select{align-items:stretch;padding:0;background:var(--ovbg)}
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px);display:flex;align-items:center;gap:10px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#3cc59a}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-content:start;
  padding:4px calc(var(--sar) + 14px) calc(var(--sab) + 20px) calc(var(--sal) + 14px)}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{height:76px;border-radius:15px;background:var(--card2);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:4px;position:relative}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.cur{outline:3px solid var(--acc)}
.lt.lock{opacity:.55}
.lt.lock svg{width:18px;height:18px}
.lt:active{transform:scale(.95)}
/* misc */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);z-index:8;background:rgba(8,24,44,.9);color:#eaf6ff;padding:10px 16px;border-radius:14px;
  font-size:14px;font-weight:600;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .35s;border:1px solid rgba(120,200,255,.25)}
.helpscroll{max-height:58vh;overflow-y:auto;margin:6px -6px;padding:0 6px;text-align:left;touch-action:pan-y}
.hrow{display:flex;gap:12px;align-items:center;margin:9px 0;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:9px}
.hrow canvas{flex:none;width:52px;height:52px;border-radius:10px}
.hrow div{font-size:14px;color:var(--ink2);line-height:1.5;text-align:left}
.hrow b{color:var(--ink);font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;text-align:left}
.seg{display:flex;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-width:52px;height:38px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#04203a}
#shareTxt{width:100%;height:150px;font-size:12px;line-height:1.1;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink);padding:8px;resize:none;-webkit-user-select:text;user-select:text}
@media (hover:hover){ .btn:hover{filter:brightness(1.06)} .lt:hover{filter:brightness(1.05)} .pill:hover,.ibtn:hover{filter:brightness(1.1)} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>

<div class="hud hidden" id="hud">

    <div class="hs t" aria-label="時間"><span id="hTime">0:00</span></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg class="i" viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div class="bottom hidden" id="bottom">
  <button class="pill" id="bHint" aria-label="提示"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0012 3z"/></svg>提示<b id="hintN">2</b></button>
  <button class="mode" id="bMode" aria-label="切換模式：鑿冰"><svg viewBox="0 0 24 24" id="modeIcon"></svg><span id="modeTxt">鑿冰</span></button>
  <button class="pill" id="bRestart" aria-label="重開本關"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg>重來</button>
</div>

<div class="ov" id="title">
  <div class="ttl"><h1>極地探冰</h1><div class="sub">冰原踩地雷・保證不用猜</div></div>
  <div class="tbtns">
    <button class="btn" id="tPlay">開始探險</button>

      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>

  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重開本關</button><button class="btn sec" id="pHelp">說明</button></div>
  <div class="row2"><button class="btn sec" id="pSet">設定</button><button class="btn sec" id="pSelect">關卡選擇</button></div>

<script>
/*CORE-START*/
// Board model: cells 0..N-1 (row-major). mask[c]=1 playable. mine[c]=1 crevasse.
// kind[c]: 0 normal (8-neighbour count), 1 dark (number hidden), 2 parity (odd/even of 8-count), 3 four-neighbour count.
var MS_MAXW = 20;
function msMakeLevel(W, H, mask, mine, kind, start) {
  var N = W * H, L = { W: W, H: H, N: N, mask: mask, mine: mine, kind: kind, start: start, n8: [], n4: [] };
  for (var c = 0; c < N; c++) {
    var x = c % W, y = (c / W) | 0, a8 = [], a4 = [];

  if (!sampleSp || sampleSp.S !== S) sampleSp = buildSprites(S);
  var sp = sampleSp, n = 12, cx = VW/2, cy = VH*0.52, sz = Math.min(46, VW/9);
  var pattern = [[0,0,'cov'],[1,0,'n1'],[2,0,'cov'],[-1,1,'n2'],[0,1,'open'],[1,1,'n1'],[2,1,'flag'],[-1,0,'cov'],[0,-1,'cov'],[1,-1,'n3'],[-1,2,'cov'],[0,2,'n1'],[1,2,'cov'],[2,-1,'cov']];
  pattern.forEach(function(q, i){
    var x = cx + (q[0] - 0.5)*sz*1.08 - sz/2, y = cy + (q[1] - 0.5)*sz*1.08 + Math.sin(t*0.0012 + i)*4 - sz/2;
    if (q[2] === 'cov' || q[2] === 'flag') { ctx.drawImage(sp.cov, x, y, sz, sz); if (q[2] === 'flag') ctx.drawImage(sp.flag, x, y, sz, sz); }
    else { ctx.drawImage(sp.open, x, y, sz, sz); if (q[2] !== 'open') ctx.drawImage(sp.num[+q[2][1]], x, y, sz, sz); }
  });
}
function fade(a0, a1, rect, col, horiz){
  var g = horiz ? ctx.createLinearGradient(a0, 0, a1, 0) : ctx.createLinearGradient(0, a0, 0, a1);
  g.addColorStop(0, col + '00'); g.addColorStop(0.6, col + 'd0'); g.addColorStop(1, col + 'f0');
  ctx.fillStyle = g; ctx.fillRect(rect[0], rect[1], rect[2], rect[3]);
}
function drawFades(){
  var bw = L.W*cs, bh = L.H*cs;
  if (cam.y < view.y - 1) fade(view.y, view.y - 30, [0, 0, VW, view.y], pal.bg0, false);
  if (land && land.matches) { if (cam.x + bw > view.x + view.w + 1) fade(view.x + view.w - 6, view.x + view.w + 30, [view.x + view.w - 6, 0, VW, VH], pal.bg1, true); }
  else if (cam.y + bh > view.y + view.h + 1) fade(view.y + view.h - 6, view.y + view.h + 34, [0, view.y + view.h - 6, VW, VH], pal.bg1, false);
}
var lastT = 0, rafId = 0, lastSec = -1, selDrawn = false;
function frame(t){
  rafId = requestAnimationFrame(frame);
  if (status === 'select') { if (selDrawn) return; selDrawn = true; } else selDrawn = false;
  var dt = Math.min(0.05, (t - (lastT || t))/1000); lastT = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBg(t);
  if (panAnim) { var k = Math.min(1, (t - panAnim.t0)/350), e = ease(k); cam.x = panAnim.x0 + (panAnim.x1 - panAnim.x0)*e; cam.y = panAnim.y0 + (panAnim.y1 - panAnim.y0)*e; clampCam(); if (k >= 1) panAnim = null; }
  if (L && status !== 'select') { var o = drawBoard(t); drawParticles(t, dt, o); drawFades(); }
  else if (status === 'title') drawTitleDeco(t);
  if (L && running) { var sec = Math.floor(elapsed()/1000); if (sec !== lastSec) { lastSec = sec; $('hTime').textContent = fmt(elapsed()); } }
}
function startLoop(){ if (!rafId) { lastT = 0; rafId = requestAnimationFrame(frame); } }
function stopLoop(){ if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { if (status === 'play' && started) pauseGame(); else stopClock(); stopLoop(); }
  else startLoop();
});
window.addEventListener('resize', function(){ layout(); });

/* ---------------- buttons ---------------- */
function on(id, fn){ $(id).addEventListener('click', function(e){ audio(); fn(e); }); }
on('tPlay', function(){ SFX.click(); startLevel(highestUnlocked()); });
on('tSelect', function(){ SFX.click(); openSelect(); });
on('tHelp', function(){ SFX.click(); showHelp('title'); });
on('tSet', function(){ SFX.click(); openSettings('title'); });
on('sBack', function(){ SFX.click(); status = 'title'; showOnly('title'); });
on('unlockSw', function(){ SFX.click(); unlockAll = !unlockAll; sset('unlockAll', unlockAll); buildGrid(); });
$('grid').addEventListener('click', function(e){
  var b = e.target.closest('.lt'); if (!b) return; audio();
  var n = +b.dataset.n; if (!unlocked(n)) { SFX.tick(); toast('先通過第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」'); return; }
  SFX.click(); startLevel(n);
});
on('bPause', function(){ SFX.click(); pauseGame(); });
on('bMute', function(){ set.sound = !set.sound; saveSet(); setMuteIcon(); SFX.click(); });
on('bMode', function(){ setMode(1 - mode); });
on('bHint', function(){ hint(); });
on('bRestart', function(){ if (status !== 'play' && status !== 'lost') return; SFX.click(); startLevel(levelN); });
on('pResume', function(){ SFX.click(); resumeGame(); });
on('pRestart', function(){ SFX.click(); startLevel(levelN); });
on('pHelp', function(){ SFX.click(); showHelp('pause'); });
on('pSet', function(){ SFX.click(); openSettings('pause'); });
on('pSelect', function(){ SFX.click(); openSelect(); });
on('hOk', function(){ SFX.click(); if (helpFrom === 'pause') showOnly('pause'); else { showOnly('title'); } });
on('iOk', function(){ SFX.click(); status = 'play'; showOnly(null); toast('從發光的探勘起點開始鑿冰'); });
on('wNext', function(){ SFX.click(); if (levelN < NL) startLevel(levelN + 1); else openSelect(); });
on('wRetry', function(){ SFX.click(); startLevel(levelN); });
on('wShare', function(){ SFX.click(); doShare(); });
on('wSelect', function(){ SFX.click(); openSelect(); });
on('fCont', function(){ continueHere(); });
on('fRestart', function(){ SFX.click(); startLevel(levelN); });
on('fSelect', function(){ SFX.click(); openSelect(); });
on('shareOk', function(){ SFX.click(); showOnly('win'); });
on('sSound', function(){ set.sound = !set.sound; saveSet(); setMuteIcon(); openSettings(settingsBack); SFX.click(); });
on('sVib', function(){ set.vib = !set.vib; saveSet(); openSettings(settingsBack); SFX.click(); vib(20); });
on('sCb', function(){ set.cb = !set.cb; saveSet(); sprites = null; openSettings(settingsBack); SFX.click(); });
$('sTheme').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; audio(); SFX.click(); set.theme = b.dataset.t; saveSet(); applyTheme(); });
on('setOk', function(){ SFX.click(); showOnly(settingsBack === 'pause' ? 'pause' : 'title'); });

/* ---------------- test hooks (used by demo/verify.js) ---------------- */
window.__game = {
  state: function(){ return { status: status, level: levelN, opened: opened, safe: L ? L.safe : 0, mistakes: mistakes, started: started, time: elapsed(), flags: flagsN, mode: mode, cs: cs }; },
  nextMoves: function(){
    if (!L) return [];
    if (!started) return [{ c: L.start, mine: false }];
    var k = new Uint8Array(st); for (var i=0;i<L.N;i++) if (flag[i] && k[i] === 0) k[i] = 2;
    var d = msDeduce(L, k); if (!d) return [];
    return d.list.filter(function(e){ return e.mine ? !flag[e.c] : st[e.c] === 0; }).map(function(e){ return { c: e.c, mine: e.mine }; });
  },
  cell: function(c){ var p = cellCenter(c); return { x: p.x, y: p.y, cs: cs, open: st[c], flag: flag[c], inView: p.x > view.x && p.x < view.x + view.w && p.y > view.y && p.y < view.y + view.h }; },
  view: function(){ return view; }
};

applyTheme(); setMuteIcon(); layout(); startLoop();
})();
