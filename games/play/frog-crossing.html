<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>小蛙過河</title>
<style>
:root{
  --ink:#2f4a36; --ink2:#5e7a64; --card:#fffffff0; --card2:#f1f8ec; --line:#d7e6cf; --accent:#6fbf5a; --accent2:#4f9f40; --warm:#ff9b73; --warm2:#de6f4c; --gold:#ffc94d;
  --bg:#bfe0b0; --ovbg:#c9e6bcb0; --shadow:#2f4a3622; --heart:#ff6b7d; --dim:#d5e2cf;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e4f0e0; --ink2:#a9c2a8; --card:#1f2c2aee; --card2:#273834; --line:#33473f; --accent:#5aa94a; --accent2:#3f8432; --warm:#e58763; --warm2:#b75c3d;
    --bg:#16211f; --ovbg:#0d1614b8; --shadow:#0008; --heart:#ff7d8c; --dim:#3a4b45; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 10px);
  display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5;max-width:720px;margin:0 auto}
.hud > *{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 10px var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
.hmid{flex:1;min-width:0;background:var(--card);border-radius:14px;height:48px;box-shadow:0 3px 10px var(--shadow);position:relative;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px 4px;gap:6px}
.lvname{font-weight:800;font-size:15px;white-space:nowrap;line-height:1.2}
.diff{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;line-height:1.2}
.pips{display:flex;gap:2px}
.pips i{width:4px;height:9px;border-radius:2px;background:var(--dim)}
.hc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.1;color:var(--ink2);white-space:nowrap}
.hearts{display:flex;gap:2px}
.hearts svg{width:14px;height:13px}
.nestdots{display:flex;gap:3px;align-items:center}
.nestdots i{width:10px;height:10px;border-radius:50%;background:var(--dim);display:block}
.nestdots i.on{background:#f39ab8;box-shadow:0 0 0 2px #f39ab855}
.score{font-size:11px;color:var(--ink2);text-align:right;white-space:nowrap;line-height:1.15}
.score b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
#tbar{position:absolute;left:10px;right:10px;bottom:4px;height:4px;border-radius:2px;background:var(--dim);overflow:hidden}
#tbar i{display:block;height:100%;width:100%;border-radius:2px;background:var(--accent);transform-origin:left center}
#tbar.low i{background:var(--warm)}
.hidden{display:none !important}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
  background:var(--ovbg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px var(--shadow);padding:22px 20px;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:2px 0 8px;font-size:25px;letter-spacing:2px}
.card p{margin:6px 0;color:var(--ink2);line-height:1.6;font-size:15px}
.btn{display:block;width:100%;min-height:50px;border-radius:18px;margin-top:11px;font-weight:800;font-size:17px;padding:0 12px;
  background:linear-gradient(180deg,#86d06f,#5fb44c);color:#fff;box-shadow:0 5px 0 #46913a,0 8px 18px #46913a44}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #46913a}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.warm{background:linear-gradient(180deg,#ffb08f,#ff8a62);box-shadow:0 5px 0 #d4643f,0 8px 18px #d4643f44}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.row3{display:flex;gap:8px}.row3 .btn{flex:1;font-size:15px}
.stars{font-size:44px;letter-spacing:6px;margin:4px 0;color:var(--dim)}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #e0a420;display:inline-block;animation:starpop .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:stretch;flex-direction:column;justify-content:space-between;padding-bottom:calc(var(--sab) + 22px)}
.ttl{margin-top:5vh;text-align:center;width:100%}
.ttl h1{font-size:52px;margin:0;letter-spacing:6px;color:#fff;text-shadow:0 3px 0 #3d7a33,0 6px 0 #2e5f27,0 12px 26px #0006}
.ttl .sub{display:inline-block;margin-top:10px;font-size:15px;font-weight:700;color:var(--ink);background:var(--card);padding:6px 14px;border-radius:14px;box-shadow:0 3px 10px var(--shadow)}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:0;padding:0 24px;width:100%}
.tbtns .btn,.tbtns .row3{max-width:330px;width:100%}
#select{align-items:stretch;padding:0;background:linear-gradient(180deg,#d9f0cf,#d3ebe6)}
@media (prefers-color-scheme: dark){ #select{background:linear-gradient(180deg,#14201d,#122025)} }
.selwrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:640px;margin:0 auto}
.selhead{padding:calc(var(--sat) + 10px) 12px 8px;display:flex;align-items:center;gap:8px}
.selhead h2{flex:1;margin:0;font-size:21px;white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);min-height:44px;padding:0 4px;text-align:left}
.sw .trk{width:46px;height:28px;border-radius:14px;background:var(--dim);position:relative;transition:background .2s;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"] .trk{background:#6cc36a}
.sw[aria-checked="true"] .trk::after{transform:translateX(18px)}
.selsum{padding:0 16px 8px;font-size:13px;color:var(--ink2)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px calc(var(--sab) + 20px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;touch-action:pan-y}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,1fr)}}
.lt{aspect-ratio:1/1.15;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 14px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px}
.lt .n{font-size:19px;font-weight:800;line-height:1}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--dim);line-height:1}
.lt .st .on{color:var(--gold)}
.lt .db{width:72%;height:5px;border-radius:3px;background:var(--dim);overflow:hidden}
.lt .db i{display:block;height:100%;border-radius:3px}
.lt .dn{font-size:11px;color:var(--ink2);line-height:1}
.lt.done{background:var(--card2)}
.lt.cur{outline:3px solid var(--accent)}
.lt.lock{opacity:.6}
.lt.lock svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2.4}
.lt .mk{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warm)}
.lt:active{transform:scale(.95)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 72px);transform:translateX(-50%);z-index:8;background:#24382bee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;width:max-content;text-align:center;pointer-events:none;transition:opacity .4s;line-height:1.5}
.mech{display:flex;gap:12px;align-items:center;text-align:left;margin:10px 0;background:var(--card2);border-radius:16px;padding:10px}
.mech canvas{flex:none;width:64px;height:64px;border-radius:12px}
.mech div{font-size:14px;color:var(--ink2);line-height:1.5}
.mech b{color:var(--ink);font-size:15px}
.scroll{max-height:min(56vh,440px);overflow-y:auto;margin:6px -6px;padding:0 6px;touch-action:pan-y;text-align:left}
.res{display:flex;justify-content:center;gap:18px;margin:4px 0 6px;font-size:13px;color:var(--ink2)}
.res b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px}
.setrow .sw{padding:0}
.setrow small{display:block;font-size:12px;color:var(--ink2)}
.skins{display:flex;gap:8px;margin:10px 0 2px}
.skin{flex:1;border-radius:14px;background:var(--card2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;min-height:44px;border:3px solid transparent}
.skin canvas{width:44px;height:44px}
.skin.on{border-color:var(--accent)}
.skin.lock{opacity:.5}
.skin small{font-size:11px;font-weight:500;color:var(--ink2)}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach .ic{width:36px;height:36px;border-radius:12px;background:var(--dim);display:grid;place-items:center;flex:none;font-weight:900;color:#fff;font-size:16px}
.ach.on .ic{background:linear-gradient(180deg,#ffd76a,#f4b23c)}
.ach b{font-size:14px;display:block}
.ach span{font-size:12px;color:var(--ink2)}
.statg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.statg div{background:var(--card2);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--ink2);text-align:center}
.statg b{display:block;font-size:19px;color:var(--ink)}
h3{font-size:15px;margin:12px 0 4px}
.help p{font-size:14px;text-align:left;margin:6px 0}
#dpad{position:fixed;z-index:6;width:200px;height:140px;left:50%;bottom:calc(var(--sab) + 10px);transform:translateX(-50%)}
#dpad button{position:absolute;width:64px;height:64px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line),0 6px 14px var(--shadow);display:grid;place-items:center}
#dpad button:active,#dpad button.hit{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#dpad svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#dU{left:68px;top:0}#dL{left:0;top:72px}#dD{left:68px;top:72px}#dR{left:136px;top:72px}
@media (orientation:landscape) and (max-height:600px){
  #dpad{left:auto;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 14px);transform:none}
  .ttl{margin-top:2vh}.ttl h1{font-size:38px}
  .card{padding:14px 18px}.card h2{font-size:21px;margin-bottom:4px}.btn{min-height:46px;margin-top:8px}
  .stars{font-size:34px}
  .ov{align-items:flex-start}
}
@media (max-height:600px){ .ov{align-items:flex-start} }
</style>
<style id="mobile-shim">
/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas, img, svg { -webkit-user-drag: none; -webkit-touch-callout: none; }
</style>
<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <button class="ibtn" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hmid">
    <div>
      <div class="lvname" id="hLevel">第 1 關</div>
      <div class="diff">難度 <span id="hDiffN">1</span><span class="pips" id="hPips"></span></div>
    </div>
    <div class="hc"><div class="hearts" id="hLives"></div><div class="nestdots" id="hNests" aria-label="荷葉窩"></div></div>
    <div class="score">分數<b id="hScore">0</b></div>
    <div id="tbar"><i id="tfill"></i></div>
  </div>
  <button class="ibtn" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
</div>

<div id="dpad" class="hidden">
  <button id="dU" aria-label="上"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button id="dL" aria-label="左"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="dD" aria-label="下"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button id="dR" aria-label="右"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<div class="ov" id="title">
  <div class="ttl">
    <h1>小蛙過河</h1>
    <div class="sub">跳過車流・踩著漂流木・送小蝌蚪回家</div>
  </div>
  <div class="tbtns">
    <button class="btn warm" id="tPlay">開始遊戲</button>
    <div class="row2" style="max-width:330px;width:100%"><button class="btn sec" id="tSelect">選擇關卡</button><button class="btn sec" id="tDaily">每日關卡</button></div>
    <div class="row3"><button class="btn sec" id="tSet">設定</button><button class="btn sec" id="tRec">紀錄</button><button class="btn sec" id="tHelp">說明</button></div>
  </div>
</div>

<div class="ov hidden" id="select">
  <div class="selwrap">
    <div class="selhead">
      <button class="ibtn" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>選擇關卡</h2>
      <button class="sw" id="unlockSw" role="switch" aria-checked="false"><span>解鎖全部關卡</span><span class="trk"></span></button>
    </div>
    <div class="selsum" id="selSum"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="ov hidden" id="pause"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <button class="btn" id="pResume">繼續</button>
  <div class="row2"><button class="btn sec" id="pRestart">重來</button><button class="btn sec" id="pSet">設定</button></div>
  <button class="btn sec" id="pSelect">回到選單</button>
</div></div>

<div class="ov hidden" id="win"><div class="card">
  <h2 id="wTitle">過河成功！</h2>
  <div class="stars" id="wStars"></div>
  <div class="res"><div>分數<b id="wScore">0</b></div><div>失命<b id="wDeaths">0</b></div><div>蒼蠅<b id="wFlies">0</b></div></div>
  <p id="wMsg"></p>
  <button class="btn warm" id="wNext">下一關</button>
  <div class="row2"><button class="btn sec" id="wRetry">再玩一次</button><button class="btn sec" id="wSelect">關卡選擇</button></div>
  <button class="btn sec" id="wReplay">看最佳過河重播</button>
</div></div>

<div class="ov hidden" id="fail"><div class="card">
  <h2>沒有命了…</h2>
  <p id="fMsg">小青蛙需要休息一下。</p>
  <div class="res"><div>分數<b id="fScore">0</b></div><div>已回窩<b id="fNests">0</b></div></div>
  <button class="btn warm" id="fRetry">再挑戰一次</button>
  <button class="btn sec" id="fSelect">關卡選擇</button>
</div></div>

<div class="ov hidden" id="intro"><div class="card">
  <h2 id="iTitle">新機關</h2>
  <div id="iBody"></div>
  <button class="btn warm" id="iOk">開始挑戰</button>
</div></div>

<div class="ov hidden" id="help"><div class="card">
  <h2>玩法說明</h2>
  <div class="scroll help" id="helpBody"></div>
  <button class="btn" id="hOk">知道了</button>
</div></div>

<div class="ov hidden" id="settings"><div class="card">
  <h2>設定</h2>
  <div class="scroll" style="max-height:min(62vh,480px)">
    <div class="setrow"><div>虛擬方向鍵<small>畫面下方顯示 4 個方向鍵</small></div><button class="sw" id="sDpad" role="switch" aria-checked="false" aria-label="虛擬方向鍵"><span class="trk"></span></button></div>
    <div class="setrow"><div>輔助模式<small>車流與河流速度 −20%</small></div><button class="sw" id="sAssist" role="switch" aria-checked="false" aria-label="輔助模式"><span class="trk"></span></button></div>
    <div class="setrow"><div>音效</div><button class="sw" id="sSound" role="switch" aria-checked="true" aria-label="音效"><span class="trk"></span></button></div>
    <div class="setrow"><div>震動</div><button class="sw" id="sVib" role="switch" aria-checked="true" aria-label="震動"><span class="trk"></span></button></div>
    <h3>青蛙造型</h3>
    <div class="skins" id="skins"></div>
  </div>
  <button class="btn" id="setOk">完成</button>
</div></div>

<div class="ov hidden" id="records"><div class="card">
  <h2>紀錄與成就</h2>
  <div class="scroll" id="recBody"></div>
  <button class="btn" id="recOk">關閉</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<script>
/*CORE-START*/
var COLS = 11, ROWS = 15, JUMP = 0.12, NESTS = [1, 3, 5, 7, 9], TICK = 0.04;
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 up, 1 right, 2 down, 3 left
var MECH = [
  { lv: 6, id: 'turtle', name: '潛水龜', tip: '有些烏龜會潛水！龜殼閃爍 0.8 秒後就會沉下去，別站在上面。' },
  { lv: 12, id: 'bike', name: '機車', tip: '機車又小又快，看準空檔再跳。' },

function buildGrid() {

      '<span class="db"><i style="width:' + Math.round(clamp((P.D - 20) / 180, 0.05, 1) * 100) + '%;background:' + diffCol(P.D) + '"></i></span><span class="dn">難度 ' + P.D + '</span></button>';

function mechIcon(cnv, id) {
  var c = cnv.getContext('2d'), s = 64 * 2; cnv.width = s; cnv.height = s;
  var u = s / 2.2;
  c.fillStyle = id === 'night' ? '#1b2340' : (['turtle', 'croc', 'rain'].indexOf(id) >= 0 ? PAL.river : id === 'snake' || id === 'cone' ? PAL.grass : id === 'close' ? PAL.bank : PAL.road);
  c.fillRect(0, 0, s, s);
  if (id === 'turtle') { drawTurtle(c, s * 0.3, s / 2, u, 1, 0, 0); drawTurtle(c, s * 0.72, s / 2, u, 1, 1, 0); }
  else if (id === 'bike') vehShape(c, s * 0.15, s / 2 - u / 2, u * 1.3, u, 'bike', '#ef6f6c', 1, u);
  else if (id === 'snake') drawSnake(c, s * 0.05, s / 2 - u / 2, 1.8, 1, u, 1);
  else if (id === 'croc') { var u3 = s / 3.2; drawCroc(c, s * 0.03, s / 2 - u3 / 2, u3 * 3, u3, 1, 1); }
  else if (id === 'vary') { c.strokeStyle = '#f2cf4a'; c.lineWidth = 4; c.beginPath(); for (var x = 0; x < s; x += 2) c.lineTo(x, s * 0.78 + Math.sin(x / 9) * 6); c.stroke(); vehShape(c, s * 0.15, s * 0.2, u * 1.5, u, 'car', '#6cb4ee', 1, u); }
  else if (id === 'express') { c.fillStyle = '#f2cf4a'; c.fillRect(0, s / 2 - 5, s, 3); c.fillRect(0, s / 2 + 2, s, 3); vehShape(c, s * 0.3, s / 2 - u * 1.05, u * 1.5, u, 'car', '#ef6f6c', 1, u); vehShape(c, s * 0.05, s / 2 + u * 0.05, u * 1.5, u, 'car', '#9b8fe3', -1, u); }
  else if (id === 'cone') { drawCone(c, s * 0.3, s / 2, u); drawCone(c, s * 0.7, s / 2, u); }
  else if (id === 'night') { c.fillStyle = '#fff6c0'; c.beginPath(); c.arc(s * 0.5, s * 0.45, u * 0.5, 0, 6.283); c.fill(); c.fillStyle = '#1b2340'; c.beginPath(); c.arc(s * 0.62, s * 0.38, u * 0.45, 0, 6.283); c.fill(); }
  else if (id === 'rain') { drawLog(c, s * 0.1, s / 2 - u / 2, u * 2, u); c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); for (var i = 0; i < 8; i++) { var rx = (i * 37) % s, ry = (i * 53) % s; c.moveTo(rx, ry); c.lineTo(rx - 5, ry + 14); } c.stroke(); }
  else if (id === 'close') { drawBud(c, s * 0.3, s / 2, u); drawPad(c, s * 0.72, s / 2, u, 0); }
  else if (id === 'tap') { c.fillStyle = PAL.grass; c.fillRect(0, 0, s, s); drawFrog(c, s / 2, s * 0.6, u * 1.2, 0, 0, settings.skin); c.strokeStyle = '#fff'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(s / 2, s * 0.3); c.lineTo(s / 2, s * 0.08); c.moveTo(s / 2 - 10, s * 0.18); c.lineTo(s / 2, s * 0.08); c.lineTo(s / 2 + 10, s * 0.18); c.stroke(); }
}

    b.innerHTML = '<div class="mech"><canvas id="iCan"></canvas><div><b>輕點畫面＝往上跳</b><br>在任何地方滑動，就往那個方向跳。跳躍中再點一下會接著跳。</div></div><p>躲開車子、踩著木頭過河，把小青蛙送回最上面的荷葉窩！每關有 3 條命。</p>';
    mechIcon($('iCan'), 'tap');
  } else {
    $('iTitle').textContent = '新機制：' + m.name;
    b.innerHTML = '<div class="mech"><canvas id="iCan"></canvas><div><b>' + m.name + '</b><br>' + m.tip + '</div></div><p>第 ' + n + ' 關起出現。</p>';

function showWin() {

  $('wStars').innerHTML = [1, 2, 3].map(function (i) { return '<span class="' + (i <= st ? 'on' : '') + '" style="animation-delay:' + (i * 0.15) + 's">★</span>'; }).join('');
  $('wScore').textContent = G.score; $('wDeaths').textContent = G.deaths; $('wFlies').textContent = G.flies;
  var msg = st === 3 ? '一次都沒失手，太厲害了！' : st === 2 ? '只失手一次，再接再厲拿 3 星！' : '安全過關！不失手可拿 3 星。';
  if (!G.daily && G.n === 100) msg = '你完成了全部 100 關，真正的過河大師！';
  if (G.daily) msg = '今天的每日關卡完成了，明天再來！';
  $('wMsg').textContent = msg;
  $('wNext').classList.toggle('hidden', !!G.daily || G.n >= 100);

  $('fScore').textContent = G.score; $('fNests').textContent = G.filled.reduce(function (a, b) { return a + b; }, 0) + ' / ' + G.L.need;
  show('fail');
}
function helpHtml() {
  return '<p><b>目標：</b>把小青蛙一格一格送過馬路與河流，跳進最上面的荷葉窩。第 1～10 關要 1 隻、11～30 關要 3 隻、31 關起要填滿 5 個窩。</p>' +
    '<p><b>操作：</b>輕點畫面＝往上跳；在任何地方滑動＝往該方向跳。跳躍中的輸入會在落地時立刻執行，連跳很順。可在設定開啟虛擬方向鍵。鍵盤可用方向鍵／WASD，P 暫停。</p>' +
    '<p><b>危險：</b>被車撞、掉進河裡、被漂流物帶出畫面、時間到，都會失去 1 條命（每關 3 命）。</p>' +
    '<p><b>河流：</b>站在木頭、浮葉、烏龜背上會跟著漂。潛水龜閃爍後會下沉；鱷魚的頭會咬人。</p>' +
    '<p><b>計分：</b>往前跳 +10、回窩 +50 加上剩餘秒數 ×10；窩裡有蒼蠅時進窩再 +200。0 次失命 3 星、1 次 2 星。</p>' +
    '<p><b>難度：</b>每關都比前一關更難（車速、密度、車道數、時限、新機制），關卡選擇與上方顯示難度數值。</p>';
}
var ACH = [
  { id: 'first', name: '初次過河', desc: '通過第 1 關', ok: function () { return progress >= 1; } },
  { id: 'perfect10', name: '無傷高手', desc: '無傷通關 10 個不同關卡', ok: function () { return Object.keys(stats.perfect).length >= 10; }, prog: function () { return Object.keys(stats.perfect).length + '/10'; } },
  { id: 'fly50', name: '蒼蠅獵人', desc: '累積吃 50 隻蒼蠅（解鎖金蛙）', ok: function () { return stats.flies >= 50; }, prog: function () { return Math.min(50, stats.flies) + '/50'; } },
  { id: 'lv20', name: '雨中跳躍', desc: '通過第 20 關（解鎖雨蛙）', ok: function () { return progress >= 20; } },
  { id: 'lv50', name: '半程勇者', desc: '通過第 50 關', ok: function () { return progress >= 50; } },
  { id: 'lv100', name: '過河大師', desc: '通過第 100 關', ok: function () { return progress >= 100; } },
  { id: 'jump1000', name: '跳跳不停', desc: '累積跳 1000 次', ok: function () { return stats.jumps >= 1000; }, prog: function () { return Math.min(1000, stats.jumps) + '/1000'; } },

  $('sSound').setAttribute('aria-checked', settings.sound); $('sVib').setAttribute('aria-checked', settings.vib);

function updDpad() { $('dpad').classList.toggle('hidden', !(settings.dpad && G.mode === 'play')); }

// ================= daily =================
function todayKey() { var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function startDaily() {
  var key = todayKey(), seed = Math.imul(key, 7919) >>> 0, L = null;
  for (var salt = 0; salt < 12; salt++) {
    var cand = genLevel(40, salt, seed), ok = true;
    for (var ph = 0; ph < 2 && ok; ph++) { var r = plan(cand, newFrog(), 3 + ph * 4.1, { margin: 0.15, horizon: cand.T }); ok = r.arrive.every(function (a) { return a >= 0; }); }
    if (ok) { L = cand; break; }
  }
  if (!L) L = genLevel(40, 0);
  L.n = 1000 + key % 1000;
  startLevel(40, { L: L, daily: key });
}

// ================= input wiring =================
var ptr = null;
cv.addEventListener('pointerdown', function (e) {
  audio();
  if (G.mode !== 'play') return;
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, ts: e.timeStamp, fired: false };
});
cv.addEventListener('pointermove', function (e) {
  if (!ptr || ptr.id !== e.pointerId || ptr.fired) return;
  var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.hypot(dx, dy) > 24) { ptr.fired = true; input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0), e); }
});
function ptrEnd(e) {
  if (!ptr || ptr.id !== e.pointerId) return;
  var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (!ptr.fired) {
    if (Math.hypot(dx, dy) > 24) input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0), e); // quick flick whose moves were coalesced
    else if (e.timeStamp - ptr.ts < 200) input(0, e);
  }
  ptr = null;
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', function () { ptr = null; });
[['dU', 0], ['dR', 1], ['dD', 2], ['dL', 3]].forEach(function (q) {
  $(q[0]).addEventListener('pointerdown', function (e) { e.preventDefault(); audio(); input(q[1], e); });
});
document.addEventListener('keydown', function (e) {
  var k = e.key, map = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
  if (k === 'p' || k === 'P' || k === 'Escape') { if (G.mode === 'play' && G.status === 'play') { if (G.paused && !$('pause').classList.contains('hidden')) resume(); else if (!G.paused) pauseGame(); } return; }
  if (map[k] != null && G.mode === 'play') { e.preventDefault(); audio(); if (!e.repeat) input(map[k], e); }
});
function pauseGame() {
  if (G.mode !== 'play' || G.status === 'won' || G.status === 'over') return;
  G.paused = true; $('pInfo').textContent = (G.daily ? '每日關卡' : '第 ' + G.n + ' 關') + '　難度 ' + G.L.D + '　分數 ' + G.score; show('pause');
}
function resume() { hideAll(); G.paused = false; last = performance.now(); }
document.addEventListener('visibilitychange', function () { if (document.hidden && G.mode === 'play' && !G.paused && G.status === 'play') pauseGame(); last = performance.now(); });

on('bPause', pauseGame);

on('tPlay', function () { startLevel(Math.min(100, progress + 1)); });

on('sBack', goTitle);

  var n = +b.dataset.n; if (!unlocked(n)) { SFX.bump(); toast('先通過第 ' + (n - 1) + ' 關，或打開「解鎖全部關卡」', 1800); return; }

on('pSet', function () { showSettings('pause'); });

on('wNext', function () { startLevel(Math.min(100, G.n + 1)); });

sw('sDpad', 'dpad', function () { updDpad(); layout(); });
sw('sAssist', 'assist');
sw('sSound', 'sound', setMuteIcon);
sw('sVib', 'vib');

  var b = e.target.closest('.skin'); if (!b) return; var i = +b.dataset.i;

if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', function (e) { DARK = e.matches; setPal(); buildBg(); });

// ================= main loop =================
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (G.mode === 'menu') { G.t += dt; }
  else update(dt);
  render();
  requestAnimationFrame(frame);
}
setMuteIcon();
goTitle();
requestAnimationFrame(frame);

window.__game = {
  state: function () { var F = G.F || {}; return { cause: G.cause, mode: G.mode, status: G.status, paused: G.paused, t: G.t, row: F.row, x: F.x, jt: F.jt, filled: G.filled.slice(), need: G.L ? G.L.need : 0, lives: G.lives, deaths: G.deaths, score: G.score, n: G.n, trip: G.trip, ws: worldScale() }; },
  fullLog: function () { return fullLog.slice(); },
  trace: function () { return trace.slice(); },
  // deterministic re-run of a recorded input log (used to film a verified bot run without slowing that run down)
  replay: function (n, log) { playReplay(n, { ws: 1, log: log }); },
  inputs: function () { return { count: inCount, log: inLog.slice(-8), t: G.t, status: G.status, frameWall: performance.timeOrigin + last, ws: G.mode === 'play' ? worldScale() : 1 }; },
  level: function () { return { n: G.n, salt: G.L ? G.L.salt : 0, D: G.L ? G.L.D : 0 }; },
  start: startLevel
};
