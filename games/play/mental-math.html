<meta charset="utf-8">

<title>粉筆心算</title>
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","Courier New",monospace;
  color-scheme:dark;
  --bg:#1b1611;--ink:#f4f1e6;--ink2:#b9c4b6;--chip:#22352bdd;--chipb:#ffffff1c;
  --key1:#2e4438;--key2:#223329;--keyb:#40594a;--keysh:#0e1812;--keyink:#f7f3e3;
  --tray1:#5e3d22;--tray2:#3b2614;--card:#1e3128;--cardb:#6b4527;
  --pri:#f3e3a2;--priink:#2b2716;--prish:#b9a35a;--sec:#ffffff14;--secb:#ffffff33;
  --acc:#ffe066;--good:#86d98f;--bad:#ff8577;--stick:#f4f1e6;--stick0:#ffffff26;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#dde2e6;--ink:#1f2933;--ink2:#56626e;--chip:#ffffffd9;--chipb:#00000014;
  --key1:#ffffff;--key2:#eef1f4;--keyb:#c9d0d6;--keysh:#aab3bb;--keyink:#1f3b73;
  --tray1:#c3cad0;--tray2:#a5adb5;--card:#ffffff;--cardb:#b7c0c8;
  --pri:#2f6fdc;--priink:#fff;--prish:#1f4fa6;--sec:#f1f4f7;--secb:#cfd6dc;
  --acc:#e8a400;--good:#2f9e44;--bad:#e03131;--stick:#e8590c;--stick0:#0000001a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.off{visibility:hidden}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:center;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);height:calc(var(--sat) + 60px)}
.ib{width:44px;height:44px;flex:none;border-radius:13px;background:var(--chip);border:1px solid var(--chipb);display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.94)}
.hm{flex:1;min-width:0;height:48px;border-radius:14px;background:var(--chip);border:1px solid var(--chipb);display:flex;align-items:center;gap:8px;padding:0 10px}
.sc{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.sc small{font-size:11px;color:var(--ink2)}
.sc b{font:800 22px/1 var(--mono);letter-spacing:-.5px}
.cb{flex:none;font:800 13px/1 var(--mono);padding:4px 6px;border-radius:8px;background:var(--sec);color:var(--ink2);white-space:nowrap;transition:transform .15s}
.cb.hot{color:#1b1611;background:var(--acc)}
.cb.pop{transform:scale(1.3)}
.rc{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.lv{display:flex;gap:3px;height:9px;align-items:center}
.lv i{width:13px;height:6px;border-radius:2px;background:var(--stick0);transform:rotate(-8deg)}
.lv i.on{background:var(--stick);box-shadow:0 0 3px #fff6}
.lv i.brk{animation:brk .6s ease}
@keyframes brk{0%{transform:scale(1.8) rotate(20deg);background:var(--bad)}100%{transform:rotate(-8deg)}}
.lv .tm{font:800 14px/1 var(--mono)}
.df{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
.df b{color:var(--ink);font-family:var(--mono)}
.sb{width:34px;height:5px;border-radius:3px;background:var(--stick0);overflow:hidden;display:block}
.sb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--acc),var(--bad));border-radius:3px}
#keys{position:fixed;left:0;right:0;bottom:0;height:34%;z-index:4;padding:12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
  background:linear-gradient(180deg,var(--tray1),var(--tray2));border-top:3px solid #00000040;box-shadow:0 -4px 14px #0004}
#kg{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:10px;height:100%}
#kg.c3{grid-template-columns:repeat(3,1fr)}
#kg.shk{animation:shk .25s linear}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.k{position:relative;min-width:72px;min-height:72px;border-radius:16px;background:linear-gradient(180deg,var(--key1),var(--key2));border:2px solid var(--keyb);
  box-shadow:0 4px 0 var(--keysh);color:var(--keyink);font:800 clamp(26px,8.4vw,40px)/1 var(--mono);display:grid;place-items:center;touch-action:manipulation;transition:transform .06s,background .15s}
.k.dn{transform:scale(.94) translateY(2px);box-shadow:0 2px 0 var(--keysh)}
.k.ok{background:var(--good);color:#10240f}
.k.bad{background:var(--bad);color:#2a0d0a}
.k.nw .kv{animation:nw .2s ease}
.k.dim .kv{opacity:.25}
@keyframes nw{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
.k kbd{position:absolute;left:8px;top:6px;font:600 11px/1 var(--mono);color:var(--ink2);opacity:.7;display:none}
@media (hover:hover) and (pointer:fine){.k kbd{display:block}.k:hover{filter:brightness(1.08)}.btn:hover{filter:brightness(1.06)}}
#hint{position:fixed;left:0;right:0;z-index:6;text-align:center;pointer-events:none;font-weight:800;font-size:16px;color:var(--acc);text-shadow:0 2px 6px #000a;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);background:#0008;animation:fade .25s ease}
:root[data-theme="light"] .ov{background:#dde2e699}
#menu{background:transparent}
@media (max-height:600px){.ov{align-items:flex-start}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:none;opacity:1}}
.card{width:min(380px,100%);background:var(--card);border:3px solid var(--cardb);border-radius:22px;padding:20px 18px;text-align:center;box-shadow:0 20px 50px #0007;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.card h2{margin:0 0 6px;font-size:26px;letter-spacing:3px}
.card p{margin:4px 0;color:var(--ink2);font-size:14px;line-height:1.55}
.ttl{margin:2px 0 4px;font-size:44px;letter-spacing:6px;font-weight:900;text-shadow:0 0 1px currentColor,1px 1px 0 #ffffff30,-1px 0 0 #ffffff20}
:root[data-theme="light"] .ttl{color:#1f6fd1;text-shadow:none}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:15px;margin-top:10px;font-weight:800;font-size:17px;line-height:1.2;
  background:var(--sec);border:2px solid var(--secb);color:var(--ink)}
.btn small{font-size:11px;font-weight:600;color:var(--ink2);margin-top:2px}
.btn.pri{background:var(--pri);color:var(--priink);border-color:var(--pri);box-shadow:0 4px 0 var(--prish);min-height:58px;font-size:19px}
.btn.pri small{color:inherit;opacity:.75}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.ghost{min-height:44px;font-size:15px;background:transparent;flex-direction:row;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.res div{background:var(--sec);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--ink2)}
.res b{display:block;font:800 20px/1.2 var(--mono);color:var(--ink)}
.big{font:900 52px/1.1 var(--mono);margin:2px 0;color:var(--acc)}
.nb{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:10px;background:var(--acc);color:#1b1611;animation:pop .5s .3s both}
.book{max-height:132px;overflow-y:auto;margin:8px 0 0;text-align:left;font:600 14px/1.9 var(--mono);background:var(--sec);border-radius:12px;padding:6px 12px;touch-action:pan-y}
.book .x{color:var(--bad)}.book .o{color:var(--good)}
.bookh{font-size:12px;color:var(--ink2);text-align:left;margin-top:10px}
.sharebox{margin-top:8px;padding:8px;border-radius:10px;background:var(--sec);font-size:13px;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--chipb);text-align:left;font-size:15px}
.row small{display:block;color:var(--ink2);font-size:12px}
.sw{width:52px;height:44px;flex:none;display:grid;place-items:center}
.sw i{width:48px;height:28px;border-radius:14px;background:var(--stick0);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--good)}
.sw[aria-checked="true"] i::after{transform:translateX(20px)}
.seg{display:flex;gap:4px;background:var(--sec);border-radius:12px;padding:3px}
.seg button{min-height:40px;min-width:52px;padding:0 8px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--priink)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ach div{font-size:12px;color:var(--ink2);line-height:1.3}
.ach .bd{width:58px;height:58px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font:900 17px/1 var(--mono);border:3px dashed var(--secb);color:var(--secb)}
.ach .got .bd{border:3px solid var(--acc);color:var(--acc);box-shadow:0 0 12px #ffe06640}
.ach .got{color:var(--ink)}
.ach small{display:block;font-size:11px;color:var(--ink2)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:#000c;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:700;pointer-events:none;transition:opacity .35s;max-width:90vw;text-align:center}
@media (max-width:380px){.sc small{display:none}}
@media (orientation:landscape) and (max-height:520px){
  #keys{top:calc(var(--sat) + 60px);left:auto;width:42%;height:auto;border-top:0;border-left:3px solid #00000040;padding-top:10px}
  #hint{display:none}
  .ttl{font-size:34px}
}
</style>

/* Mobile shim: keep browser gestures (double-tap zoom, pull-to-refresh, long-press menus, image drag) from hijacking play. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

<script>
/* Mobile shim: iOS ignores user-scalable=no, so block pinch zoom here; suppress long-press menus; resume audio that iOS interrupts (calls, Siri, app switch). */
(() => {
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault(); });
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const live = new Set();
  const Tracked = function (...a) { const c = new AC(...a); live.add(c); return c; };
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  const wake = () => { if (!document.hidden) live.forEach(c => { if (c.state === 'interrupted') c.resume().catch(() => {}); }); };
  document.addEventListener('visibilitychange', wake);
  ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, wake, { passive: true, capture: true }));
})();
</script>

<body>
<canvas id="cv"></canvas>
<div id="hud" class="off">
  <button class="ib" id="bPause" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <div class="hm">
    <div class="sc"><small id="sLab">分數</small><b id="sVal">0</b></div>
    <div class="cb" id="cb">×1</div>
    <div class="rc"><div class="lv" id="lv"></div><div class="df">難度 <b id="dT">1/6</b><i class="sb"><i id="sbar"></i></i></div></div>
  </div>
  <button class="ib" id="bMute" aria-label="音效"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
</div>

<div class="ov" id="menu">
  <div class="card">
    <div class="ttl">粉筆心算</div>
    <p>黑板落下的算式，搶在觸底前點出答案</p>
    <button class="btn pri" data-mode="classic">經典模式<small id="bC">最高分 0</small></button>
    <div class="g2">
      <button class="btn" data-mode="sprint">60 秒衝刺<small id="bS">不扣粉筆</small></button>
      <button class="btn" data-mode="daily">每日挑戰<small id="bD">今日題目</small></button>
      <button class="btn" data-mode="mul">乘法練習<small id="bM">只出乘法</small></button>
      <button class="btn" data-mode="div">除法練習<small id="bV">只出除法</small></button>
    </div>
    <div class="g2"><button class="btn ghost" id="bAch">成就 <span id="achN"></span></button><button class="btn ghost" id="bSet">設定</button></div>
  </div>
</div>

<div class="ov" id="pause" hidden>
  <div class="card">

    </div>
    <div id="rBookW"><div class="bookh">錯題本</div><div class="book" id="rBook"></div></div>
    <div id="rShareBox"></div>
    <button class="btn pri" id="rAgain">再來一局</button>

  </div>

<script>
/*CORE-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var TIER_AT=[0,500,1200,2000,3500,6000],SIM_AT=[0,800,2500,6000];
function tierFor(s){var t=1;for(var i=1;i<6;i++)if(s>=TIER_AT[i])t=i+1;return t}
function simulFor(s){var n=1;for(var i=1;i<4;i++)if(s>=SIM_AT[i])n=i+1;return n}
function optsFor(s){return s>=3000?6:4}
function negFor(s){return s>=6000}
function fallTime(n){return Math.max(2.2,9*Math.pow(0.985,n))}
function multFor(c){return Math.min(4,1+0.5*Math.floor(c/5))}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1))}
var MI='−',MU='×',DV='÷';
function genProblem(tier,r,neg,kind){
  var a,b,c,q,text,ans,alt=[],t=tier,k;
  if(kind==='mul')t=(tier>=4&&r()<.35)?5:3;
  if(kind==='div')t=4;
  if(t===1){a=ri(r,0,9);b=ri(r,0,9);
    if(r()<.5){ans=a+b;text=a+'+'+b;alt=[a*b,Math.abs(a-b)]}
    else{if(a<b&&!neg){c=a;a=b;b=c}ans=a-b;text=a+MI+b;alt=[a+b,b-a]}}
  else if(t===2){
    if(r()<.5){a=ri(r,10,89);b=ri(r,10,99-Math.min(a,60));ans=a+b;text=a+'+'+b;alt=[a-b,ans+10,ans-10]}
    else{a=ri(r,20,99);b=ri(r,10,99);if(a<b&&!(neg&&r()<.4)){c=a;a=b;b=c}if(a===b)a+=ri(r,1,9);ans=a-b;text=a+MI+b;alt=[a+b-2*(b%10),ans+10,b-a]}}
  else if(t===3){a=ri(r,2,9);b=ri(r,2,9);ans=a*b;text=a+MU+b;alt=[a+b,a*(b+1),a*(b-1),(a+1)*b,(a-1)*b]}
  else if(t===4){var big=kind==='div'&&tier>=5;b=ri(r,2,big?12:9);q=ri(r,2,big?12:9);a=b*q;ans=q;text=a+DV+b;alt=[q+1,q-1,b,a-b>0&&a-b<30?a-b:q+2]}
  else if(t===5){k=r();
    if(k<.45){a=ri(r,11,39);b=ri(r,2,9);ans=a*b;text=a+MU+b;alt=[ans+b,ans-b,ans+10,ans-10,Math.floor(a/10)*10*b+(a%10)*b%10]}
    else if(k<.75){a=ri(r,2,15);b=ri(r,1,9);c=ri(r,2,9);
      if(r()<.5){ans=(a+b)*c;text='('+a+'+'+b+')'+MU+c;alt=[a+b*c,(a+b)*c+c,(a+b)*c-c]}
      else{if(a<=b)a=b+ri(r,1,6);ans=(a-b)*c;text='('+a+MI+b+')'+MU+c;alt=[a-b*c,(a-b)*c+c,(a-b)*c-c]}}
    else{a=ri(r,2,9);b=ri(r,2,9);c=ri(r,2,19);
      if(r()<.6){ans=a*b+c;text=a+MU+b+'+'+c;alt=[a*(b+c),ans+a,ans-a]}
      else{if(c>a*b)c=ri(r,1,a*b);ans=a*b-c;text=a+MU+b+MI+c;alt=[a*(b-c),ans+a,ans+2*c]}}}
  else{k=r();

  ev.forEach(function(e){var r,col;
    switch(e.type){
    case'cur':var id=e.it?e.it.id:-1;if(id!==curId){curId=id;setKeys(e.it)}break;
    case'ok':r=itemRect(e.it);col=CHALK[TH][e.it.prob.tier-1];dust(r.x+PAD*.5,r.y+r.h*.2,r.w-PAD,r.h*.6,24+Math.floor(Math.random()*7),col);
      FX.push({k:'g',im:r.im,x:r.x,y:r.y,t:0,d:.3});ftxt('+'+e.pts,r.x+r.w/2,r.y,HL[TH],16+Math.min(10,e.mult*2));
      sfx('ok',Math.floor(G.combo/5));flashKey(e.idx,'ok');
      if(G.answered>=G.tut&&!$('#hint').hidden){$('#hint').hidden=true;LS.set('tut',1)}checkAch();break;
    case'wrong':e.it.sh=.35;flashKey(e.idx,'bad');var kg=$('#kg');kg.classList.remove('shk');void kg.offsetWidth;kg.classList.add('shk');
      sfx('wrong');vib(60);loseLife();flash=.35;break;
    case'miss':r=itemRect(e.it);shatter(r);sfx('miss');vib([40,40,40]);loseLife();flash=.5;break;
    case'gain':sfx('gain');ftxt('+1 粉筆',BR.x+BR.w/2,BR.y+BR.h*.55,'#9be39b',22,1.3);hudC.lives=-1;break;
    case'mult':sfx('mult');ftxt('連擊 ×'+e.mult.toFixed(1),BR.x+BR.w/2,BR.y+BR.h*.42,['','','#7fd3ff','#7fd3ff','#ff8fc8','#ff8fc8','#ffd75e'][Math.round(e.mult*2)-2]||'#ffd75e',26,1.1);
      var cb=$('#cb');cb.classList.add('pop');setTimeout(function(){cb.classList.remove('pop')},160);break;
    case'tier':banner={s:'第 '+e.tier+' 節課',sub:G.kind?(G.kind==='mul'?'乘法練習':'除法練習')+' · 加速':TOPIC[e.tier-1],t:0};sfx('tier');break;
    case'over':sfx('over');overT=1.1;setKeys(null);break;}
  });
}
function flashKey(i,c){var b=keyEls[i];if(!b)return;b.classList.add(c);setTimeout(function(){b.classList.remove(c)},c==='ok'?140:260)}
function loseLife(){if(G.mode==='sprint')return;var ic=$('#lv').children[G.lives];if(ic){ic.classList.remove('brk');void ic.offsetWidth;ic.classList.add('brk')}}
function shatter(r){var n=3+Math.floor(Math.random()*3),sw=r.w/n;for(var i=0;i<n;i++)FX.push({k:'s',im:r.im,sx:i*sw,sw:sw,x:r.x+i*sw,y:r.y,vx:(Math.random()-.5)*140+(i-n/2)*30,vy:-120-Math.random()*120,a:0,va:(Math.random()-.5)*8,t:0,d:1.1});
  dust(r.x,r.y,r.w,r.h,18,TH==='dark'?'#ff9b8a':'#e03131',80)}
function checkAch(){if(!G)return;var g=G,m=G.modeName;
  if(g.maxCombo>=20)unlock('c20');if(g.maxCombo>=50)unlock('c50');if(g.answered>=100)unlock('q100');if(g.answered>=30&&g.allRight)unlock('p30');
  if(g.mode!=='sprint'){if(g.score>=5000)unlock('s5k');if(g.score>=10000)unlock('s10k')}if(g.tier>=6&&!g.kind)unlock('t6');
  if(g.over){if(m==='sprint'&&g.answered>=40)unlock('sp40');if(m==='daily')unlock('day')}}
function unlock(id){if(ACHS[id])return;ACHS[id]=Date.now();LS.set('ach',ACHS);var a=ACH.filter(function(x){return x[0]===id})[0];toast('獲得成就：'+a[1]);sfx('gain')}
var toastT=0;function toast(s){var t=$('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(function(){t.style.opacity=0},1800)}

function updHud(){
  var g=G,sp=g.mode==='sprint',v;
  v=sp?g.answered:g.score;if(hudC.s!==v){hudC.s=v;$('#sVal').textContent=v;$('#sLab').textContent=sp?'答對':'分數'}
  v=multFor(g.combo);if(hudC.m!==v||hudC.c!==g.combo){hudC.m=v;hudC.c=g.combo;var cb=$('#cb');cb.textContent='×'+(v%1?v.toFixed(1):v);cb.classList.toggle('hot',v>=2)}
  if(sp){v=Math.ceil(g.timeLeft);if(hudC.tm!==v){hudC.tm=v;var tm=$('#tm');if(tm){tm.textContent=v+' 秒';tm.style.color=v<=10?'var(--bad)':''}}}
  else if(hudC.lives!==g.lives){hudC.lives=g.lives;Array.prototype.forEach.call($('#lv').children,function(c,i){c.classList.toggle('on',i<g.lives)})}
  if(hudC.t!==g.tier){hudC.t=g.tier;$('#dT').textContent=g.tier+'/6'}
  v=Math.round(Math.max(0,Math.min(1,(9-fallTime(g.answered))/(9-2.2)))*100);if(hudC.sp!==v){hudC.sp=v;$('#sbar').style.width=Math.max(6,v)+'%'}
}

/* ---------- render ---------- */
function roughRect(x,y,w,h,j,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  for(var p=0;p<2;p++){ctx.globalAlpha=p?.45:.95;var o=p*1.3;ctx.beginPath();ctx.moveTo(x+j[0]-o,y+j[1]);ctx.lineTo(x+w+j[2],y+j[3]+o);ctx.lineTo(x+w+j[4]+o,y+h+j[5]);ctx.lineTo(x+j[6],y+h+j[7]-o);ctx.closePath();ctx.stroke()}ctx.globalAlpha=1}
var ATTR=[],attrT=0,attrR=mulberry32(7);
function drawItems(list,cur,time){
  for(var i=0;i<list.length;i++){var it=list[i],r=itemRect(it),dx=0;
    if(!it.j){it.j=[];for(var k=0;k<8;k++)it.j.push((Math.random()-.5)*5)}
    if(it.sh>0){dx=Math.sin(time*70)*7*it.sh/.35}
    if(it===cur&&it.p>.72)dx+=Math.sin(time*40)*2*(it.p-.72)/.28;
    if(it===cur){if(TH==='light'){ctx.fillStyle='rgba(255,212,59,.45)';ctx.fillRect(r.x+dx+3,r.y+4,r.w-6,r.h-8)}
      roughRect(r.x+dx,r.y,r.w,r.h,it.j,it.sh>0?'#ff7a6b':HL[TH],TH==='dark'?2.6:3)}
    ctx.globalAlpha=cur&&it!==cur?.78:1;ctx.drawImage(it.im||r.im.c,r.x+dx,r.y,r.w,r.h);ctx.globalAlpha=1}
}
function draw(time,dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);if(bgC)ctx.drawImage(bgC,0,0,W,H);
  var b=BR;ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
  if(scene==='play'&&G){
    if(banner&&scene==='play'){banner.t+=dt;var bt=banner.t,al=bt<1.8?1:Math.max(0,1-(bt-1.8)/.6);if(al<=0)banner=null;else{
    var bi=chalkImg(banner.s,TH==='dark'?'#ffe066':'#f08c00',Math.round(FS*.95)),rev=Math.min(1,bt/.6),bx=b.x+b.w/2-bi.w/2,by=b.y+b.h*.16;ctx.globalAlpha=al*.9;
    ctx.drawImage(bi.c,0,0,bi.c.width*rev,bi.c.height,bx,by,bi.w*rev,bi.h);
    if(bt>.4){var si=chalkImg(banner.sub,TH==='dark'?'#f6f3e8':'#56626e',Math.round(FS*.55));ctx.globalAlpha=al*Math.min(1,(bt-.4)/.3);ctx.drawImage(si.c,b.x+b.w/2-si.w/2,by+bi.h-4,si.w,si.h)}ctx.globalAlpha=1}}
    drawItems(G.items,G.cur,time);
    if(G.combo>=3){ctx.font='700 15px '+MONO;ctx.textAlign='right';ctx.fillStyle=TH==='dark'?'rgba(255,255,255,.35)':'rgba(30,40,60,.35)';ctx.fillText('連擊 '+G.combo,b.x+b.w-10,b.y+b.h-14)}
  }else{
    attrT-=dt;if(attrT<=0){attrT=1.6;var p=genProblem(1+Math.floor(attrR()*5),attrR,false);ATTR.push({p:0,x:.15+attrR()*.7,prob:p,opts:[]})}
    ATTR.forEach(function(a){a.p+=dt/9});ATTR=ATTR.filter(function(a){return a.p<1.05});ctx.globalAlpha=.55;drawItems(ATTR,null,time);ctx.globalAlpha=1}
  for(var i=FX.length-1;i>=0;i--){var f=FX[i];f.t+=dt;if(f.t>=f.d){FX.splice(i,1);continue}var q=f.t/f.d;
    if(f.k==='d'){f.vy+=260*dt;f.vx*=.97;f.x+=f.vx*dt;f.y+=f.vy*dt;ctx.globalAlpha=(1-q)*.85;ctx.fillStyle=f.c;ctx.fillRect(f.x,f.y,f.s,f.s)}
    else if(f.k==='g'){ctx.globalAlpha=(1-q)*.7;ctx.drawImage(f.im.c,f.x+q*60,f.y-q*6,f.im.w*(1+q*.4),f.im.h*(1-q*.3))}
    else if(f.k==='s'){f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.a+=f.va*dt;ctx.globalAlpha=1-q*q;ctx.save();ctx.translate(f.x+f.sw/2,f.y+f.im.h/2);ctx.rotate(f.a);
      ctx.drawImage(f.im.c,f.sx*DPR,0,f.sw*DPR,f.im.c.height,-f.sw/2,-f.im.h/2,f.sw,f.im.h);ctx.restore()}
    else if(f.k==='t'){ctx.globalAlpha=q<.7?1:(1-q)/.3;ctx.font='800 '+f.z+'px '+MONO;ctx.textAlign='center';ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y-q*40)}}
  ctx.globalAlpha=1;
  if(flash>0){flash-=dt;var vg=ctx.createRadialGradient(b.x+b.w/2,b.y+b.h/2,Math.min(b.w,b.h)*.3,b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h)*.75);
    vg.addColorStop(0,'rgba(255,60,40,0)');vg.addColorStop(1,'rgba(255,60,40,'+(Math.max(0,flash)*.7)+')');ctx.fillStyle=vg;ctx.fillRect(b.x,b.y,b.w,b.h)}
  ctx.restore();
  if(scene==='play'&&G){var m=multFor(G.combo);if(m>=2){var gc=m>=4?'255,215,94':m>=3?'255,143,200':'127,211,255',pu=.55+.35*Math.sin(time*5);
    ctx.save();ctx.shadowColor='rgba('+gc+',1)';ctx.shadowBlur=m>=4?26:18;ctx.strokeStyle='rgba('+gc+','+pu+')';ctx.lineWidth=m>=4?4:3;ctx.strokeRect(b.x-1,b.y-1,b.w+2,b.h+2);ctx.restore()}}
}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;var time=now/1000;
  if(scene==='play'&&G&&!paused){
    if(!G.over){step(G,dt);drain()}
    G.items.forEach(function(it){if(it.sh>0)it.sh-=dt});
    updHud();
    if(G.over&&overT>0){overT-=dt;if(overT<=0)showResult()}
  }
  draw(time,paused?0:dt);requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
function pause(on){if(scene!=='play'||!G||G.over)return;paused=on;show('#pause',on)}
function fmtBest(){
  var d=BEST.daily&&BEST.daily.d===today()?BEST.daily.s:null;
  $('#bC').textContent='最高分 '+(BEST.classic||0);$('#bS').textContent=BEST.sprint?'最佳 '+BEST.sprint+' 題':'不扣粉筆';
  $('#bD').textContent=d!=null?'今日 '+d+' 分':'今日題目';$('#bM').textContent=BEST.mul?'最高 '+BEST.mul:'只出乘法';$('#bV').textContent=BEST.div?'最高 '+BEST.div:'只出除法';
  $('#achN').textContent=Object.keys(ACHS).length+'/'+ACH.length;
}
function toMenu(){G=null;paused=false;setScene('menu');['#pause','#result','#settings','#achv'].forEach(function(q){show(q,false)});$('#hint').hidden=true;fmtBest();show('#menu',true)}
function showResult(){
  var g=G,m=g.modeName,sp=m==='sprint',val=sp?g.answered:g.score,isNew=false;checkAch();
  if(m==='daily'){var d=today();if(!BEST.daily||BEST.daily.d!==d||val>BEST.daily.s){BEST.daily={d:d,s:val};isNew=true}}
  else if(val>(BEST[m]||0)){BEST[m]=val;isNew=val>0}
  LS.set('best',BEST);
  STATS.games++;STATS.correct+=g.answered;STATS.wrong+=g.wrongN;STATS.miss+=g.missN;STATS.rs+=g.rs;STATS.rn+=g.rn;LS.set('stats',STATS);
  $('#rT').textContent=sp?'時間到！':m==='daily'?'今日挑戰完成':'下課！';$('#rLab').textContent=sp?'答對題數':'分數';
  $('#rScore').textContent=val;$('#rNew').innerHTML=isNew?'<span class="nb">新紀錄！</span>':'';
  $('#rCombo').textContent=g.maxCombo;$('#rN').textContent=g.answered;var tot=g.answered+g.wrongN+g.missN;
  $('#rAcc').textContent=(tot?Math.round(g.answered/tot*100):0)+'%';$('#rRt').textContent=g.rn?(g.rs/g.rn).toFixed(2)+'s':'—';
  var bk=$('#rBook'),seen={};bk.innerHTML='';g.book.filter(function(e){var k=e.text+'|'+e.pick;if(seen[k])return false;return seen[k]=1}).slice(-12).forEach(function(e){var dv=document.createElement('div');
    dv.innerHTML=e.text+' = <span class="o">'+String(e.ans).replace('-',MI)+'</span>'+(e.pick==null?' <span class="x">（觸底）</span>':' <span class="x">（選 '+String(e.pick).replace('-',MI)+'）</span>');bk.appendChild(dv)});
  $('#rBookW').hidden=!g.book.length;$('#rShareBox').innerHTML='';show('#result',true);
}
function shareText(){var g=G;if(!g)return'';var m=g.modeName;
  return m==='sprint'?'我在粉筆心算 60 秒衝刺答對 '+g.answered+' 題、最高連擊 '+g.maxCombo+'！':
    m==='daily'?'粉筆心算每日挑戰 '+today()+'：'+g.score+' 分、最高連擊 '+g.maxCombo+'！':'我在粉筆心算拿到 '+g.score+' 分、最高連擊 '+g.maxCombo+'！'}
function share(){var t=shareText();
  function fb(){var ok=false;try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}
    if(ok)toast('已複製成績到剪貼簿');else{$('#rShareBox').innerHTML='<div class="sharebox"></div>';$('#rShareBox .sharebox').textContent=t;toast('請長按文字複製')}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('已複製成績到剪貼簿')},fb);else fb()}catch(e){fb()}}
function renderSet(){document.querySelectorAll('.sw[data-k]').forEach(function(s){s.setAttribute('aria-checked',!!S[s.dataset.k])});
  document.querySelectorAll('#thSeg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.th===S.theme)});
  var acc=STATS.correct+STATS.wrong+STATS.miss;$('#sStat').textContent='累計 '+STATS.games+' 局．答對 '+STATS.correct+' 題．正確率 '+(acc?Math.round(STATS.correct/acc*100):0)+'%．平均反應 '+(STATS.rn?(STATS.rs/STATS.rn).toFixed(2):'—')+' 秒';
  $('#muteIco').innerHTML=S.sound?'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/>':'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'}
function renderAch(){var g=$('#achG');g.innerHTML='';ACH.forEach(function(a){var d=document.createElement('div');if(ACHS[a[0]])d.className='got';
  d.innerHTML='<div class="bd">'+a[3]+'</div>'+a[1]+'<small>'+a[2]+'</small>';g.appendChild(d)})}
function saveS(){LS.set('settings',S)}

document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){startGame(b.dataset.mode)})});
$('#bPause').addEventListener('click',function(){pause(true)});$('#pGo').addEventListener('click',function(){pause(false)});
$('#pRe').addEventListener('click',function(){startGame(G.modeName)});$('#pMenu').addEventListener('click',toMenu);
$('#rAgain').addEventListener('click',function(){startGame(G.modeName)});$('#rMenu').addEventListener('click',toMenu);$('#rShare').addEventListener('click',share);
$('#bMute').addEventListener('click',function(){S.sound=!S.sound;saveS();renderSet();if(S.sound)sfx('tap')});
$('#bSet').addEventListener('click',function(){renderSet();show('#settings',true)});$('#sOk').addEventListener('click',function(){show('#settings',false)});
$('#bAch').addEventListener('click',function(){renderAch();show('#achv',true)});$('#aOk').addEventListener('click',function(){show('#achv',false)});
$('#sTut').addEventListener('click',function(){LS.set('tut',0);toast('下一局經典模式會再播放教學')});
document.querySelectorAll('.sw[data-k]').forEach(function(s){s.addEventListener('click',function(){S[s.dataset.k]=!S[s.dataset.k];saveS();renderSet();if(s.dataset.k==='sound'&&S.sound)sfx('tap')})});
document.querySelectorAll('#thSeg button').forEach(function(b){b.addEventListener('click',function(){S.theme=b.dataset.th;saveS();applyTheme();renderSet()})});
addEventListener('keydown',function(e){
  if(scene==='play'&&G&&!G.over){if(e.code==='Space'||e.key==='Escape'){e.preventDefault();pause(!paused);return}
    var n=parseInt(e.key,10);if(n>=1&&n<=keyEls.length&&!paused){e.preventDefault();var b=keyEls[n-1];press(n-1)}}
  else if(e.key==='Enter'&&!$('#result').hidden)startGame(G.modeName);
});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause(true);last=performance.now()});
addEventListener('resize',function(){resize()});
window.__game={state:function(){var g=G;return{scene:scene,paused:paused,over:g?g.over:null,result:!$('#result').hidden,score:g&&g.score,answered:g&&g.answered,lives:g&&g.lives,tier:g&&g.tier,
  simul:g&&simulFor(g.score),T:g&&g.T,items:g?g.items.length:0,lock:g?g.lock:0,cur:g&&g.cur?{id:g.cur.id,ans:g.cur.prob.ans,text:g.cur.prob.text,opts:g.cur.opts.slice(),p:g.cur.p}:null}}};
applyTheme();renderSet();fmtBest();resize();requestAnimationFrame(frame);
</script>
</body>
